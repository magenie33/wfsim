# THE DATABASES FOR THE STEPS AFTER THIS ONE — docs/BOARD.md §"Postgres".
# It opens a Cloudflare Access TCP tunnel to the server's Postgres and sets
# PG_URL for the library and PG_ACCOUNTS_URL for the accounts — each only when
# the job passes its URL — which every script that reads or writes that
# database obeys (scripts/db.sh, scripts/db.mjs). Once a job: a second use sees
# the tunnel open and returns.
name: databases
description: Postgres through a Cloudflare Access tunnel
inputs:
  access_client_id:
    description: secrets.CF_ACCESS_CLIENT_ID — the Access service token pg.wfsim.app admits
    required: true
  access_client_secret:
    description: secrets.CF_ACCESS_CLIENT_SECRET
    required: true
  pg_url:
    description: secrets.PG_PIPELINE_URL — postgres://wfsim_pipeline:<password>@127.0.0.1:15432/wfsim
    required: false
    default: ""
  pg_accounts_url:
    description: secrets.PG_ACCOUNTS_PIPELINE_URL — postgres://wfsim_accounts_pipeline:<password>@127.0.0.1:15432/wfsim_accounts
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: open the tunnel to Postgres
      if: env.WFSIM_PG_TUNNEL == ''
      shell: bash
      env:
        TUNNEL_SERVICE_TOKEN_ID: ${{ inputs.access_client_id }}
        TUNNEL_SERVICE_TOKEN_SECRET: ${{ inputs.access_client_secret }}
        LIBRARY_URL: ${{ inputs.pg_url }}
        ACCOUNTS_URL: ${{ inputs.pg_accounts_url }}
      run: |
        set -euo pipefail
        # MISSING CREDENTIALS FAIL LOUDLY: a job that reads the library without
        # them would otherwise read it as empty and publish that.
        missing=""
        [ -n "$TUNNEL_SERVICE_TOKEN_ID" ] && [ -n "$TUNNEL_SERVICE_TOKEN_SECRET" ] || missing="CF_ACCESS_CLIENT_ID/SECRET"
        [ -n "$LIBRARY_URL" ] || [ -n "$ACCOUNTS_URL" ] || missing="$missing PG_PIPELINE_URL or PG_ACCOUNTS_PIPELINE_URL"
        [ -z "$missing" ] || { echo "::error::the databases need these, and they are not set: $missing"; exit 1; }
        curl -fsSL --retry 3 -o /tmp/cloudflared \
          https://github.com/cloudflare/cloudflared/releases/download/2025.4.0/cloudflared-linux-amd64
        chmod +x /tmp/cloudflared
        nohup /tmp/cloudflared access tcp --hostname pg.wfsim.app --url 127.0.0.1:15432 > /tmp/cloudflared.log 2>&1 &
        for _ in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/15432) 2>/dev/null && break; sleep 1; done
        (exec 3<>/dev/tcp/127.0.0.1/15432) 2>/dev/null || { cat /tmp/cloudflared.log; echo "::error::the tunnel to Postgres did not open"; exit 1; }
        npm ci --silent --prefix scripts/pg
        echo "WFSIM_PG_TUNNEL=open" >> "$GITHUB_ENV"
        # THE FIRST STATEMENT IS THE PROOF: a tunnel that opens but refuses the
        # role fails here, before any script reads an empty answer.
        prove() {
          echo "::add-mask::$3"
          echo "{\"sql\":\"SELECT count(*) AS n FROM $2\"}" | env "$1=$3" node scripts/pgq.mjs "$4" | jq -e '.success' > /dev/null \
            || { cat /tmp/cloudflared.log; echo "::error::Postgres refused $1's role"; exit 1; }
          echo "$1=$3" >> "$GITHUB_ENV"
        }
        [ -z "$LIBRARY_URL" ] || prove PG_URL builds "$LIBRARY_URL" library
        [ -z "$ACCOUNTS_URL" ] || prove PG_ACCOUNTS_URL devices "$ACCOUNTS_URL" accounts
