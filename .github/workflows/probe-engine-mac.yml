# THROWAWAY: is the x86_64 Mac slice's one failed check Rosetta, or the build? Never merged.
name: probe-engine-mac
on:
  push:
    branches: [mac-engine-probe]
permissions:
  contents: read
  actions: read
jobs:
  x86:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 700bc121d0bca9da5f6e0c1ed759bf2a9daf5622
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-built
          path: ${{ runner.temp }}/built
          run-id: 39195272521
          github-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.1"
          targets: x86_64-apple-darwin
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
      - run: |
          set -uo pipefail
          uname -m; sysctl -n machdep.cpu.brand_string
          built="$RUNNER_TEMP/built/site"; wasm=$(jq -r '.wasm' "$built/release.json"); ref="$RUNNER_TEMP/ref"; mkdir -p "$ref"
          cp "$built/pkg/wfsim_wasm.$wasm.js" "$ref/wfsim_wasm.js"; cp "$built/pkg/wfsim_wasm_bg.$wasm.wasm" "$ref/wfsim_wasm_bg.wasm"
          for p in $(jq -r '.packs[]' "$built/release.json"); do cp "$built/pkg/$p" "$ref/"; done
          [ "$(uname -m)" = arm64 ] && softwareupdate --install-rosetta --agree-to-license
          cargo build --release --locked -p wfsim-cli --bin wfsim-gas --target x86_64-apple-darwin
          bin="$PWD/target/x86_64-apple-darwin/release/wfsim-gas"
          run=""; [ "$(uname -m)" = arm64 ] && run="arch -x86_64"
          for i in 1 2 3; do
            echo "== pass $i"
            $run "$bin" tests/gas/rows.json 0.1 1 check | jq -c '{key, same, gas, work, score}'
          done
          printf '#!/bin/sh\nexec %s %s "$@"\n' "$run" "$bin" > gas.sh; chmod +x gas.sh
          node scripts/check_gas.mjs native="$PWD/gas.sh" pkg="$ref" | grep -E "FAIL|passed|failed"
