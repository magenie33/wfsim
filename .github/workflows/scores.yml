# WHAT IS OWED IS MEASURED. NOTHING HERE PUBLISHES ANYTHING.
#
# The pipeline is five tables and this file drives one hop of it:
#
#   inbox   what a player sent, verbatim   ─┐ queue.yml, hourly
#   builds  the library, one row a build    │
#   queue   what is owed                   ─┘
#   scores  the facts                      ─── this file, hourly at :30
#   board   the published files            ─── publish.yml, every four hours
#
# NAMED FOR WHERE IT ENDS, like the other two. It empties the queue into
# `scores` and stops; whether that reaches a reader is the publisher's clock,
# not this one's.
#
# IT TAKES NO INPUT, whoever starts it. What a run does is decided by what
# `queue` holds and in what order — `batches.at` — so jumping the line is an
# UPDATE against the database rather than a flag here, and a hand-started run
# and a scheduled one are the same run. A push does not wake it: measured over
# 95 runs, 21 of 22 pushed runs were cancelled by the next push.
#
# A CODE CHANGE DOES NOT REACH THE BOARD ON ITS OWN. A stored score is reused
# because it EXISTS: no clock, no fingerprint and no binary in the key. What
# asks for a row again is a QUEUE row somebody wrote — docs/BOARD.md.
#
# Scoring is embarrassingly parallel — every row is an independent fight — so it
# splits as many ways as the work needs and each shard takes its slice of one
# ordered list. What that can and cannot buy is measured in docs/BOARD.md
# §"Two ceilings, and neither is the shard count".
name: scores

on:
  schedule:
  # EVERY HOUR, AT :30 — half an hour after `queue.yml` fills the list, so a run
  # reads a queue that already holds this hour's arrivals.
  #
  # AN HOUR THAT DOES NOT FINISH LOSES NOTHING, and that is the property the
  # cadence rests on rather than on any run being long enough. A queue row is
  # deleted in exactly one place — beside the fact that settles it, after the
  # score is banked — so a row this run did not reach, did not take, or was
  # killed halfway through is still owed when the next hour reads the list.
  # Convergence is a question about the WORK, and the answer to it is however
  # many hours it takes; it is not a question this clock has to answer.
  #
  # SO A CANCELLED TICK COSTS A TICK, NEVER A ROW. GitHub keeps one run pending
  # per concurrency group and cancels a second, which under a deep queue is a
  # wasted wake-up and nothing else — the rows it would have taken are the rows
  # the next one takes. The budget still bounds a run at about forty minutes
  # whatever the depth, so that is the uncommon case rather than the usual one.
  #
  # AND IT COSTS ALMOST NOTHING WHEN THERE IS NOTHING TO DO. The gate walks the
  # queue and answers `todo=0`, which skips the fan-out entirely: an idle hour
  # is one job, not thirty-two.
  #
  # WHAT THE HOUR IS *NOT* BOUNDED BY: this repository is public, so Actions
  # minutes are unlimited, and the database meters nothing. The CPU is the
  # bound.
  - cron: "30 * * * *"
  #
  # A PERSON CAN ALSO PRESS IT, and it is the same run: no input, no flag, no
  # difference in behaviour. What a run does is decided by what `queue` holds
  # and in what order.
  workflow_dispatch:
# ONE SCORER AT A TIME, WHOEVER STARTED IT. The schedule and the button used to
# be separate groups so a long manual rescore could not stand the schedule down
# — but a manual run and a scheduled one are now the same run, taking the same
# rows off the front of the same queue, so letting them overlap is two machines
# computing one set of rows.
#
# `cancel-in-progress: false`, because a scorer killed midway loses the fights
# it had in flight. A tick that arrives while one is working waits, and if a
# third arrives the waiting one is dropped — which costs a wake-up and no work,
# since the rows are still owed.
concurrency:
  group: board-scores
  cancel-in-progress: false

env:
  # THE CEILING ON THE SPLIT, and the only thing about it that is a constant.
  # How many shards a run actually takes is COMPUTED from the work it is about
  # to do — see the `shards` step — because rows differ by 79x and a count
  # cannot tell a two-hour slice from a two-minute one.
  #
  # ABOVE `max-parallel`, on purpose: a runner that finishes its slice picks up
  # the next one, which is what keeps the last wave short when a few rows are
  # very expensive. Bounded because each shard pays ~2.6 minutes of startup
  # before it scores anything, and one 121-minute row is a floor no split goes
  # under whatever this says: docs/BOARD.md §"Two ceilings".
  MAX_SHARDS: 64

  # HOW MANY NEVER-SCORED ROWS A RUN MAY TAKE ON. A ceiling, not a plan: the
  # CLOCK below is what actually stops a run, and this only keeps one from
  # walking the whole library when the clock has room for it.
  #
  # IT WAS 150 AND THAT WAS THE BOTTLENECK. Most new rows are SCREENED — a
  # hundred runs to confirm a build cannot reach half its group leader — which
  # is cheap, so a run finished in six minutes against a twelve-minute
  # deadline and absorbed thirty rows against a backlog of 1,758. Seventeen
  # hours to catch up on work the machine had already been given time for.
  NEW_ROWS: 3000
  # HOW LONG A SHARD MAY WORK, and it is the ONE number here that is a choice
  # rather than a measurement: "how long is a run". The shard count is COMPUTED
  # from it and the work, and it is SHARED OUT across the rulers — the binary
  # runs once each, so handing every one the whole figure made a shard take
  # three times as long as this says, and a run longer than the cadence is a
  # tick cancelled every hour.
  #
  # A HEALTHY RUN NEVER REACHES IT. Every row is priced from what whoever last
  # measured it paid, so the split is sized to finish inside this; the clock is
  # the error bar on that estimate, and a run that hits it is a finding rather
  # than a number to raise. What a run does not reach stays owed.
  SCORE_DEADLINE_MINUTES: 30
  # A RUN TAKES WHAT IS PAST ITS DEADLINE (docs/BOARD.md §"The fact factory"):
  # it claims those questions from the factory before it reads, so no row goes
  # to both it and a client, and the last job releases what it left.
  CLAIMED: "1"
  # THE FACTORY IS REACHED AT workers.dev, outside the wfsim.app zone: a zone
  # bot setting challenges datacenter IPs, a runner's among them, and a free-plan
  # rule cannot exempt a path — the challenge answers 403 and the run fails.
  FACTORY_ORIGIN: https://wfsim.mgnmz1999.workers.dev

jobs:
  # ---- 1. what is there to score ----------------------------------------
  #
  # The KV read is its own job so the eight scorers do not each pay 3m43s for
  # the same list — and so they are all handed the SAME file, which is what
  # makes "shard by index" a split they agree on without talking.
  submissions:
    runs-on: ubuntu-latest
    # Scoring reads already admitted work independently of intake and inventory.
    timeout-minutes: 105
    outputs:
      wired: ${{ steps.wired.outputs.yes }}
      shards: ${{ steps.shards.outputs.list }}
      shard_count: ${{ steps.shards.outputs.count }}
      work: ${{ steps.work.outputs.yes }}
      byruler: ${{ steps.work.outputs.byruler }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"

      # NOT CONFIGURED YET IS NOT A FAILURE. Without the credentials there is
      # nothing to read, and a job that fails for a reason nobody is acting on
      # trains you to ignore the one that matters.
      - name: is the board wired up?
        id: wired
        env:
          PG_PIPELINE_URL: ${{ secrets.PG_PIPELINE_URL }}
        run: |
          if [ -n "$PG_PIPELINE_URL" ]; then echo "yes=true" >> "$GITHUB_OUTPUT";
          else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::board storage not configured — see docs/BOARD.md"; fi

      # THE SCORER, HERE TOO. One build against the shared cache, so the step
      # below can ask it what is left rather than guessing from a hash.
      - uses: actions/cache@v4
        if: steps.wired.outputs.yes == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - if: steps.wired.outputs.yes == 'true'
        run: cargo build --release --bin wfsim-board

      - name: the databases
        if: steps.wired.outputs.yes == 'true'
        uses: ./.github/actions/databases
        with:
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          pg_url: ${{ secrets.PG_PIPELINE_URL }}
      - name: what is owed
        if: steps.wired.outputs.yes == 'true'
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml==6.0.3
          ENGINE=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from build_site_app import engine_id; print(engine_id())")
          ENGINE="$ENGINE" node scripts/fetch_score_inputs.mjs

      - name: keep input diagnostics even when capture fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-input-diagnostics
          path: diagnostics/
          retention-days: 14
          if-no-files-found: ignore

      - name: keep the leased builds for the scorers
        if: steps.wired.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: library
          path: library.json
          retention-days: 1

      # …AND HANDED TO EVERY JOB BELOW, so the database is read ONCE a run.
      - uses: actions/upload-artifact@v4
        if: steps.wired.outputs.yes == 'true'
        with:
          name: facts
          path: facts-known.ndjson
          retention-days: 1
          if-no-files-found: ignore
      # …AND THE SAME QUEUE, WHICH IS THE ORDER. Every shard takes its slice of
      # ONE list, so they agree on who owns which row without talking — and a
      # shard that re-read it would get a different one, because the shards
      # ahead of it are spending rows as they go.
      - uses: actions/upload-artifact@v4
        if: steps.wired.outputs.yes == 'true'
        with:
          name: queue
          path: |
            queue.ndjson
            claimed-calculations.ndjson
          retention-days: 1
          if-no-files-found: ignore
      - name: what is there to score, and what will it cost
        id: work
        if: steps.wired.outputs.yes == 'true'
        run: |
          set -euo pipefail
          # THE SAME BOUNDS THE SCORERS WILL APPLY, or this step answers a
          # question the run is not asking: it would count work the run is not
          # going to do, and the gate below would read it as busy.
          rulers=$(./target/release/wfsim-board --rulers | wc -l)
          SLICE="--new-limit $NEW_ROWS --deadline $(( SCORE_DEADLINE_MINUTES * 60 / rulers ))"
          todo=0 work=0 byruler=""
          # EVERY RULER IN ONE PROCESS (`--each-ruler`), each answer kept apart;
          # a ruler with no answer still reads as work below.
          ./target/release/wfsim-board --each-ruler --dry-run $SLICE --facts-in facts-known.ndjson --queue-in queue.ndjson \
            --log "dry-{id}.txt" < library.json > /dev/null 2>&1 || true
          for id in $(./target/release/wfsim-board --rulers); do
            line=$(grep -o 'dry-run: .*' "dry-$id.txt" 2>/dev/null || echo "dry-run: todo=1 work=0 (no answer)")
            echo "$id: $line"
            n=$(printf '%s' "$line" | grep -o 'todo=[0-9]*' | cut -d= -f2 || echo 1)
            w=$(printf '%s' "$line" | grep -o 'work=[0-9]*' | cut -d= -f2 || echo 0)
            todo=$(( todo + ${n:-1} ))
            work=$(( work + ${w:-0} ))
            byruler="$byruler $id:${w:-0}"
          done
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
          echo "work=$work" >> "$GITHUB_OUTPUT"
          # …AND WHERE IT IS, because the shard's clock is shared out by
          # the same measurement the split is sized from. A backlog sits on
          # ONE ruler for weeks — a rescore names one, a new ruler starts
          # empty — and an even split caps the only ruler with work at its
          # share of the clock while the others return in seconds.
          echo "byruler=$(echo $byruler)" >> "$GITHUB_OUTPUT"
          if [ "$todo" -gt 0 ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            echo "$todo rows to score, about $(( work / 60 )) CPU-minutes of fight"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::every row is measured — nothing to score"
          fi

      # HOW MANY WAYS TO SPLIT IT, computed from the work rather than from which
      # button was pressed.
      #
      #   shards = clamp( ceil(seconds / one shard's budget), 1, min(rows, MAX) )
      #
      # ONE SHARD'S BUDGET IS THE CLOCK IT IS GIVEN, times the rulers it walks:
      # the scoring step runs the binary once per ruler and each gets its own
      # deadline. Sizing to that is what makes the clock a bound the run does not
      # reach — which is why a NAMED rescore can keep the clock and still finish
      # what it named.
      #
      # MEASURED, 2026-09-08: 4,441 rows at 15.9 s average came to 1,177
      # CPU-minutes and the 32 shards were billed 1,178 — the fight IS the run,
      # with startup at 44 s a shard against a 36-minute budget. So there is no
      # overhead to schedule around, and the only thing worth getting right is
      # not asking for more shards than there is work for.
      #
      # NEVER MORE SHARDS THAN ROWS: one row is indivisible, so a shard past the
      # row count pays 2.6 minutes of startup to score nothing.
      - id: shards
        if: steps.wired.outputs.yes == 'true'
        env:
          WORK: ${{ steps.work.outputs.work }}
          TODO: ${{ steps.work.outputs.todo }}
        run: |
          set -euo pipefail
          budget=$(( SCORE_DEADLINE_MINUTES * 60 ))
          n=$(( ( ${WORK:-0} + budget - 1 ) / budget ))
          [ "$n" -lt 1 ] && n=1
          [ "$n" -gt "${TODO:-1}" ] && n=${TODO:-1}
          [ "$n" -gt "$MAX_SHARDS" ] && n=$MAX_SHARDS
          [ "$n" -lt 1 ] && n=1
          echo "$(( ${WORK:-0} / 60 )) CPU-minutes over $n shard(s), $(( budget / 60 )) min each"
          # THE MATRIX AND THE COUNT COME FROM ONE PLACE, and they have to. The
          # scorer is told `--shard i/N` while the matrix is a list, so a list of
          # eight against an N of thirty-two tells eight jobs they are one of
          # thirty-two — and three quarters of the board is silently never
          # scored. Nothing fails; the rows keep their old numbers.
          echo "count=$n" >> "$GITHUB_OUTPUT"
          N=$n python3 -c "import json,os;print('list='+json.dumps(list(range(int(os.environ['N'])))))" >> "$GITHUB_OUTPUT"

  # ---- 2. score, N ways at once -----------------------------------------
  #
  # Each shard simulates the submissions whose INDEX is its own and writes only
  # the scores it computed. It produces no board: a shard's view is a slice, and
  # a slice ranked on its own would be a leaderboard of a third of the field.
  score:
    needs: [submissions]
    if: needs.submissions.outputs.wired == 'true'
      && needs.submissions.outputs.work != 'false'
    runs-on: ubuntu-latest
    # `SCORE_DEADLINE_MINUTES` bounds the FIGHTING; this bounds the job around
    # it, for the same reason the one above is capped.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.submissions.outputs.shards) }}
      # LEAVE THE MACHINE ROOM FOR THE CHECKS. Forty jobs is the account's whole
      # ceiling (docs/BOARD.md §"Two ceilings"), so a rescore that fans out to
      # all of it starves EVERY other workflow — CI queued behind a board run is
      # how a red build went two days unseen. The board is a background job and
      # CI is the one a person is waiting on, so sixteen slots stay free: CI's
      # checks run as eight parallel jobs, beside the hourly settle's four and a
      # second branch's CI. A rescore is longer against hours it already takes.
      max-parallel: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: library
      - name: build the scorer
        run: cargo build --release --bin wfsim-board

      # THE SAME GENERATION EVERY JOB WAS HANDED, as an artifact. Read once
      # in the job above and passed down: thirty-two shards each asking the
      # database for the same rows is thirty-two times the rows read, through
      # one tunnel, for one answer.
      #
      # …AND IT MEANS EVERY SHARD DECIDES FROM THE SAME FACTS, which is what
      # lets them agree on who owns which row without talking to each other.
      - uses: actions/download-artifact@v4
        with:
          name: facts
      # …AND THE SAME QUEUE, WHICH IS THE ORDER. Every shard takes its slice of
      # ONE list, so they agree on who owns which row without talking — and a
      # shard that re-read it would get a different one, because the shards
      # ahead of it are spending rows as they go.
      - uses: actions/download-artifact@v4
        with:
          name: queue

      - name: the databases
        uses: ./.github/actions/databases
        with:
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          pg_url: ${{ secrets.PG_PIPELINE_URL }}
      - name: score this shard of every benchmark
        run: |
          set -euo pipefail
          # SHIPPED WHILE IT WORKS, not after. Scores that reach safety only
          # once a shard has FINISHED and UPLOADED are scores one artifact
          # service timeout can empty — measured, on a whole rescore. A minute
          # is the most a killed shard loses.
          : > facts.ndjson
          # A CLIENT RESULT THIS RUN REPRODUCES IS PAID TO ITS CLIENTS
          # (`order_credit.mjs`), but only of the engine this tree builds: the
          # page's `ENGINE_ID`, by the function that stamps it.
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          ENGINE=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from build_site_app import engine_id; print(engine_id())")
          ( while sleep 60; do
              node scripts/order_credit.mjs facts.ndjson "$ENGINE" claimed-calculations.ndjson || true
            done ) &
          SHIPPER=$!
          # …AND ONCE MORE AT THE END, whatever happened to the loop: `trap`
          # rather than a line after it, so a scorer that exits non-zero still
          # banks what it managed.
          trap 'kill $SHIPPER 2>/dev/null || true; wait $SHIPPER 2>/dev/null || true; node scripts/order_credit.mjs facts.ndjson "$ENGINE" claimed-calculations.ndjson' EXIT
          # THE SAME BOUNDS THE PLAN COUNTED WITH. A shard that took on a
          # different set from the one the split was sized for is a shard doing
          # somebody else's slice.
          # THE BUDGET IS THE SHARD'S, SHARED OUT BY WHERE THE WORK IS. The
          # binary runs once per ruler, so handing each the whole figure
          # makes a shard take as many times as long as there are rulers,
          # and a run longer than the cadence is a tick cancelled every
          # hour. Splitting it EVENLY instead caps a backlog that sits on
          # one ruler at its share of the clock while the other three
          # return in seconds — the same shortfall the other way round. So
          # it is split by the work the plan measured.
          #
          # THE FLOOR IS WHY A SHARD MAY RUN ONE MINUTE PER IDLE RULER LONG.
          # A ruler whose dry-run gave no answer reports no work, so a share
          # with no floor under it hands that one zero seconds and it is never
          # scored again, silently. The overshoot is bounded and the job's own
          # cap absorbs it; the other error has no bottom.
          budget=$(( SCORE_DEADLINE_MINUTES * 60 ))
          total=0
          for kv in $BYRULER; do total=$(( total + ${kv#*:} )); done
          [ "$total" -lt 1 ] && total=1
          for id in $(./target/release/wfsim-board --rulers); do
            w=0
            for kv in $BYRULER; do [ "${kv%%:*}" = "$id" ] && w=${kv#*:}; done
            d=$(( budget * w / total ))
            [ "$d" -lt 60 ] && d=60
            echo "$id: ${d}s of $budget"
            ./target/release/wfsim-board "$id" \
              --new-limit "$NEW_ROWS" --deadline "$d" \
              --facts-in facts-known.ndjson \
              --queue-in queue.ndjson \
              --facts facts.ndjson \
              --measured-by "$ENGINE" \
              --shard "${{ matrix.shard }}/${{ needs.submissions.outputs.shard_count }}" \
              < library.json > /dev/null
          done
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          BYRULER: ${{ needs.submissions.outputs.byruler }}
      - name: retain official results and captured receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-results-${{ matrix.shard }}
          path: |
            facts.ndjson
            facts.ndjson.credited
            claimed-calculations.ndjson
          retention-days: 7
          if-no-files-found: ignore

  # ---- 3. what this run claimed and did not settle goes back ----------------
  #
  # ALWAYS, whatever happened above: a claim nobody releases is a row the
  # clients are not offered until the next run's own release.
  release:
    needs: [submissions, score]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: the databases
        if: needs.submissions.outputs.wired == 'true'
        uses: ./.github/actions/databases
        with:
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          pg_url: ${{ secrets.PG_PIPELINE_URL }}
      - name: release the claim
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/fetch_queue.sh --release
