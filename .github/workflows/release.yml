# Publish the desktop client to a GitHub Release.
#
# WHY THIS EXISTS ALONGSIDE THE NETWORK DRIVE. The Quark link is the download
# for the players this project is mostly for, and it is the right one for them:
# fast, unblocked, and where they already are. This is the other three things a
# network drive cannot do — reach people outside mainland China, keep a history
# of what was released (a share link only ever holds "the latest", so there is
# nothing to fall back to when a build turns out bad), and serve as a third
# update source that does not route through China at all.
#
# MANUALLY TRIGGERED, AND THERE IS NO VERSION TO TYPE. The tag is the date plus
# the commit, which is a fact rather than a decision — the same rule the footer
# stamp and the notes file follow. Two releases on one day differ by their
# commit, so the tag stays unique without anyone counting.
#
# IT DOES NOT REBUILD `site/`. That directory is committed — it is the artefact
# Cloudflare deploys — so the client's payload comes straight out of the
# checkout. A release is one `cargo build`, not the whole wasm pipeline.
#
# LINUX IS HERE BECAUSE WARFRAME RUNS THERE. Digital Extremes ships no Linux
# client ("There is no Mac or Linux support currently available"), but Proton
# runs the game well and a Steam Deck is a Linux desktop — those players can
# play and could not install the calculator. macOS is deliberately absent: with
# no native client and no Proton equivalent, a Mac user cannot play Warframe at
# all, and Gatekeeper plus $99/yr notarisation is a high price for an audience
# that does not exist.
#
# IT IS OPT-IN ALL THE SAME. `release` needs `build`, so one failing leg of the
# matrix publishes NOTHING — the Windows binary is built, checked, uploaded as
# an artifact, and then no release is cut. A platform nobody is waiting for
# must not be able to sink the one they are.
name: Release

on:
  workflow_dispatch:
    inputs:
      linux:
        description: "Also build and publish the Linux AppImage"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Both platforms are built even if one fails, so a Linux problem does not
      # hide whether Windows is fine.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux && '[{"os":"windows-latest","artifact":"WFSim.exe"},{"os":"ubuntu-latest","artifact":"WFSim.AppImage"}]' || '[{"os":"windows-latest","artifact":"WFSim.exe"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri on Linux is WebKitGTK rather than a system webview, so the
      # development headers have to be present to build against.
      - name: Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with mise.toml and ci.yml
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          # The shell is its own workspace; the main one is not built here.
          workspaces: desktop

      # The bundler, for the AppImage. Windows builds with plain cargo — see
      # scripts/build_desktop.py for why the bundler is kept away from it.
      - name: Tauri CLI
        if: matrix.os == 'ubuntu-latest'
        run: cargo install tauri-cli --version "^2" --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the client
        shell: bash
        run: python scripts/build_desktop.py

      # THE BINARY CHECKS ITSELF BEFORE IT IS PUBLISHED. `build_desktop.py`
      # already refuses anything under 20 MB — the shape of a build whose
      # payload was optimised away — but that only rules out the emptiest
      # failure. This runs the app: wasm engine, page render, storage, the
      # board endpoints, the source offer. A release nobody ran is a release
      # nobody has seen fail.
      #
      # On Linux it needs a display, so it runs under a virtual one; there is
      # no window to look at either way, the checks report through the app's
      # own protocol.
      - name: The shipped binary passes its own checks (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: ./dist/WFSim.exe --selftest --reset

      - name: The shipped binary passes its own checks (Linux)
        if: matrix.os == 'ubuntu-latest'
        # APPIMAGE_EXTRACT_AND_RUN because a runner has no FUSE to mount one
        # with; it unpacks to a temporary directory instead, which runs the same
        # binary. xvfb because the app wants a display even though the checks
        # report through its own protocol and nobody looks at the window.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: xvfb-run --auto-servernum ./dist/WFSim.AppImage --selftest --reset

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      # Only one of the two needs to carry these; Windows is the one whose
      # notes file exists.
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: extras
          path: |
            dist/source.zip
            dist/使用说明.txt
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # THE NOTES NAME WHAT THE RELEASE ACTUALLY CARRIES. The Linux leg is
      # opt-in, so a table row or a checksum for an asset that is not attached
      # would be a broken promise in the one place a reader goes to check one.
      # Written to a file rather than inlined below, because that is where the
      # condition can live.
      - name: Collect the release notes
        id: notes
        run: |
          cd artifacts
          echo "tag=$(date -u +%Y-%m-%d)-$(git -C .. rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          cat > notes.md <<'MD'
          **Download one file and run it.** No installer, no unpacking — the
          whole app is inside the executable. It updates itself afterwards, so
          this download is a starting point rather than something to come back
          for.

          | | |
          |---|---|
          | Windows | `WFSim.exe` — double-click |
          MD
          if [ -f WFSim.AppImage ]; then
            echo '| Linux | `WFSim.AppImage` — `chmod +x` it, then double-click |' >> notes.md
          fi
          cat >> notes.md <<'MD'

          Windows shows its blue "protected your PC" notice on first run: this
          build is not code-signed (a certificate costs more per year than a
          free tool justifies). Choose **More info → Run anyway**.
          MD
          if [ -f WFSim.AppImage ]; then
            cat >> notes.md <<'MD'

          The AppImage carries its own WebKitGTK, so no packages are needed. A
          Release asset arrives without the execute bit — that is what the
          `chmod +x` is for, not a quirk of this build.
          MD
          fi
          {
            echo
            echo '```'
            sha256sum WFSim.exe
            if [ -f WFSim.AppImage ]; then sha256sum WFSim.AppImage; fi
            echo '```'
          } >> notes.md
          cat >> notes.md <<'MD'

          `source.zip` is the corresponding source AGPL-3.0 asks to be offered
          alongside the binary. Nothing needs it to run the app.

          Also on Quark (faster inside mainland China):
          https://pan.quark.cn/s/dc8fe9046d6a
          · Web version: https://wfsim.app
          MD

      # `WFSim.AppImage` is listed and may not exist: the action does not fail
      # on an unmatched pattern, so one list serves both shapes of release.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: WFSim ${{ steps.notes.outputs.tag }}
          files: |
            artifacts/WFSim.exe
            artifacts/WFSim.AppImage
            artifacts/source.zip
          body_path: artifacts/notes.md
