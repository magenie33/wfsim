# Publish the desktop client to a GitHub Release.
#
# WHY THIS EXISTS ALONGSIDE THE NETWORK DRIVE. The Quark link is the download
# for the players this project is mostly for, and it is the right one for them:
# fast, unblocked, and where they already are. This is the other three things a
# network drive cannot do — reach people outside mainland China, keep a history
# of what was released (a share link only ever holds "the latest", so there is
# nothing to fall back to when a build turns out bad), and serve as a third
# update source that does not route through China at all.
#
# MANUALLY TRIGGERED, AND THERE IS NO VERSION TO TYPE. The tag is the date plus
# the commit, which is a fact rather than a decision — the same rule the footer
# stamp and the notes file follow. Two releases on one day differ by their
# commit, so the tag stays unique without anyone counting.
#
# IT DOES NOT REBUILD `site/`. That directory is committed — it is the artefact
# Cloudflare deploys — so the client's payload comes straight out of the
# checkout. A release is one `cargo build`, not the whole wasm pipeline.
#
# EVERY DESKTOP WARFRAME RUNS ON. The game ships for macOS on Apple Silicon,
# and Proton runs it on Linux and the Steam Deck. The Mac download is ONE
# universal disk image, Apple Silicon and Intel in one binary, so nobody picks
# the wrong one. It is not notarised (that is $99 a year): it is ad-hoc signed,
# which Apple Silicon requires to run at all, and the release body says how to
# get past Gatekeeper.
#
# MAC AND LINUX ARE OPT-IN ALL THE SAME. `release` needs `build`, so one failing leg of the
# matrix publishes NOTHING — the Windows binary is built, checked, uploaded as
# an artifact, and then no release is cut. A platform nobody is waiting for
# must not be able to sink the one they are.
name: Release

on:
  workflow_dispatch:
    inputs:
      linux:
        description: "Also build and publish the Linux AppImage"
        type: boolean
        default: false
      mac:
        description: "Also build and publish the macOS disk image"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The legs the boxes ask for: Windows always, the others when ticked.
  legs:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.legs.outputs.include }}
    steps:
      - id: legs
        run: |
          legs='{"os":"windows-latest","artifact":"WFSim.exe"}'
          if [ "${{ inputs.linux }}" = "true" ]; then legs="$legs,"'{"os":"ubuntu-latest","artifact":"WFSim.AppImage"}'; fi
          if [ "${{ inputs.mac }}" = "true" ]; then legs="$legs,"'{"os":"macos-latest","artifact":"WFSim.dmg"}'; fi
          echo "include=[$legs]" >> "$GITHUB_OUTPUT"

  build:
    needs: legs
    strategy:
      # Every platform is built even if one fails, so a Linux or Mac problem
      # does not hide whether Windows is fine.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.legs.outputs.include) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri on Linux is WebKitGTK rather than a system webview, so the
      # development headers have to be present to build against.
      - name: Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with mise.toml and ci.yml
          toolchain: "1.97.1"
          # Both slices of the universal Mac binary; ignored elsewhere.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The shell is its own workspace; the main one is not built here.
          workspaces: desktop

      # The bundler, for the AppImage and the disk image. Windows builds with
      # plain cargo — see scripts/build_desktop.py for why the bundler is kept
      # away from it.
      - name: Tauri CLI
        if: matrix.os != 'windows-latest'
        run: cargo install tauri-cli --version "^2" --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the client
        shell: bash
        run: python scripts/build_desktop.py

      # THE BINARY CHECKS ITSELF BEFORE IT IS PUBLISHED. `build_desktop.py`
      # already refuses anything under 20 MB — the shape of a build whose
      # payload was optimised away — but that only rules out the emptiest
      # failure. This runs the app: wasm engine, page render, storage, the
      # board endpoints, the source offer. A release nobody ran is a release
      # nobody has seen fail.
      #
      # On Linux it needs a display, so it runs under a virtual one; there is
      # no window to look at either way, the checks report through the app's
      # own protocol.
      - name: The shipped binary passes its own checks (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: ./dist/WFSim.exe --selftest --reset

      - name: The shipped binary passes its own checks (Linux)
        if: matrix.os == 'ubuntu-latest'
        # APPIMAGE_EXTRACT_AND_RUN because a runner has no FUSE to mount one
        # with; it unpacks to a temporary directory instead, which runs the same
        # binary. xvfb because the app wants a display even though the checks
        # report through its own protocol and nobody looks at the window.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: xvfb-run --auto-servernum ./dist/WFSim.AppImage --selftest --reset

      # BOTH SLICES RUN, not only the one the runner is: the Intel slice under
      # Rosetta, since a slice nobody ran is a download nobody has seen fail.
      - name: The shipped binary passes its own checks (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          ./dist/WFSim.app/Contents/MacOS/wfsim-desktop --selftest --reset
          softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 ./dist/WFSim.app/Contents/MacOS/wfsim-desktop --selftest --reset

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      # THE NOTES FILE IS THE NETWORK DRIVE'S, not a release asset: it says
      # which of two files to download and what SmartScreen will do, and a
      # release page answers both in its own body. Only the source travels.
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: extras
          path: dist/source.zip
          if-no-files-found: error

  release:
    needs: build
    # A RUN ON A BRANCH BUILDS AND CHECKS, AND PUBLISHES NOTHING: that is how a
    # new leg is tried before anyone can download it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # THE NOTES NAME WHAT THE RELEASE ACTUALLY CARRIES. The Linux leg is
      # opt-in, so a table row or a checksum for an asset that is not attached
      # would be a broken promise in the one place a reader goes to check one.
      # Written to a file rather than inlined below, because that is where the
      # condition can live.
      - name: Collect the release notes
        id: notes
        run: |
          cd artifacts
          TAG="$(date -u +%Y-%m-%d)-$(git -C .. rev-parse --short=7 HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # A ZIP, NOT THE BARE EXECUTABLE. Browsers refuse or bury an unsigned
          # `.exe` before the reader ever reaches Windows' own notice, and this
          # build cannot be signed — a certificate costs more per year than a
          # free tool justifies. A zip downloads without an argument. It is also
          # where the version belongs: this page is the HISTORY of what was
          # released, so the asset names which one it is, while the network
          # drive's copy keeps the fixed `WFSim.exe` its share links point at.
          EXE_SHA=$(sha256sum WFSim.exe | cut -d' ' -f1)
          zip -q "WFSim-$TAG.zip" WFSim.exe
          ZIP_SHA=$(sha256sum "WFSim-$TAG.zip" | cut -d' ' -f1)

          cat > notes.md <<'MD'
          **Download one file and run it.** No installer — the whole app is
          inside the executable, unpacked on first run. It updates itself
          afterwards, so this download is a starting point rather than
          something to come back for.

          | | |
          |---|---|
          MD
          echo "| Windows | \`WFSim-$TAG.zip\` — unzip, then double-click \`WFSim.exe\` |" >> notes.md
          if [ -f WFSim.dmg ]; then
            echo '| macOS | `WFSim.dmg` — open it and drag WFSim into Applications; Apple Silicon and Intel alike |' >> notes.md
          fi
          if [ -f WFSim.AppImage ]; then
            echo '| Linux | `WFSim.AppImage` — `chmod +x` it, then double-click |' >> notes.md
          fi
          cat >> notes.md <<'MD'

          Windows shows its blue "protected your PC" notice on first run: this
          build is not code-signed (a certificate costs more per year than a
          free tool justifies). Choose **More info → Run anyway**.
          MD
          if [ -f WFSim.dmg ]; then
            cat >> notes.md <<'MD'

          macOS refuses the first launch, for the same reason: the app is not
          notarised. Open it once, close the notice, then go to **System
          Settings → Privacy & Security** and choose **Open Anyway**. On macOS
          14 and earlier, right-click the app and choose **Open** instead. Or,
          in Terminal: `xattr -dr com.apple.quarantine /Applications/WFSim.app`
          MD
          fi
          if [ -f WFSim.AppImage ]; then
            cat >> notes.md <<'MD'

          The AppImage carries its own WebKitGTK, so no packages are needed. A
          Release asset arrives without the execute bit — that is what the
          `chmod +x` is for, not a quirk of this build.
          MD
          fi
          # HASH FIRST, which is `sha256sum`'s own layout: the names differ in
          # length and the hashes do not, so this is the column that lines up —
          # and it is the form that can be pasted into `sha256sum -c`.
          {
            echo
            echo '```'
            echo "$ZIP_SHA  WFSim-$TAG.zip"
            echo "$EXE_SHA  WFSim.exe (inside it)"
            if [ -f WFSim.dmg ]; then
              sha256sum WFSim.dmg
            fi
            if [ -f WFSim.AppImage ]; then
              sha256sum WFSim.AppImage
            fi
            echo '```'
          } >> notes.md
          cat >> notes.md <<'MD'

          `source.zip` is the corresponding source AGPL-3.0 asks to be offered
          alongside the binary. Nothing needs it to run the app.

          Also on Quark (faster inside mainland China):
          https://pan.quark.cn/s/dc8fe9046d6a
          · Web version: https://wfsim.app
          MD

      # `WFSim.dmg` and `WFSim.AppImage` are listed and may not exist: the
      # action does not fail on an unmatched pattern, so one list serves every
      # shape of release. The
      # bare `WFSim.exe` is deliberately NOT here — it is what the zip holds.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: WFSim ${{ steps.notes.outputs.tag }}
          files: |
            artifacts/WFSim-*.zip
            artifacts/WFSim.dmg
            artifacts/WFSim.AppImage
            artifacts/source.zip
          body_path: artifacts/notes.md
