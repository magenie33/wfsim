# THE BOARD RUNS ITSELF. Nobody commits a leaderboard by hand.
#
# The repo owner never touches this: the bot scores, the bot commits, and
# Cloudflare deploys the push.
#
# THE BUTTON IS THE ONLY TRIGGER, AND THE CLOCK IS HELD. A push does not wake
# the board either: under convergence a pushed run does what the next one does —
# score what is not measured yet, publish what is — so
# it duplicates a run that is coming anyway while competing for the same forty
# slots. Measured over 95 runs: 21 of 22 pushed runs were cancelled by the next
# push, and the board published nothing.
#
# WHY THE CLOCK IS HELD, and what restores it. The slice repairs rows at a rate
# this file sets, and measured against a published board it is not converging:
# over six scheduled publishes, 30 of 10,188 rows changed at all and none by
# more than a fifth — while an engine fix waiting to reach the board moves a
# group_clear row by four times. So the schedule was spending forty slots an
# hour to move nothing, against a full rescore that moves everything and needs
# those slots. RESTORE IT when a scheduled run is measured repairing rows at a
# rate that crosses the board in days, not months — `docs/BOARD.md`
# §"When the code moved" is where that rate is argued.
#
# A CODE CHANGE DOES NOT REACH THE BOARD ON ITS OWN. The score store keys a
# number by what it READ and never by which binary wrote it, so a run reuses
# every score whose data still matches: measured on a scheduled run, 10,348
# reused and 0 scored. `audit.yml` is the only thing that finds a number this
# code no longer computes, and it finds it by MEASURING rather than by asking a
# hash. A full rescore is the button (`full`); `weapon` names rows at any
# precision beside it — docs/BOARD.md §"When the code moved".
#
# Scoring is embarrassingly parallel — every row is an independent fight — so it
# splits `SHARDS` ways and a merge job assembles the board from the scores. What
# that can and cannot buy is measured in docs/BOARD.md §"Two ceilings, and
# neither is the shard count".
name: board

on:
  # AUTOMATIC-UPDATES: HELD
  #
  # That line is read by `scripts/check_rescore_paths.mjs`, which otherwise
  # REQUIRES a schedule: nothing waking the board is the kind of state that
  # goes green everywhere and is discovered by a reader asking why the numbers
  # stopped. Deleting it without restoring the cron fails the check, so the
  # hold cannot outlive somebody's memory of it.
  #
  # HELD, NOT DISABLED — see the header. The trigger is commented out HERE
  # rather than turned off in the repository's settings, because a workflow
  # disabled through the UI is a fact this file does not carry: it survives a
  # checkout, shows up in no diff, and the way it is discovered is somebody
  # asking why the board stopped. Uncommenting is the whole of the restore.
  #
  # ONCE AN HOUR, ON THE HOUR. The cadence has to be longer than a run, and a
  # run is not twenty minutes: measured over 40 scheduled runs, 25 of the 29
  # that published finished inside twenty and the rest took 29, 38, 82 and 102.
  # A cadence shorter than the tail means the queued run is cancelled by the
  # next arrival — GitHub keeps one pending per concurrency group — so two of
  # every three wake-ups did nothing at all and the board still published at
  # whatever rate the long runs allowed.
  #
  # Naming :00 costs nothing: the scheduler slips ~15 minutes whatever minute
  # is named, so an off-the-hour minute buys a precision this does not have.
  #
  # schedule:
  #   - cron: "0 * * * *"
  #
  # NOTHING ELSE RESCORES ON A CLOCK. `audit.yml` reads a slice of the published
  # board every hour and REPORTS a row that is not what this code computes,
  # without rescoring anything and without gating this pipeline — so it keeps
  # running while this is held, and it is what says whether the board is right.
  workflow_dispatch:
    inputs:
      # THE ONE INPUT, AND IT NAMES ROWS. A fingerprint answers "did an INPUT
      # move", so a correction it cannot see leaves a published number nobody can
      # argue the board out of — and an older `measured_by` is NOT such a
      # correction, because an older engine is a reference and not a verdict. Only
      # the audit MEASURING a difference is.
      #
      # IT GOES AS FINE AS THE CASE DEMANDS: a weapon, one of its modes, the riven
      # or the plain half of that mode, or a single row by its key, `;` between
      # several because a mod list is commas. "Every row" is this with a selector
      # that matches everything, which is why there is no second button for it:
      # a wide rescore and a narrow one are the same operation.
      #
      # A SELECTOR THAT MATCHES NOTHING RESCORES NOTHING AND SAYS SO, rather than
      # passing quietly — a misspelled id reads exactly like a run that did the
      # work you asked for.
      weapon:
        description: "rescore these rows whatever the fingerprints say — weapon | weapon#mode | weapon#mode:plain | a whole row key; ';' between several"
        type: string
        default: ""

# THE SCHEDULE AND THE BUTTON KEEP SEPARATE GROUPS. The schedule is what drives
# convergence — every one of its runs repairs a slice — and standing those down
# behind a manual `full` would pause the mechanism the board updates by, which
# is the shape that starved it before.
#
# Splitting is safe because `publish` takes whatever `main` is now, writes the
# generated files on top and retries three times: two runs landing a board is
# last-writer-wins BY DESIGN, the same reasoning that made it refuse to rebase.
concurrency:
  group: board-${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
  cancel-in-progress: false

env:
  # THE CEILING ON THE SPLIT, and the only thing about it that is a constant.
  # How many shards a run actually takes is COMPUTED from the work it is about
  # to do — see the `shards` step — because rows differ by 79x and a count
  # cannot tell a two-hour slice from a two-minute one.
  #
  # ABOVE `max-parallel`, on purpose: a runner that finishes its slice picks up
  # the next one, which is what keeps the last wave short when a few rows are
  # very expensive. Bounded because each shard pays ~2.6 minutes of startup
  # before it scores anything, and one 121-minute row is a floor no split goes
  # under whatever this says: docs/BOARD.md §"Two ceilings".
  MAX_SHARDS: 64

  # HOW MANY NEVER-SCORED ROWS A RUN MAY TAKE ON. A ceiling, not a plan: the
  # CLOCK below is what actually stops a run, and this only keeps one from
  # walking the whole library when the clock has room for it.
  #
  # IT WAS 150 AND THAT WAS THE BOTTLENECK. Most new rows are SCREENED — a
  # hundred runs to confirm a build cannot reach half its group leader — which
  # is cheap, so a run finished in six minutes against a twelve-minute
  # deadline and absorbed thirty rows against a backlog of 1,758. Seventeen
  # hours to catch up on work the machine had already been given time for.
  NEW_ROWS: 3000
  # …AND THE CLOCK BEHIND IT, which is the only bound on a REPAIR. There is no
  # slice and no cursor: a repaired row leaves the stale set, so a run walking
  # it from the top converges, and what a run does not reach keeps the number
  # it has until the next one — the assembly publishes a stale row rather than
  # dropping it, which is what made a wall-clock bound safe here at all.
  SCORE_DEADLINE_MINUTES: 12

jobs:
  # ---- 1. what is there to score ----------------------------------------
  #
  # The KV read is its own job so the eight scorers do not each pay 3m43s for
  # the same list — and so they are all handed the SAME file, which is what
  # makes "shard by index" a split they agree on without talking.
  submissions:
    runs-on: ubuntu-latest
    outputs:
      wired: ${{ steps.wired.outputs.yes }}
      shards: ${{ steps.shards.outputs.list }}
      shard_count: ${{ steps.shards.outputs.count }}
      work: ${{ steps.work.outputs.yes }}
    steps:
      - uses: actions/checkout@v4

      # WHAT A SCORE DEPENDS ON THAT IS NOT THE BUILD, as one hash: the code
      # that simulates, the data it simulates with, and the rulers. `data/`
      # MINUS the boards themselves — those are this job's own output, so
      # including them would move the fingerprint on every run and nothing would
      # ever be reused.
      #
      # A COOLDOWN WOULD HAVE BEEN THE WRONG AXIS:
      # time is not an input to a score. Untouched, a row is valid forever;
      # moved, it is wrong immediately. This asks the only question that matters
      # — "is anything different" — and answers it exactly.
      # NOT CONFIGURED YET IS NOT A FAILURE. Without the KV binding there is
      # nothing to read, and a job that fails hourly for a reason nobody is
      # acting on trains you to ignore the one that matters.
      - name: is the board wired up?
        id: wired
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACCOUNT" ]; then echo "yes=true" >> "$GITHUB_OUTPUT";
          else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::board storage not configured — see docs/BOARD.md"; fi


      # WHAT THE LAST BOARD WAS BUILT FROM, as the floor this run may not fall
      # under. A short read publishes a board built from a short list, and every
      # row missing from it is gone with nothing saying so — `guard_shrink` in
      # the script is what refuses that.
      - name: what the last board was built from
        if: steps.wired.outputs.yes == 'true'
        id: floor
        run: |
          set -euo pipefail
          n=$(grep -h 'submissions:' data/board_state.yaml 2>/dev/null \
                | awk '{print $2}' | sort -n | tail -1 || echo 0)
          n=${n:-0}
          echo "floor=$(( n * 9 / 10 ))" >> "$GITHUB_OUTPUT"
          echo "last board was built from $n submissions"

      # THE LIBRARY, IN ONE QUERY. It was a key listing metered at a thousand
      # operations a DAY plus one request per build, so everything around it
      # existed to avoid paying twice: a cached `library.json`, a pruning pass, a
      # three-try retry, and a flag to skip the listing on a rescore. A database
      # answers it whole, in order, and none of that is needed.
      #
      # A FILE RATHER THAN A BLOCK OF YAML, so the thing tested is the thing that
      # runs: `scripts/fetch_library.sh --self-test` drives it against a stub
      # `curl`, and CI runs that.
      - name: read the library
        if: steps.wired.outputs.yes == 'true'
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          set -euo pipefail
          CF_D1_DATABASE=$(sed 's|^[[:space:]]*//.*$||' wrangler.jsonc \
            | jq -r '.d1_databases[0].database_id // empty')
          export CF_D1_DATABASE
          bash scripts/fetch_library.sh submissions.json

      # THE LIST IS ALSO THE ONLY OFF-SITE COPY OF THE LIBRARY, which is the one
      # irreplaceable thing in this pipeline — the boards are derived from it,
      # the site is generated, the code is in git, and what players sent lives in
      # exactly one database. Thirty days of rolling artifacts costs nothing
      # and is the difference between "restore yesterday's" and "ask everyone to
      # submit again".
      - name: keep the list for the scorers
        if: steps.wired.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: submissions
          path: submissions.json
          retention-days: 30

      # THE SCORER, HERE TOO. One build against the shared cache, so the step
      # below can ask it what is left rather than guessing from a hash.
      - uses: actions/cache@v4
        if: steps.wired.outputs.yes == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - if: steps.wired.outputs.yes == 'true'
        run: cargo build --release --bin wfsim-board

      # IS THERE ANYTHING TO DO — ASKED BY WALKING, NOT BY DECLARING.
      #
      # A run where every row is reusable still fanned out to `SHARDS` jobs and
      # paid a checkout, a build and a cache restore for each, to write the board
      # it already had. `--dry-run` walks the boards exactly as a scoring run
      # does — the same validation, the same row fingerprints, the same reuse —
      # and counts what is left instead of fighting it, so the answer is the
      # SCORER'S OWN. A second opinion computed here could disagree with it, and
      # the direction it would disagree in is a board that quietly stops moving.
      #
      # ANYTHING IT CANNOT ANSWER MEANS WORK: a build that fails to validate, a
      # board that will not parse, a benchmark with no file. Being wrong that way
      # costs one run; being wrong the other way costs a board nobody updates.
      # WHAT THIS GENERATION ALREADY HOLDS. One query, ordered and paged,
      # in place of a directory of files merged by filename order — which is
      # how a whole rescore came to be discarded and then swept away.
      #
      # UNCONFIGURED IS AN EMPTY GENERATION, not a failure: the run then
      # computes everything, which is what it did before there was one.
      - name: read what is already measured
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          CF_D1_DATABASE=$(sed 's|^[[:space:]]*//.*$||' wrangler.jsonc \
            | jq -r '.d1_databases[0].database_id // empty')
          export CF_D1_DATABASE
          bash scripts/fetch_facts.sh facts-known.ndjson


      # …AND HANDED TO EVERY JOB BELOW, so the database is read ONCE a run.
      - uses: actions/upload-artifact@v4
        if: steps.wired.outputs.yes == 'true'
        with:
          name: facts
          path: facts-known.ndjson
          retention-days: 1
          if-no-files-found: ignore
      - name: what is there to score, and what will it cost
        id: work
        if: steps.wired.outputs.yes == 'true'
        run: |
          set -euo pipefail
          # THE SAME FORCING AND THE SAME BOUNDS THE SCORERS WILL APPLY, or this
          # step answers a question the run is not asking: it would count work
          # the run is not going to do, and the gate below would read it as busy.
          FORCE=""
          if [ -n "${{ inputs.weapon }}" ]; then FORCE="--rescore ${{ inputs.weapon }}"; fi
          # A RUN THAT NAMES ROWS IS BOUNDED BY WHAT IT NAMES, so it takes no
          # backlog limit — but it keeps the CLOCK, because the split below is
          # sized so the clock is not reached. Bounding a named run by a count
          # would leave half of what a person asked for undone with nothing
          # saying so.
          SLICE="--deadline $(( SCORE_DEADLINE_MINUTES * 60 ))"
          if [ -z "${{ inputs.weapon }}" ]; then
            SLICE="--new-limit $NEW_ROWS $SLICE"
          fi
          todo=0 work=0
          for f in data/benchmarks/*.yaml; do
            id=$(basename "$f" .yaml)
            line=$(./target/release/wfsim-board "$id" \
                     --dry-run $FORCE $SLICE \
                     --facts-in facts-known.ndjson \
                     < submissions.json 2>&1 >/dev/null \
                   | grep -o 'dry-run: .*' || echo "dry-run: todo=1 work=0 (no answer)")
            echo "$id: $line"
            n=$(printf '%s' "$line" | grep -o 'todo=[0-9]*' | cut -d= -f2 || echo 1)
            w=$(printf '%s' "$line" | grep -o 'work=[0-9]*' | cut -d= -f2 || echo 0)
            todo=$(( todo + ${n:-1} ))
            work=$(( work + ${w:-0} ))
          done
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
          echo "work=$work" >> "$GITHUB_OUTPUT"
          if [ "$todo" -gt 0 ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            echo "$todo rows to score, about $(( work / 60 )) CPU-minutes of fight"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::every row is measured — nothing to score"
          fi

      # HOW MANY WAYS TO SPLIT IT, computed from the work rather than from which
      # button was pressed.
      #
      #   shards = clamp( ceil(seconds / one shard's budget), 1, min(rows, MAX) )
      #
      # ONE SHARD'S BUDGET IS THE CLOCK IT IS GIVEN, times the rulers it walks:
      # the scoring step runs the binary once per ruler and each gets its own
      # deadline. Sizing to that is what makes the clock a bound the run does not
      # reach — which is why a NAMED rescore can keep the clock and still finish
      # what it named.
      #
      # MEASURED, 2026-09-08: 4,441 rows at 15.9 s average came to 1,177
      # CPU-minutes and the 32 shards were billed 1,178 — the fight IS the run,
      # with startup at 44 s a shard against a 36-minute budget. So there is no
      # overhead to schedule around, and the only thing worth getting right is
      # not asking for more shards than there is work for.
      #
      # NEVER MORE SHARDS THAN ROWS: one row is indivisible, so a shard past the
      # row count pays 2.6 minutes of startup to score nothing.
      - id: shards
        if: steps.wired.outputs.yes == 'true'
        env:
          WORK: ${{ steps.work.outputs.work }}
          TODO: ${{ steps.work.outputs.todo }}
        run: |
          set -euo pipefail
          rulers=$(ls data/benchmarks/*.yaml | wc -l)
          budget=$(( SCORE_DEADLINE_MINUTES * 60 * rulers ))
          n=$(( ( ${WORK:-0} + budget - 1 ) / budget ))
          [ "$n" -lt 1 ] && n=1
          [ "$n" -gt "${TODO:-1}" ] && n=${TODO:-1}
          [ "$n" -gt "$MAX_SHARDS" ] && n=$MAX_SHARDS
          [ "$n" -lt 1 ] && n=1
          echo "$(( ${WORK:-0} / 60 )) CPU-minutes over $n shard(s), $(( budget / 60 )) min each"
          # THE MATRIX AND THE COUNT COME FROM ONE PLACE, and they have to. The
          # scorer is told `--shard i/N` while the matrix is a list, so a list of
          # eight against an N of thirty-two tells eight jobs they are one of
          # thirty-two — and three quarters of the board is silently never
          # scored. Nothing fails; the rows keep their old numbers.
          echo "count=$n" >> "$GITHUB_OUTPUT"
          N=$n python3 -c "import json,os;print('list='+json.dumps(list(range(int(os.environ['N'])))))" >> "$GITHUB_OUTPUT"

  # ---- 2. score, N ways at once -----------------------------------------
  #
  # Each shard simulates the submissions whose INDEX is its own and writes only
  # the scores it computed. It produces no board: a shard's view is a slice, and
  # a slice ranked on its own would be a leaderboard of a third of the field.
  score:
    needs: [submissions]
    if: needs.submissions.outputs.wired == 'true'
      && needs.submissions.outputs.work != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.submissions.outputs.shards) }}
      # LEAVE THE MACHINE ROOM FOR THE CHECKS. Forty jobs is the account's whole
      # ceiling (docs/BOARD.md §"Two ceilings"), so a rescore that fans out to
      # all of it starves EVERY other workflow — CI queued behind a board run is
      # how a red build went two days unseen. The board is a background job and
      # CI is the one a person is waiting on, so eight slots stay free: a
      # rescore is a quarter longer against hours it already takes, and the
      # checks keep running while it does.
      max-parallel: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: submissions
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: store
          path: store

      - name: build the scorer
        run: cargo build --release --bin wfsim-board

      # THE SAME GENERATION EVERY JOB WAS HANDED, as an artifact. Read once
      # in the job above and passed down: thirty-two shards each asking the
      # database for the same rows is thirty-two times the rows read for one
      # answer, and D1 meters rows READ — five million a day on the free
      # plan, which that shape spends in a handful of runs.
      #
      # …AND IT MEANS EVERY SHARD DECIDES FROM THE SAME FACTS, which is what
      # lets them agree on who owns which row without talking to each other.
      - uses: actions/download-artifact@v4
        with:
          name: facts

      - name: score this shard of every benchmark
        run: |
          set -euo pipefail
          # SHIPPED WHILE IT WORKS, not after. Scores that reach safety only
          # once a shard has FINISHED and UPLOADED are scores one artifact
          # service timeout can empty — measured, on a whole rescore. A minute
          # is the most a killed shard loses.
          : > facts.ndjson
          CF_D1_DATABASE=$(sed 's|^[[:space:]]*//.*$||' wrangler.jsonc \
            | jq -r '.d1_databases[0].database_id // empty')
          export CF_D1_DATABASE
          ( while sleep 60; do
              bash scripts/ship_facts.sh facts.ndjson || true
            done ) &
          SHIPPER=$!
          # …AND ONCE MORE AT THE END, whatever happened to the loop: `trap`
          # rather than a line after it, so a scorer that exits non-zero still
          # banks what it managed.
          trap 'kill $SHIPPER 2>/dev/null || true; bash scripts/ship_facts.sh facts.ndjson || true' EXIT
          # THE SAME FORCING AND THE SAME BOUNDS THE PLAN COUNTED WITH. A shard
          # that took on a different set from the one the split was sized for is
          # a shard doing somebody else's slice.
          FORCE=""
          if [ -n "${{ inputs.weapon }}" ]; then FORCE="--rescore ${{ inputs.weapon }}"; fi
          slice="--deadline $(( SCORE_DEADLINE_MINUTES * 60 ))"
          if [ -z "${{ inputs.weapon }}" ]; then
            slice="--new-limit $NEW_ROWS $slice"
          fi
          for f in data/benchmarks/*.yaml; do
            id=$(basename "$f" .yaml)
            ./target/release/wfsim-board "$id" \
              $FORCE \
              $slice \
              --facts-in facts-known.ndjson \
              --facts facts.ndjson \
              --measured-by "$GITHUB_SHA" \
              --shard "${{ matrix.shard }}/${{ needs.submissions.outputs.shard_count }}" \
              < submissions.json > /dev/null
          done
        env:
          # THE SHIPPER'S HALF. Without these the fact log is written and
          # never sent, and `ship_facts.sh` calls that unconfigured — silent
          # and green, which is how a whole shard's rows went nowhere.
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}

  # ---- 3. assemble the board and commit ---------------------------------
  #
  # With every score already computed this job simulates nothing: it validates,
  # deduplicates, ranks and writes. Measured locally at 0.064 s for the rows it
  # was given, against the 1.5 s the shards spent computing them.
  publish:
    needs: [submissions, score]
    # A SHARD THAT DID THE WORK AND FAILED TO UPLOAD IT MUST NOT COST THE RUN.
    # Every shard BANKS its scores to the store before it uploads anything, so
    # the store is the authority and the artifact is a convenience — and an
    # `if:` with no status function implies `success()`, which made one
    # shard's failure skip the assembly. Measured: a full rescore computed all
    # 128 shards, banked all of them, and published nothing because GitHub's
    # artifact service timed out on one of them after five retries. Five and a
    # half hours of correct work, thrown away by a transient service.
    #
    # `!cancelled()` is what lifts the implied `success()`; `submissions` is
    # still required, because without the library there is nothing to assemble.
    if: ${{ !cancelled() && needs.submissions.result == 'success'
      && needs.submissions.outputs.wired == 'true'
      && needs.submissions.outputs.work != 'false' }}
    runs-on: ubuntu-latest
    # ONE PUBLISH AT A TIME, ACROSS EVERY RUN. The workflow's own groups keep
    # the schedule and the buttons apart so a long manual rescore cannot stand
    # the schedule down — which means they overlap, and two assemblies writing
    # the board is last-writer-wins over a whole run's knowledge. Measured: a
    # rescore landed a repaired row at 18:02 and the run that had read the
    # store at 18:01 published over it at 18:07, twice, so the button appeared
    # to do nothing at all. The SCORING may overlap freely; only this may not.
    concurrency:
      group: board-publish
      cancel-in-progress: false
    permissions:
      contents: write
      # NAMING ONE PERMISSION SETS EVERY OTHER TO NONE, so the CI check below
      # needs its own line or the API answers 403, the check reads "unknown",
      # and a guard that fails open never fires at all.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: submissions
      - name: build the scorer
        run: cargo build --release --bin wfsim-board

      # THE FACTS AS THEY ARE NOW, not as they were when this run started. The
      # shards were still shipping while the artifact above was taken, so an
      # assembly handed that copy publishes a board without this run's own
      # measurements in it. ONE job reads fresh, which is one read and not
      # thirty-two.
      - name: read what is measured now
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          CF_D1_DATABASE=$(sed 's|^[[:space:]]*//.*$||' wrangler.jsonc \
            | jq -r '.d1_databases[0].database_id // empty')
          export CF_D1_DATABASE
          bash scripts/fetch_facts.sh facts-known.ndjson


      - name: assemble every benchmark
        run: |
          set -euo pipefail
          # THE FORCED LIST, if the operator named one. It has to reach every
          # process that decides reuse: a shard that keeps a row the publish
          # pass drops leaves publish to compute it alone, at the end.
          FORCE=""
          if [ -n "${{ inputs.weapon }}" ]; then FORCE="--rescore ${{ inputs.weapon }}"; fi
          for f in data/benchmarks/*.yaml; do
            id=$(basename "$f" .yaml)
            # NO SLICE AND NO BUDGET: this pass fights nothing. `--project`
            # makes that a guarantee, so a shard that fell over costs a row
            # on this board rather than an hour on the merge — and the row
            # lands on the next one, which is the convergence rule applied
            # to the assembly.
            #
            # IT PUBLISHES A WEAPON AT A TIME, WHOLE. The directory it is
            # handed is both what it writes and where a weapon's rows under
            # every OTHER ruler are read back from, so a file is only ever
            # written with all of them in hand. A weapon with an unmeasured
            # row keeps the rows it has.
            ./target/release/wfsim-board "$id" site/board \
              $FORCE \
              --project \
              --facts-in facts-known.ndjson \
              < submissions.json > /dev/null || {
                code=$?
                # TWO IS "NOT YET", ANYTHING ELSE IS BROKEN. Three boards are
                # three rankings and they differ sixfold in cost —
                # single_target settles in an hour where group_clear takes
                # six — so an incomplete one may not hold a complete one back.
                if [ "$code" = "2" ]; then
                  echo "::notice::$id is not complete yet — left as it was"
                else
                  echo "::error::$id: the assembly failed with $code"
                  exit "$code"
                fi
              }
          done

      # ONLY ON CHANGE. Most hours nobody submits anything new, and a commit per
      # hour that says nothing is history nobody can read.
      #
      # AND IT NEVER REBASES THE RESULT. These files are GENERATED: there is no
      # sense in which two versions both hold something worth keeping, so a
      # three-way merge can only ever produce a conflict — which is exactly what
      # happened on 2026-08-11, throwing away 83 minutes of completed scoring at
      # the last step. The run that just scored holds the newest numbers; it
      # takes whatever base is current and writes them on top.
      # THE BOARD DOES NOT PUBLISH NUMBERS FROM CODE THAT FAILED ITS TESTS.
      #
      # CI ran red for two days and thirty-five pushes on a real defect — a
      # geometric boundary decided by the host's `acos`, so the runner swept one
      # body fewer than the rule says — and every hour of that the board went on
      # publishing melee numbers computed with it. Nothing connected the two:
      # scoring is hours, CI is minutes, and by publish time the answer has been
      # THE JOB THAT BEARS ON A NUMBER, and not the whole workflow. `test`
      # runs clippy and the suite, which is what can make a published score
      # wrong. `parity` compares how two PAGES render one weapon: it cannot
      # move a number, and while this read the workflow's own conclusion a race
      # in a browser check froze the leaderboard — a UI flake stopping the
      # board from publishing measurements trades a loud problem for a silent
      # one, which is the trade this guard exists to refuse.
      - name: did this commit's tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # THE TWO WAYS THIS LEARNS NOTHING ARE DIFFERENT FACTS. "No CI run
          # for this sha" is ordinary; "the API would not answer" means the
          # guard is not working, and a fail-open check that cannot say which
          # has quietly stopped being a check.
          runs='repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50'
          if ! ids=$(gh api "$runs" --jq '[.workflow_runs[] | select(.name == "CI") | .id] | join(" ")' 2>&1); then
            echo "::warning::could not read CI for ${{ github.sha }} — publishing without that check"
            printf "%s" "$ids" | head -3
            exit 0
          fi
          got=""
          for id in $ids; do
            if ! j=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs?per_page=100" \
                     --jq '[.jobs[] | select(.name == "test") | .conclusion // "running"] | join(",")' 2>&1); then
              echo "::warning::could not read the jobs of CI run $id — publishing without that check"
              exit 0
            fi
            got="$got,$j"
          done
          echo "the test job for ${{ github.sha }}: ${got#,}"
          case "$got," in
            *,failure,*|*,timed_out,*)
              echo "::error::the test job failed for this commit — the board will not publish numbers from it"
              exit 1 ;;
          esac

      - name: commit if the board moved
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # WHAT THIS RUN GENERATED, named ONCE. The same list is diffed, held
          # across the reset, put back and added — and while it was four
          # literals, `data/board_state.yaml` was held by none of them: the
          # reset took it back to main's copy and `git add` then staged a file
          # identical to HEAD. The counts the PAGE reads froze on the day that
          # file landed while the boards beside it moved on, so the board
          # reported 1,168 builds waiting where 344 were.
          # THE STAMP IS WRITTEN BY WHOEVER WRITES THE BOARD, and this is the
          # writer that runs once an hour. A stamp only the site build
          # maintains would name the board of whenever somebody last rebuilt
          # locally, which is a worse answer than none — docs/DISTRIBUTION.md.
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/board_meta.py
          GENERATED="site/board data/board_state.yaml site/board.meta.json"
          if git diff --quiet -- $GENERATED; then
            echo "board unchanged — nothing to commit"
            exit 0
          fi
          for attempt in 1 2 3; do
            # Hold the generated files, take whatever main is now, put them back.
            rm -rf /tmp/out && mkdir -p /tmp/out
            cp -r --parents $GENERATED /tmp/out/
            git fetch origin main
            git reset --hard origin/main
            cp -r /tmp/out/. .
            if git diff --quiet -- $GENERATED; then
              echo "board already current on main — nothing to commit"
              exit 0
            fi
            git add $GENERATED
            # THE TIME, not just the date. Three runs an hour means a day of
            # "board: rescore 2026-08-09" is a wall of identical subjects, and the
            # one thing you want from this line is WHICH rescore you are looking
            # at.
            git commit -m "board: rescore $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push; then exit 0; fi
            echo "push raced (attempt $attempt) — taking the new base and rewriting"
          done
          echo "::error::could not land the board after three attempts"
          exit 1
