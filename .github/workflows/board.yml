# THE BOARD RUNS ITSELF. Nobody commits a leaderboard by hand.
#
# The repo owner never touches this: the bot scores, the bot commits, and
# Cloudflare deploys the push. What triggers a re-score is the owner's ORDINARY
# WORK — fixing a bug in `engine/`, correcting a number in `data/`, or bumping a
# benchmark to a new version is itself the trigger, because all three are a push
# that changes what a score MEANS.
#
# Two triggers, two scopes:
#   schedule  — score what is new. quiet hours produce no commit at all.
#   push      - engine or data changed. A CODE change re-scores every stored
#               build; a DATA change re-scores only the rows that read the
#               file that moved, which is most pushes and nearly free.
#
# The second is not an optimisation of the first, it is the correctness rule:
# a board whose rows were measured by different engine versions is not a board.
#
# IT IS SHARDED, and it had to be. Measured on the run that raised
# the rulers to 1000 runs: 24 s to build, 3m43s to read submissions out of KV,
# **1h07m to score**, 2 s to commit. Meanwhile the schedule fires every twenty
# minutes and `concurrency` keeps only ONE pending run — so every queued run was
# cancelled by the next trigger and the board stopped updating entirely. Five
# consecutive `cancelled` runs, and one that scored for 83 minutes and then
# threw the result away on a merge conflict.
#
# Scoring is embarrassingly parallel — every row is an independent fight — so it
# splits N ways by submission index and a merge job assembles the board from the
# scores. 67 minutes becomes ~9, which is shorter than the interval that was
# starving it.
name: board

on:
  schedule:
    # THREE TIMES AN HOUR, on the twenty. It was hourly at
    # :17 — off the hour on the theory that :00 queues behind everyone else,
    # which is true and turns out not to be worth optimising for: this repo's
    # own history shows the :17 runs landing at :33–:35, so GitHub's scheduler
    # slips ~15 minutes whatever minute you name. Naming :00 costs nothing that
    # was not already being paid, and naming three of them is what actually
    # makes the board fresh — a submission now waits ~20 minutes rather than an
    # hour, and the worst case is bounded instead of being "you just missed it".
    #
    # It is free to do: this repo is public, so Actions minutes are not metered,
    # and a run that finds nothing new commits nothing.
    - cron: "0,20,40 * * * *"
    # THE BACKSTOP, and it is a FULL rescore whatever the probe below thinks.
    # Sampling one published row per weapon catches any code change that moves a
    # number for some weapon; what it can still miss is one that moves only SOME
    # builds of one weapon, and nothing bounds that but measuring everything.
    # Once a week does, and it costs one long run out of ~500.
    #
    # MONDAY 00:00 UTC, which is Warframe's own weekly reset — *"Other content
    # uses a different server-side reset timer that resets only every Monday at
    # 0:00 UTC"* (wiki `Reset`). A small tribute, and a time the players this is
    # for already have in their heads.
    - cron: "0 0 * * 1"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "data/**"
      - "webapi/**"
      - "cli/src/bin/wfsim-board.rs"
  workflow_dispatch:
    inputs:
      full:
        description: "rescore every row, even if the engine has not moved"
        type: boolean
        default: false

# ONE AT A TIME **PER TRIGGER**, which is two workloads and always was. A
# scheduled run scores what is NEW — a handful of builds, reusing every stored
# score — while a push that moves `engine/` makes every row stale and scores the
# whole library. They differ by three orders of magnitude and they shared one
# concurrency group, so the cheap one queued behind the expensive one and was
# then thrown away: GitHub keeps a single PENDING run per group, so each
# scheduled trigger cancelled the one before it and the board moved about once
# an hour instead of three times.
#
# Splitting the group is safe because `publish` was already written for it — it
# takes whatever `main` is now, writes the generated files on top and retries
# three times. Two runs landing a board is last-writer-wins BY DESIGN: there is
# no sense in which two versions of a generated file both hold something worth
# keeping, which is the same reasoning that made it refuse to rebase.
concurrency:
  group: board-${{ github.event_name }}
  cancel-in-progress: false

env:
  # HOW MANY WAYS THE SCORING SPLITS. Actions minutes are not metered on a
  # public repo, so the only cost of a wider fan-out is the fixed ~30 s each job
  # spends checking out and restoring the cache.
  #
  # EIGHT STARVED THE BOARD AGAIN, the same way and for a new
  # reason. Eight was measured when 67 minutes of scoring became ~9 a shard;
  # the roster then doubled — 556 entries, 773 stored rows — and shards came in
  # at 15 to 35 minutes with one at 55. The schedule fires every TWENTY, and a
  # concurrency group keeps only one PENDING run, so any run slower than the
  # interval has its successor discarded and the board stops moving. The board
  # had not updated for hours and the owner noticed before any check did.
  #
  # It gets worse before it gets better: a reflecting bounce reaches 361 bodies
  # on the group-clear ruler where the old walk reached 30, and that ruler's
  # rows are the expensive ones.
  #
  # 32 is chosen against the INTERVAL rather than against the old figure — the
  # run has to finish inside twenty minutes or it starves itself, and four times
  # the fan-out puts the worst shard at ~14. The ceiling is GitHub's 256-job
  # matrix, so there is room to raise it again when the roster doubles again.
  #
  # AND IT DID, THE SAME WAY, A THIRD TIME. What doubled this time
  # was not the roster but the STORE: the library model landed on 2026-08-25 and
  # every ruler now crosses the whole of it, so the boards went from ~900 rows to
  # 2,185 and the store to 2,447 builds. Measured on the last run that finished:
  # `submissions` 9m, the 32 shards 9.3 / 21.8 / **52.9** minutes
  # (min/median/max, 712 minutes of work), `publish` 1m — 63 minutes of wall
  # against a twenty-minute schedule, so every queued run was cancelled by its
  # successor and the board updated about once an hour. The owner noticed the
  # same way as last time: a build submitted and not showing up.
  #
  # 128 is again sized against the interval: 712/128 is 5.6 minutes a shard, and
  # the worst/mean ratio measured at 32 (2.4x) puts the worst at about 13. It is
  # A BET TO BE MEASURED, not arithmetic — 32 jobs were observed starting within
  # two seconds of each other, but nothing here has yet run 128, and if GitHub
  # schedules them in waves the wall time will not fall as far as the division
  # says. Read the next run's spread before raising it again.
  #
  # THE NEXT WALL IS NOT THIS NUMBER, and it is no longer `submissions` either.
  # That job read KV one request per stored build — O(the store) against an
  # input of O(what is new) — and `scripts/fetch_submissions.sh` now keeps
  # `library.json` between runs: the keys are LISTED in three requests and only
  # what is missing is fetched, so a quiet run pays almost nothing and no shard
  # count was ever going to touch it either way.
  #
  # WHAT TO WATCH IS THE SPREAD. The makespan is the slowest shard, and the
  # scorer packs by measured cost now rather than by row index — read
  # `accounted:` and the shard spread on the next run before touching this line.
  SHARDS: 128

  # HOW MANY WAYS THE PROBE SPLITS. It reproduces one published row per
  # weapon (~135 of them, ~200 rows) and the whole point is that it is
  # cheap beside the run it decides: measured locally, a shard of 16 is
  # 22-42 s of scoring per board, so a job carrying all three finishes in
  # about two minutes plus a cached build. Sixteen, not 128: past a point
  # the fixed cost of a runner is the whole bill.
  VERIFY_SHARDS: 16

jobs:
  # ---- 1. what is there to score ----------------------------------------
  #
  # The KV read is its own job so the eight scorers do not each pay 3m43s for
  # the same list — and so they are all handed the SAME file, which is what
  # makes "shard by index" a split they agree on without talking.
  submissions:
    runs-on: ubuntu-latest
    outputs:
      wired: ${{ steps.wired.outputs.yes }}
      engine: ${{ steps.fp.outputs.engine }}
      shards: ${{ steps.shards.outputs.list }}
      probe: ${{ steps.shards.outputs.probe }}
      full: ${{ steps.full.outputs.yes }}
      moved: ${{ steps.fp.outputs.moved }}
    steps:
      - uses: actions/checkout@v4

      # THE MATRIX IS DERIVED FROM `SHARDS`, and it has to be. The scorer is
      # told `--shards N` from the env while the matrix was a hand-written
      # [0..7], so raising one without the other tells eight jobs they are one
      # of thirty-two — and three quarters of the board is silently never
      # scored. Nothing would have failed; the rows would simply keep their old
      # numbers.
      - id: shards
        run: |
          python3 -c "import json;print('list='+json.dumps(list(range($SHARDS))))" >> "$GITHUB_OUTPUT"
          python3 -c "import json;print('probe='+json.dumps(list(range($VERIFY_SHARDS))))" >> "$GITHUB_OUTPUT"

      # WHAT A SCORE DEPENDS ON THAT IS NOT THE BUILD, as one hash: the code
      # that simulates, the data it simulates with, and the rulers. `data/`
      # MINUS the boards themselves — those are this job's own output, so
      # including them would move the fingerprint on every run and nothing would
      # ever be reused.
      #
      # A COOLDOWN WOULD HAVE BEEN THE WRONG AXIS:
      # time is not an input to a score. Untouched, a row is valid forever;
      # moved, it is wrong immediately. This asks the only question that matters
      # — "is anything different" — and answers it exactly.
      - name: what engine is this
        id: fp
        run: |
          set -euo pipefail
          # THE CODE, AND ONLY THE CODE. Hashing `data/` in here makes adding
          # a weapon (a file no existing row reads) invalidate every stored
          # score and buy a full rescore: about an hour of wall clock and
          # thirty of CPU to reproduce numbers that could not have moved.
          # The data half is asked PER ROW now, inside the scorer, from the
          # files that row actually reads (`engine::data_fingerprint`), so a
          # mod correction costs the rows carrying that mod and nothing else.
          fp=$(git ls-files -s -- engine webapi cli | git hash-object --stdin)
          echo "engine=$fp" >> "$GITHUB_OUTPUT"
          echo "engine fingerprint: $fp"
          # DID IT MOVE AT ALL? Every board carries the fingerprint that scored
          # it, so this is the question the probe exists to answer more cheaply
          # — and when the answer is no there is nothing to probe.
          # EVERY board, and they must AGREE. Two boards carrying different
          # fingerprints is a half-finished migration, and reading the first of
          # them would call it settled.
          was=$(grep -h '^engine:' boards/*.yaml 2>/dev/null | awk '{print $2}' | sort -u)
          if [ "$(printf '%s' "$was" | wc -l)" = "0" ] && [ "$was" = "$fp" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "code moved: ${was:-unrecorded} -> $fp"
          fi

      # A FULL RESCORE IGNORES EVERY STORED SCORE. Two things ask for one: the
      # manual button, and the weekly backstop above.
      - id: full
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ "${{ github.event.schedule }}" = "0 0 * * 1" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; echo "FULL rescore"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      # NOT CONFIGURED YET IS NOT A FAILURE. Without the KV binding there is
      # nothing to read, and a job that fails hourly for a reason nobody is
      # acting on trains you to ignore the one that matters.
      - name: is the board wired up?
        id: wired
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACCOUNT" ]; then echo "yes=true" >> "$GITHUB_OUTPUT";
          else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::board storage not configured — see docs/BOARD.md"; fi

      # THE LIBRARY IS FETCHED ONCE AND THEN ONLY ADDED TO. `restore-keys` takes
      # the newest cache whatever run wrote it, while the `key` carries this run
      # id so every run SAVES one — which is what keeps the chain moving. A
      # miss costs a full listing and nothing depends on it.
      - name: restore the library
        if: steps.wired.outputs.yes == 'true'
        uses: actions/cache@v4
        with:
          path: library.json
          key: board-library-${{ github.run_id }}
          restore-keys: board-library-

      # WHAT THE LAST BOARD WAS BUILT FROM, as the floor this run may not fall
      # under. The boards carry `submissions: N`; the largest is the best
      # estimate of the library's real size, and 90% of it is the tripwire —
      # see `guard_shrink` in the script for why a short list is the danger.
      - name: what the last board was built from
        if: steps.wired.outputs.yes == 'true'
        id: floor
        run: |
          set -euo pipefail
          n=$(grep -h '^submissions:' boards/*.yaml 2>/dev/null \
                | awk '{print $2}' | sort -n | tail -1 || echo 0)
          n=${n:-0}
          echo "floor=$(( n * 9 / 10 ))" >> "$GITHUB_OUTPUT"
          echo "last board was built from $n submissions"

      # EVERY stored submission, every time — but FETCHED only once each. The
      # logic is a FILE rather than a block of yaml so that the thing tested is
      # the thing that runs: `scripts/fetch_submissions.sh --self-test` drives
      # it against a stub `curl`, and CI runs that.
      - name: read submissions
        if: steps.wired.outputs.yes == 'true'
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_NAMESPACE: ${{ secrets.CF_SUBMISSIONS_NAMESPACE_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: bash scripts/fetch_submissions.sh

      # THE LIST IS ALSO THE ONLY OFF-SITE COPY OF THE LIBRARY, which is the one
      # irreplaceable thing in this pipeline — the boards are derived from it,
      # the site is generated, the code is in git, and what players sent lives in
      # exactly one KV namespace. Thirty days of rolling artifacts costs nothing
      # and is the difference between "restore yesterday's" and "ask everyone to
      # submit again".
      - name: keep the list for the scorers
        if: steps.wired.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: submissions
          path: submissions.json
          retention-days: 30

  # ---- 1b. did the code change move any NUMBER? -------------------------
  #
  # The engine fingerprint is a hash of `engine`, `webapi` and `cli`, so ANY
  # edit to them declares every stored score stale. Most edits cannot move a
  # number — a comment, a test, a validation rule, a field only the page reads —
  # and paying a full rescore for each is what stopped the board updating:
  # measured on the run of 2026-09-03, 128 shards, median 55 minutes and worst
  # 192, **7,808 minutes of work and four hours of wall clock** against a
  # schedule that fires every twenty. Every successor was discarded; eleven
  # engine commits in one morning meant no completed run for ten hours.
  #
  # SO IT IS MEASURED RATHER THAN GUESSED. Each shard re-scores its slice of one
  # published row per weapon and compares with what the board says. Identical
  # throughout and the code is score-equivalent: the numbers on the board are
  # what THIS code computes, so `--code-verified` lets the scorers reuse them.
  # One difference and `decide` says so and the full rescore happens.
  #
  # A SHARD NEVER FAILS THE RUN. "The numbers moved" is an ANSWER, not a broken
  # job, so the exit code is captured into a file and `decide` sums them.
  verify:
    needs: submissions
    if: needs.submissions.outputs.wired == 'true'
      && needs.submissions.outputs.full != 'true'
      && needs.submissions.outputs.moved == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.submissions.outputs.probe) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --bin wfsim-board
      - run: pip install --quiet pyyaml
      - name: reproduce this shard of the sample
        run: |
          set -euo pipefail
          mkdir -p verdict
          for f in boards/*.yaml; do
            id=$(basename "$f" .yaml)
            python3 scripts/board_sample.py "$f" > sample.json
            # `--verify-min 0`: a shard comparing three rows proves nothing on
            # its own, so the floor is applied ONCE, over the sum, in `decide`.
            set +e
            ./target/release/wfsim-board "$id" \
              --engine "${{ needs.submissions.outputs.engine }}" \
              --reuse "$f" --verify --verify-min 0 \
              --shard "${{ matrix.shard }}/${VERIFY_SHARDS}" \
              < sample.json > /dev/null 2> verify.log
            set -e
            grep -o 'verify-result: .*' verify.log >> "verdict/${{ matrix.shard }}.txt" || true
            grep -o 'verify: .* -> .*' verify.log | head -5 || true
          done
          cat "verdict/${{ matrix.shard }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: verdict-${{ matrix.shard }}
          path: verdict/
          retention-days: 1

  # ---- 1c. …and the one place that answers it ---------------------------
  #
  # ALWAYS RUNS, because "the code did not move" and "the probe was skipped" are
  # both answers the scorers need, and a job that only runs on one path leaves
  # the others reading an empty output as false — which is the safe direction,
  # and worth being explicit about rather than relying on.
  decide:
    needs: [submissions, verify]
    if: always() && needs.submissions.outputs.wired == 'true'
    runs-on: ubuntu-latest
    outputs:
      equivalent: ${{ steps.v.outputs.equivalent }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: verdict-*
          merge-multiple: true
          path: verdict
      - id: v
        run: |
          set -euo pipefail
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "equivalent=false" >> "$GITHUB_OUTPUT"
            echo "no usable probe (${{ needs.verify.result }}) — full rescore"
            exit 0
          fi
          sum() { cat verdict/*.txt 2>/dev/null \
            | awk -v k="$1" '{ for (i = 1; i <= NF; i++)
                                 if (index($i, k "=") == 1) n += substr($i, length(k) + 2) }
                             END { print n + 0 }'; }
          compared=$(sum compared)
          moved=$(sum moved)
          echo "probe: $compared rows reproduced, $moved moved"
          # A HUNDRED ROWS IS THE FLOOR. A probe that compared almost nothing —
          # rows the floor screened away, or a board whose rows no longer
          # validate — proves nothing, and a verification that cannot fail is
          # worse than none.
          if [ "$moved" = "0" ] && [ "$compared" -ge 100 ]; then
            echo "equivalent=true" >> "$GITHUB_OUTPUT"
            echo "::notice::the code moved and the numbers did not — reusing $compared verified rows"
          else
            echo "equivalent=false" >> "$GITHUB_OUTPUT"
          fi

  # ---- 2. score, N ways at once -----------------------------------------
  #
  # Each shard simulates the submissions whose INDEX is its own and writes only
  # the scores it computed. It produces no board: a shard's view is a slice, and
  # a slice ranked on its own would be a leaderboard of a third of the field.
  score:
    needs: [submissions, decide]
    if: needs.submissions.outputs.wired == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.submissions.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: submissions

      - name: build the scorer
        run: cargo build --release --bin wfsim-board

      # REUSE IS EXACT, NOT AN APPROXIMATION. With the fingerprint unchanged the
      # stored score is the number this run would compute, so re-running the
      # fight would be spending an hour to reproduce it — and only submissions
      # with no row yet cost anything. The manual button skips the reuse and
      # rescores everything.
      - name: score this shard of every benchmark
        run: |
          set -euo pipefail
          mkdir -p scores
          # ...AND WHAT THE PROBE FOUND. `--code-verified` is the statement
          # that a sample of the published rows came back IDENTICAL under
          # this code, so reusing across the fingerprint difference is a
          # measurement rather than a hope. Empty on a full run, and on any
          # run where the probe did not clear the board.
          verified=""
          if [ "${{ needs.decide.outputs.equivalent }}" = "true" ]; then
            verified="--code-verified"
          fi
          for f in data/benchmarks/*.yaml; do
            id=$(basename "$f" .yaml)
            prior=""
            [ "${{ needs.submissions.outputs.full }}" = "true" ] || prior="--reuse boards/$id.yaml"
            ./target/release/wfsim-board "$id" \
              --engine "${{ needs.submissions.outputs.engine }}" $prior $verified \
              --shard "${{ matrix.shard }}/${SHARDS}" \
              --emit-scores "scores/$id-${{ matrix.shard }}.json" \
              < submissions.json > /dev/null
          done

      - uses: actions/upload-artifact@v4
        with:
          name: scores-${{ matrix.shard }}
          path: scores/
          retention-days: 1

  # ---- 3. assemble the board and commit ---------------------------------
  #
  # With every score already computed this job simulates nothing: it validates,
  # deduplicates, ranks and writes. Measured locally at 0.064 s for the rows it
  # was given, against the 1.5 s the shards spent computing them.
  publish:
    needs: [submissions, decide, score]
    if: needs.submissions.outputs.wired == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: submissions
      - uses: actions/download-artifact@v4
        with:
          pattern: scores-*
          path: scores
          merge-multiple: true

      - name: build the scorer
        run: cargo build --release --bin wfsim-board

      # TWO OUTPUTS: the canonical yaml, and the json the PAGE fetches.
      #
      # It does NOT regenerate the whole site: that fails on a clean runner
      # because `web/cache/img/` is gitignored, and the images are not even the
      # real problem. A board that changes hourly must not need a 2.5 MB wasm
      # rebuilt to reach anyone — install wasm-bindgen, fetch 300
      # images, recompile, to change a few numbers. The board is fetched at
      # runtime now, so this writes two small files and is done.
      - name: assemble every benchmark
        run: |
          set -euo pipefail
          mkdir -p site
          # THE SAME VERDICT THE SCORERS WERE GIVEN, and this is the call
          # that matters most: it ASSEMBLES the board. Without the flag the
          # reuse is refused here and the board is written from the newly
          # scored rows alone -- which is not a stale board, it is an empty
          # one.
          verified=""
          if [ "${{ needs.decide.outputs.equivalent }}" = "true" ]; then
            verified="--code-verified"
          fi
          for f in data/benchmarks/*.yaml; do
            id=$(basename "$f" .yaml)
            prior=""
            # A BRAND-NEW BENCHMARK HAS NO BOARD YET, and that is a legal
            # state — the ruler exists before anyone has submitted to it. This
            # An unguarded `cp` aborts the whole publish job under `set -e`
            # when the file is missing, so ADDING A RULER would break the
            # hourly board until somebody hand-wrote an empty yaml. The
            # scoring step above does not have the problem: it
            # passes the path straight to the binary, which treats an
            # unreadable prior as "full rescore" and carries on.
            if [ "${{ needs.submissions.outputs.full }}" != "true" ]                && [ -f "boards/$id.yaml" ]; then
              # Read the board BEFORE it is overwritten: the loop writes in
              # place, so a copy is what the reuse actually reads.
              cp "boards/$id.yaml" "/tmp/$id-prior.yaml"
              prior="--reuse /tmp/$id-prior.yaml"
            fi
            ./target/release/wfsim-board "$id" site/board.json \
              --engine "${{ needs.submissions.outputs.engine }}" $prior $verified \
              --scores scores \
              < submissions.json > "boards/$id.yaml"
          done

      # ONLY ON CHANGE. Most hours nobody submits anything new, and a commit per
      # hour that says nothing is history nobody can read.
      #
      # AND IT NEVER REBASES THE RESULT. These files are GENERATED: there is no
      # sense in which two versions both hold something worth keeping, so a
      # three-way merge can only ever produce a conflict — which is exactly what
      # happened on 2026-08-11, throwing away 83 minutes of completed scoring at
      # the last step. The run that just scored holds the newest numbers; it
      # takes whatever base is current and writes them on top.
      - name: commit if the board moved
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- boards data/board_state.yaml site/board.json; then
            echo "board unchanged — nothing to commit"
            exit 0
          fi
          for attempt in 1 2 3; do
            # Hold the generated files, take whatever main is now, put them back.
            mkdir -p /tmp/out
            cp -r boards /tmp/out/
            cp site/board.json /tmp/out/
            git fetch origin main
            git reset --hard origin/main
            cp -r /tmp/out/boards .
            cp /tmp/out/board.json site/
            if git diff --quiet -- boards data/board_state.yaml site/board.json; then
              echo "board already current on main — nothing to commit"
              exit 0
            fi
            git add boards data/board_state.yaml site/board.json
            # THE TIME, not just the date. Three runs an hour means a day of
            # "board: rescore 2026-08-09" is a wall of identical subjects, and the
            # one thing you want from this line is WHICH rescore you are looking
            # at.
            git commit -m "board: rescore $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push; then exit 0; fi
            echo "push raced (attempt $attempt) — taking the new base and rewriting"
          done
          echo "::error::could not land the board after three attempts"
          exit 1
