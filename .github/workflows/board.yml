# THE BOARD RUNS ITSELF. Nobody commits a leaderboard by hand.
#
# The repo owner never touches this: the bot scores, the bot commits, and
# Cloudflare deploys the push. What triggers a re-score is the owner's ORDINARY
# WORK — fixing a bug in `engine/`, correcting a number in `data/`, or bumping a
# benchmark to a new version is itself the trigger, because all three are a push
# that changes what a score MEANS.
#
# Two triggers, two scopes:
#   schedule  — score what is new. quiet hours produce no commit at all.
#   push      — engine or data changed, so every stored build is re-scored.
#
# The second is not an optimisation of the first, it is the correctness rule:
# a board whose rows were measured by different engine versions is not a board.
# Re-scoring everything is cheap enough that no dependency analysis is worth its
# risk — a full 8-mod build is ~570 ms, so a few thousand rows is minutes on one
# runner, and "which rows were affected" is a question that can be answered
# wrong silently.
name: board

on:
  schedule:
    # THREE TIMES AN HOUR, on the twenty (owner, 2026-08-09). It was hourly at
    # :17 — off the hour on the theory that :00 queues behind everyone else,
    # which is true and turns out not to be worth optimising for: this repo's
    # own history shows the :17 runs landing at :33–:35, so GitHub's scheduler
    # slips ~15 minutes whatever minute you name. Naming :00 costs nothing that
    # was not already being paid, and naming three of them is what actually
    # makes the board fresh — a submission now waits ~20 minutes rather than an
    # hour, and the worst case is bounded instead of being "you just missed it".
    #
    # It is free to do: this repo is public, so Actions minutes are not metered,
    # and a run that finds nothing new commits nothing.
    - cron: "0,20,40 * * * *"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "data/**"
      - "webapi/**"
      - "cli/src/bin/wfsim-board.rs"
  workflow_dispatch:

# One at a time. Two runs committing the same generated file is a conflict with
# no meaning — the later run's numbers are simply the current ones.
concurrency:
  group: board
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # NOT CONFIGURED YET IS NOT A FAILURE. Without the KV binding there is
      # nothing to read, and a job that fails hourly for a reason nobody is
      # acting on trains you to ignore the one that matters.
      - name: is the board wired up?
        id: wired
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACCOUNT" ]; then echo "yes=true" >> "$GITHUB_OUTPUT";
          else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::board storage not configured — see docs/BOARD.md"; fi

      - name: build the scorer
        if: steps.wired.outputs.yes == 'true'
        run: cargo build --release --bin wfsim-board

      # EVERY stored submission, every time. The endpoint keys by build identity
      # so the list is already deduplicated — a hundred players who arrived at
      # one build are one key.
      - name: read submissions
        if: steps.wired.outputs.yes == 'true'
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_NAMESPACE: ${{ secrets.CF_SUBMISSIONS_NAMESPACE_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/$CF_NAMESPACE"
          AUTH=(-H "Authorization: Bearer $CF_TOKEN")
          : > keys.txt
          cursor=""
          while :; do
            resp=$(curl -sf "${AUTH[@]}" "$API/keys?limit=1000${cursor:+&cursor=$cursor}")
            echo "$resp" | jq -r '.result[].name' >> keys.txt
            cursor=$(echo "$resp" | jq -r '.result_info.cursor // empty')
            [ -n "$cursor" ] || break
          done
          echo "[]" > submissions.json
          # Values one at a time: KV has no bulk read. A board this size makes
          # that a few hundred requests, which is nothing next to the scoring.
          jq -Rs 'split("\n") | map(select(length > 0))' keys.txt > keylist.json
          jq -c '.[]' keylist.json | while read -r k; do
            key=$(echo "$k" | jq -r .)
            curl -sf "${AUTH[@]}" --get --data-urlencode "x=1" \
              "$API/values/$(jq -rn --arg v "$key" '$v|@uri')" >> values.ndjson || true
            echo >> values.ndjson
          done
          jq -s 'map(select(. != null))' values.ndjson > submissions.json || echo "[]" > submissions.json
          echo "submissions: $(jq 'length' submissions.json)"

      # TWO OUTPUTS: the canonical yaml, and the json the PAGE fetches.
      #
      # This step used to regenerate the whole site, and it failed on a clean
      # runner because `web/cache/img/` is gitignored — but the real problem was
      # not the images. A board that changes hourly should never have needed a
      # 2.5 MB wasm rebuilt to reach anyone: install wasm-bindgen, fetch 300
      # images, recompile, to change a few numbers. The board is fetched at
      # runtime now, so this writes two small files and is done.
      - name: score every benchmark
        if: steps.wired.outputs.yes == 'true'
        run: |
          set -euo pipefail
          mkdir -p site
          for f in data/benchmarks/*.yaml; do
            id=$(basename "$f" .yaml)
            ./target/release/wfsim-board "$id" site/board.json < submissions.json               > "data/benchmarks/boards/$id.yaml"
          done

      # ONLY ON CHANGE. Most hours nobody submits anything new, and a commit per
      # hour that says nothing is history nobody can read.
      - name: commit if the board moved
        if: steps.wired.outputs.yes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/benchmarks/boards site/board.json; then
            echo "board unchanged — nothing to commit"
            exit 0
          fi
          git add data/benchmarks/boards site/board.json
          # THE TIME, not just the date. Three runs an hour means a day of
          # "board: rescore 2026-08-09" is a wall of identical subjects, and the
          # one thing you want from this line is WHICH rescore you are looking
          # at.
          git commit -m "board: rescore $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
