# THE BOARD RUNS ITSELF. Nobody commits a leaderboard by hand.
#
# The repo owner never touches this: the bot scores, the bot commits, and
# Cloudflare deploys the push. What triggers a re-score is the owner's ORDINARY
# WORK — fixing a bug in `engine/`, correcting a number in `data/`, or bumping a
# benchmark to a new version is itself the trigger, because all three are a push
# that changes what a score MEANS.
#
# Two triggers, two scopes:
#   schedule  — score what is NEW, and only while the code has not moved.
#               quiet hours produce no commit at all.
#   push      - engine or data changed, and this run OWNS that rescore. A CODE
#               change re-scores every stored build; a DATA change re-scores
#               only the rows that read the file that moved, which is most
#               pushes and nearly free.
#
# The second is not an optimisation of the first, it is the correctness rule:
# a board whose rows were measured by different engine versions is not a board.
#
# Scoring is embarrassingly parallel — every row is an independent fight — so it
# splits `SHARDS` ways and a merge job assembles the board from the scores. What
# that can and cannot buy is measured in docs/BOARD.md §"Two ceilings, and
# neither is the shard count".
name: board

on:
  schedule:
    # THREE TIMES AN HOUR, on the twenty. It was hourly at
    # :17 — off the hour on the theory that :00 queues behind everyone else,
    # which is true and turns out not to be worth optimising for: this repo's
    # own history shows the :17 runs landing at :33–:35, so GitHub's scheduler
    # slips ~15 minutes whatever minute you name. Naming :00 costs nothing that
    # was not already being paid, and naming three of them is what actually
    # makes the board fresh — a submission now waits ~20 minutes rather than an
    # hour, and the worst case is bounded instead of being "you just missed it".
    #
    # It is free to do: this repo is public, so Actions minutes are not metered,
    # and a run that finds nothing new commits nothing.
    - cron: "0,20,40 * * * *"
    # THE WEEKLY FULL RESCORE IS GONE, and `audit.yml` is what replaced it. It
    # was the backstop for the probe's blind spot — a change that moves only
    # SOME builds of one group — and it paid for that by rescoring 22,977 rows
    # every Monday whether or not anything had moved. The audit reads a slice of
    # the published board every hour, crosses all of it in days, and reports a
    # row that is not what this code computes without rescoring anything.
  push:
    branches: [main]
    # WAKE ON EVERYTHING EXCEPT WHAT THIS WORKFLOW ITSELF WRITES.
    #
    # An INCLUSION list is the wrong shape here and was wrong in the way that
    # matters: a path that moves the engine fingerprint and is not listed
    # invalidates every stored score and wakes nobody, so the full rescore it
    # bought lands on whichever run happens next, for a reason that run has
    # nothing to do with. `cli` was such a path. Naming what to SKIP inverts the
    # failure — forgetting an entry costs one wasted run and can never cost a
    # board that quietly stops moving.
    #
    # It is affordable because a run with nothing to do is now one job:
    # `is there anything to score` asks the scorer by walking, and `score` and
    # `publish` do not start when the answer is none. The list is the board's own
    # output and nothing else; `check_rescore_paths` holds it to that.
    paths-ignore:
      - "boards/**"
      - "data/board_state.yaml"
      - "site/board.json"
  workflow_dispatch:
    inputs:
      full:
        description: "rescore every row, even if the engine has not moved"
        type: boolean
        default: false
      # THE BACKSTOP FOR A NUMBER THE HASHES CANNOT SEE. Reuse is decided by
      # fingerprints, and a fingerprint answers "did an INPUT move" — so a
      # correction they cannot see, or a run this pipeline lost, leaves a
      # published number nobody can argue the board out of. Naming a weapon
      # drops what is stored for it and nothing else, so the fix costs minutes
      # rather than the whole board. A misspelled id rescores nothing and says
      # so rather than passing quietly.
      weapon:
        description: "rescore these weapons whatever the fingerprints say (id, comma-separated)"
        type: string
        default: ""

# ONE AT A TIME **PER TRIGGER**, which is two workloads. A scheduled run scores
# what is NEW — a handful of builds, reusing every stored score — while a push
# that moves `engine/` makes every row stale and scores the whole library. They
# differ by three orders of magnitude, and in one group GitHub's single PENDING
# slot lets the expensive one cancel the cheap one.
#
# SEPARATE GROUPS ARE NOT PERMISSION TO RUN AT ONCE: forty jobs is the account's
# whole ceiling, so two rescores would halve each other. `rescore` above is what
# prevents it — the schedule stands down while the code is moving.
#
# Splitting is safe because `publish` takes whatever `main` is now, writes the
# generated files on top and retries three times: two runs landing a board is
# last-writer-wins BY DESIGN, the same reasoning that made it refuse to rebase.
concurrency:
  # TWO WORKLOADS, NOT THREE TRIGGERS. A push and a manual run do the same
  # expensive thing, and in groups of their own they do it AT THE SAME TIME —
  # each asking for `max-parallel` of an account ceiling that holds forty, so
  # both run at half speed to produce the same board twice. They share a group;
  # the schedule keeps its own, because standing a cheap run down behind an
  # expensive one is what starved the board before.
  group: board-${{ github.event_name == 'schedule' && 'schedule' || 'rescore' }}
  cancel-in-progress: false

env:
  # HOW MANY WAYS THE SCORING SPLITS, and it is sized against the account's
  # concurrency ceiling rather than against the schedule. Forty jobs run at
  # once whatever this says, so every shard past the fortieth pays a checkout
  # and a cache restore and buys no parallelism — and one 121-minute row is a
  # floor no split goes under. Both are measured in docs/BOARD.md §"Two
  # ceilings, and neither is the shard count", which also says why raising this
  # is not the answer a fourth time.
  #
  # It is left ABOVE forty on purpose: the extra shards are the tail, and
  # dealing the long rows out early is what keeps the last wave short.
  SHARDS: 128

  # HOW MANY WAYS THE PROBE SPLITS. It reproduces one published row per
  # weapon (~135 of them, ~200 rows) and the whole point is that it is
  # cheap beside the run it decides: measured locally, a shard of 16 is
  # 22-42 s of scoring per board, so a job carrying all three finishes in
  # about two minutes plus a cached build. Sixteen, not 128: past a point
  # the fixed cost of a runner is the whole bill.
  VERIFY_SHARDS: 16

jobs:
  # ---- 1. what is there to score ----------------------------------------
  #
  # The KV read is its own job so the eight scorers do not each pay 3m43s for
  # the same list — and so they are all handed the SAME file, which is what
  # makes "shard by index" a split they agree on without talking.
  submissions:
    runs-on: ubuntu-latest
    outputs:
      wired: ${{ steps.wired.outputs.yes }}
      engine: ${{ steps.fp.outputs.engine }}
      shards: ${{ steps.shards.outputs.list }}
      probe: ${{ steps.shards.outputs.probe }}
      full: ${{ steps.full.outputs.yes }}
      moved: ${{ steps.fp.outputs.moved }}
      rescore: ${{ steps.rescore.outputs.yes }}
      work: ${{ steps.work.outputs.yes }}
    steps:
      - uses: actions/checkout@v4

      # THE MATRIX IS DERIVED FROM `SHARDS`, and it has to be. The scorer is
      # told `--shards N` from the env while the matrix was a hand-written
      # [0..7], so raising one without the other tells eight jobs they are one
      # of thirty-two — and three quarters of the board is silently never
      # scored. Nothing would have failed; the rows would simply keep their old
      # numbers.
      - id: shards
        run: |
          python3 -c "import json;print('list='+json.dumps(list(range($SHARDS))))" >> "$GITHUB_OUTPUT"
          python3 -c "import json;print('probe='+json.dumps(list(range($VERIFY_SHARDS))))" >> "$GITHUB_OUTPUT"

      # WHAT A SCORE DEPENDS ON THAT IS NOT THE BUILD, as one hash: the code
      # that simulates, the data it simulates with, and the rulers. `data/`
      # MINUS the boards themselves — those are this job's own output, so
      # including them would move the fingerprint on every run and nothing would
      # ever be reused.
      #
      # A COOLDOWN WOULD HAVE BEEN THE WRONG AXIS:
      # time is not an input to a score. Untouched, a row is valid forever;
      # moved, it is wrong immediately. This asks the only question that matters
      # — "is anything different" — and answers it exactly.
      - name: what engine is this
        id: fp
        run: |
          set -euo pipefail
          # THE CODE, AND ONLY THE CODE — `scripts/engine_fingerprint.sh` says
          # what that means and why `data/` is not in it. It is a file rather
          # than a line here because the audit asks the same question and the
          # two answers have to be the same one.
          fp=$(bash scripts/engine_fingerprint.sh)
          echo "engine=$fp" >> "$GITHUB_OUTPUT"
          echo "engine fingerprint: $fp"
          # DID IT MOVE AT ALL? Every board carries the fingerprint that scored
          # it, so this is the question the probe exists to answer more cheaply
          # — and when the answer is no there is nothing to probe.
          # EVERY board, and they must AGREE. Two boards carrying different
          # fingerprints is a half-finished migration, and reading the first of
          # them would call it settled.
          was=$(grep -h '^engine:' boards/*.yaml 2>/dev/null | awk '{print $2}' | sort -u)
          if [ "$(printf '%s' "$was" | wc -l)" = "0" ] && [ "$was" = "$fp" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "code moved: ${was:-unrecorded} -> $fp"
          fi

      # A FULL RESCORE IGNORES EVERY STORED SCORE. Two things ask for one: the
      # manual button, and the weekly backstop above.
      - id: full
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ "${{ github.event.schedule }}" = "0 0 * * 1" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; echo "FULL rescore"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      # THE PUSH OWNS THE RESCORE; THE SCHEDULE ONLY SCORES WHAT IS NEW.
      #
      # A rescore is 8,071 CPU minutes against a 40-job ceiling, so it cannot
      # finish inside any schedule interval and two of them cannot run at once
      # without halving each other. When the code has moved, the push that moved
      # it is already scoring that generation and a scheduled run can only
      # compete for the same forty slots — while its own new submissions could
      # not be published anyway, since the generation they would join is not
      # complete. So it exits, and quiet polling costs one job instead of forty.
      - id: rescore
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] \
             || [ "${{ steps.fp.outputs.moved }}" != "true" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::code moved — the push for it owns this rescore"
          fi

      # NOT CONFIGURED YET IS NOT A FAILURE. Without the KV binding there is
      # nothing to read, and a job that fails hourly for a reason nobody is
      # acting on trains you to ignore the one that matters.
      - name: is the board wired up?
        id: wired
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACCOUNT" ]; then echo "yes=true" >> "$GITHUB_OUTPUT";
          else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::board storage not configured — see docs/BOARD.md"; fi

      # THE LIBRARY IS FETCHED ONCE AND THEN ONLY ADDED TO. `restore-keys` takes
      # the newest cache whatever run wrote it, while the `key` carries this run
      # id so every run SAVES one — which is what keeps the chain moving. A
      # miss costs a full listing and nothing depends on it.
      - name: restore the library
        if: steps.wired.outputs.yes == 'true'
        uses: actions/cache@v4
        with:
          path: library.json
          key: board-library-${{ github.run_id }}
          restore-keys: board-library-

      # WHAT THE LAST BOARD WAS BUILT FROM, as the floor this run may not fall
      # under. The boards carry `submissions: N`; the largest is the best
      # estimate of the library's real size, and 90% of it is the tripwire —
      # see `guard_shrink` in the script for why a short list is the danger.
      - name: what the last board was built from
        if: steps.wired.outputs.yes == 'true'
        id: floor
        run: |
          set -euo pipefail
          n=$(grep -h '^submissions:' boards/*.yaml 2>/dev/null \
                | awk '{print $2}' | sort -n | tail -1 || echo 0)
          n=${n:-0}
          echo "floor=$(( n * 9 / 10 ))" >> "$GITHUB_OUTPUT"
          echo "last board was built from $n submissions"

      # EVERY stored submission, every time — but FETCHED only once each. The
      # logic is a FILE rather than a block of yaml so that the thing tested is
      # the thing that runs: `scripts/fetch_submissions.sh --self-test` drives
      # it against a stub `curl`, and CI runs that.
      - name: read submissions
        if: steps.wired.outputs.yes == 'true'
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_NAMESPACE: ${{ secrets.CF_SUBMISSIONS_NAMESPACE_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: bash scripts/fetch_submissions.sh

      # THE LIST IS ALSO THE ONLY OFF-SITE COPY OF THE LIBRARY, which is the one
      # irreplaceable thing in this pipeline — the boards are derived from it,
      # the site is generated, the code is in git, and what players sent lives in
      # exactly one KV namespace. Thirty days of rolling artifacts costs nothing
      # and is the difference between "restore yesterday's" and "ask everyone to
      # submit again".
      - name: keep the list for the scorers
        if: steps.wired.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: submissions
          path: submissions.json
          retention-days: 30

      # THE SCORER, HERE TOO. One build against the shared cache, so the step
      # below can ask it what is left rather than guessing from a hash.
      - uses: actions/cache@v4
        if: steps.wired.outputs.yes == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - if: steps.wired.outputs.yes == 'true'
        run: cargo build --release --bin wfsim-board

      # IS THERE ANYTHING TO DO — ASKED BY WALKING, NOT BY DECLARING.
      #
      # A run where every row is reusable still fanned out to `SHARDS` jobs and
      # paid a checkout, a build and a cache restore for each, to write the board
      # it already had. `--dry-run` walks the boards exactly as a scoring run
      # does — the same validation, the same row fingerprints, the same reuse —
      # and counts what is left instead of fighting it, so the answer is the
      # SCORER'S OWN. A second opinion computed here could disagree with it, and
      # the direction it would disagree in is a board that quietly stops moving.
      #
      # ANYTHING IT CANNOT ANSWER MEANS WORK: a build that fails to validate, a
      # board that will not parse, a benchmark with no file. Being wrong that way
      # costs one run; being wrong the other way costs a board nobody updates.
      - name: is there anything to score
        id: work
        if: steps.wired.outputs.yes == 'true'
        run: |
          set -euo pipefail
          FORCE=""
          if [ -n "${{ inputs.weapon }}" ]; then FORCE="--rescore ${{ inputs.weapon }}"; fi
          todo=0
          for f in boards/*.yaml; do
            id=$(basename "$f" .yaml)
            line=$(./target/release/wfsim-board "$id" \
                     --engine "${{ steps.fp.outputs.engine }}" \
                     --reuse "$f" --dry-run $FORCE \
                     < submissions.json 2>&1 >/dev/null \
                   | grep -o 'dry-run: .*' || echo "dry-run: todo=1 (no answer)")
            echo "$id: $line"
            n=$(printf '%s' "$line" | grep -o 'todo=[0-9]*' | cut -d= -f2 || echo 1)
            todo=$(( todo + ${n:-1} ))
          done
          if [ "$todo" -gt 0 ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            echo "$todo rows to score"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::every row is what this code computes — nothing to score"
          fi

  # ---- 1b. did the code change move any NUMBER? -------------------------
  #
  # The engine fingerprint is a hash of `engine`, `webapi` and `cli`, so ANY
  # edit to them declares every stored score stale. Most edits cannot move a
  # number — a comment, a test, a validation rule, a field only the page reads —
  # and paying a full rescore for each is what stopped the board updating:
  # measured on the run of 2026-09-03, 128 shards, median 55 minutes and worst
  # 192, **7,808 minutes of work and four hours of wall clock** against a
  # schedule that fires every twenty. Every successor was discarded; eleven
  # engine commits in one morning meant no completed run for ten hours.
  #
  # SO IT IS MEASURED RATHER THAN GUESSED. Each shard re-scores its slice of one
  # published row per weapon and compares with what the board says. Identical
  # throughout and the code is score-equivalent: the numbers on the board are
  # what THIS code computes, so `--code-verified` lets the scorers reuse them.
  # One difference and `decide` says so and the full rescore happens.
  #
  # A SHARD NEVER FAILS THE RUN. "The numbers moved" is an ANSWER, not a broken
  # job, so the exit code is captured into a file and `decide` sums them.
  verify:
    needs: submissions
    if: needs.submissions.outputs.wired == 'true'
      && needs.submissions.outputs.rescore == 'true'
      && needs.submissions.outputs.full != 'true'
      && needs.submissions.outputs.moved == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.submissions.outputs.probe) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --bin wfsim-board
      - run: pip install --quiet pyyaml
      - name: reproduce this shard of the sample
        run: |
          set -euo pipefail
          mkdir -p verdict
          for f in boards/*.yaml; do
            id=$(basename "$f" .yaml)
            python3 scripts/board_sample.py "$f" > sample.json
            # `--verify-min 0`: a shard comparing three rows proves nothing on
            # its own, so the floor is applied ONCE, over the sum, in `decide`.
            set +e
            ./target/release/wfsim-board "$id" \
              --engine "${{ needs.submissions.outputs.engine }}" \
              --reuse "$f" --verify --verify-min 0 \
              --shard "${{ matrix.shard }}/${VERIFY_SHARDS}" \
              < sample.json > groups.txt 2> verify.log
            set -e
            # THE GROUPS THIS SHARD JUDGED, both halves. `decide` needs what
            # MOVED as well as what cleared: two shards can sample one group,
            # and a group clear in one and moved in the other is moved.
            cat groups.txt >> "verdict/${{ matrix.shard }}.txt"
            grep -o 'verify-result: .*' verify.log >> "verdict/${{ matrix.shard }}.txt" || true
            grep -o 'verify: .* -> .*' verify.log | head -5 || true
          done
          cat "verdict/${{ matrix.shard }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: verdict-${{ matrix.shard }}
          path: verdict/
          retention-days: 1

  # ---- 1c. …and the one place that answers it ---------------------------
  #
  # ALWAYS RUNS, because "the code did not move" and "the probe was skipped" are
  # both answers the scorers need, and a job that only runs on one path leaves
  # the others reading an empty output as false — which is the safe direction,
  # and worth being explicit about rather than relying on.
  decide:
    needs: [submissions, verify]
    if: always() && needs.submissions.outputs.wired == 'true'
    runs-on: ubuntu-latest
    outputs:
      equivalent: ${{ steps.v.outputs.equivalent }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: verdict-*
          merge-multiple: true
          path: verdict
      - id: v
        run: |
          set -euo pipefail
          # A PUSH NEVER RESCORES THE BOARD, and that is the rule this job now
          # serves. A fingerprint difference says a stored score is UNVERIFIED
          # under this generation, not that it is wrong — so the run scores what
          # is NEW, rescores the groups the probe MEASURED as moved, and leaves
          # the rest alone. Measured over one day of the other policy: five
          # cancelled full rescores, thousands of CPU minutes, and the board
          # published nothing at all, because each was superseded before it
          # finished. A full rescore is a button now (`full`), and `weapon` is
          # the narrow one beside it.
          #
          # `equivalent` therefore says "keep the stored scores", and it says it
          # whatever the probe managed. What the probe decides is the NARROWING
          # below: with a usable verdict the moved groups go back through the
          # fight, and without one nothing does — the board holds what it has
          # and says how old it is (§"The audit", `scored_at_epoch_seconds`).
          echo "equivalent=true" >> "$GITHUB_OUTPUT"
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "::notice::no usable probe (${{ needs.verify.result }}) — the board keeps what it has"
            exit 0
          fi
          sum() { cat verdict/*.txt 2>/dev/null \
            | awk -v k="$1" '{ for (i = 1; i <= NF; i++)
                                 if (index($i, k "=") == 1) n += substr($i, length(k) + 2) }
                             END { print n + 0 }'; }
          compared=$(sum compared)
          moved=$(sum moved)
          echo "probe: $compared rows reproduced, $moved moved"
          # WHAT CLEARED, PER BENCHMARK: every group some shard verified, minus
          # every group some shard saw move. The subtraction is the point — a
          # group split across two shards is only clear when BOTH said so.
          mkdir -p verified
          for f in boards/*.yaml; do
            id=$(basename "$f" .yaml)
            grep -h "^verified-group: $id " verdict/*.txt 2>/dev/null | awk '{print $3}' | sort -u > /tmp/ok || true
            grep -h "^moved-group: $id " verdict/*.txt 2>/dev/null | awk '{print $3}' | sort -u > /tmp/bad || true
            comm -23 /tmp/ok /tmp/bad > "verified/$id.txt" || true
            echo "$id: $(wc -l < "verified/$id.txt") group(s) clear of $(wc -l < /tmp/ok) judged"
          done
          # A HUNDRED ROWS IS THE FLOOR. A probe that compared almost nothing —
          # rows the floor screened away, or a board whose rows no longer
          # validate — proves nothing, and a verification that cannot fail is
          # worse than none.
          # A PROBE THAT COMPARED ENOUGH IS USABLE EVEN WHEN SOMETHING MOVED,
          # which is the whole change: the groups that moved are named, so the
          # rest can be reused instead of the board being rescored because one
          # row of it moved. What still decides nothing is a probe that could
          # not compare — a hundred rows is the floor, and under it the file is
          # empty and every row goes back through the fight.
          # A HUNDRED ROWS IS THE FLOOR, and under it the verdict is thrown away
          # rather than acted on: a probe that compared almost nothing proves
          # nothing, and the clear set it produced would send every group it
          # never judged back through the fight for no reason. Deleting the
          # files means no narrowing, which now means no rescore.
          if [ "$compared" -ge 100 ]; then
            echo "::notice::probe compared $compared rows, $moved moved — rescoring only the groups that moved"
          else
            echo "::notice::probe compared only $compared rows — no verdict, so the board keeps what it has"
            rm -f verified/*.txt
          fi

      # THE CLEAR SET TRAVELS AS ITS OWN ARTIFACT, always — an absent one and an
      # empty one say the same thing to the scorer, which is "reuse nothing",
      # and that is the safe direction for both.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-groups
          path: verified/
          retention-days: 1
          if-no-files-found: ignore

  # ---- 2. score, N ways at once -----------------------------------------
  #
  # Each shard simulates the submissions whose INDEX is its own and writes only
  # the scores it computed. It produces no board: a shard's view is a slice, and
  # a slice ranked on its own would be a leaderboard of a third of the field.
  score:
    needs: [submissions, decide]
    if: needs.submissions.outputs.wired == 'true'
      && needs.submissions.outputs.rescore == 'true'
      && needs.submissions.outputs.work != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.submissions.outputs.shards) }}
      # LEAVE THE MACHINE ROOM FOR THE CHECKS. Forty jobs is the account's whole
      # ceiling (docs/BOARD.md §"Two ceilings"), so a rescore that fans out to
      # all of it starves EVERY other workflow — CI queued behind a board run is
      # how a red build went two days unseen. The board is a background job and
      # CI is the one a person is waiting on, so eight slots stay free: a
      # rescore is a quarter longer against hours it already takes, and the
      # checks keep running while it does.
      max-parallel: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: submissions

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verified-groups
          path: verified
      - name: build the scorer
        run: cargo build --release --bin wfsim-board

      # REUSE IS EXACT, NOT AN APPROXIMATION. With the fingerprint unchanged the
      # stored score is the number this run would compute, so re-running the
      # fight would be spending an hour to reproduce it — and only submissions
      # with no row yet cost anything. The manual button skips the reuse and
      # rescores everything.
      - name: score this shard of every benchmark
        run: |
          set -euo pipefail
          mkdir -p scores
          # ...AND WHAT THE PROBE FOUND. `--code-verified` is the statement
          # that a sample of the published rows came back IDENTICAL under
          # this code, so reusing across the fingerprint difference is a
          # measurement rather than a hope. Empty on a full run, and on any
          # run where the probe did not clear the board.
          verified=""
          if [ "${{ needs.decide.outputs.equivalent }}" = "true" ]; then
            verified="--code-verified"
          fi
          # THE FORCED LIST, if the operator named one. It has to reach every
          # process that decides reuse: a shard that keeps a row the publish
          # pass drops leaves publish to compute it alone, at the end.
          FORCE=""
          if [ -n "${{ inputs.weapon }}" ]; then FORCE="--rescore ${{ inputs.weapon }}"; fi
          for f in data/benchmarks/*.yaml; do
            id=$(basename "$f" .yaml)
            prior=""
            [ "${{ needs.submissions.outputs.full }}" = "true" ] || prior="--reuse boards/$id.yaml"
            # THE NARROWING, and only when the probe produced one. An absent
            # file means no verdict, and no verdict now means nothing is
            # dropped — the opposite of what an EMPTY file would mean, so the
            # two are kept apart rather than collapsed into one flag.
            narrow=""
            if [ -s "verified/$id.txt" ]; then narrow="--verified-groups verified/$id.txt"; fi
            ./target/release/wfsim-board "$id" \
              --engine "${{ needs.submissions.outputs.engine }}" $prior $verified $FORCE \
              $narrow \
              --shard "${{ matrix.shard }}/${SHARDS}" \
              --emit-scores "scores/$id-${{ matrix.shard }}.json" \
              < submissions.json > /dev/null
          done

      - uses: actions/upload-artifact@v4
        with:
          name: scores-${{ matrix.shard }}
          path: scores/
          retention-days: 1

  # ---- 3. assemble the board and commit ---------------------------------
  #
  # With every score already computed this job simulates nothing: it validates,
  # deduplicates, ranks and writes. Measured locally at 0.064 s for the rows it
  # was given, against the 1.5 s the shards spent computing them.
  publish:
    needs: [submissions, decide, score]
    if: needs.submissions.outputs.wired == 'true'
      && needs.submissions.outputs.rescore == 'true'
      && needs.submissions.outputs.work != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # NAMING ONE PERMISSION SETS EVERY OTHER TO NONE, so the CI check below
      # needs its own line or the API answers 403, the check reads "unknown",
      # and a guard that fails open never fires at all.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: submissions
      - uses: actions/download-artifact@v4
        with:
          pattern: scores-*
          path: scores
          merge-multiple: true

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verified-groups
          path: verified
      - name: build the scorer
        run: cargo build --release --bin wfsim-board

      # TWO OUTPUTS: the canonical yaml, and the json the PAGE fetches.
      #
      # It does NOT regenerate the whole site: that fails on a clean runner
      # because `web/cache/img/` is gitignored, and the images are not even the
      # real problem. A board that changes hourly must not need a 2.5 MB wasm
      # rebuilt to reach anyone — install wasm-bindgen, fetch 300
      # images, recompile, to change a few numbers. The board is fetched at
      # runtime now, so this writes two small files and is done.
      - name: assemble every benchmark
        run: |
          set -euo pipefail
          # THE FORCED LIST, if the operator named one. It has to reach every
          # process that decides reuse: a shard that keeps a row the publish
          # pass drops leaves publish to compute it alone, at the end.
          FORCE=""
          if [ -n "${{ inputs.weapon }}" ]; then FORCE="--rescore ${{ inputs.weapon }}"; fi
          mkdir -p site
          # THE SAME VERDICT THE SCORERS WERE GIVEN, and this is the call
          # that matters most: it ASSEMBLES the board. Without the flag the
          # reuse is refused here and the board is written from the newly
          # scored rows alone -- which is not a stale board, it is an empty
          # one.
          verified=""
          if [ "${{ needs.decide.outputs.equivalent }}" = "true" ]; then
            verified="--code-verified"
          fi
          for f in data/benchmarks/*.yaml; do
            id=$(basename "$f" .yaml)
            prior=""
            # A BRAND-NEW BENCHMARK HAS NO BOARD YET, and that is a legal
            # state — the ruler exists before anyone has submitted to it. This
            # An unguarded `cp` aborts the whole publish job under `set -e`
            # when the file is missing, so ADDING A RULER would break the
            # hourly board until somebody hand-wrote an empty yaml. The
            # scoring step above does not have the problem: it
            # passes the path straight to the binary, which treats an
            # unreadable prior as "full rescore" and carries on.
            if [ "${{ needs.submissions.outputs.full }}" != "true" ]                && [ -f "boards/$id.yaml" ]; then
              # Read the board BEFORE it is overwritten: the loop writes in
              # place, so a copy is what the reuse actually reads.
              cp "boards/$id.yaml" "/tmp/$id-prior.yaml"
              prior="--reuse /tmp/$id-prior.yaml"
            fi
            # THE NARROWING, and only when the probe produced one. An absent
            # file means no verdict, and no verdict now means nothing is
            # dropped — the opposite of what an EMPTY file would mean, so the
            # two are kept apart rather than collapsed into one flag.
            narrow=""
            if [ -s "verified/$id.txt" ]; then narrow="--verified-groups verified/$id.txt"; fi
            ./target/release/wfsim-board "$id" site/board.json \
              --engine "${{ needs.submissions.outputs.engine }}" $prior $verified $FORCE \
              $narrow \
              --scores scores \
              < submissions.json > "boards/$id.yaml"
          done

      # ONLY ON CHANGE. Most hours nobody submits anything new, and a commit per
      # hour that says nothing is history nobody can read.
      #
      # AND IT NEVER REBASES THE RESULT. These files are GENERATED: there is no
      # sense in which two versions both hold something worth keeping, so a
      # three-way merge can only ever produce a conflict — which is exactly what
      # happened on 2026-08-11, throwing away 83 minutes of completed scoring at
      # the last step. The run that just scored holds the newest numbers; it
      # takes whatever base is current and writes them on top.
      # THE BOARD DOES NOT PUBLISH NUMBERS FROM CODE THAT FAILED ITS TESTS.
      #
      # CI ran red for two days and thirty-five pushes on a real defect — a
      # geometric boundary decided by the host's `acos`, so the runner swept one
      # body fewer than the rule says — and every hour of that the board went on
      # publishing melee numbers computed with it. Nothing connected the two:
      # scoring is hours, CI is minutes, and by publish time the answer has been
      # sitting there unread.
      #
      # KNOWN RED REFUSES; ANYTHING ELSE PROCEEDS. An API that will not answer,
      # a renamed workflow, a CI still running — none of those is evidence the
      # code is wrong, and stopping the board on infrastructure would trade a
      # loud problem for a silent one. A board held here says so in the log, and
      # the staleness arm of `audit.yml` says so again a day later.
      - name: did this commit's tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # THE TWO WAYS THIS LEARNS NOTHING ARE DIFFERENT FACTS. "No CI run for
          # this sha" is ordinary; "the API would not answer" means the guard is
          # not working, and a fail-open check that cannot say which has quietly
          # stopped being a check.
          if ! runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
                      --jq '[.workflow_runs[] | select(.name == "CI") | .conclusion // "running"] | join(",")' 2>&1); then
            echo "::warning::could not read CI for ${{ github.sha }} — publishing without that check"
            printf '%s\n' "$runs" | head -3
            exit 0
          fi
          echo "CI for ${{ github.sha }}: ${runs:-none}"
          case ",$runs," in
            *,failure,*|*,timed_out,*)
              echo "::error::CI failed for this commit — the board will not publish numbers from it"
              exit 1 ;;
          esac

      - name: commit if the board moved
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # WHAT THIS RUN GENERATED, named ONCE. The same list is diffed, held
          # across the reset, put back and added — and while it was four
          # literals, `data/board_state.yaml` was held by none of them: the
          # reset took it back to main's copy and `git add` then staged a file
          # identical to HEAD. The counts the PAGE reads froze on the day that
          # file landed while the boards beside it moved on, so the board
          # reported 1,168 builds waiting where 344 were.
          GENERATED="boards data/board_state.yaml site/board.json"
          if git diff --quiet -- $GENERATED; then
            echo "board unchanged — nothing to commit"
            exit 0
          fi
          for attempt in 1 2 3; do
            # Hold the generated files, take whatever main is now, put them back.
            rm -rf /tmp/out && mkdir -p /tmp/out
            cp -r --parents $GENERATED /tmp/out/
            git fetch origin main
            git reset --hard origin/main
            cp -r /tmp/out/. .
            if git diff --quiet -- $GENERATED; then
              echo "board already current on main — nothing to commit"
              exit 0
            fi
            git add $GENERATED
            # THE TIME, not just the date. Three runs an hour means a day of
            # "board: rescore 2026-08-09" is a wall of identical subjects, and the
            # one thing you want from this line is WHICH rescore you are looking
            # at.
            git commit -m "board: rescore $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push; then exit 0; fi
            echo "push raced (attempt $attempt) — taking the new base and rewriting"
          done
          echo "::error::could not land the board after three attempts"
          exit 1
