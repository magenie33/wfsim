# THE BOARD RUNS ITSELF. Nobody commits a leaderboard by hand.
#
# The repo owner never touches this: the bot scores, the bot commits, and
# Cloudflare deploys the push.
#
# THE CLOCK IS THE ONLY AUTOMATIC TRIGGER. A push does not wake the board, and
# that is deliberate: under convergence a pushed run does exactly what the next
# scheduled one does — score what is NEW, repair `REFRESH_MINUTES` of what this
# generation has not verified, publish — so it duplicates a run that is coming
# anyway while competing for the same forty slots. Measured over 95 runs: 21 of
# 22 pushed runs were cancelled by the next push, and the board published
# nothing. Ordinary work still reaches the board; the FINGERPRINT is what
# carries it, marking the rows a change reached as unverified so the slice
# repairs them.
#
# NOTHING AUTOMATIC EVER FIGHTS MORE THAN A SLICE, which is what makes the
# correctness rule affordable: a fingerprint difference says a stored score is
# UNVERIFIED, never that it is wrong, so the board CONVERGES at a rate this file
# sets instead of being re-derived whenever the code moves. A full rescore is a
# button (`full`), and `weapon` names rows at any precision beside it —
# docs/BOARD.md §"When the code moved".
#
# Scoring is embarrassingly parallel — every row is an independent fight — so it
# splits `SHARDS` ways and a merge job assembles the board from the scores. What
# that can and cannot buy is measured in docs/BOARD.md §"Two ceilings, and
# neither is the shard count".
name: board

on:
  schedule:
    # THREE TIMES AN HOUR, on the twenty. It was hourly at
    # :17 — off the hour on the theory that :00 queues behind everyone else,
    # which is true and turns out not to be worth optimising for: this repo's
    # own history shows the :17 runs landing at :33–:35, so GitHub's scheduler
    # slips ~15 minutes whatever minute you name. Naming :00 costs nothing that
    # was not already being paid, and naming three of them is what actually
    # makes the board fresh — a submission now waits ~20 minutes rather than an
    # hour, and the worst case is bounded instead of being "you just missed it".
    #
    # It is free to do: this repo is public, so Actions minutes are not metered,
    # and a run that finds nothing new commits nothing.
    - cron: "0,20,40 * * * *"
    # THE WEEKLY FULL RESCORE IS GONE, and `audit.yml` is what replaced it. It
    # rescored 22,977 rows every Monday whether or not anything had moved. The
    # audit reads a slice of the published board every hour, crosses all of it
    # in days, and REPORTS a row that is not what this code computes — without
    # rescoring anything and without gating this pipeline.
  workflow_dispatch:
    inputs:
      full:
        description: "rescore every row, even if the engine has not moved"
        type: boolean
        default: false
      # THE BACKSTOP FOR A NUMBER THE HASHES CANNOT SEE, and it goes as fine as
      # the case demands. A fingerprint answers "did an INPUT move", so a
      # correction it cannot see leaves a published number nobody can argue the
      # board out of. This names rows at any precision — a weapon, one of its
      # modes, the riven or the plain half of that mode, or a single row by its
      # key — and drops what is stored for those and nothing else, so the fix
      # costs minutes rather than the whole board. `;` separates several,
      # because a mod list is commas. A selector that matches nothing rescores
      # nothing and says so rather than passing quietly.
      weapon:
        description: "rescore these rows whatever the fingerprints say — weapon | weapon#mode | weapon#mode:plain | a whole row key; ';' between several"
        type: string
        default: ""

# THE SCHEDULE AND THE BUTTON KEEP SEPARATE GROUPS. The schedule is what drives
# convergence — every one of its runs repairs a slice — and standing those down
# behind a manual `full` would pause the mechanism the board updates by, which
# is the shape that starved it before.
#
# Splitting is safe because `publish` takes whatever `main` is now, writes the
# generated files on top and retries three times: two runs landing a board is
# last-writer-wins BY DESIGN, the same reasoning that made it refuse to rebase.
concurrency:
  group: board-${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
  cancel-in-progress: false

env:
  # HOW MANY WAYS THE SCORING SPLITS, and it is sized against the WORK, not
  # against the ceiling. A shard costs 2.6 minutes before it scores anything —
  # checkout, cache restore, load — so the split is only worth what it saves.
  # Forty jobs run at once whatever these say, and one 121-minute row is a floor
  # no split goes under: docs/BOARD.md §"Two ceilings, and neither is the shard
  # count".
  #
  # A FULL RESCORE IS 8,008 CPU MINUTES and stays above forty on purpose — the
  # extra shards are the tail, and dealing the long rows out early is what keeps
  # the last wave short.
  FULL_SHARDS: 128
  # AN ORDINARY RUN IS 5,553 ROWS, and the repair slice is the small half of it:
  # 984, against ~4,570 builds carrying no score yet. Splitting that 128 ways
  # pays 2.6 minutes of startup 128 times — 333 minutes of it, against 83 at
  # thirty-two — through the dozen-odd runners a free account is granted.
  SLICE_SHARDS: 32

  # HOW MUCH OF THE PAST EACH RUN REPAIRS, in minutes of measured work, and
  # HOW MANY NEVER-SCORED ROWS IT TAKES ON. Two budgets because there are two
  # backlogs: rows the board holds under an older generation, and builds it has
  # no score for at all. Leaving the second unbounded is what kept the board
  # from publishing — 4,570 rows a run had to clear before `publish` assembled
  # anything.
  #
  # A RUN HAS TO FIT INSIDE THE CADENCE THAT STARTS THE NEXT ONE: GitHub keeps
  # one pending run and cancels the rest. Together these come to ~940 rows,
  # about ten minutes of scoring a shard at `SLICE_SHARDS`.
  REFRESH_MINUTES: 15
  NEW_ROWS: 150
  # …AND THE CLOCK BEHIND BOTH, because only one of them predicts anything. A
  # repair is spent in seconds the last run MEASURED; a never-scored row has no
  # cost, so `NEW_ROWS` can only count — and rows differ 79x, which makes 150 of
  # them nine minutes or fifty depending on which builds arrived. The deadline
  # stops taking NEW work when the time is up, and only new work: a row not
  # taken is one that was not on the board anyway, where a repair not taken is
  # one that would vanish from it.
  SCORE_DEADLINE_MINUTES: 12

jobs:
  # ---- 1. what is there to score ----------------------------------------
  #
  # The KV read is its own job so the eight scorers do not each pay 3m43s for
  # the same list — and so they are all handed the SAME file, which is what
  # makes "shard by index" a split they agree on without talking.
  submissions:
    runs-on: ubuntu-latest
    outputs:
      wired: ${{ steps.wired.outputs.yes }}
      engine: ${{ steps.fp.outputs.engine }}
      shards: ${{ steps.shards.outputs.list }}
      shard_count: ${{ steps.shards.outputs.count }}
      full: ${{ steps.full.outputs.yes }}
      work: ${{ steps.work.outputs.yes }}
    steps:
      - uses: actions/checkout@v4

      # THE MATRIX AND THE COUNT COME FROM ONE PLACE, and they have to. The
      # scorer is told `--shard i/N` while the matrix is a list, so a list of
      # eight against an N of thirty-two tells eight jobs they are one of
      # thirty-two — and three quarters of the board is silently never scored.
      # Nothing fails; the rows keep their old numbers.
      - id: shards
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then n=$FULL_SHARDS; else n=$SLICE_SHARDS; fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          N=$n python3 -c "import json,os;print('list='+json.dumps(list(range(int(os.environ['N'])))))" >> "$GITHUB_OUTPUT"

      # WHAT A SCORE DEPENDS ON THAT IS NOT THE BUILD, as one hash: the code
      # that simulates, the data it simulates with, and the rulers. `data/`
      # MINUS the boards themselves — those are this job's own output, so
      # including them would move the fingerprint on every run and nothing would
      # ever be reused.
      #
      # A COOLDOWN WOULD HAVE BEEN THE WRONG AXIS:
      # time is not an input to a score. Untouched, a row is valid forever;
      # moved, it is wrong immediately. This asks the only question that matters
      # — "is anything different" — and answers it exactly.
      - name: what engine is this
        id: fp
        run: |
          set -euo pipefail
          # THE CODE, AND ONLY THE CODE — `scripts/engine_fingerprint.sh` says
          # what that means and why `data/` is not in it. It is a file rather
          # than a line here because the audit asks the same question and the
          # two answers have to be the same one.
          fp=$(bash scripts/engine_fingerprint.sh)
          echo "engine=$fp" >> "$GITHUB_OUTPUT"
          echo "engine fingerprint: $fp"
          # DID IT MOVE AT ALL? Logged and nothing more: what a difference
          # means is that the stored rows are unverified under this generation,
          # which the slice repairs at its own rate whatever this says. EVERY
          # board, and they must AGREE — two boards carrying different
          # fingerprints is a half-finished migration, and reading the first of
          # them would call it settled.
          was=$(grep -h '^engine:' boards/*.yaml 2>/dev/null | awk '{print $2}' | sort -u)
          if [ "$(printf '%s' "$was" | wc -l)" != "0" ] || [ "$was" != "$fp" ]; then
            echo "code moved: ${was:-unrecorded} -> $fp"
          fi

      # A FULL RESCORE IGNORES EVERY STORED SCORE. Two things ask for one: the
      # manual button, and the weekly backstop above.
      - id: full
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ "${{ github.event.schedule }}" = "0 0 * * 1" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; echo "FULL rescore"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      # NOT CONFIGURED YET IS NOT A FAILURE. Without the KV binding there is
      # nothing to read, and a job that fails hourly for a reason nobody is
      # acting on trains you to ignore the one that matters.
      - name: is the board wired up?
        id: wired
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACCOUNT" ]; then echo "yes=true" >> "$GITHUB_OUTPUT";
          else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::board storage not configured — see docs/BOARD.md"; fi

      # THE LIBRARY IS FETCHED ONCE AND THEN ONLY ADDED TO. `restore-keys` takes
      # the newest cache whatever run wrote it, while the `key` carries this run
      # id so every run SAVES one — which is what keeps the chain moving. A
      # miss costs a full listing and nothing depends on it.
      - name: restore the library
        if: steps.wired.outputs.yes == 'true'
        uses: actions/cache@v4
        with:
          path: library.json
          key: board-library-${{ github.run_id }}
          restore-keys: board-library-

      # WHAT THE LAST BOARD WAS BUILT FROM, as the floor this run may not fall
      # under. The boards carry `submissions: N`; the largest is the best
      # estimate of the library's real size, and 90% of it is the tripwire —
      # see `guard_shrink` in the script for why a short list is the danger.
      - name: what the last board was built from
        if: steps.wired.outputs.yes == 'true'
        id: floor
        run: |
          set -euo pipefail
          n=$(grep -h '^submissions:' boards/*.yaml 2>/dev/null \
                | awk '{print $2}' | sort -n | tail -1 || echo 0)
          n=${n:-0}
          echo "floor=$(( n * 9 / 10 ))" >> "$GITHUB_OUTPUT"
          echo "last board was built from $n submissions"

      # EVERY stored submission, every time — but FETCHED only once each. The
      # logic is a FILE rather than a block of yaml so that the thing tested is
      # the thing that runs: `scripts/fetch_submissions.sh --self-test` drives
      # it against a stub `curl`, and CI runs that.
      - name: read submissions
        if: steps.wired.outputs.yes == 'true'
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_NAMESPACE: ${{ secrets.CF_SUBMISSIONS_NAMESPACE_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: bash scripts/fetch_submissions.sh

      # THE LIST IS ALSO THE ONLY OFF-SITE COPY OF THE LIBRARY, which is the one
      # irreplaceable thing in this pipeline — the boards are derived from it,
      # the site is generated, the code is in git, and what players sent lives in
      # exactly one KV namespace. Thirty days of rolling artifacts costs nothing
      # and is the difference between "restore yesterday's" and "ask everyone to
      # submit again".
      - name: keep the list for the scorers
        if: steps.wired.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: submissions
          path: submissions.json
          retention-days: 30

      # THE SCORER, HERE TOO. One build against the shared cache, so the step
      # below can ask it what is left rather than guessing from a hash.
      - uses: actions/cache@v4
        if: steps.wired.outputs.yes == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - if: steps.wired.outputs.yes == 'true'
        run: cargo build --release --bin wfsim-board

      # IS THERE ANYTHING TO DO — ASKED BY WALKING, NOT BY DECLARING.
      #
      # A run where every row is reusable still fanned out to `SHARDS` jobs and
      # paid a checkout, a build and a cache restore for each, to write the board
      # it already had. `--dry-run` walks the boards exactly as a scoring run
      # does — the same validation, the same row fingerprints, the same reuse —
      # and counts what is left instead of fighting it, so the answer is the
      # SCORER'S OWN. A second opinion computed here could disagree with it, and
      # the direction it would disagree in is a board that quietly stops moving.
      #
      # ANYTHING IT CANNOT ANSWER MEANS WORK: a build that fails to validate, a
      # board that will not parse, a benchmark with no file. Being wrong that way
      # costs one run; being wrong the other way costs a board nobody updates.
      - name: is there anything to score
        id: work
        if: steps.wired.outputs.yes == 'true'
        run: |
          set -euo pipefail
          FORCE=""
          if [ -n "${{ inputs.weapon }}" ]; then FORCE="--rescore ${{ inputs.weapon }}"; fi
          # THE SAME SLICE THE SCORERS WILL TAKE, or this step counts work the
          # run is not going to do and the gate below reads it as busy. It needs
          # `--code-verified` for the same reason and more sharply: without it a
          # code difference drops every stored score before the slice can keep
          # any, so the count comes back as the whole board and the gate cannot
          # tell a slice from a rescore.
          SLICE="--refresh $(( REFRESH_MINUTES * 60 )) --new-limit $NEW_ROWS --deadline $(( SCORE_DEADLINE_MINUTES * 60 ))"
          if [ "${{ inputs.full }}" = "true" ]; then SLICE=""; fi
          todo=0
          for f in boards/*.yaml; do
            id=$(basename "$f" .yaml)
            line=$(./target/release/wfsim-board "$id" \
                     --engine "${{ steps.fp.outputs.engine }}" \
                     --reuse "$f" --code-verified --dry-run $FORCE $SLICE \
                     < submissions.json 2>&1 >/dev/null \
                   | grep -o 'dry-run: .*' || echo "dry-run: todo=1 (no answer)")
            echo "$id: $line"
            n=$(printf '%s' "$line" | grep -o 'todo=[0-9]*' | cut -d= -f2 || echo 1)
            todo=$(( todo + ${n:-1} ))
          done
          if [ "$todo" -gt 0 ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            echo "$todo rows to score"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::every row is what this code computes — nothing to score"
          fi

  # ---- 2. score, N ways at once -----------------------------------------
  #
  # Each shard simulates the submissions whose INDEX is its own and writes only
  # the scores it computed. It produces no board: a shard's view is a slice, and
  # a slice ranked on its own would be a leaderboard of a third of the field.
  score:
    needs: [submissions]
    if: needs.submissions.outputs.wired == 'true'
      && needs.submissions.outputs.work != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.submissions.outputs.shards) }}
      # LEAVE THE MACHINE ROOM FOR THE CHECKS. Forty jobs is the account's whole
      # ceiling (docs/BOARD.md §"Two ceilings"), so a rescore that fans out to
      # all of it starves EVERY other workflow — CI queued behind a board run is
      # how a red build went two days unseen. The board is a background job and
      # CI is the one a person is waiting on, so eight slots stay free: a
      # rescore is a quarter longer against hours it already takes, and the
      # checks keep running while it does.
      max-parallel: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: submissions

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verified-groups
          path: verified
      - name: build the scorer
        run: cargo build --release --bin wfsim-board

      # REUSE IS EXACT, NOT AN APPROXIMATION. With the fingerprint unchanged the
      # stored score is the number this run would compute, so re-running the
      # fight would be spending an hour to reproduce it — and only submissions
      # with no row yet cost anything. The manual button skips the reuse and
      # rescores everything.
      - name: score this shard of every benchmark
        run: |
          set -euo pipefail
          mkdir -p scores
          # A FINGERPRINT DIFFERENCE IS NOT A WRONG NUMBER. `--code-verified`
          # says so: a stored score under an older generation is UNVERIFIED,
          # and the slice below is what verifies it, at a bounded rate.
          # Whether any number actually moved is the AUDIT's question —
          # it inspects what is published and reports, hourly, gating nothing.
          verified="--code-verified"
          # THE FORCED LIST, if the operator named one. It has to reach every
          # process that decides reuse: a shard that keeps a row the publish
          # pass drops leaves publish to compute it alone, at the end.
          FORCE=""
          if [ -n "${{ inputs.weapon }}" ]; then FORCE="--rescore ${{ inputs.weapon }}"; fi
          for f in data/benchmarks/*.yaml; do
            id=$(basename "$f" .yaml)
            prior=""
            [ "${{ needs.submissions.outputs.full }}" = "true" ] || prior="--reuse boards/$id.yaml"
            # THE SLICE THIS RUN REPAIRS, and `full` takes none because it is
            # already fighting everything. Where the slice STARTS is the cursor
            # the last run stored in `data/board_state.yaml`, advanced by the
            # rows it took — the run number cannot do that job, because it steps
            # by one where a slice is hundreds of rows wide, and the board would
            # re-fight what it just repaired.
            slice=""
            if [ "${{ needs.submissions.outputs.full }}" != "true" ]; then
              slice="--refresh $(( REFRESH_MINUTES * 60 )) --new-limit $NEW_ROWS --deadline $(( SCORE_DEADLINE_MINUTES * 60 ))"
            fi
            ./target/release/wfsim-board "$id" \
              --engine "${{ needs.submissions.outputs.engine }}" $prior $verified $FORCE \
              $slice \
              --shard "${{ matrix.shard }}/${{ needs.submissions.outputs.shard_count }}" \
              --emit-scores "scores/$id-${{ matrix.shard }}.json" \
              < submissions.json > /dev/null
          done

      - uses: actions/upload-artifact@v4
        with:
          name: scores-${{ matrix.shard }}
          path: scores/
          retention-days: 1

  # ---- 3. assemble the board and commit ---------------------------------
  #
  # With every score already computed this job simulates nothing: it validates,
  # deduplicates, ranks and writes. Measured locally at 0.064 s for the rows it
  # was given, against the 1.5 s the shards spent computing them.
  publish:
    needs: [submissions, score]
    if: needs.submissions.outputs.wired == 'true'
      && needs.submissions.outputs.work != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # NAMING ONE PERMISSION SETS EVERY OTHER TO NONE, so the CI check below
      # needs its own line or the API answers 403, the check reads "unknown",
      # and a guard that fails open never fires at all.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: submissions
      - uses: actions/download-artifact@v4
        with:
          pattern: scores-*
          path: scores
          merge-multiple: true

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verified-groups
          path: verified
      - name: build the scorer
        run: cargo build --release --bin wfsim-board

      # TWO OUTPUTS: the canonical yaml, and the json the PAGE fetches.
      #
      # It does NOT regenerate the whole site: that fails on a clean runner
      # because `web/cache/img/` is gitignored, and the images are not even the
      # real problem. A board that changes hourly must not need a 2.5 MB wasm
      # rebuilt to reach anyone — install wasm-bindgen, fetch 300
      # images, recompile, to change a few numbers. The board is fetched at
      # runtime now, so this writes two small files and is done.
      - name: assemble every benchmark
        run: |
          set -euo pipefail
          # THE FORCED LIST, if the operator named one. It has to reach every
          # process that decides reuse: a shard that keeps a row the publish
          # pass drops leaves publish to compute it alone, at the end.
          FORCE=""
          if [ -n "${{ inputs.weapon }}" ]; then FORCE="--rescore ${{ inputs.weapon }}"; fi
          mkdir -p site
          # THE SAME FLAG THE SCORERS WERE GIVEN, and this is the call that
          # matters most: it ASSEMBLES the board. Without it the reuse is
          # refused here and the board is written from the newly scored rows
          # alone — which is not a stale board, it is an empty one.
          verified="--code-verified"
          for f in data/benchmarks/*.yaml; do
            id=$(basename "$f" .yaml)
            prior=""
            # A BRAND-NEW BENCHMARK HAS NO BOARD YET, and that is a legal
            # state — the ruler exists before anyone has submitted to it. This
            # An unguarded `cp` aborts the whole publish job under `set -e`
            # when the file is missing, so ADDING A RULER would break the
            # hourly board until somebody hand-wrote an empty yaml. The
            # scoring step above does not have the problem: it
            # passes the path straight to the binary, which treats an
            # unreadable prior as "full rescore" and carries on.
            if [ "${{ needs.submissions.outputs.full }}" != "true" ]                && [ -f "boards/$id.yaml" ]; then
              # Read the board BEFORE it is overwritten: the loop writes in
              # place, so a copy is what the reuse actually reads.
              cp "boards/$id.yaml" "/tmp/$id-prior.yaml"
              prior="--reuse /tmp/$id-prior.yaml"
            fi
            # THE SLICE THIS RUN REPAIRS, and `full` takes none because it is
            # already fighting everything. Where the slice STARTS is the cursor
            # the last run stored in `data/board_state.yaml`, advanced by the
            # rows it took — the run number cannot do that job, because it steps
            # by one where a slice is hundreds of rows wide, and the board would
            # re-fight what it just repaired.
            slice=""
            if [ "${{ needs.submissions.outputs.full }}" != "true" ]; then
              slice="--refresh $(( REFRESH_MINUTES * 60 )) --new-limit $NEW_ROWS --deadline $(( SCORE_DEADLINE_MINUTES * 60 ))"
            fi
            ./target/release/wfsim-board "$id" site/board.json \
              --engine "${{ needs.submissions.outputs.engine }}" $prior $verified $FORCE \
              $slice \
              --scores scores \
              < submissions.json > "boards/$id.yaml"
          done

      # ONLY ON CHANGE. Most hours nobody submits anything new, and a commit per
      # hour that says nothing is history nobody can read.
      #
      # AND IT NEVER REBASES THE RESULT. These files are GENERATED: there is no
      # sense in which two versions both hold something worth keeping, so a
      # three-way merge can only ever produce a conflict — which is exactly what
      # happened on 2026-08-11, throwing away 83 minutes of completed scoring at
      # the last step. The run that just scored holds the newest numbers; it
      # takes whatever base is current and writes them on top.
      # THE BOARD DOES NOT PUBLISH NUMBERS FROM CODE THAT FAILED ITS TESTS.
      #
      # CI ran red for two days and thirty-five pushes on a real defect — a
      # geometric boundary decided by the host's `acos`, so the runner swept one
      # body fewer than the rule says — and every hour of that the board went on
      # publishing melee numbers computed with it. Nothing connected the two:
      # scoring is hours, CI is minutes, and by publish time the answer has been
      # sitting there unread.
      #
      # KNOWN RED REFUSES; ANYTHING ELSE PROCEEDS. An API that will not answer,
      # a renamed workflow, a CI still running — none of those is evidence the
      # code is wrong, and stopping the board on infrastructure would trade a
      # loud problem for a silent one. A board held here says so in the log, and
      # the staleness arm of `audit.yml` says so again a day later.
      - name: did this commit's tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # THE TWO WAYS THIS LEARNS NOTHING ARE DIFFERENT FACTS. "No CI run for
          # this sha" is ordinary; "the API would not answer" means the guard is
          # not working, and a fail-open check that cannot say which has quietly
          # stopped being a check.
          if ! runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
                      --jq '[.workflow_runs[] | select(.name == "CI") | .conclusion // "running"] | join(",")' 2>&1); then
            echo "::warning::could not read CI for ${{ github.sha }} — publishing without that check"
            printf '%s\n' "$runs" | head -3
            exit 0
          fi
          echo "CI for ${{ github.sha }}: ${runs:-none}"
          case ",$runs," in
            *,failure,*|*,timed_out,*)
              echo "::error::CI failed for this commit — the board will not publish numbers from it"
              exit 1 ;;
          esac

      - name: commit if the board moved
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # WHAT THIS RUN GENERATED, named ONCE. The same list is diffed, held
          # across the reset, put back and added — and while it was four
          # literals, `data/board_state.yaml` was held by none of them: the
          # reset took it back to main's copy and `git add` then staged a file
          # identical to HEAD. The counts the PAGE reads froze on the day that
          # file landed while the boards beside it moved on, so the board
          # reported 1,168 builds waiting where 344 were.
          GENERATED="boards data/board_state.yaml site/board.json"
          if git diff --quiet -- $GENERATED; then
            echo "board unchanged — nothing to commit"
            exit 0
          fi
          for attempt in 1 2 3; do
            # Hold the generated files, take whatever main is now, put them back.
            rm -rf /tmp/out && mkdir -p /tmp/out
            cp -r --parents $GENERATED /tmp/out/
            git fetch origin main
            git reset --hard origin/main
            cp -r /tmp/out/. .
            if git diff --quiet -- $GENERATED; then
              echo "board already current on main — nothing to commit"
              exit 0
            fi
            git add $GENERATED
            # THE TIME, not just the date. Three runs an hour means a day of
            # "board: rescore 2026-08-09" is a wall of identical subjects, and the
            # one thing you want from this line is WHICH rescore you are looking
            # at.
            git commit -m "board: rescore $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push; then exit 0; fi
            echo "push raced (attempt $attempt) — taking the new base and rewriting"
          done
          echo "::error::could not land the board after three attempts"
          exit 1
