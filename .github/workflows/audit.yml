# DOES THE BOARD STILL SAY WHAT THIS CODE COMPUTES?
#
# The board publishes numbers nobody re-derives. Every other check here asks
# whether the code is right; this one asks whether the FILE still agrees with
# the code, which is a different question and the only one that catches a score
# reused when it should not have been.
#
# It is the backstop that the weekly full rescore was, in the shape a backstop
# should have: a slice at a time, for ever, taking one job out of the account's
# forty rather than all of them for an afternoon. `--crossing` says how many
# runs it takes to read the whole board, so the number this is judged by —
# how long the audit needs to cross the store — is the knob itself.
#
# IT PUBLISHES NOTHING and gates nothing. Its only outputs are a count when the
# numbers agree and a failure when they do not.
name: audit

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

# ONE AUDIT AT A TIME, and a queued one is worth nothing: the next run reads the
# next slice anyway, so cancelling is losing a slice rather than losing work.
# Its own group, because it must never be what cancels a board run.
concurrency:
  group: audit
  cancel-in-progress: true

env:
  # HOW MANY RUNS IT TAKES TO READ THE WHOLE BOARD. Hourly against 84 puts a
  # full crossing at three and a half days and each run at about 38 minutes of
  # measured work — one job, so 2.5% of the concurrency ceiling and under 2% of
  # a day's free CPU. Lower it to cross faster; the cost is linear and the
  # ceiling it eats into is stated in docs/BOARD.md §"Two ceilings".
  CROSSING: 84

  # HOW LONG THE BOARD MAY GO WITHOUT MOVING before that is itself the finding.
  # A rescore is hours, not days, so a day of silence means the pipeline stopped
  # rather than that nothing was submitted — the state that has gone unnoticed
  # every time it happened, because the only thing watching was a reader
  # wondering where their build went.
  STALE_HOURS: 24

  # HOW MANY MOVED ROWS THIS WILL REPAIR ON ITS OWN. Past it the finding stops
  # being a repair and becomes a question: a hundred rows moving at once is a
  # ruler's terms or a fight-wide constant, not a hundred separate defects, and
  # a human should read it before an hour of compute goes into the symptom.
  REPAIR_CAP: 40

jobs:
  audit:
    runs-on: ubuntu-latest
    # ENOUGH TO FILE THE WARRANT AND NOTHING ELSE. `actions: write` starts the
    # board's manual rescore; the token cannot write to the repository, which is
    # what keeps an inspector from publishing.
    permissions:
      contents: read
      actions: write
    steps:
      # DEEP ENOUGH TO FIND THE LAST BOARD COMMIT, and no deeper. A board that
      # has not moved inside two hundred commits is stale by any reading, so a
      # search that comes back empty answers the question rather than failing to.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - run: cargo build --release --bin wfsim-board
      - run: pip install --quiet pyyaml

      # HAS THE BOARD MOVED AT ALL. A rescore is hours, not days, so a day of
      # silence means the pipeline stopped rather than that nothing was
      # submitted — the state that went unnoticed every time it happened.
      - name: how far behind is the board
        id: age
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct -- boards || true)
          hours=$(( ( $(date +%s) - ${last:-0} ) / 3600 ))
          echo "the last board commit was ${hours}h ago"
          if [ "$hours" -ge "$STALE_HOURS" ]; then
            echo "::error::the board has not moved in ${hours}h — the pipeline stopped, or nothing it scored was publishable"
            exit 1
          fi

      # THE SLICE. It runs whatever the code has done since the board was
      # written, because that is the question: a published number either is what
      # this code computes or it is not, and no hash can answer it. There is no
      # code fingerprint to stand down behind any more.
      - name: read this run's slice of the board
        run: |
          set -euo pipefail
          : > result.txt
          : > moved.txt
          for f in boards/*.yaml; do
            id=$(basename "$f" .yaml)
            python3 scripts/board_sample.py "$f" \
              --crossing "$CROSSING" --bucket "${{ github.run_number }}" > sample.json
            # `--verify-min 0`: the floor is applied ONCE, over the three boards,
            # in the step below — a board whose slice held four rows proves
            # little alone and the three together prove what they prove.
            set +e
            ./target/release/wfsim-board "$id" \
              --reuse "$f" --verify --verify-min 0 \
              < sample.json > /dev/null 2> verify.log
            set -e
            grep -o 'verify-result: .*' verify.log >> result.txt || true
            # THE ROWS THEMSELVES, so the finding below can be acted on rather
            # than only counted. A row line is `verify: <key> <was> -> <now>`;
            # the other `verify:` lines carry no arrow.
            grep -o 'verify: [^ ]* .* -> .*' verify.log | awk '{print $2}' >> moved.txt || true
            grep -o 'verify: .* -> .*' verify.log | head -3 || true
          done
          cat result.txt

      # WHAT IT FOUND, AND THE TEST IS EXACT. A score is a pure function of its
      # inputs and the carry between the scoring processes is lossless, so any
      # difference at all is one — "close enough" would be a tolerance nobody
      # can defend. `worst` rides along because it is the first thing a reader
      # wants when a row is reported: a defect moves a number by orders of
      # magnitude where a numerical artefact moves it by a bit.
      - name: the verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sum() { awk -v k="$1" '{ for (i = 1; i <= NF; i++)
                                     if (index($i, k "=") == 1) n += substr($i, length(k) + 2) }
                                   END { print n + 0 }' result.txt; }
          compared=$(sum compared); moved=$(sum moved); stale=$(sum stale)
          echo "audited $compared rows: $moved differ"
          # NOTHING TO AUDIT IS NOT A FINDING. A row whose DATA fingerprint moved
          # carries no number under this generation, so it is not a claim yet —
          # which is the state right after a data change and until the backfill
          # reaches those rows.
          if [ "$compared" -eq 0 ] && [ "$stale" -gt 0 ]; then
            echo "::notice::$stale rows in this slice have no score under the current data yet"
            exit 0
          fi
          # AN EMPTY SLICE WITH NOTHING STALE IS THE SAMPLER, and an audit that
          # cannot fail is worse than none. Twenty is the floor the probe uses
          # per shard; three boards' slices clear it easily unless the sampler
          # or the board changed shape underneath.
          if [ "$compared" -lt 20 ]; then
            echo "::error::only $compared rows compared and $stale stale — the slice is empty, so this run audited nothing"
            exit 1
          fi
          if [ "$moved" -gt 0 ]; then
            echo "::error::$moved of $compared published rows are not what this code computes"
            # THE WARRANT, NOT JUST THE CHARGE. This job rescores nothing — it
            # is an inspector — so what it owes the operator is the selector
            # that repairs exactly what it found. `board_select.py` widens it
            # to everything sharing the changed mechanic; the button takes
            # either. docs/BOARD.md §"Two backstops".
            sel=$(sort -u moved.txt | paste -sd';' -)
            # …AND THE WARRANT IS SERVED. The inspector does not rescore — it
            # presses the button somebody would otherwise press by hand, with
            # the rows it just proved are not what this code computes. That is
            # the whole invalidation mechanism: no hash declares a row stale,
            # a MEASUREMENT does, and only the rows it measured.
            #
            # A CAP, because a finding this large is not a row to repair but a
            # question to ask. Something systemic moved — the ruler's terms, the
            # metric, a fight-wide constant — and rescoring a hundred rows one
            # by one would bury that under an hour of compute.
            n=$(sort -u moved.txt | wc -l)
            if [ "$n" -le "$REPAIR_CAP" ]; then
              if gh workflow run board.yml -f weapon="$sel"; then
                echo "::notice::filed a rescore for $n row(s)"
              else
                echo "::notice::could not file a rescore — Actions -> board -> Run workflow, weapon = $sel"
              fi
            else
              echo "::notice::$n rows moved, over the cap of $REPAIR_CAP — read it before rescoring: $sel"
            fi
            exit 1
          fi
          echo "::notice::$compared rows agree with the board (crossing every $CROSSING runs)"
