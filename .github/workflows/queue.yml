# THE WORK LIST IS KEPT CURRENT ON THE CLOCK. NOTHING HERE COMPUTES A ROW.
#
# The pipeline is five tables and this file drives the first half of it:
#
#   inbox   what a player sent, verbatim   ─┐ this file, hourly, one runner
#   builds  the library, one row a build    │
#   queue   what is owed                   ─┘
#   scores  the facts                      ─┐ scores.yml, on the button, as many
#   board   the published files            ─┘ shards as the work needs
#
# NAMED FOR WHERE IT ENDS, the same way `scores.yml` is. `intake` is the hop from
# `inbox` to `builds` and it is one STEP here — the word is also already spoken
# for by `docs/WEAPON_INTAKE.md`, which is a different subject entirely.
#
# WHY THE CLOCK BELONGS ON THIS HALF. A submission is the one thing in this
# system nobody can derive — an inbox row is its only record — so the sooner it
# becomes a build the sooner it is safe, and `/api/board/pending` stops counting
# a queue nobody has read. The measuring half has no such urgency: a row with no
# score keeps not having one until somebody asks.
#
# AND HOURLY IS WHAT MAKES INTAKE CHEAP. It resolves a riven's card by FIGHTING
# — about four core-minutes for the one submission in ten that needs it — which
# is an hour's lump once a day and two or three minutes on the hour. The same
# work, paid in a size that fits beside everything else.
#
# ONCE A NIGHT IT ALSO SWEEPS. Nothing in this pipeline retires a fact on its
# own — a board is a claim about what the code computes TODAY, and a row nobody
# has looked at since an engine six weeks ago is a claim nobody has checked. The
# sweep asks for the weapons that have gone longest, whole, up to a fifth of the
# library a night, so forgetting to rescore by hand costs days rather than
# months. It only ever ADDS to the queue; the hourly scorer pays for it in the
# hours after.
name: queue

on:
  schedule:
    # ON THE HOUR. The scheduler slips about fifteen minutes whatever minute is
    # named, so an off-the-hour one buys a precision this does not have.
    - cron: "0 * * * *"
    # …AND ONCE A NIGHT, THE SWEEP. 16:00 UTC is midnight in China, the quiet
    # hour: a night's batch is up to a fifth of the library and the hourly
    # scorer spends the rest of the night on it.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      sweep:
        description: "also enqueue the nightly sweep"
        type: boolean
        default: false
      rescore:
        description: "ask for EVERY row of one ruler again (a benchmark id)"
        type: string
        default: ""

# ONE AT A TIME, AND THE RUNNING ONE WINS. Two of these would both read the same
# inbox and derive the same builds — writing one row twice, which is harmless —
# but they would also both reconcile, and the second would ask again for
# everything the first has not finished measuring. Cancelling the NEW one keeps
# the hour that is already paid for.
concurrency:
  group: board-queue
  cancel-in-progress: false

jobs:
  take-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOT CONFIGURED YET IS NOT A FAILURE. Without the credentials there is
      # nothing to read, and a job that fails hourly for a reason nobody is
      # acting on trains you to ignore the one that matters.
      - name: is the board wired up?
        id: wired
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACCOUNT" ]; then echo "yes=true" >> "$GITHUB_OUTPUT";
          else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::board storage not configured — see docs/BOARD.md"; fi

      - uses: actions/cache@v4
        if: steps.wired.outputs.yes == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - if: steps.wired.outputs.yes == 'true'
        run: cargo build --release --bin wfsim-intake --bin wfsim-board

      # ---- THE QUEUE BECOMES THE LIBRARY --------------------------------
      #
      # The door has no game data, so a submission arrives VERBATIM in `inbox`
      # and nothing has yet said what build it is: telling two apart needs the
      # mod pool, because an elemental card enters the element sequence and a
      # plain one does not, and the sequence decides the pairing. `wfsim-intake`
      # has the engine and does that here.
      #
      # THE BUILDS LAND BEFORE THE QUEUE ROWS ARE SPENT, which is `ship_builds`'
      # own rule: stopped in between, the inbox still holds what the library is
      # missing and the next hour derives the same ids.
      #
      # …AND IT ASKS FOR THE FIGHT EACH ARRIVAL NAMED (`--asked`). A build has no
      # ruler and no mode — `canonical` drops both — so this pass is the only
      # place that still knows which board somebody was on, and the row it writes
      # is the ONE fight a build nothing has measured is owed. It is NOT gated:
      # somebody pressing upload is a person asking, so a build the entry line
      # parked is re-measured on the fight they just ran it in.
      - name: take in what has arrived
        if: steps.wired.outputs.yes == 'true'
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          CF_D1_DATABASE=$(sed 's|^[[:space:]]*//.*$||' wrangler.jsonc \
            | jq -r '.d1_databases[0].database_id // empty')
          export CF_D1_DATABASE
          bash scripts/fetch_inbox.sh inbox.ndjson
          ./target/release/wfsim-intake --done done.txt --asked asked.ndjson \
            < inbox.ndjson > builds.ndjson
          bash scripts/ship_builds.sh builds.ndjson done.txt
          # AFTER THE BUILDS, because a queue row naming a build the library does
          # not hold is a row nothing can ever take.
          bash scripts/ship_queue.sh "arrivals-$(date -u +'%Y-%m-%d')" \
            "the fight each arrival was run in" asked.ndjson

      # ---- …AND WHAT HAS NO SCORE IS ASKED FOR --------------------------
      #
      # `builds x rulers x modes` is the DEFINITION of what should exist, and
      # this closes the gap to it. It ADDS ONLY, and only rows that have no
      # score, so running it every hour asks for nothing twice: the queue's own
      # primary key absorbs a repeat.
      - name: ask for what has no score
        if: steps.wired.outputs.yes == 'true'
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          CF_D1_DATABASE=$(sed 's|^[[:space:]]*//.*$||' wrangler.jsonc \
            | jq -r '.d1_databases[0].database_id // empty')
          export CF_D1_DATABASE
          bash scripts/fetch_library.sh library.json
          bash scripts/fetch_facts.sh facts-known.ndjson
          bash scripts/reconcile_queue.sh library.json facts-known.ndjson queue.ndjson
          # WHAT IS OWED, SAID OUT LOUD, because this job publishes nothing and
          # a reader has to be able to see it did something.
          echo "::notice::$(grep -c . queue.ndjson || echo 0) row(s) owed after this hour"

      # ---- …AND ONCE A NIGHT, WHAT HAS GONE LONGEST -----------------------
      #
      # THE SAFETY NET, AND IT SAYS NOTHING ABOUT WHETHER A NUMBER IS WRONG. A
      # board is a claim about what this code computes TODAY, and a row measured
      # under an engine six weeks old is a claim nobody has checked since. What
      # retires a fact on purpose is still a person deleting or enqueueing it;
      # this is what happens when nobody remembers to be that person.
      #
      # WHOLE WEAPONS, up to a FIFTH of the library a night — a weapon's file is
      # written whole, so half of one re-measured ranks two generations against
      # each other, and a fifth a night crosses all of it in five. It only ever
      # ADDS to the queue; the hourly scorer pays for it in the hours after,
      # which is what spreads the bill.
      #
      # ITS OWN BATCH, NAMED FOR THE NIGHT, so a person can see it, reorder it
      # ahead of the arrivals, or drop it — `DELETE FROM batches WHERE id = ?`.
      #
      # AND IT OBEYS THE ENTRY LINE (`--gate`), which is where that line pays
      # for itself: arrivals are a one-off bill and this one recurs every five
      # nights for ever, so a build nothing would publish would be re-measured
      # for the life of the board.
      - name: ask for what has gone longest
        if: steps.wired.outputs.yes == 'true'
          && (github.event.schedule == '0 16 * * *' || inputs.sweep)
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          STALE_DAYS: 7
          SWEEP_SHARE: 5
        run: |
          set -euo pipefail
          CF_D1_DATABASE=$(sed 's|^[[:space:]]*//.*$||' wrangler.jsonc \
            | jq -r '.d1_databases[0].database_id // empty')
          export CF_D1_DATABASE
          bash scripts/pick_stale.sh "$STALE_DAYS" "$SWEEP_SHARE" > weapons.txt
          if [ ! -s weapons.txt ]; then
            echo "::notice::sweep: nothing has gone $STALE_DAYS days unmeasured"
            exit 0
          fi
          : > sweep.ndjson
          for f in data/benchmarks/*.yaml; do
            id=$(basename "$f" .yaml)
            ./target/release/wfsim-board "$id" \
              --dry-run \
              --gate \
              --facts-in facts-known.ndjson \
              --queue-in queue.ndjson \
              --queue-weapons weapons.txt \
              --queue-missing "sweep-$id.ndjson" \
              < library.json > /dev/null
            cat "sweep-$id.ndjson" >> sweep.ndjson
          done
          bash scripts/ship_queue.sh "sweep-$(date -u +'%Y-%m-%d')" \
            "$(wc -l < weapons.txt) weapon(s) nobody had measured in $STALE_DAYS days" \
            sweep.ndjson
          echo "::notice::sweep: $(grep -c . sweep.ndjson || echo 0) row(s) from $(wc -l < weapons.txt) weapon(s)"

      # ---- …AND A RULER WHOSE MODEL MOVED --------------------------------
      #
      # A MEASUREMENT CORRECTS THE MODEL AND EVERY ROW UNDER IT IS OWED AGAIN,
      # and nothing else asks for those. A stored score is reused because it
      # EXISTS — no clock, no fingerprint, no binary in the key — and the
      # nightly sweep only reaches what has gone STALE_DAYS unmeasured, which a
      # row measured this week has not. This is the button docs/BOARD.md means
      # by "what retires a fact is a person".
      #
      # ONE RULER, EVERY WEAPON. A model change is not a property of a weapon,
      # so half a board re-measured is a ranking of two generations against each
      # other — the same reason the sweep takes whole weapons.
      #
      # IT ONLY ADDS. The old numbers stay published until a new one replaces
      # each row, so asking costs the board nothing while it is being paid; the
      # hourly scorer spends it down like any other batch, and the batch is its
      # own so a person can drop it — `DELETE FROM batches WHERE id = ?`.
      #
      # AND IT DOES NOT PASS `--gate`. A corrected model is exactly the case
      # where a build the entry line parked may deserve another look, and a
      # person asking is the one thing in this pipeline that overrides a fact.
      # Every other path into the queue is gated; this one is the override.
      - name: ask for every row of one ruler again
        if: steps.wired.outputs.yes == 'true' && inputs.rescore != ''
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # THE INPUT NEVER REACHES THE SHELL AS TEXT. A `workflow_dispatch`
          # string interpolated into `run:` is executed by it; through the
          # environment it is only ever a value.
          RULER: ${{ inputs.rescore }}
        run: |
          set -euo pipefail
          # AN ID, AND THEN A RULER THAT EXISTS. The pattern is what keeps this
          # out of the filesystem, and the file is what keeps it a real board:
          # the name becomes a path and a batch id below.
          case "$RULER" in
            *[!a-z0-9_]*|"") echo "::error::not a benchmark id: $RULER"; exit 1 ;;
          esac
          [ -f "data/benchmarks/$RULER.yaml" ] \
            || { echo "::error::no such ruler: $RULER"; exit 1; }
          CF_D1_DATABASE=$(sed 's|^[[:space:]]*//.*$||' wrangler.jsonc \
            | jq -r '.d1_databases[0].database_id // empty')
          export CF_D1_DATABASE
          # EVERY WEAPON THE LIBRARY HOLDS, which is what makes `--queue-weapons`
          # list a row that already has a fact — the one path in this tool that
          # asks for something already measured.
          jq -r '.[].weapon' library.json | sort -u > weapons.txt
          ./target/release/wfsim-board "$RULER" \
            --dry-run \
            --facts-in facts-known.ndjson \
            --queue-in queue.ndjson \
            --queue-weapons weapons.txt \
            --queue-missing rescore.ndjson \
            < library.json > /dev/null
          bash scripts/ship_queue.sh "rescore-$RULER-$(date -u +'%Y-%m-%d')" \
            "every row of $RULER, asked again after a model change" \
            rescore.ndjson
          echo "::notice::rescore: $(grep -c . rescore.ndjson || echo 0) row(s) of $RULER from $(wc -l < weapons.txt) weapon(s)"
