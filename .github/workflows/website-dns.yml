name: website dns
on:
  workflow_dispatch:
    inputs:
      apply:
        description: switch the website after TLS and release validation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: website-dns
  cancel-in-progress: false
jobs:
  website-dns:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: check or switch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DNS_TOKEN || secrets.CF_WORKERS_TOKEN }}
          WEBSITE_TARGET: ${{ secrets.WEBSITE_TARGET }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = true ]; then python3 scripts/website_dns.py --apply;
          else python3 scripts/website_dns.py; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: website-dns-receipt
          path: website-dns-*.json
          if-no-files-found: ignore
