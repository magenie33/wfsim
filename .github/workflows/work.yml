name: Work prices

# THE TWO PRICES OF A FIGHT'S WORK — a million gas and a run
# (engine/src/fight/gas.rs, docs/WASM.md §"Gas"). The engine is built from the
# ref this runs on exactly as the site builds it, four hosted runners time it
# over the same board rows, and the price BETWEEN the two terms is fit to each
# row's MEDIAN time across them, so no one machine, and no owner's machine,
# sets it. The SCALE is set on what volunteers were paid: their credited board
# answers of the last days, priced anew, total `total` times what they were.
# Node is pinned: its V8 is the wasm engine being timed. Run by hand, on a
# branch before its engine ships; it prints the two constants to paste.

on:
  workflow_dispatch:
    inputs:
      rows:
        description: board rows to time
        default: "300"
      total:
        description: "new total over old total of the volunteers' paid answers, 1.00-1.20"
        default: "1.015"
      days:
        description: days of paid answers the total is taken over
        default: "7"
      sample:
        description: paid questions fought natively for their exact count
        default: "400"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with mise.toml
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the engine the site would ship, and its native twin
        run: |
          cargo build --release -p wfsim-wasm --target wasm32-unknown-unknown
          cargo build --release -p wfsim-cli --bin wfsim-gas
          # wasm-bindgen at Cargo.lock's version; binaryen at the site build's.
          bindgen=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/$bindgen/wasm-bindgen-$bindgen-x86_64-unknown-linux-musl.tar.gz" | tar xz
          "./wasm-bindgen-$bindgen-x86_64-unknown-linux-musl/wasm-bindgen" target/wasm32-unknown-unknown/release/wfsim_wasm.wasm --target no-modules --no-typescript --out-dir pkg
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz | tar xz
          ./binaryen-version_132/bin/wasm-opt -Oz -o pkg/wfsim_wasm_bg.wasm pkg/wfsim_wasm_bg.wasm
          cp target/release/wfsim-gas pkg/
      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: pkg

  measure:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      matrix:
        machine: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - uses: actions/download-artifact@v4
        with:
          name: pkg
          path: pkg
      - name: Time the board's rows
        run: node scripts/work_calibrate.mjs measure out=measure-${{ matrix.machine }}.json rows=${{ inputs.rows }} pkg=pkg
      - uses: actions/upload-artifact@v4
        with:
          name: measure-${{ matrix.machine }}
          path: measure-${{ matrix.machine }}.json

  # WHAT VOLUNTEERS WERE PAID, read once and fought natively — the native
  # engine counts what the wasm does (check_gas). Its report names no account.
  sample:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - uses: actions/download-artifact@v4
        with:
          name: pkg
          path: pkg
      - name: the databases
        uses: ./.github/actions/databases
        with:
          db_accounts: ${{ vars.DB_ACCOUNTS }}
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          pg_accounts_url: ${{ secrets.PG_ACCOUNTS_PIPELINE_URL }}
      - name: Read and fight the paid answers
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # THE PAID QUESTIONS ARE THE FACTORY'S to say (worker/factory.js `report`).
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          FACTORY_ORIGIN: https://wfsim.mgnmz1999.workers.dev
        run: |
          set -euo pipefail
          chmod +x pkg/wfsim-gas
          ids=$(sed 's|^[[:space:]]*//.*$||' wrangler.jsonc | jq -r '.d1_databases[] | "\(.binding)=\(.database_id)"')
          export CF_D1_DATABASE=$(echo "$ids" | sed -n 's/^LIBRARY=//p') CF_D1_ACCOUNTS=$(echo "$ids" | sed -n 's/^ACCOUNTS=//p')
          node scripts/work_calibrate.mjs sample out=work-sample.json days=${{ inputs.days }} rows=${{ inputs.sample }} native=pkg/wfsim-gas
      - uses: actions/upload-artifact@v4
        with:
          name: sample
          path: work-sample.json

  fit:
    needs: [measure, sample]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
      - name: Fit the prices
        run: |
          node scripts/work_calibrate.mjs fit measure-*.json sample=work-sample.json total=${{ inputs.total }} | tee fit.txt
          { echo '```'; cat fit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fit
          path: |
            fit.txt
            measure-*.json
