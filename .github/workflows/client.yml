name: CLI
on:
  pull_request:
    paths: ["client/**", "desktop/src/trust.rs", "mcp/headless.js", "tests/client_payloads.json", "tests/client_search.json", "scripts/check_client_launcher.mjs", "scripts/check_client_update.mjs", "scripts/sign_client_release.mjs", "scripts/build_client_release.mjs", "scripts/release_client.py", "scripts/client_release_files.mjs", "scripts/check_client_release.mjs", "scripts/client_cors.py", "scripts/check_client_cors.py", "scripts/check_client_manifest.mjs", "worker/client_release.js", ".github/workflows/client.yml", ".github/workflows/client-release.yml"]
  push:
    branches: [main]
    paths: ["client/**", "desktop/src/trust.rs", "mcp/headless.js", "tests/client_payloads.json", "tests/client_search.json", "scripts/check_client_launcher.mjs", "scripts/check_client_update.mjs", "scripts/sign_client_release.mjs", "scripts/build_client_release.mjs", "scripts/release_client.py", "scripts/client_release_files.mjs", "scripts/check_client_release.mjs", "scripts/client_cors.py", "scripts/check_client_cors.py", "scripts/check_client_manifest.mjs", "worker/client_release.js", ".github/workflows/client.yml", ".github/workflows/client-release.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node scripts/check_client_release.mjs
      - run: node scripts/check_client_manifest.mjs
      - run: python scripts/check_client_cors.py
      - run: cargo fmt --check --manifest-path client/Cargo.toml
      - run: cargo clippy --locked --manifest-path client/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path client/Cargo.toml
      - run: cargo build --locked --manifest-path client/Cargo.toml
      - run: node scripts/check_client_update.mjs
      - run: node scripts/check_client_launcher.mjs
