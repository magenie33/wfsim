name: CLA

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to recheck against the current signature record
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  signed:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The script and signature record come from the trusted base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Check recorded consent for the pull request and its authors
        id: cla
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check_cla.mjs "$NUMBER" "$EXPECTED_HEAD"
      - name: Record the result on the exact pull request commit
        if: ${{ !cancelled() && (steps.cla.outputs.head_sha || github.event.pull_request.head.sha) }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.cla.outputs.head_sha || github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.cla.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            state=success
            description='Contribution rights are recorded'
          else
            state=failure
            description='Contribution rights need review'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context=cla -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
