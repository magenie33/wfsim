name: stage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-cache-publish
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pull the complete public cache
        run: python3 scripts/build_cache.py public-pull
      - name: Merge and verify the pinned image inputs
        run: python3 .release-cache/publish.py prepare
      - name: Publish the complete cache
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_ACCELERATE: '1'
        run: python3 scripts/build_cache.py push
      - name: Verify the public archive and every image
        run: python3 .release-cache/publish.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-cache-receipt
          path: cache-receipt.json
