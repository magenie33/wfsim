name: stage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-input-cache
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --quiet pyyaml
      - name: restore the complete public input cache
        run: python scripts/build_cache.py public-pull
      - name: fetch and validate the declared game images
        run: python scripts/fetch_images.py
      - name: validate all declared build inputs
        run: python scripts/build_site_app.py --check-inputs
      - name: publish compatible input cache additions
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: python scripts/build_cache.py push
