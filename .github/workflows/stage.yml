name: stage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-input-cache
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --quiet pyyaml==6.0.3
      - name: restore the complete public input cache
        run: python scripts/build_cache.py public-pull
      - name: add the verified JavaScript runtime alias
        run: python scripts/ocr_cache_alias.py
      - name: validate every declared build input
        run: python scripts/build_site_app.py --check-inputs
      - name: publish additive compatible input cache
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_ACCELERATE: '1'
        run: python scripts/build_cache.py push
