name: stage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-input-cache
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --quiet pyyaml
      - name: restore the complete public input cache
        run: python scripts/build_cache.py public-pull
      - name: fetch and validate the declared game images
        run: python scripts/art_cache_1108.py
      - name: validate all declared build inputs
        run: python scripts/build_site_app.py --check-inputs
      - name: publish compatible input cache additions
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_ACCELERATE: '1'
        run: python scripts/build_cache.py push
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-tests
      - name: isolate the metadata borrowing failure
        run: cargo test -p wfsim-engine --lib data::weapons::tests::metadata:: -- --nocapture
      - name: reproduce with the complete engine test suite
        run: cargo test -p wfsim-engine --lib
