name: stage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-input-cache
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --quiet pyyaml==6.0.3
      - name: preserve the public cache and add the pinned Swipe texture
        run: python scripts/swipe_cache_operator.py prepare
      - name: verify all declared inputs without building the site
        run: python scripts/build_site_app.py --check-inputs
      - name: publish and read back the compatible cache addition
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_ACCELERATE: '1'
        run: python scripts/swipe_cache_operator.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: swipe-cache-receipt
          path: target/swipe-cache-receipt.json
          if-no-files-found: ignore
