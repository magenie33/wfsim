# A RIVEN SURVEY'S SHAPES, FROZEN ON THE OFFICIAL MACHINES — docs/AGENT.md
# §"Riven survey". `scripts/riven_survey.py` opens the shapes and starts this;
# each shape's search is built by a clean page (`scripts/riven_freeze.mjs`) and
# stored, which hands it to the factory. Nothing here computes a score.
#
# A RUN TAKES WHAT IS LEFT AND STOPS. A shape is frozen once and never again, so
# a run cut short loses only the pages in flight and the next one takes the
# rest; an hour with nothing unfrozen is one short job.
name: survey

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

# ONE RUN AT A TIME: two would freeze the same shapes twice.
concurrency:
  group: survey-freeze
  cancel-in-progress: false

env:
  # A run's share of the backlog. Most codes are written into a template and
  # take a request each; a weapon whose check differs goes to clean pages, a
  # few seconds each, and what is left waits for the next hour.
  MAX_CODES: 20000
  LANES: 4

jobs:
  codes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      count: ${{ steps.read.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - name: the databases
        uses: ./.github/actions/databases
        with:
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          pg_url: ${{ secrets.PG_PIPELINE_URL }}
      - name: the shapes not yet frozen
        id: read
        run: |
          set -euo pipefail
          echo "{\"sql\":\"SELECT code FROM appraisals WHERE channel = 'survey' AND request IS NULL ORDER BY code LIMIT $MAX_CODES\"}" \
            | node scripts/pgq.mjs | jq -er '.result[0].results[].code' > codes.txt || true
          count=$(grep -c . codes.txt || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count shapes to freeze" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.read.outputs.count != '0'
        with:
          name: codes
          path: codes.txt

  freeze:
    needs: codes
    if: needs.codes.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - uses: actions/download-artifact@v4
        with:
          name: codes
      - name: freeze them
        env:
          BOT_RELAY_TOKEN: ${{ secrets.BOT_RELAY_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$BOT_RELAY_TOKEN" ] || { echo "::error::BOT_RELAY_TOKEN is not set"; exit 1; }
          node scripts/riven_freeze.mjs codes.txt "$LANES" | tee freeze.log
          grep -v '^[0-9]*/[0-9]* ok' freeze.log | tail -n 40 >> "$GITHUB_STEP_SUMMARY"
