name: Resume checked CLI release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be9a2db577dbace02880cd6c27d012a31185d2f4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: cli-prepared-release
          run-id: 42651201957
          github-token: ${{ github.token }}
          path: target/client-release
      - name: The source and live engine are qualified
        run: |
          node scripts/ci_runs.mjs ship 09045c34db507b5ef9f2196ae85be5e19654f7a2
          node scripts/check_client_live_engine.mjs
          python3 scripts/release_client.py target/client-release --dry-run
      - name: Publish exactly the checked GitHub assets once
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';

          const root = 'target/client-release', source = 'be9a2db577dbace02880cd6c27d012a31185d2f4';
          const repo = process.env.GITHUB_REPOSITORY;
          assert.equal(repo, 'magenie33/wfsim');
          const run = JSON.parse(execFileSync('gh', ['run','view','42651201957','--json','headSha,jobs'], {encoding:'utf8'}));
          assert.equal(run.headSha, source);
          assert.equal(run.jobs.filter(job => job.name.startsWith('build (') && job.conclusion === 'success').length, 4);
          const manifest = JSON.parse(fs.readFileSync(path.join(root,'release.json')));
          assert.equal(manifest.version, '0.1.0'); assert.equal(manifest.npm, false);
          const native = Object.values(manifest.files).map(file=>file.name);
          const names = [...native,'release.json','SHA256SUMS','source.zip',...fs.readdirSync(root).filter(name=>name.endsWith('.tgz'))];
          assert.equal(names.length, 8); assert.equal(new Set(names).size,names.length);
          for (const name of names) assert.equal(path.basename(name),name);
          const tag = 'cli-' + manifest.version;
          const gh = args => execFileSync('gh',args,{encoding:'utf8'});
          let release;
          try { release=JSON.parse(gh(['api',`repos/${repo}/releases/tags/${tag}`])); } catch { /* first publication */ }
          if (!release) {
            execFileSync('gh',['release','create',tag,'--target',source,'--title','WFSim CLI 0.1.0',
              '--notes-file','client/README.md','--latest=false',...names.map(name=>path.join(root,name))],{stdio:'inherit'});
            release=JSON.parse(gh(['api',`repos/${repo}/releases/tags/${tag}`]));
          }
          assert.equal(release.target_commitish,source); assert.equal(release.draft,false);
          for (const name of names) {
            const bytes=fs.readFileSync(path.join(root,name));
            const hash=createHash('sha256').update(bytes).digest('hex');
            const asset=release.assets.find(asset=>asset.name===name);
            assert(asset, name); assert.equal(asset.size,bytes.length,name);
            if (asset.digest) assert.equal(asset.digest,'sha256:'+hash,name);
            else {
              const dir=fs.mkdtempSync('/tmp/wfsim-cli-asset-');
              execFileSync('gh',['release','download',tag,'--pattern',name,'--dir',dir]);
              assert.equal(createHash('sha256').update(fs.readFileSync(path.join(dir,name))).digest('hex'),hash,name);
            }
          }
          console.log('GitHub CLI 0.1.0: eight unique assets from the four-host checked source verified.');
          JS
      - name: Publish the same prepared bytes and latest pointer
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_ACCELERATE: '1'
        run: python3 scripts/release_client.py target/client-release
