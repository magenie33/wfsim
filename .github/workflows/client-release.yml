name: Release CLI
on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI host version (empty uses 0.1.0-date.run)"
        type: string
        default: ""
      npm:
        description: "Also publish the prepared npm launcher (requires package access)"
        type: boolean
        default: false
      cors_only:
        description: "Repair website manifest GET access without building or publishing"
        type: boolean
        default: false
      expected_sha:
        description: "Exact qualified main SHA required for cors_only"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  cors:
    if: inputs.cors_only && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Require qualified exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          proof=$(node scripts/ci_runs.mjs ship "$EXPECTED_SHA")
          test -n "$proof"
      - run: python3 scripts/check_client_cors.py
      - name: Preserve bucket CORS and enable website GET
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: python3 scripts/client_cors.py --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-cors-audit
          path: target/client-cors/*
  version:
    if: ${{ !inputs.cors_only }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          node -e 'const fs=require("node:fs");const v=process.env.REQUESTED||`0.1.0-${new Date().toISOString().slice(0,10).replaceAll("-","")}.${process.env.GITHUB_RUN_NUMBER}`;if(!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(v))throw Error("invalid version");fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${v}\n`);'
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-linux, artifact: wfsim-x86_64-linux }
          - { os: windows-latest, target: x86_64-windows, artifact: wfsim-x86_64-windows.exe }
          - { os: macos-latest, target: aarch64-macos, artifact: wfsim-aarch64-macos }
          - { os: macos-15-intel, target: x86_64-macos, artifact: wfsim-x86_64-macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      WFSIM_CLI_BUILD: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - if: runner.os != 'Linux'
        run: cargo test --locked --manifest-path client/Cargo.toml
      - if: runner.os != 'Linux'
        run: cargo build --release --locked --manifest-path client/Cargo.toml
      - if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e WFSIM_CLI_BUILD rust:1.97.1-bullseye \
            sh -c 'cargo test --locked --manifest-path client/Cargo.toml && cargo build --release --locked --manifest-path client/Cargo.toml'
      - shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then cp client/target/release/wfsim.exe "out/$ARTIFACT"; else cp client/target/release/wfsim "out/$ARTIFACT"; fi
          if [ "$RUNNER_OS" = macOS ]; then codesign --force --sign - "out/$ARTIFACT"; fi
          "out/$ARTIFACT" --version
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: out/*
  publish:
    needs: [version, build]
    if: ${{ !inputs.cors_only && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org'
      - if: inputs.npm
        run: npm install --global npm@11.21.2
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: target/client-artifacts
          merge-multiple: true
      - run: node scripts/check_client_release.mjs
      - name: Require qualified exact main commit
        id: engine-proof
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          proof=$(node scripts/ci_runs.mjs ship "$EXPECTED_SHA")
          test -n "$proof"
          echo "run=$proof" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-built
          path: ${{ runner.temp }}/cli-engine
          run-id: ${{ steps.engine-proof.outputs.run }}
          github-token: ${{ github.token }}
      - name: Use the engine checked on this exact source
        env:
          CHECKED_SITE: ${{ runner.temp }}/cli-engine/site
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          source = pathlib.Path(os.environ['CHECKED_SITE'])
          release = json.loads((source / 'release.json').read_text())
          commit = release['commit'].removesuffix('+')
          assert len(commit) >= 8 and os.environ['GITHUB_SHA'].startswith(commit)
          shutil.copytree(source / 'pkg', pathlib.Path('site/pkg'), dirs_exist_ok=True)
          shutil.copyfile(source / 'release.json', 'site/release.json')
          PY
      - run: node scripts/check_client_live_engine.mjs
      - env:
          CLI_VERSION: ${{ needs.version.outputs.version }}
          CLI_NPM: ${{ inputs.npm }}
        run: |
          node scripts/build_client_release.mjs "version=$CLI_VERSION" "npm=$CLI_NPM"
          git archive --format=zip --output=target/client-release/source.zip HEAD
          python3 scripts/release_client.py target/client-release --dry-run
          npm pack ./target/client-release/npm --pack-destination target/client-release --json > target/client-release/npm-pack.json
      - uses: actions/upload-artifact@v4
        with:
          name: cli-prepared-release
          path: target/client-release/*
      - env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/client_release_files.mjs target/client-release > target/client-release-assets.txt
          mapfile -t cli_assets < target/client-release-assets.txt
          gh release create "cli-$CLI_VERSION" --target "$GITHUB_SHA" --title "WFSim CLI $CLI_VERSION" \
            --notes-file client/README.md --latest=false \
            "${cli_assets[@]}"
      - if: inputs.npm
        run: npm publish ./target/client-release/npm --access public --provenance
      - env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_ACCELERATE: '1'
        run: python3 scripts/release_client.py target/client-release
