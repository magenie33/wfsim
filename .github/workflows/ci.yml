name: CI
on:
  workflow_dispatch:
    inputs:
      reason:
        type: string
        default: snapshot legality recovery
permissions:
  contents: write
jobs:
  revalidate-candidate:
    if: github.ref == 'refs/heads/revalidate-melee-snapshot-1125'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: merge-melee-valence-1125
          fetch-depth: 1
      - name: verify exact candidate
        run: test "$(git rev-parse HEAD)" = 0b9472376e9773082841bc2bd28a587bd65f98cf
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: board-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: build the official snapshot assembler
        run: cargo build --release --bin wfsim-board
      - name: revalidate the existing snapshot only
        run: |
          set -euo pipefail
          ./target/release/wfsim-board --revalidate site/board
          python3 -c 'import yaml' || pip install --quiet pyyaml
          python3 scripts/board_meta.py
          git diff --stat -- site/board data/board_state.yaml site/board.meta.json
      - name: save the generated candidate snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/board data/board_state.yaml site/board.meta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'board: revalidate the published snapshot for melee admission'
          git push origin HEAD:refs/heads/merge-melee-valence-1125
