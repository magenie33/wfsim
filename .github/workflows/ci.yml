name: CI
run-name: "${{ inputs.hotfix && 'hotfix:' || 'CI:' }} ${{ github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every check without reusing an earlier run
        type: boolean
        default: false
      hotfix:
        description: Validate only registered hotfix scopes; never supplies a site release
        type: boolean
        default: false
      fast:
        description: Registered maintenance changes without unrelated full-factory stress fixtures
        type: boolean
        default: false
      reason:
        description: Incident requiring scoped validation (required with hotfix)
        type: string
        default: ""
  schedule:
    - cron: '17 20 * * 0'

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  coordination:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Coding tools share tasks without double ownership
        run: node scripts/check_agentctl.mjs

  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      test_matrix: ${{ steps.scope.outputs.test_matrix }}
      factory_matrix: ${{ steps.scope.outputs.factory_matrix }}
      runtime: ${{ steps.scope.outputs.runtime }}
      protocol: ${{ steps.scope.outputs.protocol }}
      factory: ${{ steps.scope.outputs.factory }}
      prepare_desktop: ${{ steps.scope.outputs.prepare_desktop }}
      prepare_live: ${{ steps.scope.outputs.prepare_live }}
      mcp: ${{ steps.scope.outputs.mcp }}
      bot: ${{ steps.scope.outputs.bot }}
      checks: ${{ steps.scope.outputs.checks }}
      services: ${{ steps.scope.outputs.services }}
      pipeline: ${{ steps.scope.outputs.pipeline }}
      page: ${{ steps.scope.outputs.page }}
      parity: ${{ steps.scope.outputs.parity }}
      page_rest: ${{ steps.scope.outputs.page_rest }}
      test: ${{ steps.scope.outputs.test }}
      gas: ${{ steps.scope.outputs.gas }}
      engine_apart: ${{ steps.scope.outputs.engine_apart }}
      published_board: ${{ steps.scope.outputs.published_board }}
      native: ${{ steps.scope.outputs.native }}
      site: ${{ steps.scope.outputs.site }}
      hotfix: ${{ steps.scope.outputs.hotfix }}
      hotfix_matrix: ${{ steps.scope.outputs.hotfix_matrix }}
      reuse: ${{ steps.reuse.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci_policy.mjs
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.full || inputs.hotfix }}
          CI_PLAN: ${{ steps.scope.outputs.plan }}
        run: node scripts/ci_runs.mjs reuse

  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node scripts/check_ci_policy.mjs
      - run: node scripts/check_ci_hotfix.mjs
      - run: node scripts/check_ci_partitions.mjs
      - run: node scripts/check_full_work.mjs
      - run: python3 scripts/check_release_readiness.py
      - run: python3 scripts/check_ship_workers.py
      - run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml==6.0.3
      - run: python3 scripts/check_release_stage.py
      - run: python3 scripts/check_ship_bot_assets.py
      - run: node scripts/check_factory_shards.mjs
      - run: node scripts/check_cdp_boot.mjs
      - run: python3 scripts/check_native_artifact.py
      - run: python3 scripts/check_native_pgo.py
      - run: (python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml==6.0.3) && python3 scripts/check_build_inputs.py
      - run: node scripts/check_site_setup.mjs
      - run: node scripts/check_page_bodies.mjs
      - run: node scripts/check_sync_safety.mjs
      - run: node scripts/check_website_proxy.mjs
      - run: python3 scripts/ship_website.py --self-test
      - run: python3 scripts/check_website_dns.py
      - run: node scripts/check_comment_style.mjs
      - run: node scripts/check_time_storage.mjs
      - run: node scripts/check_user_task_queue.mjs
      - run: node scripts/check_optimizer_build_uploads.mjs
      - run: node scripts/check_app_parts.mjs
      - run: node scripts/check_ocr_worker.mjs
      - run: node scripts/check_ime_keys.mjs
      - run: node scripts/check_engine_layers.mjs
      - run: node scripts/test_nona_core.mjs
      - run: node scripts/check_nona_boundary.mjs
      - run: node scripts/check_rescore_paths.mjs

  runtime:
    needs: [plan, quick]
    if: needs.plan.outputs.runtime == 'true' && needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --silent --prefix scripts/pg
      - name: Public worker contracts run on the release-pinned Workers runtime
        run: |
          node scripts/check_client_manifest.mjs
          node scripts/check_edge_runtime.mjs
      - name: Database scripts use the production transport before native compilation
        env:
          WFSIM_SCORE_INPUTS_PG_URL: postgres://wfsim_score_test:fixture@127.0.0.1:5432/wfsim_score_inputs
          WFSIM_CANCEL_QUEUE_PG_URL: postgres://wfsim_score_test:fixture@127.0.0.1:5432/wfsim_score_inputs
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE wfsim_score_test LOGIN PASSWORD 'fixture'"
          sudo -u postgres createdb --owner=wfsim_score_test wfsim_score_inputs
          node scripts/check_score_inputs.mjs --transport-only
          node scripts/check_cancel_queue.mjs

  factory-cases:
    needs: [plan, runtime]
    if: needs.plan.outputs.factory == 'true' && needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.factory_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --silent --prefix scripts/pg
      - name: Execute the complete assigned factory case set
        env:
          MODE: ${{ matrix.mode }}
          GROUP: ${{ matrix.group }}
          SHARD: ${{ matrix.shard }}
          TRIALS: ${{ matrix.trials }}
        run: node scripts/factory_shards.mjs run mode="$MODE" group="$GROUP" shard="$SHARD" trials="$TRIALS" receipt=target/factory/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: factory-${{ strategy.job-index }}
          path: target/factory/receipt.json
          if-no-files-found: error
          retention-days: 7

  factory:
    needs: [plan, factory-cases]
    if: needs.plan.outputs.factory == 'true' && needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          pattern: factory-*
          path: target/factory-receipts
      - name: Every seed and fixed regression passed exactly once in both modes
        run: node scripts/check_factory_shards.mjs target/factory-receipts

  hotfix:
    needs: [plan, quick]
    if: needs.plan.outputs.hotfix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.hotfix_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --silent --prefix scripts/pg
      - name: Registered checks for the affected scope
        env:
          GROUP: ${{ matrix.group }}
        run: node scripts/ci_hotfix.mjs "$GROUP"

  test:
    needs: [plan, quick]
    if: needs.plan.outputs.test == 'true' && needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with mise.toml
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-tests
      - name: Clippy (deny warnings)
        if: matrix.suite == 'workspace'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            workspace) cargo test --workspace --exclude wfsim-webapi ;;
            webapi) cargo test -p wfsim-webapi -- --skip optimize::whole_scope_tests:: --skip optimize::quick_descent_tests:: ;;
            whole-scope|descent|screened-descent|fleet-work|deep-descent|deep-screened|deep-fleet) node scripts/ci_rust.mjs "$SUITE" ;;
            accuracy) cargo test -p wfsim-webapi --lib optimize::quick_descent_tests:: -- --nocapture ;;
            *) echo "unknown Rust suite: $SUITE" >&2; exit 2 ;;
          esac

  # NATIVE AND WASM COUNT THE SAME WORK (docs/WASM.md §"Gas"): both built from
  # this commit, a fixed set of rows fought by each must give the same gas,
  # work and score — the native client and every browser are paid alike.
  gas:
    needs: [plan, quick]
    if: needs.plan.outputs.gas == 'true' && needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with mise.toml
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Native and wasm give the same gas, work and score
        run: |
          bindgen=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/$bindgen/wasm-bindgen-$bindgen-x86_64-unknown-linux-musl.tar.gz" | tar xz
          WASM_BINDGEN="$PWD/wasm-bindgen-$bindgen-x86_64-unknown-linux-musl/wasm-bindgen" node scripts/check_gas.mjs build
      - name: A compute lane stays small
        run: node scripts/check_lane_memory.mjs pkg=target/gas-check-pkg

  # THE ENGINE IS ITS CODE (docs/WASM.md §"Code and data"): the shipped module
  # built at another path, with a weapon's number edited, is the same bytes,
  # and only the data pack moves — so a data release never costs a reader the
  # module, and one source never builds two.
  engine-apart:
    needs: [plan, quick]
    if: needs.plan.outputs.engine_apart == 'true' && needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with mise.toml
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: One source builds one module, and data moves only the pack
        run: python3 scripts/check_engine_apart.py

  # THE PUBLISHED SNAPSHOT IS A LEGAL BOARD — a fact about publish.yml's output,
  # so it is a job of its own: inside `test` it stopped the one run that repairs
  # it, since publish.yml waits for `test` and a tightened door leaves the
  # snapshot holding rows the door now refuses.
  published-board:
    needs: [plan, quick]
    if: needs.plan.outputs.published_board == 'true' && needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with mise.toml
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Every published row is a legal build
        run: cargo test -p wfsim-cli --lib every_published_row_is_a_legal_build -- --ignored

  # A commit names its author and no tool. Blobless, because only the messages
  # are read; the range is what this push or pull request adds.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: No commit credits an AI tool
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          from="${BASE:-$BEFORE}"
          if ! git cat-file -e "$from^{commit}" 2>/dev/null; then from="$HEAD_SHA~1"; fi
          node scripts/check_commit_trailers.mjs "$from..$HEAD_SHA"

  # THE SITE THIS COMMIT BUILDS — built here, once: `parity` checks it and
  # ship.yml publishes this very artifact, so what ships is what was checked.
  site:
    needs: [plan, quick, runtime]
    if: needs.plan.outputs.site == 'true' && needs.plan.outputs.reuse == ''
    # PINNED, not ubuntu-latest: the image a release is built on moves when we move it.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/site-tools
      - name: Build site/
        # UNBUFFERED, so each line is stamped when it was said and the log shows
        # which part of the build the time went to.
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/build_site_app.py
      # NOT site/board/: the board bots own it, and ship.yml lays this over a
      # checkout whose board may be newer than the one this read.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-built
          path: |
            site/
            !site/board/
            desktop/payload/
            mcp/engine.js
          # site/.well-known/ is the agents' door, and a dot directory.
          include-hidden-files: true
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-built
          path: site/release.json
          retention-days: 7

  prepare-desktop:
    needs: [plan, site]
    if: needs.plan.outputs.prepare_desktop == 'true' && needs.plan.outputs.reuse == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/site-tools
        with:
          build: 'false'
      - uses: ./.github/actions/built-site
        with:
          built: 'true'
      - name: Prepare the exact desktop payload and signing executable without secrets
        run: python scripts/release_stage.py prepare desktop --out target/release-stage/desktop --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-desktop
          path: target/release-stage/desktop
          if-no-files-found: error
          retention-days: 7

  prepare-live:
    needs: [plan, runtime]
    if: needs.plan.outputs.prepare_live == 'true' && needs.plan.outputs.reuse == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install --quiet pyyaml==6.0.3
      - id: inputs
        name: Hash the complete Linux build inputs
        run: echo "digest=$(python scripts/release_stage.py key live --source "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/release-stage-reuse/live
          key: live-prepared-${{ steps.inputs.outputs.digest }}-${{ github.sha }}
          restore-keys: live-prepared-${{ steps.inputs.outputs.digest }}-
      - name: Prepare Linux runtime binaries in the pinned build image without secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_stage.py prepare live --out target/release-stage/live --source "$GITHUB_SHA" --reuse target/release-stage-reuse/live
          mkdir -p target/release-stage-reuse/live
          cp -a target/release-stage/live/. target/release-stage-reuse/live/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-live
          path: target/release-stage/live
          if-no-files-found: error
          retention-days: 7

  # Native slices build beside validation; only ship has the signing key.
  # Missing optional slices retain the clients' wasm fallback.
  native-mac:
    needs: [plan, site]
    if: needs.site.result == 'success' && needs.plan.outputs.native == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: macos-latest }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-built
          path: ${{ runner.temp }}/metadata
      # An engine whose library already names this slice keeps it; one published
      # without it gains it (`release_engine_lib.py` adds a missing target).
      - id: due
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          built="$RUNNER_TEMP/metadata"
          engine=$(jq -r '.engine' "$built/release.json")
          if curl --connect-timeout 10 --max-time 30 -sf "https://wfsim-1388973035.cos.ap-shanghai.myqcloud.com/engine/$engine.json" -o "$RUNNER_TEMP/lib.json" \
            && jq -e --arg t "$ARCH-macos" '.signed | fromjson | .files[$t]' "$RUNNER_TEMP/lib.json" > /dev/null; then
            echo "::notice::engine library $engine names $ARCH-macos — no Mac build"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - if: steps.due.outputs.go == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-built
          path: ${{ runner.temp }}/built
      - if: steps.due.outputs.go == 'true'
        run: |
          set -euo pipefail
          built="$RUNNER_TEMP/built/site"
          # THE SHIPPED WASM AS THE REFERENCE, under the names check_gas.mjs reads.
          wasm=$(jq -r '.wasm' "$built/release.json"); ref="$RUNNER_TEMP/ref"; mkdir -p "$ref"
          cp "$built/pkg/wfsim_wasm.$wasm.js" "$ref/wfsim_wasm.js"
          cp "$built/pkg/wfsim_wasm_bg.$wasm.wasm" "$ref/wfsim_wasm_bg.wasm"
          for p in $(jq -r '.packs[]' "$built/release.json"); do cp "$built/pkg/$p" "$ref/"; done
      - if: steps.due.outputs.go == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # keep in sync with mise.toml and ci.yml
          toolchain: "1.97.1"
          targets: ${{ matrix.arch }}-apple-darwin
          components: llvm-tools-preview
      - if: steps.due.outputs.go == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - if: steps.due.outputs.go == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
      - if: steps.due.outputs.go == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        continue-on-error: true
        with:
          shared-key: engine-macos-${{ matrix.arch }}
          cache-workspace-crates: true
      - if: steps.due.outputs.go == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          t="$ARCH-apple-darwin"
          [ "$(uname -m | sed 's/arm64/aarch64/')" = "$ARCH" ] || { echo "::error::$ARCH slice on a $(uname -m) runner"; exit 1; }
          python3 scripts/native_pgo.py build --target "$t" \
            --output "out/macos/$ARCH/libwfsim_native.dylib" --work-dir "$RUNNER_TEMP/native-pgo"
          cargo build --release --locked -p wfsim-cli --bin wfsim-gas --target "$t"
          node scripts/check_gas.mjs native="$PWD/target/$t/release/wfsim-gas" pkg="$RUNNER_TEMP/ref"
          node scripts/check_native_pgo.mjs pkg="$RUNNER_TEMP/ref" library="out/macos/$ARCH/libwfsim_native.dylib"
          python3 scripts/native_artifact.py "out/macos/$ARCH/libwfsim_native.dylib" "$RUNNER_TEMP/built/site/release.json"
      - if: steps.due.outputs.go == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-native-${{ matrix.arch }}
          path: out
          if-no-files-found: error

  native-linux:
    needs: [plan, site]
    if: needs.site.result == 'success' && needs.plan.outputs.native == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-built
          path: ${{ runner.temp }}/metadata
      - id: due
        run: |
          set -euo pipefail
          engine=$(jq -r '.engine' "$RUNNER_TEMP/metadata/release.json")
          if curl --connect-timeout 10 --max-time 30 -sf "https://wfsim-1388973035.cos.ap-shanghai.myqcloud.com/engine/$engine.json" -o "$RUNNER_TEMP/lib.json" \
            && jq -e '.signed | fromjson | .files["x86_64-linux"]' "$RUNNER_TEMP/lib.json" > /dev/null; then
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - if: steps.due.outputs.go == 'true'
        uses: ./.github/actions/built-site
        with:
          built: 'true'
      - if: steps.due.outputs.go == 'true'
        run: python3 scripts/ci_native_linux.py
      - if: steps.due.outputs.go == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-native-linux
          path: out
          if-no-files-found: error

  # The page is not something `cargo test` can see. These jobs check the site
  # this commit builds — the artefact Cloudflare will deploy — in PARALLEL, each
  # laying it the same way, so CI takes as long as the slowest of them: a check
  # goes in the job of its kind, and one that grows past the others is split.
  # This one: the files, the door and the services' own checks, no page.
  checks:
    needs: [plan, site]
    if: needs.site.result == 'success' && needs.plan.outputs.checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/built-site
        with:
          built: ${{ needs.site.result == 'success' }}
      # THE BUILD SAYS WHICH RELEASE IT IS, and its engine module cannot be
      # paired with another build's. Both fail silently — a page with no
      # identity still opens, and a cached module still loads — so they are
      # asserted about the committed `site/`, in the job that already reads it.
      # No browser: every one of them is a fact about the files.
      - name: The build says which release it is
        run: node scripts/check_release_identity.mjs
      - name: Build simulate and solve execute on the shipping module and data
        run: node scripts/check_release_core.mjs
      # THE PAGE'S ONE PROGRAMMATIC SURFACE. Everything that drives the page
      # from outside — the checks, an in-page agent, a bot — stands on
      # `window.wfsim`, so its two properties are worth a check rather than a
      # convention: an action names a control that is on the page, and the
      # decisions it shares with the page's own handlers exist once. Both fail
      # silently — a door onto a button nobody has still answers, and a second
      # copy of a rule behaves identically until one of them is edited.
      - name: The agent door is one door
        run: node scripts/check_agent_door.mjs
      # THE TWO WORKERS SERVE ONE SITE: the edge's assets are the placed one's,
      # and the page and the engine never cross to the placed worker.
      - name: The edge worker serves the site
        run: node scripts/check_edge_worker.mjs
      - name: The browser's agent gets the door's table
        run: node scripts/check_webmcp.mjs
      - name: A riven typed for fx reads every way a line is written, its side as the card says it
        run: node scripts/check_fx_lines.mjs
      - name: Every item on a fight's path is metered
        run: node scripts/check_gas.mjs
      - name: Prose is never read where a number is computed
        run: node scripts/check_prose.mjs
      - name: The clients' contract states the values the code holds
        run: node scripts/check_clients_doc.mjs

      # THE WORKERS RUN THE PAGE'S OWN PARTS, copied by a generator: a stale
      # codec previews a link by a grammar the page left behind, and a stale
      # headless table answers an agent with queries the page has moved past.
      - name: The workers' copies are the page's parts
        run: node scripts/gen_worker_parts.mjs --check

      - name: What an agent reads to find WFSim is what the site serves
        run: node scripts/check_agent_discovery.mjs

  protocol:
    needs: [plan, runtime]
    if: needs.plan.outputs.protocol == 'true' && needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [async, proc, proc-async]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --silent --prefix scripts/pg
      - name: Queued settlement preserves every factory invariant
        if: matrix.group == 'async'
        env:
          WFSIM_SETTLE_ASYNC: "1"
        run: |
          node scripts/check_board_verify.mjs
          node scripts/check_queue_once.mjs
          node scripts/check_board_sync.mjs
          node scripts/check_board_reviews.mjs
          node scripts/check_fair.mjs
      - name: One-call sync preserves request-path behavior
        if: matrix.group == 'proc'
        env:
          WFSIM_SYNC_PROC: "1"
        run: node scripts/check_board_sync.mjs
      - name: One-call sync and queued settlement preserve joint behavior
        if: matrix.group == 'proc-async'
        env:
          WFSIM_SYNC_PROC: "1"
          WFSIM_SETTLE_ASYNC: "1"
        run: |
          node scripts/check_board_sync.mjs
          node scripts/check_board_reviews.mjs
          node scripts/check_board_family.mjs

  # The board's pipeline and the factory against a real Postgres, no page.
  pipeline:
    needs: [plan, quick, runtime]
    if: needs.plan.outputs.pipeline == 'true' && needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      # THE DATABASE THE CHECKS BELOW RUN THE WORKER ON: an in-memory Postgres
      # (scripts/pg/test_db.mjs), and the client the pipeline's scripts use.
      - name: The checks' Postgres
        run: npm ci --silent --prefix scripts/pg
      - name: The board's pipeline reads and writes Postgres
        run: node scripts/check_pg_scripts.mjs
      - name: Queue cancellation preserves demand ownership
        run: node scripts/check_cancel_queue.mjs
      - name: Official settlement reports failures and releases claims
        run: node scripts/check_settle.mjs
      - name: Live board uploads preserve progress within bounded cycles
        run: node scripts/check_live_publish.mjs
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-tests
      - name: Incremental inventory matches a full engine walk across frozen database cuts
        run: |
          cargo build -p wfsim-cli --bin wfsim-board
          node scripts/check_inventory_control.mjs
          node scripts/check_default_parent.mjs
          node scripts/check_inventory_pipeline.mjs
          node scripts/check_inventory_relations.mjs
          node scripts/check_inventory_ranges.mjs
          node scripts/check_inventory_relational_pipeline.mjs
          node scripts/check_score_inputs.mjs
          node scripts/check_live_ranker.mjs
          node scripts/check_work_calibration.mjs
          cargo build --bin wfsim-intake
          node scripts/check_intake_batches.mjs
      - name: Scoring inputs use the production Postgres driver
        env:
          WFSIM_SCORE_INPUTS_PG_URL: postgres://wfsim_score_test:fixture@127.0.0.1:5432/wfsim_score_inputs
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE wfsim_score_test LOGIN PASSWORD 'fixture'"
          sudo -u postgres createdb --owner=wfsim_score_test wfsim_score_inputs
          node scripts/check_score_inputs.mjs
      - name: Bounded intake preserves commit and acknowledgement order on the production driver
        env:
          WFSIM_INTAKE_PG_URL: postgres://wfsim_score_test:fixture@127.0.0.1:5432/wfsim_score_inputs
        run: node scripts/check_intake_batches.mjs
      - name: Queue cancellation uses the production Postgres driver
        env:
          WFSIM_CANCEL_QUEUE_PG_URL: postgres://wfsim_score_test:fixture@127.0.0.1:5432/wfsim_score_inputs
        run: node scripts/check_cancel_queue.mjs
      - name: Maintenance preserves native board behavior and source checks
        if: fromJSON(needs.plan.outputs.plan).fast
        run: |
          cargo test -p wfsim-engine --lib board::
          cargo test -p wfsim-cli --lib board::
          cargo clippy -p wfsim-cli --all-targets -- -D warnings
      - name: Equipment builds enter the canonical public library
        run: node scripts/check_equipment_library_api.mjs
      - name: While work is short an account past its fair share waits, and only then
        run: node scripts/check_fair.mjs
      - name: The settler in shadow judges as the request path does, and says where it does not
        run: node scripts/check_settler.mjs
      - name: Background capacity yields to requests and shares the same public counts
        run: node scripts/check_factory_capacity.mjs
      - name: The factory deploy carries its dependencies and keeps credentials outside the artifact
        run: python scripts/check_factory_deploy.py
      - name: Answers queued for the settler leave what settling them in the request leaves, once
        run: node scripts/check_settler_async.mjs
      - name: A sync as one call answers and writes what the statements do, in two round trips at most
        run: node scripts/check_sync_proc.mjs
      - name: Every ask names who asked, one asker is held to its share, and a code is erased once the ask is over
        run: node scripts/check_initiator.mjs
      - name: An official check of another engine goes back to the volunteers, and a spot of one to its fact
        run: node scripts/check_moot_checks.mjs
      - name: Seven-day task detail is archived and verified before pruning
        run: |
          node scripts/check_forget_past.mjs
          python scripts/check_task_archive.py
          python scripts/check_pg_backup.py
      - name: A batch is asked most popular weapon first, and a place is due by its batch's day
        run: node scripts/check_popular_order.mjs
      - name: Merit mints from contribution points within the day's and the balance's caps, and an account sees only its own
        run: node scripts/check_merit.mjs
      - name: A row its page still computes is kept for it, and only a silent one loses it
        run: node scripts/check_renew.mjs
      - name: A riven gain is run by the community and credited when two owners agree
        run: node scripts/check_riven_gain.mjs
      - name: The site reads the live board, and the committed one only until it exists
        run: node scripts/check_board_live.mjs

  # The page in headless Chrome: its controls, lanes and queue.
  page:
    needs: [plan, site]
    if: needs.site.result == 'success' && needs.plan.outputs.page == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.plan).fast && fromJSON('["fast"]') || fromJSON('["controls","calculation","community"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/built-site
        with:
          built: ${{ needs.site.result == 'success' }}
      # THE DATABASE THE CHECKS BELOW RUN THE WORKER ON: an in-memory Postgres
      # (scripts/pg/test_db.mjs), and the client the pipeline's scripts use.
      - name: The checks' Postgres
        run: npm ci --silent --prefix scripts/pg
      # A BOX THAT REDRAWS UNDER A COMPOSITION takes no Chinese at all, while
      # Latin typing looks fine.
      - name: Every search box takes a Chinese input method
        if: matrix.group == 'controls'
        run: node scripts/check_ime_search.mjs
      # NONA RUNS ON THE DOOR, against a local stand-in provider: her tools are
      # the door's table at request time, and her first change branches the
      # reader's build. Neither is visible until a reader loses a build.
      - name: Nona works the page on a copy
        if: matrix.group == 'controls'
        run: node scripts/check_nona.mjs
      # A CONTROL WITH NO DOOR ROW is a feature Nona silently cannot use. Every
      # control on the page is inside an action's anchor or in AGENT_EXEMPT
      # with its reason, and the not-yet list only shrinks.
      - name: Every control is on the door or says why not
        if: matrix.group == 'controls'
        run: node scripts/check_agent_coverage.mjs
      - name: The compute page shows what each device does, by kind, and nothing private
        if: matrix.group == 'community'
        run: node scripts/check_compute.mjs
      - name: Compute cards retain layout, paginate records and share one live count
        if: matrix.group == 'community'
        run: node scripts/check_compute_ui.mjs
      - name: A lost lane is replaced and says where, and a slow call is not taken for a dead one
        if: matrix.group == 'calculation'
        run: node scripts/check_calc_recovers.mjs
      - name: Calculation tasks retain their inputs, results and queue across pages
        if: matrix.group == 'calculation'
        run: node scripts/check_user_task_center.mjs
      - name: Search tasks and saved-riven batches retain their captured inputs
        if: matrix.group == 'calculation'
        run: node scripts/check_task_executors.mjs
      - name: Exact official simulations request durable independent board reviews
        if: matrix.group == 'community'
        run: node scripts/check_board_review_page.mjs
      - name: Recommendations stay in the Library and preserve private history
        if: matrix.group == 'community'
        run: node scripts/check_recommendations_page.mjs
      - name: Contributor profiles follow actual publication and current names
        if: matrix.group == 'community'
        run: node scripts/check_computation_profiles_page.mjs
      - name: Community transfer completes through two real WASM witnesses
        if: matrix.group == 'community'
        run: |
          node scripts/check_task_service_browser.mjs
          node scripts/check_riven_delivery_page.mjs
      - name: Protocol 8 on the page keeps every result and holds to the signal and next_ms
        if: matrix.group == 'community'
        run: node scripts/check_compute_queue.mjs
      - name: A new release is taken at once, and the reload loses the reader nothing
        if: matrix.group == 'controls'
        run: node scripts/check_release_follow.mjs
      - name: The home tally and the ranking are CDN files first, the worker their fallback
        if: matrix.group == 'controls'
        run: node scripts/check_stats_files.mjs
      # A WORKER THAT LIVES IN EVERY READER'S BROWSER is wrong for weeks: it falls
      # back on a slow road only, never on a sound one, and its way back works.
      - name: The page cache answers a slow road and never a sound one
        if: matrix.group == 'controls'
        run: node scripts/check_page_cache.mjs
      - name: Complete totals and clearance render on the checked release
        if: matrix.group == 'fast'
        run: node scripts/ci_fast.mjs page

  # The builder against every weapon: the slowest sweep, so it is SHARDED, every
  # fourth weapon to a job (WFSIM_PARITY_SHARD).
  parity:
    needs: [plan, site]
    if: needs.site.result == 'success' && needs.plan.outputs.parity == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/built-site
        with:
          built: ${{ needs.site.result == 'success' }}
      - name: Builder axes match the weapon and reach the board
        # `CI` is set by Actions; the script reads it to drop Chrome's sandbox,
        # which a runner has no user namespace for.
        env:
          WFSIM_PARITY_SHARD: ${{ matrix.shard }}/4
        run: node scripts/check_parity.mjs
      # A RIVEN GAIN SENDS THE SEARCH ITS PAGE SHOWS: one function builds it for the
      # page, the bot and the survey, and the page's own controls must set up the
      # same search on every weapon — a clean boot a pair, so it shares the shards.
      - name: A riven gain's search is the one its page shows
        env:
          WFSIM_RIVEN_SHARD: ${{ matrix.shard }}/4
        run: node scripts/check_riven_request.mjs

  # Remaining page checks and the board's library.
  page-rest:
    needs: [plan, site]
    if: needs.site.result == 'success' && needs.plan.outputs.page_rest == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [account, views, builder-1, builder-2, builder-3, heads, library]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/built-site
        with:
          built: ${{ needs.site.result == 'success' }}
      # THE DATABASE THE CHECKS BELOW RUN THE WORKER ON: an in-memory Postgres
      # (scripts/pg/test_db.mjs), and the client the pipeline's scripts use.
      - name: The checks' Postgres
        run: npm ci --silent --prefix scripts/pg
      # THE FIGHT'S PLAYER, in the same browser job. Its controls move between
      # blocks as the page is reorganised, and a check nobody runs goes stale
      # without a sound: a moved control is a null, and every assertion after
      # it is never asked.
      - name: The Tenno reaches the panel, the sim and a share link
        if: matrix.group == 'account'
        run: node scripts/check_tenno.mjs
      # A BAR REDRAWN BEFORE ITS PAGE HAS A BUILD threw inside the account's
      # answer, which then skipped the sign-in entry, the notices and the sync —
      # an error only the usage log ever saw.
      - name: A build bar redrawn before its page has a build throws nothing
        if: matrix.group == 'account'
        run: node scripts/check_bar_before_catalog.mjs
      - name: Riven OCR loads real models and recovers after a failed module response
        if: matrix.group == 'builder-3'
        run: node scripts/check_riven_ocr.mjs
      - name: Collected mods compute supported clauses and disclose the rest
        if: matrix.group == 'account'
        run: node scripts/check_collected_mods.mjs
      - name: Supported lower mod ranks reach the fight
        if: matrix.group == 'account'
        run: node scripts/check_every_rank.mjs
      - name: Swipe exposes only eligible claws and applies its rank limits
        if: matrix.group == 'builder-1'
        run: node scripts/check_swipe.mjs
      - name: Postures apply combat effects and disclose their partial limits
        if: matrix.group == 'builder-2'
        run: node scripts/check_postures.mjs
      - name: Read-only build rivens stay separate from owned customs
        if: matrix.group == 'account'
        run: node scripts/check_riven_board.mjs
      - name: Customs precede their presets without reviving deleted rivens
        if: matrix.group == 'account'
        run: node scripts/check_sync_customs.mjs
      - name: Preset sync keeps concurrent edits and explicit local copies
        if: matrix.group == 'account'
        run: node scripts/check_sync_client.mjs
      - name: Cloud sync starts only when enabled and can be paused
        if: matrix.group == 'account'
        run: node scripts/check_cloud_page.mjs
      - name: A shared build carries its riven and chosen label
        if: matrix.group == 'account'
        run: node scripts/check_share.mjs
      # HOW DEEP THE BOARD IS READ, which the publisher no longer decides. The
      # rule moved from a binary with unit tests to a page without, and its
      # failure is silent in both directions: a cut drawn with `>` deletes the
      # row exactly on the line, and an empty group reads as a weapon nobody
      # tried. Injected rows, so it can ask about exactly half.
      - name: The board is as deep as the reader asked
        if: matrix.group == 'views'
        run: node scripts/check_board_depth.mjs
      - name: Kitgun module navigation keeps the selected slot and build
        if: matrix.group == 'builder-1'
        run: node scripts/check_kitgun_slot.mjs
      - name: The Build Library filters sorts and streams published builds
        if: matrix.group == 'views'
        run: node scripts/check_build_library.mjs
      - name: Startup scene work and cache lifetimes stay bounded
        if: matrix.group == 'views'
        run: node scripts/check_frontend_performance.mjs
      - name: Simple and advanced filters compile to one query
        if: matrix.group == 'views'
        run: node scripts/check_library_attributes.mjs
      - name: Global calculation conditions keep one editable state
        if: matrix.group == 'builder-2'
        run: node scripts/check_global_conditions.mjs
      - name: Working navigation and execution controls remain accessible
        if: matrix.group == 'builder-3'
        run: node scripts/check_working_navigation.mjs
      # THE DOWNLOAD OFFER, which has three answers and only one of them is
      # visible on the machine it was written on. Its failure modes are silent
      # and plausible — a Mac or Linux reader handed an .exe, a phone reader
      # handed a 34 MB download, a source badge that draws an icon and names
      # nothing — and each looks like a working page.
      - name: The download offer answers the machine asking
        if: matrix.group == 'views'
        run: node scripts/check_downloads.mjs
      # A DOCUMENT CARRIES ITS OWN PAGE AND NOBODY ELSE'S. Both halves of that
      # fail silently — a document keeping all four bodies is merely large, and
      # a page whose body was taken and never fetched is merely blank — so
      # neither shows up as an error anywhere else.
      - name: A document carries its own page
        if: matrix.group == 'views'
        run: node scripts/check_own_body.mjs
      - name: Every page is titled in both languages
        if: matrix.group == 'views'
        run: node scripts/check_page_titles.mjs
      - name: A fired reminder is a card in the corner and a count on the bell, never a strip over the page
        if: matrix.group == 'views'
        run: node scripts/check_reminder_notices.mjs
      - name: Feedback is a mark beside the bell, one box and its screenshots, sent with where the reader was
        if: matrix.group == 'views'
        run: node scripts/check_feedback_panel.mjs
      - name: The compute page's total is every order, dispatched and waiting, each kind a row of one list
        if: matrix.group == 'views'
        run: node scripts/check_compute_orders.mjs
      - name: The board's scene and shooting choices are independent and survive a link
        if: matrix.group == 'builder-3'
        run: node scripts/check_board_ladder.mjs
      - name: All board selectors and labels share the same hierarchy
        if: matrix.group == 'builder-2'
        run: node scripts/check_board_selection.mjs
      - name: A built-in search is read-only, a click copies it, and the run button sends the page's own search
        if: matrix.group == 'builder-3'
        run: node scripts/check_search_presets.mjs
      - name: Final requirements and modular part pins survive start editing
        if: matrix.group == 'builder-2'
        run: node scripts/check_optimizer_requirements.mjs
      - name: All presets share numeric naming, management and inert info
        if: matrix.group == 'builder-2'
        run: node scripts/check_preset_library.mjs
      - name: Complete Warframe and companion builds upload automatically and open from their libraries
        if: matrix.group == 'builder-3'
        run: node scripts/check_equipment_library.mjs
      - name: One hundred presets keep a compact searchable switcher
        if: matrix.group == 'builder-2'
        run: node scripts/check_preset_compact.mjs
      - name: Motovore physical mods and progenitor bonus reach the shared simulator
        if: matrix.group == 'builder-3'
        run: node scripts/check_motovore.mjs
      - name: Mode APL code and prose share executable rules and persistent folds
        if: matrix.group == 'builder-2'
        env:
          WFSIM_MODE_DETAILS_ONLY: "1"
        run: node scripts/check_mode_def.mjs
      # THE SUBMISSION ENDPOINT, in the same job because it costs nothing: no
      # browser, no engine, no network — it imports `worker/index.js` and runs
      # it against a KV stub. It is here rather than on demand because the two
      # bugs it exists for were both invisible for weeks: a dropped field does
      # not throw, it produces a record the scorer quietly refuses, and the
      # submitter is told "sent". See docs/BOARD.md.
      - name: The board's submission endpoint keeps the whole build
        if: matrix.group == 'library'
        run: node scripts/check_board_submit.mjs
      - name: The heads answer as the whole board
        if: matrix.group == 'heads'
        run: node scripts/check_board_heads.mjs
      - name: The account rules hold against the real schema
        if: matrix.group == 'library'
        run: node scripts/check_accounts.mjs
      - name: Volunteer clients claim devices through the same public browser flow
        if: matrix.group == 'library'
        run: node scripts/check_device_link.mjs
      - name: The public CLI manifest uses the same-origin door without reader credentials
        if: matrix.group == 'library'
        run: node scripts/check_client_manifest.mjs
      - name: Device approval uses the shared compute controls and fits a phone
        if: matrix.group == 'library'
        run: node scripts/check_device_link_page.mjs
      - name: Recommendations settle at UTC midnight and retain account points
        if: matrix.group == 'library'
        run: node scripts/check_recommendations.mjs
      - name: Short share links store a build and nothing else
        if: matrix.group == 'library'
        run: node scripts/check_share_short.mjs
      # A USAGE EVENT named on one side only is a time series that never starts,
      # and nothing throws. Stub dataset, no network.
      - name: Usage points agree between page and worker
        if: matrix.group == 'library'
        run: node scripts/check_usage_events.mjs
      # …AND IT CAN BE PUT BACK. A backup nobody has restored is a hope: the
      # restore runs once, under pressure, by someone who has just lost data,
      # which is the worst moment to find a typo in it. Stub database, no network.
      - name: The library can be put back
        if: matrix.group == 'library'
        run: bash scripts/restore_library.sh --self-test
      # THE LIBRARY IS ONE QUERY, and the failure mode it replaces is a SHORT
      # LIST — which publishes a perfectly valid board with rows missing and
      # nothing anywhere saying so. Stub database, no network: asserted that two
      # pages cannot overlap or skip, that each record is PARSED rather than
      # carried as the text the column holds, and that a short read refuses.
      - name: The library is one query, and a short one refuses
        if: matrix.group == 'library'
        run: bash scripts/fetch_library.sh --self-test
      # …AND A FACT REACHES THE DATABASE THE MOMENT IT IS COMPUTED. The failure
      # this guards is the one that lost a whole rescore: work that is durable
      # only once a run ENDS. Asserted with a stub database — a row appended after
      # a ship goes alone, an identity with a quote in it is BOUND and not
      # interpolated, two modes of one build stay two rows, and the cursor may
      # not move past a refusal or that row is never shipped again.
      - name: A fact is shipped as it is computed
        if: matrix.group == 'library'
        run: bash scripts/ship_facts.sh --self-test
      # …AND READ BACK BY GENERATION. The read is where a paging bug hides: two
      # pages that overlap or skip leave a row the pipeline recomputes for ever
      # and nothing says so, which is why the ORDER BY is asserted rather than
      # assumed.
      - name: A generation is read back whole
        if: matrix.group == 'library'
        run: bash scripts/fetch_facts.sh --self-test
      # THE OTHER HALF OF THE DOOR. A submission arrives verbatim because the
      # endpoint has no game data; these two carry it to `wfsim-intake`, which
      # has the engine, and put what it derived in the library. The order is the
      # safety argument and is asserted: every build is written BEFORE any queue
      # row is spent, so a refusal leaves the submission where the next run will
      # find it rather than dropping it.
      - name: What arrived is read out of the queue
        if: matrix.group == 'library'
        run: bash scripts/fetch_inbox.sh --self-test
      # A backfill writes only the corners the library lacks, never an end.
      - name: A duration malus's inside rolls reach stored builds
        if: matrix.group == 'library'
        run: bash scripts/backfill_duration_corners.sh --self-test
      # …AND WHAT CAN NEVER BE PAID IS FORGOTTEN. A queue row is deleted beside
      # the fact that settles it, so a row under a retired ruler is owed for
      # ever and the "N row(s) owed" signal never returns to zero. Its statement
      # is built without a database, which is the half that could empty the
      # queue and the half a self-test can reach.
      - name: A row owed under a retired ruler is forgotten
        if: matrix.group == 'library'
        run: bash scripts/purge_queue.sh --self-test
      - name: A row no build can pay is forgotten, and nothing else
        if: matrix.group == 'library'
        run: bash scripts/purge_orphans.sh --self-test
      # A CANCEL NAMES ITS ROWS, BOUND, AND NEVER WAITS ON A SYNC: the selector
      # and the statements are built without a database; check_pg_scripts runs
      # the cancel itself.
      - name: A cancel names its rows and skips what a sync holds
        if: matrix.group == 'library'
        run: bash scripts/cancel_queue.sh --self-test
      - name: What intake made of an arrival reaches the library
        if: matrix.group == 'library'
        run: bash scripts/ship_builds.sh --self-test
      # A REFRESH ASKS WHAT THE FACTORY HAS ROOM FOR, and a row near its fifteen
      # days whatever the room: the oldest first, never more than an hour's.
      - name: A refresh asks the oldest rows the room allows, and the forced ones
        if: matrix.group == 'library'
        run: python3 scripts/oldest_rows.py --self-test
      # AN EDIT THAT LEAVES THE TOKENS ALONE MOVES NO ENGINE: comments, layout
      # and test-only items are not what a number is computed from.
      - name: Rust is read as its tokens for the engine id
        if: matrix.group == 'library'
        run: python3 scripts/rust_tokens.py --self-test
      # AN OLDER ENGINE IS ACCEPTED WHERE ITS BITS ARE THE SERVED ONE'S, and
      # nowhere else: a weapon's data and its linked forms, never mechanics.
      - name: An older engine is accepted exactly on the weapons its data matches
        if: matrix.group == 'library'
        run: (python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml) && python3 scripts/check_engine_grace.py
      # THE WHOLE HOP, IN ONE. Each end of it has its own test and all of them
      # passed on the day `mode` was in the door's key, because no test looked at
      # what came out the far end. What a player PLACES and what the library
      # HOLDS is one question; this is the only place it is asked.
      - if: matrix.group == 'library'
        run: cargo build --release --bin wfsim-intake
      - name: A submission survives the hop into the library
        if: matrix.group == 'library'
        run: node scripts/check_submission_hop.mjs

  services:
    needs: [plan, quick, runtime]
    if: needs.plan.outputs.services == 'true' && needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --silent --prefix scripts/pg
      - name: Maintenance fences APIs and scheduled work while draining preserves existing work
        run: node scripts/check_maintenance.mjs
      - name: A fissure is logged once with its planet, and each combination says how often it came
        run: node scripts/check_world_fissures.mjs
      - name: What the site tells an account reaches it and nobody else, read once, kept as long as it says
        run: node scripts/check_notices.mjs
      - name: What a reader tells the owner is kept for them and the account alone, and goes with it
        run: node scripts/check_feedback.mjs
      - name: User calculations retain ownership, share verified reports and exclude incompatible clients
        run: node scripts/check_user_task_service.mjs
      - name: Riven delivery names its first calculator while two accepted witnesses retain credit
        run: node scripts/check_riven_delivery.mjs
      - name: Nona result copy and exact published measurement witnesses agree
        run: (python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml==6.0.3) && node scripts/check_nona_results.mjs
      - name: Expedited board reviews preserve old scores until fresh independent agreement
        run: node scripts/check_board_reviews.mjs
      - name: New family candidates share verified optimization and stop after one generation
        run: node scripts/check_board_family.mjs
      - name: A riven appraisal is asked once and answered once
        run: node scripts/check_appraise.mjs
      - name: A client's number reaches the board only when CLIENTS_PER_FACT clients agree
        run: node scripts/check_board_verify.mjs
      - name: Protocol 8 hands out by protocol 7's rules and holds a client to its time
        run: node scripts/check_board_sync.mjs
      - name: A dial is set within its bounds, logged, and told to the clients
        run: node scripts/check_dials.mjs
      - name: A machine's compute counts under the account that claimed it, its name on the ranking only by consent
        run: node scripts/check_contribution.mjs
      - name: Computation witnesses retain credit independently of fourteen day details
        run: node scripts/check_compute_attribution.mjs
      - name: A device's ledger says where every point went, and names nobody else
        run: node scripts/check_ledger.mjs
      - name: Task modules isolate dispatch, committed results and retryable consumers
        run: node scripts/check_task_modules.mjs
      - name: A computer on but idle is found by what the server keeps, and said once
        run: node scripts/check_idle_devices.mjs
      - name: Complete demand includes unadmitted work without counting it twice
        run: |
          node scripts/check_task_inventory.mjs
          node scripts/check_inventory_capture.mjs
          node scripts/check_inventory_cursor.mjs
          NODE_OPTIONS=--max-old-space-size=96 node scripts/check_inventory_ack.mjs
          node scripts/check_library_array.mjs
          node scripts/check_incremental_inventory.mjs
          node scripts/check_incremental_inventory_pg.mjs
          node scripts/check_inventory_concurrency.mjs
          python3 scripts/check_pg_health.py
          node scripts/check_pipeline_monitor.mjs

  mcp:
    needs: [plan, site]
    if: needs.site.result == 'success' && needs.plan.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/built-site
        with:
          built: 'true'
      - name: The MCP server's queries run with no page
        run: node scripts/check_mcp_tools.mjs
      - name: The MCP server knows who calls, and how often
        run: node scripts/check_mcp_auth.mjs
      - name: The actual MCP entry installs all data before querying
        run: node scripts/check_mcp_entry.mjs

  bot:
    needs: [plan, site]
    if: needs.site.result == 'success' && needs.plan.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/built-site
        with:
          built: 'true'
      - run: npm ci --silent --prefix scripts/pg
      # THE BOT DRAWS ITS CARD WITH NO PAGE and Chrome only rasterizes it: a
      # card that drifted from the page's is still a picture, just a wrong one.
      - name: The bot's card is the page's, pixel for pixel
        run: node scripts/check_card_document.mjs
      - name: The bot server is sent every module the live board's scripts import
        run: python3 scripts/ship_bot.py --self-test
      # A SIGNATURE THAT DOES NOT VERIFY is sent anyway and read as a stranger.
      - name: What the tooling signs verifies, and the directory holds no private key
        run: node scripts/check_bot_auth.mjs
      # THE BOTS' DOORS hold only what the platform signed, and answer once.
      - name: The QQ door keeps signed messages and hands each out once
        run: node scripts/check_qq.mjs
      - name: Discord clan forms accept signed members and answer privately
        run: node scripts/check_discord.mjs

  ci-required:
    if: ${{ always() }}
    needs: [plan, quick, runtime, protocol, factory-cases, factory, prepare-desktop, prepare-live, commits, coordination, hotfix, test, gas, engine-apart, published-board, site, native-mac, native-linux, checks, services, pipeline, page, parity, page-rest, mcp, bot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Every selected check succeeded
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
          REUSE_RUN: ${{ needs.plan.outputs.reuse }}
        run: node scripts/ci_runs.mjs gate
      - name: Record candidate waits and expensive steps
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci_metrics.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ci-proof
          path: ci-proof.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-timing
          path: ci-timing.json
          if-no-files-found: warn
          retention-days: 7
