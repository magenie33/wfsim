name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A BRANCH'S BUILD ON DEMAND, to try a change to the build itself before main.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with mise.toml
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # NATIVE AND WASM COUNT THE SAME WORK (docs/WASM.md §"Gas"): both built from
  # this commit, a fixed set of rows fought by each must give the same gas,
  # work and score — the native client and every browser are paid alike.
  gas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with mise.toml
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - name: Native and wasm give the same gas, work and score
        run: |
          bindgen=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/$bindgen/wasm-bindgen-$bindgen-x86_64-unknown-linux-musl.tar.gz" | tar xz
          WASM_BINDGEN="$PWD/wasm-bindgen-$bindgen-x86_64-unknown-linux-musl/wasm-bindgen" node scripts/check_gas.mjs build
      - name: A compute lane stays small
        run: node scripts/check_lane_memory.mjs pkg=target/gas-check-pkg

  # THE ENGINE IS ITS CODE (docs/WASM.md §"Code and data"): the shipped module
  # built at another path, with a weapon's number edited, is the same bytes,
  # and only the data pack moves — so a data release never costs a reader the
  # module, and one source never builds two.
  engine-apart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with mise.toml
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: One source builds one module, and data moves only the pack
        run: python3 scripts/check_engine_apart.py

  # THE PUBLISHED SNAPSHOT IS A LEGAL BOARD — a fact about publish.yml's output,
  # so it is a job of its own: inside `test` it stopped the one run that repairs
  # it, since publish.yml waits for `test` and a tightened door leaves the
  # snapshot holding rows the door now refuses.
  published-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with mise.toml
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Every published row is a legal build
        run: cargo test -p wfsim-cli --lib every_published_row_is_a_legal_build -- --ignored

  # A commit names its author and no tool. Blobless, because only the messages
  # are read; the range is what this push or pull request adds.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: No commit credits an AI tool
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          from="${BASE:-$BEFORE}"
          if ! git cat-file -e "$from^{commit}" 2>/dev/null; then from="$HEAD_SHA~1"; fi
          node scripts/check_commit_trailers.mjs "$from..$HEAD_SHA"

  # THE SITE THIS COMMIT BUILDS — built here, once: `parity` checks it and
  # ship.yml publishes this very artifact, so what ships is what was checked.
  # A pull request has no keys to the build cache and is checked against the
  # committed site/ instead.
  site:
    if: github.event_name != 'pull_request'
    # PINNED, not ubuntu-latest: the image a release is built on moves when we move it.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/site-tools
        with:
          cos_secret_id: ${{ secrets.COS_SECRET_ID }}
          cos_secret_key: ${{ secrets.COS_SECRET_KEY }}
          cos_bucket: ${{ secrets.COS_BUCKET }}
          cos_region: ${{ secrets.COS_REGION }}
      - name: Build site/
        # UNBUFFERED, so each line is stamped when it was said and the log shows
        # which part of the build the time went to.
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/build_site_app.py
      # NOT site/board/: the board bots own it, and ship.yml lays this over a
      # checkout whose board may be newer than the one this read.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-built
          path: |
            site/
            !site/board/
            desktop/payload/
            mcp/engine.js
          # site/.well-known/ is the agents' door, and a dot directory.
          include-hidden-files: true
          retention-days: 7

  # The page is not something `cargo test` can see. These jobs check the site
  # this commit builds — the artefact Cloudflare will deploy — in PARALLEL, each
  # laying it the same way, so CI takes as long as the slowest of them: a check
  # goes in the job of its kind, and one that grows past the others is split.
  # This one: the files, the door and the services' own checks, no page.
  checks:
    needs: site
    if: ${{ !cancelled() && (needs.site.result == 'success' || needs.site.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/built-site
        with:
          built: ${{ needs.site.result == 'success' }}
      # EVERY CHECK SCRIPT PARSES, before any of them is run. A stray backtick
      # in a comment closes the template literal a browser check hands the page,
      # and it has done so seven times — each one costing a full browser run to
      # find, because the parser reports it as a SyntaxError inside
      # `node:internal` naming the line the literal starts on. Milliseconds, no
      # browser, so it goes first: a check that cannot parse cannot fail
      # honestly either.
      - name: Every check script parses
        run: node scripts/check_page_bodies.mjs
      # Prose states the current rule and names nobody. Also milliseconds and no
      # browser, so it sits beside the parser check at the front.
      - name: Prose states the current rule
        run: node scripts/check_comment_style.mjs
      # A TIME IS STORED ONE WAY: ISO 8601 to the millisecond, or a day.
      - name: Every stored time is one format
        run: node scripts/check_time_storage.mjs
      # APP.JS IS ITS PARTS, joined in filename order: nothing else sits beside
      # them, no part outgrows the ceiling, and no whole app.js competes.
      - name: app.js is its parts
        run: node scripts/check_app_parts.mjs
      # AN ENTER OR AN ESC IS THE INPUT METHOD'S while it composes pinyin.
      - name: Enter and Esc wait for the input method
        run: node scripts/check_ime_keys.mjs
      # THE ENGINE'S LAYERS: no module names one above its own, and no two reach
      # each other. The compiler accepts both inside a crate, so this is where
      # they are caught. Milliseconds, no browser.
      - name: The engine depends one way
        run: node scripts/check_engine_layers.mjs
      # NONA'S CORE IS PURE, so what she is sent, what is set aside and what a
      # stored shape migrates to are unit-tested here without a browser.
      - name: Nona's core logic holds
        run: node scripts/test_nona_core.mjs
      # SHE REACHES THE PAGE ONLY THROUGH THE DOOR. A module can name any of
      # app.js's top-level names and it works until one is renamed; this fails
      # first, along with an import that points up a layer.
      - name: Nona keeps to her side of the door
        run: node scripts/check_nona_boundary.mjs

      - name: A rescore is triggered by everything that buys one
        run: node scripts/check_rescore_paths.mjs
      # THE BUILD SAYS WHICH RELEASE IT IS, and its engine module cannot be
      # paired with another build's. Both fail silently — a page with no
      # identity still opens, and a cached module still loads — so they are
      # asserted about the committed `site/`, in the job that already reads it.
      # No browser: every one of them is a fact about the files.
      - name: The build says which release it is
        run: node scripts/check_release_identity.mjs
      # THE PAGE'S ONE PROGRAMMATIC SURFACE. Everything that drives the page
      # from outside — the checks, an in-page agent, a bot — stands on
      # `window.wfsim`, so its two properties are worth a check rather than a
      # convention: an action names a control that is on the page, and the
      # decisions it shares with the page's own handlers exist once. Both fail
      # silently — a door onto a button nobody has still answers, and a second
      # copy of a rule behaves identically until one of them is edited.
      - name: The agent door is one door
        run: node scripts/check_agent_door.mjs
      # THE TWO WORKERS SERVE ONE SITE: the edge's assets are the placed one's,
      # and the page and the engine never cross to the placed worker.
      - name: The edge worker serves the site
        run: node scripts/check_edge_worker.mjs
      # A SIGNATURE THAT DOES NOT VERIFY is sent anyway and read as a stranger.
      - name: What the tooling signs verifies, and the directory holds no private key
        run: node scripts/check_bot_auth.mjs
      - name: The browser's agent gets the door's table
        run: node scripts/check_webmcp.mjs
      # THE DATABASE THE CHECKS BELOW RUN THE WORKER ON: an in-memory Postgres
      # (scripts/pg/test_db.mjs), and the client the pipeline's scripts use.
      - name: The checks' Postgres
        run: npm ci --silent --prefix scripts/pg
      # THE BOTS' DOORS hold only what the platform signed, and answer once.
      - name: The QQ door keeps signed messages and hands each out once
        run: node scripts/check_qq.mjs
      - name: A fissure is logged once with its planet, and each combination says how often it came
        run: node scripts/check_world_fissures.mjs
      - name: What the site tells an account reaches it and nobody else, read once, kept as long as it says
        run: node scripts/check_notices.mjs
      - name: A riven typed for fx reads every way a line is written, its side as the card says it
        run: node scripts/check_fx_lines.mjs
      - name: A riven appraisal is asked once and answered once
        run: node scripts/check_appraise.mjs
      - name: A client's number reaches the board only when CLIENTS_PER_FACT clients agree
        run: node scripts/check_board_verify.mjs
      - name: Protocol 8 hands out by protocol 7's rules and holds a client to its time
        run: node scripts/check_board_sync.mjs
      - name: Every item on a fight's path is metered
        run: node scripts/check_gas.mjs
      - name: Prose is never read where a number is computed
        run: node scripts/check_prose.mjs
      - name: The clients' contract states the values the code holds
        run: node scripts/check_clients_doc.mjs
      - name: A dial is set within its bounds, logged, and told to the clients
        run: node scripts/check_dials.mjs
      - name: A machine's compute counts under the account that claimed it, its name on the ranking only by consent
        run: node scripts/check_contribution.mjs
      - name: A device's ledger says where every point went, and names nobody else
        run: node scripts/check_ledger.mjs
      - name: Every question becomes a fact, and nobody waits on one that cannot
        run: node scripts/check_tasks.mjs
      - name: A computer on but idle is found by what the server keeps, and said once
        run: node scripts/check_idle_devices.mjs

  # The board's pipeline and the factory against a real Postgres, no page.
  pipeline:
    needs: site
    if: ${{ !cancelled() && (needs.site.result == 'success' || needs.site.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/built-site
        with:
          built: ${{ needs.site.result == 'success' }}
      # THE DATABASE THE CHECKS BELOW RUN THE WORKER ON: an in-memory Postgres
      # (scripts/pg/test_db.mjs), and the client the pipeline's scripts use.
      - name: The checks' Postgres
        run: npm ci --silent --prefix scripts/pg
      - name: The board's pipeline reads and writes Postgres
        run: node scripts/check_pg_scripts.mjs
      - name: While work is short an account past its fair share waits, and only then
        run: node scripts/check_fair.mjs
      - name: The settler in shadow judges as the request path does, and says where it does not
        run: node scripts/check_settler.mjs
      - name: Answers queued for the settler leave what settling them in the request leaves, once
        run: node scripts/check_settler_async.mjs
      - name: The factory holds with every answer queued and settled by the settler's pass
        env:
          WFSIM_SETTLE_ASYNC: "1"
        run: |
          node scripts/check_tasks.mjs
          node scripts/check_board_verify.mjs
          node scripts/check_board_sync.mjs
          node scripts/check_fair.mjs
      - name: A sync as one call answers and writes what the statements do, in two round trips at most
        run: node scripts/check_sync_proc.mjs
      - name: Every ask names who asked, one asker is held to its share, and a code is erased once the ask is over
        run: node scripts/check_initiator.mjs
      - name: A batch is asked most popular weapon first, and a place is due by its batch's day
        run: node scripts/check_popular_order.mjs
      - name: Merit mints from contribution points within the day's and the balance's caps, and an account sees only its own
        run: node scripts/check_merit.mjs
      - name: Protocol 8 holds with each sync one call, its answers settled in the request or queued
        env:
          WFSIM_SYNC_PROC: "1"
        run: |
          node scripts/check_board_sync.mjs
          WFSIM_SETTLE_ASYNC=1 node scripts/check_board_sync.mjs
      - name: A row its page still computes is kept for it, and only a silent one loses it
        run: node scripts/check_renew.mjs
      - name: A riven gain is run by the community and credited when two owners agree
        run: node scripts/check_riven_gain.mjs
      - name: The site reads the live board, and the committed one only until it exists
        run: node scripts/check_board_live.mjs

  # The page in headless Chrome: its controls, lanes and queue.
  page:
    needs: site
    if: ${{ !cancelled() && (needs.site.result == 'success' || needs.site.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/built-site
        with:
          built: ${{ needs.site.result == 'success' }}
      # THE DATABASE THE CHECKS BELOW RUN THE WORKER ON: an in-memory Postgres
      # (scripts/pg/test_db.mjs), and the client the pipeline's scripts use.
      - name: The checks' Postgres
        run: npm ci --silent --prefix scripts/pg
      # A BOX THAT REDRAWS UNDER A COMPOSITION takes no Chinese at all, while
      # Latin typing looks fine.
      - name: Every search box takes a Chinese input method
        run: node scripts/check_ime_search.mjs
      # NONA RUNS ON THE DOOR, against a local stand-in provider: her tools are
      # the door's table at request time, and her first change branches the
      # reader's build. Neither is visible until a reader loses a build.
      - name: Nona works the page on a copy
        run: node scripts/check_nona.mjs
      # A CONTROL WITH NO DOOR ROW is a feature Nona silently cannot use. Every
      # control on the page is inside an action's anchor or in AGENT_EXEMPT
      # with its reason, and the not-yet list only shrinks.
      - name: Every control is on the door or says why not
        run: node scripts/check_agent_coverage.mjs
      - name: The compute page shows what each device does, by kind, and nothing private
        run: node scripts/check_compute.mjs
      - name: A lost lane is replaced and says where, and a slow call is not taken for a dead one
        run: node scripts/check_calc_recovers.mjs
      - name: Protocol 8 on the page keeps every result and holds to the signal and next_ms
        run: node scripts/check_compute_queue.mjs
      - name: A new release is taken at once, and the reload loses the reader nothing
        run: node scripts/check_release_follow.mjs
      - name: The home tally and the ranking are CDN files first, the worker their fallback
        run: node scripts/check_stats_files.mjs
      # A WORKER THAT LIVES IN EVERY READER'S BROWSER is wrong for weeks: it falls
      # back on a slow road only, never on a sound one, and its way back works.
      - name: The page cache answers a slow road and never a sound one
        run: node scripts/check_page_cache.mjs

  # The builder against every weapon: the slowest sweep, so it is SHARDED, every
  # fourth weapon to a job (WFSIM_PARITY_SHARD).
  parity:
    needs: site
    if: ${{ !cancelled() && (needs.site.result == 'success' || needs.site.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/built-site
        with:
          built: ${{ needs.site.result == 'success' }}
      - name: Builder axes match the weapon and reach the board
        # `CI` is set by Actions; the script reads it to drop Chrome's sandbox,
        # which a runner has no user namespace for.
        env:
          WFSIM_PARITY_SHARD: ${{ matrix.shard }}/4
        run: node scripts/check_parity.mjs

  # The rest of the page, the board's library and the MCP server.
  page-rest:
    needs: site
    if: ${{ !cancelled() && (needs.site.result == 'success' || needs.site.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/built-site
        with:
          built: ${{ needs.site.result == 'success' }}
      # THE DATABASE THE CHECKS BELOW RUN THE WORKER ON: an in-memory Postgres
      # (scripts/pg/test_db.mjs), and the client the pipeline's scripts use.
      - name: The checks' Postgres
        run: npm ci --silent --prefix scripts/pg
      # THE FIGHT'S PLAYER, in the same browser job. Its controls move between
      # blocks as the page is reorganised, and a check nobody runs goes stale
      # without a sound: a moved control is a null, and every assertion after
      # it is never asked.
      - name: The Tenno reaches the panel, the sim and a share link
        run: node scripts/check_tenno.mjs
      # A BAR REDRAWN BEFORE ITS PAGE HAS A BUILD threw inside the account's
      # answer, which then skipped the sign-in entry, the notices and the sync —
      # an error only the usage log ever saw.
      - name: A build bar redrawn before its page has a build throws nothing
        run: node scripts/check_bar_before_catalog.mjs
      # HOW DEEP THE BOARD IS READ, which the publisher no longer decides. The
      # rule moved from a binary with unit tests to a page without, and its
      # failure is silent in both directions: a cut drawn with `>` deletes the
      # row exactly on the line, and an empty group reads as a weapon nobody
      # tried. Injected rows, so it can ask about exactly half.
      - name: The board is as deep as the reader asked
        run: node scripts/check_board_depth.mjs
      # THE DOWNLOAD OFFER, which has three answers and only one of them is
      # visible on the machine it was written on. Its failure modes are silent
      # and plausible — a Mac or Linux reader handed an .exe, a phone reader
      # handed a 34 MB download, a source badge that draws an icon and names
      # nothing — and each looks like a working page.
      - name: The download offer answers the machine asking
        run: node scripts/check_downloads.mjs
      # A DOCUMENT CARRIES ITS OWN PAGE AND NOBODY ELSE'S. Both halves of that
      # fail silently — a document keeping all four bodies is merely large, and
      # a page whose body was taken and never fetched is merely blank — so
      # neither shows up as an error anywhere else.
      - name: A document carries its own page
        run: node scripts/check_own_body.mjs
      - name: Every page is titled in both languages
        run: node scripts/check_page_titles.mjs
      - name: A fired reminder is a card in the corner and a count on the bell, never a strip over the page
        run: node scripts/check_reminder_notices.mjs
      # THE SUBMISSION ENDPOINT, in the same job because it costs nothing: no
      # browser, no engine, no network — it imports `worker/index.js` and runs
      # it against a KV stub. It is here rather than on demand because the two
      # bugs it exists for were both invisible for weeks: a dropped field does
      # not throw, it produces a record the scorer quietly refuses, and the
      # submitter is told "sent". See docs/BOARD.md.
      - name: The board's submission endpoint keeps the whole build
        run: node scripts/check_board_submit.mjs
      # A SHORT SHARE LINK stores a build under the worker's own hash of it, and
      # nothing that is not a share code. Stub store, no network.
      # THE WORKERS RUN THE PAGE'S OWN PARTS, copied by a generator: a stale
      # codec previews a link by a grammar the page left behind, and a stale
      # headless table answers an agent with queries the page has moved past.
      - name: The workers' copies are the page's parts
        run: node scripts/gen_worker_parts.mjs --check
      - name: The MCP server's queries run with no page
        run: node scripts/check_mcp_tools.mjs
      - name: The MCP server knows who calls, and how often
        run: node scripts/check_mcp_auth.mjs
      - name: What an agent reads to find WFSim is what the site serves
        run: node scripts/check_agent_discovery.mjs
      - name: The account rules hold against the real schema
        run: node scripts/check_accounts.mjs
      - name: Short share links store a build and nothing else
        run: node scripts/check_share_short.mjs
      # A USAGE EVENT named on one side only is a time series that never starts,
      # and nothing throws. Stub dataset, no network.
      - name: Usage points agree between page and worker
        run: node scripts/check_usage_events.mjs
      # …AND IT CAN BE PUT BACK. A backup nobody has restored is a hope: the
      # restore runs once, under pressure, by someone who has just lost data,
      # which is the worst moment to find a typo in it. Stub database, no network.
      - name: The library can be put back
        run: bash scripts/restore_library.sh --self-test
      # THE LIBRARY IS ONE QUERY, and the failure mode it replaces is a SHORT
      # LIST — which publishes a perfectly valid board with rows missing and
      # nothing anywhere saying so. Stub database, no network: asserted that two
      # pages cannot overlap or skip, that each record is PARSED rather than
      # carried as the text the column holds, and that a short read refuses.
      - name: The library is one query, and a short one refuses
        run: bash scripts/fetch_library.sh --self-test
      # …AND A FACT REACHES THE DATABASE THE MOMENT IT IS COMPUTED. The failure
      # this guards is the one that lost a whole rescore: work that is durable
      # only once a run ENDS. Asserted with a stub database — a row appended after
      # a ship goes alone, an identity with a quote in it is BOUND and not
      # interpolated, two modes of one build stay two rows, and the cursor may
      # not move past a refusal or that row is never shipped again.
      - name: A fact is shipped as it is computed
        run: bash scripts/ship_facts.sh --self-test
      # …AND READ BACK BY GENERATION. The read is where a paging bug hides: two
      # pages that overlap or skip leave a row the pipeline recomputes for ever
      # and nothing says so, which is why the ORDER BY is asserted rather than
      # assumed.
      - name: A generation is read back whole
        run: bash scripts/fetch_facts.sh --self-test
      # THE OTHER HALF OF THE DOOR. A submission arrives verbatim because the
      # endpoint has no game data; these two carry it to `wfsim-intake`, which
      # has the engine, and put what it derived in the library. The order is the
      # safety argument and is asserted: every build is written BEFORE any queue
      # row is spent, so a refusal leaves the submission where the next run will
      # find it rather than dropping it.
      - name: What arrived is read out of the queue
        run: bash scripts/fetch_inbox.sh --self-test
      # A backfill writes only the corners the library lacks, never an end.
      - name: A duration malus's inside rolls reach stored builds
        run: bash scripts/backfill_duration_corners.sh --self-test
      # …AND WHAT CAN NEVER BE PAID IS FORGOTTEN. A queue row is deleted beside
      # the fact that settles it, so a row under a retired ruler is owed for
      # ever and the "N row(s) owed" signal never returns to zero. Its statement
      # is built without a database, which is the half that could empty the
      # queue and the half a self-test can reach.
      - name: A row owed under a retired ruler is forgotten
        run: bash scripts/purge_queue.sh --self-test
      - name: A row no build can pay is forgotten, and nothing else
        run: bash scripts/purge_orphans.sh --self-test
      # A CANCEL NAMES ITS ROWS, BOUND, AND NEVER WAITS ON A SYNC: the selector
      # and the statements are built without a database; check_pg_scripts runs
      # the cancel itself.
      - name: A cancel names its rows and skips what a sync holds
        run: bash scripts/cancel_queue.sh --self-test
      - name: Every ruler's walk runs once, at once, its log in roster order
        run: bash scripts/each_ruler.sh --self-test
      - name: ...and what intake made of it reaches the library
        run: bash scripts/ship_builds.sh --self-test
      - name: The bot server is sent every module the live board's scripts import
        run: python3 scripts/ship_bot.py --self-test
      # A REFRESH ASKS WHAT THE FACTORY HAS ROOM FOR, and a row near its fifteen
      # days whatever the room: the oldest first, never more than an hour's.
      - name: A refresh asks the oldest rows the room allows, and the forced ones
        run: python3 scripts/oldest_rows.py --self-test
      # AN EDIT THAT LEAVES THE TOKENS ALONE MOVES NO ENGINE: comments, layout
      # and test-only items are not what a number is computed from.
      - name: Rust is read as its tokens for the engine id
        run: python3 scripts/rust_tokens.py --self-test
      # AN OLDER ENGINE IS ACCEPTED WHERE ITS BITS ARE THE SERVED ONE'S, and
      # nowhere else: a weapon's data and its linked forms, never mechanics.
      - name: An older engine is accepted exactly on the weapons its data matches
        run: (python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml) && python3 scripts/check_engine_grace.py
      # THE WHOLE HOP, IN ONE. Each end of it has its own test and all of them
      # passed on the day `mode` was in the door's key, because no test looked at
      # what came out the far end. What a player PLACES and what the library
      # HOLDS is one question; this is the only place it is asked.
      - run: cargo build --release --bin wfsim-intake
      - name: A submission survives the hop into the library
        run: node scripts/check_submission_hop.mjs
