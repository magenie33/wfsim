id: shivering_contagion
name: Shivering Contagion
rarity: rare
polarity: naramon
base_drain: 4                 # max drain 9 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Rifle/WeaponSpreadFreezeProcsMod
description: "On Cold Status Effect: X% chance to spread that status to other enemies within 6m."

# NOT MODELED: status SPREAD is a multi-target mechanic and the arena is one
# target, so there is nothing for a proc to spread to. Worth zero here and
# worth a great deal in a crowd.
effects:
  # 2D groundwork (2026-08-01): a real stat with no SINGLE-TARGET damage
  # payload. It used to be `kind: unmodeled`, which threw the number away.
  # `audit_mod_effects` flags this CONDITIONAL-AS-FLAT, correctly: the spread
  # rolls on a Cold status. Flat anyway, for the same reason as Aerial Ace —
  # `CondBucket` holds damage buckets only, so a triggered multi-target stat
  # routed through `kind: buff` would resolve to nothing. It is a per-proc
  # CHANCE, so flat is also what a 2D consumer wants to read.
  - kind: status_spread_chance
    rank0: 0.17
    rankMax: 1.00

source:
  url: https://wiki.warframe.com/w/Shivering_Contagion
