id: sinister_reach
name: Sinister Reach
rarity: uncommon
polarity: naramon
base_drain: 2                 # max drain 5 at rank 3
max_rank: 3
exilus: true
internal_name: /Lotus/Upgrades/Mods/Rifle/WeaponBeamDistanceMod
description: "+Xm Beam Range"

# WHICH WEAPONS MAY EQUIP IT — a CATALOG, and DE's own rule is a hidden tag we
# cannot read: "the mod can only be equipped on weapons with the hidden BEAM
# compatibility tag". The export does not carry it (WFCD says `PRIMARY`, which
# is not the whole rule), so the wiki's list is the source and it is
# transcribed rather than derived from "is this weapon continuous".
#
# THAT PROPERTY TEST WAS WRONG IN BOTH DIRECTIONS, which is why it is gone. The
# Torid's Incarnon form is a continuous beam and cannot take it (modding is
# decided on the BASE form, which is a grenade launcher — user, 2026-07-31), and
# the page names the other end of the same error: "Does not currently work with
# continuous Robotic beam weapons like: Artax, Tazicor, Verglas".
#
# LISTED BY GROUP, so an Incarnon form counts as the weapon it belongs to. The
# per-attack notes on the page — "only affects Amprex's initial beam, does not
# affect beam chains", "only affects Panthera's Alt-fire", "only affects
# Phantasma's primary fire" — need no transcription: a chain reads
# `chain_range_m`, and an attack that states no range keeps INFINITY under any
# bonus, so the entries those notes exclude are exactly the ones with nothing to
# extend.
#
# NOT IN THE ROSTER YET, from the same list: Lizzie, and primary Gaze kitguns.
exclusive_to: [amprex, convectrix, flux_rifle, glaxion, glaxion_vandal,
               tenet_glaxion, ignis, ignis_wraith, phage, quanta, quanta_vandal,
               tenet_quanta, synapse, coda_synapse, panthera, panthera_prime,
               phantasma, phantasma_prime]

effects:
  # THE METRES ARE REAL NOW (2026-08-22). Beam range became a WALL on
  # 2026-08-19 (`gap_m <= ap.range_m`), and this mod moves it. What was missing
  # was never the metres, it was the BRACKET — and the wiki does state it, on
  # Galvanized Acceleration's page rather than on this one: "Sinister Reach will
  # not be affected by this mod as it gives a flat beam length increase AFTER
  # percent bonuses." So a flat add lands outside the percentage, and
  # `loadout::resolve` computes `range x (1 + percent) + flat`.
  - kind: beam_range_bonus
    rank0: 3.0
    rankMax: 12.0

source:
  url: https://wiki.warframe.com/w/Sinister_Reach
