id: sinister_reach
name: Sinister Reach
rarity: uncommon
polarity: naramon
base_drain: 2                 # max drain 5 at rank 3
max_rank: 3
exilus: true
internal_name: /Lotus/Upgrades/Mods/Rifle/WeaponBeamDistanceMod
description: "+Xm Beam Range"

# CONTINUOUS WEAPONS ONLY - an EQUIP restriction, not an inert effect. WFCD
# tags it PRIMARY, which is not the whole rule: the Torid cannot install it
# (user, 2026-07-31), and DE's own internal name is WeaponBeamDistanceMod.
#
# The Torid is the case that shows where the line is drawn: its INCARNON form
# is a continuous beam, and it still cannot take this mod. Modding is decided
# on the BASE form, which is a semi-auto grenade launcher.
requires_weapon: continuous

# NOT MODELED: the engine carries `beam.range_m` but has no mod kind that
# scales it. Nothing in the roster can equip this today anyway.
effects:
  # 2D groundwork (2026-08-01): a real stat with no SINGLE-TARGET damage
  # payload. It used to be `kind: unmodeled`, which threw the number away.
  # …AND IT SAYS SO ON THE CARD (2026-08-19). `unmodeled` rides ALONGSIDE the
  # real effect rather than replacing it — replacing it is what threw the number
  # away — so the reader sees the metres AND the "not modelled yet" badge.
  #
  # IT BECAME A REAL DISCREPANCY on the day range was modelled. Before that the
  # sim had no reach at all, so a mod that extends one changed nothing and was
  # right to say nothing. Now a range is a WALL, this mod moves it in game, and
  # it does not here: measured on an Ocucor (20 m) with Ruinous Extension
  # (+8 m) against a target at 25 m — 0 damage with the mod and 0 without.
  #
  # NOT IMPLEMENTED YET because the BRACKET is unsourced. The flat mods are
  # unambiguous on their own (+8, +12 metres) and so is the percentage on its
  # own (+30%), but the Phantasma can hold Sinister Reach AND Galvanized
  # Acceleration at once, and neither Sinister Reach's page, Beam Length nor
  # Continuous Weapon states whether flat and percent add or multiply. A
  # faithful-looking formula without a measurement is not correct.
  - kind: unmodeled
  - kind: beam_range_bonus
    rank0: 3.0
    rankMax: 12.0

source:
  url: https://wiki.warframe.com/w/Sinister_Reach
