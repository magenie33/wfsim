id: combustion_beam
name: Combustion Beam
rarity: rare
polarity: madurai
base_drain: 4                 # max drain 9 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Rifle/WeaponBeamExplodeOnDeath
description: "Enemies killed explode, dealing X Damage shortly after death."

# CONTINUOUS WEAPONS ONLY, same rule as Sinister Reach - PRIMARY is the compat
# tag, not the whole restriction, and DE's internal name says Beam.
requires_weapon: continuous

# NOT MODELED: a corpse explosion only pays against a SECOND target, and the
# arena has one. Flat damage, not a percentage - stored as the raw number.
effects:
  # 2D groundwork: a real stat with no SINGLE-TARGET damage
  # payload — never `kind: unmodeled`, which throws the number away.
  - kind: explosion_on_kill
    rank0: 100.0
    rankMax: 600.0

source:
  url: https://wiki.warframe.com/w/Combustion_Beam
