id: hunter_munitions
name: Hunter Munitions
rarity: uncommon
polarity: madurai
base_drain: 4                 # max drain 9 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Sets/Hunter/PrimaryHunterMunitionsMod
description: "+X% chance to apply Slash on Critical"

# A CRITICAL hit rolls this chance to apply a Slash status, per pellet, and
# the roll is its own: "not affected by the weapon's Status Chance, or damage
# type distribution, besides being indirectly affected by its Critical Chance"
# (wiki). A weapon with no Slash in its vector still gets one - that is the
# whole mod. On a high-crit build it is one of the largest damage sources in
# the game, because Slash bleeds bypass armour entirely.
#
# The proc it applies is an ORDINARY Slash status, so it inherits that
# mechanic whole: 0.35 x ModdedBase per tick, ignoring armour, scaled by the
# PROCCING hit's crit and body-part multipliers - "Headshots, orange and red
# Critical Hits will greatly increase the damage dealt" - and lengthened by
# status duration mods (its own set mate, Hunter Track, does exactly that).
effects:
  - kind: slash_on_crit
    rank0: 0.05
    rankMax: 0.30

set: hunter

source:
  url: https://wiki.warframe.com/w/Hunter_Munitions
