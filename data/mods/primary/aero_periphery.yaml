id: aero_periphery
name: Aero Periphery
rarity: common
polarity: naramon
base_drain: 2                 # max drain 5 at rank 3
max_rank: 3
exilus: true
internal_name: /Lotus/Upgrades/Mods/Sets/Hawk/HawkModC
description: "-X% Zoom while Aim Gliding"

# NOT MODELED: aim-glide zoom is a handling effect with no damage term, like
# the other zoom mods. Its value in a build is being an Aero set member in the
# exilus slot - and that set's bonus is itself unmodeled (data/mod_sets/aero).
effects:
  # 2D groundwork: zoom already had a bucket - this mod just had
  # no way into it. The card REDUCES zoom, so the value is negative: the bucket
  # sums signed contributions and a riven's +zoom lands in the same one.
  - kind: zoom_bonus
    rank0: -0.125
    rankMax: -0.50

set: aero

source:
  url: https://wiki.warframe.com/w/Aero_Periphery
