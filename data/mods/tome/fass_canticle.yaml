# A TOME MOD. The Grimoire is a Tome, and *"Tomes can equip Pistol Mods but also
# have access to unique Tome Mods that grant player buffs or enemy debuffs"*
# (wiki `Tome`) — so this pool sits BESIDE `pistol` rather than replacing it.
#
# EVERY ONE OF THE EIGHT BUYS SOMETHING THIS ARENA DOES NOT HAVE, and each says
# which rather than sharing one sentence: see the `unmodeled`/`out_of_scope`
# line on each. That is the point of loading them at all — a card a player owns
# and cannot find in the builder is indistinguishable from one the app got
# wrong, and now the builder offers it and states what it is worth here.
#
# DRAIN AND MAX RANK COME FROM THE EXPORT, which is the ONE standing exception
# to "the wiki wins" (AGENTS.md): the wiki is wrong about them for ~20 mods.
# The RANK TABLE and the description are the wiki's own.

id: fass_canticle
name: Fass Canticle
rarity: rare
polarity: naramon
base_drain: 4                # max drain 7 at rank 3
max_rank: 3
internal_name: /Lotus/Upgrades/Grimoire/FassAuraMod
description: "Killing enemies grants Allies in Affinity Range X% Shield Recharge Rate and -X% Shield Recharge Delay for 15s."
effects:
  # NOBODY ELSE IS HERE. This arena is one Tenno (docs/UNMODELLED.md,
  # "no allies"), and every point of this card is spent on them — an ally
  # shield rate and an ally recharge delay, both of which need a squad to
  # pay out at all. It cannot be worth anything here, which is a different
  # statement from "not modelled yet" and is why it is `out_of_scope`.
  - kind: ally_buff
    rank0: 0.25
    rankMax: 0.4
  # TWO NUMBERS, TWO EFFECTS. The card states a recharge RATE and a recharge
  # DELAY, and a description's X's are filled one effect at a time — one entry
  # would leave the second placeholder standing, which
  # `desc_info_fills_every_x_across_the_pool` is there to catch.
  - kind: ally_buff
    rank0: -0.07
    rankMax: -0.28
  # …AND WHAT IT IS WORTH HERE, said on the card rather than left to be
  # inferred from a number that never moves the answer.
  - kind: out_of_scope

source:
  url: https://wiki.warframe.com/w/Tome_Mods
