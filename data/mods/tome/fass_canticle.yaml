id: fass_canticle
name: Fass Canticle
rarity: rare
polarity: naramon
base_drain: 4                # max drain 7 at rank 3
max_rank: 3
internal_name: /Lotus/Upgrades/Grimoire/FassAuraMod
description: "Killing enemies grants Allies in Affinity Range X% Shield Recharge Rate and -X% Shield Recharge Delay for 15s."
effects:
  # THE PLAYER IS AN ALLY, so this DOES land on the wielder — which is the
  # opposite of what stood here. It was filed out of scope on the reading that
  # "Allies in Affinity Range" means other people and this arena has none; its
  # sibling Lohk Canticle pays the player and so does this.
  #
  # WHAT STOPS IT IS THE OTHER HALF OF THE FIGHT. Nobody shoots back here
  # (docs/UNMODELLED.md), so the player's shields never fall and there is
  # nothing for a recharge rate or a recharge delay to be worth. That is a
  # statement about the arena and it changes the day the arena has an enemy that
  # fires — where "there are no allies" would have been wrong for ever.
  - kind: ally_buff
    rank0: 0.25
    rankMax: 0.4
  # TWO NUMBERS, TWO EFFECTS. The card states a recharge RATE and a recharge
  # DELAY, and a description's X's are filled one effect at a time — one entry
  # would leave the second placeholder standing, which
  # `desc_info_fills_every_x_across_the_pool` is there to catch.
  - kind: ally_buff
    rank0: -0.07
    rankMax: -0.28
  - kind: out_of_scope

source:
  url: https://wiki.warframe.com/w/Tome_Mods
