internal_name: /Lotus/Upgrades/Grimoire/VomeStrikeMod
description: "Alternate Fire increases Ability Strength by X% for 20s for each enemy hit. Stacks up to 15 times."
effects:
  # see notes: card_with_stat_swapped
  #
  # see notes: taken_at_cap_weapon
  #
  # AND IT PAYS. `abilities_data::at_strength` is linear, so Ability Strength is
  # a straight multiplier on what Roar, Eclipse or Nourish is worth — a mod on
  # the BUILD raising a knob on the FIGHT, which meet in
  # `DummyParams::from_panel` and nowhere else. Worth nothing with no Warframe
  # buff ticked, which is most fights and every board row.
  - kind: ability_stat
    stat: strength
    rank0: 0.01
    rankMax: 0.04
    max_stacks: 15

