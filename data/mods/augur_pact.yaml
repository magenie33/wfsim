id: augur_pact
kind: mod
name: Augur Pact
mod_type: pistol
rarity: common
polarity: naramon
base_drain: 2                 # drain 2..7
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Pistol/AugurSecondaryDamageMod

# +90% Damage -> the additive base-damage bucket (stacks with Hornet Strike).
# GUN-INDEPENDENT trait note: Augur is a SET mod (equipping multiple Augur mods
# across the loadout converts a fraction of shield spent into ability damage).
# That set bonus is a WARFRAME/ability effect, not weapon damage — out of scope
# here, so only the +90% Damage is modeled. Recorded so it isn't mistaken for
# a missing effect.
effects:
  - { kind: base_damage_bonus, per_rank: 0.15, max: 0.90 }

set: augur                    # informational: member of the Augur mod set

source:
  url: https://wiki.warframe.com/w/Augur_Pact
  note: Module:Mods/data. Set bonus (shield->ability damage) intentionally unmodeled.
