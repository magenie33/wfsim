id: shattering_storm
name: Shattering Storm
rarity: uncommon
polarity: vazarin
# see notes: stance_grants_capacity
base_drain: 0
max_rank: 0
internal_name: /Lotus/Weapons/Tenno/Melee/MeleeTrees/HammerCmbOneMeleeTree
description: "A Stance of crushing blows and shattering impacts."

# THE COMBOS THIS STANCE SUPPLIES, keyed by the FORM they are — which is the
# same id a MODE carries, so installing this replaces the weapon entry's own
# script for each of them and leaves the rest alone.
#
# EVERY NUMBER FROM `Module:Stances/data`, the wiki's own Lua table: `Dmg` is
# the percentages, `Hits` how many times each lands, `Procs` what it forces
# ("Knockback" is Impact's own proc), `Types` marks 360-degree spins and the
# slam a combo ends on, `ImpactMultiplier` is a bonus to the Impact component
# alone, and `Duration` is the combo's length at 1.0x attack speed.
#
# A MODE'S NAME IS FIXED AND ITS STRENGTH IS NOT. Swapping
# this card changes what `neutral` is WORTH and never what it is called — which
# is the only way the question a stance slot exists to answer can be asked at
# all: "which stance is best for the neutral combo" needs both builds to call
# that mode the same thing. The combo's own name is in the comment above each
# block, where it belongs: it is documentation for whoever transcribes the next
# stance, not a label the app draws.
#
# see notes: combo_clock_is_the_input
#
# THIS STANCE SLAMS FOUR TIMES IN ITS NEUTRAL COMBO — every input ends on one,
# which no other combo in the roster does and which is the whole reason to carry
# it on a hammer: `Types = { "Slam" }` on the trailing row of all four entries.
combos:
  # Falling Rock — 4.9 s at 1.0x, 4 inputs of 1.225 s
  neutral:
    - { multiplier: 4.0, delay_seconds: 0.0, forced_procs: [impact] }
    - { multiplier: 0.0, slam_multiplier: 1.0, delay_seconds: 1.225 }
    - { multiplier: 3.0, delay_seconds: 0.0 }
    - { multiplier: 3.0, delay_seconds: 0.0, forced_procs: [impact] }
    - { multiplier: 0.0, slam_multiplier: 1.0, delay_seconds: 1.225 }
    - { multiplier: 4.0, delay_seconds: 0.0, impact_multiplier: 1.5 }
    - { multiplier: 0.0, slam_multiplier: 1.0, delay_seconds: 1.225 }
    - { multiplier: 2.0, delay_seconds: 0.0, forced_procs: [knockdown] }
    - { multiplier: 5.0, delay_seconds: 0.0 }
    - { multiplier: 0.0, slam_multiplier: 1.0, delay_seconds: 1.225, forced_procs: [knockdown] }
  # Pounding Smite — 2.6 s at 1.0x, 4 inputs of 0.65 s
  forward:
    - { multiplier: 2.0, delay_seconds: 0.65, forced_procs: [impact] }
    - { multiplier: 2.0, delay_seconds: 0.65 }
    - { multiplier: 2.0, delay_seconds: 0.65, impact_multiplier: 1.5 }
    - { multiplier: 3.0, delay_seconds: 0.65, impact_multiplier: 1.5, forced_procs: [lifted] }
  # Rising Thunder — 3.3 s at 1.0x, 2 inputs of 1.65 s
  block:
    - { multiplier: 3.0, delay_seconds: 0.0 }
    - { multiplier: 3.0, delay_seconds: 1.65, forced_procs: [lifted] }
    - { multiplier: 5.0, delay_seconds: 0.0 }
    - { multiplier: 0.0, slam_multiplier: 1.0, delay_seconds: 1.65, forced_procs: [knockdown] }
  # Smashing Fury — 3.55 s at 1.0x, 3 inputs of 1.1833 s
  block_forward:
    - { multiplier: 3.0, delay_seconds: 0.0 }
    - { multiplier: 2.0, delay_seconds: 1.1833 }
    - { multiplier: 4.0, delay_seconds: 0.0 }
    - { multiplier: 2.0, delay_seconds: 1.1833, all_around: true }
    - { multiplier: 2.0, delay_seconds: 0.0, impact_multiplier: 1.5 }
    - { multiplier: 5.0, delay_seconds: 0.0, impact_multiplier: 1.5 }
    - { multiplier: 0.0, slam_multiplier: 1.0, delay_seconds: 1.1834, forced_procs: [knockdown] }
  # Crowd Fall — the heavy attack. IDENTICAL ON BOTH HAMMER STANCES, which is
  # worth stating: a hammer's heavy is its class multiplier (6x) delivered as an
  # alternating pair, and the stance decides only the animation and the procs.
  # The 1.2 s wind-up is its own clock and attack speed does not shorten it.
  heavy:
    - { multiplier: 6.0, windup_seconds: 1.2, delay_seconds: 0.0, forced_procs: [lifted] }
    - { multiplier: 6.0, windup_seconds: 1.2, delay_seconds: 0.0, forced_procs: [knockdown] }
  # Hell's Wave — the slide attack, also identical on both.
  slide:
    - { multiplier: 2.0, delay_seconds: 0.97, all_around: true, forced_procs: [impact] }

effects:
  - kind: out_of_scope

source:
  url: https://wiki.warframe.com/w/Shattering_Storm
  # THE MODULE TRUNCATES ALPHABETICALLY on the way in and this stance is past
  # the cut, so its numbers come from the RENDERED page — the fallback
  # docs/DATA_SOURCES.md already names for a module fetch. Its durations are
  # therefore DERIVED (the direct swings' total over the published
  # damage-per-second) rather than read off the module, and that derivation
  # reproduced all four of Crushing Ruin's module durations exactly, which is
  # what makes it trustworthy here: 3.0331 / 2.60 / 3.30 / 3.1558 s.
