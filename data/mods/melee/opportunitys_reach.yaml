# Rank 0: Enables Tennokai. Increases opportunity window to 2.8s and melee range by 0.75m for Tennokai attacks.
effects:
  # `Increases opportunity window to 4.0s` — double the base 2 s, which on a
  # 0.9 s swing is the difference between catching the flash and missing it.
  #
  # THE `+3m melee range for Tennokai attacks` HALF IS NOT MODELLED: reach is
  # resolved once at build time and this one is per swing.
  - kind: tennokai
    # RANK 0 from DE's card per rank; linear to the max-rank value below.
    window_seconds_rank0: 2.8
    window_seconds: 4.0
  - kind: unmodelled

family: tennokai

source:
