id: opportunitys_reach
name: Opportunity's Reach
rarity: uncommon
polarity: madurai
base_drain: 4
max_rank: 3
internal_name: /Lotus/Upgrades/EmpoweredHeavyMelee/PerfectReach
description: "Enables Tennokai. Increases opportunity window to Xs for Tennokai attacks."
# see notes: de_s_own_incompatibility
excludes_weapon: [power_weapon_lite, no_heavy_attack]
