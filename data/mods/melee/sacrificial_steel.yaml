id: sacrificial_steel
name: Sacrificial Steel
rarity: legendary
polarity: umbra
base_drain: 6
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/Sets/Sacrifice/MeleeSacrificeModB
description: "+220% Critical Chance (x2 for Heavy Attacks) / x1.33 Damage to Sentients"

# Rank 0: +20% Critical Chance (x2 for Heavy Attacks) / x1.03 Damage to Sentients
effects:
  # THE CARD SAYS `(x2 for Heavy Attacks)` and this kind is what carries it —
  # the ordinary crit bucket, added twice on a heavy form. It is stated per CARD
  # rather than by doubling the bucket, because Blood Rush is in the same
  # bracket and says nothing of the kind.
  - kind: crit_chance_bonus_heavy_doubled
    rank0: 0.2
    rankMax: 2.2
  # x1.33 DAMAGE TO SENTIENTS — a condition about the TARGET, so it is
  # SIMULATED rather than declared: `Faction::Sentient` is a faction this engine
  # already resolves, and the bonus pays whatever the fight's target is. No
  # ruler's body is a Sentient today, so it pays zero there and would pay 33%
  # the day one is fought.
  - kind: faction_damage_bonus
    faction: sentient
    rank0: 0.03
    rankMax: 0.33

family: true_steel

set: sacrifice

source:
  url: https://wiki.warframe.com/w/Sacrificial_Steel
