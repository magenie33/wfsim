effects:
  # THE ORIGINAL CONDITION OVERLOAD, and unlike the Galvanized family it is
  # unconditional: no kill to earn it, no stacks, no clock. It reads the
  # target's live status TYPE count on every swing, and how the term enters the
  # damage — which base, which attack parts — is the WEAPON's `co_behavior`.
  #
  # `+80% Melee Damage per Status Type affecting the target` (wiki, rank 5).
  # Two of its own rules are NOT modelled yet and are declared on the weapon:
  # it does not apply to slams, heavy slams or radial attacks, and the status
  # that a hit APPLIES does not amplify that same hit.
