id: steady_hands
kind: mod
name: Steady Hands
mod_type: pistol
rarity: rare
polarity: naramon
base_drain: 6                 # drain 6..11
max_rank: 5
exilus: true

# −60% Weapon Recoil. Recoil is an aim/handling effect with no damage model
