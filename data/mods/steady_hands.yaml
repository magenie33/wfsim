# the mod exists for the builder's exilus slot.
effects:
  - { kind: recoil_reduction, per_rank: -0.10, max: -0.60 }

source:
  url: https://wiki.warframe.com/w/Steady_Hands
  note: Exilus pistol mod. Recoil intentionally unmodeled (no aim model).
