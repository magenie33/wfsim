id: primed_deadly_efficiency
name: Primed Deadly Efficiency
rarity: legendary
polarity: madurai
base_drain: 4                 # max drain 14 at rank 10
max_rank: 10
# SOURCE SPLIT, and WFCD wins: the wiki module says
# `...PrimedArchwingDamageAfterReloadMod`, WFCD says `...DamageOnReloadMod`.
# The internal name is the JOIN KEY to DE's export, so it is decidable rather
# than a matter of taste — with the wiki's spelling this mod was the ONE
# archgun mod with no localized card text, because the join silently found
# nothing. WFCD's spelling joins and yields all 11 ranks (2026-08-01). The
# wiki module is hand-maintained; WFCD is generated from DE's own export, so
# it is authoritative for this field the same way it already is for
# `base_drain` / `max_rank` (AGENTS.md).
internal_name: /Lotus/Upgrades/Mods/Archwing/Rifle/PrimedArchwingDamageOnReloadMod
description: "On Reload From Empty:\n+X% Damage for Xs"

effects:
  # TRIGGERED, not flat - the skeleton had the damage always-on, which is
  # the mod for free. `on_reload` is the sim's nearest event: it fires on
  # every reload, where the card wants only a reload FROM EMPTY, so this
  # OVERSTATES uptime on a weapon that tops up early. Acceptable while the
  # sim reloads on empty anyway; a magazine-position-aware trigger is what
  # would make it exact.
  - kind: buff
    trigger: on_reload
    grants: base_damage
    rank0: 0.2
    rankMax: 2.2
    max_stacks: 1
    # RAMPS with rank: 2s at rank 0.
    duration_rank0: 2
    duration: 16.5

family: deadly_efficiency
incompatible_with: [deadly_efficiency]

source:
  url: https://wiki.warframe.com/w/Primed_Deadly_Efficiency
