# Primed Polar Magazine — the Baro version of Polar Magazine, released
# 2026-08-21 (Update 43.5.4, "Introduced to Baro Ki'Teer's rotation").
#
# THE NAME IS ABOUT A MAGAZINE AND THE MOD IS NOT. Both members of this family
# are ARCH-GUN COLD DAMAGE — the wiki's own sentence: "increases Cold damage of
# Archguns by 17% per rank for a maximum of 187% at rank 10". Nothing here
# touches magazine capacity, and reading the name as a hint would have filed it
# in the wrong bucket.
#
# Five more ranks than the uncommon and the same 4 base drain, so the ceiling is
# 14 rather than 9 — which is the whole shape of a Primed mod: more ranks at a
# steeper capacity cost, never a different effect.
id: primed_polar_magazine
name: Primed Polar Magazine
rarity: legendary
polarity: vazarin
base_drain: 4                 # max drain 14 at rank 10
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/Archwing/Rifle/Expert/ArchwingWeaponFreezeDamageModExpert
description: "+X% Cold"

effects:
  - kind: elemental_damage_bonus
    element: cold
    rank0: 0.17
    rankMax: 1.87

# "It is considered the same mod as its Uncommon counterpart, and as such, both
# mods cannot be equipped together" — the module states it from both sides
# (`Incompatible` on each entry), which is why the pair is declared on both.
family: polar_magazine
incompatible_with: [polar_magazine]

source:
  url: https://wiki.warframe.com/w/Primed_Polar_Magazine
  # Every value above is the wiki's `Module:Mods/data` entry, read on the day
  # the page was created: BaseDrain 4, MaxRank 10, Polarity Vazarin, Rarity
  # Legendary, Type Archgun, and the rank table 17% -> 187%. WFCD's export has
  # no entry for it yet, so there is nothing to cross-check against — the join
  # will start working on its own once the export catches up.
