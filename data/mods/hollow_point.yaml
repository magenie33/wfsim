id: hollow_point
kind: mod
name: Hollow Point
mod_type: pistol
rarity: rare
polarity: naramon
base_drain: 4                 # drain 4..9; corrupted (Orokin Vault) mod
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Pistol/CorruptedCritDmgForDmgMod

# A trade-off mod (corrupted): +crit damage at the cost of base damage. The
# downside is the SAME additive base-damage bucket as Hornet Strike, so it is
# modeled as a negative base_damage_bonus (not a separate penalty layer).
effects:
  - { kind: crit_damage_bonus,  per_rank: 0.10,   max: 0.60 }
  - { kind: base_damage_bonus,  per_rank: -0.025, max: -0.15 }

source:
  url: https://wiki.warframe.com/w/Hollow_Point
  note: Module:Mods/data (drain/polarity/rarity). +60% CD / -15% Damage at max.
