id: spring_loaded_chamber
name: Spring-Loaded Chamber
rarity: uncommon
polarity: madurai
base_drain: 2                 # max drain 7 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Rifle/Event/FireRateWhileAimingRifleMod
description: "On Reload:\n+X% Fire Rate when Aiming for Xs"

effects:
  # THE ONE ASSAULT-RIFLE-ONLY MOD THAT MOVES DPS. `on_reload` is an event the
  # sim already has, and `while_aiming` is satisfied — the fight's player aims
  # unless the scenario says otherwise, and a sentinel weapon always does.
  #
  # +75% fire rate for 9 s off every reload is a large slice of uptime on a
  # magazine that empties inside the window: Karak Wraith's 60 rounds at 11.67
  # rps is 5.1 s of firing, so the buff outlives the magazine that earned it.
  - kind: buff
    trigger: on_reload
    grants: fire_rate
    condition: while_aiming
    rank0: 0.125
    rankMax: 0.75
    max_stacks: 1
    # RAMPS with rank, like Deadly Efficiency: 2 s at rank 0, 9 s at max.
    duration_rank0: 2
    duration: 9

source:
  url: https://wiki.warframe.com/w/Spring-Loaded_Chamber
