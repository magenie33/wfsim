id: primed_pistol_ammo_mutation
name: Primed Pistol Ammo Mutation
rarity: legendary
polarity: naramon
base_drain: 0                 # max drain 10 at rank 10
max_rank: 10
exilus: true
internal_name: /Lotus/Upgrades/Mods/Pistol/Expert/WeaponPistolConvertAmmoModExpert
description: "Converts Primary ammo pickups to X% of Ammo Pick Up."

effects:
  # NOT LOADED: `mods_data::effect()` has no `ammo_conversion` arm, so this is
  # dropped and the mod loads with NO effects (data/README.md). Primary ammo
  # pickups become pistol ammo — an economy stat that only moves long-fight
  # sustain, never per-hit DPS. `from` is likewise unread; it is the column a
  # future ammo-economy consumer would want.
  - kind: ammo_conversion
    from: primary
    rank0: 0.08
    rankMax: 0.92

family: pistol_ammo_mutation
incompatible_with: [pistol_ammo_mutation]

source:
  url: https://wiki.warframe.com/w/Primed_Pistol_Ammo_Mutation
