id: amalgam_barrel_diffusion
name: Amalgam Barrel Diffusion
rarity: rare
polarity: madurai
base_drain: 10                 # max drain 15 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/DualSource/Pistol/MultishotDodgeMod
description: "+X% Multishot\n+X% Dodge Speed"

effects:
  - kind: multishot_bonus
    rank0: 0.1825
    rankMax: 1.095                 # TRUE value 109.50% - the UI tooltip rounds
                               # to 110%; we store the real number
  - kind: dodge_speed_bonus    # utility, not a damage bucket
    rank0: 0.10
    rankMax: 0.60
  - kind: acrobatic_speed_bonus  # hidden stat: faster roll animation
    rank0: 0.10
    rankMax: 0.60

# Utility bonuses are UNIVERSAL while the mod is on the carried secondary -
# no need to wield or aim it (holstered works).
utility_scope: universal_while_carried
# DE's own incompatibility tags, wiki infobox: `SENTINEL_WEAPON, POWER_WEAPON`
# — "Cannot be equipped on Sentinel weapons". Same reason as Amalgam Serration:
# the utility half above is a WARFRAME buff, and a companion is not the
# Warframe. This replaces a `restrictions: [not_on_sentinel_weapons]` note that
# stated the same fact in a spelling nothing read (2026-08-01); one vocabulary,
# and it is the mirror of `requires_weapon`.
excludes_weapon: [sentinel_weapon, power_weapon]


family: barrel_diffusion
incompatible_with: [barrel_diffusion, galvanized_diffusion]

source:
  url: https://wiki.warframe.com/w/Amalgam_Barrel_Diffusion
