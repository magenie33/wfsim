id: steady_hands
name: Steady Hands
rarity: rare
polarity: naramon
base_drain: 6                 # max drain 9 at rank 3
max_rank: 3
exilus: true
internal_name: /Lotus/Upgrades/Mods/Pistol/WeaponRecoilReductionMod
description: "-60% Weapon Recoil"

# −60% Weapon Recoil. Recoil is an aim/handling effect with no damage model
# here (the sim assumes perfect aim), so this is intentionally unmodeled —
# the mod exists for the builder's exilus slot.
# MaxRank 3, and the wiki MODULE says 5 — the module is wrong here. WFCD's
# export (DE's own, joined by uniqueName) gives fusionLimit 3 with four rank
# entries, and the wiki PAGE's rank table agrees: ranks 0–3, -15% Weapon Recoil to -60% Weapon Recoil.
# An earlier pass had this at 5 on the strength of a warframestat entry that
# was a NAME-COLLISION DUPLICATE — the exact trap that made internal_name the
# only acceptable join key (private/scripts/wfcd.py).
effects:
  - kind: recoil_reduction
    rank0: -0.15
    rankMax: -0.6

family: steady_hands
incompatible_with: [primed_steady_hands]

source:
  url: https://wiki.warframe.com/w/Steady_Hands
