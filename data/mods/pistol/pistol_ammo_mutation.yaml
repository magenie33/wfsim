id: pistol_ammo_mutation
name: Pistol Ammo Mutation
rarity: rare
polarity: naramon
base_drain: 2                 # max drain 7 at rank 5
max_rank: 5
exilus: true
internal_name: /Lotus/Upgrades/Mods/Pistol/WeaponPistolConvertAmmoMod
description: "Converts Primary ammo pickups to X% of Ammo Pick Up."

effects:
  # Primary ammo pickups become pistol ammo — an economy stat that only moves
  # long-fight sustain, never per-hit DPS. It LOADS now (2026-08-01) as an
  # indirect stat, so the number reaches the panel and the 2D world instead of
  # being thrown away. `from` is still unread: it is the column an ammo-economy
  # consumer would want, and there is nothing to spend it on yet.
  - kind: ammo_conversion
    from: primary
    rank0: 0.08
    rankMax: 0.5

family: pistol_ammo_mutation
incompatible_with: [primed_pistol_ammo_mutation]

source:
  url: https://wiki.warframe.com/w/Pistol_Ammo_Mutation
