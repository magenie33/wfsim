# CONCLAVE-ORIGIN BUT PvE-LEGAL. Its `internal_name` sits under
# /Lotus/Upgrades/Mods/PvPMods/, which is NOT a usability marker: Update 17.9
# made a set of Conclave mods equippable in PvE, and the wiki says of this one
# "Eject Magazine is an Exilus Weapon Mod for secondaries that are usable in
#   both PvE and Conclave".
# The authority is the Rifle_Mods / Pistol_Mods table, which tags the genuinely
# restricted ones "Exclusive to PvP" — this mod is NOT tagged. Do not delete it
# on the strength of the path alone (engine::mods_data pins the whole set).
id: eject_magazine
name: Eject Magazine
rarity: rare
polarity: naramon
base_drain: 6                 # max drain 9 at rank 3
max_rank: 3
exilus: true
internal_name: /Lotus/Upgrades/Mods/PvPMods/Pistol/PassiveReloadMod
description: "+X% Magazine Reloaded/s when Holstered"
# DE's own incompatibility tags, from the wiki's `Module:Mods/data`
# (`IncompatibilityTags`) — the same list the mod infobox prints. The
# WFCD export carries no such field, so this module is the only
# structured source for what a mod REFUSES to be equipped on.
excludes_weapon: [aoe, power_weapon]

# +20% Magazine Reloaded/s while HOLSTERED. The sim fires one weapon
# continuously (never holsters), so this is unmodeled; would matter for a
# future weapon-swap rotation model.
effects:
  - kind: holstered_reload
    rank0: 0.05
    rankMax: 0.2

source:
  url: https://wiki.warframe.com/w/Eject_Magazine
