id: hemorrhage
name: Hemorrhage
rarity: rare
polarity: madurai
base_drain: 10                 # max drain 15 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Pistol/WeaponBleedOnImpactPistolMod
description: "Impact Status Effects have X% chance to apply a Slash Status Effect (x2 when Fire Rate is below 2.5)"

effects:
  # On an applied Impact status, roll `chance` to also apply a Slash status.
  # ONE roll per damage instance (multiple Impact procs in one hit don't add
  # rolls), and never alongside another same-instance Slash source (wiki
  # notes). The threshold reads the LIVE modded fire rate; exactly 2.5 gets
  # NO bonus (strictly below).
  - kind: proc_conversion
    trigger: impact
    applies: slash
    rank0: 0.1
    rankMax: 0.35
    condition: fire_rate_below_2.5   # the chance is DOUBLED while this holds
    condition_multiplier: 2

source:
  url: https://wiki.warframe.com/w/Hemorrhage
