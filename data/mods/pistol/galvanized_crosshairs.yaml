id: galvanized_crosshairs
name: Galvanized Crosshairs
rarity: rare
polarity: madurai
base_drain: 2                 # max drain 12 at rank 10
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/Pistol/Event/CritChanceWhileAimingPistolSPMod
description: "On Headshot:\n+X% Critical Chance when Aiming for 12s\nOn Headshot Kill:\n+X% Critical Chance when Aiming for 12s. Stacks up to 5x."
# DE's own incompatibility tags, from the wiki's `Module:Mods/data`
# (`IncompatibilityTags`) — the same list the mod infobox prints. The
# WFCD export carries no such field, so this module is the only
# structured source for what a mod REFUSES to be equipped on.
excludes_weapon: [power_weapon]

effects:
  - kind: buff
    trigger: on_headshot
    condition: while_aiming
    grants: crit_chance          # relative crit chance
    rank0: 0.109
    rankMax: 1.20
    max_stacks: 1
    duration: 12
  # Unlike the other Galvanized mods, each stack has its OWN duration.
  - kind: buff
    trigger: on_headshot_kill
    condition: while_aiming
    grants: crit_chance
    rank0: 0.036
    rankMax: 0.40
    max_stacks: 5
    duration: 12
    # `decay` is NOT read by mods_data. The engine hardcodes the matching model
    # per effect kind — `ch_stacks` (dummy.rs) keeps one expiry PER stack and
    # retains the live ones. This line is the written record, not the source.
    decay: per_stack_expiry

family: hydraulic_crosshairs
incompatible_with: [hydraulic_crosshairs]

source:
  url: https://wiki.warframe.com/w/Galvanized_Crosshairs
