id: ruinous_extension
name: Ruinous Extension
rarity: uncommon
polarity: naramon
base_drain: 2                 # max drain 5 at rank 3
max_rank: 3
exilus: true
internal_name: /Lotus/Upgrades/Mods/Pistol/WeaponBeamDistanceMod
description: "+Xm Beam Range"

# WHICH WEAPONS MAY EQUIP IT — a CATALOG, and DE's own rule is a hidden tag we
# cannot read: "this mod can only be equipped on secondaries with the hidden
# BEAM Compatibility Tag". The export does not carry it (WFCD says `Pistol`), so
# the wiki's list is the source and it is transcribed rather than derived. The
# two exceptions are why no property test could stand in for it:
#   · "Despite its Incarnon form being a beam weapon, Furis cannot equip this
#     mod" — the same rule the Torid already taught us, that modding is decided
#     on the BASE form;
#   · "Tenet Spirex can equip this mod since it has the BEAM tag despite it not
#     being a beam weapon" — a weapon on the list that is not a beam at all.
# The Ocucor is NOT on the list, and `requires_weapon: continuous` was offering
# it this mod until now.
#
# LISTED BY GROUP, so an Incarnon form counts as the weapon it belongs to. The
# per-attack notes on the page — "only affects Atomos' initial beam", "does not
# affect throwing grenades when reloading" — need no transcription: a chain
# reads `chain_range_m` and a thrown grenade has no beam range, so neither is
# reachable from here.
exclusive_to: [atomos, catabolyst, coda_catabolyst, cycron, tenet_cycron,
               embolist, gammacor, synoid_gammacor, nukor, kuva_nukor,
               spectra, spectra_vandal, tenet_spirex]

effects:
  # THE METRES ARE REAL NOW. Beam range became a WALL on
  # 2026-08-19 (`gap_m <= ap.range_m`), and this mod moves it — measured on an
  # Ocucor at the time: 0 damage at 25 m with the mod and 0 without, because
  # the mod did nothing. What was missing was never the metres, it was the
  # BRACKET, and the wiki does state it — on Galvanized Acceleration's page
  # rather than on this one: "Sinister Reach will not be affected by this mod
  # as it gives a flat beam length increase AFTER percent bonuses." So a flat
  # add lands outside the percentage, and `loadout::resolve` computes
  # `range x (1 + percent) + flat`.
  - kind: beam_range_bonus
    rank0: 2.0
    rankMax: 8.0

source:
  url: https://wiki.warframe.com/w/Ruinous_Extension
