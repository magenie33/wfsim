id: pistol_acuity
name: Pistol Acuity
rarity: rare
polarity: naramon
base_drain: 6                 # max drain 16 at rank 10
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/Pistol/WeaponWeakpointCriticalChanceMod
description: "+X% Weak Point Damage\n+X% Weak Point Critical Chance. Multishot cannot be modified."

disables: [multishot]    # locks Multishot from being modified while equipped

effects:
  # Weak Point Damage is ADDED to the enemy's weak-point multiplier at 1.5×
  # the value on true weak points (a 3x head + rank 10 = 3 + 3.498 × 1.5 =
  # 8.247x, measured M123; MOA backpack is the 1.0× exception), and the sum
  # is MULTIPLICATIVE with headshot-multiplier bonuses (Deadhead).
  # see notes: card_rounds_the_rank_value
  - kind: weakpoint_damage_bonus
    rank0: 0.318
    rankMax: 3.498
  # Weak Point Crit Chance is a NORMAL relative crit-chance bonus (additive
  # with Pistol Gambit) active on weak-point hits only — the multiplicative-
  # crit behavior on some weapons was a bug fixed in 38.5. The same rank
  # value as the damage half: the card's table is the same row for row.
  - kind: weakpoint_crit_chance_bonus
    rank0: 0.318
    rankMax: 3.498

source:
  url: https://wiki.warframe.com/w/Pistol_Acuity
