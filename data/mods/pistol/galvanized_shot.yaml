id: galvanized_shot
kind: mod
name: Galvanized Shot
mod_type: pistol
rarity: rare
polarity: vazarin
base_drain: 2
max_rank: 10                   # drain 2..12
internal_name: /Lotus/Upgrades/Mods/Pistol/WeaponStatusChanceSPMod

effects:
  - { kind: status_chance_bonus, per_rank: 0.08, max: 0.80 }
  - kind: stacking_buff
    trigger: on_kill
    # CO-family payload (official CO source list): +40% per status TYPE
    # on the target, per stack, DIRECT HITS only. The bonus's arithmetic
    # is PER WEAPON (user, 2026-07-24) - three classes exist:
    #   additive_with_base_damage: joins the Hornet Strike bucket ->
    #     direct hit x (1 + bd + co x types) / (1 + bd)
    #   independent: free-standing x (1 + co x types)
    #   inert: does not apply on that weapon at all
    # The class is recorded on each weapon (co_behavior field); Dual
    # Toxocyst = additive (per Carnage Reign's adding behavior).
    per_stack: { condition_overload: 0.40 }
    max_stacks: 3
    duration_seconds: 14
    decay: lose_one_stack_and_reset_duration   # Galvanized family decay
    stack_rules:
      - Weapon-scoped kills grant and benefit, as with Galvanized
        Diffusion.
family: sure_shot
incompatible_with: [sure_shot, flawed_sure_shot]

source:
  url: https://wiki.warframe.com/w/Galvanized_Shot
