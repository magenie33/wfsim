id: semi_shotgun_cannonade
name: Semi-Shotgun Cannonade
rarity: uncommon
polarity: vazarin
base_drain: 4                 # max drain 9 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Shotgun/ShotgunSemiAutoFantasyMod
# "Only compatible with Semi-Auto Trigger" — the card's own first sentence, and
# it is an EQUIP rule, not a note. Unstated, this mod sat in every pool: Boar
# Prime is full-auto (`trigger: auto`) and the optimizer could hand back a
# winner carrying a mod the game will not let you slot.
# Resolved on the weapon's OWN trigger, which for a transform group is the
# base form's — the same line `continuous` falls on.
requires_weapon: semi_auto

description: "Only compatible with Semi-Auto Trigger. Fire Rate cannot be modified.\n+X% Damage\n+X Punch Through"

# Both halves of the card's first line — the rifle and pistol twins have
# carried them since 2026-08-02 (M23) and this one carried neither: it had a
# bare `- kind: fire_rate_bonus` with no value instead, a reading of "Fire Rate
# cannot be modified" as an EFFECT rather than as the LOCK it is. It parsed to
# a zero-valued bonus, so it rendered "+0% Fire Rate" on the card while a build
# stacked fire rate freely underneath a mod whose own text forbids it.
requires: semi_auto      # weapon trigger must be Semi-Auto, else the mod is inert
disables: [fire_rate]    # locks Fire Rate from being modified while equipped

effects:
  - kind: base_damage_bonus
    rank0: 0.4
    rankMax: 2.4
  - kind: punch_through_bonus
    rank0: 0.25
    rankMax: 1.5

source:
  url: https://wiki.warframe.com/w/Semi-Shotgun_Cannonade
