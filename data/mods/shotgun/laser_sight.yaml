id: laser_sight
name: Laser Sight
rarity: uncommon
polarity: madurai
base_drain: 4                 # max drain 9 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Shotgun/Event/CritChanceWhileAimingShotgunMod
description: "On Headshot:\n+X% Critical Chance when Aiming for Xs"

effects:
  # CONDITIONAL, not a flat crit bonus — the skeleton had it always-on, which
  # is the whole mod for free. The shotgun twin of Argon Scope (rifle) and
  # Hydraulic Crosshairs (pistol), numbers included.
  - kind: buff
    trigger: on_headshot
    condition: while_aiming
    grants: crit_chance          # relative crit chance
    rank0: 0.2
    rankMax: 1.2
    max_stacks: 1
    # RAMPS with rank (WFCD levelStats); `duration` is the max-rank value the
    # engine builds with, `duration_rank0` is where the card starts.
    duration_rank0: 2
    duration: 9

source:
  url: https://wiki.warframe.com/w/Laser_Sight
