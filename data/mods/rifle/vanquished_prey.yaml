  # "-100% Shield Recharge Delay for 10s"
  - kind: unmodeled
    rank0: -0.25
    rankMax: -1.0
  # "-25% from Health Orbs"
  - kind: unmodeled
    rank0: -0.0625
    rankMax: -0.25

