id: galvanized_scope
name: Galvanized Scope
rarity: rare
polarity: madurai
base_drain: 2                 # max drain 12 at rank 10
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/Rifle/Event/CritChanceWhileAimingRifleSPMod
# DE's card heads the stacks "On Weak Point Hit" too, a typo: its pistol twin
# reads "On Weak Point Kill" and the wiki says "Headshot kills will grant". The
# stacks are earned on a KILL, and this line says so (`de_i18n.py` ERRATA).
description: "On Weak Point Hit:\n+X% Critical Chance when Aiming for Xs\nOn Weak Point Kill:\n+X% Critical Chance when Aiming for Xs. Stacks up to Xx."
# see notes: exalted_mods_reenabled

effects:
  # BOTH halves are conditional - the skeleton had them as unconditional crit
  # chance, which is the whole mod's value handed over for free. Identical
  # shape to the pistol twin Galvanized Crosshairs, same numbers.
  - kind: buff
    trigger: headshot
    condition: aiming
    grants: crit_chance          # relative crit chance
    rank0: 0.1091
    rankMax: 1.2
    max_stacks: 1
    duration: 12
  # Unlike the other Galvanized mods, each stack has its OWN duration.
  - kind: buff
    trigger: headshot_kill
    condition: aiming
    grants: crit_chance
    rank0: 0.0364
    rankMax: 0.4
    max_stacks: 5
    duration: 12
    # `decay` is NOT read by data::mods. The engine hardcodes the matching model
    # per effect kind — `ch_stacks` (engine/src/fight/) keeps one expiry PER stack and
    # retains the live ones. This line is the written record, not the source.
    decay: per_stack_expiry

family: argon_scope
incompatible_with: [argon_scope]

source:
  url: https://wiki.warframe.com/w/Galvanized_Scope
