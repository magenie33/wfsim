id: galvanized_scope
name: Galvanized Scope
rarity: rare
polarity: madurai
base_drain: 2                 # max drain 12 at rank 10
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/Rifle/Event/CritChanceWhileAimingRifleSPMod
description: "On Headshot:\n+X% Critical Chance when Aiming for Xs\nOn Headshot Kill:\n+X% Critical Chance when Aiming for Xs. Stacks up to Xx."
# DE's own incompatibility tags, from the wiki's `Module:Mods/data`
# (`IncompatibilityTags`) — the same list the mod infobox prints. The
# WFCD export carries no such field, so this module is the only
# structured source for what a mod REFUSES to be equipped on.
excludes_weapon: [power_weapon]

effects:
  # BOTH halves are conditional - the skeleton had them as unconditional crit
  # chance, which is the whole mod's value handed over for free. Identical
  # shape to the pistol twin Galvanized Crosshairs, same numbers.
  - kind: buff
    trigger: on_headshot
    condition: while_aiming
    grants: crit_chance          # relative crit chance
    rank0: 0.1091
    rankMax: 1.2
    max_stacks: 1
    duration: 12
  # Unlike the other Galvanized mods, each stack has its OWN duration.
  - kind: buff
    trigger: on_headshot_kill
    condition: while_aiming
    grants: crit_chance
    rank0: 0.0364
    rankMax: 0.4
    max_stacks: 5
    duration: 12
    # `decay` is NOT read by mods_data. The engine hardcodes the matching model
    # per effect kind — `ch_stacks` (dummy.rs) keeps one expiry PER stack and
    # retains the live ones. This line is the written record, not the source.
    decay: per_stack_expiry

family: argon_scope
incompatible_with: [argon_scope]

source:
  url: https://wiki.warframe.com/w/Galvanized_Scope
