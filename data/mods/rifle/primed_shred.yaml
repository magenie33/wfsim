id: primed_shred
name: Primed Shred
rarity: legendary
polarity: madurai
base_drain: 6                 # max drain 16 at rank 10
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/Rifle/DualStat/PrimedShredMod
description: "+X% Fire Rate (x2 for Bows)\n+X Punch Through"

# The "(x2 for Bows)" clause is a LITERAL - the multiplier does not scale with
# rank. BOTH sources agree: WFCD levelStats prints the same "x2" at every rank,
# and the wiki's rank table carries a separate Fire Rate (Bows) column that is
# exactly twice the rifle column at every rank. That column also settles the
# scope - the multiplier applies to FIRE RATE only, not to punch through.
# No bow is in data/weapons yet, so nothing models it.
effects:
  # WFCD ramp: +5% -> +55%, NOT +100%. The single-source audit missed this
  # because candidates(1.0) includes the +1 multiplier reading 2.0, which
  # matched the "(x2 for Bows)" in the mod's own description.
  - kind: fire_rate_bonus
    rank0: 0.05
    rankMax: 0.55
  - kind: punch_through_bonus
    rank0: 0.2
    rankMax: 2.2

family: shred
incompatible_with: [shred]

source:
  url: https://wiki.warframe.com/w/Primed_Shred
