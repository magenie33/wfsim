# CONCLAVE-ORIGIN BUT PvE-LEGAL. Its `internal_name` sits under
# /Lotus/Upgrades/Mods/PvPMods/, which is NOT a usability marker: Update 17.9
# made a set of Conclave mods equippable in PvE, and the wiki says of this one
# "Agile Aim is an Exilus Weapon Mod for rifles usable in both PvE and Conclave".
# The authority is the Rifle_Mods / Pistol_Mods table, which tags the genuinely
# restricted ones "Exclusive to PvP" — this mod is NOT tagged. Do not delete it
# on the strength of the path alone (engine::mods_data pins the whole set).
id: agile_aim
name: Agile Aim
rarity: uncommon
polarity: madurai
base_drain: 2                 # max drain 5 at rank 3
max_rank: 3
exilus: true
internal_name: /Lotus/Upgrades/Mods/PvPMods/Rifle/FasterMovementWhileAimingRifleMod
description: "+X% Movement Speed when Aiming"

effects:
  # Movement speed is not a damage stat and the arena has no traversal.
  # "+20% Movement Speed when Aiming"
  # 2D groundwork: a real stat with no SINGLE-TARGET damage
  # payload — never `kind: unmodeled`, which throws the number away.
  - kind: movement_speed_bonus
    rank0: 0.05
    rankMax: 0.2

source:
  url: https://wiki.warframe.com/w/Agile_Aim
