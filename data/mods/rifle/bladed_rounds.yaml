id: bladed_rounds
name: Bladed Rounds
rarity: uncommon
polarity: madurai
base_drain: 4                 # max drain 9 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Rifle/Event/CritDamageWhileAimingRifleMod
description: "On Kill:\n+X% Critical Damage when Aiming for Xs"
# DE's own incompatibility tags, from the wiki's `Module:Mods/data`
# (`IncompatibilityTags`) — the same list the mod infobox prints. The
# WFCD export carries no such field, so this module is the only
# structured source for what a mod REFUSES to be equipped on.
excludes_weapon: [power_weapon]

effects:
  # CONDITIONAL - pistol twin Sharpened Bullets, but the rifle grants +120%
  # against its +75%.
  - kind: buff
    trigger: on_kill
    condition: while_aiming
    grants: crit_damage
    rank0: 0.2
    rankMax: 1.2
    max_stacks: 1
    # RAMPS with rank (WFCD levelStats); `duration` is the max-rank value
    # the engine builds with, `duration_rank0` is where the card starts.
    duration_rank0: 2
    duration: 9

source:
  url: https://wiki.warframe.com/w/Bladed_Rounds
