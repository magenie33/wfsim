# CONCLAVE-ORIGIN BUT PvE-LEGAL. Its `internal_name` sits under
# /Lotus/Upgrades/Mods/PvPMods/, which is NOT a usability marker: Update 17.9
# made a set of Conclave mods equippable in PvE, and the wiki says of this one
# "Twitch is a rifle mod usable in both PvE and PvP".
# The authority is the Rifle_Mods / Pistol_Mods table, which tags the genuinely
# restricted ones "Exclusive to PvP" — this mod is NOT tagged. Do not delete it
# on the strength of the path alone (engine::mods_data pins the whole set).
id: twitch
name: Twitch
rarity: uncommon
polarity: naramon
base_drain: 4                 # max drain 7 at rank 3
max_rank: 3
exilus: true
internal_name: /Lotus/Upgrades/Mods/PvPMods/Rifle/HolsterSpeedBonusMod
description: "On Equip: \n-X% Weapon Recoil and +X% Accuracy for Xs"

effects:
  # CONDITIONAL, and indirect either way: recoil and accuracy have no damage
  # model here (the sim assumes perfect aim), so this stays inert - but it must
  # not read as an unconditional stat change in the builder panel.
  - kind: buff
    trigger: on_equip
    grants: recoil_reduction
    rank0: -0.1
    rankMax: -0.4
    max_stacks: 1
    duration: 8
  - kind: buff
    trigger: on_equip
    grants: accuracy
    rank0: 0.1
    rankMax: 0.4
    max_stacks: 1
    duration: 8

source:
  url: https://wiki.warframe.com/w/Twitch
