id: vile_precision
name: Vile Precision
rarity: rare
polarity: naramon
base_drain: 4                 # max drain 9 at rank 5
max_rank: 5
exilus: true
internal_name: /Lotus/Upgrades/Mods/Rifle/DualStat/CorruptedRecoilFireRateRifle
description: "-X% Weapon Recoil\n-X% Fire Rate (x2 for Bows)"

# The "(x2 for Bows)" clause is a LITERAL - the multiplier does not scale
# with rank (WFCD levelStats). Bows double this mod's fire-rate effect;
# no bow is in data/weapons yet, so nothing models it.
effects:
  - kind: recoil_reduction
    rank0: -0.15
    rankMax: -0.9
  # DRAWBACK: -36% fire rate at max, not +100%. WFCD ramp: -6% -> -36%.
  - kind: fire_rate_bonus
    rank0: -0.06
    rankMax: -0.36

source:
  url: https://wiki.warframe.com/w/Vile_Precision
