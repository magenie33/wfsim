id: amalgam_serration
name: Amalgam Serration
rarity: rare
polarity: madurai
base_drain: 6                 # max drain 16 at rank 10
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/DualSource/Rifle/SerratedRushMod
description: "+X% Damage\n+X% Sprint Speed"

effects:
  - kind: base_damage_bonus
    rank0: 0.1409
    rankMax: 1.55
  # A WARFRAME stat the weapon carries — which is exactly why this mod cannot
  # go on a companion weapon (see `excludes_weapon` below).
  # "+25% Sprint Speed"
  # 2D groundwork: a real stat with no SINGLE-TARGET damage
  # payload. It used to be `kind: unmodeled`, which threw the number away.
  - kind: sprint_speed_bonus
    rank0: 0.0227
    rankMax: 0.25

family: serration
incompatible_with: [serration, spectral_serration]
# DE's own incompatibility tags, wiki infobox: `SENTINEL_WEAPON, POWER_WEAPON`,
# and the page states it outright — "This mod cannot be equipped on Sentinel
# weapons". The reason is the second half: "+25% Sprint Speed" is a WARFRAME
# buff that "always applies, regardless of whether or not you are holding the
# weapon it is equipped to", and a companion is not the Warframe. This is why
# plain Serration goes on Verglas Prime and this one does not. `power_weapon` (Exalted) is carried unused — we model none.
excludes_weapon: [sentinel_weapon, power_weapon]

source:
  url: https://wiki.warframe.com/w/Amalgam_Serration
