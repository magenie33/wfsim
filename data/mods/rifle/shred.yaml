id: shred
name: Shred
rarity: rare
polarity: madurai
base_drain: 6                 # max drain 11 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Rifle/DualStat/ShredMod
description: "+X% Fire Rate (x2 for Bows)\n+X Punch Through"

# The "(x2 for Bows)" clause is a LITERAL - the multiplier does not scale
# with rank (WFCD levelStats). Bows double this mod's fire-rate effect;
# no bow is in data/weapons yet, so nothing models it.
effects:
  - kind: fire_rate_bonus
    # WFCD ramp: +5% -> +30%. Was the placeholder pair (1/6, 1.0), which
    # is +100% fire rate at max - the sim read that, not just the card.
    rank0: 0.05
    rankMax: 0.30
  - kind: punch_through_bonus
    rank0: 0.2
    rankMax: 1.2

family: shred
incompatible_with: [primed_shred]

source:
  url: https://wiki.warframe.com/w/Shred
