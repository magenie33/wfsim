id: semi_rifle_cannonade
name: Semi-Rifle Cannonade
rarity: uncommon
polarity: vazarin
base_drain: 4                 # max drain 9 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Rifle/RifleSemiAutoFantasyMod
# "Only compatible with Semi-Auto Trigger" — the card's own first sentence, and
# it is an EQUIP rule, not a note. Unstated, this mod sat in every pool: Boar
# Prime is full-auto (`trigger: auto`) and the optimizer could hand back a
# winner carrying a mod the game will not let you slot.
# Resolved on the weapon's OWN trigger, which for a transform group is the
# base form's — the same line `continuous` falls on.
requires_weapon: semi_auto

description: "Only compatible with Semi-Auto Trigger. Fire Rate cannot be modified.\n+X% Damage\n+X Punch Through"
# DE's own incompatibility tags, from the wiki's `Module:Mods/data`
# (`IncompatibilityTags`) — the same list the mod infobox prints. The
# WFCD export carries no such field, so this module is the only
# structured source for what a mod REFUSES to be equipped on.
excludes_weapon: [modular_gun]
# Both halves of the card's first line, which this file used to state in prose
# and model nowhere — the pistol twin has carried them since it was written.
requires: semi_auto      # weapon trigger must be Semi-Auto, else the mod is inert
disables: [fire_rate]    # locks Fire Rate from being modified while equipped

effects:
  # There used to be a bare `- kind: fire_rate_bonus` here with no value: a
  # reading of "Fire Rate cannot be modified" as an EFFECT rather than as the
  # lock it is. It parsed to a zero-valued fire-rate bonus, so it changed no
  # number — but it also meant the lock was not modelled at all, and the mod
  # kept paying its damage on a full-auto weapon it cannot go on.
  - kind: base_damage_bonus
    rank0: 0.4
    rankMax: 2.4          # DE's card at max rank: +240% Damage
  - kind: punch_through_bonus
    rank0: 0.25
    rankMax: 1.5          # +1.5 Punch Through

source:
  url: https://wiki.warframe.com/w/Semi-Rifle_Cannonade
