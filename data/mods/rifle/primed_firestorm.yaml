id: primed_firestorm
name: Primed Firestorm
rarity: legendary
polarity: madurai
base_drain: 6                 # max drain 16 at rank 10
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/Rifle/Expert/WeaponIncreaseRadialExplosionModExpert
description: "Improves the Blast Radius of weapons with Radial Attacks.\n+X% Blast Range"

effects:
  # "+X% Blast RANGE", not Blast damage. The generated skeleton read the
  # description's word "Blast" as an element and gave this mod +44% Blast
  # DAMAGE, which on an AoE weapon also drags a whole element into the vector.
  # Same kind as the pistol twins Fulmination / Primed Fulmination, same
  # numbers as WFCD's levelStats (+4% -> +44% Blast Range).
  - kind: blast_radius_bonus
    rank0: 0.04
    rankMax: 0.44

family: firestorm
incompatible_with: [firestorm]

source:
  url: https://wiki.warframe.com/w/Primed_Firestorm
