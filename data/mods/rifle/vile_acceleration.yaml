id: vile_acceleration
name: Vile Acceleration
rarity: rare
polarity: naramon
base_drain: 4                 # max drain 9 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Rifle/DualStat/CorruptedFireRateDamageRifle
description: "+X% Fire Rate (x2 for Bows)\n-X% Damage"

# The "(x2 for Bows)" clause is a LITERAL - the multiplier does not scale with
# rank. BOTH sources agree: WFCD levelStats prints the same "x2" at every rank,
# and the wiki's rank table carries a separate Fire Rate (Bows) column that is
# exactly twice the rifle column at every rank. That column also settles the
# scope - the multiplier applies to FIRE RATE only, not to punch through.
# No bow is in data/weapons yet, so nothing models it.
effects:
  # WFCD ramp: +15% -> +90%. Was the placeholder pair (1/6, 1.0).
  - kind: fire_rate_bonus
    rank0: 0.15
    rankMax: 0.9
  - kind: base_damage_bonus
    rank0: -0.025
    rankMax: -0.15

source:
  url: https://wiki.warframe.com/w/Vile_Acceleration
