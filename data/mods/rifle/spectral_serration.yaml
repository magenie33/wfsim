id: spectral_serration
name: Spectral Serration
rarity: rare
polarity: madurai
base_drain: 6                 # max drain 16 at rank 10
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/Rifle/WeaponDamageAmountInvisibleMod
description: "+X% Damage while Invisible"

effects:
  # CONDITIONAL, not flat. This was a plain `base_damage_bonus`, so +330%
  # applied to every shot of every build — the card's "while Invisible" was
  # stated in the description and modelled nowhere — the same shape as Primary
  # Acuity's "Weak Point".
  #
  # Invisibility is a WARFRAME state, and the calculator now has one to ask:
  # `condition: while_invisible` is read against `data/tenno/`, whose neutral
  # entry is not invisible — so this contributes nothing, in the panel and in
  # the sim alike. Give the Tenno `state.invisible: true` and it pays, with no
  # code change anywhere.
  - kind: base_damage_bonus
    condition: while_invisible
    rank0: 0.3
    rankMax: 3.3

family: serration
incompatible_with: [amalgam_serration, serration]

source:
  url: https://wiki.warframe.com/w/Spectral_Serration
