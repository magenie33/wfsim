id: spectral_serration
name: Spectral Serration
rarity: rare
polarity: madurai
base_drain: 6                 # max drain 16 at rank 10
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/Rifle/WeaponDamageAmountInvisibleMod
description: "+X% Damage while Invisible"

effects:
  # CONDITIONAL, not flat. This was a plain `base_damage_bonus`, so +330%
  # applied to every shot of every build — the card's "while Invisible" was
  # stated in the description and modelled nowhere (user, 2026-08-02, the same
  # report as Primary Acuity's "Weak Point").
  #
  # Invisibility is a WARFRAME state and this is a weapon calculator: there is
  # nothing here that could turn it on or off. So it takes the shape every
  # other unevaluable condition takes — an unhandled `trigger` resolves to
  # `CondBuff(BaseDamage)`, which the PANEL shows at full value on its own
  # conditional line, and which the SIMULATION contributes nothing to. A number
  # you can see and reason about, rather than one folded silently into a build
  # that is not invisible.
  - kind: buff
    trigger: while_invisible
    grants: base_damage
    rank0: 0.3
    rankMax: 3.3

family: serration
incompatible_with: [amalgam_serration, serration]

source:
  url: https://wiki.warframe.com/w/Spectral_Serration
