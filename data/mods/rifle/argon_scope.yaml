id: argon_scope
name: Argon Scope
rarity: rare
polarity: madurai
base_drain: 2                 # max drain 7 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Rifle/Event/CritChanceWhileAimingRifleMod
description: "On Headshot:\n+X% Critical Chance when Aiming for Xs"
# see notes: exalted_mods_reenabled

effects:
  # CONDITIONAL, not a flat crit bonus - the skeleton had it always-on, which
  # is the whole mod for free. Identical to the pistol twin Hydraulic
  # Crosshairs, numbers included. The sim assumes constant aiming, so
  # `aiming` is satisfied and only the weak-point trigger gates it.
  - kind: buff
    trigger: headshot
    condition: aiming
    grants: crit_chance          # relative crit chance
    rank0: 0.225
    rankMax: 1.35
    max_stacks: 1
    # RAMPS with rank, 1.5 s per rank: the wiki's table reads 1.5 / 3 / 4.5 / 6 / 7.5 / 9 s.
    duration_rank0: 1.5
    duration: 9

family: argon_scope
incompatible_with: [galvanized_scope]

source:
  url: https://wiki.warframe.com/w/Argon_Scope
