id: primary_acuity
name: Primary Acuity
rarity: rare
polarity: naramon
base_drain: 6                 # max drain 16 at rank 10
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/Rifle/WeaponWeakpointCriticalChanceMod
description: "+X% Weak Point Damage\n+X% Weak Point Critical Chance. Multishot cannot be modified."
# NO `excludes_weapon`. A first pass here carried
# `[sentinel_weapon, power_weapon]` on the strength of a summary that read
# "cannot be equipped on sentinel or companion weapons" — the page's own
# wikitext says no such thing, and `Module:Mods/data` gives this mod NO
# IncompatibilityTags at all. Both structured sources agree it is a plain
# Rifle mod, so it is offered wherever rifle mods are.
disables: [multishot]    # locks Multishot from being modified while equipped

effects:
  # WEAK POINT ONLY, exactly as the pistol twin has always been modelled. This
  # file had them as `base_damage_bonus` / `crit_chance_bonus` — +350% damage
  # and +350% crit chance on EVERY shot — so a build that never hit a head
  # still collected both, which is a damage bonus on a build whose headshot
  # rate is zero.
  #
  # Weak Point Damage is ADDED to the enemy's weak-point multiplier at 1.5×
  # the value on true weak points (a 3x head + rank 10 = 3 + 3.498 × 1.5 =
  # 8.247x; MOA backpack is the 1.0× exception), and the sum is
  # MULTIPLICATIVE with headshot-multiplier bonuses (Deadhead).
  # 3.498 is measured on the pistol twin (M123), whose card is this card
  # row for row. see notes: package_rank_value
  - kind: weakpoint_damage_bonus
    rank0: 0.318
    rankMax: 3.498
  # Weak Point Crit Chance is a NORMAL relative crit-chance bonus (additive
  # with Point Strike) active on weak-point hits only — the multiplicative-
  # crit behavior on some weapons was a bug fixed in 38.5.
  - kind: weakpoint_crit_chance_bonus
    rank0: 0.318
    rankMax: 3.498

source:
  url: https://wiki.warframe.com/w/Primary_Acuity
