id: galvanized_chamber
name: Galvanized Chamber
rarity: rare
polarity: madurai
base_drain: 6                 # max drain 16 at rank 10
max_rank: 10
internal_name: /Lotus/Upgrades/Mods/Rifle/WeaponFireIterationsSPMod
description: "+X% Multishot\nOn Kill:\n+X% Multishot for Xs. Stacks up to Xx."

effects:
  - kind: multishot_bonus
    rank0: 0.0727
    rankMax: 0.8
  # On-kill STACKING multishot, not a second flat bonus. 5 stacks here against
  # the pistol twin's 4 (Galvanized Diffusion), and the unconditional half is
  # +80% against its +110%.
  - kind: buff
    trigger: on_kill
    grants: multishot
    rank0: 0.0273
    rankMax: 0.3
    max_stacks: 5
    duration: 20
    # `decay` is NOT read by mods_data. The engine hardcodes the matching model
    # per effect kind — `LiveStacks` (dummy.rs): on timeout lose ONE stack and
    # reset the timer. This line is the written record, not the source.
    decay: lose_one_and_reset

family: split_chamber
incompatible_with: [split_chamber]

source:
  url: https://wiki.warframe.com/w/Galvanized_Chamber
