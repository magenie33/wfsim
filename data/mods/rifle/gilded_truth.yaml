id: gilded_truth
name: Gilded Truth
rarity: rare
polarity: madurai
base_drain: 4                 # max drain 7 at rank 3
max_rank: 3
internal_name: /Lotus/Upgrades/Mods/Syndicate/BurstonPrimeMod
description: "+X% Fire Rate\n+X Truth"

# A SYNDICATE AUGMENT (Arbiters of Hexis, rank Crusader, 25,000 standing), and
# the roster's first. Exclusive to the BURSTON PRIME and the wiki says so in
# both directions: "exclusive to the Burston Prime" and "cannot be equipped on
# the Burston". So the base variant is NOT listed here — the same equip gate
# Sentient Surge uses, and the first time it separates two members of one
# family rather than one weapon from the rest of the pool.
exclusive_to: [burston_prime]

effects:
  # THE REASON IT IS EQUIPPED. +80% at max, a plain relative fire-rate bonus in
  # the same bucket as Shred and Speed Trigger — and the biggest single one a
  # rifle can take, which is what makes this a fire-rate card that happens to be
  # an augment rather than the other way round.
  #
  # The wiki's patch history is the cross-check, twice: 15.2 "will now provide a
  # multiplier of 1.2 instead of a multiplier of 0.2" and 15.2.1 "Fixed Gilded
  # Truth Mod giving higher fire rate than intended, now gives up to 80% when
  # fully maxed". The rank table's 20/40/60/80 is the settled answer.
  - kind: fire_rate_bonus
    rank0: 0.20
    rankMax: 0.80

  # THE SYNDICATE RADIAL — "+1 Truth" at max rank, and MODELLED.
  #
  # The payload is not written here: Truth is one of SIX effects shared by
  # dozens of augments and by the Syndicate weapons themselves, so it lives in
  # data/syndicates/truth.yaml and this card names it. 1,000 Gas in a 25 m
  # radius with a guaranteed proc, on a 30-second cooldown.
  #
  # ARMED BY AFFINITY, which is why it needed the engine to start counting
  # some: "All affinity earned by the weapon during a mission fills a gauge",
  # 1,000 points at a maxed augment, and a weapon kill hands the weapon HALF
  # the enemy's affinity. Every enemy file has carried an `affinity:` since
  # they were written and nothing read it — a key nobody reads is prose, which
  # data/README.md forbids, and this is what finally consumes it.
  #
  # WHAT IT IS WORTH on the benchmark, now that it can be measured rather than
  # guessed: a Thrax at 9999 is worth 762 affinity floored, so 381 to the
  # weapon, so 2.6 kills a detonation — and the 30-second cooldown caps a
  # 300-second run at TEN blasts for 10,000 Gas. Measured on a killing build:
  # exactly 10,000, and nothing at all without the mod.
  #
  # The rank scaling is the one part the sim does not read, and does not need
  # to: "higher ranking mods require fewer points to fill the gauge (1,000 at
  # max)", and every mod here simulates at max rank.
  - kind: syndicate_radial
    syndicate: truth          # data/syndicates/truth.yaml carries the payload
    rank0: 0.25
    rankMax: 1.0

family: gilded_truth

source:
  url: https://wiki.warframe.com/w/Gilded_Truth
  # Rank table (fire rate 20/40/60/80, Truth 0.25/0.5/0.75/1, drain 4-7) and
  # the exclusivity note from the wiki page; the Truth effect's own numbers
  # from https://wiki.warframe.com/w/Truth.
