id: catalyzer_link
name: Catalyzer Link
rarity: common
polarity: madurai
base_drain: 4                 # max drain 9 at rank 5
max_rank: 5
internal_name: /Lotus/Upgrades/Mods/Rifle/Event/StatusProcWhileAimingRifleMod
description: "On Ability Cast:\n+X% Status Chance when Aiming for Xs"

effects:
  # CONDITIONAL - pistol twin Embedded Catalyzer (+90% there, +60% here). The
  # arena casts no abilities, so this contributes only through the assumed-max
  # CondBuff path, never emergently.
  - kind: buff
    trigger: on_ability_cast
    condition: while_aiming
    grants: status_chance
    rank0: 0.1
    rankMax: 0.6
    max_stacks: 1
    # RAMPS with rank (WFCD levelStats); `duration` is the max-rank value
    # the engine builds with, `duration_rank0` is where the card starts.
    duration_rank0: 2
    duration: 9

source:
  url: https://wiki.warframe.com/w/Catalyzer_Link
