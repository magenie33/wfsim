id: sovereign_outcast
name: Sovereign Outcast
rarity: rare
polarity: naramon
# see notes: stance_grants_capacity
base_drain: 0
max_rank: 0
internal_name: /Lotus/Weapons/Tenno/Melee/MeleeTrees/TonfaCmbTwoMeleeTree
description: "An outlandish style with sweeping attacks."

# THE COMBOS THIS STANCE SUPPLIES, keyed by the FORM they are — every number
# from `Module:Stances/data`. `Dmg` is the percentages, `Hits` how many times
# each lands, `Procs` what it forces, `Types` marks 360-degree spins and the
# slam a combo ends on, `SlashMultiplier` a bonus to the Slash component alone,
# and `Duration` is the combo's length at 1.0x attack speed.
#
# THE DURATIONS CHECK AGAINST THE RENDERED TABLE'S OTHER COLUMN, which is the
# only cross-check a transcription of this table can have: 2200% / 2.85 s =
# 771.9%/s, 900 / 1.75 = 514.3, 900 / 1.25 = 720.0, 1400 / 3.00 = 466.7 — the
# four figures the wiki prints beside these four combos.
#
# RAGDOLL IS NOT TRANSCRIBED. Scout Command's last swing forces one, and this
# engine implements `lifted` and `knockdown` because something READS them —
# Enduring Strike reads lifted. Nothing reads a ragdoll, so writing it would
# state a rule that is never applied.
combos:
  # Rogue Edict — 2.85 s at 1.0x, 7 swings
  neutral:
    - { multiplier: 2.0, delay_seconds: 0.4071 }
    - { multiplier: 0.5, delay_seconds: 0.4071, hits: 5 }
    - { multiplier: 2.0, delay_seconds: 0.4071 }
    - { multiplier: 0.5, delay_seconds: 0.4071 }
    - { multiplier: 3.0, delay_seconds: 0.4071, forced_procs: [impact] }
    - { multiplier: 2.0, delay_seconds: 0.4071, hits: 4, forced_procs: [slash] }
    - { multiplier: 2.0, delay_seconds: 0.4071, hits: 2, forced_procs: [knockdown] }
  # Vagrant Behest — 1.75 s at 1.0x, 3 swings
  forward:
    - { multiplier: 1.0, delay_seconds: 0.5833 }
    - { multiplier: 1.0, delay_seconds: 0.5833, hits: 2 }
    - { multiplier: 1.0, delay_seconds: 0.5833, hits: 6, all_around: true }
  # Scout Command — 1.25 s at 1.0x, 3 swings
  block:
    - { multiplier: 4.0, delay_seconds: 0.4167, forced_procs: [impact] }
    - { multiplier: 2.0, delay_seconds: 0.4167 }
    - { multiplier: 3.0, delay_seconds: 0.4167 }
  # Villain Rule — 3.00 s at 1.0x, 4 swings, ending on the weapon's own slam
  block_forward:
    - { multiplier: 0.5, delay_seconds: 0.75, hits: 6 }
    - { multiplier: 3.0, delay_seconds: 0.75, slash_multiplier: 1.25 }
    - { multiplier: 2.0, delay_seconds: 0.75, hits: 2 }
    - { multiplier: 2.0, delay_seconds: 0.75, hits: 2, forced_procs: [knockdown] }
    - { multiplier: 0.0, slam_multiplier: 1.0, delay_seconds: 0.0, forced_procs: [impact] }
  # see notes: tonfa_heavy_and_slide
  heavy:
    - { multiplier: 2.0, hits: 2, windup_seconds: 0.7, delay_seconds: 0.0, forced_procs: [slash, knockdown] }
    - { multiplier: 2.0, hits: 2, windup_seconds: 0.7, delay_seconds: 0.0, forced_procs: [slash, knockdown] }
  slide:
    - { multiplier: 2.0, delay_seconds: 0.74, hits: 2, all_around: true }

effects:
  # A STANCE IS NOT A STAT — its whole payload is the `combos:` above.
  - kind: out_of_scope

source:
  url: https://wiki.warframe.com/w/Sovereign_Outcast
  # The combo data: https://wiki.warframe.com/w/Module:Stances/data
