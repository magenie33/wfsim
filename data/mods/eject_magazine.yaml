id: eject_magazine
kind: mod
name: Eject Magazine
mod_type: pistol
rarity: rare
polarity: naramon
base_drain: 6                 # drain 6..9
max_rank: 3
exilus: true

# +20% Magazine Reloaded/s while HOLSTERED. The sim fires one weapon
# continuously (never holsters), so this is unmodeled; would matter for a
# future weapon-swap rotation model.
effects:
  - { kind: holstered_reload, per_rank: 0.05, max: 0.20 }

source:
  url: https://wiki.warframe.com/w/Eject_Magazine
  note: Exilus pistol mod. Holstered reload unmodeled (single-weapon sim).
