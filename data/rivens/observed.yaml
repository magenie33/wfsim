# HAND-WRITTEN, and the highest authority in this directory: stats a REAL
# CARD is known to carry. Never generated — `survey_riven_pools.py` writes
# pools.yaml beside it and never touches this file.
#
# The order of authority for "can this weapon roll this stat" is:
#
#   1. this file — someone has the card
#   2. data/rivens/pools.yaml — a count over live listings
#   3. engine/src/rivens_data.rs `excluded_for` — derived from the weapon
#
# It exists because a survey has a middle band. A stat that rolls shows up in
# roughly 55 of 500 listings and a stat that cannot shows up in 0-4, but a
# handful land between, and the honest verdict there is "unclear" — the engine
# then falls back to its derivation, which for a hit-scan weapon means
# refusing Projectile Speed. Refusing a stat a player's card actually carries
# is the one failure mode that matters here: it makes the editor unable to
# describe a riven that exists.
#
# A note is required. "Someone said so" is the evidence, so it has to say who
# and when.
seen:
  - family: Furis
    stat: projectile_speed
    # Owner, 2026-08-08, relaying a player's card: "这个是盗贼的紫卡哈，灵化吃
    # 这个，所以就可以装备" — 盗贼 is the Furis. The survey counted 13 of 500,
    # inside the unclear band, and the derivation refuses it (base and Incarnon
    # form are both hit_scan here).
    #
    # The reason it rolls is that DE's Incarnon form is a PROJECTILE
    # internally, whatever the beam looks like: the wiki's Condition Overload
    # catalog row for this weapon reads "Furis | Incarnon Mode | Projectile",
    # and the Ocucor — the same held 12-tick beam shape, hit_scan in our data —
    # rolls Projectile Speed on 47 of 500 real cards. What this is NOT is a
    # general rule that an Incarnon form widens the pool: the Latron, Lex and
    # Atomos forms all fire a literal travelling projectile and their families
    # show 0, 4 and 0 Projectile Speed listings out of 500.
    note: "owner 2026-08-08, a player's Furis riven"
