id: mk1_kunai_deathtrap_trigger
name: Deathtrap Trigger
weapon: mk1_kunai
tier: 4
description: "On Equip: Increase Base Critical Chance by +42% for 4 seconds. Increase Base Critical Damage Multiplier by +1x for 4 seconds."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Critical Damage Multiplier by +1x"
  - kind: flat_base_crit_multiplier
    value: 1.0
  # AN EDGE, NOT A GAP — see docs/UNMODELLED.md. The clause is understood;
  # this simulator cannot pay it out, and the reason will not change with
  # any amount of work on evolutions.
  - kind: out_of_scope
    clause: "On Equip: Increase Base Critical Chance by +42% for 4 seconds"
    reason: no_holster
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "for 4 seconds"
  - kind: unmodelled_for_seconds

source:
  url: https://wiki.warframe.com/w/Kunai_Incarnon_Genesis
