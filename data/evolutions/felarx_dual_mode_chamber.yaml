id: felarx_dual_mode_chamber
name: Dual-Mode Chamber
weapon: felarx
tier: 3
description: "Reload toggles the weapon between +100% Projectile Speed and +4m Punch Through."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "+100% Projectile Speed"
  - kind: indirect
    stat: projectile_speed
    value: 1.0
  # NOT MODELLED — a TODO, not an edge, and the clause is why. It is a TOGGLE
  # between two grants and only ONE of them is out of scope: +4 m punch through
  # buys a second body this arena does not have, but +100% Projectile Speed is a
  # stat this engine does model where it changes a pool (UNMODELLED.md §2). A
  # perk that is half an edge is not an edge.
  #
  # What it actually needs is a DECISION rather than machinery: the toggle is a
  # play pattern, and picking a side for the player is the owner's call, not the
  # model's (UNMODELLED.md §"Open decisions").
  #
  # The intake's own transcription dropped the projectile-speed half here — the
  # clause below is the card's, restored.
  - kind: unmodelled_reload_toggles_projectile_speed_or_punch_through

source:
  url: https://wiki.warframe.com/w/Felarx
