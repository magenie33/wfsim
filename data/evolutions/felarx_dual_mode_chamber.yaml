id: felarx_dual_mode_chamber
name: Dual-Mode Chamber
weapon: felarx
tier: 3
description: "Reload toggles the weapon between +100% Projectile Speed and +4m Punch Through."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "+100% Projectile Speed"
  - kind: indirect
    stat: projectile_speed
    value: 1.0
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "Reload toggles the weapon between  and +4m Punch Through"
  - kind: unmodelled_reload_toggles_the_weapon_between_and_m_punch_through

source:
  url: https://wiki.warframe.com/w/Felarx
