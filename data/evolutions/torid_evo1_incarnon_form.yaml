id: torid_evo1_incarnon_form
name: Incarnon Form
weapon: torid
tier: 1
icon: IncarnonFormLongRangeBeam(xWhite).png
description: "Direct shots charge Incarnon Transmutation; Alt Fire transmutes.\nFire a long-range Toxin beam."
selection: fixed                # tier 1 has no choice

# Under the two-weapons model this perk IS the unlock of weapon #2: the held
# trigger, the beam, the higher stats and the 2.3 m damage radius are all
# properties of the torid_incarnon entry, not perk payload.
effects:
  # LOADED as `EvoEffect::UnlocksForm(weapon)`. It applies no stat — the form
  # below is a separate weapon entry carrying its own — but the ENGINE READS IT:
  # asking to fire that form implies this evolution, because tier 1 is
  # `selection: fixed` and the two were one fact behind two controls.
  # Nothing is gated on it: the Incarnon form's availability comes from the
  # weapon data's `transforms_to`, and `weapon` below is unread too. The entry
  # records that this tier is what unlocks the form in game.
  - kind: unlocks_weapon
    weapon: torid_incarnon

source:
  url: https://wiki.warframe.com/w/Torid_Incarnon_Genesis
