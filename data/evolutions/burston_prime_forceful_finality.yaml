id: burston_prime_forceful_finality
name: Forceful Finality
weapon: burston_prime
tier: 2
icon: MultishotOnLastBurstInMag(xWhite).png
description: "Increase Base Damage by +42.\n+5 Base Multishot on final magazine burst."
# THE GENESIS IS THE FAMILY'S. One Burston Incarnon Genesis upgrades either the
# Burston or the Burston Prime, and the wiki's evolution table proves the two
# get the SAME evolutions: every row spans both weapon columns with a dash
# (`colspan="2" ... | -`), which is that table's way of saying "no per-variant
# difference".
selection: choose_one

# CO'S BASE EXCLUDES THIS PERK'S +42 — MEASURED (owner, 2026-08-16).
#
# Burston Prime, Incarnon form, this perk and Galvanized Aptitude and nothing
# else, torso, unarmoured target, one status type on it:
#
#   1 stack   direct crit 181     2 stacks   direct crit 196, radial 65
#
# The Incarnon form is 13 base + this +42 = 55, and a crit is x3.0, so the
# direct hit before CO is 165. Solving each reading for the fraction CO reads:
#
#   165 x (1 + 0.4 x 1 x f) = 181  ->  f = 0.242
#   165 x (1 + 0.8 x 1 x f) = 196  ->  f = 0.235
#
# Both land on 13/55 = 0.2364 — the 24% the CO catalog prints for this weapon.
# The radial confirms it independently at the same fraction: 55 x 1.1891 = 65.4,
# an uncritical explosion.
#
# WHAT THIS FIXES. The catalog's 24% was read as the RADIAL's alone, so the
# DIRECT hit computed CO on the full 55 and the engine returned 231 where the
# game gives 181 — a 28% overstatement on this build. The exclusion is the
# PERK's, not the attack part's: it applies wherever the +42 landed.
#
# FLAGGED ON BOTH TIER-2 OPTIONS, which is the pattern the catalog already uses
# for the Atomos ("both tier-2 options, each +24"). Fortress Salvo adds the same
# +42 at the same tier, so a build taking it instead computes the same base.
co_base_excludes_this_evolution: true
effects:
  # +42 to the base TOTAL, spread pro-rata across the vector before mods. On
  # the Prime that is 46 -> 88; on the Burston 30 -> 72, which is the larger
  # RELATIVE gain of the two — the same flat number is worth more to the
  # weaker weapon, and it is why this tier matters more here than there.
  #
  # It reaches the INCARNON form's explosion as well, which is not obvious and
  # is sourced: see burston_prime_incarnon.yaml, where the CO catalog's radial
  # row (55 = 13 + 42) is what says so.
  - kind: flat_base_damage
    value: 42.0
  # "+5 BASE Multishot", so mods multiply it — "Multishot bonus is added before
  # mods, and is thus multiplied by multishot bonuses" (wiki). The window is
  # the final BURST, three rounds on this weapon, which is what
  # `multishot_on_last_round` now means on a weapon that declares a burst:
  # taking it as ONE round would have understated a magazine's pellets by a
  # fifth.
  - kind: multishot_on_last_round
    value: 5.0
    # THE CARD'S OWN WORD, and the bracket it decides. "+5 BASE Multishot",
    # with the wiki's note on this very row: "Multishot bonus is added before
    # mods, and is thus multiplied by multishot bonuses". The note exists
    # because it is unusual — the Torid's Final Fusillade grants "+3 Multishot"
    # with no such line and is flat. It was modelled as flat here too until
    # 2026-08-11, which cost a Split Chamber + Vigilante Armaments build more
    # than half of what this perk is worth on its last burst.
    base: true
    # "Multishot bonus does not affect the Incarnon form" (wiki) — and it does
    # not reach it here either, because the loader drops this effect on a
    # charge-backed form.

source:
  url: https://wiki.warframe.com/w/Burston_Incarnon_Genesis
