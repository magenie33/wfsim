id: sicarus_prime_wisemans_regard
name: Wiseman's Regard
weapon: sicarus_prime
tier: 4
description: "Increase Base Status Chance by 30% of current Critical Chance, up to 40%."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # ONE STAT FROM THE OTHER, capped. "CURRENT Critical Chance" is the MODDED
  # value, and the mirror perk's own note is the proof: the Dera's High Ground
  # reads "+366.7% Status Chance is needed to max out the Critical Chance bonus",
  # and 0.30 x (1 + 3.667) = 1.40 is exactly what a 35% cap at 25% a point
  # demands. Same arithmetic, read the other way round.
  #
  # "BASE Status Chance" is where the grant LANDS, so the status mods multiply
  # it afterwards — which is what makes this worth more on a build that already
  # has them.
  # WHAT "CURRENT CRITICAL CHANCE" READS, and what it does not. The row's own
  # notes are an explicit two-sided list (Sicarus_Incarnon_Genesis):
  #
  #   * In addition to regular Critical Chance mods, it is also affected by both
  #     parts of {{M|Galvanized Crosshairs}} while aiming, {{Arcane|Secondary
  #     Outburst}}, {{Arcane|Cascadia Overcharge}}, {{Arcane|Arcane Avenger}},
  #     {{Arcane|Secondary Enervate}}, {{WF|Yareli}}'s Passive, {{WF|Zephyr}}'s
  #     Passive, {{A|Covenant}}'s baseline Critical Chance bonus but ''not'' the
  #     4x multiplier on headshots, and {{M|Cat's Eye}}.
  #   * '''Not''' affected by the '''King's Gambit''' Evolution II perk,
  #     {{Arcane|Cascadia Accuracy}}, {{A|Crystallize}}, or {{M|Shadow Haze}}.
  #
  # ONE RULE RECONCILES THE TWO LISTS: a source that changes the weapon's crit
  # chance STAT feeds it; a source decided by WHERE THE SHOT LANDED does not.
  # Every name on the second list is per-hit — King's Gambit's weakpoint bonus
  # and bodyshot multiplier, Cascadia Accuracy's weak-point crit, Covenant's
  # headshot 4x — and that split is already the engine's shape, because the
  # weak-point bucket is resolved per pellet and never reaches the panel.
  #
  # MEASURED HERE (Sicarus Prime, base crit 0.25, base status 0.20):
  #   bare                        cc 0.2500  ->  sc 0.2750   = 0.20 + 0.30 x 0.25
  #   + Primed Pistol Gambit      cc 0.7175  ->  sc 0.4153
  #   + Galvanized Crosshairs     cc 1.0500  ->  sc 0.5150   (a LIVE buff, and it counts)
  #   + both                      cc 1.5175  ->  sc 0.6000   (the 40% cap)
  #
  # AND IT READS THE FORM IT IS ON, which is the in-mission behaviour and NOT
  # the one the Arsenal shows. VERBATIM, same row:
  #   * Incarnon Form Status Chance is displayed in the [[Arsenal]] screen as if
  #     using the normal form's Critical Chance, but will properly use its' own
  #     Critical chance while in-mission.
  # Free here — a form is its own weapon entry and resolves its own panel — and
  # pinned anyway, because nothing else would notice if it stopped.
  #
  # THE SAME SENTENCE VERIFIES FOUR WEAPON ENTRIES. "achievable with '''+734%'''
  # (Sicarus) / '''+434%''' (Prime) modded Critical Chance, or '''+567%''' (Sicarus) /
  # '''+345%''' (Prime) in Incarnon Form": the cap needs 0.40/0.30 = 1.3333 current
  # crit, so each threshold implies that form's BASE crit — 1.3333/8.34 = 0.160,
  # /6.67 = 0.200, /5.34 = 0.250, /4.45 = 0.300. `data/weapons/` was written
  # from the weapon pages and carries exactly those four.
  #
  # ARCANE CRIT COUNTS, AND IT COUNTS LIVE (owner, 2026-08-13: "都是加在武器自身
  # 的暴击率，以及肯定是要改成实时的，这个是没有歧义的"). The four sources the row
  # names — both parts of Galvanized Crosshairs, Secondary Outburst, Cascadia
  # Overcharge, Secondary Enervate — are all live and none is on the panel, and
  # three of them RAMP, so a number resolved once could not have been right for
  # more than an instant.
  #
  # So the sim recomputes it per SHOT from `effective_cc`: the same value the
  # crit roll is about to use, which is read per shot and therefore already
  # excludes the weak-point bonus this card's own row excludes. `resolve` hands
  # over `(rate, cap, what the panel folded in)` in POST-MOD units, and the sim
  # takes the third back before paying the first two.
  #
  # THE PANEL STILL SHOWS THE STATIC ANSWER, which is what a panel can say and
  # what the Arsenal shows too. Sicarus Prime, no mods:
  #   panel                    crit 0.25  ->  status 0.2750
  #   + 100% arcane crit       crit 0.50  ->  status 0.3500
  #   + 434% (the wiki's own threshold for the Prime)  ->  status 0.6000, capped
  #
  # STILL OPEN, and NOT modelled: a forum thread reports the conversion paying
  # 25% rather than 30% in Incarnon Form. It returns 403 from here, so it is
  # recorded and left alone.
  #
  # HOW THIS DIFFERS FROM THE FURIS'S PRELUDE OF MIGHT — two perks that both
  # say "Critical Chance" and read two different numbers (owner, 2026-08-13).
  #
  #                          Wiseman's Regard        Prelude of Might
  #   when                   resolved ONCE, off      re-checked AT EVERY SHOT
  #                          the panel
  #   Puncture's crit        NO — a debuff on the    YES — the row names it:
  #   (target-dependent)     TARGET, and the panel   "Condition is affected by
  #                          never sees one          the critical chance increase
  #                                                  effect of Puncture status"
  #   weak-point crit        NO — the row names      per SHOT here, so no. OPEN:
  #   (Acuity, King's        King's Gambit and       the owner reads it as YES,
  #   Gambit, Cascadia       Cascadia Accuracy as    measuring 2026-08-13
  #   Accuracy)              excluded outright
  #   which way it cuts      more crit = MORE        more crit = LOSE +3x
  #                          status (a reward)       (a penalty)
  #
  # The last row is why the two must not be reasoned about together: the same
  # mistake is worth the opposite amount on each.
  #
  - kind: status_chance_from_crit_chance
    rate: 0.30
    cap: 0.40

source:
  url: https://wiki.warframe.com/w/Sicarus_Incarnon_Genesis
