id: dual_toxocyst_evo1_incarnon_form
name: Incarnon Form
# Evolutions ARE perks.
weapon: dual_toxocyst
tier: 1
icon: IncarnonFormRicochetOnHittingEnemies(xWhite).png   # wiki File: name (Dual_Toxocyst_Incarnon_Genesis)
description: "Weakpoint hits charge Incarnon Transmutation; Alt Fire transmutes.\nGain an Auto Fire mode and Ricochet (1 nearby enemy within 5m)."
selection: fixed                # tier 1 has no choice - installing grants it

# Under the two-weapons model this perk IS the unlock of weapon #2 and
# nothing else: the auto trigger, higher stats, and ricochet are inherent
# properties of the dual_toxocyst_incarnon weapon entry, not perk payload.
effects:
  # LOADED as `EvoEffect::UnlocksForm(weapon)`. It applies no stat — the form
  # below is a separate weapon entry carrying its own — but the ENGINE READS IT:
  # asking to fire that form implies this evolution, because tier 1 is
  # `selection: fixed` and the two were one fact behind two controls.
  # Nothing is gated on it: the Incarnon form's availability comes from the
  # weapon data's `transforms_to`, and `weapon` below is unread too. The entry
  # records that this tier is what unlocks the form in game.
  - kind: unlocks_weapon
    weapon: dual_toxocyst_incarnon

source:
  url: https://wiki.warframe.com/w/Dual_Toxocyst_Incarnon_Genesis
