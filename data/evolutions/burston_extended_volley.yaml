id: burston_extended_volley
name: Extended Volley
weapon: burston
tier: 3
icon: IncarnonClipSize(xWhite).png
description: "Increase Base Magazine Capacity by +21."
# see notes: genesis_family_s_burston
selection: choose_one

effects:
  # 45 -> 66 rounds. It is the BASE, so magazine mods multiply the new value.
  # Against a 2 s reload at 10.714 rounds/s that turns 4.2 s of firing into
  # 6.2 s, i.e. the reload's share of the cycle falls from 32% to 24%.
  - kind: flat_base_magazine
    value: 21
    # The loader drops this on a charge-backed form, so the Incarnon form's
    # 600-round pool is untouched — that pool is charges, not a magazine.

source:
  url: https://wiki.warframe.com/w/Burston_Incarnon_Genesis
