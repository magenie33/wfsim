id: latron_prime_riddled_target
name: Riddled Target
weapon: latron_prime
tier: 2
description: "Increase Base Damage by +6. On Puncture Status Effect: +25% Multishot for 8s. Stacks up to 4x."
# THE GENESIS IS THE FAMILY'S. One Latron Incarnon Genesis upgrades any of the
# three Latrons, so all three carry the same ladder of nine perks. Where a value
# DIFFERS between them the wiki's table prints a per-variant column, and the
# number below is this weapon's.
selection: choose_one

effects:
  # THE SAME +6 its tier-mate gives, so this pair is decided entirely by the
  # second line — the same shape the Burston's and the Furis's tier 2 have.
  - kind: flat_base_damage
    value: 6.0
  # MODELLED. It is the same machine Stormburst uses — a live
  # stacking buff bumped inside the fight, where the target's debuffs are in
  # hand — and the only thing missing was that the loader's arm named
  # Electricity instead of reading the status out of the kind.
  #
  # It is LARGE on this family: the base form is 60-80% Puncture, so the trigger
  # is the weapon's own main damage type and four stacks is +100% multishot
  # held up for as long as the target keeps being shot.
  - kind: stacking_multishot_on_puncture_status
    per_stack: 0.25
    max_stacks: 4
    duration_seconds: 8.0

source:
  url: https://wiki.warframe.com/w/Latron_Incarnon_Genesis
