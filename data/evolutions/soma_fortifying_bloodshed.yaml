id: soma_fortifying_bloodshed
name: Fortifying Bloodshed
weapon: soma
tier: 2
description: "Increase Base Damage by +10. On Slash Status Kill: +100 Overshield."
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # from: "Increase Base Damage by +10"
  - kind: flat_base_damage
    value: 10.0
  # AN EDGE, NOT A GAP — see docs/UNMODELLED.md. VERBATIM
  # (Soma_Incarnon_Genesis, the row's effect cell and its note):
  #   *On {{D|Slash}} Status Kill: '''+100''' Overshield.
  #   *{{D|Slash}} status kill grants shields, which can be overshields.
  #
  # The pool it fills only matters when something is emptying it, and nothing
  # here is. Note that OVERSHIELDS THEMSELVES ARE MODELLED — Haven Foray and
  # Guardian's Might read the state, and the player declares it in the Tenno
  # panel. What cannot pay out is EARNING them mid-fight, which is a different
  # claim and a permanent one: with nobody shooting back, a pool that only ever
  # fills is a pool the player may as well have walked in with.
  - kind: out_of_scope
    clause: "On Slash Status Kill: +100 Overshield"
    reason: nobody_shoots_back

source:
  url: https://wiki.warframe.com/w/Soma_Incarnon_Genesis
