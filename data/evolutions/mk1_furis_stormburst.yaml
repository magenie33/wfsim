id: mk1_furis_stormburst
name: Stormburst
weapon: mk1_furis
tier: 2
icon: DamageAndOnHittingEnemyAffectedByElectricity(xWhite).png
description: "Increase Base Damage by +34.\nOn hitting an enemy affected by Electricity: +0.4 Multishot for 2s. Stacks up to 3x."
# see notes: genesis_family_s_furis
selection: choose_one

# CONDITION OVERLOAD — NOT excluded here, and this is SETTLED rather than
# inferred. So this perk's +34 feeds the CO term
# in full: the hit lands 94 and CO computes on 94.
#
# The catalog agreed already, by saying nothing: its row names "Furis" and
# carries that weapon's numbers (100 and 128, against this form's 60 and 94),
# there is no MK1-Furis row, and absence from that table is a positive
# statement that the attack behaves normally. Lato Vandal has a row and Lato
# Prime does not — same family, same Genesis — which is what a per-entry slip
# in DE's code looks like and what no general law could produce.
#
# So the shared adapter is exactly the wrong reason to copy the exclusion
# across, and the two weapons differ here on purpose. `furis_haven_foray` and
# `furis_stormburst` carry the flag; these two must not, and a test pins both
# halves so nobody tidies them into agreement.

effects:
  # THE SAME +34 its tier-mate gives, so this pair is decided entirely by the
  # second line — the same shape the Burston's tier 2 has.
  - kind: flat_base_damage
    value: 34.0
  # MODELLED, as a LIVE stacking buff. It could not be a
  # `stacking_buff` with a multishot payload: that loads as
  # `AssumedMaxMultishot` — a total and a cap and NO trigger — so it would have
  # granted +1.2 multishot to a build carrying no Electricity at all. A live
  # buff is bumped inside the fight, where the target's debuffs are in hand, so
  # the condition it could not state statically is simply readable.
  #
  # A FLAT +0.4, not a percentage of base multishot — "+0.4 Multishot" — so it
  # joins `ms_eff` beside Final Fusillade's rather than the multishot bucket.
  #
  # ON THIS WEAPON IT ONLY PAYS AS A CYCLE, which the sim found rather than
  # anyone predicting it: the Incarnon form's base damage is Heat, so a
  # Convulsion's Electricity COMBINES with it and that form deals Radiation and
  # no Electricity whatever. The BASE form has no innate element, so its
  # Electricity stays raw — it is the half that puts the status on the target,
  # and the Incarnon half then finds it there. Measured: 657 pellets / 657
  # shots with no Electricity, 668 / 659 with Primed Convulsion.
  #
  # FIFO, EACH STACK ON ITS OWN 2 s CLOCK — owner observed it in game. Not the Galvanized rule every other stacking buff here uses,
  # and the difference is not cosmetic: under that rule ONE hit inside the
  # window holds all three stacks, under this one it holds exactly one. At the
  # cap a new stack evicts the oldest rather than being dropped.
  # `docs/BUFFS.md` has listed `per_stack_expiry` as a decay family since the
  # buff vocabulary was written; this is the first perk that needed it, and
  # until it existed every stacking buff decayed the Galvanized way whether or
  # not that was its rule.
  - kind: stacking_multishot_on_electricity_status
    per_stack: 0.4
    max_stacks: 3
    duration: 2
    decay: per_stack_expiry

source:
  url: https://wiki.warframe.com/w/Furis_Incarnon_Genesis
