id: prisma_angstrum_fatal_affliction
name: Fatal Affliction
weapon: prisma_angstrum
tier: 4
description: "+40% Direct Damage per Status Type affecting the target."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # CONDITION OVERLOAD, granted by an evolution — the same per-type rate the
  # Galvanized mods and the innate sources feed. This weapon's catalog row is
  # MULTIPLYING, so it does not join the base-damage bucket: it stands as a
  # free-standing final multiplier, which is a different (and larger) number on
  # any build carrying Serration. That behaviour is the WEAPON's
  # (`co_behavior: independent`) and is stated once there, not here — an
  # evolution grants a rate and never decides how it combines.
  #
  # Identical in wording and value to the Burston's Fatal Affliction, which has
  # carried this since it was hand-checked; these ten were left inert only
  # because the bulk intake had no rule for the clause, not because anything
  # about them was in doubt.
  - kind: condition_overload
    value: 0.40

source:
  url: https://wiki.warframe.com/w/Angstrum_Incarnon_Genesis
