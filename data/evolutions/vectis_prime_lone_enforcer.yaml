id: vectis_prime_lone_enforcer
name: Lone Enforcer
weapon: vectis_prime
tier: 2
description: "Increase Base Damage by +150. +25% Multishot if no enemies are within 5m."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Damage by +150"
  - kind: flat_base_damage
    value: 150.0
  # IT PAYS NOW. It was filed as an EDGE — a clause nothing about
  # this engine would ever close — and the arena gaining a range closed it: with
  # one enemy, "no enemies within 5m" is exactly "the target is standing further
  # away than 5 m", which the fight can now answer. Worth nothing at point
  # blank, which is where both official boards are scored.
  - kind: multishot_beyond_range
    value: 0.25
    metres: 5.0

source:
  url: https://wiki.warframe.com/w/Vectis_Incarnon_Genesis
