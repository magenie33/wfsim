id: mk1_furis_haven_foray
name: Haven Foray
weapon: mk1_furis
tier: 2
icon: DamageAndIncreasedDamageWithOvershields(xWhite).png
description: "Increase Base Damage by +34.\nWith Overshields: Increase Base Damage by +30."
# THE GENESIS IS THE FAMILY'S. One Furis Incarnon Genesis upgrades either the
# Furis or the MK1-Furis, so both weapons carry the same ladder. Where a value
# DIFFERS between them the wiki prints it as a pair, and the number below is
# this weapon's.
selection: choose_one

# CONDITION OVERLOAD — NOT excluded here, and this is SETTLED rather than
# inferred (owner, 2026-08-06: "注意mk1版本没这个限制啊"). So this perk's +34
# feeds the CO term in full: the hit lands 94 and CO computes on 94.
#
# The catalog agreed already, by saying nothing: its row names "Furis" and
# carries that weapon's numbers (100 and 128, against this form's 60 and 94),
# there is no MK1-Furis row, and absence from that table is a positive
# statement that the attack behaves normally. Lato Vandal has a row and Lato
# Prime does not — same family, same Genesis — which is what a per-entry slip
# in DE's code looks like and what no general law could produce.
#
# So the shared adapter is exactly the wrong reason to copy the exclusion
# across, and the two weapons differ here on purpose. `furis_haven_foray` and
# `furis_stormburst` carry the flag; these two must not, and a test pins both
# halves so nobody tidies them into agreement.

effects:
  # The unconditional half. THIS number rests on the wiki's evolution table
  # alone — the CO catalog has no row for this weapon, so there is no second
  # source to cross-check it against, and none is borrowed from the sibling
  # that does have one (owner, 2026-08-12: a file states its own weapon's
  # numbers and nobody else's).
  - kind: flat_base_damage
    value: 34.0
  # NOT LOADED, and the reason is a missing STATE rather than a missing effect
  # kind. `TennoCondition` knows Aiming, Invisible and Airborne; it has no
  # overshields, so there is nothing for this clause to be true OF. Granting it
  # unconditionally would hand +30 to a Tenno at base shields, which is most of
  # them. Written under a kind the loader does NOT know, on purpose: the
  # `flat_base_damage` arm ignores `condition:`, so spelling it that way would
  # have loaded a silent, unconditional +30 rather than nothing. It is worth 30
  # on top of 34, so a sim that ever models overshields starts here.
  - kind: flat_base_damage_with_overshields
    value: 30.0

source:
  url: https://wiki.warframe.com/w/Furis_Incarnon_Genesis
