id: mk1_furis_haven_foray
name: Haven Foray
weapon: mk1_furis
tier: 2
icon: DamageAndIncreasedDamageWithOvershields(xWhite).png
description: "Increase Base Damage by +34.\nWith Overshields: Increase Base Damage by +30."
# THE GENESIS IS THE FAMILY'S. One Furis Incarnon Genesis upgrades either the
# Furis or the MK1-Furis, so both weapons carry the same ladder. Where a value
# DIFFERS between them the wiki prints it as a pair, and the number below is
# this weapon's.
selection: choose_one

# CONDITION OVERLOAD — NOT excluded here, and that is a decision rather than an
# oversight. The catalog's row names "Furis" and nothing else; there is no
# MK1-Furis row, and its numbers are that weapon's (100 and 128 against this
# form's 60 and 94). The catalog lists discrepant ATTACKS one at a time, and
# absence from it is a positive statement that the attack behaves normally —
# Lato Vandal has a row and Lato Prime does not, same family and same Genesis.
# Copying the exclusion across on the strength of a shared adapter is exactly
# the generalisation that rule forbids.
#
# It is a genuine open question rather than a settled one: the two weapons take
# the same adapter, so DE plausibly applies the same code. If a measurement ever
# says so, this is the line to change — 60/94 = 64% would be the fraction.

effects:
  # The unconditional half, and the one a SECOND source cross-checks on the
  # Furis: the CO catalog's row reads "100 or 128 (with Evolution II)", which
  # is this +28 on a 100-Heat form. The MK1's +34 rests on the wiki alone.
  - kind: flat_base_damage
    value: 34.0
  # NOT LOADED, and the reason is a missing STATE rather than a missing effect
  # kind. `TennoCondition` knows Aiming, Invisible and Airborne; it has no
  # overshields, so there is nothing for this clause to be true OF. Granting it
  # unconditionally would hand +30 to a Tenno at base shields, which is most of
  # them. Written under a kind the loader does NOT know, on purpose: the
  # `flat_base_damage` arm ignores `condition:`, so spelling it that way would
  # have loaded a silent, unconditional +30 rather than nothing. It is worth 30
  # on top of 34, so a sim that ever models overshields starts here.
  - kind: flat_base_damage_with_overshields
    value: 30.0

source:
  url: https://wiki.warframe.com/w/Furis_Incarnon_Genesis
