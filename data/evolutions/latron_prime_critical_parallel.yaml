id: latron_prime_critical_parallel
name: Critical Parallel
weapon: latron_prime
tier: 4
description: "Increase Base Critical Chance by +24%. Increase Base Critical Damage Multiplier by +0.2x."
# THE GENESIS IS THE FAMILY'S. One Latron Incarnon Genesis upgrades any of the
# three Latrons, so all three carry the same ladder of nine perks. Where a value
# DIFFERS between them the wiki's table prints a per-variant column, and the
# number below is this weapon's.
selection: choose_one

effects:
  # Both are BASE-stat additions, so the crit mods multiply the new base.
  - kind: flat_base_crit_chance
    value: 0.24
  - kind: flat_base_crit_multiplier
    value: 0.2

source:
  url: https://wiki.warframe.com/w/Latron_Incarnon_Genesis
