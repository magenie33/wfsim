id: furis_practiced_grip
name: Practiced Grip
weapon: furis
tier: 3
icon: MoreAccuracy(xWhite).png
description: "Increase Accuracy by +50%."
# THE GENESIS IS THE FAMILY'S. One Furis Incarnon Genesis upgrades either the
# Furis or the MK1-Furis, so both weapons carry the same ladder. Where a value
# DIFFERS between them the wiki prints it as a pair, and the number below is
# this weapon's.
selection: choose_one

effects:
  # An INDIRECT stat: real in the hand, worth nothing in an arena that hits what
  # it aims at by construction (`headshot_pct`). Loaded so the panel states it
  # rather than drops it.
  - kind: accuracy_bonus
    value: 0.50

source:
  url: https://wiki.warframe.com/w/Furis_Incarnon_Genesis
