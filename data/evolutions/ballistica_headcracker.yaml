id: ballistica_headcracker
name: Headcracker
weapon: ballistica
tier: 2
description: "Increase Base Damage by +30. On Headshot: +7.5% Fire Rate for 4 seconds. Stacks up to 10x."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Damage by +30"
  - kind: flat_base_damage
    value: 30.0
  # MODELLED — the SAME perk the Furis carries, off the same trigger, and it
  # comes with the same trap: THE 50% ROLL IS IN THE RAW WIKITEXT AND NOT IN
  # THE RENDERED EFFECT COLUMN. That column says only "On Headshot: +7.5% Fire
  # Rate for 4s. Stacks up to 10x"; the notes cell beside it says "On headshot
  # effect has a 50% chance of activating." Reading the effect column alone
  # gives a perk twice as strong as the game's.
  #
  # ADDITIVE WITH FIRE-RATE MODS, and the same notes cell says so outright:
  # "Fire Rate bonus is additive to other sources of Fire Rate such as
  # Gunslinger" — which is the bracket this kind already lands in.
  #
  # The stack cap was a separate inert effect until now; it is this grant's
  # ceiling, not a mechanic of its own.
  - kind: on_headshot_fire_rate
    per_stack: 0.075
    max_stacks: 10
    duration: 4.0
    chance: 0.5
    # FIFO, EACH STACK ON ITS OWN CLOCK — the same rule Stormburst carries, and
    # observed the same way, in game (owner, 2026-08-13: "如果叠了10层，这个10层是
    # 各自的，走fifo的，和风雷骤起一模一样的").
    #
    # It was the Galvanized rule here, HARDCODED in the loader on the reading
    # that the card says nothing else. The difference is not cosmetic and it is
    # bigger on this perk than on Stormburst: under Galvanized decay one headshot
    # inside the window holds all TEN stacks, under this one it holds exactly
    # one, so a streak that lapses falls off a stack at a time instead of
    # surviving whole. At the cap a new stack evicts the oldest rather than being
    # dropped.
    decay: per_stack_expiry

source:
  url: https://wiki.warframe.com/w/Ballistica_Incarnon_Genesis
