id: atomos_paladin_virtue
name: Paladin Virtue
weapon: atomos
tier: 2
description: "Increase Base Damage by +24. With Energy Max over 700: Increase Base Critical Damage Multiplier by +1x."
# see notes: genesis_family_s_adapter_3
#
#   Atomos||Incarnon Mode||…||100 or 124 (with Evolution II)||100||100% or 81%||Adding||CO-bonus does not use base damage increase Evolution
#
# Which perk: the row names the TIER and not a perk number, and both tier-2 options add the same +24, so both carry it.
co_base_excludes_this_evolution: true
selection: choose_one

effects:
  # from: "Increase Base Damage by +24"
  - kind: flat_base_damage
    value: 24.0
  # A QUESTION ABOUT THE PLAYER, read rather than ignored. The neutral Tenno has
  # no energy pool, so this pays NOTHING until someone says which frame is
  # carrying the gun — the same `condition:` spelling the sprint gates use.
  #
  # "BASE Critical Damage Multiplier", so the crit-damage mods multiply it.
  - kind: gated_by_tenno
    condition: "energy_max > 700"
    grant: base_crit_damage
    value: 1.0

source:
  url: https://wiki.warframe.com/w/Atomos_Incarnon_Genesis
