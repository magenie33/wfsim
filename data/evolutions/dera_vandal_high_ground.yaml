id: dera_vandal_high_ground
name: High Ground
weapon: dera_vandal
tier: 4
description: "Increase Base Critical Chance by +25% of current Status Chance, up to +35%."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # ONE STAT FROM THE OTHER, capped, and this card's own notes are what pinned
  # the arithmetic for both directions: "For Non-Incarnon Dera Vandal, +366.7%
  # Status Chance is needed to max out the Critical Chance bonus" and "For
  # Incarnon Dera Vandal and Non-Incarnon Dera, +536.4%".
  #
  # Those are 0.30 x 4.667 and 0.22 x 6.364 — both exactly 1.40, which is the
  # current status chance a 35% cap at 25% a point needs. So "CURRENT" means
  # after mods, and the three status chances the note groups are this roster's
  # 0.30 / 0.22 / 0.22, digit for digit.
  #
  # "BASE Critical Chance" is where it lands, so the crit mods multiply it.
  - kind: crit_chance_from_status_chance
    rate: 0.25
    cap: 0.35

source:
  url: https://wiki.warframe.com/w/Dera_Incarnon_Genesis
