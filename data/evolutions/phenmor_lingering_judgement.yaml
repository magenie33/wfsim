id: phenmor_lingering_judgement
name: Lingering Judgement
weapon: phenmor
tier: 5
description: "On 2 headshots within 2 seconds: +50% Headshot damage for 8 seconds."
# A NATURAL Incarnon: the Phenmor carries its Genesis innately, so this perk
# belongs to the weapon rather than to an adapter shared by a family. Five
# tiers, thirteen perks - see docs/INCARNON.md for why the naturals are shaped
# differently from the 31 adapters.
# NO `icon:`. The field is optional and the build FAILS on one that does not
# resolve to a real image, so a guessed wiki file name is worse than none —
# these five had no verified `File:` name and the Laetum's thirteen ship
# without icons for the same reason.
selection: choose_one

effects:
  # THE BONUS IS ADDITIVE WITH PRIMARY DEADHEAD'S. VERBATIM (wiki): "Headshot
  # damage bonus stacks additively with Primary Deadhead's headshot damage
  # bonus" — so it joins the same bracket the arcane feeds
  # rather than multiplying it, and a build already carrying Deadhead gets far
  # less out of it than +50% reads: on a 2x head it is x1.385, not x1.5.
  #
  # THE ARMING HIT DOES NOT BENEFIT — its damage is settled before the window
  # opens — and the streak is spent when it fires, so the next window needs two
  # fresh headshots rather than re-arming off the same pair.
  #
  # On the official ruler, which puts every shot into a head, it arms on the
  # second shot and never lapses. That is not a modelling shortcut: at 2 hits in
  # 2 s the clause only binds below one headshot every two seconds.
  - kind: headshot_damage_on_headshot_streak
    hits: 2
    within_seconds: 2.0
    value: 0.50
    duration_seconds: 8.0

source:
  url: https://wiki.warframe.com/w/Phenmor
