id: sancti_magistar_crushing_verdict
name: Crushing Verdict
weapon: sancti_magistar
tier: 2
description: "Base Damage +20. Follow Through +40% with a Channeled Ability active."
# THE GENESIS IS THE FAMILY'S. +100 is the Magistar's column; the Sancti
# Magistar's is +20 and belongs to that entry.
selection: choose_one

effects:
  # from: "Base Damage +20" — this weapon's column of the shared table. The
  # Magistar's is +100; one adapter, two numbers, and the table prints both.
  - kind: flat_base_damage
    value: 20.0
  # from: "Follow Through +40%" — a bigger share for every body a swing reaches
  # past the first, which on a hammer's 0.4 takes the second body from 40% to
  # 56%. Its gate is a CHANNELED ABILITY, which is the same Tenno state
  # `data/mods/` already models as assumed-on: this arena runs one weapon and
  # casts nothing, so the state is declared rather than simulated.
  - kind: follow_through_bonus
    value: 0.4

source:
  url: https://wiki.warframe.com/w/Magistar_Incarnon_Genesis
