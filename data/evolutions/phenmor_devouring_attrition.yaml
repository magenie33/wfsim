id: phenmor_devouring_attrition
name: Devouring Attrition
weapon: phenmor
tier: 5
description: "50% chance to deal +2000% damage on non-critical hits."
# see notes: natural_incarnon_phenmor_carries_2
selection: choose_one

effects:
  # An INDEPENDENT multiplier, rolled per damage instance that did NOT crit -
  # the Laetum's page states the rule for the family ("multiplicative to base
  # damage bonuses such as Hornet Strike", and it "Affects both forms").
  - kind: chance_damage_on_noncrit
    chance: 0.50
    value: 20.0            # +2000% => x21 on the instance

source:
  url: https://wiki.warframe.com/w/Phenmor
