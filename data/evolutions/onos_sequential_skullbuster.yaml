id: onos_sequential_skullbuster
name: Sequential Skullbuster
weapon: onos
tier: 5
description: "On Consecutive Weakpoint Hits: +30% Headshot Damage. Stacks up to 4x."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
# "Evolution V, Sequential Skullbuster, does not affect Incarnon mode" — and
# the wiki files that under BUGS, not Notes. It is modelled anyway, because
# this app matches the game and not the card; but a fix at DE's end deletes
# this line rather than changing it, which is why the section is named.
base_form_only: true
selection: choose_one

effects:
  # VERBATIM (Onos, EVO5):
  #   * On Consecutive Weakpoint Hits: '''+30%''' Headshot Damage. Stacks up to '''4x'''
  #
  # THE TRIGGER IS ALREADY A RULE HERE. `BuffTrigger::ConsecutiveHeadshot` is
  # the one trigger in this sim the NEXT shot can undo: a body hit takes the
  # whole pile, because what ends it is what you hit and not how long you
  # waited. So the card needs no clock and is given none.
  #
  # THE GRANT joins the ADDITIVE headshot bracket, beside Primary Deadhead's and
  # Lingering Judgement's. The wiki lists every innate headshot source as
  # additive with Deadhead's and calls out exactly one exception (Cernos
  # Prime's, "unique"), so additive is the default and this is not the
  # exception.
  - kind: stacking_buff
    trigger: consecutive_headshot
    grants: headshot_damage
    per_stack: 0.30
    max_stacks: 4

source:
  url: https://wiki.warframe.com/w/Onos
