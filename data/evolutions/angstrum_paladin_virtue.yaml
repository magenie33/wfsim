id: angstrum_paladin_virtue
name: Paladin Virtue
weapon: angstrum
tier: 2
description: "Increase Base Damage by +75. With Energy Max Over 700: Increase Base Critical Damage Multiplier by +0.5x."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Damage by +75"
  - kind: flat_base_damage
    value: 75.0
  # A QUESTION ABOUT THE PLAYER, read rather than ignored. The neutral Tenno has
  # no energy pool, so this pays NOTHING until someone says which frame is
  # carrying the gun — the same `condition:` spelling the sprint gates use.
  #
  # "BASE Critical Damage Multiplier", so the crit-damage mods multiply it.
  - kind: gated_by_tenno
    condition: "energy_max > 700"
    grant: base_crit_damage
    value: 0.5

source:
  url: https://wiki.warframe.com/w/Angstrum_Incarnon_Genesis
