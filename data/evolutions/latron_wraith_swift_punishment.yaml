id: latron_wraith_swift_punishment
name: Swift Punishment
weapon: latron_wraith
tier: 2
description: "Increase Base Damage by +12. With Sprint Speed 1.2 or Higher: +30% Direct Damage per Status Type affecting the target."
# see notes: genesis_family_s_latron
selection: choose_one

effects:
  - kind: flat_base_damage
    value: 12.0
  # CONDITION OVERLOAD, granted by an evolution — it joins the same per-type
  # rate the Galvanized mods feed, diluted and combined by the weapon's own
  # `co_behavior` (Additive here) rather than forming a bucket of its own.
  #
  # THE SPRINT-SPEED CONDITION IS READ, and it is a question about
  # the PLAYER rather than about this weapon — so it is answered in `resolve_for`,
  # which has the Tenno, rather than in `apply`, which never sees one.
  #
  # THE NEUTRAL PLAYER SPRINTS AT 0.9, the slowest a frame has, so this
  # half pays NOTHING until someone says which frame is carrying the gun. That
  # is the same rule every other Tenno field follows: with no frame chosen the
  # wielder claims nothing. Read as always-on it was generous to exactly the
  # builds that cannot reach
  # the threshold.
  - kind: condition_overload
    value: 0.30
    # see notes: card_says_1_2
    #
    # see notes: transcribed_per_row_rather
    #
    # see notes: threshold_what_makes_row
    condition: "sprint_speed >= 1.1"
    # see notes: card_wrong_effect_right
    misprint: >-
      the card prints Sprint Speed 1.2 or Higher and the effect requires 1.1 — so it pays on frames the card says it should not, and Amalgam Serration alone carries any Warframe over the line

source:
  url: https://wiki.warframe.com/w/Latron_Incarnon_Genesis
