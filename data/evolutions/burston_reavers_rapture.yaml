id: burston_reavers_rapture
name: Reaver's Rapture
weapon: burston
tier: 4
icon: DamageIncreaseOnFullBurstHitResetOnReload(xWhite).png
description: "On Full Burst Hit: +20% Damage, resets on Reload."
# see notes: genesis_family_s_burston
selection: choose_one

effects:
  # A STACKING BUFF WITH NO CLOCK. "On Full Burst Hit: +20% Damage… Caps at 5x
  # for +100% damage, additive with base damage mods such as Serration" — so
  # the payload joins the base-damage bucket Serration and this ladder's own
  # +42 share, and it is held until something takes it rather than timing out.
  #
  # THE TRIGGER IS A COMPLETED BURST, and the card's three qualifiers are all
  # already true of this arena rather than needing rules of their own: "not
  # affected by multishot or punch through" (one count per burst, not per
  # pellet), "counts object hits such as nullifier bubbles", and "activates
  # even if the first hit of a burst kills the target". One target that
  # respawns, every round reaches it — a completed burst IS a full burst hit.
  #
  # THE MOMENT IS THE LAST ROUND OF THE BURST, so the burst that earns a stack
  # does not carry it; the next one does. A magazine that does not divide by
  # three leaves a partial burst that earns nothing, because the count restarts
  # with the magazine.
  #
  # "RESETS ON RELOAD" AND "RESETS WHEN ACTIVATING INCARNON" ARE ONE RULE:
  # whatever refills the magazine takes it, and swapping either way fully
  # reloads the base form (wiki). "Cannot be stacked in Incarnon form" needs
  # nothing at all — that form is AUTO, so no burst ever completes in it.
  #
  # It is worth less than the +100% the cap suggests: a 45-round magazine is 15
  # bursts and the first four are spent climbing, so a full magazine averages
  # about +87%.
  - kind: stacking_buff
    per_stack:
      base_damage_bonus: 0.20
    max_stacks: 5
    trigger: full_burst_hit

source:
  url: https://wiki.warframe.com/w/Burston_Incarnon_Genesis
