id: nami_solo_evo1_incarnon_form
name: Incarnon Form
weapon: nami_solo
tier: 1
position_in_tier: 1
icon: ExtremeRange(xWhite).png
description: "Reach 6x Combo and then Heavy Attack to activate Incarnon Form for 180 seconds. Greatly increase Range. +3 Range, +100% Melee Damage, +20% Sprint Speed, +20% to Parkour Velocity."
# A MELEE INCARNON IS NOT A FORM: it changes numbers on the ways the weapon
# is already swung and unlocks no second entry (docs/MELEE.md §7). The window
# is simulated: the fight opens un-armed and buys it with a heavy attack.
selection: fixed

effects:
  # 180 s is W`Nami_Solo_Incarnon_Genesis`'s overview and the module's `IncarnonDuration = 180`.
  - kind: incarnon_window
    arm_at_combo: 6.0
    seconds: 180.0
  - kind: melee_range_bonus_m
    value: 3.0
  - kind: base_damage_bonus
    value: 1.0
  - kind: out_of_scope
    clause: "+20% Sprint Speed, +20% to Parkour Velocity"
    reason: no_movement

source:
  url: https://wiki.warframe.com/w/Nami_Solo_Incarnon_Genesis
