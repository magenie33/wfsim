id: bronco_prime_speeding_bullet
name: Speeding Bullet
weapon: bronco_prime
tier: 2
description: "Increase Base Damage by +30. With Sprint Speed 1.2 or Higher: +60% Projectile Speed."
# see notes: genesis_family_s_adapter_3
#
#   Bronco Prime||Incarnon Mode||…||238 or 448 (with Evolution II Perk 1)||238||100% or 53%||Adding||CO-bonus does not use base damage increase Evolution
#
# Which perk: +30 a PELLET across seven pellets is the 210 the row prints (448 - 238); Infused Shots adds +16 and is not it.
co_base_excludes_this_evolution: true
selection: choose_one

effects:
  # from: "Increase Base Damage by +30"
  - kind: flat_base_damage
    value: 30.0
  # A QUESTION ABOUT THE PLAYER, read rather than ignored. The neutral Tenno
  # sprints at 0.9 — the slowest a frame has, so this pays NOTHING until someone
  # says which frame is carrying the gun — the same rule the Latron family's
  # Swift Punishment follows, and the same `condition:` spelling.
  # Projectile speed joins the indirect bucket the mods feed, so it sums with
  # them rather than multiplying.
  - kind: gated_by_tenno
    condition: "sprint_speed >= 1.2"
    grant: projectile_speed
    value: 0.6

source:
  url: https://wiki.warframe.com/w/Bronco_Incarnon_Genesis
