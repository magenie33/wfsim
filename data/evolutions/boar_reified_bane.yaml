id: boar_reified_bane
name: Reified Bane
weapon: boar
tier: 2
position_in_tier: 1
icon: ReloadFromEmpty.png
description: "Increase Base Damage by +10.
On Reload From Empty: Increase Base Damage by +10."
# see notes: genesis_family_s_boar
#
# see notes: no_other_variant_says
selection: choose_one

effects:
  # The UNCONDITIONAL half only. +10 to the base TOTAL, spread pro-rata across
  # the vector before mods — the same layer every other "+N Base Damage"
  # evolution occupies.
  - kind: flat_base_damage
    value: 10.0
  # THE CONDITIONAL HALF, earned before the fight: one empty reload, and the
  # only thing that takes it is a manual reload of a magazine that is not
  # empty, which this engine never makes (UNMODELLED.md §"The MANUAL reload").
  # Up before the first shot and never taken, so where in a reload the game
  # pays it (its first frame, M29) moves nothing here. A buff's base add, so it
  # does not feed the Condition Overload term: that reads the weapon's own base.
  - kind: stacking_buff
    trigger: reload_from_empty
    grants: flat_base_damage
    per_stack: 14.0
    max_stacks: 1
    card: evo_reload_damage
    precombat: true
    # THE CARD SAYS +10 AND THE GAME PAYS +14: the wiki's "incorrectly listed
    # as +10 in game", read in the damage on the Prime (M88).
    misprint: >-
      The card says +10; the effect is +14, measured on the Boar Prime, which shares this card.

source:
  url: https://wiki.warframe.com/w/Boar_Incarnon_Genesis
