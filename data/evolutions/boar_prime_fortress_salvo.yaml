id: boar_prime_fortress_salvo
name: Fortress Salvo
weapon: boar_prime
tier: 2
icon: PunchThroughWithArmorAboveX(xWhite).png
description: "Increase Base Damage by +16.
With Armor Over 450: +4 Punch Through"
selection: choose_one

effects:
  - kind: flat_base_damage
    value: 16.0
  # GATED ON THE WARFRAME'S ARMOUR, and the gate is real. This
  # arm read `value` and ignored `condition:` for as long as it existed, so the
  # +4 paid out to every frame in the game — reported by the owner, who noticed
  # a perk requiring 450 armour working with none. The neutral Tenno is the
  # FLOOR of every released frame at 105 armour (data/tenno/default.yaml), so
  # this is OFF unless the fight names a frame that clears 450.
  - kind: punch_through_bonus
    value: 4.0
    condition: "armor > 450"

source:
  url: https://wiki.warframe.com/w/Boar_Incarnon_Genesis
