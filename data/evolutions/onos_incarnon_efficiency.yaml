id: onos_incarnon_efficiency
name: Incarnon Efficiency
weapon: onos
tier: 4
description: "Headshots build +50% more Incarnon Transmutation charge."
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # THE WHOLE SENTENCE. "Headshots build +50% more Incarnon Transmutation
  # charge" is one clause, and the intake's splitter cut it after "Incarnon" —
  # the head became this effect and the tail, two words with no verb in them,
  # became an `unmodelled_transmutation_charge` sitting underneath. So a perk
  # that is fully modelled printed "partly modelled" on its own card, about the
  # second half of the sentence the first half already implements.
  - kind: incarnon_charge_rate
    value: 0.5

source:
  url: https://wiki.warframe.com/w/Onos
