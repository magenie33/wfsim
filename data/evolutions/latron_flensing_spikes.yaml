id: latron_flensing_spikes
name: Flensing Spikes
weapon: latron
tier: 4
description: "Remove 20% of enemy Armor per Puncture Status."
# THE GENESIS IS THE FAMILY'S. One Latron Incarnon Genesis upgrades any of the
# three Latrons, so all three carry the same ladder of nine perks. Where a value
# DIFFERS between them the wiki's table prints a per-variant column, and the
# number below is this weapon's.
selection: choose_one

effects:
  # MODELLED (2026-08-12). A THIRD ARMOUR-STRIP SOURCE: the engine had Corrosive
  # and Heat, the two the game strips with, and this is a weapon PERK stripping
  # off a status that removes no armour by itself. It multiplies with the other
  # two the way those two already multiply with each other — each removes a
  # share of what is LEFT, which is what "remove 20% of enemy Armor" means once
  # something else has removed some.
  #
  # PUNCTURE CAPS AT FIVE STACKS, so 20% a stack is the WHOLE of the armour at
  # the cap. That is what the card adds up to rather than a rounding of it, and
  # it is why this pairs with Riddled Target in the tier above: both read the
  # Puncture this family produces more of than anything else, and against the
  # official ruler's Thrax at level 9999 armour is most of the effective health.
  - kind: armor_strip_per_puncture_status
    value: 0.20

source:
  url: https://wiki.warframe.com/w/Latron_Incarnon_Genesis
