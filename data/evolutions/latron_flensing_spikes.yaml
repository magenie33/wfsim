id: latron_flensing_spikes
name: Flensing Spikes
weapon: latron
tier: 4
icon: ArmourStrippedForEveryStackOfPierce.png
description: "Remove 20% of enemy Armor per Puncture Status."
# see notes: genesis_family_s_latron
selection: choose_one

effects:
  # MODELLED. A THIRD ARMOUR-STRIP SOURCE: the engine had Corrosive
  # and Heat, the two the game strips with, and this is a weapon PERK stripping
  # off a status that removes no armour by itself. It multiplies with the other
  # two the way those two already multiply with each other — each removes a
  # share of what is LEFT, which is what "remove 20% of enemy Armor" means once
  # something else has removed some.
  #
  # PER BULLET, NOT PER STACK, AND FOR GOOD (MEASUREMENTS M102). Each bullet
  # that procs Puncture takes 20% of the armour once — a bullet landing two
  # Puncture procs still takes 20% — so five such bullets take all of it,
  # while five stacks off fewer bullets leave armour standing. The armour does
  # not come back when the Puncture lapses.
  - kind: armor_strip_per_puncture_status
    value: 0.20

source:
  url: https://wiki.warframe.com/w/Latron_Incarnon_Genesis
