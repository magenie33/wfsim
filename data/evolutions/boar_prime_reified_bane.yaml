id: boar_prime_reified_bane
name: Reified Bane
weapon: boar_prime
tier: 2
icon: ReloadFromEmpty(xWhite).png
description: "Increase Base Damage by +10.
On Reload From Empty: Increase Base Damage by +14."
selection: choose_one

effects:
  # The UNCONDITIONAL half only. +10 to the base TOTAL, spread pro-rata across
  # the vector before mods — the same layer every other "+N Base Damage"
  # evolution occupies.
  - kind: flat_base_damage
    value: 10.0
  # The conditional half, MODELLED AS HELD — and the TIMING is what makes that
  # correct rather than convenient.
  #
  # IN GAME the bonus lands the MOMENT an empty reload BEGINS; it does not wait
  # for the reload to finish (user, 2026-08-03: "换弹的那一刻就有了，不需要等待
  # 换弹完成"). The wiki says the opposite — "applied after finishing a reload
  # while the magazine is empty" — and a measurement beats the wiki here, as
  # everywhere.
  #
  # That distinction is not pedantry, it is the whole justification. Under the
  # wiki's reading the buff would be DOWN for one reload every cycle — 2.75 s
  # of a magazine that lasts 20 rounds — so "held for the whole run" would
  # overstate the build every cycle. Under the measured behaviour there is no
  # gap at all: the magazine empties, the reload starts, the buff is already
  # back, and it "lasts indefinitely until a manual reload is initiated while
  # the magazine is not empty" (the wiki's own words, and the sim never does
  # that). So held is exact, not an approximation.
  #
  # The wiki also records that the game MISPRINTS this half as +10 on the card
  # ("Reload From empty bonus is incorrectly listed as +10 in game"); the
  # effect is +14, which is what goes in.
  # THE EXCEPTION, not a pattern to copy: a reload-triggered effect fires on
  # reload COMPLETION by default (user, 2026-08-03). This one needs the
  # magazine EMPTY and fires at the reload's FIRST FRAME. Only this evolution
  # is known to do it; the next one gets its own kind.
  - kind: flat_base_damage_on_empty_reload
    value: 14.0

source:
  url: https://wiki.warframe.com/w/Boar_Incarnon_Genesis
