id: dual_toxocyst_fevered_frenzy
name: Fevered Frenzy
weapon: dual_toxocyst
tier: 2
icon: IncreasedFireRateOnAbilityUseStacks(xWhite).png   # wiki File: name (Dual_Toxocyst_Incarnon_Genesis)
description: "Increase Base Damage by +50.\nOn Ability Cast: +5% Multishot. Stacks up to 20x."
selection: choose_one

effects:
  - kind: flat_base_damage
    # Adds to the BASE TOTAL, distributed PRO-RATA across the existing
    # damage vector (75 -> 125 keeps the 10/80/10 split = vector x1.67),
    # BEFORE mods - and therefore inside ModdedBase (DoT ticks scale too).
    value: 50
  - kind: stacking_buff
    trigger: on_ability_cast
    per_stack: { multishot_bonus: 0.05 }   # additive with multishot mods
    max_stacks: 20
    # `duration`/`cleared_on` are NOT loaded: `evolutions_data` maps a
    # `stacking_buff` with a `multishot_bonus` payload to
    # `AssumedMaxMultishot`, which carries only the total and the cap. That IS
    # the permanence — a buff with no timer and no in-sim trigger is a static
    # choice, full by default — so the two keys are the written record of why,
    # not an input (data/README.md).
    duration: permanent          # MEASURED (2026-07-24, user): stacks have
    cleared_on: [death]          # no timer; only player death clears them

source:
  url: https://wiki.warframe.com/w/Dual_Toxocyst_Incarnon_Genesis
