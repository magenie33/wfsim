id: dual_toxocyst_fevered_frenzy
name: Fevered Frenzy
weapon: dual_toxocyst
tier: 2
position_in_tier: 2
icon: IncreasedFireRateOnAbilityUseStacks(xWhite).png   # wiki File: name (Dual_Toxocyst_Incarnon_Genesis)
description: "Increase Base Damage by +50.\nOn Ability Cast: +5% Multishot. Stacks up to 20x."
selection: choose_one

# THIS perk's +50 base damage does not feed the GunCO term either — MEASURED. At the 125 panel this perk produces,
# Galvanized Shot at 3 stacks against 2 status types reads 305, and a CO term
# computed on 125 would read `125 + 125 x 2.4 = 425`. A flat 75 gives
# `125 + 75 x 2.4 = 305` exactly.
#
# IT CONTRADICTS THE CATALOG, which is why it is worth this paragraph. The CO
# table names only Carnage Reign for this weapon, and CATALOGS' standing rule is
# that ABSENCE MEANS ORDINARY — so this perk was modelled as feeding CO in full,
# and the sibling file still carried a comment saying so in as many words. The
# rule is not repealed by one counterexample (it has held for every other row),
# but the catalog's silence is now known to be silence rather than a statement
# HERE: the exclusion on this weapon is the WEAPON's, not one perk's, and both
# tier-2 options compute CO on the unevolved 75.
co_base_excludes_this_evolution: true

effects:
  - kind: flat_base_damage
    # Adds to the BASE TOTAL, distributed PRO-RATA across the existing
    # damage vector (75 -> 125 keeps the 10/80/10 split = vector x1.67),
    # BEFORE mods - and therefore inside ModdedBase (DoT ticks scale too).
    value: 50
  - kind: stacking_buff
    trigger: ability_cast
    grants: multishot
    per_stack: 0.05   # additive with multishot mods
    max_stacks: 20
    # NO CLOCK, MEASURED: the stacks have no timer and only the player's death
    # clears them, which this arena never does. Earned before the fight by
    # twenty casts of any ability, and by every cast the fight makes.
    precombat: true

source:
  url: https://wiki.warframe.com/w/Dual_Toxocyst_Incarnon_Genesis
