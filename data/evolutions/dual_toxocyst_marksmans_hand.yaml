icon: LessRecoil(xWhite).png   # wiki File: name (Dual_Toxocyst_Incarnon_Genesis)
description: "-50% Weapon Recoil."
selection: choose_one

effects:
  # NOT LOADED: `evolutions_data::effect()` has no `recoil_reduction` arm (the
  # MODS loader has one — different loader, different vocabulary), so this
  # resolves to `EvoEffect::Inert` and the engine takes nothing
  # (data/README.md).
  # NEGATIVE = less recoil, the convention the MODS carry (Primed Stabilizer
  # ramps -0.15 -> -0.9). This read +0.50 — i.e. FIFTY PERCENT MORE recoil —
  # for as long as the loader ignored it; wiring the bucket up is what surfaced
  # it (2026-08-03).
  - kind: recoil_reduction
    value: -0.50

source:
