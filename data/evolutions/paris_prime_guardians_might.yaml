id: paris_prime_guardians_might
name: Guardian's Might
weapon: paris_prime
tier: 2
description: "Increase Base Damage by +20. With Overshields: Increase Base Damage by +74."
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # VERBATIM (Paris_Incarnon_Genesis, EVO2, the row's effect cell):
  #   *Increase Base Damage by '''+X'''.
  #   *With Overshields: Increase Base Damage by '''+Y'''.
  #   | X = 20<br>Y = 74      (column 3 of Paris | Mk1-Paris | Paris Prime)
  #
  # from: "Increase Base Damage by +20"
  - kind: flat_base_damage
    value: 20.0
  # see notes: same_statement_gated_player
  #
  # It folds through `WeaponBase::add_flat_base_damage`, the same call the flat
  # perk above makes: the base vector scales pro-rata and the explosion takes it
  # too, so a gated +74 and a plain +74 are the same weapon.
  #
  # see notes: nothing_here_takes_overshields
  - kind: gated_by_tenno
    condition: overshields
    grant: flat_base_damage
    value: 74.0

source:
  url: https://wiki.warframe.com/w/Paris_Incarnon_Genesis
