id: despair_stalkers_vendetta
name: Stalker's Vendetta
weapon: despair
tier: 2
description: "Increase Base Damage by +60. With Dread and Hate equipped: bonus Multishot and Damage."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
# THIS PERK'S FLAT DAMAGE STAYS OUT OF THE CO TERM. VERBATIM (CO catalog):
#
#   Despair||Incarnon Mode||…||60 or 120 (with Evolution II Perk 2)||60||100% or 50%||Adding||CO-bonus does not use base damage increase Evolution
#
# Which perk: +60 is the difference the row prints (120 - 60); its tier-mate Fatal Affliction adds +50 and is NOT in the row, so it feeds the CO term in full — the catalog lists only discrepant cases.
co_base_excludes_this_evolution: true
selection: choose_one

effects:
  # THE PAGE SAYS "Increase Damage", NOT "Increase Base Damage", and it is page
  # style rather than a layer: that wording appears twice on the Despair's
  # Genesis page and "Increase Base Damage" appears zero times, so there is no
  # in-page contrast to read. Nor is there an "added after mods as a flat value"
  # note, which is the clause that actually distinguishes the two brackets (see
  # `felarx_brutal_edge`). Base, like every sibling perk in the set. Checked
  # 2026-08-08 while sweeping for that error class; recorded so it is not
  # re-opened from the wording alone.
  # from: "Increase Base Damage by +60"
  - kind: flat_base_damage
    value: 60.0
  # AN EDGE, NOT A GAP — see docs/UNMODELLED.md, and the same reason the Dread's
  # Stalker's Resentment carries: it asks for TWO OTHER WEAPONS in the loadout,
  # and this arena holds one gun and never swaps.
  #
  # VERBATIM (Despair_Incarnon_Genesis, the row's effect cell and its notes):
  #   * With {{Weapon|Dread}} and {{Weapon|Hate}} equipped:
  #   ** Multishot consumes ammo directly from Capacity and increases Damage by
  #      '''+100%'''.
  #   ** '''+30%''' Multishot.
  #   * Damage bonus is a unique modifier that is multiplicative to other damage
  #     buffs.
  #   * Damage bonus only applies to shots generated by multishot.
  #
  # THE LAST TWO NOTES ARE KEPT ON PURPOSE. An edge is not a licence to stop
  # transcribing: if a loadout is ever modelled, the bracket is already settled
  # — a UNIQUE multiplicative modifier, applied only to the multishot-generated
  # shots — and nobody has to re-derive it from the card.
  - kind: out_of_scope
    clause: "With Dread and Hate equipped: Multishot consumes ammo directly from Capacity and increases Damage by +100%. +30% Multishot"
    reason: no_holster

source:
  url: https://wiki.warframe.com/w/Despair_Incarnon_Genesis
