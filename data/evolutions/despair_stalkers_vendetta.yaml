id: despair_stalkers_vendetta
name: Stalker's Vendetta
weapon: despair
tier: 2
description: "Increase Base Damage by +60. With Dread and Hate equipped: bonus Multishot and Damage."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Damage by +60"
  - kind: flat_base_damage
    value: 60.0
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "With Dread and Hate equipped: bonus Multishot and Damage"
  - kind: unmodelled_with_dread_and_hate_equipped_bonus_multishot_and_dama

source:
  url: https://wiki.warframe.com/w/Despair_Incarnon_Genesis
