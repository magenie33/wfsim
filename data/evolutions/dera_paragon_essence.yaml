id: dera_paragon_essence
name: Paragon Essence
weapon: dera
tier: 2
description: "Increase Base Damage by +6. On Status Effect: +5% Fire Rate for 5 seconds. Stacks up to 6x."
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # from: "Increase Base Damage by +6"
  - kind: flat_base_damage
    value: 6.0
  # MODELLED as a plain stacking buff. "On Status Effect" is a proc LANDING —
  # not the target already carrying one — so a build that lands nothing never
  # earns it however long the fight runs.
  #
  # ADDITIVE WITH FIRE-RATE MODS: "Fire Rate bonus stacks additively with other
  # fire rate bonuses such as Speed Trigger" (notes cell).
  #
  # see notes: stack_cap_was_separate
  - kind: stacking_buff
    trigger: status_applied
    per_stack:
      fire_rate_bonus: 0.05
    max_stacks: 6
    duration_seconds: 5.0

source:
  url: https://wiki.warframe.com/w/Dera_Incarnon_Genesis
