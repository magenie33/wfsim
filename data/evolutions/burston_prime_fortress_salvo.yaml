id: burston_prime_fortress_salvo
name: Fortress Salvo
weapon: burston_prime
tier: 2
icon: PunchThroughWithArmorAboveX(xWhite).png
description: "Increase Base Damage by +42.\nWith Armor Over 450: +2 Punch Through."
# see notes: genesis_family_s_burston
selection: choose_one

# CO'S BASE EXCLUDES THIS PERK'S +42 — MEASURED.
#
# see notes: burston_prime_incarnon_form
#
#   1 stack   direct crit 181     2 stacks   direct crit 196, radial 65
#
# see notes: incarnon_form_13_base
#
# see notes: 165_x_1_0
#
# see notes: both_land_13_55
#
# see notes: what_fixes_catalog_silence
#
# THE MEASUREMENT WAS TAKEN ON FORCEFUL FINALITY, its tier-2 twin. Both add the
# same +42 at the same tier, and the catalog flags such pairs together (the
# Atomos: "both tier-2 options, each +24").
co_base_excludes_this_evolution: true
effects:
  # The same +42 its tier-mate gives, so this pair is decided entirely by the
  # second line — and in a single-target arena neither second line does
  # anything, which makes the two evolutions genuinely equal here. Worth
  # stating rather than leaving a reader to wonder why the optimizer is
  # indifferent between them.
  - kind: flat_base_damage
    value: 42.0
  # NOT LOADED: no `punch_through` arm in the evolutions loader, and the
  # condition is on the TENNO's armour. Punch through decides nothing in a
  # single-target arena either way. (The Boar's copy of this evolution grants
  # +4; this one grants +2.)
  - kind: punch_through_bonus
    value: 2.0
    condition: "armor > 450"

source:
  url: https://wiki.warframe.com/w/Burston_Incarnon_Genesis
