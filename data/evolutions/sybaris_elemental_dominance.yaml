id: sybaris_elemental_dominance
name: Elemental Dominance
weapon: sybaris
tier: 4
description: "Increase Base Status Chance by +15%. Effect doubles in Incarnon Form."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Status Chance by +15%"
  - kind: flat_base_status_chance
    value: 0.15
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "Effect doubles in Incarnon Form"
  - kind: unmodelled_effect_doubles_in_incarnon_form

source:
  url: https://wiki.warframe.com/w/Sybaris_Incarnon_Genesis
