id: phenmor_spiteful_defilement
name: Spiteful Defilement
weapon: phenmor
tier: 5
description: "Enemies suffering from fewer than 3 Status Effects will receive: +100% Critical Damage"
# A NATURAL Incarnon: the Phenmor carries its Genesis innately, so this perk
# belongs to the weapon rather than to an adapter shared by a family. Five
# tiers, thirteen perks - see docs/INCARNON.md for why the naturals are shaped
# differently from the 31 adapters.
# NO `icon:`. The field is optional and the build FAILS on one that does not
# resolve to a real image, so a guessed wiki file name is worse than none —
# these five had no verified `File:` name and the Laetum's thirteen ship
# without icons for the same reason.
selection: choose_one

effects:
  # TYPES, NOT STACKS, and the card says so with its own example: "Multiple
  # instances of the same status effect are not counted separately, e.g. having
  # 5 corrosive and 5 radiation status effects on a target will not disable this
  # buff". That counter already existed — Condition
  # Overload's bucket IS the distinct-type count — so the two read the same
  # number and cannot drift apart.
  #
  # AFTER MODS, AS A FLAT VALUE ("Bonus is added after mods as a flat value"):
  # +100% is +1.0 on the finished crit multiplier, in the same bucket Cold's
  # received crit-damage bonus uses. It is NOT a doubling and NOT a base-stat
  # change, so a 2.0x weapon crits for 3.0x rather than 4.0x.
  #
  # It is the ANTI-CO perk: the third status TYPE turns it off, and the third
  # type is where Condition Overload starts paying. No build wants both.
  - kind: crit_multiplier_below_status_count
    threshold: 3
    value: 1.00

source:
  url: https://wiki.warframe.com/w/Phenmor
