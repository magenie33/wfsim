id: ballistica_survivors_edge
name: Survivor's Edge
weapon: ballistica
tier: 4
description: "Increase Base Critical Chance by +10%. Increase Base Status Chance by +10% per projectile. Increase Base Status Chance by +10% for Incarnon Form."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Critical Chance by +10%"
  - kind: flat_base_crit_chance
    value: 0.1
  # from: "Increase Base Status Chance by +10%"
  - kind: flat_base_status_chance
    value: 0.1
  # from: "Increase Base Status Chance by +10%"
  - kind: flat_base_status_chance
    value: 0.1
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "per projectile"
  - kind: unmodelled_per_projectile
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "for Incarnon Form"
  - kind: unmodelled_for_incarnon_form

source:
  url: https://wiki.warframe.com/w/Ballistica_Incarnon_Genesis
