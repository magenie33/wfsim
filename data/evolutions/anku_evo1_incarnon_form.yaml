id: anku_evo1_incarnon_form
name: Incarnon Form
weapon: anku
tier: 1
position_in_tier: 1
icon: SlideRangeSlashBias(xWhite).png
description: "Reach 6x Combo and then Heavy Attack to activate Incarnon Form. Incarnon form temporarily increases Range and inflicts guaranteed Slash Status for all attacks after a successful slide attack. +100% Melee Damage, +20% Sprint Speed, +20% Bullet Jump."
selection: fixed

effects:
  # from: "Reach 6x Combo and then Heavy Attack"; "the Incarnon form lasts for
  # 180 seconds" (W`Anku_Incarnon_Genesis`, overview).
  - kind: incarnon_window
    arm_at_combo: 6.0
    seconds: 180.0
  # from: "+100% Melee Damage"
  - kind: base_damage_bonus
    value: 1.0
  # "Successful slide attacks grant +3 Range and forced Slash Status for
  # all attacks for 6s" (notes cell). Gated on a slide attack, and this
  # weapon has no slide mode.
  - kind: unmodelled_range_and_guaranteed_slash_after_a_slide_attack
  - kind: out_of_scope
    clause: "+20% Sprint Speed, +20% Bullet Jump"
    reason: no_movement

source:
  url: https://wiki.warframe.com/w/Anku_Incarnon_Genesis
