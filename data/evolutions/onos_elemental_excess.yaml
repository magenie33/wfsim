id: onos_elemental_excess
name: Elemental Excess
weapon: onos
tier: 4
description: "+20% Status Chance -10% Critical Chance"
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # VERBATIM (wiki): "Bonuses are added after mods as a flat value" — the same
  # layer the Phenmor's perk of this name occupies, and the same wording. NO
  # multishot division here: the Onos fires one projectile, so the listed number
  # IS the per-pellet number.
  - kind: flat_status_chance_after_mods
    value: 0.20
  - kind: flat_crit_chance_after_mods
    value: -0.10

source:
  url: https://wiki.warframe.com/w/Onos
