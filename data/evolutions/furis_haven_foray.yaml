id: furis_haven_foray
name: Haven Foray
weapon: furis
tier: 2
icon: DamageAndIncreasedDamageWithOvershields(xWhite).png
description: "Increase Base Damage by +28.\nWith Overshields: Increase Base Damage by +30."
# THE GENESIS IS THE FAMILY'S. One Furis Incarnon Genesis upgrades either the
# Furis or the MK1-Furis, so both weapons carry the same ladder. Where a value
# DIFFERS between them the wiki prints it as a pair, and the number below is
# this weapon's.
selection: choose_one

# CONDITION OVERLOAD — this perk's added base is EXCLUDED from the CO term.
# The catalog's Furis row, verbatim:
#
#   Furis | Incarnon Mode | Projectile | 100 or 128 (with Evolution II) | 100 |
#     100% or 78% | Adding | "CO-bonus does not use base damage increase
#     Evolution"
#
# The arithmetic ties it down: the Incarnon form is 100 Heat, Evolution II adds
# 28, and 100/128 = 78% is the third column exactly. So CO keeps multiplying
# the UNEVOLVED 100 while the hit itself lands 128.
#
# On the TIER rather than on one option, unlike the Dual Toxocyst's row: that
# one names "Evolution II Perk 1" and its tier-mate is absent, so the flag had
# to be per perk. This row names "Evolution II" with no perk number, and BOTH
# of this tier's options grant the same +28 — there is no second reading.
co_base_excludes_this_evolution: true

effects:
  # The unconditional half, and the one a SECOND source cross-checks on the
  # Furis: the CO catalog's row reads "100 or 128 (with Evolution II)", which
  # is this +28 on a 100-Heat form. The MK1's +34 rests on the wiki alone.
  - kind: flat_base_damage
    value: 28.0
  # …and the SAME statement, gated on the player. This effect was written under
  # a kind the loader did NOT know, deliberately — the `flat_base_damage` arm
  # ignores `condition:`, so spelling it that way would have loaded a silent,
  # unconditional +30 — and the comment it carried said "a sim that ever models
  # overshields starts here". It does now (2026-08-12): `TennoGate` has the
  # state, the player declares it in the Tenno panel, and the grant folds
  # through `WeaponBase::add_flat_base_damage` exactly as the flat half above.
  #
  # VERBATIM (Furis_Incarnon_Genesis, the row's effect cell):
  #   * Increase Base Damage by '''+X'''.
  #   * With Overshields: Increase Base Damage by '''+30'''.
  #   | X = 28   | X = 34        (Furis | Mk1-Furis, from the page's own first
  #                               line: "the Furis or Mk1-Furis")
  # The Y is written into the bullet rather than into a column, so both take +30.
  - kind: gated_by_tenno
    condition: overshields
    grant: flat_base_damage
    value: 30.0

source:
  url: https://wiki.warframe.com/w/Furis_Incarnon_Genesis
