id: laetum_marksmans_hand
name: Marksman's Hand
weapon: laetum
tier: 2
description: "-40% Recoil."
selection: choose_one

effects:
  # NOT LOADED: `indirect` has no arm in `evolutions_data::effect()`, so it
  # resolves to `EvoEffect::Inert` — the UI renders "indirect (no single-target
  # DPS effect)" and the engine takes nothing (data/README.md). `stat` is unread
  # too; it is the column a handling model would consume.
  - kind: indirect          # handling only - no single-target DPS payload
    stat: recoil
    value: -0.40

source:
  url: https://wiki.warframe.com/w/Laetum
