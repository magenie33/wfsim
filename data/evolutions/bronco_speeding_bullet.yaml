id: bronco_speeding_bullet
name: Speeding Bullet
weapon: bronco
tier: 2
description: "Increase Base Damage by +36. With Sprint Speed 1.2 or Higher: +60% Projectile Speed."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Damage by +36"
  - kind: flat_base_damage
    value: 36.0
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "With Sprint Speed 1.2 or Higher: +60% Projectile Speed"
  - kind: unmodelled_with_sprint_speed_or_higher_projectile_speed

source:
  url: https://wiki.warframe.com/w/Bronco_Incarnon_Genesis
