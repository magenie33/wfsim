id: praedos_shockwave_synergy
name: Shockwave Synergy
weapon: praedos
tier: 3
description: "For each enemy hit by Slam radius, gain 4 Combo Count."
# THE ORDINARY SLAM PAYS IT AND A HEAVY SLAM DOES NOT --
# so it is the trailing slam of a combo that earns, and the heavy-slam mode
# earns nothing. That is the general rule rather than a carve-out: a swing that
# SPENDS the counter adds nothing to it, and the engine reads the same flag here
# that every other combo earner reads.
selection: choose_one

effects:
  # from: "For each enemy hit by Slam radius, gain 4 Combo Count".
  #
  # COMBO COUNT CHANCE SCALES IT rather than rolling for it: *"True Punishment
  # affects Shockwave Synergy, effectively doubling the Combo Count gain from 4
  # to 8 per enemy hit by the Slam radius"* (wiki, Praedos) — True Punishment is
  # +100% combo count chance, so the grant is `4 x (1 + chance)`.
  - kind: combo_count_on_slam_hit
    value: 4.0

source:
  url: https://wiki.warframe.com/w/Praedos
