id: vectis_lone_enforcer
name: Lone Enforcer
weapon: vectis
tier: 2
description: "Increase Base Damage by +75. +25% Multishot if no enemies are within 5m."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Damage by +75"
  - kind: flat_base_damage
    value: 75.0
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "+25% Multishot if no enemies are within 5m"
  - kind: unmodelled_multishot_if_no_enemies_are_within_m

source:
  url: https://wiki.warframe.com/w/Vectis_Incarnon_Genesis
