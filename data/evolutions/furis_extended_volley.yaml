id: furis_extended_volley
name: Extended Volley
weapon: furis
tier: 3
icon: IncarnonClipSize(xWhite).png
description: "Increase Base Magazine Capacity by +25."
# THE GENESIS IS THE FAMILY'S. One Furis Incarnon Genesis upgrades either the
# Furis or the MK1-Furis, so both weapons carry the same ladder. Where a value
# DIFFERS between them the wiki prints it as a pair, and the number below is
# this weapon's.
selection: choose_one

effects:
  # 35 -> 60 rounds on the BASE form, so magazine mods multiply the new value.
  # The loader drops this on a charge-backed form, so the Incarnon's 280-round
  # pool is untouched — that pool is charges, not a magazine.
  - kind: flat_base_magazine
    value: 25

source:
  url: https://wiki.warframe.com/w/Furis_Incarnon_Genesis
