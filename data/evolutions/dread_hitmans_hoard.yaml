id: dread_hitmans_hoard
name: Hitman's Hoard
weapon: dread
tier: 3
description: "Increase Base Ammo Capacity to 144. Does not affect Incarnon Form."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Ammo Capacity to 144"
  - kind: ammo_reserve_set
    value: 144
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "Does not affect Incarnon Form"
  - kind: unmodelled_does_not_affect_incarnon_form

source:
  url: https://wiki.warframe.com/w/Dread_Incarnon_Genesis
