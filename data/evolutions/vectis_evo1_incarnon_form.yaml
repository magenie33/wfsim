id: vectis_evo1_incarnon_form
name: Incarnon Form
weapon: vectis
tier: 1
description: "Weakpoint hits charge Incarnon Transmutation; Alt Fire transmutes. Fire slowing projectiles that explode on headshot."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: fixed

effects:
  # LOADED as `EvoEffect::UnlocksForm(weapon)` — the form's stats are the
  # vectis_incarnon entry's own, not perk payload.
  - kind: unlocks_weapon
    weapon: vectis_incarnon

source:
  url: https://wiki.warframe.com/w/Vectis_Incarnon_Genesis
