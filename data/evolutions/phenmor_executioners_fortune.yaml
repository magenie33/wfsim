id: phenmor_executioners_fortune
name: Executioner's Fortune
weapon: phenmor
tier: 3
icon: ChanceToReplenishMagOnHeadshot(xWhite).png
description: "On Headshot kill: 20% chance to instant Reload."
# A NATURAL Incarnon: the Phenmor carries its Genesis innately, so this perk
# belongs to the weapon rather than to an adapter shared by a family. Five
# tiers, thirteen perks - see docs/INCARNON.md for why the naturals are shaped
# differently from the 31 adapters.
selection: choose_one

effects:
  # A KILL IS REQUIRED HERE and is not on the Furis pair, which share this
  # kind's name and nothing else about its rate: `condition: headshot_kill` is
  # the whole difference and the loader reads it rather than assuming either
  # way. Against one target that has to be worn down it is a far rarer trigger
  # than the Furis's any-headshot.
  #
  # It fills the magazine outright — no reload played and no time spent — which
  # is why it is a magazine effect and not a reload-speed one. It draws from the
  # reserve like every other refill here, and it does NOT count as a reload
  # (`r.reloads` untouched), so nothing keyed on reloads is armed by it. That
  # last part is a reading rather than a measurement: DE's text calls it a
  # reload.
  #
  # AND IT DOES NOTHING IN THE INCARNON FORM. VERBATIM (wiki): "Does not affect
  # Incarnon Form" — and the reason is the same sentence read carefully: what it
  # refills is a MAGAZINE, and the Incarnon form has max CHARGES instead (owner,
  # 2026-08-10). Those are different pools — the gauge is converted from
  # weakpoint hits and sits outside the ammo economy — so there is no reload
  # there to make instant. The sim does not even roll it in that form.
  - kind: instant_reload_on_headshot
    chance: 0.20
    condition: headshot_kill

source:
  url: https://wiki.warframe.com/w/Phenmor
