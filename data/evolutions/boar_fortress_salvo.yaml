id: boar_fortress_salvo
name: Fortress Salvo
weapon: boar
tier: 2
icon: PunchThroughWithArmorAboveX(xWhite).png
description: "Increase Base Damage by +16.
With Armor Over 450: +4 Punch Through"
# THE GENESIS IS THE FAMILY'S. One Boar Incarnon Genesis upgrades either the
# Boar or the Boar Prime, and the wiki's evolution table proves the two get the
# SAME evolutions: every row spans both weapon columns with a dash
# (`colspan="2" ... | -`), which is that table's way of saying "no per-variant
# difference". So the value below is THIS weapon's, which happens to be the same
# number the other one carries — and if DE ever splits them, the table grows a
# real cell and the two files diverge there.
#
# NO OTHER VARIANT'S NUMBERS LIVE IN THIS FILE (owner, 2026-08-12: "我要求只填写
# 自己的"). A file that states two weapons' values is a file where the reader has
# to work out which one they are looking at, every time.
selection: choose_one

effects:
  - kind: flat_base_damage
    value: 16.0
  # NOT LOADED: no `punch_through` arm in the evolutions loader, and the
  # condition is on the TENNO's armour (a Warframe stat the arena carries but
  # this loader never consults). Punch through decides nothing in a
  # single-target arena either way.
  - kind: punch_through_bonus
    value: 4.0
    condition: tenno_armor_over_450

source:
  url: https://wiki.warframe.com/w/Boar_Incarnon_Genesis
