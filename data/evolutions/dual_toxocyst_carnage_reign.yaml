id: dual_toxocyst_carnage_reign
name: Carnage Reign
weapon: dual_toxocyst
tier: 2
icon: DamagePerStatusOnEnemyWithEnergyPool(xWhite).png   # wiki File: name (Dual_Toxocyst_Incarnon_Genesis)
description: "Increase Base Damage by +60.\n+33% Direct Damage per Status Type affecting the target."
selection: choose_one

# THIS perk's +60 base damage does not feed the GunCO term. The CO catalog row
# is explicit about which perk it means:
#   Dual Toxocyst | Incarnon Mode | Projectile
#     Attack Unmodded Damage ......... 75 or 135 (with Evolution II Perk 1)
#     Actual CO Bonus at +100% ....... 75
#     Relative to Base Damage ........ 100% or 56%
#     Notes .......................... CO-bonus does not use base damage
#                                      increase Evolution
# i.e. a +100% CO adds 75, never 135.
#
# AND SO DOES THE SIBLING'S. The catalog "lists only discrepant attacks", so
# Fevered Frenzy's +50 was read as feeding CO in full and this comment said so
# — until it was measured and does not.
# On this weapon the exclusion is the WEAPON's rather than this perk's: both
# tier-2 options compute CO on the unevolved 75. The flag stays per PERK, which
# is still the granularity the catalog names and the granularity the Despair
# needs (one of its two is excluded and the other is not) — it is simply set on
# both of this weapon's.
#
# The catalog is AUTHORITATIVE and "not listed" is a positive statement: that
# attack behaves normally, exactly as the mods describe. Its exceptions are
# INDIVIDUAL quirks in DE's code rather than a rule — Lato Vandal has a row and
# Lato Prime does not, same family and same Genesis, which is what a per-entry
# slip looks like and what no general law could produce. That is precisely why
# this flag is per PERK. See MECHANICS §6.
co_base_excludes_this_evolution: true

effects:
  - kind: flat_base_damage
    # Adds to the BASE TOTAL, distributed PRO-RATA across the existing
    # damage vector (75 -> 135 keeps the 10/80/10 split = vector x1.8),
    # BEFORE mods - and therefore inside ModdedBase (DoT ticks scale too).      # adds to BASE damage before mods (the
    value: 60                   # Incarnon "Increase Base Damage" layer)
  # +33% DIRECT damage per status TYPE on the target — and it is CONDITIONAL,
  # not broken.
  #
  # IT WAS FILED AS A LIVE BUG, on two measurements that both said it pays
  # nothing (MEASUREMENTS M49): with Galvanized Shot equipped the 135 panel read
  # 225 at one status type and 315 at two, which is `135 + 75 x 0.4 x stacks x
  # types` with no room for a 33% term; and with the GunCO mod removed
  # altogether a status-afflicted enemy took exactly the panel.
  #
  # THE MEASUREMENTS STAND AND THE CONCLUSION DOES NOT. The wiki records an
  # unlisted requirement on this clause and only this clause — "With Energy Max
  # >= 200" — which the file already carried as an unverified candidate cause,
  # recorded rather than modelled because nothing had measured the same weapon
  # on a frame above 200. It explains the measurements exactly instead of
  # contradicting them: the neutral Tenno this repo ships has 150 max energy, so
  # every run that found nothing was made UNDER the threshold.
  #
  # The difference to a reader is the whole point. `live_bug` says "do not pick
  # this perk for that half, and a hotfix will change it"; a gate says "it pays
  # on the right frame", which is a build decision rather than a warning. Saying
  # the first when the second is true costs a player the perk.
  #
  # ONLY THIS CARD. The Lato family's Carnage Reign shares the NAME and is a
  # different perk (+40% per status type, no base-damage clause, no gate), so
  # nothing here generalises to it — the same per-entry rule the CO catalog is
  # read under.
  - kind: gated_by_tenno
    condition: "energy_max >= 200"
    grant: condition_overload
    value: 0.33
    # THE CO SEMANTICS ARE NOT ON THIS ENTRY and never were: the gate feeds the
    # same `co` term `innate_co_per_type` does (`loadout.rs`), so `co_behavior`
    # still comes from the WEAPON file and the base exclusion from
    # `co_base_fraction`. Kept written down as the spec:
    #
    #   Adding: final = [135 x damage-bonus chain] + [75 x 0.33 x status_types]
    #
    # The CO term uses the UNBOOSTED base 75 — this perk's own +60 is excluded
    # from its own CO chunk ("CO-bonus does not use base damage increase
    # Evolution") — ignores final multipliers, and is additive with every other
    # CO source. Direct damage only: ricochets included, AoE excluded.

source:
  url: https://wiki.warframe.com/w/Dual_Toxocyst_Incarnon_Genesis
