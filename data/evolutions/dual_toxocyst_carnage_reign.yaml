id: dual_toxocyst_carnage_reign
name: Carnage Reign
weapon: dual_toxocyst
tier: 2
icon: DamagePerStatusOnEnemyWithEnergyPool(xWhite).png   # wiki File: name (Dual_Toxocyst_Incarnon_Genesis)
description: "Increase Base Damage by +60.\n+33% Direct Damage per Status Type affecting the target."
selection: choose_one

# THIS perk's +60 base damage does not feed the GunCO term. The CO catalog row
# is explicit about which perk it means:
#   Dual Toxocyst | Incarnon Mode | Projectile
#     Attack Unmodded Damage ......... 75 or 135 (with Evolution II Perk 1)
#     Actual CO Bonus at +100% ....... 75
#     Relative to Base Damage ........ 100% or 56%
#     Notes .......................... CO-bonus does not use base damage
#                                      increase Evolution
# i.e. a +100% CO adds 75, never 135.
#
# AND SO DOES THE SIBLING'S. The catalog "lists only discrepant attacks", so
# Fevered Frenzy's +50 was read as feeding CO in full and this comment said so
# — until it was measured and does not (owner, 2026-08-16; MEASUREMENTS M49).
# On this weapon the exclusion is the WEAPON's rather than this perk's: both
# tier-2 options compute CO on the unevolved 75. The flag stays per PERK, which
# is still the granularity the catalog names and the granularity the Despair
# needs (one of its two is excluded and the other is not) — it is simply set on
# both of this weapon's.
#
# The catalog is AUTHORITATIVE and "not listed" is a positive statement: that
# attack behaves normally, exactly as the mods describe. Its exceptions are
# INDIVIDUAL quirks in DE's code rather than a rule — Lato Vandal has a row and
# Lato Prime does not, same family and same Genesis, which is what a per-entry
# slip looks like and what no general law could produce. That is precisely why
# this flag is per PERK. See MECHANICS §6.
co_base_excludes_this_evolution: true

effects:
  - kind: flat_base_damage
    # Adds to the BASE TOTAL, distributed PRO-RATA across the existing
    # damage vector (75 -> 135 keeps the 10/80/10 split = vector x1.8),
    # BEFORE mods - and therefore inside ModdedBase (DoT ticks scale too).      # adds to BASE damage before mods (the
    value: 60                   # Incarnon "Increase Base Damage" layer)
  - kind: condition_overload    # +33% DIRECT damage per status TYPE on the
    value: 0.33                 # target (official CO-source list)
    # IT PAYS NOTHING IN GAME — MEASURED (owner, 2026-08-16; MEASUREMENTS M49),
    # and confirmed two independent ways. With Galvanized Shot equipped the 135
    # panel reads 225 at one status type and 315 at two, which is
    # `135 + 75 x 0.4 x stacks x types` with no room for a 33% term (it would
    # add 25 and 50). And with the GunCO mod REMOVED entirely, a status-afflicted
    # enemy takes exactly the panel — this clause is the only CO source left on
    # the build and it adds nothing at all.
    #
    # A LIVE BUG rather than a gap: DE's own CO-source list carries this perk,
    # the card states the clause, and a hotfix restores it. The distinction
    # matters to a reader — an `Inert` line says wait for us, this one says do
    # not pick the perk for that half.
    #
    # A CANDIDATE CAUSE, unverified: the wiki notes an unlisted requirement of
    # ENERGY MAX >= 200 on this clause. If that is real and the measuring frame
    # was under it, the perk is conditional rather than broken and the engine
    # should learn the gate instead. Recorded here rather than modelled because
    # nothing has measured the same weapon on a frame above 200.
    live_bug: >-
      the +33% per Status Type pays nothing, measured with the GunCO mod both
      equipped and removed; the wiki notes an unlisted energy-max >= 200
      requirement that may be the cause and is unverified
    applies_to: direct_damage_only   # ricochets included; AoE excluded
    # Official CO catalog entry for DT Incarnon Mode: behavior "Adding" -
    #   final = [135 x damage-bonus chain] + [75 x 0.33 x status_types]
    # The CO term uses the UNBOOSTED base 75 (this perk's own +60 is
    # excluded from its own CO chunk: "CO-bonus does not use base damage
    # increase Evolution"), and ignores final multipliers (falloff etc.).
    # Additive with all other CO sources (Galvanized Shot etc.).
    # NOT LOADED, all four of the keys above and below: `evolutions_data` reads
    # only `kind` and `value` from a `condition_overload` entry. `applies_to`,
    # `condition`, `co_behavior` and `co_base_excludes_evolution_damage` are the
    # written spec — the engine gets the same three facts from elsewhere and
    # they are pinned there, not here: `co_behavior` from the WEAPON file
    # (dual_toxocyst.yaml), and the base-exclusion from `co_base_fraction`,
    # which `apply` computes as original/evolved total (data/README.md).
    co_behavior: adding
    co_base_excludes_evolution_damage: true

source:
  url: https://wiki.warframe.com/w/Dual_Toxocyst_Incarnon_Genesis
