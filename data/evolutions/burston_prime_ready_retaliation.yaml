tier: 3
icon: IncarnonReloadSpeed(xWhite).png
description: "On Reload From Empty: +100% Reload Speed."
# see notes: genesis_family_s_burston
selection: choose_one

effects:
  # NOT LOADED: `evolutions_data::effect()` has no `reload_speed_bonus` arm
  # (the MODS loader has one — different loader, different vocabulary), so this
  # resolves to `EvoEffect::Inert`; `condition` is unread there too.
  #
  # DE has fixed this perk twice on this weapon specifically — 37.0.9 ("applying
  # its buff on Burston anytime you reload, instead of only when reloading from
  # empty") and 38.5.3 ("not functioning consistently") — so whoever models it
  # should MEASURE the current behaviour rather than trust the card.
  - kind: reload_speed_bonus
    value: 1.00
    condition: reload_from_empty

source:
