id: felarx_mounting_momentum
name: Mounting Momentum
weapon: felarx
tier: 3
description: "Reload increases Fire Rate by +10% per shell. Stacks up to 99x. Resets on reload."
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # +10% FIRE RATE PER SHELL LOADED, and the stacks are not on a clock.
  #
  # DE's card says "Resets on reload" and its own notes say holstering resets
  # them while RELOADING BUILDS them, with a worked example (+4 stacks for four
  # spent shells). The notes win: they describe a counter you can only build by
  # reloading, which the card's reading would make unbuildable.
  #
  # WHAT ENDS IT is an EMPTY MAGAZINE, immediately — not the reload that follows. That is what the perk IS: firing a magazine dry and
  # reloading it earns one magazine's worth and loses it again on the last
  # shot, so the 99-stack cap belongs to a player who tops up a magazine that
  # never empties. This sim
  # fires dry, so it earns a magazine's worth.
  #
  # The count is one per SHELL, so it follows the magazine — and a magazine mod
  # therefore buys stacks and pays for them in the by-round reload it lengthens
  # (`reload_style: by_round` on the weapon). That trade is the perk.
  # IT IS THE BASE FORM'S TOO, and it was worth nothing there until 2026-08-10. Two bugs sat on top of each other:
  #
  #   · the ReloadComplete trigger was nested INSIDE the tendril/refill block,
  #     so it only fired on a weapon carrying one of those — which the Felarx
  #     does not. Base mode earned zero stacks, ever;
  #   · and the grant was a number resolved once at the panel, from the OUTER
  #     form's magazine. In a cycle the outer form is the Incarnon one, so a
  #     6-shell base reload granted 60 stacks — +600% fire rate, measured at 61.
  #
  # Both are gone: every reload pays for the shells its draw ACTUALLY loaded, at
  # the site that loaded them. That is one rule for the plain reload, the
  # cycle's base-form reload and the Incarnon route alike, and a dry reserve
  # loads fewer shells and pays fewer stacks with nothing written down to say so.
  #
  # WHAT IT IS WORTH on the Felarx, measured 2026-08-10: +17.7% base (6 stacks,
  # one magazine's worth, cleared every time the magazine empties) and +52.4%
  # in the cycle, where the transmute's own shells push it to 8.
  #
  # ✅ THE BONUS APPLIES IN THE INCARNON FORM.
  # Recorded because it is not the perk's own wording — it follows from two
  # other rules and it carries most of the weapon's score, so it was asked
  # rather than assumed.
  #
  # The stacks are earned by reloading the BASE form and nothing takes them but
  # an empty base magazine, which cannot happen while transformed: swapping
  # "will fully reload the normal form's magazine" (wiki). So they are still up
  # during the Incarnon dump, and they speed it up.
  #
  # THAT IS WHERE THE WHOLE +52% COMES FROM. A full gauge is 60 rounds at 1.5/s
  # = 40 s of Incarnon fire against ~8 s of base-form fire and animations, so
  # the cycle is 80% Incarnon time and the only term the perk moves is that
  # dump: 40 s becomes 23.5 s. Everything else in the cycle — 8 base shots to
  # fill a 30-hit gauge at 4 pellets, one base reload, the 3.7 s transmute, the
  # 1.0 s revert — is unchanged by it.
  - kind: stacking_fire_rate_per_shell_reloaded
    per_stack: 0.10
    max_stacks: 99
  # THE INCARNON ROUTE, MODELLED 2026-08-09 — and it was never a second rule.
  # Entering the
  # form IS A RELOAD: the transmute animation is the weapon's reload time, which
  # is how you can tell, and the whole reload runs — one
  # shell as you go in, the rest as you come out. So the only thing that ever
  # grants a stack is a shell being loaded, and every "special case" falls out
  # of that:
  #
  #   · at 10/13 the cycle is +1 then +2, because three shells were missing;
  #   · at 13/13 it is nothing at all, because none were;
  #   · the magazine comes back full without a separate reload, which is why the
  #     route gains stacks without ever emptying.
  #
  # The +1 was never a fee for transforming — it is the first shell of the
  # reload, and it looked like a rule of its own until the reload was named.
  #
  # This sim transmutes on a gauge rather than on a plan, so it earns the route
  # the same way: at the transmute the base magazine is refilled from reserve,
  # the shells that draw ACTUALLY loads are counted, one is granted going in and
  # the rest coming out. A dry reserve loads nothing and grants nothing, with no
  # rule of its own to say so.
  #
  # AND THE 99-STACK CAP IS NOT CHASED. Reaching it needs a magazine that never
  # empties, which is a play PATTERN — a firing-and-reloading policy, not a
  # property of this perk — and inventing a special path to it would be putting
  # a thumb on the scale for one card. DECIDED against, twice. The ordinary loop earns a magazine's worth and
  # that is what the number reports; the edge case is not a target.

source:
