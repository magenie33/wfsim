id: felarx_mounting_momentum
name: Mounting Momentum
weapon: felarx
tier: 3
description: "Reload increases Fire Rate by +10% per shell. Stacks up to 99x. Resets on reload."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # +10% FIRE RATE PER SHELL LOADED, and the stacks are not on a clock.
  #
  # DE's card says "Resets on reload" and its own notes say holstering resets
  # them while RELOADING BUILDS them, with a worked example (+4 stacks for four
  # spent shells). The notes win: they describe a counter you can only build by
  # reloading, which the card's reading would make unbuildable.
  #
  # WHAT ENDS IT is an EMPTY MAGAZINE, immediately — not the reload that follows
  # (owner, 2026-08-08: "不可能 0/13，这时候会立刻清除增益（而不是换弹）"). That
  # is what the perk IS: firing a magazine dry and reloading it earns one
  # magazine's worth and loses it again on the last shot, so the 99-stack cap
  # belongs to a player who tops up a magazine that never empties. This sim
  # fires dry, so it earns a magazine's worth.
  #
  # The count is one per SHELL, so it follows the magazine — and a magazine mod
  # therefore buys stacks and pays for them in the by-round reload it lengthens
  # (`reload_style: by_round` on the weapon). That trade is the perk.
  - kind: stacking_fire_rate_per_shell_reloaded
    per_stack: 0.10
    max_stacks: 99
  # NOT MODELLED — THE INCARNON ROUTE, spelled out by the owner (2026-08-08).
  # A cycle grants exactly the shells that were MISSING when the form was
  # entered, split 1 on the way in and the rest on the way out: enter a 13-round
  # magazine at 10/13 and it is +1 then +2. Enter it FULL and it is nothing at
  # all — the +1 is the first of the missing, not a fee for transforming. And
  # the magazine comes back full without a reload, which is what makes the route
  # worth taking: it is the only way to gain stacks without ever emptying.
  #
  # This sim transmutes on a gauge rather than on a plan, so it earns the reload
  # route only.
  #
  # AND THE 99-STACK CAP IS NOT CHASED. Reaching it needs a magazine that never
  # empties, which is a play PATTERN — a firing-and-reloading policy, not a
  # property of this perk — and inventing a special path to it would be putting
  # a thumb on the scale for one card. DECIDED against (owner, 2026-08-08:
  # "不要特殊化处理 99 层那个了，不现实，我们流程还是正常的"). The ordinary loop
  # earns a magazine's worth, and that is what the number reports.
  - kind: unmodelled_incarnon_form_grants_stacks_on_entry_and_exit

source:
  url: https://wiki.warframe.com/w/Felarx
