id: felarx_racking_wrath
name: Racking Wrath
weapon: felarx
tier: 4
description: "+20% Status Chance -10% Critical Chance"
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # Same layer and same division as Brutal Edge — "Bonuses are added after mods
  # as a flat value", and "Status Chance bonus is divided by the base multishot
  # of 4, for only +5% Status Chance per pellet". 20% / 4.
  - kind: flat_status_chance_after_mods
    value: 0.05
  # The crit LOSS is not divided, and it is not inert either: it was loaded as
  # an unparsed clause, so the perk read as pure upside.
  - kind: flat_crit_chance_after_mods
    value: -0.10

source:
  url: https://wiki.warframe.com/w/Felarx
