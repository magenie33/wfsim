id: lex_prime_evo1_incarnon_form
name: Incarnon Form
weapon: lex_prime
tier: 1
description: "Weakpoint hits charge Incarnon Transmutation; Alt Fire transmutes. Fires a wide projectile dealing Radiation damage with guaranteed Impact procs and 1.4 m Punch Through."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: fixed

effects:
  # LOADED as `EvoEffect::UnlocksForm(weapon)` — the form's stats are the
  # lex_prime_incarnon entry's own, not perk payload.
  - kind: unlocks_weapon
    weapon: lex_prime_incarnon

source:
  url: https://wiki.warframe.com/w/Lex_Incarnon_Genesis
