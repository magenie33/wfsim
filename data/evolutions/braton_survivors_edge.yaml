id: braton_survivors_edge
name: Survivor's Edge
weapon: braton
tier: 4
icon: XCritChanceYStatChance(xWhite).png
description: "Increase Base Critical Chance by +10%. Increase Base Status Chance by +12%."
# THE GENESIS IS THE FAMILY'S. One Braton Incarnon Genesis upgrades any of the
# four Bratons, so all four carry the same ladder of nine perks. Where a value
# DIFFERS between them the wiki's table prints a per-variant column, and the
# number below is this weapon's.
selection: choose_one

effects:
  # PERCENTAGE POINTS on the BASE, the layer mods multiply.
  # THE TWO WIKIS SWAP THIS VALUE between the Braton and the MK1-Braton: the EN
  # table reads Braton +10% / MK1 +12% crit chance, the CN page reads Braton
  # +12% / MK1 +10%. They agree on everything else in the row, and on all 34
  # other values this family carries. Kept at the EN numbers because that is the
  # page the effect text was transcribed from; recorded because a swap is the
  # one kind of disagreement that looks like agreement if you only check the
  # multiset.
  - kind: flat_base_crit_chance
    value: 0.1
  - kind: flat_base_status_chance
    value: 0.12

source:
  url: https://wiki.warframe.com/w/Braton_Incarnon_Genesis
