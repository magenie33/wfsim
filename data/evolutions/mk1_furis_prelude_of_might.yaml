id: mk1_furis_prelude_of_might
name: Prelude of Might
weapon: mk1_furis
tier: 4
icon: CritDamageWhenCritChanceIsBelowX(xWhite).png
description: "With Critical Chance below 40%: Increase Critical Damage Multiplier by +3x."
# THE GENESIS IS THE FAMILY'S. One Furis Incarnon Genesis upgrades either the
# Furis or the MK1-Furis, so both weapons carry the same ladder. Where a value
# DIFFERS between them the wiki prints it as a pair, and the number below is
# this weapon's.
selection: choose_one

effects:
  # MODELLED (2026-08-06). The condition is on the crit chance THE HIT HAS,
  # which no `condition:` here can express — every one of those asks about the
  # Tenno or the target, never about the panel the mods just produced — so it is
  # its own effect kind, granted late in `resolve` against the same expression
  # the panel publishes and re-checked per shot by the sim. The
  # payload is large (+3x on a 3.4x base) and so is its cost, since taking it
  # means holding crit chance under 40%; the form's own 26% base already sits
  # close to that line, so the two interact rather than stack.
  #
  #
  # AND THE LINE IS CROSSED BY THE WEAPON'S OWN OTHER HALF (2026-08-11). The
  # wiki's note on this row — "Condition is affected by the critical chance
  # increase effect of Puncture status" — is not a footnote on this weapon, it
  # is the build. Puncture's Weakened is +5% flat crit chance received per
  # stack to 25%, the BASE form is 70% Puncture (14 of 20), and 26% + 3 stacks
  # = 41%: the form that generates the stacks turns the perk off in the form
  # that was carrying it. It comes back as the stacks expire, which is why the
  # check has to be live rather than a second static branch — and the base form
  # itself, at 5%, never crosses the line at all.
  #
  # NOT `flat_base_crit_multiplier`: that arm ignores `condition:`, so spelling
  # it that way would grant +3x to every build — which is exactly what it did
  # before this kind existed.
  # HOW THIS DIFFERS FROM THE SICARUS'S WISEMAN'S REGARD — two perks that both
  # say "Critical Chance" and read two different numbers (owner, 2026-08-13).
  #
  # THIS one is read AT THE MOMENT OF THE HIT, so a crit source that lives on
  # the TARGET counts: the row's note names Puncture outright ("Condition is
  # affected by the critical chance increase effect of Puncture status"), and
  # Puncture is the only source that can raise your crit chance without your
  # panel ever moving. Wiseman's Regard is the opposite — resolved once off the
  # panel, and its own row names King's Gambit and Cascadia Accuracy as things
  # it does NOT see.
  #
  # WEAK-POINT CRIT IS THE OPEN HALF. This engine reads the condition per SHOT,
  # not per pellet, so Pistol Acuity / Cascadia Accuracy / King's Gambit do not
  # move it — the argument being that those are properties of where a projectile
  # landed rather than of the weapon the condition asks about. The wiki's note
  # names only Puncture and settles nothing either way; the owner reads it as
  # counting (2026-08-13) and is measuring in game. If it counts, the check
  # moves into the pellet loop beside the weak-point bucket.
  #
  # AND IT CUTS THE OTHER WAY. Wiseman's Regard pays MORE the more crit you
  # have; this one is LOST the moment you cross the line. Same reading, opposite
  # sign, so the two must not be reasoned about together.
  #
  - kind: crit_multiplier_below_crit_chance
    value: 3.0
    below_crit_chance: 0.40

source:
  url: https://wiki.warframe.com/w/Furis_Incarnon_Genesis
