id: cestra_fortress_salvo
name: Fortress Salvo
weapon: cestra
tier: 2
description: "Increase Base Damage by +10. With Armor Over 450: +80% Multishot."
# see notes: genesis_family_s_adapter_3
#
#   Cestra||Normal Attack||…||26 or 36 (with Evolution II)||26||100% or 72.2%||Adding||CO-bonus does not use base damage increase Evolution
#
# Which perk: the row names the TIER, and both tier-2 options add the same +10.
co_base_excludes_this_evolution: true
selection: choose_one

effects:
  # from: "Increase Base Damage by +10"
  - kind: flat_base_damage
    value: 10.0
  # A QUESTION ABOUT THE PLAYER, read rather than ignored. The neutral Tenno
  # carries no armor at all, so this pays NOTHING until someone
  # says which frame is carrying the gun — the same rule the Latron family's
  # Swift Punishment follows, and the same `condition:` spelling.
  # It joins the multishot BUCKET, so it is diluted by Barrel Diffusion the
  # same way a mod's percentage is.
  - kind: gated_by_tenno
    condition: "armor > 450"
    grant: multishot
    value: 0.8

source:
  url: https://wiki.warframe.com/w/Cestra_Incarnon_Genesis
