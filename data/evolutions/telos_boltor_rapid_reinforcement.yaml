id: telos_boltor_rapid_reinforcement
name: Rapid Reinforcement
weapon: telos_boltor
tier: 3
icon: IncarnonReloadSpeed(xWhite).png
description: "+60% Reload Speed."
# THE GENESIS IS THE FAMILY'S. One Boltor Incarnon Genesis upgrades any of the
# three Boltors, so all three carry the same ladder of nine perks. Where a value
# DIFFERS between them the wiki's table prints a per-variant column, and the
# number below is this weapon's.
selection: choose_one

effects:
  # THE MOST COMMON PERK IN THE WHOLE INCARNON SET — docs/INCARNON.md counts it
  # on 14 guns, more than any other name — and this is the first of them here.
  #
  # NOT LOADED: `evolutions_data::effect()` has no `reload_speed_bonus` arm (the
  # MODS loader has one — different loader, different vocabulary). It would be
  # real: this arena reloads, and a 2.4-2.6 s reload is a large share of a
  # 60-round magazine's cycle.
  - kind: reload_speed_bonus
    value: 0.60

source:
  url: https://wiki.warframe.com/w/Boltor_Incarnon_Genesis
