id: soma_prime_fresh_havoc
name: Fresh Havoc
weapon: soma_prime
tier: 4
description: "On Reload From Empty: Increase Base Damage by +6. Stacks up to 2x."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # VERBATIM (Soma_Incarnon_Genesis, EVO4, the row's effect cell and its notes):
  #   *On Reload From Empty: Increase Base Damage by '''+6'''. Stacks up to '''2x'''.
  #   *Buff lasts permanently throughout the mission but is lost on death.
  #   *Switching to Incarnon Form from empty will also trigger the buff.
  #   *Damage increase is applied per pellet, giving Incarnon Form a total
  #    maximum base damage increase of '''+96.'''
  # The variant cell is one `colspan="2" ... | -`, so both Somas take these
  # numbers. The 2024 changelog on the same page confirms them: "Increased the
  # damage from +4 to +6 on reload from empty. Changed stacks from 3x to 2x."
  # A STACKING BUFF WITH NO CLOCK, and the card says how long it really lasts:
  # "Buff lasts permanently throughout the mission but is lost on death." So
  # nothing takes the pile — not a reload, not an empty magazine — and `duration`
  # is left at NO_TIMEOUT. Dying is not something this arena does.
  #
  # "+6" IS A FLAT BASE ADD, not a share of the base-damage bucket, so it is not
  # diluted by Serration — `base_damage:` rather than `base_damage_bonus:`.
  # The card's own arithmetic confirms the reading and the pellet rule at once:
  # "Damage increase is applied per pellet, giving Incarnon Form a total maximum
  # base damage increase of +96", which is 6 x 2 stacks x the 8 pellets Incarnon
  # Form throws. A base add is per pellet by construction.
  #
  # THE TRIGGER IS `reload_from_empty` RATHER THAN `reload_complete`, and on this
  # weapon the difference is real: "Switching to Incarnon Form from empty will
  # also trigger the buff" — so the transform pays it when the base magazine had
  # run out and not otherwise, where a plain reload trigger would pay every
  # cycle. See BuffTrigger::ReloadFromEmpty.
  - kind: stacking_buff
    per_stack:
      base_damage: 6.0
    max_stacks: 2
    trigger: reload_from_empty

source:
  url: https://wiki.warframe.com/w/Soma_Incarnon_Genesis
