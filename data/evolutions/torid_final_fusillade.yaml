id: torid_final_fusillade
name: Final Fusillade
weapon: torid
tier: 2
icon: DamageXMultishotOnLastShotInMag(xWhite).png
description: "Increase Base Damage by +51.\n+3 Multishot on last shot in magazine."
selection: choose_one

effects:
  # +51 on a 140 base is a big pro-rata scale-up, and it lowers the CO base
  # fraction the same way Ripper Rounds does on the Dual Toxocyst (the GunCO
  # base excludes evolution flat damage).
  - kind: flat_base_damage
    value: 51.0
  # A FLAT +3 on the multishot stat, gated on the shot being the last round of
  # the magazine. On the base form's 5-round magazine that is one shot in five,
  # worth roughly +60% average multishot — not a rounding error.
  #
  # BASE FORM ONLY (user, 2026-07-30): it does not fire in Incarnon Form. That
  # form's magazine is the charge pool (170 rounds, "not affected by mods") fed
  # by the gauge rather than a reloaded magazine, so "last shot in magazine"
  # has nothing to gate on. The engine reads the gate off the form's own
  # `incarnon` marker, not off the weapon id.
  - kind: multishot_on_last_round
    value: 3.0
    # FLAT, on top of everything. The card is "+3 Multishot", without the
    # "Base" the Burston's carries and without the note that follows it — so
    # mods do not multiply this one. Stated rather than defaulted: the two
    # spellings are two mechanics, and a yaml that leaves it out loads Inert.
    base: false

source:
  url: https://wiki.warframe.com/w/Torid_Incarnon_Genesis
