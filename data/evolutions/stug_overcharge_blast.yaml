id: stug_overcharge_blast
name: Overcharge Blast
weapon: stug
tier: 2
description: "Increase Base Damage by +300. With Energy Max above 700: +50% Blast Radius."
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # from: "Increase Base Damage by +300"
  - kind: flat_base_damage
    value: 300.0
  # AN EDGE, NOT A GAP. A bigger blast RADIUS buys a second body inside it, and
  # the arena has one target that every blob already reaches — so this pays
  # exactly zero here and will until the sim is spatial (UNMODELLED.md §1, the
  # same class Firestorm and every punch-through perk sit in).
  #
  # The energy condition is not the reason and is not modelled either way: even
  # at the required Energy Max the clause grants nothing measurable in a
  # one-target fight, so declaring the radius is the honest statement and the
  # condition would be a second sentence about a payout of zero.
  # see notes: one_target_is_not_an_edge
  # from: "With Energy Max above 700: +50% Blast Radius"
  - kind: unmodelled_blast_radius_gated_on_energy_max

source:
  url: https://wiki.warframe.com/w/Stug_Incarnon_Genesis
