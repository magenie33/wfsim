id: stug_overcharge_blast
name: Overcharge Blast
weapon: stug
tier: 2
description: "Increase Base Damage by +300. With Energy Max above 700: +50% Blast Radius."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Damage by +300"
  - kind: flat_base_damage
    value: 300.0
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "With Energy Max above 700: +50% Blast Radius"
  - kind: unmodelled_with_energy_max_above_blast_radius

source:
  url: https://wiki.warframe.com/w/Stug_Incarnon_Genesis
