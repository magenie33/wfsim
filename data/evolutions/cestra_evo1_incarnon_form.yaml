id: cestra_evo1_incarnon_form
name: Incarnon Form
weapon: cestra
tier: 1
description: "Weakpoint hits charge Incarnon Transmutation; Alt Fire transmutes. Shots gain an increasing Critical Chance bonus while the trigger is held, up to +200%."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: fixed

effects:
  # LOADED as `EvoEffect::UnlocksForm(weapon)` — the form's stats are the
  # cestra_incarnon entry's own, not perk payload.
  - kind: unlocks_weapon
    weapon: cestra_incarnon

source:
  url: https://wiki.warframe.com/w/Cestra_Incarnon_Genesis
