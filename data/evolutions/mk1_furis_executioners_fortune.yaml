id: mk1_furis_executioners_fortune
name: Executioner's Fortune
weapon: mk1_furis
tier: 3
icon: ChanceToReplenishMagOnHeadshot(xWhite).png
description: "On Headshot: 10% chance for Instant Reload."
# THE GENESIS IS THE FAMILY'S. One Furis Incarnon Genesis upgrades either the
# Furis or the MK1-Furis, so both weapons carry the same ladder. Where a value
# DIFFERS between them the wiki prints it as a pair, and the number below is
# this weapon's.
selection: choose_one

effects:
  # ANY headshot pays here — no kill needed, unlike the Phenmor's copy of this
  # kind. Same numbers and same reading as furis_executioners_fortune.yaml: it
  # fills the magazine outright, draws from the reserve, and does not count as
  # a reload.
  - kind: instant_reload_on_headshot
    chance: 0.10

source:
  url: https://wiki.warframe.com/w/Furis_Incarnon_Genesis
