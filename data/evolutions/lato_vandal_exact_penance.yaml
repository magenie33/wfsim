id: lato_vandal_exact_penance
name: Exact Penance
weapon: lato_vandal
tier: 3
description: "On Kill: 50% chance for Instant Reload."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
# "The bonus does not affect the Incarnon form" (the row's second note).
base_form_only: true
selection: choose_one

effects:
  # VERBATIM (Lato_Incarnon_Genesis, the row's effect cell and its notes):
  #   *On Kill: '''50%''' chance for Instant Reload.
  #   *Kills from status effects can also trigger the effect.
  #   *The bonus does not affect the Incarnon form.
  # The variant cell is one colspan="3" dash, so all three Latos take it.
  #
  # THE FIRST NOTE IS WHY THIS IS NOT `instant_reload_on_headshot`. That effect
  # asks for a weak-point DIRECT hit and is wired to the direct-hit site; a kill
  # by a Slash DoT happens nowhere near it. So the roll is read off the kill
  # COUNTER, the same mark-and-diff `BuffTrigger::Kill` uses — a kill is a kill
  # wherever it came from.
  - kind: instant_reload_on_kill
    chance: 0.50

source:
  url: https://wiki.warframe.com/w/Lato_Incarnon_Genesis
