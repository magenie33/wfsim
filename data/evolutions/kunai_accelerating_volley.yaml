id: kunai_accelerating_volley
name: Accelerating Volley
weapon: kunai
tier: 4
description: "On Fire: +20% Fire Rate for 0.5 seconds. Stacks up to 5x."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # MODELLED as a plain stacking buff — trigger, grant, size, cap and clock,
  # all of it said in this file. "On Fire" is FIRING: the round leaving the
  # weapon, which is the same trigger the Strun's Blazing Barrel counts.
  #
  # ADDITIVE WITH FIRE-RATE MODS, and the notes cell says so: "Bonus stacks
  # additively with fire rate mods such as Gunslinger" — the bracket this grant
  # already lands in.
  #
  # HALF A SECOND is the whole character of the perk. It is a spool: the stacks
  # only stand while you keep firing, and the first pause drops the pile one
  # stack at a time on the Galvanized clock.
  #
  # The stack cap was a separate inert effect until now; it is this grant's
  # ceiling, not a mechanic of its own.
  - kind: stacking_buff
    trigger: firing
    per_stack:
      fire_rate_bonus: 0.20
    max_stacks: 5
    duration_seconds: 0.5

source:
  url: https://wiki.warframe.com/w/Kunai_Incarnon_Genesis
