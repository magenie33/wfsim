id: latron_prime_marksmans_hand
name: Marksman's Hand
weapon: latron_prime
tier: 3
icon: LessRecoil(xWhite).png
description: "-60% Weapon Recoil"
# THE GENESIS IS THE FAMILY'S. One Latron Incarnon Genesis upgrades any of the
# three Latrons, so all three carry the same ladder of nine perks. Where a value
# DIFFERS between them the wiki's table prints a per-variant column, and the
# number below is this weapon's.
selection: choose_one

effects:
  # LOADED, into the indirect bucket the handling stats share — so the number
  # reaches the panel rather than vanishing (user, 2026-08-03).
  # It changes no shot: recoil is spatial and the arena has no geometry, so
  # every round lands here regardless.
  - kind: recoil_reduction
    value: 0.60

source:
  url: https://wiki.warframe.com/w/Latron_Incarnon_Genesis
