id: dual_toxocyst_neurotoxin
name: Neurotoxin
weapon: dual_toxocyst
tier: 4
icon: AdditionalViralDamageInFrenziedState(xWhite).png   # wiki File: name (Dual_Toxocyst_Incarnon_Genesis)
description: "On Headshot: +70% Toxin for 3s."
selection: choose_one
currently_broken: true          # wiki: "Currently does not work"

effects:
  # A "timed buff" is a STACKING buff with ONE stack —
  # `stacking_buff` already carries trigger + per_stack + max_stacks +
  # duration, so there is no second vocabulary for it.
  #
  # The PAYLOAD is what the engine cannot take: a live per-type damage
  # multiplier is a mechanic the sim does not have (the damage vector is baked
  # at resolve time), so the loader records it as inert and names the payload.
  # Adding the mechanic is a NEW MECHANIC, and AGENTS requires an in-game
  # measurement for one — which this CANNOT have: DE's wiki still says
  # "Currently does not work" (re-read 2026-08-03), which `currently_broken`
  # below records. Measure it after DE fixes it, then model it.
  # One stack of a stacking buff — see dual_toxocyst_ripper_rounds.yaml.
  - kind: stacking_buff
    trigger: on_headshot
    per_stack: { toxin_damage_bonus: 0.70 }
    max_stacks: 1
    duration: 3

source:
  url: https://wiki.warframe.com/w/Dual_Toxocyst_Incarnon_Genesis
