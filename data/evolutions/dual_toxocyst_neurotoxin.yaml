id: dual_toxocyst_neurotoxin
name: Neurotoxin
weapon: dual_toxocyst
tier: 4
icon: AdditionalViralDamageInFrenziedState(xWhite).png   # wiki File: name (Dual_Toxocyst_Incarnon_Genesis)
description: "On Headshot: +70% Toxin for 3s."
selection: choose_one
currently_broken: true          # wiki: "Currently does not work"

effects:
  # LOADED AND DESCRIBED, deliberately NOT APPLIED. The loader reads the
  # trigger, the window and the modifier, so the card states the perk — but a
  # live PER-TYPE damage multiplier is a mechanic the sim does not have (the
  # damage vector is baked at resolve time), and adding one is a NEW MECHANIC.
  #
  # AGENTS: a new mechanic needs an in-game measurement, and this one CANNOT be
  # measured — DE's wiki still says "Currently does not work" (re-read
  # 2026-08-03), which is what `currently_broken` below records. Building an
  # unmeasurable damage path is exactly the faithful-looking implementation
  # that rule exists to prevent. When DE fixes the perk, measure it, then wire
  # `TimedPayload::TypeDamage` into the sim.
  - kind: timed_buff
    trigger: on_headshot
    duration_seconds: 3
    modifiers: { toxin_damage_bonus: 0.70 }

source:
  url: https://wiki.warframe.com/w/Dual_Toxocyst_Incarnon_Genesis
