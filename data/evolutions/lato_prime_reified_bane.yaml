id: lato_prime_reified_bane
name: Reified Bane
weapon: lato_prime
tier: 2
description: "Increase Base Damage by +2. On Reload from Empty Magazine: Increase Base Damage by +24."
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # from: "Increase Base Damage by +2"
  - kind: flat_base_damage
    value: 2.0
  # HELD FOR THE WHOLE RUN, and the wiki is explicit about why: "Once the damage
  # bonus has been earned, the ONLY way to lose it is to manually reload with a
  # non-empty magazine. The bonus will be retained through Incarnon
  # transformations, regardless of magazine status when transformed."
  #
  # This engine never manually reloads — it reloads when it cannot fire, which
  # is always from empty (UNMODELLED.md §"The MANUAL reload") — so the one event
  # that could take this away cannot happen here. Modelled as earned and held,
  # which is what `flat_base_damage_on_empty_reload` already does: baked into
  # the base and recorded, so the buff card can take it back off for a player
  # who wants to see the weapon without it.
  - kind: flat_base_damage_on_empty_reload
    value: 24.0

source:
  url: https://wiki.warframe.com/w/Lato_Incarnon_Genesis
