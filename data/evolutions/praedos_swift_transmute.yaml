# A CHEAPER ACTIVATION AND NOTHING ELSE, so this perk applies no effect — the
# same shape the Magistar's Genesis uses for its own activation clause. The
# weapon entries apply Incarnon Form for the whole engagement and declare that
# assumption in `unmodeled`; this card lowers what the assumption costs (3x
