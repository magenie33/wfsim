id: cestra_steadfast_grit
name: Steadfast Grit
weapon: cestra
tier: 2
description: "Increase Base Damage by +10. On Shield or Overguard break: x3 Critical Damage for 6 seconds."
# see notes: genesis_family_s_adapter_3
#
#   Cestra||Normal Attack||…||26 or 36 (with Evolution II)||26||100% or 72.2%||Adding||CO-bonus does not use base damage increase Evolution
#
# Which perk: the row names the TIER, and both tier-2 options add the same +10.
co_base_excludes_this_evolution: true
selection: choose_one

effects:
  # from: "Increase Base Damage by +10"
  - kind: flat_base_damage
    value: 10.0
  # AN EDGE, NOT A GAP — see docs/UNMODELLED.md. The card's own note is what
  # decides which: VERBATIM (Cestra_Incarnon_Genesis) —
  #   *On [[Shield]]/[[Overguard]] break: '''x3''' [[Critical Damage]] for '''6s.'''
  #   * This is on '''personal''' shield break, not breaking enemy shields.
  # It is the PLAYER's shields breaking, which takes something shooting at them.
  # Nothing does here, and no amount of work on evolutions changes that.
  - kind: out_of_scope
    clause: "On Shield/Overguard break: x3 Critical Damage for 6s"
    reason: nobody_shoots_back

source:
  url: https://wiki.warframe.com/w/Cestra_Incarnon_Genesis
