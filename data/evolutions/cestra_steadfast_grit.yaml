id: cestra_steadfast_grit
name: Steadfast Grit
weapon: cestra
tier: 2
description: "Increase Base Damage by +10. On Shield or Overguard break: x3 Critical Damage for 6 seconds."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
# THIS PERK'S FLAT DAMAGE STAYS OUT OF THE CO TERM. VERBATIM (CO catalog):
#
#   Cestra||Normal Attack||…||26 or 36 (with Evolution II)||26||100% or 72.2%||Adding||CO-bonus does not use base damage increase Evolution
#
# Which perk: the row names the TIER, and both tier-2 options add the same +10.
co_base_excludes_this_evolution: true
selection: choose_one

effects:
  # from: "Increase Base Damage by +10"
  - kind: flat_base_damage
    value: 10.0
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "On Shield or Overguard break: x3 Critical Damage for 6 seconds"
  - kind: unmodelled_on_shield_or_overguard_break_x_critical_damage_for_se

source:
  url: https://wiki.warframe.com/w/Cestra_Incarnon_Genesis
