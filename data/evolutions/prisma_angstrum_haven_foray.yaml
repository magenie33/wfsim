id: prisma_angstrum_haven_foray
name: Haven Foray
weapon: prisma_angstrum
tier: 2
description: "Increase Base Damage by +50. With Overshields: Increase Base Damage by +50."
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # VERBATIM (Angstrum_Incarnon_Genesis, EVO2, the row's effect cell):
  #   *Increase Base Damage by '''+X'''.
  #   *With Overshields: Increase Base Damage by '''+Y'''.
  #   | colspan="2" ... | -      (both Angstrums)
  #
  # from: "Increase Base Damage by +50"
  - kind: flat_base_damage
    value: 50.0
  # see notes: same_statement_gated_player
  #
  # It folds through `WeaponBase::add_flat_base_damage`, the same call the flat
  # perk above makes: the base vector scales pro-rata and the explosion takes it
  # too, so a gated +50 and a plain +50 are the same weapon.
  #
  # see notes: nothing_here_takes_overshields
  - kind: gated_by_tenno
    condition: overshields
    grant: flat_base_damage
    value: 50.0

source:
  url: https://wiki.warframe.com/w/Angstrum_Incarnon_Genesis
