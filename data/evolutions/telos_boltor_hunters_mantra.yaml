id: telos_boltor_hunters_mantra
name: Hunter's Mantra
weapon: telos_boltor
tier: 2
description: "Increase Base Damage by +4. With Channeled Ability active: Punch Through +4 and +40% Accuracy."
# see notes: genesis_family_s_boltor
selection: choose_one

effects:
  # VERBATIM (Boltor_Incarnon_Genesis, EVO2, the row's effect cell):
  #   *Increase Base Damage by '''+X'''.
  #   *With [[Channeled Abilities|Channeled Ability]] active: [[Punch Through]]
  #    '''+4''' and '''+40%''' [[Accuracy]].
  #   | X = 18 | X = 4 | X = 4
  # Columns are Boltor | Telos Boltor | Boltor Prime, from the table header.
  #
  # from: "Increase Base Damage by +4"
  - kind: flat_base_damage
    value: 4.0
  # AN EDGE, NOT A GAP — and note that the STATE is modelled now
  # (`condition: channeling`, as the Braton's Daring Reverie uses). What cannot
  # pay out is the PAYLOAD, and it would still not pay if the Warframe layer
  # were closed tomorrow, which is the test for which reason to file: punch
  # through needs a second body to reach, and this arena has one target.
  - kind: out_of_scope
    clause: "With Channeled Ability active: Punch Through +4"
    reason: one_target
  # …and the other half of the same bullet, WHICH NOW PAYS. It was
  # filed `no_distance` on the reasoning that accuracy only matters where a shot
  # can miss and nothing here spread or travelled — both halves of which stopped
  # being true when the arena got a range: a pellet draws inside this weapon's
  # own cone and +40% accuracy narrows it. Worth nothing at point blank, which
  # is where both boards are scored, and real at any distance.
  - kind: gated_by_tenno
    condition: channeling
    grant: accuracy_bonus
    value: 0.40

source:
  url: https://wiki.warframe.com/w/Boltor_Incarnon_Genesis
