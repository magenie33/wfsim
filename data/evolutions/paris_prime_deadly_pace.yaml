id: paris_prime_deadly_pace
name: Deadly Pace
weapon: paris_prime
tier: 2
description: "Increase Base Damage by +20. With Sprint Speed 1.2 or Higher: +80% Fire Rate."
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # from: "Increase Base Damage by +20"
  - kind: flat_base_damage
    value: 20.0
  # THE CONDITION IS A QUESTION ABOUT THE PLAYER, and it is read rather than
  # ignored: "With Sprint Speed 1.2 or Higher". The neutral Tenno sprints at 0.9
  # — the slowest a frame has — so this pays NOTHING until someone says which
  # frame is carrying the bow, which is the same rule the Latron family's Swift
  # Punishment follows and the same `condition:` spelling.
  #
  # ADDITIVE WITH FIRE-RATE MODS: an evolution's fire rate joins
  # `base_fire_rate * (1 + fr + evo)`, so it is diluted by Speed Trigger exactly
  # as the wiki's wording for this family says.
  - kind: fire_rate_bonus
    value: 0.80
    # see notes: card_says_1_2
    #
    # see notes: transcribed_per_row_rather
    #
    # see notes: threshold_what_makes_row
    condition: "sprint_speed >= 1.1"
    # see notes: card_wrong_effect_right
    misprint: >-
      the card prints Sprint Speed 1.2 or Higher and the effect requires 1.1 — so it pays on frames the card says it should not, and Amalgam Serration alone carries any Warframe over the line

source:
  url: https://wiki.warframe.com/w/Paris_Incarnon_Genesis
