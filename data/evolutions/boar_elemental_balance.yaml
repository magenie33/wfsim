id: boar_elemental_balance
name: Elemental Balance
weapon: boar
tier: 4
icon: HighStatus(xWhite).png
description: "Increase Base Status Chance by +12% per projectile.
Increase Base Status Chance by +96% for Incarnon Form."
# see notes: genesis_family_s_boar
#
# see notes: no_other_variant_says
selection: choose_one

effects:
  # TWO NUMBERS, ONE EVOLUTION — the wiki states them as separate lines, not as
  # a sum: what a PELLET gains and what a BEAM TICK gains are different grants,
  # and the base form fires eight of the first while the Incarnon form is one of
  # the second.
  #
  # BOTH ARE THIS WEAPON'S. Carrying the other variant's weapon status chances
  # in a parenthetical is two mistakes at once: they are not this evolution's
  # numbers at all, and they are not this file's weapon.
  # `flat_base_status_chance_by_form` picks by whether the entry carries an
  # `incarnon:` block, the same gate the magazine evolutions use.
  - kind: flat_base_status_chance_by_form
    base: 0.12
    incarnon: 0.96

source:
  url: https://wiki.warframe.com/w/Boar_Incarnon_Genesis
