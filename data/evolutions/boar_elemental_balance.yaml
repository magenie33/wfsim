id: boar_elemental_balance
name: Elemental Balance
weapon: boar
tier: 4
icon: HighStatus(xWhite).png
description: "Increase Base Status Chance by +12% per projectile.
Increase Base Status Chance by +96% for Incarnon Form."
# THE GENESIS IS THE FAMILY'S. One Boar Incarnon Genesis upgrades either the
# Boar or the Boar Prime, and the wiki's evolution table proves the two get the
# SAME evolutions: every row spans both weapon columns with a dash
# (`colspan="2" ... | -`), which is that table's way of saying "no per-variant
# difference". So the value below is THIS weapon's, which happens to be the same
# number the other one carries — and if DE ever splits them, the table grows a
# real cell and the two files diverge there.
#
# NO OTHER VARIANT'S NUMBERS LIVE IN THIS FILE. A file
# that states two weapons' values is a file where the reader has to work out
# which one they are looking at, every time.
selection: choose_one

effects:
  # TWO NUMBERS, ONE EVOLUTION — the wiki states them as separate lines, not as
  # a sum: what a PELLET gains and what a BEAM TICK gains are different grants,
  # and the base form fires eight of the first while the Incarnon form is one of
  # the second.
  #
  # BOTH ARE THIS WEAPON'S. The pair used to carry the other variant's weapon
  # status chances in a parenthetical, which was two mistakes at once: they are
  # not this evolution's numbers at all, and they are not this file's weapon.
  # `flat_base_status_chance_by_form` picks by whether the entry carries an
  # `incarnon:` block, the same gate the magazine evolutions use.
  - kind: flat_base_status_chance_by_form
    base: 0.12
    incarnon: 0.96

source:
  url: https://wiki.warframe.com/w/Boar_Incarnon_Genesis
