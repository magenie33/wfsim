id: latron_prime_swift_punishment
name: Swift Punishment
weapon: latron_prime
tier: 2
description: "Increase Base Damage by +6. With Sprint Speed 1.2 or Higher: +30% Direct Damage per Status Type affecting the target."
# THE GENESIS IS THE FAMILY'S. One Latron Incarnon Genesis upgrades any of the
# three Latrons, so all three carry the same ladder of nine perks. Where a value
# DIFFERS between them the wiki's table prints a per-variant column, and the
# number below is this weapon's.
selection: choose_one

effects:
  - kind: flat_base_damage
    value: 6.0
  # CONDITION OVERLOAD, granted by an evolution — it joins the same per-type
  # rate the Galvanized mods feed, diluted and combined by the weapon's own
  # `co_behavior` (Additive here) rather than forming a bucket of its own.
  #
  # THE SPRINT-SPEED CONDITION IS READ, and it is a question about
  # the PLAYER rather than about this weapon — so it is answered in `resolve_for`,
  # which has the Tenno, rather than in `apply`, which never sees one.
  #
  # THE NEUTRAL PLAYER SPRINTS AT 0.9, the slowest a frame has, so this
  # half pays NOTHING until someone says which frame is carrying the gun. That
  # is the same rule every other Tenno field follows: with no frame chosen the
  # wielder claims nothing. Read as always-on it was generous to exactly the
  # builds that cannot reach
  # the threshold.
  - kind: condition_overload
    value: 0.30
    # THE CARD SAYS 1.2 AND THE EFFECT WANTS 1.1. VERBATIM, from this row's own
    # Notes cell: *"Despite the description, the effect only requires 1.1 or
    # higher sprint speed."* So the description above stays DE's sentence and the
    # threshold below is the measured one — the same split every card text in this
    # repo already obeys.
    #
    # It is transcribed PER ROW rather than generalised: the Bronco's Speeding
    # Bullet prints the same 1.2 and its Notes cell carries no such line, so it
    # keeps 1.2. Six of the roster's eight sprint gates move and two do not.
    #
    # The threshold is what makes the row's OTHER note true — *"Equipping Amalgam
    # Serration will allow any Warframe to reach the threshold"* — since the
    # slowest frame reaches 0.9 x 1.25 = 1.125, which clears 1.1 and not 1.2.
    condition: "sprint_speed >= 1.1"
    # THE CARD IS WRONG AND THE EFFECT IS RIGHT — see the threshold note
    # above. Declared so it reaches the perk's own card rather than living
    # only in this comment.
    misprint: >-
      the card prints Sprint Speed 1.2 or Higher and the effect requires 1.1 — so it pays on frames the card says it should not, and Amalgam Serration alone carries any Warframe over the line

source:
  url: https://wiki.warframe.com/w/Latron_Incarnon_Genesis
