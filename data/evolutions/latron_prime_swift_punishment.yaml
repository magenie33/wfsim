id: latron_prime_swift_punishment
name: Swift Punishment
weapon: latron_prime
tier: 2
description: "Increase Base Damage by +6. With Sprint Speed 1.2 or Higher: +30% Direct Damage per Status Type affecting the target."
# THE GENESIS IS THE FAMILY'S. One Latron Incarnon Genesis upgrades any of the
# three Latrons, so all three carry the same ladder of nine perks. Where a value
# DIFFERS between them the wiki's table prints a per-variant column, and the
# number below is this weapon's.
selection: choose_one

effects:
  - kind: flat_base_damage
    value: 6.0
  # CONDITION OVERLOAD, granted by an evolution — it joins the same per-type
  # rate the Galvanized mods feed, diluted and combined by the weapon's own
  # `co_behavior` (Additive here) rather than forming a bucket of its own.
  #
  # THE SPRINT-SPEED CONDITION IS READ (2026-08-12), and it is a question about
  # the PLAYER rather than about this weapon — so it is answered in `resolve_for`,
  # which has the Tenno, rather than in `apply`, which never sees one.
  #
  # THE NEUTRAL PLAYER SPRINTS AT 0.9, the slowest a frame has (owner: "我们应该
  # 假设tenno的sprint speed是0.9（最慢的）"), so this half pays NOTHING until
  # someone says which frame is carrying the gun. That is the same rule every
  # other Tenno field follows: with no frame chosen the wielder claims nothing.
  # Read as always-on it was generous to exactly the builds that cannot reach
  # the threshold.
  - kind: condition_overload
    value: 0.30
    condition: sprint_speed >= 1.2

source:
  url: https://wiki.warframe.com/w/Latron_Incarnon_Genesis
