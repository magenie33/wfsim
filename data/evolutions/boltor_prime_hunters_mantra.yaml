id: boltor_prime_hunters_mantra
name: Hunter's Mantra
weapon: boltor_prime
tier: 2
description: "Increase Base Damage by +4. With Channeled Ability active: Punch Through +4 and +40% Accuracy."
# THE GENESIS IS THE FAMILY'S. One Boltor Incarnon Genesis upgrades any of the
# three Boltors, so all three carry the same ladder of nine perks. Where a value
# DIFFERS between them the wiki's table prints a per-variant column, and the
# number below is this weapon's.
selection: choose_one

effects:
  # THE UNCONDITIONAL HALF, which is the only half this sim can see.
  - kind: flat_base_damage
    value: 4.0
  # NOT LOADED, and it is a gap in the SIM rather than in the data: a CHANNELED
  # ABILITY is a Warframe state the arena has no concept of. Both halves would
  # be spatial anyway — punch-through needs a second body and accuracy needs a
  # miss to prevent, and this arena has neither.
  - kind: punch_through_while_channeling
    value: 4.0
    accuracy: 0.40

source:
  url: https://wiki.warframe.com/w/Boltor_Incarnon_Genesis
