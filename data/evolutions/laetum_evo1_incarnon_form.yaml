id: laetum_evo1_incarnon_form
name: Incarnon Form
weapon: laetum
tier: 1
description: "Weakpoint hits charge Incarnon Transmutation; Alt Fire transmutes.
Gain an Auto fire mode whose shots deal Impact on direct hits and Radiation in a 2 m radius."
selection: fixed                # tier 1 has no choice

# Under the two-weapons model this perk IS the unlock of weapon #2: the
# auto trigger, the higher stats and the radial part are properties of the
# laetum_incarnon entry, not perk payload.
effects:
  # NOT LOADED: `evolutions_data::effect()` has no `unlocks_weapon` arm, so this
  # resolves to `EvoEffect::Inert` and contributes nothing (data/README.md).
  # Nothing is gated on it: the Incarnon form's availability comes from the
  # weapon data's `transforms_to`, and `weapon` below is unread too. The entry
  # records that this tier is what unlocks the form in game.
  - kind: unlocks_weapon
    weapon: laetum_incarnon

source:
  url: https://wiki.warframe.com/w/Laetum
