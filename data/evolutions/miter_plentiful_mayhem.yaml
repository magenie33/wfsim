id: miter_plentiful_mayhem
name: Plentiful Mayhem
weapon: miter
tier: 2
description: "Increase Base Damage by +57. Multishot consumes ammo directly from Capacity and increases Damage by +20."
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # from: "Increase Base Damage by +57"
  - kind: flat_base_damage
    value: 57.0
  # TWO HALVES OF ONE CLAUSE, and only one of them is an edge.
  #
  # "Multishot consumes ammo directly from Capacity" is the ammo economy, which
  # this sim does not run — reserves are unlimited, so where a pellet's ammo
  # comes from changes nothing (UNMODELLED.md §5). The wiki adds "Affects both
  # modes. In the case of Incarnon Form, it pools directly from its magazine."
  #
  # "…and increases Damage by +20" is real, and it is a BASE increase for the
  # same reason the Kunai's is: the card drops the word, and nothing else on
  # this ladder would make the sentence mean anything else.
  - kind: flat_base_damage
    value: 20.0

source:
  url: https://wiki.warframe.com/w/Miter_Incarnon_Genesis
