id: atomos_resonant_restore
name: Resonant Restore
weapon: atomos
tier: 3
description: "On Reload From Empty: Increase Base Magazine Capacity by +5. Stacks up to 7x. Does not affect Incarnon Form."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "On Reload From Empty: Increase Base Magazine Capacity by +5"
  - kind: unmodelled_on_reload_from_empty_increase_base_magazine_capacity
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "Stacks up to 7x"
  - kind: unmodelled_stacks_up_to_x
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "Does not affect Incarnon Form"
  - kind: unmodelled_does_not_affect_incarnon_form

source:
  url: https://wiki.warframe.com/w/Atomos_Incarnon_Genesis
