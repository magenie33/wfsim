id: boar_ready_retaliation
name: Ready Retaliation
weapon: boar
tier: 3
icon: ReloadSpeedOnEmpty(xWhite).png
description: "On Reload From Empty: +100% Reload Speed."
# THE GENESIS IS THE FAMILY'S. One Boar Incarnon Genesis upgrades either the
# Boar or the Boar Prime, and the wiki's evolution table proves the two get the
# SAME evolutions: every row spans both weapon columns with a dash
# (`colspan="2" ... | -`), which is that table's way of saying "no per-variant
# difference". So this file's values are its Prime twin's, transcribed rather
# than re-derived — and if DE ever splits them, the table grows a real cell and
# the two files diverge there.
selection: choose_one

effects:
  # NOT LOADED: `evolutions_data::effect()` has no `reload_speed_bonus` arm
  # (the MODS loader has one — different loader, different vocabulary), so this
  # resolves to `EvoEffect::Inert`; `condition` is unread there too. Same
  # encoding as dual_toxocyst_ready_retaliation, minus that weapon's
  # `currently_broken` flag — the wiki reports no such bug for the Boar, only
  # the ordinary "the bonus lands at the END of the first empty reload, so the
  # first reload does not get it".
  - kind: reload_speed_bonus
    value: 1.00
    condition: reload_from_empty

source:
  url: https://wiki.warframe.com/w/Boar_Incarnon_Genesis
