    arm_at_combo: 6.0
    seconds: 90.0
  # from: "+100% Melee Damage"
  - kind: base_damage_bonus
    value: 1.0
  # "Finishers in Incarnon form will deal their damage in a 12 meter
  # radius, with no falloff" (notes cell). No finisher is performed here.
  - kind: unmodelled_large_radial_attack_for_each_finisher_strike
  - kind: out_of_scope
    clause: "+20% Sprint Speed, +20% Parkour Velocity"
    reason: no_movement

source:
