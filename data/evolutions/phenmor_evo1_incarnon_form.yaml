id: phenmor_evo1_incarnon_form
name: Incarnon Form
weapon: phenmor
tier: 1
description: "Weakpoint Hits charge Incarnon Transmutation; Alt Fire transmutes. Switching back will expend any remaining charge."
# A NATURAL Incarnon: the Phenmor carries its Genesis innately, so this perk
# belongs to the weapon rather than to an adapter shared by a family. Five
# tiers, thirteen perks - see docs/INCARNON.md for why the naturals are shaped
# differently from the 31 adapters.
selection: fixed

effects:
  # LOADED as `EvoEffect::UnlocksForm(weapon)`. It applies no stat - the form
  # is a separate weapon entry carrying its own - but the ENGINE READS IT:
  # asking to fire that form implies this evolution, because tier 1 is
  # `selection: fixed` and the two were one fact behind two controls.
  - kind: unlocks_weapon
    weapon: phenmor_incarnon

source:
  url: https://wiki.warframe.com/w/Phenmor
