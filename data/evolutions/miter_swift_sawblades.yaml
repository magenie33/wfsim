id: miter_swift_sawblades
name: Swift Sawblades
weapon: miter
tier: 2
description: "Increase Base Damage by +77. With Channeled Ability active: +70% Fire Rate."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Damage by +77"
  - kind: flat_base_damage
    value: 77.0
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "With Channeled Ability active: +70% Fire Rate"
  - kind: unmodelled_with_channeled_ability_active_fire_rate

source:
  url: https://wiki.warframe.com/w/Miter_Incarnon_Genesis
