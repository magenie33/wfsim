id: bronco_prime_rain_of_lead
name: Rain of Lead
weapon: bronco_prime
tier: 4
description: "+2 Base Multishot."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # A WEAPON STAT, not a buff: "+2 Base Multishot" with no condition and no
  # clock. It joins the base the multishot BUCKET multiplies, so a Barrel
  # Diffusion in the build is worth more on this build than without the perk —
  # the same bracket the wiki states for every "Base Multishot" grant.
  - kind: flat_base_multishot
    value: 2.0

source:
  url: https://wiki.warframe.com/w/Bronco_Incarnon_Genesis
