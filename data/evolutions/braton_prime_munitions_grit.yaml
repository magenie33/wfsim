id: braton_prime_munitions_grit
name: Munitions Grit
weapon: braton_prime
tier: 2
description: "Increase Base Damage by +2. Multishot consumes ammo directly from Capacity and does +54% Damage. +20% Multishot."
# THE GENESIS IS THE FAMILY'S. One Braton Incarnon Genesis upgrades any of the
# four Bratons, so all four carry the same ladder of nine perks. Where a value
# DIFFERS between them the wiki's table prints a per-variant column, and the
# number below is this weapon's.
selection: choose_one

effects:
  - kind: flat_base_damage
    value: 2.0
  # The multishot surcharge, whose four rules are transcribed in full on
  # data/evolutions/torid_plentiful_mayhem.yaml — an INDEPENDENT multiplier, on
  # the projectiles multishot GENERATED only, paid for out of Capacity, and able
  # to STARVE when the pool runs low.
  - kind: multishot_consumes_ammo
    value: 0.54
  # NOT LOADED: the loader has no flat-multishot arm for an evolution. It would
  # be real here and it is what makes the surcharge above worth anything at all
  # — with no multishot source the +54% applies to nothing.
  - kind: flat_base_multishot
    value: 0.20

source:
  url: https://wiki.warframe.com/w/Braton_Incarnon_Genesis
