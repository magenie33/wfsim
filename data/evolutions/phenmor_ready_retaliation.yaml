id: phenmor_ready_retaliation
name: Ready Retaliation
weapon: phenmor
tier: 3
icon: IncarnonReloadSpeed(xWhite).png
description: "On Reload from Empty: +100% Reload Speed for 6 seconds."
# A NATURAL Incarnon: the Phenmor carries its Genesis innately, so this perk
# belongs to the weapon rather than to an adapter shared by a family. Five
# tiers, thirteen perks - see docs/INCARNON.md for why the naturals are shaped
# differently from the 31 adapters.
selection: choose_one

effects:
  # THE TRIGGER IS THE RELOAD ACTION. Pressing reload on an empty magazine
  # opens the window, so THIS reload is already faster — not the next one
  # (owner, 2026-08-10: "是在换弹开始的时候触发，就是玩家换弹动作开始的时候触
  # 发，而不是结束！等于给自己上了一张100% reload speed的mod"). On a weapon that
  # only ever reloads from empty, which is every weapon in this sim, that makes
  # it behave like a permanent reload mod; the window is what is left over for a
  # transmute or a second reload afterwards.
  #
  # `duration_seconds` is what makes this loadable at all, and only THIS page
  # publishes one: the other eleven Ready Retaliations in the roster state the
  # bonus and no window, so they stay inert rather than borrow this number.
  #
  # It is an ORDINARY reload-speed bonus in every other respect, which is why
  # the page's "Affects untransformed Phenmor. Can affect transition into
  # Incarnon form with a well-timed manual reload. Does not affect transition
  # from Incarnon back to base form" is not modelled as written: the last
  # clause is wrong (owner, same message) — nothing about a reload buff knows
  # which way an animation is going, so the revert takes it too.
  #
  # WHAT IT IS WORTH HERE, measured 2026-08-10 so the zero below is not read as
  # a bug: +17.4% on a stock base-form build (27 reloads become 30) and +19.5%
  # on a fire-rate one (58 become 67) — the best tier 3 has to offer in both
  # cases. And EXACTLY ZERO in the Incarnon cycle, where the base form
  # transmutes on a full gauge and so never empties at all, which means nothing
  # ever arms it. The wiki names the play that fixes that ("a well-timed manual
  # reload") and this arena has no manual reload: docs/UNMODELLED.md.
  - kind: reload_speed_bonus
    value: 1.00
    condition: reload_from_empty
    duration_seconds: 6.0

source:
  url: https://wiki.warframe.com/w/Phenmor
