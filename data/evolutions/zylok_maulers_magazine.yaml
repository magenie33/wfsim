id: zylok_maulers_magazine
name: Mauler's Magazine
weapon: zylok
tier: 2
icon: CritDamageOnReloadFromEmpty(xWhite).png
description: "Increase Base Damage by +76. On Reload From Empty: Increase Base Critical Damage Multiplier by +1x. Stacks up to 2x."
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # VERBATIM (Zylok_Incarnon_Genesis, the row's effect cell and its note):
  #   *Increase Base Damage by '''+X'''.
  #   *On Reload From Empty: Increase Base Critical Damage Multiplier by
  #    '''+1x'''. Stacks up to '''2x'''.
  #   | X = 76   | X = 30
  #   *Stacks are shown as a buff, which are lost when reloading from a partial
  #    magazine or on death.
  # First variant column is the Zylok, second the Zylok Prime.
  # from: "Increase Base Damage by +76"
  - kind: flat_base_damage
    value: 76.0
  # A STACKING BUFF WITH NO CLOCK, lost "when reloading from a partial
  # magazine or on death": a reload the list calls before the magazine is
  # empty takes the pile, and nobody dies in this arena.
  #
  # "+1x BASE Critical Damage Multiplier", so the crit-damage MODS multiply the
  # grant — `resolve` converts the card's number into the post-mod multiplier it
  # is worth, the same conversion a flat base-damage grant takes.
  - kind: stacking_buff
    grants: base_crit_damage
    per_stack: 1.0
    max_stacks: 2
    trigger: reload_from_empty
    cleared_by: partial_reload

source:
  url: https://wiki.warframe.com/w/Zylok_Incarnon_Genesis
