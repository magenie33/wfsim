id: paris_vicious_promise
name: Vicious Promise
weapon: paris
tier: 4
description: "Increase Base Critical Chance by +40% on undamaged enemies. Increase Base Critical Damage Multiplier by +2x on undamaged enemies."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Critical Chance by +40%"
  - kind: flat_base_crit_chance
    value: 0.4
  # from: "Increase Base Critical Damage Multiplier by +2x"
  - kind: flat_base_crit_multiplier
    value: 2.0
  # BOTH HALVES ARE ONE PERK and one condition, so they are one effect. VERBATIM
  # (wiki notes): "Enemies are undamaged as long as their health and shield have
  # not been damaged. Damaging Overguard is not taken into account." — so the
  # test excludes OVERGUARD, and a target being chewed through its overguard
  # still counts as undamaged. Reading all three pools would have switched the
  # perk off on the first shot of every Eximus fight.
  #
  # "BASE" Critical Chance and "BASE" Critical Damage Multiplier, so the crit
  # mods multiply both — `resolve` converts each into the post-mod number worth
  # the same, the same way the flat base-damage buff is converted.
  #
  # ALL THREE PARIS VARIANTS: the row's variant cells are one
  # `colspan="3" | -`, this table's way of writing "no per-variant difference".
  # The rendered page reads as "Paris only"; the markup does not.
  - kind: crit_on_undamaged
    crit_chance: 0.40
    crit_multiplier: 2.0

source:
  url: https://wiki.warframe.com/w/Paris_Incarnon_Genesis
