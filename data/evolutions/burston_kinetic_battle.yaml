id: burston_kinetic_battle
name: Kinetic Battle
weapon: burston
tier: 3
icon: LessRecoil(xWhite).png
description: "-50% Weapon Recoil."
# THE GENESIS IS THE FAMILY'S. One Burston Incarnon Genesis upgrades either the
# Burston or the Burston Prime, and the wiki's evolution table proves the two
# get the SAME evolutions: every row spans both weapon columns with a dash
# (`colspan="2" ... | -`), which is that table's way of saying "no per-variant
# difference".
selection: choose_one

effects:
  # NOT LOADED: recoil is spatial and the arena has no geometry — every round
  # lands here regardless. Recorded so the number is present the day a spatial
  # model reads it. On a burst rifle it is the tier's real pick in game and
  # worth nothing in this sim, which is a gap in the SIM, not in the data.
  - kind: recoil_reduction
    value: 0.50

source:
  url: https://wiki.warframe.com/w/Burston_Incarnon_Genesis
