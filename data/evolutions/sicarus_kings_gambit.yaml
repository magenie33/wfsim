id: sicarus_kings_gambit
name: King's Gambit
weapon: sicarus
tier: 2
description: "Increase Base Damage by +50. x0 Critical Chance on Bodyshots, +150% Critical Chance on Weakpoint Hits."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Damage by +50"
  - kind: flat_base_damage
    value: 50.0
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "x0 Critical Chance on Bodyshots, +150% Critical Chance on Weakpoint Hits"
  - kind: unmodelled_x_critical_chance_on_bodyshots_critical_chance_on_wea

source:
  url: https://wiki.warframe.com/w/Sicarus_Incarnon_Genesis
