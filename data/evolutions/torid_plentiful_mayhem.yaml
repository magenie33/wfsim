id: torid_plentiful_mayhem
name: Plentiful Mayhem
weapon: torid
tier: 2
icon: MultishotCostsAmmoTakenFromPoolAdditionalDamage(xWhite).png
description: "Increase Base Damage by +31.
Multishot consumes ammo directly from Capacity and increases Damage by +60%."
selection: choose_one

effects:
  - kind: flat_base_damage
    value: 31.0
  # UNMODELED, and read the wiki carefully before implementing — the +60% is NOT
  # a flat weapon bonus:
  #  - "Damage bonus from multishot consuming ammo is multiplicative to base
  #    damage bonuses like Serration" (an INDEPENDENT bracket);
  #  - "Damage bonus from multishot consuming ammo only applies to projectiles
  #    GENERATED BY multishot" — so with no multishot mod there are no generated
  #    projectiles and the bonus is worth nothing at all;
  #  - "In the Incarnon form, instead of increasing the damage of additional
  #    projectiles created by multishot, all multishot bonuses are increased by
  #    60%" — a different rule per form, which follows from a beam combining its
  #    multishot hits into one instance rather than making separate ones.
  # Three interacting rules, so it stays inert rather than guessed.
  - kind: unmodeled
    note: "+60% damage on multishot-generated projectiles (multiplicative); multishot draws from Capacity"
    rankMax: 0.6

source:
  url: https://wiki.warframe.com/w/Torid_Incarnon_Genesis
