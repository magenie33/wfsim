id: torid_plentiful_mayhem
name: Plentiful Mayhem
weapon: torid
tier: 2
icon: MultishotCostsAmmoTakenFromPoolAdditionalDamage(xWhite).png
description: "Increase Base Damage by +31.
Multishot consumes ammo directly from Capacity and increases Damage by +60%."
selection: choose_one

# MEASURED ON THE INCARNON FORM: this
# perk's flat base damage does NOT feed the GunCO term.
#
#   1 stack .. 318   2 stacks .. 381   (bare crit 254 = 82 x 3.1)
#
# Solved as an ABSOLUTE across both tier-2 perks, every reading gives a CO base
# of ~51 — the unevolved value — off panels of 102 and 82. A term that fed on
# the evolution would have solved to those two numbers instead.
#
# AND THE DECLARATION IS SCOPED, deliberately. A declaration is the PERK's and
# reaches both forms of the transform group, and the two forms are different CO
# classes with OPPOSITE answers: the Incarnon form is `Adding` and excludes this
# flat damage (M50), the base form is `Multiplying` and feeds it in full (M51,
# measured the same day on this same perk). `only_form` is what keeps the first
# reading from asserting the second. It is now belt AND braces — the class
# answers before any declaration on a `Multiplying` entry — but the scope stays,
# because it is the true statement about what was read where.
# `evolutions_data::excludes_co_base`.
co_base_excludes_this_evolution: true
co_base_excludes_only_form: incarnon

effects:
  - kind: flat_base_damage
    value: 31.0
  # The +60% is NOT a flat weapon bonus. Four rules, all from the wiki, and the
  # engine implements each one:
  #  - "Damage bonus from multishot consuming ammo is multiplicative to base
  #    damage bonuses like Serration" — an INDEPENDENT final multiplier, not a
  #    member of the Serration bucket;
  #  - "…only applies to projectiles GENERATED BY multishot" — the weapon's own
  #    projectile never takes it, so with no multishot source the perk is worth
  #    exactly nothing;
  #  - "Affects both modes. In the case of Incarnon Form, it pools directly from
  #    its magazine" — base form draws the extra rounds from reserve Capacity,
  #    the Incarnon form from its own charge magazine, which SHORTENS the
  #    Incarnon window. The MAGAZINE round itself is never part of this: it
  #    comes from the magazine and always takes ammo efficiency, perk or no —
  #    while the SURCHARGE takes no efficiency at all (measured, user
  #    2026-07-30), so even a 100% source does not make multishot free;
  #  - and the extras can STARVE: the projectiles are produced in order, each
  #    paying its round as it goes, and one that cannot pay is not fired. With
  #    3 charges left and a 4-multishot pull the round is spent, two extras
  #    fire, the third does not exist — so the perk degrades as the pool
  #    empties, the opposite of a flat bonus;
  #  - "In the Incarnon form, instead of increasing the damage of additional
  #    projectiles created by multishot, all multishot bonuses are increased by
  #    60%" — a different rule per form, and it exists because a beam MERGES its
  #    multishot into one instance, leaving no "generated projectile" to scale.
  #
  # The two forms agree in EXPECTATION, which is the tell that the Incarnon rule
  # is a restatement rather than a second perk. With multishot M (base 1):
  #   base form   1 original + (M-1) generated, only the generated x1.6
  #                 => 1 + 1.6(M-1)
  #   Incarnon    the multishot BONUS (M-1) is scaled x1.6, and the merged beam
  #               deals damage in proportion to total multishot
  #                 => 1 + 1.6(M-1)
  # Identical. Note this relies on base multishot being 1.0, which both Torid
  # forms are; a weapon with innate multishot > 1 would split the two readings.
  #
  # The +60% follows a generated grenade into the CLOUD it leaves — which is what makes the perk worth anything on this weapon,
  # since the cloud is most of its damage.
  - kind: multishot_consumes_ammo
    value: 0.6

source:
  url: https://wiki.warframe.com/w/Torid_Incarnon_Genesis
