effects:
  # A BASE-stat addition, so the crit mods multiply the new base — "Increase
  # Base Critical Chance" is the wiki's own wording. On the Prime 18% -> 40%,
  # which Point Strike alone then carries past 100%; on the Burston 6% -> 28%,
  # turning a weapon with essentially no crit into one worth building for.
  - kind: flat_base_crit_chance
    value: 0.22

