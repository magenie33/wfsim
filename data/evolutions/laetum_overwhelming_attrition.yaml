id: laetum_overwhelming_attrition
name: Overwhelming Attrition
weapon: laetum
tier: 5
description: "On Hit that is neither Critical nor applies a Status Effect: +400% damage for 10s. Stacks up to 3 times."
selection: choose_one
# Decay (wiki): "When the buff times out, one stack is lost and the buff
# duration resets" - the Galvanized lose-one-and-reset model, not
# per-stack expiry.
# BRACKET (wiki, verbatim): "Damage bonus is ADDITIVE to base damage
# bonuses such as Hornet Strike" — the OPPOSITE of its tier sibling
# Devouring Attrition, which the same page calls multiplicative. So the
# stacks join the base-damage bucket and scale ModifiedBase with it.

effects:
  - kind: stacking_damage_on_plain_hit
    per_stack: 4.0         # +400% per stack
    max_stacks: 3
    duration: 10

source:
  url: https://wiki.warframe.com/w/Laetum
