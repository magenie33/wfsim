id: torid_renewed_horror
name: Renewed Horror
weapon: torid
tier: 3
icon: IncarnonReloadSpeed(xWhite).png
description: "On Reload from Empty: Lingering damage field duration doubles on first shot."
selection: choose_one

effects:
  # MECHANISM (user measurement, 2026-07-30 / MEASUREMENTS M13): reloading from
  # empty arms a buff, and the NEXT shot's pod lives twice as long — measured as
  # "1 direct hit + 20 pod ticks" against the normal 10, which also pins the
  # tick rule (ticks = duration in seconds, the first landing WITH the impact).
  #
  # On a 5-round magazine that is one pod in five running 20 s instead of 10, so
  # under `stack` semantics a straight +20% of the pod's total ticks.
  #
  # It was BROKEN once and fixed in 33.6 ("Fixed Torid's Renewed Horror perk not
  # doubling duration on the damage field duration on first shot as intended"),
  # so it does work now.
  - kind: field_duration_on_empty_reload
    value: 2

source:
  url: https://wiki.warframe.com/w/Torid_Incarnon_Genesis
