id: zylok_prime_precisions_payoff
name: Precision's Payoff
weapon: zylok_prime
tier: 2
description: "Increase Base Damage by +30. On Burst Headshots: Increase Base Damage by +20. Stacks up to 3x."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
# THIS PERK'S FLAT DAMAGE STAYS OUT OF THE CO TERM. VERBATIM (CO catalog):
#
#   Zylok Prime||Incarnon Mode||…||500 or 530 (with Evolution II)||500||100% or 94%||Adding||CO-bonus does not use base damage increase Evolution
#
# Which perk: the row names the TIER, and both tier-2 options add the same +30.
co_base_excludes_this_evolution: true
selection: choose_one

effects:
  # from: "Increase Base Damage by +30"
  - kind: flat_base_damage
    value: 30.0
  # WHY THIS ONE STAYS INERT, and it is not the perk's fault: the trigger needs
  # a firing mode this entry does not model. The card's own note defines it —
  # "Stacks are generated if both shots from holding and releasing Zylok's
  # trigger are headshots" — and `data/weapons/secondary/zylok.yaml` declares
  # the gap it depends on: "the duplex trigger is not modelled — one pull fires
  # TWO rounds in game and this entry paces one per pull". With no burst there
  # is no pair of shots to ask about, so a trigger for it would be a rule that
  # can never be true rather than a model of the card.
  #
  # (The weapon's own banner is where a player is told; this is the pointer for
  # the next reader of the yaml. The other two notes are already settled and
  # will apply the day the duplex is: "lost on reload or switching to Incarnon
  # Form" is `cleared_by: magazine_refilled`, and "Incarnon Form cannot trigger
  # burst headshots, as it has a Charge trigger instead of Duplex" needs no rule
  # — that form has no burst either.)
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "On Burst Headshots: Increase Base Damage by +20"
  - kind: unmodelled_on_burst_headshots_increase_base_damage_by
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "Stacks up to 3x"
  - kind: unmodelled_stacks_up_to_x

source:
  url: https://wiki.warframe.com/w/Zylok_Incarnon_Genesis
