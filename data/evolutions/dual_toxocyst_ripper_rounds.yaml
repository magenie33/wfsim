id: dual_toxocyst_ripper_rounds
name: Ripper Rounds
weapon: dual_toxocyst
tier: 4
icon: OnKillPunchThrough(xWhite).png   # wiki File: name (Dual_Toxocyst_Incarnon_Genesis)
description: "On Kill: +3 Punch Through for 7s."
selection: choose_one

effects:
  # NOT LOADED: `evolutions_data::effect()` has no `timed_buff` arm — the
  # modelled shape is `stacking_buff` — so this resolves to `EvoEffect::Inert`
  # and the engine takes nothing; `trigger`, `duration_seconds` and `modifiers`
  # go unread with it (data/README.md). No DPS consequence single-target:
  # punch-through moves damage to enemies BEHIND the first, and there are none.
  - kind: timed_buff
    trigger: on_kill
    duration_seconds: 7
    modifiers: { punch_through_m: 3.0 }

source:
  url: https://wiki.warframe.com/w/Dual_Toxocyst_Incarnon_Genesis
