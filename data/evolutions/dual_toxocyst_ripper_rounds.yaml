id: dual_toxocyst_ripper_rounds
name: Ripper Rounds
weapon: dual_toxocyst
tier: 4
icon: OnKillPunchThrough(xWhite).png   # wiki File: name (Dual_Toxocyst_Incarnon_Genesis)
description: "On Kill: +3 Punch Through for 7s."
selection: choose_one

effects:
  # LOADED AND DESCRIBED, deliberately NOT APPLIED. The loader reads the
  # trigger, the window and the modifier now, so the card says "on kill: +3.0 m
  # punch through for 7 s" instead of showing nothing at all.
  #
  # It does not join the flat indirect bucket, because that bucket is
  # UNCONDITIONAL: a build that has not killed anything does not have this
  # punch through, and the panel must not say it does. That is the rule the
  # mods already follow (data/mods/rifle/twitch.yaml). Nothing is lost either
  # way — punch-through moves damage to enemies BEHIND the first, and the arena
  # has none.
  - kind: timed_buff
    trigger: on_kill
    duration_seconds: 7
    modifiers: { punch_through_m: 3.0 }

source:
  url: https://wiki.warframe.com/w/Dual_Toxocyst_Incarnon_Genesis
