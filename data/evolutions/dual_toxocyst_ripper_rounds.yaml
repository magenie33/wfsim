id: dual_toxocyst_ripper_rounds
name: Ripper Rounds
weapon: dual_toxocyst
tier: 4
icon: OnKillPunchThrough(xWhite).png   # wiki File: name (Dual_Toxocyst_Incarnon_Genesis)
description: "On Kill: +3 Punch Through for 7s."
selection: choose_one

effects:
  # The payload is what the engine does not take: punch through moves damage
  # to enemies BEHIND the first, and the arena has none. It is also
  # CONDITIONAL, so it could not join the flat indirect bucket even if it
  # mattered — that bucket is unconditional, and a build that has not killed
  # anything does not have this (the rule the mods follow, see
  # data/mods/rifle/twitch.yaml).
  #
  # A "timed buff" is a STACKING buff with ONE stack — same trigger, same
  # window, same shape (user, 2026-08-03). `stacking_buff` already says all of
  # it, so there is no second vocabulary for it.
  - kind: stacking_buff
    trigger: on_kill
    per_stack: { punch_through_m: 3.0 }
    max_stacks: 1
    duration: 7

source:
  url: https://wiki.warframe.com/w/Dual_Toxocyst_Incarnon_Genesis
