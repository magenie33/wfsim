id: gammacor_infused_shots
name: Infused Shots
weapon: gammacor
tier: 2
description: "Increase Base Damage by +6. On 50 Energy Spent: Increase Base Damage by +5 for 10 seconds. Stacks up to 4x."
# THE GENESIS IS THE FAMILY'S — one adapter upgrades every variant, so all
# of them carry the same ladder; a value that differs between them is
# printed per variant by the wiki and transcribed per variant here.
selection: choose_one

effects:
  # from: "Increase Base Damage by +6"
  - kind: flat_base_damage
    value: 6.0
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "On 50 Energy Spent: Increase Base Damage by +5 for 10 seconds"
  - kind: unmodelled_on_energy_spent_increase_base_damage_by_for_seconds
  # NOT MODELLED — no rule for this clause, so it loads as
  # `EvoEffect::Inert` and both the builder and the optimizer print it
  # as such. VERBATIM: "Stacks up to 4x"
  - kind: unmodelled_stacks_up_to_x

source:
  url: https://wiki.warframe.com/w/Gammacor_Incarnon_Genesis
