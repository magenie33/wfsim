id: paris_striking_succession
name: Striking Succession
weapon: paris
tier: 4
description: "On Hit: Increase Base Damage by +15 for 3 seconds. Stacks up to 4x."
# see notes: genesis_family_s_adapter
selection: choose_one

effects:
  # MODELLED as a plain stacking buff. "On Hit" carries no qualifier at all —
  # crit or not, status or not — which is what separates it from the roster's
  # other hit trigger (Overwhelming Attrition's "neither Critical nor applies a
  # Status Effect"). Per damage INSTANCE, so a bow's arrow and its explosion are
  # two, the same rule M11 measured.
  #
  # "+15 BASE DAMAGE" IS THE ABSOLUTE BRACKET, not a share of the base-damage
  # bucket: it raises the number Serration multiplies rather than being diluted
  # by it. `resolve` converts the flat number into the bucket share worth the
  # same thing once the mods are known.
  #
  # DECAY IS STATED for once, and it is the Galvanized family: "When the buff
  # times out, one stack is lost and the buff duration resets."
  #
  # ALL THREE VARIANTS — the row's variant cells are one `colspan="3" | -`,
  # this table's way of writing "no per-variant difference".
  #
  # see notes: stack_cap_was_separate
  - kind: stacking_buff
    trigger: hit
    per_stack:
      base_damage: 15.0
    max_stacks: 4
    duration_seconds: 3.0

source:
  url: https://wiki.warframe.com/w/Paris_Incarnon_Genesis
