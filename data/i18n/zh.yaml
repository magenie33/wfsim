# Effect-line phrase substitutions for mod/arcane/evolution descriptions
# ("+X% Critical Chance" → "+X% 暴击几率"). ORDERED — longest phrases first
# so partial matches never clobber. Each entry: [regex, replacement] or
# [regex, replacement, flags] (default flags: gi).
effect_phrases:
  - ['Status Duration', '触发持续时间']
  - ['Critical Chance', '暴击几率']
  - ['Critical Damage', '暴击伤害']
  - ['Status Chance', '触发几率']
  - ['Magazine Capacity', '弹匣容量']
  - ['Reload Speed', '装填速度']
  - ['Fire Rate', '射速']
  - ['Multishot', '多重射击']
  - ['Weapon Recoil', '武器后坐力']
  - ['\bRecoil\b', '后坐力']
  - ['Punch Through', '穿透']
  - ['Projectile Speed', '抛射物飞行速度']
  - ['Ammo Efficiency', '弹药效率']
  - ['Ammo Maximum', '弹药上限']
  - ['Dodge Speed', '闪避速度']
  - ['\bAccuracy\b', '精准度']
  - ['Weak Point Damage', '弱点伤害']
  - ['Weak Point', '弱点']
  - ['Damage to (Grineer|Corpus|Infested|Corrupted|The Murmur)', '对 $1 伤害']
  - ['\bImpact\b', '冲击', 'g']
  - ['\bPuncture\b', '穿刺', 'g']
  - ['\bSlash\b', '切割', 'g']
  - ['\bHeat\b', '火焰', 'g']
  - ['\bCold\b', '冰冻', 'g']
  - ['\bElectricity\b', '电击', 'g']
  - ['\bToxin\b', '毒素', 'g']
  - ['\bBlast\b', '爆炸', 'g']
  - ['\bCorrosive\b', '腐蚀', 'g']
  - ['\bGas\b', '毒气', 'g']
