# Incarnon evolution names live in evolutions.yaml, beside their card text:
# both come from the same hand transcription, and neither has an export.

# UI strings, keyed by the English source string (English itself never needs
# an entry — the source string IS the fallback).

abilities:
  # TRANSCRIBED FROM DE, not translated (house rule). Every one of these is
  # lifted out of DE's own zh Public Export — the three abilities off their
  # frame's own ability list, the four augments off their mod cards — so they
  # are the strings the Chinese client shows and nothing here is our phrasing.
  #
  # NO FRAME NAMES. DE's Chinese client leaves them in English ("Rhino 重拳以
  # 待"), so a translated one would be a word DE did not write.
  #
  # "（Helminth）" marks the subsumed variant, and Helminth itself stays in
  # English for the same reason — DE writes "Helminth 退化样式".
  roar: 战吼
  roar_helminth: 战吼（Helminth）
  # DE's own name for Valkyr's second, and NOT 战吼, which is Roar's.
  warcry: 咆哮
  # …and Voruna's, which this section was missing while `warframe_abilities`
  # below carried the same DE string all along.
  wrathful_advance: 暴怒突进
  wrathful_advance_helminth: 暴怒突进（Helminth）
  arcane_crepuscular: 赋能·影袭
  tenacious_bond: 坚韧连结
  eclipse: 黯然失色
  eclipse_helminth: 黯然失色（Helminth）
  nourish: 消化滋养
  nourish_helminth: 消化滋养（Helminth）
  # 真理密语, off the CN wiki's own ability page (`?action=raw` via the API —
  # DATA_SOURCES §"The CN wiki").
  # IT IS NOT AN ITEM DE EXPORTS AT ALL, unlike the seven above, so a derived
  # name was not an option: nothing about "Xata's Whisper" would have
  # produced 真理密语.
  xatas_whisper: 真理密语
  xatas_whisper_helminth: 真理密语（Helminth）
  shock_trooper: 电击奇兵
  fireball_frenzy: 狂热火球
  freeze_force: 寒冰之力
  venom_dose: 猛毒附加
  toxic_lash: 剧毒鞭笞
  # A DIFFERENT PATH FROM THE SEVEN ABOVE: this one is an AUGMENT MOD, so DE's
  # own string is in DE's Public Export like any other mod card, joined on
  # `/Lotus/Powersuits/Alchemist/AlchemistPassiveAugmentCard`. Its card says the
  # mechanic in DE's words too — 「为武器附加 200% 该元素伤害」, 附加 rather than
  # 合成, which is the wiki's "parallel … will NOT combine" from the other side.
  valence_formation: 效价炼成
  resupply: 补给
  # HELMINTH'S OWN, off `/Lotus/Powersuits/PowersuitAbilities/Helminth`'s ability
  # list in DE's Public Export in Chinese — DE's Chinese client, not a
  # translation of ours.
  energized_munitions: 充沛军需

