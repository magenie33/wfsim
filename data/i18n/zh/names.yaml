# Incarnon evolution names live in evolutions.yaml, beside their card text:
# both come from the same hand transcription, and neither has an export.

# UI strings, keyed by the English source string (English itself never needs
# an entry — the source string IS the fallback).

abilities:
  # TRANSCRIBED FROM DE, not translated (house rule). Every one of these is
  # lifted out of WFCD's `i18n.json` — the three abilities off their frame's
  # own ability list, the four augments off their mod cards — so they are the
  # strings the Chinese client shows and nothing here is our phrasing.
  #
  # NO FRAME NAMES. DE's Chinese client leaves them in English ("Rhino 重拳以
  # 待"), so a translated one would be a word DE did not write.
  #
  # "（Helminth）" marks the subsumed variant, and Helminth itself stays in
  # English for the same reason — DE writes "Helminth 退化样式".
  roar: 战吼
  roar_helminth: 战吼（Helminth）
  eclipse: 黯然失色
  eclipse_helminth: 黯然失色（Helminth）
  nourish: 消化滋养
  nourish_helminth: 消化滋养（Helminth）
  # 真理密语, off the CN wiki's own ability page (`?action=raw` via the API —
  # DATA_SOURCES §"The CN wiki is reachable through its API, not its pages").
  # WFCD carries no zh ability NAMES at all — its `abilities` entries have a
  # description and a null name for every frame — so this is the same path the
  # seven above came down, and the same reason a derived name was not an option:
  # nothing about "Xata's Whisper" would have produced 真理密语.
  xatas_whisper: 真理密语
  xatas_whisper_helminth: 真理密语（Helminth）
  shock_trooper: 电击奇兵
  fireball_frenzy: 狂热火球
  freeze_force: 寒冰之力
  venom_dose: 猛毒附加
  toxic_lash: 剧毒鞭笞
  resupply: 补给
