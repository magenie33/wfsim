# 简体中文 — display NAMES (hand-written).
#
# RULES (data/README.md "i18n"): ids are NEVER translated — this file maps
# id → display name only. Missing entries fall back to English, so partial
# translation is always safe. Every key must be a real id (machine-enforced
# by engine::i18n_data tests — a typo fails the build).
#
# Canonical reference: the official CN client (WFCD i18n, joined on
# internal_name), cross-checked against the community wiki's 对照 table
# https://warframe.huijiwiki.com/wiki/Project:中英名称对照
#
# A locale is a DIRECTORY and its files are merged (engine::i18n_data):
#   names.yaml         this file — hand-written
#   ui.yaml            UI strings + the phrase-substitution fallback
#   descriptions.yaml  GENERATED from DE's client strings, never hand-edited

# Every name here is the official CN client string (WFCD i18n, joined on
# internal_name). The FORM suffixes are ours, not DE's: the client has one
# name per weapon, and our roster splits a weapon into entries per form, so
# the suffix says which form — which is why this section is hand-written
# while `mods`/`arcanes` below are filled by the script.
weapons:
  cernos_prime: 西诺斯 Prime
  cernos_prime_uncharged: 西诺斯 Prime (点射)   # the tapped form, same weapon
  dual_toxocyst: 毒囊双枪
  dual_toxocyst_incarnon: 毒囊双枪 (灵化形态)   # Incarnon Genesis = 灵化之源
  laetum: 奏凯
  laetum_incarnon: 奏凯 (灵化形态)
  torid: 托里德
  torid_incarnon: 托里德 (灵化形态)
  verglas_prime: 冰凇 Prime

