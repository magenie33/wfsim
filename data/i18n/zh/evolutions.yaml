  boar_prime_practiced_grip: "精准度提升 +50%。"
  boar_prime_elemental_balance: "基础触发几率增加 +12%。\n灵化形态的基础触发几率增加 +96%。"
  boar_prime_critical_parallel: "基础暴击几率增加 +20%。\n基础暴击伤害增加 +0.5x。"
