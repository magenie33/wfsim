# 简体中文 — Incarnon EVOLUTIONS (hand-transcribed).
#
# WHY THIS FILE EXISTS SEPARATELY. Every other card in the app takes DE's own
# localized string from their export (descriptions.yaml). Evolutions cannot:
# they are not items, so they appear in NEITHER source we normally use —
# checked, not assumed:
#   - WFCD warframe-items: no entity at all (the only hit for "Devouring
#     Attrition" across every export file is a Laetum PATCHLOG line);
#   - DE's own PublicExport (`index_zh.txt.lzma` → 16 files): ExportUpgrades
#     is mods and arcanes; the only "灵化" in ExportWeapons is weapon flavour
#     text. The evolution strings live in the client's localization tables,
#     which are not exported.
#
# HOW TO READ IT (2026-08-03). The wiki's PAGES sit behind a Cloudflare
# challenge that neither curl nor a fetch tool can pass — every `?action=raw`
# and every plain page URL answers 403 "Just a moment...". Its MediaWiki API
# does NOT:
#
#   curl -A "Mozilla/5.0 …" #     "https://warframe.huijiwiki.com/api.php?action=parse&page=<标题>&prop=wikitext&format=json"
#
# That is the whole trick, and it is written down because the wall cost a round
# of INVENTED names first: four of five guessed Boar Prime names were wrong
# (堡垒齐射/佣兵膛室/熟练握把/暴击并行 for the real 要塞齐射/佣兵枪膛/熟练之握/
# 临界平行). A DE name is never derivable from its English — 准将沐福 for
# Commodore's Fortune — so "unreachable" must mean ASK, never translate.
#
# So the source here is the community wiki's transcription of the CN client —
# the SAME second source data/README.md already names for display names
# (https://warframe.huijiwiki.com), read 2026-07-31 from:
#   奏凯                (Laetum, evolutions on the weapon page)
#   托里德灵化之源       (Torid Incarnon Genesis)
#   毒囊双枪灵化之源     (Dual Toxocyst Incarnon Genesis)
# Wiki markup is resolved to plain text ({{D|Toxin}} → 毒素, '''+51''' → +51)
# and the line breaks follow our English `description` field, so the two read
# as the same card.
#
# It is hand-written and stays hand-written: there is no export to regenerate
# it from. An entry whose English source is reworded should be re-checked
# here — nothing detects that automatically, which is the cost of a source
# that is a wiki page rather than a data file.

