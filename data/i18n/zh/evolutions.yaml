  # cell, away from their values, so nothing on the page ties a name to an
  # effect and both perks carry the number 50. They are 动能隔档 and 顺滑飞行
  # in one order or the other, and which is which is a question for someone
  # with the game open:
  #   felarx_kinetic_baffle:
  #   felarx_frictionless_flight:
