  # The Latron family (2026-08-08), read through the API from 拉特昂灵化之源.
  # ZERO disagreements with the EN table on all 27 values, unlike the Braton's
  # two — which is the point of checking both rather than one.
  latron_evo1_incarnon_form: |-
    爆头为灵化转变充能，次要开火进行转变。切换回原有模式将消耗剩余的充能。
