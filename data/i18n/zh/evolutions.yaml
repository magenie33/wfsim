  # ---- Boar Prime ----
  # Verbatim from the CN wiki page (野猪灵化之源), markup resolved and the
  # 原版/Prime duplication dropped — both columns carry the same number and
  # this entry is the Prime's.
  #
  # NOTE on Reified Bane: DE's card says +10 for the empty-reload half in BOTH
  # languages, and the EN wiki records that as a MISPRINT ("Reload From empty
  # bonus is incorrectly listed as +10 in game") — the effect is +14, which is
  # what data/evolutions/boar_prime_reified_bane.yaml models. The card here
