# zh — data/concepts.yaml, string for string: the /method page and the
# method query in Chinese. Keyed by the English source like `ui.yaml`; the
# build refuses a locale that leaves a string of the method out.
ui:
  "How WFSim judges a build": "WFSim 怎么评判配装"
  "How WFSim judges a Warframe build: each rule is what the calculator does, why it does it, and the readings it rests on.": "WFSim 怎么评判一套 Warframe 配装：每条规则都是计算器实际在做的事、这么做的原因，以及它依据的实测。"
  "Why": "为什么"
  "How to apply it": "怎么用"
  "The readings behind it": "依据的读数"
  "In game": "游戏内实测"
  "In the engine": "引擎读数"
  "Further reading": "延伸阅读"
  "Method": "方法"
  "The rulers": "现有基准"

  "A score belongs to its ruler": "分数属于它的基准"
  "A build is judged in a named fight, its ruler, which states the target, its level, how long the fight lasts and what is counted, and a score compares only with scores under the same ruler.": "配装放在一场有名字的战斗里评判，这场战斗就是它的基准：目标是谁、多少级、打多久、统计什么，全部写明。分数只能和同一基准下的分数比较。"
  "What a hit is worth depends on what it hits: armour, Overguard, faction, elemental weakness and how many bodies stand in reach each change it. A number without its fight cannot be reproduced or compared.": "一发伤害值多少，取决于打在什么身上：护甲、超宏防护、派系、元素弱点、射程内站着几个敌人，每一样都会改变它。脱离战斗的数字既无法复现，也无法比较。"
  "A ruler states every term, so anyone can run the same fight and get the same score.": "基准写明每一个条件，所以任何人都能跑同一场战斗，得到同一个分数。"
  "The best build under one ruler can differ from the best under another; that is the fight answering a different question.": "一个基准下最好的配装，换一个基准可能就不是最好；那是战斗在回答另一个问题。"
  "Before comparing two builds, check that both were scored under the same ruler; under different rulers, do not compare the numbers.": "比较两套配装之前，先确认它们是在同一个基准下算的分；基准不同，就不要比数字。"
  "Quote a score together with the name of its ruler.": "引用分数时，连同基准的名字一起写出。"
  "The same Void instance reads 14 on a Thrax Centurion's body and 9 on another unit's body.": "同一段虚空伤害，打在凶魂百夫长身上显示 14，打在另一个单位身上显示 9。"

  "The fight is run, not assumed": "战斗是跑出来的，不是假设的"
  "Under a ruler, stacks, buffs, status effects, Overguard and armour start where the game starts them and change hit by hit during the fight; nothing starts at its cap because a card allows one.": "在基准下，层数、增益、异常状态、超宏防护和护甲，都从游戏里的起点开始，在战斗中一发一发地变化；不会因为卡面写了上限，就从上限开始。"
  "A buff that stacks on kills is worth what the fight lets it earn. Against a target that dies twice a minute it is rarely earned; against one that dies every second it is held almost all the time.": "击杀叠层的增益，值多少取决于战斗让它叠到多少。目标一分钟才死两次，它很少叠得起来；目标每秒都在死，它几乎一直挂着。"
  "Each hit lands on what the hits before it left: a status already on the target, armour already stripped, a pile about to detonate.": "每一发都打在前面几发留下的状态上：目标身上已有的异常、已经被削掉的护甲、快要引爆的一摞层数。"
  "Only a buff with no timer that nothing spends starts full, because anyone can hold it for the whole fight.": "只有没有计时、也不会被消耗的增益才满层开局，因为谁都能整场一直保持它。"
  "Do not credit a timed or on-kill buff at full stacks against a tough target; ask how often the build earns it there.": "面对耐打的目标，不要按满层计算计时类或击杀类增益；要问这套配装在那里多久能叠起来一次。"
  "A build that leads against weak targets can trail against tough ones, and the reverse.": "打弱目标领先的配装，打耐打的目标可能落后，反过来也一样。"
  "One build scored 60% lower against a level 9999 Steel Path target when its timed buffs started at zero and had to be earned, and 0.9% lower at level 30.": "同一套配装，计时类增益从零开始、必须在战斗中叠起来时，打 9999 级钢铁之路目标的分数低了 60%，打 30 级只低了 0.9%。"

  "Kills per minute, not damage per second": "看每分钟击杀，不看每秒伤害"
  "A ruler counts kills per minute, including the part of a target already gone, so damage that reaches a body already dead, or a pile already full, adds nothing.": "基准统计每分钟击杀，并计入目标已被削掉的部分；所以打在已经死掉的身体上、或打进已经满了的一摞层数里的伤害，什么也不加。"
  "Damage per second counts every number a weapon deals, including damage on a body already dead. Kills per minute counts only what removes targets.": "每秒伤害会把武器打出的每一个数都算进去，包括打在已经死掉的身体上的伤害。每分钟击杀只算真正把目标打掉的部分。"
  "Multishot adds instances to the weapon's own rounds: each its own number, crit and status, landing where the round lands.": "多重射击是给武器自己的每一发子弹加伤害实例：每个实例有自己的数字、暴击和异常状态，落在子弹落的地方。"
  "Counting the part of a target already gone lets a build that never finishes a kill still rank.": "计入目标已被削掉的部分，一套始终没能完成击杀的配装也照样有排名。"
  "Judge a build by its kills per minute under a ruler, not by its damage per second.": "用基准下的每分钟击杀评判配装，不用每秒伤害。"
  "Do not count multishot as extra rounds reaching other targets.": "不要把多重射击算成打向其他目标的额外子弹。"
  "A three-round burst at a body that dies to one round kills that body, and nothing of the burst reaches the body behind it.": "一个点射三发，打向一发就死的敌人：它死了，这一个点射剩下的部分一点也打不到后面那个敌人。"
  "A shot that brings a Blast pile to ten detonates it once, and the rest of that shot's Blast procs are lost.": "一发把爆炸层数打满十层，只引爆一次，这一发剩下的爆炸触发全部作废。"

  "The game is the authority": "以游戏为准"
  "Where a reading taken in the game, the wiki and DE's public export disagree, the reading wins, then the wiki, then the export; every formula in the engine names its source.": "游戏内实测、wiki 和 DE 公开导出数据不一致时，以实测为准，其次 wiki，再次导出数据；引擎里每一条公式都写明出处。"
  "A card's text and the wiki describe the game, and they can leave out how two effects combine or what a listed number means. A reading in the game settles it.": "卡面文字和 wiki 是在描述游戏，它们可能漏掉两个效果怎么叠加，或者列出的数字到底指什么。游戏内实测能把这个问题定下来。"
  "Each reading the engine applies is published with its numbers, so anyone can take it again.": "引擎采用的每一条实测都连同数字一起公开，任何人都可以重测一遍。"
  "A tested value changes only with a new reading in the game.": "测试锁定的数值，只有新的游戏内实测才能改。"
  "Where a card's wording and a reading in the game disagree, follow the reading.": "卡面写法和游戏内实测不一致时，按实测来。"
  "Where your own reading in the game disagrees with WFSim, yours is the one to trust.": "你自己的游戏内实测和 WFSim 不一致时，信你的实测。"
  "Headshot bonuses of +50% and +30% read 1.1998 times the first in game: they add (1.2), they do not multiply (1.3).": "+50% 和 +30% 两个爆头加成，游戏内实测是只有第一个时的 1.1998 倍：它们相加（1.2），不是相乘（1.3）。"
  "A throw reloads after every throw, so its cycle is the wind-up plus the reload, 1.6 s rather than the 1 s its fire rate suggests.": "投掷每扔一次都要装填，所以一个循环是蓄力加装填，1.6 秒，而不是射速看起来的 1 秒。"

  "A score is computed, never typed": "分数是算出来的，不是填进去的"
  "A board build is one anyone submitted or a search found, and its score is the engine's: the ruler's fight run many times under a pinned seed.": "榜上的配装来自任何人的提交或搜索的结果，分数则由引擎给出：在固定种子下把基准的战斗跑很多遍。"
  "Chance decides much of what a build does, so one trial cannot rank it: one run's spread can put a minus sign in front of a status mod worth +30%.": "一套配装的表现很大程度上由几率决定，所以试一次排不出名次：只跑一次的波动，能让一张值 +30% 的异常 MOD 显示成负数。"
  "A pinned seed makes every score reproducible by anyone with the source.": "固定种子让任何拿到源码的人都能复现每一个分数。"
  "A submission is a build, never a number, so no score on the board was typed in.": "提交的是配装，从来不是数字，所以榜上没有一个分数是人填进去的。"
  "Do not rank builds from a single trial.": "不要凭一次试验给配装排名。"
  "Link to a board row rather than restating it: the link opens the build in the calculator, where it can be run again.": "引用榜上的配装时给链接，不要转述：链接会在计算器里打开这套配装，可以再跑一遍。"
  "One run per candidate put a status mod at +30% give or take 39 points; four hundred runs still left it give or take 5.6.": "每个候选只跑一次时，一张异常 MOD 的结果是 +30%，上下浮动 39 个百分点；跑四百次仍然浮动 5.6 个百分点。"

  "The weapon first, without a riven": "先看武器本身，不带裂罅"
  "The board leads with the best build that has no riven; a riven is ranked as a shape, which stats it rolled and which is the malus, scored at its best roll beside the riven-free leader.": "排行榜首先列出不带裂罅的最佳配装；裂罅按「形状」排名，也就是 roll 出了哪些属性、哪一条是负面属性，按最好的数值计分，和不带裂罅的第一名放在一起比。"
  "A riven is one player's random item, and ranking items would rank luck. A shape is something anyone can roll for.": "裂罅是某个玩家的随机物品，给物品排名就是给运气排名。形状则是任何人都可以去 roll 的目标。"
  "Every build is scored at full investment: full Forma, every card at max rank, the maximum Valence bonus. The board ranks choices, not how much someone farmed.": "每套配装都按满投入计分：Forma 打满、每张卡满级、效价加成取最大值。排行榜比的是选择，不是谁刷得多。"
  "Quote the riven-free row as what a weapon does, and a riven row as what that shape adds to it.": "把不带裂罅的那一行当作武器本身的水平，把带裂罅的那一行当作这个形状能带来的提升。"
  "Compare rivens by their gain over the riven-free leader of the same ruler and mode.": "比较裂罅，要看它相对同一基准、同一模式下不带裂罅第一名的提升。"
  "How the board stores and ranks a riven shape.": "排行榜怎么保存、怎么排名一个裂罅形状。"

  "What is not modelled is said": "没有建模的部分会写明"
  "A weapon, a mod, an arcane, an evolution and an enemy each state what the engine does not model of them, and a score holds only inside what is modelled.": "武器、MOD、赋能、进化和敌人，各自写明了引擎没有建模的部分；分数只在已建模的范围内成立。"
  "A number with a gap nobody stated reads as complete. A stated gap says where to check the game yourself.": "一个有缺口却没人说明的数字，看起来就像是完整的。写明缺口，等于告诉你该去游戏里自己核对哪里。"
  "Carry a weapon's notes on what is not modelled along with its score.": "引用武器的分数时，连同它「未建模」的说明一起带上。"
  "Where a gap bears on the question, say so instead of estimating around it.": "缺口影响到问题本身时，直接说明，不要绕着它估算。"
  "Every mechanic the engine does not model, in one register.": "引擎没有建模的所有机制，汇总在一份清单里。"
