  Shots are aimed, with a 100% headshot rate. A weapon's forced targeting and stance still apply.: 瞄准射击，爆头率为 100%。武器自身强制的命中位置和姿态仍然生效。
  Shots are aimed, with a 0% headshot rate. A weapon's forced targeting and stance still apply.: 瞄准射击，爆头率为 0%。武器自身强制的命中位置和姿态仍然生效。
  Shots are aimed, with a 50% headshot rate. A weapon's forced targeting and stance still apply.: 瞄准射击，爆头率为 50%。武器自身强制的命中位置和姿态仍然生效。
  ? Direct hits, including punch-through hits, use the selected headshot rate. A chain hop and a damage cloud cannot be a weak point hit. A Blast detonation carries the weak-point and critical multipliers of the hit that applied the stack (MEASUREMENTS M54).
  : 直接命中（包括穿透命中）使用所选爆头率。链式跳跃和伤害云不能命中弱点。爆炸异常的引爆继承施加该层异常的命中的弱点倍率和暴击倍率（MEASUREMENTS M54）。
