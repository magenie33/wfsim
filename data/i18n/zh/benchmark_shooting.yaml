  Shots use 100% weak-point aim. A weapon's forced targeting and stance still apply.: 射击以 100% 的概率瞄准弱点。武器自身强制的命中位置和姿态仍然生效。
  Shots use 0% weak-point aim. A weapon's forced targeting and stance still apply.: 射击以 0% 的概率瞄准弱点。武器自身强制的命中位置和姿态仍然生效。
  Shots use 50% weak-point aim. A weapon's forced targeting and stance still apply.: 射击以 50% 的概率瞄准弱点。武器自身强制的命中位置和姿态仍然生效。
  ? Direct hits and punch-through use the actual contacted body part. A chain hop and a damage cloud cannot be a weak point hit. A Blast detonation carries the weak-point and critical multipliers of the hit that applied the stack (MEASUREMENTS M54).
  : 直击和穿透都按实际命中的部位结算。链式跳跃和伤害云不能命中弱点。爆炸异常的引爆继承施加该层异常的命中的弱点倍率和暴击倍率（MEASUREMENTS M54）。
