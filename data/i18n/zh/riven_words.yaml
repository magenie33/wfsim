  触发伤害: [status_damage]
  触发持续时间: [status_duration]
  弹药上限: [ammo_maximum]
  抛射物飞行速度: [projectile_speed]

riven_query_words:
  malus: [负, "-"]
  any_malus: [负任意, 任意负, 负随便, 随便负, 负随意, 任意负面]
  no_malus: [无负, 不带负, 没负, 零负, 无负面]
  with_riven: [紫卡, 带紫卡, 裂罅, 带裂罅, 带卡, riven]
