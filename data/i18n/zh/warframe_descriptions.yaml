warframe_ability_descriptions:
  hakchum: "轻按可跃向空中，再次轻按即可落在目标位置。落地时，对大范围内的敌人施加 冰冻伤害易伤和异常状态效果。\n\n每击中一个敌人可获得冰能量。"
  naraemagi: "通过吸收附近敌人施加的 冰冻异常状态来恢复护盾。如果护盾已满，则获得 超宏防护。\n\n每击中一个敌人可获得冰能量。"
  neote: "挥舞 Narin 的细剑寒霜疾剑进行突刺，对正前方敌人造成 冰冻伤害以及 冰冻和 穿刺异常状态。\n\n每击中一个敌人可获得冰能量。"
  nurinarim: "需要满冰能量才能施放。先祖之灵降临在 Narin 身上，她随即开始剑舞，对周围敌人造成持续伤害。按下攻击键即可发射粉碎性的冰刃斩击，削弱其护甲和护盾。击中被冻结的敌人会使其爆炸，造成大范围 冰冻伤害。攻击被标记的目标不消耗冰能量，并造成更高伤害。"
  absorb: "Nyx 吸收对她造成的伤害，以及困惑的敌人之间造成的伤害，然后将其转化为一道毁灭性的范围爆炸。爆炸后，她将进入短暂的无敌状态，并根据吸收的伤害增加武器伤害。"
  aegis_storm: "升上天空并对敌人降下野火火箭。附近的敌人会被炸向空中，且每隔数秒就会在他们身上生成一颗能量球。当护盾耗尽后敌人将被摔回地面。"
  airburst: "发射一团高密度爆发空气。长按把敌人击飞，轻按则把他们拉向爆炸中央。每击中一个敌人，造成的伤害就会增加。"
  amp: "从环境的分贝水平中获取能量，用来扩大 Octavia 和友军的伤害增幅。同时将附近槌音铮鏦的伤害和范围加倍。"
  antimatter_drop: "发射一颗大型充能反物质粒子，触碰即引爆。通过瞄准来控制粒子方向，射击以进一步充能。造成 爆炸伤害，并必定造成异常状态。"
  aquablades: "通过一把三刃环绕的水形之刃来撕裂敌人。"
  arcsphere: "发射一颗回旋球体，在撞击时造成大量伤害，并且可以定期对周围的敌人产生电击。在初始发射时一次性击中多名敌人来提升伤害。"
  artemis_bow: "召唤出一把强力长弓并发动毁灭性的集中箭矢射击。"
  astral_shell: "将 Orion 包裹在星壳中。外壳受到伤害后会变成诱饵，吸引火力直至被摧毁。\n\n（按住）切换到 Sirius 并使用翠玉之星。"
  avalanche: "唤来变化莫测的雪崩，瞬间冻结并粉碎范围内的所有敌人。"
  axios_javelin: "投掷一支崇敬标枪。当标枪将敌人钉在墙上时，周围的敌人会被拉近并遭受爆发式伤害。"
  balefire: "蓄力并迸发毁灭性的闪电。"
  ballistic_battery: "启动时，这个技能会储存枪支造成的伤害。当再次启动，储存的伤害会导引至下一次射击。"
  banish: "释放一道裂隙能量波来伤害敌人，同时将敌人与队友从 Limbo 目前所在的位面中推出去。"
  bastille: "建立一个包围力场以捕获敌人使他们陷入停滞状态，剥离其护甲并将其转移给 Vauban 和「力场牢狱」范围内的所有友军。\n\n长按技能键来使所有力场牢狱坍塌成为一个破坏性旋涡。"
  blade_storm: "将 Ash 的凶猛影分身投入远处的敌群中。使用「瞬移」可以主动加入这场厮杀。幻影分身可通过 Mod 来升级。"
  blaze_artillery: "部署一个火炮单位来向其面向的敌人发射炸裂的等离子电浆。每击中一名敌人都会增加后续等离子攻击的威力。"
  blazing_chakram: "掷出一个可点燃敌人的火圈，使敌人更易受到伤害。燃烧的敌人可掉落恢复球。蓄力可增强火圈的力量，再次激活技能可瞬间传送至火圈的位置。"
  blessing: "恢复 经验共享范围内友军的生命值和护盾，同时减少他们受到的敌人伤害。"
  blood_altar: "以利爪构筑的祭坛刺穿敌人，为自己及队友吸取生命。"
  bloodletting: "Garuda 以她的生命值为代价换取能量并清除异常状态。"
  breach_surge: "打开一个维度缺口来压倒附近的敌人，并使他们在受到伤害时释放出侵略性的电涌火花。\nWisp 亦可瞄准一个储能池传送，并倍化涌流的范围。"
  brightbonnet: "释放一个可以发出放射脉冲波的复苏蘑菇，给予 Nokko 及其友军  能量，并在短时间内对技能强度施加增益。"
  brimstone: "Uriel 和他的恶魔们创造出一个不断扩大的炽热硫磺圈。使用恶魔技能可以为此技能充能。每次连续命中都会增加造成的伤害。"
  bunraku: "像操纵牵线木偶一样操纵敌人的命运之线。Koumei 的骰子决定了 Koumei 面前的敌人将承受的异常状态数量。\n\n掷出三个六会造成持续的额外异常状态，并将人偶戏效果延伸到 Koumei 背后的敌人。"
  cataclysm: "借由虚空能量的猛烈爆炸撕开一个裂隙位面空间，此空间能短暂持续至下一次致命爆炸发生。"
  catalyze: "从 Lavos 体内迸发出催化探头，并把炽热的凝胶泼向对手。敌人身上每有一种元素异常状态，该技能的伤害便翻倍一次。\n\n长按来为下一次的技能施放注入 火焰伤害。"
  cathode_grace: "在短时内可获取提升的暴击几率和能量恢复，每击杀一名敌人都可以延长「阴极泰来」的持续时间。施放后进入技能冷却时间。"
  celestial_clash: "Sirius & Orion 在宇宙中展开决斗。每次攻击都会消耗一颗众星，造成巨大的附加 |DAMAGE_TYPE|伤害。将星星的颜色与战甲颜色匹配，可提高暴击几率。\n\n|LEFT_ATTACK| Sirius 攻击\n|RIGHT_ATTACK| Orion 攻击\n\n使用技能以生成众星。同一颜色的星星最多只能连续生成两颗。"
  celestial_twin: "Wukong 拔出一根毫毛，以此来制造出一个共同作战的分身。本体使用远程攻击时，分身就会发动近战攻击，而当本体拔出刀剑之时，分身则会进行掩护射击。\n再次使用技能即可命令分身对某个目标发动强化攻击。"
  chaos: "Nyx 释放毁灭性的精神脉冲，使大范围内的敌人迷失方向，并迫使他们自相残杀。困惑的敌人会随机攻击不同派系。"
  chyrinka_pillar: "召唤出一根辐射柱体来减速敌人。它会造成 辐射伤害且必定触发异常状态。"
  cloud_walker: "化身为一团云雾，飘过战场，在令沿途的敌人陷入眩晕的同时治疗 Wukong 和他的分身。"
  coil_horizon: "扔出一颗会在几秒后向内爆炸的回旋球体，或是手动触发。"
  collective_curse: "Kullervo 发出一道诅咒束缚住敌人。当一个被诅咒的敌人受到来自他的伤害时，其他被诅咒的敌人也会受到相应的一部分伤害。"
  condemn: "释放一道能量波动将敌人锁在原地。每一个被锁住的敌人都将强化 Harrow 的护盾。"
  containment_wall: "遏制威胁。Qorvex 召唤出墙壁并使其猛烈撞击在一起，对夹在其中的所有敌人造成伤害并造成 辐射异常状态。"
  coronal_ejection: "投掷 Sirius 的翠玉之光镰刀，造成 火焰伤害，并拾取路径上的所有物品。\n\n（按住）切换到 Orion 并使用重力斩。"
  covenant: "以能量保护附近的友军，对处于「庇佑圣约」保护下的所有人，可吸收一切伤害并将之转化为暴击几率的加成。如果击中弱点，暴击几率将被进一步增幅。"
  crucible_blast: "从 Qorvex 的堆芯中释放光束。对命中的所有敌人造成 辐射伤害，且必定触发异常状态。命中受到 辐射异常状态影响的敌人会引发链式反应爆炸。"
  crush: "磁化附近的敌军的骨头，导致它们自我崩坏。"
  crystallize: "Citrine 召唤水晶分形。分形向前冲，寻找敌人。被分形触碰的敌人会因水晶生长而瘫痪。击中水晶生长以造成暴击伤害。"
  danse_macabre: "喷发出数条夜灵能量光束，形成一个死亡之环扫荡 Revenant 的四周。光束会根据所选的防御调整伤害类型，而 Revenant 遭受的伤害将转化为光束伤害。按住射击键可以额外能量为代价强化异常状态和伤害。被此技能杀死的奴仆将掉落过载护盾可拾取物。"
  dark_verse: "Dante 的诗句从周围敌人身上抽出血液，对他们造成 切割伤害。"
  decoy: "Loki 会部署一个自己的全息复制体来吸引敌人的火力。分身会根据附近敌人的数量获得生命值和护盾。"
  defy: "Wukong 和他的分身进入无敌状态，同时嘲讽敌人，吸引火力。在此期间受到的所有伤害都会被积攒起来，而后 Wukong 会以一记狂怒的棍击将其释放。\n根据积攒的伤害量，Wukong 还会得到额外护甲。"
  demonium: "Uriel 取出他恶魔的灵魂，吸取他们的生命，然后驱使他们去寻找新的受害者。这些灵魂在接触敌人时会爆炸，使敌人容易受到伤害。"
  desecrate: "亵渎亡者尸体，从中搜取额外物品。"
  desiccation: "使用一波带有诅咒的沙尘卷向敌人，致盲的同时窃取对方的生命。"
  desolate_hands: "召唤一群环绕的匕首并寻找敌人的枪支，用小型爆炸来摧毁它们。与「巧躲」结合来使范围加倍。"
  discharge: "Volt 会释放流淌全身的电流。冲击波会麻痹并伤害附近的敌人。处在冲击波边缘的敌人则会被击晕。"
  disometric_guard: "保护自己和附近的友军免受异常状态影响。Qorvex 每次击杀或协助击杀受到 辐射状态影响的敌人时，辐量防护可以阻止的异常状态数量会增加。"
  dispensary: "部署一个装置，片刻之后可产生 3 种拾取物：强化生命球、通用弹药补给包和能量球。"
  divine_spears: "用破地而出的长矛将附近的敌人刺起。再次使用技能可以将幸存的敌人猛拍回地面。"
  doom: "用厄运诅咒附近的敌人。Dagath 对敌人造成的部分伤害会通过命定镰刃再次施加。敌人还会受到 病毒伤害。"
  dread_mirror: "从敌人身上割取生命之力以作为抵挡伤害的盾。蓄力可使抵挡的伤害化为爆裂破片。"
  eclipse: "（短按）暂时减少敌人对 Mirage 造成的伤害。\n（长按）暂时增加 Mirage 的武器伤害。"
  effigy: "Chroma 把他的皮甲转换成一个巨大的警戒护卫，它可以增强附近的盟友并且用元素属性攻击吞噬敌人。"
  electric_shield: "Volt 部署一个电力屏障，能阻挡敌方火力，并对投射物附加电击伤害。\n \n长按可装备屏障，作为移动掩护。"
  elemental_ward: "根据 Chroma 的元素属性，制造攻击性的范围效果。而 Chroma 和附近的盟友会被这股防御能量保护。"
  elude: "只处于没攻击时可闪避所有飞来的子弹。再使用一次可关闭该技能。"
  empower: "提高下个技能的强度。"
  energized_munitions: "提高你的武器弹药效率。"
  energy_vampire: "友军将在伤害被能力吸取标记的敌人同时获得能量。"
  ensnare: "使用活性金属来束缚住一名倒霉的目标，并将缠绕过度靠近的敌人。以长鞭利爪击打可以刷新陷阱来捆绑更多敌人。"
  enthrall: "将目标转化为一个狂热的奴仆。奴仆会攻击他们的友军，并通过伤害奴役更多目标。当目标死亡后，将会分解为可以产生伤害的能量柱。成群的奴仆将持续受到 Revenant 控制，直到此技能结束。"
  evade: "向后跳跃并短暂隐形。弱点击杀可延长持续时间并治疗 Cyte-09。"
  event_horizon: "Orion 形成一个漂移的黑洞，将敌人困于其引力之中。以「重力斩」或「日冕抛射」命中黑洞可延长其持续时间，并改变其移动轨迹：「重力斩」会使其远离 Orion，而「日冕抛射」会将其拉向 Sirius。\n\n（按住）切换至 Sirius 并使用「光之圣域」。"
  exalted_blade: "召唤一把充斥着纯洁光亮和无限力量的剑。"
  exalted_shadow: "当「死亡之井」被注满时，将能够释放 Sevagoth 的幽影形态；并可使用一系列近战技能撕裂敌人。"
  exalted_solo: "一旦反拍节拍器上积聚了能量，丽兹就会燃烧起来，用 火焰焚烧敌人。瞄准时，丽兹以轰鸣的元素声波轰击敌人，可通过技能按键发射不同元素类型的声波。\n\n反拍节奏：本技能不消耗能量。"
  expedite_suffering: "将所有 切割和 毒素异常状态浓缩为一个单次伤害。"
  fangs_of_raksh: "（轻按）亚克什的尖牙会撕裂你的敌人。5 个随机异常状态会在敌人身上堆叠 10 层。当目标死亡时，其身上的异常状态会传播给附近的其他敌人。\n\n（长按）亚克什会守护 Voruna，提升她的异常状态抗性。"
  feast: "将敌人囫囵吞入 Grendel 的腹内。按住技能键即可将腹内的敌人吐出，而这些敌人身上会覆盖着毒性消化液。"
  final_stand: "彰显力量与勇气。跃至空中并连续投掷崇敬标枪。标枪无论是否落地都可以对附近的敌人造成伤害。直接命中敌人将造成更高伤害。"
  final_verse: "Dante 必须在他的「最终诗篇」之前创作另外两首诗句。\n\n胜利：连续施放两个「明之诗句」能够振奋友军，为他们提供增加生命值并赋予超宏防护的增益效果。击杀和助攻会短暂恢复超宏防护。Dante 必须在他的「最终诗篇」之前创作另外两首诗句。\n\n悲剧：连续施放两个「暗之诗句」能够攻击敌人。来自 切割、火焰和 毒素异常状态造成的持续伤害将累积成一次性的爆发。Dante 必须在他的「最终诗篇」之前创作另外两首诗句。\n\n守词者：「明之诗句」后跟着「暗之诗句」，将以夜枭分身为友军提供支援。夜枭分身会与其指定友军同步进行攻击。Dante 必须在他的「最终诗篇」之前创作另外两首诗句。\n\n书页飞羽：「暗之诗句」后跟着「明之诗句」可召唤幽幽鹰扑向敌人，使他们易受触发几率和异常状态伤害的影响，并将敌人的攻击从友军身上转移。"
  fire_blast: "猛击地面以产生一道焚化的等离子波来将敌人击退并剥去他们的护甲。"
  fire_walker: "点燃一道火焰的路径，烧灼敌人并净化友军。传送时可在落地点产生火圈爆破。"
  fireball: "释放一个燃烧的投射物，点燃接触到的目标。"
  forced_perspective: "穿过墨色框架，在目标地点以无敌的飞溅的墨汁出现，对附近敌人施加墨蚀效果。"
  fractured_blast: "用造成 切割异常状态的水晶爆裂切割敌人并使敌人失衡。在此异常状态下的敌人有更高的几率掉落生命球和能量球。"
  freeze: "发射一道极度低温的能量来冻结目标。"
  fusion_strike: "将三股原始能量流汇聚至一个点上，引发巨大爆炸。这些能量流能剥离敌人的护甲和护盾，每个被击中的敌人都会在能量流汇聚时被引爆。召唤的震荡使可施放自己的迷你版融合打击。"
  gloom: "召唤一道放射脉冲波，来诱捕敌人落入技能范围并使其减速，同时吸取他们的生命力并注入「死亡之井」。处在脉冲波范围内的友军每次攻击都会吸取敌人的生命值。"
  glory_on_high: "以毁灭性的力量翱翔天际。使用次要射击引爆审判，造成翠玉之光爆炸。处于圣光审判影响范围内的敌人会增强爆炸效果。"
  golden_instinct: "发射一道短暂的虚空火花指向离你最近的集团奖章、阿耶檀识塑像、稀有储存箱、未扫描的库利亚猫神器或碎片。"
  grasp_of_lohk: "虚空卷须偷取附近敌人的武器，以作为自己的浮空自瞄武器来使用。伤害输出会根据敌人等级增加。抢到的武器数量也决定了「失落之技：否认」的虚空射线的伤害倍数。"
  grave_spirit: "为 Dagath 的武器提供额外的暴击伤害。对被厄运诅咒的敌人效果加倍。遭受致命攻击时短暂地进入幽灵形态并逃脱。"
  gravitic_slash: "使用 Orion 的邪恶镰刀击退敌人，造成 切割伤害和异常状态，同时削弱敌人的护盾和护甲。\n\n（按住）切换到 Sirius 并使用日冕抛射。"
  grenade_fan: "投掷弧线飞行的手雷。\n\n（轻按）破片漩涡\n产生一道锋利无比的弹片漩涡。\n\n（长按）护盾卫星\nProtea 重设手雷，使其变为超载护盾充能器，以保护她自身、她的友军和同伴。当 Protea 的护盾被击穿时，一台守护她的卫星会被摧毁以加倍延长其最小护盾保险的无敌时间。"
  hall_of_mirrors: "Mirage 创造随行的分身以混淆视听并引开敌人。"
  hallowed_ground: "圣化 Oberon 周围的地面，对范围内的所有敌人造成 辐射伤害。同时保护 Oberon 及其友军免受异常状态影响。"
  haven: "在友军周围创造一道护盾光环。敌人会在靠近 Hildryn 时受到 辐射伤害。"
  hideous_resistance: "赋予自身异常状态免疫效果。"
  hysteria: "Valkyr 露出致命的利爪，释放毁灭性攻击的同时治疗自身。Valkyr 在使用利爪时免疫异常状态，且通过咆哮获得的护甲翻倍。"
  ice_wave: "制造一道由锋利冰晶构成的冰浪来对敌人造成大量伤害及缓速效果。"
  immolation: "通过火焰装甲来保护 Ember，随时间的推移保护效果会增强。计量表达到最大度数后会消耗能量。重新施放技能可以熄灭火焰。"
  infernalis: "释放火焰光环，对附近敌人造成 火焰伤害和异常状态。\n\n在空中按下闪避即可化身为毁灭性的火焰流星飞行。"
  inferno: "召唤一颗燃烧的彗星坠落在 Ember 的前面，让扩散的火焰来吞没敌人。"
  infested_mobility: "提高你的跑酷速度。"
  invisibility: "Loki伪装自身，让自己在敌人面前隐形。"
  iron_skin: "Rhino 硬化他的皮肤，隔绝一切伤害并获得超宏防护。"
  jade_stars: "Sirius 召唤翠玉之光微粒，这些微粒会随时间缓慢再生。攻击敌人会发射这些微粒，造成 火焰伤害和异常状态。\n\n（按住）切换到 Orion 并使用星壳。"
  kinetic_plating: "产生可以将一部份所吸收的动能伤害（物理、火焰、冰冻，以及　爆炸）转成能量的动能镀层。同时也保护 Gauss 免于失去平衡或是被击倒。伤害抗性与电池电量是相对的。"
  kumihimo: "编织命运之线。触碰命运之线的敌人会受到随机元素异常状态的影响。\n\n投掷出三个六点会产生可以造成所有元素异常状态的线。"
  landslide: "用爆炸性的滑行冲拳猛击敌人，最多重复三次，形成连击。三拳连击中的每一后续攻击都会增加攻击范围。土石坍方的每次命中都会减少能量消耗。可通过在土石坍方上装备 Mod 增加属性数值。"
  lantern: "制造一群剃刀蝶将敌人转换为一个具有强力吸引力的漂浮信标，在爆炸以前吸引那些不明事理的战友靠近。"
  larva: "生成一个迸裂出卷须的感染荚囊，紧抓附近的敌人并把他们拖入其中。在此期间被杀死的敌人有几率产生一层突变适性。"
  lethal_progeny: "在 Sentient 单位类型之间切换，然后将其召唤到 Caliban 的身旁。震荡使专注于原始近战伤害。直垂使擅长远程攻击并且能造成 Tau 异常状态。召唤使能召唤自己的唱鸣使，并为小队提供护盾保护。"
  light_verse: "Dante 的活力之作赋予他和他的友军超宏防护，并恢复他们的生命值。"
  lights_judgment: "创造一口圣光之井治愈友军并对敌人造成伤害。进入井中的敌人将被\"审判\"标记。"
  lights_sanctuary: "Sirius 会创造一个光之井，治疗并复活友军，同时减少受到的伤害。光之井的体积和威力会缓慢增长。\n\n（按住）切换到 Orion 并使用事件视界。"
  link: "链接激活时，一切受到的伤害将转移给身边的一个敌人。"
  lull: "平静的波浪使敌人速度变慢直到陷入沉睡。被击伤而苏醒的敌人会感到困惑和迷失。短暂的健忘意味着所有醒来的敌人都会忘记沉睡之前所发生的任何事。"
  lycaths_hunt: "（轻按）莱卡斯狩猎以维系狼群。被近战击杀的敌人会掉落生命球，被爆头击杀的敌人则会掉落能量球。击杀受 5 个或更多异常状态影响的敌人来延长「莱卡斯之猎」的时间。\n\n（长按）莱卡斯会守护 Voruna，提升她的重击效率。"
  mach_rush: "猛冲产生一个超级冲刺来撞倒敌人并对电池蓄电，或是撞上坚固的物体来产生强大的震荡波。长按按键以持续冲刺。"
  magnetize: "（轻按）将目标封闭在磁场中，在一段时间内困住附近的敌人，并对其造成伤害。该磁场会吸引环绕 Mag 运动的「护盾极化碎片」和飞溅的弹片进行致命混合。\n（长按）Mag 将自己包裹在一个磁场中，吸收远程攻击，并在一个破坏性锥型域内返还伤害。"
  mallet: "随着节奏对附近的敌人造成伤害，并吸引他们的火力。施加在槌音铮鏦上的伤害会增加其杀伤力。"
  marked_for_death: "击晕一个敌人，对它造成的下一发伤害的一部分也将被应用于周围所有的敌人。"
  mass_vitrify: "创造一圈逐渐扩张的熔融玻璃环，进入环内的敌人将逐渐结晶化。当扩张完毕时，玻璃环将硬化并能阻挡外界火力。环可以从结晶化敌人的护盾和生命中获取额外的力量。使用「琉璃碎击」可以击碎玻璃环，并将尖锐的玻璃碎片击飞。"
  masters_summons: "治疗你的同伴，并让它立刻回到你身边。"
  mend_maim: "〈黑夜型态〉在附近被击杀的每一名敌人都能使友军恢复护盾。〈白昼型态〉使附近敌人陷入 切割异常状态，在〈黑夜型态〉时停用技能来为 Equinox 及友军恢复生命及护盾。在〈白昼型态〉时停用技能来释放出一波切割之力。"
  mercys_kiss: "跳到敌人身上，用 Oraxia 的蜘蛛腿刺穿他们，造成 毒素伤害。用这个攻击击败敌人时，他们将有几率掉落生命球或能量球。"
  merulina: "召唤浪漪珊瑚，这是一种浪涌中的可骑乘生物，也是 K 式悬浮板的灵感来源。浪漪珊瑚通过吸收大部分来袭的伤害从而保护 Yareli。"
  mesmer_skin: "受到 Sentient 能量包围，偏转伤害并震晕胆敢攻击者。奴役被震晕的敌人不消耗能量。"
  metamorphosis: "昼夜交替：〈黑夜形态〉暂时获得额外护盾和护甲；〈白昼形态〉暂时获得额外伤害和速度。"
  metronome: "给予随着 Octavia 的音乐做出相应动作的人各类增益效果。合拍的跳跃提供轻挑快板速度加成。跟上节拍的下蹲给予夜曲的隐匿增益。有节奏地射击可获得歌剧戏曲的多重射击加成。合拍的近战攻击给以强音奏鸣曲伤害加成。"
  miasma: "释放剧毒的瘴气，对范围内的敌人造成 病毒伤害。受到孢子影响的敌人会遭到毒雾更深的感染。"
  mind_control: "Nyx 控制目标的思想，迫使他们为 Tenno 效力。被控制的敌人会增加 辐射触发几率。当 Nyx 射击他们时，伤害倍率也会增加。"
  minelayer: "用精妙的地雷掌控战场。Vauban 的桎梏飞掷丸能束缚并吸引敌人，同时向四面八方发射致命的飞镖。\n\n按住即可发射矢量超载垫，为垫子方向上的敌我双方加速，并提升友军的移动速度和武器伤害。"
  molecular_prime: "使用不稳定的反物质对一个不断扩大的范围内的所有敌人进行填充。按下技能键可减缓敌人移动速度，长按则加快其移动速度。"
  molt: "Saryn 脱落如蛇般的皮肤，在身后留下诱饵吸引敌人的火力。"
  navigator: "操控 Ivara 所发射出的投射物并引导飞向目标处。"
  neutralize: "召唤肃清者，Cyte-09 的显赫狙击步枪。命中弱点的子弹会弹射追踪附近的其它弱点。次要射击发射 冰冻榴弹，完全冻结敌人。"
  noctua: "翻开 Dante 的显赫典籍——夜枭，向他的敌人释放悲剧。"
  nourish: "Grendel 从他腹内的敌人摄取营养并恢复生命值。当他消化时，攻击 Grendel 或被 Grendel 攻击的敌人遭受病毒伤害，并且能量源提供更多的能量。小队队员也会获得这些增益。"
  null_star: "创造反物质粒子环绕 Nova 四周，并自动攻击邻近目标。每个处于活动状态的粒子都会减少对 Nova 的生命值和护盾造成的伤害。"
  omamori: "让御守护符围绕自己，每个护符都有机会使敌人的攻击治愈你，而非伤害你。护符的数量取决于 Koumei 的掷骰结果。\n\n掷出三个六则在御守护符激活期间获得无敌效果。"
  omikuji: "Koumei 预视到了一个美好的未来以及实现它的具体步骤。完成挑战即可获得王令。运气不好的掷骰结果会带来一种减益，但你可以长按技能键以放弃该御神签。\n\n掷出三个六则可以直接获得王令，无需挑战。"
  ophanim_eyes: "Jade 召唤谴责之瞳使附近的敌人减速并分解他们的护盾和护甲。当谴责之瞳凝视友军时，可以将其远距离复活。"
  ophidian_bite: "施放一次毒蛇猛击，通过消耗目标的生命值来治疗 Lavos。\n\n长按来为所有技能注入毒素伤害。"
  overdrive: "通过将扬声器推向极度失真来产生一波具有破坏力且带有 火焰伤害的热浪，同时使敌人更容易受到暴击。\n\n反拍节奏：暴击几率翻倍。该技能造成伤害时，增加撕裂者之嚎的持续时间和 火焰伤害。"
  pacify_provoke: "〈黑夜形态〉时降低周围敌人造成的伤害。〈白昼形态〉时则增加附近友军的技能强度。"
  paralysis: "释放一道破坏性的冲击波使敌人减速，并使其受到的近战伤害增加。"
  parasitic_armor: "牺牲护盾以在一段时间内增强护甲。"
  parasitic_link: "以寄生链接绑定目标。施展对象为友军时，Nidus 与宿主的技能强度和武器伤害都会提升；连结至敌方时，宿主可为 Nidus 承受部分伤害。"
  peacemaker: "在极度的专注之下，Mesa 以她的监察者双枪，对敌人快速地连续射击。"
  penance: "牺牲一定护盾来提升装填和射速，同时将施加于敌人的伤害转化为 Harrow 和附近友军的生命。"
  perspicacity: "自动完成下一次入侵"
  petrify: "Atlas 强硬的凝视将石化敌人并增加他们受到的伤害、治疗石头人，并创造出石化壁垒。当石化的敌人碎裂后，将掉出可以治疗 Atlas 的碎石。"
  photon_strike: "投下一个定位信标，来召唤一场毁灭性的激光火炮打击。对拥有超宏防护的敌人造成双倍伤害。"
  pillage: "掠夺邻近敌人一定比例的护盾与装甲，用以补充自身的护盾与超载护盾。这也会移除 Hildryn 和她队友的异常状态。"
  plein_air: "将附近的敌人绑在漂浮的气球上，气球会向他们喷洒墨蚀。戳破气球，敌人会坠落到地面，飞溅的墨汁会对附近的敌人造成伤害。"
  plunder: "从附近敌人身上掠夺护甲，并为你的技能和武器附加 腐蚀伤害。受到 腐蚀异常状态影响的敌人将提供更多加成。"
  polarize: "发射一道能量脉冲，在耗尽敌人护盾和护甲的同时恢复队友护盾。脉冲留下的碎片会形成「护盾极化碎片」。附近的「护盾极化碎片」会环绕 Mag 并切割敌人，造成 切割异常状态。"
  preserving_shell: "Citrine 通过逐渐衰减的水晶外壳保护自己和附近的盟友。击杀和助攻可以增加外壳的防御能力。"
  primal_fury: "召唤出定海神针并释放猴王的怒火。"
  prism: "放出一个四处发射激光的能量球。再次激活此技能可以引爆炸弹，并致盲附近的敌人。"
  prismatic_gem: "放置一颗发射棱彩光束的宝石。宝石瞄准正受到 Citrine 和其队友武器伤害的敌人。其光束造成火焰、冰冻、毒素和电击异常状态。附近队友的触发几率和触发时间增加。"
  prowl: "进入隐身状态并从毫无警觉的敌人身上偷取道具，或以致命的爆头射击取走猎物的性命。"
  psychic_bolts: "Nyx 释放出一连串精神飞刃，通过意念操控来精准追踪并攻击附近的敌人。击杀敌人后，额外的飞刃会散射到新的目标上。命中敌人会削弱他们的防御，并将一部分防御转移给 Nyx。"
  pull: "Mag 所制造出的磁力漩涡会晕眩敌人。漩涡会将「护盾极化碎片」和被震晕的敌人拉近，并将他们放置在她面前。"
  pulverize: "Grendel 蜷缩成一个球，在此期间他会随时间流逝恢复生命值，并冲撞任何胆敢挡住他的人。跳跃会让 Grendel 朝地面猛砸，并产生一股破坏性的冲击波。"
  pyrotechnics: "用 火焰伤害火柱冲击目标敌人。 \n\n反拍节奏：生成更多火柱。该技能造成伤害时，增加撕裂者之嚎的持续时间和 火焰伤害。"
  quiver: "循环切换并射击出四种战术箭矢之一。隐蔽会创造一个使 Ivara 和队友隐形的固定球体。悬丝则可形成一道滑索。喧扰会发出高频声波并吸引敌人。沉睡之箭能使附近的敌人陷入沉睡。"
  radial_blind: "释放一道明亮的闪光，致盲附近所有的敌人。"
  radial_disarm: "释放一道能量波，解除范围内敌人的射击武器，迫使他们使用近战。"
  radial_howl: "用凶猛的嚎声震慑附近的敌人，并消除 Sentient 敌人所积累的全部抗性。"
  radial_javelin: "发射广域标枪刺穿附近的敌人，造成 切割异常状态。"
  rakhalis_cavalry: "召唤绝灵骥幻影向前冲锋，对其冲锋路径上的所有人造成 病毒伤害。同时削弱被厄运诅咒敌人的防御。"
  rally_point: "将敌人的注意力引向 Styanax。他的决心会鼓舞附近的友军和自己，使其随时间恢复能量。Styanax 和他的队友每次杀敌助攻都会恢复护盾。"
  ravenous: "异常贪婪的蛆虫群包围敌人并据以为食，直到敌人被「致病力」命中并在身上爆发感染为止。突变适性对蛆虫有增益效果，而每击中一名敌人会增加突变适性的累积。"
  razor_gyre: "在旋转的死亡漩涡中向前冲刺。被击中的敌人会受到 Tau 异常状态的影响，使其更易受到其他所有异常状态的伤害。每击中一个敌人，可恢复一部分能量消耗，以及生命值和护盾。被 Sentient 之怒举起的敌人受到额外伤害。"
  razorwing: "缩小身体并进入飞行状态，同时剃刀蝶会攻击附近的敌人并放大他们所受到的伤害。"
  reap: "Sevagoth 的幽影向外飞去来蹂躏路径上的敌人。幸存者会随时间流逝，受到来自「死亡收割」的伤害。亡魂将会注入「死亡之井」。"
  reave: "化为一堵由 Sentient 能量组成的墙壁穿过敌人，吸取所接触敌人的护盾和生命，来自奴仆的效果受到增幅。"
  rebuild_shields: "立即恢复护盾。"
  reckoning: "将附近的敌人迅速举到空中，然后将其狠狠摔下。被该技能击中的会为 Oberon 提供额外护甲，并在死亡时有几率掉落生命球。"
  recompense: "Kullervo 用匕首包围自己。每一把击中敌人的匕首都会恢复他的生命值，但每一把未击中敌人的匕首都会攻击 Kullervo，对他造成少量伤害。Kullervo 拥有满生命值时，会在击中敌人时获得超宏防护。"
  redline: "将 Gauss 的电池过载至超出安全上限，大幅增强他的技能并将射速、攻击速度、装填速度，以及施放速度都设置为超载状态。当超出安全上限时，电弧束会周期性地在 Gauss 身上跃动，并在技能停用时爆炸。"
  regurgitate: "将浸泡在 Grendel 体内消化液里的一个敌人猛烈吐出，让这个被吞噬的生物成为一团毒素投射物，并基于敌人的最大生命值造成额外伤害。其消化液会使附近的敌人减速，并且会溶解他们的护甲。"
  remedium: "Uriel 治愈自己和他的恶魔。如果他的恶魔死去，他们将被复活。"
  renewal: "生成一道保护光环，为 Oberon 及其友军提供护甲加成，并持续恢复友军生命值。在「神圣领域」范围内，治疗效果翻倍。"
  reroot: "恢复为菌宝形态，生成使 Nokko 快速愈合和加速的球体。在此状态下，Nokko 无法被选为攻击目标并且会逐渐恢复。"
  reservoirs: "选择并召唤一个充满尘埃的储能池来帮助 Wisp 和她的友军。急速尘埃可以增加移动和攻击速度。活力尘埃可以增加最大生命值和治疗时间。震荡尘埃可以震晕附近的敌人。"
  resonator: "发射一枚滚球，利用音乐的渲染力令敌人跟随它。与槌音铮鏦相结合便可创造出一个徘徊移动的音波破坏球。"
  rest_rage: "〈黑夜形态〉使目标敌人陷入沉睡；〈白昼形态〉对目标敌人造成更多伤害。"
  resupply: "投掷两个元素弹药包，可立即为当前的武器填满弹匣，同时为武器附加所选的元素伤害和异常状态。重新装填会清除效果。狙击枪可获得额外伤害。\n\n长按技能键以选择元素伤害类型。"
  rhino_charge: "Rhino 向目标冲锋，击倒突进路径上的一切阻碍，并以犀角强烈顶击目标。"
  rhino_stomp: "Rhino 的强力践踏可以扰乱时间秩序，将周围的敌人锁定在时间中。"
  rift_surge: "用裂隙能量涌流冲击附近被裂隙困住的敌人。被击杀时裂隙涌流会被传递到涌流外的一名附近的敌人上。被涌流影响的敌人若离开裂隙，将会引起一个范围​​放逐。"
  rip_line: "Valkyr 发射钩索，将自己拉向命中的目标点。如果钩索命中敌人，则附近的敌人也会被拉向目标点，同时 Valkyr 会发动一次连携近战攻击。"
  rippers_wail: "弹奏吉他，使 Temple 获得短暂无敌并同时获得治疗。每当随着反拍的节奏使用技能时并成功命中敌人时，经验共享范围内的友军武器都会被点亮并获得额外的 火焰伤害加成。\n\n反拍节奏：无敌状态持续时间更长。"
  riptide: "把敌人拖入一个毁灭性的漩涡中，然后用一股爆裂水压将他们炸飞。每个被困在漩涡中的敌人都会增加爆裂造成的伤害。"
  roar: "短时间内让所有附近的战甲提升伤害输出。"
  rotorswell: "Gyre 的机械装置会以令人难以置信的速度高速旋转产生一个电场，并电击附近的敌人。当 Gyre 造成暴击后，被击中的敌人处会产生一个巨大的电流来攻击附近的敌人。"
  rumblers: "召唤两个元素石头近战打手。召唤动作将石化临近 Atlas 的敌人。当它们的生命结束时，石头人将碎成一堆用于治疗的碎石。"
  sandstorm: "化身为沙尘暴。Inaros 吞噬被卷入沙暴中的敌人，并治愈自己。"
  scarab_shell: "将 Inaros 的生命值来转化为护甲。再次使用可以提前终止护甲的转化。保护层减少受到的伤害并使 Inaros 免疫异常状态。"
  scarab_swarm: "召唤带有 腐蚀触发效果的圣甲虫群来攻击敌人。伤害与 Inaros 的生命值成正比。被虫群淹没的敌人死亡后会召唤一个沙土库娃，与 Inaros 并肩作战，并引导圣甲虫找到其他敌人。"
  sea_snares: "生成五个主动寻找敌人并会在触碰时膨胀的水球，同时对受害者造成伤害并使他们无法移动。\n被水球击中的敌人受到所有来源的伤害都会增加。"
  seek: "放置一根天线向前发射扫描波。被探测到的敌人会受到更高的弱点伤害，并可透过墙壁被看到。武器获得穿透。"
  seeking_talons: "蓄力可扩大瞄准区域，接着对瞄准区域里的每一名敌人发射高速利爪；幸存的敌人极有可能受 切割异常状态影响。"
  self_portrait: "绘制墨像来吸收 Follie 和友军所受的伤害。下方墨池挥洒出墨蚀效果。击杀墨池内的敌人可使 Follie 的墨像及墨池的规模不断扩大。"
  sentient_wrath: "猛击地面发射毁灭般的脉冲波。没有被最初的爆炸杀死的敌人会被无助地抛向空中，在短时间内受到放大的伤害。"
  serene_storm: "随着他的「克制」被侵蚀，Baruuk 用「宁静风暴」来使拳脚作出强大的范围攻击。掌握风暴的每一刻会使他恢复「克制」。"
  shadowgraph: "将 Follie 绘影集中的绘影图变为具有战术优势的道具。绘影图生成时会向附近敌人施加墨蚀效果。\n\n长按可打开绘影图轮盘。"
  shadows_of_the_dead: "召唤战死敌人的幽影在短时间内一起作战。"
  shatter_shield: "Mesa 笼罩在能量障壁之中，反射来袭的子弹伤害。"
  shattered_lash: "使用一束玻璃碎片向前方猛击，按住技能键则可改变攻击轨迹，依弧线挥出玻璃束。装备在「琉璃碎击」的 Mod 可以增强技能威力。"
  shock: "发射一个能击晕并伤害目标的伏电射弹。一串电弧以目标为中心，散发式电击附近的敌人。"
  shooting_gallery: "为队友增加额外伤害，同时干扰附近敌人的枪支运作。这个能力会在队伍成员之间转移。"
  shroud_of_dynar: "（轻按）戴拿会使 Voruna 隐身并提高她的移动速度。Voruna 攻击时会结束隐身状态。在隐身状态结束后的短时间内，提升近战攻击的暴击伤害、触发几率、暴击几率并造成 切割异常状态。如果在增益期间近战击杀敌人，这些限时近战增益在每次施放技能时则会延长一次。 \n\n（长按）戴拿会守护 Voruna，提升她的跑酷速度。"
  shuriken: "掷出一枚旋转的手里剑，造成高伤害并把敌人钉在墙上。"
  sickening_pulse: "施放一个脉冲，为敌人身上已有的异常状态效果叠加层数。切割、火焰和 毒素异常状态的伤害（不包括由「恶疾脉冲」自身产生的伤害）将被叠加，从而生成一个全新的异常状态效果，并重新计时"
  silence: "使用静音会使 Banshee 笼罩在一层光环之中，该光环会眩晕敌人，限制其对枪声和战甲攻击的感知及战术反应，并使他们无法激活自身的技能。"
  silken_stride: "展开 Oraxia 的蜘蛛腿，开始狩猎。Oraxia 免疫异常状态并提升最大生命值。她的远程武器充满 毒素伤害。击杀敌人会使其爆发 毒素。\n\n蛛丝游走：轻按冲刺即可跳跃至目标表面。"
  slash_dash: "随着残影对敌人进行冲刺斩击。强大的显赫刀剑斩击造成 切割异常状态。"
  sleight_of_hand: "将附近物品变成诡雷的同时变出一个令敌人难以抗拒的宝石。在黑暗处触碰宝石会爆裂造成范围致盲，在光亮处则产生范围爆炸。通过镜厅的帮助能施放出数个小宝石。"
  smite: "将致命能量聚集于目标，造成巨大伤害并移除其所有防御，包括超宏防护。目标附近的敌人也会受到部分伤害。"
  smoke_screen: "扔出烟雾弹眩晕敌人并阻碍其视线，同时 Ash 进入短暂的隐身状态。"
  snow_globe: "冻结周围所有水气与水分，制造出能用来防御的球形冰罩；冰罩生成时有短暂的无敌时间，此时敌人对冰罩造成的伤害能强化冰罩的耐久度；在相同位置重复施放冰罩可强化其耐久度。"
  sol_gate: "打开一扇通往太阳的传送门，放出毁灭性的纯阳等离子光束。按住射击键会使伤害加倍，但同时也会增加能量消耗。当太阳之门持续攻击敌人时，会对敌人造成更多伤害。"
  sonar: "Banshee 的声纳技能可以利用声波进行定位，借以侦测及追踪敌人，并使队伍成员发觉敌人身上暴露出的致命弱点。"
  sonic_boom: "Banshee 释放一道音波冲击波，将范围内的敌人击退，使其失去战斗力并降低他们的护甲。"
  soul_punch: "如此强烈的打击，把敌人的灵魂化为致命弹头，来杀伤其经过路线上的一切。在这一击中幸存下来的敌人会被标记以待收割，如果敌人在处于标记时被杀死，他就会成为 Nekros「亡者幽影」中的一员。"
  sound_quake: "Banshee 将她所有的声音能量传导至周遭环境，使用超声波反响剧烈撼动目标区域的地面。"
  sow: "向附近的目标种下死亡之种来汲取他们的生命力。收割已播种的死亡之种来引爆受影响的敌人，并按照他们生命值的百分比来造成范围伤害。亡魂将会注入「死亡之井」。"
  spectral_scream: "释放一股毁灭性的元素吐息。轻点技能键来在各个元素之间进行切换，按住技能键来施放技能。选中的元素会应用于 Chroma 所有的技能。"
  spectrorage: "制造一圈旋转的镜面吸引敌人，迫使他们攻击自己的镜像。镜面遭到破坏时将会伤害攻击者；当复数镜面瓦解时将对范围内所有敌人造成伤害。"
  speed: "显现一支电流。Volt 与其队友会获得短暂的移动速度和装填速度增益。"
  spellbind: "把敌人扫到空中，使其丢掉武器；让附近的友军对异常状态免疫。长按此技能来使 Titania 获得免疫效果。"
  splinter_storm: "Gara 的护甲会分裂为碎玻璃组成的漩涡。置身其中的友军可减免敌人的伤害。"
  spores: "使目标受到腐蚀孢子的感染。破坏孢子或杀死宿主可以将孢子扩散到附近的敌人。孢子扩散的时间越久，伤害就越高。"
  sporespring: "释放一个混乱的弹道蘑菇，会追踪敌人并在触碰目标后爆炸反弹。接触 Nokko 的任何蘑菇都会使其活化，脉冲频率翻倍。"
  stasis: "使被裂隙束缚的敌人静止。当其激活时，敌人的子弹将会被截停在半空中，停滞结束后这些子弹将会按照原先的弹道继续行进。"
  stinkbrain: "扔出一个周期性释放有毒孢子的蘑菇，对附近的敌人造成 病毒伤害和异常状态，同时使他们陷入睡眠状态。"
  storm_of_ukko: "虚空以匕首雨的形式回应 Kullervo 的呼唤，向他的敌人倾泄。"
  strangledome: "编织出一张活动的锁链穹顶，禁锢并勒住其中的敌人和胆敢接近的蠢货。在穹顶外部的敌人会借由试着射击他们的同袍来加速其死亡；使用长鞭利爪击打穹顶可使其伤害遍及至任何被困住的敌人身上。"
  switch_teleport: "Loki瞬间和目标交换位置，迷惑敌人。"
  symphony_of_mercy: "循环奏响三首颂歌增强友军。《七人众之力》增加技能强度。《死亡使者》增加武器伤害。《坚韧之灵》增加护盾效率。击杀被审判的敌人可以延长颂歌的持续时间。"
  tail_wind: "在空中按住技能键，来使 Zephyr 悬停并减慢移动速度。在空中时，轻按技能键来向前冲刺，或是瞄准地面对下方的敌人使出俯冲轰击。"
  tectonics: "召唤一堵「大地堡垒」石墙，再次启用技能可使巨石滚动压倒前方的敌人。被敌人攻击的石墙会释放一个区域性的切割伤害，由其失去的生命值来维持。"
  teleport: "瞬移至目标并进行处决。如果处决击杀目标，将为 Ash 恢复一部分消耗的能量。"
  tempest_barrage: "召唤暴风雨弹炮轰目标区域。"
  temporal_anchor: "放置一个「时泊之锚」后的一段时间，Protea 可以把这段时间回溯，来触发一个时空内爆。该内爆伤害会根据从 Protea 放置「时泊之锚」的时候起到回溯的时候为止，这段时间造成的伤害而增加。在此期间丢失或使用的任何物品都会被退还给玩家。\n在「时泊之锚」被激活状态时死亡的话，启用回溯会使 Protea 回到过去，从而使其免于死亡。Protea 仍会处于击倒状态，而「时泊之锚」也会消失。"
  tentacle_swarm: "召唤一只来自深海的生物。它的水之触手从四面八方席卷而来造成严重破坏。"
  terrify: "将恐惧感深植周遭敌人心中，使他们于恐惧之中逃窜。"
  tesla_nervos: "部署一架可以将自身附着在敌人身上的滚子无人机，并向附近区域的任何物体发出炸裂电弧，造成 电击伤害。"
  tharros_strike: "召唤豪勇，Styanax 之盾。挥舞豪勇击退敌人并减少他们的护盾和护甲。每击中一名敌人，Styanax 都会恢复生命值。"
  the_lost: "循环切换三种失落之技。「指责」幻化出虚空裂缝，来让敌人堕落成为友军。「凝视」通过虚空卷须抓住目标，并在目标被释放时，捕捉伤害并对目标造成伤害。「否认」通过一束虚空能量来进行湮灭攻击，并消除 Sentient 抗性。"
  the_vast_untime: "Xaku 的外层结构在毁灭性的爆炸中暂时舍弃，然后以全新的的骨骼形态疾步潜行于战场。受到 Xaku 身体碎片击中的敌人会更难抵御 虚空伤害。在超维炼狱施放期间，Xaku 其他主动技能的持续时间将会冻结，技能终止时恢复。"
  thermal_sunder: "从附近区域吸取动能，为电池蓄电并为附近的敌人带来冰冻状态。长按按键来逆转这一过程，通过消耗电池来使附近的敌人处于火焰伤害的状态中。"
  thurible: "将 Harrow 的能量导引至「聚能焚炉」以产生增幅效果。一旦导引完成，击杀敌人就会给予附近友军能量喷发。导引使用的能量越多，每个击杀获得的返还奖励就越高。弱点击杀可产生额外能量。"
  tidal_surge: "用凶猛的水墙冲垮敌人。"
  tornado: "制造致命的「龙卷云风」，四处搜寻并吞没敌人。「龙卷云风」会造成它们所吸收最多的元素伤害类型。射击被吞没的敌人来造成额外伤害。长按制造固定不动的「龙卷云风」，轻按则制造游走的「龙卷云风」。"
  toxic_lash: "激活时，攻击将造成额外的 毒素伤害；该效果对近战攻击有双倍加成。攻击被孢子感染的敌人将立刻引爆孢子。"
  transmutation_probe: "布下一枚探头，来把生命球和能量球转化为可提供这两种补给的通用补给球，也可把弹药拾取物转换为通用弹药拾取物。探头也会电击近距离的敌人。每击中一名敌人，其它技能的冷却时间减少 1.5 秒。\n\n长按来为下一次的技能施放注入电击伤害。"
  tribute: "当对一名敌人施放技能时，循环切换并从四种增益效果中选取出一种。「荆棘」减免来袭的伤害。「尘埃」降低敌人的精准度。「满月」增加同伴的伤害。「纠缠」使范围内的敌人减速。"
  turbulence: "围绕Zephyr生成一个风护盾，把所有射进来的子弹都偏转到其他方向。"
  ulfruns_descent: "（轻按）Voruna 四肢着地并有 5 次凶残地冲向锁定敌人的机会。在 Voruna 冲向目标时，最强之狼乌尔佛伦会率先发起攻击。狼群们对受到异常状态影响的目标及其周围的敌人造成更高的伤害。致命攻击将使 Voruna 剩余冲锋所造成的伤害翻倍。\n\n（长按）乌尔佛伦守护 Voruna。如果 Voruna 在守护期间死亡，则乌尔佛伦会代替她死去。"
  venari: "命令薇娜丽专注于一名目标；按住技能来切换攻击，保护和治疗形态；若薇娜丽阵亡，使用此技能可以立即复活她。"
  vex_armor: "Chroma 的护盾受损或使用近战武器击杀敌人时会强化小队的护甲。当他损失生命值或使用远程武器杀死敌人时，会增加小队的武器伤害，以弱点击杀则效果加倍。"
  vial_rush: "前冲直撞穿过敌军，并留下破碎药瓶的冰迹。\n\n长按来为下一次的技能施放注入冰冻伤害。"
  virulence: "地面瞬间迸裂出有害的菌状生长物，从被击中的每个敌人身上吸取能量。每击中五名敌人便会使感染突变，倍化其破坏力。"
  voracious_metastasis: "消耗能量治疗自身，并使每名友军获得等值的能量。"
  warcry: "Valkyr 发出激励式咆哮， 为 经验共享范围内的友军增强护甲和攻击速度。"
  warding_halo: "制造出守护火环，对靠近的敌人造成伤害并晕眩。"
  webbed_embrace: "Oraxia 投掷一张蔓延的蛛网，将猎物困住。在不断扩大的蛛网中被捕住的敌人会被困在茧中，并使其受到的易伤效果增加。"
  well_of_life: "在敌人身上创造一道生命之井，吸收附近队友受到的异常状态伤害。队友攻击目标时可获得额外生命值。如果队友死亡，生命之井中的敌人将代替他们死亡。"
  whipclaw: "在欲聋的鞭打声中将敌人击退。装备在「长鞭利爪」的 Mod 可以增强技能威力。"
  widows_brood: "Oraxia 向她前方发射一连串带刺的飞镖，并施加 毒素异常状态。中毒的敌人被击杀后会生成急行蛛。"
  wil_o_wisp: "投射一个 Wisp 的光谱图像来迷惑和分散敌人的注意力。重新启动图像来移动到它所在的位置。按住按键来使图像移动速度更快，并在释放按键时传送到它所在的位置。"
  wormhole: "创造一个虫洞以实现瞬间移动。长按此技能可预览放置位置。"
  wrathful_advance: "（轻按）Kullervo 为重击进行蓄力，然后传送至他的目标身边并发动攻击。他那充满愤怒的集中力会暂时增加他的近战暴击几率。\n（长按）传送至任何标记的地点。"
  wyrd_scythes: "命定镰刃包围 Dagath 并寻找附近的敌人。被击中的敌人会被减速并受到 病毒伤害且必定触发异常状态。镰刃还会传播厄运并延长其持续时间。"
  xatas_whisper: "技能激活期间，所有装备的武器都会造成 虚空伤害。"
warframe_passives:
  narin: "敌人身上每叠加一层 冰冻异常状态，生成霜花拾取物的几率就会提高 1%，并使主武器和副武器获得额外 冰冻伤害，持续 15 秒。Narin 的技能也会获得冰冻伤害加成。"
  ash: "敌人受到的 切割异常状态会让伤害增加 25% 且持续时间延长 50%。"
  ash_prime: "敌人受到的 切割异常状态会让伤害增加 25% 且持续时间延长 50%。"
  atlas: "在地面时无法被击倒。"
  atlas_prime: "在地面时无法被击倒。"
  banshee: "Banshee 施放技能时，会刺穿 20 米范围内敌人的耳朵，并施加最大层数的 穿刺异常状态。此外，Banshee 的武器噪音也会减少。"
  banshee_prime: "Banshee 施放技能时，会刺穿 20 米范围内敌人的耳朵，并施加最大层数的 穿刺异常状态。此外，Banshee 的武器噪音也会减少。"
  baruuk: "每当巧躲子弹，以及每当敌人被镇静或被离手戏法缴械时，Baruuk 的克制力就会逐渐被侵蚀，同时他内心的风暴也会愈演愈烈。随着克制力的下降，Baruuk 会逐渐提升对伤害的抵抗力，且至多能抵抗 50% 的伤害。"
  baruuk_prime: "每当巧躲子弹，以及每当敌人被镇静或被离手戏法缴械时，Baruuk 的克制力就会逐渐被侵蚀，同时他内心的风暴也会愈演愈烈。随着克制力的下降，Baruuk 会逐渐提升对伤害的抵抗力，且至多能抵抗 50% 的伤害。"
  chroma: "展开翅膀以进行一次额外的跳跃和旋身飞跃。"
  chroma_prime: "展开翅膀以进行一次额外的跳跃和旋身飞跃。"
  citrine: "Citrine 使附近的友军每秒恢复 5 生命值。捡起生命球以增加 0.1 生命恢复速率，最多增加 25。"
  citrine_prime: "Citrine 使附近的友军每秒恢复 5 生命值。捡起生命球以增加 0.1 生命恢复速率，最多增加 25。"
  cyte_09: "弱点击杀将使 Cyte-09 的弱点暴击几率增加 1%，最高可达 300%，持续至当前任务结束。"
  dagath: "Dagath 拾取能量球和生命球时有 35% 几率使效果提高 300%。"
  dante: "夜枭扫描目标，为资料库记录信息。攻击已完全扫描的目标时增加 50% 触发几率。"
  ember: "从每个在 经验共享范围内受到 火焰异常状态影响的敌人身上获得 5% 技能强度。"
  ember_prime: "从每个在 经验共享范围内受到 火焰异常状态影响的敌人身上获得 5% 技能强度。"
  equinox: "10% 的生命球会转化为能量，同时 10% 的能量球会转化为生命。"
  equinox_prime: "10% 的生命球会转化为能量，同时 10% 的能量球会转化为生命。"
  excalibur: "当 Excalibur 持剑时，其伤害会提升 10% 且攻击速度提升 10%。"
  excalibur_prime: "当 Excalibur Prime 持剑时，其伤害会提升 10% 且攻击速度提升 10%。"
  excalibur_umbra: "Umbra 可以在不受传识控制的情况下自主战斗。持剑时，其伤害会提升 10% 且攻击速度提升 10%。"
  follie: "墨蚀：Follie 的技能使敌人身上沾满墨水，使其移动速度减缓 50%，持续 10 秒。受墨蚀效果影响的敌人有 20% 的几率掉落生命球和能量球。"
  frost: "Frost 技能造成的冰冻异常状态持续时间延长 100%。Frost 从每个在 经验共享范围内受到 冰冻异常状态影响的敌人身上获得 50 护甲。"
  frost_prime: "Frost 技能造成的冰冻异常状态持续时间延长 100%。Frost 从每个在 经验共享范围内受到 冰冻异常状态影响的敌人身上获得 50 护甲。"
  gara: "当 Gara 施放技能时，有几率使周围的敌人陷入目盲状态 10 秒。"
  gara_prime: "当 Gara 施放技能时，有几率使周围的敌人陷入目盲状态 10 秒。"
  garuda: "每一个 Garuda 所击杀的敌人都会为她暂时增加伤害，最高达到 100%。如果她没有装备近战武器，则会使用其利爪进行斩击。"
  garuda_prime: "每一个 Garuda 所击杀的敌人都会为她暂时增加伤害，最高达到 100%。如果她没有装备近战武器，则会使用其利爪进行斩击。"
  gauss: "移动时会产生一股电流来填充 Gauss 的电池。根据电池的电量，护盾恢复速度最多可提升 120%，同时恢复延迟最多可降低 80%。"
  gauss_prime: "移动时会产生一股电流来填充 Gauss 的电池。根据电池的电量，护盾恢复速度最多可提升 120%，同时恢复延迟最多可降低 80%。"
  grendel: "每名被吞噬的敌人可提供 250 额外护甲。"
  grendel_prime: "每名被吞噬的敌人可提供 250 额外护甲。"
  gyre: "每个对敌人产生影响的电击异常状态使 Gyre 的技能有 10% 几率对该敌人造成暴击伤害。"
  gyre_prime: "每个对敌人产生影响的电击异常状态使 Gyre 的技能有 10% 几率对该敌人造成暴击伤害。"
  harrow: "拥有双倍过载护盾容量。\n任务开始时获得最大能量。"
  harrow_prime: "拥有双倍过载护盾容量。\n任务开始时获得最大能量。"
  hildryn: "Hildryn 的满护盾保险时间很长。在她的护盾耗尽后，她在 3.5 秒内免疫伤害。"
  hildryn_prime: "Hildryn 的满护盾保险时间很长。在她的护盾耗尽后，她在 3.5 秒内免疫伤害。"
  hydroid: "被 Hydroid 伤害的敌人更容易受到 腐蚀异常状态的影响，首次触发降低护甲 50%。"
  hydroid_prime: "被 Hydroid 伤害的敌人更容易受到 腐蚀异常状态的影响，首次触发降低护甲 50%。"
  inaros: "当 Inaros 受到致命伤害时，他会将自己封入石棺中，并化身为沙土攻击敌人，吸取他们的生命力来复活自己。"
  inaros_prime: "当 Inaros 受到致命伤害时，他会将自己封入石棺中，并化身为沙土攻击敌人，吸取他们的生命力来复活自己。"
  ivara: "侦测周围 50 米内的敌人。"
  ivara_prime: "侦测周围 50 米内的敌人。"
  jade: "Jade 对生与死的深刻理解赋予她两个光环 Mod 槽位。某些技能会施加'审判'，使敌人获得 50% 易伤，持续 10 秒。"
  khora: "薇娜丽，这只凶猛的库娃，与 Khora 并肩战斗，并为她提供 15% 的速度加成。如果被击杀，薇娜丽会在 45 秒后复活。"
  khora_prime: "薇娜丽，这只凶猛的库娃，与 Khora 并肩战斗，并为她提供 15% 的速度加成。如果被击杀，薇娜丽会在 45 秒后复活。"
  koumei: "每隔 60 秒，Koumei 的一件武器将会造成随机异常状态，持续 60 秒。"
  kullervo: "当 Kullervo 使用任意近战武器攻击时，其重击效率 +75%，并且重击准备速度 +100%。"
  lavos: "能量球和通用补给球可使 Lavos 对异常状态免疫 10 秒。\n\n长按任意技能键，来在下一次施放时注入额外的元素伤害和异常状态。"
  lavos_prime: "能量球和通用补给球可使 Lavos 对异常状态免疫 10 秒。\n\n长按任意技能键，来在下一次施放时注入额外的元素伤害和异常状态。"
  limbo: "闪避动作可以进入或退出裂隙位面。进入位面时会留下一个持续 5 秒的小型裂隙传送门。身处裂隙位面之中时，能量会缓慢恢复，并且每一个在裂隙位面被杀死的敌人都会产生 10 点能量恢复。"
  limbo_prime: "闪避动作可以进入或退出裂隙位面。进入位面时会留下一个持续 5 秒的小型裂隙传送门。身处裂隙位面之中时，能量会缓慢恢复，并且每一个在裂隙位面被杀死的敌人都会产生 10 点能量恢复。"
  loki: "壁面攀附时间提升 10 倍。"
  loki_prime: "壁面攀附时间提升 10 倍。"
  mag: "Mag 会吸引附近的物品，以便捡取。"
  mag_prime: "Mag 会吸引附近的物品，以便捡取。"
  mesa: "双持次要武器的射速提升 15%，单持次要武器的装填速度提升 25%。未装备近战武器时，获得 50 额外生命值。"
  mesa_prime: "双持次要武器的射速提升 15%，单持次要武器的装填速度提升 25%。未装备近战武器时，获得 50 额外生命值。"
  mirage: "滑行持续时间延长 85% 且机动动作的速度加快 50%。"
  mirage_prime: "滑行持续时间延长 85% 且机动动作的速度加快 50%。"
  nekros: "每当周围 10 米范围内有敌人死亡时，恢复 5 生命。"
  nekros_prime: "每当周围 10 米范围内有敌人死亡时，恢复 5 生命。"
  nezha: "滑行速度加快 60% 且距离增加 35%。"
  nezha_prime: "滑行速度加快 60% 且距离增加 35%。"
  nidus: "如果 Nidus 在被击杀时拥有至少 15 层突变适性，那么这 15 层突变适性会被消耗掉；同时 Nidus 会获得 5 秒无敌时间并恢复 50% 的生命。"
  nidus_prime: "如果 Nidus 在被击杀时拥有至少 15 层突变适性，那么这 15 层突变适性会被消耗掉；同时 Nidus 会获得 5 秒无敌时间并恢复 50% 的生命。"
  nokko: "当 Nokko 受到致命伤害后会恢复为菌宝形态，其激活的蘑菇会发光，触碰后可使 Nokko 复活。生成的光球会有加速效果，但不会提供治疗效果。如果未能及时到达发光蘑菇，Nokko 将自动复活。"
  nova: "处于减速状态下的敌人被击杀后有 15% 几率掉落生命球。处于加速状态下的敌人被击杀有 15% 几率掉落能量球。"
  nova_prime: "处于减速状态下的敌人被击杀后有 15% 几率掉落生命球。处于加速状态下的敌人被击杀有 15% 几率掉落能量球。"
  nyx: "Nyx 的 经验共享范围内每有一个困惑的敌人，就会为她的主要武器和次要武器增加 40% 暴击几率。最高增加 200% 暴击几率。"
  nyx_prime: "Nyx 的 经验共享范围内每有一个困惑的敌人，就会为她的主要武器和次要武器增加 40% 暴击几率。最高增加 200% 暴击几率。"
  oberon: "当 Oberon 拾取 生命球时，他与 经验共享范围的友军获得正义否决，使玩家抵挡下一次受到的伤害。最多可叠加 3 层。"
  oberon_prime: "当 Oberon 拾取 生命球时，他与 经验共享范围的友军获得正义否决，使玩家抵挡下一次受到的伤害。最多可叠加 3 层。"
  octavia: "每当使用技能后，Octavia 及其周围 15 米内的队友就会在 30 秒内恢复 30 点能量。"
  octavia_prime: "每当使用技能后，Octavia 及其周围 15 米内的队友就会在 30 秒内恢复 30 点能量。"
  oraxia: "壁面攀附可获得「捕食者的潜伏」效果，使 Oraxia 在 8 秒内隐身。"
  orion_sirius: "在两者之间切换可使接下来的 2 次施放获得 45% 技能效率。\n\n当能量低于 50 时，Sirius & Orion 会互相窃取能量。"
  protea: "每第 4 次施放技能可获得 +100% 的技能强度。"
  protea_prime: "每第 4 次施放技能可获得 +100% 的技能强度。"
  qorvex: "Qorvex 所持有武器具有额外的 3 穿透。"
  revenant: "每当护盾被耗尽时，释放一道能造成 100 伤害并将周围 7.5 米内的敌人击倒的冲击波。"
  revenant_prime: "每当护盾被耗尽时，释放一道能造成 100 伤害并将周围 7.5 米内的敌人击倒的冲击波。"
  rhino: "从高处落地时会产生一道能造成 100 伤害的冲击波。"
  rhino_prime: "从高处落地时会产生一道能造成 100 伤害的冲击波。"
  saryn: "对敌人施加的异常状态持续时间延长 25%。"
  saryn_prime: "对敌人施加的异常状态持续时间延长 25%。"
  sevagoth: "Sevagoth 死亡时，会化身成 Sevagoth 的幽影；通过收集重建他的墓碑所需的灵魂来使他复活。"
  sevagoth_prime: "Sevagoth 死亡时，会化身成 Sevagoth 的幽影；通过收集重建他的墓碑所需的灵魂来使他复活。"
  sirius_orion: "在两者之间切换可使接下来的 2 次施放获得 45% 技能效率。\n\n当能量低于 50 时，Sirius & Orion 会互相窃取能量。"
  styanax: "Styanax 的暴击几率随着他的护盾量而提升，标枪武器可获得双倍增益。"
  styanax_prime: "Styanax 的暴击几率随着他的护盾量而提升，标枪武器可获得双倍增益。"
  temple: "与反拍节拍器同步施放技能，以增强技能效果的同时提升 50% 的技能效率。"
  titania: "每当 Titania 施放一个技能时，她将为自身和附近队友恢复生命值。"
  titania_prime: "每当 Titania 施放一个技能时，她将为自身和附近队友恢复生命值。"
  trinity: "在 经验共享范围内的队友将获得等同于 Trinity 最大能量值的 50% 的生命值加成。"
  trinity_prime: "在 经验共享范围内的队友将获得等同于 Trinity 最大能量值的 50% 的生命值加成。"
  uriel: "Uriel 统领、强化并守护着三位独特的恶魔。\n\n缚魔：束缚并减缓敌人，将他们串联起来。对链条中任意敌人造成的伤害会转移到所有被束缚的敌人身上。（通过炼狱火解锁）\n\n苦魔：吸附在敌人身上，造成持续伤害。如果被击杀，会生成一个痛苦之环。（通过恶魔再生解锁）\n\n烙魔：在倒下的敌人身上刻下恶魔符文，拾取这些符文可以增加射速和 火焰伤害。（通过魔群解锁）"
  valkyr: "Valkyr 使用近战武器命中或击杀敌人时会积累狂怒值，最高提升 300% 近战伤害。当狂怒值高于 150% 时，受到致命伤害会消耗狂怒值避免死亡并获得 5 秒无敌状态。"
  valkyr_prime: "Valkyr 使用近战武器命中或击杀敌人时会积累狂怒值，最高提升 300% 近战伤害。当狂怒值高于 150% 时，受到致命伤害会消耗狂怒值避免死亡并获得 5 秒无敌状态。"
  volt: "在地面上移动时可以积蓄电能，每移动一米可积攒 1000 电击伤害，积攒的伤害会在下一次攻击时释放。"
  volt_prime: "在地面上移动时可以积蓄电能，每移动一米可积攒 1000 电击伤害，积攒的伤害会在下一次攻击时释放。"
  voruna: "Voruna 从不孤军奋战。在任务中，长按技能可以召唤每匹狼独一无二的被动能力。"
  voruna_prime: "Voruna 从不孤军奋战。在任务中，长按技能可以召唤每匹狼独一无二的被动能力。"
  wisp: "在维度之间流动，Wisp 在空中时对敌人来说是隐形的。"
  wisp_prime: "在维度之间流动，Wisp 在空中时对敌人来说是隐形的。"
  wukong: "在承受致命伤害后，Wukong 会自动使用他所掌握的其中一种保命神技。每次任务中，这些神技只能发动三次。"
  wukong_prime: "在承受致命伤害后，Wukong 会自动使用他所掌握的其中一种保命神技。每次任务中，这些神技只能发动三次。"
  xaku: "在受到范围攻击时，减免 25% 的伤害，并有几率避开武器伤害。"
  xaku_prime: "在受到范围攻击时，减免 25% 的伤害，并有几率避开武器伤害。"
  yareli: "当 Yareli 移动超过 1.5 秒时，她的次要武器获得 +200% 的暴击几率。"
  yareli_prime: "当 Yareli 移动超过 1.5 秒时，她的次要武器获得 +200% 的暴击几率。"
  zephyr: "在空中时，Zephyr 移动更快且下落更慢，同时武器也会获得 150% 的暴击几率。"
  zephyr_prime: "在空中时，Zephyr 移动更快且下落更慢，同时武器也会获得 150% 的暴击几率。"
