  theorem_demulcent:
    - "站在残差赋能产生的区域内时，武器伤害每秒提高 2%，最多叠加到 15 层。离开此区域后，该效果会持续 20 秒。"
    - "站在残差赋能产生的区域内时，武器伤害每秒提高 4%，最多叠加到 15 层。离开此区域后，该效果会持续 20 秒。"
    - "站在残差赋能产生的区域内时，武器伤害每秒提高 6%，最多叠加到 15 层。离开此区域后，该效果会持续 20 秒。"
