  "reloading from a FULLY DEPLETED magazine produces an 8 m shockwave dealing 10 Electricity at 100% status plus a forced Electricity proc (wiki). It is a reload-triggered explosion this engine has no shape for, and this sim always empties the magazine — so it would fire on every reload here and is not counted at all": "从完全打空的弹匣装填会产生一次 8 米冲击波，造成 10 点电击伤害、100% 触发几率，外加一次必定触发的电击（维基）。这是一次由装填触发的爆炸，本引擎没有这种形状；而本模拟总是把弹匣打空 —— 所以它在这里会在每一次装填时触发，因此完全没有被计入"
  "reloading while SPRINTING gives +25% reload speed (+50% on Gauss) — this arena does not move, so the reload here is always the standing one": "冲刺中装填会获得 +25% 装填速度（在 Gauss 身上是 +50%）—— 这个战场不会移动，所以这里的装填永远是站定的那一次"
  "reloads and transforms": 换弹与变身
  "reloads included": 含换弹
  "rename": 重命名
  "req pins the slot — the pool marks give way": 必带会钉死这个槽位 —— 候选标记随之清除
  "req pins the tier — the pool marks give way": 必带会钉死这一层 —— 候选标记随之清除
  "req": 必带
  "rockets aim for the torso, so a high headshot percentage is not reachable in play even though this entry will honour whatever is set": 火箭瞄准躯干，所以实战中达不到高爆头率，尽管这个条目会照你设定的数值计算
  "rolls": 区间
  "running {n} simulations…": 正在跑 {n} 次模拟…
  "running": 个生效中
  "runs killed": 场有击杀
  runs: 次
  "save as a new build": 存为一套新配装
  saved: 个已保存
  "scenario": 场景
  "search by name or effect; mark each as pool (search) or required": 按名称或效果搜索；把每张标成候选池（搜索）或必带
  "search": 搜索方案
  "seeded by the optimizer — not yet a player submission": 由优化器预填，尚非玩家提交
  "seeking rounds must travel 5 metres before they begin to seek, which at contact range makes them ordinary bullets": "追踪弹必须先飞 5 米才开始追踪，所以在贴脸距离它们就是普通子弹"
  "selected": "个已选中"
  "self-stagger is not modelled — the wiki notes an explosion at your feet can interrupt the 2-round burst so only one rocket leaves, and nothing damages the player in this fight": 自身踉跄尚未建模 —— wiki 提到脚下的爆炸会打断这个 2 发点射、让只有一发火箭射出，而这场战斗里没有任何东西会伤到玩家
  "semi-auto": 半自动
  "sent — the board re-scores every 20 minutes, so it appears there within about 20, at most 40": 已上传——榜单每 20 分钟重算一次，所以大约 20 分钟内会出现，最多 40 分钟
  "sentinels cannot equip arcanes": 守护武器无法装备赋能
  "share of the engagement": 整场交战的占比
  "share": 分享
  "sharing is off for now — this link opened the weapon instead": 分享功能暂时关闭 —— 这条链接为你打开了对应的武器页
  "shots BOUNCE off surfaces up to 4 times, which the page's own tips call worth doubling a shot's hit count when aimed off a wall behind the target — there are no surfaces here": "弹体会在表面弹跳，最多 4 次。页面自己的技巧栏说，朝目标身后的墙打反弹可以让一发的命中数翻倍——本场没有任何表面"
  "shots RICOCHET once (wiki) and this arena has no walls to bounce off": "弹丸会反弹一次（维基），而这个战场没有墙可以反弹"
  "shots RICOCHET once (wiki), which is what lets a player kill something behind cover — this arena has no walls to bounce off": "弹丸会反弹一次（维基），这正是玩家可以打掉掩体后敌人的原因 —— 这个战场没有墙可以反弹"
  "simulate every mod IN THIS SLOT and show what each would change": 把这个槽换成每一张 mod 各模拟一遍，标出击杀速度会变化多少
  "simulating this build in the current scenario…": 正在用当前场景模拟这套配装…
  "slot": 槽位
  "snap": "吸附"
  "spread": "范围"
  "stacks the run STARTS with. 0 = earned in-fight on this buff's own trigger, which is what a fight that has not been in contact for a few seconds looks like": 本局开始时的层数。0 = 在战斗中靠这个增益自己的触发条件挣回来，也就是"打了一阵、但刚有几秒没接敌"的状态
  "start submitting": 开始提交
  "still measuring — {a} of {b} options ranked so far, and the order moves until it finishes": 还在测量——已排完 {a}/{b} 个选项，排序在结束前会一直变动
  "stop submitting": 停止提交
  "stop": 停止
  "stopped — nothing was measured": 已停止 —— 没有测出任何结果
  "submitted by players, scored here — read-only": 玩家提交，由我们自己跑分 —— 只读
  "switching firing modes takes THREE SECONDS, can be interrupted, and is scaled by Reload Speed (wiki) — this sim never switches, so each mode is measured as if it were the whole weapon and the cost of changing between them is invisible": "切换射击模式需要三秒，可以被打断，而且受装填速度影响（维基）—— 本模拟从不切换，所以每个模式都是当作整把武器来测量的，切换的代价在这里是看不见的"
  "switching into or out of the Incarnon form fully reloads the normal magazine, which is a free reload the sim does not give you": 进出灵化形态都会把普通形态的弹匣装满 —— 这是一次白送的装填，模拟没有给你
  taken: 实际承受
  "switching modes takes ONE SECOND of animation (0.5 s on Wisp) and this sim never switches — each mode is measured as if it were the whole weapon": "切换模式有一秒的动作（在 Wisp 身上是 0.5 秒），而本模拟从不切换 —— 每一个模式都是当作整把武器来测量的"
  "takes every type as written": 所有伤害类型都按原样结算
  "testing build": 测试配装
  "that share link could not be read": 这条分享链接读不出来
  "that share link is for a weapon this build of the site does not have": 这条分享链接指向本站还没有的武器
  "the +1 slot — pool = slot options, req = pin one; nothing marked = the slot stays empty": 专用槽 —— 候选池 = 该槽的可选项，必带 = 钉死一张；一张都不标 = 该槽留空
  "the +50% Reload Speed while SPRINTING is not modelled: the sim's player stands still, and reloading on the move is a play pattern rather than a stat (Gauss and Gauss Prime double it to +100%, which is a Warframe-layer bonus this engine has no place for either)": 冲刺时 +50% 装填速度尚未建模：模拟里的玩家站着不动，边跑边装填是一种打法而不是一项属性（Gauss 和 Gauss Prime 会把它翻倍到 +100%，那是战甲层的加成，这个引擎同样没有位置容纳）
  "the 0.8 second EMBED DELAY before the slug detonates, during which it pulls enemies within 6 metres in — the pull is a crowd mechanic and the delay is time this arena does not charge": "弹丸引爆前有 0.8 秒的嵌入延迟，期间它会把 6 米内的敌人拉过来——牵引是一种人群机制，而那段延迟是本场不计价的时间"
  "the 11-degree spread is not modelled — this arena has one target at zero distance, so all eleven pellets always land on it": 11 度的散布尚未建模 —— 这个战场只有一个零距离的目标，所以十一颗弹丸永远全部命中
  "the 20-40 degree spread is not modelled — this arena has one target at zero distance, so all six pellets always land on it": 20-40 度的散布尚未建模 —— 这个战场只有一个零距离的目标，所以六颗弹丸永远全部命中
  "the 5% Life Steal on headshots, which is the other side of the same trade and equally invisible with nothing to heal from": "爆头附带的 5% 吸血，是同一笔交易的另一面，在没有东西可回复的情况下同样看不见"
  "the 8-degree spread is not modelled — this arena has one target at zero distance, so all six missiles always land on it": 8 度的散布尚未建模 —— 这个战场只有一个零距离的目标，所以六枚导弹永远全部命中
  "the ACCURACY improves during the spool as well (wiki), which is the half of it the page does state — this entry carries the settled cone, so a burst that would open wide here opens tight": "转膛过程中命中率也会提升（维基），这是页面确实写出来的那一半 —— 本条目带的是转满之后的散布，所以一段在游戏里会打得很散的点射，在这里一开始就是收紧的"
  "the ALTERNATE FIRE 'ejects the entire magazine into a single shot that spawns an automated turret that shoots enemies' (wiki), and the module gives that turret's expiry blast 75 Blast for the full 75 rounds. A deployed thing that picks its own targets and fires on its own clock is not a firing mode, and this engine has no shape for one — so the turret is not counted at all, and neither is the magazine it costs": "副攻击「把整个弹匣打成一发，生成一座会自动射击敌人的炮台」（维基），模块给那座炮台到期时的爆炸 75 点爆炸伤害、代价是整整 75 发。一个自己选目标、按自己的时钟开火的部署物不是一种射击模式，本引擎没有这种形状 —— 所以这座炮台完全没有被计入，它花掉的那个弹匣也没有"
  "the ALTERNATE FIRE adjusts the ZOOM and nothing else (wiki), so this weapon has one attack and no mode — there is nothing for the builder's Mode control to offer, and this arena has no field of view to trade anyway": "副攻击只调整倍率，别的什么都不做（维基），所以这把武器只有一种攻击、没有模式 —— 配装页的模式控件没有东西可选，而且这个战场本来也没有视野可以拿来换"
  "the ARCHWING column of this weapon is not offered — in space it is a single 440-damage Impact/Heat projectile with a 13% status chance instead of eleven hit-scan pellets at 1.3%, which is a different weapon rather than a restated one": 这把武器的太空数据列没有提供 —— 在太空里它是一发 440 伤害的冲击/火焰弹道、触发率 13%，而不是十一颗触发率 1.3% 的即时命中弹丸；那是另一把武器，不是同一把的另一组数字
  "the AUTO-SPOOL ramp is not modelled — the page gives this trigger as Auto-Spool and the fire rate here is the spooled-up {rate}/s from the first shot, so a short burst is faster in this sim than in game": 转膛加速尚未建模 —— 页面给的触发方式是 Auto-Spool，而这里从第一发就按转满的 {rate}/秒 计算，所以短点射在模拟里比游戏里快
  "the Arch-Gun Deployer's five-minute cooldown is not modelled — when the reserve runs dry the weapon is gone for the rest of a real mission, and this arena simply stops firing": "空战枪投放器的五分钟冷却尚未建模 —— 备弹打空后，真实任务里这把枪整局就没了，而这个战场只是停火"
  'the BATTERY DISCHARGE that fires when the magazine empties: a 20 m pulse for 100 Impact. It is now fully SPECIFIED and merely unbuilt — the page states its whole scaling rule and I had declared it unknowable: "This is affected by base damage, Faction Damage Bonus, and Firestorm / Primed Firestorm; but not by elemental or multishot bonuses." So: the base-damage bucket and the faction column reach it, elements and multishot do not, and its RADIUS takes the blast-radius mods the shot''s own explosion refuses. Its status is a 100% CHANCE rather than a forced proc, so status mods push it past one proc and a negative-status riven makes it miss': 弹匣打空时释放的电池放电：20 米范围、100 点冲击。它现在是完全有据可依、只是还没实现 —— 页面把整条缩放规则都写明了，而我曾判定它不可知：「受基础伤害、派系伤害加成、以及烈火风暴／至尊烈火风暴影响；但不受元素或多重射击加成影响」。也就是说：基础伤害桶和派系列会作用到它，元素和多重射击不会，而它的半径吃这发子弹自己的爆炸所拒绝的爆炸半径 mod。它的触发是 100% 几率而不是强制触发，所以触发 mod 能把它推到一次以上，而负触发的紫卡会让它落空
  "the BEAM'S CONE is not modelled — the wiki says the primary fire `deals radial damage varying from of 1 to 4 meters in a cone shape`, and publishes no damage figure for it anywhere; only the direct beam damage is applied here, so this weapon reads low against anything the cone would have caught": 光束的锥形范围伤害尚未建模 —— wiki 写明主射击「造成 1 到 4 米不等的锥形范围伤害」，但任何地方都没有公布它的伤害数值；这里只应用了光束的直接伤害，所以面对本会被锥形覆盖到的目标时，这把武器的数字偏低
  "the BEAM'S THICKNESS, 0.15 m and the largest of any continuous weapon, is not modelled — this arena's beam is a ray, so a build that would clip an enemy with the edge of the beam misses here, and Heavy Caliber's accuracy penalty costs more in this sim than it does in game": "光束的粗细（0.15 米，所有连续武器里最粗的）没有建模 —— 这个战场里的光束是一条射线，所以在游戏里用光束边缘擦到敌人的情况在这里算作射空，「Heavy Caliber」的精度惩罚在本模拟里的代价因此比游戏里更大"
  "the BLIGHT syndicate effect, which on a proc blinds enemies in a radius and opens them to finishers (wiki) — it fires off a syndicate standing meter this sim does not track, and blindness is crowd control this arena's enemies do not suffer": "「Blight」集团特效：触发时让一定范围内的敌人致盲，并让他们可以被处决（维基）—— 它由一条本模拟不跟踪的集团能量槽驱动，而致盲是这个战场里的敌人不会承受的控制效果"
  "the Blob Explosion is not modelled — this entry carries only the Blob Embed": Blob Explosion 尚未建模 —— 这个条目只装了 Blob Embed
  "the Bullet Attractor itself — it deals no damage, and what it is actually worth (redirecting enemy fire, letting one punch-through round hit twice) needs enemies that shoot back and a second target": 虚空异常的子弹吸引力场本身——它不造成伤害，它真正的价值（把敌人的子弹引开、让一发穿透弹命中同一个敌人两次）需要会还击的敌人和第二个目标才能体现
  "the Burst Shot is not modelled — this entry carries only the Charged Shot": Burst Shot 尚未建模 —— 这个条目只装了 Charged Shot
  "the CATALOG gives this weapon's lingering its own Condition Overload row at 4100% of its base ('Mutalist Cernos | Charged AoE Toxin Cloud | AoE | 5 | 205 | 4100% | Adding'), and there is no per-part CO fraction here — `co_base_fraction` is one number per ENTRY. So the part takes the term at 100% of its own base and a status-stacking build is understated on it": "目录给这把武器的毒云单独列了一行 Condition Overload，按它自身基础值的 4100%（「Mutalist Cernos | Charged AoE Toxin Cloud | AoE | 5 | 205 | 4100% | Adding」），而这里没有「按部件」的 CO 系数 —— `co_base_fraction` 每个条目只有一个数。所以这个部件按它自身基础值的 100% 吃这一项，一套堆异常状态的配装在它身上被低估了"
  "the CATALOG gives this weapon's radial its own Condition Overload row at 164% of its base ('Trumna | Main-fire Hitscan Radial Attack | Hitscan | 55 | 90 | 164% | Adding'), and there is no per-part CO fraction here — `co_base_fraction` is one number per ENTRY. So the part takes the term at 100% of its own base and a status-stacking build is understated on it": "目录给这把武器的爆炸单独列了一行 Condition Overload，按它自身基础值的 164%（「Trumna | Main-fire Hitscan Radial Attack | Hitscan | 55 | 90 | 164% | Adding」），而这里没有「按部件」的 CO 系数 —— `co_base_fraction` 每个条目只有一个数。所以这个部件按它自身基础值的 100% 吃这一项，一套堆异常状态的配装在它身上被低估了"
  "the CATALOG gives this weapon's radial its own Condition Overload row at 200% of its base ('Opticor Vandal | Charged Hitscan Radial Attack | Hitscan | 300 | 600 | 200% | Adding'), and there is no per-part CO fraction here — `co_base_fraction` is one number per ENTRY. So the part takes the term at 100% of its own base and a status-stacking build is understated on it": "目录给这把武器的爆炸单独列了一行 Condition Overload，按它自身基础值的 200%（「Opticor Vandal | Charged Hitscan Radial Attack | Hitscan | 300 | 600 | 200% | Adding」），而这里没有「按部件」的 CO 系数 —— `co_base_fraction` 每个条目只有一个数。所以这个部件按它自身基础值的 100% 吃这一项，一套堆异常状态的配装在它身上被低估了"
  "the CATALOG gives this weapon's radial its own Condition Overload row at 250% of its base ('Opticor | Charged Hitscan Direct Hit Radial | Hitscan | 400 | 1000 | 250% | Adding'), and there is no per-part CO fraction here — `co_base_fraction` is one number per ENTRY. So the part takes the term at 100% of its own base and a status-stacking build is understated on it": "目录给这把武器的爆炸单独列了一行 Condition Overload，按它自身基础值的 250%（「Opticor | Charged Hitscan Direct Hit Radial | Hitscan | 400 | 1000 | 250% | Adding」），而这里没有「按部件」的 CO 系数 —— `co_base_fraction` 每个条目只有一个数。所以这个部件按它自身基础值的 100% 吃这一项，一套堆异常状态的配装在它身上被低估了"
  "the CATALOG gives this weapon's radial its own Condition Overload row at 333% of its base ('Tenet Ferrox | Hitscan AoE Direct | Hitscan | 240 | 800 | 333% | Adding'), and there is no per-part CO fraction here — `co_base_fraction` is one number per ENTRY. So the part takes the term at 100% of its own base and a status-stacking build is understated on it": "目录给这把武器的爆炸单独列了一行 Condition Overload，按它自身基础值的 333%（「Tenet Ferrox | Hitscan AoE Direct | Hitscan | 240 | 800 | 333% | Adding」），而这里没有「按部件」的 CO 系数 —— `co_base_fraction` 每个条目只有一个数。所以这个部件按它自身基础值的 100% 吃这一项，一套堆异常状态的配装在它身上被低估了"
  "the CATALOG gives this weapon's radial its own Condition Overload row at 350% of its base ('Ferrox | Hitscan AoE Direct | Hitscan | 200 | 700 | 350% | Adding'), and there is no per-part CO fraction here — `co_base_fraction` is one number per ENTRY. So the part takes the term at 100% of its own base and a status-stacking build is understated on it": "目录给这把武器的爆炸单独列了一行 Condition Overload，按它自身基础值的 350%（「Ferrox | Hitscan AoE Direct | Hitscan | 200 | 700 | 350% | Adding」），而这里没有「按部件」的 CO 系数 —— `co_base_fraction` 每个条目只有一个数。所以这个部件按它自身基础值的 100% 吃这一项，一套堆异常状态的配装在它身上被低估了"
  "the CATALOG gives this weapon's radial its own Condition Overload row at 75% of its base ('Ambassador | Alt-fire Hitscan Radial Attack | Hitscan | 400 | 300 | 75% | Adding'), and there is no per-part CO fraction here — `co_base_fraction` is one number per ENTRY. So the part takes the term at 100% of its own base and a status-stacking build is overstated on it": "目录给这把武器的爆炸单独列了一行 Condition Overload，按它自身基础值的 75%（「Ambassador | Alt-fire Hitscan Radial Attack | Hitscan | 400 | 300 | 75% | Adding」），而这里没有「按部件」的 CO 系数 —— `co_base_fraction` 每个条目只有一个数。所以这个部件按它自身基础值的 100% 吃这一项，一套堆异常状态的配装在它身上被高估了"
  "the CHAIN LIGHTNING is not modelled, and it is a third of what this weapon does — every hit rolls 0/1/2/3 extra strikes (30/35/17.5/17.5%), guaranteed after three failures, chaining twice within 10 m and scaling off the same mods. This arena has one target for them to chain between": 连锁闪电尚未建模，而它占这把武器作用的三分之一 —— 每次命中掷出 0/1/2/3 道额外闪电（30/35/17.5/17.5%），连续三次落空后必定触发，在 10 米内最多连锁两次，并且吃与主射击相同的 mod。这个战场只有一个目标可供它们连锁
  "the CHAINING is not modelled, and it is what this weapon is for — the beam jumps to up to 3 nearby enemies within 5 metres of each other, and this arena has one target for it to jump between": 连锁尚未建模，而这正是这把武器存在的意义 —— 光束会在彼此 5 米内最多 3 个敌人之间跳跃，而这个战场只有一个目标可跳
  "the CHARGE TIME is not modelled because the page publishes none — the weapon is a charge weapon here and mods treat it as one, but its draw adds nothing to the cycle, so it fires on the listed 1.00/s alone and this entry is a CEILING on its rate: a real draw can only make it slower": 蓄力时间尚未建模，因为页面根本没有公开 —— 这里它仍然是蓄力武器、mod 也按蓄力武器对待，但抽蓄不占用循环时间，所以它按标称的 1.00/秒 开火；这个条目是射速的上限，真实的抽蓄只会让它更慢
  "the CHARGE this form is named for is not modelled as a charge — the page calls it a Charged Shot and then gives it a Semi-Auto trigger with no charge time, so it is paced as a slow semi-auto shot and filed as an alt-fire": 这个形态名字里的「蓄力」没有按蓄力建模 —— 页面把它叫做 Charged Shot，却又给它半自动触发且没有蓄力时间，所以这里按一发慢速半自动射击计算，并归类为副射击
  "the CO bonus IGNORES damage falloff, per the catalog's Notes cell on this row": "异况超载的加成「无视」伤害衰减，依据是目录在这一行的备注栏"
  "the CO bonus IGNORES damage falloff, which is the catalog's own Notes cell on both of this weapon's rows. Here the Condition Overload term falls off with the rest of the shot, so a build stacking statuses at range is understated": "异况超载的加成「无视」伤害衰减，这是目录在这把武器两行里各自的备注栏原文。这里异况超载那一项会跟着整发子弹一起衰减，所以一套在远距离堆异况的配装在这里被低估了"
  "the COLD FIELD is not modelled at all, and it is most of this weapon — each grenade leaves a 1.5 m field dealing 20 Cold a second with a 30% status chance, and the page prints no DURATION for it, so carrying it would mean inventing the number that decides how much it is worth. Only the grenade's 10 Impact is counted here, which makes this entry a FLOOR rather than the weapon": 冰冻力场完全没有建模，而它才是这把武器的主体 —— 每颗榴弹留下一个 1.5 米的力场，每秒 20 冰冻伤害、触发率 30%，但页面没有印出它的持续时间，录进来就等于编造那个决定它价值的数字。这里只计算了榴弹本身的 10 点冲击，所以这个条目是下限而不是这把武器
  "the ENTROPY syndicate effect, which on a proc detonates enemies and restores the wielder's energy — it fires off a syndicate standing meter this sim does not track": "「Entropy」集团特效：触发时引爆敌人并为持有者恢复能量 —— 它由一条本模拟不跟踪的集团能量槽驱动"
  "the FIVE-KILL GATE is not modelled — in game this alt-fire has to be earned with five kills from the primary fire before it can be used at all, and this entry fires it from the first second": 五杀解锁条件尚未建模 —— 游戏里这个副射击必须先用主射击拿到五个击杀才能使用，而这个条目从第一秒就能开火
  "the HEALTH COST, which is the whole of this weapon's drawback: \"health is converted to ammo\", scaling with the ammo restored up to 5% of the user's max health. Nothing shoots back here and the Tenno has no health pool to spend, so the sim shows this rifle with its price removed": "生命代价，它就是这把武器全部的缺点：「生命值被转换为弹药」，按补充的弹药量换算，最多消耗使用者最大生命的 5%。本场没有任何东西会还击，Tenno 也没有一条可以花的血条，所以模拟器展示的是这把步枪去掉标价之后的样子"
  "the HEALTH COST, which is the whole of this weapon's drawback: \"health is converted to ammo\". Nothing shoots back here and the Tenno has no health pool to spend, so the sim shows this rifle with its price removed": "生命代价，它就是这把武器全部的缺点：「生命值被转换为弹药」。本场没有任何东西会还击，Tenno 也没有一条可以花的血条，所以模拟器展示的是这把步枪去掉标价之后的样子"
  "the HIP-FIRE half of the same passive, '+60% ammo efficiency' — this arena aims, and ammo economy pays nothing against infinite reserves either way": "同一个被动的腰射那一半，「+60% 弹药效率」—— 这个战场是瞄准状态，而且面对无限备弹时弹药经济本来也不产生收益"
  "the Incarnon Form Bounce Explosion is not modelled — this form has more parts than this entry carries": Incarnon Form Bounce Explosion 尚未建模 —— 这个形态的部件比一个条目装得下的多
  "the Incarnon Form Charge Attack is not modelled — this form has more parts than this entry carries": Incarnon Form Charge Attack 尚未建模 —— 这个形态的部件比一个条目装得下的多
  "the Incarnon Form Charge Radial Attack is not modelled — this form has more parts than this entry carries": Incarnon Form Charge Radial Attack 尚未建模 —— 这个形态的部件比一个条目装得下的多
  "the Incarnon Form Embed AoE is not modelled — this form has more parts than this entry carries": Incarnon Form Embed AoE 尚未建模 —— 这个形态的部件比一个条目装得下的多
  "the Incarnon form's CHARGED arm-cannon shot is not modelled — this entry carries its held beam, and the charged shot is a second attack with its own explosion": 灵化形态的蓄力臂炮射击尚未建模 —— 这个条目装的是它的持续光束，蓄力射击是另一个攻击，还带自己的爆炸
  "the Incarnon form's bouncing secondary projectiles are not modelled — a stacked shot releases 2 to 5 of them, each exploding on up to 3 bounces": 灵化形态的弹跳次级投射物尚未建模 —— 叠层越高的一发放出 2 到 5 个，每个最多弹 3 次并各自爆炸
  "the Incarnon form's route to stacks is not modelled — entering grants 1 and leaving grants one per shell that was missing, on top of a free magazine refill, and played to the edge that is 2 x magazine - 1 stacks in one cycle": 灵化形态那条攒层路线尚未建模 —— 进形态给 1 层，出形态按进去时缺的每一发再给 1 层，还外送一次装满弹匣；打到极限是一个循环 2×弹匣−1 层
  "the JUSTICE syndicate effect, which on a proc detonates a radial blast and heals the wielder — it fires off a syndicate standing meter this sim does not track, and the blast is not counted here": "「Justice」集团特效：触发时引爆一次范围爆炸并治疗持有者 —— 它由一条本模拟不跟踪的集团能量槽驱动，而那次爆炸在这里没有被计入"
  "the LIFTED SYNERGY is not modelled — the wiki gives this weapon `up to 13 additional instances of direct hit damage` against a Lifted enemy, and its own alt-fire is a guaranteed Lifted proc, so a real engagement alternates between lifting and cashing in; the sim applies the Lifted status (Condition Overload counts it) and none of the extra instances, which makes the primary read LOW for as long as the target is lifted": Lifted 联动尚未建模 —— wiki 写明这把武器打浮空目标时会造成「最多 13 次额外的直击伤害」，而它自己的副射击必定触发浮空，所以实战里是「浮空 → 兑现」来回循环；模拟只应用了浮空状态本身（异常状态过载会计入），额外的伤害实例一次都没有算，所以只要目标处于浮空，主射击的数字就偏低
  "the LINGERING FLAMES the grenades leave are not modelled — the page gives them 11 seconds of continuous damage and no per-tick number this intake could find, so the ground fire contributes nothing here and this weapon reads low": 榴弹留下的持续火焰尚未建模 —— 页面只说它持续 11 秒造成伤害，本次录入找不到每跳的数值，所以地面火焰在这里不贡献任何伤害，这把武器的数字偏低
  "the LOADOUT, not what the wielder is doing: off means a full one, which is what the board is scored under. On, this weapon is the only one carried — the Vasto's Lone Gun pays its \"With No Primary Equipped\" half, and every \"On Equip from Primary\" or \"while Holstered\" clause becomes impossible rather than merely unmodelled": 配装本身，而不是使用者在做什么：关闭时表示带着完整的一套武器，榜单也是按这个跑分的。开启后这把枪就是身上唯一的武器——瓦斯托的「孤枪」会付出它「未装备主武器时」的那一半，而所有「从主武器切换时」「收枪状态下」的词条则从「没做建模」变成「根本不可能触发」
  "the LOWER zoom levels are not modelled — this arena has no field of view to trade for magnification, so the scope always sits at its top level and its best buff": "较低的变焦档位尚未建模 —— 这个战场没有视野可以用来换倍率，所以瞄准镜永远停在最高档、吃它最好的加成"
  "the MERCY KILL BUFF that alt fire exists to earn: \"Performing a Mercy Kill grants +100% damage and Multishot for 20 seconds\", refreshed on every Mercy. A doubling of the weapon, gated behind a finisher this arena cannot perform": "交替射击存在的意义就是去换取的那个「慈悲击杀」增益：「完成一次慈悲击杀获得 +100% 伤害与多重射击，持续 20 秒」，每次慈悲都会刷新。这是把武器翻一倍，而它的门槛是一次本场做不到的处决"
  "the MICROWAVE status effect, which enlarges the body part that was shot (wiki). It is a unique proc with no damage of its own and this engine's status roster has no entry for it — what it does in game is make the enlarged part easier to hit again, which is an aiming aid this sim cannot use": "「微波」异常状态：把被击中的身体部位胀大（维基）。这是一个自身不造成伤害的独有触发效果，本引擎的异常状态表里没有它 —— 它在游戏里的作用是让那个部位更容易再次被打中，而那是一个本模拟用不上的瞄准辅助"
  "the Normal Shot is not modelled — this entry carries only the Charged Shot": Normal Shot 尚未建模 —— 这个条目只装了 Charged Shot
  "the PARTIAL CHARGE is a separate entry (`lanka_uncharged`) — in game the two are the same trigger released at different moments, and picking between them here is a form choice rather than something the fight decides": 半蓄力射击是一个独立条目（`lanka_uncharged`）—— 游戏里两者是同一个扳机在不同时刻松开，而这里在两者之间选择是一个形态选项，不是战斗自己决定的
  "the PELLET COUNT spools from 1 to 12 and this entry fires 12 from the first shot — the fire-rate spool is modelled and the multishot one is not, so a short burst puts more pellets downrange here than in game":
    弹丸数会从 1 爬升到 12，而这个条目从第一发就打 12 发 —— 射速的爬升已建模，弹丸数的爬升没有，所以短点射在这里打出的弹丸比游戏里多
  "the PURITY syndicate effect, which on a proc heals the wielder and nearby allies and cleanses status from them — the wielder is not a body in this arena and there are no allies, so it pays nothing": "「Purity」集团特效：触发时治疗持有者与附近队友并清除他们身上的异常状态 —— 这个战场里持有者不是一个身体，也没有队友，所以它一分不值"
  "the SECOND ZOOM LEVEL is not modelled, and on this weapon it is a stat TRADE rather than a buff — 3.5x gives +100% damage, +3 m explosion radius and -75% fire rate, which is half the sustained DPS for a much bigger single hit. Choosing it is a mode, and this entry is the first level": 第二档变焦尚未建模，而且在这把武器上它是一次属性交易而不是加成 —— 3.5x 给 +100% 伤害、+3 米爆炸半径和 −75% 射速，也就是用一半的持续 DPS 换一发大得多的单发。选它是一个模式，而这个条目是第一档
  "the SEQUENCE syndicate effect, which converts damage dealt into shields for the wielder and nearby allies on a proc — the wielder is not a body in this arena and there are no allies, so it pays nothing": "「Sequence」集团特效：触发时把造成的伤害转化为持有者与附近队友的护盾 —— 这个战场里持有者不是一个身体，也没有队友，所以它一分不值"
  "the Sentient / Shadow Stalker damage-adaptation reset the Void proc performs": 虚空异常对 Sentient 与暗影 Stalker 伤害适应的重置
  "the Single Rocket Explosion is not modelled — this entry carries only the Single Rocket Impact": Single Rocket Explosion 尚未建模 —— 这个条目只装了 Single Rocket Impact
  "the TOXIN EMBED is not modelled — the page gives this weapon a second attack that deals its damage over 3 seconds on top of the hit, and this entry carries only the hit": 毒素嵌入尚未建模 —— 页面给了这把武器第二段攻击，在命中之外再用 3 秒时间打出同等伤害，而这个条目只包含命中本身
  "the TRUTH syndicate effect, which on a proc detonates a radial blast that also strips a portion of enemy armour — it fires off a syndicate standing meter this sim does not track, and the blast is not counted here": "「Truth」集团特效：触发时引爆一次范围爆炸，并削去敌人一部分护甲 —— 它由一条本模拟不跟踪的集团能量槽驱动，而那次爆炸在这里没有被计入"
  "the Uncharged Shot is not modelled — this entry carries only the Charged Shot": Uncharged Shot 尚未建模 —— 这个条目只装了 Charged Shot
  "the aimed target": "被瞄准的目标"
  "the alt fire cannot be reloaded manually to skip its delay, and Kinetic Ricochet does not affect its projectile — two cadence rules this arena has no reload interruption for": "交替射击不能靠手动换弹来跳过它的延迟，「动能跳弹」也不影响它的弹体——这两条都是节奏规则，而本场没有换弹打断可言"
  "the alt-fire needs four rounds in the magazine and reloads instead when it has fewer — this sim fires it whenever the mode is chosen, so a magazine that has run down does not force the reload here that it would in game":
    副射击需要弹匣里有四发，不够时会改成换弹 —— 这个模拟只要选了这个模式就照打，所以弹匣见底时不会像游戏里那样被强制换弹
  "the alternate fire CYCLES four quill types — Poison, Fire, Electric and Ice — and this entry carries the Poison one. The other three differ in the element they apply and, on two of them, in the physical damage (40 against this quill's 36), so a build around a different quill is understated here by about a tenth": "副攻击会在四种刺之间切换 —— 毒素、火焰、电击和冰冻 —— 而本条目带的是毒素那一种。其余几种在造成的元素上不同，其中两种的物理伤害也不同，所以围绕另一种刺的配装并不正好是这个数字"
  "the alternate fire CYCLES four quill types — Poison, Fire, Electric and Ice — and this entry carries the Poison one. The others differ in the element they apply and, on two of them, in the physical damage, so a build around a different quill is not exactly this number": "副攻击会在四种刺之间切换 —— 毒素、火焰、电击和冰冻 —— 而本条目带的是毒素那一种。其余几种在造成的元素上不同，其中两种的物理伤害也不同，所以围绕另一种刺的配装并不正好是这个数字"
  "the alternate fire PREVENTS ZOOM, which the page notes stops Hydraulic Crosshairs and Sharpened Bullets working on it — an aim-state gate this entry does not apply": "副攻击会禁用瞄准，页面指出这会让「Hydraulic Crosshairs」和「Sharpened Bullets」在它身上失效 —— 这是一道以瞄准状态为条件的门，本条目没有应用"
  "the alternate fire SWEEPS the two beams back and forth across the front of the weapon (wiki) — this arena fires a fixed ray at one point, so the sweep neither misses the aimed body nor catches the ones beside it. Against one target this is the ceiling; against a line it is a floor": "副攻击会把两道光束向外张开、并在武器正前方来回扫（维基）—— 这个战场朝一个点发射一条固定的射线，所以这一扫既不会扫丢瞄准的目标，也不会扫到它旁边的目标。对单个目标这是上限，对一排目标这是下限"
  "the alternate fire detonates the arrow in mid-flight — this sim fires the shot and lets it land, so the choice of WHEN to burst it, which is most of how this weapon is aimed, is not a decision here":
    副射击可以让箭在半空引爆 —— 这个模拟只是把它射出去并让它落地，所以「什么时候引爆」这个几乎决定了这把武器怎么瞄的选择，在这里根本不存在
  "the area of effect CAN headshot, which the page marks as a BUG — this sim applies its headshot percentage to the direct hit alone, so the blast is never a head here": "范围伤害可以打出爆头，页面把这一条标注为 BUG —— 本模拟只把爆头比例应用在直接命中上，所以这里的爆炸永远不会算作爆头"
  "the arrow also throws APPENDAGES that grab enemies within nine metres and drag them to it, dealing 90 damage each (module) — that is crowd control plus a second damage source, and this engine carries one explosion per attack, so neither is counted": "这支箭还会甩出触手，抓住九米内的敌人并把他们拖过来，每个造成 90 点伤害（模块）—— 那既是控制效果又是第二伤害来源，而本引擎每次攻击只带一次爆炸，所以两者都没有被计入"
  "the atmospheric beam's INNATE INFINITE BODY PUNCH THROUGH is not modelled — it passes through a body to reach whatever is behind it, and this arena has one target with nothing behind it": 大气形态光束自带的无限躯体穿透尚未建模 —— 它会穿过一个身体打到后面的目标，而这个战场只有一个目标，后面什么都没有
  "the barb's 0.9 s ERUPTION DELAY is not modelled — in game the explosion lands nearly a second after the shot, and here the two arrive together, so a short engagement gets its damage sooner than it should": 倒刺 0.9 秒的爆发延迟尚未建模 —— 游戏里爆炸比命中晚将近一秒，这里两者同时到达，所以短交战拿到伤害的时间比实际更早
  "the beacon's whole purpose is the +50% absolute critical chance and the homing it grants the PRIMARY fire, neither of which this engine can carry from one mode to another. Fired on its own it is a three-damage dart": "信标的全部意义是它给主攻击带来的 +50% 绝对暴击率和追踪，而这两样本引擎都没法从一个模式带到另一个模式。单独开火时它只是一根 3 点伤害的飞镖"
  "the beam CHAINS to 2 more enemies within 9 m at 50% of the main beam's damage each — one target here, so it is worth exactly nothing (UNMODELLED.md §one target). It is the largest thing this weapon does in a room and the reason it was nerfed from 4 chains to 2": 光束会连锁到 9 米内另外 2 个敌人，各承受主光束 50% 的伤害 —— 这里只有一个目标，所以它的价值恰好为零（UNMODELLED.md §单目标）。这是这把武器在一个房间里最大的作用，也是它从 4 段连锁被削到 2 段的原因
  "the beam's 29 m range and its pinpoint accuracy, which this arena has no distance to spend": 光束 29 米的射程和它的极高精度 —— 这个战场没有距离可以消耗它们
  "the blades RICOCHET off surfaces (wiki) and this arena has no walls to bounce off": "锯片会从表面上反弹（维基），而这个战场没有墙可以反弹"
  "the blob economy is not modelled — a shot EMBEDS and only explodes after a delay or at max stacks, and the sim fires the embed as an ordinary hit": 粘液机制尚未建模 —— 射出的粘液会先附着，延迟后或叠满层数才爆炸，而模拟把附着当成一次普通命中
  "the board would not take this build, so nothing was sent": 榜单不会收这套配装，所以没有提交
  "the body the weapon was on": 武器瞄准的那一具
  "the bonus this copy came out of its Lich with — added as the weapon's own BASE damage, so elemental mods and status scale with it": 这把枪从它的 Lich 那里带出来的加成——作为武器自身的基础伤害加上去，所以元素 mod 和异常都会跟着放大
  "the bow-exclusive Thunderbolt mod is outside the pools this roster loads — on this weapon it turns every bolt into a grenade, which is a whole second damage source": "弓专属的「Thunderbolt」MOD 不在本武器库载入的卡池里 —— 装在这把武器上它会把每一发弩箭变成一颗手雷，那是一整个第二伤害来源"
  "the bubble HOLDS what it catches until it collapses (wiki) — that is crowd control, and this arena's enemies neither move nor stop": "气泡会把抓住的东西困在里面直到它坍缩（维基）—— 那是控制效果，而这个战场里的敌人既不会移动也不会被定住"
  "the bubbles explode 0.6-0.8 SECONDS after they land, which the page says 'may allow enemies to move out of the explosion range if not directly hit' — this engine resolves the blast at the point of impact immediately, so nothing ever escapes one here": "气泡在落点后 0.6-0.8 秒才炸开，页面说这「可能让没有被气泡直接命中的敌人走出爆炸范围」—— 本引擎在命中点上立刻结算这次爆炸，所以这里没有任何东西能躲开它"
  "the build and its rivens — no fight and no measurement, so opening it leaves the reader's own scenario untouched":
    只有这套配装和它的紫卡 —— 不带战场，也不带测量结果，所以对方打开它，他自己的战场设置不会被动过。
  "the burst can be cancelled with a quick melee, which is a way to spend less than a full magazine and this arena never takes": "这轮连射可以用快速近战取消，那是一种「少花一整个弹匣」的打法，而本场从不这么做"
  "the burst can be interrupted by a quick melee, a dodge roll or a weapon swap — this arena does none of those, so it always runs to the end":
    这轮爆发可以被快速近战、翻滚或换武器打断 —— 这个战场这三件事都不做，所以它总是打到底
  "the burst empties the MAGAZINE and this entry fires a fixed 21 rounds a pull — the unmodded magazine. A magazine mod makes the real burst longer and this one does not grow, so a build carrying one is understated here":
    这轮爆发会打空整个弹匣，而这个条目每次扣发固定打 21 发 —— 也就是未改装的弹匣容量。装了弹匣 MOD 之后真实的爆发会更长，而这里不会变长，所以带弹匣 MOD 的配装在这里被低估了
  "the burst empties the MAGAZINE and this entry fires a fixed 6 rounds a pull — the unmodded magazine. The page states that magazine mods lengthen it (\"Benefits from magazine increasing mods to further increase the burst's damage\"), so a build carrying one is understated here": "这一轮连射会打空「弹匣」，而本条目每次扣扳机固定打 6 发——也就是未改装的弹匣。页面明说弹匣类 MOD 会让它更长（「受益于增加弹匣容量的 MOD，可进一步提高连射的总伤害」），所以带了这类 MOD 的配装在这里被低估了"
  "the burst empties the MAGAZINE and this entry fires a fixed count — the unmodded magazine. The page states that magazine mods lengthen it, so a build carrying one is understated here": "这一轮连发会把弹匣打空，而本条目发射的是一个固定的发数 —— 未改装的弹匣容量。页面写明弹匣 MOD 会让这一轮更长，所以带了弹匣 MOD 的配装在这里被低估"
  "the by-round reload is not modelled — 0.8 s to start, 0.4 s a shell, 0.5 s to finish, interruptible at any point, and the sim reloads the whole magazine in one 3.7 s block": 逐发装填尚未建模 —— 起手 0.8 秒、每发 0.4 秒、收尾 0.5 秒，中途随时可打断，而模拟把整个弹匣算成一次 3.7 秒的装填
  "the by-round reload is not modelled — this weapon refills a shell at a time and the reload can be interrupted, and the sim reloads the whole magazine": 逐发装填尚未建模 —— 这把枪一次装一发、装填过程可被打断，而模拟一次装满整个弹匣
  "the by-round reload is now modelled — what is NOT is the INTERRUPTION: in game you can fire mid-reload and keep the shells you have loaded, and here a reload runs to the end": 逐发装填已经建模 —— 还没建模的是「打断」：游戏里可以装到一半开火、已经上膛的那几发算数，这里一次装填会走完
  "the card prints Sprint Speed 1.2 or Higher and the effect requires 1.1 — so it pays on frames the card says it should not, and Amalgam Serration alone carries any Warframe over the line": "卡面印的是「冲刺速度 1.2 或更高」，而实际只需要 1.1 —— 所以它在卡面说不该生效的战甲上照样生效，而且单靠融合分裂膛线就能把任何战甲带过这条线"
  "the card states this and the game does not do it — measured, and the simulation matches the game rather than the card": 卡面写了这一条，而游戏并不执行 —— 实测所得，模拟器跟随的是游戏而不是卡面
  "the charged shot carries INFINITE BODY PUNCH THROUGH and travels 26 metres (wiki). This entry states neither — the punch through is left at zero rather than guessed at a distance, so against a line of enemies it reaches only the first": "这一发蓄力射击带有无限穿透身体的能力，并且飞行 26 米（维基）。本条目两者都没有录入 ——穿透留在零而不是猜一个距离，所以面对一排敌人它只能打到第一个"
  "the cloud also CONFUSES the enemies standing in it, turning them on each other for its duration (wiki) — that is crowd control, and this arena's enemies neither turn nor stop": "毒云还会让站在里面的敌人陷入混乱、在持续时间内互相攻击（维基）—— 那是控制效果，而这个战场里的敌人既不会倒戈也不会停下"
  "the cloud arrives ONE SECOND after the dart lands (wiki) — this engine resolves it at the point of impact immediately, so nothing walks out of one here": "毒气云在飞镖落地一秒之后才出现（维基）—— 本引擎在命中点上立刻结算它，所以这里没有任何东西能走出去"
  "the cloud's CONDITION OVERLOAD term reads 50 against its own base of 20 — the catalog's 250% — and there is no per-part CO fraction, so it takes the ordinary 100% here and a status-stacking build is understated on it": "毒云的异况超载项按 50 计算，而它自己的基础只有 20——也就是目录写的 250%。引擎没有逐部位的异况超载分数，所以这里按普通的 100% 算，堆异况的配装在这一半上被低估了"
  "the companion FIRES THIS WEAPON, not the player — it picks its own targets, fires when it decides to, and stops while the companion is reviving or out of range; this arena fires it continuously at one target, which is the ceiling rather than the average": "开火的是守护而不是玩家 —— 它自己选目标、自己决定何时开火，守护复活中或超出距离时会停火；这个战场让它对着一个目标持续开火，得到的是上限而不是平均值"
  "the cone is 2 METRES THICK (wiki), which is a hit volume this arena's ray has no width for": "这个锥形有 2 米厚（维基），而这个战场的射线没有宽度可以承载它"
  "the damage TYPE ROTATION is averaged — the weapon throws 130 of one type at a time, cycling Impact then Puncture then Slash, and this entry carries an equal three-way split instead. Total damage and status mix come out exact; ARMOUR does not, because mitigation is applied per instance and a blended hit is not the average of three pure ones": 伤害类型的轮换被平均化了 —— 这把武器每次投出 130 点单一类型的伤害，按冲击→穿刺→切割循环，而这个条目改用三等分的混合向量。总伤害和触发分布完全一致；护甲不一致，因为减伤是逐次结算的，混合命中不等于三次纯伤的平均
  "the damage TYPE ROTATION is averaged — the weapon throws 160 of one type at a time, cycling Impact then Puncture then Slash, and this entry carries an equal three-way split instead. Total damage and status mix come out exact; ARMOUR does not, because mitigation is applied per instance and a blended hit is not the average of three pure ones": 伤害类型的轮换被平均化了 —— 这把武器每次投出 160 点单一类型的伤害，按冲击→穿刺→切割循环，而这个条目改用三等分的混合向量。总伤害和触发分布完全一致；护甲不一致，因为减伤是逐次结算的，混合命中不等于三次纯伤的平均
  "the dart carries its DoT THROUGH what it pierces at a reduced rate — \"If the dart punches through an enemy, they will instead receive 1 tick\" — which is a second rule about the DoT above and equally unmodelled": "飞镖会把持续伤害带过它穿透的目标，但跳数减少——「如果飞镖穿透了一个敌人，该敌人只会承受 1 跳」——这是关于上面那段持续伤害的第二条规则，同样没有建模"
  "the dart's 1.5 s EXPLOSION DELAY is not modelled — in game the blast lands a second and a half after the dart does, and here the two arrive together, so a short engagement gets damage sooner than it should": 飞镖 1.5 秒的爆炸延迟尚未建模 —— 游戏里爆炸比飞镖晚一秒半，这里两者同时到达，所以短交战拿到伤害的时间比实际更早
  "the discharge also removes Sentient and Shadow Stalker damage resistances, which is worth nothing against any target in this roster — no Sentient here has one to strip": 这次放电还会移除 Sentient 和暗影 Stalker 的伤害抗性，对这个名册里的任何目标都毫无价值 —— 这里没有任何 Sentient 有抗性可剥
  "the duplex trigger is not modelled — one pull fires TWO rounds in game and this entry paces one per pull": 双发扳机尚未建模 —— 游戏里扣一次扳机打出两发，这个条目按一次一发计算射速
  "the elite variant: more health, and a pool of Overguard in front of it": 精英变体：更高生命，且生命前面还有一层超宏护盾
  "the embedded detonation also forces a RAGDOLL, which is not a damage type and is not applied here": "黏住后的引爆还会必定造成布娃娃效果，而布娃娃不是一种伤害类型，这里没有应用"
  "the escalating ammo cost the wiki files under Bugs (2/2/2/3/3/4/6 through a magazine, and -1 damage per extra ammo): a bug is not a rule, and this one takes AWAY what the charge is supposed to buy": wiki 归在「漏洞」条目下的递增弹药消耗（一个弹匣内 2/2/2/3/3/4/6，且每多消耗一发就少 1 点伤害）：漏洞不是规则，而且这一个夺走的正是蓄力本该买到的东西
  "the explosion STAGGERS enemies, opening them to melee finishers and stealth multipliers (wiki) — this arena has no melee and no stealth state, so that half of the weapon pays nothing": "爆炸会使敌人踉跄，从而可以被近战处决、也会吃到潜行伤害倍率（维基）—— 这个战场没有近战、也没有潜行状态，所以这一半的武器在这里一分不值"
  "the explosion arrives 0.6 SECONDS after the bolt lands, which the page says lets an enemy walk out of it — this engine resolves the blast at the point of impact immediately, so nothing ever escapes one here": "爆炸在弩箭落地 0.6 秒之后才到，页面说这让敌人有机会走出范围 —— 本引擎在命中点上立刻结算这次爆炸，所以这里没有任何东西能躲开它"
  "the explosion's +9 s STATUS DURATION, which the page states is applied before other percentage-based duration modifiers — a flat bonus ahead of the multiplicative bracket, and the only one of its shape in the roster": "爆炸自带的 +9 秒异况持续时间。页面明说它在其它百分比持续时间加成之前结算——一个排在乘算括号前面的固定加值，也是本武器库里唯一一个这种形状的"
  "the explosion's CONDITION OVERLOAD, which the catalog says it takes and computes on the DIRECT hit's base — 200 against the radial's own 60, a 333% term. `co_base_fraction` is one number per entry and this entry's direct hit is ordinary, so the radial takes none here and a status-stacking build is understated on it": "爆炸的异况超载。目录说它是吃的，而且是按「直击」的基础伤害算——200 对上范围伤害自己的 60，也就是 333% 的项。`co_base_fraction` 每个条目只有一个数，而本条目的直击是普通的，所以这里范围伤害一点异况超载都不吃，堆异况的配装在这一半上被低估了"
  "the explosion's falloff is not modelled — this arena has one target at the centre, so it always takes the full 2000 a grenade and never the 1400 at the rim": 爆炸的距离衰减尚未建模 —— 这个战场只有一个位于中心的目标，所以它每颗榴弹永远吃满 2000，而不会是边缘的 1400
  "the explosion's falloff is not stated by the page and is therefore not modelled — the target stands at the centre and takes the full 228 either way": 页面没有给出这个爆炸的距离衰减，所以这里也没有建模 —— 目标站在中心，无论如何都吃满 228
  "the explosion's falloff is not stated by the page and is therefore not modelled — the target stands at the centre and takes the full 30 either way": 页面没有给出这个爆炸的距离衰减，所以这里也没有建模 —— 目标站在中心，无论如何都吃满 30
  "the explosion's forced RAGDOLL, and the alt fire's forced KNOCKDOWN on embed — both are crowd control, which is worth time and safety rather than damage. Nothing shoots back here and a body does not move, so neither pays": "爆炸自带的强制布娃娃，以及交替射击嵌入时自带的强制击倒——两者都是控场，换来的是时间和安全而不是伤害。本场没有任何东西还击，身体也不会移动，所以两者都不兑现"
  "the extra hit off a lingering FIELD tick (Torid's cloud): neither wiki says whether a cloud tick triggers one, so it does not here — MEASUREMENTS M40": 持续伤害力场每一跳（如 Torid 的毒云）是否也会触发附加伤害：两个 wiki 都没有说，所以这里不触发——见 MEASUREMENTS M40
  "the fan has a 'very wide spread' (wiki) and the module gives this attack a cone of ZERO, which cannot both be true — the module's figure is transcribed rather than a number invented for the sentence, so every knife lands on the reticle here": "扇形投掷「散布非常宽」（维基），而模块给这次攻击的散布是零，两者不可能同时成立 —— 这里录入的是模块的数字，而不是为了让句子成立而编出来的数字，所以每一把刀都落在准星上"
  "the field is DISABLED OUTRIGHT against some enemies and the page states it as a bug: \"For enemies with both Shield and Armor, or with Overguard, the Attraction Field is completely disabled, including damage and traction effects\". Against such a target the 2,250 above is zero": "对某些敌人这个力场会被「完全禁用」，页面把它列为一个 bug：「对同时拥有护盾与护甲的敌人，或拥有超宏护盾的敌人，吸引力场会被完全禁用，包括伤害与牵引效果」。对这类目标，上面那 2250 点就是零"
  "the fight has one target, so this pays nothing": 战斗只有一个目标，所以这一条毫无收益
  "the fight these numbers are measured in — the quick calc runs the Simulator's own scenario, so switch it there and every chip follows": 这些数字是在哪场战斗里测出来的 —— 快速计算跑的就是模拟器当前的场景，去那边切换，每个标签都会跟着变
  "the fight": "这场仗"
  "the fight's": 跟随这场仗
  "the first zoom's own effects are worth nothing here — -50% recoil and +2 m punch-through, neither of which this arena reads": 第一档变焦自身的效果在这里毫无价值 —— −50% 后坐力和 +2 米穿透，这个战场两者都不读取
  "the five CLUSTER BOMBLETS the bomb throws out (3 Impact each, plus an 18 Radiation explosion each): they fly at 6 m/s in their own directions, so how many reach ONE target is a question this arena has no geometry to answer — and they are roughly half the alt fire's damage, so the number below is a floor": 炸弹抛出的五枚子炸弹（每枚 3 点冲击，外加每枚 18 点辐射爆炸）：它们以 6 米/秒 各自飞散，所以有多少枚能打到同一个目标，是这个战场没有几何概念可以回答的问题 —— 而它们约占副射击伤害的一半，所以下面的数字是下限
  "the gauge also fills by BLOCKING enemy attacks, at 10% a second for two seconds (wiki) — nothing attacks the wielder here, so the kill route is the only one modelled": "能量槽也可以通过格挡敌人的攻击来填充，每秒 10%、持续两秒（维基）—— 这里没有任何东西攻击持有者，所以只有击杀这一条路径被建模"
  "the grenades are DETONATED BY HAND — 'it launches ballistic grenades that can be manually detonated with Alternate Fire', with no arming delay at all (wiki). This sim has no second trigger, so every grenade goes off the instant it lands, which is what a player detonating immediately gets and is therefore the ceiling. What is lost is the play pattern the weapon exists for: laying grenades and firing them together": "榴弹是手动引爆的 ——「它发射弹道榴弹，可以用副攻击手动引爆」，而且完全没有引信延迟（维基）。本模拟没有第二个扳机，所以每一颗榴弹都在落地的瞬间炸开，那正是一个立刻引爆的玩家会拿到的结果，因此是上限。丢掉的是这把武器存在的那个玩法：先布下一片榴弹，再一起点掉"
  "the grenades are earned by DEALING DAMAGE with the primary fire — the alternate cannot be used until the meter is full (wiki) — and this engine has no shape for one mode paying for another, so this entry fires on a cadence with no meter at all": "榴弹要靠主攻击造成伤害来赚取 —— 在计量条满之前副攻击根本用不了（维基）—— 而本引擎没有「一个模式为另一个模式付账」这种形状，所以本条目按固定节奏开火、完全没有计量条"
  "the grenades have a MINIMUM ARMING DISTANCE of 7.5 metres (wiki) and deal 'much less damage' when they hit without exploding. This arena applies the explosion at every range, so a fight staged inside 7.5 m is overstated here by the whole explosion — which is 90% of this weapon": "榴弹有 7.5 米的最小引信距离（维基），而且在没有爆炸的情况下命中只造成「低得多的伤害」。这个战场在任何距离上都会应用爆炸，所以一场设在 7.5 米以内的战斗在这里被高估了整整一次爆炸 ——而那是这把武器的九成"
  "the guaranteed Impact proc is capped at 14 metres and is applied at every distance here, since a forced proc carries no range of its own. It overstates the shot past 14 m, where the damage is already most of the way to its falloff floor": "必定触发的冲击异况有 14 米上限，而这里在任何距离都会施加，因为强制异况本身不带射程。只有超过 14 米时它才高估了这一发，而那时伤害已经接近衰减下限了"
  "the guaranteed Impact proc is capped at 29 metres (\"Shots have a guaranteed Impact proc to enemies up to 29 meters\") and is applied at every distance here, since a forced proc carries no range of its own. It overstates the shot only past 29 m, where the damage is already at its falloff floor": "必定触发的冲击异况有 29 米上限（「射击对 29 米内的敌人必定触发冲击」），而这里在任何距离都会施加，因为强制异况本身不带射程。只有超过 29 米时它才高估了这一发，而那时伤害本来就已经落到衰减下限了"
  "the guaranteed Impact proc only reaches enemies within 18 metres (wiki) and this entry applies it at every range, so a shot fired further out is overstated by one forced proc": "那个必定触发的冲击异常状态只能打到 18 米以内的敌人（维基），而本条目在任何距离上都会应用它，所以打得更远的一枪在这里被高估了一次必定触发"
  "the guaranteed Impact proc only reaches enemies within 9 metres, and the distance scales with Projectile Speed (wiki) — this entry applies it at every range, so a shot fired further out is overstated by one forced proc": "那个必定触发的冲击异常状态只能打到 9 米以内的敌人，而且这个距离会随弹丸速度变化（维基）—— 本条目在任何距离上都会应用它，所以打得更远的一枪在这里被高估了一次必定触发"
  "the harpoon 'can reel enemies in close and knock them down', pull flyers out of the air and interrupt enemy casting (wiki) — every one of those is crowd control, and this arena's enemies are neither moved nor interrupted": "鱼叉「可以把敌人拉近并击倒」，还能把飞行单位拽下来、打断敌人的施法动作（维基）—— 这些全都是控制效果，而这个战场里的敌人既不会被拉动，也不会被打断"
  "the harpoon REELS the target in and holds it (wiki) — this arena's enemies are neither moved nor held, so the whole point of the mode pays nothing here": "鱼叉会把目标拉过来并定住（维基）—— 这个战场里的敌人既不会被拉动也不会被定住，所以这个模式的全部意义在这里一分不值"
  "the held beam's charge ramp is not modelled — in game its damage climbs to 2.5x the longer the trigger is held": 持续光束的蓄力爬升尚未建模 —— 游戏里按住越久伤害越高，最高 2.5 倍
  "the hip-fire recoil is not modelled — the page notes the burst kicks significantly harder when fired from the hip, and this arena has no recoil at all":
    腰射后坐力尚未建模 —— 页面指出这个点射从腰间射击时后坐力明显更大，而这个战场根本没有后坐力
  "the horizontal SPREAD is not modelled — the eight projectiles go out in a wide line and this arena has one target at zero distance, so all eight always land on it": 横向散射尚未建模 —— 八发弹丸呈一条宽线射出，而这个战场只有一个零距离的目标，所以八发永远全部命中
  "the in-game falloff display is WRONG on this weapon and the page says so: \"The falloff ranges displayed ingame (13m-22m) are incorrect. Tenet Detron will still deal full damage until about 28m.\" The 26-52 m transcribed above is the module's and the infobox's, not the arsenal's": "游戏内显示的衰减区间在这把武器上是「错的」，页面自己就这么说：「游戏内显示的衰减范围（13–22 米）不正确。Tenet Detron 在大约 28 米之前仍然造成完整伤害。」上面抄录的 26–52 米来自数据模块和信息框，不是军械库面板"
  "the innate INFINITE punch-through is not modelled — this arena has one target, and a wave that passes through a corridor of enemies is most of what this weapon is": 自带的无限穿透尚未建模 —— 这个战场只有一个目标，而一道波穿过整条走廊的敌人才是这把武器的大半价值
  "the innate infinite body punch-through is not modelled — this arena has one target, so it changes no number, and it is why Dual-Mode Chamber's +4 m adds nothing either": 自带的无限躯干穿透尚未建模 —— 这个战场只有一个目标，所以它不改变任何数字，双模式弹膛的 +4 米穿透同样如此
  "the innate punch through does not apply to SURFACES when the central portion of the projectile hits one — a geometry rule in an arena with no geometry": "当弹体中央部分打在表面上时，自带穿透对「表面」不生效——这是一条关于场景几何的规则，而本场没有几何"
  "the innate punch through does not apply to SURFACES when the central portion of the projectile hits one, which the page says makes punch-through MODS worth fitting anyway — a geometry rule in an arena with no geometry": "当弹体中央部分打在表面上时，自带穿透对「表面」不生效——页面说正因如此，穿透 MOD 在这把枪上仍然值得带。这是一条关于场景几何的规则，而本场没有几何"
  "the innate reload while holstered or deployed (33% of the magazine per second) — this arena never holsters the weapon": 收枪或长枪插在场上时的自动装填（每秒 33% 弹匣）——本场从不收枪
  "the innate {m} m punch-through is not modelled — this arena has one target, so it changes no number": 自带的 {m} 米穿透尚未建模 —— 这个战场只有一个目标，所以它不改变任何数字
  "the laser sight also HIGHLIGHTS weak points on screen, which is an aiming aid rather than a damage bonus — this sim draws its head hits from the fight's headshot percentage and cannot be helped to aim": "激光瞄具还会在屏幕上高亮弱点，这是一个瞄准辅助而不是伤害加成 —— 本模拟的爆头是从战斗的爆头比例里抽的，没法被帮着瞄准"
  "the link carries the build, its rivens, the fight it was measured in and the measurement — opening it saves a new copy of each": 链接带上了配装、它装的裂罅、测它用的那场仗，以及测出的数字——对方打开会各存一份新的，不会覆盖他原有的
  "the mines are DETONATED BY HAND via Alternate Fire and several can be laid before firing them together (wiki). This sim detonates each one the moment it lands, which is the ceiling for a single mine and misses the play pattern the weapon exists for": "地雷由玩家用副攻击手动引爆，而且可以先布下好几颗再一起点掉（维基）。本模拟在每一颗落地的瞬间就把它引爆，这是单颗地雷的上限，但错过了这把武器存在的那个玩法"
  "the mines are DETONATED BY HAND via Alternate Fire, and up to four can be ready at once (wiki). This sim detonates each one the moment it lands, which is the ceiling for a single mine and misses the play pattern entirely: the weapon exists to stick four mines and fire them together": "地雷由玩家用副攻击手动引爆，最多可以同时准备四颗（维基）。本模拟在每一颗落地的瞬间就把它引爆，这是单颗地雷的上限，但完全错过了那个玩法：这把武器存在的意义就是先黏四颗再一起点掉"
  "the miniature rifles LOCK ONTO UP TO FOUR ENEMIES within 40 degrees and 10 m of the player, and the ammo cost is per target (wiki). This engine fires the mode at the aimed body alone, so against a crowd it is understated by up to fourfold — and against one enemy it is right": "那些小型步枪会锁定玩家 40 度内、10 米内的最多四个敌人，而且弹药消耗是按目标计的（维基）。本引擎只朝瞄准的那个身体发射这个模式，所以面对人群它最多被低估四倍 —— 而面对单个敌人它是准的"
  "the missiles HOME, and homing is not modelled — this arena has one target at zero distance, so a guided missile and a straight one land the same": 导弹的追踪尚未建模 —— 这个战场只有一个零距离的目标，所以制导弹和直飞弹落点相同
  "the mode is charged by DEALING DAMAGE with the primary fire, which is one mode paying for another and a shape this engine does not have": "这个模式靠主攻击造成伤害来充能，那是「一个模式为另一个模式付账」，本引擎没有这种形状"
  "the module gives this alternate fire a THIRD attack — 'Alt-Fire Damage over Time', a burn in six metres between the contact hit and the explosion — and this engine carries one direct hit and one explosion per attack. So the burn is not counted at all": "模块给这个副攻击第三次攻击 ——「Alt-Fire Damage over Time」，在接触伤害和爆炸之间的一段六米范围内的持续灼烧 —— 而本引擎每次攻击只带一次直接命中和一次爆炸，所以这段灼烧完全没有被计入"
  "the module gives this mode a THIRD attack, 'Infested Harpoon Contact', which is the damage dealt while the target is held — a state this engine does not track, so it is not counted": "模块给这个模式第三次攻击「Infested Harpoon Contact」，也就是目标被定住期间受到的伤害 ——那是一个本引擎不跟踪的状态，所以它没有被计入"
  "the module gives this shot THREE attacks and this engine carries one explosion: the 660 Blast COLLAPSE is the one modelled, and the 10 Cold INITIAL BLAST that freezes the bubble's contents first is not counted": "模块给这一发三次攻击，而本引擎只带一次爆炸：被建模的是那 660 点爆炸伤害的坍缩，而先把气泡内部冻住的那 10 点冰冻初爆没有被计入"
  "the module gives this shot THREE attacks and this engine carries one explosion: the Blast COLLAPSE is the one modelled and the Cold INITIAL BLAST is not counted": "模块给这一发三次攻击，而本引擎只带一次爆炸：被建模的是爆炸伤害的坍缩，冰冻初爆没有被计入"
  "the official rulers — the same fight on every weapon": 官方标尺 —— 每把武器都是同一场战斗
  "the official test scenario — the same fight on every weapon, so results compare": 官方测试场景 —— 每把武器都是同一场战斗，结果之间可以比较
  "the orb HANGS IN PLACE and damages what walks into it, and the primary fire can be shot THROUGH it for bonus damage (wiki) — a two-step interaction between the two modes, and this engine fires each mode on its own": "那颗球会停在原地并伤害走进去的敌人，而主攻击可以打穿它获得额外伤害（维基）—— 这是两个模式之间的两步联动，而本引擎是各自独立地发射每一个模式"
  "the page states the spool as a COUNT and not as a starting fraction — 'requires a spool-up of 6 shots before optimal fire rate is achieved' — and the roster's spool field needs both halves to reconcile, so it is left off rather than half-guessed": "页面把转膛写成一个「发数」而不是一个起始比例 ——「需要 6 发的转膛才能达到最佳射速」—— 而本武器库的转膛字段需要两半互相印证，所以这里干脆不填，而不是猜一半"
  "the player does not move or aim by hand here": 这里的玩家不移动，也不手动瞄准
  "the primary fire HOMES on a beaconed target for 20 seconds (wiki) — this arena's shots already go where they are aimed, so the homing buys nothing here and buys a great deal in a real room": "主攻击会在 20 秒内追踪被信标标记的目标（维基）—— 这个战场里的子弹本来就打在瞄准的地方，所以追踪在这里买不到任何东西，而在真实的房间里价值极大"
  "the progenitor element — pool = searched, req = pin one": 始祖元素——pool 表示纳入搜索，req 表示钉死一个
  "the projectile explodes 'on impact OR travelling 15 metres' (wiki), so past 15 m it goes off in mid-air and the direct hit never lands. This entry carries the 15 m as a reach, which stops the direct hit correctly and stops the EXPLOSION with it — so a shot fired past 15 m is worth nothing here where in game it would still blast whatever it went off beside": "弹丸「在命中时、或者飞行 15 米后」爆炸（维基），所以超过 15 米它会在空中炸开，直接命中打不到。本条目把那 15 米录成了射程，这正确地掐断了直接命中，但同时也掐断了爆炸 ——所以在这里超过 15 米开的一枪一分不值，而在游戏里它仍然会在它炸开的地方轰到旁边的东西"
  "the projectile has a LIFESPAN of 0.6 seconds and grows in size and duration as it hits enemies — each enemy hit adds 50% to its life, up to 10 seconds (wiki). This engine resolves a projectile at the body it strikes and has no clock for what it does afterwards, so a pod that would keep travelling and keep hitting stops at the first thing it reaches": "弹丸的存在时间为 0.6 秒，并且每命中一个敌人就变大一点、存在时间 +50%，最长 10 秒（维基）。本引擎在弹丸击中的那个身体上就把它结算掉了，之后它做什么没有时钟去跟 —— 所以一颗本该继续飞、继续命中的种荚，在这里停在它碰到的第一个东西上"
  "the projectile has a stated THICKNESS the page leaves blank (\"Projectiles have a thickness of ? meters\") — this arena fires a ray, so a wide sheet strikes only the bodies on the line either way": "弹体有一个页面自己都没填的「厚度」（原文写的是「Projectiles have a thickness of ? meters」）——本场射出的是一条射线，所以无论多宽的一片，也只打到线上的那些身体"
  "the projectile is a WALL 3 metres thick, which with the infinite body punch through above is most of what this weapon is in a room: one shot sweeps everything in a 3 m band. This arena fires a RAY, so only the bodies on the line are struck and the width buys nothing. The Tenet variant's sheet is 4.4 m": "弹体是一面 3 米厚的墙，配上上面那条无限穿体，这才是这把武器在房间里的主体：一发扫掉 3 米宽带内的一切。本场射出的是一条射线，所以只有线上的身体会被打到，宽度什么也买不到。Tenet 版本的那面墙是 4.4 米"
  "the projectile is a WALL 4.4 metres thick, which with the infinite body punch through above is most of what this weapon is in a room: one shot sweeps everything in a 4.4 m band. This arena fires a RAY, so only the bodies on the line are struck and the width buys nothing": "弹体是一面 4.4 米厚的墙，配上上面那条无限穿体，这才是这把武器在房间里的主体：一发扫掉 4.4 米宽带内的一切。本场射出的是一条射线，所以只有线上的身体会被打到，宽度什么也买不到"
  "the projectiles BOUNCE OFF WALLS like a thrown glaive, and this arena has no walls to bounce off": 弹体会像投掷战刃一样从墙上弹开，而这个战场没有墙可以弹
  "the projectiles HOME on enemies (wiki) — this arena's shots already go where they are aimed, so the homing buys nothing here": "弹丸会追踪敌人（维基）—— 这个战场里的子弹本来就打在瞄准的地方，所以追踪在这里买不到任何东西"
  "the projectiles arc heavily and travel slowly, so at range the burst has to be led — an aiming cost this arena has no hand to pay": "弹道抛物线很陡且飞得慢，所以远距离必须打提前量——这是一笔瞄准成本，而本场没有手去付"
  "the projectiles are 1 METRE THICK (wiki), which is a hit volume this arena's ray has no width for": "弹丸有 1 米厚（维基），而这个战场的射线没有宽度可以承载它"
  "the radial's falloff is not modelled — this arena has one target at the centre, so it always takes the full 72 and never the 58 at the rim": 范围伤害的距离衰减尚未建模 —— 这个战场只有一个位于中心的目标，所以它永远吃满 72，而不会是边缘的 58
  "the radius is 'NOT affected by Fulmination' (wiki), which is a mod this entry has no radius for anyway": "半径「不受 Fulmination 影响」（维基），而本条目本来也没有给它半径"
  "the reload-from-empty penalty that pays for it: an innate -20% Reload Speed, taking the 1.7 s reload to 2.125 s. Not applied, because what it buys is not either": "为那枚榴弹买单的空匣换弹惩罚：自带 -20% 换弹速度，把 1.7 秒的换弹拖到 2.125 秒。这里没有施加，因为它买到的东西这里也没算"
  "the reload-from-empty penalty that pays for them: an innate -20% Reload Speed, additive with Quickdraw, taking the 1.7 s reload to 2.125 s. Not applied, because what it buys is not either": "为那些榴弹买单的空匣换弹惩罚：自带 -20% 换弹速度，与「快速拔枪」加算，把 1.7 秒的换弹拖到 2.125 秒。这里没有施加，因为它买到的东西这里也没算"
  "the rocket flies at 60 m/s and can be shot down in flight — this sim gives a projectile a travel time but nothing here shoots back, so a rocket always arrives":
    火箭以 60 m/s 飞行，途中可以被打掉 —— 这个模拟会给弹体飞行时间，但这里没有任何东西会还击，所以火箭总是能飞到
  "the rockets are STEERED: \"Aiming will cause fired rockets to travel toward the aiming reticle, allowing them to be guided\", and \"Allows firing rockets from behind cover\". Both are hand-aim mechanics, and both cost the shot half its speed while used (20 m/s guided against 40 unguided). Against a target that does not move, guidance buys nothing and is charged nothing": "火箭是「可操控」的：「瞄准会让已发射的火箭朝准星方向飞行，从而实现制导」，以及「允许从掩体后发射火箭」。两者都是手动瞄准机制，且在使用期间都要付出一半的弹速（制导 20 米/秒，非制导 40 米/秒）。对着一个不移动的目标，制导什么也买不到，这里也什么都不收"
  "the rockets have a MINIMUM ARMING DISTANCE of 7 metres (wiki): closer than that they hit and do not explode. This arena fires at whatever range the scene is set to, and the explosion is applied at every one of them — so a fight staged inside 7 m is overstated here by the whole explosion, which is most of the weapon": "火箭有 7 米的最小引信距离（维基）：比这更近就只是打中而不爆炸。这个战场按场景设定的距离开火，而爆炸在每一个距离上都会被计入 —— 所以一场设在 7 米以内的战斗在这里被高估了整整一次爆炸，而那是这把武器的大部分"
  "the rockets home to targets within 15 degrees — the sim always hits, so the aid is worth nothing here": 火箭会追踪 15 度范围内的目标 —— 模拟里本来就必中，所以这个辅助在这里毫无价值
  "the same fight on every weapon, so results can be compared. It cannot be edited.": 每把武器都是同一场战斗，所以结果之间可以比较。它不可编辑。
  "the same fight on every weapon, so results can be compared. It cannot be edited: use ⧉ on its chip to copy it into a scenario of your own.": 每把武器都是同一场战斗，所以结果之间可以比较。它不可编辑：点它标签上的 ⧉ 复制成一份你自己的场景。
  "the sawblade is DEPLOYED six metres in front of the wielder and stays there — it is not a beam fired at a target, and this engine models it as one, so a fight where the enemy is not standing on that spot is overstated here": "锯刃是部署在持有者前方六米处的，而且就停在那里 —— 它不是一道朝目标发射的光束，而本引擎把它当成了光束，所以敌人没有正好站在那个点上的战斗在这里被高估了"
  "the scenario the simulator is set to": 模拟器当前选中的场景
  "the search ranks by kills — the scenario's DPS measure applies to the simulator": 搜索按击杀排名——场景里的 DPS 指标只作用于模拟器
  "the second INNATE POLARITY the wiki publishes for this weapon is an AURA one, and no weapon mod carries an Aura polarity — so this entry gives that slot no colour at all, which costs a build the discount a matching slot would have paid. Capacity here is therefore a FLOOR: whatever that slot does in game, it cannot be worse than unpolarised": "维基为这把武器公布的第二个固有极性是「光环」极性，而没有任何武器 MOD 带光环极性 —— 所以本条目干脆不给那个槽位任何颜色，这让配装少拿了一个对位槽本该给的折扣。因此这里的容量是一个下限：无论那个槽在游戏里做什么，都不会比无极性更差"
  "the self-stagger on its own explosion is not modelled — the grenade staggers the firer at close range and deals them no damage, and nothing in this arena can be inconvenienced": 自身被爆炸踉跄的效果尚未建模 —— 近距离开火时榴弹会让射手踉跄但不造成伤害，而这个战场里没有任何东西会被影响
  "the semi-auto mode is entered by DEPLOYING A DISC that 'lasts until the Zenith is reloaded, highlighting enemy heads within 20 meters through walls' (wiki). The highlight is an aiming aid this sim cannot use, and the disc's lifetime is a reload clock this engine does not run — so this mode is available here from the first shot": "半自动模式是通过部署一个圆盘进入的，那个圆盘「会持续到 Zenith 装填为止，并透过墙壁高亮 20 米内敌人的头部」（维基）。高亮是本模拟用不上的瞄准辅助，而圆盘的存续时间是一个本引擎不运行的装填时钟 —— 所以这个模式在这里从第一发就可用"
  "the shot also throws {n} bomblets that explode again for {damage} between them, and this engine gives an attack ONE explosion — so everything below is the main blast alone and this weapon is understated by roughly {share} of its damage. The wiki's Condition Overload catalog gives those bomblets a rule of their own (their CO term reads the PARENT projectile's damage), which consequently does not apply here either":
    这一发还会抛出 {n} 颗子炸弹，它们合计再炸出 {damage} 伤害，而这个引擎每次攻击只有一次爆炸 —— 所以下面的一切只算主爆炸，这把武器在这里被低估了大约 {share} 的伤害。维基的 Condition Overload 目录给这些子炸弹单独定了一条规则（它们的 CO 项读的是母弹体的伤害），因此那条规则在这里同样没有生效
  "the sim does not model this yet, so its number against this target is optimistic": 模拟还没有实现这条机制，所以对这个目标算出的数字偏高
  "the simulator does not reproduce the search's own score for this build — the build shown may not be the one that was scored": 模拟器复现不出搜索给这套配装打的分 —— 屏幕上这套可能不是被评分的那一套
  "the simulator refused this build — see the build's own card": 模拟器拒绝了这套配装 —— 看它自己的卡片
  "the snare 'damages, paralyzes for ~6 seconds, and groups up to 8 enemies within 15 meters', and the number pulled is multiplied by Multishot (wiki). This engine resolves it on the aimed body alone: no pull, no paralysis, no crowd — so the 40 Toxin here is the whole of what a mechanic built entirely around crowd control pays": "这个网「造成伤害、麻痹约 6 秒，并把 15 米内最多 8 个敌人拉到一起」，而且被拉的数量会随多重射击倍增（维基）。本引擎只在瞄准的那个身体上结算它：没有拉扯、没有麻痹、没有人群 —— 所以这里的 40 点毒素就是一个完全围绕控制设计的机制在这里付出的全部"
  "the sniper combo counter and the scope's headshot bonus are not modelled in this form — both are modelled on the base form, and no source states whether either survives the transform (the wiki notes only that you must UNZOOM to enter it)": 这个形态下的狙击连击计数与瞄准镜爆头加成都尚未建模 —— 两者在基础形态里都已建模，但没有任何资料说明它们能否在变形后保留（wiki 只提到必须先退出瞄准才能进入灵化形态）
  "the spear must be picked back up or waited out; this arena throws it and keeps firing": "这支矛要么走过去捡回来，要么等它自己结束；本场是扔出去之后继续开火"
  "the split fires a damage instance of ZERO, and the zero still takes that instance's own multipliers — when the DoT replaces it with the parent hit's damage, they stay behind. Faction bonuses were meant to carry down the chain and do; a per-instance bonus like Devouring Attrition's +2000% was not, and does anyway (x21 twice = x441). Modelled as it behaves today; a fix removes it": 分裂打出的是一次伤害为 0 的实例，而这个 0 照样被那一次实例自己的乘区乘过——等算 dot 时 0 被换成上一级那一发的伤害，那些乘区却留了下来。派系类加成本来就是设计成沿着链条传下去的；而像强袭损耗 +2000% 这样的单次实例加成不是，却也跟着传了（21 倍吃两次 = 441 倍）。这里按它现在的实际表现建模；DE 修了就没了
  "the spool rebuilds after every reload: the page says burst firing MAINTAINS it, so a player whose pauses are short enough keeps more of the listed rate than this sim does — here the only pauses are the reloads the weapon forces. The spool itself IS modelled": "射速爬升在每次换弹后重新开始：维基说点射是能保住爬升的，所以停火间隔足够短的玩家能比这里的模拟保住更多标称射速——而这里唯一的停火就是武器强制的换弹。爬升本身已经建模"
  "the spool-up is not modelled — this entry fires at the fully spooled rate from the first round": 预热尚未建模 —— 这个条目从第一发就按预热完成后的射速开火
  "the stacks never expire — they still start where you set them and still build on every trigger": 层数不会过期——仍然从你设定的层数开始，也仍然会随触发继续叠加
  "the target's armour, column and attenuation": 目标的护甲、易伤列与衰减
  "the throw is SILENT and the cloud is not, which is a stealth distinction this arena has no alarm to raise": "投掷本身是静默的，而毒云不是。这是一个潜行上的区别，而本场没有警报可拉"
  "the throw's forced KNOCKDOWN, which is crowd control — worth time and safety rather than damage, and this arena charges for neither": "投掷自带的强制击倒，这是控场——它换来的是时间和安全而不是伤害，而本场这两样都不计价"
  "the thrown spear must be RETRIEVED before the weapon can be used again (wiki) — this sim throws it on a cadence and never walks over to pick it up": "投出去的矛必须捡回来才能再次使用这把武器（维基）—— 本模拟按固定节奏投掷，从来不会走过去把它捡起来"
  "the thrown-exclusive Concealed Explosives is outside the pools this roster loads": "投掷专属的「Concealed Explosives」不在本武器库载入的卡池里"
  "the thrown-exclusive Concealed Explosives is outside the pools this roster loads — on a weapon with this fire rate it is a whole second damage source, which is exactly what its own page recommends it for": "投掷专属的「Concealed Explosives」不在本武器库载入的卡池里 —— 装在一把射速这么高的武器上，它是一整个第二伤害来源，而这正是它自己的页面推荐它的理由"
  "the very heavy side-to-side recoil the page calls out, which is what makes the listed pinpoint accuracy \"only effective for the first shot\". Recoil is a hand-aim cost and this arena has no hand": "页面特别点名的、非常重的左右后坐力，正是它让标称的「针尖级精准」变成「只对第一发有效」。后坐力是一笔手动瞄准的成本，而本场没有手"
  "the wave's vertical hitbox is not modelled — it is a wide flat projectile rather than a point, which this arena has no geometry to express": 波形弹体的纵向判定尚未建模 —— 它是一片宽而扁的弹体而不是一个点，这个战场没有几何概念可以表达
  "the weapon's printed panel": 就是武器面板上印的那样
  "the wielder's state: mods that only pay while Invisible (Spectral Serration) grant nothing when this is off": 使用者状态：只在隐身时生效的 MOD（幽魂锯齿）关掉这个就什么都不给
  "the wielder's state: what a card means by \"With Channeled Ability active\". The ability must DRAIN ENERGY over time — Desecrate, Haven and an empty Gloom do not count": 使用者状态：卡面上说的「引导类技能生效中」指的就是这个。技能必须是持续耗能的——亵渎、庇护所、以及周围没有敌人时的阴郁都不算
  "the wielder's state: what a card means by \"With Overshields\". Nothing here takes them away, so it is a declaration": 使用者状态：卡面上说的「拥有超量护盾时」指的就是这个。这里没有任何东西会打掉它，所以它是一个声明而不是战斗里的变量
  "the wielder's state: what a card means by \"while Airborne\"": 使用者状态：卡面上说的「滞空时」指的就是这个
  "the ~0.5 second delay after a burst before the mode can lock on again, which is a cadence cost between bursts rather than inside one": "一轮连射结束后约 0.5 秒才能再次锁定，这是两轮之间的节奏成本，而不是一轮之内的"
  "these procs cannot land on this unit — the other damage types take over their share of the status roll": 这些异常打不到这个单位身上 —— 它们那份触发概率由其余伤害类型接管
  "these procs cannot land — the other types take over their share of the roll": 这些异常打不上去 —— 它们那份触发概率由其余属性接管
  "these procs still land and still count for Condition Overload — this unit simply ignores what they do": 这些触发照常上、也照常计入触发超载 —— 这个单位只是无视它们的效果
  "this ability lets you pick the element — the gear wheel in game": 这个技能可以自选元素——游戏里那个装备轮盘
  "this acts on something a weapon-damage simulator has none of — Warframe energy, enemy behaviour, movement — so it would change no number here": 它作用于武器伤害模拟器根本没有的东西——战甲能量、敌人行为、移动——所以就算实现了，这里的任何数字也不会变
  "this attack's SPREAD is not in the data, so none of its shots can miss — the wiki's weapon module publishes a cone for it and the intake could not identify which of that weapon's attacks this entry is, so it took nothing rather than the wrong one. At a range every pellet lands here, which is the ceiling; at point blank it costs nothing, because nothing misses there anyway": 这个攻击的散布还没录进数据，所以它的每一发都不会打空 —— 维基的武器模块是公布了它的锥角的，只是录入程序无法确定这个条目对应该武器的哪一个攻击，于是宁可不取也不取错。拉开距离后这里的每一颗弹丸都命中，那是上限；贴脸时它不造成任何差别，因为贴脸本来就打不空
  "this browser will not copy images — use download": 这个浏览器不支持复制图片，请用下载
  "this browser will not say how many cores it has, so 4 is assumed — the share still applies": "这个浏览器不肯说自己有几个核心，所以按 4 个估算 —— 比例设置照常生效"
  "this browser's storage is full - the change is on screen but was not saved": "这个浏览器的存储空间满了 —— 改动在屏幕上，但没有保存下来"
  "this cannot pay out in a one-target fight — it is an edge of the model, not a gap in it": 这在单体战斗里不可能产生收益 —— 它是模型的边界，不是模型的缺口
  "this instance's modded damage": 这个实例改装后的伤害
  "this is a benchmark row — copy it to edit": 这是榜上的一行——复制一份才能编辑
  "this is as good as the top option — the gap between them is smaller than either answer's own width, so the order between them is the dice": 这个和第一名一样好——它们之间的差距比任一答案自身的误差还小，所以谁排前面是掷骰决定的
  "this is the aimed enemy, and what the place tool puts down. Enemies already on the floor keep the unit they were placed with.": "这是被瞄准的敌人，也是放置工具会放下的单位。已经在场上的敌人保持放置时的单位。"
  "this is the aimed enemy, and what the place tool puts down. {n} already on the floor keep the unit they were placed with.": "这是被瞄准的敌人，也是放置工具会放下的单位。场上已有 {n} 个保持着各自放置时的单位。"
  "this matches the live game and is a bug — DE may patch it, and the number here changes when they do": 这与现在的游戏一致，但它是个 bug——DE 随时可能修，修了这里的数字就会变
  "this mode is entered by AIMING rather than by a trigger, and the simulator treats the mode and the fight's Aiming state as two separate settings — so a run with this mode and Aiming off is a combination the game cannot produce, and every while-aiming bonus should be read as active whenever this mode is":
    这个模式是靠瞄准进入的，而不是靠扳机；模拟器把「模式」和战场的「瞄准」当成两个独立设置 —— 所以「选了这个模式但瞄准关着」是游戏里造不出来的组合，凡是「瞄准时」生效的加成，只要处在这个模式就应当视为生效
  "this option did not re-roll the fight — run for run it scaled the same engagement, so this comparison is exact": 这个选项没有让战斗重新掷骰——每一次运行它都是把同一场战斗按同一个倍数放大，所以这次比较是精确的
  "this option re-rolls the fight, so its answer is only good to ±{x} — raise the run count to narrow it": 这个选项会让这场战斗重新掷骰，所以它的答案只精确到 ±{x} —— 提高运行次数可以收窄它
  "this ranking predates the simulator re-run": 这份排名早于"模拟器重跑"这个功能
  "this run never INTERRUPTS a reload — in game you can fire mid-reload and keep the shells already loaded, and a player who does is trading stacks and a full magazine for uptime. Decided rather than missing (2026-08-10): a listed reload is a whole reload, and the alternative is not a more accurate model, it is a different player": "这次运行从不打断装填 —— 游戏里你可以在装填途中开火并保留已经压进去的子弹，这么做的玩家是在用层数和满弹匣换取输出时间。这是一个决定而不是遗漏（2026-08-10）：标称的装填就是一次完整装填，另一种做法不是更精确的模型，而是另一个玩家"
  "this target dispels it — nothing ticked here is running against it": 这个目标会把它驱散 —— 对它而言这里勾选的都没有生效
  "this target nullifies Warframe abilities — it pulses every 5 seconds and dispels everything in range, so none of these are running and the sim scores it that way": 这个目标会驱散战甲技能 —— 它每 5 秒脉冲一次、清除范围内的一切,所以下面勾选的都没有生效,模拟也是按没有生效来算的
  "this unit's faction takes more or less of these damage types, whatever its armor and shields do": 这个单位所属阵营对这些伤害类型更脆弱或更抗性，与它的护甲和护盾无关
  "this weapon CANNOT BE MODDED here — it uses melee and thrown melee mods (Pressure Point, Fury, Whirlwind, Power Throw) and this app models guns, so it has no pool to draw from. Its base numbers are real; a build is not": 这把武器在这里无法配装 —— 它使用近战与投掷近战 mod（压迫点、狂怒、旋风、强力投掷），而这个 app 建模的是枪械，没有任何池子可供它抽取。它的基础数值是真实的，配装不是
  "this weapon CANNOT use Scattered Justice, which its page states outright — so unlike the ordinary Hek it is missing nothing from the pools this roster loads": "这把武器不能装备「Scattered Justice」，页面直接写明了这一点 —— 所以和普通 Hek 不同，它并没有因为卡池而少掉任何东西"
  "this weapon cannot be resupplied — once its reserve is gone it is removed for five minutes, so the setting has nothing to stand in for": 这把武器无法补给——储备打光后会被收回，五分钟后才能再次召唤，所以这个选项没有可代表的东西
  "this weapon cannot equip Concealed Explosives, the thrown-exclusive mod — a card outside the pools this roster loads either way": "这把武器装不了投掷专属 MOD「隐藏炸药」——那张卡本来也不在本武器库载入的卡池里"
  "this weapon does NOT inflict self-stagger, which is a real advantage over every other explosive in this batch and is worth nothing here, because the arena never charges any of them for it either": "这把武器「不会」自我踉跄，这相对本批次其它每一件爆炸武器都是实打实的优势，但在这里一文不值，因为本场对它们所有人都不收这笔账"
  "this weapon has no ammo reserve to run out of": 这把武器没有会耗尽的备弹
  "this weapon is never holstered during the fight": 战斗中这把武器从不收起
  "this weapon will never reload on its own and must be reloaded manually — a habit cost this arena does not charge": "这把武器永远不会自动换弹，必须手动换——这是一笔操作习惯上的成本，本场不收"
  "this weapon's passive is not modelled yet — the numbers below are a floor, not its full output": 这把武器的被动尚未建模——下面的数字是下限，不是它的完整输出
  "this weapon's passive is not modelled yet": 这把武器的被动尚未建模
