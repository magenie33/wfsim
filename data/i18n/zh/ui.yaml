  "Mutalist Whip, the Paracyst-exclusive augment — a weapon-exclusive card outside the pools this roster loads": "「Mutalist Whip」，Paracyst 的专属增强 MOD——这是一张武器专属卡，不在本武器库载入的卡池里"
