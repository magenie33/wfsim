  "Update ready — restart to finish": "更新已就绪，重启后生效"
  "Updating": "正在更新"
  "source": "源码"
  "the launcher-exclusive Adhesive Blast is outside the pools this roster loads — it sticks the rocket to what it hits, which changes where the explosion goes off and is a placement this arena has no room to be wrong about": "发射器专属的**粘附爆破**不在本 roster 加载的 mod 池里 — 它把火箭黏在命中物上，这会改变爆炸发生的**位置**，而位置是本战场输不起的一个变量"
  "No matches": 无匹配
  "No tiers, no perks, no supporter badge. A donation is a thank-you, not a purchase.":
    没有档位，没有特权，没有赞助者标识。捐助是一句谢谢，不是一次购买。
  "No tracking beyond what Cloudflare counts to serve the page.":
    除了 Cloudflare 为发送页面而记的那点数，不做任何追踪。
  "Nobody submits a number. A submission is a BUILD, and its score is computed here by this engine under the pinned seed above — so any row can be reproduced exactly by anyone with the repo.": 没有人提交数字。提交的是一套配装，分数由本引擎在上面钉死的随机种子下算出——所以任何一行，任何拿到仓库的人都能一模一样地复现。
  "Noise Reduction": 消音
  "Not aiming, and no shot finds a head. Two terms, because the stance and where the shots land are different facts — the stance is what gates mods like Argon Scope.": 不瞄准，且没有一枪打中头部。这是两个条件，因为“姿势”和“子弹落点”是两件不同的事——像氩晶瞄具这类 mod 卡的是姿势。
  "Not firing": 未开火
  "Not now": 暂不
  "Nothing is spent to be in it, so it can be held forever — a ruler ranks it.": 待在这个形态不需要付出任何代价，所以可以一直保持 —— 官方标尺会给它排名。
  "ON KILL THE BODY FOLLOWS THE BOLT, damaging anyone in its path and pinning the corpse to walls (wiki). It is a second damage source that only exists once something has died, and this engine has no ragdoll and no wall for it to pin against — so a bolt weapon fighting a crowd is understated by however much that corpse would have hit on the way past": "击杀时尸体会跟着钉住它的螺钉飞出去，沿途对挡路的敌人造成伤害，并把尸体钉在墙上（维基）。这是一个「必须先死一个」才存在的第二伤害来源，而本引擎既没有布娃娃物理，也没有可以钉的墙 —— 所以一把螺钉武器在人堆里被低估的量，正好是那具尸体在飞行途中本该打出的伤害"
  "ORBS MERGE, and a fully stacked set collapses into a SINGULARITY that deals damage over time in five metres (module: two further attacks). This engine resolves each shot on its own, so neither the merge nor the singularity is counted — which is most of what this weapon is for": "球会合并，而叠满之后会坍缩成一个奇点，在五米内持续造成伤害（模块里另外两次攻击）。本引擎逐发独立结算，所以合并和奇点都没有被计入 —— 而那正是这把武器的主要用途"
  "ORBS MERGE. The module gives this weapon a second AoE — 'Orb Merging Damage' in four metres — that fires when a new orb joins one already in the air, and the explosion grows with the number merged (wiki). This engine resolves each shot on its own, so the merge is not counted at all and a player laying orbs on one spot is well ahead of this number": "球会合并。模块给这把武器第二个范围攻击 ——「Orb Merging Damage」，四米范围 ——它在新的球并入已经在空中的球时触发，而且爆炸会随合并数量增长（维基）。本引擎逐发独立结算，所以合并完全没有被计入，一个把球都堆在同一个点上的玩家远高于这个数字"
  "Official test scenario": 官方测试场景
  "One Thrax Centurion at level 9999 on Steel Path, for 180 seconds. A single target, so nothing here rewards clearing a room.": 一只凶魂百夫长，9999 级，钢铁之路，打 180 秒。单体目标，所以清场能力在这里换不到任何分数。
  "One ruler, every weapon. A score is a build measured by this engine under the benchmark's own pinned terms — nobody submits a number. An empty row is a weapon nobody has measured yet.": 一把尺子，量全部武器。榜上的分数是由本引擎在该基准自己钉死的条件下跑出来的——没有人提交数字。空着的一行，就是还没有人测过的武器。
  "One-off, in USD, from $5. Card or PayPal, no account needed.": 一次性，按美元结算，5 美元起。信用卡或 PayPal，无需注册账号。
  "Only builds scoring at least half their weapon's leading row are listed — the board holds the answers, not every attempt.": 只有分数达到这把武器榜首一半以上的配装才会被列出——榜单收录的是答案，不是每一次尝试。
