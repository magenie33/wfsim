  "$5 to start, and after that whatever you think it is worth. There is no tier and no target — this is what the bill is, not a price list.":
    5 美元起，之后给多少由你说了算。没有档位，也没有目标——上面是账单本身，不是价目表。
  "'3 kills each within 2 seconds of the previous kill summons a second Pyrana Prime for 6 seconds, doubling its magazine size and increasing its fire rate by 1.4x' (wiki). It is a KILL-counting buff — a chain of three, each inside a two-second window — and this engine has no shape for one, so the number here is the weapon before its second gun ever appears. Against a crowd that dies quickly, that is a very large understatement": "「连续 3 次击杀、每次都在上一次击杀后 2 秒内，会召唤出第二把 Pyrana Prime，持续 6 秒，弹匣翻倍且射速 x1.4」（维基）。这是一个按「击杀」累计的增益 —— 三连，每一次都要在两秒的窗口内 —— 而本引擎没有这种形状，所以这里的数字是第二把枪从未出现过的那把武器。面对一群会很快死掉的敌人，这是一个非常大的低估"
  "'40 shots are required before optimal ACCURACY is achieved' (wiki) — this entry carries the settled cone, so a burst that would open wide here opens tight": "「需要 40 发之后才能达到最佳精度」（维基）—— 本条目带的是收紧之后的散布，所以一段在游戏里会打得很散的连射，在这里一开始就是收紧的"
  "'Cantare Chorale': striking enemies with the returning reload grants +20% reload speed for 30 seconds to all allies in affinity range (wiki). It rides on a return this sim does not fire, and this arena has no allies to grant it to": "「Cantare Chorale」：用回收的刀刃击中敌人，会给亲和范围内的所有队友 +20% 装填速度、持续 30 秒（维基）。它挂在这个模拟不会发射的回收上，而且这个战场也没有队友可以接受它"
  "'Chamber Cascade': a hit or a damaging status has a 4% chance to grant 100% ammo efficiency for 4 seconds (wiki). Ammo economy pays nothing here — reserves are infinite by default because this sim does not model ammo pickups — so the passive is real and worth nothing to this number": "「Chamber Cascade」：命中或造成伤害类异常状态时，有 4% 概率获得 100% 弹药效率、持续 4 秒（维基）。弹药经济在这里不产生任何收益 —— 本模拟不建模弹药拾取，所以备弹默认无限 —— 所以这个被动是真实存在的，但对这个数字毫无影响"
  "'Critical Hits have a 6% chance to set the next shot's Status Chance to 500%' (wiki). A SET ignores mods the way Gotva Prime's crit lock does, and this engine has that shape for a status-triggered CRIT lock and not for a crit-triggered STATUS one — so this weapon procs at the 1% on its card and never at the 500% it was built around. It is the larger half of the weapon": "「暴击有 6% 概率把下一发的触发几率设为 500%」（维基）。这种「设为」和 Gotva Prime 的暴击锁一样会无视 MOD，而本引擎有的是「异常状态触发暴击锁」那个形状，没有「暴击触发异常状态锁」的 —— 所以这把武器只按卡面上的 1% 触发，永远打不出它被设计出来的那个 500%。这是这把武器更大的那一半"
  "'DEATH KNELL', and it is most of the weapon: a weak-point hit grants 100% ammo efficiency, +0.5x final critical multiplier and +20% final status chance, stacking to 3, each stack lasting 2 seconds and refreshed by the next weak-point hit (wiki). This engine has no headshot-TRIGGERED buff — a crit is rolled for a hit and the body part is drawn beside it — so none of the three is applied, and the ammo half in particular is what makes a one-round magazine playable. Read this number as the weapon with its passive switched off": "「DEATH KNELL」，而且它就是这把武器的大部分：命中弱点会获得 100% 弹药效率、最终暴击倍率 +0.5x、最终触发几率 +20%，可叠加 3 层，每层持续 2 秒，并可被下一次弱点命中刷新（维基）。本引擎没有「爆头触发」的增益 —— 暴击是为这一次命中掷的，命中部位是在旁边另外抽的 —— 所以这三项一项都没有生效，而其中弹药那一半正是让一发弹匣能打得下去的原因。请把这个数字读作「关掉被动的这把武器」"
  "'Enemies can destroy the rockets with gunfire or area of effect explosions' (wiki) — nothing shoots back in this arena, so every rocket reaches what it was aimed at": "「敌人可以用射击或范围爆炸打掉这些火箭」（维基）—— 这个战场里没有人还击，所以每一枚火箭都会打到它瞄准的地方"
  "'Enemies directly killed by Purgator 1 leave behind 1 Gas status effect stack', and 'the gas cloud deals damage each tick equal to HALF of the killing shot's damage' (wiki). It is an Extra Hit keyed on a KILL rather than on a hit, it takes the killing shot's crit tier and faction bonuses and no multishot, and this engine has no shape for a hit that only exists once something has died. Against anything that dies, this weapon is understated by roughly a third of its real output": "「被 Purgator 1 直接击杀的敌人会留下 1 层毒气异常状态」，而且「毒气云每一跳造成的伤害等于致命一击伤害的一半」（维基）。这是一次以「击杀」而不是以「命中」为触发条件的额外伤害，它继承致命一击的暴击层级和派系加成、不吃多重射击，而本引擎没有「只有在某个目标死掉之后才存在的命中」这种形状。只要目标会死，这把武器在这里就被低估了大约三分之一的真实输出"
  "'Enemy corpses will still allow the beam to connect to nearby enemies' (wiki) — a chain in game can route through something already dead, and a body that dies here leaves the formation, so a long fight chains through fewer links than it would in a real room": "「敌人的尸体仍然可以让光束连到附近的敌人」（维基）—— 游戏里的连锁可以经由一具已经死掉的身体继续跳，而在这里死掉的身体会离开阵型，所以一场长时间的战斗在这里跳过的节点比在真实房间里少"
  "'Fire rate mods apply double their bonuses' is MODELLED (`class: bow`), but this weapon's real cost is the other half of its page: it can only be fired FULLY CHARGED, so a player who releases early gets nothing at all. This sim always charges fully, which is the ceiling and is what a careful player does anyway": "「射速 MOD 的加成翻倍」这一条是已建模的（`class: bow`），但这把武器真正的代价在页面的另一半：它只能在完全蓄力后发射，提前松手什么都打不出来。本模拟永远蓄满，这是上限，也正是一个谨慎的玩家会做的事"
  "'Overdrive': a weak-point KILL grants +100% fire rate, +100% ammo efficiency and -100% recoil for 8 seconds, and it disables Alternate Fire while it lasts (wiki). It is a kill-triggered buff this engine has no shape for, so this entry fires at its listed rate throughout": "「Overdrive」：爆头击杀会给予 +100% 射速、+100% 弹药效率和 -100% 后坐力，持续 8 秒，而且在持续期间禁用副攻击（维基）。这是一个由击杀触发的增益，本引擎没有这种形状，所以本条目全程按卡面射速开火"
  "'Projectiles guarantee knockback against enemies; most are ragdolled and launched' (wiki), and the module gives the impact a forced Ragdoll proc. A ragdoll is not a damage type and this engine's proc list holds only damage types, so it is not applied — which is the whole reason a player carries this weapon": "「弹丸必定对敌人造成击退；大多数会被布娃娃化并被击飞」（维基），而且模块给直接命中挂了一个必定触发的 Ragdoll。布娃娃不是一种伤害类型，而本引擎的触发列表里只有伤害类型，所以它没有被应用 ——而那正是玩家带这把武器的全部理由"
  "'Projectiles reflect off of solid objects and surfaces' (wiki) — this arena has no walls to bounce off": "「弹丸会从坚硬的物体和表面上反弹」（维基）—— 这个战场没有墙可以反弹"
  "'TARGET ANALYSIS': every shot grants +4% flat critical chance and +4% flat status chance, stacking to five for +20% of each, lasting 2 seconds and refreshed by the next shot (wiki). This engine has no shot-COUNTING buff of its own, and the two bonuses are FLAT — added to the finished number rather than scaled off the base — so a build here fires at 18%/26% where a player holding the trigger sits at 38%/46%. It is the larger half of the weapon": "「Target Analysis」：每一发给 +4% 固定暴击率和 +4% 固定触发几率，最多叠 5 层共 +20%，持续 2 秒，下一发可刷新（维基）。本引擎没有「按发数累计」的增益，而且这两项都是固定值 —— 直接加在算完的数字上，而不是按基础值缩放 —— 所以这里的配装按 18%/26% 开火，而一个持续扣扳机的玩家坐在 38%/46% 上。这是这把武器更大的那一半"
  "'aiming projects a field that blocks frontal projectiles' (wiki), and the field closes on a reload or a charge — nothing shoots back in this arena, so the shield half of this weapon is worth nothing here": "「瞄准时会展开一面挡下正面弹丸的护罩」（维基），而这面护罩在装填或蓄力副攻击时会收起 —— 这个战场里没有人还击，所以这把武器作为盾牌的那一半在这里一分不值"
  "'bolts fired stick to their target, and will fling bodies on kill. The body will damage targets in its path' (wiki) — this engine has no ragdoll and no wall to pin against, so the corpse damage a crowd would take is not counted": "「射出的鱼叉会钉在目标身上，并在击杀时把尸体甩飞。尸体会伤害沿途的目标」（维基）—— 本引擎没有布娃娃物理，也没有可以钉的墙，所以人群本该吃到的那份尸体伤害没有被计入"
  "'charge is automatic and does not need to be held down' (wiki), which is what this sim does anyway": "「蓄力是自动的，不需要一直按住」（维基），而这正是本模拟本来就在做的事"
  "'each shot lands in a small square formation around where the user is aiming instead of directly on the crosshair, which may lead to misses against smaller targets' (wiki) — this entry carries the module's 1-1.2 degree cone, which is that square described as a spread": "「四发子弹落在准星周围的一个小方阵里，而不是正落在准星上，面对较小的目标可能会打空」（维基）—— 本条目录入的是模块给的 1-1.2 度散布，那正是这个方阵用散布描述出来的样子"
  "'headshot kills from direct bolt damage boost reload speed by 50%' (wiki) — a kill-triggered buff this engine has no shape for": "「弩箭直接伤害造成的爆头击杀会让装填速度提升 50%」（维基）—— 这是一个由击杀触发的增益，本引擎没有这种形状；页面自己也指出那个必定触发的冲击异常状态让连续爆头变得很难"
  "'headshot kills from direct bolt damage boost reload speed by 50%' (wiki) — a kill-triggered buff this engine has no shape for, and the page notes the guaranteed Impact proc makes consecutive headshots hard to land anyway": "「弩箭直接伤害造成的爆头击杀会让装填速度提升 50%」（维基）—— 这是一个由击杀触发的增益，本引擎没有这种形状；页面自己也指出那个必定触发的冲击异常状态让连续爆头变得很难"
  "'inability to hold charge' (wiki) — the shot fires the moment it is charged, which is what this sim does anyway": "「无法保持蓄力」（维基）—— 这一发在蓄满的瞬间就会发射，而这正是本模拟本来就在做的事"
  "'increased ACCURACY the longer the weapon is fired' (wiki) — this entry carries the settled cone": "「开火时间越长精度越高」（维基）—— 本条目带的是收紧之后的散布"
  "'successfully landing a tracer round grants a 20 second buff that adds 50% ABSOLUTE critical chance. This buff is retained on target death, and is not affected by mods' (wiki). It is a flat addition to the finished crit chance, granted by the OTHER firing mode, and this engine has no shape for a buff one mode grants another — so this entry fires at its own 23% where a player who has landed a beacon sits at 73%. It is the larger half of the weapon": "「成功打中一发信标弹会给予 20 秒的增益，加上 50% 的绝对暴击率。这个增益在目标死亡后仍然保留，并且不受 MOD 影响」（维基）。它是直接加在算完的暴击率上的固定值，由另一个射击模式给予，而本引擎没有「一个模式给另一个模式上增益」这种形状 —— 所以本条目按它自己的 23% 开火，而一个已经打中信标的玩家坐在 73% 上。这是这把武器更大的那一半"
  "'using Alternate Fire without a full gauge still drains it completely' (wiki) — this engine only fires the form once the gauge is full, so it never wastes one": "「在能量槽没满时使用副攻击仍然会把它清空」（维基）—— 本引擎只在能量槽满了之后才发射这个形态，所以它永远不会浪费一次"
  "'weak point hits have +250% CRITICAL CHANCE, additive with mods like Point Strike' (wiki). This engine has no headshot-conditional crit bucket — a crit is rolled for the hit and the body part is drawn beside it — so this arena's crit chance is the unaimed 40% where a headshot lands at 290%. It is the larger half of the weapon": "「爆头命中获得 +250% 暴击率，与 Point Strike 这类 MOD 加算」（维基）。本引擎没有以爆头为条件的暴击池 —— 暴击是为这一次命中掷的，命中部位是在旁边另外抽的 —— 所以这个战场用的是不带这一条的 40%，而一次爆头本该落在 290%。这是这把武器更大的那一半"
  "+30% Movement Speed while aiming, and the explosion's self-stagger: neither is a number this arena reads": 瞄准时 +30% 移动速度，以及爆炸对自身的踉跄：这两项都不是这个战场会读取的数字
