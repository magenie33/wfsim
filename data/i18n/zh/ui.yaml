  "Orbs merge, and a full set collapses into a singularity dealing damage over time in 5 m (module). The engine resolves each shot on its own, so neither is counted; this is most of the weapon, and the number reads well low.": "光球会合并，叠满后坍缩成奇点，在 5 米内持续造成伤害（模块）。引擎逐发独立结算，所以两者都未计入；这是这把武器的主要部分，数字明显偏低。"
  "Orbs merge: a new orb joining one in the air triggers 'Orb Merging Damage' in 4 m, growing with the number merged (wiki). The engine resolves each shot on its own, so the merge is not counted and the number reads well low for a player stacking orbs.": "光球会合并：新的光球并入空中已有的光球时，会在 4 米内触发「Orb Merging Damage」，伤害随合并数量增长（wiki）。引擎逐发独立结算，所以合并未计入，对堆叠光球的玩家而言数字明显偏低。"
