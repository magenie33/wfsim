  "the board's best riven-free build for each ruler": 榜单上每把尺子下最好的无裂罅配装
  ", and what this weapon's number does not account for": "，以及这把武器的数字没算进去的东西"
  "The best riven-free build": 不带裂罅的最佳配装
  "With a riven": 带裂罅
  "not measured yet": 还没测过
  "No build has been measured for this weapon yet. Submitting one puts it in the queue.": "这把武器还没有任何配装被测过。提交一套就会进入队列。"
  "Standard Single Target · Thrax Centurion Lv 9999 SP · 180 s · KPM": 标准单体 · 凶魂百夫长 9999 钢铁 · 180 秒 · KPM
  "Standard means this fight is claimed to represent most play, not that it is the fight you play: one tough, unaffiliated target, and a build that beats it transfers.": 「标准」是说这场战斗被判断为能代表大多数情况，不是说你平时就在打它：一个耐打、不属于任何派系的目标，打得赢它的配装能迁移到别处。
  "The target is a Thrax Centurion because a build that beats it transfers: it belongs to no faction, so no faction mod and no faction bonus reads on it; it carries Overguard, which most Warframe abilities cannot take off, so the weapon has to; it is armoured and tanky; it is immune to no element, so every proc lands; its weak points are the ordinary ones, 3x on the head and 1x elsewhere.": 选凶魂百夫长做目标，是因为打得赢它的配装能迁移：它不属于任何派系，派系 MOD 和派系加成都对它无效；它带超宏防护，大多数战甲技能扒不掉，只能靠武器；它有护甲，够肉；它不免疫任何元素，各种触发都能正常吃到；它的弱点分布是常见的，头部 3 倍、其他部位 1 倍。
  "Its flaws are stated rather than hidden: it carries no shield, its Overguard may sit high, and the spectral form it enters on death is switched off here.": 它的缺点也写在这里，不藏着：它没有护盾，超宏防护可能偏高，死后的灵体形态在这里是关掉的。
  "Standard means this fight is claimed to represent most play, not that it is the fight you play: a crowd of tough, unaffiliated targets, packed as close as every elemental area effect still reaches and no larger than holds them whole.": 「标准」是说这场战斗被判断为能代表大多数情况，不是说你平时就在打它：一群耐打、不属于任何派系的目标，站得刚好让每种元素范围效果都能打到邻居，方阵大小刚好装下它们。
  "The spacing decides whether splash or single-target damage wins: 3 m is where that ordering matches play, and it is the widest whole metre at which Electricity still reaches a neighbour.": 决定溅射还是单体胜出的是间隔：3 米时这个排序和实战一致，也是电还能打到相邻敌人的最大整米间隔。
  "One specific fight players run, measured as it is rather than as a stand-in for most play: a Demolisher a full squad meets, taken apart by one weapon.": 这是玩家实际会打的一场具体战斗，按它本来的样子来测，不代表大多数情况：一整支小队面对的爆破使，由一把武器单独拆掉。
  "One specific fight players run, measured as it is rather than as a stand-in for most play: the Eximus Corrupted Heavy Gunner of the Void Fissures, taken apart by one weapon.": 这是玩家实际会打的一场具体战斗，按它本来的样子来测，不代表大多数情况：虚空裂缝里的卓越者堕落重型机枪手，由一把武器单独拆掉。
  "Skull Shots and Stinging Truth, the Viper-exclusive mods — weapon-exclusive cards outside the pools this roster loads": "「Skull Shots」和「Stinging Truth」，Viper 家族的专属 MOD——这是武器专属卡，不在本武器库载入的卡池里"
  "Sometimes it says the number is right and the game is wrong, and names the bug a hotfix would take away.":
    有时候它会说：数字没错，是游戏错了——顺带指出那个下次热修可能就没了的 bug。
  "Sort": 排序
  "Not offered here: Spring-Loaded Broadhead and the bow-exclusive Thunderbolt. Thunderbolt turns every arrow into a grenade, a second damage source.": "这里不提供：Spring-Loaded Broadhead 和弓专属的 Thunderbolt。Thunderbolt 会把每支箭变成一颗手雷，是一整个第二伤害来源。"
  "Not offered here: Spring-Loaded Broadhead, Amalgam Daikyu Target Acquired and the bow-exclusive Thunderbolt.": "这里不提供：Spring-Loaded Broadhead、Amalgam Daikyu Target Acquired 和弓专属的 Thunderbolt。"
  "Sprint Speed": 冲刺速度
  "Stagger Resist (aiming)": 抗击退（瞄准时）
  Stalker: 追猎者
  "Stats": 属性
  "Status Chance": 触发几率
  "Status Damage": 触发伤害
  "Status Duration": 触发持续时间
  "Status Spread Chance": 异常扩散几率
  "Status immunity": 异常免疫
  "Steel Path": "钢铁之路"
  "Submit": 提交
  "Support WFSim": 支持 WFSim
  "Support": 支持
  "Sustained DPS": 持续 DPS
  "Tau's status effect is not modelled. Tau's neutral damage is applied correctly, but its proc raises the status chance the target takes from every other source by 10% a stack, up to ten (wiki). With other statuses stacked, the number reads low.": "Tau 的异况效果未建模。Tau 对各类生命都是中性伤害，这一点处理正确；但它的触发效果会让目标受到的其他所有来源的触发几率每层 +10%，最多十层（wiki）。堆其他异况时数字偏低。"
  "Pressing reload again 22-38% into a reload cuts it to 1 s and loads Heat rounds with +25% damage and guaranteed status (wiki). It is a timed input the sim does not press, so every reload is the full 5 s with ordinary rounds, and the number reads well low.": "在换弹进行到 22%–38% 时再按一次换弹，换弹缩短到 1 秒，并装入 +25% 伤害、必定触发的火焰弹（wiki）。这是一个有时机的按键，模拟不会按，所以每次都是完整的 5 秒换弹和普通子弹，数字明显偏低。"
  "The alt-fire is a finisher tool: it latches a mite onto up to 6 enemies, marking their heads for 5 s and dealing Impact and Magnetic damage each second for 10 s, and against an enemy open to a Mercy it teleports the player in. It is out of reach here: it needs a target within 25 m, its damage over time has no form in the engine, and this fight has no execution threshold. The catalog's row for it reads 'Does not apply'.": "副射击是处决工具：它会把寄生虫附在最多 6 个敌人身上，标记头部 5 秒，并在 10 秒内每秒造成冲击和磁力伤害；对可被慈悲处决的敌人，则把玩家传送过去。这里用不上：它需要 25 米内的目标，它的持续伤害在引擎里没有对应形式，本场也没有处决血线。目录给它的那一行写的是「Does not apply」。"
  "A cube that is shot explodes for 600 Blast in 6 m, four times this blast (wiki). The sim never shoots a cube, so the number reads low.": "被打中的方块会在 6 米内爆炸，造成 600 爆炸伤害，是这次爆炸的四倍（wiki）。模拟从不打方块，所以数字偏低。"
  "The grenade's damage scales with how full the magazine is (page), and this entry always fires the full-magazine grenade. Every later shot in a magazine reads high unless the rifle is reloaded first, which is how it is played.": "榴弹伤害与弹匣剩余比例成正比（页面），本条目每次都打满弹匣的那一发。一个弹匣里第一发之后的每一发都偏高，除非先换弹，而这正是它的实际用法。"
  "The explosion comes on the reload: rounds lodge in surfaces and explode in 1.5 m when reloading, up to 32 at a time (wiki). The engine's explosions go off on impact, so the 48 Blast a round is not counted, and against anything that survives a magazine the number reads low by about four fifths.": "爆炸发生在换弹时：子弹嵌在表面，换弹时在 1.5 米内爆炸，一次最多 32 发（wiki）。引擎的爆炸在命中时发生，所以每发 48 点爆炸伤害未计入；面对能扛过一个弹匣的目标，数字大约偏低五分之四。"
  "The explosion is the whole weapon, and its radius is not modelled: the mine deals no contact damage, so this entry carries the blast as the shot's own damage. Against one target, as in this fight and on the boards, the number is exact; against a crowd it reads low.": "爆炸就是这把武器的全部，而它的半径未建模：地雷没有接触伤害，所以本条目把爆炸当作这一发自己的伤害。对单个目标（本场和榜单都是如此）数字是准确的；面对人群时偏低。"
  "The innate Corrosive damage over time, 177 of each dart's 253, is dealt in 3 ticks of 59 over 2 s, per multishot pellet. The engine has no damage-over-time attack, so it is not counted, and against one target the number is about a third of the real one.": "自带的腐蚀持续伤害占每根飞镖 253 点中的 177 点，在 2 秒内分 3 跳、每跳 59 点，多重射击的每一发各自生成一份。引擎没有持续伤害类攻击，所以未计入；对单个目标，数字大约只有真实值的三分之一。"
  "The innate Corrosive damage over time, 81 of each dart's 130, ticks at 27, per multishot pellet. The engine has no damage-over-time attack, so it is not counted, and against one target the number is about a third of the real one.": "自带的腐蚀持续伤害占每根飞镖 130 点中的 81 点，每跳 27 点，多重射击的每一发各自生成一份。引擎没有持续伤害类攻击，所以未计入；对单个目标，数字大约只有真实值的三分之一。"
  "The pellet count spools up too, one more per consecutive shot (page); this entry fires the full count from the first shot. No fire-rate ramp is published either, so the rate is the settled one.": "弹丸数也会累积，每连续一发多一颗（页面）；本条目从第一发起就打满弹丸数。页面同样没有公布射速的爬升数据，所以射速也是稳定后的数值。"
  "The perfect shot is not carried: the module gives a third attack, an arrow released in a window at 1.05 s, for more damage than this full draw. The engine has no way to describe a timing window, so one weapon cannot carry both. A player who hits the window does better than this number.": "完美射击未录入：模块给了第三段攻击，在 1.05 秒窗口内松手射出的箭，伤害高于这里的满蓄力。引擎无法描述时机窗口，所以一把武器不能同时带两者。抓住窗口的玩家高于这个数字。"
  "The field pulls enemies within 10 m toward it for 30 s, the reason it is thrown. Grouping enemies helps every area weapon in a real room; enemies here do not move, so it changes nothing.": "力场会在 30 秒内把 10 米内的敌人拉向自己，这正是投出它的目的。把敌人聚在一起对真实房间里的每件范围武器都有帮助；这里的敌人不会移动，所以没有影响。"
  "THE RELOAD GRENADE, which is most of this weapon and the whole reason it is built: every reload throws one at the reticle, exploding in a 5-7 metre radius, and reloading FROM EMPTY makes it far larger — 1,997 Corrosive in 7 metres at 31% crit and 59% status, against 203 in 5 metres at 11% and 43% on a partial reload. The engine has no hook that fires an attack ON A RELOAD, so none of it is counted and the number on screen is the beam alone. The CODA variant throws THREE of them": "换弹榴弹，它才是这把武器的主体，也是它被拿来配装的全部理由：每次换弹都会朝准星扔出一枚，在 5–7 米半径内爆炸；而「空匣换弹」会让它大得多——7 米内 1997 腐蚀、31% 暴击率、59% 异况，对比非空匣换弹的 5 米内 203 伤害、11% 与 43%。引擎没有「在换弹时触发一次攻击」的挂载点，所以这部分一点都没算，屏幕上的数字只是光束本身。终幕版本一次扔三枚"
  "THE RELOAD GRENADES, which are most of this weapon and the whole reason it is built: \"Reload throws 3 grenades at a 45 degree angle towards the reticle that explodes in 3-5 meter radius on impact\", and reloading FROM EMPTY makes them far larger — 658 Corrosive apiece in 5 metres at 31% crit and 59% status, against 74 in 3 metres at 11% and 43% on a partial reload. Three of the from-empty grenades is 1,974 damage, which dwarfs the beam that earned them. The engine has no hook that fires an attack ON A RELOAD, so none of it is counted and the number on screen is the beam alone": "换弹榴弹，它才是这把武器的主体，也是它被拿来配装的全部理由：「换弹时朝准星方向以 45 度抛出 3 枚榴弹，命中后在 3–5 米半径内爆炸」，而「空匣换弹」会让它们大得多——每枚 5 米内 658 腐蚀、31% 暴击率、59% 异况，对比非空匣换弹的 3 米内 74 伤害、11% 与 43%。三枚空匣榴弹是 1974 点伤害，把挣来它们的那道光束衬得微不足道。引擎没有「在换弹时触发一次攻击」的挂载点，所以这部分一点都没算，屏幕上的数字只是光束本身"
  "On a reload the blades return, damaging everything in their path with critical chance set to 300% (wiki). A reload here fires nothing, so the number is the throw alone and reads well low.": "换弹时刀刃会飞回，沿途伤害一切，暴击率设为 300%（wiki）。这里的换弹不会发射任何东西，所以数字只是投掷本身，明显偏低。"
  "The spores are most of the weapon: an enemy hit by it and then killed spreads spores to 3 enemies within 20 m, with Cold every second and 50% vulnerability to this weapon for 20 s. It needs a kill and other enemies, so against one standing target it adds nothing; in a room it roughly doubles the weapon.": "孢子是这把武器的主要部分：被它命中后死亡的敌人会把孢子扩散给 20 米内的 3 个敌人，每秒施加冰冻，并让它们在 20 秒内受这把武器的伤害 +50%。它需要击杀和其他敌人，所以对单个站桩目标不产生收益；在房间里大约能让这把武器翻倍。"
  "This is the perfect release, not the ordinary full draw: the arsenal shows it and this entry carries its numbers. A mistimed release gets the module's second attack instead, a one-second draw for less damage, which is not carried. The engine has no way to describe a timing window, so one weapon cannot carry both.": "这是完美释放，不是普通的满蓄力：兵工厂显示的是它，本条目也用它的数值。没抓住窗口的释放会打出模块里的第二段攻击（一秒蓄力、伤害更低），这一段未录入。引擎无法描述时机窗口，所以一把武器不能同时带两者。"
  "Technique": 手法
  "Tendrils": 卷须
  "Not offered here: Tether Grenades, Napalm Grenades and the launcher-exclusive Adhesive Blast. Tether Grenades turns each grenade into a vortex.": "这里不提供：Tether Grenades、Napalm Grenades 和发射器专属的 Adhesive Blast。Tether Grenades 会把每颗榴弹变成引力涡旋。"
  "The Vast Untime's +50% Void vulnerability, and its pause on this buff's timer, belong to another Xaku ability, which is not modelled.": "超维炼狱的 +50% 虚空易伤，以及它对本增益计时的暂停，属于 Xaku 的另一个技能，未建模。"
  "The account of one hit": 一发的账
  "The fight": 这场战斗
  "The grid is stated as three numbers rather than as 25 positions, so its terms can be read and argued with.": 方阵用三个数字描述而不是 25 个坐标，这样它的条款才读得懂、争得动。
  "The real Simulacrum Prime.": 真正的幻影装置 Prime。
  "The Tenno": 使用者
  "The score is kills per minute across the whole formation, counting the fraction of each target already gone.": 分数是整个阵型的每分钟击杀数，并计入每个目标已被削掉的比例。
  "The shooter stands at contact with the middle body of the front rank, and fires along the line that rank faces.": 射手贴身站在前排正中那个目标前，沿着该排面对的方向射击。
  "The target is a formation of 25 Thrax Centurions at level 9999 on Steel Path, a 5 by 5 grid spaced 3 metres centre to centre: the smallest odd square that holds every elemental area effect around the aimed body whole, a fully grown 6 m Gas cloud included. The fight lasts 180 seconds.": 目标是 25 个 9999 级钢铁之路凶魂百夫长组成的阵型，5×5 的方阵，圆心间隔 3 米：这是能把以被瞄准敌人为中心的所有元素范围效果完整装下的最小奇数方阵，叠满到 6 米的毒气云也在内。战斗持续 180 秒。
  "A weapon's own explosion wider than about 6 m, and punch-through past five bodies, are clipped by the grid on purpose: a deeper column would rank the formation rather than the weapon.": "武器自身半径超过约 6 米的爆炸，以及超过 5 个的穿透，会被方阵有意截掉：更深的纵列排出来的是场地，而不是武器。"
  "There is no transition animation either way.": 两个方向都没有切换动作。
  "Thermagnetic Shells, the Detron family's exclusive mod — a weapon-exclusive card outside the pools this roster loads": "「热磁弹壳」，Detron 家族的专属 MOD——这是一张武器专属卡，不在本武器库载入的卡池里"
  "Time to first kill": 首杀耗时
  "Toggle light / dark": 切换亮色 / 暗色
  "Toggle theme": 切换主题
  "Tools": "工具"
  "Toxic Sequence, the Acrid-exclusive mod — a weapon-exclusive card outside the pools this roster loads": "「Toxic Sequence」，Acrid 的专属 MOD——这是一张武器专属卡，不在本武器库载入的卡池里"
  "Transforms": 形态切换
  "Transmute In": 灵化切入
  "Transmute Out": 灵化切出
  "Valence bonus": 效价加成幅度
  "Valence": 效价加成
  "Velox Conclusion, the Velox-exclusive mod — a weapon-exclusive card outside the pools this roster loads": "「Velox Conclusion」，Velox 家族的专属 MOD——这是一张武器专属卡，不在本武器库载入的卡池里"
  "Voruna's signature bonus is not modelled: carried by her, the ammo pool doubles to 48.": "Voruna 的专属加成未建模：由她携带时备弹翻倍到 48。"
  "Voruna's signature bonus is not modelled: carried by her, the ammo pool grows to 56.": "Voruna 的专属加成未建模：由她携带时备弹增至 56。"
  "WF Sprint": 战甲冲刺速度
  "WFSim is an unofficial fan project, not affiliated with or endorsed by Digital Extremes. Warframe is a trademark of Digital Extremes Ltd.": WF模拟 是非官方粉丝项目，与 Digital Extremes 无从属关系，也未获其认可。Warframe 是 Digital Extremes Ltd. 的商标。
  "While aiming, headshots get +400% critical chance, additive with Point Strike (wiki). The engine has no headshot-only crit bonus, so the crit chance here is the unaimed one. It is most of the weapon: in a headshot-heavy fight the number reads well low.": "瞄准时爆头获得 +400% 暴击率，与 Point Strike 加算（wiki）。引擎没有只对爆头生效的暴击加成，所以这里用的是不带这一条的暴击率。这是这把武器的主要部分：以爆头为主的战斗中数字明显偏低。"
  "Warframe ability": 战甲技能
  "Warframe buffs": 战甲增益
  "Warframe": 战甲
  "Weapon passive: Frenzy — see its buff card (grants +1 toxin while active).": 武器被动：疯狂 —— 详见它的增益卡（生效期间提供 +1 毒素）。
  "Weapons": 武器
  "What each mode is": 每种输出方式分别是什么
  "Only the build is sent: the weapon and its mods, evolutions and arcanes. Not your fight, and nothing about you: no account and no score. The board takes builds with every main slot filled.": "只发送配装：武器及其 MOD、进化和赋能。不含场景，也不含任何关于你的信息：没有账号，没有分数。榜单只收主槽位全部装满的配装。"
  "What this benchmark measures": 这个基准到底在量什么
  "What would be sent: the weapon and its mods, evolutions and arcanes. Nothing else — no account, no identifier, no names you chose, and no score (the board measures builds itself).": 会发送的内容：武器，以及它的 MOD、进化和赋能。仅此而已 —— 没有账号，没有任何标识，没有你起的任何名字，也不含分数（榜单自己测量配装）。
  "Where the damage went": 伤害落在哪里
  "Which means no Incarnon, for all but one weapon: eight of the nine Incarnon forms charge their gauge on weak-point hits, so at this rate they never fill it. The Torid charges on direct hits and still cycles.": 这也意味着除一把之外都进不了灵化：九个灵化形态里有八个靠弱点命中充能，在这个爆头率下永远填不满。托里德靠直接命中充能，照常循环。
  "How to check it": "如何核对"
  "Zazvat-Kar, the Akstiletto Prime-exclusive mod — a weapon-exclusive card outside the pools this roster loads": "「Zazvat-Kar」，Akstiletto Prime 的专属 MOD——这是一张武器专属卡，不在本武器库载入的卡池里"
  "Zoom": 变焦
  "A missed shot drops the combo counter. This entry cannot miss, so only its {seconds} s timer removes a stack, and the number is the ceiling.": "打空一枪会掉连击。这个条目不会打空，所以只有 {seconds} 秒计时会掉层，数字是上限。"
  "a benchmark build — measured under": 基准配装 —— 测试标准
  "a bigger magazine makes the reload LONGER here and the sim does not know it — shells are loaded one at a time, so Ammo Stock buys capacity and pays for it in reload": 弹匣越大装填越慢，模拟不知道这件事 —— 子弹是一发一发上的，所以弹药储存换来的容量要拿装填时间去付
  "A partly charged shot is not modelled: an early release multiplies the Normal Shot's own base by (1 + charge) and adds the evolution's flat damage outside that, so 50% is 40 x 1.5 + 3, not 43 x 1.5. Only the two ends are carried: no charge, and the full charge.": "半蓄力射击未建模：提前松手时，乘以 (1 + 蓄力进度) 的是普通射击自己的基数，进化的固定伤害加在倍率之外，所以 50% 蓄力是 40 × 1.5 + 3，不是 43 × 1.5。这里只有两端：不蓄力和满蓄力。"
  "A ghost is counted, not fought: a charged-shot kill leaves one for 7 s and the run reports how many there were, but a ghost neither attacks nor blocks here.": "灵体只统计、不参战：蓄力射击击杀会留下一个，持续 7 秒，本次运行会报告数量；但这里灵体既不攻击，也不阻挡。"
  "A cube left alone detonates after 9 s, which needs a miss and a timer the sim does not run.": "无人理会的方块会在 9 秒后自行引爆，这需要一次打空和一个模拟不运行的计时。"
  "A direct hit forces a knockdown and the explosion a ragdoll; neither is damage, and enemies here are neither knocked down nor thrown.": "直击必定击倒，爆炸必定造成布娃娃效果；两者都不是伤害，这里的敌人既不会被击倒也不会被抛飞。"
  "A direct hit forces a knockdown (wiki). Enemies here are not knocked down; the number is unaffected.": "直击必定击倒（wiki）。这里的敌人不会被击倒，数字不受影响。"
  "a per-PELLET aim weight, not a whole-spread promise — the landing spot is rolled for each pellet": 这是逐弹丸的瞄准权重，不是整片弹丸都爆头 —— 落点对每颗弹丸单独掷点
  "a percentage, into the same bucket a mod of this stat feeds — permanent, no trigger and no clock": 一个百分比，进入这条属性的 MOD 所在的同一个乘区——永久生效，没有触发条件也没有时间
  "percentage points added after mods, never scaled by the base — permanent, no trigger and no clock": 百分点，在 MOD 之后直接加上，不按基础值缩放——永久生效，没有触发条件也没有时间
  "Flat Critical Chance": 固定暴击几率
  "Final Critical Damage": "最终暴击伤害"
  "Flat Base Damage (Condition Overload reads it)": "固定基础伤害（计入异况超量）"
  "Flat Base Damage (Condition Overload ignores it)": "固定基础伤害（不计入异况超量）"
  "a critical multiplier added after every relative bonus, as Arcane Crepuscular's is — 1.6 turns a modded 3.0x into 4.6x": "在所有相对加成之后再加上的暴击倍率，和赋能·影袭同一层——1.6 会把改装后的 3.0x 变成 4.6x"
  "damage added to the weapon's own base, which Condition Overload's bonus then counts — permanent, no trigger and no clock": "加到武器自身基础伤害上，异况超量的加成会把它算进去——常驻，无触发、无计时"
  "damage added to the weapon's own base and left out of what Condition Overload counts — permanent, no trigger and no clock": "加到武器自身基础伤害上，但不计入异况超量的加成——常驻，无触发、无计时"
  "a place of its own": "一个独立的地点"
  "A rocket that hits nothing detonates after 6 s; the sim does not model a miss.": "没有命中的火箭会在 6 秒后自行引爆；模拟不处理打空。"
  "a scenario can set a buff for a mod this build does not carry — the gain scan reads it": 场景可以为当前配装没装的 MOD 预设增益状态 —— 快速计算会读它
  "a second damage instance, not a multiplier — it takes faction damage and the headshot multiplier one more time than the hit it copies": 附加的一次独立伤害实例，不是乘区——派系伤害和弱点倍率都会比它复制的那一下多吃一次
  "a sentinel weapon is always aiming — it just never aims at the head, so on-headshot effects never fire": 守护武器永远处于瞄准状态 —— 它只是从不瞄准头部，所以爆头触发类效果不会生效
  "a sentinel weapon is fired by the companion and never aims at the head, so this is 0 whatever is typed — and every on-headshot effect stays dead":
    守护武器由守护自己开火，它从不瞄头，所以这里无论填什么都是 0 —— 一切「爆头时」的效果也都不会触发。
  "a stronger buff of the same kind is running — this one adds nothing": 同类里有更强的一个正在生效——这一个不产生任何加成
