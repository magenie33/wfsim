  "The two beams converge on the crosshair and deal full damage only once aligned (wiki); here both land on the target from the first tick, so the number is the ceiling.": "两道光束向准星汇聚，对齐后才打出全额伤害（wiki）；这里从第一跳起两道都打在目标上，所以数字是上限。"
