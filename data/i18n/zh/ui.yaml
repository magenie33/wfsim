  "BULLSEYE RELOAD, this weapon's own passive: \"Landing a successful headshot grants the 'Bullseye Reload' buff, increasing reload speed by 25% and can stack up to 2 times to a total of 50%. The buff lasts 4 seconds and can be refreshed on subsequent headshots.\" It is worth a shorter reload in proportion to how often a head is hit, and it is not applied here": "「Bullseye Reload」，这把武器自己的被动：「成功爆头会获得『Bullseye Reload』增益，换弹速度 +25%，最多叠 2 层共 +50%。增益持续 4 秒，可由后续爆头刷新。」它值多少换弹时间，与爆头频率成正比，而这里没有施加"
  "BURST-FIRING the Incarnon form out of its own spool-down: the rate falls to 60% over 51 held shots and resets the moment you stop firing, so a player who taps rather than holds keeps more of the 13.33/s than this sim does — it holds the trigger until the magazine is dry. The spool itself IS modelled; what is not is the play pattern that dodges it": 用点射绕开灵化形态自己的射速衰减：按住不放时射速会在 51 发内降到 60%，一停火就回满，所以点射的玩家能比这里的模拟更多地保住 13.33/秒——模拟是一直按到弹匣打空为止。衰减本身已经建模，没有建模的是躲开它的打法
