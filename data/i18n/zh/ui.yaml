  "corpses keep conducting the chain, which the page states as 'Enemy corpses will still allow the beam to connect to nearby enemies' — this arena removes a body when it dies": "尸体仍然能导电，页面的原话是「敌人的尸体仍然允许光束连接到附近的敌人」——本场里一个身体死了就会被移走"
  "corpses keep conducting the chain, which the page states as 'Enemy corpses will still allow the beam to connect to nearby enemies' — this arena removes a body when it dies, so a chain that would have hopped THROUGH a corpse to a live enemy behind it finds nothing there": "尸体仍然能导电，页面的原话是「敌人的尸体仍然允许光束连接到附近的敌人」——本场里一个身体死了就会被移走，所以一段本该「穿过」尸体连到它身后活敌的连锁，在这里什么也找不到"
  "corpses ride the dart: \"On kill, bodies will follow the dart that killed them, damaging anyone in their path\", which needs a corpse, a direction and a bystander this arena does not move": "尸体会跟着飞镖走：「击杀时，尸体会跟随击杀它的那根飞镖飞行，并伤害沿途的任何人」。这需要一具尸体、一个方向和一个旁观者，而本场里这些都不会移动"
