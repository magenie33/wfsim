  # The card WORKS and one named effect on it does not — never "尚未建模",
  # which would disown a mod that lands 1,000 damage a blast.
  "partly modelled": 部分建模
  "everything else on this card is modelled; this is not:": 这张卡上的其余部分都已建模，唯独以下没有：
  "A Status Effect has a 15% chance to SET the next hit's crit chance to 300% — ignoring every other crit bonus. Rolled per pellet.": 异常状态有 15% 几率把下一次命中的暴击率设定为 300%——无视其他一切暴击加成。逐弹丸判定。
  "Its innate headshot bonus MULTIPLIES the headshot bracket instead of joining it, so it compounds with Deadhead and Target Acquired rather than adding to them.": 它自带的爆头加成是乘在爆头加算区上，而不是并入其中——所以它与首领终结、锁定目标是相乘而非相加。
  # THE PHENMOR'S SPOOL-DOWN. Both halves are the point: the panel above prints
  # 13.33 发/秒 and the sim fires most of the magazine at 8.0, so the line has
  # to say which one the DPS below it came from.
  "Its fire rate FALLS while the trigger is held — to 60% of the listed rate over 51 shots — and rebuilds the moment you stop firing. This is simulated; the sim holds the trigger until the magazine is dry.": 持续按住扳机时射速会下降——51 发之内降到标称射速的 60%，一停火就立刻回满。这条已经建模；模拟里是一直按到弹匣打空为止。
  "Its fire rate SPOOLS UP while the trigger is held — from 20% of the listed rate, full from the 9th shot. This is simulated, and it rebuilds after every reload.": 持续按住扳机时射速会往上爬——从标称射速的 20% 起步，到第 9发拉满。这条已经建模，每次换弹后重新爬。
  "Its fire rate SPOOLS UP while the trigger is held — from 20% of the listed rate, full from the 6th shot. This is simulated, and it rebuilds after every reload.": 持续按住扳机时射速会往上爬——从标称射速的 20% 起步，到第 6发拉满。这条已经建模，每次换弹后重新爬。
  "Its fire rate SPOOLS UP while the trigger is held — from 20% of the listed rate, full from the 7th shot. This is simulated, and it rebuilds after every reload.": 持续按住扳机时射速会往上爬——从标称射速的 20% 起步，到第 7发拉满。这条已经建模，每次换弹后重新爬。
  "Its fire rate SPOOLS UP while the trigger is held — from 25% of the listed rate, full from the 6th shot. This is simulated, and it rebuilds after every reload.": 持续按住扳机时射速会往上爬——从标称射速的 25% 起步，到第 6发拉满。这条已经建模，每次换弹后重新爬。
  "Its fire rate SPOOLS UP while the trigger is held — from 25% of the listed rate, full from the 4th shot. This is simulated, and it rebuilds after every reload.": 持续按住扳机时射速会往上爬——从标称射速的 25% 起步，到第 4发拉满。这条已经建模，每次换弹后重新爬。
  "BURST-FIRING the Incarnon form out of its own spool-down: the rate falls to 60% over 51 held shots and resets the moment you stop firing, so a player who taps rather than holds keeps more of the 13.33/s than this sim does — it holds the trigger until the magazine is dry. The spool itself IS modelled; what is not is the play pattern that dodges it": 用点射绕开灵化形态自己的射速衰减：按住不放时射速会在 51 发内降到 60%，一停火就回满，所以点射的玩家能比这里的模拟更多地保住 13.33/秒——模拟是一直按到弹匣打空为止。衰减本身已经建模，没有建模的是躲开它的打法
  "Weapon passive: Frenzy — see its buff card (grants +1 toxin while active).": 武器被动：狂乱 —— 详见它的增益卡（生效期间提供 +1 毒素）。
  "this weapon's passive is not modelled yet — the numbers below are a floor, not its full output": 这把武器的被动尚未建模——下面的数字是下限，不是它的完整输出
  "its added base does not feed Condition Overload": 它增加的基础伤害不计入异况超载
  "Condition Overload computes on this weapon's ORIGINAL base damage — this perk's added base is excluded, so every status type is worth less than the card implies": 异况超载按这把武器的原始基础伤害计算——这个进化增加的基础伤害不计入，所以每一种异常的价值都低于卡面看起来的样子
  "real damage the simulator does not compute yet": 这是真实的伤害，只是模拟器还没有实现
  "outside the sim": 不在模拟范围
  "element": 元素
  "this ability lets you pick the element — the gear wheel in game": 这个技能可以自选元素——游戏里那个装备轮盘
  "5 · Extra stats": 5 · 额外属性
  # THE VALENCE BLOCK (an adversary weapon's bonus element). "Valence" is DE's
  # own word and its Chinese client writes 融合 for Valence Fusion, so the block
  # is named for what it IS rather than transliterated.
  "Valence": 融合属性
  "how many times to replay this fight HERE. Not part of the scenario: it follows you across fights and weapons, and an official ruler does not pin it. The boards themselves are scored at 1,000 by the server whatever this says": 在这里把这场战斗重放多少次。它不属于场景：换战斗、换武器它都跟着你，官方标尺也不会把它锁住。榜单本身无论这里写多少，都是服务器按 1,000 次跑分的
  "yours, not the fight's — the boards score at 1,000": 这是你的设置，不属于这场战斗——榜单按 1,000 次跑分
  "7 · Measure": 7 · 指标
  "what to read off the run — the scenario's own term, so an official ruler pins it": 从这次运行里读什么——这是场景自己的条款，所以官方标尺会把它锁住
  "the progenitor element — pool = searched, req = pin one": 始祖元素——pool 表示纳入搜索，req 表示钉死一个
  "the bonus this copy came out of its Lich with — added as the weapon's own BASE damage, so elemental mods and status scale with it": 这把枪从它的 Lich 那里带出来的加成——作为武器自身的基础伤害加上去，所以元素 mod 和异常都会跟着放大
  "the weapon's printed panel": 就是武器面板上印的那样
  # "Element" is already in the roster below and "Bonus" is already there
  # meaning 增益 (a buff), which this is not — so the control says VALENCE BONUS
  # and gets a key of its own rather than borrowing a word that means the other
  # thing on the same page.
  "Valence bonus": 融合加成
  "how big the roll was, as a share of base damage — a Lich rolls it randomly and Valence Fusion raises it, capping at the number on the right": 这次roll出来多大，按基础伤害的比例算——Lich 随机给，融合可以往上提，上限就是右边那个数
  "rolls": 区间
  "Extra stats": 额外属性
  "anything this weapon is handed from outside its build — it lands in the same bucket a mod would": 这把武器从配装之外拿到的任何加成——它落在和对应 mod 同一个乘区里
  "read-only — the fight's own, and every candidate is scored with them": 只读——属于这场战斗，每个候选配装都带着它们计分
  "a percentage, into the same bucket a mod of this stat feeds — permanent, no trigger and no clock": 一个百分比，进入这条属性的 mod 所在的同一个乘区——永久生效，没有触发条件也没有时间
  # The nine stat LABELS this block draws are already in the roster below —
  # they are the same words the stats panel uses, which is the point: a bonus
  # lands in the bucket that row is about.
  "6 · Warframe buffs": 6 · 战甲增益
  "abilities cast on this weapon — set your Ability Strength and the values follow": 施加在这把武器上的战甲技能——填入技能强度，下面的数值随之变化
  "7 · Simulation": 7 · 模拟
  "Warframe buffs": 战甲增益
  "Benchmark build — read-only": 榜单配装——只读
  "It is already a row on the board, so nothing here can be edited and its runs are not submitted. Copy it and everything opens up — mods, arcanes, evolutions and the mode — and what you run goes to the board as your own entry.": 它本身就是榜上的一行，所以这里什么都改不了，跑出来的结果也不会提交。复制一份，全部就都能改了——mod、赋能、进化，还有形态——而且你跑出来的成绩会作为你自己的一行进榜。
  "copy it to edit": 复制一份来编辑
  "this is a benchmark row — copy it to edit": 这是榜上的一行——复制一份才能编辑
  "3 · Limits": 3 · 限制
  "4 · Buffs": 4 · 增益
  "early access — every buff runs the whole engagement for now, and this block moves onto the Warframe itself once frames land": 抢先开放——目前每个增益都是全程生效，等战甲本体做进来以后这一块会搬到战甲上
  "running": 个生效中
  "none — the weapon on its own": 无——武器裸装
  "read-only — the fight's own, and every candidate is scored under them": 只读——这是战斗自己的设定，每一个候选配装都在它下面评分
  "Ability Strength %": 技能强度 %
  "your Warframe's Ability Strength, as the arsenal shows it — every value below is this times the wiki's max-rank number": 你战甲的技能强度，就是军械库里显示的那个数——下面每一个数值都是它乘以 wiki 的满级数值
  "a stronger buff of the same kind is running — this one adds nothing": 同类里有更强的一个正在生效——这一个不产生任何加成
  "faction damage — the bracket a Bane mod is in, so a status tick takes it twice": 派系伤害——和克制 mod 同一个乘区，所以异常跳伤会吃到两次
  "damage on its own multiplier — applied once, to the hit and to the status alike": 独立乘区的伤害加成——只吃一次，直伤和异常都是一次
  # THE ONE ABILITY LINE THAT IS NOT ABOUT DAMAGE. It has to say where to look
  # instead, or a card reading "+75%" beside four damage buffs is read as a
  # damage buff.
  "ammo efficiency — it does not touch damage: it divides what a shot costs the magazine, so what it buys is reloads not taken. Multiplicative with other ammo-efficiency sources": 弹药效率——它不碰伤害：它把一发子弹消耗的弹匣量除下去，所以买到的是少换的弹。与其他弹药效率来源相乘叠加
  "added on top and NOT combined with the weapon's own elements": 直接加在最终属性之上，不与武器自身的元素合成
  "a second damage instance, not a multiplier — it takes faction damage and the headshot multiplier one more time than the hit it copies": 附加的一次独立伤害实例，不是乘区——派系伤害和弱点倍率都会比它复制的那一下多吃一次
  "Extra hit (ability)": 技能附加伤害
  # 真理密语 admits four gaps and one live bug. Long sentences, so they are here
  # rather than derived — the card renders each line through `tr`.
  "the Bullet Attractor itself — it deals no damage, and what it is actually worth (redirecting enemy fire, letting one punch-through round hit twice) needs enemies that shoot back and a second target": 虚空异常的子弹吸引力场本身——它不造成伤害，它真正的价值（把敌人的子弹引开、让一发穿透弹命中同一个敌人两次）需要会还击的敌人和第二个目标才能体现
  "the Sentient / Shadow Stalker damage-adaptation reset the Void proc performs": 虚空异常对 Sentient 与暗影 Stalker 伤害适应的重置
  "The Vast Untime's +50% Void vulnerability and its pause on this buff's timer — that is a second Xaku ability, and no frame layer exists yet": 超维炼狱带来的 +50% 虚空易伤，以及它对本技能计时的暂停——那是 Xaku 的另一个技能，而战甲这一层还没做
  "the extra hit off a lingering FIELD tick (Torid's cloud): neither wiki says whether a cloud tick triggers one, so it does not here — MEASUREMENTS M40": 持续伤害力场每一跳（如 Torid 的毒云）是否也会触发附加伤害：两个 wiki 都没有说，所以这里不触发——见 MEASUREMENTS M40
  "an extra hit fires off a Blast DETONATION, which is a status payload no other extra hit reacts to, and it takes the faction bonus a third time AND the full elemental bracket the detonation itself is denied. The wiki files it under Bugs; modelled as it plays, and a hotfix changes this number": 爆炸异常引爆时也会触发一次附加伤害——引爆是异常的伤害，别的附加伤害都不吃这一下——而且这一次派系伤害会被算第三遍，还会吃到引爆本身拿不到的全部元素加成。wiki 把它列在 Bug 里；这里按它现在的实际表现建模，DE 一修这个数字就会变
  "unintended, modelled as it plays": 非本意，按实际表现建模
  # 圣枪一对投掷形态的两条声明。力场本身已经建模（4.7 秒，计一层异况超载），
  # 还没建模的是它"更好爆头"的那一半——见 docs/UNMODELLED.md。
  "what the Bullet Attractor field is WORTH as an aiming aid — the throw plants it and the 4.7 s it puts on the target IS counted (one Condition Overload status), but the easier headshots are not: the wiki says the field does not guarantee a headshot, so the rate has to be MEASURED before this arena's headshot % can be moved by it. docs/UNMODELLED.md §Open decisions": 子弹吸引力场作为瞄准辅助的价值——投掷会种下力场，它挂在目标身上的 4.7 秒是算数的（计一层异况超载），但"更容易爆头"这一半没有：wiki 自己说这个力场并不保证爆头，所以在它能改变本场的爆头率之前，这个比例必须先实测。见 docs/UNMODELLED.md §Open decisions
  "the innate reload while holstered or deployed (33% of the magazine per second) — this arena never holsters the weapon": 收枪或长枪插在场上时的自动装填（每秒 33% 弹匣）——本场从不收枪
  "this matches the live game and is a bug — DE may patch it, and the number here changes when they do": 这与现在的游戏一致，但它是个 bug——DE 随时可能修，修了这里的数字就会变
  "the split fires a damage instance of ZERO, and the zero still takes that instance's own multipliers — when the DoT replaces it with the parent hit's damage, they stay behind. Faction bonuses were meant to carry down the chain and do; a per-instance bonus like Devouring Attrition's +2000% was not, and does anyway (x21 twice = x441). Modelled as it behaves today; a fix removes it": 分裂打出的是一次伤害为 0 的实例，而这个 0 照样被那一次实例自己的乘区乘过——等算 dot 时 0 被换成上一级那一发的伤害，那些乘区却留了下来。派系类加成本来就是设计成沿着链条传下去的；而像强袭损耗 +2000% 这样的单次实例加成不是，却也跟着传了（21 倍吃两次 = 441 倍）。这里按它现在的实际表现建模；DE 修了就没了
  "this acts on something a weapon-damage simulator has none of — Warframe energy, enemy behaviour, movement — so it would change no number here": 它作用于武器伤害模拟器根本没有的东西——战甲能量、敌人行为、移动——所以就算实现了，这里的任何数字也不会变
  "everything inside the bracket is ONE multiplicative bucket: these add together, and the bucket multiplies against the others": 括号里的东西属于同一个乘区：它们彼此相加，而这个乘区与其他乘区相乘
  "{what} — the board takes a weapon built as far as it goes, so this one is not sent": "{what} —— 榜单收的是这把武器的最努力配置，所以这一份不会提交"
  "{n} of {m} mods": "{n}/{m} 个 mod"
  "{n} of {m} evolutions": "{n}/{m} 层进化"
  "{n} of {m} arcanes": "{n}/{m} 个赋能"
  # FULLY FORMA'D, and the string says so: a submission carries no polarities
  # and the server plans them, so this is never about what you have set.
  "{n} of {m} capacity even fully forma'd": 极化拉满也要 {n} 容量，上限 {m}
  ", ": "、"
  "your exilus mod is not part of a benchmark build — it is left out of what is sent, so the board's number will differ from this one": 你的 exilus mod 不属于基准配装 —— 它不会被提交，所以榜单上的数字会和这里不同
  "the official test scenario — the same fight on every weapon, so results compare": 官方测试场景 —— 每把武器都是同一场战斗，结果之间可以比较
  "copy it into a {thing} of your own — the official one cannot be edited": 复制成一份你自己的{thing} —— 官方那份不可编辑
