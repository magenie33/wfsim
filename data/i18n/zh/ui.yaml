# 简体中文 — UI strings and the effect-line FALLBACK (hand-written).
#
# Everything here is a sentence WE wrote: panel labels, buttons, and the
# phrase table that translates our own engine-generated effect lines. What DE
# wrote — every mod and arcane card — is not here: it comes from DE's own
# localized strings in descriptions.yaml, whole sentences at a time.

