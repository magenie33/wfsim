  "Bullseye Reload, its passive: a headshot grants +25% reload speed for 4 s, stacking to 2 (wiki). It is not applied, so a headshot build reads low.": "Bullseye Reload（它的被动）：爆头会获得 4 秒 +25% 换弹速度，最多 2 层（wiki）。未应用，所以爆头配装数字偏低。"
  "The Incarnon form's fire rate falls to 60% over 51 held shots and resets when firing stops. The sim holds the trigger until the magazine is dry, so a player who taps keeps more of the 13.33/s. The spool-down itself is modelled.": "灵化形态的射速在持续开火 51 发内降到 60%，停火后立即回满。模拟会一直按到弹匣打空，所以点射的玩家能保住更多的 13.33/秒。射速衰减本身已建模。"
