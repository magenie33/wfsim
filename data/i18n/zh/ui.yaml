  "It reloads 50% faster from an empty magazine (wiki); the engine has one reload time per weapon. The sim always empties the magazine, so the {seconds} s here is the slow reload and the number reads low.": "空匣换弹快 50%（wiki），而引擎每把武器只有一个换弹时间。模拟总是打空弹匣，所以这里的 {seconds} 秒是慢的那次，数字偏低。"
  "Used by Garuda it gains 1 m of innate punch through (wiki), a Warframe-specific bonus not modelled here.": "由 Garuda 使用时会获得 1 米自带穿透（wiki），这是绑定战甲的加成，这里未建模。"
  "it needs the same trigger on every firing mode": 它要求武器的每种开火模式都是同一种扳机
  "It reloads {pct}% of its magazine a second while holstered or deployed; it is never holstered here, so the reload is always the full one.": "收枪或架设时每秒自动装填 {pct}% 弹匣；这里从不收枪，所以换弹始终是完整的一次。"
