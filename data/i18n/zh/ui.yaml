  "click: must have · again: I don't have · again: clear": "点一下：必须有 · 再点：我没有 · 再点：清除"
  "what you don't have, or must have — mods, arcanes, evolutions, riven stats": "你没有的、或必须要有的——MOD、赋能、进化、裂罅属性"
  "fixed on this weapon — it cannot be removed, and its slot takes no Forma": 这把武器固定装备，不能卸下，槽位也不能 Forma
  "no stance in the slot: stanceless combos are not modelled yet — equip a stance, or play heavy attacks, slide attacks or heavy slams": 架势槽是空的：无架势连段尚未建模——请装上一张架势，或改用重击、滑行攻击或重击震地
  "this stance publishes no timing for this combo, so it is not modelled — pick another combo or another stance": 这张架势的这个连段没有公布时长，所以未建模——请换一个连段或换一张架势
  "THE DAMAGE IS HYSTERIA'S AT 100% ABILITY STRENGTH. Every swing, slide and slam number on the page carries the Strength icon, so a Valkyr build with more strength deals proportionally more than this reports": "**伤害来自 Hysteria，按 100% 技能强度计**。技能页上每个挥砍、滑行和捶地数值都带强度图标，所以强度更高的 Valkyr 配装实际伤害会按比例高于此处"
  "Hysteria drains 5 Energy a second while the claws are out; Energy is not modelled, so they stay out for the whole fight.": "Hysteria 开着利爪时每秒消耗 5 点能量；能量未建模，所以利爪全程保持。"
  "RAGE, Valkyr's passive — +3% melee damage per hit and +12% per kill, up to +300%, additive with Pressure Point — is a Warframe passive and is not modelled, so a Valkyr build reads LOW here": "Rage（Valkyr 被动：每次命中 +3% 近战伤害、每次击杀 +12%，最高 +300%，与 Pressure Point 相加）是战甲被动，未建模，所以 Valkyr 配装在这里读数偏低"
  "Every hit restores 100 health; nothing damages the Tenno here, so it adds nothing.": "每次命中回复 100 生命；这里没有东西会伤害 Tenno，所以不产生收益。"
  "The 5% Movement Speed bonus while held: nobody moves here.": "持握时 5% 移动速度加成：这里没有人移动。"
  "Unpublished: how long a spectral dagger orbits before it seeks (the Incarnon Form card uses a stand-in), and which enemy it seeks (here, the nearest within 15 m). Both decide how soon a kill pays; neither is measured.": "未公开：灵体匕首在追踪前环绕多久（灵化形态卡上用的是占位值），以及追向哪个敌人（这里取 15 米内最近的一个）。两者都决定击杀多快兑现，都未实测。"
  "The heavy attack is 2x, from this weapon's infobox; the wiki's class table and stance module say 5x. Unmeasured.": "重击按本武器信息框取 2x；wiki 的类别表和架式模块写的是 5x。未实测。"
  "Assumed: the heavy attack's charge is a third of its published {published} s wind-up, the share measured on a Tonfa: {charge} s of charge, shortened only by wind-up speed, then {swing} s of swing, shortened by attack speed. This weapon's own split is unmeasured.": "假设值：重击蓄力取公布的 {published} 秒的三分之一（Tonfa 上实测的比例）：{charge} 秒蓄力，只受蓄力速度影响；之后 {swing} 秒挥砍，受攻速影响。这把武器自己的比例未实测。"
  "Not modelled: {attacks}. Of this weapon's attacks, only the swing, the slam and the heavy slam are.": "未建模：{attacks}。这把武器的攻击中只有挥砍、捶地和重击捶地已建模。"
  "A glaive's heavy attack is a throw, which is not modelled, so there is no heavy mode and a Tennokai window converts nothing.": "战刃的重击是投掷，未建模，所以没有重击模式，Tennokai 窗口也转换不出任何东西。"
  "A gunblade's heavy attack fires, which is not modelled, so there is no heavy mode and a Tennokai window converts nothing.": "枪刃的重击是射击，未建模，所以没有重击模式，Tennokai 窗口也转换不出任何东西。"
  "This weapon's heavy attack is {what}, which is not modelled, so there is no heavy mode and a Tennokai window converts nothing.": "这把武器的重击是{what}，未建模，所以没有重击模式，Tennokai 窗口也转换不出任何东西。"
  "Not modelled: {passive}.": "未建模：{passive}。"
  "The wiki publishes no heavy attack figure for this weapon, so there is no heavy mode.": "wiki 没有公布这把武器的重击数值，所以没有重击模式。"
  "The wiki publishes no slide attack figure or duration for this weapon, so there is no slide mode.": "wiki 没有公布这把武器的滑行攻击数值或时长，所以没有滑行模式。"
  "The wiki gives this weapon combos of its own ({combos}), which replace the stance's and are not transcribed; the stance's (or its class's) are used instead.": "wiki 给这把武器配了专属连段（{combos}），会替换所装架式的连段，这里没有录入；改用架式（或其类别）的版本。"
  "The heavy attack is the infobox's {infobox}x; the class's heavy table implies {table}x. Unmeasured.": "重击按信息框取 {infobox}x；类别重击表对应 {table}x。未实测。"
  "The Dark Split-Sword splits into a pair of Dual Swords with their own stats and stance; only the Heavy Blade form is entered here.": "Dark Split-Sword 可以拆分成一对双剑，有自己的数值和架式；这里只录入了巨刃形态。"
  "Its Incarnon evolutions and Incarnon Form are not modelled.": "它的灵化进化和灵化形态未建模。"
  "Its {family} valence bonus is not modelled: the build cannot state the element and bonus this copy rolled, so it reads without one.": "它的 {family} 元素加成未建模：配装无法填写这一把随机到的元素和加成，所以按没有加成计算。"
  "THE OPENER IS A SLAM, and Seismic Wave pays it on the ability page. It is a swing here, so Seismic Wave pays it nothing and it reaches the body in front rather than a sphere": "**第一击是捶地**，技能页说 Seismic Wave 会加成它。这里按挥砍处理，所以 Seismic Wave 不加成，而且只打到面前的目标，不是一个球形范围"
  "two of the second input's five hits force Slash; the five land as one row here, so none of them is forced — the conservative direction": "第二次输入的五下里有两下强制切割；这里五下作为一行同时结算，所以一下都不强制——偏保守的方向"
  "The stance page gives this slide up to 5 hits on one target or 4 on several; the module and the ability page say 6. This entry lands 6, unmeasured.": "架式页写这个滑行对单体最多 5 下、对多个敌人 4 下；模块和技能页写 6 下。本条目按 6 下，未实测。"
