  "SEVEN OF THE EIGHT TARGETS. The mode locks \"up to 8 enemies within 60 meters on the reticle\" and fires a 2-round burst at each; this entry fires the burst ONE enemy receives, because the engine aims at a place and never picks targets. Against a lone enemy that is the whole attack and correct; in a crowd this weapon does up to eight times what is shown": "八个目标里的七个。该模式会锁定「准星上 60 米内最多 8 个敌人」，并对每个打出一轮 2 发连射；本条目打出的是「一个」敌人所承受的那一轮，因为引擎瞄准的是一个位置，从不挑选目标。对着孤立的一个敌人，这就是攻击的全部，且是正确的；在人群里，这把武器最多能做到屏幕上数字的八倍"
  "Scattered Justice, the Hek-exclusive mod (+200% multishot) — a weapon-exclusive card outside the pools this roster loads, and the single largest thing missing from this weapon's real numbers": "「Scattered Justice」，Hek 的专属 MOD（+200% 多重射击）——这是一张武器专属卡，不在本武器库载入的卡池里，也是这把武器真实数值里缺得最多的一项"
  "Scenario": 场景
  "Scenarios": 场景
  "Scoped in, consecutive hits build a Shot Combo Counter: 1 landing hit multiply damage by 1.5x, and every threefold count past that adds another 0.5x. It drops by one for every 2 s without a hit, and it pays nothing at all from the hip.": 瞄准状态下连续命中会累积射击连击：命中 1 次即让伤害 ×1.5，此后每当连击数翻到三倍就再 +0.5。每 2 秒没有命中就掉 1 层，腰射则完全不生效。
  "Scoped in, consecutive hits build a Shot Combo Counter: 5 landing hits multiply damage by 1.5x, and every threefold count past that adds another 0.5x. It drops by one for every 2 s without a hit, and it pays nothing at all from the hip.": 瞄准状态下连续命中会累积射击连击：命中 5 次即让伤害 ×1.5，此后每当连击数翻到三倍就再 +0.5。每 2 秒没有命中就掉 1 层，腰射则完全不生效。
  "Scored in kills per minute, counting the fraction of the current target already gone. A weapon that removes 3% of one Thrax in 180 seconds scores 0.03 and still has a rank.": 以每分钟击杀计分，并计入当前目标已被打掉的那一部分。一把 180 秒只能削掉一只凶魂 3% 的武器得 0.03 分，它仍然有名次。
