  "LIFTED's crowd control is not modelled — the explosion suspends what it hits, and this arena has no movement to interrupt; what IS modelled is the 1 s status itself, which Condition Overload counts like any other": Lifted 的控制效果尚未建模 —— 爆炸会把命中的目标浮空，而这个战场没有可以被打断的移动；已经建模的是那 1 秒的状态本身，异常状态过载会像统计其他状态一样把它算进去
  "Later": "稍后"
  "Leaded Gas, the Vesper 77-exclusive mod — a weapon-exclusive card outside the pools this roster loads": "「Leaded Gas」，Vesper 77 的专属 MOD——这是一张武器专属卡，不在本武器库载入的卡池里"
  "Level scaling": 等级缩放
  "Limits": 限制
  "Lingering field": 持续云雾
  "MAGAZINE CAPACITY IS A DAMAGE STAT here and this entry pins it at the unmodded 10 — \"Increasing Magazine Capacity (Slip Magazine, Primed Slip Magazine, Ice Storm, Tainted Clip, Combo Fury) will increase the Alternate Fire's damage\", multiplicatively with base-damage mods. A build carrying one is understated by exactly that ratio": "在这里「弹匣容量」是一条伤害属性，而本条目把它钉在未改装的 10 上——「提高弹匣容量（滑膛弹匣、初始滑膛弹匣、冰风暴、污染弹夹、连击狂怒）会提高交替射击的伤害」，且与基础伤害类 MOD 是乘算。带了这类 MOD 的配装，在这里正好按那个比例被低估"
  "MICROWAVE's other half: it ENLARGES the body part it was shot at, which is a hit-location mechanic and worth nothing where nobody is aiming by hand. Its status COUNT is modelled (`applies_microwave`)": 微波的另一半：它会放大被击中的那个身体部位，这是一个命中部位机制，在没有人手动瞄准的地方毫无价值。它的触发计数是有建模的（`applies_microwave`）
