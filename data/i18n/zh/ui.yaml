  "Quick calc": 快速计算
  "rank a slot's options by what they would change — off, nothing is simulated": 按「换上去会有多大变化」给槽位的候选排序 —— 关闭后不会进行任何模拟
  "open a slot to rank its mods by effect": 打开任一槽位，按效果排序它的 mod
