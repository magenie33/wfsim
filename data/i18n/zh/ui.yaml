  "aiming highlights enemies within 100 m through the weapon's energy colour (wiki) — an aiming aid this sim cannot use": "瞄准时会用武器的能量色高亮 100 米内的敌人（维基）—— 这是一个本模拟用不上的瞄准辅助"
  "aiming is disabled for the duration of the burst, so the alternate fire cannot benefit from Acolyte mods — a gate this arena has no aim state to apply": "连射期间无法瞄准，所以交替射击吃不到「侍僧」系列 MOD——这是一道门槛，而本场没有瞄准状态可以拿来判定"
