# Effect-line phrase substitutions for mod/arcane/evolution descriptions
# ("+X% Critical Chance" → "+X% 暴击几率"). ORDERED — longest phrases first
# so partial matches never clobber. Each entry: [regex, replacement] or
# [regex, replacement, flags] (default flags: gi).
  # --- Rivens (裂罅) ------------------------------------------------------
  # DE's own word: the CN client calls these "步枪裂罅 Mod" / "手枪裂罅 Mod"
  # (WFCD i18n, joined on internal_name), so the noun is 裂罅 and the class
  # prefixes are its own. Bonus/Malus have no official CN string — they are
  # the wiki's words for the two halves of a card — so they take the standard
  # 增益/减益 pair. Every VALUE line localizes through effect_phrases below:
  # "+150% Critical Chance" reads the same on a riven as on Point Strike.
  "Rivens": 裂罅
  "Riven": 裂罅
  "All builds": "全部配装"
  "No riven": "不带裂罅"
  "Riven only": "仅裂罅"
  "board": "榜单"
  # THE KITGUN FAMILY, off the CN wiki's own page (`组合枪`, reached through its
  # MediaWiki API — DATA_SOURCES §"The CN wiki is reachable through its API").
  # WFCD carries the PART names in Chinese (Haymaker is 重拳) and none of the
  # category words, so this is the same path the evolution strings came down.
  #
  # It was 组装枪 for a day, with no source behind it — the CN wiki's article
  # says 组合枪 in its title and in every sentence of its body, and a name that
  # can be read is never derived (2026-08-23).
  "Kitguns": "组合枪"
  "Kitgun": "组合枪"
  # The three components, from the same article's own headings: 组合枪由三种不同的
  # 组件构成，分别为'''枪膛'''、'''握把'''和'''填弹器'''.
  "Chamber": 枪膛
  "Grip": 握把
  "Loader": 填弹器
  # OURS, not DE's: the parts block asks which SEAT of the two this Kitgun is
  # being built for, and no in-game screen puts that question because in game
  # the grip answers it.
  "Slot": 槽位
  "riven": 裂罅
  "rifle": 步枪
  "pistol": 手枪
  "Shape": 词条构成
  "Bonus": 增益
  "Malus": 减益
  "Rank": 等级
  "Polarity": 极性
  "capacity": 容量
  # The board is a static file; this is how far behind it is.
  "· {n} more submitted since this board was scored — the next run is within 20 minutes": · 这块榜评分之后又有 {n} 套配装提交进来，下一次评分在 20 分钟内
  # A live bug: the number IS right and nobody can explain it - the opposite
  # of the "not modelled" banner above it.
  "measured on this weapon and unexplained — the engine reproduces what the game does, and a hotfix could change it": 在这把武器上实测到、但无人能解释——引擎忠实还原游戏的行为，而一次热修可能会改掉它
  "Secondary Irradiate's echo is measured at 3.6x the hit on this form, not the 1.8x its card states and every pure single-target weapon delivers. The engine reproduces the measurement; nobody has explained it, and a hotfix could change it.": 在这个形态上，次要辐照的回响实测为命中伤害的 3.6 倍，而不是它卡面写的、也是所有纯单体武器实际给出的 1.8 倍。引擎还原的是实测结果；没有人解释过它，一次热修可能会改掉它。
  "disposition": 倾向
  # A riven belongs to a weapon FAMILY, so the same card is in every variant's
  # list and reads that variant's own disposition.
  "a {family} riven — it fits {others} too, each at its own disposition": "{family}紫卡 —— 同样可以装在{others}上，各按各自的倾向计算"
  "choose a stat": 选择词条
  "no matching stat": 没有匹配的词条
  "Search a riven stat…": 搜索裂罅词条…
  "nothing rolled yet": 尚未选择词条
  "no rivens for this weapon yet": 这把武器还没有裂罅
  "not a legal riven": 不是合法的裂罅
  "one more stat to finish this riven": 还差 1 条词条这张裂罅就完整了
  "pick {n} more stats to finish this riven": 还差 {n} 条词条这张裂罅就完整了
  "where this roll landed in its 0.9-1.1 band": 这条词条的随机值在 0.9-1.1 区间里的位置
  "the roll itself — the random multiplier this stat drew, 0.900 to 1.100": 这条词条掷出的随机倍率本身，范围 0.900 到 1.100
  "not modeled — it rolls and it names the riven, but it adds no damage": 未建模 —— 它会开出来，也参与命名，但不提供伤害
  "All rivens": 全部裂罅
  "roll everything maximal": 全部拉到最高
  "every riven you have made for this weapon, with what it actually rolls": 你为这把武器做的每张裂罅，以及它实际开出的数值
  # The buff block sets the run's STARTING state, not the buff's worth — the
  # fight goes on granting and decaying on each buff's own trigger. Saying only
  # "locked = 100% uptime" read as "this box decides how much you get".
  "the stacks the run STARTS with — the fight still grants and decays them on their own triggers": 这里设的是开战时的层数 —— 战斗中该触发的仍会照常触发、该衰减的也照常衰减
  # How FULL a searched build must be, as a range: "exactly 8" is 8–8, "up to
  # 7" is 1–7. One setting, not three behaviours.
  "Mods / build": 每套配装 MOD 数
  "the fewest a searched build may carry — set both ends to 8 to search only full builds": 一套配装最少带几个 —— 两端都设成 8 就只搜满配装
  "the most a searched build may carry": 一套配装最多带几个
  # What the SEARCH covered. Exhaustive is worth saying out loud: it is the
  # difference between "a strong build" and "the best build in what you pooled".
  "every build in this scope was searched": 这个范围内的每一套配装都搜过了
  "searched {pct}% of this scope ({n} of {total} builds) — a uniform sample, so this is a strong build rather than a proven best; pool fewer mods to search all of it": 搜索覆盖了本范围的 {pct}%（{total} 套中的 {n} 套）—— 是全空间的均匀采样，所以这是一套很强的配装，但不是已证明的最优；缩小候选池就能搜完全部
  # Search boxes.
  "Search a mod…": 搜索 MOD…
  "Search arcane / effect…": 搜索赋能 / 效果…
  "search mods by name or effect…": 按名称或效果搜索 MOD…
  "search arcanes by name or effect…": 按名称或效果搜索赋能…
  # THE HEADSHOT SHARE BELONGS TO THE BODY THE SHOT STRUCK (owner, 2026-08-17).
  "a per-PELLET aim weight on the body the shot STRUCK, not a whole-spread promise — the landing spot is rolled for each pellet, and nothing a blast or a chain reaches can be a headshot": 这是对「被射中的那个目标」的逐弹丸落点权重，不是对整发弹幕的承诺 —— 每颗弹丸各自掷一次落点，而爆炸和链打到的任何目标都不可能爆头。
  # THE BOARD'S RULES (owner, 2026-08-17): mechanical, and naming no weapon.
  "The target is one Thrax Centurion at level 9999 on Steel Path. The fight lasts 180 seconds.": 目标是一只 9999 级钢铁之路的 Thrax Centurion。战斗持续 180 秒。
  "One target, so nothing here rewards clearing a room.": 只有一个目标，所以这里的任何东西都不因清场而得分。
  "Every shot is aimed and lands on the weak point. The companion board removes the aim; between them they are the ceiling and the floor.": 每一发都瞄准并命中弱点。姊妹榜取消瞄准；两者一个是上限、一个是下限。
  "No shot is aimed and none lands on a weak point. The companion board aims every shot; between them they are the floor and the ceiling.": 没有一发瞄准，也没有一发命中弱点。姊妹榜每发都瞄准；两者一个是下限、一个是上限。
  "The score is kills per minute, counting the fraction of the current target already gone. Removing 3% of one target in 180 seconds scores 0.03 and still ranks.": 分数是每分钟击杀数，并计入当前目标已被削去的比例。180 秒内削掉一个目标的 3%，得分 0.03，仍然进榜。
  "Every main slot is filled, every evolution tier the entry has is taken, every arcane seat it has is filled. The Exilus slot is never counted.": 每个主槽都装满，该条目拥有的每一阶进化都选，每一个赋能位都填。Exilus 槽从不计入。
  "Investment is not ranked: every entry is scored at full Forma, at max rank, and at the maximum roll of any bonus a player can raise by farming duplicates.": 投入不参与排名：每个条目都按满 Forma、满等级、以及任何可以靠刷重复品提升的加成的最大值来计分。
  "Ammo pickups are modelled. An entry that cannot be resupplied runs on its own reserve.": 弹药拾取被建模。无法补给的条目只能靠自己的备弹。
  "An entry that can be played more than one way is ranked once per way, and the way it was played is part of the row.": 一个可以有多种打法的条目，每种打法各排一次，而用哪种打法本身就是这一行的一部分。
  "A buff starts the fight FULL only if it is permanent — no timer, and not spent by being used. Such a buff can be held for the whole engagement by anyone, so scoring it at anything less would rank how long ago the entrant last topped it up. Every other buff starts at zero and is earned in the fight. Two buffs in the data qualify today.": 一个 buff 只有在它是永久的时候才以满层开局 —— 没有计时，也不会因使用而消耗。这样的 buff 任何人都能全程保持，所以按低于满层计分，等于在排「投稿者上次补层是多久以前」。其余所有 buff 从零开始，在战斗中挣得。目前数据中有两个 buff 符合。
  "Nobody submits a number. A submission is a BUILD, and its score is computed here by this engine under the pinned seed above, so any row can be reproduced exactly by anyone with the repo.": 没有人提交数字。提交的是一套配装，分数由本引擎在上面钉死的种子下算出，所以任何一行都能被拿到仓库的人精确复现。
  # THE FORMATION'S OWN CONTROLS (owner, 2026-08-17).
  "one enemy": 只留一个
  "aim at the target": 瞄回目标
  # THE LEAST-KNOWN RULE IN THE FORMA MODEL (owner, 2026-08-16), stated beside
  # the exilus slot because every capacity number on the page assumes it.
  "A polarity can be swapped between this slot and a main one — the slot stays Exilus. So its polarity counts toward any build, even one that leaves it empty.": 极性可以在这个槽和主槽之间对调 —— 槽位本身仍然是 Exilus。所以它的极性对任何配装都算数，哪怕这个槽空着。
  "how often a bounce lands on a weak point is ASSUMED — a flat 50%. It can headshot (the wiki's Hit Mechanic page counts a rebound as a main hit), but where it lands is geometry this arena does not model and DE publishes no rate": "弹跳落点打中弱点的比例是**假设**——统一取 50%。它确实可以爆头（wiki 的 Hit Mechanic 页把弹跳算作主命中），但落在哪个部位是本战场不建模的几何，而 DE 没有公布任何比例"
  "the projectile has TRAVEL TIME and has to be led — 'hitting a target at range requires leading the target before firing'. Every shot here connects the instant it is fired, so this weapon's real hit rate against anything that moves is worse than the numbers below": "弹道有**飞行时间**，得提前量 — “远距离命中需要在开火前预判目标”。本模拟里每一发都在开火瞬间命中，所以面对会动的目标，这把枪的实际命中率比下面的数字要差"
  "the explosion is a REVERSE CONE — 'dealing damage to enemies in front of the original target' — and this arena gives a splash no facing, so it is modelled as a full 1.9 m sphere. That is the generous reading: against a crowd it reaches bodies the game would leave behind the target": "爆炸是一个**反向锥形**—“对原目标前方的敌人造成伤害”— 而本战场不给溅射朝向，所以这里把它当作完整的 1.9 米球体。这是偏宽松的算法：面对人群时，它会打到游戏里会落在目标后方的敌人"
  "the QUICK SHOT is not a form here. Tapping the trigger fires a smaller explosion (1.7 m, 30-108 Radiation by grip, falloff to 75%) and the page says 'the only change to the projectile is damage distribution' — the total is the same and the split moves — but neither the module nor the page publishes that split, so a quick-shot entry would have to invent one. The explosion's numbers are already transcribed in data/kitguns/chambers/tombfinger_primary.yaml and one in-game reading of the projectile is all that is missing": "**点射**在这里不是一个形态。轻点扳机会打出一个更小的爆炸（1.7 米，按握把 30-108 辐射，衰减到 75%），页面说“弹体唯一的变化是伤害分配”— 总量不变，只是配比变了 — 但模块和页面都没有公布那个配比，所以建一个点射条目就只能自己编。爆炸的数值已经转录在 data/kitguns/chambers/tombfinger_primary.yaml 里，差的只是对弹体做一次实测"
  # A Tome's alt fire needs a full meter; this arena fires it continuously.
  # The Grimoire orb: an ENTITY with a position, not a field and not an
  # impact explosion.
  "how often the orb's strikes land on a weak point is a MEASURED average rather than geometry — about 10% per body hit, counted at 5 weak points in 48 hits. Where an orb drifting through a crowd actually puts them depends on how everyone is standing, which this arena does not model, so a fight where you can line them up beats this number and one against a single tall target may not reach it": "法球的电击有多大比例打在弱点上，是一个**实测的平均值**而不是几何算出来的 —— 每个被打到的身体约 10%，样本是 48 次命中里 5 次弱点。一颗在人群里飘着的球实际把它们打在哪，取决于所有人是怎么站的，而本战场没有建模这一层：所以一场你能把敌人排好的战斗会高过这个数字，而对着一个高个子单体可能达不到"
  "the orb BOUNCES off walls and the floor, and this arena has neither — so here it drifts on at {speed} m/s and leaves a standing target behind after about three seconds, landing {open_field} of its {total} strikes and detonating too far away to matter. In a real room it comes back and spends its fuse near what you threw it at, which is worth about {worth} more damage. Everything below for this form is a FLOOR, and an unusually loose one": "法球会**撞墙反弹**，而这个战场既没有墙也没有地板 —— 所以在这里它以 {speed} m/s 一直往前飘，约三秒后就把站着不动的目标甩在身后，{total} 下电击里只打到 {open_field} 下，最后的爆炸也炸在够不着的地方。真实的房间里它会弹回来，整个引信时间都待在你扔它的那个位置附近，这大约值 {worth} 的伤害。所以这个形态下面的所有数字都是**下限**，而且是个相当宽松的下限"
  "the blast staggers the WIELDER in game — this arena gives the player no body, so a build that would be unplayable in a corridor costs nothing here": "爆炸在游戏里会震退**开火者** — 本战场不给玩家实体，所以在走廊里根本没法用的配装，在这里不付任何代价"
  "the blast needs no line of sight and goes through walls — this arena has no geometry, so nothing is ever behind cover and the perk pays nothing extra": "爆炸不需要视线、能穿墙 — 本战场没有地形，没有任何东西躲在掩体后，所以这个特性在这里不额外产生价值"
  "this weapon is SILENT and this arena has nobody to alert — stealth is worth nothing here and a great deal in a real mission": "这把武器是**静音**的，而本战场没有可惊动的人 — 潜行在这里毫无价值，在真实任务里价值极大"
  "a bounce here reflects off ENEMIES only — in game a wall or the floor is a surface too, so with cover this number is a FLOOR": "这里的弹跳只从**敌人**身上反射 — 游戏里墙面和地面也是可反射的表面，所以在有掩体的战斗里这个数字是**下限**"

