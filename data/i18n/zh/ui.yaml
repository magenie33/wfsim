  "Sustained DPS": 持续 DPS
  "TAU DAMAGE's status effect is not modelled. Tau is neutral to every health type, which this engine applies correctly — but its proc is STATUS CHANCE VULNERABILITY, raising the status chance the target receives from every other source by 10% a stack to ten stacks (wiki), and there is no debuff for it here. On a build stacking other statuses this weapon is understated": "Tau 伤害的异常状态没有建模。Tau 对所有生命类型都是中性的，这一点本引擎处理得正确 —— 但它的触发效果是「触发几率易伤」：每层让目标受到的其他所有来源的触发几率 +10%，最多十层（维基），而这里没有对应的减益。在一套堆异常状态的配装上，这把武器被低估了"
  "THE ACTIVE RELOAD: pressing reload again 22-38% of the way through one cuts the reload to 1 second and gives the magazine Heat rounds dealing '+25% more damage with guaranteed status' (wiki). It is a TIMED INPUT and this sim has no player pressing buttons — every reload here is the full 5 seconds and every round is the ordinary Puncture one, so a player who hits the window is far ahead of this number": "主动装填：在装填进行到 22%-38% 之间再按一次装填键，装填时间会缩短到 1 秒，并让这一匣变成热能弹、伤害 +25% 且必定触发（维基）。这是一个有时机的按键输入，而这个模拟没有一个在按键的玩家 —— 这里每一次装填都是完整的 5 秒，每一发都是普通的穿刺弹，所以能抓住这个窗口的玩家远高于这个数字"
  "THE ALTERNATE FIRE, which is a Mercy-finisher tool rather than a way to fight: it \"launches a mite that latches up to 6 enemies, highlighting their heads for 5 seconds while dealing Impact and Magnetic damage and status effects per second for 10 seconds\", and against an enemy already opened to a Mercy it teleports the player in for an execution instead. Three things put it out of reach here — it needs a target within 25 m to fire at all, its payload is a ten-second damage-over-time the engine has no shape for, and its real use is the finisher, which this arena has no execution threshold for. The CO catalog's own row for it reads `Does not apply`": "交替射击，它是一件「慈悲处决」的工具而不是一种战斗方式：它「发射一只寄生虫，附着最多 6 个敌人，标记它们的头部 5 秒，同时在 10 秒内每秒造成冲击与磁力伤害及异况」；若目标已可被慈悲处决，则改为把玩家传送过去直接处决。三件事让它在这里够不着——它必须有 25 米内的目标才发得出去，它的载荷是一段十秒的持续伤害而引擎没有这种形状，而它真正的用途是处决，本场没有处决血线。异况超载目录给它的那一行写的是 `Does not apply`（不适用）"
  "THE CUBE'S OTHER EXPLOSION, which is four times this one: \"If damaged by any player (e.g. nearby cube explosion), cube explodes in 6 meter radius\" for 600 Blast. It is a two-step play — place a cube, then shoot it — and this arena fires one attack at one aim point, so the step that pays is the one it cannot take": "方块的「另一次」爆炸，是这次的四倍：「若被任何玩家造成伤害（例如附近方块的爆炸），方块会在 6 米半径内爆炸」，造成 600 爆炸伤害。这是一套两步操作——先放一个方块，再打它——而本场只对一个瞄准点打出一次攻击，所以真正兑现的那一步正是它做不到的那一步"
  "THE CUBE'S OTHER EXPLOSION, which is four times this one: a cube damaged by a player goes off in a 6 metre radius for 600 Blast. It is a two-step play — place a cube, then shoot it — and this arena fires one attack at one aim point, so the step that pays is the one it cannot take": "方块的「另一次」爆炸，是这次的四倍：被玩家打到的方块会在 6 米半径内爆炸，造成 600 爆炸伤害。这是一套两步操作——先放一个方块，再打它——而本场只对一个瞄准点打出一次攻击，所以真正兑现的那一步正是它做不到的那一步"
  "THE DAMAGE SCALES WITH HOW FULL THE MAGAZINE WAS — \"Damage of the alt-fire scales linearly with the percentage of the remaining magazine\" — and this entry fires the full-magazine grenade every time. Every shot after the first in a magazine is therefore overstated here unless the rifle was reloaded first, which is how the weapon is actually played": "伤害取决于开火时弹匣有多满——「交替射击的伤害与剩余弹匣的百分比呈线性关系」——而本条目每一次都打出满弹匣的那一发榴弹。因此一个弹匣里第一发之后的每一发在这里都被高估了，除非先换弹，而那正是这把武器真实的打法"
  "THE EXPLOSION IS A RELOAD, not an impact: 'bullets lodge into surfaces. Upon reloading, the bullets explode in a 1.5 meter radius before flying back to the wielder', up to 32 at a time (wiki). This engine's `radial:` goes off where the shot lands, which would fire it on every hit and at the wrong time — so the 48 Blast a round is NOT counted at all, and against anything that survives a magazine this weapon is understated by roughly four fifths of its real output": "这次爆炸属于装填，不属于命中：「子弹会嵌进表面。装填时这些子弹会在 1.5 米半径内爆炸，然后飞回持有者手中」，一次最多 32 发（维基）。本引擎的 `radial:` 在弹丸落点上炸开，用在这里会在每一次命中、而且在错误的时间点触发 —— 所以每发 48 点爆炸伤害在这里完全没有被计入，面对任何能扛过一个弹匣的目标，这把武器被低估了大约五分之四的真实输出"
  "THE EXPLOSION IS THE WHOLE WEAPON AND ITS RADIUS IS NOT MODELLED. The mine deals no contact damage at all — both of the module's attacks are the same blast resolved at two different moments (mid-flight, or after it has stuck) — so this entry carries that blast as the shot's own damage and no `radial:` beside it. Against ONE target, which is what this arena and the board's rulers fight, the number is exactly right; against a crowd it is a FLOOR, because nothing within the published radius takes anything here": "爆炸就是这把武器的全部，而它的半径没有被建模。这枚地雷完全没有接触伤害 —— 模块里的两次攻击是同一次爆炸在两个不同时刻的结算（飞行途中，或者黏住之后）—— 所以本条目把那次爆炸当作这一发自己的伤害，旁边没有 `radial:`。面对单个目标，也就是这个战场和排行榜标尺所打的那种战斗，这个数字是完全准确的；面对人群它是一个下限，因为在公布的半径内的东西在这里什么都不会吃到"
  "THE INNATE CORROSIVE DoT, which is 177 of this weapon's 253 damage a dart — \"The 177 Corrosive damage is dealt in 3 ticks of 59 damage over the course of 2 seconds\", with each multishot pellet creating its own. It is a DAMAGE-OVER-TIME ATTACK rather than a status proc or an explosion, and the engine has no shape for one: three attacks in the whole game are typed this way and two of them are this weapon's family, so it is recorded rather than built. THE NUMBER ON SCREEN IS THEREFORE ABOUT A THIRD OF THE REAL ONE against a single target": "自带的腐蚀持续伤害，它占这把武器每根飞镖 253 点伤害中的 177 点——「177 点腐蚀伤害在 2 秒内分 3 跳、每跳 59 点结算」，且多重射击的每一发都会各自生成一份。它是一次「持续伤害攻击」，既不是异况也不是爆炸，而引擎没有这种形状：全游戏只有三个攻击是这个类型，其中两个还是这把武器的家族，所以它被记录下来而不是被造出来。因此对单一目标而言，屏幕上的数字大约只有真实值的三分之一"
  "THE INNATE CORROSIVE DoT, which is 81 of this weapon's 130 damage a dart — a `ShotType: DoT` attack of 27 a tick, with each multishot pellet creating its own. Three attacks in the whole game are typed this way and two of them are this weapon's family, so it is recorded rather than built. THE NUMBER ON SCREEN IS THEREFORE ABOUT A THIRD OF THE REAL ONE against a single target": "自带的腐蚀持续伤害，它占这把武器每根飞镖 130 点伤害中的 81 点——一次 `ShotType: DoT` 类型的攻击，每跳 27 点，且多重射击的每一发都会各自生成一份。全游戏只有三个攻击是这个类型，其中两个还是这把武器的家族，所以它被记录下来而不是被造出来。因此对单一目标而言，屏幕上的数字大约只有真实值的三分之一"
  "THE PELLET COUNT SPOOLS TOO: 'each consecutive shot adds an additional pellet' up to the maximum, and this entry IS the fully spooled state — every shot here fires the full count from the first. The page publishes no ramp figures for the fire rate either, so the rate here is the settled one as well": "弹丸数量也会随转膛增加：「每一发连续射击会多加一颗弹丸」直到上限，而本条目就是转满之后的状态 —— 这里每一发从第一发起就是满弹丸数。页面同样没有公布射速的爬升数据，所以这里的射速也是转满之后的那个"
  "THE PERFECT SHOT IS NOT CARRIED. The module gives this weapon a third attack — an arrow released inside a window at 1.05 s, for MORE damage than this full draw — and the form vocabulary has no word for a timing window: `charged` and `alt_fire` resolve to the same mode, so a group cannot hold both. A player who hits the window is ahead of this number": "完美射击没有被录入。模块给这把武器第三次攻击 —— 在 1.05 秒的窗口内松手射出的箭，伤害比这里的满蓄力更高 —— 而本武器库的形态词表里没有「时机窗口」这个词：`charged` 和 `alt_fire` 会解析成同一个模式，所以一个组里不能同时有两者。抓住窗口的玩家高于这个数字"
  "THE PULL, which is the field's other half and the reason it is thrown: it \"continuously pulls enemies within 10 meters toward itself\" for thirty seconds. Gathering a room into one place is worth an enormous amount to every AoE weapon the player carries and nothing at all to a damage number measured against bodies that do not move": "牵引力，它是这个力场的另一半，也是这支矛被扔出去的理由：它会「持续把 10 米内的敌人拉向自己」，长达三十秒。把一整个房间聚到一处，对玩家身上每一件范围武器来说价值都极大，而对一个以「不会移动的身体」为基准量出来的伤害数字来说，价值为零"
  "THE PULL, which is the field's other half and the reason it is thrown: it draws enemies within 10 metres toward itself for thirty seconds. Gathering a room into one place is worth an enormous amount to every AoE weapon the player carries and nothing at all to a damage number measured against bodies that do not move": "牵引力，它是这个力场的另一半，也是这支矛被扔出去的理由：它会在三十秒内持续把 10 米内的敌人拉向自己。把一整个房间聚到一处，对玩家身上每一件范围武器来说价值都极大，而对一个以「不会移动的身体」为基准量出来的伤害数字来说，价值为零"
  "THE RELOAD GRENADE, which is most of this weapon and the whole reason it is built: every reload throws one at the reticle, exploding in a 5-7 metre radius, and reloading FROM EMPTY makes it far larger — 1,997 Corrosive in 7 metres at 31% crit and 59% status, against 203 in 5 metres at 11% and 43% on a partial reload. The engine has no hook that fires an attack ON A RELOAD, so none of it is counted and the number on screen is the beam alone. The CODA variant throws THREE of them": "换弹榴弹，它才是这把武器的主体，也是它被拿来配装的全部理由：每次换弹都会朝准星扔出一枚，在 5–7 米半径内爆炸；而「空匣换弹」会让它大得多——7 米内 1997 腐蚀、31% 暴击率、59% 异况，对比非空匣换弹的 5 米内 203 伤害、11% 与 43%。引擎没有「在换弹时触发一次攻击」的挂载点，所以这部分一点都没算，屏幕上的数字只是光束本身。终幕版本一次扔三枚"
  "THE RELOAD GRENADES, which are most of this weapon and the whole reason it is built: \"Reload throws 3 grenades at a 45 degree angle towards the reticle that explodes in 3-5 meter radius on impact\", and reloading FROM EMPTY makes them far larger — 658 Corrosive apiece in 5 metres at 31% crit and 59% status, against 74 in 3 metres at 11% and 43% on a partial reload. Three of the from-empty grenades is 1,974 damage, which dwarfs the beam that earned them. The engine has no hook that fires an attack ON A RELOAD, so none of it is counted and the number on screen is the beam alone": "换弹榴弹，它才是这把武器的主体，也是它被拿来配装的全部理由：「换弹时朝准星方向以 45 度抛出 3 枚榴弹，命中后在 3–5 米半径内爆炸」，而「空匣换弹」会让它们大得多——每枚 5 米内 658 腐蚀、31% 暴击率、59% 异况，对比非空匣换弹的 3 米内 74 伤害、11% 与 43%。三枚空匣榴弹是 1974 点伤害，把挣来它们的那道光束衬得微不足道。引擎没有「在换弹时触发一次攻击」的挂载点，所以这部分一点都没算，屏幕上的数字只是光束本身"
  "THE RETURN, which is half the weapon: 'upon reloading, the blades return and damage anything in their path as they fly back to the wielder, with an enhanced Critical Chance set to 300%' (wiki). A reload here loads the magazine and fires nothing, so none of that damage is counted and neither is the set — the number below is the throw alone": "回收，它是这把武器的一半：「装填时刀刃会飞回持有者手中，并对沿途的一切造成伤害，暴击率被设为 300%」（维基）。这里的装填只是把弹匣装满、不会发射任何东西，所以这部分伤害和那个「设为」都没有被计入 —— 下面这个数字只是投掷本身"
  "THE SPORES, which are most of what this weapon is: \"Enemies hit by Dual Coda Torxica and then killed from any source will spread spores to 3 enemies within 20 meters with the closest being prioritized, inflicting guaranteed Cold status per second and 50% Damage Vulnerability lasting for 20 seconds\". Three things have to line up for it to pay and this arena has none of them — the trigger is a KILL, the payload lands on OTHER enemies, and the vulnerability applies only to this weapon's own damage. Against one standing target it is worth exactly nothing; in a room it roughly doubles the weapon": "孢子，它才是这把武器的主体：「被 Dual Coda Torxica 命中、随后被任何来源击杀的敌人，会把孢子扩散给 20 米内的 3 个敌人（优先最近的），每秒必定造成一次冰冻异况，并附加 50% 易伤，持续 20 秒」。要让它兑现需要三件事同时成立，而本场一件都没有——触发条件是「击杀」，载荷落在「其它」敌人身上，而那份易伤只对这把武器自己的伤害生效。对着一个站桩目标它的价值恰好是零；在一个房间里它大致能让这把武器翻倍"
  "THIS IS THE PERFECT RELEASE, not the ordinary full draw — the arsenal displays it and this entry carries its numbers, so a player who MISTIMES the window gets the module's second attack instead (a one-second draw for less damage), which is not carried here. The form vocabulary has no word for a timing window: `charged` and `alt_fire` resolve to the same mode, so a group cannot hold both": "这是完美释放，不是普通的满蓄力 —— 兵工厂显示的就是它，本条目带的也是它的数值，所以一个没抓住窗口的玩家拿到的是模块里的第二次攻击（一秒蓄力、伤害更低），而那一条这里没有录入。形态词表里没有「时机窗口」这个词：`charged` 和 `alt_fire` 会解析成同一个模式，所以一个组里不能同时有两者"
  "Technique": 手法
  "Tendrils": 卷须
  "Tether Grenades, Napalm Grenades and the launcher-exclusive Adhesive Blast are outside the pools this roster loads. Tether Grenades in particular changes what the weapon IS — it makes each grenade a vortex": "「Tether Grenades」「Napalm Grenades」以及榴弹发射器专属的「Adhesive Blast」都不在本武器库载入的卡池里。尤其是「Tether Grenades」，它改变了这把武器「是什么」——它把每一颗榴弹变成一个引力涡旋"
  "The Vast Untime's +50% Void vulnerability and its pause on this buff's timer — that is a second Xaku ability, and no frame layer exists yet": 超维炼狱带来的 +50% 虚空易伤，以及它对本技能计时的暂停——那是 Xaku 的另一个技能，而战甲这一层还没做
  "The account of one hit": 一发的账
  "The engine, the game data and the wasm it all runs on are public. If you ever stop recognising what this becomes, you can run your own — that is not my assurance, it is the licence.":
    引擎、游戏数据，以及承载它们的 wasm，全部公开。真到哪天你不再认可它变成的样子，你可以自己跑一个——这不是我的保证，是授权协议决定的。
  "The fight": 这场仗
  "The grid is stated as three numbers rather than as 361 positions, so its terms can be read and argued with.": 方阵用三个数字描述而不是 361 个坐标，这样它的条款才读得懂、争得动。
  "The real Simulacrum Prime.": 真正的幻影装置 Prime。
  "The same fight as the aimed board: one Thrax Centurion at level 9999 on Steel Path, for 180 seconds, scored in kills per minute.": 和瞄准榜是同一场仗：一只凶魂百夫长，9999 级，钢铁之路，180 秒，按每分钟击杀计分。
  "The score is kills per minute across the whole formation, counting the fraction of each target already gone.": 分数是整个阵型的每分钟击杀数，并计入每个目标已被削掉的比例。
  "The shooter stands at contact with the middle body of the front rank, and fires along the line that rank faces.": 射手贴身站在前排正中那个目标前，沿着该排面对的方向射击。
  "The target is a formation of 361 Thrax Centurions at level 9999 on Steel Path, a 19 by 19 grid spaced 1.5 metres centre to centre. The fight lasts 180 seconds.": 目标是 361 个 9999 级钢铁之路萨克斯百夫长组成的阵型，19×19 的方阵，圆心间隔 1.5 米。战斗持续 180 秒。
  "The wfsim.app domain, and its renewal.": wfsim.app 的域名与续费。
  "There is no transition animation either way.": 两个方向都没有切换动作。
  "Thermagnetic Shells, the Detron family's exclusive mod — a weapon-exclusive card outside the pools this roster loads": "「热磁弹壳」，Detron 家族的专属 MOD——这是一张武器专属卡，不在本武器库载入的卡池里"
  "Time to first kill": 首杀耗时
  "Time: new weapons, new mechanics, and the in-game measurements every golden test is calibrated against.":
    时间：新武器、新机制，以及校准每一条 golden test 所需的游戏内实测。
  "Toggle light / dark": 切换亮色 / 暗色
  "Tools": "工具"
  "Toxic Sequence, the Acrid-exclusive mod — a weapon-exclusive card outside the pools this roster loads": "「Toxic Sequence」，Acrid 的专属 MOD——这是一张武器专属卡，不在本武器库载入的卡池里"
  "Transforms": 形态切换
  "Transmute In": 灵化切入
  "Transmute Out": 灵化切出
  "Valence bonus": 效价加成幅度
  "Valence": 效价加成
  "Velox Conclusion, the Velox-exclusive mod — a weapon-exclusive card outside the pools this roster loads": "「Velox Conclusion」，Velox 家族的专属 MOD——这是一张武器专属卡，不在本武器库载入的卡池里"
  "Voruna's signature bonus is not modelled — carried by her the ammo pool doubles to 48, and this arena has no Warframe holding it": Voruna 的专属加成尚未建模 —— 由她携带时备弹翻倍到 48，而这个战场里没有战甲持有它
  "Voruna's signature bonus is not modelled — carried by her the ammo pool grows to 56, and this arena has no Warframe holding it": Voruna 的专属加成尚未建模 —— 由她携带时备弹增至 56，而这个战场里没有战甲持有它
  "WF Sprint": 战甲冲刺速度
  "WFSim is an unofficial fan project, not affiliated with or endorsed by Digital Extremes. Warframe is a trademark of Digital Extremes Ltd.": WF模拟 是非官方粉丝项目，与 Digital Extremes 无从属关系，也未获其认可。Warframe 是 Digital Extremes Ltd. 的商标。
  "WFSim is free software, licensed AGPL-3.0. Building, simulating and optimizing are the whole of this site, and they are the same for everyone: no account, no payment, no part held back.":
    WF模拟是自由软件，采用 AGPL-3.0 授权。构建、模拟、优化——这三件事就是这个站点的全部，而且对所有人完全一致：不需要账号，不需要付费，没有哪一部分是留着不给的。
  "WFSim is the ultimate Warframe calculator — builder, simulator, optimizer. True to in-game numbers, down to the last proc. Theorycrafting, solved.": WF模拟是终极的 Warframe 计算器 —— 配装器、模拟器、优化器。与游戏内数值完全一致，精确到每一次触发。理论配装，已解。
  "WHEN AIMING, headshots take '+400% critical chance', additive with Point Strike (wiki). The engine has no headshot-CONDITIONAL crit bucket — a crit is rolled for the hit, and the body part it lands on is drawn beside it — so this arena's crit chance is the unaimed one. It is the larger half of the weapon: against a headshot-heavy fight the number here is well under the real one": "瞄准时，爆头获得「+400% 暴击率」，与 Point Strike 加算（维基）。本引擎没有「以爆头为条件」的暴击池 —— 暴击是为这一次命中掷的，命中部位是在旁边另外抽的 —— 所以这个战场用的是不带这一条的暴击率。它是这把武器更大的那一半：在一场以爆头为主的战斗里，这里的数字远低于真实值"
  "Warframe ability": 战甲技能
  "Warframe buffs": 战甲增益
  "Warframe": 战甲
  "Weapon passive: Frenzy — see its buff card (grants +1 toxin while active).": 武器被动：狂乱 —— 详见它的增益卡（生效期间提供 +1 毒素）。
  "Weapons": 武器
  "What a donation never buys": 捐助永远买不到什么
  "What each mode is": 每种输出方式分别是什么
  "What is sent is the BUILD: the weapon and its mods, evolutions and arcanes. Not the fight you ran it under — the board scores every build under its OWN rulers, so any scenario can contribute. And nothing about you: no account, no identifier, no address, no time finer than the day, and no score. The board takes a weapon built as far as it goes: every main slot filled, and the exilus slot counted if you use one.": 发送的是这套配装：武器及其 mod、进化、赋能。不包含你跑它的那场仗——榜单会用它自己的标尺去跑每一套配装，所以任何场景都可以做贡献。也不包含关于你的任何东西：没有账号、没有标识符、没有地址、没有精确到天以下的时间，也没有分数。榜单收的是这把武器的最努力配置：8 个主槽位全部装满，用了 exilus 的话也一并计入。
  "What this benchmark measures": 这个基准到底在量什么
  "What would be sent: the weapon and its mods, evolutions and arcanes. Nothing else — no account, no identifier, no names you chose, and no score (the board measures builds itself).": 会发送的内容：武器，以及它的 MOD、进化和赋能。仅此而已 —— 没有账号，没有任何标识，没有你起的任何名字，也不含分数（榜单自己测量配装）。
  "Where it goes": 钱花在哪
  "Where the damage went": 伤害落在哪里
  "Which means no Incarnon, for all but one weapon: eight of the nine Incarnon forms charge their gauge on weak-point hits, so at this rate they never fill it. The Torid charges on direct hits and still cycles.": 这也意味着除一把之外都进不了灵化：九个灵化形态里有八个靠弱点命中充能，在这个爆头率下永远填不满。托里德靠直接命中充能，照常循环。
  "Why you can check it": 为什么你可以检验它
  "Zazvat-Kar, the Akstiletto Prime-exclusive mod — a weapon-exclusive card outside the pools this roster loads": "「Zazvat-Kar」，Akstiletto Prime 的专属 MOD——这是一张武器专属卡，不在本武器库载入的卡池里"
  "Zoom": 变焦
  "a MISSED shot drops the combo counter and this entry cannot miss — the only thing that misses here is SPREAD, and this one lands on the reticle, so nothing but its {seconds} s timer ever takes a stack off. A player who pulls the shot loses the combo and this sim never pulls one": 打空一枪会掉连击，而这把在这里打不空 —— 这里唯一会失手的是散布，而它弹着点就在准星上，所以除了 {seconds} 秒计时之外没有任何东西会拿走一层。手抖打偏的玩家会掉连击，而这个模拟不会手抖
  "a benchmark build — measured under": 基准配装 —— 测试标准
  "a bigger magazine makes the reload LONGER here and the sim does not know it — shells are loaded one at a time, so Ammo Stock buys capacity and pays for it in reload": 弹匣越大装填越慢，模拟不知道这件事 —— 子弹是一发一发上的，所以弹药储存换来的容量要拿装填时间去付
  "a cube left alone detonates after 9 seconds, which needs a miss and a clock this arena does not run": "无人理会的方块会在 9 秒后自行引爆，这需要一次打偏和一个本场并不运行的计时"
  "a direct hit forces a KNOCKDOWN and the explosion a RAGDOLL (module ForcedProcs) — neither is a damage type and this arena's enemies are neither knocked down nor thrown": "直接命中必定造成击倒、爆炸必定造成布娃娃（模块 ForcedProcs）—— 两者都不是伤害类型，而这个战场里的敌人既不会被击倒也不会被抛飞"
  "a direct hit forces a KNOCKDOWN whether or not the grenade explodes (wiki) — this arena's enemies are not knocked down, so the crowd control that makes this weapon safe to fire up close pays nothing here": "无论榴弹是否爆炸，直接命中都会造成击倒（维基）—— 这个战场里的敌人不会被击倒，所以那个让这把武器可以贴脸开火的控制效果在这里一分不值"
  "a direct hit forces a knockdown whatever the explosion does — this arena's enemies are not knocked down, so the crowd control that makes this weapon safe to fire up close pays nothing here":
    直击必定造成击倒，与爆炸无关 —— 这个战场的敌人不会被击倒，所以让这把武器敢近距离开火的那部分控场，在这里一分不值
  "a per-PELLET aim weight, not a whole-spread promise — the landing spot is rolled for each pellet": 这是逐弹丸的瞄准权重，不是整片弹丸都爆头 —— 落点对每颗弹丸单独掷点
  "a percentage, into the same bucket a mod of this stat feeds — permanent, no trigger and no clock": 一个百分比，进入这条属性的 mod 所在的同一个乘区——永久生效，没有触发条件也没有时间
  "a place of its own": "一个独立的地点"
  "a rocket that hits nothing detonates on its own after 6 seconds, which needs a miss this arena resolves at the wall of its own geometry-free floor": "打空的火箭会在 6 秒后自行引爆，这需要一次「打偏」，而本场的打偏是在一块没有几何的地面上结算的"
  "a scenario can set a buff for a mod this build does not carry — the gain scan reads it": 场景可以为当前配装没装的 mod 预设增益状态 —— 快速计算会读它
  "a second damage instance, not a multiplier — it takes faction damage and the headshot multiplier one more time than the hit it copies": 附加的一次独立伤害实例，不是乘区——派系伤害和弱点倍率都会比它复制的那一下多吃一次
  "a sentinel weapon is always aiming — it just never aims at the head, so on-headshot effects never fire": 守护武器永远处于瞄准状态 —— 它只是从不瞄准头部，所以爆头触发类效果不会生效
  "a sentinel weapon is fired by the companion and never aims at the head, so this is 0 whatever is typed — and every on-headshot effect stays dead":
    守护武器由守护自己开火，它从不瞄头，所以这里无论填什么都是 0 —— 一切「爆头时」的效果也都不会触发。
  "a stronger buff of the same kind is running — this one adds nothing": 同类里有更强的一个正在生效——这一个不产生任何加成
  "abilities cast on this weapon — set your Ability Strength and the values follow": 施加在这把武器上的战甲技能——填入技能强度，下面的数值随之变化
  "about {s}s left": 还剩约 {s} 秒
  "add arcane": 添加赋能
