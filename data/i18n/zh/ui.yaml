  "how many builds survive to the last round — each is then run at the final-round run count beside this": 有多少套配装能进最终轮 —— 每套都按旁边的最终轮次数跑
  "how many simulations each finalist gets in the last round — blank uses the fight's own count, which is what the replay will use. A smaller number searches faster and is worth re-measuring in the simulator": 最终轮里每个优胜者跑多少次模拟 —— 留空就用这场仗自己的次数，也就是重放会用的那个。填小一点搜得更快，代价是优胜者值得再到模拟器里重测一遍
  "how many simulations each option is averaged over — 10 is the floor, and more costs proportionally more time": 每个选项的数字是多少次模拟的平均 —— 最低 10 次，次数越多越慢，成正比
  "read-only — it belongs to the simulator, which is where it is edited": 只读 —— 它属于模拟器，只在那里编辑
  "re-measuring this build in the simulator": 正在模拟器里重测这套配装
  "re-run in the simulator: this is the simulator's own number for this build": 已在模拟器里重跑：这就是模拟器对这套配装给出的数字
  "the simulator does not reproduce the search's own score for this build — the build shown may not be the one that was scored": 模拟器复现不出搜索给这套配装打的分 —— 屏幕上这套可能不是被评分的那一套
  "the simulator refused this build — see the build's own card": 模拟器拒绝了这套配装 —— 看它自己的卡片
  "this ranking predates the simulator re-run": 这份排名早于"模拟器重跑"这个功能
  "must match how you intend to play it — the winner is scored under this player": 必须和你打算怎么玩一致 —— 优胜者是在这个使用者之下评分的
  "what the search is allowed to assume": 这次搜索被允许做哪些假设
  "read-only — the fight's own, applied to every candidate; a buff nobody set starts where it would in a fight": 只读 —— 用这场仗自己的设置，套到每个候选上；没人设过的 buff 就从它在战斗中该有的位置开始
  "who you are shooting at, where, and for how long": 你在打谁、在什么条件下、打多久
  "what this run is allowed to assume": 这次模拟被允许做哪些假设
  "how many times to replay it, and what to read off — the optimizer's final round uses this count unless its own says otherwise": 重放多少次、读哪个数 —— 优化器的最终轮默认也用这个次数，除非它自己另外指定
  "your Warframe's armor, buffs included — Primary Bulwark pays +1% damage per point past 1,000. 0 = no frame": 你战甲的护甲值，含增益 —— 主要壁垒每超出 1,000 点给 +1% 伤害。填 0 表示没有战甲
  "your Warframe's MAX energy — Primary Overcharge turns 35% of it into multishot. 0 = no frame": 你战甲的能量上限 —— 主要过载把其中 35% 转成多重射击。填 0 表示没有战甲
  "whoever is holding the weapon and what they are doing — this gates the buffs below": 握着这把武器的那一方，以及他在做什么 —— 下面的 buff 由此决定是否生效
  "the wielder's state: mods that only pay while Invisible (Spectral Serration) grant nothing when this is off": 使用者状态：只在隐身时生效的 MOD（幽魂锯齿）关掉这个就什么都不给
  "the wielder's state: what a card means by \"while Airborne\"": 使用者状态：卡面上说的「滞空时」指的就是这个
  # The LABEL "Overshields" is deliberately absent, as "Airborne" and "Invisible"
  # are: a string is transcribed, never translated, and DE's own Chinese for it
  # could not be reached from here (the Chinese wiki has no such page). It falls
  # back to English until someone reads it off the game client.
  "the wielder's state: what a card means by \"With Overshields\". Nothing here takes them away, so it is a declaration": 使用者状态：卡面上说的「拥有超量护盾时」指的就是这个。这里没有任何东西会打掉它，所以它是一个声明而不是战斗里的变量
  # Same rule as the labels above: "Channeled ability" is DE's own wording and
  # is left in English until someone reads its Chinese off the game client.
  "the wielder's state: what a card means by \"With Channeled Ability active\". The ability must DRAIN ENERGY over time — Desecrate, Haven and an empty Gloom do not count": 使用者状态：卡面上说的「引导类技能生效中」指的就是这个。技能必须是持续耗能的——亵渎、庇护所、以及周围没有敌人时的阴郁都不算
  # THE LOADOUT, and BOTH halves are translated — unlike "Overshields" and
  # "Airborne" above, "Only this weapon" is OUR OWN wording rather than a phrase
  # off a DE card, so there is no official Chinese to transcribe and nothing is
  # being invented in DE's voice.
  "Only this weapon": 仅装备这把武器
  "the LOADOUT, not what the wielder is doing: off means a full one, which is what the board is scored under. On, this weapon is the only one carried — the Vasto's Lone Gun pays its \"With No Primary Equipped\" half, and every \"On Equip from Primary\" or \"while Holstered\" clause becomes impossible rather than merely unmodelled": 配装本身，而不是使用者在做什么：关闭时表示带着完整的一套武器，榜单也是按这个跑分的。开启后这把枪就是身上唯一的武器——瓦斯托的「孤枪」会付出它「未装备主武器时」的那一半，而所有「从主武器切换时」「收枪状态下」的词条则从「没做建模」变成「根本不可能触发」
