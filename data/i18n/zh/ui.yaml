  "An extra hit also fires off a Blast detonation, taking the faction bonus a third time and the elemental bonus the detonation itself is denied. The wiki lists it as a bug; it is modelled as it plays now, and a fix would change this number.": "爆炸异况引爆时也会触发一次额外伤害：派系加成吃第三次，还会吃到引爆本身拿不到的元素加成。wiki 把它列为 bug；这里按现在的实际表现建模，修复后这个数字会变。"
