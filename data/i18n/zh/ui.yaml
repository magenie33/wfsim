  # ---- THE COMBAT RECORD ------------------------------------------------
  #
  # The panel a reader opens to argue with a number, so every column heading
  # and every factor NAME in it has to be readable — an all-English ledger on
  # a Chinese page is a ledger nobody here can check (2026-08-27).
  #
  # THE FACTOR NAMES COME FROM THE ENGINE as `&'static str`, the same strings
  # the ledger multiplies, so they are keyed here exactly as the engine writes
  # them. A key that drifts shows up as English on the page rather than as an
  # error, which is why `check_disclosure`'s own rule applies: run the pass in
  # both languages.
  "Combat record": "战斗记录"
