  "flat base damage on empty reload — the card prints +10 and the effect is +14, measured in the damage: a pellet at 2 Galvanized stacks x 3 status types reads 266, where +10 would read 255": 空弹匣装填时的固定基伤 —— 卡面写 +10，实际是 +14，已在伤害数字里实测：镀层 2 层、目标 3 种异常时每颗弹丸打出 266，按 +10 算只有 255
  "flat base damage on empty reload — the card prints +10 and the effect is +14, measured in the damage on the Boar Prime, which shares this card": 空弹匣装填时的固定基伤 —— 卡面写 +10，实际是 +14，已在野猪 Prime 的伤害数字里实测，两者共用这张卡
  "on headshot fire rate — the card leaves out that a headshot adds a stack only half the time: the wiki's notes cell gives the roll a 50% chance of activating, and the simulation rolls it": 爆头射速加成 —— 卡面没写爆头只有一半几率叠层：wiki 备注栏写明触发几率为 50%，模拟按 50% 掷骰
  "fire rate bonus — the card prints Sprint Speed 1.2 or Higher and the effect requires 1.1 — so it pays on frames the card says it should not, and Amalgam Serration alone carries any Warframe over the line": 射速加成 —— 卡面写冲刺速度 1.2 或以上，实际只要求 1.1 —— 所以卡面说不生效的战甲上它也生效，单装一张「并合 膛线」就能让任何战甲跨过门槛
