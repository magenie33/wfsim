  "the same total, split several ways": "同一个总数的几种拆分"
  "Invisibility is not simulated: ticking this treats the wielder as invisible for the whole fight.": "隐身状态不做模拟：勾选即视为使用者整场处于隐身。"
  "Its +30% Ability Strength is not applied to the buffs here; add it to the Ability Strength box if it should be.": "它的 +30% 技能强度不会自动作用于这里的增益；需要的话，请手动加到技能强度一栏。"
  "Its Energy cost is not modelled: 50 Energy for 5 s at 100% Ability Duration, and this fight has no energy economy. Set the duration to what your build keeps up.": "能量消耗未建模：100% 技能持续时间下，50 能量维持 5 秒，而本场没有能量系统。请把持续时间设为你的配装实际能维持的长度。"
  "Its reserve refill adds nothing here: reserves are infinite by default. Its effect on how often you reload is modelled.": "它补充备弹的效果在这里不产生收益：备弹默认无限。它对换弹次数的影响已建模。"
  "The pack refills the magazine instantly. Reserves are infinite by default, so the refill adds nothing here, and running the pack dry is not simulated.": "弹药包会立即装满弹匣。备弹默认无限，所以补充在这里不产生收益，弹药包耗尽也不做模拟。"
  "Arch-guns and battery weapons (Kitguns with Pax Charge included) get nothing from it in game. The sim does not exclude them, so on those weapons it reads high.": "空战枪和电池类武器（包括装了 Pax Charge 的组合枪）在游戏里吃不到它。模拟没有排除它们，所以在这些武器上数字偏高。"
  "The condition, the companion's critical chance over 50%, is not checked: ticking this treats it as met.": "条件（同伴暴击率超过 50%）不做检查：勾选即视为满足。"
  "Headshot kills shorten the companion's recovery timer. There is no companion to revive here; the number is unaffected.": "爆头击杀会缩短同伴的复苏计时。本场没有需要复苏的同伴，数字不受影响。"
  "The card doubles this on melee strikes; the sim fires guns, so only the gun half applies.": "卡面在近战攻击时翻倍；模拟器只开枪，所以只计入枪械那一半。"
  "Contagion Cloud, its augment, leaves a damaging cloud where an enemy dies. It needs a corpse and a second target, so it is not counted; against a crowd the number reads low.": "Contagion Cloud（强化 MOD）会在敌人死亡处留下伤害云。它需要尸体和第二个目标，所以未计入；面对人群时数字偏低。"
  "The teleport and its heavy attack are not modelled: the ability swaps to melee and strikes the target it jumps to. Only the buff the cast leaves behind is modelled.": "瞬移及其重击未建模：技能会切到近战，并重击跳到的目标。只计入施放后留下的增益。"
  "Kullervo's passive, +75% Heavy Attack Efficiency and +100% Heavy Attack Wind Up speed, belongs to the Warframe, and this fight has no Warframe.": "Kullervo 的被动（+75% 重击效率、+100% 重击蓄力速度）属于战甲，而本场没有战甲。"
  "A reload buff gained mid-fight (Conjunction Voltage's stacks, Merciless) also shortens the refill here, which in game 'is not affected by mods or abilities'. Reload mods are handled correctly. The effect is at most the refill: 0.6 s of a 2.0 s empty cycle on a Tombfinger, so the number can read slightly high.": "战斗中途获得的换弹增益（Conjunction Voltage 的叠层、Merciless）在这里也会缩短充能，而游戏里充能「不受 MOD 或技能影响」。换弹 MOD 的处理是正确的。影响最多就是充能本身：Tombfinger 一次 2.0 秒空匣循环中的 0.6 秒，所以数字可能略偏高。"
  "In game it stops reload-triggered mods and arcanes, such as Pressurized Magazine or Arcane Awakening, because there is no reload. The sim does not, so a build pairing one with Pax Charge reads high by that card's worth.": "游戏里它会让装填触发类 MOD 和赋能（例如 Pressurized Magazine、Arcane Awakening）失效，因为根本没有装填。模拟没有这道限制，所以同时装了这类卡的配装数字偏高，偏高的量就是那张卡的价值。"
  "The homing bolts are not fired: a headshot kill releases 1-4 bolts, half Slash and half Puncture, with a forced Impact proc and double benefit from crit mods. A headshot build with this arcane reads low by everything the bolts would deal.": "追踪弩箭不会射出：爆头击杀会放出 1–4 支，一半切割、一半穿刺，必定冲击，暴击 MOD 收益翻倍。带这个赋能的爆头配装数字偏低，偏低的量就是这些弩箭的伤害。"
  "The field is not placed: on a kill, a 20% chance to leave a field for 3-12 s dealing 80 Heat to enemies within 10 m. Against a crowd this arcane reads low. Its damage is flat, so it matters less as the build gets stronger.": "力场不会放置：击杀时有 20% 几率留下持续 3–12 秒的力场，对 10 米内的敌人造成 80 火焰伤害。面对人群时这个赋能的数字偏低。它的伤害是固定值，配装越强，占比越小。"
  "The field is not placed: on a kill, a 20% chance to leave a field for 3-12 s dealing 40 Cold to enemies within 10 m. Against a crowd this arcane reads low. Its damage is flat, so it matters less as the build gets stronger.": "力场不会放置：击杀时有 20% 几率留下持续 3–12 秒的力场，对 10 米内的敌人造成 40 冰冻伤害。面对人群时这个赋能的数字偏低。它的伤害是固定值，配装越强，占比越小。"
  "The field is not placed: on a kill, a 20% chance to leave a field for 3-12 s dealing 200 Electricity to enemies within 10 m. Against a crowd this arcane reads low. Its damage is flat, so it matters less as the build gets stronger.": "力场不会放置：击杀时有 20% 几率留下持续 3–12 秒的力场，对 10 米内的敌人造成 200 电击伤害。面对人群时这个赋能的数字偏低。它的伤害是固定值，配装越强，占比越小。"
  "The field is not placed: on a kill, a 20% chance to leave a field for 3-12 s dealing 40 Toxin to enemies within 10 m. Against a crowd this arcane reads low. Its damage is flat, so it matters less as the build gets stronger.": "力场不会放置：击杀时有 20% 几率留下持续 3–12 秒的力场，对 10 米内的敌人造成 40 毒素伤害。面对人群时这个赋能的数字偏低。它的伤害是固定值，配装越强，占比越小。"
  "Its helmet is not modelled: in game it is a separate destructible hitbox that takes more damage than the head beneath. Here every headshot lands on the bare head.": "头盔未建模：游戏里头盔是独立的可破坏部位，受到的伤害高于下面的头部。这里每次爆头都直接打在头上。"
  "In game its pulse does not currently dispel Warframe abilities, though the wiki says it does. This fight keeps your buffs; a fix restoring the pulse would remove them.": "游戏里它的驱散脉冲目前并不会清除战甲技能，尽管 wiki 写着会。本场保留你的增益；如果修复恢复了这个脉冲，增益会被清除。"
  "The mines on its back are a 0.5x hitbox the sim never aims at; shots land on the body or the head.": "它背上的地雷是 0.5 倍的受击部位，模拟从不瞄准那里；子弹只落在身体或头部。"
  "Cold greatly slows a Demolisher in game, and its pulse cannot cleanse it. The sim has no movement, so slowing it changes nothing here.": "冰冻在游戏里会大幅减慢爆破使，且它的脉冲清除不掉。模拟没有移动，所以减速在这里没有影响。"
  "The conduit it walks towards is not modelled: a Disruption run races its arrival, and this fight has no such clock.": "它走向的导管未建模：中断任务是在跟它的到达时间赛跑，而本场没有这个计时。"
  "Its damage attenuation is not applied, and it is this unit's main defence: the game caps damage per instance and per second as a share of its max health. A build here removes far more of it than in game, so the number reads high. The caps are unpublished.": "伤害衰减未应用，而这正是它的主要防御：游戏按最大生命的比例限制单次和每秒受到的伤害。这里的配装削掉的远多于游戏里，数字偏高。上限数值没有公开。"
  "Its capped status vulnerability is not applied: the game gives it partial status immunity, and the sim supports only full immunity, so each status type either lands or does not.": "受限的异况易伤未应用：游戏给它的是部分异况免疫，而模拟只支持完全免疫，所以每种异况要么能上、要么不能。"
  "No weak point is published for it, so it has no head here: a headshot build scores as if every shot were a body shot.": "它没有公开的弱点，所以这里没有头部：爆头配装按每一枪都打身体计分。"
  "Each generation gains random abilities from a pool of more than twenty; the Legacyte here is the same every time.": "每一代会从二十多种技能中随机获得新技能；这里的 Legacyte 每次都一样。"
  "Its tendril bulbs are a third hitbox the sim never aims at; they take 1.5x from guns and 0.1x from melee.": "它的触手球囊是第三个受击部位，模拟从不瞄准；它们受枪械伤害 1.5 倍、近战 0.1 倍。"
  "It burrows, attacks from underground and drains health from what it hits. There is no movement and no player health here, so neither applies.": "它会钻地、从地下攻击，并吸取被击中者的生命。这里没有移动，也没有玩家生命，所以两者都不适用。"
  "The card omits that a headshot adds a stack only half the time: the wiki gives it a 50% chance, and the sim rolls it.": "卡面没写爆头只有一半几率叠层：wiki 写明几率为 50%，模拟按 50% 掷骰。"
  "The card says +10; the effect is +14, measured: a pellet at 2 Galvanized stacks and 3 status types reads 266, where +10 would read 255.": "卡面写 +10，实测为 +14：镀层 2 层、目标 3 种异况时每颗弹丸打出 266，按 +10 应为 255。"
  "The card says +10; the effect is +14, measured on the Boar Prime, which shares this card.": "卡面写 +10，实测为 +14（在共用这张卡的野猪 Prime 上测得）。"
  "The Valkyr Talons as a weapon, with their damage, mods and arcanes, belong to a weapon build, not to this panel.": "Valkyr 利爪作为武器的部分（伤害、MOD、赋能）属于武器配装，不在这个面板里。"
  "The combo is not modelled: a recast inside the window multiplies damage by 200% and cuts the cost by 50%, and each recast after that by 400% and 75%.": "连击未建模：在窗口内再次施放，伤害 ×200%、消耗 −50%；之后每次再施放为 ×400%、−75%。"
  "Restore": "恢复"
  "Deleted": "删除时间"
  "Recently deleted": "最近删除"
  "Kept for 30 days, then erased.": "保留 30 天，之后清除。"
  "{n} days left": "还剩 {n} 天"
  "Nothing deleted in the last 30 days.": "最近 30 天没有删除过内容。"
  "Not restored: the account's sync allowance is used": "未恢复：账户的同步额度已用完"
  "Could not restore just now.": "暂时无法恢复。"

