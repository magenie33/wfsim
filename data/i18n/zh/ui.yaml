  "stacks the run STARTS with. 0 = earned in-fight on this buff's own trigger, which is what a fight that has not been in contact for a few seconds looks like": 本局开始时的层数。0 = 在战斗中靠这个增益自己的触发条件挣回来，也就是"打了一阵、但刚有几秒没接敌"的状态
  "permanent — nothing grants or decays it, so it holds all run": 永久 —— 没有触发也不会衰减，整局都保持
