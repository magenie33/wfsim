  "Join": "加入一起算"
  "Turned on, this device joins the other volunteers in running WFSim's simulation and optimization tasks for every player. A result counts only when two volunteers compute it separately and get exactly the same answer, and your device is one of them.": "打开后，这台设备会和其他志愿者一起，为所有玩家运行 WF模拟 的模拟类任务和优化类任务。每一个结果都要两位志愿者各自算出、完全一致才算数，你的设备就是其中一位。"
  "It takes 30% of this device's processing power by default, only while a WFSim page is open. You can set it from 10% to 100% in the compute menu at the top, beside Solo, the share your own calculations take (50% by default); past 100% together, the two share it in proportion while both run. It pauses on battery unless you change that in the menu; while it runs the device uses more power and runs warmer, and one click stops it.": "它默认使用这台设备 30% 的处理能力，只在 WF模拟 页面开着时运行。你可以在顶部的计算菜单里设为 10% 到 100%，旁边是“自己算”，也就是你自己计算所用的比例（默认 50%）；两者合计超过 100% 时，同时运行的两边按比例分配。使用电池时默认暂停，可在菜单里改；运行时设备会多耗电、多发热，一键就能关闭。"
  "It is a voluntary contribution: everything it computes is free for every player, WFSim never makes money from it, and it is unpaid. Your contribution is counted to this browser, and, if you like, under your name on the contributors' ranking.": "这是自愿的公益贡献：算出的一切都免费给所有玩家，WF模拟 不会拿它赚钱，参与也没有报酬。你的贡献会记在这个浏览器上，你愿意的话，也会以你的名字出现在贡献榜上。"
  "The volunteers' devices compute WFSim's free features together. Everything they compute is free for every player, and WFSim never makes money from it.": "志愿者们的设备一起算出了 WF模拟 给所有人的免费功能。算出的一切免费给所有玩家，WF模拟 不会拿它赚钱。"
