  "3 kills within 2 s of each other summon the second gun": 2 秒内连续 3 次击杀，召唤出第二把枪
  "3 kills, each within 2 s of the last, summon a second copy of this weapon for 6 s: magazine ×2 and fire rate ×1.4. This is simulated, and a kill while it is up does not refresh it — a fight whose bodies take longer than 2 s each never sees it at all.": 连续 3 次击杀、每次都在上一次击杀后 2 秒内，会召唤出第二把同样的武器，持续 6 秒：弹匣 ×2、射速 ×1.4。这一条有建模；第二把枪在场期间的击杀不会刷新它——一场每个目标都要打满 2 秒以上才死的战斗，永远也不会看到它。
  "A headshot spawns six homing spores that explode in 3.3 m each, plus a further explosion (module). The engine has no hit that spawns projectiles, so none is counted, and in a headshot-heavy fight the number reads several times low.": "爆头会生成六颗追踪孢子，各自在 3.3 米内爆炸，爆头本身还有一次额外爆炸（模块）。引擎没有「命中生成弹体」，所以都未计入；以爆头为主的战斗中数字会偏低好几倍。"
  "A Status Effect has a 15% chance to SET the next hit's crit chance to 300% — ignoring every other crit bonus. Rolled per pellet.": 异常状态有 15% 几率把下一次命中的暴击率设定为 300%——无视其他一切暴击加成。逐弹丸判定。
  "A body that dies respawns where it stood, so the arrangement is the same at the end as at the start and the score is a rate rather than a race to the last body.": 死掉的目标在原地重生，所以阵型从头到尾一样，分数是一个速率而不是清空最后一个的竞速。
  "A desktop version is available for Windows.": "桌面版目前只支持 Windows。"
