  "Hildryn's signature bonus is not modelled — carried by her it holds 300 more reserve ammo, 700 instead of 400, and this arena has no Warframe holding it": Hildryn 的专属加成尚未建模 —— 由她携带时备弹上限多 300（700 而不是 400），而这个战场里没有战甲持有它
  "Holstered Reload/s": 收枪装填/秒
  "How the weapon is PLAYED belongs to the entry, not to this ruler: a weapon with an Incarnon form is ranked twice, once through its cycle and once never transmuting.": 武器怎么打属于参赛条目，而不属于这把尺子：有灵化形态的武器会上榜两次，一次走灵化循环，一次全程不转变。
  "Hystrix Injection, the Hystrix-exclusive augment — a weapon-exclusive card outside the pools this roster loads": "「Hystrix Injection」，Hystrix 家族的专属增强 MOD——这是一张武器专属卡，不在本武器库载入的卡池里"
  "INFINITE BODY PUNCH THROUGH: the page grants this weapon 1.1 m of punch through AND unlimited penetration of BODIES specifically. The 1.1 m is transcribed and spends `space::BODY_MATERIAL_M` a body like every other weapon's, so the slug stops after two enemies here where in game it would cross the whole line": "无限穿透身体：页面给这把武器 1.1 米穿透，并且额外给了对「身体」的无限穿透。这里录入的是那 1.1 米，并且和其他武器一样每穿过一个身体扣掉 `space::BODY_MATERIAL_M`，所以这颗弹丸在这里穿过两个敌人就停了，而在游戏里它会穿过一整排"
  "Incarnon Form": 灵化形态
  "Incarnon Genesis": 灵化之源
  "Incarnon cycle": 灵化循环
  "Infested": 感染者
  "Infinite ammo": 无限弹药
  "It does take money and time to run. If it has ever saved you a Forma, you can chip in.":
    它确实要花钱和时间来维持。如果它替你省下过一根 Forma，可以来投喂一下。
  "It is NOT a way to play a whole engagement — the form has to be bought and runs out, so no ruler ranks it. It is here so you can read the form's own numbers.": 这并不是一种能打满整场交战的玩法 —— 这个形态要花代价换取，而且会耗尽，所以没有标尺给它排名。它在这里是为了让你看到这个形态自己的数值。
  "the record is open in its own window": 战斗记录已在它自己的窗口里打开。
  "Bring it back here": 收回本页
  "Open in its own window": 在新窗口打开
  "{a}–{b} of {n}": 第 {a}–{b} 行，共 {n} 行
  "the STANCE SLOT is not modelled: these four ground combos are Crushing Ruin's, transcribed from its published table, and equipping a different hammer stance would script them differently — the engine has no way to hear that yet, so a build on Shattering Storm or Fracturing Wind reads this one's numbers": 架势槽位尚未建模：这四套地面连段用的是「粉碎废墟」（Crushing Ruin）的公开数据，换成别的锤类架势会得到完全不同的连段脚本，而引擎目前听不到这件事——所以装「碎裂风暴」或「碎风」的配装读到的仍是这一套的数字
  "a swing's own animation length is not published anywhere: the wiki gives a combo's total damage-per-second at 1.0x attack speed, so the combo's DURATION is exact (sum of multipliers / that rate) and the split between its swings is even. It moves a status tick's start by fractions of a second inside a combo and moves no total": 单独一击的动作长度没有任何公开来源：wiki 只给了每套连段在 1.0x 攻速下的总均伤每秒，所以连段的**总时长**是精确的（倍率之和 ÷ 该速率），而各击之间是平均分配的。这只会让一次触发的起始时间在连段内偏移零点几秒，不改变任何总量
  "the Tennokai window's WIND-UP SPEED is a stand-in: DE publishes no figure for how much faster a heavy attack charges inside the flash, and this uses +100%. The window itself, its chance, its cadence and everything the seven cards do to it are modelled": 天能界窗口的**蓄力加速**是代用值：DE 没有公布在闪光窗口内重击蓄力快多少，这里取 +100%。窗口本身、它的触发概率、节奏，以及七张卡对它做的一切都已建模
  "Power Spike's partial combo decay is a Warframe passive and is not modelled: this counter drops to zero when its clock runs out, so a build running that passive keeps far more of it than this reports": 「能量尖峰」的连击部分衰减是战甲被动，尚未建模：这里的计数器一到时间就直接归零，所以带该被动的配装实际保留的连击远多于此处所报
  "melee RIVENS are not modelled — there is no melee riven pool yet, so the riven editor offers this weapon nothing": 近战**紫卡**尚未建模——目前没有近战紫卡池，所以紫卡编辑器对这把武器什么都不提供
  "attack speed shortens this mode's whole cadence, and in game it should not: the 1.2s heavy wind-up is fixed and only the interval BETWEEN heavy attacks is shortened. The swing delay here is one number covering both, so an attack-speed build reads HIGH in this mode": 攻速在这里缩短了整个循环，而游戏里不该如此：1.2 秒的重击蓄力是固定的，被缩短的只是两次重击**之间**的间隔。此处的出手间隔是一个数字同时代表了这两者，所以攻速流派在这个模式下读数偏高
  "the slam's radius grows with the height it was dropped from — up to 150% at 15 m and down to a floor of 2.5m/radius — and this arena has no vertical axis, so the listed radius is what is used": 捶地半径会随落下高度增长——15 米以上可达 150%，最低降到 2.5m/半径 的下限——而这个竞技场没有垂直轴，所以直接采用面板半径
  "Condition Overload does not apply to slams, heavy slams or radial attacks (the mod's own words), and this entry does not yet exempt it — a build carrying Condition Overload therefore reads HIGH in this mode": 异常状态过载不作用于捶地、重击捶地和径向攻击（mod 卡面原话），而本条目尚未做这个豁免——所以带异常状态过载的配装在这个模式下读数偏高
  "melee CRITICAL CHANCE mods read x2 on a heavy attack — True Steel, Sacrificial Steel and Galvanized Steel all say so on their own cards — and this entry does not double them, so a crit build reads LOW in this mode": 近战**暴击率** mod 在重击上读作 x2——斩铁、牺牲之钢、镀锌之钢的卡面都这么写——而本条目没有做这个翻倍，所以暴击流派在这个模式下读数偏低
  "this build is already on the board ({row}) — nothing was sent": 这套配装已经在榜上了（{row}），所以没有上传。
  "It is already a row on the board, so nothing here can be edited and its runs are not submitted. Copy it and everything opens up — mods, arcanes, evolutions and the mode — and what you run goes to the board as your own entry.": 它本身就是榜上的一行，所以这里什么都改不了，跑出来的结果也不会提交。复制一份，全部就都能改了——mod、赋能、进化，还有形态——而且你跑出来的成绩会作为你自己的一行进榜。
  "It tells you what it cannot model, on the card where you are standing: on a weapon, an evolution, a mod, an arcane, an enemy. It lists those itself rather than waiting to be asked.":
    它会在你正看着的那张卡上告诉你它算不准什么：武器上、进化词条上、MOD 上、赋能上、敌人上。这些是它自己列出来的，不用你来问。
  "Its fire rate FALLS while the trigger is held — to 60% of the listed rate over 51 shots — and rebuilds the moment you stop firing. This is simulated; the sim holds the trigger until the magazine is dry.": 持续按住扳机时射速会下降——51 发之内降到标称射速的 60%，一停火就立刻回满。这条已经建模；模拟里是一直按到弹匣打空为止。
  "Its fire rate SPOOLS UP while the trigger is held — from 20% of the listed rate, full from the 6th shot. This is simulated, and it rebuilds after every reload.": 持续按住扳机时射速会往上爬——从标称射速的 20% 起步，到第 6发拉满。这条已经建模，每次换弹后重新爬。
  "Its fire rate SPOOLS UP while the trigger is held — from 20% of the listed rate, full from the 7th shot. This is simulated, and it rebuilds after every reload.": 持续按住扳机时射速会往上爬——从标称射速的 20% 起步，到第 7发拉满。这条已经建模，每次换弹后重新爬。
  "Its fire rate SPOOLS UP while the trigger is held — from 20% of the listed rate, full from the 9th shot. This is simulated, and it rebuilds after every reload.": 持续按住扳机时射速会往上爬——从标称射速的 20% 起步，到第 9发拉满。这条已经建模，每次换弹后重新爬。
  "Its fire rate SPOOLS UP while the trigger is held — from 25% of the listed rate, full from the 4th shot. This is simulated, and it rebuilds after every reload.": 持续按住扳机时射速会往上爬——从标称射速的 25% 起步，到第 4发拉满。这条已经建模，每次换弹后重新爬。
  "Its fire rate SPOOLS UP while the trigger is held — from 25% of the listed rate, full from the 6th shot. This is simulated, and it rebuilds after every reload.": 持续按住扳机时射速会往上爬——从标称射速的 25% 起步，到第 6发拉满。这条已经建模，每次换弹后重新爬。
  "Its innate headshot bonus MULTIPLIES the headshot bracket instead of joining it, so it compounds with Deadhead and Target Acquired rather than adding to them.": 它自带的爆头加成是乘在爆头加算区上，而不是并入其中——所以它与首领终结、锁定目标是相乘而非相加。
  "Its scope's top zoom (4.5x) grants +50% headshot damage while aiming, additive with headshot mods. This arena has no field of view to trade for magnification, so the scope is always at that level.": 它瞄准镜的最高倍率（4.5x）在瞄准时提供 +50% 爆头伤害，与爆头 MOD 加算。这个战场没有视野概念，倍率不需要用视野去换，所以瞄准镜始终停在这一档。
  "Its scope's top zoom (6.0x) grants +60% headshot damage while aiming, additive with headshot mods. This arena has no field of view to trade for magnification, so the scope is always at that level.": 它瞄准镜的最高倍率（6.0x）在瞄准时提供 +60% 爆头伤害，与爆头 MOD 加算。这个战场没有视野概念，倍率不需要用视野去换，所以瞄准镜始终停在这一档。
  "Its {form} alone, from the first second.": 从第一秒起就只用{form}。
  "Join the Discord": 加入官方 Discord
