  "Necrophagic Vigor, the Synapse family's exclusive mod — a weapon-exclusive card outside the pools this roster loads": "「Necrophagic Vigor」，Synapse 家族的专属 MOD——这是一张武器专属卡，不在本武器库载入的卡池里"
  "Restart now": "立即重启"
  "The same calculator on your own machine — opens instantly, works offline, and updates itself.": "同一个计算器，跑在你自己的电脑上 —— 秒开、可离线、自动更新。"
  "Update": "更新"
