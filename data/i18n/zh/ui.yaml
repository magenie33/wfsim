  "early access — a cast time is one unmeasured second for every ability, and no energy regen is modelled, so a pool is a budget of casts": 早期功能 —— 每个技能的施放时间目前都是同一个未实测的 1 秒，且没有建模任何能量回复，所以能量池就是能放几次的预算
