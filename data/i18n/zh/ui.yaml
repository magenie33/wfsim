  "WFSim counts what gets used — which pages open, whether a build was computed, a simulation or a search started and finished, whether Nona was opened, asked something or set to concise mode (never what was asked), whether the page itself failed (the kind of failure and where in WFSim's own code, never its text), a board build opened, a link shared and from which part of the page, how many presets and customs are saved — under a random id this browser keeps. The count records no IP address and sets no cookie, and the id is not linked to anything that identifies you. With Global Privacy Control or Do Not Track on, nothing is sent. Per weapon, how many people ran a simulation or a search each day is added up and shown on the home page as its popularity ranking — totals only.": WF模拟会统计功能的使用情况——打开了哪些页面、是否算出了配装、模拟或搜索是否开始和跑完、是否打开了九九、向她提问或切到精简模式（从不记录问了什么）、页面本身是否出错（只记出错的类别和在 WF模拟 自己代码里的位置，不记错误内容）、是否打开了排行榜上的配装、是否分享了链接以及从页面哪个位置分享、保存了多少预设和自定义项——记在这个浏览器保存的一个随机编号下。统计不记录 IP 地址，也不设置 cookie，这个编号不与任何能识别你身份的信息关联。浏览器开启了“全局隐私控制”或“请勿追踪”时，不发送任何数据。每把武器每天有多少人跑过模拟或优化，会累加后作为首页的热度排行公开显示——只有总数。
  "It also counts what kind of device opens it, in broad classes only — touch or mouse, a narrow or wide screen, how many processor cores in a few steps, whether it is inside WeChat or QQ — never the model or the browser, and whether computing for the board carries on with the page out of sight.": "另外还会统计打开它的设备属于哪一大类——触屏还是鼠标、窄屏还是宽屏、处理器核数分几档、是否在微信或 QQ 里打开——从不记录型号或浏览器；以及页面不在眼前时，为排行榜的计算是否还在继续。"
