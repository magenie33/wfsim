# Effect-line phrase substitutions for mod/arcane/evolution descriptions
# ("+X% Critical Chance" → "+X% 暴击几率"). ORDERED — longest phrases first
# so partial matches never clobber. Each entry: [regex, replacement] or
# [regex, replacement, flags] (default flags: gi).
  # --- Rivens (裂罅) ------------------------------------------------------
  # DE's own word: the CN client calls these "步枪裂罅 Mod" / "手枪裂罅 Mod"
  # (DE's Public Export in Chinese, joined on internal_name), so the noun is
  # 裂罅 and the class prefixes are its own. Bonus/Malus have no official CN
  # string — they are the wiki's words for the two halves of a card — so they
  # take the standard 增益/减益 pair. Every VALUE line localizes through
  # effect_phrases below:
  # "+150% Critical Chance" reads the same on a riven as on Point Strike.
