  "Shattering Justice, Acid Shells and Clip Delegation, the Sobek-exclusive mods — weapon-exclusive cards outside the pools this roster loads. Acid Shells in particular detonates corpses for a share of their health, which is a whole second damage source": "「Shattering Justice」「Acid Shells」和「Clip Delegation」，Sobek 的专属 MOD——这些是武器专属卡，不在本武器库载入的卡池里。尤其是「Acid Shells」，它会按尸体生命值的一定比例引爆尸体，那是一整个第二伤害来源"
