  "Fired in its {form} for the whole engagement — it never transforms.": 整场交战都用{form}射击 —— 它从不变身。
  "Fired in its {form} for the whole engagement.": 整场交战都用{form}射击。
  "Nothing is spent to be in it, so it can be held forever — a ruler ranks it.": 待在这个形态不需要付出任何代价，所以可以一直保持 —— 官方标尺会给它排名。
  "Its {form} alone, from the first second.": 从第一秒起就只用{form}。
  "It is NOT a way to play a whole engagement — the form has to be bought and runs out, so no ruler ranks it. It is here so you can read the form's own numbers.": 这并不是一种能打满整场交战的玩法 —— 这个形态要花代价换取，而且会耗尽，所以没有标尺给它排名。它在这里是为了让你看到这个形态自己的数值。
  "Fire {base} until the gauge fills, spend it in {other}, come back — and again.": 用{base}打到充能条满，切到{other}把它花掉，再切回来 —— 如此往复。
  "{n} {what} fill it, and the earned form fires {rounds} before it ends.": 需要 {n} 次{what}才能填满，换来的形态能打 {rounds} 发然后结束。
  "Each way costs an animation — {in}s in, {out}s out, both scaled by reload speed.": 两个方向各有一段动作 —— 进入 {in} 秒、退出 {out} 秒，都会被装填速度缩放。
  "There is no transition animation either way.": 两个方向都没有切换动作。
  "A gauge bought with kills is worth what the fight lets you earn: against something that will not die, this mode is the base one.": 用击杀换来的充能条，值多少取决于这场战斗让你赚到多少 —— 面对一个打不死的目标，这个模式就等于基础模式。
