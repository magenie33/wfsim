  "slot": 槽位
  exilus: Exilus
  "Runs": 次数
  "the saved scenario to measure under — it decides the enemy, the technique and whether the ranking is KPM or DPS": 用哪个已保存的场景来测 —— 敌人、手法、以及按 KPM 还是 DPS 排序，都由它决定
  "KPM": KPM
  "what the run is judged by — the headline number and the picker's gain scan both follow it": 这次模拟以什么为准 —— 主数字和选择器的提升排序都跟着它
  "DPS": DPS
  "Atmosphere": 地面
  "Archwing": 空战
  "where the weapon is fired — it changes reload and ammo, nothing else": 武器在哪里开火 —— 它只影响装填和弹药，其余不变
  "a sentinel weapon is always aiming — it just never aims at the head, so on-headshot effects never fire": 守护武器永远处于瞄准状态 —— 它只是从不瞄准头部，所以爆头触发类效果不会生效
  "this weapon cannot be resupplied — once its reserve is gone it is removed for five minutes, so the setting has nothing to stand in for": 这把武器无法补给——储备打光后会被收回，五分钟后才能再次召唤，所以这个选项没有可代表的东西
  "on = ammo pickups keep the reserve topped up, which the sim has no entities for; off = it runs dry. The magazine and its reloads apply either way": 开 = 用弹药拾取补满储备（模拟器没有拾取实体，用这个代替）；关 = 会打光。弹匣和换弹两种情况下都照常生效
  "this weapon has no ammo reserve to run out of": 这把武器没有会耗尽的备弹
