  "What it was made of": 构成
  "four ways to cut one total — each of them comes to it": 一个总数的四种切法 —— 每一种加回去都等于它
  "where it came from": 从哪来的
  "this fight, one bucket a second": "这一场，每秒一格"
  "Details": "详情"
  "every damage instance, each checkable against in-game footage": "每一次伤害结算，均可与游戏录像逐条核对"
  "Next": "接下来"
  "what happened to this run, and what can be done with it": "这次运行的处理结果，以及后续操作"
