  "A stance decides what the weapon actually swings: it publishes a combo per mode, and installing one replaces the weapon's own. It also GRANTS capacity instead of costing it — 10 on a slot of its own polarity, 5 on a bare one, 4 on the wrong colour.": "架势决定这把武器实际挥出的是什么：它按 mode 各发布一套连段，装上就会顶掉武器自己的那套。它还**给予**容量而不是消耗容量——同极性槽位 10 点，无极性 5 点，极性不对 4 点。"
  "A heavy attack grants every attack 5% life steal plus 5% per combo level, permanently, shared with allies within 15 m. Nothing damages the Tenno here and there are no allies, so it adds nothing.": "一次重击会让之后所有攻击获得 5% 吸血，每级连击再加 5%，永久生效，并与 15 米内的队友共享。这里没有东西会伤害 Tenno，也没有队友，所以不产生收益。"
  "A 20% chance to resist a status effect while held protects the wielder; nothing shoots back here.": "持握时有 20% 几率抵抗一次异况，保护的是使用者；这里没有东西会还击。"
  "Melee drawn": "近战已抽出"
  "quick-melee": "快速近战"
  "the wielder's state: what a card means by \"With Melee Weapon Equipped\". It means the weapon is DRAWN — a quick-melee swing out of a gun does not satisfy it. Every ruler runs it drawn": "持握者的状态：卡面上「With Melee Weapon Equipped」指的就是这个。它要求武器**已经抽出来**——从枪上打出的快速近战不算。所有官方标尺都是抽出状态"
  "only a melee weapon can be swung without being drawn, so this weapon is always the one in your hands": "只有近战武器可以不抽出就挥，所以这把武器永远是你手上那把"
  "the STANCE SLOT is not modelled: these four ground combos are Crushing Ruin's, transcribed from its published table, and equipping a different hammer stance would script them differently — the engine has no way to hear that yet, so a build on Shattering Storm or Fracturing Wind reads this one's numbers": 架势槽位尚未建模：这四套地面连段用的是「粉碎废墟」（Crushing Ruin）的公开数据，换成别的锤类架势会得到完全不同的连段脚本，而引擎目前听不到这件事——所以装「碎裂风暴」或「碎风」的配装读到的仍是这一套的数字
  "One attack input's animation length is unpublished: the wiki gives each combo's total at 1.0x attack speed, so totals are exact and inputs are split evenly. This shifts a status tick by fractions of a second and changes no total.": "单次攻击输入的动作长度没有公开：wiki 给出每套连段在 1.0x 攻速下的总时长，所以总时长精确，各次输入平均分配。这只会让异况跳伤的时间偏移零点几秒，不影响总量。"
  "Power Spike's partial combo decay is a Warframe passive and is not modelled: the counter drops to zero when its timer runs out, so with that passive the number reads low.": "Power Spike 的连击部分衰减是战甲被动，未建模：计时结束时计数直接归零，所以带这个被动时数字偏低。"
  "attack speed shortens this mode's whole cadence, and in game it should not: the 1.2s heavy wind-up is fixed and only the interval BETWEEN heavy attacks is shortened. The swing delay here is one number covering both, so an attack-speed build reads HIGH in this mode": 攻速在这里缩短了整个循环，而游戏里不该如此：1.2 秒的重击蓄力是固定的，被缩短的只是两次重击**之间**的间隔。此处的出手间隔是一个数字同时代表了这两者，所以攻速流派在这个模式下读数偏高
  "The climb is not timed: this loop takes the 150% radius of a slam dropped from 15 m and spends no time getting up there. A player who hops instead gets less radius, down to the 2.5 m / listed floor; this fight has no vertical axis to tell the two apart.": "爬升不计时间：这个循环吃的是从 15 米落下的 150% 半径，而爬上去不花时间。改成小跳的玩家半径更小，最低到 2.5 米或面板半径；本场没有垂直轴，分不出这两者。"
  "The shockwave's blasts go off with the slam that sends them; the page says the wave travels and times nothing (M110).": "冲击波的各次爆炸与触发它的捶地同时发生；页面说冲击波会向前推进，但没有给出任何时间 (M110)。"
  "The fan between a heavy slam's three shockwave lines is unpublished: 60 degrees edge to edge is assumed (M110).": "重击捶地三道冲击波之间的扇形角度未公开：此处假设两侧边缘相距 60 度 (M110)。"
  "Condition Overload does not apply to slams, heavy slams or radial attacks (the mod's own words), and this entry does not yet exempt it — a build carrying Condition Overload therefore reads HIGH in this mode": 异况超量不作用于捶地、重击捶地和径向攻击（MOD 卡面原话），而本条目尚未做这个豁免——所以带异况超量的配装在这个模式下读数偏高
  "{n} of {m} builds": "{n} / {m} 个配装"
  "{n} swings coming to {total}% of base, over {secs}s at 1.0x attack speed.": 共 {n} 击，合计基伤的 {total}%，在 1.0x 攻速下耗时 {secs} 秒。
