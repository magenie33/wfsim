  "Spring-Loaded Broadhead and the bow-exclusive Thunderbolt are outside the pools this roster loads — Thunderbolt in particular turns every bolt into a grenade, which is a whole second damage source": "「Spring-Loaded Broadhead」以及弓专属的「Thunderbolt」都不在本武器库载入的卡池里 —— 尤其是「Thunderbolt」，它把每一发弩箭变成一颗手雷，那是一整个第二伤害来源"
  "Spring-Loaded Broadhead, Amalgam Daikyu Target Acquired and the bow-exclusive Thunderbolt are outside the pools this roster loads": "「Spring-Loaded Broadhead」「Amalgam Daikyu Target Acquired」以及弓专属的「Thunderbolt」都不在本武器库载入的卡池里"
