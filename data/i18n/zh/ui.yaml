  "A HEADSHOT SPAWNS SIX HOMING SPORES that seek other enemies and explode in 3.3 metres each, and the headshot itself carries a further explosion (module: three more attacks). This engine carries one explosion per attack and has no shape for a hit spawning projectiles, so none of that is counted — against a headshot-heavy fight this weapon is understated several times over": "一次爆头会生成六颗自动索敌的孢子，它们会飞向其他敌人并各自在 3.3 米内爆炸，而那次爆头本身还带有一次额外爆炸（模块里另外三次攻击）。本引擎每次攻击只带一次爆炸，也没有「命中生成弹丸」这种形状，所以这些全都没有被计入 ——面对一场以爆头为主的战斗，这把武器被低估了好几倍"
  "A Status Effect has a 15% chance to SET the next hit's crit chance to 300% — ignoring every other crit bonus. Rolled per pellet.": 异常状态有 15% 几率把下一次命中的暴击率设定为 300%——无视其他一切暴击加成。逐弹丸判定。
  "A TOME'S MOD POOL IS ITS OWN and this roster does not load it — `mod_pools: []` here means the builder offers NOTHING, which is honest rather than offering pistol cards a Tome cannot wear. The weapon's numbers are right and no build can be put on it yet": "法典（Tome）有它自己的 MOD 池，而本武器库没有载入它 —— 这里的 `mod_pools: []` 意味着配装页什么都不提供，这比提供一堆法典装不了的手枪卡要诚实。这把武器的数值是对的，只是暂时还没法给它配 MOD"
  "A body that dies respawns where it stood, so the arrangement is the same at the end as at the start and the score is a rate rather than a race to the last body.": 死掉的目标在原地重生，所以阵型从头到尾一样，分数是一个速率而不是清空最后一个的竞速。
  "A donation supports this site's running costs and nothing else — it is not a purchase, and nothing on this site is for sale.":
    捐助仅用于本站的运营成本，除此以外没有别的用途——它不是一次购买，本站也没有任何东西在出售。
  "A desktop version is available for Windows and Linux.": "桌面版支持 Windows 和 Linux。"
  "A gauge bought with kills is worth what the fight lets you earn: against something that will not die, this mode is the base one.": 用击杀换来的充能条，值多少取决于这场战斗让你赚到多少 —— 面对一个打不死的目标，这个模式就等于基础模式。
  "A number. Nothing bought here moves a result by one decimal — an in-game measurement is the only thing that changes what the engine does.":
    一个数字。这里买到的东西不会让任何结果动一位小数——能改变引擎行为的只有游戏内实测，没有第二样。
  "A new version is available": "有新版本"
  "A run appears on the board within about 20 minutes, at most 40 — it is re-scored on a schedule, not the instant you send it.": 一次跑分大约 20 分钟内会出现在榜上，最多 40 分钟——榜单是按固定节奏重算的，不是你一提交就立刻更新。
  "A sentinel weapon scores the same on both boards. Its companion picks its own targets and never aims for a head, so neither term is the player's to set — and none of that weapon is your aim.": 守护型武器在两个榜上分数完全相同。它的守护自己选目标、从不瞄头，所以这两个条件都不归玩家管——这把武器里没有一分是你的瞄准。
