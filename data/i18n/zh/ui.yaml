  # THE PRODUCT NAME. The wordmark stays WFSim everywhere (logo, <title>, the
  # topbar) — it is a mark, not a word. Chinese PROSE calls it WF模拟
  # (user, 2026-07-31), which is why the disclaimer below reads WF模拟 while
  # the header above it still says WFSim.
  #
  # The hero is the one place in this app that makes a CLAIM rather than
  # stating a fact, and it stays a checkable one: "down to the last proc" and
  # "solved" are things the golden tests and the optimizer actually do.
  # DE's OWN word for the Simulacrum is 幻影装置 — every one of its arena
  # tiles is "<place>幻影装置" in the CN client (WFCD i18n, the DangerRoomTile
  # entries). 模拟厅 was the community's word, not the client's.
  #
  # The headline is a JOKE ONLY A PLAYER GETS, and that is its whole job: the
  # subtitle below it makes the claim, the weapon grid says what to do next,
  # and the title/meta carry the search terms. What nothing else on the page
  # does is show that whoever built this plays the game. "Prime" attaches to
  # the SIMULACRUM here — a thing that could plausibly have one — instead of
  # to the website, which is what made "The Primed One" read as a boast.
  "The real Simulacrum Prime.": 真正的幻影装置 Prime。
  # The claim leads with the NAME — a sentence that starts "WFSim is"
  # says whose claim it is; one that starts "The ultimate…" is a
  # category description with nobody behind it (user, 2026-07-31).
  #
  # One NOUN for what the whole thing is — a calculator — and the three
  # modules in apposition under it, named exactly as the page names them
  # (user, 2026-07-31). "fight simulator" and "Monte-Carlo optimizer"
  # described the implementation; a list of three parallel products
  # described no whole at all. The sub-features go unsaid: they are what
  # the three are made of, and naming them would only date the sentence.
  #
  # "Theorycrafting, solved." is a NOUN, a comma, and a verdict — two words,
  # clipped, final. "配装不靠猜，是算出来的" explained it instead of landing
  # it. 「理论配装，已解」keeps the shape: same noun-comma-verdict, same
  # length, and 已解 is what you write on a problem that is finished.
  "WFSim is the ultimate Warframe calculator — builder, simulator, optimizer. True to in-game numbers, down to the last proc. Theorycrafting, solved.": WF模拟是终极的 Warframe 计算器 —— 配装器、模拟器、优化器。与游戏内数值完全一致，精确到每一次触发。理论配装，已解。
  # Footer — legal text, so it says the same thing in both languages.
  "WFSim is an unofficial fan project, not affiliated with or endorsed by Digital Extremes. Warframe is a trademark of Digital Extremes Ltd.": WF模拟 是非官方粉丝项目，与 Digital Extremes 无从属关系，也未获其认可。Warframe 是 Digital Extremes Ltd. 的商标。
