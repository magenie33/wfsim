  # SPLICED: DE's Riven Splicer is 裂罅熔接器 and its description's verb is 拼接.
  "spliced": 拼接
  "spliced — at most one a card": "拼接词条 —— 每张卡最多一条"
  "A Riven Splicer's stat, made out of two rolled ones: always a bonus, at most one a card": 由裂罅熔接器把两条词条拼接成的属性：永远是正面词条，每张卡最多一条
