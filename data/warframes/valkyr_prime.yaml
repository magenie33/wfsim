# VALKYR PRIME, at rank 30. Armor, energy and sprint are `data/frames.yaml`'s.
id: valkyr_prime
name: Valkyr Prime
internal_name: /Lotus/Powersuits/Berserker/ValkyrPrime

# RANK 30. Module:Warframes/data carries rank 0 — `Health = 650`, `Shield = 135`,
# `ShieldRank30 = 185` — the same rank-0 block as Valkyr; the two differ in
# armor and energy (W`Valkyr/Prime`: "(175/225 vs. 100/150)").
health: 750
shield: 185

# `Polarities = { "Madurai", "Madurai", "Madurai" }`, positions unpublished.
polarities: [madurai, madurai, madurai]
aura_polarity: madurai

passive: "Valkyr accumulates Rage when hitting or killing enemies with melee weapons, increasing her Melee Damage up to 300%. Taking fatal damage when the Rage meter is above 150% consumes the meter, preventing death and granting 5s of invulnerability."
# "Taking fatal damage when the Rage meter is above 150% consumes the meter,
# preventing death and granting 5s of invulnerability."
passive_tags:
  - tag: invulnerable
    when: "on fatal damage with Rage above 150%, 5 s"
# see notes: valkyr_rage
rage:
  per_hit: 0.03
  per_kill: 0.12
  cap: 3.0
  idle_seconds: 5
  decay_rate: 0.016
  tail_per_second: 0.001
abilities: [rip_line, warcry, paralysis, hysteria]

source:
  url: https://wiki.warframe.com/w/Valkyr/Prime
