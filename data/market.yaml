# GENERATED by scripts/gen_market.py. Do not hand-edit: re-run the script.
#
# What warframe.market calls things we model, so a card can link to what it
# sells for. Slugs only — no price travels with them, because a price needs a
# refresh rule and a staleness rule and this file would then be a second
# source for a number the site already owns.
#
# AN ABSENT ENTRY IS NOT LISTED THERE, and that is the whole rule for whether
# a link is offered — there is no `tradeable` field anywhere in this repo. All
# four Amalgam cards and both Umbral ones are absent; so are the kitgun
# chambers, whose yaml carries no `internal_name` to join on.
#
# `riven_weapons` is keyed by our WEAPON ENTRY and valued by the FAMILY's
# auction slug, because that is what a riven fits: Braton Prime and its
# Incarnon form both point at `braton`.
#
# `riven_stats` keys are the stat ids in data/rivens/; the slugs are what
# `positive_stats` / `negative_stats` take on an auction search.

