# GENERATED by scripts/gen_market.py. Do not hand-edit: re-run the script.
#
# What warframe.market calls things we model, so a card can link to what it
# sells for. Slugs only — no price travels with them, because a price needs a
# refresh rule and a staleness rule and this file would then be a second
# source for a number the site already owns.
#
# AN ABSENT ENTRY IS NOT LISTED THERE, and that is the whole rule for whether
# a link is offered — there is no `tradeable` field anywhere in this repo. The
# Amalgam and Umbral cards are absent, so are the 250 weapons that only ever
# come off a blueprint, and so are the kitgun chambers, whose yaml carries no
# `internal_name` to join on.
#
# SOLD OR AUCTIONED, and the table says which. `mods`, `weapons` and `arcanes`
# are item pages. `lich_weapons` and `sister_weapons` are auctions, because the
# valence an adversary weapon came out of its Lich with is part of what is
# being traded — and the table a weapon is in is the `type=` its link needs.
#
# `riven_families` is keyed by our `riven_family` (a weapon with none is its
# own family), because that is what a riven fits: Braton Prime and its Incarnon
# form both reach `braton` through it. The engine walks a weapon to its family.
#
# `riven_stats` keys are the stat ids in data/rivens/; the slugs are what
# `positive_stats` / `negative_stats` take on an auction search.

