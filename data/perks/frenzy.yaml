# Trigger fires ONLY on true headshots -- not other weakspots (e.g. MOA
# backpacks), and not weakspots generated by Sonar / Detect Vulnerability in
# places other than the head. Headshots on corpses do NOT grant the buff.
trigger_notes:
  - Only real headshots; other weakspots (MOA backpack, Sonar/Detect Vulnerability non-head) do not count.
  - Headshots on corpses do not grant the buff.

