  - tag: invulnerable
    when: "during the dash, 1 s"
  # "Revenant still removes all status effects if doesn't pass through any enemy."
  - tag: status_cleanse
    when: "during the dash"

source:
  url: https://wiki.warframe.com/w/Reave
