id: reave
name: "Reave"
frame: revenant
slot: 3
energy_cost: 50
subsumable: true
augments: [blinding_reave]
internal_name: /Lotus/Powersuits/Revenant/Abilities/RevenantAfflictionAbility
icon: ReaveIcon(xWhite).png
description: "Dash through enemies as a wall of sentient energy, leeching shields and health from any encountered, enhanced for thralls."

# THE INFUSED VERSION, verbatim from the ability's own page (its `| helminth =`).
infused_notes:
  - "The UI's listed 40% damage is not applicable for non-Revenant frames and instead deals 8% damage."

tags:
