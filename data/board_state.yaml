# WHAT THE RUNTIME KNOWS ABOUT EACH BOARD — GENERATED by `wfsim-board`.
#
# THE ROWS ARE NOT HERE and must never be. `data/` is compiled into the binary,
# so a board archive under it put every row of every board into the wasm that
# every visitor downloads — 1.47 MB of a 6.36 MB module, to serve the handful of
# scalars below. The archive is `boards/*.yaml` at the repository root, read
# from DISK by the scorer that writes it and by the site build; nothing at
# runtime asks a board for a row, because the page fetches `board.json`.
#
# `submissions` paired with the library's own size (`/api/board/pending`) is how
# a STATIC board says how far behind it is. `listed` and `held` say how much of
# what it scored it is showing — a board that reports only what it shows cannot
# say how much it looked at.
boards:
  group_clear:
    submissions: 4254
    listed: 1029
    held: 0
  single_target:
    submissions: 4254
    listed: 1810
    held: 0
  single_target_no_aim:
    submissions: 4254
    listed: 1000
    held: 0
