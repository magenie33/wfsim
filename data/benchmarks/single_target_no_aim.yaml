# THE SECOND RULER — the same fight, played without aiming.
#
# `single_target.yaml` is the full definition and the reasoning behind every
# term; this file is that fight with ONE term changed, and it says only what is
# different. Read them together, not this one alone.
#
# WHY THIS ONE EXISTS. The first board resolves the headshot rate per weapon,
# which comes out at 100% for anything a player holds — every shot into the
# weak point, for three hundred seconds. That is a real skill ceiling and it is
# the right thing to rank, but it is not how most of a weapon's damage gets
# dealt, and it flatters exactly the weapons whose whole case is a weak-point
# multiplier. A ranking that only exists at the ceiling cannot tell you which
# gun to take when you are not playing at it.
#
# So this is the floor: nothing is aimed, no shot finds a head, and what is
# left is the weapon (owner, 2026-08-07).
#
# The two together are the interesting reading. A weapon that ranks high on
# both is strong; one that ranks high here and low there is being carried by
# something other than precision; the gap between a weapon's two positions is
# how much of it is aim.
#
# A THIRD AT 50% WAS CONSIDERED AND DROPPED (owner, same day): a middle number
# is not a way anyone plays, and a board whose terms nobody recognises is one
# nobody can argue with. Two boards that each mean something beat three where
# the middle one means "some of the time".
id: single_target_no_aim

name: "Single Target · No Aim · Thrax Centurion Lv 9999 SP · 180 s · KPM"

# Identical to the first board's, and deliberately so — the whole point is that
# only the aim differs, so a weapon's two rows are comparable.
rules:
  # MECHANICAL LANGUAGE, AND NO WEAPON IN IT (owner, 2026-08-17). A rule that
  # names a weapon is a rule that has to be edited when the roster grows, and
  # `benchmarks_data.rs` already refuses this file any weapon, mod, arcane or
  # evolution id. These lines are held to the same standard by hand: they say
  # what is done to EVERY entry, never what is done to one of them.
  - "The target is one Thrax Centurion at level 9999 on Steel Path. The fight lasts 180 seconds."
  - "One target, so nothing here rewards clearing a room."
  - "No shot is aimed and none lands on a weak point. The companion board aims every shot; between them they are the floor and the ceiling."
  - "The score is kills per minute, counting the fraction of the current target already gone. Removing 3% of one target in 180 seconds scores 0.03 and still ranks."
  - "Every main slot is filled, every evolution tier the entry has is taken, every arcane seat it has is filled. The Exilus slot is optional: a row may wear one and a row without one is not a lesser build, so the two sit on the same board and the better number wins."
  - "Investment is not ranked: every entry is scored at full Forma, at max rank, and at the maximum roll of any bonus a player can raise by farming duplicates."
  - "Ammo pickups are modelled. An entry that cannot be resupplied runs on its own reserve."
  - "An entry that can be played more than one way is ranked once per way, and the way it was played is part of the row."
  - "A buff starts the fight FULL only if it is permanent — no timer, and not spent by being used. Such a buff can be held for the whole engagement by anyone, so scoring it at anything less would rank how long ago the entrant last topped it up. Every other buff starts at zero and is earned in the fight. Two buffs in the data qualify today."
  - "Nobody submits a number. A submission is a BUILD, and its score is computed here by this engine under the pinned seed above, so any row can be reproduced exactly by anyone with the repo."

build:
  mods: full
  evolutions: full
  arcanes: full
  exilus: optional
  # The element is the entrant's, the roll is scored at its maximum — the aimed
  # ruler carries the argument in full.
  valence: full

scenario:
  enemy: thrax_centurion
  level: 9999
  steel_path: true

  # POINT BLANK, and the SAME value as the aimed board's — see
  # `single_target.yaml` for the argument. These two boards differ in two terms
  # and a third unnamed difference between them would be a bug, not a ruler.
  player_at: [0, 0]
  target_at: [0, 0.4]
  duration: 180
  runs: 1000
  seed: 12648430
  metric: kpm
  infinite_ammo: true

  # THE TWO CHANGED TERMS, and they are two because "not aiming" and "hitting
  # no heads" are different claims that both have to hold (owner, 2026-08-07).
  #
  # `headshot_pct` — `single_target.yaml` OMITS it and lets it resolve per
  # weapon; here it is pinned to zero for everyone.
  #
  # A SENTINEL WEAPON SCORES IDENTICALLY ON BOTH BOARDS, and that is correct
  # rather than a gap. Its companion picks its own targets and never aims for a
  # head, so the first board already resolves it to 0 — this term describes the
  # PLAYER's aim, and a sentinel does not have one. Two identical rows are the
  # honest answer to "how much of this weapon is your aim": none of it.
  headshot_pct: 0

  # AND NO INCARNON, for every weapon but one — which falls out of the term
  # above rather than being written here. Eight of the nine Incarnon forms
  # charge their gauge on WEAK-POINT hits (`charge_on: weakpoint_hits`), so at
  # zero they never fill it and the weapon is fired in its base form for the
  # whole engagement. The Torid charges on DIRECT hits and keeps cycling. That
  # is the game's own rule and the sim already obeys it — measured here:
  # transforms 0 for the Laetum and Boar Prime at this headshot rate, 4 for the
  # Torid.

  # NOT AIMING. The stance, which is a separate fact from where the shots land:
  # a player can hip-fire into a head and can aim down sights at a body. This
  # board is the one where neither is happening, so the mods that read the
  # stance — Argon Scope, Galvanized Crosshairs, Hydraulic Crosshairs, the
  # Scope family's "while Aiming" crit — are all switched off with it.
  #
  # A SENTINEL IS EXEMPT and stays aiming: `tenno_from` forces it true for a
  # companion weapon, because the stance is the player's and the companion does
  # not share it. Its two rows therefore stay identical, for the same reason
  # they do above.
  #
  # THE NEUTRAL PLAYER IS THE WORST FRAME AT EVERYTHING, the same rule the
  # aimed ruler states and for the same reason (owner, 2026-08-13): nobody knows
  # which frame a reader runs, and some weapons get stronger in specific hands
  # purely through the frame's stats, so the board gives the weapon the least
  # help any frame could. Every field the parser reads is named here, including
  # the ones already sitting at that value — `wf_sprint` above all, since the
  # Latron family's Swift Punishment pays only at 1.2 or higher.
  aiming: false
  invisible: false
  airborne: false
  overshields: false
  channeling: false
  solo_weapon: false
  # THE WIELDER IS THE FLOOR, named rather than zeroed (owner, 2026-08-26).
  # These were `wf_armor: 0` / `wf_energy: 0`, which is not "no override" but an
  # override that says nothing — and 0 armor is a Warframe that does not exist.
  # `data/tenno/default.yaml` is the worst max-rank frame there is, stat by
  # stat, so pinning THOSE numbers is what this block's own rule asks for and
  # what makes the board's player the one every frame beats.
  #
  # IT MOVES NO SCORE, which is why it is a correction rather than a rescore:
  # the only armor thresholds in the data are 450 (Fortress Salvo) and 1,000
  # (Primary Bulwark), and 105 reaches neither. Energy was already 0 — four
  # frames have no pool — and sprint was already the floor.
  wf_health: 250
  wf_armor: 105
  wf_energy: 0
  wf_sprint: 0.9
  # THE ONE FIELD THAT DIFFERS FROM THE AIMED RULER WITHOUT BEING ONE OF THE TWO
  # DECLARED TERMS. It reaches nothing while `wf_energy` is 0 — the only reader
  # is a `tenno_scaled` arcane, whose grant is a fraction of a pool that is
  # empty — so no score depends on it either way today. Recorded rather than
  # quietly unified: which of 0 and 1.0 the two boards should share is a change
  # to a ruler's terms, and that is the owner's call.
  wf_energy_pct: 0
  # THE FIGHT'S OWN STAT BONUSES — empty, and stated for the same reason every
  # field above is: a ruler names what it has an opinion about, and it has one
  # here. A board row is a statement about the WEAPON, so the fight hands it
  # nothing its build did not earn.
  extra_stats: {}
  # NO `frame`, for the same reason as above.
