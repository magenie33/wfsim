# THE OFFICIAL MULTI-TARGET SCENARIO — the second ruler, and the first that is
# about a ROOM rather than a target.
#
# `standard_single_target` measures the shot; this measures what the shot
# REACHES. They are companions rather than a replacement, which is why every
# ruler's name leads with its own engagement: the two stand beside each other
# without either one having to explain itself.
#
# STANDARD, because the target is the standard one. Both rulers hold the enemy
# fixed and vary how many of it there are; a ruler that changes the TARGET is
# not a standard and does not carry the prefix (`demolisher`).
#
# WHY THIS FILE MENTIONS NO WEAPON, AND MAY NOT. Same rule as every ruler and
# the same reason: it has to hold for a roster it has never seen, and
# `board/benchmarks.rs` refuses it any weapon, mod, arcane or evolution id.
id: standard_multi_target

name: "Standard Multi Target · 5x5 at 3 m · Thrax Centurion {scene} · {shooting} · 180 s · KPM"

# WHAT "STANDARD" MEANS: one set of conditions every build is measured under,
# stated as a definition. The target half is its companion's; the spacing is
# this ruler's own.
standard: "Standard means one set of conditions for every build: a crowd of tough, unaffiliated targets, packed as close as every elemental area effect still reaches and no larger than holds them whole, the same fight and the same rules, so a number reproduces on any machine and any two builds compare directly. Your own conditions are set in the simulator."

rules:
  - "The target is a formation of 25 Thrax Centurions {scene}, a 5 by 5 grid spaced 3 metres centre to centre: the smallest odd square that holds every elemental area effect around the aimed body whole, a fully grown 6 m Gas cloud included. The fight lasts 180 seconds."
  - "A weapon's own explosion wider than about 6 m, and punch-through past five bodies, are clipped by the grid on purpose: a deeper column would rank the formation rather than the weapon."
  - "The spacing decides whether splash or single-target damage wins: 3 m is where that ordering matches play, and it is the widest whole metre at which Electricity still reaches a neighbour."
  - "The target is a Thrax Centurion because a build that beats it transfers: it belongs to no faction, so no faction mod and no faction bonus reads on it; it carries Overguard, which most Warframe abilities cannot take off, so the weapon has to; it is armoured and tanky; it is immune to no element, so every proc lands; its weak points are the ordinary ones, 3x on the head and 1x elsewhere."
  - "The shooter stands at contact with the middle body of the front rank, and fires along the line that rank faces."
  - "{shooting} A weapon's forced targeting and stance still apply."
  - "Direct hits, including punch-through hits, use the selected headshot rate. A chain hop and a damage cloud cannot be a weak point hit. A Blast detonation carries the weak-point and critical multipliers of the hit that applied the stack (MEASUREMENTS M54)."
  - "The score is kills per minute across the whole formation, counting the fraction of each target already gone."
  - "A body that dies respawns where it stood, so the arrangement is the same at the end as at the start and the score is a rate rather than a race to the last body."
  - "The grid is stated as three numbers rather than as 25 positions, so its terms can be read and argued with."
  - "Every main slot is filled, every evolution tier the entry has is taken, every arcane seat it has is filled. The Exilus slot is optional: a row may wear one and a row without one is not a lesser build, so the two sit on the same board and the better number wins."
  - "The stance slot is optional too, and it is not a discount but a GRANT: a stance hands the weapon 10 mod capacity on a matching polarity, 5 on a bare slot and 4 on the wrong colour. A row without one is not a lesser build; it is a build that spent the capacity elsewhere."
  - "Investment is not ranked: every entry is scored at full Forma, at max rank, and at the maximum roll of any bonus a player can raise by farming duplicates."
  - "The reserve is not spent: every entry fires as if it were being resupplied, so nothing here ranks ammo economy. An entry that cannot be resupplied at all runs on its own reserve."
  - "The melee weapon is DRAWN, not quick-melee: a card that says \"With Melee Weapon Equipped\" pays here. A build swung out of a gun is a different fight and the simulator has a switch for it; the ruler does not."
  - "An entry that can be played more than one way is ranked once per way, and the way it was played is part of the row."
  - "A buff starts the fight FULL only if it is permanent — no timer, and not spent by being used. Such a buff can be held for the whole fight by anyone, so scoring it at anything less would rank how long ago the entrant last topped it up. Every other buff starts at zero and is earned in the fight. Two buffs in the data qualify today."
  - "Nobody submits a number. A submission is a BUILD, and its score is computed here by this engine under the pinned seed above, so any row can be reproduced exactly by anyone with the repo."

build:
  mods: full
  evolutions: full
  arcanes: full
  exilus: optional
  valence: full

ladder: [scene, shooting]
scenario:
  enemy: thrax_centurion
  level: 9999
  steel_path: true

  # THE PHYSICAL FORM ALONE. A Thrax's death has a second half — the spectre
  # only the Operator can empty (data/enemies/thrax_centurion.yaml) — and this
  # board's answer is that it does not happen: every row ever scored here is a
  # fight the physical form ends. Ticked, no weapon could finish a single kill,
  # which is a statement about the Operator rather than about the weapon.
  # Written down rather than left to the default, for the reason every field in
  # this block is: a default that moved later would move the board with it.
  spectral_form: false

  # THE SHOOTER AT CONTACT WITH THE MIDDLE OF THE FRONT RANK. 0.5 m is twice
  # the 0.25 m body radius (`space::CONTACT_RANGE_M`) — as close as two circles
  # go, and the same distance the single-target ruler pins.
  #
  # IT IS THE FLOOR `parse_fight` ENFORCES, which is why it may not be smaller:
  # a target inside contact is pushed out to it, so a ruler naming a shorter
  # distance would have the aimed body standing 0.1 m in FRONT of the rank the
  # grid lays around it — a front rank whose middle body is not in it.
  player_at: [0, 0]
  target_at: [0, 0.5]

  # THE CROWD, IN THREE NUMBERS. `formation_grid` lays the rank centred on the
  # aimed body and every other rank one spacing further along the shot's line,
  # then expands into the ordinary `formation` list — so nothing downstream
  # knows this was a shorthand.
  #
  # 5 x 5 = 25 BODIES: the smallest odd square that holds every elemental area
  # effect centred on the aimed body WHOLE. Reach is radius + BODY_RADIUS_M,
  # centre to centre: Electricity (3 m) and a Blast proc (5 m) fit a 3x3, a
  # fully grown Gas cloud (6 m) reaches the bodies 6 m to either side and needs 5.
  #
  # WHAT IT CLIPS, on purpose: a weapon's own explosion wider than ~6 m, and
  # punch-through past five bodies. A column's depth IS a punch-through weapon's
  # score — exactly N on an NxN — so a deeper grid ranks the arena, not the
  # weapon. docs/BOARD.md §"The multi-target ruler" carries the measurement.
  #
  # 3 m SPACING, and it is the single most consequential number in this file. It decides the whole splash-versus-single-target
  # ordering, because a 5 m Blast sphere holds `pi * 25 / spacing^2` bodies —
  # 35 at 1.5 m, 13 at 2.5 m, 5 at 4 m. Measured on the Larkspur Prime with one
  # build per element and everything else pinned:
  #
  #   spacing | in 5 m | Blast KPM | Heat KPM | winner
  #   1.5 m   |   35   |   305.9   |   64.5   | Blast
  #   2.5 m   |   13   |   112.0   |   71.9   | Blast
  #   4.0 m   |    5   |    41.1   |   62.1   | Heat
  #   6.0 m   |    2   |     4.3   |   58.5   | Heat
  #
  # HEAT IS FLAT — it is a DoT on ONE body and does not care how close the
  # crowd stands — while Blast swings 71x across that range. So the spacing was
  # not a detail of the arrangement; it was the answer.
  #
  # 1.5 m WAS CHOSEN FOR A DIFFERENT QUESTION and it answered that one well: it
  # is the only spacing tested that separates all three steps of a radius mod
  # (ordinary Firestorm / Primed / neither seed 6 / 9 / 13 bodies at 1.5 m, and
  # the two Firestorms are indistinguishable at 2 m). That is a real cost of
  # this change and it is paid on purpose: a ruler that can rank a radius mod's
  # steps but ranks the wrong ELEMENT is measuring the wrong thing. The owner
  # played the same fight at level 200 and Heat killed visibly faster than
  # Blast, which is what 1.5 m could not reproduce and 3-4 m does.
  #
  # WHY 3 AND NOT 4: it is the near edge of the band where the two cross over
  # (between 2.5 m and 4 m), so it keeps a crowd that is genuinely a crowd —
  # bodies are 0.25 m in radius, so 3 m leaves 2.5 m of gap — while no longer
  # handing a 5 m sphere three dozen targets. A number in the crossover band is
  # a choice; that it must be in the band is not.
  formation_grid:
    cols: 5
    rows: 5
    spacing_m: 3.0

  # NO `aim_at`: the weapon points at the body it is in contact with, which is
  # what an absent aim point means. A ruler that aimed at bare floor would be
  # measuring a technique rather than a weapon.

  duration: 180
  runs: 1000
  seed: 12648430
  metric: kpm
  infinite_ammo: true
  headshot_pct: 100

  # THE TENNO — the neutral player of data/tenno/default.yaml, field for field
  # the same as the single-target ruler's. A multi-target board differs from it
  # in the FORMATION and in nothing else, which is the whole point of having two
  # rulers: any gap between a weapon's two ranks is what the crowd is worth to
  # it, and a second difference would make that unreadable.
  aiming: true
  invisible: false
  airborne: false
  sliding: false
  aim_gliding: false
  overshields: false
  channeling: false
  melee_equipped: true
  solo_weapon: false
  # THE WIELDER IS NOT NAMED HERE, and that is the exception this block states
  # rather than hides. Every other field is pinned so the
  # board cannot move when a default moves — but the wielder's five numbers are
  # pinned by a TEST now (`the_default_tenno_is_the_floor_of_every_released_frame`
  # asserts all five, naming the frame each floor belongs to), so the drift this
  # block guards against is already impossible.
  #
  # What pinning them cost was the reader: the fight's Warframe fields are
  # OVERRIDES with a tick, and a ruler that names its floor makes every tick
  # arrive CHECKED — so a first-time visitor, who lands on a ruler, sees four
  # boxes claiming to override something with the value it already had.
  # Unticked is the honest default: nothing overridden, the floor in use.
  wf_energy_pct: 1.0
  extra_stats: {}
