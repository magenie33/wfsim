# THE OFFICIAL TEST SCENARIO — one ruler, every weapon.
#
# A benchmark exists so a number has a meaning. "120k DPS" says nothing on its
# own; "0.87 KPM on single_target" is a reading anyone can reproduce, on
# their own machine, with the same engine that produced it.
#
# WHY THIS FILE MENTIONS NO WEAPON, AND MAY NOT.
#
# It has to hold for the whole roster — seven weapons today, hundreds later —
# and the only way a definition stays correct across a roster it has never seen
# is to never speak about a member of it. Everything here is either a property
# of the FIGHT (which enemy, how long, what is measured) or a POLICY the engine
# already resolves per weapon:
#
#   form: default        -> the Incarnon cycle where a weapon has one, its own
#                           arsenal default where it does not
#   headshot_pct         -> OMITTED. Resolved per weapon: 0 for a sentinel
#                           weapon (it aims itself and never at the head),
#                           100 otherwise. Writing 100 here would put a
#                           sentinel on the board at a headshot rate it can
#                           never achieve.
#   buffs                -> OMITTED, which is not "no opinion" but the app's
#                           own rule (docs/BUFFS.md): a buff opens full only if
#                           it is neither timed nor consumable, everything else
#                           starts at 0 and is earned in the fight. That rule
#                           reads the `permanent` flag on each buff CARD, so it
#                           is per-buff data and identical on every weapon.
#
# `benchmarks_data.rs` enforces the rule mechanically: this file may not
# contain any weapon, mod, arcane or evolution id, nor a named weapon form.
# Adding weapon 201 therefore cannot require editing this file — it has no
# place to say anything wrong about it.
id: single_target

# The name states the whole definition, because a benchmark whose terms are
# hidden in a tooltip is one nobody can argue with. Order is deliberate: what
# distinguishes it from a future second ruler comes FIRST (single target, as
# against a group-clear benchmark), then the target, then the two measurement
# terms. Truncation therefore eats the least identifying part.
name: "Single Target · Thrax Centurion Lv 9999 SP · 180 s · KPM"

# NO VERSION NUMBER (owner, 2026-08-04). There is one board, it is regenerated
# whole whenever this file or the engine changes, and what is deployed is always
# the current answer — so a version marks a distinction nobody can act on. The
# history of what this file said is git's, which is where a history belongs.
#
# Changing a parameter here therefore does not retire anything: every stored
# build is re-scored under the new terms and keeps competing. That is what
# storing BUILDS rather than scores was for.
# WHAT COUNTS AS AN ENTRANT (owner, 2026-08-05). A benchmark owns the fight;
# it owns its admission rule for the same reason — both are terms of the claim
# a published number makes, and a reader should find the whole standard in one
# file rather than half of it in the validator.
#
# The idea is the weapon at its best effort ("这个武器的最努力配置"), and
# "full" is computed PER WEAPON: eight main slots for everything, but the
# evolution tiers this weapon actually has (Laetum 5, Boar Prime 4, an ordinary
# rifle 0) and the arcane seats it actually has (an Arch-Gun 2, a sentinel
# weapon 0). So a weapon with nothing to fill is complete by having filled it.
#
# DELIBERATELY SMALL. A second benchmark may want a weapon class, or a required
# mod, or an element ban — and every one of those is a field to add WHEN that
# benchmark exists. Inventing a constraint language for a set of one is how the
# vocabulary comes out wrong at exactly the moment it first matters.
# THE RULES IN PROSE, for the page that publishes them. The name above states
# the same standard in one line so a rank stays quotable; this is it at length.
rules:
  - "One Thrax Centurion at level 9999 on Steel Path, for 180 seconds. A single target, so nothing here rewards clearing a room."
  - "Aimed, with every shot on the weak point. This is the ceiling a weapon reaches in skilled hands — the companion board removes the aim and measures the floor."
  - "Scored in kills per minute, counting the fraction of the current target already gone. A weapon that removes 3% of one Thrax in 180 seconds scores 0.03 and still has a rank."
  - "Every main slot filled, every evolution tier the weapon has, every arcane seat it has. Exilus is never counted."
  - "Ammo pickups are modelled, because a real player is being resupplied over three minutes. A weapon that cannot be resupplied runs on its real reserve."
  - "How the weapon is PLAYED belongs to the entry, not to this ruler: a weapon with an Incarnon form is ranked twice, once through its cycle and once never transmuting."
  - "Nobody submits a number. A submission is a BUILD, and its score is computed here by this engine under the pinned seed above — so any row can be reproduced exactly by anyone with the repo."

build:
  mods: full          # every main slot
  evolutions: full    # every tier this weapon has
  arcanes: full       # every seat this weapon has
  exilus: excluded    # never counted, and stripped before it travels

scenario:
  # A single Corrupted-faction target at the top of the level range, Steel
  # Path. Chosen because it is the fight the roster is already calibrated
  # against, not because it is the only fight worth having — a second ruler
  # (group clear) is expected to exist alongside this one rather than replace
  # it, which is why "single target" is the first thing the name says.
  enemy: thrax_centurion
  level: 9999
  steel_path: true

  # 180 SECONDS (owner, 2026-08-10, down from 300). Load-bearing rather than a
  # round number, and the argument cuts BOTH ways — which is why it moved rather
  # than being picked once and left.
  #
  # THE CASE FOR TIME is unchanged, and it is why this is not 30 seconds: the
  # mechanics that decide a build are the ones that need it. Heat's armour strip
  # ramps in 0.5 s steps, the Galvanized family earns its stacks from kills,
  # every timed buff starts at zero and is earned back in-fight. A run too short
  # to let those arrive does not measure the same build more cheaply — it
  # measures a different build.
  #
  # THE CASE AGAINST FIVE MINUTES is that it stops pricing the ramp and starts
  # paying for it twice ("5分钟会让这个build过于强大而且很反直觉"). Everything
  # that compounds — stacking buffs, an Incarnon cycle that has to be charged,
  # armour that is already stripped — amortises its whole setup over a window
  # long enough that the setup stops counting, and the ranking drifts away from
  # what a player recognises. Three minutes is still long enough for every ramp
  # above to arrive and short enough that arriving is still worth something.
  #
  # CHANGING IT RETIRES NOTHING. There is no version number here on purpose:
  # every stored build is re-scored under the new terms and keeps competing,
  # which is what storing BUILDS rather than scores was for.
  duration: 180

  # Monte-Carlo runs per build. This is the PRECISION knob and the whole cost
  # of recomputing the board (builds x runs), so it belongs to the benchmark
  # and not to whoever submits.
  #
  # 1000 (owner, 2026-08-11), up from 100. A board row is a PUBLIC CLAIM that
  # gets re-scored rather than re-measured, so its noise floor is the one number
  # here that nobody can improve by trying harder — and the cheapest way to
  # spend more is the one the board can afford: the cost is paid once per
  # rescore, not per player and not per search.
  runs: 1000

  # PINNED, so the claim is reproducible rather than merely stable. The engine
  # already defaults to a fixed seed, which is why two runs of one build agree
  # to the last digit — but a default is not a term of a public claim, and this
  # number is one. Anyone can re-run a board row on their own machine and get
  # the same figure, which is the whole difference between a leaderboard and a
  # rumour. (1000 runs averaged makes tuning to the seed pointless.)
  seed: 12648430

  # Kill progress, not DPS. `score` is kills PLUS the depleted fraction of the
  # current target's pool, so it stays continuous all the way down: a weapon
  # that takes 180 s to remove 3% of one Thrax scores 0.03 and still has a
  # rank. That is what lets one ruler cover a roster whose weakest members
  # cannot finish a single kill — a discrete kill count would collapse the
  # bottom of the board into an untellable pile of zeros.
  metric: kpm

  # AMMO PICKUPS ARE MODELLED, which is what this setting means. The sim has no
  # pickup entities, so ignoring the reserve is how it stands in for them — and
  # on a three-minute engagement with kills happening, a real player IS being
  # resupplied. Starving every weapon would measure who brought the biggest
  # magazine rather than who kills fastest.
  #
  # It does NOT hand ammo to a weapon that cannot receive any. A ground Arch-Gun
  # is "removed and can only be called down again after a 5-minute cooldown"
  # once its 400 rounds are gone, and `reserve_is_infinite` reads the weapon's
  # `no_resupply` before this setting — so its 400 rounds are the whole
  # engagement whatever this says (owner, 2026-08-04: "翠雀 Prime archgun 的
  # benchmark 测试，全部都是要求 ammo 有限的情况的").
  #
  # Measured, unmodded, on this fight: 0.0436 with the reserve ignored against
  # 0.0139 with it — a 3.1x overstatement, which is most of what an Arch-Gun's
  # balance IS. Boar Prime scores identically either way, because it resupplies.
  #
  # The MAGAZINE is modelled under both: reload cadence and `ammo_cost` bite
  # regardless. This is the reserve behind it.
  infinite_ammo: true

  # AIMED, AND EVERY SHOT ON THE WEAK POINT. Both pinned rather than left to
  # resolve, because they are terms of the claim this board makes and a reader
  # should find them here rather than in a default (owner, 2026-08-07).
  #
  # `aiming` is the STANCE, which gates mods like Argon Scope; `headshot_pct`
  # is where the shots land. They are different facts and a board that means
  # "played at the ceiling" has to say both.
  #
  # A SENTINEL WEAPON IS EXEMPT from both and scores the same here as on the
  # no-aim board: its companion picks its own targets and never aims for a
  # head, so `parse_fight` pins its rate at 0 and `tenno_from` its stance —
  # neither is the player's to set. Two identical rows are the honest answer.
  headshot_pct: 100

  # NO FORM, AND NO MODE. How a weapon is played is part of the ENTRANT, not
  # of the fight — a Torid through its Incarnon cycle and a Torid that never
  # transmutes are two rows on this board, and a ruler that pinned one of them
  # could only ever rank that one. Each submission names its own mode and the
  # scorer translates it at the boundary (`WeaponPlayMode::form`).
  #
  # `form: default` used to sit here and it read as neutral. It was not: it
  # resolved to the cycle on a weapon that has one and to the arsenal form on a
  # weapon that does not, so the board silently ranked Incarnon weapons at their
  # ceiling and had no way to ask for anything else (owner, 2026-08-07).

  # THE TENNO, pinned rather than defaulted. Two arcanes read Warframe armor
  # and energy directly (Primary Bulwark, Primary Overcharge) and several mods
  # are gated on what the player is DOING, so leaving these to a default would
  # make "the same test" depend on where the defaults happened to sit.
  # These are the NEUTRAL player of data/tenno/default.yaml: aiming, no frame
  # chosen, no ability running, feet on the ground.
  aiming: true
  invisible: false
  airborne: false
  wf_armor: 0
  wf_energy: 0
