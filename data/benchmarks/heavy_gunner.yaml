# THE THRAX SINGLE-TARGET RULER WITH ONE TERM MOVED: THE TARGET.
#
# Every other scenario key is `standard_single_target.yaml`'s, value for value,
# and `webapi` holds that with a test — so read that file for why each one is
# what it is. This one says only what it changes and why.
#
# THE TARGET is the Eximus Corrupted Heavy Gunner: it spawns in Void Fissures,
# it is the toughest Orokin unit, and it is one of the targets players most
# often test builds on. It is OROKIN, so faction mods and faction bonuses read
# on it, and nothing in `build:` restricts a mod for that.
id: heavy_gunner

name: "Heavy Gunner · one target · Eximus Corrupted Heavy Gunner {scene} · {shooting} · 180 s · KPM"

standard: "One specific fight players run, measured as it is rather than as a stand-in for most play: the Eximus Corrupted Heavy Gunner of the Void Fissures, taken apart by one weapon."

rules:
  - "The target is one Eximus Corrupted Heavy Gunner {scene}. The fight lasts 180 seconds."
  - "The target is a Corrupted Heavy Gunner because it spawns in Void Fissures, it is the toughest Orokin unit, and it is one of the targets players most often test builds on. It is Orokin, so faction mods and faction bonuses read on it, and it takes Puncture and Viral at 1.5x and Radiation at 0.5x. As an Eximus it carries Overguard in front of a health pool three and a half times an ordinary Heavy Gunner's; it is armoured; its weak points are 3x on the head and 1x elsewhere."
  - "Which Eximus it is changes nothing here: no Eximus aura is applied, and no type that shields itself from weapons is used."
  - "One target: damage that reaches other enemies counts for nothing here."
  - "{shooting} A weapon's forced targeting and stance still apply."
  - "The score is kills per minute, counting the fraction of the current target already gone. Removing 3% of one Heavy Gunner in 180 seconds scores 0.03 and still ranks."
  - "Every main slot is filled, every evolution tier the entry has is taken, every arcane seat it has is filled. The Exilus slot is optional: a row may wear one and a row without one is not a lesser build, so the two sit on the same board and the better number wins."
  - "The stance slot is optional too, and it is not a discount but a GRANT: a stance hands the weapon 10 mod capacity on a matching polarity, 5 on a bare slot and 4 on the wrong colour. A row without one is not a lesser build; it is a build that spent the capacity elsewhere."
  - "Investment is not ranked: every entry is scored at full Forma, at max rank, and at the maximum roll of any bonus a player can raise by farming duplicates."
  - "The reserve is not spent: every entry fires as if it were being resupplied, so nothing here ranks ammo economy. An entry that cannot be resupplied at all runs on its own reserve."
  - "The melee weapon is DRAWN, not quick-melee: a card that says \"With Melee Weapon Equipped\" pays here. A build swung out of a gun is a different fight and the simulator has a switch for it; the ruler does not."
  - "An entry that can be played more than one way is ranked once per way, and the way it was played is part of the row."
  - "A buff starts the fight FULL only if it is permanent — no timer, and not spent by being used. Such a buff can be held for the whole fight by anyone, so scoring it at anything less would rank how long ago the entrant last topped it up. Every other buff starts at zero and is earned in the fight. Two buffs in the data qualify today."
  - "Nobody submits a number. A submission is a BUILD, and its score is computed here by this engine under the pinned seed above, so any row can be reproduced exactly by anyone with the repo."

build:
  mods: full
  evolutions: full
  arcanes: full
  exilus: optional
  valence: full

ladder: [scene, shooting]
scenario:
  enemy: corrupted_heavy_gunner
  # STATED, not left to the default — which is the same answer today
  # (`parse_fight` defaults Eximus on wherever the unit has one).
  eximus: true
  level: 9999
  steel_path: true
  spectral_form: false
  player_at: [0, 0]
  target_at: [0, 0.5]
  duration: 180
  runs: 1000
  seed: 12648430
  metric: kpm
  infinite_ammo: true
  headshot_pct: 100
  aiming: true
  invisible: false
  airborne: false
  sliding: false
  aim_gliding: false
  overshields: false
  channeling: false
  melee_equipped: true
  solo_weapon: false
  wf_energy_pct: 1.0
  extra_stats: {}

source:
  url: https://wiki.warframe.com/w/Corrupted_Heavy_Gunner
