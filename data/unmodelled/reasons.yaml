# WHY A NUMBER IS NOT THERE — the reasons, once each.
#
# A weapon's `unmodeled:` as free prose is 116 distinct sentences across 248
# uses with thirteen families of near-duplicates in them: sixteen spellings of
# the damage-falloff line that
# differed only in three numbers, ten of the punch-through line that differed
# in one. Every new spelling cost a new Chinese translation, so the overlay grew
# with the roster rather than with the ideas in it.
#
# A reason is written ONCE here and referenced with its parameters:
#
#   unmodeled:
#     - reason: innate_punch_through
#       m: 1.2
#
# `text:` is the ENGLISH, and it is the source like every other string in this
# repo. A locale translates the TEMPLATE — one entry in `ui.yaml` per reason
# instead of one per rendered sentence — and the client substitutes the same
# {named} holes into it.
#
# PROSE IS STILL ALLOWED, and 61 admissions still are. A gap that happens once
# and needs a paragraph should be a paragraph; this file is for the ones that
# repeat. A reason earns its place by being used more than twice OR by having
# more than one numeric spelling.
reasons:
  client_secondary_other_behavior:
    text: "Native alternative behavior declarations are bound as evidence; their runtime availability and complete attack sequences are not simulated. Only the declared entry modes are used."
  client_secondary_charge_packet:
    text: "Charge time and the selected projectile use parsed inputs. The native charge-cap multiplier consumer is unverified; damage uses the declared packet without multiplying it by that cap."
  client_secondary_clip_charge:
    text: "The full-magazine attack retains its fixed unmodded damage and recharge cycle; native clip-dependent scaling, explosion damage/status and alternate-fire recharge consumers are unverified."
  client_secondary_return_ammo:
    text: "Returning-projectile ammunition keeps its declared resource convention; the native reserve field does not establish a finite pickup-based ammo pool."
  client_secondary_orb_packet:
    text: "Orb strikes and the final explosion retain their measured damage. Native launch packets, chain attenuation, target selection, meter and animation consumers are unverified; their raw values do not replace the deployed orb sequence."
  client_secondary_blob:
    text: "Attached damage, fuse and explosion use separate native components. Unspecified base status, tick initialization, stack overflow and bounce consumers retain the declared measured or approximated rules."
  client_secondary_reload_grenade:
    text: "Reload grenade packets, count and fan use parsed inputs. Release, flight and impact clocks and Critical Mutation group ordering remain unmodelled; the declared mid-reload impact approximation remains in use."
  client_secondary_toggle_reload:
    text: "The alternate-fire state's short timer belongs to its toggle action; magazine reload uses the parsed primary-fire state. Toggle recovery and snare callback timing remain unmodelled."
  client_beam_trace_punch:
    text: "The native beam trace declares punch-through, but its target-selection consumer is unverified; the declared target-limited beam behavior remains in use."
  client_ammo_runtime:
    text: "The parsed fire packet's zero ammo requirement does not establish the state or script's resource debit; the declared ammo convention remains in use."
  client_forced_reload:
    text: "The native state requests a reload after every throw; its zero-ammo forced reload is not simulated, so this entry retains its declared cycle approximation."
  client_falloff_runtime:
    text: "The parsed falloff floor exceeds the direct packet's base damage; that falloff consumer is unverified and the declared falloff convention remains in use."
  client_radial_critical:
    text: "Radial critical statistics retain the published rule; the native radial packet's critical-upgrade consumer is unverified."
  client_composite_attack:
    text: "This attack uses the published beacon or orb component; native launch-packet statistics do not establish the scripted damage sequence."
  client_special_spread:
    text: "Bound 3D projectile forms apply their declared fan or charge endpoints. Custom beam patterns and unselected firing variants use the declared approximation."
  client_projectile_callbacks:
    text: "Native projectile callbacks are bound as evidence; unverified callback timing, scaling and secondary effects are not simulated."

  client_melee_special:
    text: "Special attack components retain their declared sequence and modifier rules where the native selector, intrinsic multiplier or callback consumer is unverified. Bound raw packets do not establish the complete attack."
  client_scourge_primary_collision:
    text: "Primary fire uses ray collision; the native projectile's collision width is not simulated."
  client_scourge_field:
    text: "Bullet Attractor applies a CO status via spatial pulses in 3D and on the aimed target in the planar scene. Bullet redirection and floor attachment remain uncalibrated."
  client_scourge_throw:
    text: "The throw's projectile selection is unverified. Flight is straight, and multishot uses separate damage instances."
  client_scourge_primary_co:
    text: "Primary-fire Condition Overload uses the catalog's additive rule; its conflict with the weapon page's multiplicative claim is unresolved."
  blob_over_cap:
    text: "Unmeasured: a shot already over the cap (multishot over {cap}) is read as holding the pile at {cap} and waiting 1.5 s, refreshed by each later shot, so steady fire never sets it off."
  blob_crossing_cap:
    text: "Unmeasured: a shot that crosses the cap is read as setting the pile off at once for {cap} stacks, the rest lost."
  spread_not_transcribed:
    text: "This attack's spread is not in the data, so none of its shots miss. At range the number is the ceiling; at point blank it is unaffected."
  spectral_dagger_orbit_and_target_assumed:
    text: "Unpublished: how long a spectral dagger orbits before it seeks (the Incarnon Form card uses a stand-in), and which enemy it seeks (here, the nearest within 15 m). Both decide how soon a kill pays; neither is measured."
  dual_daggers_heavy_unmeasured:
    text: "The heavy attack is 2x, from this weapon's infobox; the wiki's class table and stance module say 5x. Unmeasured."
  orb_bounces_off_walls:
    text: "The orb bounces off walls and the floor, and there are neither here: it drifts on at {speed} m/s, leaves a standing target behind after about three seconds, lands {open_field} of its {total} strikes and detonates out of reach. In a room it stays near its target, worth about {worth} more damage. Every number for this form reads low."
  cluster_bomblet_co:
    text: "The bomblets take no Condition Overload: the wiki's catalog gives them a rule of their own ({row}), and the engine sets the rule per weapon. They read low by that term only."
  bounce_headshot_assumed:
    text: "Assumed: a bounce lands on a weak point 50% of the time. It can headshot (wiki), but where it lands depends on geometry the sim does not model, and no rate is published."
  client_latron_rebound:
    text: "Rebounds use stationary posed surfaces in 3D. Corpse transitions, lifetime resets after impacts and wall geometry remain uncalibrated. The planar scene resolves the first contact."
  melee_attack_unmodelled:
    text: "Not modelled: {attacks}. Of this weapon's attacks, only the swing, the slam and the heavy slam are."
  glaive_throw_tennokai_unmodelled:
    text: "Tennokai on a throw is not modelled as the game has it: the window pauses while the glaive flies and only a detonation spends it."
  glaive_throw_animosity_unmodelled:
    text: "Melee Animosity counts a throw as a heavy attack that pays its bonus and spends no stack; here a throw is a light input."
  gunblade_heavy_is_a_shot:
    text: "A gunblade's heavy attack fires, which is not modelled, so there is no heavy mode and a Tennokai window converts nothing."
  gunblade_light_shots_unmodelled:
    text: "Gunblade shooting within light stance combos is not modelled. Its separate heavy-shot mode uses the ranged attack's own profile."
  gunblade_heavy_package_limits:
    text: "Heavy charge and shot multipliers use the package, which disagrees with the wiki's wind-up and some damage totals. Only the first GunbladeGunshot marker in each action emits a shot; the second marker's handler behavior is uncalibrated."
  gunblade_sarpa_burst_limits:
    text: "Sarpa's burst uses five rounds 0.05 s apart, with the package's 3x shot multiplier and 1.25x physical modifier. The wiki's heavy totals disagree. Attack-speed scaling inside the burst is not calibrated."
  gunblade_stropha_geometry:
    text: "The shockwave applies its client two-endpoint distance falloff and wave expansion parameters; animated melee contact and terrain obstacle interactions are not calibrated in game."
  wolf_sledge_throw_limits:
    text: "The second target's seeking and all return-flight strikes are not modelled. Flight uses the package's 50 m/s. The 0.75 s charge and nominal 1 s animation use attack speed; exact hold, release, catch timing and the bare-stance wind-up exception are not calibrated. Nearby ragdoll effects are not modelled."
  melee_heavy_is_special:
    text: "This weapon's heavy attack is {what}, which is not modelled, so there is no heavy mode and a Tennokai window converts nothing."
  special_heavy_profile_limits:
    text: "This weapon has a separate heavy-attack profile. Its timing, geometry and unsupported components are disclosed on that heavy mode."
  ceramic_dagger_projectile_timing:
    text: "In Incarnon Form, each standing or Tennokai heavy input emits two spectral daggers at its first physical sweep marker. Their exact release times, spread and maximum flight range are unmeasured. Projectile base-damage exclusions follow the wiki's live-bug rules and are not calibrated in game. Spectral projectiles on heavy slams are not modelled."
  melee_passive_unmodelled:
    text: "Not modelled: {passive}."
  melee_own_combo_unmodelled:
    text: "The wiki gives this weapon combos of its own ({combos}), which replace the stance's and are not transcribed; the stance's (or its class's) are used instead."
  melee_heavy_total_disputed:
    text: "The heavy attack is the infobox's {infobox}x; the class's heavy table implies {table}x. Unmeasured."
  melee_incarnon_unmodelled:
    text: "Its Incarnon evolutions and Incarnon Form are not modelled."
  melee_incarnon_slam_arms_unmodelled:
    text: "A plain slam at the arming combo also activates its Incarnon Form; here only a heavy attack does, so a loop that slams without a heavy arms it later than in a mission, or never."
  steflos_projectile_lifetime:
    text: "Projectile lifetime and growth are not modelled: the base lifetime is 0.6 s, each enemy hit adds 50% lifetime up to 10 s, and the projectile grows in size. The simulation uses a fixed 2 m width and does not stop the projectile when its lifetime expires."
  corufell_projectile_timing:
    text: "Both heavy inputs use the package's GunbladeGunshot release event and animation. The package charge is 2 s, conflicting with the wiki's 1.3 s; the Prime's innate factor divides it by 1.5. Charge and motion timing are not calibrated in game."
  corufell_projectile_width:
    text: "The heavy projectile is wide, but its width and maximum flight range are unpublished. It is simulated as a ray with infinite body punch through and no maximum range."
  corufell_light_tennokai:
    text: "The sliding heavy attack that swings the scythe is not modelled. Tennokai uses the ranged heavy's own damage and delivery."
