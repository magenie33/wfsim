# WHY A NUMBER IS NOT THERE — the reasons, once each.
#
# A weapon's `unmodeled:` used to be free prose, and an audit on 2026-08-15
# counted 116 distinct sentences across 248 uses with thirteen families of
# near-duplicates in them: sixteen spellings of the damage-falloff line that
# differed only in three numbers, ten of the punch-through line that differed
# in one. Every new spelling cost a new Chinese translation, so the overlay grew
# with the roster rather than with the ideas in it.
#
# A reason is written ONCE here and referenced with its parameters:
#
#   unmodeled:
#     - reason: innate_punch_through
#       m: 1.2
#
# `text:` is the ENGLISH, and it is the source like every other string in this
# repo. A locale translates the TEMPLATE — one entry in `ui.yaml` per reason
# instead of one per rendered sentence — and the client substitutes the same
# {named} holes into it.
#
# PROSE IS STILL ALLOWED, and 61 admissions still are. A gap that happens once
# and needs a paragraph should be a paragraph; this file is for the ones that
# repeat. A reason earns its place by being used more than twice OR by having
# more than one numeric spelling.
reasons:
  arch_gun_deployer_cooldown:
    text: "the Arch-Gun Deployer's five-minute cooldown is not modelled — when the reserve runs dry the weapon is gone for the rest of a real mission, and this arena simply stops firing"
  companion_fires_it:
    text: "the companion FIRES THIS WEAPON, not the player — it picks its own targets, fires when it decides to, and stops while the companion is reviving or out of range; this arena fires it continuously at one target, which is the ceiling rather than the average"
  zoom_steps:
    text: "the LOWER zoom levels are not modelled — this arena has no field of view to trade for magnification, so the scope always sits at its top level and its best buff"
  damage_falloff:
    text: "damage falloff from {start} m to {end} m (down to {keep}% of full damage) is not modelled — this arena has no distance, so every shot lands at point blank"
  innate_punch_through:
    text: "the innate {m} m punch-through is not modelled — this arena has one target, so it changes no number"
  sniper_combo_miss:
    text: "a MISSED shot does not drop the combo counter here — this arena has no distance and every shot lands, so the counter only ever decays through its {seconds} s timer, which runs slightly generous"
  radial_falloff:
    text: "the explosion's falloff is not modelled — this arena has one target at the centre, so it always takes the full {full} and never the {rim} at the rim"
  auto_spool_ramp:
    text: "the AUTO-SPOOL ramp is not modelled — the page gives this trigger as Auto-Spool and the fire rate here is the spooled-up {rate}/s from the first shot, so a short burst is faster in this sim than in game"
  beam_range:
    text: "the {m} m range is not modelled — this arena has no distance, so every tick lands"
  reload_never_interrupted:
    text: "this run never INTERRUPTS a reload — in game you can fire mid-reload and keep the shells already loaded, and a player who does is trading stacks and a full magazine for uptime. Decided rather than missing (2026-08-10): a listed reload is a whole reload, and the alternative is not a more accurate model, it is a different player"
  spool_rebuilds_after_reload:
    text: "the spool rebuilds after every reload: the page says burst firing MAINTAINS it, so a player whose pauses are short enough keeps more of the listed rate than this sim does — here the only pauses are the reloads the weapon forces. The spool itself IS modelled"
