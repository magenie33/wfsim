# WHY A NUMBER IS NOT THERE — the reasons, once each.
#
# A weapon's `unmodeled:` used to be free prose, and an audit on 2026-08-15
# counted 116 distinct sentences across 248 uses with thirteen families of
# near-duplicates in them: sixteen spellings of the damage-falloff line that
# differed only in three numbers, ten of the punch-through line that differed
# in one. Every new spelling cost a new Chinese translation, so the overlay grew
# with the roster rather than with the ideas in it.
#
# A reason is written ONCE here and referenced with its parameters:
#
#   unmodeled:
#     - reason: innate_punch_through
#       m: 1.2
#
# `text:` is the ENGLISH, and it is the source like every other string in this
# repo. A locale translates the TEMPLATE — one entry in `ui.yaml` per reason
# instead of one per rendered sentence — and the client substitutes the same
# {named} holes into it.
#
# PROSE IS STILL ALLOWED, and 61 admissions still are. A gap that happens once
# and needs a paragraph should be a paragraph; this file is for the ones that
# repeat. A reason earns its place by being used more than twice OR by having
# more than one numeric spelling.
reasons:
  arch_gun_deployer_cooldown:
    text: "the Arch-Gun Deployer's five-minute cooldown is not modelled — when the reserve runs dry the weapon is gone for the rest of a real mission, and this arena simply stops firing"
  companion_fires_it:
    text: "the companion FIRES THIS WEAPON, not the player — it picks its own targets, fires when it decides to, and stops while the companion is reviving or out of range; this arena fires it continuously at one target, which is the ceiling rather than the average"
  zoom_steps:
    text: "the LOWER zoom levels are not modelled — this arena has no field of view to trade for magnification, so the scope always sits at its top level and its best buff"
  # NO `damage_falloff` — IT IS MODELLED (2026-08-15). The arena has a range
  # now (`engine::space`), the direct hit takes its published window, and the
  # twenty-three weapons that carried this line say nothing because there is
  # nothing left to admit. Kept as a note rather than silently deleted: this
  # file is where a reader looks to find out whether a gap is still a gap.
  spread_not_transcribed:
    text: "this attack's SPREAD is not in the data, so none of its shots can miss — the wiki's weapon module publishes a cone for it and the intake could not identify which of that weapon's attacks this entry is, so it took nothing rather than the wrong one. At a range every pellet lands here, which is the ceiling; at point blank it costs nothing, because nothing misses there anyway"
  # NO `innate_punch_through` — IT IS MODELLED (2026-08-17). `punch_through_m`
  # sat in all 224 entries unread for as long as the arena held one body; a
  # formation is what gave it something to reach, and `space::struck_along`
  # spends it at `space::BODY_MATERIAL_M` per body crossed. The 22 weapons that
  # carried this admission carry none now.
  sniper_combo_miss:
    text: "a MISSED shot drops the combo counter and this entry cannot miss — the only thing that misses here is SPREAD, and this one lands on the reticle, so nothing but its {seconds} s timer ever takes a stack off. A player who pulls the shot loses the combo and this sim never pulls one"
  # NO `radial_falloff` — IT IS MODELLED (2026-08-15). The explosion reads the
  # distance from its own epicentre, which is where the projectile actually
  # landed, so a pellet that missed detonates beside the target and the target
  # takes the rim. An entry that cannot miss (accuracy 100, or an accuracy
  # nobody has transcribed) still sits at the epicentre, which is the weapon
  # being accurate rather than the model being short.
  # TWO WEAPONS ON THE DAY IT WAS WRITTEN (Kuva Seer, Kuva Chakkhurr) and a
  # third the moment another explosive Kuva lands, which is what makes it a
  # reason rather than a sentence.
  explosion_ignores_cover:
    text: "the blast needs no line of sight and goes through walls — this arena has no geometry, so nothing is ever behind cover and the perk pays nothing extra"
  # A MODE THAT IS NOT A CHOICE. Some weapons switch form by AIMING rather than
  # by a trigger, and this engine's mode is a build axis while `aiming` is the
  # fight's own flag — so the two can be set to a pair the game cannot produce.
  mode_is_the_aim_state:
    text: "this mode is entered by AIMING rather than by a trigger, and the simulator treats the mode and the fight's Aiming state as two separate settings — so a run with this mode and Aiming off is a combination the game cannot produce, and every while-aiming bonus should be read as active whenever this mode is"
  # SELF-STAGGER, which every modern AoE weapon carries and none of them can
  # suffer here — the wielder is not a body in this arena.
  self_stagger:
    text: "the blast staggers the WIELDER in game — this arena gives the player no body, so a build that would be unplayable in a corridor costs nothing here"
  # A SECOND EXPLOSION FROM ONE SHOT. An attack carries ONE `radial:`, and the
  # cluster weapons throw bomblets that explode again — so their contribution
  # is stated here rather than modelled. Two on the day it was written (Kuva
  # Bramma, Kuva Zarr) and the shape is shared by the Kulstar family.
  cluster_bomblets:
    text: "the shot also throws {n} bomblets that explode again for {damage} between them, and this engine gives an attack ONE explosion — so everything below is the main blast alone and this weapon is understated by roughly {share} of its damage. The wiki's Condition Overload catalog gives those bomblets a rule of their own (their CO term reads the PARENT projectile's damage), which consequently does not apply here either"
  auto_spool_ramp:
    text: "the AUTO-SPOOL ramp is not modelled — the page gives this trigger as Auto-Spool and the fire rate here is the spooled-up {rate}/s from the first shot, so a short burst is faster in this sim than in game"
  # THE RICOCHET ITSELF IS MODELLED (2026-08-18) — `ricochet:` on the three
  # Latron Incarnon entries, five bounces each dealing the collision and the
  # explosion in full. This is what is LEFT of it: the page says enemies *and
  # terrain*, and this arena has no walls.
  # TWO ASSUMPTIONS IN THE BOUNCE MODEL, both on the page rather than only in a
  # comment, because a player deciding whether to trust this weapon's number
  # cannot read a yaml (2026-08-21).
  bounce_headshot_assumed:
    text: "how often a bounce lands on a weak point is ASSUMED — a flat 50%. It can headshot (the wiki's Hit Mechanic page counts a rebound as a main hit), but where it lands is geometry this arena does not model and DE publishes no rate"
  ricochet_terrain:
    text: "a bounce here reflects off ENEMIES only — in game a wall or the floor is a surface too, so with cover this number is a FLOOR"
  reload_never_interrupted:
    text: "this run never INTERRUPTS a reload — in game you can fire mid-reload and keep the shells already loaded, and a player who does is trading stacks and a full magazine for uptime. Decided rather than missing (2026-08-10): a listed reload is a whole reload, and the alternative is not a more accurate model, it is a different player"
  # THREE USES ON THE DAY IT WAS WRITTEN (Tenet Envoy, Tenet Diplos, Tenet
  # Ferrox) and three different percentages, which is both halves of what earns
  # a reason its place.
  holstered_reload:
    text: "it reloads {pct}% of its magazine a second while HOLSTERED or deployed, which is free ammunition bought by putting the weapon away — this arena never holsters it, so the reload here is always the full one"
  # SILENCE. Six weapons in the roster are silent and each said so in its own
  # words; the sentence carries no numbers at all, which is what makes it a
  # reason rather than prose.
  # THE BOLT FAMILY'S OWN TRICK, on five weapons and counting (both Akboltos,
  # the Telos, both Gremlins) — the sentence carries no numbers, which is what
  # earns it a template rather than five spellings.
  bolt_corpse_ragdoll:
    text: "ON KILL THE BODY FOLLOWS THE BOLT, damaging anyone in its path and pinning the corpse to walls (wiki). It is a second damage source that only exists once something has died, and this engine has no ragdoll and no wall for it to pin against — so a bolt weapon fighting a crowd is understated by however much that corpse would have hit on the way past"
  # THREE WEAPONS AND THREE DIFFERENT RELOAD TIMES (both Veloxes, the Zhuge
  # Prime) — one sentence with one number in it, which is exactly the shape a
  # reason exists for.
  empty_reload_is_faster:
    text: "it 'reloads 50% faster from a fully depleted magazine' (wiki), and this engine carries ONE reload time per weapon. This sim holds the trigger until the magazine is dry, which is exactly the case that reload applies to — so the {seconds} s here is the SLOW reload for a fight that would always earn the fast one, and the weapon is understated"
  silent_weapon:
    text: "this weapon is SILENT and this arena has nobody to alert — stealth is worth nothing here and a great deal in a real mission"
  spool_rebuilds_after_reload:
    text: "the spool rebuilds after every reload: the page says burst firing MAINTAINS it, so a player whose pauses are short enough keeps more of the listed rate than this sim does — here the only pauses are the reloads the weapon forces. The spool itself IS modelled"
