# WHY A NUMBER IS NOT THERE — the reasons, once each.
#
# A weapon's `unmodeled:` used to be free prose, and an audit on 2026-08-15
# counted 116 distinct sentences across 248 uses with thirteen families of
# near-duplicates in them: sixteen spellings of the damage-falloff line that
# differed only in three numbers, ten of the punch-through line that differed
# in one. Every new spelling cost a new Chinese translation, so the overlay grew
# with the roster rather than with the ideas in it.
#
# A reason is written ONCE here and referenced with its parameters:
#
#   unmodeled:
#     - reason: innate_punch_through
#       m: 1.2
#
# `text:` is the ENGLISH, and it is the source like every other string in this
# repo. A locale translates the TEMPLATE — one entry in `ui.yaml` per reason
# instead of one per rendered sentence — and the client substitutes the same
# {named} holes into it.
#
# PROSE IS STILL ALLOWED, and 61 admissions still are. A gap that happens once
# and needs a paragraph should be a paragraph; this file is for the ones that
# repeat. A reason earns its place by being used more than twice OR by having
# more than one numeric spelling.
reasons:
  arch_gun_deployer_cooldown:
    text: "the Arch-Gun Deployer's five-minute cooldown is not modelled — when the reserve runs dry the weapon is gone for the rest of a real mission, and this arena simply stops firing"
  companion_fires_it:
    text: "the companion FIRES THIS WEAPON, not the player — it picks its own targets, fires when it decides to, and stops while the companion is reviving or out of range; this arena fires it continuously at one target, which is the ceiling rather than the average"
  zoom_steps:
    text: "the LOWER zoom levels are not modelled — this arena has no field of view to trade for magnification, so the scope always sits at its top level and its best buff"
  # NO `damage_falloff` — IT IS MODELLED (2026-08-15). The arena has a range
  # now (`engine::space`), the direct hit takes its published window, and the
  # twenty-three weapons that carried this line say nothing because there is
  # nothing left to admit. Kept as a note rather than silently deleted: this
  # file is where a reader looks to find out whether a gap is still a gap.
  spread_not_transcribed:
    text: "this attack's SPREAD is not in the data, so none of its shots can miss — the wiki's weapon module publishes a cone for it and the intake could not identify which of that weapon's attacks this entry is, so it took nothing rather than the wrong one. At a range every pellet lands here, which is the ceiling; at point blank it costs nothing, because nothing misses there anyway"
  # NO `innate_punch_through` — IT IS MODELLED (2026-08-17). `punch_through_m`
  # sat in all 224 entries unread for as long as the arena held one body; a
  # formation is what gave it something to reach, and `space::struck_along`
  # spends it at `space::BODY_MATERIAL_M` per body crossed. The 22 weapons that
  # carried this admission carry none now.
  sniper_combo_miss:
    text: "a MISSED shot drops the combo counter and this entry cannot miss — the only thing that misses here is SPREAD, and this one lands on the reticle, so nothing but its {seconds} s timer ever takes a stack off. A player who pulls the shot loses the combo and this sim never pulls one"
  # NO `radial_falloff` — IT IS MODELLED (2026-08-15). The explosion reads the
  # distance from its own epicentre, which is where the projectile actually
  # landed, so a pellet that missed detonates beside the target and the target
  # takes the rim. An entry that cannot miss (accuracy 100, or an accuracy
  # nobody has transcribed) still sits at the epicentre, which is the weapon
  # being accurate rather than the model being short.
  auto_spool_ramp:
    text: "the AUTO-SPOOL ramp is not modelled — the page gives this trigger as Auto-Spool and the fire rate here is the spooled-up {rate}/s from the first shot, so a short burst is faster in this sim than in game"
  beam_range:
    text: "the {m} m range is not modelled — the fight has a distance now, but a beam still reaches whatever it is aimed at, so a target standing past the beam's end takes damage here that it would not take in game"
  # THE RICOCHET IS THE LATRONS', all three of them, and the reason it is
  # still a gap CHANGED on 2026-08-17. It read "a single-target arena has
  # nowhere for the bounces to go", which was true and is not: the arena
  # holds a formation, and chaining, punch-through and blasts all reach
  # across it. What is missing now is the BOUNCE ITSELF — where a deflected
  # projectile goes — and that is work rather than an edge.
  ricochet:
    text: "the projectile's other {n} RICOCHETS are not modelled — it bounces off enemies and terrain, and every bounce deals its collision damage again and explodes again. Only the first collision and its own explosion are counted here, so this number is a FLOOR: in a crowd, or anywhere with a wall behind the target, the weapon is worth more"
  reload_never_interrupted:
    text: "this run never INTERRUPTS a reload — in game you can fire mid-reload and keep the shells already loaded, and a player who does is trading stacks and a full magazine for uptime. Decided rather than missing (2026-08-10): a listed reload is a whole reload, and the alternative is not a more accurate model, it is a different player"
  spool_rebuilds_after_reload:
    text: "the spool rebuilds after every reload: the page says burst firing MAINTAINS it, so a player whose pauses are short enough keeps more of the listed rate than this sim does — here the only pauses are the reloads the weapon forces. The spool itself IS modelled"
