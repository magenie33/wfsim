# WARFRAMES — the wielder, as the three numbers a weapon perk can ask about.
#
# The Tenno has always been in the model (data/tenno/default.yaml) and it was a
# PLACEHOLDER: no armor, no energy, sprint at 0.9, the slowest a frame has. So
# every "With Sprint Speed 1.2 or Higher" / "With Armor Over 450" / "With Energy
# Max Over 700" perk paid nothing, and the panel had no way to say otherwise —
# there was not even a sprint field on it.
#
# SOURCE: DE's own export (`vendor/warframe-items` Warframes.json), which
# carries the RANK 0 stat block. Checked against the wiki infobox on two frames
# — Ash (455/270/105/100/1.15) and Inaros Prime (2215/0/240/140/1.05) — and it
# is rank 0 on both, digit for digit.
#
# WHICH IS WHY ONLY THREE FIELDS ARE HERE. Rank 30 moves them differently:
#
#   armor   +0     rank-invariant, so the export's number IS the maxed one
#   sprint  +0     likewise
#   energy  +50    on both frames checked — and NOT on a frame with no pool
#
# THE +50 IS NOT UNIVERSAL, and generalising it from two samples wrote a number
# into five entries that no frame has. Hildryn, Hildryn Prime, Lavos, Lavos Prime and Helminth
# have NO energy pool — their abilities are paid for out of shields or with
# cooldowns — so 0 + 50 made up 50 for each of them. The wiki's own infobox is
# unambiguous: "Energy 0 (0 at Rank 30)", and its data block carries
# `"EnergyRank30": 0`.
#
# …WHICH ALSO MEANS THE DERIVATION WAS NEVER NECESSARY. That infobox states the
# rank-30 value PER FRAME (`EnergyRank30`, `ShieldRank30`, and health as
# "180 (280 at Rank 30)"), so the day this file is regenerated it should read
# those rather than apply a rule — and the "health cannot be derived" paragraph
# below stops being true at the same moment.
#   health  +100 on Ash, +200 on Inaros Prime — per-frame, not derivable
#   shield  +100 on Ash, +0 on Inaros Prime (which has none)
#
# Health and shield are therefore NOT carried. Nothing reads them today, and a
# number that cannot be derived is worse than a missing one: it would look like
# a frame's real health and be wrong by a hundred. They get sourced properly the
# day something needs them.
#
# THAT DAY HAS COME FOR HEALTH. The Basmu's Dreadful Killshot pays
# "+20% Damage and Status Chance for every 75 Warframe Health, capped at 360%",
# so health stopped being a number nothing reads. `wf_health` is typed on the
# fight now and the panel states the resolved player — but PICKING A FRAME
# still cannot fill it, and this file is why.
#
# What it costs to close: the rank-30 value per frame, from the wiki infobox,
# because the export carries rank 0 and the bonus is per-frame (+100 on Ash,
# +200 on Inaros Prime). Carrying the rank-0 number instead would be the exact
# mistake the paragraph above refuses — it would read as the frame's health and
# be a hundred to two hundred short, on a mod that pays per 75 of it.
#
# NOT MODDED, and it decides whether a gate is reachable at all. Vitality, Steel
# Fiber, Primed Flow and the Umbral set are not here:
#   - `armor > 450` — 9 frames reach it unmodded (Valkyr Prime tops out at 1000)
#   - `sprint >= 1.2` — 19 frames
#   - `energy > 700` — NONE. The highest maxed pool in the game is 300, so that
#     gate cannot open on any frame, modded or not, and the two Paladin Virtue
#     perks pay nothing until the number is typed over by hand. The panel still
#     allows that, which is why the override was kept rather than replaced.
#
# NAMES ARE NOT TRANSLATED, and that is DE's doing: the Chinese client keeps
# every Warframe name in English (WFCD i18n agrees on all 121), the same reason
# the ability cards print the frame in English.
