# Amber Archon Shard — an ARCHON SHARD, one of five sockets on a Warframe.
#
# A SHARD IS A PICK, not a mod: the socket holds ONE of the effects below, and a
# TAUFORGED shard of the same colour grants the larger number ("50% higher stat
# bonuses"). So a Warframe carries up to five (colour, effect, tauforged) picks.
#
# It rides on the fight's Tenno for the same reason an aura does — it is the
# WARFRAME's, not the weapon's.
#
# EVERY EFFECT IS LISTED, including the ones this simulator cannot pay. A shard
# that is absent reads as a shard that does nothing, and the reader cannot tell
# that from one that was never transcribed.
id: amber_archon_shard
name: Amber Archon Shard
colour: amber

effects:
  - id: energy_on_spawn
    text: "Maximum Energy filled on Spawn"
    kind: out_of_scope
    applies_to: energy economy
    value: 0.3
    unit: pct
    tauforged: 0.45
  - id: health_orbs
    text: "Effectiveness on Health Orbs"
    kind: out_of_scope
    applies_to: pickups
    value: 1
    unit: pct
    tauforged: 1.5
  - id: energy_orbs
    text: "Effectiveness on Energy Orbs"
    kind: out_of_scope
    applies_to: pickups
    value: 0.5
    unit: pct
    tauforged: 0.75
  - id: casting_speed
    text: "Casting Speed"
    kind: out_of_scope
    applies_to: the Warframe layer
    value: 0.25
    unit: pct
    tauforged: 0.375
  - id: parkour_velocity
    text: "Parkour Velocity"
    kind: out_of_scope
    applies_to: movement
    value: 0.15
    unit: pct
    tauforged: 0.225

source:
  url: https://wiki.warframe.com/w/Archon_Shard
