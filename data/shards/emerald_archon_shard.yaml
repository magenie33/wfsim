# Emerald Archon Shard — an ARCHON SHARD, one of five sockets on a Warframe.
#
# A SHARD IS A PICK, not a mod: the socket holds ONE of the effects below, and a
# TAUFORGED shard of the same colour grants the larger number ("50% higher stat
# bonuses"). So a Warframe carries up to five (colour, effect, tauforged) picks.
#
# It rides on the fight's Tenno for the same reason an aura does — it is the
# WARFRAME's, not the weapon's.
#
# EVERY EFFECT IS LISTED, including the ones this simulator cannot pay. A shard
# that is absent reads as a shard that does nothing, and the reader cannot tell
# that from one that was never transcribed.
id: emerald_archon_shard
name: Emerald Archon Shard
colour: emerald

effects:
  - id: toxin_status_damage
    text: "Toxin Status Effects deal more damage"
    kind: status_damage_of_type
    applies_to: toxin
    value: 0.3
    unit: pct
    tauforged: 0.45
  - id: toxin_health_steal
    text: "Health recovered per Toxin Status tick"
    kind: out_of_scope
    applies_to: nobody shoots back
    value: 2
    unit: flat
    tauforged: 3
  - id: corrosion_ability_damage
    text: "Ability Damage on Corrosion-affected enemies"
    kind: ability_damage
    value: 0.1
    unit: pct
    tauforged: 0.15
  - id: corrosion_stack_cap
    text: "Increase max stacks of Corrosion Status"
    kind: status_stack_cap
    applies_to: corrosion
    value: 2
    unit: flat
    tauforged: 3

source:
  url: https://wiki.warframe.com/w/Archon_Shard
