# A WARFRAME ABILITY BUFF — the fight's PLAYER, not the build.
#
# see notes: mod_arcane_weapon_perk
#
# see notes: early_access_said_page

# IT DOES NOT COMBINE, and that is the point of it. The
# wiki: "Adds Electricity damage to weapon attacks. This damage bonus does
# not combine with other elements, and is additive with elemental mods."
#
# Both halves matter and they pull opposite ways. "additive with elemental mods"
# SIZES it — a percentage of ModifiedBase, exactly as Stormbringer is — and
# "does not combine" PLACES it: on the finished vector, after the hierarchy has
# run, so a weapon whose mods make Radiation ends up dealing Radiation AND pure
# Electricity rather than more Radiation.

id: shock_trooper
name: Shock Trooper
frame: Volt
# see notes: which_buffs_replace_each
family: shock_trooper
helminth: false

# see notes: at_max_rank_100
value: 1
# see notes: max_rank_at_100
duration_seconds: 40

effect:
  kind: add_element
  element: electricity

source:
  url: https://wiki.warframe.com/w/Shock_Trooper
