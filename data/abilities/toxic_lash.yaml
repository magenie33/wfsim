# see notes: warframe_ability_buff_not_a_build

# AN EXTRA HIT (docs/EXTRA_HIT.md), and the wiki says so in as many words:
# "Toxic Lash adds an extra Toxin attack that scales with weapon damage, before
# health and armor resistances. This damage buff is applied as an Extra Hit."
#
# So everything about how it behaves is the category's, not this file's — the
# faction bonus twice, crit inherited and never rolled, the `f³` on the status
# it leaves. The body part lands ONCE, inside the hit it copies: its own
# instance is a forced 1x weak point, and no Blast detonation fires it — both
# are Xata's Whisper's alone (wiki `Extra_Hit`).
#
# "before health and armor resistances" is worth reading twice: it is not a
# separate rule, it is what being a damage INSTANCE means. It lands through
# `TargetState::apply` like any other and meets armor there.

# 30% FOR GUNS. The card's "this effect is doubled for Melee Strikes" is the
# melee half and this simulator has no melee — the per-rank ladder for weapons
# is 20 / 24 / 26 / 30, and only the last of those is a number a calculator is
# asked for.

# ITS STATUS IS A CERTAINTY, not a roll: the ability's own stat block reads
# "100% (Toxin status chance)". That is the difference from Xata's Whisper,
# whose extra hit rolls the weapon's own chance — and it is why `forced_status`
# is a field of the category rather than a property of one member.

id: toxic_lash
name: Toxic Lash
frame: Saryn
# see notes: which_buffs_replace_each
family: toxic_lash
helminth: false

# At MAX RANK and 100% Ability Strength.
value: 0.30
# Max rank at 100% Ability Duration, in seconds.
duration_seconds: 45

effect:
  kind: extra_hit
  element: toxin
  forced_status: true

unmodelled:
  - "The card doubles this on melee strikes; the sim fires guns, so only the gun half applies."
  - "Contagion Cloud, its augment, leaves a damaging cloud where an enemy dies. It needs a corpse and a second target, so it is not counted; against a crowd the number reads low."

source:
  url: https://wiki.warframe.com/w/Toxic_Lash
