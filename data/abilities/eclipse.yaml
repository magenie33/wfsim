# ITS OWN MULTIPLIER, and the difference from Roar is the whole reason both are
# offered: "The damage buff is an unique multiplier" (wiki) — it multiplies
# against the base-damage bucket rather than joining a bracket.
#
# AND IT DOES NOT DOUBLE-DIP: "The buff affects both initial and status effect
# damage. Unlike faction damage, which double dips for status effects, the one
# from Eclipse is applied once." That sentence is the reason the effect kinds
# are two rather than one.
#
# The LIGHT half only (Solar Eclipse). The shadow half is damage REDUCTION on
# the player, which a weapon-damage sim has nowhere to put.

