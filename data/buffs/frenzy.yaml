schema_version: 0
id: frenzy
name: Frenzy
kind: buff
default_scope: weapon

duration_seconds: 3
refreshable: true
stacking: false
max_stacks: 1

modifiers:
  # x2.5 is an INDEPENDENT multiplier (wiki "+150%") applied AFTER any equipped
  # fire-rate mods/bonuses, i.e. base x (1 + sum fire_rate_mods) x 2.5 -- its own
  # multiplicative bucket, not the additive fire-rate-mod bucket.
  fire_rate_multiplier: 2.5
  # +100% ammo efficiency => infinite ammo: shots_per_ammo = 1/(1-e).
  ammo_efficiency_bonus: 1.0
  recoil_multiplier: -0.75
  # +100% Toxin behaves like a Toxin mod, ADDITIVE with elemental mods and
  # appended at the END of the mod order, so it participates in elemental
  # combination as the last mod (see interaction_notes).
  injected_element:
    type: toxin
    amount_percent_of_base: 1.0
    position: end_of_mod_order

# Behavior details (source: wiki):
interaction_notes:
  - Fire-rate x2.5 stacks multiplicatively AFTER equipped fire-rate mods/bonuses.
  - The +100% Toxin is additive with elemental mods and combines with them, e.g. a Heat mod (Heated Charge/Scorch) makes it deal Gas while the buff is active.
  - If the weapon already produces a combined element such as Corrosive, the bonus Toxin is added to that element's damage.
  - Triggering or expiring makes a noise that alerts nearby enemies; this noise cannot be reduced by Suppress or Hushed Invisibility.
  - Triggering with the last magazine round does not force a reload (ammo stops being consumed), synergizing with Synth Charge.

source:
  url: https://wiki.warframe.com/w/Dual_Toxocyst
  retrieved: "2026-07-24"

# Duration, refresh, and all four bonuses confirmed from wiki (complete).
# Exact numbers still to be reproduced in Simulacrum for the golden test.
verification:
  status: unverified
  needs_measurement: true
