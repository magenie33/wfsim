weapons:
  # An Incarnon FORM shows its BASE weapon's image, not the Genesis adapter
  # icon — the form is the same gun. Hand-set, because the generator resolves
  # "<weapon>_incarnon" to the adapter item (ToridIncarnonAdapter.png) and
  # cannot resolve laetum_incarnon at all.
  # The base variant, whose art is its own file (the two weapons look
  # different; only the Genesis is shared).
  # The Burston family (2026-08-05). Both variants ship an Incarnon art of
  # their own — `IncarnonImage` in the module — but a form is not a separate
  # ITEM on the page, so each form points at its weapon's picture the way
  # every other transform group here does.
  # The three assault rifles (2026-08-05). Gotva Prime's file is named after
  # its internal path (GrnOrokinRifle), not its display name — the CDN keys on
  # DE's own asset name.
  # The roster's first beam pistol (2026-08-05).
  # CDN has no file for it, so the FETCHER takes it from the wiki; the cached
  # name and the page URL stay the bare name either way.
  # WFCD gives the MK1-Braton the plain Braton's `imageName`; the wiki has a
  # file of its own, and the two guns do not look alike.
