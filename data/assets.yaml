# id -> image file name, a CACHE KEY: the file is DE's own texture, found
# through the id's `internal_name` in DE's Public Export, or the wiki's for a
# `wiki:` name. New entries: python scripts/gen_assets.py --write.
# Files: python scripts/fetch_images.py (web/cache/img/, then site/img/).

weapons:
  # A FORM SHOWS ITS WEAPON'S IMAGE, not the Genesis adapter icon — the form is
  # the same gun. A form is not an ITEM in the export and has no
  # `internal_name` to join on, so `gen_assets.py` reads the declared
  # `transform_group:` and takes the leader's file.
  # The base variant, whose art is its own file (the two weapons look
  # different; only the Genesis is shared).
  # The Burston family. Both variants ship an Incarnon art of
  # their own — `IncarnonImage` in the module — but a form is not a separate
  # ITEM on the page, so each form points at its weapon's picture the way
  # every other transform group here does.
  # The three assault rifles. Gotva Prime's file is named after
  # its internal path (GrnOrokinRifle), not its display name — DE's texture is
  # named that way.
  # The roster's first beam pistol.
  # A `wiki:` name is fetched from the wiki; the cached name and the page URL
  # stay the bare name either way.
  # DE's export gives the MK1-Braton the plain Braton's texture; the wiki has a
  # file of its own, and the two guns do not look alike.
