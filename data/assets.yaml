  # A RIVEN's card, DE's own: every riven shares one image because the game
  # draws them all the same — `OmegaMod.png` is the unveiled riven mod on
  # /Lotus/Upgrades/Mods/Randomized/Lotus*RandomModRare. Rivens are made by
  # the visitor, so no per-riven entry could exist; the client stamps this one
  # onto each of them (see `rivenMods`).
  # WFCD carries no imageName for this one and the CDN 404s it, but the wiki
  # has the card. `wiki:` says so explicitly — the old rule was "the name
  # contains a parenthesis", which is a property of some filenames and not a
  # statement about where the file lives.
  # Assault-rifle-only pool. Rifle Ammo Mutation and its Primed
  # version share one card art, which is DE's own doing.
  # HAND-WRITTEN, and `wiki:` because the CDN has nothing: the mod was released
  # 2026-08-21 and WFCD's export has no entry for it yet, so gen_assets.py
  # cannot see it. The name is the module's own `Image` field. Once the export
  # catches up the generator will produce this line by itself.
  # WFCD gives Primed Chamber the SAME `imageName` as Charged Chamber
  # (RifleChargedChamberMod.jpg), which is the export being wrong about a card
  # that has looked different since 2013 — so the fetcher takes this one from
  # the wiki, where the mod's own page links it.

