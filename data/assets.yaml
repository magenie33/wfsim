  # docs/DATA_SOURCES.md). Two are named for the file DE actually ships rather
  # than for the weapon — `1999InfShotgunWeapon` and `1999InfSporePistolWeapon`
  # — which is why a guess from the id would have missed both. A FORM carries
  # its weapon's art.
