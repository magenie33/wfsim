# DAMAGE TYPE ICONS — DE's own, via the wiki.
#
# `Module:DamageTypes/data` names the file for each type (`Icon`), and every
# one of them 404s on the WFCD CDN, so they all carry the `wiki:` prefix. They
# are declared here rather than beside the colours in style.css because they
# are FILES: this is the one list the fetcher, the site copy and the
# missing-asset build failure all read.
