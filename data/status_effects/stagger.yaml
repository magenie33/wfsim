schema_version: 0
id: stagger
name: Stagger
kind: status_effect

# Naming is officially inconsistent (the wiki page itself carries an
# UpdateMe banner asking "Stagger or Knockback?"). Convention: the damage
# type's dedicated page wins -> canonical name Stagger; aliases recorded.
aliases: [Knockback]
internal_name: PT_KNOCKBACK
damage_type: impact           # DT_IMPACT

duration_seconds: 6
max_stacks: 5
# The 6th proc does not bounce off: it replaces the OLDEST stack.
stack_overflow: replace_oldest
# Each stack tracks its own remaining duration.
per_stack_duration: true

effects:
  - kind: stagger_cc
    note: >-
      Target flinches and recoils backwards; subsequent procs increase
      stagger size and duration. Ospreys, Bosses, and Tenno are immune to
      the stagger (stacks still apply).
  - kind: parazon_mercy_threshold
    per_stack: 0.08
    cap: 0.80
    cap_when_shields_stripped: 1.00   # Corpus and Eximus with all shields removed
    applies_to: >-
      Heavy units only: all humanoid Eximus, Heavy Gunner, Bombard,
      Scrambus, Comba, Nullifier Crewman, Ancient Disruptor, Ancient
      Healer, Toxic Ancient.

on_kill_cosmetic: corpse is ragdolled and flung (no gameplay effect)

# Railjack space combat replaces this with "Concuss" (reduced enemy aim and
# damage, 6 s, refreshed). Separate system - not modeled here.
railjack_variant: concuss

notes: >-
  Physical proc selection is weighted by the weapon's physical damage
  distribution (impact-heavy weapons proc Stagger more often than Bleed or
  Weakened) - see MECHANICS.md §6.

source:
  url: https://wiki.warframe.com/w/Damage/Impact_Damage
  note: >-
    Dedicated damage-type page (authoritative for the proc); overview-table
    name "Knockback" and internal names from the Damage page tables.
  retrieved: "2026-07-24"

verification:
  status: unverified
  needs_measurement: true
