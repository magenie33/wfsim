schema_version: 0
id: stagger
name: Stagger
kind: debuff
# Same machinery as data/buffs/: a status PROC is only the trigger event;
# the real entity is this debuff living on the TARGET's bar. Everything
# below is a property of the debuff itself, not of whoever applied it.
default_scope: enemy

# Naming is officially inconsistent (the wiki page itself carries an
# UpdateMe banner asking "Stagger or Knockback?"). Convention (GLOSSARY.md):
# the damage type's dedicated page wins; other official names are aliases.
aliases: [Knockback]
internal_name: PT_KNOCKBACK

# Trigger: a status proc of this damage type (proc selection is weighted by
# damage-share, see MECHANICS.md §6).
applied_by:
  damage_type: impact          # DT_IMPACT

duration_seconds: 6
refreshable: false             # new procs add stacks; they do not refresh old ones
stacking: true
max_stacks: 5
per_stack_duration: true       # each stack expires on its own clock
stack_overflow: replace_oldest # the 6th proc replaces the OLDEST stack

per_stack_modifiers:
  # +8 percentage points of max health to the Parazon Mercy window per stack.
  parazon_mercy_threshold: 0.08

modifier_caps:
  parazon_mercy_threshold: 0.80
  # Corpus and Eximus with ALL shields removed cap at 100% instead.
  parazon_mercy_threshold_shieldless: 1.00

modifier_conditions:
  # The Parazon modifier only exists on "heavy units": all humanoid Eximus,
  # Heavy Gunner, Bombard, Scrambus, Comba, Nullifier Crewman, Ancient
  # Disruptor, Ancient Healer, Toxic Ancient.
  parazon_mercy_threshold: heavy_units_only

cc_effects:
  - kind: stagger
    note: >-
      Target flinches and recoils backwards; more stacks -> bigger/longer
      stagger. Ospreys, Bosses, and Tenno are immune to the CC part
      (stacks and the Parazon modifier still apply).

on_kill_cosmetic: corpse is ragdolled and flung (no gameplay effect)

# Railjack space combat replaces this with "Concuss" (reduced enemy aim and
# damage, 6 s, refreshed). Separate system - not modeled here.
railjack_variant: concuss

source:
  url: https://wiki.warframe.com/w/Damage/Impact_Damage
  note: >-
    Dedicated damage-type page (authoritative for the proc); overview-table
    name "Knockback" and internal names from the Damage page tables.
  retrieved: "2026-07-24"

verification:
  status: unverified
  needs_measurement: true
