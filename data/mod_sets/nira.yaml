id: nira
name: Nira
# THE SET BONUS IS A SLAM MULTIPLIER: "Increase damage from Slam Attack by X%"
# — 150% per equipped piece, 450% with all three. It is *additive* with Seismic
# Wave ("Nira's Set bonus is additive to Seismic Wave", wiki), which is what
# puts it in the same bucket rather than a second one.
#
# TWO OF THE THREE ARE WARFRAME MODS (Anguish, Hatred), and this engine has no
# Warframe loadout — so a weapon build reaches ONE piece here, +150%, against
# 450% in game. The same ceiling the Vigilante and Gladiator sets disclose.
members: 3
bonus:
  kind: slam_damage_per_mod
  per_mod: 1.5

source:
  url: https://wiki.warframe.com/w/Nira%27s_Set
