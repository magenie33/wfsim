# 3 mods. VERBATIM (wiki Carnis Set):
#
#   Killing an enemy with a Heavy Attack grants X% Evasion and immunity to
# Status Effects for X seconds.
#
# NOT MODELLED, and declared rather than left undefined — which is the whole
# convention here (see hunter.yaml): a set whose bonus does nothing for the
# WEAPON is still written down, so the app can say so instead of being silent.
#
# A MELEE heavy attack, paying in EVASION and status immunity. Two reasons it
# is worth nothing here and either would be enough: this arena fires a gun and
# never swings, and nobody shoots back, so a defensive grant has nothing to
# defend against (docs/UNMODELLED.md, classes 4 and 6).
