id: gladiator
name: Gladiator
# THE SET BONUS READS THE MELEE COMBO COUNTER: "+X% Critical Chance for Melee
# Weapons per Combo Multiplier" — 10% per equipped piece, 60% with all six.
# It is Blood Rush's own bracket and its own scaling, bought with set pieces
# instead of a mod slot.
#
# IT SCALES PER EQUIPPED MEMBER with no threshold, so one piece already pays its
# 10% — and THREE of the six are WARFRAME mods (Aegis, Finesse, Resolve), which
# this engine has no loadout for. A weapon build alone therefore reaches 30%
# here against 60% in game, which is the same ceiling the Vigilante set
# discloses about its own two Warframe members.
#
# IT PAYS ALMOST NOTHING IN A HEAVY MODE, and that is the counter's doing rather
# than the set's: the swing that reads the multiplier is the swing that empties
# it, exactly as it is for Blood Rush.
members: 6
bonus:
  kind: crit_chance_per_combo
  per_mod: 0.10

source:
  url: https://wiki.warframe.com/w/Gladiator_Set
