id: sacrifice
name: Sacrificial
# THE SET ENHANCES ITS OWN MEMBERS, which no other set here does. VERBATIM
# (wiki, Sacrificial Set):
#
#   The Sacrificial Set enhances all equipped mods within the set.
#   Increases the effects of both mods by 25% when both are equipped together.
#
# COMPLETION, NOT PER MEMBER: one card alone is worth its face, and the pair are
# worth 25% more EACH — Sacrificial Steel's +220% critical chance becomes +275%
# and Sacrificial Pressure's +110% melee damage becomes +137.5%.
#
# THE `x1.33 Damage to Sentients` ON EACH CARD IS NOT THIS. It is the mods' own
# second stat, out of scope because no target in this roster is a Sentient, and
# reading it as the set bonus is what left the pair paying each other nothing.
members: 2
bonus:
  kind: enhances_own_mods
  per_mod: 0.25

source:
  url: https://wiki.warframe.com/w/Sacrificial_Set
