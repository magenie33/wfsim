id: shattered_lash_hold
name: Shattered Lash
# THE ABILITY KEY HELD: the sweep, "in a 225° horizontal arc … dealing … Slash
# damage to all enemies within reach" (W`Shattered_Lash`).
inherits: shattered_lash
form: hold_cast
transform_group: shattered_lash
co_behavior: additive_with_base_damage
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.0
  paced_by_casting: true
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  # The module's Attack 2 "Arcing Damage": the same chances as the thrust.
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.3
  punch_through_m: 0.0
  range_m: 12.0
  follow_through: 0.5
  combo_multiplies_damage: true
  damage: { slash: 400.0 }
  combo_script:
    - { multiplier: 1.0, delay_seconds: 1.0, combo_points: 20, combo_points_base: 1 }

source:
  url: https://wiki.warframe.com/w/Shattered_Lash_(Weapon)
