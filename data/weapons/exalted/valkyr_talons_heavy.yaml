id: valkyr_talons_heavy
name: Valkyr Talons
# Heavy inputs retain their declared strikes and ordinary motion clock.
# Native wind-up precedes each input.
#
# THE COMBO COUNTER IS SPENT HERE, so this mode is a different BUILD: Blood Rush
# and Weeping Wounds read a counter the swing that read it empties.
inherits: valkyr_talons
form: heavy
transform_group: valkyr_talons
co_behavior: additive_with_base_damage
unmodeled:
  - reason: client_melee_slam
  - reason: client_melee_legacy
  - reason: client_melee_geometry
  - reason: client_melee_ability
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.5
  crit_multiplier: 2.0
  status_chance: 0.1
  punch_through_m: 0.0
  range_m: 2.15
  follow_through: 1.0
  heavy:
    multiplier: 5.0
    windup_seconds: 0.75
  damage: { puncture: 62.5, slash: 187.5 }   # total 250
  slam:
    damage: { puncture: 62.5, slash: 187.5 }
    radius_m: 6.0
    blast_kind: slam
    status_chance: 0.1
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    forced_procs: []
    takes_multishot: false
  spends_combo: true
  # Native charge is separate from the retained motion/recovery approximation.
  # see notes: combo_points_from_multiplier
  #
  # THE OPENER IS A SLAM AND NOTHING ELSE: `Dmg = { 500 }`, `Types = { "Slam" }`,
  # so the weapon's own slam at 5x — "considered a slam, and thus benefits from
  # Seismic Wave" (W`Hysteria`). The second input forces Slash on two of its
  # five hits: `Procs = { "Slash", "", "Slash", "", "Stagger" }`.
  combo_script:
    - multiplier: 0.0
      slam_multiplier: 5.0
      windup_seconds: 0.75
      delay_seconds: 1.3333
      forced_procs:
      - lifted
      combo_points: 0
      combo_points_base: 0
    - multiplier: 3.0
      hits: 5
      windup_seconds: 0.75
      delay_seconds: 1.3333
      forced_procs:
      - slash
      forced_hits: 2
      combo_points: 0
      combo_points_base: 0

source:
  url: https://wiki.warframe.com/w/Hysteria_(Stance)

# see notes: client_melee_calibration
