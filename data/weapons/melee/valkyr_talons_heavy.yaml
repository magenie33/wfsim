id: valkyr_talons_heavy
name: Valkyr Talons
# RISE FROM ASHES — nothing but heavy attacks, 2 s at 1.0x over two inputs: a
# 500% opener that forces Lifted, then five 300% hits.
#
# THE COMBO COUNTER IS SPENT HERE, so this mode is a different BUILD: Blood Rush
# and Weeping Wounds read a counter the swing that read it empties.
inherits: valkyr_talons
form: heavy
transform_group: valkyr_talons
co_behavior: additive_with_base_damage
unmodeled:
  - "THE WIND-UP IS ITS OWN CLOCK: attack speed shortens only the swing after the charge, and only wind-up speed shortens the charge"
  # "The opening heavy attack in Hysteria's two-attack heavy combo is considered
  # a slam, and thus benefits from Seismic Wave" (W`Hysteria`).
  - "THE OPENER IS A SLAM, and Seismic Wave pays it on the ability page. It is a swing here, so Seismic Wave pays it nothing and it reaches the body in front rather than a sphere"
  # `Procs = { "Slash", "", "Slash", "", "Stagger" }` on the second input.
  - "two of the second input's five hits force Slash; the five land as one row here, so none of them is forced — the conservative direction"
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.5
  crit_multiplier: 2.0
  status_chance: 0.1
  punch_through_m: 0.0
  range_m: 2.15
  follow_through: 1.0
  heavy: { multiplier: 5.0, windup_seconds: 0.5 }
  damage: { puncture: 62.5, slash: 187.5 }   # total 250
  slam:
    damage: { puncture: 62.5, slash: 187.5 }
    radius_m: 6.0
    blast_kind: slam
    status_chance: 0.1
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    forced_procs: []
    takes_multishot: false
  spends_combo: true
  # TWO CLOCKS: the 0.5 s charge (the module's WindUp) before each input, and the
  # combo's 2 s split over its two inputs after it.
  # see notes: combo_points_from_multiplier
  combo_script:
    - { multiplier: 5.0, windup_seconds: 0.5, delay_seconds: 1.0, forced_procs: [lifted], combo_points: 0, combo_points_base: 0 }
    - { multiplier: 3.0, hits: 5, windup_seconds: 0.5, delay_seconds: 1.0, combo_points: 0, combo_points_base: 0 }

source:
  url: https://wiki.warframe.com/w/Hysteria_(Stance)
