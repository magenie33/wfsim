id: valkyr_talons_heavy
name: Valkyr Talons
# RISE FROM ASHES — nothing but heavy attacks, 2 s at 1.0x over two inputs: a
# 500% opener that forces Lifted, then five 300% hits.
#
# THE COMBO COUNTER IS SPENT HERE, so this mode is a different BUILD: Blood Rush
# and Weeping Wounds read a counter the swing that read it empties.
inherits: valkyr_talons
form: heavy
transform_group: valkyr_talons
co_behavior: additive_with_base_damage
unmodeled:
  - reason: heavy_charge_share_assumed
    published: 0.5
    charge: 0.17
    swing: 0.33
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.5
  crit_multiplier: 2.0
  status_chance: 0.1
  punch_through_m: 0.0
  range_m: 2.15
  follow_through: 1.0
  heavy: { multiplier: 5.0, windup_seconds: 0.1667 }
  damage: { puncture: 62.5, slash: 187.5 }   # total 250
  slam:
    damage: { puncture: 62.5, slash: 187.5 }
    radius_m: 6.0
    blast_kind: slam
    status_chance: 0.1
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    forced_procs: []
    takes_multishot: false
  spends_combo: true
  # TWO CLOCKS. The module's 0.5 s WindUp is the whole heavy, as every published
  # wind-up is: a third of it (0.1667 s) is the charge before each input, and
  # the other 0.3333 s joins the combo's 2 s split over its two inputs.
  # see notes: tonfa_heavy_timing
  # see notes: combo_points_from_multiplier
  #
  # THE OPENER IS A SLAM AND NOTHING ELSE: `Dmg = { 500 }`, `Types = { "Slam" }`,
  # so the weapon's own slam at 5x — "considered a slam, and thus benefits from
  # Seismic Wave" (W`Hysteria`). The second input forces Slash on two of its
  # five hits: `Procs = { "Slash", "", "Slash", "", "Stagger" }`.
  combo_script:
    - { multiplier: 0.0, slam_multiplier: 5.0, windup_seconds: 0.1667, delay_seconds: 1.3333, forced_procs: [lifted], combo_points: 0, combo_points_base: 0 }
    - { multiplier: 3.0, hits: 5, windup_seconds: 0.1667, delay_seconds: 1.3333, forced_procs: [slash], forced_hits: 2, combo_points: 0, combo_points_base: 0 }

source:
  url: https://wiki.warframe.com/w/Hysteria_(Stance)
