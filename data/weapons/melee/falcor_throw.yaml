id: falcor_throw
name: Falcor
# see notes: glaive_throw_from_the_module
inherits: falcor
form: throw
transform_group: falcor
co_behavior: additive_with_base_damage
unmodeled:
  - reason: glaive_bounce_unmodelled
  - reason: glaive_throw_return_assumed
  - reason: glaive_throw_animation_assumed
  - reason: glaive_throw_tennokai_unmodelled
  - reason: glaive_throw_animosity_unmodelled
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: projectile
  projectile_speed_mps: 25
  fire_rate: 0.833
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.14
  crit_multiplier: 1.8
  status_chance: 0.36
  punch_through_m: 1
  range_m: 30
  damage: { electricity: 110, impact: 20, puncture: 40, slash: 80 }   # total 250
  # THE IN-FLIGHT DETONATION — the Recall Explosion row; `detonate` sets it off.
  radial:
    damage: { electricity: 690 }   # total 690
    radius_m: 6
    blast_kind: in_flight
    crit_chance: 0.14
    crit_multiplier: 1.8
    status_chance: 0.36
    falloff_start_m: 0.0
    falloff_reduction: 0
    forced_procs: [electricity]
    takes_multishot: false
  # see notes: combo_points_from_multiplier
  combo_script:
    - { multiplier: 1.0, delay_seconds: 1.0, forced_procs: [impact], combo_points: 1, combo_points_base: 1 }

source:
  url: https://wiki.warframe.com/w/Falcor
