id: praedos_heavy_slam
name: Praedos
# NOTHING BUT HEAVY SLAMS — the mode this weapon is built for, and the one melee
# mode that needs no stance at all: a slam is the same attack whatever is in the
# slot.
#
# IT IS ENTIRELY RADIAL. 600 Blast in a 9 m sphere, linear falloff to 70% at the
# edge (wiki: "3x for heavy slam ... to 50% (70% for heavy slam) at the edge of
# its radius"). The direct component is zero, so this entry carries no `damage:`
# of its own beyond the base vector the swing scales.
#
# 600 IS 3x THE WEAPON'S BASE — the class constant, and the export's own
# `heavySlamRadialDamage` agrees to the digit. Its Slash-heavy base vector is
# NOT what lands here: a heavy slam is Blast, so the 160 Slash this weapon is
# sold on pays nothing in the mode it is best at.
#
# THE SPHERE IS CENTRED ON THE WIELDER (`blast_kind: slam`), which is why this
# mode ignores the 2.5 m reach that leaves every other melee mode hitting one
# body on a 3 m grid.
#
# SHOCKWAVE SYNERGY IS THE REASON THIS MODE WORKS IN A CROWD. Every other heavy
# mode in the roster earns no combo at all and can only spend what its
# initial-combo floor regenerates; this one is paid 4 points per body the sphere
# reached, so the counter climbs with the crowd rather than in spite of it.
inherits: praedos
form: heavy_slam
transform_group: praedos
co_behavior: additive_with_base_damage
unmodeled:
  - "THE CLIMB IS NOT CHARGED: this loop takes the 150% radius a slam dropped from 15 m gets, and the seconds spent getting up there are free. A player who hops instead trades that radius back down towards the 2.5 m / listed radius floor, and this arena has no vertical axis to tell the two apart"
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  # ATTACK SPEED, in the fire-rate bucket. 1.17 is fast for a melee weapon and
  # it is the whole reason a Tonfa reaches a combo tier a hammer cannot.
  fire_rate: 1.17
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.2
  punch_through_m: 0.0
  # REACH, and it is a real distance in this arena: 2.5 m from the wielder.
  # Incarnon Form adds 3 m to it, which is the largest reach bonus in the
  # roster and the only thing that makes a light Praedos mode reach a crowd.
  range_m: 2.5
  # NO FOLLOW THROUGH ON A SLAM: *"Follow Through does not affect (Heavy)
  # Slam Attacks"* (wiki, Melee). A slam's damage is its radial, and the
  # radial reaches the room through the sphere rather than through a swing.
  # see notes: tonfa_heavy_and_slide
  heavy: { multiplier: 4.0, windup_seconds: 0.7 }
  spends_combo: true
  damage: { impact: 0.0 }
  radial:
    damage: { blast: 600 }
    radius_m: 9.0
    blast_kind: slam
    status_chance: 0.1
    falloff_start_m: 0.0
    falloff_reduction: 0.3
    forced_procs: []
    takes_multishot: false
  # THE LOOP IS `CLIMB -> SLAM -> RECOVER`, and only the last of the three is a
  # fixed cost. *"Heavy slams do not have any wind up"* (wiki, Melee) — so this
  # swing carries none, unlike the standing heavy attack's 0.7 s — and the climb
  # is the player's own time, which `dummy::heavy_cycle_seconds` spends the way
  # that pays this mode best.
  #
  # TWO SECONDS IS A STAND-IN for the landing recovery, the same one the
  # Magistar carries. Nothing publishes it; it is uncancellable and attack speed
  # shortens it, which is exactly what `delay_seconds` already means — and this
  # weapon has more attack speed to spend on it than any other melee in the
  # roster. Declared in docs/MELEE.md until it is measured in game.
  combo_script:
    - { multiplier: 1.0, delay_seconds: 2.0, forced_procs: [lifted] }
source:
  url: https://wiki.warframe.com/w/Praedos
