id: magistar_slide
name: Magistar
# HELL'S WAVE — Crushing Ruin's slide attack, on a loop. One 200% spin with a
# forced Impact, 0.97 s a swing (200 / 206.2).
#
# `all_around` is what makes this mode worth anything in a crowd: a spin
# reaches every body within the weapon's range, where Follow Through only walks
# a line.
inherits: magistar
form: slide
transform_group: magistar
co_behavior: additive_with_base_damage
attack:
  # A SWING IS NOT A TRIGGER PULL. The engine reads this field for exactly
  # three values — `held` (a beam), `charge` and `burst` — so `melee` matches
  # none of them and is simply the truth; the page then prints the form's name
  # with no parenthetical, where `semi_auto` had it reading "Neutral Combo
  # (semi-auto)".
  trigger: melee
  shot_type: hit_scan
  fire_rate: 0.833
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.1
  punch_through_m: 0.0
  range_m: 2.5
  follow_through: 0.4
  # THE CLASS'S HEAVY ATTACK — 6x with a 1.2 s charge, from the wiki's
  # per-weapon-type table. Stated on EVERY form including the light ones,
  # because TENNOKAI turns one of their swings into a heavy attack and a form
  # with no heavy of its own could not fire the swing the window buys.
  heavy: { multiplier: 6.0, windup_seconds: 1.2 }
  damage: { impact: 168, puncture: 31.5, slash: 10.5 }
  combo_script:
    - { multiplier: 2.0, delay_seconds: 0.97, all_around: true, forced_procs: [impact] }
source:
  url: https://wiki.warframe.com/w/Crushing_Ruin
