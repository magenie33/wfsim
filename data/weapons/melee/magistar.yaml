# see notes: combo_points_from_multiplier
# see notes: melee_shared_package_actions
id: magistar
name: Magistar
slot: melee
weapon_type: melee
class: hammer
# THE STATIONARY COMBO, and the arsenal's own form — so its mode is `base`.
form: neutral
default_form: true
transform_group: magistar
mod_pools: [melee, hammer]
mastery_rank: 1
max_rank: 30

# THE FIRST MELEE WEAPON IN THE ROSTER. Seven entries, one per way
# to swing it, because a melee player picks ONE loop and runs it for the whole
# engagement — which is the definition of a mode in this repo, and why each of
# the seven is an independent board row rather than an animation.
#
# A FINDING RECORDED because it costs nothing to write and is expensive to
# re-derive: DE's Public Export carries `slamAttack: 630` beside
# `slamRadialDamage: 420`, and `heavySlamAttack: 1050` beside
# `heavySlamRadialDamage: 630`. The wiki publishes only the radial figures
# and its own `attacks[]` array carries only those, so those are what is
# transcribed. What the other pair is — most likely a direct component on
# the body landed on — is UNKNOWN, and the slam entries declare it as a gap
# rather than guessing.
accuracy: ~
riven_family: Magistar      # module `Family` — SHARED with the Sancti Magistar,
#                              so one card fits both
disposition: 1.2
polarities: []
# THE STANCE SLOT'S OWN POLARITY, and it decides a capacity GRANT rather than a
# discount: 10 on a matching slot, 5 on a bare one, 4 on the wrong colour
# (`rules::capacity::stance_capacity`). Vazarin, so Shattering Storm grants 10 here and
# Crushing Ruin grants 4 until a Forma says otherwise.
stance_polarity: vazarin
introduced: "Update 11.5"
internal_name: /Lotus/Weapons/Tenno/Melee/Maces/PaladinMace/PaladinMaceWeapon
traits: [tenno]

# NO AMMO AT ALL. A melee weapon has no magazine, no reserve and no reload, so
# the loop tops it up silently and `Capability::HasReserve` is false for it the
# way it is for a companion weapon — a different reason, the same absence.
ammo_max: ~

# SECONDS THE COMBO COUNTER SURVIVES untouched. Five is this weapon's, and the
# wiki names the handful that differ rather than stating a default.
combo_duration_seconds: 5.0

# No CO catalog row for any of this weapon's attacks, so the ordinary class.
# ABSENCE MEANS ORDINARY — and it was checked against the PAGE, not against
# docs/CATALOGS.md, which by construction holds only rows the roster already
# has.
co_behavior: additive_with_base_damage

unmodeled:
  - "Power Spike's partial combo decay is a Warframe passive and is not modelled: the counter drops to zero when its timer runs out, so with that passive the number reads low."

attack:
  trigger: melee
  shot_type: hit_scan
  fire_rate: 0.8333333333333334
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.1
  punch_through_m: 0.0
  range_m: 2.5
  follow_through: 0.4
  heavy:
    multiplier: 6.0
    windup_seconds: 0.5
  damage:
    impact: 168
    puncture: 31.5
    slash: 10.5
  slam:
    damage:
      impact: 210
    radius_m: 9.0
    blast_kind: slam
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    forced_procs: []
    takes_multishot: false
  combo_script:
    tree: /Lotus/Weapons/Tenno/Melee/MeleeTrees/HammerMeleeTree
    context: CC_GROUND_BRANCH_A
source:
