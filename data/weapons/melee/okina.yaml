# see notes: okina_spectral_dagger
# see notes: melee_shared_package_actions
id: okina
name: Okina
slot: melee
weapon_type: melee
class: dual_daggers
# THE STATIONARY COMBO, and the arsenal's own form — so its mode is `base`.
form: neutral
default_form: true
transform_group: okina
mod_pools: [melee, dual_daggers]
mastery_rank: 5
max_rank: 30

# THE FIRST DUAL DAGGERS IN THE ROSTER. Seven entries, one per way to swing
# it, the shape every melee weapon here has (docs/MELEE.md §1). The class is
# fast and light: 0.8 Follow Through and 1.7 m of reach.
#
# ITS GENESIS IS WHAT IT IS BOUGHT FOR. Incarnon Form adds +100% melee damage
# and, on every kill, a SPECTRAL DAGGER that seeks a body within 15 m on its own
# clock — so the swings are never paused for it. `spectral_dagger:` below is the
# attack each one carries; the evolution says when they are made.
accuracy: ~
riven_family: Okina      # module `Family` — SHARED by the Okina and the Okina Prime
disposition: 1.2
polarities: [madurai]
# THE STANCE SLOT'S OWN POLARITY, and it decides a capacity GRANT rather than a
# discount (`rules::capacity::stance_capacity`). Vazarin, so Spinning Needle
# grants 10 here and the other two Dual Daggers stances 4 until a Forma says
# otherwise.
stance_polarity: vazarin
introduced: "Specters of the Rail 0.0"
internal_name: /Lotus/Weapons/Tenno/Melee/Swords/TennoSai/TennoSais
traits: [tenno]

# NO AMMO AT ALL. A melee weapon has no magazine, no reserve and no reload.
ammo_max: ~

# SECONDS THE COMBO COUNTER SURVIVES untouched — the module's `ComboDur`.
combo_duration_seconds: 5.0

# No CO catalog row for any of this weapon's attacks, so the ordinary class.
co_behavior: additive_with_base_damage

unmodeled:
- 'The 5% Movement Speed bonus while held: nobody moves here.'
- 'Power Spike''s partial combo decay is a Warframe passive and is not modelled: the counter drops to zero when its timer runs out, so with that passive the number
  reads low.'
- reason: spectral_dagger_orbit_and_target_assumed
- reason: dual_daggers_heavy_unmeasured
