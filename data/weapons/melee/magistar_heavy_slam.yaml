id: magistar_heavy_slam
name: Magistar
# NOTHING BUT HEAVY SLAMS — the Magistar's own build, and the one melee mode
# that needs no stance at all: a slam is the same attack whatever is in the
# slot.
#
# IT IS ENTIRELY RADIAL. 630 Blast in a 10 m sphere, linear falloff to 70% at
# the edge (wiki: "3x for heavy slam ... to 50% (70% for heavy slam) at the
# edge of its radius"; WFCD's own `attacks[]` agrees: start 0, end 10,
# reduction 0.3). The direct component is zero, so this entry carries no
# `damage:` of its own beyond the base vector the swing scales.
#
# THE SPHERE IS CENTRED ON THE WIELDER (`blast_kind: slam`), which is why this
# mode ignores the 2.5 m reach that leaves every other melee mode hitting one
# body on a 3 m grid.
inherits: magistar
form: heavy_slam
transform_group: magistar
co_behavior: additive_with_base_damage
unmodeled:
  - "melee CRITICAL CHANCE mods read x2 on a heavy attack — True Steel, Sacrificial Steel and Galvanized Steel all say so on their own cards — and this entry does not double them, so a crit build reads LOW in this mode"
  - "the slam's radius grows with the height it was dropped from — up to 150% at 15 m and down to a floor of 2.5m/radius — and this arena has no vertical axis, so the listed radius is what is used"
attack:
  # A SWING IS NOT A TRIGGER PULL. The engine reads this field for exactly
  # three values — `held` (a beam), `charge` and `burst` — so `melee` matches
  # none of them and is simply the truth; the page then prints the form's name
  # with no parenthetical, where `semi_auto` had it reading "Neutral Combo
  # (semi-auto)".
  trigger: melee
  shot_type: hit_scan
  fire_rate: 0.833
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.1
  punch_through_m: 0.0
  range_m: 2.5
  # THE CLASS'S HEAVY ATTACK — 6x with a 1.2 s charge, from the wiki's
  # per-weapon-type table. Stated on EVERY form including the light ones,
  # because TENNOKAI turns one of their swings into a heavy attack and a form
  # with no heavy of its own could not fire the swing the window buys.
  heavy: { multiplier: 6.0, windup_seconds: 1.2 }
  spends_combo: true
  damage: { impact: 0.0 }
  radial:
    damage: { blast: 630 }
    radius_m: 10.0
    blast_kind: slam
    falloff_start_m: 0.0
    falloff_reduction: 0.3
    forced_procs: []
    takes_multishot: false
  # THE WIND-UP IS ON THE SWING, not on the attack: the attack-level field is a
  # one-off delay before the fight's first shot, and a heavy attack pays its
  # charge before EVERY swing. Attack speed does not shorten it — see
  # `ComboHit::windup_seconds`.
  combo_script:
    - { multiplier: 1.0, windup_seconds: 1.2, delay_seconds: 0.3, forced_procs: [lifted] }
source:
  url: https://wiki.warframe.com/w/Magistar
