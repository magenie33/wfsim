# see notes: combo_points_from_multiplier
# see notes: melee_shared_package_actions
id: magistar_heavy_slam
name: Magistar
# NOTHING BUT HEAVY SLAMS — the Magistar's own build, and the one melee mode
# that needs no stance at all: a slam is the same attack whatever is in the
# slot.
#
# IT IS ENTIRELY RADIAL. 630 Blast in a 10 m sphere, linear falloff to 70% at
# the edge (wiki: "3x for heavy slam ... to 50% (70% for heavy slam) at the
# edge of its radius"). The direct component is zero, so this entry carries no
# `damage:` of its own beyond the base vector the swing scales.
#
# 630 IS 3x THE WEAPON'S BASE AND IT IS MEASURED — the class constant the wiki
# states, with no exception anywhere in the export. A build carrying `Base
# Damage +100` reads 1095 on an Infested Deimos target, which is `(630 + 100) x
# 1.5` to the digit: Blast is x1.5 there and the flat add lands ONCE
# (MEASUREMENTS M69). The export's `heavySlamAttack` of 1050 is a bigger number
# for the same attack and is NOT what a body takes.
#
# THE SPHERE IS CENTRED ON THE WIELDER (`blast_kind: slam`), which is why this
# mode ignores the 2.5 m reach that leaves every other melee mode hitting one
# body on a 3 m grid.
inherits: magistar
form: heavy_slam
transform_group: magistar
co_behavior: additive_with_base_damage
unmodeled:
  - "The climb is not timed: this loop takes the 150% radius of a slam dropped from 15 m and spends no time getting up there. A player who hops instead gets less radius, down to the 2.5 m / listed floor; this fight has no vertical axis to tell the two apart."
attack:
  trigger: melee
  shot_type: hit_scan
  fire_rate: 0.8333333333333334
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.1
  punch_through_m: 0.0
  range_m: 2.5
  heavy:
    multiplier: 6.0
    windup_seconds: 0.5
  spends_combo: true
  damage:
    impact: 0.0
  radial:
    damage:
      blast: 630
    radius_m: 10.0
    blast_kind: slam
    falloff_start_m: 0.0
    falloff_reduction: 0.3
    forced_procs: []
    takes_multishot: false
  combo_script:
  - multiplier: 1.0
    delay_seconds: 2.0
    forced_procs:
    - lifted
    combo_points: 0
    combo_points_base: 0
source:
  url: https://wiki.warframe.com/w/Magistar
