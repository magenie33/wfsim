id: magistar_forward
name: Magistar
# TIDAL FORCE — Crushing Ruin's forward combo, and the only one of the four
# with no forced proc anywhere in it. 800% over 2.60 s (800 / 307.7).
inherits: magistar
form: forward
transform_group: magistar
co_behavior: additive_with_base_damage
attack:
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 0.833
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.1
  punch_through_m: 0.0
  range_m: 2.5
  follow_through: 0.4
  # THE CLASS'S HEAVY ATTACK — 6x with a 1.2 s charge, from the wiki's
  # per-weapon-type table. Stated on EVERY form including the light ones,
  # because TENNOKAI turns one of their swings into a heavy attack and a form
  # with no heavy of its own could not fire the swing the window buys.
  heavy: { multiplier: 6.0, windup_seconds: 1.2 }
  damage: { impact: 168, puncture: 31.5, slash: 10.5 }
  # TIDAL FORCE — transcribed from the wiki's own `Module:Stances/data`,
  # which publishes `Dmg`, `Hits`, `Procs`, `Types`, `ImpactMultiplier` and
  # `Duration` per combo. The duration is the MODULE's (2.6 s at 1.0x attack
  # speed), not derived — though deriving it from the rendered table's two
  # columns gave the same number, which is how the derivation was checked.
  #
  # THE SLAM TAKES NO TIME OF ITS OWN: it rides the swing it is listed with, so
  # the 4 direct swings share the 2.6 s and it lands alongside the last of them.
  # `Knockback` is Impact's own proc and is transcribed as `impact`.
  combo_script:
    - { multiplier: 1.0, delay_seconds: 0.65 }
    - { multiplier: 1.0, delay_seconds: 0.65, hits: 2, all_around: true }
    - { multiplier: 2.0, delay_seconds: 0.65 }
    - { multiplier: 3.0, delay_seconds: 0.65 }

source:
  url: https://wiki.warframe.com/w/Crushing_Ruin
