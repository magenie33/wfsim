id: glaive_prime_charged_throw
name: Glaive Prime
# see notes: glaive_throw_from_the_module
inherits: glaive_prime
form: charged_throw
transform_group: glaive_prime
co_behavior: additive_with_base_damage
unmodeled:
  - reason: glaive_bounce_count_assumed
  - reason: glaive_bounce_explosion_assumed
  - reason: glaive_detonation_ends_bounces
  - reason: glaive_throw_return_assumed
  - reason: glaive_throw_animation_assumed
  - reason: glaive_throw_tennokai_unmodelled
  - reason: glaive_throw_animosity_unmodelled
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: projectile
  projectile_speed_mps: 55
  fire_rate: 1.25
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.26
  crit_multiplier: 2.4
  status_chance: 0.34
  punch_through_m: 1
  range_m: 50
  damage: { impact: 54, puncture: 54, slash: 252 }   # total 360
  # THE IN-FLIGHT DETONATION — the Recall Explosion row; `detonate` sets it off.
  radial:
    damage: { blast: 1184 }   # total 1184
    radius_m: 4.8
    blast_kind: in_flight
    crit_chance: 0.26
    crit_multiplier: 2.4
    status_chance: 0.34
    falloff_start_m: 0.0
    falloff_reduction: 0
    forced_procs: [impact, slash]
    takes_multishot: false
  # THE BOUNCES — "can bounce up to three times" (wiki); the
  # Bounce Explosion row is what a Volatile card sets off.
  thrown_bounce:
    bounces: 3
    explosion:
      damage: { blast: 592 }   # total 592
      radius_m: 4.8
      crit_chance: 0.26
      crit_multiplier: 2.4
      status_chance: 0.34
      falloff_start_m: 0.0
      falloff_reduction: 0.4
      takes_multishot: false
  # see notes: combo_points_from_multiplier
  combo_script:
    - { multiplier: 1.0, delay_seconds: 1.0, windup_seconds: 1.192, forced_procs: [impact, slash], combo_points: 1, combo_points_base: 1 }

source:
  url: https://wiki.warframe.com/w/Glaive_Prime
