id: halikar_wraith_charged_throw
name: Halikar Wraith
# see notes: glaive_throw_from_the_module
inherits: halikar_wraith
form: charged_throw
transform_group: halikar_wraith
co_behavior: additive_with_base_damage
unmodeled:
  - reason: glaive_bounce_count_assumed
  - reason: glaive_bounce_explosion_assumed
  - reason: glaive_detonation_ends_bounces
  - reason: glaive_throw_return_assumed
  - reason: glaive_throw_animation_assumed
  - reason: glaive_throw_tennokai_unmodelled
  - reason: glaive_throw_animosity_unmodelled
  - "A throw's 50% chance to disarm is not modelled; nothing here is armed."
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: projectile
  projectile_speed_mps: 40
  fire_rate: 1.17
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.21
  crit_multiplier: 2.5
  status_chance: 0.41
  punch_through_m: 1
  range_m: 30
  damage: { impact: 52.7, puncture: 421.6, slash: 22.7 }   # total 497
  # THE IN-FLIGHT DETONATION — the Recall Explosion row; `detonate` sets it off.
  radial:
    damage: { blast: 1314 }   # total 1314
    radius_m: 5.1
    blast_kind: in_flight
    crit_chance: 0.21
    crit_multiplier: 2.5
    status_chance: 0.41
    falloff_start_m: 0.0
    falloff_reduction: 0
    forced_procs: [impact]
    takes_multishot: false
  # THE BOUNCES — "can bounce up to three times" (wiki); the
  # Bounce Explosion row is what a Volatile card sets off.
  thrown_bounce:
    bounces: 3
    explosion:
      damage: { blast: 657 }   # total 657
      radius_m: 5.1
      crit_chance: 0.21
      crit_multiplier: 2.5
      status_chance: 0.41
      falloff_start_m: 0.0
      falloff_reduction: 0.4
      takes_multishot: false
  # see notes: combo_points_from_multiplier
  combo_script:
    - { multiplier: 1.0, delay_seconds: 1.0, windup_seconds: 1.192, forced_procs: [impact], combo_points: 1, combo_points_base: 1 }

source:
  url: https://wiki.warframe.com/w/Halikar_Wraith
