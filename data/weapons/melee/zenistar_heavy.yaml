unmodeled:
- reason: client_melee_timing
- reason: client_melee_special
- reason: client_melee_geometry
- The heavy mode deploys one disc, waits for its aura to expire, then deploys again. Early recall, moving beyond recall range
  and light attacks while the disc is deployed are not modelled.
- Disc flight speed and collision stopping are unmeasured. The model places the explosion and aura on the first struck body
  within 9 m; aiming at the floor or a disc that passes through bodies is not modelled.
- Tennokai conversion from light combos is disabled because the deploy/recall cycle is not modelled in those combos.
- The aura's critical-chance snapshots, doubled heavy-attack critical-chance bonus, stealth multipliers and special Warframe
  interactions are unmeasured. The aura uses its resolved crit stats and the simulator's ordinary live-buff rules.
