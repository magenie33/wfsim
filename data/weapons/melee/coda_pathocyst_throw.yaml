id: coda_pathocyst_throw
name: Coda Pathocyst
# see notes: glaive_throw_from_the_module
inherits: coda_pathocyst
form: throw
transform_group: coda_pathocyst
co_behavior: additive_with_base_damage
unmodeled:
  - reason: glaive_bounce_count_assumed
  - reason: glaive_bounce_explosion_assumed
  - reason: glaive_detonation_ends_bounces
  - reason: glaive_throw_return_assumed
  - reason: glaive_throw_animation_assumed
  - reason: glaive_throw_tennokai_unmodelled
  - reason: glaive_throw_animosity_unmodelled
  - "The Maggots a throw drops are not modelled: the page gives no damage and no radius for them."
  - "The Throw Recall Explosion's 12% crit chance is the module's, against 22% on every other quick-throw row; unmeasured."
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: projectile
  projectile_speed_mps: 30
  fire_rate: 0.667
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.22
  crit_multiplier: 2.4
  status_chance: 0.36
  punch_through_m: 0
  range_m: 30
  damage: { impact: 49, puncture: 45, slash: 80, viral: 123 }   # total 297
  # THE IN-FLIGHT DETONATION — the Recall Explosion row; `detonate` sets it off.
  radial:
    damage: { viral: 810 }   # total 810
    radius_m: 4.9
    blast_kind: in_flight
    crit_chance: 0.12
    crit_multiplier: 2.4
    status_chance: 0.36
    falloff_start_m: 0.0
    falloff_reduction: 0
    forced_procs: [viral]
    takes_multishot: false
  # THE BOUNCES — "can bounce up to three times" (wiki); the
  # Bounce Explosion row is what a Volatile card sets off.
  thrown_bounce:
    bounces: 3
    explosion:
      damage: { viral: 405 }   # total 405
      radius_m: 4.9
      crit_chance: 0.22
      crit_multiplier: 2.4
      status_chance: 0.36
      falloff_start_m: 0.0
      falloff_reduction: 0.5
      takes_multishot: false
  # see notes: combo_points_from_multiplier
  combo_script:
    - { multiplier: 1.0, delay_seconds: 1.0, combo_points: 1, combo_points_base: 1 }

source:
  url: https://wiki.warframe.com/w/Coda_Pathocyst
