id: okina_prime
name: Okina Prime
slot: melee
weapon_type: melee
class: dual_daggers
# THE STATIONARY COMBO, and the arsenal's own form — so its mode is `base`.
form: neutral
default_form: true
transform_group: okina_prime
mod_pools: [melee, dual_daggers]
mastery_rank: 12
max_rank: 30

# THE PRIME OF THE OKINA — the same sai, swung the same seven ways, with every
# number a step up: 184 base against 140, 30% / 2.6x critical against 16% /
# 2.0x, 24% status against 20%, 1.17 attack speed against 1.08. Its Genesis
# column is smaller on every tier that has two.
accuracy: ~
riven_family: Okina      # module `Family` — SHARED by the Okina and the Okina Prime
disposition: 1.2
polarities: [madurai, madurai]
# THE STANCE SLOT'S OWN POLARITY, and it decides a capacity GRANT rather than a
# discount (`rules::capacity::stance_capacity`). Vazarin, so Spinning Needle
# grants 10 here and the other two Dual Daggers stances 4 until a Forma says
# otherwise.
stance_polarity: vazarin
introduced: "35.5.9"
internal_name: /Lotus/Weapons/Tenno/Melee/Swords/PrimeOkina/PrimeOkina
traits: [tenno]

# NO AMMO AT ALL. A melee weapon has no magazine, no reserve and no reload.
ammo_max: ~

# SECONDS THE COMBO COUNTER SURVIVES untouched — the module's `ComboDur`.
combo_duration_seconds: 5.0

# No CO catalog row for any of this weapon's attacks, so the ordinary class.
co_behavior: additive_with_base_damage

unmodeled:
  - "The 5% Movement Speed bonus while held: nobody moves here."
  - "One attack input's animation length is unpublished: the wiki gives each combo's total at 1.0x attack speed, so totals are exact and inputs are split evenly. This shifts a status tick by fractions of a second and changes no total."
  - "Power Spike's partial combo decay is a Warframe passive and is not modelled: the counter drops to zero when its timer runs out, so with that passive the number reads low."
  - reason: spectral_dagger_orbit_and_target_assumed
  - reason: dual_daggers_heavy_unmeasured

attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.17
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.3
  crit_multiplier: 2.6
  status_chance: 0.24
  punch_through_m: 0.0
  range_m: 1.7
  # `FT^(n-1)` — the module's `FollowThrough`, Dual Daggers.
  follow_through: 0.8
  # see notes: dual_daggers_heavy
  heavy: { multiplier: 2.0, windup_seconds: 0.1667 }
  damage: { impact: 9.2, puncture: 64.4, slash: 110.4 }   # total 184
  # see notes: okina_spectral_dagger
  spectral_dagger:
    damage: { impact: 27.6, puncture: 64.4, slash: 92 }
    speed_mps: 18.0
    blast:
      damage: { cold: 184 }
      radius_m: 4.0
      forced_procs: [cold]
      takes_multishot: false
  # TRUE KISS — Spinning Needle's neutral combo, from `Module:Stances/data`:
  # 900% over 1.85 s at 1.0x, three inputs of 0.6167 s. The entry carries the
  # MATCHING stance's script because the stanceless Dual Daggers block
  # publishes no duration for its ground combos, so there is nothing to time
  # them with. Installing any Dual Daggers card replaces it.
  # see notes: combo_clock_is_the_input
  # see notes: combo_points_from_multiplier
  combo_script:
    - { multiplier: 3.0, delay_seconds: 0.6167, combo_points: 3, combo_points_base: 3 }
    - { multiplier: 2.0, delay_seconds: 0.6167, hits: 2, forced_procs: [slash], combo_points: 2, combo_points_base: 2 }
    - { multiplier: 4.0, delay_seconds: 0.6166, forced_procs: [knockdown], combo_points: 4, combo_points_base: 4 }

source:
  url: https://wiki.warframe.com/w/Okina_Prime
  # The combo table: https://wiki.warframe.com/w/Spinning_Needle
