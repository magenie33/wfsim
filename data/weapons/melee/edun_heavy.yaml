unmodeled:
- Heavy-attack mod bonuses apply only if the projectile lands during a heavy attack animation. The simulation applies them
  to every direct heavy projectile instead of checking the animation window.
- Tennokai grants its combo-free input, but its bonus damage should not apply to the throw; that exclusion is not modelled.
- Projectile arcing, corpse attachment, killing-hit deflection and sliding heavy attacks are not modelled.
