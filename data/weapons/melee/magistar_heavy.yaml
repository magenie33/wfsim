id: magistar_heavy
name: Magistar
# CROWD FALL — nothing but heavy attacks.
#
# A HAMMER'S HEAVY IS 6x (wiki's per-weapon-type table), delivered as Crushing
# Ruin's two-move pair: 600% Lifted, then 600% Knockdown. Both are 6x, which is
# the table's "First Heavy Attack 6x / Second Heavy Attack 6x" — the stance
# decides the animation and the forced procs, not the multiplier.
#
# THE COMBO COUNTER IS SPENT HERE, so this mode is a different BUILD and not a
# different animation: Blood Rush and Weeping Wounds read a counter that is
# emptied by the swing that read it, and initial combo is worth everything.
#
# THE CADENCE IS THE CHARGE, THE SWING AND THE WAIT: 0.4 s and 0.8 s at 1.0x,
# then however long the counter is worth waiting for —
# `fight::heavy_cycle_seconds`, the same decision the heavy slam makes.
inherits: magistar
form: heavy
transform_group: magistar
co_behavior: additive_with_base_damage
unmodeled:
  - reason: heavy_charge_share_assumed
    published: 1.2
    charge: 0.4
    swing: 0.8
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 0.833
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.1
  punch_through_m: 0.0
  range_m: 2.5
  follow_through: 0.4
  # see notes: class_s_heavy_attack
  heavy: { multiplier: 6.0, windup_seconds: 0.4 }
  spends_combo: true
  damage: { impact: 168, puncture: 31.5, slash: 10.5 }
  # THE WIND-UP IS ON THE SWING, not on the attack: the attack-level field is a
  # one-off delay before the fight's first shot, and a heavy attack pays its
  # charge before EVERY swing.
  # see notes: tonfa_heavy_timing
  # see notes: combo_points_from_multiplier
  combo_script:
    - { multiplier: 6.0, windup_seconds: 0.4, delay_seconds: 0.8, forced_procs: [lifted], combo_points: 0, combo_points_base: 0 }
    - { multiplier: 6.0, windup_seconds: 0.4, delay_seconds: 0.8, forced_procs: [knockdown], combo_points: 0, combo_points_base: 0 }
source:
  url: https://wiki.warframe.com/w/Magistar
