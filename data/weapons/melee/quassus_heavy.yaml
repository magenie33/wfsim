unmodeled:
- The package gives the two heavy animations but no projectile release event. Each volley is released halfway through its
  animation; exact release timing is unmeasured.
- The horizontal projectile fan and per-dagger deviation are not published. Every projectile follows the aimed ray, so a distant
  target can take more daggers than in game.
- A separate close-range fan strike is not modelled.
- Xaku's accuracy bonus and occasional merging of dagger hits and their Slash procs are not modelled.
