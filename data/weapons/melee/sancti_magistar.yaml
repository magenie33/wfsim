# see notes: combo_points_from_multiplier
# see notes: melee_shared_package_actions
id: sancti_magistar
name: Sancti Magistar
slot: melee
weapon_type: melee
class: hammer
# THE STATIONARY COMBO, and the arsenal's own form — so its mode is `base`.
form: neutral
default_form: true
transform_group: sancti_magistar
mod_pools: [melee, hammer]
mastery_rank: 8
max_rank: 30

# THE SYNDICATE MAGISTAR — the same hammer, swung the same seven ways, with
# every number a step up: 240 base against 210, 30% critical chance against 20%,
# 20% status against 10%, and 1.0 attack speed against 0.833. Its mastery
# rank pays for that.
#
# THE SEVEN ENTRIES ARE THE MAGISTAR'S SEVEN, and they must stay that way: the
# stance scripts are Crushing Ruin's, which is a HAMMER stance and knows nothing
# about which hammer swings it. What differs is the weapon's own numbers.
#
# ITS TWO PERKS BOTH HEAL OR DEFEND, and this arena has neither to spend them
# on — declared below rather than omitted, because a reader comparing the two
# hammers will look for exactly them.
#
# THE RADIAL FIGURES ARE WHAT A BODY TAKES: 480 on a slam and 720 on a heavy
# slam, 2x and 3x this weapon's own base, which is the class constant the wiki
# states and MEASUREMENTS M69 confirms on the Magistar. The export's larger
# `slamAttack` / `heavySlamAttack` pair is a different number for the same
# attack and is not it.
accuracy: ~
riven_family: Magistar      # module `Family` — SHARED with the Magistar
disposition: 1.2
polarities: [madurai]
# THE STANCE SLOT'S OWN POLARITY, and it decides a capacity GRANT rather than a
# discount: 10 on a matching slot, 5 on a bare one, 4 on the wrong colour
# (`rules::capacity::stance_capacity`). Vazarin, so Shattering Storm grants 10 here and
# Crushing Ruin grants 4 until a Forma says otherwise.
stance_polarity: vazarin
introduced: "Update: The Silver Grove 2.0"
internal_name: /Lotus/Weapons/Syndicates/NewLoka/Melee/NLMagistar
traits: [new_loka, syndicate]

# NO AMMO AT ALL. A melee weapon has no magazine, no reserve and no reload, so
# the loop tops it up silently and `Capability::HasReserve` is false for it the
# way it is for a companion weapon — a different reason, the same absence.
ammo_max: ~

# SECONDS THE COMBO COUNTER SURVIVES untouched. Five is this weapon's, and the
# wiki names the handful that differ rather than stating a default.
combo_duration_seconds: 5.0

# No CO catalog row for any of this weapon's attacks, so the ordinary class.
# ABSENCE MEANS ORDINARY — and it was checked against the PAGE, not against
# docs/CATALOGS.md, which by construction holds only rows the roster already
# has.
co_behavior: additive_with_base_damage

unmodeled:
- A heavy attack grants every attack 5% life steal plus 5% per combo level, permanently, shared with allies within 15 m. Nothing damages the Tenno here and there
  are no allies, so it adds nothing.
- A 20% chance to resist a status effect while held protects the wielder; nothing shoots back here.
- 'Power Spike''s partial combo decay is a Warframe passive and is not modelled: the counter drops to zero when its timer runs out, so with that passive the number
  reads low.'
attack:
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.0
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.3
  crit_multiplier: 2.0
  status_chance: 0.2
  punch_through_m: 0.0
  range_m: 2.6
  follow_through: 0.4
  heavy:
