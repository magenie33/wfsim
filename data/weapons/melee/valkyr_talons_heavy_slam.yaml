id: valkyr_talons_heavy_slam
name: Valkyr Talons
# NOTHING BUT HEAVY SLAMS. The module's Heavy Slam Attack: 750 Blast (3x the
# 250 swing) in a 7 m sphere, linear falloff to 70% at the edge, forced Lifted.
# The sphere is centred on the wielder (`blast_kind: slam`).
inherits: valkyr_talons
form: heavy_slam
transform_group: valkyr_talons
co_behavior: additive_with_base_damage
unmodeled:
  - "THE CLIMB IS NOT CHARGED: this loop takes the 150% radius a slam dropped from 15 m gets, and the seconds spent getting up there are free. A player who hops instead trades that radius back down towards the 2.5 m / listed radius floor, and this arena has no vertical axis to tell the two apart"
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.5
  crit_multiplier: 2.0
  status_chance: 0.1
  punch_through_m: 0.0
  range_m: 2.15
  # NO FOLLOW THROUGH ON A SLAM: its damage is the radial.
  heavy: { multiplier: 5.0, windup_seconds: 0.5 }
  spends_combo: true
  damage: { impact: 0.0 }
  radial:
    damage: { blast: 750 }
    radius_m: 7.0
    blast_kind: slam
    status_chance: 0.1
    falloff_start_m: 0.0
    falloff_reduction: 0.3
    forced_procs: []
    takes_multishot: false
  # "Heavy slams do not have any wind up" (W`Melee`). TWO SECONDS IS THE SAME
  # STAND-IN for the landing recovery every heavy slam in the roster carries,
  # declared in docs/MELEE.md until it is measured.
  combo_script:
    - { multiplier: 1.0, delay_seconds: 2.0, forced_procs: [lifted] }

source:
  url: https://wiki.warframe.com/w/Valkyr_Talons
