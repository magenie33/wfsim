id: valkyr_talons_forward
name: Valkyr Talons
# RAGE — 1.7 s at 1.0x, four inputs of 0.425 s, ending on a Slash spin.
inherits: valkyr_talons
form: forward
transform_group: valkyr_talons
co_behavior: additive_with_base_damage
attack:
  # see notes: swing_trigger_pull_engine
  trigger: melee
  shot_type: hit_scan
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 0
  no_magazine: true
  crit_chance: 0.5
  crit_multiplier: 2.0
  status_chance: 0.1
  punch_through_m: 0.0
  range_m: 2.15
  follow_through: 1.0
  heavy: { multiplier: 5.0, windup_seconds: 0.5 }
  damage: { puncture: 62.5, slash: 187.5 }   # total 250
  slam:
    damage: { puncture: 62.5, slash: 187.5 }
    radius_m: 6.0
    blast_kind: slam
    status_chance: 0.1
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    forced_procs: []
    takes_multishot: false
  # see notes: combo_clock_is_the_input
  combo_script:
    - { multiplier: 1.0, delay_seconds: 0.425 }
    - { multiplier: 2.0, delay_seconds: 0.425 }
    - { multiplier: 2.0, delay_seconds: 0.425 }
    - { multiplier: 3.0, delay_seconds: 0.425, all_around: true, forced_procs: [slash] }

source:
  url: https://wiki.warframe.com/w/Hysteria_(Stance)
