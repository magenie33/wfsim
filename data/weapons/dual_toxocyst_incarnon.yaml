id: dual_toxocyst_incarnon
name: Dual Toxocyst (Incarnon Form)
slot: secondary
class: dual_pistols

# TWO WEAPONS MODEL: this is the second weapon of the transform group -
# see data/weapons/dual_toxocyst.yaml for the base form and the decision.
transform_group: dual_toxocyst
transforms_from: dual_toxocyst

# The Incarnon transformation economy (wiki Dual_Toxocyst_Incarnon_Genesis).
# The presence of this block is what identifies an Incarnon weapon.
incarnon:
  install_cost: { pathos_clamps: 20, yao_shrubs: 70, eevani: 80 }
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 9
    rounds_per_charge: 30
    max_rounds: 270
    charge_rules:
      - Individual multishot bullets each build charge.
      - MOA-backpack-style weakspots do NOT build charge, nor do Sonar /
        Detect Vulnerability spots outside real weakpoints (a per-body-part
        charges_incarnon distinction).
      - Weakpoints on corpses or invulnerable targets build nothing.
  transmute:
    activation: alt_fire            # full gauge NOT required
    animation_seconds: reload_speed # mode switch takes the reload time
    revert: on_incarnon_ammo_empty
    switch_back_penalty: expends all remaining charge
  incarnon_magazine:
    # CAUSAL MODEL (user, 2026-07-24): the Incarnon form's rounds are
    # CHARGE-BACKED - a separate resource converted from weakpoint charges,
    # entirely outside the ammo economy. That is WHY ammo efficiency,
    # magazine mods, and ammo pickups are all inert here: they operate on
    # the ammo system, and this magazine never touches it. Not an
    # exception - a different currency.
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true   # Energized Munitions does nothing
  persistence:
    survives: [holster, bleedout, disarm]
    cleared_on: [death]
  side_effect: swapping either way fully reloads the normal form's magazine
  # Transition animations (M9): both directions scale by the OFFICIAL
  # reload formula (wiki Reload: time = base / (1 + reload speed bonus)).
  #   transmute IN  = the weapon's reload time (2.35 s unmodded)
  #   revert OUT    = ~1.0 s base (user ESTIMATE - measured 1.3 s under
  #                   -30% reload speed; the formula strictly implies
  #                   0.91 s; precise re-measurement deferred)
  transmute_in_seconds: 2.35     # = base reload time, unmodded
  revert_out_seconds: 1.0        # estimate, unmodded

# SIM CONVENIENCE (user, 2026-07-24): with the gauge LOCKED full (analogous
# to buff locks), the Incarnon combat cycle reduces to a standard
# magazine/reload model - usable by the plain sim machinery long before the
# full charge economy is cycled:
pseudo_reload:
  magazine: 270
  reload_seconds: 3.35   # revert (1.0) + re-transmute (2.35), unmodded
  note: excludes charge-rebuilding time (assumed locked); both components
    scale with reload-speed bonuses

# Single attack profile: full-auto hitscan with innate ricochet.
attack:
  trigger: auto
  # DISPUTED (2026-07-24): the wiki data module and the Ricochet page
  # (ricochet = hitscan-only, DT listed) imply hitscan, but the CO
  # mechanic catalog classifies DT Incarnon Mode as Projectile. Needs
  # an in-game check (travel time / falloff observation).
  shot_type: hitscan
  ricochet:
    targets: 1                  # per hit, within 5 m of the struck enemy
    range_m: 5.0
    notes:
      - Ricochets can headshot and trigger Frenzy.
      - Per-hit trigger (wiki Ricochet): each multishot pellet and each
        punch-through victim ricochets separately; terrain never, corpses
        do; ragdolled enemies cannot be ricochet targets.
      - Ricochet rounds scale with Galvanized Shot and the EVO2 perks'
        flat base damage.
  fire_rate: 4.5
  multishot: 1.0
  ammo_cost: 1                  # of the separate incarnon magazine (270)
  crit_chance: 0.11
  crit_multiplier: 3.0
  status_chance: 0.43
  punch_through_m: 0.0
  range_m: 1000
  spread_deg: { min: 0.50, max: 12.00 }
  damage: { impact: 15.0, puncture: 37.5, slash: 22.5 }   # total 75

# CONFIRMED (user, 2026-07-24): the Frenzy passive EXISTS in the Incarnon
# Form too - the buff persists across transforms and headshots keep
# triggering it while transformed (fire rate x2.5, ammo efficiency - inert
# on the charge-backed magazine - and the +100% Toxin injection).
perks:
  - frenzy

incarnon_evolutions: see data/weapons/dual_toxocyst.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Module:Weapons/data/secondary
  note: Stats from the wiki's structured Lua data module; economy from the
    Incarnon Genesis page.
  retrieved: "2026-07-24"
