id: athodai_prime_alt
name: Athodai Prime
# Continuous beam-burst dump (`WeaponBeamBurstStateBehavior` + `WeaponBeamFireBehavior`
# + `WeaponBeamImpactBehavior`): empties the magazine at 12 ticks/s, merging multishot
# per tick with 20% -> 100% per-target ramp over 0.6 s, 2 m terrain punch-through,
# and free enemy body pierce (`PunchthroughIgnoresAvatars = 1`).
inherits: athodai_prime
form: alt_fire
transform_group: athodai_prime

introduced: "43"

# see notes: inherited_co_catalog_gives
co_behavior: additive_with_base_damage

# THE HEAD IS WORTH 1x: "Athodai (Athodai Prime)'s Alternate Fire" is in
# wiki `Enemy_Body_Parts`'s list of weapons "always defaulting to the 1x
# multiplier". The weapon's own page does not say it.
headshot_multiplier: 1.0
beam_ramp_floor: 0.2

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: held
  beam_ramp:
    rise_seconds: 0.6
    cooldown_delay_seconds: 0.8
    cooldown_divisor: 2.0
    per_target: true
  shot_type: hit_scan
  fire_rate: 12
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2.5
  status_chance: 0.35
  punch_through_m: 2.0
  infinite_body_punch_through: true
  # Client `TraceRadius = 2.0` sweeps a 4.0 m diameter capsule (`0xbfe970`).
  projectile_width_m: 4.0
  # Client `traceDistance = 16` on `PrimeAthodaiPistolWeapon` `Behaviors[1]`.
  range_m: 16.0
  damage: { heat: 100 }   # total 100

source:
  url: https://wiki.warframe.com/w/Athodai_Prime

# see notes: client_secondary_calibration
