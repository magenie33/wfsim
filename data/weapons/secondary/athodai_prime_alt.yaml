id: athodai_prime_alt
name: Athodai Prime
# THE CONE: 100 Heat a round at twelve a second, two metres of punch through,
# sixteen metres of reach.
inherits: athodai_prime
form: alt_fire
transform_group: athodai_prime

introduced: "43"

# see notes: inherited_co_catalog_gives
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: burst
  # THE BURST COUNT IS THE MAGAZINE, which is the one thing this entry cannot
  # say properly: `count` is a constant and the real number is however many
  # rounds are left. 24 is the UNMODDED magazine — the same call the Tenet
  # Detron's magazine dump makes, and admitted below.
  burst:
    count: 24
    delay_seconds: 0.0       # module BurstDelay
  shot_type: hit_scan
  fire_rate: 12
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2.5
  status_chance: 0.35
  punch_through_m: 2.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 16.0 m" on this attack.
  range_m: 16.0
  damage: { heat: 100 }   # total 100

unmodeled:
  - "the burst empties the MAGAZINE and this entry fires a fixed count — the unmodded magazine. The page states that magazine mods lengthen it, so a build carrying one is understated here"
  - "the cone is 2 METRES THICK (wiki), which is a hit volume this arena's ray has no width for"

source:
  url: https://wiki.warframe.com/w/Athodai_Prime
