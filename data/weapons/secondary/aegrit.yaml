id: aegrit
name: Aegrit
slot: secondary
weapon_type: secondary
# A STICKY MINE WORTH 797 BLAST IN NINE METRES — the largest explosion in the
# secondary roster, off a direct hit worth nine. Everything about it is the
# detonation, and the detonation is a second trigger this sim does not have.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]   # CompatibilityTags PROJECTILE, THROWN, AOE
mastery_rank: 11
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 100.0
disposition: 1.2
polarities: [madurai, madurai, madurai]
exilus_polarity: naramon
riven_family: Aegrit
traits: [grineer]
introduced: "32"
internal_name: /Lotus/Weapons/Grineer/ThrowingWeapons/GrnVorStickyBomb/GrnVorStickyBomb
noise: silent
ammo_type: secondary
ammo_max: 4
ammo_pickup: 1
magazine: 2
reload_seconds: 1.3

# see notes: condition_overload_catalog_names
#
#   Aegrit | Direct Hit | Projectile | 9 | 9 | 100% | Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

attack:
  extra_hit_reads: even   # see notes: extra_hit_reads
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  # see notes: module_says_active_grenade
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 30
  fire_rate: 2
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.37
  crit_multiplier: 1.9
  status_chance: 0.19
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on the direct-hit block — the 9.0 m below is the
  # explosion's RADIUS and not a reach. See data/surveys/weapon_range.yaml.
  damage: { impact: 4.5, puncture: 1.8, slash: 2.7 }   # total 9
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    extra_hit_reads: even   # see notes: extra_hit_reads
    radius_m: 9.0
    falloff_start_m: 0.0
    falloff_reduction: 0.7
    crit_chance: 0.37
    crit_multiplier: 2.0
    status_chance: 0.19
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 797 }   # total 797

unmodeled:
  - "The mines are detonated by hand with the alt-fire, up to four at a time (wiki). The sim detonates each on landing: the ceiling for one mine. Sticking four and detonating them together is not modelled."
  - "Mines stick to surfaces, enemies and allies, and multishot throws them in a very wide horizontal spread (wiki), so on this weapon multishot covers ground rather than adding damage to one target."
  - reason: explosion_ignores_cover
  - reason: self_stagger
  - reason: silent_weapon

source:
  url: https://wiki.warframe.com/w/Aegrit
