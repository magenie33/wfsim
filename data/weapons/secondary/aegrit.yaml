id: aegrit
name: Aegrit
slot: secondary
# A STICKY MINE WORTH 797 BLAST IN NINE METRES — the largest explosion in the
# secondary roster, off a direct hit worth nine. Everything about it is the
# detonation, and the detonation is a second trigger this sim does not have.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]   # CompatibilityTags PROJECTILE, THROWN, AOE
mastery_rank: 11
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 100.0
disposition: 1              # riven disposition
polarities: [madurai, madurai, madurai]
exilus_polarity: naramon
riven_family: Aegrit
traits: [grineer]
introduced: "32"
internal_name: /Lotus/Weapons/Grineer/ThrowingWeapons/GrnVorStickyBomb/GrnVorStickyBomb
noise: silent
ammo_type: secondary
ammo_max: 4
ammo_pickup: 1
magazine: 2
reload_seconds: 1.3

# Condition Overload: THE CATALOG NAMES THIS ATTACK. Verbatim
# (docs/CATALOGS.md §1):
#
#   Aegrit | Direct Hit | Projectile | 9 | 9 | 100% | Multiplying
#
# THIS ENTRY READ ADDING AT 100% UNTIL 2026-08-20, which was the
# ordinary class assumed because nobody had opened the catalog for this
# weapon — the check was run against our own transcription of it, which
# only ever carried the rows the roster already had.
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 0.0
  # THE MODULE SAYS `Active` — a grenade DETONATED BY HAND. This engine
  # has one trigger, so the shot is semi-auto and the blast lands where it
  # falls; what a second trigger buys is in `unmodeled:`.
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 30
  fire_rate: 2
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.37
  crit_multiplier: 1.9
  status_chance: 0.19
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on the direct-hit block — the 9.0 m below is the
  # explosion's RADIUS and not a reach. See data/surveys/weapon_range.yaml.
  damage: { impact: 4.5, puncture: 1.8, slash: 2.7 }   # total 9
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 9.0
    falloff_start_m: 0.0
    falloff_reduction: 0.7
    crit_chance: 0.37
    crit_multiplier: 2.0
    status_chance: 0.19
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 797 }   # total 797

unmodeled:
  - "the mines are DETONATED BY HAND via Alternate Fire, and up to four can be ready at once (wiki). This sim detonates each one the moment it lands, which is the ceiling for a single mine and misses the play pattern entirely: the weapon exists to stick four mines and fire them together"
  - "mines STICK to surfaces, enemies and allies, and multishot throws them in 'a very wide horizontal spread' (wiki) — so on this weapon multishot covers ground rather than stacking damage on one target, which is the opposite of what it does everywhere else"
  - reason: explosion_ignores_cover
  - reason: self_stagger
  - reason: silent_weapon

source:
  url: https://wiki.warframe.com/w/Aegrit
