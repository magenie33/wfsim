id: sicarus_prime
name: Sicarus Prime
slot: secondary
class: pistol
form: base
default_form: true
mod_pools: [pistol]
mastery_rank: 14
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: sicarus_prime
transforms_to: sicarus_prime_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
accuracy: 25
disposition: 1.15
polarities: [madurai]
exilus_polarity: naramon
riven_family: Sicarus
traits: [incarnon, prime]
introduced: "Update 11.0"
internal_name: /Lotus/Weapons/Tenno/Pistols/PrimeSicarus/PrimeSicarusPistol
noise: alarming
ammo_type: secondary
ammo_max: 210
ammo_pickup: 40
magazine: 24
reload_seconds: 2

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 8
  trigger: burst
  # THE BURST. The listed `fire_rate` counts PULLS, not rounds — so reading it
  # as rounds per second understates this weapon by its burst count. Both
  # numbers are the wiki's (Sicarus Prime: Burst Count 3, Burst Delay 0.0400 s).
  burst:
    count: 3
    delay_seconds: 0.04
  shot_type: hit_scan
  fire_rate: 5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2
  status_chance: 0.2
  punch_through_m: 0.0
  damage: { impact: 20, slash: 15, puncture: 15 }   # total 50

# incarnon_evolutions: definitions live in data/evolutions/sicarus_prime_*.yaml.

source:
  url: https://wiki.warframe.com/w/Sicarus_Prime
