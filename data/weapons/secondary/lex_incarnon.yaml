id: lex_incarnon
name: Lex (Incarnon Form)
slot: secondary
weapon_type: secondary
class: pistol
form: incarnon

transform_group: lex
transforms_from: lex

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 10
    rounds_per_charge: 2
    max_rounds: 20
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  # see notes: incarnon_package_transition_time
  transmute_in_seconds: 1.4
  transmute_out_seconds: 0.6

pseudo_reload:
  magazine: 20

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

# see notes: head_worth_1x_incarnon_form
headshot_multiplier: 1.0

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.5
    max_deg: 12.0
    sampling:
      horizontal_ratio: 0.5
      uniform: false
      hip_min_deg: 6.5
      hip_max_deg: 18.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 0.666666666666667
  multishot: 1.0
  ammo_cost: 1                  # of the 20-round charge pool
  crit_chance: 0.3
  crit_multiplier: 3
  status_chance: 0.4
  # The page's own list names it: "Lex (Incarnon Form)".
  # see notes: infinite_body_punch_through
  punch_through_m: 1.4
  infinite_body_punch_through: true
  # Flight reach is independent of the damage-falloff interval.
  # wiki, Incarnon Form: "Range: 28 meters (affected by Projectile Speed)", Projectile
  range_m: 28.0
  falloff:
    start_m: 10.0
    end_m: 20.0
    reduction: 0.62
  damage: { impact: 300, radiation: 700 }   # total 1000

# incarnon_evolutions: see data/weapons/secondary/lex.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Lex_Incarnon_Genesis
  # wiki module Attacks[].AttackName: "Incarnon Form"

unmodeled:
  - reason: client_projectile_collision
  - reason: client_accuracy_runtime

# see notes: client_secondary_calibration
