id: sepulcrum
name: Sepulcrum
slot: secondary
# A BURST PISTOL WHOSE ROUNDS CARRY A 1.6 M BLAST, and a lock-on mode that
# paints several targets and fires homing missiles at them.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: sepulcrum
mod_pools: [pistol]   # CompatibilityTags AOE
mastery_rank: 14
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 22.2
disposition: 1.1            # riven disposition
polarities: []               # the infobox states none
exilus_polarity: madurai
riven_family: Sepulcrum
traits: [entrati]
introduced: "29"
internal_name: /Lotus/Weapons/Thanotech/ThanoPistol/ThanotechPistol
noise: alarming
ammo_type: secondary
ammo_max: 180
ammo_pickup: 20
magazine: 90
reload_seconds: 4

# Condition Overload: THE CATALOG NAMES THIS ATTACK. Verbatim
# (docs/CATALOGS.md §1):
#
#   Sepulcrum | Primary-Fire | Projectile | 48 | 48 | 100% | Multiplying
#
# THIS ENTRY READ ADDING AT 100% UNTIL 2026-08-20, which was the
# ordinary class assumed because nobody had opened the catalog for this
# weapon — the check was run against our own transcription of it, which
# only ever carried the rows the roster already had.
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 1.0
    max_deg: 8.0
  trigger: auto
  # THE BURST. The listed `fire_rate` counts BURSTS: one pull is 2 rounds
  # spaced by the delay below.
  burst:
    count: 2
    delay_seconds: 0.0       # module BurstDelay
  shot_type: projectile
  projectile_speed_mps: 200
  fire_rate: 1.83
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.3
  crit_multiplier: 2.2
  status_chance: 0.14
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { impact: 9.6, puncture: 26.88, slash: 11.52 }   # total 48
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 1.6
    falloff_start_m: 0.0
    falloff_reduction: 0.2
    crit_chance: 0.3
    crit_multiplier: 2.2
    status_chance: 0.14
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { heat: 46 }   # total 46

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Sepulcrum
