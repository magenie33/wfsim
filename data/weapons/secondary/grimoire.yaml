id: grimoire
name: Grimoire
slot: secondary
# A TOME, which is its own weapon class in DE's data and the only one in this
# roster. It throws a 100-Electricity page with a one-metre blast, and its
# ACTIVE attack is three and a half times that in six metres.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: grimoire
mod_pools: []   # CompatibilityTags PROJECTILE, THROWN
mastery_rank: 10
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items, which DISAGREES on one field:
# a Tome does not reload; WFCD's 0.01 s is a floor. The wiki wins (data/README.md), and
# `scripts/audit_weapon_stats.py` carries the divergence with its reason
# so it cannot be mistaken for a transcription error.
accuracy: 100.0
disposition: 0.6            # riven disposition
polarities: [madurai, naramon]
# NO EXILUS POLARITY — the module states none.
riven_family: Grimoire
traits: [entrati]
introduced: "35"
internal_name: /Lotus/Weapons/Tenno/Grimoire/TnGrimoire
noise: alarming
ammo_type: secondary
ammo_max: 0
ammo_pickup: 10
# THE MODULE GIVES THIS WEAPON A MAGAZINE OF ZERO, which is a fact about a
# Tome — it has no clip and no reload in the sense every gun here does. The
# sim cannot fire a magazine of zero, so this states ONE: every attack is
# its own 'magazine' and the reload below is the cadence the module gives.
# Written down because it is the only number in this entry that is not the
# module's own (2026-08-20).
magazine: 1
reload_seconds: 0

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20)
# — ordinary Additive at the full +100%. The catalog gives a class PER
# ATTACK and none of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 40
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.26
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { electricity: 100 }   # total 100
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 1.0
    falloff_start_m: 0.0
    falloff_reduction: 0.8
    crit_chance: 0.2
    crit_multiplier: 2.0
    status_chance: 0.26
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { electricity: 50 }   # total 50

unmodeled:
  - "A TOME'S MOD POOL IS ITS OWN and this roster does not load it — `mod_pools: []` here means the builder offers NOTHING, which is honest rather than offering pistol cards a Tome cannot wear. The weapon's numbers are right and no build can be put on it yet"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Grimoire
