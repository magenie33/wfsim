id: sepulcrum_lockon
name: Sepulcrum
# LOCK-ON MODE: homing missiles with a three-metre blast apiece.
inherits: sepulcrum
form: alt_fire
transform_group: sepulcrum
transforms_from: sepulcrum

introduced: "29"

# see notes: condition_overload_catalog_names
#
#   Sepulcrum | Lock-On Mode | Projectile | 96 | 96 | 100% | Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

gauge_form:
  single_shot: true
  gauge:
    charge_on: kills
    charges_to_fill: 5
    max_rounds: 1
  transmute_in_seconds: 0.0
  transmute_out_seconds: 0.0

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 50.0
    max_deg: 60.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 60
  fire_rate: 1
  multishot: 1.0
  ammo_cost: 0
  crit_chance: 0.38
  crit_multiplier: 3.0
  status_chance: 0.26
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # see notes: no_range_row_attack
  damage: { impact: 19.2, puncture: 53.76, slash: 23.04 }   # total 96
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 3.0
    falloff_start_m: 0.0
    falloff_reduction: 0.2
    crit_chance: 0.38
    crit_multiplier: 3.0
    status_chance: 0.26
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { heat: 480 }   # total 480

unmodeled:
  - "Lock-on marks several targets and sends a missile at each (wiki); the engine fires at the aimed body only, so against a crowd the number reads low by the number marked."
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Sepulcrum
