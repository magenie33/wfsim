id: angstrum_incarnon
name: Angstrum (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: angstrum
transforms_from: angstrum

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner: "灵化部分可以粗略"): transcribed from the
# wiki's table, with every clause the intake's rule engine did not recognise
# loaded as a NAMED INERT effect that the builder and the optimizer both print
# as "not modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

incarnon:
  gauge:
    charge_on: direct_hits
    charges_to_fill: 3
    rounds_per_charge: 40
    max_rounds: 120
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2.5      # = base reload time, unmodded

pseudo_reload:
  magazine: 120
  reload_seconds: 3.5

# ORDINARY HERE, AND IT IS A QUESTION rather than an absence. The CO catalog
# lists this weapon's FAMILY among the Multiplying entries and names one attack
# — the rocket, which the base entry carries and sets `independent` for. This
# form is the other one, so the row does not reach it and the recorded rule
# applies: a CO anomaly is per-ENTRY and absence means ordinary.
#
# What makes it a question is the Felarx: asked directly, its answer was the
# same on BOTH modes (owner, 2026-08-08), so a family on that row may well be
# Multiplying throughout. One weapon is not a rule, and the difference is a
# free-standing multiplier against a bucket member — worth asking when this gun
# comes up in the per-gun pass rather than generalising from a neighbour.
co_behavior: additive_with_base_damage

attack:
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 6
  multishot: 1.0
  ammo_cost: 1                  # of the 120-round charge pool
  crit_chance: 0.18
  crit_multiplier: 1.8
  status_chance: 0.18
  punch_through_m: 0.0
  damage: { heat: 30 }   # total 30

# incarnon_evolutions: see data/weapons/secondary/angstrum.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Angstrum_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"
