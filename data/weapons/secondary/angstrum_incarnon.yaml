id: angstrum_incarnon
name: Angstrum (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: angstrum
transforms_from: angstrum

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: direct_hits
    charges_to_fill: 3
    rounds_per_charge: 40
    max_rounds: 120
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2.5      # = base reload time, unmodded

pseudo_reload:
  magazine: 120
  reload_seconds: 3.5

# CONDITION OVERLOAD IS INDEPENDENT ON THIS FORM, and the catalog names it:
#
#   {{Weapon|Angstrum}}/{{Weapon|Prisma Angstrum}}||Incarnon Mode||Projectile||30||30||100%||Multiplying
#
# Multiplying, at 100% of the base — so the bonus is a free-standing final
# multiplier rather than a member of the base-damage bucket, and no fraction is
# lost to it.
#
# One row for two variants, keyed `{{Weapon|A}}/{{Weapon|B}}`, which is the
# lookup habit the Zylok cost us once already: searching either name alone finds
# a row that looks like it belongs to the other.
co_behavior: independent

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 6
  multishot: 1.0
  ammo_cost: 1                  # of the 120-round charge pool
  crit_chance: 0.18
  crit_multiplier: 1.8
  status_chance: 0.18
  punch_through_m: 0.0
  damage: { heat: 30 }   # total 30

# incarnon_evolutions: see data/weapons/secondary/angstrum.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Angstrum_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"

