id: gammacor
name: Gammacor
slot: secondary
class: pistol
form: base
default_form: true
mod_pools: [pistol]
mastery_rank: 2
max_rank: 30

# TWO WEAPONS MODEL: base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: gammacor
transforms_to: gammacor_incarnon

# BULK INTAKE. The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half: transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
accuracy: 100
disposition: 1.15
polarities: [vazarin]
exilus_polarity: madurai
riven_family: Gammacor
traits: [incarnon]
introduced: "Update 15.5"
internal_name: /Lotus/Weapons/Syndicates/CephalonSuda/Pistols/CSDroidArray
noise: alarming
ammo_type: secondary
ammo_max: 240
ammo_pickup: 40
magazine: 60
reload_seconds: 1.4

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: held
  shot_type: hit_scan
  fire_rate: 12
  multishot: 1.0
  # HALF A ROUND A TICK, which is what every beam in the module costs.
  ammo_cost: 0.5
  crit_chance: 0.08
  crit_multiplier: 1.8
  status_chance: 0.2
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 25.0 m"
  range_m: 25.0
  damage: { magnetic: 16 }   # total 16

# incarnon_evolutions: definitions live in data/evolutions/gammacor_*.yaml.

source:
  url: https://wiki.warframe.com/w/Gammacor
