# Tombfinger, as a SECONDARY — one chamber, two roster entries;
# data/kitguns/README.md says why the slot is the weapon.
#
# see notes: kitgun_entry_is_default_assembly
id: tombfinger_secondary
name: Tombfinger
wiki_name: Tombfinger
slot: secondary
class: pistol
form: base
default_form: true
mod_pools: [pistol]
mastery_rank: 0
max_rank: 30

# THE CHAMBER PART DE SHIPS, and the join key to every external dataset.
# BOTH SLOT ENTRIES CARRY IT: a Catchmoon is one chamber, and which slot a
# grip puts it in is ours to model, not a second item to trade.
internal_name: /Lotus/Weapons/SolarisUnited/Secondary/SUModularSecondarySet1/Barrel/SUModularSecondaryBarrelBPart
kitgun: tombfinger_secondary

transform_group: tombfinger_secondary

# ONE RIVEN FITS BOTH SLOTS — DE's weekly trade dump lists `Tombfinger` with no
# slot suffix — but the DISPOSITION does not: 0.85 here where the primary gets
# 1.0, so the same riven reads differently depending on which grip is on it.
# see notes: kitgun_disposition_source
disposition: 0.85
riven_family: Tombfinger

polarities: []
exilus_polarity: madurai
introduced: "24.2"
noise: alarming
ammo_type: secondary
ammo_max: 210
ammo_pickup: 20
accuracy: 50

magazine: 29
reload_seconds: 2.1

#   Tombfinger (Secondary) | Normal Attack | Projectile | 18 | 18 | 100% | Multiplying
co_behavior: independent

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 1
    max_deg: 3
  trigger: semi_auto
  shot_type: projectile
  fire_rate: 2.83
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.24
  crit_multiplier: 2
  status_chance: 0.24
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC on the direct hit — "dealing Impact, Puncture and
  # Radiation damage with a guaranteed Impact proc" (wiki Tombfinger, verbatim),
  # and the infobox module's `ForcedProcs`; Module:Modular/data omits it.
  forced_procs: [impact]
  # THE DIRECT HIT IS WHAT THE EXPLOSION LEAVES. "The Impact, Puncture and
  # ~19.5% of the Radiation damage make up the direct hit, the remaining ~80.5%
  # of Radiation damage is assigned to the explosion" — so 19.5% of Ulnaris's
  # 69.67 Radiation stays here and the rest is below. It is CARVED, not added:
  # the two halves add back to the grip's own 100.
  damage: { impact: 18.67, puncture: 11.67, radiation: 13.58565 }

  # …AND THE OTHER 80.5%.
  radial:
    damage: { radiation: 56.08435 }
    radius_m: 1.9
    # A CONTACT blast: it goes off on the first thing it touches, which is what
    # "detonates upon the first enemy or surface hit" says, and therefore takes
    # no punch-through mods.
    blast_kind: contact
    # "Can benefit from Fulmination (Primed)" — the SECONDARY radius bucket.
    takes_blast_radius_mods: true
    # "Linear damage falloff from 100% to 70% from central impact": full damage
    # at the centre, 30% removed at the rim.
    falloff_start_m: 0.0
    falloff_reduction: 0.30
    # "The status chance remains the same for both the direct hit and the
    # explosion" — so it inherits, and is deliberately not restated.

unmodeled:
  - "the explosion is a REVERSE CONE — 'dealing damage to enemies in front of the original target' — and this arena gives a splash no facing, so it is modelled as a full 1.9 m sphere. That is the generous reading: against a crowd it reaches bodies the game would leave behind the target"
  - reason: projectile_must_be_led
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Tombfinger
  module: https://wiki.warframe.com/w/Module:Modular/data
