id: bronco_prime_incarnon
name: Bronco Prime (Incarnon Form)
slot: secondary
weapon_type: secondary
class: pistol
form: incarnon

transform_group: bronco_prime
transforms_from: bronco_prime

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 40
    rounds_per_charge: 1
    max_rounds: 20
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  # see notes: incarnon_package_transition_time
  transmute_in_seconds: 1.4
  transmute_out_seconds: 0.6

pseudo_reload:
  magazine: 20

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage


attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 18.0
    max_deg: 36.0
    sampling:
      horizontal_ratio: 0.5
      uniform: false
      hip_min_deg: 24.0
      hip_max_deg: 42.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 3
  # SEVEN PELLETS, like the base form. This entry read 1 until 2026-08-12, so
  # the Incarnon Bronco was dealing ONE SEVENTH of its shot.
  #
  # The wiki's infobox states it twice over — "Total Damage 238" beside
  # "Multishot 7 (34.00 damage per projectile)" — and the Condition Overload
  # catalog's "Attack Unmodded Damage" column carries the same 238, which is
  # what caught it: that column is the SHOT total, so `damage x multishot` has
  # to reproduce it (docs/CATALOGS.md).
  multishot: 7.0
  ammo_cost: 1                  # of the 20-round charge pool
  crit_chance: 0.24
  crit_multiplier: 3.2
  status_chance: 0.257142857142857
  punch_through_m: 0.0
  # see notes: falloff_feeds_the_riven_pool
  falloff:
    start_m: 18.0
    end_m: 36.0
    reduction: 0.617647045059
  # see notes: wall_ramp_full_damage_4
  range_m: 300.0
  damage: { impact: 27.2, slash: 3.4, puncture: 3.4 }   # total 34.0

# incarnon_evolutions: see data/weapons/secondary/bronco_prime.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Bronco_Incarnon_Genesis
  # wiki module `Attacks[].AttackName`: "Incarnon Form"

unmodeled:
  - reason: client_accuracy_runtime

# see notes: client_secondary_calibration
