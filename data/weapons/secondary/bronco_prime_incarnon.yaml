id: bronco_prime_incarnon
name: Bronco Prime (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: bronco_prime
transforms_from: bronco_prime

# BULK INTAKE. The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half: transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 40
    rounds_per_charge: 1
    max_rounds: 20
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2      # = base reload time, unmodded

pseudo_reload:
  magazine: 20
  reload_seconds: 3.0

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage


attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 18
    max_deg: 36
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 3
  # SEVEN PELLETS, like the base form. This entry read 1 until 2026-08-12, so
  # the Incarnon Bronco was dealing ONE SEVENTH of its shot.
  #
  # The wiki's infobox states it twice over — "Total Damage 238" beside
  # "Multishot 7 (34.00 damage per projectile)" — and the Condition Overload
  # catalog's "Attack Unmodded Damage" column carries the same 238, which is
  # what caught it: that column is the SHOT total, so `damage x multishot` has
  # to reproduce it (docs/CATALOGS.md).
  multishot: 7.0
  ammo_cost: 1                  # of the 20-round charge pool
  crit_chance: 0.24
  crit_multiplier: 3.2
  status_chance: 0.2571
  punch_through_m: 0.0
  # NOT MODELLED — the arena has no distance, so this weapon is
  # simulated at point blank. Recorded because the RIVEN pool reads
  # it: a hitscan weapon that lists a falloff still rolls Projectile
  # Speed, which scales the whole range (wiki `Projectile Speed`).
  falloff:
    start_m: 18
    end_m: 36
    reduction: 0.5588   # fraction KEPT past end_m
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, Incarnon Form: "Range: 300.0 m", Hit-Scan
  range_m: 300.0
  damage: { impact: 27.2, slash: 3.4, puncture: 3.4 }   # total 34.0

# incarnon_evolutions: see data/weapons/secondary/bronco_prime.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Bronco_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"

