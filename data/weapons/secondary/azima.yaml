id: azima
name: Azima
slot: secondary
# A SEVENTY-FIVE ROUND SLASH PISTOL whose alternate fire throws the WHOLE
# magazine into a deployed turret. The turret is a second weapon that fires
# itself, and this engine has no shape for one — see the admission.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]
mastery_rank: 6
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 22.2
disposition: 1.25           # riven disposition
polarities: [naramon, madurai]
exilus_polarity: madurai
riven_family: Azima
traits: [tenno]
introduced: "18.5"
internal_name: /Lotus/Weapons/Tenno/Pistols/SundialGun/SundialPistol
noise: alarming
ammo_type: secondary
ammo_max: 525
ammo_pickup: 40
magazine: 75
reload_seconds: 1.4

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 1.0
    max_deg: 8.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 10
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.16
  crit_multiplier: 2.0
  status_chance: 0.16
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  damage: { impact: 2, puncture: 5, slash: 13 }   # total 20

unmodeled:
  - "the ALTERNATE FIRE 'ejects the entire magazine into a single shot that spawns an automated turret that shoots enemies' (wiki), and the module gives that turret's expiry blast 75 Blast for the full 75 rounds. A deployed thing that picks its own targets and fires on its own clock is not a firing mode, and this engine has no shape for one — so the turret is not counted at all, and neither is the magazine it costs"

source:
  url: https://wiki.warframe.com/w/Azima
