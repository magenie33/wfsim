id: catabolyst
name: Catabolyst
slot: secondary
# A BEAM WITH A BLAST ON THE END OF IT, and the weapon whose reload is the
# point: it throws a grenade every time. ONE grenade, where the Coda throws
# three — that is the adversary variant's real addition.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]
mastery_rank: 11
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 6.3
disposition: 1.2             # riven disposition
polarities: [madurai]
exilus_polarity: madurai
riven_family: Catabolyst
traits: [infested]
introduced: "29.5"
internal_name: /Lotus/Weapons/Infested/Pistols/InfBeamPistol/InfBeamPistol
noise: alarming
ammo_type: secondary
ammo_max: 155
ammo_pickup: 20
magazine: 31
reload_seconds: 1.7
# "Reload from empty has an innate -20% Reload Speed buff applied to it's base
# reload time of 1.7 seconds, increasing the time it takes to reload to 2.125
# seconds. Bonus is additive with Quickdraw and similar bonuses."
reload_from_empty_speed: -0.2

# see notes: condition_overload_catalog_names
#
#   Catabolyst | Reload From Empty Impact | Projectile | 11 | 11 | 100% |
#   Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). The widest cone on
  # any beam in the roster, shared with the Coda.
  spread:
    min_deg: 9.0
    max_deg: 23.0
  trigger: held
  shot_type: hit_scan
  fire_rate: 12.0
  multishot: 1.0
  # "Consumes 0.5 ammo per tick of damage."
  ammo_cost: 0.5
  crit_chance: 0.11
  crit_multiplier: 2.9
  # 43%, where the Coda's beam carries 50% — one of the three numbers the
  # variant raised on the beam itself.
  status_chance: 0.43
  # INNATE 0.9 m, the same as the Coda's. Just under two body-thicknesses
  # (`space::BODY_MATERIAL_M`), so it reaches the second enemy in a line.
  punch_through_m: 0.9
  # "Has linear damage falloff from 100% to 1.88% from 9m to 19m target
  # distance" — the steepest in the roster, and it ends exactly where the beam
  # does. The module's 0.9811 is the exact figure behind that 1.88%.
  falloff:
    start_m: 9.0
    end_m: 19.0
    reduction: 0.9811
  damage: { corrosive: 53 }   # total 53

  # A BEAM THAT SPLASHES — "The zone of impact or maximum beam range has a
  # spherical blast radius of 0.7 meters, bringing up the total range to 19.7
  # meters before mods, allowing it to hit multiple enemies at once", and the
  # radial damage is not affected by multishot, which is what
  # `radius_takes_multishot: false` states. Identical to the Coda's.
  beam:
    range_m: 19.0
    damage_radius_m: 0.7
    radius_takes_multishot: false
    chain:
      hops: 0
      range_m: 0.0
      damage_per_hop: 0.0
      origin: radius_targets

  # THE RELOAD GRENADE — every reload throws the magazine, and a reload FROM
  # EMPTY throws the big one, which is the only reload this arena performs
  # (module attacks "Reload From Empty Impact" and "Reload From Empty
  # Explosion").
  # ONE grenade, where the Coda throws three.
  #
  # "Initial hit and explosion apply status separately", so the contact and the
  # blast are two instances. The blast falls off "from 100% to 50% from central
  # impact", takes no headshot, and its "Radius is not affected by Fulmination".
  reload_grenade:
    count: 1
    damage: { impact: 11 }
    crit_chance: 0.31
    crit_multiplier: 2.9
    status_chance: 0.59
    radial:
      damage: { corrosive: 1997 }
      radius_m: 7.0
      takes_blast_radius_mods: false
      crit_chance: 0.31
      crit_multiplier: 2.9
      status_chance: 0.59
      falloff_start_m: 0.0
      falloff_reduction: 0.5

# THE RAMP IS THE ENGINE'S OWN DEFAULT — "Damage ramps up from 20% to 100% over
# 0.6 seconds when firing. After firing stops for 0.8 seconds, the damage decays
# back to 20% over 2 seconds", which is BEAM_RAMP_SECONDS, BEAM_DECAY_DELAY and
# the 20% floor exactly.

unmodeled:
  - "the PARTIAL-reload grenade, a weaker attack thrown when the magazine is not empty: this arena reloads only when it cannot fire, so every throw it makes is the from-empty one"
  - "WHEN the throw lands: the page says the grenade is thrown mid-reload and has travel time, and states neither, so it lands at the instant the reload starts"
  - "the explosion's SELF-STAGGER, which costs the wielder time when the target stands inside the blast"
  - "Condition Overload on the grenade's 11 Impact contact — the CO catalog gives it a row, and the contact is half a percent of the throw"
  - "Galvanized Shot's bug on the grenade's direct hit (multiplicative with base damage, wiki `Catabolyst` Bugs)"
  - "interrupting the reload to throw again without reloading, the page's own exploit"
  - "this weapon will never reload on its own and must be reloaded manually — a habit cost this arena does not charge"

source:
  url: https://wiki.warframe.com/w/Catabolyst
