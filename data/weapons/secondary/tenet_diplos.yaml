id: tenet_diplos
name: Tenet Diplos
slot: secondary
# THE BRIEFCASE PISTOLS. Its alternate fire is the roster's first attack that is
# INHERENTLY multi-target — aiming locks onto up to 8 enemies and fires two
# seeking rounds at each — and that is exactly the part this arena cannot pick
# targets for. See the alt-fire entry.
class: dual_pistols
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]
transform_group: tenet_diplos
mastery_rank: 16
# see notes: rank_40_30_polarizing
max_rank: 40

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items, which DISAGREES on one field:
# WFCD holds an older DISPOSITION. The wiki wins (data/README.md), and
# `scripts/audit_weapon_stats.py` carries the divergence with its reason
# so it cannot be mistaken for a transcription error.
accuracy: 100.0
disposition: 0.75            # riven disposition
polarities: [madurai]
exilus_polarity: madurai
riven_family: Tenet Diplos
traits: [corpus, tenet]
introduced: "30.5"
internal_name: /Lotus/Weapons/Corpus/Pistols/CrpBriefcaseAkimbo/CrpBriefcaseAkimboPistol
noise: alarming
ammo_type: secondary
ammo_max: 460
ammo_pickup: 40
magazine: 92
reload_seconds: 2.8

# see notes: condition_overload_no_row_6
co_behavior: additive_with_base_damage

# THE PROGENITOR BONUS — verbatim: "Comes with an additional bonus Impact, Heat,
# Cold, Electricity, Toxin, Magnetic, or Radiation damage, based on the Sister's
# progenitor Warframe, which increases the listed base damage of the weapon by
# 25%-60%." An Impact progenitor merges into the 11.2 Impact this already deals;
# the other six arrive beside it.
valence:
  elements: [impact, heat, cold, electricity, toxin, magnetic, radiation]
  min: 0.25
  max: 0.60

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 50
  fire_rate: 9.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.36
  crit_multiplier: 2.2
  status_chance: 0.14
  # INNATE, and the punch-through page's own exception list names it: "Tenet
  # Diplos (1.0m)". Two body-thicknesses (`space::BODY_MATERIAL_M` is 0.5), so
  # it reaches the second enemy in a line. The LOCK-ON form has none.
  punch_through_m: 1.0
  # NO RANGE ROW on this attack — Projectile at 50 m/s, and the page states no
  # reach. The 60 m belongs to the Lock-on Mode block and is that mode's
  # acquisition range. See data/surveys/weapon_range.yaml.
  # "This weapon primarily deals Impact damage" — and the split says so.
  damage: { impact: 11.2, puncture: 9.0, slash: 7.8 }   # total 28

unmodeled:
  - reason: holstered_reload
    pct: 10
  - "the very heavy side-to-side recoil the page calls out, which is what makes the listed pinpoint accuracy \"only effective for the first shot\". Recoil is a hand-aim cost and this arena has no hand"

source:
  url: https://wiki.warframe.com/w/Tenet_Diplos
