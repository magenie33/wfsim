id: laetum_incarnon
name: Laetum (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

# **SECONDARY IRRADIATE'S ECHO IS DOUBLE HERE**, measured. The arcane deals `1.8 x the hit` at max rank and that is exactly what a
# pure single-target weapon deals — the owner measured several. This form deals
# 3.6x, and the BASE Laetum deals the ordinary 1.8x, which is why the field is
# on this entry and not on the weapon:
#
#   base form      1536 direct  ->  2764.8 echo  = 1.80x
#   Incarnon form   320 direct  ->  1152   echo  = 3.60x
#                   960 direct  ->  3456   echo  = 3.60x
#
# THE OWNER'S READING, and it is a hypothesis rather than a rule: the game sees
# TWO damage components on this attack — a direct hit and a radial — so it
# computes an echo for each, 1.8 + 1.8, while only the DIRECT one actually
# fires. That matches the other half of the same session's measurement: an AoE
# hit never triggers this echo at all, which this engine already had right
# (`spread_from_echo` is called from the direct path alone).
#
# SO THE NUMBER IS "ONE PER DAMAGE COMPONENT", not a magic 2 — and it stays a
# per-ENTRY figure until a second weapon is measured. Every direct+radial
# weapon in the roster is a candidate for the same doubling and none of them
# has been read; generalising a single measurement to a class is exactly what
# `docs/CATALOGS.md` forbids, and this comment is the note to come back to.
echo_multiplier: 2.0

# …AND THE READER IS TOLD, because the arcane's own card beside it prints DE's
# 180% and this entry pays 360%. A number that departs from the card it sits
# next to and says so nowhere is the shape of a bug report, and it was one. Not an `unmodeled:`
# line: that banner says the number below is a FLOOR, and this says the number
# is RIGHT and the reason is unknown.
live_bugs:
  - "Secondary Irradiate's echo is measured at 3.6x the hit on this form, not the 1.8x its card states and every pure single-target weapon delivers. The engine reproduces the measurement; nobody has explained it, and a hotfix could change it."

# TWO WEAPONS MODEL: second entry of the transform group — see
# data/weapons/secondary/laetum.yaml for the base form and the decision.
transform_group: laetum
transforms_from: laetum

# The Incarnon transformation economy (wiki Laetum). Zariman weapons carry
# the Genesis innately, so there is no install cost.
gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 12
    rounds_per_charge: 18
    max_rounds: 216
    # charge_rules:
    # - Each weakpoint hit grants 18 Incarnon rounds; 12 hits fill the
    # gauge to the 216-round cap.
    # - Individual multishot projectiles each build charge.
    # - A full gauge is NOT required to transmute.
  transmute:
    activation: alt_fire
    # VERBATIM (wiki Laetum): "Mode switching is not instantaneous and has
    # an animation equal to the weapon's reload speed." Read as the cost of
    # transmuting IN; the revert is a shorter putaway, and both scale by
    # the reload formula `base / (1 + reload bonus)`.
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    # Same CAUSAL MODEL as Dual Toxocyst: these rounds are CHARGE-BACKED,
    # converted from weakpoint charges and entirely outside the ammo
    # system — which is WHY magazine mods and ammo efficiency are inert.
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2.0      # = base reload time, unmodded (wiki)
  # 1 s is MEASURED on Dual Toxocyst (docs/MEASUREMENTS.md M9: the revert
  # has its own 1.0 s base, and both directions scale with reload speed).
  # Applying it to every weapon is the assumption, and it is deliberately
  # uniform - no weapon is special-cased until one is measured.

# SIM CONVENIENCE: with the gauge LOCKED full the Incarnon cycle reduces to
# a magazine/reload model the plain sim consumes directly.
pseudo_reload:
  magazine: 216
  reload_seconds: 3.0   # transmute out (1.0) + in (2.0), unmodded
  # note: excludes charge-rebuilding time (assumed locked); both components
  # scale with reload-speed bonuses

# Condition Overload behavior class — VERIFIED from the wiki CO catalog:
#   Laetum | Incarnon Form | Projectile | 100 | 100 | 100% | Adding
# Same class as the base entry, and the 100/100 = 100% column again means
# the full base feeds the bonus. CO boosts the DIRECT hit ONLY: the 300
# Radiation radial below is excluded (MECHANICS §2 and §7).
#
# The catalog's note — "CO-bonus multiplies properly with Devouring
# Attrition perk" — is a SUPPLEMENT, not a contradiction: Devouring is its
# own multiplicative bracket (the Laetum page calls it "multiplicative to
# base damage bonuses"), so it multiplies the already-CO-boosted damage.
# The engine composes them in that order.
co_behavior: additive_with_base_damage

# TWO ATTACK PARTS (wiki Laetum): "Shots deal pure Impact damage on direct
# hits, and Radiation damage in a 2 meter radius." The directly-hit enemy
# takes BOTH. "Initial hit and explosion apply status separately."
attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 50
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 40
  fire_rate: 6.67
  multishot: 1.0
  # see notes: read_engine_nothing_engine
  ammo_cost: 1                  # of the separate incarnon magazine (216)
  crit_chance: 0.22
  crit_multiplier: 2.2
  status_chance: 0.22
  punch_through_m: 0.0
  damage: { impact: 100.0 }
  # The radial (AoE) part — rules in MECHANICS §7: own crit/status stats,
  # 1x body-part multiplier (an explosion never headshots and never
  # charges the weakpoint gauge), no Condition Overload, linear falloff
  # to (1 - reduction) at the radius edge. Self-stagger only, never
  # self-damage.
  radial:
    damage: { radiation: 300.0 }
    radius_m: 2.0
    falloff_start_m: 0.0
    falloff_reduction: 0.2      # 300 at the centre -> 240 (80%) at 2 m
    crit_chance: 0.22
    crit_multiplier: 2.2
    status_chance: 0.22

# incarnon_evolutions: see data/weapons/secondary/laetum.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Laetum
  # note: Stats from the wiki page and the WFCD warframe-items dataset
  # (which lists the explosion as a separate "Auto Radial Attack" with
  # falloff {start 0, end 2, reduction 0.2}).

