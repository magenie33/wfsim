id: plinx
name: Plinx
slot: secondary
# ONE ATTACK, AND NO MAGAZINE-EATING SLUG. The Tenet Plinx's charged alternate
# fire — the one whose damage is multiplied by the magazine — is a TENET
# addition. This is a semi-auto hit-scan pistol with a battery and nothing else,
# and it is the third weapon in this batch whose adversary variant gained a
# whole firing mode rather than numbers.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]
mastery_rank: 6
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 50.0
disposition: 1.2             # riven disposition
polarities: []               # the infobox states none
exilus_polarity: madurai
riven_family: Plinx
traits: [corpus]
introduced: "24.2"
internal_name: /Lotus/Weapons/Corpus/Pistols/CrpSonificBlastor/CrpBlastorWeapon
noise: alarming
ammo_type: secondary
# NO AMMO POOL — "Does not use ammo pickups; ammo regenerates over time."
ammo_max: 0
ammo_pickup: 0
magazine: 10
reload_seconds: 1.3

# THE BATTERY — "Has a 0.8 second delay after the weapon stops firing before
# regenerating ammo. Then, regenerates 20 ammo per second; takes 0.5 seconds to
# regenerate a fully depleted battery excluding the delay." Word for word the
# Tenet's, which is the one thing the variant left alone.
battery:
  regen_per_second: 20.0
  delay_empty_seconds: 0.8
  delay_partial_seconds: 0.8

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%. The TENET Plinx has a row, and it names
# that weapon's ALT FIRE, which this one does not have at all.
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 1.0
    max_deg: 3.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 3.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.32
  crit_multiplier: 3.0
  status_chance: 0.04
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 100.0 m", Hit-Scan — the same unusual figure the Tenet
  # carries, a third of the 300 m most hit-scan weapons read.
  range_m: 100.0
  # "This weapon deals primarily Puncture damage and has innate Heat damage" —
  # the same two types as the Tenet, in the same order, at 46 against 70.
  damage: { heat: 20, puncture: 26 }   # total 46

source:
  url: https://wiki.warframe.com/w/Plinx
