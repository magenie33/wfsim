id: dual_toxocyst
name: Dual Toxocyst
slot: secondary
# Precise weapon type — this is the ACTUAL mod-eligibility path. Pistol Mods
# equip on secondary Pistols, Dual Pistols, Shotgun Sidearms, Crossbows, and
# Tomes (wiki Pistol_Mods). Dual Toxocyst is Dual Pistols, so it takes the
# Pistol Mods pool. (See wiki Weapons#Weapon_Type for the full taxonomy.)
class: dual_pistols
form: base
# Pistol mods. No `secondary`-wide pool exists in the data.
mod_pools: [pistol]
grip_type: DUAL_GUN_GUN
mastery_rank: 11
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): the base and Incarnon forms are
# separate weapon entries in the database, linked by a transform group.
# Testing the live transformation cycle (weapon 1 -> weapon 2 mid-fight)
# is future work; each entry stands alone for simulation.
transform_group: dual_toxocyst
transforms_to: dual_toxocyst_incarnon   # via the Incarnon gauge (see there)

# Weapon-level metadata (from the wiki data module).
accuracy: 16
disposition: 1.35            # riven disposition
polarities: [madurai, naramon]
exilus_polarity: naramon
riven_family: Dual Toxocyst
traits: [infested]
conclave: true
introduced: "18.5"           # Update 18.5 (2016-03-04)
internal_name: /Lotus/Weapons/Infested/Pistols/InfVomitGun/InfVomitGunWep
ammo_type: secondary
ammo_max: 72
ammo_pickup: 40
magazine: 12
reload_seconds: 2.35

# Frenzy is delivered as an innate "default upgrade" mod.
default_upgrades:
  - /Lotus/Weapons/Infested/Pistols/InfVomitGun/FireRateOnHeadshotPistolMod

# The weapon passive: Frenzy — defined once in data/perks/frenzy.yaml and
# shared by both entries of the transform group via `perks:` below.

# Single attack profile (attack_parts taxonomy: one direct instance, no AoE).
# Condition Overload behavior class on this weapon (three classes exist:
# additive_with_base_damage / independent / inert - see
# data/mods/galvanized_shot.yaml). Additive per Carnage Reign''s recorded
# adding behavior; re-verify per form.
co_behavior: additive_with_base_damage

attack:
  trigger: semi_auto
  shot_type: hitscan
  fire_rate: 1.0
  multishot: 1.0
  # NOT READ by the engine (2026-07-31): nothing in engine/ references
  # `ammo_cost` — the sim spends a flat 1.0 (minus ammo efficiency) per shot.
  # It matters for CONTINUOUS weapons, which the wiki says "consume 0.5 ammo
  # per trace - unless they are Flamethrowers", and the only beam in the
  # roster is the Torid's Incarnon form, whose pool is charge-backed and
  # "not affected by Ammo Efficiency" — i.e. outside the ammo economy that
  # rule exists to help. So nothing in the sim turns on it today. See
  # docs/MECHANICS.md "Continuous ammo cost" for what would settle it.
  ammo_cost: 1
  crit_chance: 0.05
  crit_multiplier: 2.0
  status_chance: 0.37
  punch_through_m: 0.0
  range_m: 300
  spread_deg: { min: 0.50, max: 12.00 }
  damage: { impact: 7.5, puncture: 60.0, slash: 7.5 }   # total 75

perks:
  - frenzy

# Incarnon evolutions are perks shared by the transform group. CONFIRMED
# (2026-07-24, user): their stat layers apply to BOTH weapons of the group
# (e.g. Commodore's Fortune: base CC 5% -> 25% here, 11% -> 31% on the
# Incarnon entry; Carnage Reign scales both vectors pro-rata).
# Definitions: data/evolutions/dual_toxocyst_*.yaml.
# incarnon_evolutions:
# - { tier: 1, unlock: install the Incarnon Genesis,
# options: [dual_toxocyst_evo1_incarnon_form] }
# - { tier: 2, unlock: complete a solo mission with this weapon equipped,
# options: [dual_toxocyst_carnage_reign, dual_toxocyst_fevered_frenzy] }
# - { tier: 3, unlock: kill 100 enemies with the Incarnon Form,
# options: [dual_toxocyst_ready_retaliation, dual_toxocyst_evolved_autoloader, dual_toxocyst_marksmans_hand] }
# - { tier: 4,
# unlock: 17 consecutive headshots (body shots and Companion damage
# reset; status damage does not; multishot hits count),
# options: [dual_toxocyst_commodores_fortune, dual_toxocyst_neurotoxin, dual_toxocyst_ripper_rounds] }

source:
  url: https://wiki.warframe.com/w/Module:Weapons/data/secondary
  # note: Stats from the wiki's structured Lua data module.
