id: riot_848
name: Riot-848
slot: secondary
weapon_type: secondary
# BULLETS THAT LODGE AND COME BACK. The primary fire is 12 pure Puncture; the
# 48-damage Blast in the module is what happens ON RELOAD, when up to 32
# embedded rounds go off and fly home — so it is NOT an on-impact explosion and
# there is no `radial:` here. See the admission.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]
mastery_rank: 14
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary).
accuracy: 23.53
disposition: 1              # riven disposition
polarities: [madurai]
# NO EXILUS POLARITY — the module states none.
riven_family: Riot-848
traits: [tenno, entrati]
introduced: "38.5"
internal_name: /Lotus/Weapons/Tenno/Pistols/1999EntHybridPistolWeapon/1999EntHybridPistolWeapon
noise: alarming
ammo_type: secondary
ammo_max: 0
ammo_pickup: 0
magazine: 16
reload_seconds: 1.2

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

attack:
  extra_hit_reads: { impact: 0.25, slash: 0.5, puncture: 0.25 }   # see notes: extra_hit_reads
  # see notes: cone_half_angle_from
  spread:
    min_deg: 1.5
    max_deg: 7.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 8
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.26
  crit_multiplier: 2.2
  status_chance: 0.26
  punch_through_m: 0.0
  # NO RANGE ROW on the direct-hit block — the 1.5 m below is the
  # explosion's RADIUS and not a reach. See data/surveys/weapon_range.yaml.
  damage: { puncture: 12 }   # total 12

unmodeled:
  - "The explosion comes on the reload: rounds lodge in surfaces and explode in 1.5 m when reloading, up to 32 at a time (wiki). The engine's explosions go off on impact, so the 48 Blast a round is not counted, and against anything that survives a magazine the number reads low by about four fifths."
  - "It uses no ammo pickups and has a reserve of zero (module); reserves are infinite here, so the limit it is built around does not apply."

source:
