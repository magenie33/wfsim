id: kraken
name: Kraken
slot: secondary
# A TWO-ROUND BURST FROM A GRINEER HEAVY PISTOL, 49 damage a round, and the
# highest riven disposition in the roster's secondaries alongside the Magnus and
# the Seer. Mastery Rank 0.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]
mastery_rank: 0
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 16.0
disposition: 1.53           # riven disposition
polarities: []               # the infobox states none
exilus_polarity: madurai
riven_family: Kraken
traits: [grineer]
introduced: "6.3"
internal_name: /Lotus/Weapons/Grineer/GrineerPistol/GrnHeavyPistol
noise: alarming
ammo_type: secondary
ammo_max: 210
ammo_pickup: 40
magazine: 14
reload_seconds: 2.45

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.5
    max_deg: 12.0
  trigger: burst
  # THE BURST. The listed `fire_rate` counts BURSTS: one pull is 2 rounds
  # spaced by the delay below.
  burst:
    count: 2
    delay_seconds: 0.05       # module BurstDelay
  shot_type: hit_scan
  fire_rate: 2.83
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.05
  crit_multiplier: 2.0
  status_chance: 0.13
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m", Hit-Scan.
  range_m: 300.0
  damage: { impact: 36.75, puncture: 6.125, slash: 6.125 }   # total 49

source:
  url: https://wiki.warframe.com/w/Kraken
