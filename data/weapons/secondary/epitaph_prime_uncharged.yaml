id: epitaph_prime_uncharged
name: Epitaph Prime
# THE UNCHARGED SHOT: a projectile with a ten-metre explosion behind it.
inherits: epitaph_prime
form: base
transform_group: epitaph_prime

introduced: "36.1"

# see notes: inherited_co_catalog_gives_2
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 1.0
    max_deg: 1.5
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 1.75
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.04
  crit_multiplier: 1.8
  status_chance: 0.5
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # see notes: no_range_row_attack
  damage: { impact: 40, puncture: 30, slash: 30 }   # total 100
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 10.0
    falloff_start_m: 0.0
    falloff_reduction: 0.8
    crit_chance: 0.04
    crit_multiplier: 1.8
    status_chance: 0.5
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 30 }   # total 30

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Epitaph_Prime
