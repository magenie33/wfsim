id: ballistica_incarnon
name: Ballistica (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: ballistica
transforms_from: ballistica

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 12
    rounds_per_charge: 1.5
    max_rounds: 18
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2      # = base reload time, unmodded

pseudo_reload:
  magazine: 18
  reload_seconds: 3.0

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 3.33
  charge_seconds: 0.4
  charge_cadence: draw_then_rate
  multishot: 1.0
  ammo_cost: 1                  # of the 18-round charge pool
  crit_chance: 0.2
  crit_multiplier: 2
  status_chance: 0.2
  # see notes: ballistica_incarnon_pierces_bodies
  punch_through_m: infinite
  # see notes: ballistica_incarnon_projectile_width
  projectile_width_m: 4.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, Incarnon Form: "Range: 80.0 m", Projectile
  range_m: 80.0
  damage: { slash: 640 }   # total 640

# incarnon_evolutions: see data/weapons/secondary/ballistica.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Ballistica_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"

