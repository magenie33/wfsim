id: mk1_kunai_incarnon
name: MK1-Kunai (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: mk1_kunai
transforms_from: mk1_kunai

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 4
    rounds_per_charge: 5
    max_rounds: 20
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 0.75      # = base reload time, unmodded

pseudo_reload:
  magazine: 20
  reload_seconds: 1.75

# CONDITION OVERLOAD IS INDEPENDENT ON THIS FORM. The wiki's CO catalog:
# "Incarnon Mode | Projectile | Multiplying", so the bonus is a free-standing
# final multiplier rather than a member of the base-damage bucket. The same
# row carries the family's other two rules, neither of which this engine can
# express yet: "CO-bonus DOES use base damage increase Evolution" (the loader
# excludes it for every other weapon) and "does not factor +200% (3x) bonus
# vs <50% hp targets, effectively additive with it".
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 70
  fire_rate: 3.33
  # TWO BASE MULTISHOT, like the Kunai's own Incarnon form: the shared Genesis
  # page says "2 base Multishot" and the module's attack row agrees. It read
  # 1.0 until 2026-08-21, halving every number this form produces.
  multishot: 2.0
  # …AND NO PUNCH-THROUGH MODS, same page: "Punch Through is ignored in
  # Incarnon Form and will not cause projectiles to home in on additional
  # targets."
  punch_through_mods: false
  ammo_cost: 1                  # of the 20-round charge pool
  crit_chance: 0.14
  crit_multiplier: 2
  status_chance: 0.05
  punch_through_m: 0.0
  damage: { impact: 4.8, slash: 10.8, puncture: 8.4 }   # total 24.0

# incarnon_evolutions: see data/weapons/secondary/mk1_kunai.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Kunai_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"

