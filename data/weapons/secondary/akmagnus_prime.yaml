id: akmagnus_prime
name: Akmagnus Prime
slot: secondary
# THE MAGNUS PRIME'S SHOT, TWICE OVER — identical damage, crit and status to the
# single, with double the magazine and a wider cone. Both carry the same
# "Chamber Cascade" ammo-efficiency passive, which pays nothing against the
# infinite reserves this arena assumes.
class: dual_pistols
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]
mastery_rank: 15
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 11.1
disposition: 1.1             # riven disposition
polarities: [madurai, vazarin]
exilus_polarity: madurai
riven_family: Akmagnus
traits: [prime, baro]
introduced: "36.0.7"
internal_name: /Lotus/Weapons/Tenno/Akimbo/DualMagnusPrime
noise: alarming
ammo_type: secondary
ammo_max: 210
ammo_pickup: 40
magazine: 16
reload_seconds: 2.8

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 2.0
    max_deg: 16.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 5.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.28
  crit_multiplier: 2.8
  status_chance: 0.28
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 1000.0 m", Hit-Scan — a sniper's reach on a pistol, and the
  # module's own figure rather than the 300 m most sidearms carry.
  range_m: 1000.0
  damage: { impact: 44.1, puncture: 26.95, slash: 26.95 }   # total 98

unmodeled:
  - "'Chamber Cascade': a hit or a damaging status has a 4% chance to grant 100% ammo efficiency for 4 seconds (wiki). Ammo economy pays nothing here — reserves are infinite by default because this sim does not model ammo pickups — so the passive is real and worth nothing to this number"

source:
  url: https://wiki.warframe.com/w/Akmagnus_Prime
