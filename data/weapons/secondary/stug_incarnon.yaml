id: stug_incarnon
name: Stug (Incarnon Form)
slot: secondary
weapon_type: secondary
class: pistol
form: incarnon

transform_group: stug
transforms_from: stug

# see notes: bulk_intake_stats_are
unmodeled:
  - "Bouncing Incarnon child projectiles are assumed to leave the fight and hit nobody, including crowds (M127). Their damage and parameters are recorded."
  - "Attachment is resolved per body part; separate nearby patches on one part are not modelled (M127)."
  - "Unmeasured: spawn-time projectile quantities beyond one full blob are capped here; the emitter's handling of the remainder is not traced (M109)."
  - "Unmeasured: the explosion's falloff is read as 70%, the base form's bug note applied to this form."

gauge_form:
  gauge:
    charge_on: direct_hits
    charges_to_fill: 30
    rounds_per_charge: 4
    max_rounds: 120
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2      # = base reload time, unmodded

pseudo_reload:
  magazine: 120
  reload_seconds: 3.0

# M127 and the wiki's separate Incarnon Form row: neither blob part takes GunCO.
co_behavior: inert

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 35
  fire_rate: 4
  multishot: 1.0
  ammo_cost: 1                  # of the 120-round charge pool
  crit_chance: 0.15
  crit_multiplier: 2
  status_chance: 0.2
  punch_through_m: 0.0
  damage: { corrosive: 50 }   # total 50
  # THE BLOB ECONOMY at five stacks — docs/MECHANICS.md §7.3, M109: "explode
  # after 1.5 seconds or reaching max stacks", "can stack up to 5 times before
  # exploding, increasing their damage and explosion range". One stack is the
  # module's Incarnon Form Blob Explosion; M109's package report gives the
  # same 2.8 m maximum range as the base form.
  blob:
    explosion_direct_events: true    # M127: area direct hit, including weak-point events
    embed_radius_m: 2
    embed_falloff_reduction: 1.0
    cap: 5
    lifespan_seconds: 1.5
    radius_at_cap_m: 2.8
    explosion:
      damage: { corrosive: 200 }   # total 200
      radius_m: 0.3
      falloff_start_m: 0
      # The base form's bug note, read for the weapon: listed 30%, really 70%.
      falloff_reduction: 0.7
      crit_chance: 0.15
      crit_multiplier: 2
      status_chance: 0.2
      # see notes: declared_no_co_catalog

# incarnon_evolutions: see data/weapons/secondary/stug.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Stug_Incarnon_Genesis
  # wiki module Attacks[].AttackName: "Incarnon Form Blob Embed" and "Incarnon Form Blob Explosion"
