id: stug_incarnon
name: Stug (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: stug
transforms_from: stug

# BULK INTAKE. The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half: transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
unmodeled:
  - "the Incarnon Form Bounce Explosion is not modelled — this form has more parts than this entry carries"

gauge_form:
  gauge:
    charge_on: direct_hits
    charges_to_fill: 30
    rounds_per_charge: 4
    max_rounds: 120
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2      # = base reload time, unmodded

pseudo_reload:
  magazine: 120
  reload_seconds: 3.0

# ORDINARY HERE — THE ROW IS THE BASE FORM'S. Verbatim:
#
#   |{{Weapon|Stug}}||Blob Impact||Projectile||4||0||0%||N/A||Does not apply
#
# "Attack Unmodded Damage 4" is what identifies it: this entry deals 50, the
# base entry deals 4. So the row names the base form's blob and this form has
# none — and a weapon's two FORMS can differ, which is the Torid's rule already
# (`independent` on its base, ordinary on its Incarnon).
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: hit_scan
  projectile_speed_mps: 35
  fire_rate: 4
  multishot: 1.0
  ammo_cost: 1                  # of the 120-round charge pool
  crit_chance: 0.15
  crit_multiplier: 2
  status_chance: 0.2
  punch_through_m: 0.0
  damage: { corrosive: 50 }   # total 50
  # The radial part — rules in MECHANICS §7.
  radial:
    damage: { corrosive: 200 }   # total 200
    radius_m: 0.3
    falloff_start_m: 0
    falloff_reduction: 0.3
    crit_chance: 0.15
    crit_multiplier: 2
    status_chance: 0.2
    # NOT DECLARED: no CO catalog row for this weapon, so the radial
    # takes the engine's default — no Condition Overload on an explosion.

# incarnon_evolutions: see data/weapons/secondary/stug.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Stug_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form Blob Embed" and "Incarnon Form Blob Explosion"
