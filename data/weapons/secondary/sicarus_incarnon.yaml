id: sicarus_incarnon
name: Sicarus (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: sicarus
transforms_from: sicarus

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 12
    rounds_per_charge: 10
    max_rounds: 120
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2      # = base reload time, unmodded

pseudo_reload:
  magazine: 120
  reload_seconds: 3.0

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 10
  trigger: burst
  # THE BURST. The listed `fire_rate` counts PULLS, not rounds — so reading it
  # as rounds per second understates this weapon by its burst count. Both
  # numbers are the wiki's (Sicarus: Burst Count 3, Burst Delay 0.0400 s).
  burst:
    count: 3
    delay_seconds: 0.04
  shot_type: hit_scan
  fire_rate: 3.5
  multishot: 1.0
  ammo_cost: 1                  # of the 120-round charge pool
  crit_chance: 0.2
  crit_multiplier: 3
  status_chance: 0.2
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_4
  range_m: 300.0
  damage: { impact: 28, slash: 6, puncture: 6 }   # total 40

# incarnon_evolutions: see data/weapons/secondary/sicarus.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Sicarus_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"

