id: gammacor_incarnon
name: Gammacor (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: gammacor
transforms_from: gammacor

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 15
    rounds_per_charge: 1
    max_rounds: 15
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 1.4      # = base reload time, unmodded

pseudo_reload:
  magazine: 15
  reload_seconds: 2.4

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  fire_rate: 1
  multishot: 1.0
  ammo_cost: 1                  # of the 15-round charge pool
  crit_chance: 0.14
  crit_multiplier: 1.8
  status_chance: 0.22
  # see notes: guaranteed_impact_every_shot
  forced_procs: [impact]
  punch_through_m: 0.0
  damage: { impact: 80 }   # total 80
  # The radial part — rules in MECHANICS §7.
  radial:
    damage: { cold: 660 }   # total 660
    radius_m: 5
    falloff_start_m: 0
    falloff_reduction: 0.3
    # Guaranteed COLD on the explosion (wiki module).
    forced_procs: [cold]
    crit_chance: 0.14
    crit_multiplier: 1.8
    status_chance: 0.22
    # see notes: declared_no_co_catalog

# incarnon_evolutions: see data/weapons/secondary/gammacor.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Gammacor_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form" and "Incarnon Form Radial Attack"

