id: zakti_prime
name: Zakti Prime
slot: secondary
weapon_type: secondary
# THE ZAKTI AT EIGHT ROUNDS, four times the crit chance and twice the status —
# 42% — with a 100-damage cloud in 3.8 m. The status chance is what the Prime is
# actually for: a Gas cloud that procs is worth more than one that does not.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]   # CompatibilityTags PROJECTILE, AOE
mastery_rank: 14
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 26.7
disposition: 1.2
polarities: [naramon, naramon, madurai]
exilus_polarity: madurai
riven_family: Zakti
traits: [prime]
introduced: "29.3"
internal_name: /Lotus/Weapons/Tenno/Pistols/PrimeZakti/PrimeZaktiPistol
noise: alarming
ammo_type: secondary
ammo_max: 210
ammo_pickup: 20
magazine: 8
reload_seconds: 1

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

attack:
  extra_hit_reads: { impact: 0.25, slash: 0.5, puncture: 0.25 }   # see notes: extra_hit_reads
  # see notes: cone_half_angle_from
  spread:
    min_deg: 2.5
    max_deg: 5.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 140
  fire_rate: 5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.08
  crit_multiplier: 1.8
  status_chance: 0.42
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC on every direct hit — the module's ForcedProcs.
  forced_procs: [impact]
  # NO RANGE ROW on the direct-hit block — the 3.8 m below is the
  # explosion's RADIUS and not a reach. See data/surveys/weapon_range.yaml.
  damage: { impact: 12, puncture: 18 }   # total 30
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    extra_hit_reads: { impact: 0.25, slash: 0.5, puncture: 0.25 }   # see notes: extra_hit_reads
    radius_m: 3.8
    falloff_start_m: 0.0
    falloff_reduction: 0.0   # the page states NO damage falloff
    crit_chance: 0.08
    crit_multiplier: 1.8
    status_chance: 0.42
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { gas: 100 }   # total 100

unmodeled:
  - "The cloud arrives 1 s after the dart lands (wiki); here it resolves on impact, so nothing walks out of it."
  - reason: explosion_ignores_cover

source:
  url: https://wiki.warframe.com/w/Zakti_Prime
