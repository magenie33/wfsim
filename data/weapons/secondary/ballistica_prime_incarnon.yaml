id: ballistica_prime_incarnon
name: Ballistica Prime (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: ballistica_prime
transforms_from: ballistica_prime

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner: "灵化部分可以粗略"): transcribed from the
# wiki's table, with every clause the intake's rule engine did not recognise
# loaded as a NAMED INERT effect that the builder and the optimizer both print
# as "not modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

incarnon:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 12
    rounds_per_charge: 1.5
    max_rounds: 18
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 1.2      # = base reload time, unmodded

pseudo_reload:
  magazine: 18
  reload_seconds: 2.2

# CONDITION OVERLOAD IS INDEPENDENT ON THIS FORM. The wiki's CO catalog
# lists this weapon's named attack as "Multiplying", so the bonus is a
# free-standing final multiplier rather than a member of the base-damage
# bucket.
co_behavior: independent

attack:
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 3.33
  charge_seconds: 0.4
  charge_cadence: draw_then_rate
  multishot: 1.0
  ammo_cost: 1                  # of the 18-round charge pool
  crit_chance: 0.3
  crit_multiplier: 2.5
  status_chance: 0.3
  punch_through_m: 0.0
  damage: { slash: 830 }   # total 830

# incarnon_evolutions: see data/weapons/secondary/ballistica_prime.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Ballistica_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"
