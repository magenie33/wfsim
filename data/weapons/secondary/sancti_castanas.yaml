id: sancti_castanas
name: Sancti Castanas
slot: secondary
# NEW LOKA'S CASTANAS: 300 Electricity against the ordinary's 160, at three
# times the crit chance, with the same guaranteed Electricity proc and the same
# 3.6 m radius.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]   # CompatibilityTags PROJECTILE, DEPLOYABLE, AOE, SINGLESHOT
mastery_rank: 10
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 100.0
disposition: 1.35           # riven disposition
polarities: [madurai, madurai, vazarin]
exilus_polarity: naramon
riven_family: Castanas
traits: [syndicate, new_loka]
introduced: "15.5"
internal_name: /Lotus/Weapons/Syndicates/NewLoka/Pistols/NLCastanas
noise: silent
ammo_type: secondary
ammo_max: 18
ammo_pickup: 4
magazine: 2
reload_seconds: 1

# Condition Overload: THE CATALOG NAMES BOTH OF THIS WEAPON'S ATTACKS, and
# gives both the same answer. Verbatim (docs/CATALOGS.md §1):
#
#   Sancti Castanas | Mid-Flight Detonation | AoE | 300 | 0 | 0% | N/A
#   Sancti Castanas | Embedded Detonation   | AoE | 300 | 0 | 0% | N/A
#
#   Notes cell on both: "Does not apply"
#
# `inert` is that pair. The entry carries the EMBEDDED detonation as its
# own damage (see the admission below), and the catalog says neither
# detonation takes the term — so the class is the same whichever one is
# modelled. It read Adding at 100% until 2026-08-20.
co_behavior: inert

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 60
  fire_rate: 3.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.24
  crit_multiplier: 2.0
  status_chance: 0.1
  punch_through_m: 0.0
  # A GUARANTEED ELECTRICITY PROC — the module's ForcedProcs.
  forced_procs: [electricity]
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 3.6 m" on this attack.
  range_m: 3.6
  falloff:
    start_m: 0.0
    end_m: 3.6
    reduction: 0.4
  damage: { electricity: 300 }   # total 300

unmodeled:
  - "THE EXPLOSION IS THE WHOLE WEAPON AND ITS RADIUS IS NOT MODELLED. The mine deals no contact damage at all — both of the module's attacks are the same blast resolved at two different moments (mid-flight, or after it has stuck) — so this entry carries that blast as the shot's own damage and no `radial:` beside it. Against ONE target, which is what this arena and the board's rulers fight, the number is exactly right; against a crowd it is a FLOOR, because nothing within the published radius takes anything here"
  - "the mines are DETONATED BY HAND via Alternate Fire and several can be laid before firing them together (wiki). This sim detonates each one the moment it lands, which is the ceiling for a single mine and misses the play pattern the weapon exists for"
  - "mines STICK to surfaces, enemies and allies, and multishot throws them in 'a very wide horizontal spread' (wiki) — so on this weapon multishot covers ground rather than stacking damage on one target, which is the opposite of what it does everywhere else"
  - "the PURITY syndicate effect, which on a proc heals the wielder and nearby allies and cleanses status from them — the wielder is not a body in this arena and there are no allies, so it pays nothing"
  - reason: silent_weapon
  - reason: explosion_ignores_cover

source:
  url: https://wiki.warframe.com/w/Sancti_Castanas
