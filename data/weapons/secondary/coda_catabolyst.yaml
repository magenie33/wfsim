id: coda_catabolyst
name: Coda Catabolyst
slot: secondary
# A BEAM WITH A BLAST ON THE END OF IT — the roster's second beam to carry a
# damage radius — and a reload that throws the magazine as three grenades.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]
# see notes: enforced_unlike_kuva_or
mastery_rank: 17
# see notes: rank_40_30_polarizing
max_rank: 40

# see notes: weapon_level_metadata_wiki_2
accuracy: 6.3
disposition: 0.7             # riven disposition (module `Disposition`)
polarities: [madurai]
exilus_polarity: madurai
riven_family: Catabolyst
traits: [infested, coda]
introduced: "38.5"
internal_name: /Lotus/Weapons/Infested/InfestedLich/Pistols/CodaCatabolyst
noise: alarming
ammo_type: secondary
ammo_max: 155
ammo_pickup: 20
magazine: 37
reload_seconds: 1.7
# "Reload from empty has an innate -20% Reload Speed buff applied to it's base
# reload time of 1.7 seconds, increasing the time it takes to reload to 2.125
# seconds. Bonus is additive with Quickdraw and similar bonuses."
reload_from_empty_speed: -0.2

# CARRIED FROM `catabolyst` — see notes: co_carried_from_the_family. The beam
# is Adding, the grenade's contact Multiplying, the explosion takes none.
co_behavior: additive_with_base_damage

# THE PROGENITOR BONUS — verbatim: "Comes with an additional bonus Impact, Heat,
# Cold, Electricity, Toxin, Magnetic, or Radiation damage, which increases the
# listed base damage of the weapon by 25%-60%." Nothing merges on this weapon:
# the beam is Corrosive, which is not one of the seven, so a progenitor element
# always arrives beside it.
valence:
  elements: [impact, heat, cold, electricity, toxin, magnetic, radiation]
  min: 0.25
  max: 0.60

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). The widest cone on
  # any beam in the roster; the page files it as "Very low accuracy".
  spread:
    min_deg: 9.0
    max_deg: 23.0
  trigger: held
  shot_type: hit_scan
  fire_rate: 12.0
  multishot: 1.0
  # "Consumes 0.5 ammo per tick of damage."
  ammo_cost: 0.5
  crit_chance: 0.11
  crit_multiplier: 2.9
  status_chance: 0.50
  # INNATE 0.9 m, from the attack block's own Punch Through row; the
  # punch-through page's exception list does not name this weapon. Just under
  # two body-thicknesses (`space::BODY_MATERIAL_M` is 0.5), so it reaches the
  # second enemy in a line and stops there.
  punch_through_m: 0.9
  # "Has linear damage falloff from 100% to 1.88% from 9m to 19m target
  # distance" — the steepest in the roster by a wide margin, and it ends exactly
  # where the beam does. The module's reduction is 0.9811, which is the exact
  # figure the infobox's "1.89%, 1 damage" floor comes from.
  falloff:
    start_m: 9.0
    end_m: 19.0
    reduction: 0.9811
  damage: { corrosive: 56 }   # total 56

  # A BEAM THAT SPLASHES — "The zone of impact or maximum beam range has a
  # spherical blast radius of 0.7 meters, bringing up the total range to 19.7
  # meters before mods, allowing it to hit multiple enemies at once", and
  # "Radial damage is not affected by multishot", which is what
  # `radius_takes_multishot: false` states.
  #
  # No chain: the page gives none, and a zero would be recording a fact the page
  # does not state.
  beam:
    range_m: 19.0
    damage_radius_m: 0.7
    radius_takes_multishot: false
    chain:
      hops: 0
      range_m: 0.0
      damage_per_hop: 0.0
      origin: radius_targets

  # THE RELOAD GRENADE — every reload throws the magazine, and there are two
  # throws: a reload FROM EMPTY throws the big one, any other reload the
  # partial one (module attacks "Reload From Empty Impact / Explosion" and
  # "Partial Reload Impact / Explosion"). "Damage, critical chance, status
  # chance, and explosion range increase when reloading with no ammo in the
  # magazine."
  # THREE grenades, "at a 45 degree angle towards the reticle" — read as a fan
  # 45 degrees edge to edge, so the outer two land beside the aimed body and
  # reach it only where their blast does.
  #
  # "Initial hit and explosion apply status separately", so the contact and the
  # blast are two instances. The blast falls off "from 100% to 50% from central
  # impact", takes no headshot, and its "Radius is not affected by Fulmination".
  reload_grenade:
    contact_co_behavior: independent
    count: 3
    fan_deg: 45
    from_empty:
      damage: { impact: 11 }
      crit_chance: 0.31
      crit_multiplier: 2.9
      status_chance: 0.59
      radial:
        damage: { corrosive: 658 }
        radius_m: 5.0
        takes_blast_radius_mods: false
        crit_chance: 0.31
        crit_multiplier: 2.9
        status_chance: 0.59
        falloff_start_m: 0.0
        falloff_reduction: 0.5
    partial:
      damage: { impact: 11 }
      crit_chance: 0.11
      crit_multiplier: 2.9
      status_chance: 0.43
      radial:
        damage: { corrosive: 74 }
        radius_m: 3.0
        takes_blast_radius_mods: false
        crit_chance: 0.11
        crit_multiplier: 2.9
        status_chance: 0.43
        falloff_start_m: 0.0
        falloff_reduction: 0.5

# THE RAMP IS THE ENGINE'S OWN DEFAULT — "Damage ramps up from 20% to 100% over
# 0.6 seconds when firing. After firing stops for 0.8 seconds, the damage decays
# back to 20% over 2 seconds", which is BEAM_RAMP_SECONDS, BEAM_DECAY_DELAY and
# the 20% floor exactly, so no `beam_ramp_floor` override.

unmodeled:
  - "WHEN in the reload the grenade lands: the page says it is thrown mid-reload and times nothing, so it lands halfway through (`THROW_AT_RELOAD_SHARE_UNMEASURED`); the throw costs no time of its own either way"
  - "the explosion's SELF-STAGGER, which costs the wielder time when the target stands inside the blast"
  - "Galvanized Shot's bug on the grenade's direct hit (multiplicative with base damage, wiki `Catabolyst` Bugs)"
  - "interrupting the reload to throw again without reloading, the page's own exploit"
  - "the 45-degree FAN is read as edge to edge about the reticle, which the page does not spell out"
  - "this weapon will never reload on its own and must be reloaded manually — a habit cost this arena does not charge"

source:
  url: https://wiki.warframe.com/w/Coda_Catabolyst
