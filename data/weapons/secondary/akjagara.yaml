id: akjagara
name: Akjagara
slot: secondary
# THE ORDINARY AKJAGARA, and the Prime is this weapon with three times the crit
# chance and a cone half as wide. The two-round burst with NO delay between the
# rounds is the family's shape and is shared.
class: dual_pistols
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]
mastery_rank: 8
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 15.4
disposition: 1.1            # riven disposition
polarities: [naramon]
exilus_polarity: naramon
riven_family: Akjagara
traits: [tenno]
introduced: "15.13"
internal_name: /Lotus/Weapons/Tenno/Pistols/TigrisRedeemerSetPistol/TnoBladedPistols
noise: alarming
ammo_type: secondary
ammo_max: 210
ammo_pickup: 40
magazine: 36
reload_seconds: 2.25

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 5.0
    max_deg: 8.0
  trigger: burst
  # THE BURST. The listed `fire_rate` counts BURSTS: one pull is 2 rounds
  # fired at once (the module gives a delay of zero), so the effective
  # rate is 2 x the listed one.
  burst:
    count: 2
    delay_seconds: 0.0       # module BurstDelay
  shot_type: hit_scan
  fire_rate: 5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.06
  crit_multiplier: 2.0
  status_chance: 0.28
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m", Hit-Scan.
  range_m: 300.0
  damage: { impact: 5.4, puncture: 5.4, slash: 25.2 }   # total 36

unmodeled:
  - "Range Advantage, the Akjagara-exclusive mod — a weapon-exclusive card outside the pools this roster loads"

source:
