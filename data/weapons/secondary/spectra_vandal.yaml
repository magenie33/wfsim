id: spectra_vandal
name: Spectra Vandal
slot: secondary
# A CUTTING LASER WITH A 25% RAMP FLOOR — the roster's other beam floors are
# 20%, 25% and 70%, and this one shares the Flux Rifle's. It also carries half a
# metre of innate punch through, which is exactly one body's worth.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]         # CompatibilityTags BEAM
mastery_rank: 10
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 100.0
disposition: 1.45            # riven disposition
polarities: []               # the infobox states none
exilus_polarity: madurai
riven_family: Spectra
traits: [corpus, vandal]
introduced: "25.0"
internal_name: /Lotus/Weapons/Corpus/Pistols/CorpusModularPistol/Vandal/CrpLaserPistolVandal
noise: alarming
ammo_type: secondary
ammo_max: 400
ammo_pickup: 40
magazine: 80
reload_seconds: 1.2

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%.
co_behavior: additive_with_base_damage

# WHERE THE RAMP STARTS. "Damage ramps up from 25% to 100% over 0.6 seconds when
# firing. After firing stops for 0.8 seconds, the damage decays back to 25% over
# 2 seconds" — a stated exception to the 20% "most weapons" get.
beam_ramp_floor: 0.25

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). Perfect, which is
  # what an accuracy of 100 reads as and what a beam usually is.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: held                 # continuous: `fire_rate` is TICKS per second
  shot_type: hit_scan
  fire_rate: 12.0
  multishot: 1.0
  ammo_cost: 0.5
  crit_chance: 0.20
  crit_multiplier: 2.0
  status_chance: 0.28
  # "Innate 0.5 meter Punch Through" — one body's worth exactly
  # (`space::BODY_MATERIAL_M`), so the beam reaches the second of two enemies
  # standing against each other and no further.
  punch_through_m: 0.5
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 22.0 m", Hit-Scan — a beam's reach.
  range_m: 22.0
  damage: { puncture: 9.24, slash: 12.76 }   # total 22

unmodeled:
  - "Sequence Burn, the Spectra-exclusive mod — a weapon-exclusive card outside the pools this roster loads"

source:
  url: https://wiki.warframe.com/w/Spectra_Vandal
