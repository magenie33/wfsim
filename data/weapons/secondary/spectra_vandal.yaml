id: spectra_vandal
name: Spectra Vandal
slot: secondary
weapon_type: secondary
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]         # CompatibilityTags BEAM
mastery_rank: 10
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 100.0
disposition: 1.2
polarities: []               # the infobox states none
exilus_polarity: madurai
riven_family: Spectra
traits: [corpus, vandal]
introduced: "25.0"
internal_name: /Lotus/Weapons/Corpus/Pistols/CorpusModularPistol/Vandal/CrpLaserPistolVandal
weakness_bonus: 0.0
noise: alarming
ammo_type: secondary
ammo_max: 400
ammo_pickup: 40
magazine: 80
reload_seconds: 1.2

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

# Client impact attenuation declares the lower endpoint.
beam_ramp_floor: 0.2
beam_ramp: { rise_seconds: 0.6, cooldown_delay_seconds: 0.8, cooldown_divisor: 2.0, per_target: true }

beam_deployment: { expansion_seconds: 0.1, retraction_seconds: 0.1 }

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). Perfect, which is
  # what an accuracy of 100 reads as and what a beam usually is.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: held                 # continuous: `fire_rate` is TICKS per second
  shot_type: hit_scan
  fire_rate: 12.0
  multishot: 1.0
  ammo_cost: 0.5
  crit_chance: 0.20
  crit_multiplier: 2.0
  status_chance: 0.28
  # "Innate 0.5 meter Punch Through" — one body's worth exactly
  # (`space::BODY_MATERIAL_M`), so the beam reaches the second of two enemies
  # standing against each other and no further.
  punch_through_m: 0.5
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 22.0 m", Hit-Scan — a beam's reach.
  range_m: 22.0
  damage: { puncture: 9.24, slash: 12.76 }   # total 22

source:
  url: https://wiki.warframe.com/w/Spectra_Vandal

# see notes: client_secondary_calibration

unmodeled:
  - reason: client_beam_target_ramp
