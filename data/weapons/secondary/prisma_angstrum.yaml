id: prisma_angstrum
name: Prisma Angstrum
slot: secondary
class: pistol
form: charged
default_form: true
mod_pools: [pistol]
mastery_rank: 8
max_rank: 30

# see notes: two_weapons_model_base
transform_group: prisma_angstrum
transforms_to: prisma_angstrum_incarnon

# see notes: bulk_intake_stats_are_2
unmodeled:
  - "the Single Rocket Explosion is not modelled — this entry carries only the Single Rocket Impact"
accuracy: 26.67
disposition: 1.3
polarities: [vazarin]
# no exilus polarity slot
riven_family: Angstrum
traits: [incarnon, prisma]
introduced: "Update 21.7"
internal_name: /Lotus/Weapons/Corpus/Pistols/CrpHandRL/PrismaAngstrum
noise: alarming
ammo_type: secondary
ammo_max: 18
ammo_pickup: 3
# THREE ROCKETS TO A MAGAZINE, and this entry is the SINGLE one — see the
# ordinary Angstrum.
magazine: 3
reload_seconds: 1.8

# ORDINARY HERE, AND THE CATALOG SAYS SO BY NAMING THE OTHER FORM. The row is
#
#   {{Weapon|Angstrum}}/{{Weapon|Prisma Angstrum}}||Incarnon Mode||Projectile||30||30||100%||Multiplying
#
# and its Attack Name cell reads "Incarnon Mode" — so Multiplying belongs to the
# transformed entry, not to this one. This form has no row, and absence means
# ORDINARY (CATALOGS.md).
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 2.5
    max_deg: 5
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 150
  fire_rate: 2
  charge_seconds: 0.2
  charge_cadence: draw_then_rate
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.18
  crit_multiplier: 2.2
  status_chance: 0.26
  punch_through_m: 0.0
  damage: { blast: 200 }   # total 200

# incarnon_evolutions: definitions live in data/evolutions/prisma_angstrum_*.yaml.

source:
  url: https://wiki.warframe.com/w/Prisma_Angstrum
