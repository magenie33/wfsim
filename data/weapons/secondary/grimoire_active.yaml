id: grimoire_active
name: Grimoire
# THE ACTIVE ATTACK: 350 Electricity with a six-metre blast, at two thirds of
# the fire rate.
inherits: grimoire
form: alt_fire
transform_group: grimoire

introduced: "35"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of
# this weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 6
  fire_rate: 1
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.26
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED ELECTRICITY PROC — the module's ForcedProcs.
  forced_procs: [electricity]
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 6.0 m" on this attack.
  range_m: 6.0
  damage: { electricity: 350 }   # total 350
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.8
    crit_chance: 0.2
    crit_multiplier: 2.0
    status_chance: 0.26
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { electricity: 250 }   # total 250

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Grimoire
