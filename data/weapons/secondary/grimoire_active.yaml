id: grimoire_active
name: Grimoire
# THE ACTIVE ATTACK, and it is a DEPLOYED ORB rather than a shot — ✅ MEASURED
# (MEASUREMENTS M63, owner 2026-08-28), against a module that publishes it as
# one 350 hit and one 250 blast.
#
# WHAT IT ACTUALLY DOES. "Alternate Fire throws an orb that travels slowly then
# explodes after 6 seconds. … Orb will shock 1 enemy within 6 meters of it every
# 1 second. Each enemy hit chains to an additional 2 enemies within 6 meters"
# (wiki `Grimoire`). So the orb lives 6 s and STRIKES SIX TIMES — one body
# inside 6 m each second, picked by the orb — and then detonates where it has
# got to. It leaves the muzzle at 6 m/s and drops to 2 m/s once it touches
# something, still heading the way it was thrown.
#
#   * every number is the module's x0.8 — 280 a strike, 200 the blast
#   * "Every strike from the alternate fire has a forced Electricity status
#     effect", and the final explosion does NOT force one
#   * "The strikes and the forced Electricity proc can hit weakspots"
#   * "Tick rate is not affected by Fire Rate"
#   * "Number of chains is affected by Multishot" — the mod buys chain targets
#     rather than a second orb
#   * the strike's reach and the blast's radius are both 6 m and both take
#     Fulmination (Primed)
#
# IT IS NOT A LINGERING FIELD, and that distinction is the owner's.
# A field is an AREA: everyone standing in it burns, at their own falloff
# distance. This is an ENTITY with a position — it moves, and each strike
# reaches exactly ONE body, all six for the same number. `orb:` below is the
# geometry and the clock; what it DEALS is this attack's own `damage:` and its
# own `radial:`, which is the same division `beam:` makes for a beam.
#
# THE STRIKE COUNT FALLS OUT OF THE GEOMETRY rather than being written down.
# Six ticks over a six second fuse, and a tick with nobody inside the reach is
# spent striking nobody — so a throw that connects in under a second loses none
# of them, one that takes 2.5 s lands four, and against a body at contact it is
# always six. That is the owner's `ceil(6 - flight)`, arriving on its own.
inherits: grimoire
# THE OTHER END OF THE CYCLE. A form you must pay a meter to reach names where
# it comes from — that is how the sim finds the form to fill the meter in.
transforms_from: grimoire
form: alt_fire
transform_group: grimoire

introduced: "35"

# NO CONDITION OVERLOAD ON ANY PART OF THIS ATTACK — ✅ measured (M63, owner
# 2026-08-28): neither the pulses nor the final explosion take the term.
#
# The owner's reason is what a strike IS: the orb's, not the gun's — a ranged
# strike that behaves like a field ("变相的范围，类似于field"), which is the
# class of attack this roster already gives nothing to. "An AoE part takes no CO
# unless its own row says so" is that standing rule, and the wiki's catalog was
# re-read on the PAGE the same day with no Grimoire row of any kind — absence
# meaning ORDINARY, and ordinary for a part of this class is nothing.
#
# NOT INHERITED, because the catalog gives a class per ATTACK: the primary
# fire's page is a different attack and keeps the ordinary term.
#
# It is stated as `inert` rather than left to the field/radial default because
# the FIRST strike is filed as this attack's own `damage:`. Without this line
# that one strike of the six would take a term the other five do not.
co_behavior: inert

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 6
  fire_rate: 1
  multishot: 1.0
  # THIS ATTACK IS NOT AIMED. The orb picks its own body — "shock 1 enemy
  # within 6 meters of it every 1 second" — so the scenario's headshot_pct,
  # which describes the player's aim, is the wrong number for all six strikes.
  #
  # 10% IS MEASURED (M63, owner 2026-08-28), not assumed: six strikes at eight
  # bodies each, 5 weak points out of 48 hits = 10.4%. A small sample, so the
  # number is "about 10%" rather than 10.4%, and the entry says so.
  #
  # PER BODY HIT, including the chained ones — which is what the sample shows
  # (3 and 2 heads inside single strikes of eight) and what this engine does by
  # construction: every body a strike reaches is its own instance and rolls its
  # own part. That the strikes CAN find a weak point at all is the wiki's: "The
  # strikes and the forced Electricity proc can hit weakspots" — which is also
  # why the forced proc is scaled by the part its strike landed on.
  unaimed_headshot_chance: 0.1
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.26
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED ELECTRICITY PROC — the module's ForcedProcs.
  forced_procs: [electricity]
  # HOW FAR A STRIKE REACHES — "1 enemy within 6 meters of it". The module's
  # "Range: 6.0 m" is that reach, confirmed by the owner, and NOT
  # a flight distance: the orb travels 6 m/s for 6 s and covers far more ground
  # than six metres.
  range_m: 6.0
  # WHAT ONE STRIKE DEALS. 280, not the module's 350 — measured (M63): every
  # number this attack deals is the published one x0.8, both halves of it,
  # which is what makes it ONE multiplier rather than two transcription slips.
  #
  # It is the ATTACK's damage rather than a number inside `orb:` because that
  # is what it is: the orb is a delivery mechanism, and its strike is this
  # attack's hit arriving six times.
  damage: { electricity: 280 }   # total 280 (module 350 x0.8)
  # THE RECHARGE METER THIS FORM IS GATED BEHIND, in the page's own units:
  # "Requires a fully filled meter beneath the reticle in order to fire. The
  # meter takes 45 seconds to completely recharge. Hitting enemies with the
  # primary fire reduces recharge time by 1 second per hit. Picking up secondary
  # or universal ammo reduces recharge time by 10 seconds."
  #
  # DECLARING IT IS WHAT MAKES THIS FORM GAUGE-FED, and the mode machinery does
  # the rest on its own: `play_modes` reads the gate off the ENTRY rather than
  # off the form's name, so this stops being a sustainable `alternate` a ruler
  # may rank and becomes a `transformed` mode showing the form's own numbers,
  # plus a `cycle` that is how a Tome is actually played. That was written for
  # the Mausolon and this is the second weapon to use it.
  #
  # WHAT COUNTS AS A HIT needs no field: "Multishot will count as an additional
  # hit" makes it per landing PELLET and "Radial damage does not count an
  # additional hit" keeps the explosion out, and this engine already tells those
  # two apart.
  meter:
    seconds_to_fill: 45.0
    seconds_per_hit: 1.0
    seconds_per_ammo_pickup: 10.0
  # THE ORB — geometry and a clock, and nothing about damage.
  orb:
    fuse_seconds: 6.0
    # ONE A SECOND, and "Tick rate is not affected by Fire Rate" — which this
    # engine gets right by construction: the orb's clock is its own and no mod
    # bucket reaches it.
    strike_interval_seconds: 1.0
    # HOW FAR A STRIKE REACHES. The module's "Range: 6.0 m" is this, confirmed
    # by the owner, and NOT a flight distance — the orb covers
    # 6 m/s x 6 s of ground. Fulmination (Primed) enlarges it.
    strike_radius_m: 6.0
    speed_mps: 6.0
    speed_after_contact_mps: 2.0
    # THE THROW ANIMATION — 0.15 s of wind-up before the orb leaves and 0.85 s
    # of recovery before the weapon can do anything else.
    # A fire-rate mod shortens both.
    #
    # THEIR SUM IS THIS FORM'S LISTED FIRE RATE, which is not a coincidence: a
    # second per throw IS the animation, and the `fire_rate: 1` above is the
    # same fact said twice. The PRIMARY fire's own 0.1 s wind-up is not modelled
    # and does not need to be — its interval "corresponds exactly to the fire
    # rate", so the wind-up is latency at the start of holding the
    # trigger and costs a sustained engagement nothing.
    throw_seconds: 0.15
    recovery_seconds: 0.85
    # BODIES A STRIKE REACHES PER POINT OF MULTISHOT, the struck one included:
    # the count is `floor(3 x multishot)` — ✅ MEASURED (M63) by counting
    # Invocation stacks, which tick once per hit and so make a strike's body
    # count readable rather than a guess.
    #
    #   multishot   1.0   1.6   2.1   2.7   3.6   3.9
    #   measured      3     4     6     8    10    11
    #
    # The wiki's "chains to an additional 2 enemies" plus "Number of chains is
    # affected by Multishot" reads equally well as `multishot + 2`, and the two
    # agree at x1.0 and nowhere else — at x2.1 the sum says 5 and the product
    # says 6. This entry carried the sum until the measurement separated them.
    chain_bodies_per_multishot: 3.0
    chain_range_m: 6.0
    # UNDILUTED — ✅ confirmed: a beam chain with no
    # falloff, so the second and third body take the strike in full. His
    # earlier note that the chain is "不受增益" meant the RANGE bucket and not
    # the damage one: a hop is always six metres, and everything else about it
    # — crit, status, your damage mods — is ordinary. `chain_range_m` above is
    # the half that does not move; this is the half that was never diluted.
    chain_damage_per_hop: 1.0
  # THE FINAL EXPLOSION — rules in MECHANICS §7. "Explosion has linear Damage
  # Falloff from 100% to 20% from central impact", over the same six metres the
  # strikes reach, and Fulmination (Primed) enlarges it. It goes off when the
  # fuse runs out, six seconds after the throw; this engine settles a radial AT
  # the impact, which moves it earlier by the fuse and is stated in
  # `unmodeled:` below.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.8
    crit_chance: 0.2
    crit_multiplier: 2.0
    status_chance: 0.26
    takes_multishot: false
    takes_blast_radius_mods: true
    # NO `forced_procs:` — and it is an ABSENCE THAT WAS MEASURED rather than
    # one nobody asked about: the pulses force Electricity and this does not.
    damage: { electricity: 200 }   # total 200 (module 250 x0.8)

unmodeled:
  # THE METER IS MODELLED as of 2026-08-28 — `meter:` above — so the loudest
  # admission this roster had ("everything below is the ceiling rather than the
  # average, and by a wide margin") is retired outright rather than reworded.
  # This form has no mode of its own any more: you never hold a Tome's alt fire,
  # so there is no "while you are in it" to report. It is played in the CYCLE.
  - reason: explosion_ignores_cover
  - reason: self_stagger
  # THE ORB'S HEADSHOT RATE IS AN ASSUMPTION and a player deciding whether to
  # trust this weapon's number cannot read a yaml (the rule `ricochet:`
  # established, 2026-08-21). Prose rather than a reason because it is used
  # once and carries one number.
  - "how often the orb's strikes land on a weak point is a MEASURED average
    rather than geometry — about 10% per body hit, counted at 5 weak points in
    48 hits. Where an orb drifting through a crowd actually puts them depends
    on how everyone is standing, which this arena does not model, so a fight
    where you can line them up beats this number and one against a single tall
    target may not reach it"
  # WHAT THE POSITION MODEL FOUND, and the answer turned out to be the arena
  # rather than any of this entry's numbers: the orb bounces
  # off walls, and this arena has none. Everything here is right and the fight
  # it is fired in is an open field.
  - reason: orb_bounces_off_walls
    speed: 2
    open_field: four
    total: six
    worth: 55%

source:
  url: https://wiki.warframe.com/w/Grimoire
