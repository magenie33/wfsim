id: bronco_incarnon
name: Bronco (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: bronco
transforms_from: bronco

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner: "灵化部分可以粗略"): transcribed from the
# wiki's table, with every clause the intake's rule engine did not recognise
# loaded as a NAMED INERT effect that the builder and the optimizer both print
# as "not modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

incarnon:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 40
    rounds_per_charge: 1
    max_rounds: 20
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 1.05      # = base reload time, unmodded

pseudo_reload:
  magazine: 20
  reload_seconds: 2.05

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

unmodeled:
  - "damage falloff from 14 m to 28 m (down to 55% of full damage) is not modelled — this arena has no distance, so every shot lands at point blank"

attack:
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 2.5
  multishot: 1.0
  ammo_cost: 1                  # of the 20-round charge pool
  crit_chance: 0.2
  crit_multiplier: 3
  status_chance: 0.1886
  punch_through_m: 0.0
  # NOT MODELLED — the arena has no distance, so this weapon is
  # simulated at point blank. Recorded because the RIVEN pool reads
  # it: a hitscan weapon that lists a falloff still rolls Projectile
  # Speed, which scales the whole range (wiki `Projectile Speed`).
  falloff:
    start_m: 14
    end_m: 28
    reduction: 0.5455   # fraction KEPT past end_m
  damage: { impact: 13.2, slash: 6.6, puncture: 2.2 }   # total 22.0

# incarnon_evolutions: see data/weapons/secondary/bronco.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Bronco_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"
