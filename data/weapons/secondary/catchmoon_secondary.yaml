# Catchmoon, as a SECONDARY — one chamber, two roster entries;
# data/kitguns/README.md says why the slot is the weapon.
#
# see notes: kitgun_entry_is_default_assembly
#
# SEMI-AUTOMATIC AND WIDE: "As a secondary, it semi-automatically fires a wide
# projectile" — the primary's infinite body punch through, over half the range
# and half the falloff window.
id: catchmoon_secondary
name: Catchmoon
wiki_name: Catchmoon
slot: secondary
weapon_type: secondary
class: pistol
form: base
default_form: true
mod_pools: [pistol]
mastery_rank: 0
max_rank: 30

# THE CHAMBER PART DE SHIPS, and the join key to every external dataset.
# BOTH SLOT ENTRIES CARRY IT: a Catchmoon is one chamber, and which slot a
# grip puts it in is ours to model, not a second item to trade.
internal_name: /Lotus/Weapons/SolarisUnited/Secondary/SUModularSecondarySet1/Barrel/SUModularSecondaryBarrelAPart
traits: []
kitgun: catchmoon_secondary
transform_group: catchmoon_secondary

# see notes: kitgun_disposition_source
disposition: 0.75
riven_family: Catchmoon

polarities: []
exilus_polarity: madurai
introduced: "24"
noise: alarming
ammo_type: secondary
ammo_max: 70
ammo_pickup: 20
accuracy: 5.9

magazine: 13
reload_seconds: 2.1

# "no bonus damage on headshots" (wiki Catchmoon); `ExtraHeadshotDmg = -2`.
headshot_multiplier: 1.0

#   Catchmoon (Secondary) | Normal Attack | Projectile | 256 | 256 | 100% | Multiplying
co_behavior: independent

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 12
    max_deg: 22
  trigger: semi_auto
  shot_type: projectile
  fire_rate: 1.83
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.21
  crit_multiplier: 2
  status_chance: 0.21
  # see notes: infinite_body_punch_through
  punch_through_m: 0.0
  infinite_body_punch_through: true
  # "Limited range of 20 meters."
  range_m: 20
  # "linear damage falloff from 100% to 6.25% from 8m to 16m" — the module's
  # 0.9375 is the share removed.
  falloff:
    start_m: 8
    end_m: 16
    reduction: 0.9375
  # "a guaranteed Impact proc against enemies within 9 meters".
  forced_procs: [impact]
  damage: { heat: 184, impact: 106 }

unmodeled:
  - "The guaranteed Impact proc reaches only 9 m (further with Projectile Speed mods) but is applied at every distance here."
  - "The projectile is wide, like the Arca Plasmor's (page); the sim fires a ray, so with infinite punch through only bodies on the line are hit."
  - "Its 20 m range is the projectile's 0.42 s lifetime, so Projectile Speed mods extend it in game; here they move the falloff and the cut-off stays at 20 m."
  - "Eclipse's damage buff does not reach this chamber in game (wiki, Bugs); here a buff reaches every weapon, so with Eclipse up the number reads high."
  - reason: projectile_must_be_led

source:
  url: https://wiki.warframe.com/w/Catchmoon
  module: https://wiki.warframe.com/w/Module:Weapons/data/modular
