id: onos_incarnon
name: Onos (Incarnon Form)
slot: secondary
weapon_type: secondary
class: pistol
form: incarnon

transform_group: onos
transforms_from: onos

# see notes: bulk_intake_stats_are
#
# Behavior 1 (`EntratiWristGunBeamFireBehavior` + `EntratiWristGunBeamStateBehavior`)
# focuses from 1.0x to 2.5x over 8 beam ticks (`0.125` progress/tick, weapon-shared,
# instant reset on trigger release). When focus reaches 1.0 with >= 50 Incarnon
# charges remaining, `0x1348490` resets focus and switches to Behavior 2 (`power_shot`,
# 50 charges: 2,200 Heat trace + 1,100 Heat 3 m radial), then returns to Behavior 1;
# below 50 charges the beam stays clamped at 2.5x until empty.

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 12
    rounds_per_charge: 30
    max_rounds: 350
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  # see notes: incarnon_package_transition_time
  transmute_in_seconds: 3.0
  transmute_out_seconds: 1.0

pseudo_reload:
  magazine: 350

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

beam_ramp_floor: 1

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: held
  beam_ramp:
    rise_seconds: 0
    rise_ticks: 8
    ceiling: 2.5
    cooldown_delay_seconds: 0
    cooldown_divisor: 0
    per_target: false
    reset_on_release: true
  shot_type: hit_scan
  fire_rate: 2
  multishot: 1.0
  ammo_cost: 1                  # of the 350-round charge pool
  crit_chance: 0.14
  crit_multiplier: 1.6
  status_chance: 0.18
  # Client `EntratiWristGunBeamFireBehavior` declares `tracePunctureDepth = 5`
  # and `PunchthroughIgnoresAvatars = 1` (+0x76d at 0x1753abd): enemy bodies
  # cost no punch-through budget while world geometry consumes the 5 m depth.
  punch_through_m: 5.0
  infinite_body_punch_through: true
  damage: { radiation: 30 }   # total 30
  profiles:
    power_shot:
      spread:
        min_deg: 0.0
        max_deg: 0.0
      trigger: semi
      shot_type: hit_scan
      fire_rate: 1.3333333333333333
      multishot: 1.0
      ammo_cost: 50
      crit_chance: 0.38
      crit_multiplier: 3.2
      status_chance: 0.26
      forced_procs: [heat, impact]
      punch_through_m: 1.0
      infinite_body_punch_through: true
      range_m: 300
      damage: { heat: 2200 }
      radial:
        radius_m: 3.0
        falloff_start_m: 0.0
        falloff_reduction: 0.3
        crit_chance: 0.38
        crit_multiplier: 3.2
        status_chance: 0.26
        takes_multishot: false
        takes_blast_radius_mods: true
        damage: { heat: 1100 }

# incarnon_evolutions: see data/weapons/secondary/onos.yaml (shared group)

  range_m: 8
source:
  url: https://wiki.warframe.com/w/Onos
  # wiki module Attacks[].AttackName: "Incarnon Form Held Damage"

# see notes: client_secondary_calibration
