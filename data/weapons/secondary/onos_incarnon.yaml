id: onos_incarnon
name: Onos (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: onos
transforms_from: onos

# see notes: bulk_intake_stats_are
unmodeled:
  - "the Incarnon Form Charge Attack is not modelled — this form has more parts than this entry carries"
  - "the Incarnon Form Charge Radial Attack is not modelled — this form has more parts than this entry carries"

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 12
    rounds_per_charge: 30
    max_rounds: 350
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2      # = base reload time, unmodded

pseudo_reload:
  magazine: 350
  reload_seconds: 3.0

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: held
  shot_type: projectile
  projectile_speed_mps: 40
  fire_rate: 2
  multishot: 1.0
  ammo_cost: 1                  # of the 350-round charge pool
  crit_chance: 0.14
  crit_multiplier: 1.6
  status_chance: 0.18
  # Module:Weapons/data, this form's own attack row (Incarnon Form Held Damage). It read 0.0
  # until 2026-08-21 — not a measurement, an unfilled field, and one that
  # was harmless while the arena had a single body and stopped being so
  # when `space::traverse` started spending it (AGENTS.md, punch through).
  punch_through_m: 5.0
  damage: { radiation: 30 }   # total 30

# incarnon_evolutions: see data/weapons/secondary/onos.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Onos
  # WFCD `attacks`: "Incarnon Form Held Damage"
