id: onos_incarnon
name: Onos (Incarnon Form)
slot: secondary
weapon_type: secondary
class: pistol
form: incarnon

transform_group: onos
transforms_from: onos

# see notes: bulk_intake_stats_are
#
# THE CHARGED SHOT IS THIS FORM, AND IT IS THE PART THAT IS MISSING. What this
# entry carries is the beam that plays WHILE the cannon charges; what the form
# is FOR is the blast at the end of that charge, and a fight simulated without
# it reports a weapon that cannot kill anything. The arithmetic of one cycle,
# from the wiki's own attack rows: 8 beam ticks at 30 Radiation against 2,200
# Heat direct plus 1,100 Heat radial — the beam is a ninth of it.
unmodeled:
  - "The Incarnon Form's charged shot is not modelled, and it is most of the form: 2,200 Heat with guaranteed status, 38% crit and 3.2x, with the beam's 5 m punch through. It costs 50 of the 350 Incarnon rounds, so one gauge is seven charged shots. The number reads low."
  - "The charged shot's explosion is not modelled either: 1,100 Heat in 3 m at 38% crit and 3.2x, falling off to 70% at the rim, needing no line of sight."
  - "The beam's charge ramp is not modelled: its damage climbs to 2.5x the longer the trigger is held, resetting on release or on a charged shot. The beam here is scored at its lowest."

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 12
    rounds_per_charge: 30
    max_rounds: 350
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  # see notes: incarnon_package_transition_time
  transmute_in_seconds: 3.0
  transmute_out_seconds: 1.0

pseudo_reload:
  magazine: 350

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: held
  shot_type: projectile
  projectile_speed_mps: 40
  fire_rate: 2
  multishot: 1.0
  ammo_cost: 1                  # of the 350-round charge pool
  crit_chance: 0.14
  crit_multiplier: 1.6
  status_chance: 0.18
  # Module:Weapons/data, this form's own attack row (Incarnon Form Held Damage). It read 0.0
  # until 2026-08-21 — not a measurement, an unfilled field, and one that
  # was harmless while the arena had a single body and stopped being so
  # when `space::traverse` started spending it (AGENTS.md, punch through).
  punch_through_m: 5.0
  damage: { radiation: 30 }   # total 30

# incarnon_evolutions: see data/weapons/secondary/onos.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Onos
  # wiki module Attacks[].AttackName: "Incarnon Form Held Damage"
