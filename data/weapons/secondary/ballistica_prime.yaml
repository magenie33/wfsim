id: ballistica_prime
name: Ballistica Prime
slot: secondary
class: pistol
form: charged
default_form: true
mod_pools: [pistol]
mastery_rank: 14
max_rank: 30

# see notes: two_weapons_model_base
transform_group: ballistica_prime
transforms_to: ballistica_prime_incarnon

# see notes: bulk_intake_stats_are_2
unmodeled:
  - "the Normal Shot is not modelled — this entry carries only the Charged Shot"
accuracy: 4
disposition: 1.2
polarities: [naramon, madurai, madurai]
exilus_polarity: naramon
riven_family: Ballistica
traits: [incarnon, prime]
introduced: "Update 21.6"
internal_name: /Lotus/Weapons/Tenno/Pistols/PrimeBallistica/PrimeBallistica
noise: silent
ammo_type: secondary
ammo_max: 210
ammo_pickup: 40
magazine: 8
reload_seconds: 1.2

# see notes: catalog_gives_attack_own
#
#   |{{Weapon|Ballistica Prime}}||Charged Shot||Projectile||76||38||50%||Adding||Uses uncharged damage value
#
# "CO Damage Bonus Relative To Base Damage" IS `co_base_fraction`: the CO term
# multiplies 50% of this attack's damage, because the bonus is computed on the
# UNCHARGED value while the shot deals the charged one.
co_behavior: additive_with_base_damage
co_base_fraction: 0.5

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 50
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 140
  fire_rate: 3.33
  charge_seconds: 0.8
  charge_cadence: draw_then_rate
  multishot: 4.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2
  status_chance: 0.15
  # "Charged shots have 1 meter Punch Through" (wiki).
  punch_through_m: 1.0
  damage: { impact: 3.8, slash: 30.4, puncture: 41.8 }   # total 76.0

# incarnon_evolutions: definitions live in data/evolutions/ballistica_prime_*.yaml.

source:
  url: https://wiki.warframe.com/w/Ballistica_Prime
