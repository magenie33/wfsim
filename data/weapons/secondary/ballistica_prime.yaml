id: ballistica_prime
name: Ballistica Prime
slot: secondary
class: pistol
form: charged
default_form: true
mod_pools: [pistol]
mastery_rank: 14
max_rank: 30

# see notes: two_weapons_model_base
transform_group: ballistica_prime
transforms_to: ballistica_prime_incarnon

# see notes: bulk_intake_stats_are
unmodeled:
  - "a PARTLY charged shot is not modelled — releasing early fires a shot worth (1 + charge progress) times the Normal Shot, so a 50% charge deals 1.5x it, and this entry carries only the two ends of that ramp: no charge at all, and the full charge that fires this attack instead"
  - "a charged-shot KILL leaves a GHOST of the enemy that fights beside you for 7 seconds — this arena holds one wielder and one target, so nothing is spawned and none of what a ghost would kill is counted here"
accuracy: 4
disposition: 1.2
polarities: [naramon, madurai, madurai]
exilus_polarity: naramon
riven_family: Ballistica
traits: [incarnon, prime]
introduced: "Update 21.6"
internal_name: /Lotus/Weapons/Tenno/Pistols/PrimeBallistica/PrimeBallistica
noise: silent
ammo_type: secondary
ammo_max: 210
ammo_pickup: 40
# THE MAGAZINE IS COUNTED IN AMMO, NOT IN SHOTS: wiki infobox "Magazine Size
# 32" with "Ammo Cost 4" on both attacks, so the 210 reserve is 52 shots.
magazine: 32
reload_seconds: 1.2

# see notes: catalog_gives_attack_own
#
#   |{{Weapon|Ballistica Prime}}||Charged Shot||Projectile||76||38||50%||Adding||Uses uncharged damage value
#
# "CO Damage Bonus Relative To Base Damage" IS `co_base_fraction`: computed on
# the UNCHARGED value, and the charge x2 reaches it too — 80 against 152,
# measured (M66). That is 40/76, which the catalog rounds to 50%.
co_behavior: additive_with_base_damage
co_base_fraction: 0.526316

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 50
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 140
  fire_rate: 3.33
  charge_seconds: 0.8
  charge_cadence: draw_then_rate
  multishot: 4.0
  ammo_cost: 4
  crit_chance: 0.2
  crit_multiplier: 2
  status_chance: 0.15
  # "Charged shots have 1 meter Punch Through" (wiki).
  punch_through_m: 1.0
  # see notes: charge_x2_is_the_primes_alone
  damage: { impact: 7.6, slash: 60.8, puncture: 83.6 }   # 2 x 76 = 152.0

# incarnon_evolutions: definitions live in data/evolutions/ballistica_prime_*.yaml.

source:
  url: https://wiki.warframe.com/w/Ballistica_Prime
