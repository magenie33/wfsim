id: staticor_uncharged
name: Staticor
# THE UNCHARGED THROW: a smaller orb with a 2.4 m blast, fired without waiting.
inherits: staticor
form: base
transform_group: staticor

introduced: "18.4.7"

# see notes: inherited_co_catalog_gives_3
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 60
  fire_rate: 3.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.14
  crit_multiplier: 2.2
  status_chance: 0.28
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # see notes: no_range_row_attack
  damage: { radiation: 44 }   # total 44
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 2.4
    falloff_start_m: 0.0
    falloff_reduction: 0.3
    crit_chance: 0.0
    crit_multiplier: 1.0
    status_chance: 0.28
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { radiation: 88 }   # total 88

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Staticor
