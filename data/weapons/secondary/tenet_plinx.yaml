id: tenet_plinx
name: Tenet Plinx
slot: secondary
# MASTERY RANK 6, which makes it far and away the cheapest thing in this batch,
# and a 44% crit chance on the primary fire. Its alternate fire is where the
# weapon actually lives — see that entry, and note that its damage is
# MULTIPLIED BY THE MAGAZINE, which makes Magazine Capacity a damage stat on
# this weapon exactly as it is on the Phantasma.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]
transform_group: tenet_plinx
mastery_rank: 6
# RANK 40, NOT 30 — "Polarizing the weapon increases its max rank by 2, capping
# at rank 40 after 5 polarizations, granting the weapon additional mod
# capacity" (docs/INVESTMENT.md).
max_rank: 40

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items, which DISAGREES on one field:
# WFCD holds an older DISPOSITION. The wiki wins (data/README.md), and
# `scripts/audit_weapon_stats.py` carries the divergence with its reason
# so it cannot be mistaken for a transcription error.
accuracy: 50.0
disposition: 0.8             # riven disposition
polarities: [madurai, madurai]
exilus_polarity: madurai
riven_family: Plinx
traits: [corpus, tenet]
introduced: "32.2"
internal_name: /Lotus/Weapons/Corpus/BoardExec/Secondary/CrpBEPlinx/CrpBEPlinxWeapon
noise: alarming
ammo_type: secondary
# NO AMMO POOL — "Does not use ammo pickups; ammo regenerates over time." Zero
# is the fact here, not a gap in the transcription.
ammo_max: 0
ammo_pickup: 0
magazine: 10
reload_seconds: 1.3

# THE BATTERY — "Has a 0.8 second delay after the weapon stops firing before
# regenerating ammo. Then, regenerates 20 ammo per second; takes 0.5 seconds to
# regenerate a fully depleted battery excluding the delay."
#
# ONE DELAY, so both fields carry it: nothing on this page tells a partial
# battery from an empty one, and inventing a difference would be inventing a
# fact. The ALTERNATE FIRE states its own longer wait and carries it there.
battery:
  regen_per_second: 20.0
  delay_empty_seconds: 0.8
  delay_partial_seconds: 0.8

# Condition Overload: NO row for the PRIMARY fire in the wiki's CO catalog
# (re-read 2026-08-20) — ordinary Additive at the full +100%. The catalog names
# this weapon's ALT FIRE and only that, which is why the two entries answer
# differently; absence means ORDINARY.
co_behavior: additive_with_base_damage

# THE PROGENITOR BONUS — verbatim: "Comes with an additional bonus Impact, Heat,
# Cold, Electricity, Toxin, Magnetic, or Radiation damage, based on the Sister's
# progenitor Warframe, which increases the listed base damage of the weapon by
# 25%-60%." A Heat progenitor merges into the 30 Heat this already deals; the
# other six arrive beside it.
valence:
  elements: [impact, heat, cold, electricity, toxin, magnetic, radiation]
  min: 0.25
  max: 0.60

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 1.0
    max_deg: 3.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 3.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.44
  crit_multiplier: 3.0
  status_chance: 0.12
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, Semi-Auto: "Range: 100.0 m", Hit-Scan — a third of the ordinary 300 m
  # a hit-scan weapon reads, and one of the few that states a number in between.
  range_m: 100.0
  # "This weapon deals primarily Puncture damage and has innate Heat damage on
  # its primary fire" — and the split says so.
  damage: { puncture: 40, heat: 30 }   # total 70

source:
  url: https://wiki.warframe.com/w/Tenet_Plinx
