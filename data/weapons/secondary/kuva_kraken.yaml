id: kuva_kraken
name: Kuva Kraken
slot: secondary
# A BURST PISTOL WITH A MAGAZINE DUMP. Normal fire is a three-round burst; the
# alt-fire "expels all remaining ammunition in the magazine in a single burst"
# at 20 rounds a second, which is a burst whose COUNT IS THE MAGAZINE — see
# `kuva_kraken_mag_burst`, where that costs an admission.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: kuva_kraken
mod_pools: [pistol]
mastery_rank: 15
# RANK 40 after 5 polarizations — 80 capacity (docs/INVESTMENT.md).
max_rank: 40

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 16.0
disposition: 1.1
polarities: []
exilus_polarity: madurai
riven_family: Kraken
traits: [grineer, kuva_lich]
introduced: "26"
internal_name: /Lotus/Weapons/Grineer/KuvaLich/Secondaries/Kraken/KuvaKraken
noise: alarming
ammo_type: secondary
ammo_max: 210
ammo_pickup: 40
magazine: 21
reload_seconds: 1.5

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-19) —
# ordinary Additive at the full +100%.
co_behavior: additive_with_base_damage

# THE PROGENITOR BONUS — see data/weapons/primary/kuva_karak.yaml for the
# quoted Characteristic. Seven elements, never Puncture and never Slash.
valence:
  elements: [impact, heat, cold, electricity, toxin, magnetic, radiation]
  min: 0.25
  max: 0.60

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.5
    max_deg: 12
  trigger: burst
  # THREE A PULL, and `fire_rate` counts PULLS.
  burst:
    count: 3
    delay_seconds: 0.083     # module BurstDelay
  shot_type: hit_scan
  fire_rate: 2.83
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.21
  crit_multiplier: 2.3
  status_chance: 0.29
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m", Hit-Scan
  range_m: 300.0
  damage: { impact: 32.25, puncture: 5.375, slash: 5.375 }   # total 43

unmodeled:
  - "the hip-fire recoil is not modelled — the page notes the burst kicks significantly harder when fired from the hip, and this arena has no recoil at all"

source:
  url: https://wiki.warframe.com/w/Kuva_Kraken
