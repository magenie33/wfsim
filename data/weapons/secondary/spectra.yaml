id: spectra
name: Spectra
slot: secondary
# THE ORDINARY SPECTRA: an 18-metre cutting laser with half a metre of innate
# punch through — one body's worth exactly — and the same 25% ramp floor its
# Vandal carries. The Vandal reaches 22 m and hits a fifth harder.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]         # CompatibilityTags BEAM
mastery_rank: 4
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 100.0
disposition: 1.49           # riven disposition
polarities: []               # the infobox states none
exilus_polarity: madurai
riven_family: Spectra
traits: [corpus]
introduced: "9.0"
internal_name: /Lotus/Weapons/ClanTech/Energy/CrpLaserPistol
noise: alarming
ammo_type: secondary
ammo_max: 360
ammo_pickup: 40
magazine: 60
reload_seconds: 1.8

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

# WHERE THE RAMP STARTS. "Damage ramps up from 25% to 100% over 0.6 seconds when
# firing. After firing stops for 0.8 seconds, the damage decays back to 25% over
# 2 seconds" — the same floor the Vandal carries.
beam_ramp_floor: 0.25

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: held                 # continuous: `fire_rate` is TICKS per second
  shot_type: hit_scan
  fire_rate: 12
  multishot: 1.0
  ammo_cost: 0.5
  crit_chance: 0.14
  crit_multiplier: 2.0
  status_chance: 0.22
  punch_through_m: 0.5
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 18.0 m", Hit-Scan.
  range_m: 18.0
  damage: { puncture: 7.56, slash: 10.44 }   # total 18

unmodeled:
  - "Sequence Burn, the Spectra-exclusive mod — a weapon-exclusive card outside the pools this roster loads"

source:
  url: https://wiki.warframe.com/w/Spectra
