id: efv_8_mars_alt
name: EFV-8 Mars
# THE GRENADE: a projectile with a three-metre explosion behind it.
inherits: efv_8_mars
form: charged
transform_group: efv_8_mars

introduced: "38.5"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of this
# weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 5.0
    max_deg: 15.0
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 22
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 3
  crit_chance: 0.27
  crit_multiplier: 2.1
  status_chance: 0.33
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { corrosive: 35 }   # total 35
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 3.0
    falloff_start_m: 0.0
    falloff_reduction: 0.8
    crit_chance: 0.27
    crit_multiplier: 2.1
    status_chance: 0.33
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { corrosive: 313 }   # total 313

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/EFV-8_Mars
