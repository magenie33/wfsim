id: cyanex_burst
name: Cyanex
# BURST MODE: the magazine fired in one pull.
inherits: cyanex
form: alt_fire
transform_group: cyanex

introduced: "25.0"

# see notes: condition_overload_catalog_names
#
#   Cyanex | Burst Mode | Projectile | 72 | 72 | 100% | Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 1.0
    max_deg: 1.5
  trigger: burst
  shot_type: projectile
  projectile_speed_mps: 60
  fire_rate: 4.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.08
  crit_multiplier: 1.4
  status_chance: 0.32
  # Alt-Fire burst: "Innate 0.5 meter punch through and Infinite Body Punch
  # Through" (wiki Cyanex); the 0.5 is the surface half. see notes: infinite_body_punch_through
  punch_through_m: 0.5
  infinite_body_punch_through: true
  # see notes: no_range_row_attack
  damage: { impact: 2.88, puncture: 30.24, slash: 38.88 }   # total 72
  # THE BURST COUNT IS THE MAGAZINE, which is the one thing this entry cannot
  # say properly: `count` is a constant and the real number is however many
  # rounds are left. 11 is the UNMODDED magazine — the Tenet Detron's call.
  burst:
    count: 11
    delay_seconds: 0.08     # module BurstDelay

unmodeled:
  - "The burst empties the magazine, and this entry fires a fixed count, the unmodded magazine. Magazine mods lengthen the burst (page), so a build with one reads low."

source:
  url: https://wiki.warframe.com/w/Cyanex
