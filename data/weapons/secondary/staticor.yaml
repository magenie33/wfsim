id: staticor
name: Staticor
slot: secondary
# A CHARGED ENERGY THROWER: one second of charge for a 9.6 m Radiation blast,
# which is the arsenal's own display (`_TooltipAttackDisplay: 4`).
class: pistol
form: charged
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: staticor
mod_pools: [pistol]   # CompatibilityTags PROJECTILE, AOE
mastery_rank: 10
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items, which DISAGREES on one field:
# WFCD's magazine is in SHOTS (48 rounds = 12 at 4 apiece). The wiki wins (data/README.md), and
# `scripts/audit_weapon_stats.py` carries the divergence with its reason
# so it cannot be mistaken for a transcription error.
accuracy: 16.7
disposition: 0.9            # riven disposition
polarities: [naramon]
exilus_polarity: madurai
riven_family: Staticor
traits: [corpus]
introduced: "18.4.7"
internal_name: /Lotus/Weapons/Corpus/Pistols/CrpElectroMag/CrpElectroMag
noise: alarming
ammo_type: secondary
ammo_max: 288
ammo_pickup: 20
magazine: 48
reload_seconds: 1.5

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20)
# — ordinary Additive at the full +100%. The catalog gives a class PER
# ATTACK and none of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 40
  fire_rate: 3.5
  charge_seconds: 1
  multishot: 1.0
  ammo_cost: 5
  crit_chance: 0.14
  crit_multiplier: 2.2
  status_chance: 0.28
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { radiation: 44 }   # total 44
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 9.6
    falloff_start_m: 0.0
    falloff_reduction: 0.9
    crit_chance: 0.14
    crit_multiplier: 2.2
    status_chance: 0.28
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { radiation: 106 }   # total 106

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Staticor
