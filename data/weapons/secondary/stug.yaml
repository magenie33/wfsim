id: stug
name: Stug
slot: secondary
weapon_type: secondary
class: pistol
form: base
default_form: true
mod_pools: [pistol]
mastery_rank: 2
max_rank: 30

# see notes: two_weapons_model_base
transform_group: stug
transforms_to: stug_incarnon

# see notes: bulk_intake_stats_are_2
unmodeled:
  - "The Incarnon form's bouncing secondary projectiles are not modelled: a stacked shot releases 2 to 5, each exploding on up to 3 bounces."
  - "The charged alt-fire is not modelled: a full 10-stack blob over 2 s, for 10 ammo."
  - "Unmeasured: how many stacks a shot lays. Read as floor(multishot), the count the Grimoire's multishot buys; rolling the fraction would lay more."
  - reason: blob_over_cap
    cap: 10
  - reason: blob_crossing_cap
    cap: 10
  - "Unmeasured: the explosion's falloff is read as 70%, from the page's bug note, rather than the 30% in its table."
  - "Unmeasured: when a body dies, its pile is read as staying where it stood and going off on whoever is there."
accuracy: 100
disposition: 1.2
polarities: [vazarin]
exilus_polarity: madurai
riven_family: Stug
traits: [incarnon, grineer]
introduced: "Update 11.5"
internal_name: /Lotus/Weapons/Grineer/Pistols/GrineerCrossbow/GrineerGooGun
noise: alarming
ammo_type: secondary
ammo_max: 210
ammo_pickup: 40
magazine: 20
reload_seconds: 2

# CONDITION OVERLOAD DOES NOT APPLY TO THIS WEAPON. The wiki's CO catalog,
# verbatim: "Stug | Blob Impact | 0% | Does not apply". It is the only
# entry in the roster that takes `inert` — a blob has no direct hit for a
# per-status bonus to attach to.
co_behavior: inert

attack:
  extra_hit_reads: even   # see notes: extra_hit_reads
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: hit_scan
  projectile_speed_mps: 35
  fire_rate: 4
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.05
  crit_multiplier: 1.5
  status_chance: 0.1
  punch_through_m: 0.0
  damage: { corrosive: 4 }   # total 4
  # THE BLOB ECONOMY — docs/MECHANICS.md §7.3, M109. Verbatim (wiki Stug):
  # "After reaching 10 stacks or the lifespan running out, the blob will
  # detonate and deal 75 - 750 damage in a 0.3 - 2.8 meter radius, scaling
  # with the number of stacks." — so one stack is the module's Blob Explosion.
  blob:
    cap: 10
    lifespan_seconds: 1.5            # "with a lifespan of 1.5 seconds"
    radius_at_cap_m: 2.8
    explosion:
      damage: { corrosive: 75 }
      radius_m: 0.3
      falloff_start_m: 0
      # THE PAGE'S BUG NOTE, not its table: "Despite the UI listing the weapon's
      # radial damage falloff as only 30% (dealing 100% - 70% damage over its
      # range), it is actually 70% (dealing 100% - 30% damage over its range)".
      falloff_reduction: 0.7

# incarnon_evolutions: definitions live in data/evolutions/stug_*.yaml.

source:
  url: https://wiki.warframe.com/w/Stug
