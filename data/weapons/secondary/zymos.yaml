id: zymos
name: Zymos
slot: secondary
# AN INFESTED PISTOL WHOSE HEADSHOTS SPAWN HOMING SPORES. The shot is a 3.3 m
# blast; the spores are two further attacks this engine has no shape for.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]
mastery_rank: 11
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 9.8
disposition: 1.2            # riven disposition
polarities: [madurai, naramon]
exilus_polarity: naramon
riven_family: Zymos
traits: [infested]
introduced: "29"
internal_name: /Lotus/Weapons/Infested/Pistols/InfUzi/InfUziWeapon
noise: alarming
ammo_type: secondary
ammo_max: 51
ammo_pickup: 40
magazine: 17
reload_seconds: 3.2

# see notes: condition_overload_no_row_3
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.5
    max_deg: 20.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 79
  fire_rate: 1.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.05
  crit_multiplier: 2.3
  status_chance: 0.3
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # see notes: no_range_row_attack
  damage: { impact: 9.2, puncture: 13.8 }   # total 23
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 3.3
    falloff_start_m: 0.0
    falloff_reduction: 0.3
    crit_chance: 0.05
    crit_multiplier: 2.3
    status_chance: 0.3
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { toxin: 61 }   # total 61

unmodeled:
  - "A HEADSHOT SPAWNS SIX HOMING SPORES that seek other enemies and explode in 3.3 metres each, and the headshot itself carries a further explosion (module: three more attacks). This engine carries one explosion per attack and has no shape for a hit spawning projectiles, so none of that is counted — against a headshot-heavy fight this weapon is understated several times over"
  - reason: explosion_ignores_cover
  - reason: self_stagger

