id: kompressa_prime
name: Kompressa Prime
slot: secondary
# THE KOMPRESSA AT NEARLY TRIPLE THE CRIT CHANCE, a 46-damage bubble and a 2.8 m
# radius. The lowest riven disposition in the secondary roster, which is the
# game's own verdict on it.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]   # CompatibilityTags PROJECTILE, AOE
mastery_rank: 13
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 3.8
disposition: 0.6            # riven disposition
polarities: [vazarin, naramon]
exilus_polarity: madurai
riven_family: Kompressa
traits: [tenno]
introduced: "38.6"
internal_name: /Lotus/Weapons/Tenno/Pistols/PrimeKompressa/PrimeKompressa
noise: alarming
ammo_type: secondary
ammo_max: 144
ammo_pickup: 20
magazine: 12
reload_seconds: 1.8

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 23.0
    max_deg: 30.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 40
  fire_rate: 3.33
  multishot: 4.0
  ammo_cost: 1
  crit_chance: 0.16
  crit_multiplier: 1.8
  status_chance: 0.36
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on the direct-hit block — the 2.8 m below is the
  # explosion's RADIUS and not a reach. See data/surveys/weapon_range.yaml.
  damage: { viral: 2 }   # 2 a pellet, 8 a shot
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 2.8
    falloff_start_m: 0.0
    falloff_reduction: 0.2
    crit_chance: 0.16
    crit_multiplier: 1.8
    status_chance: 0.36
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { viral: 46 }   # total 46

unmodeled:
  - "the bubbles explode 0.6-0.8 SECONDS after they land, which the page says 'may allow enemies to move out of the explosion range if not directly hit' — this engine resolves the blast at the point of impact immediately, so nothing ever escapes one here"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Kompressa_Prime
