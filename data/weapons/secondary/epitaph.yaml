id: epitaph
name: Epitaph
slot: secondary
# A ZARIMAN PISTOL WHOSE CHARGED SHOT IS THE ARSENAL'S OWN — a 0.36 s charge for
# a Cold projectile. The UNCHARGED shot is the one with the explosion.
class: pistol
form: charged
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: epitaph
mod_pools: [pistol]   # CompatibilityTags PROJECTILE, SINGLESHOT, AOE
mastery_rank: 8
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 80.0
disposition: 0.6            # riven disposition
polarities: [madurai, madurai]
exilus_polarity: naramon
riven_family: Epitaph
traits: []
introduced: "30"
internal_name: /Lotus/Weapons/Tenno/Pistols/TnWraitheSidearm/TnWraitheSidearmWeapon
noise: alarming
ammo_type: secondary
ammo_max: 40
ammo_pickup: 20
magazine: 1
reload_seconds: 0.6

# Condition Overload: THE CATALOG NAMES THIS ATTACK. Verbatim
# (docs/CATALOGS.md §1):
#
#   Epitaph | Charged Shot | Projectile | 300 | 300 | 100% | Multiplying
#
# THIS ENTRY READ ADDING AT 100% UNTIL 2026-08-20, which was the
# ordinary class assumed because nobody had opened the catalog for this
# weapon — the check was run against our own transcription of it, which
# only ever carried the rows the roster already had.
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 1.0
    max_deg: 1.5
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 200
  fire_rate: 1.5
  charge_seconds: 0.36
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.48
  crit_multiplier: 2.6
  status_chance: 0.04
  punch_through_m: 2.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { impact: 120, puncture: 45, slash: 135 }   # total 300

source:
  url: https://wiki.warframe.com/w/Epitaph
