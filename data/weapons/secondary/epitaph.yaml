id: epitaph
name: Epitaph
slot: secondary
weapon_type: secondary
# A ZARIMAN PISTOL WHOSE CHARGED SHOT IS THE ARSENAL'S OWN — a 0.36 s charge for
# a Cold projectile. The UNCHARGED shot is the one with the explosion.
class: pistol
form: charged
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: epitaph
mod_pools: [pistol]   # CompatibilityTags PROJECTILE, SINGLESHOT, AOE
mastery_rank: 8
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 80.0
disposition: 0.6            # riven disposition
polarities: [madurai, madurai]
exilus_polarity: naramon
riven_family: Epitaph
traits: []
introduced: "30"
internal_name: /Lotus/Weapons/Tenno/Pistols/TnWraitheSidearm/TnWraitheSidearmWeapon
noise: alarming
ammo_type: secondary
ammo_max: 40
ammo_pickup: 20
magazine: 1
# THE ARSENAL PRINTS 0.6 s AND NOTHING READS IT: the weapon never reloads
# (`attack.no_magazine`, M114). Kept so the panel shows the arsenal's line.
reload_seconds: 0.6

# see notes: condition_overload_catalog_names
#
#   Epitaph | Charged Shot | Projectile | 300 | 300 | 100% | Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 1.0
    max_deg: 1.5
  # NO CLIP AND NO RELOAD: a shot draws straight from the reserve, so a charged
  # shot is the draw plus the listed rate's interval and nothing after it.
  # Owner-measured (M114); the wiki says it too — "No magazine; does not need
  # to reload", "Epitaph's displayed 0.6s reload time has no purpose". Drop the
  # flag and every shot pays 0.6 s more and fires every on-reload effect.
  no_magazine: true
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 200
  fire_rate: 1.5
  charge_seconds: 0.36
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.48
  crit_multiplier: 2.6
  status_chance: 0.04
  punch_through_m: 2.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # see notes: no_range_row_attack
  damage: { impact: 120, puncture: 45, slash: 135 }   # total 300

source:
  url: https://wiki.warframe.com/w/Epitaph
