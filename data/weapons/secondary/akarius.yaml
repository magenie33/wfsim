id: akarius
name: Akarius
slot: secondary
weapon_type: secondary
class: dual_pistols
form: base
default_form: true
mod_pools: [pistol]
mastery_rank: 8
max_rank: 30

# A DUAL ROCKET LAUNCHER, and every number here is the wiki's own
# `Module:Weapons/data/secondary` — the per-attack `FireRate` of 4.33, not a
# top-level per-burst average, the same split the roster's other burst
# weapons have.

# WHAT THIS SIM DOES NOT MODEL ABOUT IT. Read off the weapon PAGE rather than
# the module, which carries none of it (WEAPON_INTAKE §"READ THE PAGE").
unmodeled:
  - "The rockets home within 15 degrees; every shot here hits anyway, so homing adds nothing."
  - "The +50% reload speed while sprinting is not modelled: the player stands still here (Gauss and Gauss Prime double it to +100%)."
  - "Self-stagger is not modelled: an explosion at the wielder's feet can interrupt the 2-round burst so only one rocket fires (wiki)."
  - "The rockets aim for the torso, so a high headshot rate is not reachable in play, though this entry uses whatever is set."
accuracy: 26.7
disposition: 1.05
polarities: [naramon, naramon]
exilus_polarity: madurai
riven_family: Akarius
traits: [tenno]
introduced: "Update 25.7"
internal_name: /Lotus/Weapons/Tenno/Pistols/SapientPistol/SapientPistol
noise: alarming
ammo_type: secondary
ammo_max: 20
ammo_pickup: 5
magazine: 10
reload_seconds: 3.4

# CARRIED FROM `akarius_prime` — see notes: co_carried_from_the_family
co_behavior: independent

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 2.5
    max_deg: 5
  trigger: burst
  # TWO ROCKETS A PULL, and the listed `fire_rate` counts PULLS. The wiki's
  # Notes name the count outright — "the guaranteed 2-round burst" — and the
  # module carries `BurstCount = 2`, `BurstDelay = 0.12`. Reading 4.33 as
  # rounds per second would halve this weapon.
  burst:
    count: 2
    delay_seconds: 0.12
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 4.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.06
  crit_multiplier: 1.8
  status_chance: 0.28
  punch_through_m: 0.0
  # ROCKET IMPACT — the direct hit. The explosion is the second instance below.
  damage: { impact: 68 }   # total 68

  # ROCKET DETONATION. Its own crit and status, the same as the impact's, and
  # the falloff the module lists.
  radial:
    damage: { blast: 419 }   # total 419
    radius_m: 7.2
    falloff_start_m: 0
    falloff_reduction: 0.7
    crit_chance: 0.06
    crit_multiplier: 1.8
    status_chance: 0.28
    # No row for this explosion, and CO is a direct-hit bonus everywhere the
    # catalog does not say otherwise — so it takes none (the engine's default).

source:
  url: https://wiki.warframe.com/w/Akarius
