id: tenet_plinx_charged
name: Tenet Plinx
# THE CHARGED SLUG, and the second weapon in the roster where MAGAZINE CAPACITY
# IS A DAMAGE STAT. The page states the rule and then, in its Notes, states the
# arithmetic outright:
#
#   "Damage is multiplied by magazine size. Damage bonus is multiplicative to
#    other damage buffs."
#   "Despite the damage values listed on the arsenal, the attack deals 100
#    Impact on contact and 100 Radiation on explosion, multiplied by the
#    magazine capacity."
#
# So an unmodded Plinx, whose magazine is 10, deals 1000 and 1000 — and the CO
# catalog confirms the first half from a completely different direction, listing
# this attack's unmodded damage as 1000 rather than 100. Both numbers below are
# therefore a FULL MAGAZINE of 10, which is the same convention the Phantasma's
# charged entry uses.
#
# `alt_fire` rather than `charged`: the charge is a fixed 0.8 s that costs no
# gauge and replaces nothing about the cadence the way a bow's draw does — this
# is a second trigger, and the id is what a saved preset and a share link carry
# forever.
inherits: tenet_plinx
form: alt_fire
transform_group: tenet_plinx

introduced: "32.2"

# ONE SHOT IS ONE MAGAZINE — "Alternate Fire only consumes a full magazine,
# resulting in a 1-round magazine and must fully recharge for every shot", and
# "Reload delay of 2 seconds after using the alternate fire". The module gives
# this attack its own Reload of 2.5 s, which is that delay plus the refill.
magazine: 1
reload_seconds: 2.5

# NOT INHERITED — the CO catalog gives a class per ATTACK, and it names THIS one
# where the primary fire has no row. Verbatim (docs/CATALOGS.md §1):
#
#   Weapon      | Attack Name     | Projectile Type | Base Attack Damage
#               | CO Damage Bonus at +100% | CO Damage Bonus Relative To Base
#               Damage | Math/Behavior Type | Notes
#   Tenet Plinx | Alt Fire Impact | Projectile      | 1000 | 1000 | 100%
#               | Multiplying | "Scales properly with magazine size"
#
# The Base Attack Damage cell is 1000, not the 100 the infobox lists — which is
# the catalog independently confirming the magazine multiplier above.
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). Perfect, where the
  # primary fire's is 1-3 degrees.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi
  # "Alternate Fire charges up a shot in 0.8 seconds."
  charge_seconds: 0.8
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 1.0
  multishot: 1.0
  # A FULL MAGAZINE, and the alt fire will not fire without one: "Alt-fire will
  # only fire if the magazine is full. Attempting to alt fire with partially
  # full magazine will result in nothing happening."
  ammo_cost: 10
  crit_chance: 0.40
  crit_multiplier: 3.0
  status_chance: 0.20
  punch_through_m: 0.0
  # NO RANGE ROW on the Alt-Fire block — Projectile at 100 m/s. Its 6.0 m sits
  # under the Alt-Fire AoE block and is a RADIUS. See
  # data/surveys/weapon_range.yaml.
  forced_procs: [impact]
  damage: { impact: 1000 }   # 100 x the unmodded magazine of 10

  # THE EXPLOSION — 100 Radiation multiplied by the same magazine, so 1000 here
  # too. Its Forced Procs cell reads RAGDOLL, which is not a damage type and so
  # is not in `forced_procs`: that field carries proc TYPES the damage model
  # knows, and a ragdoll deals none. It is admitted below instead. Per the
  # page's Notes it also carries a status chance the arsenal gets wrong: "Despite the status chance value listed on the
  # arsenal, the alt-fire AoE has 50% status chance, not 20%." Fifty is what is
  # transcribed; the module agrees.
  radial:
    damage: { radiation: 1000 }
    radius_m: 6.0
    falloff_start_m: 0.0
    # "Explosion has linear Damage Falloff from 100% to 60% from central
    # impact" — two fifths removed at the rim.
    falloff_reduction: 0.4
    crit_chance: 0.40
    crit_multiplier: 3.0
    status_chance: 0.50

unmodeled:
  - "MAGAZINE CAPACITY IS A DAMAGE STAT here and this entry pins it at the unmodded 10 — \"Increasing Magazine Capacity (Slip Magazine, Primed Slip Magazine, Ice Storm, Tainted Clip, Combo Fury) will increase the Alternate Fire's damage\", multiplicatively with base-damage mods. A build carrying one is understated by exactly that ratio"
  - "the 0.8 second EMBED DELAY before the slug detonates, during which it pulls enemies within 6 metres in — the pull is a crowd mechanic and the delay is time this arena does not charge"
  - "Fulmination does not reach the PULL radius, only the blast, which is a distinction that costs nothing while the pull itself is unmodelled"
  - "the explosion's forced RAGDOLL, and the alt fire's forced KNOCKDOWN on embed — both are crowd control, which is worth time and safety rather than damage. Nothing shoots back here and a body does not move, so neither pays"
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Tenet_Plinx
