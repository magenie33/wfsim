id: atomos
name: Atomos
slot: secondary
class: pistol
form: base
default_form: true
mod_pools: [pistol]
mastery_rank: 5
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: atomos
transforms_to: atomos_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
accuracy: 12.5
disposition: 0.95
polarities: [vazarin]
exilus_polarity: madurai
riven_family: Atomos
traits: [incarnon]
introduced: "Update 16.5"
internal_name: /Lotus/Weapons/Grineer/Pistols/HeatGun/GrnHeatGun
noise: alarming
ammo_type: secondary
ammo_max: 350
ammo_pickup: 20
magazine: 70
reload_seconds: 2

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 8
    max_deg: 8
  trigger: held
  shot_type: hit_scan
  fire_rate: 8
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.15
  crit_multiplier: 1.7
  status_chance: 0.21
  punch_through_m: 0.0
  # THE CHAIN, transcribed from the weapon's own page (2026-08-17):
  #
  #   "When fired at an enemy, the beam will chain to the closest living enemy
  #    within 7 meters of the initial target. From there it will chain again, up
  #    to a maximum of 3 chains in total."
  #   "A chain will do 0.75^n times the main beam's damage, where n is the chain
  #    number" — 100% / 75% / 56.25% / 42.1875%, which is the COMPOUNDING shape.
  #
  # THE SPHERE IS NOT TRANSCRIBED. The page says only "a small radius of damage
  # around the beam, similar to the Ignis and Embolist" and gives no number, so
  # `damage_radius_m` is 0 rather than a guess: with none, only the body the
  # beam struck seeds a chain, which is the conservative reading.
  beam:
    range_m: 15.0
    damage_radius_m: 0.0
    radius_takes_multishot: false
    chain:
      hops: 3
      range_m: 7.0
      damage_per_hop: 0.75
      origin: radius_targets
  damage: { heat: 29 }   # total 29

# incarnon_evolutions: definitions live in data/evolutions/atomos_*.yaml.

source:
  url: https://wiki.warframe.com/w/Atomos
