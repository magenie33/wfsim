id: knell
name: Knell
slot: secondary
# THE ORDINARY KNELL: one round, a two-second reload, and the same Death Knell
# passive the Prime carries. The Prime doubles the crit chance, raises the
# multiplier from 1.5x to 2x and doubles the status — this one is 150 damage a
# shot against 180.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]         # CompatibilityTags SINGLESHOT
mastery_rank: 10
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 32.0
disposition: 1.25           # riven disposition
polarities: []               # the infobox states none
exilus_polarity: madurai
riven_family: Knell
traits: [tenno]
introduced: "21.0"
internal_name: /Lotus/Weapons/Tenno/Pistols/TnPriestPistolScope/TnPriestPistolWeapon
noise: alarming
ammo_type: secondary
ammo_max: 10
ammo_pickup: 40
magazine: 1
reload_seconds: 2

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.25
    max_deg: 6.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 4
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 1.5
  status_chance: 0.05
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m", Hit-Scan.
  range_m: 300.0
  damage: { impact: 63, puncture: 69, slash: 18 }   # total 150

unmodeled:
  - "'DEATH KNELL', and it is most of the weapon: a weak-point hit grants 100% ammo efficiency, +0.5x final critical multiplier and +20% final status chance, stacking to 3, each stack lasting 2 seconds and refreshed by the next weak-point hit (wiki). This engine has no headshot-TRIGGERED buff — a crit is rolled for a hit and the body part is drawn beside it — so none of the three is applied, and the ammo half in particular is what makes a one-round magazine playable. Read this number as the weapon with its passive switched off"
  - reason: zoom_steps

source:
  url: https://wiki.warframe.com/w/Knell
