id: zylok_prime
name: Zylok Prime
slot: secondary
class: pistol
form: base
default_form: true
mod_pools: [pistol]
mastery_rank: 13
max_rank: 30

# TWO WEAPONS MODEL: base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: zylok_prime
transforms_to: zylok_prime_incarnon

# BULK INTAKE. The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half: transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
unmodeled:
  - "the duplex trigger is not modelled — one pull fires TWO rounds in game and this entry paces one per pull"
accuracy: 23.53
disposition: 0.9
polarities: [naramon, madurai]
exilus_polarity: madurai
riven_family: Zylok
traits: [incarnon, prime]
introduced: "Update 34.0"
internal_name: /Lotus/Weapons/Tenno/Pistols/PrimeZylok/ZylokPrimePistol
noise: alarming
ammo_type: secondary
ammo_max: 210
ammo_pickup: 60
magazine: 12
reload_seconds: 1.2

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.5
    max_deg: 8
  trigger: duplex
  shot_type: hit_scan
  fire_rate: 1.8
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.12
  crit_multiplier: 2.4
  status_chance: 0.36
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m", Hit-Scan
  range_m: 300.0
  damage: { impact: 63, slash: 126, puncture: 21 }   # total 210

# incarnon_evolutions: definitions live in data/evolutions/zylok_prime_*.yaml.

source:
  url: https://wiki.warframe.com/w/Zylok_Prime
