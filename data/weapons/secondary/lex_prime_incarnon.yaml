id: lex_prime_incarnon
name: Lex Prime (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: lex_prime
transforms_from: lex_prime

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 10
    rounds_per_charge: 2
    max_rounds: 20
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2.35      # = base reload time, unmodded

pseudo_reload:
  magazine: 20
  reload_seconds: 3.35

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage


attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.5
    max_deg: 12
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 110
  fire_rate: 0.67
  multishot: 1.0
  ammo_cost: 1                  # of the 20-round charge pool
  crit_chance: 0.35
  crit_multiplier: 3
  status_chance: 0.44
  # see notes: guaranteed_impact_every_shot
  forced_procs: [impact]
  # INNATE INFINITE BODY PUNCH-THROUGH — the punch-through page's own exception
  # list, "Lex Prime (Incarnon Form)". Written as a number the sim can
  # hold, and it is the WHOLE mechanic here: the qualifier that goes with it separates BODIES
  # from geometry ("innate punch through does not apply to surfaces") and this
  # arena has no geometry, so everything the ray meets is a body.
  punch_through_m: 999.0
  # see notes: modelled_arena_has_no
  falloff:
    start_m: 10
    end_m: 18
    reduction: 0.3333   # fraction KEPT past end_m
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, Incarnon Form: "Range: 28.0 m", Projectile — the form trades reach for what it gains
  range_m: 28.0
  damage: { impact: 400, radiation: 800 }   # total 1200

# incarnon_evolutions: see data/weapons/secondary/lex_prime.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Lex_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"

