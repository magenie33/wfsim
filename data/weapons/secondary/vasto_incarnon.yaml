id: vasto_incarnon
name: Vasto (Incarnon Form)
slot: secondary
weapon_type: secondary
class: pistol
form: incarnon

transform_group: vasto
transforms_from: vasto

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 8
    rounds_per_charge: 3
    max_rounds: 24
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  # see notes: incarnon_package_transition_time
  transmute_in_seconds: 1.4
  transmute_out_seconds: 0.6

pseudo_reload:
  magazine: 24

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage


# CANNOT AIM DOWN SIGHTS, so nothing gated on aiming pays in this form.
#
# VERBATIM (Vasto_Incarnon_Genesis, the form's own description):
#   *Incarnon Form transforms into a 6-round burst with '''6''' base [[multishot]]
#    along with increased [[Critical Chance]] and [[Critical Multiplier]].
#    However, it has reduced base damage and [[Status Chance]] per bullet, has
#    significantly higher [[Recoil]], and cannot [[Zoom]].
#
# "ZOOM" IS THE WIKI'S WORD FOR AIMING, not for magnification: the [[Zoom]] page
# it links to opens "Zoom (or aiming, aiming down sights (ADS))", and the
# Galvanized mods write the state as `[[Zoom|aiming]]`.
#
# AND DE SETTLED WHAT IT COSTS, in a patch note about the one other thing in the
# game that cannot zoom — Mesa's Regulators: "Removed ability to unintentionally
# equip Hydraulic Crosshairs and Sharpened Bullets on Mesa's Regulators.
# Although the buff appeared to trigger, it never actually applied due to the
# 'on aim' criteria not being fulfilled." The Regulators page draws the same
# conclusion for four mods at once: "Since Regulators cannot zoom, they also
# cannot benefit from Embedded Catalyzer, Hydraulic Crosshairs, Pressurized
# Magazine, or Sharpened Bullets."
#
# THE BASE FORM AIMS NORMALLY — this is per FORM, and only this entry carries
# the flag. It is also the ONLY "cannot Zoom" in the whole Incarnon Evolutions
# page; the four "-30% Zoom" perks there reduce magnification and leave the
# aim state alone.
cannot_zoom: true

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 15.0
    max_deg: 35.0
    sampling:
      horizontal_ratio: 0.5
      uniform: false
      hip_min_deg: 15.0
      hip_max_deg: 35.0
  trigger: burst
  # THE BURST. The listed `fire_rate` counts PULLS, not rounds — so reading it
  # as rounds per second understates this weapon by its burst count. Both
  # numbers are the wiki's (Vasto: Burst Count 6, Burst Delay 0.1000 s).
  burst:
    count: 6
    delay_seconds: 0.1
  shot_type: hit_scan
  fire_rate: 2.5
  multishot: 6.0
  ammo_cost: 1                  # of the 24-round charge pool
  crit_chance: 0.3
  crit_multiplier: 2.8
  status_chance: 0.0266666666666667
  punch_through_m: 0.0
  # see notes: falloff_feeds_the_riven_pool
  falloff:
    start_m: 12.0
    end_m: 24.0
    reduction: 0.966666666667
  # see notes: wall_ramp_full_damage_4
  range_m: 300.0
  damage: { impact: 7.5, slash: 15, puncture: 7.5 }   # total 30.0

# incarnon_evolutions: see data/weapons/secondary/vasto.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Vasto_Incarnon_Genesis
  # wiki module Attacks[].AttackName: "Incarnon Form"

unmodeled:
  - reason: client_accuracy_runtime

# see notes: client_secondary_calibration
