id: ballistica
name: Ballistica
slot: secondary
class: pistol
form: charged
default_form: true
mod_pools: [pistol]
mastery_rank: 2
max_rank: 30

# see notes: two_weapons_model_base
transform_group: ballistica
transforms_to: ballistica_incarnon

# see notes: bulk_intake_stats_are_2
unmodeled:
  - "the Burst Shot is not modelled — this entry carries only the Charged Shot"
accuracy: 4
disposition: 1.25
polarities: [vazarin]
exilus_polarity: madurai
riven_family: Ballistica
traits: [incarnon]
introduced: "Update 10.4"
internal_name: /Lotus/Weapons/Tenno/Pistols/AutomaticHandCrossbow/AutoCrossBow
noise: silent
ammo_type: secondary
ammo_max: 210
ammo_pickup: 40
magazine: 16
reload_seconds: 2

# see notes: catalog_gives_attack_own
#
#   |{{Weapon|Ballistica}}||Charged Shot||Projectile||100||25||25%||Adding||Uses uncharged damage value
#
# "CO Damage Bonus Relative To Base Damage" IS `co_base_fraction`: the CO term
# multiplies 25% of this attack's damage, because the bonus is computed on the
# UNCHARGED value while the shot deals the charged one.
co_behavior: additive_with_base_damage
co_base_fraction: 0.25

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 50
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 3.33
  charge_seconds: 1
  charge_cadence: draw_then_rate
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.15
  crit_multiplier: 1.5
  status_chance: 0.1
  punch_through_m: 0.0
  damage: { impact: 10, slash: 10, puncture: 80 }   # total 100

