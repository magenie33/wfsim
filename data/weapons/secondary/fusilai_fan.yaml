id: fusilai_fan
name: Fusilai
# THE FAN: three knives for three rounds, at a much lower crit and status chance
# each, in a very wide spread.
inherits: fusilai
form: semi_auto
transform_group: fusilai

introduced: "22"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and this weapon
# has no row for either of its two. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 50
  fire_rate: 1.5
  multishot: 3.0
  ammo_cost: 3
  crit_chance: 0.03
  crit_multiplier: 1.5
  status_chance: 0.123
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { puncture: 30.8, slash: 46.2 }   # 77 a pellet, 231 a shot

unmodeled:
  - "the fan has a 'very wide spread' (wiki) and the module gives this attack a cone of ZERO, which cannot both be true — the module's figure is transcribed rather than a number invented for the sentence, so every knife lands on the reticle here"

source:
  url: https://wiki.warframe.com/w/Fusilai
