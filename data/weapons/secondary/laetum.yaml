# laetum_overwhelming_attrition] }

source:
  url: https://wiki.warframe.com/w/Laetum
  # note: Stats cross-checked against the wiki page infobox and the WFCD
  # warframe-items dataset (same datamined source). The dataset's summary
  # `damage` object mislabels the 96 Slash as Puncture; `damagePerShot`
  # and the per-attack tables agree on Impact 64 / Slash 96.
