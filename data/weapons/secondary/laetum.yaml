id: laetum
name: Laetum
slot: secondary
# Single Pistol — takes the Pistol Mods pool (wiki Pistol_Mods), same
# eligibility path as the Dual Toxocyst entry.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
# Pistol mods. No `secondary`-wide pool exists in the data.
mod_pools: [pistol]
grip_type: PISTOL
mastery_rank: 14
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group. Zariman weapons carry the
# Incarnon Genesis innately — there is no separate Genesis item to install.
transform_group: laetum
transforms_to: laetum_incarnon

# Weapon-level metadata (wiki data module / WFCD warframe-items).
accuracy: 16
disposition: 0.5             # riven disposition (●○○○○)
polarities: [madurai]
exilus_polarity: naramon
riven_family: Laetum
traits: [zariman, incarnon]
introduced: "31.5"           # Update 31.5 "Angels of the Zariman" (2022-04-27)
internal_name: /Lotus/Weapons/Tenno/Zariman/Pistols/HeavyPistol/ZarimanHeavyPistol
noise: alarming
ammo_type: secondary
ammo_max: 210
ammo_pickup: 40
magazine: 12
reload_seconds: 2.0

# Condition Overload behavior class — VERIFIED from the wiki CO catalog:
#   Laetum | Normal Attack | Projectile | 160 | 160 | 100% | Adding
# "Adding" = the bonus joins the base-damage bucket, Hornet-Strike style
# (three classes exist: additive_with_base_damage / independent / inert —
# see data/mods/galvanized_shot.yaml). The 160/160 = 100% column is the CO
# BASE FRACTION: this weapon has no base-damage-increase evolution to
# exclude, so CO computes on the full base (co_base_fraction 1.0, the
# loader default). CO boosts the DIRECT hit only.
co_behavior: additive_with_base_damage

# Single attack profile — no radial component on the base form; the
# explosion belongs to the Incarnon form only (see laetum_incarnon.yaml).
attack:
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 2.5
  multishot: 1.0
  # NOT READ by the engine (2026-07-31): nothing in engine/ references
  # `ammo_cost` — the sim spends a flat 1.0 (minus ammo efficiency) per shot.
  # It matters for CONTINUOUS weapons, which the wiki says "consume 0.5 ammo
  # per trace - unless they are Flamethrowers", and the only beam in the
  # roster is the Torid's Incarnon form, whose pool is charge-backed and
  # "not affected by Ammo Efficiency" — i.e. outside the ammo economy that
  # rule exists to help. So nothing in the sim turns on it today. See
  # docs/MECHANICS.md "Continuous ammo cost" for what would settle it.
  ammo_cost: 1
  crit_chance: 0.22
  crit_multiplier: 2.2
  status_chance: 0.22
  punch_through_m: 0.0
  damage: { impact: 64.0, slash: 96.0 }   # total 160

# Incarnon evolutions are perks shared by the transform group; definitions
# live in data/evolutions/laetum_*.yaml.
# incarnon_evolutions:
# - { tier: 1, unlock: kill 100 enemies,
# options: [laetum_evo1_incarnon_form] }
# - { tier: 2, unlock: kill 8 Eximus with the Incarnon Form,
# options: [laetum_marksmans_hand, laetum_rapid_wrath, laetum_raptors_chase] }
# - { tier: 3, unlock: land 8 headshots on Void Angels without reloading,
# options: [laetum_lethal_rearmament, laetum_awakened_readiness,
# laetum_feather_of_justice] }
# - { tier: 4, unlock: close 12 Ruptures in Void Flood,
# options: [laetum_caput_mortuum, laetum_incarnon_efficiency,
# laetum_elemental_excess] }
# - { tier: 5, unlock: complete a solo mission with an Incarnon weapon in
# every slot,
