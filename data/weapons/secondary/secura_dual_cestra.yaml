id: secura_dual_cestra
name: Secura Dual Cestra
slot: secondary
# THE PERRIN SEQUENCE'S DUAL CESTRA: more damage, more crit, more status, and a
# LOWER fire rate — 12.5 against 18.75 — because this one spools up to it. Its
# page publishes no spool numbers at all, so the rate here is the settled one.
class: dual_pistols
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]         # CompatibilityTags PROJECTILE
mastery_rank: 10
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 20.0
disposition: 1.3            # riven disposition
polarities: [madurai, naramon]
exilus_polarity: naramon
riven_family: Dual Cestra
traits: [syndicate, perrin_sequence]
introduced: "15.5"
internal_name: /Lotus/Weapons/Syndicates/PerrinSequence/Pistols/PSDualCestra
noise: alarming
ammo_type: secondary
ammo_max: 480
ammo_pickup: 40
magazine: 120
reload_seconds: 3.5

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 2.0
    max_deg: 8.0
  # THE MODULE SAYS `Auto-Spool` and there is no `sustained_fire_rate:`
  # here: the page publishes no starting fraction, and a spool is
  # transcribed from its own page or not at all. See `unmodeled:`.
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 12.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.16
  crit_multiplier: 1.6
  status_chance: 0.28
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — Projectile at 100 m/s. See
  # data/surveys/weapon_range.yaml.
  damage: { impact: 5.6, puncture: 22.4 }   # total 28

unmodeled:
  - "the SEQUENCE syndicate effect, which converts damage dealt into shields for the wielder and nearby allies on a proc — the wielder is not a body in this arena and there are no allies, so it pays nothing"
  - reason: auto_spool_ramp
    rate: 12.5

source:
  url: https://wiki.warframe.com/w/Secura_Dual_Cestra
