id: cyanex
name: Cyanex
slot: secondary
# HOMING FLECHETTES WITH A SMALL BLAST — 0.7 metres, the narrowest explosion in
# the roster — and an alternate fire that empties the magazine.
class: pistol
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: cyanex
mod_pools: [pistol]   # CompatibilityTags PROJECTILE
mastery_rank: 8
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/secondary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 1.8
disposition: 1              # riven disposition
polarities: []               # the infobox states none
exilus_polarity: madurai
riven_family: Cyanex
traits: [corpus, sentient]
introduced: "25.0"
internal_name: /Lotus/Weapons/Corpus/Pistols/CrpSentAmalgPistol/CrpSentAmalgPistol
noise: alarming
ammo_type: secondary
ammo_max: 210
ammo_pickup: 20
magazine: 11
reload_seconds: 2.2

# Condition Overload: THE CATALOG NAMES THIS ATTACK. Verbatim
# (docs/CATALOGS.md §1):
#
#   Cyanex | Projectile Impact | Projectile | 50 | 50 | 100% | Multiplying
#
# THIS ENTRY READ ADDING AT 100% UNTIL 2026-08-20, which was the
# ordinary class assumed because nobody had opened the catalog for this
# weapon — the check was run against our own transcription of it, which
# only ever carried the rows the roster already had.
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 50.0
    max_deg: 60.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 24
  fire_rate: 4.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.08
  crit_multiplier: 1.4
  status_chance: 0.32
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { impact: 50 }   # total 50
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 0.7
    falloff_start_m: 0.0
    falloff_reduction: 0.2
    crit_chance: 0.08
    crit_multiplier: 1.4
    status_chance: 0.32
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { gas: 41 }   # total 41

unmodeled:
  - "the projectiles HOME on enemies (wiki) — this arena's shots already go where they are aimed, so the homing buys nothing here"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Cyanex
