id: pyrana_prime
name: Pyrana Prime
slot: secondary
# TEN PELLETS OF TWENTY-FOUR, and a passive that summons a SECOND PYRANA
# (`kill_streak_summon`), which is most of what the Prime is worth.
class: shotgun_sidearm
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]         # CompatibilityTags SECONDARYSHOTGUN
mastery_rank: 13
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 6.1
disposition: 0.65           # riven disposition
polarities: [madurai, madurai]
exilus_polarity: naramon
riven_family: Pyrana
traits: [prime, vaulted]
introduced: "23.0.3"
internal_name: /Lotus/Weapons/Tenno/Pistols/PrimePyrana/PrimePyranaPistol
noise: alarming
ammo_type: secondary
ammo_max: 210
ammo_pickup: 20
magazine: 12
reload_seconds: 1.6

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 14.0
    max_deg: 19.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 4
  multishot: 10.0
  ammo_cost: 1
  crit_chance: 0.24
  crit_multiplier: 2.2
  status_chance: 0.036
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage
  range_m: 300.0
  falloff:
    start_m: 18.0
    end_m: 36.0
    reduction: 0.75
  damage: { impact: 1.92, puncture: 1.92, slash: 20.16 }   # 24 a pellet, 240 a shot

# "3 kills each within 2 seconds of the previous kill summons a second Pyrana
# Prime for 6 seconds, doubling its magazine size and increasing its fire rate
# by 1.4x" (wiki). "The fire rate bonus multiplies with any modded fire rate
# increases"; kills while dual-wielding do not refresh it.
kill_streak_summon:
  kills: 3
  kill_window_seconds: 2.0
  duration_seconds: 6.0
  magazine_multiplier: 2.0
  fire_rate_multiplier: 1.4

source:
  url: https://wiki.warframe.com/w/Pyrana_Prime
