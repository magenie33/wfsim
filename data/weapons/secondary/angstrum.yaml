id: angstrum
name: Angstrum
slot: secondary
class: pistol
form: charged
default_form: true
mod_pools: [pistol]
mastery_rank: 4
max_rank: 30

# see notes: two_weapons_model_base
transform_group: angstrum
transforms_to: angstrum_incarnon

# see notes: bulk_intake_stats_are_2
unmodeled:
  - "the Single Rocket Explosion is not modelled — this entry carries only the Single Rocket Impact"
accuracy: 26.67
disposition: 1.35
polarities: [vazarin]
# no exilus polarity slot
riven_family: Angstrum
traits: [incarnon]
introduced: "Update 13.3"
internal_name: /Lotus/Weapons/Corpus/Pistols/CrpHandRL/CorpusHandRocketLauncher
noise: alarming
ammo_type: secondary
ammo_max: 18
ammo_pickup: 3
# THREE ROCKETS TO A MAGAZINE, and this entry is the SINGLE one: "can be
# charged to unload more of the weapon's magazine and fire extra
# projectiles", and a full charge spends all three. So an uncharged shot
# costs one of three, not one of one — it read as a reload after every
# rocket until 2026-08-20.
magazine: 3
reload_seconds: 2.5

# ORDINARY HERE, AND THE CATALOG SAYS SO BY NAMING THE OTHER FORM. The row is
#
#   {{Weapon|Angstrum}}/{{Weapon|Prisma Angstrum}}||Incarnon Mode||Projectile||30||30||100%||Multiplying
#
# and its Attack Name cell reads "Incarnon Mode" — so Multiplying belongs to the
# transformed entry, not to this one. This form has no row, and absence means
# ORDINARY (CATALOGS.md).
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 2.5
    max_deg: 5
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 150
  fire_rate: 2
  charge_seconds: 0.5
  charge_cadence: draw_then_rate
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.16
  crit_multiplier: 2
  status_chance: 0.22
  punch_through_m: 0.0
  damage: { blast: 200 }   # total 200

# incarnon_evolutions: definitions live in data/evolutions/angstrum_*.yaml.

source:
  url: https://wiki.warframe.com/w/Angstrum
