id: aksomati_prime
name: Aksomati Prime
slot: secondary
# THIRTEEN ROUNDS A SECOND OUT OF AN EIGHTY-ROUND MAGAZINE, and the module gives
# its trigger as Auto-Spool: the listed rate is where it ENDS UP, not where it
# starts. Its page publishes no spool numbers at all — only that accuracy
# improves during the spool — so the rate here is the spooled one from the first
# shot, which is admitted below.
class: dual_pistols
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [pistol]
mastery_rank: 12
max_rank: 30

# see notes: weapon_level_metadata_wiki_2
accuracy: 12.5
disposition: 1.05            # riven disposition
polarities: [naramon, madurai, madurai]
exilus_polarity: naramon
riven_family: Aksomati
traits: [prime]
introduced: "27.0.4"
internal_name: /Lotus/Weapons/Tenno/Pistols/PrimeAksomati/PrimeAksomati
noise: alarming
ammo_type: secondary
ammo_max: 880
ammo_pickup: 40
magazine: 80
reload_seconds: 1.4

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 16.0
  # THE MODULE SAYS `Auto-Spool` and there is no `sustained_fire_rate:` here,
  # because the page publishes neither a starting fraction nor a shot count —
  # and the roster's rule is that a spool is transcribed from its own page or
  # not at all. See `unmodeled:`.
  trigger: auto
  shot_type: hit_scan
  fire_rate: 13.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.24
  crit_multiplier: 3.0
  status_chance: 0.18
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage
  range_m: 300.0
  damage: { impact: 2, puncture: 8, slash: 10 }   # total 20

unmodeled:
  - reason: auto_spool_ramp
    rate: 13.33
  - "the ACCURACY improves during the spool as well (wiki), which is the half of it the page does state — this entry carries the settled cone, so a burst that would open wide here opens tight"

source:
  url: https://wiki.warframe.com/w/Aksomati_Prime
