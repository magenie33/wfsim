id: vasto_prime_incarnon
name: Vasto Prime (Incarnon Form)
slot: secondary
class: pistol
form: incarnon

transform_group: vasto_prime
transforms_from: vasto_prime

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 8
    rounds_per_charge: 3
    max_rounds: 24
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 1      # = base reload time, unmodded

pseudo_reload:
  magazine: 24
  reload_seconds: 2.0

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage


# CANNOT AIM DOWN SIGHTS, so nothing gated on aiming pays in this form.
#
# VERBATIM (Vasto_Incarnon_Genesis, the form's own description):
#   *Incarnon Form transforms into a 6-round burst with '''6''' base [[multishot]]
#    along with increased [[Critical Chance]] and [[Critical Multiplier]].
#    However, it has reduced base damage and [[Status Chance]] per bullet, has
#    significantly higher [[Recoil]], and cannot [[Zoom]].
#
# "ZOOM" IS THE WIKI'S WORD FOR AIMING, not for magnification: the [[Zoom]] page
# it links to opens "Zoom (or aiming, aiming down sights (ADS))", and the
# Galvanized mods write the state as `[[Zoom|aiming]]`.
#
# AND DE SETTLED WHAT IT COSTS, in a patch note about the one other thing in the
# game that cannot zoom — Mesa's Regulators: "Removed ability to unintentionally
# equip Hydraulic Crosshairs and Sharpened Bullets on Mesa's Regulators.
# Although the buff appeared to trigger, it never actually applied due to the
# 'on aim' criteria not being fulfilled." The Regulators page draws the same
# conclusion for four mods at once: "Since Regulators cannot zoom, they also
# cannot benefit from Embedded Catalyzer, Hydraulic Crosshairs, Pressurized
# Magazine, or Sharpened Bullets."
#
# THE BASE FORM AIMS NORMALLY — this is per FORM, and only this entry carries
# the flag. It is also the ONLY "cannot Zoom" in the whole Incarnon Evolutions
# page; the four "-30% Zoom" perks there reduce magnification and leave the
# aim state alone.
cannot_zoom: true

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 15
    max_deg: 35
  trigger: burst
  # THE BURST. The listed `fire_rate` counts PULLS, not rounds — so reading it
  # as rounds per second understates this weapon by its burst count. Both
  # numbers are the wiki's (Vasto Prime: Burst Count 6, Burst Delay 0.1000 s).
  burst:
    count: 6
    delay_seconds: 0.1
  shot_type: hit_scan
  fire_rate: 2.5
  multishot: 6.0
  ammo_cost: 1                  # of the 24-round charge pool
  crit_chance: 0.3
  crit_multiplier: 3.2
  status_chance: 0.0667
  punch_through_m: 0.0
  # NOT MODELLED — the arena has no distance, so this weapon is
  # simulated at point blank. Recorded because the RIVEN pool reads
  # it: a hitscan weapon that lists a falloff still rolls Projectile
  # Speed, which scales the whole range (wiki `Projectile Speed`).
  falloff:
    start_m: 16
    end_m: 32
    reduction: 0.9857   # fraction KEPT past end_m
  damage: { impact: 10.5, slash: 49, puncture: 10.5 }   # total 70.0

# incarnon_evolutions: see data/weapons/secondary/vasto_prime.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Vasto_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"

