id: scyotid_snare
name: Scyotid
# THE SNARE: 40 Toxin, and the damage is the least of it — it paralyses and
# GROUPS up to eight enemies within fifteen metres, which is crowd control this
# arena cannot use. See the admissions.
inherits: scyotid
form: semi_auto
transform_group: scyotid

introduced: "39"

# see notes: inherited_co_catalog_gives
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 1.0
    max_deg: 3.0
    sampling:
      horizontal_ratio: 0.5
      uniform: false
      hip_min_deg: 1.0
      hip_max_deg: 3.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 1.6
  multishot: 1.0
  ammo_cost: 4
  crit_chance: 0.08
  crit_multiplier: 2.4
  status_chance: 0.32
  punch_through_m: 0.0
  # see notes: no_range_row_attack
  damage: { toxin: 40 }   # total 40

unmodeled:
  - reason: client_secondary_toggle_reload
  - reason: client_projectile_callbacks
  - reason: client_accuracy_runtime
  - "The snare damages, paralyses for about 6 s and pulls up to 8 enemies within 15 m, the count multiplied by multishot (wiki). The engine applies it to the aimed body only, so the 40 Toxin here is all it pays."
  - "Its damage is not affected by mods and does not combine with modded elements (wiki); the engine scales every attack by the build, so a modded build reads high in this mode."
  - "Its radius is not affected by Fulmination (wiki); this entry has no radius for it to change anyway."
  - reason: silent_weapon

source:
  url: https://wiki.warframe.com/w/Scyotid

# see notes: client_secondary_calibration
