id: imperator_vandal
name: Imperator Vandal
# see notes: arch_gun_own_equipment
slot: archgun
class: archgun
form: base
default_form: true

# see notes: two_columns_fields_below
#
#   |            | damage | reload | Ammo Max | shot type        |
#   | Atmosphere |    100 | 2.00 s |     1200 | hit-scan         |
#   | Archwing   |     50 | 4.25 s |        0 | projectile       |
#
# Ground damage is exactly double, like the ordinary Imperator it is the
# Vandal of. The two share a damage vector and differ in crit, magazine,
# fire rate and mastery.
#
deployment: atmosphere
deployments:
  archwing:
    reload_seconds: 4.25
    no_resupply: false      # a regenerating magazine, so no reserve to dry
    # see notes: other_tab_transcribed_rather
    damage: { impact: 20.0, puncture: 17.5, slash: 12.5 }   # 50 total
mod_pools: [archgun]
mastery_rank: 5
max_rank: 30

accuracy: 50.0
disposition: 0.95
polarities: [madurai]
riven_family: Imperator
traits: [vandal]
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/FoldingMachineGun/ArchMachineGunVandal
noise: alarming
magazine: 300
# The Atmosphere column. Archwing reloads in 4.25 s instead.
reload_seconds: 2.0

ammo_type: archgun
ammo_max: 1200
# A GROUND ARCH-GUN CANNOT BE RESUPPLIED — "once all of an Archgun's ammunition
# is used up, the weapon is removed and can only be called down again after a
# 5-minute cooldown period" (wiki Arch-Gun). 300 in the magazine and
# 1200 behind it is the whole engagement.
no_resupply: true

# No Condition Overload row, so the ordinary class (absence means ORDINARY).
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 1
    max_deg: 3
  # AUTO-SPOOL, which the page states and WFCD flattens to "Auto". The fire
  # rate below is the spooled-up one; the ramp itself is not modelled, so a
  # short burst is faster here than in game — stated in `unmodeled:`.
  trigger: auto
  shot_type: hit_scan
  fire_rate: 25.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.28
  crit_multiplier: 2.4
  status_chance: 0.12
  punch_through_m: 1.2
  # see notes: wall_ramp_full_damage_6
  range_m: 300.0
  damage: { impact: 40.0, puncture: 35.0, slash: 25.0 }   # 100 total
unmodeled:
  - reason: auto_spool_ramp
    rate: 25
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Imperator_Vandal
  # see notes: every_stat_wiki_page_2
