id: morgha
name: Morgha
slot: archgun
weapon_type: archgun
class: archgun
form: base
default_form: true
transform_group: morgha
transforms_to: morgha_alt

# TWO COLUMNS, exactly double on every part.
#   |            | burst shot | its explosion | Ammo Max | speed   |
#   | Atmosphere |     64     |      328      |   160    |  60 m/s |
#   | Archwing   |     32     |      164      |     0    | 160 m/s |
# Identical in both: crit 30% / 2.20x, status 28%, fire rate 3.00, burst of 2,
# magazine 100, reload 3.00 s, and the 3 m radius with its 70% rim.
deployment: atmosphere
deployments:
  archwing:
    no_resupply: false
    ammo_max: 0
    damage: { impact: 32.0 }
    radial_damage: { blast: 164.0 }
mod_pools: [archgun]
mastery_rank: 15
max_rank: 30

accuracy: 12.5               # "Low"
disposition: 1.2
polarities: [madurai]
riven_family: Morgha
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/ThanoTechGrenadeLaunch/ThanoTechGrenadeLauncher
traits: [entrati]
noise: alarming
magazine: 100
reload_seconds: 3.0

ammo_type: archgun
ammo_max: 160
no_resupply: true

co_behavior: additive_with_base_damage

modes:
  - id: cycle
    name: "Full-charge alt-fire cycle"
    about: "Fire the primary until 5 kills fill the gauge, fire the alternate once, then repeat."
    cycle_with: morgha_alt
    rules:
      - { action: { do: transform_in }, when: { if: gauge_at_least, pct: 1.0 } }

attack:
  extra_hit_reads: even   # see notes: extra_hit_reads
  # see notes: cone_half_angle_from
  spread:
    min_deg: 10
    max_deg: 20
  trigger: burst
  burst:
    count: 2
    delay_seconds: 0.0
  shot_type: projectile
  projectile_speed_mps: 60
  fire_rate: 3.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.30
  crit_multiplier: 2.2
  status_chance: 0.28
  punch_through_m: 0.0
  # see notes: primary_compression_published_table
  #
  #   Morgha | Primary Fire + AoE | 0% | Doesn't Work | N/A | "Archguns
  #   cannot equip mod"
  #
  # see notes: zero_row_omission_arcane
  compression:
    effectiveness: 0.00
    stacking: multiplies
    radius_calculation: doesnt_work
  damage: { impact: 64.0 }         # Archwing: 32
  radial:
    extra_hit_reads: even   # see notes: extra_hit_reads
    damage: { blast: 328.0 }       # Archwing: 164
    radius_m: 3.0
    falloff_start_m: 0.0
    falloff_reduction: 0.3         # 100% at the centre -> 70% at 3.0 m
    crit_chance: 0.30
    crit_multiplier: 2.2
    status_chance: 0.28

unmodeled:
