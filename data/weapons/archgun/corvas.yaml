id: corvas
name: Corvas
slot: archgun
class: archgun
form: charged
default_form: true
transform_group: corvas

# THE ONE ARCH-GUN WHOSE TWO TABS ARE TWO DIFFERENT WEAPONS, and the reason
# this entry offers no Archwing column at all.
#
#   |            | shot type | multishot | damage           | status |
#   | Atmosphere | hit-scan  |    11     | 80 per pellet    |  1.3%  |
#   | Archwing   | projectile|     1     | 440 in one shot  | 13.0%  |
#
# On the ground it is a SHOTGUN: eleven pellets of Impact/Puncture/Slash with a
# 1.3% status chance and an 11-degree spread. In space it is a single Impact +
# Heat projectile with ten times the status chance. That is not a column
# override — it is a different damage vector, a different pellet count, a
# different status chance, a different crit multiplier and a different shot
# type, and `DeploymentSpec` exists to restate a tab, not to replace a weapon.
#
# So the ATMOSPHERE column is the weapon here (the arena is the ground), the
# Archwing column is written down above, and no deployment choice is offered
# for it — a control that silently mis-stated half the weapon would be worse
# than not having one. Stated in `unmodeled:` so the page says so too.
deployment: atmosphere
mod_pools: [archgun]
mastery_rank: 1
max_rank: 30

accuracy: 25.0               # "Medium" on the ground; "Very High" in Archwing
disposition: 1.20
polarities: [naramon]
riven_family: Corvas
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/LaunchGrenade/ArchCannon
noise: alarming
magazine: 25
reload_seconds: 2.0

ammo_type: archgun
ammo_max: 100
no_resupply: true

# No Condition Overload row for the ORDINARY Corvas. The catalog names
# "Corvas Prime" on both of its forms and this weapon on neither, so it takes
# the ordinary class — a row is never generalised across a Prime boundary.
co_behavior: additive_with_base_damage

attack:
  trigger: charge
  charge_seconds: 0.5
  shot_type: hit_scan
  fire_rate: 2.0
  # ELEVEN PELLETS. The damage below is ONE of them (160); the shell is 1760.
  multishot: 11.0
  ammo_cost: 1
  crit_chance: 0.40
  crit_multiplier: 3.0
  status_chance: 0.013
  punch_through_m: 0.0
  damage: { impact: 128.0, puncture: 16.0, slash: 16.0 }   # 160 each, 1760 a shell

unmodeled:
  - "the ARCHWING column of this weapon is not offered — in space it is a single 440-damage Impact/Heat projectile with a 13% status chance instead of eleven hit-scan pellets at 1.3%, which is a different weapon rather than a restated one"
  - "the 11-degree spread is not modelled — this arena has one target at zero distance, so all eleven pellets always land on it"
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Corvas
