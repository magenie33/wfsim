id: imperator
name: Imperator
# see notes: arch_gun_own_equipment
slot: archgun
class: archgun
form: base
default_form: true

# see notes: two_columns_fields_below
#
#   |            | damage | reload | Ammo Max | shot type        |
#   | Atmosphere |    100 | 2.00 s |      800 | hit-scan         |
#   | Archwing   |     50 | 4.25 s |        0 | projectile       |
#
# Ground damage is exactly DOUBLE here, which is the common case and not a
# rule — see the Phaedra and the Dual Decurion, which are neither.
#
deployment: atmosphere
deployments:
  archwing:
    reload_seconds: 4.25
    no_resupply: false      # a regenerating magazine, so no reserve to dry
    # see notes: other_tab_transcribed_rather
    damage: { impact: 20.0, puncture: 17.5, slash: 12.5 }   # 50 total
mod_pools: [archgun]
mastery_rank: 0
max_rank: 30

accuracy: 50.0
disposition: 1.1
polarities: [madurai]
riven_family: Imperator
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/FoldingMachineGun/ArchMachineGun
noise: alarming
magazine: 200
# The Atmosphere column. Archwing reloads in 4.25 s instead.
reload_seconds: 2.0

ammo_type: archgun
ammo_max: 800
# A GROUND ARCH-GUN CANNOT BE RESUPPLIED — "once all of an Archgun's ammunition
# is used up, the weapon is removed and can only be called down again after a
# 5-minute cooldown period" (wiki Arch-Gun). 200 in the magazine and
# 800 behind it is the whole engagement.
no_resupply: true

# No Condition Overload row for this weapon, so the ordinary class — absence
# in that catalog means ORDINARY rather than unknown.
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 1
    max_deg: 3
  trigger: auto
  # THE GROUND COLUMN IS HIT-SCAN. In Archwing it is a projectile with falloff
  # from 1500 m to 3000 m; on the ground the wiki gives "Hit-Scan", 1.2 m innate
  # punch through and a 300 m range, and no falloff at all.
  shot_type: hit_scan
  fire_rate: 16.7
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.24
  crit_multiplier: 2.0
  status_chance: 0.12
  punch_through_m: 1.2
  # see notes: wall_ramp_full_damage_6
  range_m: 300.0
  damage: { impact: 40.0, puncture: 35.0, slash: 25.0 }   # 100 total
unmodeled:
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Imperator
  # see notes: every_stat_wiki_page_2
