id: imperator
name: Imperator
# ARCH-GUN — its own equipment slot, and not a Primary or a Secondary: the wiki
# is explicit that Archguns "are not considered either primary or secondary
# weapons", which is also why they seat two arcanes rather than one.
slot: archgun
class: archgun
form: base
default_form: true

# TWO COLUMNS, and the fields below are the ATMOSPHERE one because this arena is
# the ground. See docs/WEAPON_INTAKE.md §1: the page's infobox has an `Archwing`
# tab and an `Atmosphere` tab, WFCD carries only the Archwing one, and the two
# differ in damage, reserve, reload and shot type while agreeing on crit,
# multiplier, status, fire rate and magazine.
#
#   |            | damage | reload | Ammo Max | shot type        |
#   | Atmosphere |    100 | 2.00 s |      800 | hit-scan         |
#   | Archwing   |     50 | 4.25 s |        0 | projectile       |
#
# Ground damage is exactly DOUBLE here, which is the common case and not a
# rule — see the Phaedra and the Dual Decurion, which are neither.
#
deployment: atmosphere
deployments:
  archwing:
    reload_seconds: 4.25
    no_resupply: false      # a regenerating magazine, so no reserve to dry
    # THE OTHER TAB, transcribed rather than derived — both columns are written
    # down so either can be checked against the page without arithmetic.
    damage: { impact: 20.0, puncture: 17.5, slash: 12.5 }   # 50 total
mod_pools: [archgun]
mastery_rank: 0
max_rank: 30

accuracy: 50.0
disposition: 1.1
polarities: [madurai]
riven_family: Imperator
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/FoldingMachineGun/ArchMachineGun
noise: alarming
magazine: 200
# The Atmosphere column. Archwing reloads in 4.25 s instead.
reload_seconds: 2.0

ammo_type: archgun
ammo_max: 800
# A GROUND ARCH-GUN CANNOT BE RESUPPLIED — "once all of an Archgun's ammunition
# is used up, the weapon is removed and can only be called down again after a
# 5-minute cooldown period" (wiki Arch-Gun). 200 in the magazine and
# 800 behind it is the whole engagement.
no_resupply: true

# No Condition Overload row for this weapon, so the ordinary class — absence
# in that catalog means ORDINARY rather than unknown.
co_behavior: additive_with_base_damage

attack:
  trigger: auto
  # THE GROUND COLUMN IS HIT-SCAN. In Archwing it is a projectile with falloff
  # from 1500 m to 3000 m; on the ground the wiki gives "Hit-Scan", 1.2 m innate
  # punch through and a 300 m range, and no falloff at all.
  shot_type: hit_scan
  fire_rate: 16.7
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.24
  crit_multiplier: 2.0
  status_chance: 0.12
  punch_through_m: 1.2
  damage: { impact: 40.0, puncture: 35.0, slash: 25.0 }   # 100 total
unmodeled:
  - "the innate 1.2 m punch-through is not modelled — this arena has one target, so it changes no number"
  - "the Arch-Gun Deployer's five-minute cooldown is not modelled — when the reserve runs dry the weapon is gone for the rest of a real mission, and this arena simply stops firing"

source:
  url: https://wiki.warframe.com/w/Imperator
  # Every stat is the wiki page's Atmosphere tab. WFCD `warframe-items` was
  # read for `internal_name` only: its Arch-Gun entries are the ARCHWING
  # column, which is the wrong one here (docs/DATA_SOURCES.md).
