id: dual_decurion
name: Dual Decurion
# see notes: arch_gun_own_equipment
slot: archgun
class: archgun
form: base
default_form: true

# see notes: two_columns_fields_below
#
#   |            | damage | reload | Ammo Max | shot type        |
#   | Atmosphere |    190 | 1.40 s |      512 | hit-scan         |
#   | Archwing   |    110 | 1.53 s |        0 | projectile       |
#
# NOT DOUBLE, and the furthest from it in the roster: 190 against 110 is
# x1.727. Every damage type follows that same ratio. See the Phaedra for the
# other exception, and docs/DATA_SOURCES.md for why both columns are written
# down rather than one being derived from the other.
#
deployment: atmosphere
deployments:
  archwing:
    reload_seconds: 1.53
    no_resupply: false      # a regenerating magazine, so no reserve to dry
    # see notes: other_tab_transcribed_rather
    damage: { impact: 49.5, puncture: 30.25, slash: 30.25 }   # 110 total
mod_pools: [archgun]
mastery_rank: 1
max_rank: 30

accuracy: 12.5
disposition: 1.3
polarities: []
riven_family: Dual Decurion
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/ArchwingHeavyPistols/ArchHeavyPistols
noise: alarming
magazine: 64
# The Atmosphere column. Archwing reloads in 1.53 s instead.
reload_seconds: 1.4

ammo_type: archgun
ammo_max: 512
# A GROUND ARCH-GUN CANNOT BE RESUPPLIED — "once all of an Archgun's ammunition
# is used up, the weapon is removed and can only be called down again after a
# 5-minute cooldown period" (wiki Arch-Gun). 64 in the magazine and
# 512 behind it is the whole engagement.
no_resupply: true

# No Condition Overload row, so the ordinary class (absence means ORDINARY).
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  # THE ATMOSPHERE ROW's, which is zero: this fires a flat cone on the
  # ground and what its page complains about instead is RECOIL — "notable
  # recoil which throws off accuracy at medium-long range shooting" — which
  # is a different mechanic and one docs/UNMODELLED.md already holds open.
  # It read the ARCHWING row's 7/9 until 2026-08-21.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 10.42
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.28
  crit_multiplier: 2.2
  status_chance: 0.14
  punch_through_m: 1.2
  # see notes: wall_ramp_full_damage_6
  range_m: 300.0
  damage: { impact: 85.5, puncture: 52.25, slash: 52.25 }   # 190 total
unmodeled:
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Dual_Decurion
  # see notes: every_stat_wiki_page_2
