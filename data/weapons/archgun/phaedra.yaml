id: phaedra
name: Phaedra
# see notes: arch_gun_own_equipment
slot: archgun
class: archgun
form: base
default_form: true

# see notes: two_columns_fields_below
#
#   |            | damage | reload | Ammo Max | shot type        |
#   | Atmosphere |    116 | 2.00 s |      960 | hit-scan         |
#   | Archwing   |     56 | 5.05 s |        0 | projectile       |
#
# NOT DOUBLE. 116 against 56 is x2.071, and each damage type follows the
# same ratio (29/14, 75.4/36.4, 11.6/5.6). This is one of the weapons the
# wiki means by "MOST Heavy Weapons ... have had their damage doubled", and
# it is why both columns are transcribed instead of one being multiplied.
#
deployment: atmosphere
deployments:
  archwing:
    reload_seconds: 5.05
    no_resupply: false      # a regenerating magazine, so no reserve to dry
    # see notes: other_tab_transcribed_rather
    damage: { impact: 14.0, puncture: 36.4, slash: 5.6 }   # 56 total
mod_pools: [archgun]
mastery_rank: 3
max_rank: 30

accuracy: 25.0
disposition: 1.25
polarities: [madurai]
riven_family: Phaedra
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/ArchLongRifle/ArchLongRifle
noise: alarming
magazine: 240
# The Atmosphere column. Archwing reloads in 5.05 s instead.
reload_seconds: 2.0

ammo_type: archgun
ammo_max: 960
# A GROUND ARCH-GUN CANNOT BE RESUPPLIED — "once all of an Archgun's ammunition
# is used up, the weapon is removed and can only be called down again after a
# 5-minute cooldown period" (wiki Arch-Gun). 240 in the magazine and
# 960 behind it is the whole engagement.
no_resupply: true

# No Condition Overload row, so the ordinary class (absence means ORDINARY).
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 1
    max_deg: 7
  trigger: auto
  shot_type: hit_scan
  fire_rate: 18.75
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.14
  crit_multiplier: 2.0
  status_chance: 0.30
  punch_through_m: 1.2
  # see notes: wall_ramp_full_damage_6
  range_m: 300.0
  damage: { impact: 29.0, puncture: 75.4, slash: 11.6 }   # 116 total
unmodeled:
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Phaedra
  # see notes: every_stat_wiki_page_2
