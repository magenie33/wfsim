id: grattler
name: Grattler
slot: archgun
weapon_type: archgun
class: archgun
form: base
default_form: true

deployment: atmosphere
deployments:
  archwing:
    reload_seconds: 4.0
    no_resupply: false
    # see notes: client_additional_projectiles
    additional_projectile:
      damage: { impact: 10.0, puncture: 80.0, slash: 10.0 }
      radial_damage: { blast: 205.0 }
mod_pools: [archgun]
mastery_rank: 4
max_rank: 30

accuracy: 25.0               # the page prints "Medium"
disposition: 1.2
polarities: [madurai]
riven_family: Grattler
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/RepurposedGrineerAntiAircraftGun/ArchGRNAAGun
weakness_bonus: 0.0
traits: [grineer]
noise: alarming
magazine: 30
reload_seconds: 2.0

ammo_type: archgun
ammo_max: 180
no_resupply: true

# CONDITION OVERLOAD, transcribed verbatim from the catalog:
#   Grattler | Normal attack | Projectile | 100% | Multiplying
# So the DIRECT hit takes the multiplying class. The row names "Normal attack"
# and says nothing about the explosion, and an AoE part takes no CO unless its
# own row says so (docs/CATALOGS.md) — so the explosion takes none.
co_behavior: independent

attack:
  extra_hit_reads: { impact: 0.4, slash: 0.25, puncture: 0.35 }   # see notes: extra_hit_reads
  # see notes: cone_half_angle_from
  spread:
    min_deg: 5
    max_deg: 7
  trigger: auto
  # AUTO-SPOOL in both tabs. The ramp is not modelled — see `unmodeled:`.
  shot_type: projectile
  projectile_speed_mps: 250
  fire_rate: 6.25
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2.0
  status_chance: 0.25
  # The page's own list names it: "Grattler".
  # see notes: infinite_body_punch_through
  # An AoE weapon ON the exception list, which is what the list is for.
  punch_through_m: 0.0
  infinite_body_punch_through: true
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, ATMOSPHERE column: "Range: 225.0 m". A PROJECTILE with a range row, where the Dread and the Kuva Bramma have none — the case that killed the class rule
  range_m: 225.0
  # see notes: primary_compression_published_table
  #
  #   Grattler (Kuva Grattler) | Primary Fire + AoE | 0% | Doesn't Work |
  #   N/A | "Archguns cannot equip mod"
  #
  # see notes: zero_row_omission_arcane
  compression:
    effectiveness: 0.00
    stacking: multiplies
    radius_calculation: doesnt_work
  damage: { impact: 22.5, puncture: 180.0, slash: 22.5 }
  radial:
    extra_hit_reads: { impact: 0.4, slash: 0.25, puncture: 0.35 }   # see notes: extra_hit_reads
    damage: { blast: 310.0 }
    radius_m: 9.0
    falloff_start_m: 0.0
    falloff_reduction: 0.7           # 100% at the centre -> 30% at 9.0 m
    crit_chance: 0.25
    crit_multiplier: 2.0
    status_chance: 0.25

unmodeled:
  - reason: auto_spool_ramp
    rate: 6.25
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Grattler
