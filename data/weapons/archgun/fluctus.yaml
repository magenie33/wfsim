id: fluctus
name: Fluctus
# ARCH-GUN — its own equipment slot, and not a Primary or a Secondary: the wiki
# is explicit that Archguns "are not considered either primary or secondary
# weapons", which is also why they seat two arcanes rather than one.
slot: archgun
class: archgun
form: base
default_form: true

# TWO COLUMNS, and the fields below are the ATMOSPHERE one because this arena is
# the ground. See docs/WEAPON_INTAKE.md §1: the page's infobox has an `Archwing`
# tab and an `Atmosphere` tab, WFCD carries only the Archwing one, and the two
# differ in damage, reserve, reload and shot type while agreeing on crit,
# multiplier, status, fire rate and magazine.
#
#   |            | damage | reload | Ammo Max | shot type        |
#   | Atmosphere |    500 | 3.00 s |      160 | projectile       |
#   | Archwing   |    250 | 5.00 s |        0 | projectile       |
#
# Exactly double, same split. It is also the one weapon here that stays a
# PROJECTILE on the ground — "most of them are hit-scan" (wiki Archgun) is
# most and not all, and this is the exception the roster holds.
#
deployment: atmosphere
deployments:
  archwing:
    reload_seconds: 5.0
    no_resupply: false      # a regenerating magazine, so no reserve to dry
    # THE OTHER TAB, transcribed rather than derived — both columns are written
    # down so either can be checked against the page without arithmetic.
    damage: { impact: 50.0, puncture: 25.0, slash: 175.0 }   # 250 total
mod_pools: [archgun]
mastery_rank: 2
max_rank: 30

accuracy: 100.0
disposition: 1.1
polarities: [naramon]
riven_family: Fluctus
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/RocketArtillery/ArchRocketCrossbow
noise: alarming
magazine: 40
# The Atmosphere column. Archwing reloads in 5.0 s instead.
reload_seconds: 3.0

ammo_type: archgun
ammo_max: 160
# A GROUND ARCH-GUN CANNOT BE RESUPPLIED — "once all of an Archgun's ammunition
# is used up, the weapon is removed and can only be called down again after a
# 5-minute cooldown period" (wiki Arch-Gun). 40 in the magazine and
# 160 behind it is the whole engagement.
no_resupply: true

# CONDITION OVERLOAD, transcribed verbatim from the catalog:
#   Fluctus | Normal attack | Projectile | 100% | Adding
# Which is the ordinary class stated outright rather than inferred from an
# absent row — the only Arch-Gun here whose row exists.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  # STILL A PROJECTILE on the ground, unlike every other Arch-Gun in the
  # roster. What it fires is a WAVE with innate infinite punch-through.
  shot_type: projectile
  fire_rate: 5.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.22
  crit_multiplier: 2.0
  status_chance: 0.16
  # INFINITE, and stated as a number the sim can hold. It buys nothing here —
  # see `unmodeled:` — and it is the weapon's whole identity in a real mission.
  punch_through_m: 999.0
  damage: { impact: 100.0, puncture: 50.0, slash: 350.0 }   # 500 total
unmodeled:
  - "the innate INFINITE punch-through is not modelled — this arena has one target, and a wave that passes through a corridor of enemies is most of what this weapon is"
  - "the wave's vertical hitbox is not modelled — it is a wide flat projectile rather than a point, which this arena has no geometry to express"
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Fluctus
  # Every stat is the wiki page's Atmosphere tab. WFCD `warframe-items` was
  # read for `internal_name` only: its Arch-Gun entries are the ARCHWING
  # column, which is the wrong one here (docs/DATA_SOURCES.md).
