id: corvas_prime_uncharged
name: Corvas Prime
# A FORM OF ITS WEAPON: everything below that describes the WEAPON
# rather than this shot is inherited from `corvas_prime`, and only what
# DIFFERS is written here. See `weapons_data::INHERITED`.
inherits: corvas_prime
form: base
transform_group: corvas_prime

# CONDITION OVERLOAD, its own row:
#   Corvas Prime | Uncharged Attack | Projectile | 100% | Multiplying
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  # NO CHARGE. An uncharged shot has no draw at all, and `charge_seconds: 0.0`
  # is refused outright — "a 0.0 charge outside a bow is just a fire rate".
  # Omitting it is the spelling that means "no draw"; a bow may state a zero
  # because there the draw IS the cycle and the magazine is one arrow.
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 2.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.44
  crit_multiplier: 3.0
  status_chance: 0.20
  punch_through_m: 1.4
  damage: { impact: 230.0, heat: 330.0 }   # 560, and the same in Archwing

unmodeled:
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Corvas_Prime
