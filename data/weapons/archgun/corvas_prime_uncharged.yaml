id: corvas_prime_uncharged
name: Corvas Prime
# A FORM OF ITS WEAPON: everything below that describes the WEAPON
# rather than this shot is inherited from `corvas_prime`, and only what
# DIFFERS is written here. See `weapons_data::INHERITED`.
inherits: corvas_prime
form: base
transform_group: corvas_prime

# CONDITION OVERLOAD, its own row:
#   Corvas Prime | Uncharged Attack | Projectile | 100% | Multiplying
co_behavior: independent

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  # see notes: no_charge_uncharged_shot
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 2.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.44
  crit_multiplier: 3.0
  status_chance: 0.20
  # INNATE INFINITE BODY PUNCH-THROUGH — the punch-through page's own exception
  # list, "Corvas Prime". Written as a number the sim can
  # hold, and it is the WHOLE mechanic here: the qualifier that goes with it separates BODIES
  # from geometry ("innate punch through does not apply to surfaces") and this
  # arena has no geometry, so everything the ray meets is a body.
  punch_through_m: 999.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, ATMOSPHERE column, UNCHARGED block: "Range: 60.0 m" (the charged one is 70)
  range_m: 60.0
  damage: { impact: 230.0, heat: 330.0 }   # 560, and the same in Archwing

unmodeled:
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Corvas_Prime
