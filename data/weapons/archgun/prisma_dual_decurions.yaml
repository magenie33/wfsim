id: prisma_dual_decurions
name: Prisma Dual Decurions
# see notes: arch_gun_own_equipment
slot: archgun
class: archgun
form: base
default_form: true

# see notes: two_columns_fields_below
#
#   |            | damage | reload | Ammo Max | shot type        |
#   | Atmosphere |    220 | 1.40 s |      512 | hit-scan         |
#   | Archwing   |    110 | 1.53 s |        0 | projectile       |
#
# EXACTLY DOUBLE — and the ordinary Dual Decurion it is the Prisma of is
# x1.727, off the SAME Archwing vector. Two weapons that share a space column
# do not share a ground one, which is the sharpest reason in the roster for
# transcribing both tabs per entry rather than deriving one.
#
deployment: atmosphere
deployments:
  archwing:
    reload_seconds: 1.53
    no_resupply: false      # a regenerating magazine, so no reserve to dry
    # see notes: other_tab_transcribed_rather
    damage: { impact: 49.5, puncture: 30.25, slash: 30.25 }   # 110 total
mod_pools: [archgun]
mastery_rank: 1
max_rank: 30

accuracy: 16.0
disposition: 1.25
polarities: [madurai, madurai]
riven_family: Dual Decurion
traits: [prisma]
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/ArchwingHeavyPistols/Prisma/PrismaArchHeavyPistols
noise: alarming
magazine: 64
# The Atmosphere column. Archwing reloads in 1.53 s instead.
reload_seconds: 1.4

ammo_type: archgun
ammo_max: 512
# A GROUND ARCH-GUN CANNOT BE RESUPPLIED — "once all of an Archgun's ammunition
# is used up, the weapon is removed and can only be called down again after a
# 5-minute cooldown period" (wiki Arch-Gun). 64 in the magazine and
# 512 behind it is the whole engagement.
no_resupply: true

# No Condition Overload row, so the ordinary class (absence means ORDINARY).
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  # THE ATMOSPHERE ROW's, which is zero: this fires a flat cone on the
  # ground and what its page complains about instead is RECOIL — "notable
  # recoil which throws off accuracy at medium-long range shooting" — which
  # is a different mechanic and one docs/UNMODELLED.md already holds open.
  # It read the ARCHWING row's 0.5/12 until 2026-08-21.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 12.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.30
  crit_multiplier: 2.2
  status_chance: 0.24
  # 1.4 m, not the ordinary Dual Decurion's 1.2 — the page lists the Prisma
  # separately and higher, and this entry had copied its sibling's.
  # Both module columns say 1.2 — the Archwing row and the Atmosphere one —
  # so 1.4 was neither.
  punch_through_m: 1.2
  # see notes: wall_ramp_full_damage_6
  range_m: 300.0
  damage: { impact: 99.0, puncture: 60.5, slash: 60.5 }   # 220 total
unmodeled:
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Prisma_Dual_Decurions
  # see notes: every_stat_wiki_page_2
