id: corvas_uncharged
name: Corvas
# A FORM OF ITS WEAPON: everything below that describes the WEAPON
# rather than this shot is inherited from `corvas`, and only what
# DIFFERS is written here. See `weapons_data::INHERITED`.
inherits: corvas
form: base
transform_group: corvas

co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  # THE ATMOSPHERE ROW, which is the column this arena is in. This read the
  # ARCHWING one (0/0) until 2026-08-21 — the same two-column trap
  # data/README.md records against WFCD's export, in the SPREAD column,
  # which is the one that decides how much of a shot lands. The module has
  # BOTH rows ('<Name>' and '<Name> (Atmosphere)') and this tool now reads
  # the ground one.
  spread:
    min_deg: 6.0
    max_deg: 16.0
  trigger: semi_auto
  # see notes: no_charge_uncharged_shot
  shot_type: hit_scan
  fire_rate: 2.0
  # Eleven pellets of 80 — 880 a shell.
  multishot: 11.0
  ammo_cost: 1
  crit_chance: 0.40
  crit_multiplier: 3.0
  status_chance: 0.013
  # The page's own list names it: "Corvas (Atmospheric Mode)".
  # see notes: infinite_body_punch_through
  punch_through_m: infinite
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, ATMOSPHERE column, uncharged block: "Range: 300.0 m", Hit-Scan
  range_m: 300.0
  damage: { impact: 64.0, puncture: 8.0, slash: 8.0 }   # 80 each, 880 a shell

unmodeled:
  - "the ARCHWING column of this weapon is not offered — in space it is a single 440-damage Impact/Heat projectile with a 13% status chance instead of eleven hit-scan pellets at 1.3%, which is a different weapon rather than a restated one"
  - "the 11-degree spread is not modelled — this arena has one target at zero distance, so all eleven pellets always land on it"
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Corvas
