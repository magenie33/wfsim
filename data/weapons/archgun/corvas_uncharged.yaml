id: corvas_uncharged
name: Corvas
# A FORM OF ITS WEAPON: everything below that describes the WEAPON
# rather than this shot is inherited from `corvas`, and only what
# DIFFERS is written here. See `weapons_data::INHERITED`.
inherits: corvas
form: base
transform_group: corvas

co_behavior: additive_with_base_damage

attack:
  trigger: semi_auto
  # NO CHARGE. An uncharged shot has no draw at all, and `charge_seconds: 0.0`
  # is refused outright — "a 0.0 charge outside a bow is just a fire rate".
  # Omitting it is the spelling that means "no draw"; a bow may state a zero
  # because there the draw IS the cycle and the magazine is one arrow.
  shot_type: hit_scan
  fire_rate: 2.0
  # Eleven pellets of 80 — 880 a shell.
  multishot: 11.0
  ammo_cost: 1
  crit_chance: 0.40
  crit_multiplier: 3.0
  status_chance: 0.013
  punch_through_m: 0.0
  damage: { impact: 64.0, puncture: 8.0, slash: 8.0 }   # 80 each, 880 a shell

unmodeled:
  - "the ARCHWING column of this weapon is not offered — in space it is a single 440-damage Impact/Heat projectile with a 13% status chance instead of eleven hit-scan pellets at 1.3%, which is a different weapon rather than a restated one"
  - "the 11-degree spread is not modelled — this arena has one target at zero distance, so all eleven pellets always land on it"
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Corvas
