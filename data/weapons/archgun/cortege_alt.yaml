id: cortege_alt
name: Cortege
# A FORM OF ITS WEAPON: everything below that describes the WEAPON
# rather than this shot is inherited from `cortege`, and only what
# DIFFERS is written here. See `weapons_data::INHERITED`.
inherits: cortege
# THE ALT-FIRE, AND IT IS EARNED. "Getting 5 kills with the Cortege's primary
# fire will unlock an Alternate Fire that releases a trio of grenades" (wiki),
# and the gate is MODELLED as of 2026-08-15: the trio costs five kills with the
# primary, and against a target that will not die it never arrives.
#
# `alt_fire` rather than `charged`: nothing about it is a draw, it is the other
# button, and borrowing `charged` would put a wrong word in every saved preset
# and share link (docs/WEAPON_INTAKE.md §3). The gauge does not change that —
# it is declared below, and the form KIND stays what the player presses.
form: alt_fire
transform_group: cortege
transforms_from: cortege

# FIVE KILLS, ONE TRIO. Same mechanic as the Mausolon's laser and the same
# published sentence; see `mausolon_charged` for why the transitions are zero.
gauge_form:
  gauge:
    charge_on: kills
    charges_to_fill: 5
    max_rounds: 1
  transmute_in_seconds: 0.0
  transmute_out_seconds: 0.0

# The gauge, not the 100-round belt — see `mausolon_charged`.
magazine: 1

deployments:
  archwing:
    reload_seconds: 3.0
    no_resupply: false
    damage: { impact: 10.0 }
    radial_damage: { blast: 1000.0 }

co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  fire_rate: 0.25
  # A TRIO OF GRENADES. The damage below is ONE of them; the page's totals (60
  # impact and 6000 blast) are the three together.
  multishot: 3.0
  ammo_cost: 1
  crit_chance: 0.30
  crit_multiplier: 2.4
  status_chance: 0.167
  punch_through_m: 0.0
  # PRIMARY COMPRESSION, verbatim:
  #   Cortege | Alt-Fire + AoE | 0% | Doesn't Work | N/A
  compression:
    effectiveness: 0.00
    stacking: multiplies
    radius_calculation: doesnt_work
  damage: { impact: 20.0 }         # per grenade; Archwing: 10
  radial:
    damage: { blast: 2000.0 }      # per grenade; Archwing: 1000
    radius_m: 4.0
    falloff_start_m: 0.0
    falloff_reduction: 0.3         # 100% at the centre -> 70% at 4.0 m
    crit_chance: 0.30
    crit_multiplier: 2.4
    status_chance: 0.167

unmodeled:
  - "the LINGERING FLAMES the grenades leave are not modelled — the page gives them 11 seconds of continuous damage and no per-tick number this intake could find, so the ground fire contributes nothing here and this weapon reads low"
  # PROSE, not a reason: this one says "a grenade" in the middle of the
  # sentence, and a free-text parameter would carry that English word into
  # every translation of the template.
  - "the explosion's falloff is not modelled — this arena has one target at the centre, so it always takes the full 2000 a grenade and never the 1400 at the rim"
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Cortege
