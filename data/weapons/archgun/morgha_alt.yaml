id: morgha_alt
name: Morgha
# A FORM OF ITS WEAPON: everything below that describes the WEAPON
# rather than this shot is inherited from `morgha`, and only what
# DIFFERS is written here. See `weapons_data::INHERITED`.
inherits: morgha
# THE ALT-FIRE, and `alt_fire` rather than `charged` even though the page calls
# it a "Charged Shot": it has a Semi-Auto trigger and no charge time, so nothing
# about it is a DRAW. A charge trigger IS the charged form and nothing else is
# (WEAPON_INTAKE §3) — borrowing the word here would put a lie in every saved
# preset and share link.
#
# Its explosion is the whole weapon: 200 on the body and 7200 in the blast,
# which is the widest direct-to-radial gap in the roster.
form: alt_fire
transform_group: morgha

deployments:
  archwing:
    no_resupply: false
    ammo_max: 0
    damage: { impact: 100.0 }
    radial_damage: { impact: 600.0, puncture: 800.0, slash: 1000.0, blast: 1200.0 }  # 3600

accuracy: 100.0              # "Very High"

co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  # see notes: no_charge_uncharged_shot
  shot_type: projectile
  projectile_speed_mps: 60
  # The module's figure; 0.83 is the card's two places.
  fire_rate: 0.833
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.40
  crit_multiplier: 3.0
  status_chance: 0.50
  punch_through_m: 0.0
  # see notes: primary_compression_published_table
  #
  #   Morgha | Alt-Fire + AoE | 0% | Doesn't Work | N/A | "Archguns cannot
  #   equip mod"
  #
  # see notes: zero_row_omission_arcane
  compression:
    effectiveness: 0.00
    stacking: multiplies
    radius_calculation: doesnt_work
  damage: { impact: 200.0 }        # Archwing: 100
  radial:
    damage: { impact: 1200.0, puncture: 1600.0, slash: 2000.0, blast: 2400.0 }  # 7200
    radius_m: 12.0                 # Archwing: 20.0
    falloff_start_m: 0.0
    falloff_reduction: 0.6         # 100% at the centre -> 40% at 12.0 m
    crit_chance: 0.40
    crit_multiplier: 3.0
    status_chance: 0.50

unmodeled:
  - "the CHARGE this form is named for is not modelled as a charge — the page calls it a Charged Shot and then gives it a Semi-Auto trigger with no charge time, so it is paced as a slow semi-auto shot and filed as an alt-fire"
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Morgha
