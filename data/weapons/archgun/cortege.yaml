id: cortege
name: Cortege
slot: archgun
class: archgun
# THE PRIMARY FIRE — a held Heat beam. Its alt-fire is `cortege_alt`, and that
# one is NOT free: it has to be earned. See that entry.
form: base
default_form: true
transform_group: cortege
# The form five kills buy — see `cortege_alt`.
transforms_to: cortege_alt

# TWO COLUMNS, exactly double on every part.
#   |            | beam | reload | Ammo Max |
#   | Atmosphere | 180  | 2.50 s |   300    |
#   | Archwing   |  90  | 3.00 s |     0    |
# Identical in both: crit 20% / 1.90x, status 40%, fire rate 12, magazine 100.
deployment: atmosphere
deployments:
  archwing:
    reload_seconds: 3.0
    no_resupply: false
    damage: { heat: 90.0 }
mod_pools: [archgun]
mastery_rank: 14
max_rank: 30

accuracy: 12.5               # "Low" on the ground; "Very High" in Archwing
disposition: 1.00
polarities: []
riven_family: Cortege
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/ThanoTechArchGun/ThanoTechArchGun
noise: alarming
magazine: 100
reload_seconds: 2.5

ammo_type: archgun
ammo_max: 300
no_resupply: true

co_behavior: additive_with_base_damage

attack:
  trigger: held
  shot_type: hit_scan
  fire_rate: 12.0
  multishot: 1.0
  # 0.5 a tick, the beam rule.
  ammo_cost: 0.5
  crit_chance: 0.20
  crit_multiplier: 1.9
  status_chance: 0.40
  punch_through_m: 0.0
  # PRIMARY COMPRESSION, verbatim:
  #   Cortege | Primary Fire + AoE | 0% | Doesn't Work | N/A
  # The row exists and says zero, which is a stronger statement than an absent
  # row: the arcane is TESTED as worthless here.
  compression:
    effectiveness: 0.00
    stacking: multiplies
    radius_calculation: doesnt_work
  damage: { heat: 180.0 }          # Archwing: 90

unmodeled:
  # THE BEAM'S OWN AoE. The characteristics say "Beam deals radial damage
  # varying from of 1 to 4 meters in a cone shape" and the infobox publishes NO
  # radial row for the primary — its only one belongs to the grenades. So the
  # shape is stated and the number is not, and inventing one would put damage on
  # the board that nobody can check.
  - "the BEAM'S CONE is not modelled — the wiki says the primary fire `deals radial damage varying from of 1 to 4 meters in a cone shape`, and publishes no damage figure for it anywhere; only the direct beam damage is applied here, so this weapon reads low against anything the cone would have caught"
  - "the atmospheric beam's INNATE INFINITE BODY PUNCH THROUGH is not modelled — it passes through a body to reach whatever is behind it, and this arena has one target with nothing behind it"
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Cortege
