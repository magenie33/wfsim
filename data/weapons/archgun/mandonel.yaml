id: mandonel
name: Mandonel
slot: archgun
class: archgun
form: charged
default_form: true
transform_group: mandonel

# TWO COLUMNS, exactly double on both forms.
#   |            | charged | reload | Ammo Max |
#   | Atmosphere |  1800   | 2.00 s |   300    |
#   | Archwing   |   900   | 3.00 s |     0    |
# Identical in both: crit 30% / 2.50x, status 20%, fire rate 3.00, magazine 30,
# charge 1.50 s, punch through 2.4 m, and the hit-scan shot type.
deployment: atmosphere
deployments:
  archwing:
    reload_seconds: 3.0
    no_resupply: false
    damage: { puncture: 200.0, heat: 300.0, radiation: 400.0 }   # 900
mod_pools: [archgun]
mastery_rank: 10
max_rank: 30

accuracy: 100.0              # "Very High" for the charged shot
disposition: 1.10
polarities: [madurai]
riven_family: Mandonel
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/TnConcreteArchgun/TnConcreteArchgunWeapon
noise: alarming
magazine: 30
reload_seconds: 2.0

ammo_type: archgun
ammo_max: 300
no_resupply: true

# CONDITION OVERLOAD, transcribed verbatim — and THE TWO FORMS DISAGREE:
#   Mandonel | Uncharged Attack | Projectile | 100% | Multiplying
#   Mandonel | Charged attack   | Hitscan    | 100% | Adding
# This entry is the CHARGED one, so it takes "Adding", which is the ordinary
# class. The uncharged sibling takes "Multiplying". One weapon, two rows, two
# answers — which is exactly why a row is read for the entry it names.
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  charge_seconds: 1.5
  shot_type: hit_scan
  fire_rate: 3.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.30
  crit_multiplier: 2.5
  status_chance: 0.20
  # The page's own list names it: "Mandonel".
  # see notes: infinite_body_punch_through
  # UNQUALIFIED on the infinite list, where the finite list says "Charged Shot
  # only" — so the restriction the page wanted, it wrote.
  punch_through_m: infinite
  damage: { puncture: 400.0, heat: 600.0, radiation: 800.0 }   # 1800

unmodeled:
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Mandonel
