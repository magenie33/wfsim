id: larkspur_prime
name: Larkspur Prime
# ARCH-GUN — its own equipment slot, and the first weapon in the roster that
# is neither a Primary nor a Secondary. The wiki is explicit that it is not
# either: Archguns "are not considered either primary or secondary weapons",
# which is also why they carry two arcane slots of their own (see below).
slot: archgun
class: archgun
# The normal fire, and the form the arsenal shows. The alt-fire is the
# sibling entry `larkspur_prime_charged` (`form: charged`), reached for FREE
# by holding the alternate button — a form of the same weapon, not a
# transformation of it, so neither entry carries `transforms_to`.
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: larkspur_prime

# WHERE IT IS FIRED changes the weapon, and the wiki gives it as ONE table
# with two columns rather than two weapons — same crit, same multiplier, same
# status, same fire rate, same mods, same riven:
#
#   |            | damage | reload | Ammo Max | resupply                    |
#   | Atmosphere |  180   | 2.50 s | 400      | none — the weapon is REMOVED|
#   |            |        |        |          | when empty, 5 min cooldown  |
#   | Archwing   |   90   | 4.50 s | 0        | regenerating = unlimited    |
#
# THE DAMAGE COLUMN WAS READ AS "SAME" AND IT IS DOUBLE (2026-08-14). VERBATIM
# (wiki `Archgun`): "most Heavy Weapons (a.k.a. Archguns when used via the
# Archgun Deployer) have had their damage doubled". This file has said
# `deployment: atmosphere` since it was written and carried the ARCHWING
# numbers, so every score this weapon has ever posted to the board — 112 rows —
# was half of what a ground Larkspur Prime does. Crit, multiplier and status
# really are identical in both columns, which is what made the wrong reading
# survive: three of the four stats checked out.
#
# So it is a SCENARIO axis, not an identity: one weapon, one mod pool, one
# riven, and the environment chooses the column (user, 2026-08-01). The
# fields on this file are the ATMOSPHERE column, because the arena is ground;
# the block below is what the other column overrides, and nothing else moves.
deployment: atmosphere
deployments:
  archwing:
    reload_seconds: 4.5
    no_resupply: false      # a regenerating magazine, so no reserve to dry
    # THE OTHER TAB'S DAMAGE, transcribed rather than halved. Both columns are
    # written down so either can be checked against the page without doing
    # arithmetic — which is the one thing that would have caught this file
    # carrying the Archwing numbers under `deployment: atmosphere` (owner,
    # 2026-08-14).
    damage: { impact: 10.0, radiation: 80.0 }   # 90 total
mod_pools: [archgun]
mastery_rank: 8
max_rank: 30

# Weapon-level metadata (wiki Larkspur_Prime cross-checked against WFCD
# warframe-items, joined on internal name — they agree on every number).
accuracy: 8.33               # the page prints "Low" for this number
disposition: 0.80            # riven disposition (●●○○○), WFCD omegaAttenuation
polarities: [madurai, madurai, madurai]
riven_family: Larkspur
traits: [prime, vaulted]
internal_name: /Lotus/Weapons/Tenno/Archwing/Primary/PrimeLarkspur/PrimeLarkspurWeapon
noise: alarming
magazine: 100
# THE ATMOSPHERE COLUMN. 2.50 s, against 4.50 s in Archwing.
reload_seconds: 2.5

ammo_type: archgun
ammo_max: 400
# THE ONLY WEAPON THAT CANNOT BE RESUPPLIED, and the reason the flag exists.
# It is NOT "the only one with a reserve" — every weapon here states an
# `ammo_max` and the sim reads it. What every OTHER weapon also has is a way to
# refill it, which the sim stands in for with the Infinite-ammo default because
# it does not model ammo PICKUPS. A ground Arch-Gun cannot be resupplied:
# "Archguns only have a limited amount of ammo along with using magazines and
# standard reloading", and "once all of an Archgun's ammunition is used up,
# the weapon is removed and can only be called down again after a 5-minute
# cooldown period" (wiki Arch-Gun). 100 in the magazine and 400 behind it is
# the whole engagement.
no_resupply: true

# CO catalog, re-read 2026-08-03: the only Larkspur Prime row is its
# ALT-FIRE — "Projectile, 100%, Multiplying" — and that is the CHARGED form
# (larkspur_prime_charged.yaml), not this one. This entry is the normal fire,
# which the catalog does not list, so it takes the ADDITIVE class. It said
# "the normal class applies" and then set `independent`, which is the
# exception the alt-fire earns and this attack does not.
co_behavior: additive_with_base_damage

# THE NORMAL FIRE — the module's "Normal Attack", hit-scan and held. Innate
# damage is 89% RADIATION (80 of 90), which puts it in the same shape as the
# Verglas' pure Cold: the innate element enters the hierarchy LAST and takes
# whatever the mod elements leave (MECHANICS §3 rule 2). Radiation is a
# COMBINED element, so it cannot be consumed by a mod pairing at all.
attack:
  trigger: held
  shot_type: hit_scan
  fire_rate: 12.0
  multishot: 1.0
  # 0.5 PER TICK, and this weapon is why the field is read at last: the wiki
  # states the general rule ("Beam Weapons consume 0.5 ammo per trace — unless
  # they are Flamethrowers") and the Larkspur Prime page states it again for
  # this weapon, "0.5 per primary tick", against 10 for the alt-fire. The sim
  # spent a flat 1.0 until 2026-08-01, which halved this magazine.
  ammo_cost: 0.5
  crit_chance: 0.14
  crit_multiplier: 1.6
  status_chance: 0.50
  punch_through_m: 0.0
  # THE ATMOSPHERE COLUMN: 20 Impact + 160 Radiation = 180, against the
  # Archwing column's 10 + 80 = 90. Still 89% Radiation, so nothing about the
  # element hierarchy below changes.
  damage: { impact: 20.0, radiation: 160.0 }

source:
  url: https://wiki.warframe.com/w/Larkspur_Prime
  # note: every number cross-checked wiki page == WFCD warframe-items
  # (joined on internal name). They agree on both attacks, the explosion and
  # its falloff, the polarities, disposition, mastery, magazine and the two
  # reload columns. The Arch-Gun deployment rules (Ammo Max by mode, the
  # five-minute cooldown, the two arcane slots) are from wiki Arch-Gun.
