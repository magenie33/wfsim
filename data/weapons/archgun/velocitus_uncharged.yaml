id: velocitus_uncharged
name: Velocitus
# A FORM OF ITS WEAPON: everything below that describes the WEAPON
# rather than this shot is inherited from `velocitus`, and only what
# DIFFERS is written here. See `weapons_data::INHERITED`.
inherits: velocitus
# THE UNCHARGED SHOT — the same trigger released early. See `velocitus` for
# the charged form this weapon is normally played as.
form: base
transform_group: velocitus

deployments:
  archwing:
    reload_seconds: 1.4
    no_resupply: false
    damage: { impact: 150.0, puncture: 150.0, slash: 150.0, magnetic: 150.0 }  # 600
    crit_chance: 0.30

# CONDITION OVERLOAD, its own row:
#   Velocitus | Uncharged attack | Projectile | 100% | Multiplying
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 7
  trigger: semi_auto
  # NO CHARGE. An uncharged shot has no draw at all, and `charge_seconds: 0.0`
  # is refused outright — "a 0.0 charge outside a bow is just a fire rate".
  # Omitting it is the spelling that means "no draw"; a bow may state a zero
  # because there the draw IS the cycle and the magazine is one arrow.
  shot_type: projectile
  projectile_speed_mps: 125
  fire_rate: 5.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.30
  crit_multiplier: 2.0
  status_chance: 0.25
  # INNATE INFINITE BODY PUNCH-THROUGH — the punch-through page's own exception
  # list, "Velocitus". Written as a number the sim can
  # hold, and it is the WHOLE mechanic here: the qualifier that goes with it separates BODIES
  # from geometry ("innate punch through does not apply to surfaces") and this
  # arena has no geometry, so everything the ray meets is a body.
  punch_through_m: 999.0
  damage: { impact: 300.0, puncture: 300.0, slash: 300.0, magnetic: 300.0 }  # 1200

unmodeled:
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Velocitus
