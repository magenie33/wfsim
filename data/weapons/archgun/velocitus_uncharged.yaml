id: velocitus_uncharged
name: Velocitus
# A FORM OF ITS WEAPON: everything below that describes the WEAPON
# rather than this shot is inherited from `velocitus`, and only what
# DIFFERS is written here. See `weapons_data::INHERITED`.
inherits: velocitus
# THE UNCHARGED SHOT — the same trigger released early. See `velocitus` for
# the charged form this weapon is normally played as.
form: base
transform_group: velocitus

deployments:
  archwing:
    reload_seconds: 1.4
    no_resupply: false
    damage: { impact: 150.0, puncture: 150.0, slash: 150.0, magnetic: 150.0 }  # 600
    crit_chance: 0.30

# CONDITION OVERLOAD, its own row:
#   Velocitus | Uncharged attack | Projectile | 100% | Multiplying
co_behavior: independent

attack:
  trigger: semi_auto
  charge_seconds: 0.0
  shot_type: projectile
  projectile_speed_mps: 125
  fire_rate: 5.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.30
  crit_multiplier: 2.0
  status_chance: 0.25
  # 5.0 m on the ground, 0.0 in Archwing — an uncharged shot in space punches
  # through nothing. It changes no number here either way.
  punch_through_m: 5.0
  damage: { impact: 300.0, puncture: 300.0, slash: 300.0, magnetic: 300.0 }  # 1200

unmodeled:
  - "the innate 5 m punch-through is not modelled — this arena has one target, so it changes no number"
  - "the Arch-Gun Deployer's five-minute cooldown is not modelled — when the reserve runs dry the weapon is gone for the rest of a real mission, and this arena simply stops firing"

source:
  url: https://wiki.warframe.com/w/Velocitus
