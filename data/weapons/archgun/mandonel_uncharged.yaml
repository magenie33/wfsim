id: mandonel_uncharged
name: Mandonel
# see notes: form_of_its_weapon_inherits
inherits: mandonel
# THE HORIZONTAL SPREAD — the uncharged shot, and a different weapon in shape:
# EIGHT projectiles in a wide horizontal line rather than one hit-scan lance.
form: base
transform_group: mandonel

deployments:
  archwing:
    reload_seconds: 3.0
    no_resupply: false
    # PER PROJECTILE, like the ground column below — 90 each, 720 for the volley.
    damage: { impact: 25.0, puncture: 15.0, slash: 10.0, radiation: 40.0 }

accuracy: 12.5               # "Very Low" — it is a spread

# CONDITION OVERLOAD, its own row and NOT the charged form's:
#   Mandonel | Uncharged Attack | Projectile | 100% | Multiplying
co_behavior: independent

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 60
    max_deg: 80
  trigger: semi_auto
  # see notes: no_charge_uncharged_shot
  shot_type: projectile
  projectile_speed_mps: 125
  fire_rate: 3.0
  # EIGHT PROJECTILES. The damage below is ONE of them (180); the volley is
  # 1440, which is what the page's total states.
  multishot: 8.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2.0
  status_chance: 0.15
  # The page's own list names it: "Mandonel".
  # see notes: infinite_body_punch_through
  punch_through_m: infinite
  damage: { impact: 50.0, puncture: 30.0, slash: 20.0, radiation: 80.0 }   # 180 each

unmodeled:
  - "the horizontal SPREAD is not modelled — the eight projectiles go out in a wide line and this arena has one target at zero distance, so all eight always land on it"
  - reason: arch_gun_deployer_cooldown

source:
  url: https://wiki.warframe.com/w/Mandonel
