id: burst_laser_prime
name: Burst Laser Prime
# see notes: sentinel_weapon_own_equipment
slot: sentinel
class: sentinel_weapon
form: base
default_form: true

# PISTOL MODS, not rifle. The Burst Laser family is one of the two exceptions
# in this class — its page's "Mod Pool" row says Pistol, and DE's own internal
# name for it ends in `BurstLaserPistol`. Modding it as a rifle would offer a
# pool it cannot wear and hide the one it can.
mod_pools: [pistol]
mastery_rank: 0
max_rank: 30

accuracy: 100.0
disposition: 1.45
polarities: []
riven_family: Burst Laser
traits: [prime]
internal_name: /Lotus/Types/Sentinels/SentinelWeapons/PrimeBurstLaserPistol
noise: alarming
magazine: 15
reload_seconds: 0.01
# see notes: sentinel_weapons_draw_from

# see notes: no_condition_overload_row
co_behavior: additive_with_base_damage

attack:
  trigger: burst
  # FIVE rounds a pull against the ordinary's three, and a shorter gap between
  # them — the Prime's burst is longer AND faster.
  burst:
    count: 5
    delay_seconds: 0.2
  shot_type: projectile
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.20
  crit_multiplier: 2.3
  status_chance: 0.15
  punch_through_m: 0.0
  damage: { impact: 2.5, puncture: 21.25, slash: 1.25 }   # 25 total
unmodeled:
  - reason: companion_fires_it
  - reason: spread_not_transcribed

source:
  url: https://wiki.warframe.com/w/Burst_Laser_Prime
  # see notes: every_stat_wiki_page
