id: verglas_prime
name: Verglas Prime
# SENTINEL WEAPON (the default weapon of Nautilus Prime). Its own equipment
# slot: it is not a Primary, it sits on the companion — but it draws from the
# RIFLE mod pool, which is what actually decides what fits (wiki: Mod Pool =
# Rifle Mods; WFCD productCategory = SentinelWeapons).
slot: sentinel
class: sentinel_weapon         # the "sentinel" in the class is what gates the
# One form, and it is a real registration rather than an absence: a beam
# weapon has nothing to charge and nothing to transform into.
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
                               # arcane and exilus rules below
# RIFLE mods only. A sentinel weapon is not a Primary weapon - DE's own
# compat tag for it is SentinelWeapons, not LongGuns - so the `primary` pool
# (Hunter Munitions, Vigilante) is NOT claimed here. Unsourced either way;
# omitting compatibility we cannot cite beats inventing it.
mod_pools: [rifle]
mastery_rank: 0
max_rank: 30

# A sentinel weapon has NO exilus slot and takes NO arcane (user, 2026-07-31;
# the builder already says "sentinel weapons have no exilus slot"). Both follow
# from `class` containing "sentinel", so there is nothing to declare here —
# recorded so the ABSENCE of `exilus_polarity` reads as a fact, not an omission.

# Weapon-level metadata (wiki cross-checked against WFCD).
accuracy: 100                  # hit-scan; the wiki page prints N/A for that
disposition: 1.3               # riven disposition (●●●●○)
polarities: [naramon]          # one innate Naramon (both sources agree)
riven_family: Verglas
traits: [prime]
internal_name: /Lotus/Types/Sentinels/SentinelWeapons/SentinelFreezeRayPrimeRifle
noise: alarming
# Sentinel weapons draw from an INFINITE reserve — there is no ammo pickup
# economy to model, so no `ammo_max`. The magazine and reload are real.
magazine: 80
reload_seconds: 1.6

# No CO catalog row for this weapon, so the normal class applies — and the
# normal class is ADDITIVE. This said exactly that and then set `independent`,
# which is the wiki's "Multiplying" and the opposite (user, 2026-08-03). The
# catalog "lists only discrepant attacks. Anything not listed should be assumed
# to be Additive with +100% bonus"; re-checked 2026-08-03, Verglas appears
# nowhere in it.
co_behavior: additive_with_base_damage

# Innate damage is pure COLD, which makes this the engine's reference case for
# an elemental-innate weapon: the innate element enters the hierarchy LAST and
# takes whatever the mod elements leave (MECHANICS §3 rule 2).
attack:
  trigger: held
  shot_type: hit_scan
  fire_rate: 12.0
  multishot: 1.0
  # 0.5 PER TICK: "Beam Weapons consume 0.5 ammo per trace — unless they are
  # Flamethrowers" (wiki), and this is a beam. The RESERVE is infinite here, so
  # this changes nothing about running dry — but the MAGAZINE is real (80), so
  # it halves how often the weapon reloads, which is DPS. Read from 2026-08-01;
  # the sim spent a flat 1.0 before that.
  ammo_cost: 0.5
  crit_chance: 0.14
  crit_multiplier: 2.2
  status_chance: 0.36
  punch_through_m: 0.0
  # THE RANGE IS A WALL, NOT A RAMP: full damage to the end of it and
  # literally nothing past it. Transcribed from the wiki's Range stat; it
  # already sat in this file's `beam_range` note, which the engine could
  # not read (2026-08-19).
  range_m: 24.0
  damage: { cold: 32.0 }

# THE SAME ADMISSIONS AS THE ORDINARY VERGLAS. This entry carried none at all
# until the ordinary one joined the roster and the board check noticed the two
# halves of one weapon admitting different things (2026-08-15) — a companion
# firing its own weapon and a beam range this arena has no distance for are
# properties of the WEAPON and were always missing here.
unmodeled:
  - reason: companion_fires_it
  - reason: spread_not_transcribed

source:
  url: https://wiki.warframe.com/w/Verglas_Prime
