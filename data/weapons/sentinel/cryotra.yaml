id: cryotra
name: Cryotra
# see notes: sentinel_weapon_own_equipment
slot: sentinel
class: sentinel_weapon
form: base
default_form: true

# see notes: rifle_mods_pool_per
mod_pools: [rifle]
mastery_rank: 0
max_rank: 30

# The module says 2.5 and this read 100.0, which is the value 17 of the 41
# companion rows carry — a default that was never replaced. Only three
# companions are not 100: both Sweepers at 3.33, and this.
accuracy: 2.5
disposition: 1.0
polarities: [madurai]
riven_family: Cryotra
internal_name: /Lotus/Types/Friendly/Pets/MoaPets/MoaPetComponents/CryoxionWeapon
noise: alarming
magazine: 3
reload_seconds: 5.0
# see notes: sentinel_weapons_draw_from

# see notes: no_condition_overload_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 40
    max_deg: 40
  trigger: semi_auto
  shot_type: projectile
  # The module's own figure. 0.67 is the card's two places, and every other
  # entry in the roster carries the module's.
  fire_rate: 0.667
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.10
  crit_multiplier: 1.75
  status_chance: 0.10
  punch_through_m: 0.0
  # THE GRENADE ONLY. The COLD FIELD it leaves is the rest of this weapon —
  # 20 Cold a tick at 1/s in a 1.5 m radius with its own 30% status chance —
  # and it is NOT carried, because the page gives no DURATION for it and a
  # lingering field without one cannot be written down without inventing the
  # number that decides its whole contribution. Left out and stated, which is
  # the rule for a source that cannot be reached.
  damage: { impact: 10.0 }
unmodeled:
  - "the COLD FIELD is not modelled at all, and it is most of this weapon — each grenade leaves a 1.5 m field dealing 20 Cold a second with a 30% status chance, and the page prints no DURATION for it, so carrying it would mean inventing the number that decides how much it is worth. Only the grenade's 10 Impact is counted here, which makes this entry a FLOOR rather than the weapon"
  - reason: companion_fires_it

source:
  url: https://wiki.warframe.com/w/Cryotra
  # see notes: every_stat_wiki_page
