id: burst_laser
name: Burst Laser
# see notes: sentinel_weapon_own_equipment
slot: sentinel
class: sentinel_weapon
form: base
default_form: true

# PISTOL MODS, not rifle. The Burst Laser family is one of the two exceptions
# in this class — its page's "Mod Pool" row says Pistol, and DE's own internal
# name for it ends in `BurstLaserPistol`. Modding it as a rifle would offer a
# pool it cannot wear and hide the one it can.
mod_pools: [pistol]
mastery_rank: 0
max_rank: 30

accuracy: 100.0
disposition: 1.45
polarities: []
riven_family: Burst Laser
internal_name: /Lotus/Types/Sentinels/SentinelWeapons/BurstLaserPistol
noise: alarming
magazine: 15
reload_seconds: 0.01
# see notes: sentinel_weapons_draw_from

# see notes: no_condition_overload_row
co_behavior: additive_with_base_damage

attack:
  trigger: burst
  burst:
    count: 3
    delay_seconds: 0.4
  shot_type: projectile
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.15
  crit_multiplier: 2.0
  status_chance: 0.10
  punch_through_m: 0.0
  damage: { impact: 2.0, puncture: 17.0, slash: 1.0 }   # 20 total
unmodeled:
  - reason: companion_fires_it
  - reason: spread_not_transcribed

source:
  url: https://wiki.warframe.com/w/Burst_Laser
  # see notes: every_stat_wiki_page
