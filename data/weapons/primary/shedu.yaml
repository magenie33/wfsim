id: shedu
name: Shedu
slot: primary
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
# WFCD `type: Rifle`, and DE's own path is a rifle path — an ARM-CANNON is a
# chassis, not a mod class. Same three pools a rifle gets.
class: rifle
mod_pools: [primary, rifle]
grip_type: RIFLE
mastery_rank: 13
max_rank: 30

# Weapon-level metadata. EVERY FIELD HERE IS TAKEN, NOT REMEMBERED — the first
# draft of this file invented three of them and all three were wrong: the
# internal name (which is the i18n JOIN KEY, so the Chinese name silently went
# missing), the accuracy (100 for the page's "Very High", where the scale this
# repo uses is WFCD's 28.57) and the update it shipped in. Cross-checked against
# WFCD warframe-items, which agrees with the wiki on every attack figure below.
accuracy: 28.571428          # WFCD; the page prints it as "Very High"
disposition: 0.75            # ●●○○○, WFCD omegaAttenuation 0.75
polarities: [madurai, madurai]
# NO `exilus_polarity:` — WFCD does not carry one for this weapon and the page
# does not print one, so the field is LEFT OUT rather than guessed. It is
# optional, and an absent one costs a player nothing but a Forma; an invented
# one would silently make every capacity plan wrong.
riven_family: Shedu
traits: [sentient]
introduced: "27.0"           # Empyrean (2019-12-13); the blueprint comes from Erra
internal_name: /Lotus/Weapons/Sentients/Shedu/SheduHeavyWeapon
noise: alarming

# NO AMMO POOL AT ALL — "Ammo Max: 0", "This weapon does not use ammo pickups;
# ammo regenerates over time." The magazine IS the weapon's whole supply, so
# `ammo_max: 0` is the fact rather than a placeholder: `reserve_is_infinite`
# reads `has_reserve` off it and answers "there is no reserve to run dry",
# which is the same shape a sentinel weapon has.
ammo_type: primary
ammo_max: 0
ammo_pickup: 0
magazine: 7

# THE RELOAD IS A BATTERY REGENERATING, and the listed 1.25 s is not a reload
# time — it is a DELAY plus a REFILL, and both halves are published:
#
#   "Has a 1 second delay before ammo begins to regenerate; if there are still
#    rounds left, the delay is 0.4 seconds instead."
#   "Ammo regenerates at 28 rounds per second; it takes 0.25 seconds to
#    regenerate a fully depleted battery excluding the delay."
#
# 7 / 28 = 0.25 s, so a fully depleted battery costs 1.0 + 0.25 = 1.25 s — the
# wiki's Reload Time to the digit — and a partially spent one costs
# 0.4 + 0.25 = 0.65 s, which is WFCD's `reloadTime`. The two sources disagreed
# only because each published a different case of the same model.
reload_seconds: 1.25         # the EMPTY case: 1.0 s delay + 7/28 s refill
#
# AND ONLY PART OF A GAP PAYS — the part beyond the delay — so the weapon breaks
# even at 0.4 + 1/28 = 0.4357 s a shot, i.e. 2.295 rounds/s, 8.2% BELOW its
# listed 2.50. Above that it drains and reloads; below it every gap returns more
# than a whole round and the battery never empties.
#
# ✅ MEASURED on the official ruler (2026-08-10, 180 s): stock fires 297 rounds
# and reloads 49 times; the same build with Vile Precision (-15% fire rate)
# fires 288 and reloads ZERO — 3% fewer shots, no downtime at all, and slightly
# more damage for it. A fire-rate PENALTY making this weapon better is the
# mechanic's whole signature, and it is why `reload_seconds` alone cannot stand
# in for it.
battery:
  regen_per_second: 28.0
  delay_empty_s: 1.0
  delay_partial_s: 0.4

# CO IS MULTIPLYING, and the catalog says so in its own row — which I had
# claimed it did not (2026-08-10, corrected the same day by actually opening the
# page instead of assuming absence):
#
#   Shedu | Normal Attack | Projectile | 71 | 71 | 100% | Multiplying
#
# 71 unmodded and 100% of the base, both of which match the attack below. It is
# the Torid's class, not the ordinary one: a free-standing x(1 + co x types)
# rather than a share of the base-damage bucket Serration dilutes.
#
# AND IT SETTLES THE "BUG". The page's Bugs section says "Galvanized Aptitude is
# multiplicative to base damage sources on direct hits" — Galvanized Aptitude IS
# the CO bonus, so that sentence and this row describe one behaviour. The
# catalog classifies it; the Bugs entry is a stale reading of the same fact.
#
# THE EXPLOSION HAS NO ROW, and that absence IS meaningful: CO is a direct-hit
# bonus everywhere, and an AoE part needs its own row to take it (which is
# exactly what the Torid's cloud has). So the explosion takes none, which is the
# engine's default for a radial.
co_behavior: independent

unmodeled:
  - "the BATTERY DISCHARGE that fires when the magazine empties: a 20 m pulse for 100 Impact. It is now fully SPECIFIED and merely unbuilt — the page states its whole scaling rule and I had declared it unknowable: \"This is affected by base damage, Faction Damage Bonus, and Firestorm / Primed Firestorm; but not by elemental or multishot bonuses.\" So: the base-damage bucket and the faction column reach it, elements and multishot do not, and its RADIUS takes the blast-radius mods the shot's own explosion refuses. Its status is a 100% CHANCE rather than a forced proc, so status mods push it past one proc and a negative-status riven makes it miss"
  - "the discharge also removes Sentient and Shadow Stalker damage resistances, which is worth nothing against any target in this roster — no Sentient here has one to strip"
  - "damage falloff on the explosion, linear to 40% at 6.6 m — this arena has no distance, so every shot lands at point blank"
  - "+30% Movement Speed while aiming, and the explosion's self-stagger: neither is a number this arena reads"

attack:
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 200
  fire_rate: 2.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2.1
  status_chance: 0.23
  punch_through_m: 0.0
  damage: { heat: 71.0 }

  # ITS TWO ELEMENTS ARE INDEPENDENT, which is the weapon's real signature and
  # not a detail of how the file is laid out. The direct hit is Heat and the
  # explosion is Electricity, and each combines with the elemental mods on its
  # own — VERBATIM (wiki Tips): "The Heat and Electricity damage portions are
  # separate from one another, the Shedu can get a combination of Gas and
  # Corrosive with only a Toxin damage mod, or a combination of Blast and
  # Magnetic with only a Cold mod."
  #
  # ✅ Both of those reproduce exactly (2026-08-10), and they are pinned by
  # `one_elemental_mod_makes_two_combinations_on_a_two_element_weapon`: one
  # Toxin mod gives Gas + Corrosive, one Cold mod gives Blast + Magnetic. It
  # needed no engine work — a radial has carried its own vector since the
  # Laetum — but nothing was asserting it, and a build that combined one element
  # set and handed it to both parts would have produced Gas twice.

  # THE EXPLOSION, on every shot: "Shots explode in a 6.6 meter radius upon
  # impacting a surface or enemy", and "Initial hit and explosion apply status
  # separately" — which is exactly what a `radial` is here (MECHANICS §7).
  #
  # It carries its own crit and status (29%, against the direct hit's 23%) and
  # its own element, and it never takes a body-part multiplier: "Explosion has
  # a headshot multiplier of 1x and cannot trigger headshot conditions", which
  # is the engine's rule for every radial rather than a Shedu special case.
  # PRIMARY COMPRESSION's row, by column (docs/CATALOGS.md §2):
  #   Attack Name  Primary Fire + AoE      Base Radius  6.6 m
  #   Effectiveness 100%                   Max @ base   +528%
  #   Stacking      Multiplies             Class        Arm-Cannon
  #   Radius calc   Snapshot
  #   w/ Primed Firestorm  "Primary Fire AoE not affected by Firestorm"
  #   Notes                "Cannot use reload pulse radial."
  #
  # That Firestorm sentence is the FIRESTORM COLUMN's cell, not a note — the
  # column holds an explanation where a number would go, saying why this weapon
  # has no boosted figure. It is the same slot that reads "Shotguns cannot equip
  # mod" on every shotgun row.
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot

  radial:
    # ITS RADIUS DOES NOT TAKE BLAST-RADIUS MODS, and the page says it of this
    # explosion in as many words: "Explosion cannot benefit from Firestorm
    # (Primed) despite being area of effect."
    #
    # THE PULSE IS THE OPPOSITE, which is the pair worth holding in one hand
    # (owner asked it be confirmed, 2026-08-11, and it is): the battery
    # discharge "is affected by base damage, Faction Damage Bonus, and Firestorm
    # / Primed Firestorm". So one weapon has two AoEs and the blast-radius
    # bucket reaches exactly the one Primary Compression cannot use ("cannot use
    # reload pulse radial") — the arcane is stuck at this 6.6 m and Firestorm
    # can only enlarge the radius it is forbidden to spend.
    #
    # The engine multiplies EVERY radial's radius by that bucket today, so a
    # Shedu carrying Firestorm has a bigger explosion here than in game. It
    # changes no damage while the arena has one target; it changes Primary
    # Compression's bonus by 44% the day that arcane lands. docs/CATALOGS.md §2.
    takes_blast_radius_mods: false
    damage: { electricity: 87.0 }
    radius_m: 6.6
    falloff_start_m: 0.0
    falloff_reduction: 0.4      # 87 at the centre -> 34.8 (40%) at 6.6 m
    crit_chance: 0.25
    crit_multiplier: 2.1
    status_chance: 0.29

source:
  url: https://wiki.warframe.com/w/Shedu
  # note: every attack figure agrees between the wiki infobox and WFCD's
  # `attacks` array ("Normal Attack" / "Radial Attack", falloff
  # {start 0, end 6.6, reduction 0.6} — the fraction LOST there, 40% kept).
