# THE DAIKYU WITH A QUICK SHOT. The ordinary one can only be fired fully drawn;
# the Prime fires from 25% of the draw for half the damage, which is what the
# two entries are. 750 damage fully drawn, three metres of punch through on
# both, and a guaranteed Impact proc on both.
