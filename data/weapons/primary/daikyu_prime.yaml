mod_pools: [primary, rifle, bow]
compatibility_tags: [projectile, daikyu]   # see notes: de_compatibility_tags
mastery_rank: 15
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 16.7
disposition: 1.2
polarities: [madurai, madurai]
exilus_polarity: naramon
riven_family: Daikyu
