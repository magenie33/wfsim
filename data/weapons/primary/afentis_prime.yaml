id: afentis_prime
name: Afentis Prime
slot: primary
# THE AFENTIS WITH A 5.5-METRE BLAST rather than three, and the lowest riven
# disposition in the primary roster.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: afentis_prime
mod_pools: [primary, rifle]   # CompatibilityTags PROJECTILE, IMPACTEXPLODE
mastery_rank: 13
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 100.0
disposition: 0.5            # riven disposition
polarities: [naramon, madurai, madurai]
exilus_polarity: madurai
riven_family: Afentis
traits: [tenno, prime]
introduced: "43"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeAfentis/PrimeAfentisWeapon
noise: alarming
ammo_type: primary
ammo_max: 12
ammo_pickup: 4
magazine: 4
reload_seconds: 1.8

# see notes: condition_overload_no_row_4
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 90
  fire_rate: 0.833
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.26
  crit_multiplier: 2.6
  status_chance: 0.3
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # see notes: no_range_row_attack_2
  #
  #   Afentis (Afentis Prime) | Primary Fire + AoE | 100% | Multiplies |
  #   Snapshot | 5.5 m | +440%
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 40, puncture: 120, slash: 40 }   # total 200
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 5.5
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    crit_chance: 0.26
    crit_multiplier: 2.6
    status_chance: 0.1
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 800, heat: 250 }   # total 1050

unmodeled:
  - "a direct hit forces a KNOCKDOWN and the explosion a RAGDOLL (module ForcedProcs) — neither is a damage type and this arena's enemies are neither knocked down nor thrown"
  - reason: explosion_ignores_cover
  - reason: self_stagger

