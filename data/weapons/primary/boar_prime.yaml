id: boar_prime
name: Boar Prime
slot: primary
# SHOTGUN — the first one in the roster, and the reason `data/mods/shotgun/`
# exists. A shotgun is NOT a subset of Rifle: DE tags its mods `Shotgun` and
# the two pools share nothing but the `PRIMARY` tag (wiki Shotgun_Mods;
# docs/DATA_SOURCES.md "Mod compatibility is a UNION of pools").
class: shotgun
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
# `primary` mods fit ANY primary weapon (Hunter Munitions, the Vigilante set);
# `shotgun` is the class pool. There is deliberately no `rifle` here — a
# shotgun takes no Serration, no Split Chamber, no Point Strike.
mod_pools: [primary, shotgun]
grip_type: ""                # the data module records an empty GripType
mastery_rank: 11
max_rank: 30

# Weapon-level metadata (wiki `Module:Weapons/data/primary` cross-checked
# against the committed WFCD export, joined on internal name).

accuracy: 5                  # the page prints "Very Low" for this number
disposition: 1.34            # riven disposition (●●●●●) — both sources agree
polarities: []               # NO innate main polarities: the module's block
                             # carries no `Polarities` key (152 other weapons
                             # in the same file do), and WFCD carries none
exilus_polarity: madurai
riven_family: Boar           # module `Family` — shared with the Boar
traits: [prime, vaulted]
introduced: "10.0"
internal_name: /Lotus/Weapons/Tenno/Shotgun/PrimeBoar
noise: alarming              # IsSilent false
ammo_type: primary
ammo_max: 120
ammo_pickup: 40
magazine: 20
reload_seconds: 2.75

# Condition Overload: NO row in the wiki's CO catalog for this weapon, which
# is a POSITIVE statement — "listing only discrepant attacks. Anything not
# listed should be assumed to be Additive with +100% bonus" (the catalog's own
# header). Additive = joins the base-damage bucket, the class Galvanized Savvy
# describes as "usually additive with other damage mods like Point Blank".
#
# This read `additive`, a spelling that exists nowhere, and the loader's old
# `_ =>` arm turned it into Independent — the wiki's "Multiplying", i.e. the
# EXCEPTION class, on a weapon the catalog does not list (user, 2026-08-03).
co_behavior: additive_with_base_damage

# ONE attack part. The Incarnon form is its own weapon entry
# (boar_prime_incarnon.yaml), the way the Torid and the Laetum carry theirs.
attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 10
    max_deg: 30
  trigger: auto
  shot_type: hit_scan
  fire_rate: 4.67
  # INNATE MULTISHOT — 8 pellets, and the damage below is PER PELLET, not the
  # shot's total. That is the convention both sources use and the one this
  # repo already settled on the Cernos Prime (`multishot: 3.0` with
  # `damage: 184 per arrow`, against a WFCD `totalDamage` of 184): the
  # module's `Damage` block is one pellet's, and multishot is how many of them
  # a pull fires. The wiki page says it in its own patch history — "Damage
  # increased from 23 to 40 (per pellet)".
  multishot: 8.0
  ammo_cost: 1
  crit_chance: 0.15
  crit_multiplier: 2.0
  # PER PELLET, and that is the whole of the shotgun status rework: "The UI now
  # behaves to show the reality that you are determining Status Chance per
  # pellet" (wiki, Boar Prime patch history). The engine rolls status per
  # pellet already, so this number goes in unmodified.
  status_chance: 0.1125
  punch_through_m: 0.0
  # 26 / 6 / 8, and the two sources DISAGREE about the last two: WFCD's
  # flattened `damage` map says Puncture 8 / Slash 6, while its own `attacks`
  # array says Puncture 6 / Slash 8 — and the wiki module agrees with the
  # `attacks` array. Two of the three say 6/8, and the one that dissents is
  # the derived summary rather than the per-attack record, so 6/8 it is.
  # NOT MODELLED — the arena has no distance, so this weapon is
  # simulated at point blank. Recorded because the RIVEN pool reads
  # it: a hitscan weapon that lists a falloff still rolls Projectile
  # Speed, which scales the whole range (wiki `Projectile Speed`).
  falloff:
    start_m: 18
    end_m: 25
    reduction: 0.7   # fraction KEPT past end_m
  damage: { impact: 26.0, puncture: 6.0, slash: 8.0 }
  # Damage FALLOFF, hitscan: full damage to 18 m, decaying to 30% of it at
  # 25 m and beyond (module `Falloff`, Reduction 0.7). NOT READ by the engine —
  # the sim has no range — and recorded so a spatial model finds it.
  falloff_start_m: 18.0
  falloff_end_m: 25.0
  falloff_reduction: 0.7
  # The cone one pull spreads over, in degrees (module MinSpread/MaxSpread).
  # NOT READ either: with one target and no geometry, spread decides nothing.
  spread_min_deg: 10.0
  spread_max_deg: 30.0

# TWO WEAPONS MODEL: this is the base form; the Incarnon form is a second
# weapon entry that this one transforms into.
transform_group: boar_prime
transforms_to: boar_prime_incarnon

# incarnon_evolutions (data/evolutions/boar_prime_*.yaml) — FOUR tiers. The
# challenge listed against a tier is the one that UNLOCKS it; tier 1 comes with
# the Genesis install.
# - { tier: 1, unlock: installing the Genesis,
#     options: [boar_prime_evo1_incarnon_form] }
# - { tier: 2, unlock: complete a solo mission with this weapon equipped,
#     options: [boar_prime_reified_bane, boar_prime_fortress_salvo] }
# - { tier: 3, unlock: kill 100 enemies with this weapon's Incarnon Form,
#     options: [boar_prime_ready_retaliation, boar_prime_mercenary_chamber,
#     boar_prime_practiced_grip] }
# - { tier: 4, unlock: kill 30 enemies without reloading,
#     options: [boar_prime_elemental_balance, boar_prime_critical_parallel,
#     boar_prime_survivors_edge] }
#
# The Genesis is the BOAR FAMILY's — one item upgrades either the Boar or the
# Boar Prime — so it is documented at `Boar_Incarnon_Genesis`;
# `Boar_Prime_Incarnon_Genesis` 404s (DATA_SOURCES.md has that trap written
# up). Installing it costs 20 Pathos Clamps, 60 Rune Marrow and 60 Tasoma
# Extract, or 120 platinum from Cavalero, once.

source:
  url: https://wiki.warframe.com/w/Boar_Prime
