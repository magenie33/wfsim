id: cernos_uncharged
name: Cernos
# THE TAPPED SHOT: 190 damage, no punch through, on a slower arrow. Fired
# without drawing, which is what a bow's `semi_auto` trigger means here.
inherits: cernos
form: base
transform_group: cernos

introduced: "11.1"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and neither of
# this weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 70
  fire_rate: 1
  # A BOW'S CADENCE IS DRAW + NOCK, so the draw is stated even when there is
  # none: the module gives this shot no ChargeTime at all, and a 0.0 draw paces
  # on the reload — which is the one nocked arrow this weapon's magazine is.
  charge_seconds: 0.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.36
  crit_multiplier: 2.0
  status_chance: 0.18
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { impact: 171, puncture: 9.5, slash: 9.5 }   # total 190

unmodeled:
  - reason: silent_weapon

source:
  url: https://wiki.warframe.com/w/Cernos
