id: cernos_uncharged
name: Cernos
# THE TAPPED SHOT: 190 damage, no punch through, on a slower arrow. Fired
# without drawing, which is what a bow's `semi_auto` trigger means here.
inherits: cernos
form: base
transform_group: cernos

introduced: "11.1"

# see notes: inherited_co_catalog_gives_4
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 70
  fire_rate: 1
  # A BOW'S CADENCE IS DRAW + NOCK, so the draw is stated even when there is
  # none: the module gives this shot no ChargeTime at all, and a 0.0 draw paces
  # on the reload — which is the one nocked arrow this weapon's magazine is.
  charge_seconds: 0.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.36
  crit_multiplier: 2.0
  status_chance: 0.18
  punch_through_m: 0.0
  # see notes: no_range_row_attack
  damage: { impact: 171, puncture: 9.5, slash: 9.5 }   # total 190

unmodeled:
  - reason: silent_weapon

source:
  url: https://wiki.warframe.com/w/Cernos
