id: cernos_prime
name: Cernos Prime
slot: primary
# BOW — the first charge-trigger weapon in the roster.
class: bow
# The fully drawn shot — the form the arsenal shows and the one a bow is
# usually built for. Its sibling `cernos_prime_uncharged` (`form: base`) is
# the tapped shot: the same weapon, switched to for FREE by releasing early.
form: charged
transform_group: cernos_prime
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
# A bow's pool is the widest union in the game: `primary` fits ANY primary
# (Hunter Munitions, the Vigilante set), `rifle` is the class pool bows draw
# (wiki Rifle_Mods: Assault Rifles, Bows, Launchers, Snipers, Spearguns,
# Crossbows and Arm-Cannons), and `bow` is the narrow tag only bows carry
# (DE's `BOW` compatName — Thunderbolt and friends).
mod_pools: [primary, rifle, bow]
grip_type: BOW
mastery_rank: 12
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary cross-checked
# against WFCD warframe-items, joined on internal name — they agree on every
# number below; the module additionally carries AmmoMax/AmmoPickup, the spread
# cone and ExtraHeadshotDmg, which WFCD does not export).
accuracy: 16.7               # the page prints "Very High" for this number
disposition: 1.25            # riven disposition (●●●●○)
polarities: [madurai, madurai]
exilus_polarity: naramon
# Cernos, Rakta Cernos and this. NOT the Mutalist or the Proboscis: the wiki is
# explicit that those are entirely separate weapons whose rivens do not fit the
# ordinary Cernos, and DE lists all three as their own compatibility names.
riven_family: Cernos
traits: [prime, never_vaulted]
introduced: "19.0.7"         # Hotfix 19.0.7
internal_name: /Lotus/Weapons/Tenno/Bows/PrimeCernos/PrimeCernos
noise: silent                # IsSilent on both attacks — it never alerts
ammo_type: primary
ammo_max: 72
ammo_pickup: 15
magazine: 1                  # one nocked arrow; the "reload" is nocking the next
reload_seconds: 0.65

# The innate +50% headshot damage — the module's per-attack `ExtraHeadshotDmg`
# (0.5 on BOTH the uncharged and the charged shot), which the page states as
# "Deals 50% bonus damage on headshots". It joins the additive headshot
# bracket, the same one Caput Mortuum and the arcane bonus sit in
# (MECHANICS: `3 x (1 + 0.3 + 0.75)`), so on a 2x head it is 2 x 1.5 = 3x.
# NOT MEASURED: no source says whether a weapon's innate share joins that
# bracket or multiplies it separately. The bracket is the reading every other
# +headshot% source in the game obeys, so it is what we model — a measurement
# (stack it with Primary Deadhead and read the number) would settle it.
headshot_damage_bonus: 0.5
# ...and it does NOT join that bracket after all — ANSWERED by the wiki's own
# notes, which is the measurement the paragraph above asked for:
# "Cernos Prime's headshot bonus is unique and stacks multiplicatively with
# Primary Deadhead's headshot bonus." A PER-WEAPON anomaly, not a class rule —
# the same note lists innate bonuses on weapons like Kuva Chakkhurr among the
# ADDITIVE sources. On a 3x head with Primary Deadhead: 3 x 1.3 x 1.5 = 5.85x,
# where the additive reading gave 5.4x.
headshot_bonus_multiplicative: true

# Condition Overload behavior class — VERIFIED from the wiki CO catalog, one
# row, VERBATIM:
#   Cernos Prime | Charged Attack | Projectile | 552 | 276 | 50% | Adding |
#   CO-bonus only applies to base (uncharged) damage; bows have innate 2x
#   damage multiplier when fully charged
# "Adding" = the bonus joins the base-damage bucket, Hornet-Strike style (the
# Laetum's class, the opposite of the Torid's "Multiplying").
co_behavior: additive_with_base_damage
# The 50% column, and it is NOT an evolution exclusion — this weapon has no
# evolutions. It is the CHARGE multiplier being outside the additive bracket,
# which MECHANICS already lists among the omitted multipliers ("a bow's charge
# multiplier — a charged shot's CO is computed off the UNCHARGED base").
# 276/552 = 0.5 exactly: the uncharged shot is half the charged one.
# The catalog's two columns are FULL-SHOT totals (3 arrows x 184 and x 92);
# the fraction is the same per projectile.
co_base_fraction: 0.5

# THE CHARGED SHOT — the module's Attacks[2], which it marks as the arsenal's
# with `_TooltipAttackDisplay = 2`, and what WFCD's summary `damagePerShot`
# carries (184 per arrow). Attacks[1], the tapped shot at exactly half the
# damage, is the sibling entry.
attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 12
  trigger: charge
  # The draw. It — not `fire_rate` — is this weapon's cadence: wiki Fire Rate
  # gives bows their own formula, "Effective Fire Rate = 1 / (Modded Charge
  # Time + Modded Reload Time)", with no fire-rate term in it. So 0.5 draw +
  # 0.65 nock = 1.15 s per shot (0.87 shots/s), NOT the 1.0 the fire-rate stat
  # suggests. Fire-rate bonuses divide the draw instead of multiplying a rate.
  charge_seconds: 0.5
  shot_type: projectile
  projectile_speed_mps: 95      # 70 uncharged — the draw speeds the arrow up
  # The LISTED stat, kept as the stat: it is what the panel prints and what
  # fire-rate GATES read (Hemorrhage's "below 2.5"). The sim paces on
  # charge_seconds instead.
  fire_rate: 1.0
  # Innate 3 arrows, fired in a horizontal line ("Alternate Fire can toggle a
  # horizontal or vertical spread shot" — the toggle changes the pattern, not
  # the count). Base damage below is PER ARROW; 3 x 184 = the 552 the wiki
  # and the CO catalog quote for the whole shot.
  multishot: 3.0
  # NOT READ by the engine: nothing in engine/ references
  # `ammo_cost` — the sim spends a flat 1.0 (minus ammo efficiency) per shot.
  ammo_cost: 1
  crit_chance: 0.35
  crit_multiplier: 2.0
  status_chance: 0.30
  # Charged shots have innate 1 m punch through (0 uncharged). NOT READ by the
  # engine — single-target, punch-through only adds targets — and recorded so
  # a multi-target model finds it.
  punch_through_m: 1.0
  damage: { impact: 165.6, puncture: 9.2, slash: 9.2 }   # 184 per arrow

# The module's `DefaultUpgrades` names an innate mod
# (/Lotus/Weapons/Tenno/Bows/PrimeCernos/CernosPrimeInnateMod) exactly as it
# does for Dual Toxocyst's Frenzy, but this one carries no stats: the wiki's
# mod module marks it `_IgnoreEntry` with no effects. What it vehicles is the
# page's kill quirk — "On kill, bodies will follow the arrow that killed them,
# damaging enemies in their path and pinning the corpse to walls" — which is a
# multi-target ragdoll effect with no single-target DPS. So NO `perks` entry:
# there is nothing for a perk to grant.

source:
  url: https://wiki.warframe.com/w/Cernos_Prime
  # note: every number cross-checked wiki Module:Weapons/data/primary ==
  # WFCD warframe-items (joined on internal name). They agree exactly on both
  # attacks, the polarities, the exilus, disposition, mastery, magazine and
  # reload; the CO row is from Condition_Overload_(Mechanic).

