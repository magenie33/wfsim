id: mk1_strun_incarnon
name: MK1-Strun (Incarnon Form)
slot: primary
class: shotgun
form: incarnon

transform_group: mk1_strun
transforms_from: mk1_strun

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 40
    rounds_per_charge: 1
    max_rounds: 40
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 3.75      # = base reload time, unmodded

pseudo_reload:
  magazine: 40
  reload_seconds: 4.75

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 200
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 1                  # of the 40-round charge pool
  crit_chance: 0.44
  crit_multiplier: 3
  status_chance: 0.4
  punch_through_m: 0.0
  damage: { impact: 100 }   # total 100
  # The radial part — rules in MECHANICS §7.
  radial:
    damage: { slash: 60, puncture: 25, blast: 45 }   # total 130
    radius_m: 4
    falloff_start_m: 0
    falloff_reduction: 0.2
    crit_chance: 0.44
    crit_multiplier: 3
    status_chance: 0.4
    # see notes: declared_no_co_catalog

# incarnon_evolutions: see data/weapons/primary/mk1_strun.yaml (shared group)

source:
