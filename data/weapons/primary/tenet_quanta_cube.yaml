id: tenet_quanta_cube
name: Tenet Quanta
# THE CUBE. "Alternate Fire lobs small cube exploding on contact or after 9
# seconds", for 180 Electricity on the hit and 150 Blast in half a metre.
#
# THE HALF-METRE IS THE POINT, and it is what separates this from the cube's
# OTHER explosion: a cube that a player SHOOTS goes off for 600 Blast in 6
# metres instead. That second explosion is a two-step play — place a cube, then
# hit it — and this entry is the first step only. See the unmodelled list.
inherits: tenet_quanta
form: alt_fire
transform_group: tenet_quanta

introduced: "42"

# NOT INHERITED — the CO catalog gives a class per ATTACK. No row for either of
# this weapon's, so both are ordinary Additive; the explosion takes no Condition
# Overload at all, which is the engine's standing rule for a radial.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). A real cone, where
  # the beam's is zero.
  spread:
    min_deg: 2.0
    max_deg: 6.0
  trigger: semi
  shot_type: projectile
  projectile_speed_mps: 25
  fire_rate: 4.0
  multishot: 1.0
  # "Consumes 10 rounds per shot."
  ammo_cost: 10
  crit_chance: 0.05
  crit_multiplier: 1.5
  # A GUARANTEED STATUS ON THE DIRECT HIT — 100% is the infobox's own figure for
  # this attack, against 26% on the explosion beside it.
  status_chance: 1.0
  punch_through_m: 0.0
  # AND IT MAY NOT BE GIVEN ANY — this attack has an area-of-effect component,
  # so the punch-through page's class rule applies and the engine refuses Shred
  # and both Augers on it. The `radial:` block below states the shape.
  #
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, Cube (direct hit): "Range: 15.0 m", Projectile at 25 m/s — a real
  # reach on a lobbed projectile, and the page's own disadvantage bullet says
  # the same ("Cubes have slow travel; ~15-meter range").
  range_m: 15.0
  damage: { electricity: 180 }   # total 180

  # PRIMARY COMPRESSION's row, by column (docs/CATALOGS.md §2):
  #   Attack Name   Alt-Fire + AoE         Base Radius   0.5 m
  #   Effectiveness 100% / 8%              Max @ base    +40%
  #   Stacking      Multiplies             w/ Primed Firestorm  +57.6%
  #   Radius calc   Snapshot               Class         Rifle
  #
  # THE TWO EFFECTIVENESS FIGURES ARE THE CUBE'S TWO EXPLOSIONS — 100% on the
  # 0.5 m contact blast transcribed below, and 8% on the 6 m one a player shoots
  # loose, which is unmodelled. Only the first is here, so the single figure is
  # right for what this entry actually fires. The base radius column agrees with
  # it: 0.5 m, and the tiny bonus that follows from trading half a metre away.
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot

  # THE CONTACT EXPLOSION — 150 Blast in 0.5 metres, with "Initial hit and
  # explosion apply status separately", which is why it is a second instance
  # rather than added damage. NO DAMAGE FALLOFF, which the module states
  # outright (`Reduction: 0`) and the infobox prints as "100%-100%": full damage
  # to the rim, so the zero below is a transcription rather than an omission.
  radial:
    damage: { blast: 150 }
    radius_m: 0.5
    falloff_start_m: 0.0
    falloff_reduction: 0.0
    crit_chance: 0.05
    crit_multiplier: 1.5
    status_chance: 0.26

unmodeled:
  - "THE CUBE'S OTHER EXPLOSION, which is four times this one: \"If damaged by any player (e.g. nearby cube explosion), cube explodes in 6 meter radius\" for 600 Blast. It is a two-step play — place a cube, then shoot it — and this arena fires one attack at one aim point, so the step that pays is the one it cannot take"
  - "a cube left alone detonates after 9 seconds, which needs a miss and a clock this arena does not run"
  - reason: explosion_ignores_cover
  - "this weapon does NOT inflict self-stagger, which is a real advantage over every other explosive in this batch and is worth nothing here, because the arena never charges any of them for it either"

source:
  url: https://wiki.warframe.com/w/Tenet_Quanta
