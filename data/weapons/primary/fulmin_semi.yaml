id: fulmin_semi
name: Fulmin
# THE SEMI-AUTO SHOTGUN HALF: 500 damage on a silent projectile for ten rounds
# of the battery, with a guaranteed Impact proc inside 9 metres and a falloff
# window from 10 to 20 m.
inherits: fulmin
form: semi_auto
transform_group: fulmin

introduced: "25.0"

# see notes: battery_restated_on_every_form
battery:
  regen_per_second: 30.0
  delay_empty_seconds: 1.0
  delay_partial_seconds: 1.0

# see notes: condition_overload_catalog_names
#
#   Fulmin | Semi-Mode | Projectile | 500 | 500 | 100% | Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

# see notes: head_worth_1x_attack
headshot_multiplier: 1.0

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 6.0
    max_deg: 16.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 2.17
  multishot: 1.0
  ammo_cost: 10
  crit_chance: 0.3
  crit_multiplier: 2.2
  status_chance: 0.16
  # Semi-auto mode: "Innate 3 meter punch through against bodies" (wiki
  # Fulmin). The module reads 0; the Punch Through page's list says
  # infinite, and the weapon's own number is the one carried.
  punch_through_m: 3.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # see notes: no_range_row_attack
  falloff:
    start_m: 10.0
    end_m: 20.0
    reduction: 0.6666
  damage: { electricity: 400, impact: 100 }   # total 500

unmodeled:
  - "The guaranteed Impact proc reaches only 9 m, scaling with Projectile Speed (wiki); it is applied at every range here, so further out the number reads high by one forced proc."
  - "The projectiles are 1 m thick (wiki); the sim fires a ray with no width."
  - reason: silent_weapon

source:
  url: https://wiki.warframe.com/w/Fulmin
