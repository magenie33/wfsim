id: tenet_arca_plasmor
name: Tenet Arca Plasmor
slot: primary
# THE FIRST WEAPON IN THE ROSTER WHOSE HEAD IS WORTH NOTHING, and the reason
# `WeaponSpec::headshot_multiplier` exists: "Has a headshot multiplier of 1x" is
# its own line in the disadvantages, about the DIRECT hit rather than about an
# explosion. Without the field this gun would have been shown at three times its
# real headshot damage against anything with a 3x head.
class: shotgun
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, shotgun]
mastery_rank: 16
# RANK 40, NOT 30 — "Polarizing the weapon increases its max rank by 2, capping
# at rank 40 after 5 polarizations, granting the weapon additional mod
# capacity" (docs/INVESTMENT.md).
max_rank: 40

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 9.1
disposition: 0.55            # riven disposition
polarities: [madurai, madurai]
exilus_polarity: madurai
riven_family: Arca Plasmor
traits: [corpus, tenet]
introduced: "30.5"
internal_name: /Lotus/Weapons/Corpus/BoardExec/Primary/CrpBEArcaPlasmor/CrpBEArcaPlasmor
noise: alarming
ammo_type: primary
ammo_max: 40
ammo_pickup: 15
magazine: 10
reload_seconds: 3.0

# A HEAD IS WORTH 1x HERE, whatever the enemy's own body part says. Verbatim,
# and both halves matter:
#
#   "Has a headshot multiplier of 1x." (disadvantages)
#   "It is exceedingly easy to perform headshots with this weapon. Although it
#    has a 1x headshot multiplier (meaning it does no extra damage), this can be
#    increased using Primary Deadhead." (tips)
#
# So the shot still COUNTS as a headshot — Deadhead pays on it — and only the
# enemy's multiplier is overruled. The module encodes this as
# `ExtraHeadshotDmg = -2`, which is the ADDITIVE bracket and would make a
# headshot heal the target; see the field's own comment for why the wiki's word
# is what gets transcribed instead.
headshot_multiplier: 1.0

# Condition Overload: THE CATALOG NAMES THIS ONE and it is MULTIPLYING. Verbatim
# row (docs/CATALOGS.md §1):
#
#   Weapon             | Attack Name   | Projectile Type | Attack Unmodded
#                      Damage | Actual CO Damage Bonus at +100% | CO Damage
#                      Bonus Relative To Base Damage | Math/Behavior Type
#   Tenet Arca Plasmor | Normal Attack | Projectile      | 760 | 760 | 100%
#                      | Multiplying
#
# The Unmodded Damage cell is this attack's own 760, which ties the row to this
# entry. The ORDINARY Arca Plasmor has no row of its own and stays Additive — a
# shared family does not make two weapons one.
co_behavior: independent

# THE PROGENITOR BONUS — verbatim: "Comes with an additional bonus Impact, Heat,
# Cold, Electricity, Toxin, Magnetic, or Radiation damage, based on the Sister's
# progenitor Warframe, which increases the listed base damage of the weapon by
# 25%-60%." On THIS weapon a Radiation progenitor merges into the 760 Radiation
# it already deals; any other element arrives beside it.
valence:
  elements: [impact, heat, cold, electricity, toxin, magnetic, radiation]
  min: 0.25
  max: 0.60

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 6.0
    max_deg: 16.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 1.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.22
  crit_multiplier: 2.0
  status_chance: 0.34
  # INNATE INFINITE BODY PUNCH-THROUGH — the punch-through page's own exception
  # list, "Tenet Arca Plasmor (infinite body punch through)", defined there as
  # "allows these weapons to pierce an unlimited amount of enemies, but not
  # level geometry, objects, or barriers". Written as a number the sim can hold,
  # and it IS the whole mechanic here: the qualifier separates BODIES from
  # geometry and this arena has no geometry, so everything the ray meets is a
  # body.
  punch_through_m: 999.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 44.4 m", Projectile.
  #
  # THE PAGE DISAGREES WITH ITSELF and the ROW is what is transcribed. Its
  # disadvantages say "Limited range of 36 meters", which is where the falloff
  # below bottoms out rather than where the projectile dies; the Range row is
  # 44.4 and the module states the same. The difference costs nothing that
  # matters — past 36 m the shot is already at its floor either way.
  range_m: 44.4
  # "Has linear damage falloff from 100% to 50% from 18m to 36m target
  # distance."
  falloff:
    start_m: 18.0
    end_m: 36.0
    reduction: 0.5
  # "Shots have a guaranteed Impact proc to enemies up to 29 meters" — the range
  # limit on the proc is the part this cannot hold; see the unmodelled list.
  forced_procs: [impact]
  damage: { radiation: 760 }   # total 760

unmodeled:
  - "the projectile is a WALL 4.4 metres thick, which with the infinite body punch through above is most of what this weapon is in a room: one shot sweeps everything in a 4.4 m band. This arena fires a RAY, so only the bodies on the line are struck and the width buys nothing"
  - "shots BOUNCE off surfaces up to 4 times, which the page's own tips call worth doubling a shot's hit count when aimed off a wall behind the target — there are no surfaces here"
  - "the guaranteed Impact proc is capped at 29 metres (\"Shots have a guaranteed Impact proc to enemies up to 29 meters\") and is applied at every distance here, since a forced proc carries no range of its own. It overstates the shot only past 29 m, where the damage is already at its falloff floor"
  - "the innate punch through does not apply to SURFACES when the central portion of the projectile hits one — a geometry rule in an arena with no geometry"

source:
  url: https://wiki.warframe.com/w/Tenet_Arca_Plasmor
