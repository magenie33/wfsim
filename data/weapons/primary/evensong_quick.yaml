id: evensong_quick
name: Evensong
# THE QUICK SHOT: fired without drawing, and with no explosion at all.
inherits: evensong
form: base
transform_group: evensong

introduced: "36"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of this
# weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 85
  fire_rate: 1
  charge_seconds: 0.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2.2
  status_chance: 0.38
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { puncture: 97.5, slash: 227.5 }   # total 325

source:
  url: https://wiki.warframe.com/w/Evensong
