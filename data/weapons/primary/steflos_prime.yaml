id: steflos_prime
name: Steflos Prime
slot: primary
weapon_type: primary
class: shotgun
form_name: Normal Attack
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, shotgun]   # CompatibilityTags PROJECTILE, ASSAULT_AMMO
mastery_rank: 15
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 100.0
disposition: 1.2
polarities: [madurai, madurai]
exilus_polarity: naramon
riven_family: Steflos
traits: [tenno, prime]
introduced: "44.0"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeSteflos/PrimeSteflosShotgun
noise: alarming
ammo_type: primary
ammo_max: 36
ammo_pickup: 15
magazine: 12
reload_seconds: 2.4

# see notes: condition_overload_catalog_names
#
#   Steflos | Normal Attack | Projectile | 320 | 320 | 100% | Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

# THE HEAD IS WORTH 1x: "Steflos" is in wiki `Enemy_Body_Parts`'s
# list of weapons "always defaulting to the 1x multiplier". The weapon's own
# page does not say it.
headshot_multiplier: 1.0

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). Perfect, which is
  # what an accuracy of 100 reads as.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 20
  projectile_width_m: 2.0
  fire_rate: 3.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.18
  crit_multiplier: 2.2
  status_chance: 0.28
  # "Innate Infinite Body Punch Through" (wiki Steflos). see notes: infinite_body_punch_through
  punch_through_m: 0.0
  infinite_body_punch_through: true
  # NO RANGE ROW on this attack — Projectile at 20 m/s, which is slow enough
  # that the flight is visible. See data/surveys/weapon_range.yaml.
  falloff:
    start_m: 8.0
    end_m: 24.0
    reduction: 0.625
  damage: { heat: 285, impact: 195 }   # total 480

unmodeled:
  - reason: steflos_projectile_lifetime
  - reason: steflos_signature_speed

source:
  url: https://wiki.warframe.com/w/Steflos_Prime
