id: scourge_prime_thrown
name: Scourge Prime
# A FORM OF ITS WEAPON: everything below that describes the WEAPON
# rather than this shot is inherited from `scourge_prime`, and only what
# DIFFERS is written here. See `weapons_data::INHERITED`.
inherits: scourge_prime
# THE ALT-FIRE — the weapon itself, thrown. "Alternate Fire throws the Scourge,
# dealing damage and causing a 2 meter Bullet Attractor field on the heads of
# enemies within 14 meters of the impact point." Its own entry because its
# damage, its element split, its crit and its explosion are all its own, and
# `alt_fire` because it is reached with a button and costs no gauge — the kind
# was added the day this weapon needed it (weapons_data::FormKind).
form: alt_fire
transform_group: scourge_prime

introduced: "Update 31.0"
noise: silent               # the throw is SILENT where the primary fire is ALARMING
# ONE THROW IS ONE MAGAZINE. The throw's cycle is WIND-UP → release → RELOAD,
# every time — "Throwing the spear consumes 1 ammo, then reloads the weapon" is
# unconditional, not a magazine running dry. So this entry's
# magazine is 1 and the 0.6 s lands after every throw, which is the same shape a
# bow's nock has here (`cernos_prime.yaml`; dummy.rs: "the cycle is charge +
# reload however the two are ordered"). The 40 rounds belong to the PRIMARY FIRE
# entry, which is the attack that spends them.
#
# The wind-up is `1 / fire_rate` = 1.0 s at base and shortens with fire-rate
# bonuses, so the cycle is 1.0 + 0.6 = 1.6 s and a fire-rate mod buys only the
# wind-up's share of it. Magazine mods are inert by construction: a reload draws
# `floor(capacity − current)` whole rounds, so a 1.66-round capacity still loads
# one.
magazine: 1
reload_seconds: 0.6

# CONDITION OVERLOAD — MULTIPLYING, and this entry is the one the catalog
# names. Verbatim, both rows of the pair:
#
#   Weapon        | Attack Name | Projectile Type | Attack Unmodded Damage
#                 | Actual CO Damage Bonus at +100% | CO Damage Bonus Relative
#                 To Base Damage | Math/Behavior Type
#   Scourge       | Throw       | Projectile      | 150 | 150 | 100% | Multiplying
#   Scourge Prime | Throw       | Projectile      | 200 | 200 | 100% | Multiplying
#
# `Multiplying` is the free-standing bracket — × (1 + co × types) — rather than
# a term in the base-damage bucket, so Serration does not dilute it. The
# Unmodded Damage cell is this entry's own 150 (105 + 22.5 + 22.5), which is
# what makes it the throw's row and not the explosion's — this entry's cell is
# the 200 beside it (140 + 30 + 30).
co_behavior: independent

# WHAT THIS ENTRY DOES NOT MODEL. The Bullet Attractor itself is now applied
# (`attractor_seconds` above) and counts its line in the Condition Overload
# counter; what is still missing is what the field is FOR — "bullets are drawn
# to the head" only pays where the player's aim decides the body part, and here
# the headshot rate is a number the scenario sets.
unmodeled:
  - "what the Bullet Attractor field is WORTH as an aiming aid — the throw plants it and the 4.7 s it puts on the target IS counted (one Condition Overload status), but the easier headshots are not: the wiki says the field does not guarantee a headshot, so the rate has to be MEASURED before this arena's headshot % can be moved by it. docs/UNMODELLED.md §Open decisions"
  - "the innate reload while holstered or deployed (33% of the magazine per second) — this arena never holsters the weapon"

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 12
  trigger: semi
  shot_type: projectile
  projectile_speed_mps: 150
  fire_rate: 1.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.10
  crit_multiplier: 2.0
  status_chance: 0.30
  punch_through_m: 0.0
  damage: { impact: 140, puncture: 30, slash: 30 }   # total 200

  # THE BULLET ATTRACTOR THE THROW PLANTS — "The Bullet Attractor stays on
  # enemies for 4.7 seconds." It IS the Void effect, which
  # is the debuff the engine already has, so it counts one line in the
  # Condition Overload counter and nothing else.
  #
  # The field's OTHER clocks cannot reach this arena and are not an
  # approximation: it pulses on impact and then every 5 s for 20 s, but a new
  # throw destroys it at the moment the throw STARTS and the cycle is at most
  # 1.6 s — so no field here ever lives to pulse twice. What a field already
  # applied is NOT taken back with it, which is why the debuff outlives the
  # field that planted it.
  attractor_seconds: 4.7

  # PRIMARY COMPRESSION's row, by column (docs/CATALOGS.md §2):
  #   Attack Name   Throw + AoE            Base Radius   7.0 m
  #   Effectiveness 100%                   Max @ base    +560%
  #   Stacking      Multiplies             w/ Primed Firestorm  +806.4%
  #   Radius calc   Snapshot               Class         Speargun
  #
  # Ordinary in every column, on the biggest radius this pair has — which is
  # why the arcane is worth four times as much here as on the primary fire.
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot

  # THE SPEAR'S EXPLOSION, with a GUARANTEED IMPACT PROC — "Guaranteed Impact
  # proc" is the Characteristics' own sentence and it is said of the EXPLOSION,
  # not of the throw.
  #
  # It is the first radial in the roster to carry one, and it is why
  # `forced_procs` became the radial's own rather than the attack's alone: the
  # Astilla forces Impact on its DIRECT hit and not on its radial, this weapon
  # is the other way round, and one shared list can only be wrong for one of
  # them.
  #
  # FIRESTORM DOES NOT REACH THE FIELD, only this blast: "Firestorm does not
  # affect the size of the Bullet Attractor field, nor does it increase the
  # range a thrown Scourge will apply its effect to enemies." The two radii are
  # different things — 7 m of damage, 14 m of attractor — and only the first is
  # here.
  radial:
    damage: { corrosive: 55 }
    radius_m: 7.0
    falloff_start_m: 0.0
    falloff_reduction: 0.6    # WFCD `{start 0, end 7, reduction 0.6}`: 100% -> 40%
    forced_procs: [impact]
    crit_chance: 0.10
    crit_multiplier: 2.0
    status_chance: 0.30

source:
  url: https://wiki.warframe.com/w/Scourge_Prime
  # Infobox and Characteristics read 2026-08-14; WFCD names these two attacks
  # "Spear Throw" and "Spear Explosion" and agrees field for field.
