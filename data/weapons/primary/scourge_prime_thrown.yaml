id: scourge_prime_thrown
name: Scourge Prime
# see notes: form_of_its_weapon_inherits
inherits: scourge_prime
# THE ALT-FIRE — the weapon itself, thrown. "Alternate Fire throws the Scourge,
# dealing damage and causing a 2 meter Bullet Attractor field on the heads of
# enemies within 14 meters of the impact point." Its own entry because its
# damage, its element split, its crit and its explosion are all its own, and
# `alt_fire` because it is reached with a button and costs no gauge — the kind
# was added the day this weapon needed it (data::weapons::FormKind).
form: alt_fire
transform_group: scourge_prime

introduced: "Update 31.0"
noise: silent               # the throw is SILENT where the primary fire is ALARMING
# One throw is one magazine. The reported sequence is wind-up, release, reload;
# each bound state supplies its own parsed reload time (M43 provenance).
magazine: 1

# CONDITION OVERLOAD — MULTIPLYING, and this entry is the one the catalog
# names. Verbatim, both rows of the pair:
#
#   Weapon        | Attack Name | Projectile Type | Attack Unmodded Damage
#                 | Actual CO Damage Bonus at +100% | CO Damage Bonus Relative
#                 To Base Damage | Math/Behavior Type
#   Scourge       | Throw       | Projectile      | 150 | 150 | 100% | Multiplying
#   Scourge Prime | Throw       | Projectile      | 200 | 200 | 100% | Multiplying
#
# `Multiplying` is the free-standing bracket — × (1 + co × types) — rather than
# a term in the base-damage bucket, so Serration does not dilute it. The
# Unmodded Damage cell is this entry's own 150 (105 + 22.5 + 22.5), which is
# what makes it the throw's row and not the explosion's — this entry's cell is
# the 200 beside it (140 + 30 + 30).
co_behavior: independent

# Source/runtime limits are shared in client_scourge_inputs.
unmodeled:
  - reason: client_projectile_acceleration
  - reason: client_projectile_callbacks
  - reason: client_scourge_throw
  - reason: client_scourge_field
  - reason: client_accuracy_runtime
  - "It reloads 33% of its magazine a second while holstered or deployed; it is never holstered here."

attack:
  extra_hit_reads: even   # see notes: extra_hit_reads
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0
    max_deg: 12
    sampling:
      horizontal_ratio: 0.5
      uniform: false
      hip_min_deg: 6
      hip_max_deg: 18
  trigger: semi
  shot_type: projectile
  projectile_speed_mps: 90
  fire_rate: 1.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.10
  crit_multiplier: 2.0
  status_chance: 0.30
  punch_through_m: 0.0
  damage: { impact: 140, puncture: 30, slash: 30 }   # total 200

  # Parsed attractor lifetime; spatial field/steering consumers are unmodelled.
  attractor_seconds: 5

  # PRIMARY COMPRESSION's row, by column (docs/CATALOGS.md §2):
  #   Attack Name   Throw + AoE            Base Radius   7.0 m
  #   Effectiveness 100%                   Max @ base    +560%
  #   Stacking      Multiplies             w/ Primed Firestorm  +806.4%
  #   Radius calc   Snapshot               Class         Speargun
  #
  # Ordinary in every column, on the biggest radius this pair has — which is
  # why the arcane is worth four times as much here as on the primary fire.
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot

  # THE SPEAR'S EXPLOSION, with a GUARANTEED IMPACT PROC — "Guaranteed Impact
  # proc" is the Characteristics' own sentence and it is said of the EXPLOSION,
  # not of the throw.
  #
  # It is the first radial in the roster to carry one, and it is why
  # `forced_procs` became the radial's own rather than the attack's alone: the
  # Astilla forces Impact on its DIRECT hit and not on its radial, this weapon
  # is the other way round, and one shared list can only be wrong for one of
  # them.
  #
  # FIRESTORM DOES NOT REACH THE FIELD, only this blast: "Firestorm does not
  # affect the size of the Bullet Attractor field, nor does it increase the
  # range a thrown Scourge will apply its effect to enemies." The two radii are
  # different things — 7 m of damage, 14 m of attractor — and only the first is
  # here.
  radial:
    extra_hit_reads: even   # see notes: extra_hit_reads
    damage: { corrosive: 55 }
    radius_m: 7.0
    falloff_start_m: 0.0
    falloff_reduction: 0.6    # wiki module `Attacks[3].Falloff`: 100% -> 40%
    forced_procs: [impact]
    crit_chance: 0.10
    crit_multiplier: 2.0
    status_chance: 0.30

source:
  url: https://wiki.warframe.com/w/Scourge_Prime
  # wiki module `Attacks[].AttackName`: "Spear Throw" and "Spear Explosion".

# see notes: client_scourge_inputs

# see notes: client_primary_calibration
