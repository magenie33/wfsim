id: dread
name: Dread
slot: primary
class: bow
form: charged
default_form: true
mod_pools: [primary, rifle, bow]
mastery_rank: 5
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: dread
transforms_to: dread_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner: "灵化部分可以粗略"): transcribed from the
# wiki's table, with every clause the intake's rule engine did not recognise
# loaded as a NAMED INERT effect that the builder and the optimizer both print
# as "not modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
accuracy: 16.67
disposition: 1.3
polarities: [madurai, madurai]
exilus_polarity: naramon
riven_family: Dread
traits: [incarnon]
introduced: "Update 8.0"
internal_name: /Lotus/Weapons/Tenno/Bows/StalkerBow
noise: silent
ammo_type: primary
ammo_max: 72
ammo_pickup: 15
magazine: 1
reload_seconds: 0.7

# CO ON HALF THE BASE. The catalog lists this family's Charged Attack as
# "Adding, 25-50%", and for a bow the number is derivable: the drawn shot
# deals exactly TWICE the tapped one in DE's export, so the 2x is a charge
# multiplier outside the additive bracket and CO computes on half. The
# Cernos Prime carries 0.5 for the same reason.
co_behavior: additive_with_base_damage
co_base_fraction: 0.5

attack:
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 1
  charge_seconds: 0.5
  charge_cadence: draw_only
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.5
  crit_multiplier: 2
  status_chance: 0.2
  punch_through_m: 0.0
  damage: { impact: 16.8, slash: 302.4, puncture: 16.8 }   # total 336.0

# incarnon_evolutions: definitions live in data/evolutions/dread_*.yaml.

source:
  url: https://wiki.warframe.com/w/Dread
