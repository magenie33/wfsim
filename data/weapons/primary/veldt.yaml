id: veldt
name: Veldt
slot: primary
# A TENNO REVOLVER RIFLE AT 90 A SHOT, mostly Slash, on a projectile rather than
# hit-scan. Its alternate fire only adjusts the zoom, which is why the module
# gives it one attack.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags PROJECTILE, ASSAULT_AMMO
mastery_rank: 8
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 32.0
disposition: 1.3            # riven disposition
polarities: [naramon]
exilus_polarity: madurai
riven_family: Veldt
traits: []
introduced: "22.18"
internal_name: /Lotus/Weapons/Tenno/LongGuns/TnRevolverRifle/TnRevolverRifleGun
noise: alarming
ammo_type: primary
ammo_max: 546
ammo_pickup: 80
magazine: 26
reload_seconds: 1.8

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.25
    max_deg: 6.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 3.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.22
  crit_multiplier: 2.2
  status_chance: 0.22
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m", Hit-Scan.
  range_m: 300.0
  damage: { impact: 23.4, puncture: 23.4, slash: 43.2 }   # total 90

unmodeled:
  - "the ALTERNATE FIRE adjusts the ZOOM and nothing else (wiki), so this weapon has one attack and no mode — there is nothing for the builder's Mode control to offer, and this arena has no field of view to trade anyway"

source:
  url: https://wiki.warframe.com/w/Veldt
