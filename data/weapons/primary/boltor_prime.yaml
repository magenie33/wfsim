id: boltor_prime
name: Boltor Prime
slot: primary
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, assault_rifle]
grip_type: RIFLE
mastery_rank: 13
max_rank: 30

# see notes: two_weapons_model_base_2
transform_group: boltor_prime
transforms_to: boltor_prime_incarnon

# see notes: weapon_level_metadata_wiki_3
accuracy: 50.0
disposition: 1.2
polarities: [vazarin, madurai]
exilus_polarity: naramon
riven_family: Boltor
traits: [incarnon, prime]
introduced: "12.4"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeBoltor/PrimeBoltor
noise: alarming
ammo_type: primary
ammo_max: 540
ammo_pickup: 80              # rifle pickup, as every other rifle here
magazine: 60
reload_seconds: 2.4

# Condition Overload behavior class. No Boltor row exists in the wiki's CO
# catalog, and absence there means ORDINARY rather than unknown.
co_behavior: additive_with_base_damage

# A NAIL GUN: a full-auto PROJECTILE rifle, overwhelmingly Puncture. Bolts
# travel, which is why `projectile_speed_mps` is set and matters to a perk in
# tier 3 (Swift Deliverance) that has nothing to do on a hit-scan weapon.
attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 1
    max_deg: 3
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 10.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.12
  crit_multiplier: 2.0
  status_chance: 0.34
  punch_through_m: 0.0
  damage: { impact: 4.6, puncture: 41.4 }   # total 46

