id: felarx
name: Felarx
slot: primary
class: shotgun
form: base
default_form: true
mod_pools: [primary, shotgun]
mastery_rank: 14
max_rank: 30

# see notes: two_weapons_model_base
transform_group: felarx
transforms_to: felarx_incarnon

# see notes: bulk_intake_stats_are
unmodeled:
  - reason: reload_never_interrupted
accuracy: 7.69
disposition: 0.6
polarities: [madurai]
exilus_polarity: madurai
riven_family: Felarx
traits: [incarnon, zariman]
introduced: "Update 31.6"
internal_name: /Lotus/Weapons/Tenno/Zariman/LongGuns/PumpShotgun/ZarimanPumpShotgun
noise: alarming
ammo_type: primary
ammo_max: 60
ammo_pickup: 15
magazine: 6
reload_seconds: 3.7

# see notes: round_reload_shell_at
#
# the weapon's own page: 0.8 s to start, 0.4 s a shell, 0.5 s to end.
# They add up to the published total at a full magazine, which is the
# cross-check: 0.8 + 0.4 x 6 + 0.5 = 3.7.
reload_style: by_round
reload_start_seconds: 0.8
reload_per_shell_seconds: 0.4
reload_end_seconds: 0.5

# CONDITION OVERLOAD IS MULTIPLYING ON BOTH OF THIS WEAPON'S MODES. The wiki's CO catalog lists the Felarx among the Multiplying
# entries and names one attack; the answer is the same for the other, so this
# is not read off a form — it is the weapon's.
#
# It is not a rounding difference: a free-standing final multiplier against a
# member of the base-damage bucket is a different number on any build carrying
# Serration, and this weapon's whole shape is high base damage.
co_behavior: independent

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 12
    max_deg: 14
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 3
  # see notes: modelled_arena_has_no
  falloff:
    start_m: 14
    end_m: 28
    reduction: 0.9947   # fraction KEPT past end_m
  multishot: 4.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2
  status_chance: 0.055
  # INNATE INFINITE BODY PUNCH-THROUGH — the punch-through page's own exception
  # list, "Felarx", UNQUALIFIED, so both forms carry it (the page writes the
  # restriction where it wants one: "Cortege (Primary Fire)", "Quellor
  # (Alt-Fire)"). Written as a number the sim can hold, and it is the WHOLE
  # mechanic here: the qualifier that goes with it separates BODIES from
  # geometry ("innate punch through does not apply to surfaces") and this arena
  # has no geometry, so everything the ray meets is a body.
  #
  # It is also why Dual-Mode Chamber's +4 m adds nothing — not a gap, a
  # CEILING already reached — an unmodelled admission only while the arena has
  # one body.
  punch_through_m: 999.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" — a PROJECTILE with a range row, like the Grattler
  range_m: 300.0
  damage: { impact: 38, slash: 83.6, puncture: 68.4 }   # total 190.0

# incarnon_evolutions: definitions live in data/evolutions/felarx_*.yaml.

source:
  url: https://wiki.warframe.com/w/Felarx
