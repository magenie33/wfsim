id: felarx
name: Felarx
slot: primary
class: shotgun
form: base
default_form: true
mod_pools: [primary, shotgun]
mastery_rank: 14
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: felarx
transforms_to: felarx_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner: "灵化部分可以粗略"): transcribed from the
# wiki's table, with every clause the intake's rule engine did not recognise
# loaded as a NAMED INERT effect that the builder and the optimizer both print
# as "not modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
unmodeled:
  - "the by-round reload is now modelled — what is NOT is the INTERRUPTION: in game you can fire mid-reload and keep the shells you have loaded, and here a reload runs to the end"
  - "the innate infinite body punch-through is not modelled — this arena has one target, so it changes no number, and it is why Dual-Mode Chamber's +4 m adds nothing either"
  - "the Incarnon form's route to stacks is not modelled — entering grants 1 and leaving grants one per shell that was missing, on top of a free magazine refill, and played to the edge that is 2 x magazine - 1 stacks in one cycle"
  - "damage falloff from 14 m to 28 m (down to 99% of full damage) is not modelled — this arena has no distance, so every shot lands at point blank"
accuracy: 7.69
disposition: 0.6
polarities: [madurai]
exilus_polarity: madurai
riven_family: Felarx
traits: [incarnon, zariman]
introduced: "Update 31.6"
internal_name: /Lotus/Weapons/Tenno/Zariman/LongGuns/PumpShotgun/ZarimanPumpShotgun
noise: alarming
ammo_type: primary
ammo_max: 60
ammo_pickup: 15
magazine: 6
reload_seconds: 3.7

# BY-ROUND RELOAD — a shell at a time, interruptible, and the magazine size
# is IN the reload time. That is the part that was missing: a magazine mod
# on this weapon buys capacity and PAYS for it in downtime, and modelling
# the reload as one flat block made Ammo Stock read as free (owner,
# 2026-08-08, calibrating the Felarx).
#
# the weapon's own page: 0.8 s to start, 0.4 s a shell, 0.5 s to end.
# They add up to the published total at a full magazine, which is the
# cross-check: 0.8 + 0.4 x 6 + 0.5 = 3.7.
reload_style: by_round
reload_start_s: 0.8
reload_per_shell_s: 0.4
reload_end_s: 0.5

# CONDITION OVERLOAD IS MULTIPLYING ON BOTH OF THIS WEAPON'S MODES (owner,
# 2026-08-08: "felarx 两个模式都是 multi 计算的"). The wiki's CO catalog lists
# the Felarx among the Multiplying entries and names one attack; the answer is
# the same for the other, so this is not read off a form — it is the weapon's.
#
# It is not a rounding difference: a free-standing final multiplier against a
# member of the base-damage bucket is a different number on any build carrying
# Serration, and this weapon's whole shape is high base damage.
co_behavior: independent

attack:
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 3
  # NOT MODELLED — the arena has no distance, so this weapon is
  # simulated at point blank. Recorded because the RIVEN pool reads
  # it: a hitscan weapon that lists a falloff still rolls Projectile
  # Speed, which scales the whole range (wiki `Projectile Speed`).
  falloff:
    start_m: 14
    end_m: 28
    reduction: 0.9947   # fraction KEPT past end_m
  multishot: 4.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2
  status_chance: 0.055
  punch_through_m: 0.0
  damage: { impact: 38, slash: 83.6, puncture: 68.4 }   # total 190.0

# incarnon_evolutions: definitions live in data/evolutions/felarx_*.yaml.

source:
  url: https://wiki.warframe.com/w/Felarx
