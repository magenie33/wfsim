id: felarx
name: Felarx
slot: primary
class: shotgun
form: base
default_form: true
mod_pools: [primary, shotgun]
mastery_rank: 14
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: felarx
transforms_to: felarx_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner: "灵化部分可以粗略"): transcribed from the
# wiki's table, with every clause the intake's rule engine did not recognise
# loaded as a NAMED INERT effect that the builder and the optimizer both print
# as "not modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
unmodeled:
  - "the by-round reload is not modelled — 0.8 s to start, 0.4 s a shell, 0.5 s to finish, interruptible at any point, and the sim reloads the whole magazine in one 3.7 s block"
  - "a bigger magazine makes the reload LONGER here and the sim does not know it — shells are loaded one at a time, so Ammo Stock buys capacity and pays for it in reload"
  - "the innate infinite body punch-through is not modelled — this arena has one target, so it changes no number, and it is why Dual-Mode Chamber's +4 m adds nothing either"
  - "switching into or out of the Incarnon form fully reloads the normal magazine, which is a free reload the sim does not give you"
  - "damage falloff from 14 m to 28 m (down to 99% of full damage) is not modelled — this arena has no distance, so every shot lands at point blank"
accuracy: 7.69
disposition: 0.6
polarities: [madurai]
exilus_polarity: madurai
riven_family: Felarx
traits: [incarnon, zariman]
introduced: "Update 31.6"
internal_name: /Lotus/Weapons/Tenno/Zariman/LongGuns/PumpShotgun/ZarimanPumpShotgun
noise: alarming
ammo_type: primary
ammo_max: 60
ammo_pickup: 15
magazine: 6
reload_seconds: 3.7

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 3
  # NOT MODELLED — the arena has no distance, so this weapon is
  # simulated at point blank. Recorded because the RIVEN pool reads
  # it: a hitscan weapon that lists a falloff still rolls Projectile
  # Speed, which scales the whole range (wiki `Projectile Speed`).
  falloff:
    start_m: 14
    end_m: 28
    reduction: 0.9947   # fraction KEPT past end_m
  multishot: 4.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2
  status_chance: 0.055
  punch_through_m: 0.0
  damage: { impact: 38, slash: 83.6, puncture: 68.4 }   # total 190.0

# incarnon_evolutions: definitions live in data/evolutions/felarx_*.yaml.

source:
  url: https://wiki.warframe.com/w/Felarx
