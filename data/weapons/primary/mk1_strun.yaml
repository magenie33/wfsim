id: mk1_strun
name: MK1-Strun
slot: primary
class: shotgun
form: base
default_form: true
mod_pools: [primary, shotgun]
mastery_rank: 0
max_rank: 30

# see notes: two_weapons_model_base
transform_group: mk1_strun
transforms_to: mk1_strun_incarnon

# see notes: bulk_intake_stats_are
unmodeled:
  - reason: reload_never_interrupted
accuracy: 4
disposition: 1.45
polarities: [naramon]
exilus_polarity: naramon
riven_family: Strun
traits: [incarnon]
introduced: "Update 14.0"
internal_name: /Lotus/Weapons/MK1Series/MK1Strun
noise: alarming
ammo_type: primary
ammo_max: 120
ammo_pickup: 15
magazine: 6
reload_seconds: 3.75

# see notes: round_reload_shell_at
#
# INFERRED, and checkable: this page does not publish the split, and its total
# (3.75 s) and magazine (6) are identical to the Strun's, whose page does.
# Deriving a flat per-shell instead would make the two behave differently
# under a magazine mod, which no source suggests.
# They add up to the published total at a full magazine, which is the
# cross-check: 0.5 + 0.5 x 6 + 0.25 = 3.75.
reload_style: by_round
reload_start_seconds: 0.5
reload_per_shell_seconds: 0.5
reload_end_seconds: 0.25

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 15
    max_deg: 35
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 2.08
  # see notes: modelled_arena_has_no
  falloff:
    start_m: 15
    end_m: 25
    reduction: 0.5   # fraction KEPT past end_m
  multishot: 10.0
  ammo_cost: 1
  crit_chance: 0.075
  crit_multiplier: 2
  status_chance: 0.06
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_2
  range_m: 300.0
  damage: { impact: 9.9, slash: 5.4, puncture: 2.7 }   # total 18.0

# incarnon_evolutions: definitions live in data/evolutions/mk1_strun_*.yaml.

source:
  url: https://wiki.warframe.com/w/MK1-Strun
