id: soma_incarnon
name: Soma (Incarnon Form)
slot: primary
class: rifle
form: incarnon

transform_group: soma
transforms_from: soma

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 20
    rounds_per_charge: 10
    max_rounds: 200
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 3      # = base reload time, unmodded

pseudo_reload:
  magazine: 200
  reload_seconds: 4.0

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 5
    max_deg: 20
  trigger: auto
  shot_type: hit_scan
  fire_rate: 7
  multishot: 8.0
  ammo_cost: 1                  # of the 200-round charge pool
  crit_chance: 0.1
  crit_multiplier: 3
  status_chance: 0.025
  # Module:Weapons/data, this form's own attack row (Incarnon Form). It read 0.0
  # until 2026-08-21 — not a measurement, an unfilled field, and one that
  # was harmless while the arena had a single body and stopped being so
  # when `space::traverse` started spending it (AGENTS.md, punch through).
  punch_through_m: 0.8
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, Incarnon Form: "Range: 300.0 m", Hit-Scan
  range_m: 300.0
  damage: { impact: 0.48, slash: 5.28, puncture: 2.24 }   # total 8.0

# incarnon_evolutions: see data/weapons/primary/soma.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Soma_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"

