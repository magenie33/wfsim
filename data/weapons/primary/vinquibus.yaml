id: vinquibus
name: Vinquibus
slot: primary
weapon_type: primary
# A BAYONET RIFLE THAT TAKES THE MELEE SLOT WITH IT, and the only entry in the
# roster whose published polarities include one this engine's polarity set does
# not have. Both are admitted below; what is here is the rifle half, which is a
# 400-damage semi-auto with the highest crit multiplier of any assault rifle in
# the roster.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO
mastery_rank: 14
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary).
accuracy: 33.6
disposition: 0.7             # riven disposition
# "Innate one Madurai and one Aura polarities" (the page), and W`Polarity`
# lists the Aura polarity as "Any - O (Any polarity except Umbra)": Omni's.
polarities: [madurai, omni]
# NO EXILUS POLARITY — the module states none.
riven_family: Vinquibus
traits: []
introduced: "41"
internal_name: /Lotus/Weapons/Tenno/Bayonet/TnBayonetRifleWeapon
noise: alarming
ammo_type: primary
ammo_max: 80
ammo_pickup: 8
magazine: 8
reload_seconds: 3.0

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 2.0
    max_deg: 5.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.40
  crit_multiplier: 3.2
  status_chance: 0.20
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage
  range_m: 300.0
  damage: { puncture: 280, slash: 120 }   # total 400

unmodeled:
  - "Equipping it also takes the melee slot, so a Vinquibus loadout has no melee weapon; this fight has no melee to give up."
  - "Headshots grant 2 stacks (max 16) of Vinquibus Precision, +250% melee damage; it lands on a weapon the sim does not fire, so it adds nothing here."

source:
