id: corinth_airburst
name: Corinth
# THE AIR BURST: a lobbed round with the widest explosion in the shotgun roster
# — 9.4 metres.
inherits: corinth
form: alt_fire
transform_group: corinth

introduced: "22.8"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of this
# weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 6.0
    max_deg: 16.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 1.17
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.04
  crit_multiplier: 1.6
  status_chance: 0.28
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Corinth (Corinth Prime) | Alt-Fire + AoE | 100% | Multiplies |
  #   Snapshot
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 100 }   # total 100
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 9.4
    falloff_start_m: 0.0
    falloff_reduction: 0.9
    crit_chance: 0.04
    crit_multiplier: 1.6
    status_chance: 0.28
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 404 }   # total 404

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Corinth
