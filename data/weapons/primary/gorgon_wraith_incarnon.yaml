id: gorgon_wraith_incarnon
name: Gorgon Wraith (Incarnon Form)
slot: primary
weapon_type: primary
class: rifle
form: incarnon

transform_group: gorgon_wraith
transforms_from: gorgon_wraith

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 30
    rounds_per_charge: 0.66
    max_rounds: 20
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  # see notes: incarnon_package_transition_time
  transmute_in_seconds: 1.4
  transmute_out_seconds: 0.6

pseudo_reload:
  magazine: 20

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 2.0
    max_deg: 6.0
    sampling:
      horizontal_ratio: 0.5
      uniform: false
      hip_min_deg: 2.0
      hip_max_deg: 6.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 1
  multishot: 1.0
  ammo_cost: 1                  # of the 20-round charge pool
  crit_chance: 0.19
  crit_multiplier: 2.1
  status_chance: 0.27
  punch_through_m: 0.0
  damage: { impact: 25, slash: 25, puncture: 75 }   # total 125
  # The radial part — rules in MECHANICS §7.
  # PRIMARY COMPRESSION's row (docs/CATALOGS.md §2): 5.0 m -> +400%.
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot

  radial:
    damage: { heat: 750 }   # total 750
    radius_m: 5
    falloff_start_m: 0
    falloff_reduction: 0.1
    # Guaranteed HEAT on the explosion (wiki module).
    forced_procs: [heat]
    crit_chance: 0.19
    crit_multiplier: 2.1
    status_chance: 0.27
    # see notes: declared_no_co_catalog

# incarnon_evolutions: see data/weapons/primary/gorgon_wraith.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Gorgon_Incarnon_Genesis
  # wiki module (private/scripts/wiki_weapons.py) `Attacks[].AttackName`: "Incarnon Form" and "Incarnon Form AoE"

unmodeled:
  - reason: client_accuracy_runtime

# see notes: client_primary_calibration
