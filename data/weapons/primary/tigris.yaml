id: tigris
name: Tigris
slot: primary
# TWO BARRELS AND A DUPLEX TRIGGER: the first shell on the button press, the
# second on its release. Five pellets of 210 apiece, 84% of it Slash, and then a
# reload — 2100 damage a shot is the highest per-pull figure in the roster's
# ordinary shotguns.
class: shotgun
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, shotgun]   # CompatibilityTags SINGLESHOT
mastery_rank: 7
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 9.1
disposition: 1.1            # riven disposition
polarities: []               # the infobox states none
exilus_polarity: naramon
riven_family: Tigris
traits: [tenno]
introduced: "11.0"
internal_name: /Lotus/Weapons/Tenno/LongGuns/DoubleBarrelShotgun/TennoDoubleBarrelShotgun
noise: alarming
ammo_type: primary
ammo_max: 120
ammo_pickup: 15
magazine: 2
reload_seconds: 1.8

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 6.0
    max_deg: 16.0
  trigger: duplex
  shot_type: hit_scan
  fire_rate: 2
  multishot: 5.0
  ammo_cost: 1
  crit_chance: 0.1
  crit_multiplier: 2.0
  status_chance: 0.168
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m", Hit-Scan.
  range_m: 300.0
  falloff:
    start_m: 10.0
    end_m: 20.0
    reduction: 0.5238
  damage: { impact: 21, puncture: 21, slash: 168 }   # 210 a pellet, 1050 a shot

unmodeled:
  - "Combat Reload, the Tigris-exclusive mod — a weapon-exclusive card outside the pools this roster loads"

