id: tetra
name: Tetra
slot: primary
# ONE ATTACK, AND THAT IS THE FINDING. The Tenet Tetra's magazine-eating grenade
# is a TENET addition, not a Tetra mechanic — this page has no alternate fire at
# all, and neither does the Prisma. Three weapons in one family and only the
# adversary one has a second trigger.
#
# It is also the plainest Corpus rifle in the roster: no gauge, no explosion, no
# battery, MR3. Worth having for the same reason the Karak Wraith is.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags PROJECTILE, ASSAULT_AMMO
mastery_rank: 3
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 18.2
disposition: 1.5             # riven disposition
polarities: []               # the infobox states none
exilus_polarity: madurai
riven_family: Tetra
traits: [corpus]
introduced: "11.8"
internal_name: /Lotus/Weapons/Corpus/LongGuns/CorpusUMP/CorpusUMP
noise: alarming
ammo_type: primary
ammo_max: 540
ammo_pickup: 80
magazine: 60
reload_seconds: 2.0

# see notes: condition_overload_no_row_6
