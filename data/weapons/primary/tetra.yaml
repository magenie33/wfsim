attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 3.0
    max_deg: 8.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 6.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.04
  crit_multiplier: 1.5
  status_chance: 0.20
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — Projectile at 100 m/s, and the page states no
  # reach. See data/surveys/weapon_range.yaml.
