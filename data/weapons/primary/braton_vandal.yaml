id: braton_vandal
name: Braton Vandal
slot: primary
# WFCD `type: Rifle`, so the same three pools every assault rifle here draws.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, assault_rifle]
grip_type: RIFLE
mastery_rank: 4
max_rank: 30

# see notes: two_weapons_model_base_3
transform_group: braton_vandal
transforms_to: braton_vandal_incarnon

# see notes: weapon_level_metadata_wiki_3
accuracy: 33.33
disposition: 1.3
polarities: [madurai]
exilus_polarity: naramon
riven_family: Braton
traits: [incarnon, vandal]
introduced: "6.3.1"
internal_name: /Lotus/Weapons/Tenno/Rifle/VIPRifle
noise: alarming
ammo_type: primary
ammo_max: 550
ammo_pickup: 80              # rifle pickup, as every other rifle here
magazine: 50
reload_seconds: 1.75

# see notes: condition_overload_behavior_class
co_behavior: additive_with_base_damage

# ONE ATTACK PART. The radial belongs to the Incarnon form (braton_vandal_incarnon).
attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 1.5
    max_deg: 4.5
  trigger: auto
  shot_type: hit_scan
  fire_rate: 7.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.16
  crit_multiplier: 2.0
  status_chance: 0.16
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_2
  range_m: 300.0
  damage: { impact: 12.25, puncture: 1.75, slash: 21.0 }   # total 35

