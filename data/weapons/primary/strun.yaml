id: strun
name: Strun
slot: primary
weapon_type: primary
class: shotgun
form: base
default_form: true
mod_pools: [primary, shotgun]
mastery_rank: 1
max_rank: 30

# see notes: two_weapons_model_base
transform_group: strun
transforms_to: strun_incarnon

# see notes: bulk_intake_stats_are
unmodeled:
  - reason: client_accuracy_runtime
  - reason: reload_never_interrupted
accuracy: 4
disposition: 1.2
polarities: [naramon]
exilus_polarity: madurai
riven_family: Strun
traits: [incarnon, tenno]
introduced: "Vanilla"
internal_name: /Lotus/Weapons/Tenno/Shotgun/Shotgun
noise: alarming
ammo_type: primary
ammo_max: 120
ammo_pickup: 15
magazine: 6
reload_seconds: 3.75

# see notes: round_reload_shell_at
#
# the weapon's own page: 0.5 s to start, 0.5 s a shell, 0.25 s to end.
# They add up to the published total at a full magazine, which is the
# cross-check: 0.5 + 0.5 x 6 + 0.25 = 3.75.
reload_style: by_round
reload_start_seconds: 0.5
reload_per_shell_seconds: 0.5
reload_end_seconds: 0.25

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 15.0
    max_deg: 35.0
    sampling:
      horizontal_ratio: 0.5
      uniform: true
      hip_min_deg: 21.0
      hip_max_deg: 41.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 2.5
  # see notes: falloff_feeds_the_riven_pool
  falloff:
    start_m: 12
    end_m: 25
    reduction: 0.4   # fraction REMOVED past end_m
  multishot: 12.0
  ammo_cost: 1
  crit_chance: 0.075
  crit_multiplier: 1.5
  status_chance: 0.05
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_2
  range_m: 300.0
  damage: { impact: 13.75, slash: 7.5, puncture: 3.75 }   # total 25.0

# incarnon_evolutions: definitions live in data/evolutions/strun_*.yaml.

source:
  url: https://wiki.warframe.com/w/Strun

# see notes: client_primary_calibration
