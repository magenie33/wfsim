# A THREE-ROUND HARPOON BURST, and an alternate fire that throws ONE harpoon with
# a guaranteed Puncture proc and reels the target in. The pull is the weapon's
# reason to exist and it is a crowd-control effect this arena cannot use.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: harpak
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags PROJECTILE, ASSAULT_AMMO
mastery_rank: 7
max_rank: 30

# see notes: weapon_level_metadata_wiki_4
disposition: 1.55           # riven disposition
polarities: [madurai]
exilus_polarity: madurai
riven_family: Harpak
traits: [grineer]
