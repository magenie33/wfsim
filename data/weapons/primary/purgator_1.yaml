id: purgator_1
name: Purgator 1
slot: primary
weapon_type: primary
# A LAUNCHER WITH NO EXPLOSION. The module gives it one attack and no radial at
# all: it is a 781-damage single-target slug with a guaranteed Impact proc, and
# what it leaves behind is a GAS cloud on the bodies it KILLS — a mechanic keyed
# on a death, which this engine has no shape for. See the admission.
class: launcher
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags PROJECTILE, ASSAULT_AMMO
mastery_rank: 14
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 100.0
disposition: 1.15           # riven disposition
polarities: []               # the infobox states none
exilus_polarity: naramon
riven_family: Purgator 1
traits: [scaldra]
introduced: "38.5"
internal_name: /Lotus/Weapons/Lasria/LasGrenadeLauncher/LasrianNoxPlayerWeapon
noise: alarming
ammo_type: primary
ammo_max: 20
ammo_pickup: 2
magazine: 9
reload_seconds: 2.7

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 200
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.31
  crit_multiplier: 2.3
  status_chance: 0.19
  # "Innate 1.1 meter punch through and Infinite Body Punch Through" (wiki
  # Purgator 1); the module's 1.1 is the surface half. see notes: infinite_body_punch_through
  punch_through_m: 1.1
  infinite_body_punch_through: true
  # ONE GUARANTEED IMPACT PROC a slug — the module's ForcedProcs.
  forced_procs: [impact]
  # NO RANGE ROW on this attack — Projectile at 200 m/s. See
  # data/surveys/weapon_range.yaml.
  damage: { impact: 351.45, puncture: 429.55 }   # total 781

unmodeled:
  - "An enemy killed directly by it leaves a Gas cloud whose ticks deal half the killing shot's damage (wiki). The engine has no hit that exists only after a kill, so against anything that dies the number reads low by roughly a third."

source:
  url: https://wiki.warframe.com/w/Purgator_1
