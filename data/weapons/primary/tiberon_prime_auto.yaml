id: tiberon_prime_auto
name: Tiberon Prime
# FULL AUTO: the volume mode, at the lowest crit chance of the three and the
# highest status.
inherits: tiberon_prime
form: auto
transform_group: tiberon_prime

introduced: "22.16.4"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of
# this weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 6.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 8.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.16
  crit_multiplier: 2.8
  status_chance: 0.32
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  damage: { impact: 14.4, puncture: 19.2, slash: 14.4 }   # total 48

source:
  url: https://wiki.warframe.com/w/Tiberon_Prime
