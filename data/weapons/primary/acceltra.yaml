id: acceltra
name: Acceltra
slot: primary
# A ROCKET RIFLE AT TWELVE ROUNDS A SECOND. Every rocket is a guaranteed Impact
# proc and a 4 m explosion, and the whole magazine of 48 goes out in four
# seconds — which is why its reserve is only 96.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags PROJECTILE, AOE, ASSAULT_AMMO
mastery_rank: 8
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 23.5
disposition: 0.65           # riven disposition
polarities: [naramon]
exilus_polarity: madurai
riven_family: Acceltra
traits: [tenno]
introduced: "25.7"
internal_name: /Lotus/Weapons/Tenno/LongGuns/SapientPrimary/SapientPrimaryWeapon
noise: alarming
ammo_type: primary
ammo_max: 96
ammo_pickup: 40
magazine: 48
reload_seconds: 2

# Condition Overload: THE CATALOG NAMES THIS ATTACK. Verbatim
# (docs/CATALOGS.md §1):
#
#   Acceltra | Normal Attack | Projectile | 35 | 26 | 74.3% | Adding
#
# THIS ENTRY READ ADDING AT 100% UNTIL 2026-08-20, which was the
# ordinary class assumed because nobody had opened the catalog for this
# weapon — the check was run against our own transcription of it, which
# only ever carried the rows the roster already had.
co_behavior: additive_with_base_damage
co_base_fraction: 0.743

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 1.5
    max_deg: 7.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 70
  fire_rate: 12
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.32
  crit_multiplier: 2.8
  status_chance: 0.06
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC on every direct hit — the module's ForcedProcs.
  forced_procs: [impact]
  # NO RANGE ROW on the direct-hit block — the 4.0 m below is the
  # explosion's RADIUS and not a reach. See data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Acceltra (Acceltra Prime) | Primary Fire + AoE | 100% | Multiplies |
  #   Snapshot | 4.0 m | +320%
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 35 }   # total 35
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 4.0
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    crit_chance: 0.32
    crit_multiplier: 2.8
    status_chance: 0.06
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { puncture: 35.2, slash: 8.8 }   # total 44

unmodeled:
  - "the rockets have a MINIMUM ARMING DISTANCE of 7 metres (wiki): closer than that they hit and do not explode. This arena fires at whatever range the scene is set to, and the explosion is applied at every one of them — so a fight staged inside 7 m is overstated here by the whole explosion, which is most of the weapon"
  - "reloading while SPRINTING gives +25% reload speed (+50% on Gauss) — this arena does not move, so the reload here is always the standing one"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Acceltra
