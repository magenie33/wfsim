id: hema
name: Hema
slot: primary
# THE RIFLE THAT COSTS BLOOD, and the original of the pair — the Coda version
# keeps the mechanic and raises every number. The cost is real and this arena
# cannot charge it: nobody shoots back and nothing here has a health pool to
# spend, so what the sim shows is the weapon with its price removed.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO, PROJECTILE
mastery_rank: 7
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 20.0
disposition: 1.3             # riven disposition
polarities: [madurai]
exilus_polarity: naramon
riven_family: Hema
traits: [infested]
introduced: "19.5"
internal_name: /Lotus/Weapons/Infested/InfWFAccompanyingPri/InfestedBurstRifle
noise: alarming
ammo_type: primary
# NO AMMO POOL — "This weapon does not use ammo pickups; health is converted to
# ammo." Zero is the fact, not a gap: the infobox states 0 for both.
ammo_max: 0
ammo_pickup: 0
magazine: 60
reload_seconds: 2.0

# Condition Overload: THE CATALOG NAMES THIS ONE and it is MULTIPLYING. Verbatim
# row (docs/CATALOGS.md §1):
#
#   Weapon | Attack Name   | Projectile Type | Attack Unmodded Damage
#          | Actual CO Damage Bonus at +100% | CO Damage Bonus Relative To Base
#          Damage | Math/Behavior Type
#   Hema   | Normal Attack | Projectile      | 47 | 47 | 100% | Multiplying
#
# The Unmodded Damage cell is this attack's own 47, which is what tells the row
# apart from the Coda's 52. Both variants are named separately and both are
# Multiplying — the catalog stating a family agreement rather than us assuming
# one.
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 10.0
  trigger: burst
  # Three rounds a pull at 0.1 s between them, from the module's own BurstCount
  # and BurstDelay — identical to the Coda's. The 5.00 fire rate is the PULL
  # rate, which is what the burst cadence formula reads.
  burst:
    count: 3
    delay_seconds: 0.1
  shot_type: projectile
  projectile_speed_mps: 150
  fire_rate: 5.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.11
  crit_multiplier: 2.0
  status_chance: 0.25
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — Projectile at 150 m/s, and the page states no
  # reach. See data/surveys/weapon_range.yaml.
  damage: { viral: 47 }   # total 47

unmodeled:
  - "the HEALTH COST, which is the whole of this weapon's drawback: \"health is converted to ammo\". Nothing shoots back here and the Tenno has no health pool to spend, so the sim shows this rifle with its price removed"
  - "Necrophagic Vigor, the Hema family's exclusive mod — a weapon-exclusive card outside the pools this roster loads"

source:
  url: https://wiki.warframe.com/w/Hema
