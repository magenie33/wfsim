id: secura_penta
name: Secura Penta
slot: primary
# THE PERRIN SEQUENCE'S PENTA: seven grenades, twice the fire rate, and a 26%
# crit chance against the ordinary's 10% — at 300 Blast in a 6 m radius rather
# than 350 in 4 m. More reach, less damage, far more crit.
class: launcher
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle]   # CompatibilityTags PROJECTILE, AOE, SINGLESHOT
mastery_rank: 12
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 100.0
disposition: 1.3            # riven disposition
polarities: [naramon, vazarin, madurai]
exilus_polarity: naramon
riven_family: Penta
traits: [syndicate, perrin_sequence]
introduced: "17.3"
internal_name: /Lotus/Weapons/Syndicates/PerrinSequence/LongGuns/PSPenta
noise: alarming
ammo_type: primary
ammo_max: 28
ammo_pickup: 5
magazine: 7
reload_seconds: 2.5

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  # see notes: module_says_active_grenade
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 25
  fire_rate: 2
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.26
  crit_multiplier: 2.0
  status_chance: 0.26
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on the direct-hit block — the 6.0 m below is the
  # explosion's RADIUS and not a reach. See data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Penta (Secura Penta, Carmine Penta) | Primary Fire + AoE | 100% |
  #   Multiplies | Snapshot
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 75 }   # total 75
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.6
    crit_chance: 0.26
    crit_multiplier: 2.0
    status_chance: 0.26
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 300 }   # total 300

unmodeled:
  - "the grenades are DETONATED BY HAND — 'it launches ballistic grenades that can be manually detonated with Alternate Fire', with no arming delay at all (wiki). This sim has no second trigger, so every grenade goes off the instant it lands, which is what a player detonating immediately gets and is therefore the ceiling. What is lost is the play pattern the weapon exists for: laying grenades and firing them together"
  - "only five grenades may be live at once, and multishot counts towards that limit (wiki) — so on this weapon a multishot mod buys fewer shots rather than more damage per shot, which is the one place multishot is not simply good. This sim resolves each shot on its own and never hits the cap"
  - "the SEQUENCE syndicate effect, which converts damage dealt into shields for the wielder and nearby allies on a proc — the wielder is not a body in this arena and there are no allies, so it pays nothing"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
