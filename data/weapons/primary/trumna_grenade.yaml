id: trumna_grenade
name: Trumna
# THE GRENADE: a bouncing charge with a six-metre explosion, paid for out of a
# meter the primary fire fills.
inherits: trumna
form: alt_fire
transform_group: trumna

introduced: "29"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of
# this weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 6.0
    max_deg: 16.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 1.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.38
  crit_multiplier: 2.4
  status_chance: 0.5
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { impact: 100 }   # total 100
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.4
    crit_chance: 0.38
    crit_multiplier: 2.4
    status_chance: 0.5
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { heat: 1000 }   # total 1000

unmodeled:
  - "the grenades are earned by DEALING DAMAGE with the primary fire — the alternate cannot be used until the meter is full (wiki) — and this engine has no shape for one mode paying for another, so this entry fires on a cadence with no meter at all"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Trumna
