id: trumna_grenade
name: Trumna
# THE GRENADE: a bouncing charge with a six-metre explosion, paid for out of a
# meter the primary fire fills.
inherits: trumna
form: alt_fire
transform_group: trumna
transforms_from: trumna

introduced: "29"

# see notes: condition_overload_catalog_names
#
#   Trumna | Alt-fire | Projectile | 100 | 100 | 100% | Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

gauge_form:
  single_shot: true
  gauge:
    charge_on: kills
    charges_to_fill: 5
    max_rounds: 1
  transmute_in_seconds: 0.0
  transmute_out_seconds: 0.0

attack:
  extra_hit_reads: { impact: 0.4, slash: 0.55, puncture: 0.05 }   # see notes: extra_hit_reads
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 6.0
    max_deg: 16.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 1.33
  multishot: 1.0
  ammo_cost: 0
  crit_chance: 0.38
  crit_multiplier: 2.4
  status_chance: 0.5
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # see notes: no_range_row_attack
  damage: { impact: 100 }   # total 100
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    extra_hit_reads: { impact: 0.4, slash: 0.55, puncture: 0.05 }   # see notes: extra_hit_reads
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.4
    crit_chance: 0.38
    crit_multiplier: 2.4
    status_chance: 0.5
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { heat: 1000 }   # total 1000

unmodeled:
  - "Primary Compression's row for this attack is not entered. The table reads '127% / Both / Merged': over 100% effectiveness, both stacking brackets at once, and a fourth kind of radius calculation. The engine has no place for that combination, so the arcane adds nothing on this form here, where in game it is worth more than on the primary fire."
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Trumna
