id: mk1_paris_incarnon
name: MK1-Paris (Incarnon Form)
slot: primary
class: bow
form: incarnon

transform_group: mk1_paris
transforms_from: mk1_paris

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

incarnon:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 4
    rounds_per_charge: 5
    max_rounds: 20
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 0.55      # = base reload time, unmodded

pseudo_reload:
  magazine: 20
  reload_seconds: 1.55

# ORDINARY — THIS VARIANT IS NOT ON THE ROW. Verbatim:
#
#   |{{Weapon|Paris}}/{{Weapon|Paris Prime}}||Incarnon Mode||Projectile||520||520||100%||Multiplying
#
# and the row names the Paris and the Paris Prime, not the Mk1. A shared Genesis does not make one weapon: an
# Incarnon form is still that WEAPON's form, so a row is transcribed for the
# entries it names and no others (owner, 2026-08-12).
co_behavior: additive_with_base_damage

attack:
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 85
  fire_rate: 1
  charge_seconds: 0.8
  charge_cadence: draw_only
  multishot: 1.0
  ammo_cost: 1                  # of the 20-round charge pool
  crit_chance: 0.4
  crit_multiplier: 3
  status_chance: 0.2
  punch_through_m: 0.0
  damage: { impact: 50, heat: 250 }   # total 300

# incarnon_evolutions: see data/weapons/primary/mk1_paris.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Paris_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form Charged Shot"
