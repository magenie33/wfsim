id: buzlok
name: Buzlok
slot: primary
weapon_type: primary
# A HOMING RIFLE WHOSE ALTERNATE FIRE IS A TRACER, not a weapon: three damage,
# and it makes every following round home on what it stuck to AND grants +50%
# ABSOLUTE critical chance for twenty seconds. That buff is most of the weapon
# and it is not modelled — see the admission.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: buzlok
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags PROJECTILE, ASSAULT_AMMO
mastery_rank: 11
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 16.7
disposition: 1.2
polarities: []               # the infobox states none
exilus_polarity: naramon
riven_family: Buzlok
traits: [grineer]
introduced: "14.7"
internal_name: /Lotus/Weapons/Grineer/LongGuns/GrnGorgSniperRifle/GrnGorgSniperRifle
noise: alarming
ammo_type: primary
ammo_max: 540
ammo_pickup: 80
magazine: 50
reload_seconds: 3

# see notes: condition_overload_catalog_names
#
#   Buzlok | Normal Attack | Projectile | 60 | 60 | 100% | Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

attack:
  extra_hit_reads: { impact: 0.8, slash: 0.05, puncture: 0.15 }   # see notes: extra_hit_reads
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 6.25
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.23
  crit_multiplier: 2.5
  status_chance: 0.21
  punch_through_m: 0.0
  # see notes: no_range_row_attack
  damage: { impact: 30, puncture: 24, slash: 6 }   # total 60

unmodeled:
  - "Landing a tracer round grants +50% absolute critical chance for 20 s, unaffected by mods (wiki). The bonus comes from the other firing mode and the engine cannot carry it across, so this entry fires at 23% where a player with a beacon on the target fires at 73%. It is most of the weapon; the number reads low."
  - "The primary fire homes on a beaconed target for 20 s (wiki); shots here already land where aimed, so homing adds nothing."

