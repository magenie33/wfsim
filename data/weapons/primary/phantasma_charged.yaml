id: phantasma_charged
name: Phantasma
# see notes: form_of_its_weapon_inherits
inherits: phantasma
# THE ALT-FIRE — a one-second charge that throws a plasma bomb instead of the
# six beams. `charged` is the kind for a shot whose DRAW replaces the fire-rate
# cadence (docs/GLOSSARY.md "FORMS"), and it is reached from the beam for FREE:
# no gauge, no transmute animation, just the other button. That is why this
# entry carries no `transforms_from` — a form of the same weapon, not a
# transformation of it. Same shape as larkspur_prime_charged.yaml.
form: charged
transform_group: phantasma

grip_type: ""

# CONDITION OVERLOAD — the bomb is ordinary, and the wiki's catalog row is
# about the part this entry does NOT model:
#
#   Phantasma Prime | Alt-fire Child Bomb | Projectile | 3 | 3 | 100% |
#   Multiplying
#
# Neither the plasma bomb's impact nor its explosion has a row, so both take
# the ordinary Additive class at the full base. The CHILD BOMBS are the
# exception — the catalog's "Multiplying" is the discrepant class — and they
# are recorded rather than modelled; see the note under `radial:`.
co_behavior: additive_with_base_damage

unmodeled:
  - reason: cluster_bomblet_co
    row: "Phantasma | Alt-fire Child Bomb | Projectile | 3 | 3 | 100% | Multiplying"
  - reason: cluster_bomblet_stagger
  - "the escalating ammo cost the wiki files under Bugs (2/2/2/3/3/4/6 through a magazine, and -1 damage per extra ammo): a bug is not a rule, and this one takes AWAY what the charge is supposed to buy"

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  # The charge IS this form's cadence, not `fire_rate`. The listed 2.00
  # attacks/sec is kept as the STAT (it is what the panel prints and what
  # fire-rate gates read); the sim paces on `charge_seconds` plus that rate,
  # which is the wiki's general charge formula for everything but a bow —
  # 1 / (1 + 1/2) = 0.67 shots a second.
  #
  # THE CHARGE EATS THE MAGAZINE, and `charge_seconds` is therefore DERIVED
  # rather than stated. Wiki Notes, verbatim: "Charging consumes
  # ammo, up to a full magazine on full charge", "Damage dealt by the plasma
  # bomb is directly proportional to the amount of ammo consumed during the
  # charge", and "Charge rate consumes a set 11 ammo per second. Modding to
  # increase magazine capacity will allow a longer total charge, and thus more
  # damage." Confirmed in play.
  #
  # WHAT THE LISTED NUMBERS ARE is the one thing the wiki never says outright,
  # and three of its own figures answer it between them: the listed charge time
  # is 1.00 s, the rate is 11 ammo/s, and the magazine is 11. One second at
  # eleven a second IS the magazine — so the listed time is a FULL charge and
  # the listed 15 + 73 is what a full charge of the unmodded magazine deals.
  # Three independent numbers agreeing exactly is not a coincidence.
  #
  # The consequence is that at stock magazine NOTHING here moves: 1.0 s, x1.0
  # damage, as before. What changes is that the shot now costs the magazine it
  # spends, and that a magazine mod buys damage — which is the whole design and
  # was worth nothing until now.
  #
  # WHAT WOULD FALSIFY IT: a full charge that deals 15 + 73 with a magazine mod
  # on. Under this reading it deals more.
  charge_ammo_per_second: 11.0
  shot_type: projectile
  projectile_speed_mps: 25
  fire_rate: 2.0
  multishot: 1.0
  # THE STAT TABLE'S OWN AMMO FIGURE, kept as the weapon's constant and NOT what
  # the sim charges: `resolve` bills the magazine, because that is what a full
  # charge spends. The table's 2 is the odd one out among its own numbers — see
  # the charge note above.
  #
  # The wiki records a BUG that this does not model, because a bug is not a
  # rule: "Ammo cost of charge increases as magazine depletes ... it may consume
  # 2/2/2/3/3/4/6 ammo throughout a magazine", and "Charged damage is reduced by
  # -1 for each additional ammo consumed". Listed here so nobody re-derives the
  # discrepancy from a measurement and files it as a modelling error.
  ammo_cost: 2
  crit_chance: 0.03
  crit_multiplier: 1.5
  status_chance: 0.37
  punch_through_m: 0.0
  damage: { impact: 15.0 }
  # GUARANTEED IMPACT, on the bomb and on the seeking projectiles: "Plasma bomb
  # and seeking projectiles have a guaranteed Impact proc." It lands on top of
  # the rolled status, and it matters here beyond the stagger — a status TYPE
  # that is always present is a permanent +1 to Condition Overload's count.
  #
  # This is the first weapon in the roster to state one. `forced_procs` has
  # existed on the sim's side since the Astilla was written up in MECHANICS §6;
  # the panel filled it with an empty vector, so no weapon could ever reach it.
  forced_procs: [impact]
  # THE EXPLOSION — "explodes in a 4.8 meter radius". Rules in MECHANICS §7:
  # its own crit and status stats, a 1x body-part multiplier ("Explosion has a
  # headshot multiplier of 1x and cannot trigger headshot conditions"), and
  # "Initial hit and explosion apply status separately", which is exactly why
  # it is a second instance rather than added damage.
  # PRIMARY COMPRESSION's row (docs/CATALOGS.md §2): 4.8 m -> +384%, on the Alt-Fire. Shotgun; "Bomblets do not benefit".
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot

  radial:
    damage: { radiation: 73.0 }
    radius_m: 4.8
    falloff_start_m: 0.0
    # "linear Damage Falloff from 100% to 50% from central impact" — half, not
    # to zero. Inert single-target: the bomb detonates ON the target, so the
    # epicentre distance is zero.
    falloff_reduction: 0.5
    crit_chance: 0.03
    crit_multiplier: 1.5
    status_chance: 0.37

  # THE FIVE CLUSTER BOMBLETS — "which then releases 5 seeking projectiles",
  # module attacks 4 and 5. They land where the bomb landed, which is what a
  # player sees: the bomb goes off on the target and the bomblets come down on
  # it. NO FALLOFF on their explosion — the module gives attack 5 a `Range = 2`
  # and NO `Falloff` block, where attack 3 (the bomb's own) carries
  # `Falloff = { EndRange = 4.8, Reduction = 0.5, StartRange = 0 }`.
  cluster:
    count: 5
    # The contact hit, per bomblet. Its forced Stagger is an admission above.
    damage: { impact: 3.0 }
    crit_chance: 0.03
    crit_multiplier: 1.5
    status_chance: 0.37
    radial:
      damage: { radiation: 18.0 }
      radius_m: 2.0
      crit_chance: 0.03
      crit_multiplier: 1.5
      status_chance: 0.37
      forced_procs: [impact]

source:
  url: https://wiki.warframe.com/w/Phantasma
  # Attack stats from the wiki `Module:Weapons/data/primary` ("Phantasma
  # Prime", attacks 2 "Plasma Bomb Impact" and 3 "Plasma Bomb Explosion"),
  # cross-checked against WFCD warframe-items joined on internal name — 0
  # disagreements. Attacks 4 and 5 are the bomblets, recorded above.
