id: enkaus
name: Enkaus
slot: primary
weapon_type: primary
# A 36-METRE BEAM with a grenade in its alternate fire — the arsenal shows the
# ALT (`_TooltipAttackDisplay: 2`), and this entry is the beam it is not.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: enkaus
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags BEAM
mastery_rank: 12
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 1.0
disposition: 1.2
# THE PAGE SAYS "Innate Madurai polarity"; the module says Naramon, kept
# until the arsenal is read.
polarities: [naramon]
exilus_polarity: naramon
riven_family: Enkaus
traits: [tenno]
introduced: "42"
# THE MODULE CARRIES NO InternalName FOR THIS WEAPON, so this key comes from
# DE's Public Export joined on the display name — which is the join this
# roster forbids everywhere else, and is stated because it is an exception.
# It is safe here because the export holds exactly ONE Enkaus; the rule
# exists for names the export carries twice.
internal_name: /Lotus/Weapons/Tenno/LongGuns/TnInkRifle/TnInkRifleWeapon
noise: alarming
ammo_type: primary
ammo_max: 60
ammo_pickup: 1
magazine: 60
reload_seconds: 2.2

# see notes: condition_overload_no_row_4
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 1.0
    max_deg: 1.0
  trigger: held
  shot_type: hit_scan
  fire_rate: 12
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.16
  crit_multiplier: 1.8
  status_chance: 0.32
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 36.0 m" on this attack.
  range_m: 36.0
  damage: { corrosive: 20, puncture: 8 }   # total 28

unmodeled:
  - "An Enkaus hit that leaves an ink-stained enemy below 35% health kills it outright, as one hit at 600% critical chance, 1x critical multiplier and a forced Corrosive status (wiki); the stain comes from the alternate fire or Follie's passive, and bosses and enemies with special states are spared. Nothing is ink-stained here, so every enemy is shot down to zero and the number reads low."
  - "Primary fire on an ink-stained enemy spends no ammo and restores 0.33 rounds per enemy hit (wiki). Nothing is ink-stained here, so every tick spends a round and the beam reloads on its usual schedule; the number reads low."
  - "Unmeasured: the page gives the beam a 30 m range and the weapon module 36 m. The sim uses 36 m, so a fight set between 30 m and 36 m reads high if the page is right."
  - "Unmeasured: the page says the weapon uses no ammo pickups and has an infinite reserve, and the weapon module lists a reserve of 60. The sim uses the 60, so a fight with Infinite ammo unticked can run dry where the game would not, and reads low."

source:
  url: https://wiki.warframe.com/w/Enkaus
