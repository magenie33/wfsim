id: trumna_prime_grenade
name: Trumna Prime
# THE GRENADE: a bouncing charge with a six-metre explosion.
inherits: trumna_prime
form: alt_fire
transform_group: trumna_prime

introduced: "37.0.9"

# see notes: inherited_co_catalog_gives_3
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 6.0
    max_deg: 16.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 1.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.38
  crit_multiplier: 2.4
  status_chance: 0.5
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # see notes: no_range_row_attack
  damage: { impact: 100 }   # total 100
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.4
    crit_chance: 0.38
    crit_multiplier: 2.4
    status_chance: 0.5
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { heat: 1150 }   # total 1150

unmodeled:
  - "PRIMARY COMPRESSION's row for this attack is not transcribed. The published table reads '127% / Both / Merged' — the effectiveness is over 100%, the stacking is BOTH brackets at once, and the radius calculation is a fourth kind ('Alt-Fire gains the damage % bonus from primary fire's radius and a unique multiplier'). `stacking` here is one of two values and `radius_calculation` one of four, so a shape the vocabulary cannot hold is left out rather than flattened — and the arcane is therefore worth NOTHING on this form here, where in game it is worth more than on the primary fire"
  - "the grenades are earned by DEALING DAMAGE with the primary fire — the alternate cannot be used until the meter is full (wiki) — and this engine has no shape for one mode paying for another, so this entry fires on a cadence with no meter at all"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Trumna_Prime
