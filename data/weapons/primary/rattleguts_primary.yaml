# Rattleguts, as a PRIMARY — one chamber, two roster entries;
# data/kitguns/README.md says why the slot is the weapon.
#
# see notes: kitgun_entry_is_default_assembly
#
# THE PLAIN ONE: hit-scan, fully automatic, four physical-and-Radiation types,
# no explosion and no chain. "The grip will also affect fire rate the most, out
# of all the Kitgun chambers" — 9 a second on Tremor, 17 on Brash.
id: rattleguts_primary
name: Rattleguts
wiki_name: Rattleguts
slot: primary
class: rifle
form: base
default_form: true
# The module's Class is Rifle, and DE's own patch note says so: "Tombfinger and
# Rattleguts are Rifles". It carries no compatibility tags at all.
