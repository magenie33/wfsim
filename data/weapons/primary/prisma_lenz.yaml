id: prisma_lenz
name: Prisma Lenz
slot: primary
weapon_type: primary
# THE LENZ WITH BARO'S NUMBERS, and the same bubble: 7.2 metres of Blast on
# collapse.
class: bow
form: charged
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, bow]
compatibility_tags: [projectile, sniper_ammo, aoe, singleshot, crpbow]   # see notes: de_compatibility_tags
mastery_rank: 12
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 16.7
disposition: 1              # riven disposition
polarities: [naramon, naramon, madurai]
exilus_polarity: madurai
riven_family: Lenz
traits: [corpus, baro]
introduced: "33.0.10"
internal_name: /Lotus/Weapons/Corpus/Bow/Longbow/PrismaLenz/PrismaLenzWeapon
noise: alarming
ammo_type: primary
ammo_max: 8
ammo_pickup: 1
magazine: 1
reload_seconds: 0.6

# see notes: condition_overload_no_row_3
co_behavior: additive_with_base_damage

attack:
  extra_hit_reads: even   # see notes: extra_hit_reads
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 1
  # The page gives it a "faster Charge Time" than the Lenz, so the module's
  # 1.2 is the Lenz's copied over; the arsenal reads 0.80 s.
  charge_seconds: 0.8
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.5
  crit_multiplier: 2.8
  status_chance: 0.16
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # see notes: no_range_row_attack_2
  #
  #   Lenz (Prisma Lenz) | Charged Shot + AoE | 100% | Multiplies | Snapshot
  #   | 7.2 m | +575%
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 56 }   # total 56
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    extra_hit_reads: even   # see notes: extra_hit_reads
    radius_m: 7.2
    falloff_start_m: 0.0
    falloff_reduction: 0.7
    crit_chance: 0.5
    crit_multiplier: 2.8
    status_chance: 0.16
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 740 }   # total 740

unmodeled:
  - "The module gives this shot three attacks and the engine carries one explosion: the Blast collapse is modelled, and the initial blast is not - neither its Cold damage nor its guaranteed Cold status in 7.2 m, so a build that profits from Cold stacks or a status count reads low."
  - "The collapse's 1.3 s delay after the initial blast is not modelled: the blast arrives with the arrow, so a short fight gets its damage early."
  - "The bubble holds what it catches until it collapses (wiki); crowd control, and enemies here neither move nor stop."
  - reason: self_stagger
  - reason: bolt_corpse_ragdoll

source:
  url: https://wiki.warframe.com/w/Prisma_Lenz
