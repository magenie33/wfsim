id: prisma_lenz
name: Prisma Lenz
slot: primary
# THE LENZ WITH BARO'S NUMBERS, and the same bubble: 7.2 metres of Blast on
# collapse.
class: bow
form: charged
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, bow]   # CompatibilityTags PROJECTILE, SNIPER_AMMO, AOE, SINGLESHOT, CRPBOW
mastery_rank: 12
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 16.7
disposition: 1              # riven disposition
polarities: [naramon, naramon, madurai]
exilus_polarity: madurai
riven_family: Lenz
traits: [corpus, baro]
introduced: "33.0.10"
internal_name: /Lotus/Weapons/Corpus/Bow/Longbow/PrismaLenz/PrismaLenzWeapon
noise: alarming
ammo_type: primary
ammo_max: 8
ammo_pickup: 1
magazine: 1
reload_seconds: 0.6

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20)
# — ordinary Additive at the full +100%. The catalog gives a class PER
# ATTACK and none of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 1
  charge_seconds: 1.2
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.5
  crit_multiplier: 2.8
  status_chance: 0.16
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Lenz (Prisma Lenz) | Charged Shot + AoE | 100% | Multiplies | Snapshot
  #   | 7.2 m | +575%
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 56 }   # total 56
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 7.2
    falloff_start_m: 0.0
    falloff_reduction: 0.7
    crit_chance: 0.5
    crit_multiplier: 2.8
    status_chance: 0.16
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 740 }   # total 740

unmodeled:
  - "the module gives this shot THREE attacks and this engine carries one explosion: the Blast COLLAPSE is the one modelled and the Cold INITIAL BLAST is not counted"
  - "the bubble HOLDS what it catches until it collapses (wiki) — that is crowd control, and this arena's enemies neither move nor stop"
  - reason: explosion_ignores_cover
  - reason: self_stagger
  - reason: silent_weapon

source:
  url: https://wiki.warframe.com/w/Prisma_Lenz
