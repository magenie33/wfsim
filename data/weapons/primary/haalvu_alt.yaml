id: haalvu_alt
name: Haalvu
# BURST MODE: the barrels split into miniature rifles firing two-round bursts,
# 1.5 ammo a shot per target, at a higher status chance and a lower crit.
inherits: haalvu
form: alt_fire
# see notes: alt_fire_toggles_wiki
alt_fire_toggles: true
transform_group: haalvu

introduced: "43.0.7"

# see notes: battery_restated_on_every_form
battery:
  regen_per_second: 300.0
  delay_empty_seconds: 0.5
  delay_partial_seconds: 0.5
  empty_animation_seconds: 2.0

# NEVER EMPTIED: an empty battery is the 2 s animation and one shot short of it
# is a 1 s refill (0.5 s delay + 150/300 s, measured), so the most this form
# deals is fired in runs that stop one shot short.
modes:
  - id: alternate_recharge
    name: "Alternate Fire, never emptied"
    about: "Fired until the next shot would empty the battery, then held while it refills: 1 s back to full, where an empty battery's reload animation is 2 s."
    rules:
      - { action: { do: recharge }, when: { if: battery_would_empty } }

# see notes: inherited_co_catalog_gives
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: burst
  # see notes: burst_listed_fire_rate
  burst:
    count: 2
    delay_seconds: 0.05       # module BurstDelay
  shot_type: hit_scan
  # THE MINIATURE RIFLES: "target up to 4 enemies within 40° of the reticle
  # and within 10m of the player" (wiki); the shares are the owner's reading of
  # where the rounds go, in outline (`model::LockOn`).
  lock_on: { range_m: 10.0, acquire_deg: 40.0, targets: 4, far_miss_share: 0.5, far_head_share: 0.0 }
  fire_rate: 12
  multishot: 1.0
  ammo_cost: 1.5
  crit_chance: 0.2
  crit_multiplier: 1.8
  status_chance: 0.26
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_3
  range_m: 300.0
  damage: { tau: 34 }   # total 34

unmodeled:
  - "Inside 10 m the miniature rifles pick their own spot, modelled in outline: at contact every round lands where it is aimed; at 10 m against one enemy half of them miss and none finds a head; each further enemy in reach takes some of the misses away, none left at four. In game the two rounds of a burst can land on different enemies; here both land on the aimed one, so the total is about right and the aimed enemy's share reads high."

source:
  url: https://wiki.warframe.com/w/Haalvu
