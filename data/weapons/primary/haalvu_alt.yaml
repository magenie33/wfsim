id: haalvu_alt
name: Haalvu
# BURST MODE: the barrels split into miniature rifles firing two-round bursts,
# 1.5 ammo a shot per target, at a higher status chance and a lower crit.
inherits: haalvu
form: alt_fire
# see notes: alt_fire_toggles_wiki
alt_fire_toggles: true
transform_group: haalvu

introduced: "43.0.7"

# see notes: battery_restated_on_every_form
battery:
  regen_per_second: 300.0
  delay_empty_seconds: 0.5
  delay_partial_seconds: 0.5

# see notes: inherited_co_catalog_gives
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: burst
  # see notes: burst_listed_fire_rate
  burst:
    count: 2
    delay_seconds: 0.05       # module BurstDelay
  shot_type: hit_scan
  fire_rate: 12
  multishot: 1.0
  ammo_cost: 1.5
  crit_chance: 0.2
  crit_multiplier: 1.8
  status_chance: 0.26
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_3
  range_m: 300.0
  damage: { tau: 34 }   # total 34

unmodeled:
  - "Tau's status effect is not modelled. Tau's neutral damage is applied correctly, but its proc raises the status chance the target takes from every other source by 10% a stack, up to ten (wiki). With other statuses stacked, the number reads low."
  - "The miniature rifles lock onto up to four enemies within 40 degrees and 10 m, paying ammo per target (wiki). The engine fires at the aimed body only: right against one enemy, up to four times low against a crowd."

source:
  url: https://wiki.warframe.com/w/Haalvu
