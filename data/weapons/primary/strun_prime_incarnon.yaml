id: strun_prime_incarnon
name: Strun Prime (Incarnon Form)
slot: primary
class: shotgun
form: incarnon

transform_group: strun_prime
transforms_from: strun_prime

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 40
    rounds_per_charge: 1
    max_rounds: 40
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 4.6      # = base reload time, unmodded

pseudo_reload:
  magazine: 40
  reload_seconds: 5.6

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 200
  fire_rate: 2.5
  multishot: 1.0
  ammo_cost: 1                  # of the 40-round charge pool
  crit_chance: 0.48
  crit_multiplier: 3.4
  status_chance: 0.46
  # see notes: guaranteed_impact_every_shot
  forced_procs: [impact]
  punch_through_m: 0.0
  damage: { impact: 100 }   # total 100
  # The radial part — rules in MECHANICS §7.
  # PRIMARY COMPRESSION's row (docs/CATALOGS.md §2): 4.0 m -> +320%. Shotgun: no radius mod exists for it.
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot

  radial:
    damage: { slash: 100, puncture: 40, blast: 60 }   # total 200
    radius_m: 4
    falloff_start_m: 0
    falloff_reduction: 0.2
    # Guaranteed IMPACT on the explosion (wiki module).
    forced_procs: [impact]
    crit_chance: 0.48
    crit_multiplier: 3.4
    status_chance: 0.46
    # see notes: declared_no_co_catalog

# incarnon_evolutions: see data/weapons/primary/strun_prime.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Strun_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form" and "Incarnon Form AoE"

