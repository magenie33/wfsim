id: vectis
name: Vectis
slot: primary
class: sniper
form: base
default_form: true
mod_pools: [primary, rifle, sniper]
mastery_rank: 2
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: vectis
transforms_to: vectis_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
unmodeled:
  - reason: sniper_combo_miss
    seconds: 2
# THE TWO SNIPER MECHANICS. Both are the WEAPON's rather than the build's, both
# are paid only while scoped in, and neither is a stat on the panel — see
# `weapons_data::SniperCombo` and `ScopeSpec` for the rules and their sources.
#
# The Vectis has the SMALLEST minimum combo in the game: one hit arms 1.5x.
sniper_combo:
  min: 1
scope:
  magnification: 4.5
  headshot_damage: 0.5

accuracy: 13.3
disposition: 1.15
polarities: [madurai]
exilus_polarity: madurai
riven_family: Vectis
traits: [incarnon]
introduced: "Update 10.6"
internal_name: /Lotus/Weapons/Tenno/Rifle/TennoSniperRifle
noise: alarming
ammo_type: primary
ammo_max: 72
ammo_pickup: 15
magazine: 1
reload_seconds: 1

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 15
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 1.5
  # NOT MODELLED — the arena has no distance, so this weapon is
  # simulated at point blank. Recorded because the RIVEN pool reads
  # it: a hitscan weapon that lists a falloff still rolls Projectile
  # Speed, which scales the whole range (wiki `Projectile Speed`).
  falloff:
    start_m: 400
    end_m: 600
    reduction: 0.5   # fraction KEPT past end_m
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2
  status_chance: 0.3
  # "Innate 1 meter punch through" (wiki).
  punch_through_m: 1.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 1000.0 m", Hit-Scan
  range_m: 1000.0
  damage: { impact: 90, slash: 56.25, puncture: 78.75 }   # total 225.0

# incarnon_evolutions: definitions live in data/evolutions/vectis_*.yaml.

source:
  url: https://wiki.warframe.com/w/Vectis
