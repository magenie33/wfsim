id: vectis
name: Vectis
slot: primary
class: sniper
form: base
default_form: true
mod_pools: [primary, rifle, sniper]
mastery_rank: 2
max_rank: 30

# see notes: two_weapons_model_base
transform_group: vectis
transforms_to: vectis_incarnon

# see notes: bulk_intake_stats_are
unmodeled:
  - reason: sniper_combo_miss
    seconds: 2
# THE TWO SNIPER MECHANICS. Both are the WEAPON's rather than the build's, both
# are paid only while scoped in, and neither is a stat on the panel — see
# `weapons_data::SniperCombo` and `ScopeSpec` for the rules and their sources.
#
# The Vectis has the SMALLEST minimum combo in the game: one hit arms 1.5x.
sniper_combo:
  min: 1
scope:
  magnification: 4.5
  headshot_damage: 0.5

accuracy: 13.3
disposition: 1.15
polarities: [madurai]
exilus_polarity: madurai
riven_family: Vectis
traits: [incarnon]
introduced: "Update 10.6"
internal_name: /Lotus/Weapons/Tenno/Rifle/TennoSniperRifle
noise: alarming
ammo_type: primary
ammo_max: 72
ammo_pickup: 15
magazine: 1
reload_seconds: 1

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 15
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 1.5
  # see notes: modelled_arena_has_no
  falloff:
    start_m: 400
    end_m: 600
    reduction: 0.5   # fraction KEPT past end_m
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2
  status_chance: 0.3
  # "Innate 1 meter punch through" (wiki).
  punch_through_m: 1.0
  # see notes: wall_ramp_full_damage_5
  range_m: 1000.0
  damage: { impact: 90, slash: 56.25, puncture: 78.75 }   # total 225.0

# incarnon_evolutions: definitions live in data/evolutions/vectis_*.yaml.

source:
  url: https://wiki.warframe.com/w/Vectis
