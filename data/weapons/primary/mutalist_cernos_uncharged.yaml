id: mutalist_cernos_uncharged
name: Mutalist Cernos
# THE TAPPED SHOT: fired without drawing, and with no cloud at all.
inherits: mutalist_cernos
form: base
transform_group: mutalist_cernos

introduced: "18.5"

# see notes: condition_overload_catalog_names
#
#   Mutalist Cernos | Uncharged Attack | Projectile | 205 | 205 | 100% |
#   Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 70
  fire_rate: 1
  # A BOW'S CADENCE IS DRAW + NOCK, so the draw is stated even when the
  # module gives none: a 0.0 draw paces on the nock, which is the one
  # arrow a bow's magazine holds.
  charge_seconds: 0.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.15
  crit_multiplier: 2.0
  status_chance: 0.49
  punch_through_m: 0.0
  # see notes: no_range_row_attack
  damage: { impact: 184.5, puncture: 10.25, slash: 10.25 }   # total 205

unmodeled:
  - reason: silent_weapon

source:
  url: https://wiki.warframe.com/w/Mutalist_Cernos
