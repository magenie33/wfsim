id: mk1_paris
name: MK1-Paris
slot: primary
class: bow
form: charged
default_form: true
mod_pools: [primary, rifle, bow]
mastery_rank: 0
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: mk1_paris
transforms_to: mk1_paris_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
accuracy: 16.67
disposition: 1.45
polarities: [naramon]
exilus_polarity: naramon
riven_family: Paris
traits: [incarnon]
introduced: "Update 14.0"
internal_name: /Lotus/Weapons/MK1Series/MK1Paris
noise: silent
ammo_type: primary
ammo_max: 72
ammo_pickup: 15
magazine: 1
reload_seconds: 0.55

# CO ON HALF THE BASE. The catalog lists this family's Charged Attack as
# "Adding, 25-50%", and for a bow the number is derivable: the drawn shot
# deals exactly TWICE the tapped one in DE's export, so the 2x is a charge
# multiplier outside the additive bracket and CO computes on half. The
# Cernos Prime carries 0.5 for the same reason.
co_behavior: additive_with_base_damage
co_base_fraction: 0.5

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 12
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 85
  fire_rate: 1
  charge_seconds: 0.5
  charge_cadence: draw_only
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.3
  crit_multiplier: 2
  status_chance: 0.15
  # Module:Weapons/data, Charged Shot. Read 0.0 until 2026-08-21 while both
  # siblings carried theirs — the Paris 2.0 and the Prime 3.0 — which is what
  # an omission looks like rather than a decision. It was invisible because
  # the audit spells this family MK1- and the module spells it Mk1-, so every
  # MK1 weapon was reported UNCHECKED and never compared.
  punch_through_m: 2.0
  damage: { impact: 11.5, slash: 34.5, puncture: 184 }   # total 230.0

# incarnon_evolutions: definitions live in data/evolutions/mk1_paris_*.yaml.

source:
  url: https://wiki.warframe.com/w/MK1-Paris

