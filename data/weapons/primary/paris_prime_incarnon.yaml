id: paris_prime_incarnon
name: Paris Prime (Incarnon Form)
slot: primary
class: bow
form: incarnon

transform_group: paris_prime
transforms_from: paris_prime

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 4
    rounds_per_charge: 5
    max_rounds: 20
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 0.7      # = base reload time, unmodded

pseudo_reload:
  magazine: 20
  reload_seconds: 1.7

# CONDITION OVERLOAD IS INDEPENDENT ON THIS FORM. The wiki's CO catalog
# lists this weapon's named attack as "Multiplying", so the bonus is a
# free-standing final multiplier rather than a member of the base-damage
# bucket. Applied to every variant: the form belongs to the ADAPTER.
co_behavior: independent

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 12
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 85
  fire_rate: 1
  charge_seconds: 0.8
  charge_cadence: draw_only
  multishot: 1.0
  ammo_cost: 1                  # of the 20-round charge pool
  crit_chance: 0.5
  crit_multiplier: 3.4
  status_chance: 0.2
  # The page's own list names it: "Paris Prime (Incarnon Form)".
  # see notes: infinite_body_punch_through
  punch_through_m: infinite
  damage: { impact: 100, heat: 420 }   # total 520

# incarnon_evolutions: see data/weapons/primary/paris_prime.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Paris_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form Charged Shot"

