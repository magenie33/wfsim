id: panthera_prime
name: Panthera Prime
slot: primary
# THE PANTHERA WITH AN EXPLOSION ON EVERY SAW BLADE — 1.6 metres — and the same
# deployed sawblade in its alternate fire.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: panthera_prime
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags PROJECTILE, ASSAULT_AMMO, BEAM
mastery_rank: 14
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items, which DISAGREES on one field:
# WFCD's magazine is in SHOTS (80 rounds = 40 at 2 apiece). The wiki wins (data/README.md), and
# `scripts/audit_weapon_stats.py` carries the divergence with its reason
# so it cannot be mistaken for a transcription error.
accuracy: 80.0
disposition: 1.25           # riven disposition
polarities: [madurai, naramon]
exilus_polarity: madurai
riven_family: Panthera
traits: [prime]
introduced: "28.2"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimePanthera/PrimePanthera
noise: alarming
ammo_type: primary
ammo_max: 320
ammo_pickup: 80
magazine: 80
reload_seconds: 2.4

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%. The catalog gives a class PER ATTACK
# and none of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 1.0
    max_deg: 1.5
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 3.67
  multishot: 1.0
  ammo_cost: 2
  crit_chance: 0.18
  crit_multiplier: 2.0
  status_chance: 0.3
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Panthera (Panthera Prime) | Primary Fire + AoE | 100% | Multiplies |
  #   Snapshot
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 20, puncture: 10, slash: 70 }   # total 100
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 1.6
    falloff_start_m: 0.0
    falloff_reduction: 0.2
    crit_chance: 0.18
    crit_multiplier: 2.0
    status_chance: 0.3
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { slash: 20 }   # total 20

unmodeled:
  - "the blades RICOCHET off surfaces (wiki) and this arena has no walls to bounce off"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Panthera_Prime
