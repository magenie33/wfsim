id: mutalist_cernos
name: Mutalist Cernos
slot: primary
# AN INFESTED BOW WHOSE DRAWN ARROW LEAVES A TOXIN CLOUD. The charged shot is
# the arsenal's own; the cloud is carried below as `lingering:`.
class: bow
form: charged
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: mutalist_cernos
mod_pools: [primary, rifle, bow]   # CompatibilityTags PROJECTILE, INFCERNOS
mastery_rank: 7
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 16.7
disposition: 1.35           # riven disposition
polarities: [naramon]
exilus_polarity: madurai
riven_family: Mutalist Cernos
traits: [infested]
introduced: "18.5"
internal_name: /Lotus/Weapons/Infested/Bow/InfCernosBow/InfCernos
noise: alarming
ammo_type: primary
ammo_max: 72
ammo_pickup: 15
magazine: 1
reload_seconds: 0.6

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20)
# — ordinary Additive at the full +100%. The catalog gives a class PER
# ATTACK and none of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 85
  fire_rate: 1
  charge_seconds: 0.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.15
  crit_multiplier: 2.0
  status_chance: 0.49
  punch_through_m: 1.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Mutalist Cernos | Toxin Cloud | 0% | Doesn't Work | N/A | 2.5 m
  #
  # ZERO IS A ROW, NOT AN OMISSION: the arcane does not apply to this
  # attack at all, and saying so is the difference between "checked" and
  # "nobody looked".
  compression:
    effectiveness: 0.00
    stacking: multiplies
    radius_calculation: doesnt_work
  damage: { impact: 369, puncture: 20.5, slash: 20.5 }   # total 410

unmodeled:
  - "the cloud also CONFUSES the enemies standing in it, turning them on each other for its duration (wiki) — that is crowd control, and this arena's enemies neither turn nor stop"
  - reason: silent_weapon

source:
