id: mutalist_cernos
name: Mutalist Cernos
slot: primary
# AN INFESTED BOW WHOSE DRAWN ARROW LEAVES A TOXIN CLOUD. The charged shot is
# the arsenal's own; the cloud is carried below as `lingering:`.
class: bow
form: charged
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: mutalist_cernos
mod_pools: [primary, rifle, bow]   # CompatibilityTags PROJECTILE, INFCERNOS
mastery_rank: 7
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 16.7
disposition: 1.35           # riven disposition
polarities: [naramon]
exilus_polarity: madurai
riven_family: Mutalist Cernos
traits: [infested]
introduced: "18.5"
internal_name: /Lotus/Weapons/Infested/Bow/InfCernosBow/InfCernos
noise: alarming
ammo_type: primary
ammo_max: 72
ammo_pickup: 15
magazine: 1
reload_seconds: 0.6

# Condition Overload: THE CATALOG NAMES THIS ATTACK. Verbatim
# (docs/CATALOGS.md §1):
#
#   Mutalist Cernos | Charged Attack | Projectile | 410 | 205 | 50% |
#   Adding
#
# Notes cell:
#   CO-bonus only applies to base (uncharged) damage; bows have innate 2x
#   damage multiplier when fully charged
#
# THIS ENTRY READ ADDING AT 100% UNTIL 2026-08-20, which was the
# ordinary class assumed because nobody had opened the catalog for this
# weapon — the check was run against our own transcription of it, which
# only ever carried the rows the roster already had.
co_behavior: additive_with_base_damage
co_base_fraction: 0.5

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 85
  fire_rate: 1
  charge_seconds: 0.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.15
  crit_multiplier: 2.0
  status_chance: 0.49
  punch_through_m: 1.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  # THE SPORE CLOUD — "on contact with surfaces, arrows spawn a small Toxin
  # cloud that deals damage over 2.5 meters and has a chance to apply a Toxin
  # proc every second for 10 seconds" (wiki), and "initial hit and spore cloud
  # apply status separately".
  #
  # NO DAMAGE FALLOFF: the module carries a window with a reduction of ZERO,
  # which is its way of saying there is none — full damage to the rim.
  #
  # ONE TICK A SECOND for ten seconds, from the module's FireRate of 1.00 on
  # the cloud and the page's ten-second life: ten ticks of 5 Toxin.
  lingering:
    damage: { toxin: 5.0 }
    # THE CATALOG SAYS THIS AoE PART TAKES CONDITION OVERLOAD, which almost
    # no area part does. Verbatim (docs/CATALOGS.md §1):
    #
    #   Mutalist Cernos | Charged AoE Toxin Cloud | AoE | 5 | 205 | 4100% | Adding
    #
    # The RELATIVE column is 4100% and there is no per-part CO fraction —
    # `co_base_fraction` is one number per ENTRY and this entry's direct hit
    # has its own — so this part takes the term at 100% of its own base and
    # the difference is admitted below. It read FALSE until 2026-08-20, which
    # was the whole term missing rather than the fraction being off.
    takes_condition_overload: true
    tick_rate: 1.0
    duration_seconds: 10.0
    radius_m: 2.5
    falloff_start_m: 0.0
    falloff_reduction: 0.0
    crit_chance: 0.15
    crit_multiplier: 2.0
    status_chance: 0.49
    stacking: stack

  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Mutalist Cernos | Toxin Cloud | 0% | Doesn't Work | N/A | 2.5 m
  #
  # ZERO IS A ROW, NOT AN OMISSION: the arcane does not apply to this
  # attack at all, and saying so is the difference between "checked" and
  # "nobody looked".
  compression:
    effectiveness: 0.00
    stacking: multiplies
    radius_calculation: doesnt_work
  damage: { impact: 369, puncture: 20.5, slash: 20.5 }   # total 410

unmodeled:
  - "the CATALOG gives this weapon's lingering its own Condition Overload row at 4100% of its base ('Mutalist Cernos | Charged AoE Toxin Cloud | AoE | 5 | 205 | 4100% | Adding'), and there is no per-part CO fraction here — `co_base_fraction` is one number per ENTRY. So the part takes the term at 100% of its own base and a status-stacking build is understated on it"
  - "the cloud also CONFUSES the enemies standing in it, turning them on each other for its duration (wiki) — that is crowd control, and this arena's enemies neither turn nor stop"
  - reason: silent_weapon

source:
  url: https://wiki.warframe.com/w/Mutalist_Cernos
