id: vectis_incarnon
name: Vectis (Incarnon Form)
slot: primary
class: sniper
form: incarnon

transform_group: vectis
transforms_from: vectis

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner: "灵化部分可以粗略"): transcribed from the
# wiki's table, with every clause the intake's rule engine did not recognise
# loaded as a NAMED INERT effect that the builder and the optimizer both print
# as "not modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
unmodeled:
  - "the Incarnon Form Embed AoE is not modelled — this form has more parts than this entry carries"

incarnon:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 5
    rounds_per_charge: 10
    max_rounds: 45
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 1      # = base reload time, unmodded

pseudo_reload:
  magazine: 45
  reload_seconds: 2.0

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 300
  fire_rate: 1.333
  multishot: 1.0
  ammo_cost: 1                  # of the 45-round charge pool
  crit_chance: 0.3
  crit_multiplier: 2.5
  status_chance: 0.3
  # GUARANTEED COLD, every shot — the wiki module's `ForcedProcs` for this
  # attack. WFCD's export carries no such field, so the bulk intake had no
  # source for it and this weapon under-reported its status. A type that is
  # always present is also a permanent +1 to Condition Overload's count.
  forced_procs: [cold]
  punch_through_m: 0.0
  damage: { cold: 5 }   # total 5
  # The radial part — rules in MECHANICS §7.
  radial:
    damage: { cold: 5 }   # total 5
    radius_m: 6.7
    falloff_start_m: 0
    falloff_reduction: 0
    # Guaranteed COLD on the explosion (wiki module).
    forced_procs: [cold]
    crit_chance: 0.3
    crit_multiplier: 2.5
    status_chance: 0.3
    # NOT DECLARED: no CO catalog row for this weapon, so the radial
    # takes the engine's default — no Condition Overload on an explosion.

# incarnon_evolutions: see data/weapons/primary/vectis.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Vectis_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form" and "Incarnon Form Headshot AoE"
