id: corinth_prime_airburst
name: Corinth Prime
# THE AIR BURST: a lobbed round detonating in 9.8 metres.
inherits: corinth_prime
form: alt_fire
transform_group: corinth_prime

introduced: "27.3.6"

# see notes: inherited_co_catalog_gives_2
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 6.0
    max_deg: 16.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 50
  fire_rate: 0.667
  multishot: 1.0
  ammo_cost: 4
  crit_chance: 0.04
  crit_multiplier: 1.6
  status_chance: 0.5
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # see notes: no_range_row_attack_2
  #
  #   Corinth (Corinth Prime) | Alt-Fire + AoE | 100% | Multiplies |
  #   Snapshot
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 100 }   # total 100
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 9.8
    falloff_start_m: 0.0
    falloff_reduction: 0.9
    crit_chance: 0.04
    crit_multiplier: 1.6
    status_chance: 0.5
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 2200 }   # total 2200

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Corinth_Prime
