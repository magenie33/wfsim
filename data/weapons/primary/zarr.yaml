id: zarr
name: Zarr
slot: primary
# CANNON MODE: a mortar round with a 4.9 m blast that then throws six cluster
# bombs. The arsenal shows it (`_TooltipAttackDisplay: 2`), and the Kuva variant
# is this weapon rebuilt.
class: launcher
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: zarr
mod_pools: [primary, rifle]   # CompatibilityTags ASSAULT_AMMO, PROJECTILE, AOE, SINGLESHOT
mastery_rank: 7
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 100.0
disposition: 1.15           # riven disposition
polarities: [madurai]
exilus_polarity: madurai
riven_family: Zarr
traits: [grineer]
introduced: "19"
internal_name: /Lotus/Weapons/Grineer/LongGuns/GrnCannon/GrnCannonWeapon
noise: alarming
ammo_type: primary
ammo_max: 60
ammo_pickup: 9
magazine: 3
reload_seconds: 2.25

# see notes: condition_overload_no_row_3
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 40
  fire_rate: 1.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.17
  crit_multiplier: 2.5
  status_chance: 0.29
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # see notes: no_range_row_attack_2
  #
  #   Zarr (Kuva Zarr) | Cannon Mode + AoE | 100% | Multiplies | Snapshot |
  #   4.9 m
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 25 }   # total 25
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 4.9
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    crit_chance: 0.17
    crit_multiplier: 2.5
    status_chance: 0.29
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 175 }   # total 175

  # SIX BOMBLETS — "then splits into 6 smaller bomblets that rain down on the
  # point of impact", each "dealing 50 Blast damage within a small radius".
  # Module attacks 3 and 4, which carry their OWN crit and status rather than
  # the shell's.
  #
  # THE BOMBLET'S FALLOFF IS THE PAGE'S: "Explosion and bomblets have linear
  # Damage Falloff from 100% to 50% from central impact", which names the
  # bomblets rather than sweeping them in — the same sentence the Phantasma's
  # page writes of its explosion ALONE, where the bomblets then have none. The
  # module's attack 4 says `Reduction = 0.9` and loses: page before module
  # (docs/DATA_SOURCES.md).
  cluster:
    count: 6
    damage: { impact: 15.0 }
    crit_chance: 0.15
    crit_multiplier: 2.0
    status_chance: 0.2
    radial:
      damage: { blast: 50.0 }
      radius_m: 3.0
      falloff_start_m: 0.0
      falloff_reduction: 0.5
      crit_chance: 0.15
      crit_multiplier: 2.0
      status_chance: 0.1

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger
  - reason: cluster_bomblet_co
    row: "Zarr | Cannon Child Bomb | Projectile | 15 | 25 | 167% | Adding"

source:
  url: https://wiki.warframe.com/w/Zarr
