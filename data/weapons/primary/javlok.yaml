  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { heat: 160 }   # total 160
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 2.4
    falloff_start_m: 0.0
    falloff_reduction: 0.3
    crit_chance: 0.2
    crit_multiplier: 2.0
    status_chance: 0.25
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { heat: 120 }   # total 120

