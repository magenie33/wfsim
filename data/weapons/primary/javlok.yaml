id: javlok
name: Javlok
slot: primary
# A SPEARGUN THAT SHOOTS FIRE. The charged shot is a 2.4 m Heat blast; the
# alternate THROWS the spear itself for a six-metre one.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: javlok
mod_pools: [primary, rifle]   # CompatibilityTags PROJECTILE, AOE, IMPACTEXPLODE
mastery_rank: 7
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 100.0
disposition: 1.3            # riven disposition
polarities: [madurai, madurai]
exilus_polarity: naramon
riven_family: Javlok
traits: [grineer]
introduced: "19.4"
internal_name: /Lotus/Weapons/Grineer/LongGuns/GrnFlameSpear/GrnFlameSpear
noise: alarming
ammo_type: primary
ammo_max: 150
ammo_pickup: 60
magazine: 6
reload_seconds: 1.9

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20)
# — ordinary Additive at the full +100%. The catalog gives a class PER
# ATTACK and none of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 150
  fire_rate: 3.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.25
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { heat: 160 }   # total 160
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 2.4
    falloff_start_m: 0.0
    falloff_reduction: 0.3
    crit_chance: 0.2
    crit_multiplier: 2.0
    status_chance: 0.25
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { heat: 120 }   # total 120

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Javlok
