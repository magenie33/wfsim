id: harpak_harpoon
name: Harpak
# THE HARPOON: 100 damage with a guaranteed Puncture proc, at 1.5 a second, and
# a stated 40 m reach.
inherits: harpak
form: alt_fire
transform_group: harpak

introduced: "17.0"

# see notes: condition_overload_catalog_names
#
#   Harpak | Alt-fire | Projectile | 100 | 100 | 100% | Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 60
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2.3
  status_chance: 0.13
  punch_through_m: 0.0
  # A GUARANTEED PUNCTURE PROC — the module's ForcedProcs.
  forced_procs: [puncture]
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 40.0 m" on this attack.
  range_m: 40.0
  damage: { impact: 40, puncture: 50, slash: 10 }   # total 100

unmodeled:
  - "the harpoon 'can reel enemies in close and knock them down', pull flyers out of the air and interrupt enemy casting (wiki) — every one of those is crowd control, and this arena's enemies are neither moved nor interrupted"

source:
  url: https://wiki.warframe.com/w/Harpak
