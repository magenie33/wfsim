id: panthera_alt
name: Panthera
# THE DEPLOYED SAWBLADE: 100 a tick at two ticks a second, six metres out, with
# a 35% status chance and double the primary's crit chance.
inherits: panthera
form: alt_fire
transform_group: panthera

introduced: "15.10"

# see notes: inherited_co_catalog_gives
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: held
  shot_type: hit_scan
  fire_rate: 2
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2.0
  status_chance: 0.35
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 6.0 m" on this attack.
  range_m: 6.0
  damage: { impact: 10, puncture: 10, slash: 80 }   # total 100

unmodeled:
  - reason: client_ammo_runtime
  - "The sawblade is deployed 6 m in front of the wielder and stays there; the engine fires it like a beam at the target, so if the enemy is not on that spot the number reads high."
  - "It uses ammo only when dealing damage (wiki); reserves are infinite here, so this changes nothing."

source:
  url: https://wiki.warframe.com/w/Panthera

