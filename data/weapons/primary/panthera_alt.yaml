id: panthera_alt
name: Panthera
# THE DEPLOYED SAWBLADE: 100 a tick at two ticks a second, six metres out, with
# a 35% status chance and double the primary's crit chance.
inherits: panthera
form: alt_fire
transform_group: panthera

introduced: "15.10"

# see notes: inherited_co_catalog_gives
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: held
  shot_type: hit_scan
  fire_rate: 2
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2.0
  status_chance: 0.35
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 6.0 m" on this attack.
  range_m: 6.0
  damage: { impact: 10, puncture: 10, slash: 80 }   # total 100

unmodeled:
  - "the sawblade is DEPLOYED six metres in front of the wielder and stays there — it is not a beam fired at a target, and this engine models it as one, so a fight where the enemy is not standing on that spot is overstated here"
  - "it 'only consumes ammo when dealing damage' and 'can be deployed without consequence when no targets exist' (wiki) — an ammo economy this sim's infinite reserves make invisible"
  - "Disarming Purity, the Panthera-exclusive augment — a weapon-exclusive card outside the pools this roster loads"

source:
  url: https://wiki.warframe.com/w/Panthera
