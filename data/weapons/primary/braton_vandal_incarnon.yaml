id: braton_vandal_incarnon
name: Braton Vandal (Incarnon Form)
slot: primary
class: rifle
form: incarnon

# TWO WEAPONS MODEL: second entry of the transform group — see
# data/weapons/primary/braton_vandal.yaml for the base form and the decision.
transform_group: braton_vandal
transforms_from: braton_vandal

# see notes: incarnon_transformation_economy_wiki
gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 20
    rounds_per_charge: 10
    max_rounds: 200
    # see notes: charge_rules
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 1.75      # = base reload time, unmodded

# see notes: sim_convenience_with_gauge
pseudo_reload:
  magazine: 200
  reload_seconds: 2.75   # transmute out (1.0) + in (1.75), unmodded

co_behavior: additive_with_base_damage

# see notes: two_attack_parts_incarnon
attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.3
    max_deg: 0.7
  trigger: auto
  shot_type: hit_scan
  fire_rate: 4.67
  multishot: 1.0
  ammo_cost: 1                  # of the separate 200-round charge pool
  crit_chance: 0.38
  crit_multiplier: 3.2
  status_chance: 0.22
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, Incarnon Form: "Range: 300.0 m", Hit-Scan (the 3.0 m AoE sub-block is a RADIUS)
  range_m: 300.0
  damage: { impact: 26.0, puncture: 2.6, slash: 36.4 }   # total 65
  # The radial (AoE) part — rules in MECHANICS §7, plus the two this entry
  # declares for itself, both from the CO catalog's Braton row.
  # PRIMARY COMPRESSION's row (docs/CATALOGS.md §2): 3.0 m -> +240%, ADDS.
  compression:
    effectiveness: 1.00
    stacking: adds
    radius_calculation: snapshot

  radial:
    # see notes: terminal_blast_form_carries
    blast_kind: terminal
    damage: { heat: 65.0 }
    radius_m: 3.0
    falloff_start_m: 0.0
    falloff_reduction: 0.1      # "100% to 90% from central impact"
    crit_chance: 0.38
    crit_multiplier: 3.2
    status_chance: 0.22
    # see notes: co_explosion_second_family
    takes_condition_overload: true
    # see notes: fires_once_per_pull
    takes_multishot: false

# incarnon_evolutions: see data/weapons/primary/braton_vandal.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Braton_Incarnon_Genesis
  # see notes: attack_stats_from_wiki

