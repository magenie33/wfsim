id: stradavar
name: Stradavar
slot: primary
# FULL AUTO FOR VOLUME, SEMI-AUTO FOR PUNCTURE. The automatic mode is 28 a shot
# spread evenly; the semi is 50 a shot with 60% of it Puncture, at half the fire
# rate and a wider crit chance. The arsenal shows the automatic.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: stradavar
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO
mastery_rank: 8
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
# NO ACCURACY ROW — the module states none for this weapon.
disposition: 1.1            # riven disposition
polarities: [madurai, madurai]
exilus_polarity: naramon
riven_family: Stradavar
traits: [tenno]
introduced: "18.11"
internal_name: /Lotus/Weapons/Tenno/LongGuns/TennoTommyGun/TennoTommyGunRifle
noise: alarming
ammo_type: primary
ammo_max: 540
ammo_pickup: 80
magazine: 65
reload_seconds: 2

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%. The catalog gives a class PER ATTACK
# and neither of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 6.0
    max_deg: 8.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 10
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.24
  crit_multiplier: 2.0
  status_chance: 0.12
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  damage: { impact: 9.8, puncture: 9.8, slash: 8.4 }   # total 28

source:
  url: https://wiki.warframe.com/w/Stradavar
