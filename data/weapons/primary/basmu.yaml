id: basmu
name: Basmu
slot: primary
# A SENTIENT RIFLE whose rounds carry a 1.7 m Electricity blast, and whose
# alternate fire is a held beam.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: basmu
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO, PROJECTILE, AOE, BATTERY
mastery_rank: 11
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items, which DISAGREES on one field:
# WFCD carries the PARTIAL reload, this is the wiki's full one. The wiki wins (data/README.md), and
# `scripts/audit_weapon_stats.py` carries the divergence with its reason
# so it cannot be mistaken for a transcription error.
accuracy: 20.0
disposition: 1.2            # riven disposition
polarities: [madurai]
exilus_polarity: madurai
riven_family: Basmu
traits: [sentient]
introduced: "27.3"
internal_name: /Lotus/Weapons/Sentients/SentRifleNewWar/SentRifleNewWarGun
noise: alarming
ammo_type: primary
ammo_max: 0
ammo_pickup: 0
magazine: 21
reload_seconds: 2.5

# Condition Overload: THE CATALOG NAMES THIS ATTACK. Verbatim
# (docs/CATALOGS.md §1):
#
#   Basmu | Main-fire | Projectile | 39 | 39 | 100% | Multiplying
#
# THIS ENTRY READ ADDING AT 100% UNTIL 2026-08-20, which was the
# ordinary class assumed because nobody had opened the catalog for this
# weapon — the check was run against our own transcription of it, which
# only ever carried the rows the roster already had.
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 10.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 12
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.15
  crit_multiplier: 2.0
  status_chance: 0.29
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Basmu | Primary Fire + AoE | 100% | Multiplies | Snapshot | 1.7 m |
  #   +136%
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { electricity: 39 }   # total 39
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 1.7
    falloff_start_m: 0.0
    falloff_reduction: 0.2
    crit_chance: 0.15
    crit_multiplier: 2.0
    status_chance: 0.29
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { heat: 19 }   # total 19

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Basmu
