id: lanka_uncharged
name: Lanka
# see notes: form_of_its_weapon_inherits
inherits: lanka
form: base
transform_group: lanka

# No CO catalog row, so the ordinary class (absence means ORDINARY).
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  # A THIRD-SECOND DRAW for 200 instead of 525 — worth it only when the target
  # dies to 200, which against this roster's targets it does not.
  charge_seconds: 0.33
  shot_type: projectile
  projectile_speed_mps: 200
  fire_rate: 1.0
  multishot: 1.0
  ammo_cost: 1
  # THE PARTIAL CHARGE CRITS LESS. "Can be fired after charging for at least
  # 33% of maximum charge, but with reduced damage AND CRITICAL CHANCE"
  # (wiki) — 20% here against the full draw's 25%. It carried the full
  # draw's figure until 2026-08-20.
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.25
  # The page's own list names it: "Lanka".
  # see notes: infinite_body_punch_through
  punch_through_m: infinite
  damage: { electricity: 200.0 }
unmodeled:
  - reason: sniper_combo_miss
    seconds: 6
  - reason: zoom_steps

source:
  url: https://wiki.warframe.com/w/Lanka
