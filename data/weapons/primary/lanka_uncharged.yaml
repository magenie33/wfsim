id: lanka_uncharged
name: Lanka
# A FORM OF ITS WEAPON: everything below that describes the WEAPON
# rather than this shot is inherited from `lanka`, and only what
# DIFFERS is written here. See `weapons_data::INHERITED`.
inherits: lanka
form: base
transform_group: lanka

# No CO catalog row, so the ordinary class (absence means ORDINARY).
co_behavior: additive_with_base_damage

attack:
  trigger: semi_auto
  # A THIRD-SECOND DRAW for 200 instead of 525 — worth it only when the target
  # dies to 200, which against this roster's targets it does not.
  charge_seconds: 0.33
  shot_type: projectile
  projectile_speed_mps: 200
  fire_rate: 1.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2.0
  status_chance: 0.25
  punch_through_m: 1.5
  damage: { electricity: 200.0 }
unmodeled:
  - "a MISSED shot does not drop the combo counter here — this arena has no distance and every shot lands, so the counter only ever decays through its 6 s timer, which runs slightly generous"
  - "the innate 1.5 m punch-through is not modelled — this arena has one target, so it changes no number"
  - "damage falloff from 400 m to 600 m (down to 50% of full damage) is not modelled — this arena has no distance, so every shot lands at point blank"
  - "the LOWER zoom levels are not modelled — this arena has no field of view to trade for magnification, so the scope always sits at its top level and its best buff"

source:
  url: https://wiki.warframe.com/w/Lanka
