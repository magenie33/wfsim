id: basmu_beam
name: Basmu
# THE HELD BEAM: a continuous discharge, and the half of the weapon the primary
# fire's magazine pays for.
inherits: basmu
form: alt_fire
transform_group: basmu

introduced: "27.3"

# see notes: inherited_co_catalog_gives_2
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 24.0
    max_deg: 42.0
  trigger: held
  shot_type: hit_scan
  fire_rate: 12
  multishot: 2.0
  ammo_cost: 1
  crit_chance: 0.02
  crit_multiplier: 4.8
  status_chance: 0.3
  punch_through_m: 0.0
  # see notes: no_range_row_attack
  damage: { electricity: 12 }   # 12 a pellet, 24 a shot

  range_m: 9
  # Twin 9 m beams chaining up to 5 enemies within 7 m at 0.5^n damage (wiki Basmu).
  # Client ramp climbs 20% -> 100% over 0.5 s; cooldown divisor 2 decays in 1.0 s after 0.8 s idle.
  beam:
    range_m: 9.0
    damage_radius_m: 0.0
    radius_takes_multishot: false
    chain:
      hops: 5
      range_m: 7.0
      damage_per_hop: 0.50
      compounds: true
      origin: radius_targets
    ramp:
      rise_seconds: 0.5
      cooldown_delay_seconds: 0.8
      cooldown_divisor: 2.0
      per_target: true
beam_ramp_floor: 0.2
source:
  url: https://wiki.warframe.com/w/Basmu
battery:
  regen_per_second: 42.0
  delay_empty_seconds: 2.0
  delay_partial_seconds: 0.2

# see notes: client_primary_calibration
