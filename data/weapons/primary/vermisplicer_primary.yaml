# Vermisplicer, as a PRIMARY — one chamber, two roster entries;
# data/kitguns/README.md says why the slot is the weapon.
#
# see notes: kitgun_entry_is_default_assembly
#
# A TENDRIL THAT SPLITS: "Long-range proboscis attaches to a target and then
# splits off to attack up to three more enemies." The GRIP sets the reach (30 m
# on Brash to 16 m on Tremor), and `spec_assembled` composes it into
# `beam.range_m`.
id: vermisplicer_primary
name: Vermisplicer
wiki_name: Vermisplicer
slot: primary
weapon_type: primary
class: rifle
form: base
default_form: true
# "Uses Rifle mods" (wiki Vermisplicer §Primary, verbatim).
mod_pools: [primary, rifle]
mastery_rank: 0
max_rank: 30

# THE CHAMBER PART DE SHIPS, and the join key to every external dataset.
# BOTH SLOT ENTRIES CARRY IT: a Catchmoon is one chamber, and which slot a
# grip puts it in is ours to model, not a second item to trade.
internal_name: /Lotus/Weapons/Infested/Pistols/InfKitGun/Barrels/InfBarrelBeam/InfModularBarrelBeamPart
kitgun: vermisplicer_primary
transform_group: vermisplicer_primary

disposition: 1.2
riven_family: Vermisplicer
# see notes: kitgun_riven_is_the_chambers
riven_class: pistol
traits: [infested]

polarities: []
exilus_polarity: madurai
introduced: "29.5"
noise: alarming
ammo_type: primary
ammo_max: 90
ammo_pickup: 40
accuracy: 80

magazine: 51
reload_seconds: 2.1

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 1
    max_deg: 1.5
  trigger: held
  shot_type: hit_scan
  fire_rate: 12
  multishot: 1.0
  ammo_cost: 0.5
  crit_chance: 0.25
  crit_multiplier: 2
  status_chance: 0.25
  punch_through_m: 0.0
  # THE SPLIT. "Upon striking an enemy, the tendril chains up to 3 enemies
  # within 6 meters of the main target. Each tendril does 70% of the main
  # tendril's damage" — of the MAIN one, so it does not compound, the Kuva
  # Nukor's shape. "Only 1 enemy hit by the primary beam will create the chain
  # beams", so the beam's own target seeds it.
  beam:
    # The default grip's reach; an assembly replaces it with its own grip's.
    range_m: 30
    damage_radius_m: 0.0
    radius_takes_multishot: false
    chain:
      hops: 3
      range_m: 6.0
      damage_per_hop: 0.7
      compounds: false
      origin: beam_target
  damage: { impact: 5, puncture: 6, slash: 10, toxin: 12 }

unmodeled:
  - "The three tendrils fan out within 6 m of the main target (page); here the chain hops 6 m from each previous enemy. Against a tight group the two agree; an enemy 6-12 m from the first is reached here and not in game."
  - "With punch through, chains come only from the furthest target the beam hits (page); here every body the beam crosses starts its own chain, so the number reads high."
  - "Chains skip enemies already hit by the main beam (page); here a chain can hit a body the beam passed through, so the number reads high."
  - "The tendril auto-targets, with a noticeable delay between firing and dealing damage while ammo is spent (page); the delay is not modelled."

source:
  url: https://wiki.warframe.com/w/Vermisplicer
  module: https://wiki.warframe.com/w/Module:Weapons/data/modular
