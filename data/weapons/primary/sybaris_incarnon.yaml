id: sybaris_incarnon
name: Sybaris (Incarnon Form)
slot: primary
class: rifle
form: incarnon

transform_group: sybaris
transforms_from: sybaris

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner: "灵化部分可以粗略"): transcribed from the
# wiki's table, with every clause the intake's rule engine did not recognise
# loaded as a NAMED INERT effect that the builder and the optimizer both print
# as "not modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

incarnon:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 25
    rounds_per_charge: 8
    max_rounds: 200
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2      # = base reload time, unmodded
  transmute_out_seconds: 1.0     # MEASURED on Dual Toxocyst (M9)

pseudo_reload:
  magazine: 200
  reload_seconds: 3.0

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  trigger: burst
  shot_type: hit_scan
  fire_rate: 3.33
  multishot: 1.0
  ammo_cost: 1                  # of the 200-round charge pool
  crit_chance: 0.2
  crit_multiplier: 3
  status_chance: 0.2
  # GUARANTEED BLAST, every shot — the wiki module's `ForcedProcs` for this
  # attack. WFCD's export carries no such field, so the bulk intake had no
  # source for it and this weapon under-reported its status. A type that is
  # always present is also a permanent +1 to Condition Overload's count.
  forced_procs: [blast]
  punch_through_m: 0.0
  damage: { impact: 29.7, slash: 30.6, puncture: 29.7 }   # total 90.0

# incarnon_evolutions: see data/weapons/primary/sybaris.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Sybaris_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"
