id: battacor_charged
name: Battacor
# THE SECONDARY FIRE: a 0.4 s charge, hit-scan, with an explosion in 3.4 m.
inherits: battacor
form: charged
transform_group: battacor

introduced: "24"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of this
# weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  shot_type: hit_scan
  fire_rate: 5
  charge_seconds: 0.4
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.34
  crit_multiplier: 3.0
  status_chance: 0.08
  # THE WEAPON'S OWN PUNCH THROUGH. An AoE attack takes no punch-through
  # MODS (MECHANICS §13), which `loadout::resolve` decides from the attack's
  # shape — the INNATE metres are the weapon's and are kept. They were a zero
  # here until 2026-08-20, which was the mod rule applied to the wrong half.
  # 2 m — the wiki module's figure for this attack. The page's prose does not
  # mention it; the infobox renders from the same row.
  punch_through_m: 2.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Battacor | Alt-Fire + AoE | 100% | Adds | Constant Check
  compression:
    effectiveness: 1.00
    stacking: adds
    radius_calculation: constant_check
  damage: { radiation: 208 }   # total 208
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 3.4
    falloff_start_m: 0.0
    falloff_reduction: 0.4
    crit_chance: 0.34
    crit_multiplier: 3.0
    status_chance: 0.5
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { radiation: 208 }   # total 208

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Battacor
