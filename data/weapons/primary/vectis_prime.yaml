id: vectis_prime
name: Vectis Prime
slot: primary
class: sniper
form: base
default_form: true
mod_pools: [primary, rifle, sniper]
mastery_rank: 14
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: vectis_prime
transforms_to: vectis_prime_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
unmodeled:
  - reason: sniper_combo_miss
    seconds: 2
# THE TWO SNIPER MECHANICS — see `weapons_data::SniperCombo` and `ScopeSpec`.
#
# "The Vectis Prime has the largest shot combo requirement of the sniper
# rifles, needing 5 shots to initiate the 1.5x damage multiplier" (wiki) — so
# the Prime is not strictly the better gun here: it pays five hits for what the
# ordinary Vectis gets for one, which at a 2-round magazine is two reloads.
sniper_combo:
  min: 5
scope:
  magnification: 6.0
  headshot_damage: 0.6

accuracy: 13.33
disposition: 1
polarities: [madurai, naramon]
exilus_polarity: naramon
riven_family: Vectis
traits: [incarnon, prime]
introduced: "Update 16.11"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeVectis/PrimeVectisRifle
noise: alarming
ammo_type: primary
ammo_max: 72
ammo_pickup: 15
magazine: 2
reload_seconds: 0.85

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 15
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 2.67
  # NOT MODELLED — the arena has no distance, so this weapon is
  # simulated at point blank. Recorded because the RIVEN pool reads
  # it: a hitscan weapon that lists a falloff still rolls Projectile
  # Speed, which scales the whole range (wiki `Projectile Speed`).
  falloff:
    start_m: 400
    end_m: 600
    reduction: 0.5   # fraction KEPT past end_m
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.3
  crit_multiplier: 2
  status_chance: 0.3
  punch_through_m: 0.0
  damage: { impact: 140, slash: 52.5, puncture: 157.5 }   # total 350.0

# incarnon_evolutions: definitions live in data/evolutions/vectis_prime_*.yaml.

source:
  url: https://wiki.warframe.com/w/Vectis_Prime
