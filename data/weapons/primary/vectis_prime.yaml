id: vectis_prime
name: Vectis Prime
slot: primary
class: sniper
form: base
default_form: true
mod_pools: [primary, rifle, sniper]
mastery_rank: 14
max_rank: 30

# see notes: two_weapons_model_base
transform_group: vectis_prime
transforms_to: vectis_prime_incarnon

# see notes: bulk_intake_stats_are
unmodeled:
  - reason: sniper_combo_miss
    seconds: 2
# THE TWO SNIPER MECHANICS — see `weapons_data::SniperCombo` and `ScopeSpec`.
#
# "The Vectis Prime has the largest shot combo requirement of the sniper
# rifles, needing 5 shots to initiate the 1.5x damage multiplier" (wiki) — so
# the Prime is not strictly the better gun here: it pays five hits for what the
# ordinary Vectis gets for one, which at a 2-round magazine is two reloads.
sniper_combo:
  min: 5
scope:
  magnification: 6.0
  headshot_damage: 0.6

accuracy: 13.3
disposition: 1
polarities: [madurai, naramon]
exilus_polarity: naramon
riven_family: Vectis
traits: [incarnon, prime]
introduced: "Update 16.11"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeVectis/PrimeVectisRifle
noise: alarming
ammo_type: primary
ammo_max: 72
ammo_pickup: 15
magazine: 2
reload_seconds: 0.85

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 15
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 2.67
  # see notes: modelled_arena_has_no
  falloff:
    start_m: 400
    end_m: 600
    reduction: 0.5   # fraction KEPT past end_m
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.3
  crit_multiplier: 2
  status_chance: 0.3
  # "Innate 1 meter punch through" (wiki).
  punch_through_m: 1.0
  # see notes: wall_ramp_full_damage_5
  range_m: 1000.0
  damage: { impact: 140, slash: 52.5, puncture: 157.5 }   # total 350.0

# incarnon_evolutions: definitions live in data/evolutions/vectis_prime_*.yaml.

source:
  url: https://wiki.warframe.com/w/Vectis_Prime
