id: vectis_prime_incarnon
name: Vectis Prime (Incarnon Form)
slot: primary
weapon_type: primary
class: sniper
form: incarnon

transform_group: vectis_prime
transforms_from: vectis_prime

# see notes: bulk_intake_stats_are

# THE FORM IS STILL A SNIPER (M117): its direct hit builds the shot combo
# counter it shares with the base form, every part of the shot pays it, and a
# scoped headshot takes the scope's +60% — 4452 = 927.5 x 3 x 1.6.
sniper_combo:
  min: 5
scope:
  magnification: 6.0
  headshot_damage: 0.6

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 5
    rounds_per_charge: 10
    max_rounds: 45
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 0.85      # = base reload time, unmodded

pseudo_reload:
  magazine: 45
  reload_seconds: 1.85

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 15
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 300
  fire_rate: 1.333
  multishot: 1.0
  ammo_cost: 1                  # of the 45-round charge pool
  crit_chance: 0.35
  crit_multiplier: 3
  status_chance: 0.3
  # GUARANTEED COLD, every shot — the wiki module's `ForcedProcs` for this
  # attack. A type that is always present is also a permanent +1 to Condition
  # Overload's count.
  forced_procs: [cold]
  punch_through_m: 0.0
  damage: { cold: 150 }   # total 150
  # PRIMARY COMPRESSION's row (docs/CATALOGS.md §2): FOUR PER CENT: 0.1 m -> +8%, "uses embed radial instead of headshot explosion".
  # …AND ITS STACKING COLUMN READS `N/A`, which is not an answer. Verbatim:
  #   Vectis (Prime) | Incarnon Form + AoE | 4% | N/A | Snapshot | 0.1 m | +8%
  # Every other row says Multiplies or Adds; this one declines. `multiplies`
  # below is THIS REPO'S ASSUMPTION and it is live rather than inert — 4% is not
  # 0%, so the choice moves a number. It was never transcribed at all until the
  # catalog moved on 2026-08-19 and every row was re-read.
  compression:
    effectiveness: 0.04
    stacking: multiplies
    radius_calculation: snapshot
    # THE ROW READS A RADIUS THIS WEAPON DOES NOT HAVE. Its Base Radius column
    # is 0.1 m against the 6.7 m headshot explosion below, and the wiki's note
    # says which one that is: the arcane takes the EMBED radial, not the
    # headshot explosion. 4% is the row's account of how far off that is, and it does not
    # reconstruct 0.1 from 6.7 — so the metres are declared and the percentage
    # stays the transcribed column it is. 0.8 x 0.1 = the table's +8%.
    reads_radius_m: 0.1

  # THE ORB EVERY LANDED ROUND LEAVES IN THE BODY IT HIT (wiki; measured M117).
  # It hits at once for 25 Cold with a guaranteed Cold proc; in a body it stays
  # 2.5 s and hits twice more, a second apart; in a head it hits no more and
  # explodes 0.4 s later in two simultaneous hits of 150 Cold. +200 base damage
  # reads 596 / 596 / 596 on a body and 1484 x 2 on a scoped head.
  embed:
    hit:
      damage: { cold: 25 }   # total 25
      radius_m: 0.5
      forced_procs: [cold]
      crit_chance: 0.35
      crit_multiplier: 3
      status_chance: 0.3
    body_every_seconds: 1.0
    body_more_hits: 2
    head_after_seconds: 0.4
    head_explosion_hits: 2
    explosion:
      damage: { cold: 150 }   # total 150
      radius_m: 6.7
      # "Headshot AoE has 70% damage falloff, dealing 30% damage at the edge".
      falloff_start_m: 0
      falloff_reduction: 0.7
      forced_procs: [cold]
      crit_chance: 0.35
      crit_multiplier: 3
      status_chance: 0.3
      # see notes: declared_no_co_catalog

# incarnon_evolutions: see data/weapons/primary/vectis_prime.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Vectis_Incarnon_Genesis
  # wiki module `Attacks[].AttackName`: "Incarnon Form" and "Incarnon Form Headshot AoE"
