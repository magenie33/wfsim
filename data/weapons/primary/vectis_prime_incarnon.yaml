id: vectis_prime_incarnon
name: Vectis Prime (Incarnon Form)
slot: primary
class: sniper
form: incarnon

transform_group: vectis_prime
transforms_from: vectis_prime

# see notes: bulk_intake_stats_are
unmodeled:
  - "the Incarnon Form Embed AoE is not modelled — this form has more parts than this entry carries"
  - "the sniper combo counter and the scope's headshot bonus are not modelled in this form — both are modelled on the base form, and no source states whether either survives the transform (the wiki notes only that you must UNZOOM to enter it)"

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 5
    rounds_per_charge: 10
    max_rounds: 45
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 0.85      # = base reload time, unmodded

pseudo_reload:
  magazine: 45
  reload_seconds: 1.85

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 15
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 300
  fire_rate: 1.333
  multishot: 1.0
  ammo_cost: 1                  # of the 45-round charge pool
  crit_chance: 0.35
  crit_multiplier: 3
  status_chance: 0.3
  # GUARANTEED COLD, every shot — the wiki module's `ForcedProcs` for this
  # attack. WFCD's export carries no such field, so the bulk intake had no
  # source for it and this weapon under-reported its status. A type that is
  # always present is also a permanent +1 to Condition Overload's count.
  forced_procs: [cold]
  punch_through_m: 0.0
  damage: { cold: 150 }   # total 150
  # The radial part — rules in MECHANICS §7.
  # PRIMARY COMPRESSION's row (docs/CATALOGS.md §2): FOUR PER CENT: 0.1 m -> +8%, "uses embed radial instead of headshot explosion".
  # …AND ITS STACKING COLUMN READS `N/A`, which is not an answer. Verbatim:
  #   Vectis (Prime) | Incarnon Form + AoE | 4% | N/A | Snapshot | 0.1 m | +8%
  # Every other row says Multiplies or Adds; this one declines. `multiplies`
  # below is THIS REPO'S ASSUMPTION and it is live rather than inert — 4% is not
  # 0%, so the choice moves a number. It was never transcribed at all until the
  # catalog moved on 2026-08-19 and every row was re-read.
  compression:
    effectiveness: 0.04
    stacking: multiplies
    radius_calculation: snapshot
    # THE ROW READS A RADIUS THIS WEAPON DOES NOT HAVE. Its Base Radius column
    # is 0.1 m against the 6.7 m explosion below, and the wiki's note says which
    # one that is: the arcane takes the EMBED radial, not the headshot
    # explosion. 4% is the row's account of how far off that is, and it does not
    # reconstruct 0.1 from 6.7 — so the metres are declared and the percentage
    # stays the transcribed column it is. 0.8 x 0.1 = the table's +8%.
    reads_radius_m: 0.1

  radial:
    damage: { cold: 150 }   # total 150
    radius_m: 6.7
    falloff_start_m: 0
    falloff_reduction: 0
    # Guaranteed COLD on the explosion (wiki module).
    forced_procs: [cold]
    crit_chance: 0.35
    crit_multiplier: 3
    status_chance: 0.3
    # see notes: declared_no_co_catalog

# incarnon_evolutions: see data/weapons/primary/vectis_prime.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Vectis_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form" and "Incarnon Form Headshot AoE"
