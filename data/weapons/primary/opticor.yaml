id: opticor
name: Opticor
slot: primary
# A TWO-SECOND CHARGE FOR THE HARDEST SINGLE SHOT IN THE ROSTER, with a
# six-metre explosion behind it. The charge is the arsenal's own display.
class: rifle
form: charged
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: opticor
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO, AOE, SINGLESHOT
mastery_rank: 14
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 100.0
disposition: 1.15           # riven disposition
polarities: [madurai]
exilus_polarity: naramon
riven_family: Opticor
traits: [corpus]
introduced: "15.0"
internal_name: /Lotus/Weapons/Corpus/LongGuns/CrpBFG/CrpBFG
noise: alarming
ammo_type: primary
ammo_max: 200
ammo_pickup: 40
magazine: 5
reload_seconds: 2

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20)
# — ordinary Additive at the full +100%. The catalog gives a class PER
# ATTACK and none of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  shot_type: hit_scan
  fire_rate: 1
  charge_seconds: 2
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2.5
  status_chance: 0.2
  # THE WEAPON'S OWN PUNCH THROUGH. An AoE attack takes no punch-through
  # MODS (MECHANICS §13), which `loadout::resolve` decides from the attack's
  # shape — the INNATE metres are the weapon's and are kept. They were a zero
  # here until 2026-08-20, which was the mod rule applied to the wrong half.
  # "Innate 1 meter punch through" (wiki).
  punch_through_m: 1.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Opticor (Opticor Vandal) | Primary Fire + AoE | 100% | Adds | Snapshot
  compression:
    effectiveness: 1.00
    stacking: adds
    radius_calculation: snapshot
  damage: { impact: 100, puncture: 850, slash: 50 }   # total 1000
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.6
    crit_chance: 0.2
    crit_multiplier: 2.5
    status_chance: 0.2
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { magnetic: 400 }   # total 400

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Opticor
