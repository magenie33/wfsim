id: opticor
name: Opticor
slot: primary
# A TWO-SECOND CHARGE FOR THE HARDEST SINGLE SHOT IN THE ROSTER, with a
# six-metre explosion behind it. The charge is the arsenal's own display.
class: rifle
form: charged
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: opticor
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO, AOE, SINGLESHOT
mastery_rank: 14
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 100.0
disposition: 1.15           # riven disposition
polarities: [madurai]
exilus_polarity: naramon
riven_family: Opticor
traits: [corpus]
introduced: "15.0"
internal_name: /Lotus/Weapons/Corpus/LongGuns/CrpBFG/CrpBFG
noise: alarming
ammo_type: primary
ammo_max: 200
ammo_pickup: 40
magazine: 5
reload_seconds: 2

# see notes: condition_overload_no_row_3
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  shot_type: hit_scan
  fire_rate: 1
  charge_seconds: 2
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2.5
  status_chance: 0.2
  # THE WEAPON'S OWN PUNCH THROUGH. An AoE attack takes no punch-through
  # MODS (MECHANICS §13), which `loadout::resolve` decides from the attack's
  # shape — the INNATE metres are the weapon's and are kept. They were a zero
  # here until 2026-08-20, which was the mod rule applied to the wrong half.
  # "Innate 1 meter punch through" (wiki).
  punch_through_m: 1.0
  # see notes: wall_ramp_full_damage_3
  range_m: 300.0
  # see notes: primary_compression_published_table
  #
  #   Opticor (Opticor Vandal) | Primary Fire + AoE | 100% | Adds | Snapshot
  compression:
    effectiveness: 1.00
    stacking: adds
    radius_calculation: snapshot
  damage: { impact: 100, puncture: 850, slash: 50 }   # total 1000
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.6
    crit_chance: 0.2
    crit_multiplier: 2.5
    status_chance: 0.2
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { magnetic: 400 }   # total 400
    # see notes: catalog_says_aoe_part
    #
    #   Opticor | Charged Hitscan Direct Hit Radial | Hitscan | 400 | 1000 | 250% | Adding
    #
    # The RELATIVE column is 250% and there is no per-part CO fraction —
    # `co_base_fraction` is one number per ENTRY and this entry's direct hit
    # has its own — so this part takes the term at 100% of its own base and
    # the difference is admitted below. It read FALSE until 2026-08-20, which
    # was the whole term missing rather than the fraction being off.
    takes_condition_overload: true

unmodeled:
  - "the CATALOG gives this weapon's radial its own Condition Overload row at 250% of its base ('Opticor | Charged Hitscan Direct Hit Radial | Hitscan | 400 | 1000 | 250% | Adding'), and there is no per-part CO fraction here — `co_base_fraction` is one number per ENTRY. So the part takes the term at 100% of its own base and a status-stacking build is understated on it"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Opticor
