id: boar
name: Boar
slot: primary
# THE BOAR PRIME'S BASE VARIANT, and the roster's first pair of them. Nothing
# here is a new mechanic — that is the point of entering it: the Prime already
# pinned every rule this weapon uses, so what this entry tests is whether a
# FAMILY costs anything beyond its numbers. It does not.
class: shotgun
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, shotgun]
grip_type: ""                # the data module records an empty GripType
mastery_rank: 2
max_rank: 30

# Weapon-level metadata (wiki `Module:Weapons/data/primary` cross-checked
# against the committed WFCD export, joined on internal name).
unmodeled:
  - "damage falloff from 15 m to 25 m (down to 50% of full damage) is not modelled — this arena has no distance, so every shot lands at point blank"

accuracy: 5                  # the page prints "Very Low" for this number
disposition: 1.45            # riven disposition (●●●●●) — HIGHER than the
                             # Prime's 1.34, which is the usual shape: the
                             # weaker weapon gets the bigger riven
polarities: []               # no innate main polarities (no `Polarities` key
                             # in the module's block, none in WFCD) — the same
                             # as the Prime
exilus_polarity: madurai
riven_family: Boar           # module `Family` — SHARED with the Boar Prime, so
                             # one riven fits both
traits: [tenno]
introduced: "Vanilla"        # in the game at launch (2012-10-25)
internal_name: /Lotus/Weapons/Tenno/Shotgun/FullAutoShotgun
noise: alarming              # IsSilent false
ammo_type: primary
ammo_max: 120
ammo_pickup: 40
magazine: 20
reload_seconds: 2.7

# Condition Overload: NO row in the wiki's CO catalog for this weapon, and the
# catalog's own header makes absence a POSITIVE statement — it lists "only
# discrepant attacks. Anything not listed should be assumed to be Additive with
# +100% bonus". Checked for BOTH forms and for the Prime at the same time
# (2026-08-05): the only Boar-family row in the whole table is none.
co_behavior: additive_with_base_damage

# ONE attack part. The Incarnon form is its own weapon entry (boar_incarnon),
# the way the Prime's is.
attack:
  trigger: auto
  shot_type: hit_scan
  fire_rate: 4.17
  # INNATE MULTISHOT — 8 pellets, and the damage below is PER PELLET. Same
  # convention as the Prime; see data/weapons/primary/boar_prime.yaml for why
  # the module's `Damage` block is one pellet's rather than the shot's total.
  multishot: 8.0
  ammo_cost: 1
  crit_chance: 0.10
  crit_multiplier: 1.5
  # PER PELLET (the shotgun status rework — "the UI now behaves to show the
  # reality that you are determining Status Chance per pellet"). The engine
  # rolls status per pellet already, so this goes in unmodified.
  status_chance: 0.075
  punch_through_m: 0.0
  # 12.1 / 3.3 / 6.6 — 22 total, against the Prime's 40. "Lowest base damage of
  # all pellet shotguns" is the page's own summary of it. Both sources agree
  # here, unlike the Prime, whose two sources disagreed about Puncture/Slash.
  # NOT MODELLED — the arena has no distance, so this weapon is
  # simulated at point blank. Recorded because the RIVEN pool reads
  # it: a hitscan weapon that lists a falloff still rolls Projectile
  # Speed, which scales the whole range (wiki `Projectile Speed`).
  falloff:
    start_m: 15
    end_m: 25
    reduction: 0.5   # fraction KEPT past end_m
  damage: { impact: 12.1, puncture: 3.3, slash: 6.6 }
  # Damage FALLOFF, hitscan: full damage to 15 m, decaying to 50% of it at 25 m
  # and beyond (module `Falloff`, Reduction 0.5). NOT READ by the engine — the
  # sim has no range — and recorded so a spatial model finds it. The Prime
  # keeps full damage 3 m further and floors 20 points lower (18–25 m, 0.7).
  falloff_start_m: 15.0
  falloff_end_m: 25.0
  falloff_reduction: 0.5
  # The cone one pull spreads over, in degrees (module MinSpread/MaxSpread).
  # NOT READ either: with one target and no geometry, spread decides nothing.
  spread_min_deg: 10.0
  spread_max_deg: 30.0

# TWO WEAPONS MODEL: this is the base form; the Incarnon form is a second
# weapon entry that this one transforms into.
transform_group: boar
transforms_to: boar_incarnon

# incarnon_evolutions (data/evolutions/boar_*.yaml) — FOUR tiers, and the SAME
# four the Boar Prime gets. One Boar Incarnon Genesis upgrades either weapon,
# and the wiki's evolution table gives every row a dash spanning both weapon
# columns, which is that table's way of saying the two do not differ.
# - { tier: 1, unlock: installing the Genesis,
#     options: [boar_evo1_incarnon_form] }
# - { tier: 2, unlock: complete a solo mission with this weapon equipped,
#     options: [boar_reified_bane, boar_fortress_salvo] }
# - { tier: 3, unlock: kill 100 enemies with this weapon's Incarnon Form,
#     options: [boar_ready_retaliation, boar_mercenary_chamber,
#     boar_practiced_grip] }
# - { tier: 4, unlock: kill 30 enemies without reloading,
#     options: [boar_elemental_balance, boar_critical_parallel,
#     boar_survivors_edge] }
#
# Installing it costs 20 Pathos Clamps, 60 Rune Marrow and 60 Tasoma Extract,
# or 120 platinum from Cavalero, once — and the ONE item covers whichever of
# the two weapons you put it on, not both.

source:
  url: https://wiki.warframe.com/w/Boar
