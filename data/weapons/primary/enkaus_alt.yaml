id: enkaus_alt
name: Enkaus
# THE ALTERNATE FIRE: a projectile with an eight-metre explosion behind it —
# the arsenal's own display for this weapon.
inherits: enkaus
form: alt_fire
transform_group: enkaus

introduced: "42"

# see notes: inherited_co_catalog_gives_2
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 1.0
    max_deg: 1.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 40
  fire_rate: 2
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.16
  crit_multiplier: 1.8
  status_chance: 0.32
  # THE WEAPON'S OWN PUNCH THROUGH. An AoE attack takes no punch-through
  # MODS (MECHANICS §13), which `loadout::resolve` decides from the attack's
  # shape — the INNATE metres are the weapon's and are kept. They were a zero
  # here until 2026-08-20, which was the mod rule applied to the wrong half.
  # 1 m — the wiki module's figure for this attack.
  punch_through_m: 1.0
  # see notes: no_range_row_attack_2
  #
  #   Enkaus | Alt-Fire + AoE | 0% | Doesn't Work | N/A
  #
  # see notes: zero_row_omission_arcane
  compression:
    effectiveness: 0.00
    stacking: multiplies
    radius_calculation: doesnt_work
  damage: { corrosive: 12, puncture: 4 }   # total 16
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 8.0
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    crit_chance: 0.16
    crit_multiplier: 1.8
    status_chance: 0.32
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { corrosive: 10, puncture: 4 }   # total 14

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Enkaus
