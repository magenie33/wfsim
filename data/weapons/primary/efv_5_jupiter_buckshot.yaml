  spread:
    min_deg: 24.0
    max_deg: 42.0
  trigger: charged_auto
  shot_type: hit_scan
  fire_rate: 7.8334
  charge_seconds: 1
  multishot: 11.0
  ammo_cost: 15
  crit_chance: 0.21
  crit_multiplier: 2.1
  status_chance: 0.0573
  punch_through_m: 0.0
  # A GUARANTEED CORROSIVE PROC — the module's ForcedProcs.
  forced_procs: [corrosive]
