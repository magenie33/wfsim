id: mutalist_quanta_orb
name: Mutalist Quanta
# THE ORB: a slow projectile that hangs where it lands and explodes in 4.4 m.
inherits: mutalist_quanta
form: alt_fire
transform_group: mutalist_quanta

introduced: "13.8"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of this
# weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 2.0
    max_deg: 6.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 5
  fire_rate: 10
  multishot: 1.0
  ammo_cost: 5
  crit_chance: 0.0
  crit_multiplier: 0.0
  status_chance: 1.0
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 2.0 m" on this attack.
  range_m: 2.0
  # NO DAMAGE FALLOFF — the module carries a window with a reduction of
  # ZERO for this attack, which is its way of saying there is none.
  damage: { radiation: 20 }   # total 20
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 4.4
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    crit_chance: 0.05
    crit_multiplier: 1.5
    status_chance: 0.39
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { toxin: 100 }   # total 100

unmodeled:
  - "the orb HANGS IN PLACE and damages what walks into it, and the primary fire can be shot THROUGH it for bonus damage (wiki) — a two-step interaction between the two modes, and this engine fires each mode on its own"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Mutalist_Quanta
