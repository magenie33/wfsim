id: prisma_gorgon
name: Prisma Gorgon
slot: primary
class: rifle
form: base
default_form: true
mod_pools: [primary, rifle, assault_rifle]
mastery_rank: 11
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: prisma_gorgon
transforms_to: prisma_gorgon_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
unmodeled:
  - reason: spool_rebuilds_after_reload
accuracy: 20
disposition: 1.3
polarities: []
exilus_polarity: naramon
riven_family: Gorgon
traits: [incarnon, prisma]
introduced: "Hotfix 15.11.1"
internal_name: /Lotus/Weapons/Grineer/LongGuns/VoidTraderGorgon/VTGorgon
noise: alarming
ammo_type: primary
ammo_max: 840
ammo_pickup: 80
magazine: 120
reload_seconds: 3

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 4
    max_deg: 6
  trigger: auto
  shot_type: hit_scan
  fire_rate: 14.17
  # …AND IT NEVER FIRES AT THAT RATE UNTIL THE 7th ROUND. VERBATIM (wiki):
  # "Fire rate starts at 20% of its listed value, and increases by
  # 13.33% per shot", and "Requires a spool-up of 7 shots before optimal fire
  # rate is achieved" — two statements of one mechanic, and they reconcile
  # exactly: 0.80 / 6.0 = 13.33% a shot, full from the 7th.
  # `over_shots` carries the span because it is the half that is exact;
  # the percentage is its rounded presentation.
  sustained_fire_rate:
    start: 0.20
    end: 1.00
    over_shots: 6.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.3
  crit_multiplier: 2.3
  status_chance: 0.15
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, Fully Spooled: "Range: 300.0 m", Hit-Scan
  range_m: 300.0
  damage: { impact: 17.25, slash: 2.3, puncture: 3.45 }   # total 23.0

# incarnon_evolutions: definitions live in data/evolutions/prisma_gorgon_*.yaml.

source:
  url: https://wiki.warframe.com/w/Prisma_Gorgon
