id: rubico
name: Rubico
slot: primary
class: sniper
form: base
default_form: true
mod_pools: [primary, rifle, sniper]
mastery_rank: 6
max_rank: 30

accuracy: 13.3
disposition: 0.95
polarities: []
exilus_polarity: madurai
riven_family: Rubico
internal_name: /Lotus/Weapons/Tenno/LongGuns/FiveShotSniper/FiveShotSniper
noise: alarming
magazine: 5
reload_seconds: 2.4
ammo_type: primary
ammo_max: 72
ammo_pickup: 15

# No CO catalog row, so the ordinary class (absence means ORDINARY).
co_behavior: additive_with_base_damage

# THE TWO SNIPER MECHANICS — see MECHANICS §7 §"THE SNIPER RIFLE".
#
# MINIMUM COMBO 1: the first landing hit already pays 1.5x, which is why this
# weapon is built around the counter rather than in spite of it.
sniper_combo:
  min: 1
# ITS SCOPE GRANTS A CRITICAL MULTIPLIER, not headshot damage — +35% at 3.5x
# and +50% at 6x. On a weapon whose base multiplier is 3.0x that is the whole
# reason it is a Rubico.
scope:
  magnification: 6.0
  crit_multiplier: 0.5
attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 15
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 2.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.30
  crit_multiplier: 3.0
  status_chance: 0.12
  punch_through_m: 1.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 1000.0 m", Hit-Scan — a sniper reaches far further than a rifle, which is why there is no class rule to shortcut
  range_m: 1000.0
  damage: { impact: 144.0, puncture: 27.0, slash: 9.0 }   # 180 total
unmodeled:
  - reason: sniper_combo_miss
    seconds: 2
  - reason: zoom_steps

source:
  url: https://wiki.warframe.com/w/Rubico
