id: strun_prime
name: Strun Prime
slot: primary
class: shotgun
form: base
default_form: true
mod_pools: [primary, shotgun]
mastery_rank: 14
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: strun_prime
transforms_to: strun_prime_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
unmodeled:
  - reason: reload_never_interrupted
accuracy: 9.09
disposition: 1.2
polarities: [naramon, madurai, madurai]
exilus_polarity: madurai
riven_family: Strun
traits: [incarnon, prime]
introduced: "Update 30.7"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeStrun/PrimeStrunWeapon
noise: alarming
ammo_type: primary
ammo_max: 120
ammo_pickup: 15
magazine: 10
reload_seconds: 4.6

# BY-ROUND RELOAD — a shell at a time, interruptible, and the magazine size
# is IN the reload time. That is the part that was missing: a magazine mod
# on this weapon buys capacity and PAYS for it in downtime, and modelling
# the reload as one flat block made Ammo Stock read as free (owner,
# 2026-08-08, calibrating the Felarx).
#
# the weapon's own page: 0.4 s a shell and a total 0.6 s of start-and-end
# delay; the split between the two ends is not published and only their sum
# reaches the number.
# They add up to the published total at a full magazine, which is the
# cross-check: 0.6 + 0.4 x 10 + 0 = 4.6.
reload_style: by_round
reload_start_s: 0.6
reload_per_shell_s: 0.4
reload_end_s: 0

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 7
    max_deg: 15
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 3.33
  # NOT MODELLED — the arena has no distance, so this weapon is
  # simulated at point blank. Recorded because the RIVEN pool reads
  # it: a hitscan weapon that lists a falloff still rolls Projectile
  # Speed, which scales the whole range (wiki `Projectile Speed`).
  falloff:
    start_m: 26
    end_m: 52
    reduction: 0.78   # fraction KEPT past end_m
  multishot: 12.0
  ammo_cost: 1
  crit_chance: 0.24
  crit_multiplier: 2.2
  status_chance: 0.0667
  punch_through_m: 0.0
  damage: { impact: 24.3, slash: 21.6, puncture: 8.1 }   # total 54.0

# incarnon_evolutions: definitions live in data/evolutions/strun_prime_*.yaml.

source:
  url: https://wiki.warframe.com/w/Strun_Prime
