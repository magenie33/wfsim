id: strun_prime
name: Strun Prime
slot: primary
weapon_type: primary
class: shotgun
form: base
default_form: true
mod_pools: [primary, shotgun]
mastery_rank: 14
max_rank: 30

# see notes: two_weapons_model_base
transform_group: strun_prime
transforms_to: strun_prime_incarnon

# see notes: bulk_intake_stats_are
unmodeled:
  - reason: client_accuracy_runtime
  - reason: reload_never_interrupted
accuracy: 9.09
disposition: 1.2
polarities: [naramon, madurai, madurai]
exilus_polarity: madurai
riven_family: Strun
traits: [incarnon, prime]
introduced: "Update 30.7"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeStrun/PrimeStrunWeapon
noise: alarming
ammo_type: primary
ammo_max: 120
ammo_pickup: 15
magazine: 10
reload_seconds: 4.6

# see notes: round_reload_shell_at
#
# Parsed phases: 0.4 s start + 10 * 0.4 s loop + 0.2 s end.
reload_style: by_round
reload_start_seconds: 0.4
reload_per_shell_seconds: 0.4
reload_end_seconds: 0.2

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 7.0
    max_deg: 15.0
    sampling:
      horizontal_ratio: 0.5
      uniform: true
      hip_min_deg: 9.0
      hip_max_deg: 17.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 3.33333333333333
  # see notes: falloff_feeds_the_riven_pool
  falloff:
    start_m: 26.0
    end_m: 52.0
    reduction: 0.777777773333
  multishot: 12.0
  ammo_cost: 1
  crit_chance: 0.24
  crit_multiplier: 2.2
  status_chance: 0.0666666666666667
  # "Innate 0.8 meter punch through" (wiki) — one of the two things the
  # Prime gained over the Strun.
  punch_through_m: 0.8
  # see notes: wall_ramp_full_damage_2
  range_m: 300.0
  damage: { impact: 24.3, slash: 21.6, puncture: 8.1 }   # total 54.0

# incarnon_evolutions: definitions live in data/evolutions/strun_prime_*.yaml.

source:
  url: https://wiki.warframe.com/w/Strun_Prime

