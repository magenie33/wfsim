id: cedo_alt
name: Cedo
# THE GLAIVE: a thrown disc with a six-metre explosion behind it.
inherits: cedo
form: alt_fire
transform_group: cedo

introduced: "29.6"

# see notes: inherited_co_catalog_gives_2
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 1.0
    max_deg: 1.5
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 60
  fire_rate: 1
  multishot: 1.0
  ammo_cost: 0
  crit_chance: 0.02
  crit_multiplier: 1.4
  status_chance: 0.5
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # see notes: no_range_row_attack_2
  #
  #   Cedo (Cedo Prime) | Alt-Fire + AoE | 100% | Multiplies | Snapshot
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { slash: 20 }   # total 20
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.0   # the module states NO damage falloff
    crit_chance: 0.02
    crit_multiplier: 1.4
    status_chance: 0.5
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 10 }   # total 10

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Cedo
