id: trumna
name: Trumna
slot: primary
# A 200-ROUND RIFLE WHOSE EVERY ROUND CARRIES A 1.6 M BLAST, and an alternate
# fire that lobs grenades built out of the rounds it has already spent.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: trumna
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO, PROJECTILE, AOE
mastery_rank: 13
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 200.0
disposition: 0.85           # riven disposition
polarities: []               # the infobox states none
exilus_polarity: naramon
riven_family: Trumna
traits: [entrati]
introduced: "29"
internal_name: /Lotus/Weapons/Thanotech/ThanoRifle/ThanotechRifle
noise: alarming
ammo_type: primary
ammo_max: 400
ammo_pickup: 60
magazine: 200
reload_seconds: 5

# see notes: condition_overload_no_row_3
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.3
    max_deg: 0.7
  trigger: auto
  shot_type: hit_scan
  fire_rate: 4.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.24
  crit_multiplier: 2.2
  status_chance: 0.3
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_3
  range_m: 300.0
  # see notes: primary_compression_published_table
  #
  #   Trumna (Trumna Prime) | Primary Fire + AoE | 100% | Adds | Snapshot
  compression:
    effectiveness: 1.00
    stacking: adds
    radius_calculation: snapshot
  damage: { heat: 53, impact: 29 }   # total 82
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 1.6
    falloff_start_m: 0.0
    falloff_reduction: 0.15
    crit_chance: 0.24
    crit_multiplier: 2.2
    status_chance: 0.3
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { heat: 50 }   # total 50
    # see notes: catalog_says_aoe_part
    #
    #   Trumna | Main-fire Hitscan Radial Attack | Hitscan | 55 | 90 | 164% | Adding
    #
    # The RELATIVE column is 164% and there is no per-part CO fraction —
    # `co_base_fraction` is one number per ENTRY and this entry's direct hit
    # has its own — so this part takes the term at 100% of its own base and
    # the difference is admitted below. It read FALSE until 2026-08-20, which
    # was the whole term missing rather than the fraction being off.
    takes_condition_overload: true

unmodeled:
  - "the CATALOG gives this weapon's radial its own Condition Overload row at 164% of its base ('Trumna | Main-fire Hitscan Radial Attack | Hitscan | 55 | 90 | 164% | Adding'), and there is no per-part CO fraction here — `co_base_fraction` is one number per ENTRY. So the part takes the term at 100% of its own base and a status-stacking build is understated on it"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Trumna
