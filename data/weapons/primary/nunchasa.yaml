id: nunchasa
name: Nunchasa
slot: primary
weapon_type: primary
class: bow
form: charged
form_name: Charged Shot
default_form: true          # the drawn shot, which is how a bow is played
transform_group: nunchasa
transforms_to: nunchasa_alt
mod_pools: [primary, rifle, bow]
compatibility_tags: [projectile, duelistbow]   # see notes: de_compatibility_tags
mastery_rank: 14
max_rank: 30

# see notes: weapon_level_metadata_wiki_uncrosschecked
accuracy: 100.0             # the module states 0, which a bow reads as perfect
disposition: 1.2
polarities: [madurai, madurai]
exilus_polarity: madurai
# NO `riven_family`. It is DE's own `compatibility` string and the only
# place we can read it is a week of trades — where a weapon this new does
# not appear, because nobody has traded one. Writing the display name here
# would be a guess that reads exactly like a checked fact.
traits: [tenno]
introduced: "44.0"
internal_name: /Lotus/Weapons/Tenno/Bows/DuelistBow/DuelistBow
grip_type: BOW
# A BOW IS SILENT, and the module says so on both attacks (`IsSilent`).
noise: silent
ammo_type: primary
ammo_max: 50
ammo_pickup: 15
magazine: 1
reload_seconds: 0.6

# see notes: condition_overload_no_row_3
co_behavior: additive_with_base_damage

modes:
  - id: cycle
    name: "Full-charge alt-fire cycle"
    about: "Fire the primary until 5 charges are full (0.5 per body hit, 1 per weak-point hit), fire the alternate once, then repeat."
    cycle_with: nunchasa_alt
    rules:
      - { action: { do: transform_in }, when: { if: gauge_at_least, pct: 1.0 } }

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: charge
  charge_seconds: 0.6
  shot_type: projectile
  projectile_speed_mps: 70
  fire_rate: 1
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.32
  crit_multiplier: 2.4
  status_chance: 0.32
  punch_through_m: 1.4
  damage: { puncture: 200, cold: 200 }   # total 400

unmodeled:
  - reason: projectile_must_be_led

source:
  url: https://wiki.warframe.com/w/Nunchasa
