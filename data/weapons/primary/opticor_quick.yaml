id: opticor_quick
name: Opticor
# THE QUICK SHOT: fired without charging, for a fraction of the damage and the
# same six-metre blast.
inherits: opticor
form: base
transform_group: opticor

introduced: "15.0"

# see notes: inherited_co_catalog_gives_3
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 1
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2.5
  status_chance: 0.2
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_3
  range_m: 300.0
  # see notes: primary_compression_published_table
  #
  #   Opticor (Opticor Vandal) | Primary Fire + AoE | 100% | Adds | Snapshot
  #
  # THE TABLE GIVES THIS WEAPON ONE ROW for its explosion and this weapon
  # has two forms that carry the same one, so both take it.
  compression:
    effectiveness: 1.00
    stacking: adds
    radius_calculation: snapshot
  damage: { impact: 50, puncture: 425, slash: 25 }   # total 500
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.6
    crit_chance: 0.2
    crit_multiplier: 2.5
    status_chance: 0.2
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { magnetic: 200 }   # total 200

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Opticor
