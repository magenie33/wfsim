id: latron_prime_incarnon
name: Latron Prime (Incarnon Form)
slot: primary
class: rifle
form: incarnon

# TWO WEAPONS MODEL: second entry of the transform group — see
# data/weapons/primary/latron_prime.yaml for the base form and the decision.
transform_group: latron_prime
transforms_from: latron_prime

# The Incarnon transformation economy (wiki Latron Incarnon Genesis), shared by
# all three Latrons. The SMALLEST pool in the roster so far — 40 rounds — which
# is what makes this weapon's cycle a burst rather than a window.
gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 8
    rounds_per_charge: 5
    max_rounds: 40
    # charge_rules:
    # - "8 weakpoints will completely fill the gauge", each charge producing 5
    # rounds to a maximum of 40.
    # - A full gauge is NOT required to transmute.
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2.4      # = base reload time, unmodded

pseudo_reload:
  magazine: 40
  reload_seconds: 3.4   # transmute out (1.0) + in (2.4), unmodded

# CONDITION OVERLOAD IS INDEPENDENT ON THIS FORM, not additive. The wiki's CO
# catalog gives it its own row — "Incarnon Mode | Projectile | 50 | 50 | 100% |
# Multiplying" — so the bonus is a free-standing final multiplier rather than a
# member of the base-damage bucket, which is a different number on any build
# carrying Serration. The same row adds "CO does not apply for Latron's AoE in
# any way", which the radial below obeys by declaring nothing.
co_behavior: independent

# TWO ATTACK PARTS, and a THIRD thing this arena cannot hold. VERBATIM (wiki):
# "Incarnon Form changes the weapon's fire mode from hitscan to a traveling
# projectile that can ricochet off enemies and terrain, exploding up to 6 times
# with a 4 meter radius, dealing damage once for any collision on enemies, and
# again for the explosion."
#
# The first collision and its explosion land on the target in front of you, and
# THE BOUNCES ARE MODELLED (`ricochet:` below): a formation gives them somewhere
# to go, which a single-target arena does not.
#
# What is still missing is TERRAIN — the page says enemies *and terrain*, this
# arena has no walls, and a projectile that would have come off one finds the
# next body instead. So a fight against ONE body still bounces nowhere, which is
# the case the admission below is about.
unmodeled:
  - reason: bounce_headshot_assumed
  - reason: ricochet_terrain

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 3.33
  multishot: 1.0
  ammo_cost: 1                  # of the separate 40-round charge pool
  crit_chance: 0.44
  crit_multiplier: 3.4
  status_chance: 0.3
  # see notes: guaranteed_impact_every_shot
  forced_procs: [impact]
  punch_through_m: 0.0
  # PUNCH THROUGH DOES NOTHING HERE, and the page says so outright rather than
  # leaving it to the AoE rule: *"Punch Through does not affect the incarnon
  # projectile."* Transcribed per entry, because the shape rule that would also
  # forbid it (this attack has a `radial:`) is only the FALLBACK — see
  # AGENTS.md and `punch_through_mods`.
  punch_through_mods: false
  # THE PROJECTILE BOUNCES. VERBATIM: *"a traveling projectile that can ricochet
  # off enemies and terrain, exploding up to 6 times with a 4 meter radius,
  # dealing damage once for any collision on enemies, and again for the
  # explosion"* — so five bounces after the first collision, each dealing the
  # collision above AND the explosion below, in full. The page names no
  # attenuation per bounce; what it names is *"Each ricochet will cause the
  # projectile to slow down"*.
  #
  # HEADSHOT CHANCE 0.5. A bounce is not aimed, so the
  # scenario's headshot_pct — which states how well the PLAYER aims — is the
  # wrong number for it, and DE publishes none. Half is the flat rate, and it is
  # a decision rather than a transcription.
  #
  # NO RANGE. The page gives the bounce COUNT and no distance, so a bounce finds
  # the nearest body it has not already hit, however far. Its own note is the
  # evidence that this is the shape: repeated bounces *"seem to require multiple
  # enemies"*.
  ricochet:
    bounces: 5
    headshot_chance: 0.5
  # The COLLISION: pure Impact, with a guaranteed proc the engine has no
  # per-part forced-proc field for on a direct hit — recorded here, and the
  # weapon's own status chance is what rolls.
  damage: { impact: 50.0 }   # total 50
  # The EXPLOSION — rules in MECHANICS §7.
  # PRIMARY COMPRESSION's row (docs/CATALOGS.md §2): 4.0 m -> +320%.
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot

  radial:
    damage: { puncture: 70.0, heat: 70.0 }   # total 140
    radius_m: 4.0
    falloff_start_m: 0.0
    # "80% damage falloff from center impact" — the module's own reduction is
    # 0.2, i.e. 100% at the centre falling to 80% at 4 m. NOT READ
    # single-target: the projectile detonates ON the target.
    falloff_reduction: 0.2
    crit_chance: 0.44
    crit_multiplier: 3.4
    status_chance: 0.3
    # NOT DECLARED, deliberately: no CO catalog row exists for this weapon, so
    # the radial takes the engine's default (no Condition Overload on an
    # explosion) rather than the Burston/Braton exception.

# incarnon_evolutions: see data/weapons/primary/latron_prime.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Latron_Incarnon_Genesis
  # see notes: attack_stats_from_wiki

