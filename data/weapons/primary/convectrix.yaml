id: convectrix
name: Convectrix
slot: primary
# TWO BEAMS THAT CONVERGE. Twelve damage a tick from each of two beams at a 45%
# status chance — the highest in the roster's primaries — with 0.6 m of innate
# punch through and a 30 m reach.
class: shotgun
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: convectrix
mod_pools: [primary, shotgun]   # CompatibilityTags BEAM
mastery_rank: 7
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 50.0
disposition: 1.46           # riven disposition
polarities: [naramon]
exilus_polarity: naramon
riven_family: Convectrix
traits: [corpus]
introduced: "17.5"
internal_name: /Lotus/Weapons/Corpus/LongGuns/CrpSplitLaser/CrpSplitLaser
noise: alarming
ammo_type: primary
ammo_max: 700
ammo_pickup: 80
magazine: 70
reload_seconds: 2

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%. The catalog gives a class PER ATTACK
# and neither of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 2.0
    max_deg: 2.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 12
  multishot: 2.0
  ammo_cost: 0.5
  crit_chance: 0.16
  crit_multiplier: 2.4
  status_chance: 0.45
  punch_through_m: 0.6
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 30.0 m" on this attack.
  range_m: 30.0
  damage: { impact: 1.2, puncture: 1.2, slash: 9.6 }   # 12 a pellet, 24 a shot

unmodeled:
  - "Efficient Beams, the Convectrix-exclusive mod — a weapon-exclusive card outside the pools this roster loads"

