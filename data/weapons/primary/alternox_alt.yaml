id: alternox_alt
name: Alternox
# THE PLANTED CHARGE: a contact hit, a burn, and a six-metre explosion. The BURN
# between them is a damage-over-time this engine has no shape for.
inherits: alternox
form: alt_fire
transform_group: alternox

introduced: "31.5"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of
# this weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 60
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 4
  crit_chance: 0.02
  crit_multiplier: 2.0
  status_chance: 0.44
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Alternox (Alternox Prime) | Alt-Fire + AoE | 100% | Multiplies |
  #   Snapshot | 6.0 m | +480% | "Pulse radius is not reduced, damage bonus
  #   is granted based off alt-fire radius."
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 5, puncture: 37.5, slash: 7.5 }   # total 50
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.6
    crit_chance: 0.02
    crit_multiplier: 2.0
    status_chance: 0.44
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { electricity: 100 }   # total 100

unmodeled:
  - "the module gives this alternate fire a THIRD attack — 'Alt-Fire Damage over Time', a burn in six metres between the contact hit and the explosion — and this engine carries one direct hit and one explosion per attack. So the burn is not counted at all"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Alternox
