id: soma_prime
name: Soma Prime
slot: primary
class: rifle
form: base
default_form: true
mod_pools: [primary, rifle, assault_rifle]
mastery_rank: 7
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: soma_prime
transforms_to: soma_prime_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner: "灵化部分可以粗略"): transcribed from the
# wiki's table, with every clause the intake's rule engine did not recognise
# loaded as a NAMED INERT effect that the builder and the optimizer both print
# as "not modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
unmodeled:
  - "the spool rebuilds after every reload: the page says burst firing MAINTAINS it, so a player whose pauses are short enough keeps more of the listed rate than this sim does — here the only pauses are the reloads the weapon forces. The spool itself IS modelled"
accuracy: 28.57
disposition: 1.1
polarities: [madurai, madurai]
exilus_polarity: naramon
riven_family: Soma
traits: [incarnon, prime]
introduced: "Update 15.7"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeSoma/PrimeSomaRifle
noise: alarming
ammo_type: primary
ammo_max: 800
ammo_pickup: 80
magazine: 200
reload_seconds: 3

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  trigger: auto
  shot_type: hit_scan
  fire_rate: 15
  # …AND IT NEVER FIRES AT THAT RATE UNTIL THE 4th ROUND. VERBATIM (wiki):
  # "Fire rate starts at 25% of its listed value, and increases by
  # 30% per shot", and "Requires a spool-up of 4 shots before optimal fire
  # rate is achieved" — two statements of one mechanic, and they reconcile
  # exactly: 0.75 / 2.5 = 30% a shot, full from the 4th.
  # `over_shots` carries the span because it is the half that is exact;
  # the percentage is its rounded presentation.
  sustained_fire_rate:
    start: 0.25
    end: 1.00
    over_shots: 2.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.3
  crit_multiplier: 3
  status_chance: 0.1
  punch_through_m: 0.0
  damage: { impact: 1.2, slash: 6, puncture: 4.8 }   # total 12.0

# incarnon_evolutions: definitions live in data/evolutions/soma_prime_*.yaml.

source:
  url: https://wiki.warframe.com/w/Soma_Prime
