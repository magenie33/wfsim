id: latron_wraith
name: Latron Wraith
slot: primary
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, assault_rifle]
grip_type: RIFLE
mastery_rank: 7
max_rank: 30

# see notes: two_weapons_model_base_2
transform_group: latron_wraith
transforms_to: latron_wraith_incarnon

# see notes: weapon_level_metadata_wiki_3
accuracy: 28.57
disposition: 1.35
polarities: [madurai]
exilus_polarity: naramon
riven_family: Latron
traits: [incarnon, wraith]
introduced: "14.5"
internal_name: /Lotus/Weapons/Tenno/LongGuns/WraithLatron/WraithLatron
noise: alarming
ammo_type: primary
ammo_max: 540
ammo_pickup: 80              # rifle pickup, as every other rifle here
magazine: 15
reload_seconds: 2.4

# Condition Overload behavior class. No Latron row exists in the wiki's CO
# catalog, and absence there means ORDINARY rather than unknown.
co_behavior: additive_with_base_damage

# ONE ATTACK PART: a semi-auto hit-scan marksman rifle, mostly Puncture. The
# projectile, the ricochet and the explosion all belong to the Incarnon form.
attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 7
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 5.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.26
  crit_multiplier: 2.8
  status_chance: 0.14
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_2
  range_m: 300.0
  damage: { impact: 15.5, puncture: 43.4, slash: 3.1 }   # total 62

