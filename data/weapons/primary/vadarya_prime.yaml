id: vadarya_prime
name: Vadarya Prime
slot: primary
weapon_type: primary
class: sniper
# A CHARGE TRIGGER IS THE CHARGED FORM, and nothing else is. This weapon has
# only the one — "Auto Charge" is how it always fires.
form: charged
default_form: true
mod_pools: [primary, rifle, sniper]
mastery_rank: 15
max_rank: 30

accuracy: 100.0
disposition: 1.2
polarities: [madurai, naramon]
exilus_polarity: naramon
riven_family: Vadarya Prime
traits: [prime]
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeLightningGun/PrimeLightningGun
noise: alarming
magazine: 16
reload_seconds: 2.6
ammo_type: primary
ammo_max: 72
ammo_pickup: 80

# No CO catalog row, so the ordinary class (absence means ORDINARY).
co_behavior: additive_with_base_damage

sniper_combo:
  min: 3
# ITS SCOPED zoom is the 8x one; the FIRST is ordinary aim-down-sights and the
# page says it does not build combo at all. Only the scoped level is carried,
# which is also the only one that pays.
scope:   # zoom levels, lowest first (wiki `Sniper_Rifle` §Zoom and Minimum Combo Stats)
  - { magnification: 2.5 }   # the table lists no buff at this level
  - { magnification: 8.0, crit_multiplier: 0.5 }
attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  # "Auto Charge" — a 0.75 s draw, then the listed rate.
  charge_seconds: 0.75
  shot_type: hit_scan
  fire_rate: 2.8
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.40
  crit_multiplier: 2.8
  status_chance: 0.18
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m", Hit-Scan (its 10 m chain radius is a separate mechanic, not the reach)
  range_m: 300.0
  # see notes: primary_compression_published_table
  #
  #   Vadarya Prime | Lightning Strikes | 0% | Doesn't work | N/A
  #
  # see notes: zero_row_omission_arcane
  compression:
    effectiveness: 0.00
    stacking: multiplies
    radius_calculation: doesnt_work
  damage: { electricity: 400.0 }
unmodeled:
  - reason: sniper_combo_miss
    seconds: 2
  - reason: zoom_steps
  - "Chain lightning is not modelled, and it is a third of the weapon: each hit rolls 0-3 extra strikes (30/35/17.5/17.5%), guaranteed after three failures, chaining twice within 10 m. There is one target here, so the number reads low against a crowd."
source:
  url: https://wiki.warframe.com/w/Vadarya_Prime
