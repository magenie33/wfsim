id: soma
name: Soma
slot: primary
class: rifle
form: base
default_form: true
mod_pools: [primary, rifle, assault_rifle]
mastery_rank: 6
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: soma
transforms_to: soma_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner: "灵化部分可以粗略"): transcribed from the
# wiki's table, with every clause the intake's rule engine did not recognise
# loaded as a NAMED INERT effect that the builder and the optimizer both print
# as "not modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
unmodeled:
  - "the spool-up is not modelled — this entry fires at the fully spooled rate from the first round"
accuracy: 28.57
disposition: 1.15
polarities: [madurai, madurai]
exilus_polarity: madurai
riven_family: Soma
traits: [incarnon]
introduced: "Update 10.0"
internal_name: /Lotus/Weapons/Tenno/Rifle/TennoAR
noise: alarming
ammo_type: primary
ammo_max: 540
ammo_pickup: 80
magazine: 100
reload_seconds: 3

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  trigger: auto
  shot_type: hit_scan
  fire_rate: 15
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.3
  crit_multiplier: 3
  status_chance: 0.07
  punch_through_m: 0.0
  damage: { impact: 1.2, slash: 6, puncture: 4.8 }   # total 12.0

