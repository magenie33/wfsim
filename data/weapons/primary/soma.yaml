id: soma
name: Soma
slot: primary
class: rifle
form: base
default_form: true
mod_pools: [primary, rifle, assault_rifle]
mastery_rank: 6
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: soma
transforms_to: soma_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
unmodeled:
  - "the spool rebuilds after every reload: the page says burst firing MAINTAINS it, so a player whose pauses are short enough keeps more of the listed rate than this sim does — here the only pauses are the reloads the weapon forces. The spool itself IS modelled"
accuracy: 28.57
disposition: 1.15
polarities: [madurai, madurai]
exilus_polarity: madurai
riven_family: Soma
traits: [incarnon]
introduced: "Update 10.0"
internal_name: /Lotus/Weapons/Tenno/Rifle/TennoAR
noise: alarming
ammo_type: primary
ammo_max: 540
ammo_pickup: 80
magazine: 100
reload_seconds: 3

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  trigger: auto
  shot_type: hit_scan
  fire_rate: 15
  # …AND IT NEVER FIRES AT THAT RATE UNTIL THE 6th ROUND. VERBATIM (wiki):
  # "Fire rate starts at 25% of its listed value, and increases by
  # 15% per shot", and "Requires a spool-up of 6 shots before optimal fire
  # rate is achieved" — two statements of one mechanic, and they reconcile
  # exactly: 0.75 / 5.0 = 15% a shot, full from the 6th.
  # `over_shots` carries the span because it is the half that is exact;
  # the percentage is its rounded presentation.
  sustained_fire_rate:
    start: 0.25
    end: 1.00
    over_shots: 5.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.3
  crit_multiplier: 3
  status_chance: 0.07
  punch_through_m: 0.0
  damage: { impact: 1.2, slash: 6, puncture: 4.8 }   # total 12.0

# incarnon_evolutions: definitions live in data/evolutions/soma_*.yaml.

source:
  url: https://wiki.warframe.com/w/Soma
