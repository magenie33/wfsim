  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 15
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 3.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.38
  crit_multiplier: 3.0
  status_chance: 0.16
  punch_through_m: 1.0
  damage: { impact: 149.6, puncture: 28.1, slash: 9.3 }   # 187 total
unmodeled:
  - reason: sniper_combo_miss
    seconds: 2
  - reason: innate_punch_through
    m: 1.0
  - reason: zoom_steps

