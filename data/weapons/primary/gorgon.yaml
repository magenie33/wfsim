id: gorgon
name: Gorgon
slot: primary
class: rifle
form: base
default_form: true
mod_pools: [primary, rifle, assault_rifle]
mastery_rank: 3
max_rank: 30

# see notes: two_weapons_model_base
transform_group: gorgon
transforms_to: gorgon_incarnon

# see notes: bulk_intake_stats_are
unmodeled:
  - reason: spool_rebuilds_after_reload
accuracy: 12.5
disposition: 1.4
polarities: []
exilus_polarity: madurai
riven_family: Gorgon
traits: [incarnon]
introduced: "Vanilla"
internal_name: /Lotus/Weapons/Tenno/Rifle/HeavyRifle
noise: alarming
ammo_type: primary
ammo_max: 540
ammo_pickup: 80
magazine: 90
reload_seconds: 4.2

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 7
    max_deg: 9
  trigger: auto
  shot_type: hit_scan
  fire_rate: 12.5
  # …AND IT NEVER FIRES AT THAT RATE UNTIL THE 9th ROUND. VERBATIM (wiki):
  # "Fire rate starts at 20% of its listed value, and increases by
  # 10.667% per shot", and "Requires a spool-up of 9 shots before optimal fire
  # rate is achieved" — two statements of one mechanic, and they reconcile
  # exactly: 0.80 / 7.5 = 10.667% a shot, full from the 9th.
  # `over_shots` carries the span because it is the half that is exact;
  # the percentage is its rounded presentation.
  sustained_fire_rate:
    start: 0.20
    end: 1.00
    over_shots: 7.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.17
  crit_multiplier: 1.5
  status_chance: 0.09
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_7
  range_m: 300.0
  damage: { impact: 18.75, slash: 2.5, puncture: 3.75 }   # total 25.0

# incarnon_evolutions: definitions live in data/evolutions/gorgon_*.yaml.

source:
  url: https://wiki.warframe.com/w/Gorgon
