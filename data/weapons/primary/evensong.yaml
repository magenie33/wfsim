id: evensong
name: Evensong
slot: primary
# A BOW WHOSE DRAWN ARROW EXPLODES — a four-metre blast on the charged shot,
# which is the arsenal's own (`_TooltipAttackDisplay: 2`).
class: bow
form: charged
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: evensong
mod_pools: [primary, rifle, bow]   # CompatibilityTags PROJECTILE
mastery_rank: 10
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 16.7
disposition: 1.2            # riven disposition
polarities: [madurai, madurai]
exilus_polarity: naramon
riven_family: Evensong
traits: [tenno]
introduced: "36"
internal_name: /Lotus/Weapons/Tenno/Bows/TnChoirBow/TnChoirBow
noise: silent
ammo_type: primary
ammo_max: 72
ammo_pickup: 15
magazine: 1
reload_seconds: 0.6

# see notes: condition_overload_catalog_names
#
#   Evensong | Charged Attack | Projectile | 500 | 325 | 65% | Adding
#
# see notes: notes_cell
#
# see notes: entry_read_adding_at
co_behavior: additive_with_base_damage
co_base_fraction: 0.65

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 1
  charge_seconds: 1.2
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2.2
  status_chance: 0.38
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # see notes: no_range_row_attack_2
  #
  #   Evensong | Charged Shot + AoE | 100% | Multiplies | Snapshot | 4.0 m |
  #   +320%
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { puncture: 150, slash: 350 }   # total 500
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 4.0
    falloff_start_m: 0.9
    falloff_reduction: 0.7
    crit_chance: 0.25
    crit_multiplier: 2.2
    status_chance: 0.38
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { puncture: 45, slash: 105 }   # total 150

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

