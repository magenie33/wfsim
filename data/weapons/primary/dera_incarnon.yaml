id: dera_incarnon
name: Dera (Incarnon Form)
slot: primary
class: rifle
form: incarnon

transform_group: dera
transforms_from: dera

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 25
    rounds_per_charge: 2
    max_rounds: 50
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 1.8      # = base reload time, unmodded

pseudo_reload:
  magazine: 50
  reload_seconds: 2.8

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.8
    max_deg: 1
  trigger: auto
  shot_type: hit_scan
  fire_rate: 2
  multishot: 1.0
  ammo_cost: 1                  # of the 50-round charge pool
  crit_chance: 0.22
  crit_multiplier: 3
  status_chance: 0.18
  # see notes: module_weapons_data_form
  punch_through_m: 3.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, Incarnon Form: "Range: 300.0 m", Hit-Scan (the base Dera is a Projectile with no Range row — the form changes both)
  range_m: 300.0
  damage: { impact: 40, slash: 80, puncture: 130, magnetic: 80 }   # total 330

# incarnon_evolutions: see data/weapons/primary/dera.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Dera_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"

