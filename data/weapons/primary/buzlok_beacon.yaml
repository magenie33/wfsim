id: buzlok_beacon
name: Buzlok
# THE BEACON: three Puncture on a 200 m/s tracer, no crit, no status. It is
# fired to mark rather than to hurt.
inherits: buzlok
form: alt_fire
transform_group: buzlok

introduced: "14.7"

# see notes: condition_overload_catalog_names
#
#   Buzlok | Alt-fire | Projectile | 3 | 3 | 100% | Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 200
  fire_rate: 1.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.0
  crit_multiplier: 1.0
  status_chance: 0.0
  punch_through_m: 0.0
  # see notes: no_range_row_attack
  damage: { puncture: 3 }   # total 3

unmodeled:
  - "the beacon's whole purpose is the +50% absolute critical chance and the homing it grants the PRIMARY fire, neither of which this engine can carry from one mode to another. Fired on its own it is a three-damage dart"

source:
  url: https://wiki.warframe.com/w/Buzlok
