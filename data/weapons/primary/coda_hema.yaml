id: coda_hema
name: Coda Hema
slot: primary
weapon_type: primary
# A BURST RIFLE THAT PAYS FOR ITS AMMO IN HEALTH. The cost is real and this
# arena cannot charge it — nobody shoots back and nothing here has a health
# pool to spend (docs/UNMODELLED.md), so what the sim shows is the weapon with
# its drawback removed. Said on the card rather than left to be discovered.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO, PROJECTILE
# see notes: enforced_unlike_kuva_or
mastery_rank: 17
# see notes: rank_40_30_polarizing
max_rank: 40

# see notes: weapon_level_metadata_wiki
accuracy: 20.0
disposition: 1.2
polarities: [madurai, madurai]
exilus_polarity: naramon
riven_family: Hema
traits: [infested, technocyte_coda]
introduced: "38.5"
internal_name: /Lotus/Weapons/Infested/InfestedLich/LongGuns/CodaHema
noise: alarming
ammo_type: primary
# NO AMMO POOL — "This weapon does not use ammo pickups; health is converted to
# ammo." Zero is the fact, not a gap: the infobox states 0 for both.
ammo_max: 0
ammo_pickup: 0
magazine: 72
reload_seconds: 2.0

# see notes: condition_overload_catalog_names_2
#
#   Weapon    | Attack Name   | Projectile Type | Attack Unmodded Damage
#             | Actual CO Damage Bonus at +100% | CO Damage Bonus Relative To
#             Base Damage | Math/Behavior Type
#   Coda Hema | Normal Attack | Projectile      | 52 | 52 | 100% | Multiplying
#
# The Unmodded Damage cell is this attack's own 52, which is what ties the row
# to this entry. `Multiplying` is the free-standing bracket — x (1 + co x types)
# — so Serration does not dilute it.
co_behavior: independent

# THE PROGENITOR BONUS. The Coda wording drops the Warframe — verbatim: "Comes
# with an additional bonus Impact, Heat, Cold, Electricity, Toxin, Magnetic, or
# Radiation damage, which increases the listed base damage of the weapon by
# 25%-60%." On THIS weapon nothing merges: the base is Viral, which is not one
# of the seven, so a progenitor element always arrives beside it.
valence:
  elements: [impact, heat, cold, electricity, toxin, magnetic, radiation]
  min: 0.25
  max: 0.60

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 10.0
  trigger: burst
  # Three rounds a pull at 0.1 s between them, from the module's own BurstCount
  # and BurstDelay. The 5.33 fire rate is the PULL rate, which is what the
  # burst cadence formula reads.
  burst:
    count: 3
    delay_seconds: 0.1
  shot_type: projectile
  projectile_speed_mps: 150
  fire_rate: 5.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.20
  crit_multiplier: 2.3
  status_chance: 0.30
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — Projectile at 150 m/s, and the page states no
  # reach. See data/surveys/weapon_range.yaml.
  damage: { viral: 52 }   # total 52

unmodeled:
  - "Its drawback, converting health to ammo (up to 5% of max health), is not modelled: nothing shoots back and the Tenno has no health here, so the rifle is shown without its cost."
  - "The 5% life steal on headshots adds nothing here: there is nothing to heal."

source:
  url: https://wiki.warframe.com/w/Coda_Hema
