id: quellor_alt
name: Quellor
# THE CHARGED SHOT: 1400 damage for fifty rounds after 1.2 seconds, with a
# guaranteed Impact proc inside 18 m and infinite BODY punch through.
inherits: quellor
# NOT `charged`, which the form vocabulary reserves for a `charge` TRIGGER: the
# module gives this attack `Auto Charge`, the same trigger the Ferrox carries,
# and the page says the shot cannot be held once charged. So it is the weapon's
# ALTERNATE FIRE that happens to charge, rather than the charged form of it.
form: alt_fire
transform_group: quellor

introduced: "27.0"

# see notes: condition_overload_catalog_names
#
#   Quellor | Alt-fire | Projectile | 1400 | 1400 | 100% | Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charged_auto
  shot_type: projectile
  projectile_speed_mps: 200
  fire_rate: 1
  charge_seconds: 1.2
  multishot: 1.0
  ammo_cost: 50
  crit_chance: 0.4
  crit_multiplier: 2.2
  status_chance: 0.1
  # Alt-Fire: "Infinite Body Punch Through" (wiki Quellor). see notes: infinite_body_punch_through
  punch_through_m: 0.0
  infinite_body_punch_through: true
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # see notes: no_range_row_attack
  falloff:
    start_m: 9.0
    end_m: 18.0
    reduction: 0.6657
  damage: { cold: 800, impact: 600 }   # total 1400

unmodeled:
  - "The charged shot travels 26 m (wiki), which is not entered, so it reaches a target at any distance."
  - "The guaranteed Impact proc reaches only 18 m (wiki) but is applied at every range here, so further out the number reads high by one forced proc."
  - "It cannot hold a charge (wiki): the shot fires once charged, as in the sim."

source:
  url: https://wiki.warframe.com/w/Quellor
