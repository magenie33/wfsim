id: torid
name: Torid
slot: primary
# LAUNCHER — takes the Rifle Mods pool (wiki Rifle_Mods: Assault Rifles, Bows,
# Launchers, Snipers, Spearguns, Crossbows and Arm-Cannons all draw from it;
# Shotguns are the pool that does not).
class: launcher
# The ordinary attack — the form this weapon is fired in until its gauge
# fills. `base` is the near-universal registration (data/README.md: forms).
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
# A weapon's pool is a UNION, not one list: `primary` mods fit ANY primary
# weapon (Hunter Munitions, the Vigilante set), `rifle` is the class pool a
# LAUNCHER draws (wiki Rifle_Mods: Assault Rifles, Bows, Launchers, Snipers,
# Spearguns, Crossbows and Arm-Cannons; Shotguns are the pool that does not).
# A launcher takes no `assault_rifle` / `bow` / `sniper` mods, which is why
# those are their own pools rather than more entries in `rifle`.
mod_pools: [primary, rifle]
grip_type: ""                  # the data module records an empty GripType
mastery_rank: 4
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are separate
# entries linked by a transform group. Unlike the Zariman weapons the Torid's
# Genesis is an INSTALLED item (20 Pathos Clamps, 60 Rune Marrow, 20 Maw Fangs
# from Cavalero) — irrelevant to the calc, recorded so the acquisition
# difference is not mistaken for a mechanical one.
transform_group: torid
transforms_to: torid_incarnon

# Weapon-level metadata (wiki data module cross-checked against WFCD).
accuracy: 100
disposition: 1.3             # riven disposition (●●●●○)
polarities: []               # NO innate main polarities (both sources agree)
exilus_polarity: naramon
riven_family: Torid
traits: [infested, incarnon]
introduced: "8.0"
internal_name: /Lotus/Weapons/ClanTech/Bio/BioWeapon
noise: alarming
ammo_type: primary
ammo_max: 60
# AoE ammo-economy override (Update 32): 10 per pickup instead of the usual
# rifle amount. Outside the theoretical-DPS math; recorded for the sustain model.
ammo_pickup: 10
magazine: 5
reload_seconds: 1.7

# Condition Overload behavior class — VERIFIED from the wiki CO catalog, which
# gives the Torid TWO rows and the same class for both:
#   Torid | Main-fire       | Projectile | 100 | 100 | 100% | Multiplying
#   Torid | Toxin AoE Cloud | AoE        |  40 |  40 | 100% | Multiplying
# "Multiplying" = an INDEPENDENT multiplier, not the Hornet Strike bucket — the
# opposite of the Laetum's "Adding". The Torid page says it from the weapon
# side too: "Galvanized Aptitude is multiplicative to base damage sources on
# direct hits and resulting clouds of regular form."
# 100/100 and 40/40 = 100%, and they STAY 100% with Final Fusillade or
# Plentiful Mayhem equipped: the CO term uses the full base including a perk's
# flat damage, which is the normal behaviour (user, 2026-07-30). So no
# `co_base_excludes_evolution_damage` here — Dual Toxocyst is the one weapon
# whose catalog row ("100% or 56%") calls out the exclusion.
#
# NOTE this class is per FORM: the Incarnon form is ADDITIVE, not Multiplying
# (torid_incarnon.yaml, measured).
co_behavior: independent

# TWO ATTACK PARTS, and the second is a FIELD, not an explosion (MECHANICS §7).
# VERBATIM (wiki Torid): "Fires grenades that disperse clouds on impact, dealing
# damage over time for 10 seconds over a 3 meter radius." Grenades STICK — "to
# allies, enemies and surfaces" — so a directly-hit enemy takes the impact AND
# cannot leave the cloud, which the page calls out as guaranteeing "the maximum
# possible damage".
attack:
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 40      # slow, heavy arc
  fire_rate: 1.5
  multishot: 1.0
  # NOT READ by the engine (2026-07-31): nothing in engine/ references
  # `ammo_cost` — the sim spends a flat 1.0 (minus ammo efficiency) per shot.
  # It matters for CONTINUOUS weapons, which the wiki says "consume 0.5 ammo
  # per trace - unless they are Flamethrowers", and the only beam in the
  # roster is the Torid's Incarnon form, whose pool is charge-backed and
  # "not affected by Ammo Efficiency" — i.e. outside the ammo economy that
  # rule exists to help. So nothing in the sim turns on it today. See
  # docs/MECHANICS.md "Continuous ammo cost" for what would settle it.
  ammo_cost: 1
  crit_chance: 0.15
  crit_multiplier: 2.0
  status_chance: 0.23
  punch_through_m: 0.0
  damage: { toxin: 100.0 }      # "Grenade Impact", pure Toxin
  # The LINGERING FIELD. Its own crit and status stats — note the status chance
  # is 25%, NOT the impact's 23% — and its own clock: FireRate 1 in the data
  # module is one tick per second, EffectDuration 10 is the lifetime.
  #
  # falloff_reduction 1.0: "Explosion has linear Damage Falloff from 100% to 0%
  # from central impact" — the damage reaches ZERO at the rim, unlike the
  # Laetum radial's 0.2. Irrelevant single-target (a stuck grenade puts the
  # target at the epicentre) but it is what the multi-target model needs.
  #
  # stacking: STACK — ✅ measured (MEASUREMENTS M13). Several clouds on ONE
  # enemy run as N concurrent tick streams, which is worth up to ~5x sustained
  # single-target DPS over the refresh reading and is what makes the cloud this
  # weapon's main damage. It stays a data field rather than a constant: the
  # branch is per weapon, and a future one may refresh.
  #
  # The clock is measured too (M13): the first tick lands WITH the impact, so
  # duration_s 10 at tick_rate 1 is TEN ticks, not nine.
  # PRIMARY COMPRESSION's row (docs/CATALOGS.md §2): 3.0 m -> +240%, on the Toxin Cloud. "Cloud radius is not reduced" - it pays nothing and collects everything.
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot

  lingering:
    damage: { toxin: 40.0 }
    tick_rate: 1.0
    duration_s: 10.0
    radius_m: 3.0
    falloff_start_m: 0.0
    falloff_reduction: 1.0
    crit_chance: 0.15
    crit_multiplier: 2.0
    status_chance: 0.25
    stacking: stack
    # This cloud takes Condition Overload — an ANOMALY, and it needs declaring
    # because the default is NO. What the mods say is that CO boosts DIRECT
    # hits, so an AoE part should get nothing at all; in theory this cloud would
    # not (user, 2026-07-30) and DE let it anyway. The CO catalog records the
    # exception with a row of its own:
    #   Torid | Toxin AoE Cloud | AoE | 40 | 40 | 100% | Multiplying
    # which is doubly discrepant: an AoE part receiving CO, and receiving it as
    # a MULTIPLYING bonus. Both halves are why the row exists.
    takes_condition_overload: true

# incarnon_evolutions (data/evolutions/torid_*.yaml) — FOUR tiers, not five:
# - { tier: 1, unlock: complete a solo mission with this weapon equipped,
#     options: [torid_evo1_incarnon_form] }
# - { tier: 2, unlock: kill 100 enemies with this weapon's Incarnon Form,
#     options: [torid_final_fusillade, torid_plentiful_mayhem] }
# - { tier: 3, unlock: activate Incarnon Form 15 times,
#     options: [torid_swift_deliverance, torid_renewed_horror,
#     torid_extended_volley] }
# - { tier: 4, unlock: (the table's last tier),
#     options: [torid_commodores_fortune, torid_survivors_edge,
#     torid_elemental_balance] }

source:
  url: https://wiki.warframe.com/w/Torid
  # note: every number cross-checked wiki Module:Weapons/data/primary ==
  # WFCD warframe-items (joined on internal name). They agree exactly on all
  # three attacks; the module additionally carries AmmoMax/AmmoPickup, the
  # cloud's EffectDuration and AttackParentIndex, and IncarnonChargeGain.
