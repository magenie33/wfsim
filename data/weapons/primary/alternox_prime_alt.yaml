id: alternox_prime_alt
name: Alternox Prime
# THE PLANTED CHARGE: contact, burn, and a six-metre explosion.
inherits: alternox_prime
form: alt_fire
transform_group: alternox_prime

introduced: "41"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of
# this weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 60
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 4
  crit_chance: 0.02
  crit_multiplier: 2.0
  status_chance: 0.5
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { impact: 7, puncture: 52.5, slash: 10.5 }   # total 70
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.6
    crit_chance: 0.02
    crit_multiplier: 2.0
    status_chance: 0.5
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { electricity: 140 }   # total 140

unmodeled:
  - "the module gives this alternate fire a THIRD attack — 'Alt-Fire Damage over Time', a burn in six metres between the contact hit and the explosion — and this engine carries one direct hit and one explosion per attack. So the burn is not counted at all"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Alternox_Prime
