id: fulmin
name: Fulmin
slot: primary
# A BATTERY RIFLE WITH TWO COMPLETELY DIFFERENT GUNS IN IT. Full auto is a
# 33-damage hit-scan at 9.33 a second; semi-auto is a 500-damage silent
# projectile that costs TEN rounds and forces an Impact proc. The arsenal shows
# the automatic mode, which is this entry.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: fulmin
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO, PROJECTILE, BATTERY
mastery_rank: 8
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items, which DISAGREES on one field:
# WFCD's magazine is in SHOTS (60 rounds = 6 at 10 apiece). The wiki wins (data/README.md), and
# `scripts/audit_weapon_stats.py` carries the divergence with its reason
# so it cannot be mistaken for a transcription error.
accuracy: 9.1
disposition: 1              # riven disposition
polarities: []               # the infobox states none
exilus_polarity: madurai
riven_family: Fulmin
traits: []
introduced: "25.0"
internal_name: /Lotus/Weapons/Tenno/LongGuns/TnWispRifle/TnWispRifle
noise: alarming
ammo_type: primary
ammo_max: 0
ammo_pickup: 0
magazine: 60
reload_seconds: 3

# see notes: condition_overload_no_row_2
co_behavior: additive_with_base_damage

# THE BATTERY — "does not use ammo pickups; ammo regenerates over time. Has a 1
# second delay after the weapon stops firing before regenerating ammo. Then,
# regenerates 30 ammo per second; takes 2 seconds to regenerate a fully depleted
# battery excluding the delay."
battery:
  regen_per_second: 30.0
  delay_empty_seconds: 1.0
  delay_partial_seconds: 1.0

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.8
    max_deg: 1.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 9.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.28
  crit_multiplier: 2.4
  status_chance: 0.1
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_3
  range_m: 300.0
  damage: { electricity: 25, puncture: 8 }   # total 33

unmodeled:
  - "switching modes takes ONE SECOND of animation (0.5 s on Wisp) and this sim never switches — each mode is measured as if it were the whole weapon"
  - "it 'does not receive benefit from reload-triggered mods such as Spring-Loaded Chamber' (wiki), because a battery never reloads"

source:
  url: https://wiki.warframe.com/w/Fulmin
