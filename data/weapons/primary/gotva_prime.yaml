id: gotva_prime
name: Gotva Prime
slot: primary
# THE FIRST ASSAULT RIFLE IN THE ROSTER. Class "Rifle" on the wiki, which is
# what carries `CompatibilityTags = { "ASSAULT_AMMO" }` — the tag gating the 15
# mods no weapon here could reach before (Tactical Reload, Spring-Loaded
# Chamber, Maximum Capacity, …). Our other two rifle-pool weapons are a
# launcher and a bow, so the tag had never applied to anything.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
# Rifle mods, plus the assault-rifle-only pool. `primary` is the class-wide
# pool every primary draws from.
mod_pools: [primary, rifle, assault_rifle]
mastery_rank: 14
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 100
disposition: 0.85            # riven disposition
polarities: [madurai, madurai, naramon]
exilus_polarity: naramon
riven_family: Gotva
traits: [prime]
introduced: "33.6.6"
internal_name: /Lotus/Weapons/Grineer/LongGuns/GrnOrokinRifle/GrnOrokinRifleWeapon
noise: alarming
ammo_type: primary
ammo_max: 840
ammo_pickup: 80
magazine: 84
reload_seconds: 2.0

# Condition Overload: NO row in the wiki's CO catalog (`Condition Overload
# (Mechanic)`, re-read 2026-08-05), and absence there is a POSITIVE statement —
# the table enumerates the exceptions, so "not listed" means the ordinary
# Additive behaviour at the full +100% on the full base. See docs/MECHANICS.md.
co_behavior: additive_with_base_damage

# THE PASSIVE.
#
#   "Status Effects have a 15% chance to set the next hit's Critical Chance
#    to 300%."
#
# HOW IT SLIPPED. The intake filter that called this weapon "simple" read the
# STRUCTURED fields of the wiki's data module — Attacks, Trigger, Class, Zoom,
# SniperCombo — and a passive is not one of them. It lives in the PAGE's prose,
# under ==Characteristics==. So the weapon looked mechanically ordinary and its
# commit claimed "every mechanic these weapons use is already pinned", which was
# true of Karak Wraith and Prisma Grinlok and false of this one. See
# docs/WEAPON_INTAKE.md, which now says to read the page.
#
# THE RULES, transcribed so implementing it is a code-only change:
#   - 15% per STATUS EFFECT applied; applying several in one hit does NOT raise
#     the chance
#   - rolled separately PER BULLET under Multishot, and per enemy under Punch
#     Through — and for punch-through it asks whether the PREVIOUS ENEMY was
#     statused, not whether the previous shot was
#   - the armed state persists until the next LANDING shot; a miss does not
#     spend it
#   - "Set Critical Chance ignores all other modifiers, whether from mods or
#     Warframe abilities" — a LOCK, the same shape as the stat locks in
#     MEASUREMENTS M30, and the engine has no crit-chance lock today
#   - Vigilante set mods can still raise the result to a Tier-4 critical hit,
#     so the lock binds the CHANCE and not the tier ceiling
#
# CONSEQUENCE while it is missing: this weapon is simulated WITHOUT it, so its
# board row is a floor rather than its real output.
#
# MODELLED 2026-08-05. `engine::dummy` arms a flag when a pellet lands a status
# and spends it on the next pellet, whose crit chance becomes exactly
# `crit_chance` — a SET, so the modded value and every crit bonus are ignored.
# The tier upgrade still applies on top, which is what lets Vigilante reach
# Tier 4 (wiki).
super_crit_on_status:
  chance: 0.15
  crit_chance: 3.0

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 13.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.23
  crit_multiplier: 2.5
  status_chance: 0.27
  # Innate punch-through, and the roster's first fractional one. NOT read by
  # the sim (there is no spatial model), recorded because the shot combo and
  # multi-hit mechanics that would read it are coming with the sniper.
  punch_through_m: 0.5
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m", Hit-Scan
  range_m: 300.0
  damage: { puncture: 25.0 }   # pure Puncture, total 25

source:
  url: https://wiki.warframe.com/w/Gotva_Prime
  # Stats from the wiki Lua module via private/scripts/wiki_weapons.py, then
  # `--check` against WFCD: magazine, reload, mastery, accuracy, disposition,
  # crit, status, fire rate and the per-attack damage all agree. WFCD's flat
  # `damage` dict is NOT consulted — it is wrong for 140 of 158 primaries
  # (docs/DATA_SOURCES.md).
