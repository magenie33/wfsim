id: latron_wraith_incarnon
name: Latron Wraith (Incarnon Form)
slot: primary
class: rifle
form: incarnon

# TWO WEAPONS MODEL: second entry of the transform group — see
# data/weapons/primary/latron_wraith.yaml for the base form and the decision.
transform_group: latron_wraith
transforms_from: latron_wraith

# The Incarnon transformation economy (wiki Latron Incarnon Genesis), shared by
# all three Latrons. The SMALLEST pool in the roster so far — 40 rounds — which
# is what makes this weapon's cycle a burst rather than a window.
gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 8
    rounds_per_charge: 5
    max_rounds: 40
    # charge_rules:
    # - "8 weakpoints will completely fill the gauge", each charge producing 5
    # rounds to a maximum of 40.
    # - A full gauge is NOT required to transmute.
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2.4      # = base reload time, unmodded

pseudo_reload:
  magazine: 40
  reload_seconds: 3.4   # transmute out (1.0) + in (2.4), unmodded

# ORDINARY — THIS VARIANT IS NOT ON THE ROW. Verbatim:
#
#   |{{Weapon|Latron}}/{{Weapon|Latron Prime}}||Incarnon Mode||Projectile||50||50||100%||Multiplying||CO does not apply for Latron's AoE in any way
#
# and the row names the Latron and the Latron Prime, not the Wraith. A shared Genesis does not make one weapon: an
# Incarnon form is still that WEAPON's form, so a row is transcribed for the
# entries it names and no others (owner, 2026-08-12).
co_behavior: additive_with_base_damage

# TWO ATTACK PARTS, and a THIRD thing this arena cannot hold. VERBATIM (wiki):
# "Incarnon Form changes the weapon's fire mode from hitscan to a traveling
# projectile that can ricochet off enemies and terrain, exploding up to 6 times
# with a 4 meter radius, dealing damage once for any collision on enemies, and
# again for the explosion."
#
# The first collision and its explosion both land on the target in front of
# you, which is what this entry models. The BOUNCES do not: the reason used to
# be that a single-target arena had nowhere for them to go, and since the
# formation landed (2026-08-17) it has somewhere — so this is work now rather
# than an edge, and it is declared as a gap below instead of only here.
unmodeled:
  - reason: ricochet
    n: 5

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 7
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 3.67
  multishot: 1.0
  ammo_cost: 1                  # of the separate 40-round charge pool
  crit_chance: 0.48
  crit_multiplier: 3.4
  status_chance: 0.28
  punch_through_m: 0.0
  # The COLLISION: pure Impact, with a guaranteed proc the engine has no
  # per-part forced-proc field for on a direct hit — recorded here, and the
  # weapon's own status chance is what rolls.
  damage: { impact: 50.0 }   # total 50
  # The EXPLOSION — rules in MECHANICS §7.
  radial:
    damage: { puncture: 50.0, heat: 50.0 }   # total 100
    radius_m: 4.0
    falloff_start_m: 0.0
    # "80% damage falloff from center impact" — the module's own reduction is
    # 0.2, i.e. 100% at the centre falling to 80% at 4 m. NOT READ
    # single-target: the projectile detonates ON the target.
    falloff_reduction: 0.2
    crit_chance: 0.48
    crit_multiplier: 3.4
    status_chance: 0.28
    # NOT DECLARED, deliberately: no CO catalog row exists for this weapon, so
    # the radial takes the engine's default (no Condition Overload on an
    # explosion) rather than the Burston/Braton exception.

# incarnon_evolutions: see data/weapons/primary/latron_wraith.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Latron_Incarnon_Genesis
  # Attack stats from the wiki infobox and WFCD's `attacks` array ("Incarnon
  # Form" and "Incarnon Form AoE"), which agree on every field.

