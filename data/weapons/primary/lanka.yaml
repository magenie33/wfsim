id: lanka
name: Lanka
slot: primary
class: sniper
# THE FULL DRAW is the form this weapon is played as;
# `lanka_uncharged` is the partial one — the Cernos Prime
# pair set this convention.
form: charged
default_form: true
transform_group: lanka
mod_pools: [primary, rifle, sniper]
mastery_rank: 10
max_rank: 30

accuracy: 100.0
disposition: 1.05
polarities: []
exilus_polarity: madurai
riven_family: Lanka
internal_name: /Lotus/Weapons/ClanTech/Energy/Railgun
noise: alarming
magazine: 10
reload_seconds: 2.0
ammo_type: primary
ammo_max: 72
ammo_pickup: 15

# Condition Overload: THE CATALOG NAMES THIS ATTACK. Verbatim
# (docs/CATALOGS.md §1):
#
#   Lanka | Charged Attack | Projectile | 525 | 200 | 38% | Adding
#
# Notes cell:
#   CO-bonus only applies to base (partially charged) damage
#
# THIS ENTRY READ ADDING AT 100% UNTIL 2026-08-20, which was the
# ordinary class assumed because nobody had opened the catalog for this
# weapon — the check was run against our own transcription of it, which
# only ever carried the rows the roster already had.
co_behavior: additive_with_base_damage
co_base_fraction: 0.38

# THE ONE SNIPER WITH A SIX-SECOND COMBO. Every other sniper's counter drops
# one per 2 s without a hit; the Lanka's takes 6, which is the whole reason
# `SniperCombo::seconds` is a field with a default rather than a constant.
sniper_combo:
  min: 2
  seconds: 6.0
# ...AND THE SCOPE BONUS THE MECHANIC PAGE CALLS AN EXCEPTION. VERBATIM (wiki
# `Lanka`): "The zoom bonus adds a flat +20/30/50 critical chance, applied
# after mods." So it is NOT a bucket term — a relative +50% would be half of
# this weapon's 25% base, five points; this is fifty. It lands on the post-mod
# layer, which is a different arithmetic and a different field.
scope:
  magnification: 8.0
  crit_chance_post_mod: 0.5
attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  # A full draw. The partial-charge shot is the sibling entry.
  charge_seconds: 1.0
  shot_type: projectile
  projectile_speed_mps: 250
  # The page prints "inf attacks/sec": the draw IS the cadence here, so the
  # listed rate says nothing and `charge_seconds` is what paces it.
  fire_rate: 1.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2.0
  status_chance: 0.25
  # INNATE INFINITE BODY PUNCH-THROUGH — the punch-through page's own exception
  # list, "Lanka". Written as a number the sim can
  # hold, and it is the WHOLE mechanic here: the qualifier that goes with it separates BODIES
  # from geometry ("innate punch through does not apply to surfaces") and this
  # arena has no geometry, so everything the ray meets is a body.
  # The infobox's 5 m is the GEOMETRY figure and is not this.
  punch_through_m: 999.0
  damage: { electricity: 525.0 }
unmodeled:
  - reason: sniper_combo_miss
    seconds: 6
  - reason: zoom_steps
  - "the PARTIAL CHARGE is a separate entry (`lanka_uncharged`) — in game the two are the same trigger released at different moments, and picking between them here is a form choice rather than something the fight decides"

source:
  url: https://wiki.warframe.com/w/Lanka
