id: bubonico_burst
name: Bubonico
# THE THREE-ROUND BURST, and the explosion is sixteen times the round that
# delivers it — 9 Impact on the hit against 143 Viral in seven metres, exactly
# the Coda's figures. The two variants' alt fires are the same attack; what the
# Coda raised is the PRIMARY fire and the magazine.
inherits: bubonico
form: alt_fire
transform_group: bubonico

introduced: "29.5"

# THE AMMO SYSTEM IS THE WEAPON'S, so this form carries it too — `battery:` is
# not in `weapons_data::INHERITED` (it is not a scalar a form can partially
# take), so it is restated rather than inherited.
battery:
  regen_per_second: 9.0
  delay_empty_seconds: 0.1
  delay_partial_seconds: 1.5

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and it names this one
# separately (docs/CATALOGS.md §1):
#
#   Bubonico | Alt-fire | Projectile | 9 | 9 | 100% | Multiplying
#
# The cell's 9 is this round's own Impact total, which is what tells the row
# apart from the main fire's 287. The explosion takes no Condition Overload at
# all, which is the engine's standing rule for a radial.
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). PERFECT, where the
  # primary fire's barrage spreads 1-7 degrees.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: burst
  # Three rounds a pull at 0.23 s between them, from the module's own BurstCount
  # and BurstDelay. The 5.00 fire rate is the PULL rate, which is what the burst
  # cadence formula reads — the Coda's is 7.00.
  burst:
    count: 3
    delay_seconds: 0.23
  shot_type: projectile
  projectile_speed_mps: 25
  fire_rate: 5.0
  multishot: 1.0
  # THREE ROUNDS A SHOT, NINE A BURST, out of a magazine of 27 — three bursts
  # before the battery has to refill.
  ammo_cost: 3
  crit_chance: 0.03
  crit_multiplier: 3.5
  status_chance: 0.57
  punch_through_m: 0.0
  # see notes: may_be_given_any
  #
  # NO RANGE ROW on the Burst block — Projectile at 25 m/s. The 7.0 m below is
  # the RADIUS. See data/surveys/weapon_range.yaml.
  damage: { impact: 9 }   # total 9

  # PRIMARY COMPRESSION's row, by column (docs/CATALOGS.md §2):
  #   Attack Name   Alt-Fire + AoE         Base Radius   7.0 m
  #   Effectiveness 100%                   Max @ base    +560%
  #   Stacking      Multiplies             Class         Shotgun
  #   Radius calc   Snapshot
  #
  # Ordinary in every column it states, and the same row the Coda carries — the
  # catalog's Weapon cell covers both.
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot

  # THE EXPLOSION — 143 Viral in 7 metres, with "Initial hit and explosion apply
  # status separately", which is why it is a second instance rather than added
  # damage. A 1x body-part multiplier and no headshot conditions, the engine's
  # standing rule for every radial. Its status chance matches the round's here,
  # where the Coda's two differ by four points.
  radial:
    damage: { viral: 143 }
    radius_m: 7.0
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    crit_chance: 0.03
    crit_multiplier: 3.5
    status_chance: 0.57

unmodeled:
  - reason: explosion_ignores_cover
  - "the projectiles arc heavily and travel slowly, so at range the burst has to be led — an aiming cost this arena has no hand to pay"
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Bubonico
