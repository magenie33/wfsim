id: cinta
name: Cinta
slot: primary
# AN ENTRATI BOW WITH A TIMED RELEASE. The arsenal shows the QUICK shot, which
# is this entry; the full draw is the other. A PERFECT release — a window on the
# draw worth more than the full one — is admitted there rather than carried as a
# third form, because the form vocabulary maps `alt_fire` and `charged` to the
# same mode and a group may not hold two.
class: bow
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: cinta
mod_pools: [primary, rifle, bow]   # CompatibilityTags PROJECTILE
mastery_rank: 6
max_rank: 30

# see notes: weapon_level_metadata_wiki
