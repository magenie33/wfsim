id: cinta
name: Cinta
slot: primary
# AN ENTRATI BOW WITH A TIMED RELEASE. The arsenal shows the QUICK shot, which
# is this entry; the full draw is the other. A PERFECT release — a window on the
# draw worth more than the full one — is admitted there rather than carried as a
# third form, because the form vocabulary maps `alt_fire` and `charged` to the
# same mode and a group may not hold two.
class: bow
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: cinta
mod_pools: [primary, rifle, bow]   # CompatibilityTags PROJECTILE
mastery_rank: 6
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 16.7
disposition: 1.25           # riven disposition
polarities: [madurai]
exilus_polarity: naramon
riven_family: Cinta
traits: [duviri]
introduced: "33"
internal_name: /Lotus/Weapons/Tenno/Bows/DaxDuviriAsymetricalBow/DaxDuviriAsymmetricalLongBowPlayerWeapon
noise: silent
ammo_type: primary
ammo_max: 60
ammo_pickup: 10
magazine: 1
reload_seconds: 0.6

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20)
# — ordinary Additive at the full +100%. The catalog gives a class PER
# ATTACK and none of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 0.667
  # A BOW'S CADENCE IS DRAW + NOCK, so the draw is stated even when the
  # module gives none: a 0.0 draw paces on the nock, which is the one
  # arrow a bow's magazine holds.
  charge_seconds: 0.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2.0
  status_chance: 0.3
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { puncture: 360, slash: 90 }   # total 450

unmodeled:
  - reason: silent_weapon

source:
  url: https://wiki.warframe.com/w/Cinta
