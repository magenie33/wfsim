id: ferrox_thrown
name: Ferrox
# THE THROW, and it is a FIELD rather than a projectile: the spear lands, pulls
# everything within ten metres in, and ticks Electricity every two seconds. Word
# for word the Tenet's attack — the two variants' throws are IDENTICAL in every
# stat the module carries, which makes this the one half of the weapon the
# adversary version did not touch.
inherits: ferrox
form: alt_fire
transform_group: ferrox

introduced: "19.13"
# ONE THROW IS ONE MAGAZINE — the same call the Scourge pair makes: the throw is wind-up, release, RELOAD, every time, so the
# magazine is 1 and the 10 rounds belong to the primary-fire entry. The module
# gives this attack its own Reload of 2.0 s.
magazine: 1
reload_seconds: 2.0

# NOT INHERITED — the CO catalog gives a class per ATTACK. Neither this weapon's
# throw nor its charged shot has a row, so both are ordinary Additive; the field
# takes no Condition Overload at all, the engine's standing rule for an area
# part.
co_behavior: additive_with_base_damage

attack:
  extra_hit_reads: even   # see notes: extra_hit_reads
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). The same cone as
  # the charged shot's, stated rather than inherited because an ATTACK is never
  # inherited (`data::weapons::INHERITED`).
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: semi
  shot_type: projectile
  projectile_speed_mps: 90
  fire_rate: 1.0
  multishot: 1.0
  # "Throwing the spear consumes no ammo" — so the magazine of 1 above is what
  # paces it rather than an ammo cost.
  ammo_cost: 0
  crit_chance: 0.04
  crit_multiplier: 2.0
  # 33%, where the Tenet's throw carries 40% — the one number that differs
  # between the two throws.
  status_chance: 0.33
  punch_through_m: 0.0
  # NO RANGE ROW on the Spear Throw block — Projectile at 90 m/s, and the page
  # states no reach. The 10.0 m belongs to the Attraction Field block and is
  # that field's RADIUS. See data/surveys/weapon_range.yaml.
  #
  # ITS FORCED PROC IS A KNOCKDOWN, which is not a damage type and so is not in
  # `forced_procs`: that field carries proc TYPES the damage model knows, and a
  # knockdown deals none. Admitted below instead.
  damage: { impact: 35, puncture: 5, slash: 10 }   # total 50

  # PRIMARY COMPRESSION DOES NOT WORK ON THE THROW, and the catalog says so
  # outright rather than omitting the row — `Throw + AoE | 0% | Doesn't Work`,
  # the same row the Tenet's throw carries. A tested ZERO is a stronger
  # statement than an absent row.
  compression:
    effectiveness: 0.0
    stacking: multiplies
    radius_calculation: doesnt_work

  # THE ATTRACTION FIELD — ten metres, ticking every two seconds, which is 15
  # ticks of 150 over thirty seconds for a total of 2,250 against the spear's
  # own 50. `tick_rate` is per second, so every two seconds is 0.5. Identical to
  # the Tenet's field.
  lingering:
    damage: { electricity: 150.0 }
    tick_rate: 0.5
    duration_seconds: 30.0
    radius_m: 10.0
    crit_chance: 0.04
    crit_multiplier: 2.0
    status_chance: 0.50
    stacking: refresh

unmodeled:
  - "The field pulls enemies within 10 m toward it for 30 s, the reason it is thrown. Grouping enemies helps every area weapon in a real room; enemies here do not move, so it changes nothing."
  - "The throw's forced knockdown is crowd control, worth time and safety rather than damage; it changes nothing here."
  - "The spear must be picked up or waited out; here it is thrown and firing continues."

source:
  url: https://wiki.warframe.com/w/Ferrox
