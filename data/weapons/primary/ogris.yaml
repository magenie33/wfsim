id: ogris
name: Ogris
slot: primary
# SIX HUNDRED BLAST IN A 7.1 METRE RADIUS, off a 0.3-second charge. Pure Blast on
# both halves, a 35% status chance, and the widest ordinary explosion in this
# batch.
class: launcher
form: charged
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle]   # CompatibilityTags PROJECTILE, AOE, SINGLESHOT
mastery_rank: 9
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 100.0
disposition: 1.3            # riven disposition
polarities: []               # the infobox states none
exilus_polarity: madurai
riven_family: Ogris
traits: [grineer]
introduced: "8.0"
internal_name: /Lotus/Weapons/ClanTech/Chemical/RocketLauncher
noise: alarming
ammo_type: primary
ammo_max: 20
ammo_pickup: 5
magazine: 5
reload_seconds: 2.5

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 60
  fire_rate: 1.5
  charge_seconds: 0.3
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.05
  crit_multiplier: 2.0
  status_chance: 0.35
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on the direct-hit block — the 7.1 m below is the
  # explosion's RADIUS and not a reach. See data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Ogris (Kuva Ogris) | Primary Fire + AoE | 100% | Multiplies | Snapshot
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { blast: 100 }   # total 100
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 7.1
    falloff_start_m: 0.0
    falloff_reduction: 0.8
    crit_chance: 0.05
    crit_multiplier: 2.0
    status_chance: 0.35
    # EVERY ROCKET EXPLODES, so multishot multiplies the explosion — MEASURED: "two warheads is two fields". A field is left by a
    # rocket that LANDED, so two fields is two rockets arriving, and a rocket
    # that arrives detonates. The wiki says the same from the other side:
    # "additional rockets generated by Multishot" (they are hard to SEE only
    # because this weapon's cone is 0 degrees and they all fly to one point).
    #
    # It read `takes_multishot: false`, which in this engine means only the
    # FIRST pellet explodes — so a Split Chamber bought a second rocket that
    # arrived, left its fire, and did no blast damage at all. Removed rather
    # than set to true: `yes` is the default and the field is for stating the
    # EXCEPTION (the Burston Incarnon, whose page says outright that its radial
    # takes no multishot).
    takes_blast_radius_mods: true
    damage: { blast: 600 }   # total 600

unmodeled:
  - "'Enemies can destroy the rockets with gunfire or area of effect explosions' (wiki) — nothing shoots back in this arena, so every rocket reaches what it was aimed at"
  - "the launcher-exclusive Adhesive Blast is outside the pools this roster loads — it sticks the rocket to what it hits, which changes where the explosion goes off and is a placement this arena has no room to be wrong about"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Ogris
