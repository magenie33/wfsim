id: nagantaka_burst
name: Nagantaka
# THE MAGAZINE DUMP: nine bolts at 0.15 s apart, the same 159 damage apiece.
inherits: nagantaka
form: alt_fire
transform_group: nagantaka

introduced: "24"

# see notes: inherited_co_catalog_gives
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 5.0
    sampling:
      horizontal_ratio: 0.5
      uniform: false
      hip_min_deg: 2.0
      hip_max_deg: 3.0
  trigger: burst
  # THE BURST. The listed `fire_rate` counts BURSTS: one pull is 9 rounds
  # spaced by the delay below.
  burst:
    count: 9
    delay_seconds: 0.15       # module BurstDelay
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.15
  crit_multiplier: 2.3
  status_chance: 0.39
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # see notes: no_range_row_attack
  damage:
    impact: 1.59
    puncture: 14.31
    slash: 143.1

unmodeled:
  - reason: client_accuracy_runtime
  - reason: client_clip_burst
  - "The burst empties the magazine, and this entry fires a fixed count, the unmodded magazine. Magazine mods lengthen the burst (page), so a build with one reads low."
  - reason: bolt_corpse_ragdoll

source:
  url: https://wiki.warframe.com/w/Nagantaka
reload_seconds: 2

# see notes: client_primary_calibration
