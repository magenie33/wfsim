id: trumna_prime
name: Trumna Prime
slot: primary
# THE TRUMNA AT 250 ROUNDS and more of everything, with the same 1.6 m blast on
# every round.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: trumna_prime
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO, PROJECTILE, AOE
mastery_rank: 15
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 200.0
disposition: 0.65           # riven disposition
polarities: [vazarin, madurai]
exilus_polarity: naramon
riven_family: Trumna
traits: [prime]
introduced: "37.0.9"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeTrumna/PrimeTrumnaWeapon
noise: alarming
ammo_type: primary
ammo_max: 500
ammo_pickup: 60
magazine: 250
reload_seconds: 4

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20)
# — ordinary Additive at the full +100%. The catalog gives a class PER
# ATTACK and none of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.3
    max_deg: 0.7
  trigger: auto
  shot_type: hit_scan
  fire_rate: 4.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.24
  crit_multiplier: 2.4
  status_chance: 0.34
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  damage: { heat: 53, impact: 32 }   # total 85
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 1.6
    falloff_start_m: 0.0
    falloff_reduction: 0.15
    crit_chance: 0.24
    crit_multiplier: 2.4
    status_chance: 0.34
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { heat: 50 }   # total 50

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Trumna_Prime
