id: quellor
name: Quellor
slot: primary
# THREE HUNDRED ROUNDS AT A 38% STATUS CHANCE, with half a metre of punch
# through — and an alternate fire that spends FIFTY of them on a 1400-damage
# charged Cold shot.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: quellor
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags PROJECTILE, ASSAULT_AMMO
mastery_rank: 12
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 33.33
disposition: 1.15           # riven disposition
polarities: [madurai, madurai]
exilus_polarity: madurai
riven_family: Quellor
traits: [tenno]
introduced: "27.0"
internal_name: /Lotus/Weapons/Tenno/LongGuns/TnRailjackRifle/RailjackRifleGun
noise: alarming
ammo_type: primary
ammo_max: 900
ammo_pickup: 80
magazine: 300
reload_seconds: 4

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%. The catalog gives a class PER ATTACK
# and neither of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 2.0
    max_deg: 4.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 6
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.12
  crit_multiplier: 1.6
  status_chance: 0.38
  punch_through_m: 0.5
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  damage: { cold: 16, impact: 8, puncture: 22, slash: 12 }   # total 58

