id: opticor_vandal
name: Opticor Vandal
slot: primary
# THE OPTICOR AT A 0.6-SECOND CHARGE rather than two, out of eight rounds
# rather than five, with a 4.6 m blast instead of six.
class: rifle
form: charged
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: opticor_vandal
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO, AOE, SINGLESHOT
mastery_rank: 14
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 100.0
disposition: 1.1            # riven disposition
polarities: [madurai]
exilus_polarity: naramon
riven_family: Opticor
traits: [corpus, vandal]
introduced: "24.4"
internal_name: /Lotus/Weapons/Corpus/LongGuns/CrpBFG/Vandal/VandalCrpBFG
noise: alarming
ammo_type: primary
ammo_max: 200
ammo_pickup: 40
magazine: 8
reload_seconds: 1.4

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20)
# — ordinary Additive at the full +100%. The catalog gives a class PER
# ATTACK and none of this weapon's is named.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  shot_type: hit_scan
  fire_rate: 2
  charge_seconds: 0.6
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.24
  crit_multiplier: 2.6
  status_chance: 0.3
  # THE WEAPON'S OWN PUNCH THROUGH. An AoE attack takes no punch-through
  # MODS (MECHANICS §13), which `loadout::resolve` decides from the attack's
  # shape — the INNATE metres are the weapon's and are kept. They were a zero
  # here until 2026-08-20, which was the mod rule applied to the wrong half.
  # "Innate 1 meter punch through" (wiki).
  punch_through_m: 1.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Opticor (Opticor Vandal) | Primary Fire + AoE | 100% | Adds | Snapshot
  compression:
    effectiveness: 1.00
    stacking: adds
    radius_calculation: snapshot
  damage: { impact: 40, puncture: 280, slash: 80 }   # total 400
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 4.6
    falloff_start_m: 0.0
    falloff_reduction: 0.6
    crit_chance: 0.24
    crit_multiplier: 2.6
    status_chance: 0.3
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { magnetic: 200 }   # total 200
    # THE CATALOG SAYS THIS AoE PART TAKES CONDITION OVERLOAD, which almost
    # no area part does. Verbatim (docs/CATALOGS.md §1):
    #
    #   Opticor Vandal | Charged Hitscan Radial Attack | Hitscan | 300 | 600 | 200% | Adding
    #
    # The RELATIVE column is 200% and there is no per-part CO fraction —
    # `co_base_fraction` is one number per ENTRY and this entry's direct hit
    # has its own — so this part takes the term at 100% of its own base and
    # the difference is admitted below. It read FALSE until 2026-08-20, which
    # was the whole term missing rather than the fraction being off.
    takes_condition_overload: true

unmodeled:
  - "the CATALOG gives this weapon's radial its own Condition Overload row at 200% of its base ('Opticor Vandal | Charged Hitscan Radial Attack | Hitscan | 300 | 600 | 200% | Adding'), and there is no per-part CO fraction here — `co_base_fraction` is one number per ENTRY. So the part takes the term at 100% of its own base and a status-stacking build is understated on it"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Opticor_Vandal
