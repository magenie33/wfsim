id: cinta_charged
name: Cinta
# THE FULL DRAW: 1.5 seconds for the ordinary charged arrow.
inherits: cinta
form: charged
transform_group: cinta

introduced: "33"

# Condition Overload: THE CATALOG NAMES THIS ATTACK. Verbatim
# (docs/CATALOGS.md §1):
#
#   Cinta | Charged Attack | Projectile | 800 | 800 | 100% | Multiplying
#
# THIS ENTRY READ ADDING AT 100% UNTIL 2026-08-20, which was the
# ordinary class assumed because nobody had opened the catalog for this
# weapon — the check was run against our own transcription of it, which
# only ever carried the rows the roster already had.
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 0.667
  charge_seconds: 1.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.36
  crit_multiplier: 3.0
  status_chance: 0.32
  punch_through_m: 0.0
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  damage: { puncture: 640, slash: 160 }   # total 800

unmodeled:
  - "THE PERFECT SHOT IS NOT CARRIED. The module gives this weapon a third attack — an arrow released inside a window at 1.05 s, for MORE damage than this full draw — and the form vocabulary has no word for a timing window: `charged` and `alt_fire` resolve to the same mode, so a group cannot hold both. A player who hits the window is ahead of this number"
  - reason: silent_weapon

source:
  url: https://wiki.warframe.com/w/Cinta
