id: zarr_barrage
name: Zarr
# BARRAGE MODE: ten pellets in a shotgun spread, with no explosion at all —
# a completely different weapon in the same shell.
inherits: zarr
form: alt_fire
transform_group: zarr

introduced: "19"

# see notes: inherited_co_catalog_gives_3
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 60.0
    max_deg: 80.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 3
  multishot: 10.0
  ammo_cost: 1
  crit_chance: 0.17
  crit_multiplier: 2.5
  status_chance: 0.087
  punch_through_m: 1.6
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 10.0 m" on this attack.
  range_m: 10.0
  damage: { impact: 24, puncture: 40, slash: 16 }   # 80 a pellet, 800 a shot

source:
  url: https://wiki.warframe.com/w/Zarr
