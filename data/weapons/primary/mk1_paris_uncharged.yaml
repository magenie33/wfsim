id: mk1_paris_uncharged
name: MK1-Paris
# A FORM OF ITS WEAPON: everything below that describes the WEAPON
# rather than this shot is inherited from `mk1_paris`, and only what
# DIFFERS is written here. See `weapons_data::INHERITED`.
inherits: mk1_paris
form: base

# A FORM, NOT A TRANSFORMATION: releasing early costs nothing — no gauge,
# no transmute animation, just a shorter press — which is why this entry
# carries no `transforms_from`. See docs/GLOSSARY.md "FORMS".
# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: mk1_paris

introduced: "Update 14.0"

# CO ON THE FULL BASE. The charged entry computes it on HALF, and
# that 0.5 is the charge multiplier sitting outside the additive
# bracket. There is no charge multiplier here, so the fraction stays
# at the loader default of 1.0 — the same split the Cernos Prime's
# two entries carry.
co_behavior: additive_with_base_damage

attack:
  # Releasing early is a semi-auto press, not a draw.
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 70
  fire_rate: 1
  # ZERO, and it is a statement rather than an absence: the nock alone
  # paces a tapped bow.
  charge_seconds: 0.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.3
  crit_multiplier: 2
  status_chance: 0.15
  punch_through_m: 0.0
  damage: { impact: 5.75, slash: 23, puncture: 86.25 }   # total 115.0

source:
  url: https://wiki.warframe.com/w/MK1-Paris
  # WFCD `attacks`: "Uncharged Shot"
