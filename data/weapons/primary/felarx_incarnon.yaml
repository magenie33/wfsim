id: felarx_incarnon
name: Felarx (Incarnon Form)
slot: primary
class: shotgun
form: incarnon

transform_group: felarx
transforms_from: felarx

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner: "灵化部分可以粗略"): transcribed from the
# wiki's table, with every clause the intake's rule engine did not recognise
# loaded as a NAMED INERT effect that the builder and the optimizer both print
# as "not modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

incarnon:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 30
    rounds_per_charge: 2
    max_rounds: 60
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  # "Mode switching is not instantaneous and has an animation equal to the
  # weapon's reload speed" (wiki). For a BY-ROUND reloader that stat is the
  # whole magazine — 0.8 + 6 x 0.4 + 0.5 — and it IS the full 3.7 s, not the
  # 1.3 s of start-and-end that the by-round shape made worth asking about
  # (owner, 2026-08-08). A bigger magazine therefore lengthens the transmute
  # too, the same way it lengthens the reload.
  transmute_in_seconds: 3.7      # = base reload time, unmodded

pseudo_reload:
  magazine: 60
  reload_seconds: 4.7

# CONDITION OVERLOAD IS MULTIPLYING ON BOTH OF THIS WEAPON'S MODES (owner,
# 2026-08-08: "felarx 两个模式都是 multi 计算的"). The wiki's CO catalog lists
# the Felarx among the Multiplying entries and names one attack; the answer is
# the same for the other, so this is not read off a form — it is the weapon's.
#
# It is not a rounding difference: a free-standing final multiplier against a
# member of the base-damage bucket is a different number on any build carrying
# Serration, and this weapon's whole shape is high base damage.
co_behavior: independent

attack:
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 1                  # of the 60-round charge pool
  crit_chance: 0.2
  crit_multiplier: 3
  status_chance: 0.2
  # GUARANTEED IMPACT, every shot — the wiki module's `ForcedProcs` for this
  # attack. WFCD's export carries no such field, so the bulk intake had no
  # source for it and this weapon under-reported its status. A type that is
  # always present is also a permanent +1 to Condition Overload's count.
  forced_procs: [impact]
  # 0.5 m, granted by Evolution I ("higher accuracy and critical multiplier,
  # 0.5 meter punch through"). Recorded rather than rounded to zero even though
  # a one-target arena has no second body for it to reach — the same reason the
  # innate infinite BODY punch-through is declared unmodelled on the base entry.
  punch_through_m: 0.5
  damage: { impact: 200, radiation: 400 }   # total 600

# incarnon_evolutions: see data/weapons/primary/felarx.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Felarx
  # WFCD `attacks`: "Incarnon Form"
