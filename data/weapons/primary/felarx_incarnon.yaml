id: felarx_incarnon
name: Felarx (Incarnon Form)
slot: primary
class: shotgun
form: incarnon

transform_group: felarx
transforms_from: felarx

# BULK INTAKE. The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half: transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 30
    rounds_per_charge: 2
    max_rounds: 60
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  # "Mode switching is not instantaneous and has an animation equal to the
  # weapon's reload speed" (wiki). For a BY-ROUND reloader that stat is the
  # whole magazine — 0.8 + 6 x 0.4 + 0.5 — and it IS the full 3.7 s, not the
  # 1.3 s of start-and-end that the by-round shape made worth asking about. A bigger magazine therefore lengthens the transmute
  # too, the same way it lengthens the reload.
  transmute_in_seconds: 3.7      # = base reload time, unmodded

pseudo_reload:
  magazine: 60
  reload_seconds: 4.7

# CONDITION OVERLOAD IS MULTIPLYING ON BOTH OF THIS WEAPON'S MODES. The wiki's CO catalog lists the Felarx among the Multiplying
# entries and names one attack; the answer is the same for the other, so this
# is not read off a form — it is the weapon's.
#
# It is not a rounding difference: a free-standing final multiplier against a
# member of the base-damage bucket is a different number on any build carrying
# Serration, and this weapon's whole shape is high base damage.
co_behavior: independent

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 6
    max_deg: 16
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 1.5
  multishot: 1.0
  ammo_cost: 1                  # of the 60-round charge pool
  crit_chance: 0.2
  crit_multiplier: 3
  status_chance: 0.2
  # GUARANTEED IMPACT, every shot — the wiki module's `ForcedProcs` for this
  # attack. WFCD's export carries no such field, so the bulk intake had no
  # source for it and this weapon under-reported its status. A type that is
  # always present is also a permanent +1 to Condition Overload's count.
  forced_procs: [impact]
  # INNATE INFINITE BODY PUNCH-THROUGH — the punch-through page's own exception
  # list, "Felarx". Written as a number the sim can
  # hold, and it is the WHOLE mechanic here: the qualifier that goes with it separates BODIES
  # from geometry ("innate punch through does not apply to surfaces") and this
  # arena has no geometry, so everything the ray meets is a body.
  punch_through_m: 999.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, Incarnon Form: "Range: 56.0 m", Projectile — a real reach, and NOT an AoE sub-block (checked, because the base Felarx is 300)
  range_m: 56.0
  damage: { impact: 200, radiation: 400 }   # total 600

# incarnon_evolutions: see data/weapons/primary/felarx.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Felarx
  # WFCD `attacks`: "Incarnon Form"

