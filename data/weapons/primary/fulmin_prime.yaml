id: fulmin_prime
name: Fulmin Prime
slot: primary
weapon_type: primary
# THE FULMIN AT AN EIGHTY-ROUND BATTERY AND 34% CRIT on the automatic mode, with
# the semi-auto raised from 500 to 550 and its status chance from 16% to 22%.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: fulmin_prime
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO, PROJECTILE, BATTERY
mastery_rank: 12
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary). The magazine
# below is in ROUNDS (80), not the 8 semi-auto shots at 10 apiece; the wiki
# module's own quantity is rounds. `scripts/audit_weapon_stats.py` carries
# the divergence with its reason so it cannot be mistaken for a
# transcription error.
accuracy: 9.1
disposition: 1.2
polarities: [naramon]
exilus_polarity: madurai
riven_family: Fulmin
traits: [prime]
introduced: "33.6"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeFulmin/PrimeFulmin
noise: alarming
ammo_type: primary
ammo_max: 0
ammo_pickup: 0
magazine: 80
reload_seconds: 2.7

# see notes: condition_overload_no_row_2
co_behavior: additive_with_base_damage

# THE BATTERY — "a 0.7 second delay … Then, regenerates 40 ammo per second"
# (page; module ReloadDelay 0.7, ReloadRate 40). Not the ordinary Fulmin's.
battery:
  regen_per_second: 40.0
  delay_empty_seconds: 0.7
  delay_partial_seconds: 0.7

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.8
    max_deg: 1.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 9.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.34
  crit_multiplier: 2.4
  status_chance: 0.1
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_3
  range_m: 300.0
  damage: { electricity: 25, puncture: 8 }   # total 33

unmodeled:
  - "Switching modes takes 1 s of animation (0.5 s on Wisp); the sim never switches, so each mode is measured as the whole weapon."

source:
  url: https://wiki.warframe.com/w/Fulmin_Prime
