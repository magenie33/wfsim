id: telos_boltor
name: Telos Boltor
slot: primary
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, assault_rifle]
grip_type: RIFLE
mastery_rank: 12
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are separate
# entries linked by a transform group.
transform_group: telos_boltor
transforms_to: telos_boltor_incarnon

# Weapon-level metadata (wiki infobox, cross-checked against WFCD
# warframe-items — 0 disagreements).
accuracy: 25.0
disposition: 1.2
polarities: [vazarin, madurai]
exilus_polarity: naramon
riven_family: Boltor
traits: [incarnon, syndicate]
introduced: "17.3"
internal_name: /Lotus/Weapons/Syndicates/ArbitersOfHexis/LongGuns/AHBoltor
noise: alarming
ammo_type: primary
ammo_max: 540
ammo_pickup: 80              # rifle pickup, as every other rifle here
magazine: 90
reload_seconds: 2.4

# Condition Overload behavior class. No Boltor row exists in the wiki's CO
# catalog, and absence there means ORDINARY rather than unknown.
co_behavior: additive_with_base_damage

# A NAIL GUN: a full-auto PROJECTILE rifle, overwhelmingly Puncture. Bolts
# travel, which is why `projectile_speed_mps` is set and matters to a perk in
# tier 3 (Swift Deliverance) that has nothing to do on a hit-scan weapon.
attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 2
    max_deg: 6
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 90
  fire_rate: 9.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.3
  crit_multiplier: 2.4
  status_chance: 0.16
  punch_through_m: 0.0
  damage: { impact: 3.0, puncture: 27.0 }   # total 30

# incarnon_evolutions: nine perks shared by the transform group; definitions
# live in data/evolutions/telos_boltor_*.yaml.
