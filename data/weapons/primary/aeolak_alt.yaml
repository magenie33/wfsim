id: aeolak_alt
name: Aeolak
# THE GRENADE: ten rounds for a 97-damage impact and 789 Blast in a 7 m radius,
# after a 0.3 s charge, with a guaranteed Impact proc.
inherits: aeolak
form: alt_fire
transform_group: aeolak

introduced: "31.5"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of this
# weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 8.0
    max_deg: 15.0
  trigger: charged_auto
  shot_type: projectile
  projectile_speed_mps: 60
  fire_rate: 1.5
  charge_seconds: 0.3
  multishot: 1.0
  ammo_cost: 10
  crit_chance: 0.21
  crit_multiplier: 2.3
  status_chance: 0.33
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Aeolak | Alt-Fire + AoE | 100% | Multiplies | Snapshot | 7.0 m | +560%
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 58.2, puncture: 9.7, slash: 29.1 }   # total 97
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 7.0
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    crit_chance: 0.21
    crit_multiplier: 2.3
    status_chance: 0.33
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 789 }   # total 789

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Aeolak
