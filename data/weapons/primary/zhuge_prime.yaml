id: zhuge_prime
name: Zhuge Prime
slot: primary
weapon_type: primary
# THE ZHUGE WITH AN EXPLOSION ON EVERY BOLT: 50 on impact and 40 more in a 2.6 m
# radius, 0.6 seconds later. Silent on the bolt and not on the blast, and like
# the ordinary Zhuge it counts as a bow for fire-rate mods.
class: crossbow
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, bow]
compatibility_tags: [projectile, zhuge, crossbow]   # see notes: de_compatibility_tags
mastery_rank: 14
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 40.0
disposition: 1.2
polarities: [madurai, madurai, madurai]
exilus_polarity: madurai
riven_family: Zhuge
traits: [prime]
introduced: "25.3"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeZhuge/PrimeZhugeCrossbow
noise: silent
ammo_type: primary
ammo_max: 270
ammo_pickup: 60
magazine: 30
reload_seconds: 3

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

attack:
  extra_hit_reads: { impact: 0.15, slash: 0.15, puncture: 0.7 }   # see notes: extra_hit_reads
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 5.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 5.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.26
  crit_multiplier: 2.0
  status_chance: 0.3
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on the direct-hit block — the 2.6 m below is the
  # explosion's RADIUS and not a reach. See data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Zhuge Prime | Primary Fire + AoE | 100% | Multiplies | Snapshot | 2.6
  #   m
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 10, puncture: 22.5, slash: 17.5 }   # total 50
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    extra_hit_reads: { impact: 0.15, slash: 0.15, puncture: 0.7 }   # see notes: extra_hit_reads
    radius_m: 2.6
    falloff_start_m: 0.0
    falloff_reduction: 0.3
    crit_chance: 0.26
    crit_multiplier: 2.0
    status_chance: 0.3
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { impact: 11.2, puncture: 4, slash: 24.8 }   # total 40

unmodeled:
  - reason: empty_reload_is_faster
    seconds: 3
  - "The explosion arrives 0.6 s after the bolt lands, which lets an enemy walk out of it (page); here it resolves on impact, so nothing escapes."
  - reason: bolt_corpse_ragdoll
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Zhuge_Prime
