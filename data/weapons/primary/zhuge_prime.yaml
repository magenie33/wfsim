id: zhuge_prime
name: Zhuge Prime
slot: primary
# THE ZHUGE WITH AN EXPLOSION ON EVERY BOLT: 50 on impact and 40 more in a 2.6 m
# radius, 0.6 seconds later. Silent on the bolt and not on the blast, and like
# the ordinary Zhuge it counts as a bow for fire-rate mods.
class: crossbow
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle, bow]   # CompatibilityTags PROJECTILE, ZHUGE, CROSSBOW
mastery_rank: 14
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 40.0
disposition: 1.15           # riven disposition
polarities: [madurai, madurai, madurai]
exilus_polarity: madurai
riven_family: Zhuge
traits: [prime]
introduced: "25.3"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeZhuge/PrimeZhugeCrossbow
noise: silent
ammo_type: primary
ammo_max: 270
ammo_pickup: 60
magazine: 30
reload_seconds: 3

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 5.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 80
  fire_rate: 5.5
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.26
  crit_multiplier: 2.0
  status_chance: 0.3
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on the direct-hit block — the 2.6 m below is the
  # explosion's RADIUS and not a reach. See data/surveys/weapon_range.yaml.
  damage: { impact: 10, puncture: 22.5, slash: 17.5 }   # total 50
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 2.6
    falloff_start_m: 0.0
    falloff_reduction: 0.3
    crit_chance: 0.26
    crit_multiplier: 2.0
    status_chance: 0.3
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { impact: 11.2, puncture: 4, slash: 24.8 }   # total 40

unmodeled:
  - reason: empty_reload_is_faster
    seconds: 3
  - "the explosion arrives 0.6 SECONDS after the bolt lands, which the page says lets an enemy walk out of it — this engine resolves the blast at the point of impact immediately, so nothing ever escapes one here"
  - reason: bolt_corpse_ragdoll
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Zhuge_Prime
