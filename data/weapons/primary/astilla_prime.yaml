id: astilla_prime
name: Astilla Prime
slot: primary
# THE ASTILLA AT A HUNDRED IMPACT AND A 140-DAMAGE SHATTER, out of 24 rounds
# rather than 16, with a falloff window that starts at 60 m instead of 40.
class: shotgun
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, shotgun]   # CompatibilityTags PROJECTILE
mastery_rank: 14
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 25.0
disposition: 1.2            # riven disposition
polarities: [madurai, naramon, madurai]
exilus_polarity: madurai
riven_family: Astilla
traits: [prime]
introduced: "30.3"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeAstilla/AstillaPrimeWeapon
noise: alarming
ammo_type: primary
ammo_max: 120
ammo_pickup: 40
magazine: 24
reload_seconds: 2

# see notes: condition_overload_no_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 2.0
    max_deg: 6.0
  trigger: auto
  shot_type: projectile
  projectile_speed_mps: 120
  fire_rate: 4.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.21
  crit_multiplier: 1.9
  status_chance: 0.37
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC on every direct hit — the module's ForcedProcs.
  forced_procs: [impact]
  # NO RANGE ROW on the direct-hit block — the 2.4 m below is the
  # explosion's RADIUS and not a reach. See data/surveys/weapon_range.yaml.
  falloff:
    start_m: 60.0
    end_m: 100.0
    reduction: 0.5
  # see notes: primary_compression_published_table
  #
  #   Astilla (Astilla Prime) | Primary Fire + AoE | 100% | Multiplies |
  #   Snapshot | 2.4 m | +192% | "Shotguns cannot equip mod"
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 100 }   # total 100
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 2.4
    falloff_start_m: 0.0
    falloff_reduction: 0.3
    crit_chance: 0.21
    crit_multiplier: 1.9
    status_chance: 0.37
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { puncture: 49, slash: 91 }   # total 140

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Astilla_Prime
