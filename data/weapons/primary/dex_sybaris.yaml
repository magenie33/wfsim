id: dex_sybaris
name: Dex Sybaris
slot: primary
class: rifle
form: base
default_form: true
mod_pools: [primary, rifle, assault_rifle]
mastery_rank: 7
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): base and Incarnon forms are
# separate entries linked by a transform group.
transform_group: dex_sybaris
transforms_to: dex_sybaris_incarnon

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.
accuracy: 28.57
disposition: 1.3
polarities: []
exilus_polarity: madurai
riven_family: Sybaris
traits: [incarnon, dex]
introduced: "Hotfix 18.6.2"
internal_name: /Lotus/Weapons/Tenno/LongGuns/DexTheThird/DexTheThird
noise: alarming
ammo_type: primary
ammo_max: 540
ammo_pickup: 80
magazine: 14
reload_seconds: 1.5

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  trigger: burst
  # THE BURST. The listed `fire_rate` counts PULLS, not rounds — so reading it
  # as rounds per second understates this weapon by its burst count. Both
  # numbers are the wiki's (Dex Sybaris: Burst Count 2, Burst Delay 0.0900 s).
  burst:
    count: 2
    delay_seconds: 0.09
  shot_type: hit_scan
  fire_rate: 3.33
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.35
  crit_multiplier: 2
  status_chance: 0.1
  punch_through_m: 0.0
  damage: { impact: 22.5, slash: 33.75, puncture: 18.75 }   # total 75.0

# incarnon_evolutions: definitions live in data/evolutions/dex_sybaris_*.yaml.

source:
  url: https://wiki.warframe.com/w/Dex_Sybaris
