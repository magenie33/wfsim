id: sybaris_prime_incarnon
name: Sybaris Prime (Incarnon Form)
slot: primary
class: rifle
form: incarnon

transform_group: sybaris_prime
transforms_from: sybaris_prime

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner: "灵化部分可以粗略"): transcribed from the
# wiki's table, with every clause the intake's rule engine did not recognise
# loaded as a NAMED INERT effect that the builder and the optimizer both print
# as "not modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

incarnon:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 25
    rounds_per_charge: 8
    max_rounds: 200
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2      # = base reload time, unmodded
  transmute_out_seconds: 1.0     # MEASURED on Dual Toxocyst (M9)

pseudo_reload:
  magazine: 200
  reload_seconds: 3.0

co_behavior: additive_with_base_damage

attack:
  trigger: burst
  shot_type: hit_scan
  fire_rate: 3.33
  multishot: 1.0
  ammo_cost: 1                  # of the 200-round charge pool
  crit_chance: 0.25
  crit_multiplier: 3
  status_chance: 0.3
  punch_through_m: 0.0
  damage: { impact: 36.3, slash: 37.4, puncture: 36.3 }   # total 110.0

# incarnon_evolutions: see data/weapons/primary/sybaris_prime.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Sybaris_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"
