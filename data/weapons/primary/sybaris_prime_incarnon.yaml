id: sybaris_prime_incarnon
name: Sybaris Prime (Incarnon Form)
slot: primary
class: rifle
form: incarnon

transform_group: sybaris_prime
transforms_from: sybaris_prime

# see notes: bulk_intake_stats_are

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 25
    rounds_per_charge: 8
    max_rounds: 200
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 2      # = base reload time, unmodded

pseudo_reload:
  magazine: 200
  reload_seconds: 3.0

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 0.0
    max_deg: 8
  trigger: burst
  # THE BURST. The listed `fire_rate` counts PULLS, not rounds — so reading it
  # as rounds per second understates this weapon by its burst count. Both
  # numbers are the wiki's (Sybaris Prime: Burst Count 4, Burst Delay 0.0620 s).
  burst:
    count: 4
    delay_seconds: 0.062
  shot_type: hit_scan
  fire_rate: 3.33
  multishot: 1.0
  ammo_cost: 1                  # of the 200-round charge pool
  crit_chance: 0.25
  crit_multiplier: 3
  status_chance: 0.3
  # GUARANTEED BLAST, every shot — the wiki module's `ForcedProcs` for this
  # attack. WFCD's export carries no such field, so the bulk intake had no
  # source for it and this weapon under-reported its status. A type that is
  # always present is also a permanent +1 to Condition Overload's count.
  forced_procs: [blast]
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_4
  range_m: 300.0
  damage: { impact: 36.3, slash: 37.4, puncture: 36.3 }   # total 110.0

# incarnon_evolutions: see data/weapons/primary/sybaris_prime.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Sybaris_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"

