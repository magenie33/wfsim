form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: battacor
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags PROJECTILE, ASSAULT_AMMO
mastery_rank: 10
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
# NO ACCURACY ROW — the module states none for this weapon.
disposition: 1.1            # riven disposition
polarities: []               # the infobox states none
exilus_polarity: naramon
riven_family: Battacor
traits: [corpus]
introduced: "24"
internal_name: /Lotus/Weapons/Corpus/LongGuns/CrpSentExperimentRifle/CrpSentExperimentRifle
noise: alarming
ammo_type: primary
ammo_max: 720
ammo_pickup: 80
magazine: 60
