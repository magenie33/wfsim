id: torid_incarnon
name: Torid (Incarnon Form)
slot: primary
class: launcher
# Gauge-switched: entering it costs a full charge meter and a transmute
# animation, which is what gives the sim a two-form CYCLE to run.
form: incarnon

# TWO WEAPONS MODEL: second entry of the transform group — see
# data/weapons/primary/torid.yaml for the base form and the decision.
transform_group: torid
transforms_from: torid

# The Incarnon transformation economy (wiki Torid Incarnon Genesis).
gauge_form:
  gauge:
    # DIRECT hits, not weakpoint hits. A documentation-only field here is
    # silently the Zariman rule. VERBATIM (wiki Incarnon): "Angstrum Incarnon
    # Genesis and
    # Torid Incarnon Genesis are instead charged through direct hits."
    charge_on: direct_hits
    charges_to_fill: 5
    rounds_per_charge: 34
    max_rounds: 170
    # charge_rules:
    # - "5 direct hits will completely fill the gauge", each charge producing
    #   34 rounds to the 170 cap.
    # - "Individual Multishot bullets can build charges."
    # - "Torid's poison cloud does not build charges" (and a 37.0 patch note
    #   had to fix the case where it did).
    # - "A full gauge is not required to activate Incarnon Form."
    # - Charges cannot be gained while already in Incarnon form (33.0.13).
  transmute:
    activation: alt_fire
    # VERBATIM: "Mode switching is not instantaneous and has an animation equal
    # to the weapon's reload speed."
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    # Both stated outright: "Incarnon Form's magazine is not affected by mods"
    # and "Incarnon Form is not affected by Ammo Efficiency (such as Energized
    # Munitions)" — so Primary Crux's ammo-efficiency grant is inert HERE while
    # its status-chance grant still works.
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 1.7      # = the base form's reload time, unmodded

# SIM CONVENIENCE: with the gauge LOCKED full, the cycle reduces to a
# magazine/reload model. 170 rounds at 1 per tick — ✅ measured: the beam "0.5 ammo per trace" rule does NOT reach a charge
# pool, so a full gauge is 170 ticks, not 340 (MECHANICS "Continuous ammo
# cost"; the difference is worth 7.8% DPS, so it is not a rounding choice).
# Plus 1.0 + 1.7 s of transitions (both scale with reload speed).
pseudo_reload:
  magazine: 170
  reload_seconds: 2.7

# CO behavior: ADDITIVE — ✅ measured. The catalog has no row
# for this form, and `independent` is NOT to be inferred from the weapon's
# other two rows (Main-fire and Toxin AoE Cloud, both "Multiplying"): the
# Incarnon form takes the ordinary additive class,
# joining the base-damage bucket like Hornet Strike, while the BASE form's two
# parts really are Multiplying. So the two forms of one weapon differ in CO
# class, which is exactly why this is per-form weapon data.
#
# The CO term uses the FULL base including evolution damage (the normal
# behaviour), so no `co_base_excludes_evolution_damage` here — see
# dual_toxocyst.yaml for the one weapon that is the exception.
co_behavior: additive_with_base_damage

# ONE attack part, which is the surprise and it is explicit. The form is a
# CONTINUOUS beam with a 2.3 m damage radius, and VERBATIM: "The damage radius
# is not a separate damage instance from the beam, so a target that is directly
# struck by the beam is still only hit once." So there is no `radial:` here —
# adding one would double-count the single target.
#
# Also inert in a single-target arena, recorded so nobody looks for them:
#  - the 5-target chain within 7 m at 75% of the previous chain's damage;
#  - "As a continuous weapon, the spherical damage radius does not benefit from
#    Multishot; only targets directly hit by the beam benefit";
#  - 37 m range, and Punch Through mods "have no effect on the behavior of the
#    beam";
#  - Sinister Reach / Combustion Beam are NOT equippable, "as the base Torid is
#    not a beam weapon" — a real constraint on builds, not on this calc.
#
# And there is NO cloud in this form: the data module lists the Poison Cloud as
# a child of attack 1 (AttackParentIndex 1, the grenade), and the Incarnon
# attack has no field of its own.
attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 1
    max_deg: 1.5
  trigger: held                 # continuous: `fire_rate` is TICKS per second
  shot_type: beam
  fire_rate: 8.0
  multishot: 1.0
  # NOT READ by the engine: nothing in engine/ references
  # `ammo_cost` — the sim spends a flat 1.0 (minus ammo efficiency) per shot.
  # It matters for CONTINUOUS weapons, which the wiki says "consume 0.5 ammo
  # per trace - unless they are Flamethrowers", and the only beam in the
  # roster is the Torid's Incarnon form, whose pool is charge-backed and
  # "not affected by Ammo Efficiency" — i.e. outside the ammo economy that
  # rule exists to help. So nothing in the sim turns on it today. See
  # docs/MECHANICS.md "Continuous ammo cost" for what would settle it.
  ammo_cost: 1                  # of the separate 170-round charge magazine
  crit_chance: 0.29
  crit_multiplier: 3.1
  status_chance: 0.39
  punch_through_m: 0.0
  # …AND MODS DO NOT ADD ANY, verbatim: "Punch Through mods have no effect on
  # the behavior of the beam." Declared rather than derived, because this attack
  # is a BEAM with a damage radius — it carries no `radial:` and no `lingering:`,
  # so the punch-through page's class rule about AoE PROJECTILES does not reach
  # it and would have let Shred on. The family does not decide it either: the
  # same wiki sentence that groups this with the Ignis for Primary Compression
  # ("beam attacks with an AoE component") groups it with a weapon that is on
  # the punch-through page's EXCEPTION list. docs/CATALOGS.md's rule: the entry
  # is what is transcribed.
  punch_through_mods: false
  damage: { toxin: 51.0 }
  # BEAM GEOMETRY. Real fields now, not prose: the single-target arena consumes
  # none of it, but `damage_radius_m` is what Firestorm scales (the panel shows
  # that today) and the whole block is what the multi-target model will read.
  # It is NOT a `radial:` — that word means "a second damage instance" in this
  # engine, which the wiki forbids for this weapon (see the note above).
  # PRIMARY COMPRESSION: 0%, "Doesn't Work" — and this zero is TESTED rather
  # than absent, which is why it is written down. It is the general exclusion:
  # "Does not work on Continuous Weapons or beam attacks with an AoE component.
  # For example, Ignis or Torid Incarnon Genesis" (wiki, verbatim). So the
  # arcane is worth +240% in this weapon's BASE form and exactly nothing here —
  # one arcane, two answers, inside one Incarnon cycle. docs/CATALOGS.md §2.
  # `stacking` BELOW IS A PLACEHOLDER, not a transcription. The catalog's
  # Stacking column reads "Doesn't Work" for this row and the schema holds only
  # `multiplies` / `adds`; at 0% effectiveness the arcane pays nothing whichever
  # is written, so the field is inert and the line above is the record. Checked
  # against the live catalog 2026-08-19, when it moved.
  compression:
    effectiveness: 0.00
    stacking: multiplies
    radius_calculation: doesnt_work

  beam:
    range_m: 37.0
    # Firestorm (Primed) enlarges THIS — verbatim: "The 2.3 meter damage radius
    # from the point of impact CAN benefit from Firestorm (Primed)."
    damage_radius_m: 2.3
    # "As a continuous weapon, the spherical damage radius does not benefit
    # from Multishot; only targets directly hit by the beam benefit." So the
    # merged-beam multishot multiplier reaches the DIRECT target and nothing
    # the sphere catches.
    radius_takes_multishot: false
    chain:
      # "chaining to up to 5 nearby enemies within 7 meters of each other, with
      # each chain doing 75% of the previous chain's damage" — a SEQUENCE of
      # hops, each at 75% of the one before, not five simultaneous targets.
      hops: 5
      range_m: 7.0
      # EVERY TARGET IN THE DAMAGE RADIUS IS A SEED, and each seed runs its own
      # path. Verbatim (wiki `Torid_Incarnon_Genesis`): "The beam will chain
      # independently to 5 additional enemies starting from EACH target hit by
      # the initial damage radius. Each chain chooses targets independently,
      # and an enemy can be struck by multiple chains."
      #
      # A PATH VISITS NOBODY TWICE, and that is what "struck by multiple
      # chains" means — the repeats come from DISTINCT paths, not from one path
      # looping back. The distinction is not cosmetic: it
      # decides the number from three targets on, because the 75% compounds
      # ALONG a path. Three seeds mutually in range give each of them
      # 100% + 0.75 + 0.75^2 = 231%, where "each seed links every other at a
      # flat 75%" would give 250%.
      #
      # NOT VERIFIED: how a path picks its NEXT hop. malurth's simulator
      # assumes the nearest viable target and says so on screen ("idk if that
      # is actually how that works"). With two targets there is only one
      # candidate, so a two-enemy measurement is clean; from three on the
      # answer depends on this rule.
      seeds_from_radius: true
      revisits_within_a_path: false
      damage_per_hop: 0.75
      # "The beam will chain independently to 5 additional enemies starting
      # from EACH target hit by the initial damage radius" — every enemy the
      # sphere catches starts its own chain, which is why a bigger sphere is
      # worth so much more than the sphere's own damage.
      origin: radius_targets
      # Chains from sphere-only targets inherit the sphere's multishot rule.
      takes_multishot: false
      # ── THE FLIPPABLE LINE ────────────────────────────────────────────────
      # Does each chain NODE also carry a damage_radius_m sphere, or is there
      # only the one at the beam's contact point?
      #
      # FLIPPED to false 2026-08-06, retracting the `true` this line
      # carried since 2026-07-30. The reason is FALLOFF, and it is structural
      # rather than circumstantial: an explosion in this engine is a separate
      # damage instance with linear falloff from epicentre to edge (MECHANICS
      # §Area of Effect), and every `radial:` in data/ carries one — Torid base
      # 1.0, Burston Incarnon 1.0, Phantasma charged 0.5, Laetum Incarnon 0.2,
      # and Detonate has to say `falloff: none` out loud to be the exception.
      # This sphere carries none, because the wiki says it is not eligible for
      # one: "The damage radius is not a separate damage instance from the
      # beam." So it is not an explosion at all — it is the beam's HIT-DETECTION
      # volume, widening what the one instance touches, which is also why a
      # directly struck target "is still only hit once".
      #
      # That kills the node sphere. A sphere at a chain node could not belong to
      # the beam (whose contact point is elsewhere), so it would have to be the
      # node's OWN damage instance — an explosion, requiring a falloff the game
      # documents nowhere. `true` invented five undocumented explosions.
      #
      # It also upgrades the third circumstantial signal into a mechanism: the
      # datamined attack table carries no radius for the Incarnon attack while
      # the Poison Cloud (a real AoE part) carries its falloff — because only
      # one of the two is a damage instance.
      #
      # STILL NOT A MEASUREMENT. An argument cannot close MEASUREMENTS M15; it
      # only changes which value the default rests on. M15 stays open and its
      # Y=1 protocol still settles it. Third-party agreement, not a citation:
      # malurth.github.io/AoE-simulator (the author of the Torid/Firestorm
      # mechanics video) chains without a sphere at any node.
      nodes_have_radius: false

# incarnon_evolutions: see data/weapons/primary/torid.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Torid_Incarnon_Genesis
  # note: stats cross-checked wiki Module:Weapons/data/primary (attack 3,
  # "Incarnon Form", Trigger "Held") == WFCD warframe-items. Both give
  # 51 Toxin / 29% / 3.1x / 39% at 8 ticks per second.

