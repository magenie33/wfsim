id: strun_wraith_incarnon
name: Strun Wraith (Incarnon Form)
slot: primary
class: shotgun
form: incarnon

transform_group: strun_wraith
transforms_from: strun_wraith

# BULK INTAKE (2026-08-08). The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half (owner): transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 40
    rounds_per_charge: 1
    max_rounds: 40
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 5      # = base reload time, unmodded

pseudo_reload:
  magazine: 40
  reload_seconds: 6.0

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 200
  fire_rate: 2
  multishot: 1.0
  ammo_cost: 1                  # of the 40-round charge pool
  crit_chance: 0.56
  crit_multiplier: 3.4
  status_chance: 0.44
  # GUARANTEED IMPACT, every shot — the wiki module's `ForcedProcs` for this
  # attack. WFCD's export carries no such field, so the bulk intake had no
  # source for it and this weapon under-reported its status. A type that is
  # always present is also a permanent +1 to Condition Overload's count.
  forced_procs: [impact]
  punch_through_m: 0.0
  damage: { impact: 100 }   # total 100
  # The radial part — rules in MECHANICS §7.
  # PRIMARY COMPRESSION's row (docs/CATALOGS.md §2): 4.0 m -> +320%. Shotgun: no radius mod exists for it.
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot

  radial:
    damage: { slash: 90, puncture: 40, blast: 70 }   # total 200
    radius_m: 4
    falloff_start_m: 0
    falloff_reduction: 0.2
    # Guaranteed IMPACT on the explosion (wiki module).
    forced_procs: [impact]
    crit_chance: 0.56
    crit_multiplier: 3.4
    status_chance: 0.44
    # NOT DECLARED: no CO catalog row for this weapon, so the radial
    # takes the engine's default — no Condition Overload on an explosion.

# incarnon_evolutions: see data/weapons/primary/strun_wraith.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Strun_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form" and "Incarnon Form AoE"
