id: haalvu
name: Haalvu
slot: primary
# A SENTIENT MINIGUN FIRING TAU. Thirteen rounds a second out of a 150-round
# battery, and an alternate fire that splits the barrels into miniature rifles
# which lock onto up to FOUR enemies at once — a multi-target mode this engine
# resolves against one body.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: haalvu
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags PROJECTILE, ASSAULT_AMMO
mastery_rank: 14
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 100.0
disposition: 0.5            # riven disposition
polarities: [madurai, madurai]
# UNIVERSAL, not the weapon's own Madurai. The module states it and the page
# never mentions the exilus slot, so the copied value looked right; it meant
# every exilus mod but a Madurai one paid full drain. A universal slot
# "matches any mod except Umbra mods" (`mods::Polarity::Universal`).
exilus_polarity: universal
riven_family: Haalvu
traits: [sentient]
introduced: "43.0.7"
internal_name: /Lotus/Weapons/Sentients/SentOctaMiniGun/SentOctaMiniGun
noise: alarming
ammo_type: primary
ammo_max: 0
ammo_pickup: 0
magazine: 150
reload_seconds: 1

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%. The catalog gives a class PER ATTACK
# and neither of this weapon's is named.
co_behavior: additive_with_base_damage

# THE BATTERY — "does not use ammo pickups; ammo regenerates over time. Has a
# 0.5 second delay after the weapon stops firing before regenerating ammo. Then,
# regenerates 300 ammo per second."
battery:
  regen_per_second: 300.0
  delay_empty_seconds: 0.5
  delay_partial_seconds: 0.5

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 13
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2.5
  status_chance: 0.19
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  damage: { tau: 33 }   # total 33

unmodeled:
  - "TAU DAMAGE's status effect is not modelled. Tau is neutral to every health type, which this engine applies correctly — but its proc is STATUS CHANCE VULNERABILITY, raising the status chance the target receives from every other source by 10% a stack to ten stacks (wiki), and there is no debuff for it here. On a build stacking other statuses this weapon is understated"
  - "switching firing modes takes THREE SECONDS, can be interrupted, and is scaled by Reload Speed (wiki) — this sim never switches, so each mode is measured as if it were the whole weapon and the cost of changing between them is invisible"

source:
  url: https://wiki.warframe.com/w/Haalvu
