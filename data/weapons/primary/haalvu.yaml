id: haalvu
name: Haalvu
slot: primary
weapon_type: primary
# A SENTIENT MINIGUN FIRING TAU. Thirteen rounds a second out of a 150-round
# battery, and an alternate fire that splits the barrels into miniature rifles
# which lock onto up to FOUR enemies at once — a multi-target mode this engine
# resolves against one body.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: haalvu
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags PROJECTILE, ASSAULT_AMMO
mastery_rank: 14
max_rank: 30

# see notes: weapon_level_metadata_wiki
accuracy: 100.0
disposition: 1.2
polarities: [madurai, madurai]
# UNIVERSAL, not the weapon's own Madurai. The module states it and the page
# never mentions the exilus slot, so the copied value looked right; it meant
# every exilus mod but a Madurai one paid full drain. A universal slot
# "matches any mod except Umbra mods" (`rules::capacity::Polarity::Universal`).
exilus_polarity: universal
riven_family: Haalvu
traits: [sentient]
introduced: "43.0.7"
internal_name: /Lotus/Weapons/Sentients/SentOctaMiniGun/SentOctaMiniGun
noise: alarming
ammo_type: primary
ammo_max: 0
ammo_pickup: 0
magazine: 150
reload_seconds: 2             # the empty case: battery.empty_animation_seconds

# see notes: condition_overload_no_row_2
co_behavior: additive_with_base_damage

# THE BATTERY — "does not use ammo pickups; ammo regenerates over time. Has a
# 0.5 second delay after the weapon stops firing before regenerating ammo. Then,
# regenerates 300 ammo per second."
battery:
  regen_per_second: 300.0
  delay_empty_seconds: 0.5
  delay_partial_seconds: 0.5
  # THE EMPTY CASE IS AN ANIMATION, not the refill: "If ammo is fully depleted,
  # the weapon will enter a reload animation of 2 seconds. However, it cannot
  # be manually reloaded." The module's Reload 1 and the export's reloadTime 1
  # are the 0.5 s delay plus 150/300 s of refill, which the animation outlasts.
  empty_animation_seconds: 2.0

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 13
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.25
  crit_multiplier: 2.5
  status_chance: 0.19
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_3
  range_m: 300.0
  damage: { tau: 33 }   # total 33

unmodeled:
  - "Tau's status effect is not modelled. Tau's neutral damage is applied correctly, but its proc raises the status chance the target takes from every other source by 10% a stack, up to ten (wiki). With other statuses stacked, the number reads low."
  - "Switching firing modes takes 3 s, can be interrupted and scales with reload speed (wiki). The sim switches once, before the fight, where it costs nothing, and never inside one: each mode is measured as the whole weapon."

source:
  url: https://wiki.warframe.com/w/Haalvu
