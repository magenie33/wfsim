id: nataruk_perfect
name: Nataruk
# THE PERFECT SHOT: released inside a window at 0.7 s, and the arsenal's own
# display for this weapon — which is why it is the charged form here rather than
# the ordinary full draw.
inherits: nataruk
form: charged
transform_group: nataruk
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)

introduced: "31"

# see notes: condition_overload_catalog_names
#
#   Nataruk | Charged Attack | Projectile | 900 | 900 | 100% | Multiplying
#
# see notes: entry_read_adding_at
co_behavior: independent

# see notes: head_worth_1x_attack
headshot_multiplier: 1.0

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 12.0
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 70
  fire_rate: 0.667
  charge_seconds: 0.7
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.6
  crit_multiplier: 2.4
  status_chance: 0.5
  # "Both Charged and Perfect Shots feature a significantly larger projectile
  # and Infinite Body Punch Through" (wiki Nataruk). see notes: infinite_body_punch_through
  punch_through_m: 0.0
  infinite_body_punch_through: true
  # see notes: no_range_row_attack
  damage: { puncture: 648, slash: 252 }   # total 900

unmodeled:
  - "This is the perfect release, not the ordinary full draw: the arsenal shows it and this entry carries its numbers. A mistimed release gets the module's second attack instead, a one-second draw for less damage, which is not carried. The engine has no way to describe a timing window, so one weapon cannot carry both."
  - reason: silent_weapon

source:
  url: https://wiki.warframe.com/w/Nataruk
