id: stahlta_charged
name: Stahlta
# THE CHARGED LANCE: 1.6 seconds of charge for a projectile and a 7.2 m blast.
inherits: stahlta
form: charged
transform_group: stahlta

introduced: "28"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of this
# weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 2.0
    max_deg: 6.0
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 300
  fire_rate: 0.667
  charge_seconds: 1.6
  multishot: 1.0
  ammo_cost: 20
  crit_chance: 0.4
  crit_multiplier: 3.0
  status_chance: 0.32
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A GUARANTEED IMPACT PROC — the module's ForcedProcs.
  forced_procs: [impact]
  # NO RANGE ROW on this attack — the page states none. See
  # data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Stahlta | Alt-Fire + AoE | 0% | Doesn't Work | N/A
  #
  # ZERO IS A ROW, NOT AN OMISSION: the arcane does not apply to this
  # attack at all, and saying so is the difference between "checked" and
  # "nobody looked".
  compression:
    effectiveness: 0.00
    stacking: multiplies
    radius_calculation: doesnt_work
  damage: { impact: 120, puncture: 180, slash: 300 }   # total 600
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 7.2
    falloff_start_m: 0.0
    falloff_reduction: 0.7
    crit_chance: 0.4
    crit_multiplier: 3.0
    status_chance: 0.5
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { radiation: 1200 }   # total 1200

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Stahlta
