id: dex_sybaris_incarnon
name: Dex Sybaris (Incarnon Form)
slot: primary
class: rifle
form: incarnon

transform_group: dex_sybaris
transforms_from: dex_sybaris

# BULK INTAKE. The STATS are exact: WFCD warframe-items' `attacks`
# array, which is DE's own export and which agreed with the wiki infobox field
# for field on every one of the eleven guns checked by hand first. The
# EVOLUTIONS are the rough half: transcribed from the wiki's table,
# with every clause the intake's rule engine did not recognise loaded as a
# NAMED INERT effect that the builder and the optimizer both print as "not
# modelled yet". Nothing is dropped in silence — some perks do nothing
# yet and say so on their own tile.

gauge_form:
  gauge:
    charge_on: weakpoint_hits
    charges_to_fill: 25
    rounds_per_charge: 8
    max_rounds: 200
  transmute:
    activation: alt_fire
    animation_seconds: reload_speed
    auto_transmute_out: on_incarnon_ammo_empty
  incarnon_magazine:
    resource: incarnon_charges
    unaffected_by_mods: true
    unaffected_by_ammo_efficiency: true
  transmute_in_seconds: 1.5      # = base reload time, unmodded

pseudo_reload:
  magazine: 200
  reload_seconds: 2.5

# No CO catalog row for this attack, so the ordinary class — absence in that
# catalog means ORDINARY rather than unknown, since it lists the anomalies.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 2
    max_deg: 5
  trigger: burst
  # THE BURST. The listed `fire_rate` counts PULLS, not rounds — so reading it
  # as rounds per second understates this weapon by its burst count. Both
  # numbers are the wiki's (Dex Sybaris: Burst Count 4, Burst Delay 0.0900 s).
  burst:
    count: 4
    delay_seconds: 0.09
  shot_type: hit_scan
  fire_rate: 3.33
  multishot: 1.0
  ammo_cost: 1                  # of the 200-round charge pool
  crit_chance: 0.3
  crit_multiplier: 3
  status_chance: 0.2
  # GUARANTEED BLAST, every shot — the wiki module's `ForcedProcs` for this
  # attack. WFCD's export carries no such field, so the bulk intake had no
  # source for it and this weapon under-reported its status. A type that is
  # always present is also a permanent +1 to Condition Overload's count.
  forced_procs: [blast]
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki, Incarnon Form: "Range: 300.0 m", Hit-Scan
  range_m: 300.0
  damage: { impact: 28.8, slash: 43.2, puncture: 24 }   # total 96.0

# incarnon_evolutions: see data/weapons/primary/dex_sybaris.yaml (shared group)

source:
  url: https://wiki.warframe.com/w/Sybaris_Incarnon_Genesis
  # WFCD `attacks`: "Incarnon Form"

