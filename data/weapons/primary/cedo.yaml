  spread:
    min_deg: 2.0
    max_deg: 8.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 3.83
  multishot: 6.0
  ammo_cost: 1
  crit_chance: 0.2
  crit_multiplier: 2.4
  status_chance: 0.003
  punch_through_m: 0.8
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  falloff:
    start_m: 26.0
    end_m: 52.0
    reduction: 0.9667
  damage: { puncture: 30 }   # 30 a pellet, 180 a shot

