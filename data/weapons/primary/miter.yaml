id: miter
name: Miter
slot: primary
class: rifle
form: charged
default_form: true
mod_pools: [primary, rifle]
mastery_rank: 6
max_rank: 30

# see notes: two_weapons_model_base
transform_group: miter
transforms_to: miter_incarnon

# see notes: bulk_intake_stats_are_2
unmodeled:
  - "the Uncharged Shot is not modelled — this entry carries only the Charged Shot"
  - reason: spread_not_transcribed
accuracy: 100
disposition: 1.5
polarities: [naramon]
exilus_polarity: madurai
riven_family: Miter
traits: [incarnon]
introduced: "Update 9.5"
internal_name: /Lotus/Weapons/Grineer/LongGuns/GrineerSawbladeGun/SawBladeGun
noise: alarming
ammo_type: primary
ammo_max: 80
ammo_pickup: 40
magazine: 20
reload_seconds: 2

# see notes: catalog_gives_attack_own
#
#   |{{Weapon|Miter}}||Charged Attack||Projectile||500||200||40%||Adding||CO-bonus only applies to base (partially charged) damage; uses bows mechanics; has innate 2x damage multiplier when fully charged
#
# "CO Damage Bonus Relative To Base Damage" IS `co_base_fraction`: the CO term
# multiplies 40% of this attack's damage, because the bonus is computed on the
# UNCHARGED value while the shot deals the charged one.
co_behavior: additive_with_base_damage
co_base_fraction: 0.4

attack:
  trigger: charge
  shot_type: projectile
  projectile_speed_mps: 100
  fire_rate: 2.5
  # 0.75 s, the wiki module's ChargeTime for this attack. It read 0.8 until
  # 2026-08-20 — a rounding somebody carried in by hand, and a bow's cadence
  # is draw + nock, so a wrong draw is a wrong fire rate.
  charge_seconds: 0.75
  charge_cadence: draw_then_rate
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.1
  crit_multiplier: 2
  status_chance: 0.5
  # "Charged shots have innate 2.5 meter punch through" (wiki).
  punch_through_m: 2.5
  damage: { impact: 25, slash: 450, puncture: 25 }   # total 500

# incarnon_evolutions: definitions live in data/evolutions/miter_*.yaml.

source:
  url: https://wiki.warframe.com/w/Miter
