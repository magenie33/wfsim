id: penta
name: Penta
slot: primary
# THE ORIGINAL GRENADE LAUNCHER: five grenades, one a second, 350 Blast in a 4 m
# radius each. It is detonated BY HAND, which is the whole weapon and the one
# thing this sim cannot do — see the admission.
class: launcher
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
mod_pools: [primary, rifle]   # CompatibilityTags PROJECTILE, AOE, SINGLESHOT
mastery_rank: 6
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 100.0
disposition: 1.35           # riven disposition
polarities: []               # the infobox states none
exilus_polarity: naramon
riven_family: Penta
traits: [corpus]
introduced: "11.3"
internal_name: /Lotus/Weapons/Corpus/LongGuns/GrenadeLauncher/GrenadeLauncher
noise: alarming
ammo_type: primary
ammo_max: 20
ammo_pickup: 5
magazine: 5
reload_seconds: 2.5

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack).
  spread:
    min_deg: 0.0
    max_deg: 0.0
  # THE MODULE SAYS `Active` — a grenade DETONATED BY HAND. This engine
  # has one trigger, so the shot is semi-auto and the blast lands where it
  # falls; what a second trigger buys is in `unmodeled:`.
  trigger: semi_auto
  shot_type: projectile
  projectile_speed_mps: 20
  fire_rate: 1
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.1
  crit_multiplier: 2.0
  status_chance: 0.1
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # NO RANGE ROW on the direct-hit block — the 4.0 m below is the
  # explosion's RADIUS and not a reach. See data/surveys/weapon_range.yaml.
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Penta (Secura Penta, Carmine Penta) | Primary Fire + AoE | 100% |
  #   Multiplies | Snapshot
  compression:
    effectiveness: 1.00
    stacking: multiplies
    radius_calculation: snapshot
  damage: { impact: 75 }   # total 75
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 4.0
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    crit_chance: 0.1
    crit_multiplier: 2.0
    status_chance: 0.1
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { blast: 350 }   # total 350

unmodeled:
  - "the grenades are DETONATED BY HAND — 'it launches ballistic grenades that can be manually detonated with Alternate Fire', with no arming delay at all (wiki). This sim has no second trigger, so every grenade goes off the instant it lands, which is what a player detonating immediately gets and is therefore the ceiling. What is lost is the play pattern the weapon exists for: laying grenades and firing them together"
  - "only five grenades may be live at once, and multishot counts towards that limit (wiki) — so on this weapon a multishot mod buys fewer shots rather than more damage per shot, which is the one place multishot is not simply good. This sim resolves each shot on its own and never hits the cap"
  - "Tether Grenades, Napalm Grenades and the launcher-exclusive Adhesive Blast are outside the pools this roster loads. Tether Grenades in particular changes what the weapon IS — it makes each grenade a vortex"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Penta
