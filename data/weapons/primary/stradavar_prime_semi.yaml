id: stradavar_prime_semi
name: Stradavar Prime
# SEMI-AUTO: 80 a shot for two rounds of the magazine, 60% of it Slash, with a
# metre of innate punch through and the highest crit multiplier on the weapon.
inherits: stradavar_prime
form: semi_auto
transform_group: stradavar_prime

introduced: "24.5.8"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and this weapon
# has no row for either of its two. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 3.0
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 3.33
  multishot: 1.0
  ammo_cost: 2
  crit_chance: 0.3
  crit_multiplier: 2.8
  status_chance: 0.22
  punch_through_m: 1.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  damage: { impact: 8, puncture: 24, slash: 48 }   # total 80

source:
  url: https://wiki.warframe.com/w/Stradavar_Prime
