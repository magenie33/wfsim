id: strun_wraith
name: Strun Wraith
slot: primary
class: shotgun
form: base
default_form: true
mod_pools: [primary, shotgun]
mastery_rank: 10
max_rank: 30

# see notes: two_weapons_model_base
transform_group: strun_wraith
transforms_to: strun_wraith_incarnon

# see notes: bulk_intake_stats_are
unmodeled:
  - reason: reload_never_interrupted
accuracy: 6.7
disposition: 1.35
polarities: [naramon]
exilus_polarity: madurai
riven_family: Strun
traits: [incarnon, wraith]
introduced: "Hotfix 9.7.2"
internal_name: /Lotus/Weapons/Tenno/Shotgun/ShotgunVandal
noise: alarming
ammo_type: primary
ammo_max: 120
ammo_pickup: 15
magazine: 10
reload_seconds: 5

# see notes: round_reload_shell_at
#
# the weapon's own page: 0.25 s to start, 0.45 s a shell, 0.25 s to finish.
# They add up to the published total at a full magazine, which is the
# cross-check: 0.25 + 0.45 x 10 + 0.25 = 5.
reload_style: by_round
reload_start_seconds: 0.25
reload_per_shell_seconds: 0.45
reload_end_seconds: 0.25

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 10
    max_deg: 20
  trigger: semi_auto
  shot_type: hit_scan
  fire_rate: 2.5
  # see notes: modelled_arena_has_no
  falloff:
    start_m: 15
    end_m: 30
    reduction: 0.5   # fraction KEPT past end_m
  multishot: 10.0
  ammo_cost: 1
  crit_chance: 0.18
  crit_multiplier: 2.2
  status_chance: 0.12
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_2
  range_m: 300.0
  damage: { impact: 26, slash: 8, puncture: 6 }   # total 40

# incarnon_evolutions: definitions live in data/evolutions/strun_wraith_*.yaml.

source:
  url: https://wiki.warframe.com/w/Strun_Wraith
