id: tenora_prime
name: Tenora Prime
slot: primary
# THE TENORA AT 200 ROUNDS AND A 30% CRIT CHANCE, with the charged shot raised
# to 280 damage and a 40% crit chance. Same spool, same ten-round charge cost.
class: rifle
form: base
default_form: true          # the arsenal's form (module _TooltipAttackDisplay)
transform_group: tenora_prime
mod_pools: [primary, rifle, assault_rifle]   # CompatibilityTags ASSAULT_AMMO
mastery_rank: 14
max_rank: 30

# Weapon-level metadata (wiki Module:Weapons/data/primary, cross-checked
# against WFCD warframe-items — 0 disagreements).
accuracy: 12.5
disposition: 1.05           # riven disposition
polarities: [madurai, madurai]
exilus_polarity: madurai
riven_family: Tenora
traits: [prime, vaulted]
introduced: "29.9"
internal_name: /Lotus/Weapons/Tenno/LongGuns/PrimeTenora/TenoraPrimeWeapon
noise: alarming
ammo_type: primary
ammo_max: 1000
ammo_pickup: 80
magazine: 200
reload_seconds: 2.5

# Condition Overload: NO row in the wiki's CO catalog (re-read 2026-08-20) —
# ordinary Additive at the full +100%.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 16.0
  trigger: auto
  shot_type: hit_scan
  fire_rate: 12.67
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.3
  crit_multiplier: 2.2
  status_chance: 0.24
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  damage: { impact: 8.4, puncture: 11.2, slash: 8.4 }   # total 28
  # THE SPOOL, stated twice on its own page: "requires a spool-up of 9 shots
  # before optimal fire rate is achieved" and "fire rate starts at 40% of the
  # listed value, and increases by 7.5% per shot". 0.60 / 8 = 7.5% a shot, full
  # from the 9th — the ordinary Tenora's numbers exactly.
  sustained_fire_rate:
    start: 0.40
    end: 1.00
    over_shots: 8.0

unmodeled:
  - "'increased ACCURACY the longer the weapon is fired' (wiki) — this entry carries the settled cone"
  - reason: spool_rebuilds_after_reload

source:
  url: https://wiki.warframe.com/w/Tenora_Prime
