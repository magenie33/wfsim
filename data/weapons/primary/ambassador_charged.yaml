id: ambassador_charged
name: Ambassador
# THE CHARGED SHOT: a hit-scan round after a one-second charge, with an
# explosion in a six-metre radius.
inherits: ambassador
form: charged
transform_group: ambassador

introduced: "30.5"

# NOT INHERITED — the CO catalog gives a class PER ATTACK, and none of this
# weapon's is named. Absence means ORDINARY.
co_behavior: additive_with_base_damage

attack:
  # Cone half-angle from the reticle, degrees — wiki
  # Module:Weapons/data (MinSpread/MaxSpread on this attack). An ATTACK is
  # never inherited, so every form states its own.
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  shot_type: hit_scan
  fire_rate: 1
  charge_seconds: 1
  multishot: 1.0
  ammo_cost: 16
  crit_chance: 0.16
  crit_multiplier: 2.8
  status_chance: 0.32
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # A WALL, NOT A RAMP: full damage to the end of it and nothing past.
  # wiki: "Range: 300.0 m" on this attack.
  range_m: 300.0
  # PRIMARY COMPRESSION — the published table names this attack. Verbatim
  # (docs/CATALOGS.md §2):
  #
  #   Ambassador | Alt-Fire + AoE | 100% | Adds | Snapshot | 6.0 m | +480% |
  #   "Loses no AoE radius but gains the expected damage bonus."
  compression:
    effectiveness: 1.00
    stacking: adds
    radius_calculation: snapshot
  damage: { electricity: 600 }   # total 600
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    crit_chance: 0.16
    crit_multiplier: 2.8
    status_chance: 0.32
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { electricity: 800 }   # total 800

unmodeled:
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Ambassador
