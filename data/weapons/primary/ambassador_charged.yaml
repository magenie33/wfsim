id: ambassador_charged
name: Ambassador
# THE CHARGED SHOT: a hit-scan round after a one-second charge, with an
# explosion in a six-metre radius.
inherits: ambassador
form: charged
transform_group: ambassador

introduced: "30.5"

# see notes: inherited_co_catalog_gives_2
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from_2
  spread:
    min_deg: 0.0
    max_deg: 0.0
  trigger: charge
  shot_type: hit_scan
  fire_rate: 1
  charge_seconds: 1
  multishot: 1.0
  ammo_cost: 16
  crit_chance: 0.16
  crit_multiplier: 2.8
  status_chance: 0.32
  # AN AoE ATTACK TAKES NO PUNCH THROUGH (MECHANICS §13).
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_3
  range_m: 300.0
  # see notes: primary_compression_published_table
  #
  #   Ambassador | Alt-Fire + AoE | 100% | Adds | Snapshot | 6.0 m | +480% |
  #   "Loses no AoE radius but gains the expected damage bonus."
  compression:
    effectiveness: 1.00
    stacking: adds
    radius_calculation: snapshot
  damage: { electricity: 600 }   # total 600
  # THE EXPLOSION — rules in MECHANICS §7.
  radial:
    radius_m: 6.0
    falloff_start_m: 0.0
    falloff_reduction: 0.5
    crit_chance: 0.16
    crit_multiplier: 2.8
    status_chance: 0.32
    takes_multishot: false
    takes_blast_radius_mods: true
    damage: { electricity: 800 }   # total 800
    # see notes: catalog_says_aoe_part
    #
    #   Ambassador | Alt-fire Hitscan Radial Attack | Hitscan | 400 | 300 | 75% | Adding
    #
    # The RELATIVE column is 75% and there is no per-part CO fraction —
    # `co_base_fraction` is one number per ENTRY and this entry's direct hit
    # has its own — so this part takes the term at 100% of its own base and
    # the difference is admitted below. It read FALSE until 2026-08-20, which
    # was the whole term missing rather than the fraction being off.
    takes_condition_overload: true

unmodeled:
  - "the CATALOG gives this weapon's radial its own Condition Overload row at 75% of its base ('Ambassador | Alt-fire Hitscan Radial Attack | Hitscan | 400 | 300 | 75% | Adding'), and there is no per-part CO fraction here — `co_base_fraction` is one number per ENTRY. So the part takes the term at 100% of its own base and a status-stacking build is overstated on it"
  - reason: explosion_ignores_cover
  - reason: self_stagger

source:
  url: https://wiki.warframe.com/w/Ambassador
