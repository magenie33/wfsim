id: gorgon_wraith
name: Gorgon Wraith
slot: primary
class: rifle
form: base
default_form: true
mod_pools: [primary, rifle, assault_rifle]
mastery_rank: 7
max_rank: 30

# see notes: two_weapons_model_base
transform_group: gorgon_wraith
transforms_to: gorgon_wraith_incarnon

# see notes: bulk_intake_stats_are
unmodeled:
  - reason: spool_rebuilds_after_reload
accuracy: 16.67
disposition: 1.35
polarities: []
exilus_polarity: madurai
riven_family: Gorgon
traits: [incarnon, wraith]
introduced: "Update 12.4"
internal_name: /Lotus/Weapons/Grineer/LongGuns/WraithGorgon/WraithGorgon
noise: alarming
ammo_type: primary
ammo_max: 900
ammo_pickup: 80
magazine: 90
reload_seconds: 3

# see notes: no_co_catalog_row
co_behavior: additive_with_base_damage

attack:
  # see notes: cone_half_angle_from
  spread:
    min_deg: 5
    max_deg: 7
  trigger: auto
  shot_type: hit_scan
  fire_rate: 13.33
  # …AND IT NEVER FIRES AT THAT RATE UNTIL THE 6th ROUND. VERBATIM (wiki):
  # "Fire rate starts at 20% of its listed value, and increases by
  # 16% per shot", and "Requires a spool-up of 6 rounds before optimal fire
  # rate is achieved" — two statements of one mechanic, and they reconcile
  # exactly: 0.80 / 5.0 = 16% a shot, full from the 6th.
  # `over_shots` carries the span because it is the half that is exact;
  # the percentage is its rounded presentation.
  sustained_fire_rate:
    start: 0.20
    end: 1.00
    over_shots: 5.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.15
  crit_multiplier: 1.9
  status_chance: 0.21
  punch_through_m: 0.0
  # see notes: wall_ramp_full_damage_7
  range_m: 300.0
  damage: { impact: 22.95, slash: 1.35, puncture: 2.7 }   # total 27.0

# incarnon_evolutions: definitions live in data/evolutions/gorgon_wraith_*.yaml.

source:
