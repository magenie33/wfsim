id: dual_toxocyst
name: Dual Toxocyst
slot: secondary
class: dual_pistols
grip_type: DUAL_GUN_GUN
mastery_rank: 11
max_rank: 30

# TWO WEAPONS MODEL (decision 2026-07-24): the base and Incarnon forms are
# separate weapon entries in the database, linked by a transform group.
# Testing the live transformation cycle (weapon 1 -> weapon 2 mid-fight)
# is future work; each entry stands alone for simulation.
transform_group: dual_toxocyst
transforms_to: dual_toxocyst_incarnon   # via the Incarnon gauge (see there)

# Weapon-level metadata (from the wiki data module).
accuracy: 16
disposition: 1.35            # riven disposition
polarities: [madurai, naramon]
exilus_polarity: naramon
riven_family: Dual Toxocyst
traits: [infested]
conclave: true
introduced: "18.5"           # Update 18.5 (2016-03-04)
internal_name: /Lotus/Weapons/Infested/Pistols/InfVomitGun/InfVomitGunWep
ammo_type: secondary
ammo_max: 72
ammo_pickup: 40
magazine: 12
reload_seconds: 2.35

# Frenzy is delivered as an innate "default upgrade" mod (headshot -> fire
# rate); modeled as the `frenzy` perk.
default_upgrades:
  - /Lotus/Weapons/Infested/Pistols/InfVomitGun/FireRateOnHeadshotPistolMod

# Single attack profile (attack_parts taxonomy: one direct instance, no AoE).
# Condition Overload behavior class on this weapon (three classes exist:
# additive_with_base_damage / independent / inert - see
# data/mods/galvanized_shot.yaml). Additive per Carnage Reign''s recorded
# adding behavior; re-verify per form.
co_behavior: additive_with_base_damage

attack:
  trigger: semi_auto
  shot_type: hitscan
  fire_rate: 1.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.05
  crit_multiplier: 2.0
  status_chance: 0.37
  punch_through_m: 0.0
  range_m: 300
  spread_deg: { min: 0.50, max: 12.00 }
  damage: { impact: 7.5, puncture: 60.0, slash: 7.5 }   # total 75

perks:
  - frenzy

# Incarnon evolutions are perks shared by the transform group. CONFIRMED
# (2026-07-24, user): their stat layers apply to BOTH weapons of the group
# (e.g. Commodore's Fortune: base CC 5% -> 25% here, 11% -> 31% on the
# Incarnon entry; Carnage Reign scales both vectors pro-rata).
# Definitions: data/perks/dt_*.yaml.
incarnon_evolutions:
  - { tier: 1, unlock: install the Incarnon Genesis,
      options: [dt_evo1_incarnon_form] }
  - { tier: 2, unlock: complete a solo mission with this weapon equipped,
      options: [dt_carnage_reign, dt_fevered_frenzy] }
  - { tier: 3, unlock: kill 100 enemies with the Incarnon Form,
      options: [dt_ready_retaliation, dt_evolved_autoloader, dt_marksmans_hand] }
  - { tier: 4,
      unlock: 17 consecutive headshots (body shots and Companion damage
        reset; status damage does not; multishot hits count),
      options: [dt_commodores_fortune, dt_neurotoxin, dt_ripper_rounds] }

source:
  url: https://wiki.warframe.com/w/Module:Weapons/data/secondary
  note: Stats from the wiki's structured Lua data module.
