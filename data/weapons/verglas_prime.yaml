id: verglas_prime
name: Verglas Prime
slot: robotic            # sentinel / companion weapon (Nautilus Prime's default)
class: robotic_rifle
mastery_rank: 0
max_rank: 30

# SENTINEL / ROBOTIC WEAPON (wiki Verglas_Prime, 2026-07-25). Key modeling
# consequences (user 2026-07-25):
#   - Accepts RIFLE MODS (standard rifle mod pool, rank 30 + catalyst = 60 cap).
#   - NO Exilus slot, NO Arcane slot.
#   - Galvanized (and other on-kill / on-headshot conditional) mods can be
#     EQUIPPED but their CONDITIONAL effect never triggers: a companion cannot
#     generate the stacks itself (only kills from ANOTHER weapon carrying the
#     same Galvanized mod grant them). In our single-weapon benchmark that is
#     never the case, so only each mod's unconditional BASE part applies.
#     Modeled via engine StackPolicy::BaseOnly.
#   - No Incarnon Genesis, no evolutions — the purest weapon in the database.

# Weapon-level metadata (from the wiki data module / infobox).
disposition: 1.00
polarities: [naramon]     # single innate Naramon slot; 8 mod slots, no exilus
riven_family: Verglas
introduced: "Nautilus Prime"
ammo_type: none           # infinite reserve
magazine: 80
reload_seconds: 1.60

# Condition Overload behavior: irrelevant on a sentinel (BaseOnly zeroes any
# CO), recorded as independent for when/if a non-sentinel wielder appears.
co_behavior: independent

# Single attack profile. INNATE ELEMENT weapon: 100% Cold, no IPS. The innate
# Cold enters the elemental hierarchy at position 0 (see engine::loadout::resolve
# innate-element branch), so mod elements combine with it (Cold + Heat -> Blast,
# Cold + Toxin -> Viral, Cold + Electricity -> Magnetic).
attack:
  trigger: held
  shot_type: hitscan
  fire_rate: 12.0
  multishot: 1.0
  ammo_cost: 1
  crit_chance: 0.14
  crit_multiplier: 2.20
  status_chance: 0.36
  damage: { cold: 32.0 }   # total 32, 100% Cold

perks: []
