# THE WIELDER, not necessarily a Tenno (2026-08-04). This file is named for the
# commonest case and the UI is not: a ROBOTIC weapon is carried by a companion,
# and the wiki is explicit — MOAs "share Robotic weapons with Sentinels and
# equip their weapons" (MOA (Companion)), so Verglas Prime's wielder is a
# Sentinel or a MOA. What this entry describes is whoever is holding the gun:
# their state (aiming, invisible, airborne) and, where there IS a Warframe
# behind them, its armor and energy.
#
# The file and the engine type still say `tenno`. Renaming them is a real
# refactor rather than a rename — `tenno` is also DE's own word for the FACTION
# and appears in every `internal_name` (/Lotus/Weapons/Tenno/...), and the wire
# fields `wf_armor`/`wf_energy` sit inside stored presets, so a rename needs a
# migration. Recorded here so the two vocabularies are at least reconciled in
# writing until then.
# The TENNO — the player side of a fight.
#
# The sim has always modelled exactly one actor: the target. Everything that
# depends on the PLAYER existing therefore had nowhere to live, and each such
# mechanic was recorded as unmodelled one file at a time:
#
#   - Secondary Fortifier grants the player Overguard per damage dealt;
#   - Secondary Surge scales damage by the ENERGY remaining after a cast;
#   - the GunCO "Adding" omission list is largely Warframe abilities
#     (Vex Armor, Eclipse, Furious Javelin, Parasitic Link) — MECHANICS §6;
#   - self-stagger from one's own radial attacks (Cautious Shot).
#
# This entry is the seam those attach to. It is LOADED and pinned by a test,
# and it deliberately does NOT participate in any calculation yet: no damage
# number moves because this file exists. Introducing it now, rather than with
# the first mechanic that needs it, is the point — the next change configures a
# Tenno instead of also having to invent one (user, 2026-07-30).
#
# `health` and `shield` are PLACEHOLDERS at 1: present and non-zero so that a
# future consumer reading them cannot silently divide by zero or read "dead",
# but obviously not real Warframe values — no frame has 1 health. Replace them
# with the chosen frame's stats when frames land; do not build anything that
# treats 1 as meaningful.
id: tenno
name: Tenno

# THE WORST MAX-RANK FRAME THAT DOES NOT EXIST (owner, 2026-08-20). Every
# field is the LOWEST value any released Warframe has at rank 30, taken stat by
# stat — so this is not a frame, it is the floor of all of them.
#
# WHY THE FLOOR RATHER THAN AN AVERAGE. A weapon perk gated on a player stat
# either pays or it does not, and there is no honest middle: the neutral Tenno
# is the one who claims the LEAST, so a gate that opens here opens for everybody
# and a number on the card is one nobody can fail to reproduce. It is the same
# rule `sprint` already followed, applied to the other four.
#
# AND IT MAKES THE GATES DECIDE THEMSELVES. Fortress Salvo asks for armor over
# 450 and gets 105, so its punch through is OFF and the card says so — a real
# answer rather than an admission. Give the fight a frame and the same gate
# opens with no code change, which is the whole point of this file.
#
# THREE OF THE FIVE ARE CONFIRMED against the wiki's `Module:Warframes/data`
# (123 released frames, reading `<stat>Rank30` where it exists and the listed
# value where it does not):
#   armor  105  Ash, Banshee, Gyre        — armor does not scale with rank
#   shield  95  Grendel, Grendel Prime    — the module's own `ShieldRank30: 95`
#   sprint 0.9  Atlas, Qorvex             — sprint does not scale with rank
# The other two are the owner's figures, and the module cannot check them: it
# stores a rank-30 value only where a frame BREAKS the standard gain, so reading
# the listed number as a maximum understates every frame that follows it.
#   health 250  Nokko                     — the module lists its base 150
#   energy 150                            — the module's lowest base is 100
health: 250
shield: 95
overguard: 0
armor: 105

# MAX ability energy — the pool, not what is left in it (`state.energy_pct`
# below is that). Primary Overcharge reads both: "While at or above 90% Energy:
# gain 35% of Max Energy as Multishot".
energy: 150

# Sprint multiplier (wiki `Module:Warframes/data` field `Sprint`; Loki Prime is
# 1.25), and the first player stat a weapon perk reads: the Latron family's
# Swift Punishment is "With Sprint Speed 1.2 or Higher: +30% Direct Damage per
# Status Type".
#
# 0.9 IS THE SLOWEST A FRAME HAS (owner, 2026-08-12) — Atlas and Qorvex, and
# sprint does not scale with rank so the listed figure is the rank-30 one. This
# was the FIRST field to take the floor rule and for two years the only one;
# the block above now applies it to the other four. 1.0 would have been a frame
# nobody named, and it sat one tenth under a real threshold — close enough to
# look deliberate and wrong in the same direction as guessing.
sprint: 0.9

# WHAT THE PLAYER IS DOING. A mod card gates on these in words ("while aiming",
# "while Invisible", "while Airborne"), and they are ONE SET OF CONDITIONS the
# engine asks here — not a bool for aim beside a state for the rest, and never
# an unconditional grant (a gate nobody asks is Spectral Serration paying +330%
# to everyone).
#
# The neutral Tenno is doing none of them, which is the honest default for
# "some max-rank frame with no abilities running": those mods contribute
# nothing, and the panel says so rather than folding a number in. Give a frame
# `invisible: true` and Spectral Serration starts paying, with no code change —
# that is the whole reason this block exists.
state:
  # Holding aim. TRUE, unlike the rest: it is what the sim assumed before any
  # of this was configurable, so no stored scenario changes meaning, and it is
  # the panel's optimistic view of a build.
  aiming: true
  invisible: false
  airborne: false
  # CURRENT energy as a fraction of the pool above. Full, because a build
  # calculator is asked what the gun does, not what it does eleven casts in.
  energy_pct: 1.0

source:
  # No wiki page defines "the default Tenno" — the FRAME is our own construction
  # and no such Warframe exists. Every number in it is a real frame's, though:
  # they come from `Module:Warframes/data`, one stat at a time, and the comments
  # above name which frame each floor belongs to.
  url: null
