# Tombfinger, as a PRIMARY — one of the two forms of ONE weapon.
#
# A Kitgun has no published stat line: it has a Chamber, a Grip and a Loader,
# and `engine::kitguns_data` composes them. This file is the CHAMBER's half —
# everything a grip and a loader do not touch, plus the two tables that are
# published PER GRIP because DE publishes them that way rather than as a
# formula.
#
# WHY THIS IS A SEPARATE FILE FROM THE OTHER SLOT. The chamber is the WEAPON
# (mastery, riven family and the wiki page are all per chamber), but the two
# slots are two stat blocks in DE's own module and the difference reaches the
# damage TYPE. A flag could not carry that; two files can. See README.md.
#
# A CHARGED TRIGGER, and the GRIP sets the charge time (0.5 s on Brash to
# 1.4 s on Tremor). So a Tombfinger row on the board carries a SLOT and a
# MODE and they are different facts: 'Tombfinger, primary, charged' is one
# entry and 'Tombfinger, secondary, charged' is another.
#
# ITS `AOE` TAG HAS NUMBERS, AND THEY ARE NOT THE MODULE'S. The module marks
# this chamber AOE and publishes no radius and no radial damage at all, so the
# whole `blast:` block at the foot of this file is off the WEAPON's page. That
# is the ordinary rule here — the wiki wins — but it is worth saying out loud
# for a family whose every other number comes from one machine-readable table:
# an AOE Kitgun cannot be transcribed from the module alone, and one that is
# will silently simulate as a weapon with no explosion.
id: tombfinger_primary
name: Tombfinger
chamber: tombfinger
slot: primary

# THE STATS THAT ARE THE CHAMBER'S OWN — everything a grip and a loader
# do not touch.
crit_chance: 0.24
crit_multiplier: 2
status_chance: 0.24
multishot: 1
accuracy: 50
ammo_cost: 1
ammo_max: 120
ammo_pickup: 20
trigger: "Charge"
shot_type: "Projectile"
riven_disposition: 1
silent: false
spread:
  min_deg: 1
  max_deg: 3
# DE's own compatibility tags, transcribed. They are what a mod pool and
# an equip rule are decided from elsewhere in this repo.
tags: ["PROJECTILE", "AOE", "MODULAR_GUN", "SEMI_AUTO"]

# DAMAGE IS PER GRIP, published per grip. There is no formula behind these
# — the module states one vector per grip and this is that table.
damage:
  base: { impact: 40, radiation: 18 }
  brash: { impact: 30, radiation: 8 }
  palmaris: { impact: 32.5, radiation: 10.5 }
  shrewd: { impact: 35, radiation: 13 }
  steadyslam: { impact: 54.5, radiation: 32.5 }
  tremor: { impact: 69, radiation: 47 }

# …AND SO IS FIRE RATE.
fire_rate:
  brash: 3.77
  palmaris: 3.45
  shrewd: 3.13
  steadyslam: 2.32
  tremor: 2.13

# A CHARGED TRIGGER, and the GRIP sets the charge time.
charge_seconds:
  brash: 0.5
  palmaris: 0.5
  shrewd: 0.8
  steadyslam: 1.1
  tremor: 1.4

# THE MAGAZINE IS A SIZE CLASS, and the loader names which one.
magazine:
  gigahighest: 49
  high: 23
  highest: 29
  low: 15
  lowest: 9
  med: 19
  megahighest: 35
  superhighest: 31

# ================= THE EXPLOSION =================
#
# The module marks this chamber AOE and publishes NO radius and NO radial
# damage, so every number below is off Tombfinger's own page. It states them
# PER GRIP, the same way the module states damage per grip, because the grip is
# what sets the charge — and the charge is what the explosion is.
#
# TWO EXPLOSIONS, NOT ONE. A quick shot and a fully charged shot are different
# sizes and different numbers, which is why this entry has a `charged` form
# beside it: "Quick shots have a base explosion radius of 1.7 meters, while
# fully charged shots have a base explosion radius of 6.2 meters."
#
# AN EXPLOSION IS NEVER A WEAK POINT HIT, in DE's own words: "All explosions
# have a headshot multiplier of 1x and cannot trigger headshot conditions."
# That is the engine's `body_only` rule stated by the page rather than derived,
# and it is the same rule the group ruler writes for a chain and a cloud.
#
# "Initial hit and explosion apply status separately" — two rolls, not one.
blast:
  # A PRIMARY's radius mod is Firestorm; the page names it and its Primed
  # version, and Cautious Shot for the self-damage this arena does not model.
  radius_mods: [firestorm]
  # It staggers the WIELDER, which this arena gives no body to stagger.
  self_stagger: true
  # ONE ENTRY PER FIRING FORM, keyed by that form's own id in
  # `weapons_data::FormKind` — `base` is what the page calls the QUICK SHOT.
  # An exact join rather than a table of synonyms: a form whose explosion is
  # missing composes to nothing at all instead of to a weapon that does not
  # explode.
  forms:
  # THE QUICK SHOT: fired before the charge completes.
    base:
      radius_m: 1.7
      # 100% at the centre to 75% at the rim — a shallow falloff, because the
      # radius is small.
      falloff_to: 0.75
      damage:
        brash: { radiation: 30 }
        palmaris: { radiation: 35 }
        shrewd: { radiation: 40 }
        steadyslam: { radiation: 79 }
        tremor: { radiation: 108 }
    # THE FULL CHARGE: an order of magnitude more damage over three and a half
    # times the radius, and a much steeper falloff.
    charged:
      radius_m: 6.2
      falloff_to: 0.30
      damage:
        brash: { radiation: 412 }
        palmaris: { radiation: 417 }
        shrewd: { radiation: 422 }
        steadyslam: { radiation: 461 }
        tremor: { radiation: 490 }

# ================= PAX CHARGE =================
#
# The Kitgun arcane that replaces the magazine with a rechargeable battery. The
# RATE is per chamber and per slot, and it is stated on Pax Charge's own page
# rather than on this one — a table of six chambers by two slots, verbatim for
# this row. It is "**not** affected by mods or abilities", which is why it is a
# constant here and not a bucket.
#
# The DELAY is not here, because it is not the chamber's: "base recharge delay
# is equal to the reload time displayed on the weapon", which is the LOADER's,
# and it is then shortened by reload speed like any other reload. So the whole
# mechanic is this one number plus machinery the engine already has.
recharge_per_second: 50

source:
  url: https://wiki.warframe.com/w/Tombfinger
  module: https://wiki.warframe.com/w/Module:Modular/data
