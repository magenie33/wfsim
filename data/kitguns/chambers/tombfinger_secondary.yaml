# Tombfinger, as a SECONDARY — one of the two forms of ONE weapon.
#
# A Kitgun has no published stat line: it has a Chamber, a Grip and a Loader,
# and `engine::kitguns_data` composes them. This file is the CHAMBER's half —
# everything a grip and a loader do not touch, plus the two tables that are
# published PER GRIP because DE publishes them that way rather than as a
# formula.
#
# WHY THIS IS A SEPARATE FILE FROM THE OTHER SLOT. The chamber is the WEAPON
# (mastery, riven family and the wiki page are all per chamber), but the two
# slots are two stat blocks in DE's own module and the difference reaches the
# damage TYPE. A flag could not carry that; two files can. See README.md.
#
# THIS SLOT DOES NOT CHARGE. The primary Tombfinger is a Charge trigger whose
# charge time comes from the grip; this one is Semi-Auto and has no charge at
# all, which is why it has one explosion where the primary has two. The two
# slots are two stat blocks and this is the sharpest place they differ.
#
# ITS `AOE` TAG HAS NUMBERS, AND THEY ARE NOT THE MODULE'S. The module marks
# this chamber AOE and publishes no radius and no radial damage at all, so the
# whole `blast:` block at the foot of this file is off the WEAPON's page. That
# is the ordinary rule here — the wiki wins — but it is worth saying out loud
# for a family whose every other number comes from one machine-readable table:
# an AOE Kitgun cannot be transcribed from the module alone, and one that is
# will silently simulate as a weapon with no explosion.
id: tombfinger_secondary
name: Tombfinger
chamber: tombfinger
slot: secondary

# THE STATS THAT ARE THE CHAMBER'S OWN — everything a grip and a loader
# do not touch.
crit_chance: 0.24
crit_multiplier: 2
status_chance: 0.24
multishot: 1
accuracy: 50
ammo_cost: 1
ammo_max: 210
ammo_pickup: 20
trigger: "Semi-Auto"
shot_type: "Projectile"
riven_disposition: 0.7
silent: false
spread:
  min_deg: 1
  max_deg: 3
# DE's own compatibility tags, transcribed. They are what a mod pool and
# an equip rule are decided from elsewhere in this repo.
tags: ["PROJECTILE", "AOE", "MODULAR_GUN", "SEMI_AUTO"]

# DAMAGE IS PER GRIP, published per grip. There is no formula behind these
# — the module states one vector per grip and this is that table.
damage:
  base: { impact: 16, puncture: 9, radiation: 59 }
  gibber: { impact: 8, puncture: 1, radiation: 27 }
  haymaker: { impact: 32, puncture: 25, radiation: 123 }
  lovetap: { impact: 24, puncture: 17, radiation: 91 }
  ramble: { impact: 12, puncture: 5, radiation: 43 }
  ulnaris: { impact: 18.67, puncture: 11.67, radiation: 69.67 }

# …AND SO IS FIRE RATE.
fire_rate:
  gibber: 4.5
  haymaker: 2.17
  lovetap: 2.5
  ramble: 3.67
  ulnaris: 2.83

# THE MAGAZINE IS A SIZE CLASS, and the loader names which one.
magazine:
  gigahighest: 49
  high: 23
  highest: 29
  low: 15
  lowest: 9
  med: 19
  megahighest: 35
  superhighest: 31

# ================= THE EXPLOSION =================
#
# Off the weapon's own page; the module marks the chamber AOE and publishes
# neither radius nor radial damage.
#
# NO CHARGE HERE. The secondary is Semi-Auto and has ONE explosion: "Upon
# impact, the projectile explodes in a 1.9 meter radius in a reverse-cone
# shape, dealing damage to enemies in front of the original target." The cone
# is not modelled — this arena has no facing for a splash — and a sphere is the
# generous reading of it, which is written down rather than left to be noticed.
#
# AN EXPLOSION IS NEVER A WEAK POINT HIT: "Explosion has a headshot multiplier
# of 1x and cannot trigger headshot conditions."
blast:
  # A SECONDARY's radius mod is Fulmination, not Firestorm. The page names it.
  radius_mods: [fulmination]
  self_stagger: true
  # ONE ENTRY PER FIRING FORM. This slot has exactly one.
  forms:
   impact:
    radius_m: 1.9
    falloff_to: 0.70
    # THE SPLIT IS A SHARE OF THE CHAMBER'S OWN DAMAGE, not a separate table —
    # this is the one Kitgun explosion that is carved out of the shot rather
    # than added to it. The page: "The Impact, Puncture and ~19.5% of the
    # Radiation damage make up the direct hit, the remaining ~80.5% of Radiation
    # damage is assigned to the explosion."
    #
    # THE PAGE CONTRADICTS ITS OWN WORKED EXAMPLE and this is UNSETTLED. The
    # example is "a kitgun built with Tombfinger with 180 base damage deals 91
    # on direct hit and 89 with the splash" — 180 is the Haymaker row exactly
    # (Impact 32 + Puncture 25 + Radiation 123). The stated RULE gives
    # 32 + 25 + 0.195x123 = 81 direct and 99 splash; the EXAMPLE gives 91 and
    # 89, which needs 27.6% of the Radiation on the direct hit. Both halves sum
    # to 180, so one of the two is wrong and no arithmetic here can say which.
    #
    # The RULE is transcribed because it is stated as the mechanic and the
    # example reads like a stale measurement — and this comment exists so that
    # is a decision somebody made rather than a number nobody questioned. One
    # in-game reading of a Haymaker Tombfinger settles it.
    splash_share_of: radiation
    splash_share: 0.805

source:
  url: https://wiki.warframe.com/w/Tombfinger
  module: https://wiki.warframe.com/w/Module:Modular/data
