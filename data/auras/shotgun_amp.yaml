# Shotgun Amp — an AURA, which is the SQUAD's mod rather than the weapon's.
#
# see notes: auras_are_warframe_file
#
# The shotgun half, and it is the SMALLER number — 18%, not 27%.
id: shotgun_amp
name: Shotgun Amp
polarity: madurai
base_drain: 9
max_rank: 5
# STACKS ACROSS THE SQUAD: the count is how many teammates run it, 0-4.
squad_stacking: true

effects:
  - kind: weapon_damage_bonus
    rankMax: 0.18
    # The shotgun pool.
    requires_pool: shotgun

source:
  url: https://wiki.warframe.com/w/Shotgun_Amp
