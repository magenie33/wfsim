# Dead Eye — an AURA, which is the SQUAD's mod rather than the weapon's.
#
# Auras are on the WARFRAME, so this file is read into the fight's Tenno beside
# armour and energy — the block that becomes a real frame when frames are built. Nothing here is a weapon stat and nothing belongs in a
# build: two players with the same gun and different squads are two fights.
#
# +52.5% SNIPER damage, the largest of the amp family and the narrowest.
id: dead_eye
name: Dead Eye
polarity: madurai
base_drain: 9
max_rank: 5
# STACKS ACROSS THE SQUAD: the count is how many teammates run it, 0-4.
squad_stacking: true

effects:
  - kind: weapon_damage_bonus
    rankMax: 0.525
    # THE CLASS, and this one really is narrower than a pool: "only affects
    # actual sniper rifles ... even though bows and launchers draw from the
    # sniper ammo pool, they are not affected by this mod".
    requires_class: sniper

source:
  url: https://wiki.warframe.com/w/Dead_Eye
