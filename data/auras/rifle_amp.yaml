# Rifle Amp — an AURA, which is the SQUAD's mod rather than the weapon's.
#
# see notes: auras_are_warframe_file
#
# +27% RIFLE damage. It is a base-damage bonus like Serration, which is
# why it belongs in that bucket rather than as a final multiplier.
id: rifle_amp
name: Rifle Amp
polarity: madurai
base_drain: 9
max_rank: 5
# STACKS ACROSS THE SQUAD: the count is how many teammates run it, 0-4.
squad_stacking: true

effects:
  - kind: weapon_damage_bonus
    rankMax: 0.27
    # THE MOD POOL, not the class. Its page: it "also affects bows, sniper
    # rifles and launchers" and shotguns do NOT benefit — which is the `rifle`
    # pool exactly, and not any class.
    requires_pool: rifle

source:
  url: https://wiki.warframe.com/w/Rifle_Amp
