# Coaction Drift — an AURA, which is the SQUAD's mod rather than the weapon's.
#
# see notes: auras_are_warframe_file
#
# +15% AURA STRENGTH — it multiplies the other auras rather than doing
# anything itself, which is why it is its own kind.
id: coaction_drift
name: Coaction Drift
polarity: naramon
base_drain: 4
max_rank: 5
rarity: rare
exilus: true
internal_name: /Lotus/Upgrades/Mods/OrokinChallenge/OrokinChallengeModCollaboration
description: "Squad benefits +15% more from Auras\nYou benefit an additional +15% from Auras"
# STACKS ACROSS THE SQUAD: the count is how many teammates run it, 0-4.
squad_stacking: true

effects:
  - kind: aura_strength_bonus
    rankMax: 0.15

source:
  url: https://wiki.warframe.com/w/Coaction_Drift
