id: damage_modifiers

# Post-U36 ("Jade Shadows", 2024-06) faction damage system. The 13 Damage-2.0
# health/armor/shield classes (Cloned Flesh, Ferrite Armor, Proto Shield, ...)
# were removed: every enemy now has plain Health / Armor / Shield, and damage
# type modifiers are FACTION-wide, always active regardless of armor/shield
# presence.
#
# Values are stored as NUMERIC incoming-damage multipliers per damage type
# (any type not listed = 1.0). As of U36 every published value happens to be
# 1.5 or 0.5 - do not bake that coincidence into schema or code.
#
# Column resolution per enemy: FactionDamageOverride ?? Faction, exactly one
# column per enemy; the Overguard and Object pools always use their own
# columns below instead.

factions:
  grineer:
    impact: 1.5
    corrosive: 1.5
  kuva_grineer:
    impact: 1.5
    corrosive: 1.5
    heat: 0.5
  corpus:
    puncture: 1.5
    magnetic: 1.5
  corpus_amalgam:
    electricity: 1.5
    magnetic: 1.5
    blast: 0.5
  infested:
    slash: 1.5
    heat: 1.5
  infested_deimos:
    blast: 1.5
    gas: 1.5
    # RESOLVED (2026-07-24): 0.5 confirmed by the user against
    # wiki Damage_Type_Modifier (their earlier +50% was a typo).
    viral: 0.5
  orokin:                       # the Corrupted + Warframe Specters
    puncture: 1.5
    viral: 1.5
    radiation: 0.5
  sentient:
    cold: 1.5
    radiation: 1.5
    corrosive: 0.5
  narmer:
    slash: 1.5
    toxin: 1.5
    magnetic: 0.5
  the_murmur:
    electricity: 1.5
    radiation: 1.5
    viral: 0.5
  # Exactly three units use this column (wiki Damage/Zariman): Thrax
  # Centurion, Thrax Legatus, Void Angel — plus their variants (Eclipse/
  # Hollow/Lua Thrax, Deep Archimedea/Ethereal/Ravenous Void Angel), 12
  # module entries total, all via FactionDamageOverride.
  zariman:
    void: 1.5
  scaldra:
    impact: 1.5
    corrosive: 1.5
    gas: 0.5
  techrot:
    magnetic: 1.5
    gas: 1.5
    cold: 0.5
  anarchs:
    impact: 1.5
    electricity: 1.5
    radiation: 0.5
  tenno: {}
  # ---- OURS, not the wiki's ------------------------------------------------
  # Everything above is a COLUMN of the wiki's Damage/Overview_Table — all 15
  # of them, verified cell by cell against it (docs/DATA_SOURCES.md, 2026-08-03).
  # The two below are not in that table: they are faction values the enemy
  # module uses for which the table publishes no column, i.e. units that take
  # every damage type as written.
  #
  # They are written down rather than left to a fallback because a faction key
  # the engine cannot find is a DATA ERROR, not a neutral enemy — and that
  # distinction is only enforceable if "neutral" is something the data SAYS.
  # `unknown` is the Thrax/no-faction column (their Zariman vulnerability
  # arrives through FactionDamageOverride, not through this key); `stalker`
  # is the Acolytes, "neutral to every element" as of U36 (wiki Acolytes).
  # A new enemy whose faction is one the table skips (Duviri, Predator, Prey,
  # Neutral, Objects) needs its neutral column added here, deliberately.
  unknown: {}
  stalker: {}

# Special pool columns (not factions): used whenever damage lands on these
# pools, regardless of the enemy's faction column.
special:
  object:
    # note: No critical hits, no status effects, all multipliers 1.0.
  overguard:
    void: 1.5                   # the only other Void-vulnerable pool
    # note: >-
    # Neutral to all other damage types. No status/damage spillover to
    # shields/health beneath it; grants crowd-control immunity while active
    # (max 4 Cold procs) and blocks Parazon Mercy entirely. Magnetic status
    # amplifies damage against it (+100% first stack, +25% per further
    # stack, max +325% at 10). Damage Vulnerability effects apply normally
    # to Overguard.

# ---------------------------------------------------------------------------
# SYSTEM A - faction damage MODS (Bane/Cleanse/Expel/Smite) - a SEPARATE
# system from the multiplier table above, keyed by the enemy's Faction
# (never by FactionDamageOverride, which only redirects the table above).
# Total-damage multiplier; applied a SECOND time to DoT ticks from status
# effects ("double dipping").
# The faction damage MODS themselves (Bane/Cleanse/Expel/Smite) are MOD
# entries with per-rank values — data/mods/*/expel_*.yaml is the source of
# truth (normal +5%/rank to +30%, Primed to +55%). Nothing mod-shaped is
# recorded here.
# System notes: our canonical bucket is faction_damage (GLOSSARY.md) —
# additive WITHIN the bucket, multiplies total damage, double-dips DoT
# ticks. Ability members share the bucket: Roar (matches ALL factions),
# Paracesis' anti-Sentient passive. Mods exist only for grineer, corpus,
# infested, orokin, the_murmur; Sentient coverage is melee-only
# (Sacrificial Pressure/Steel). No mods exist for anarchs, narmer, scaldra,
# techrot, stalker, wild, zariman, unknown.
  # strict_matching: >-
  # No inheritance across counterparts: Bane of Grineer works on Lancer but
  # NOT on Corrupted Lancer or Narmer Lancer; Infested mods do NOT affect
  # Techrot. Thrax units (Faction "Unknown") match no faction mod at all -
  # their Zariman override only selects the multiplier column above.
  # note: >-
  # Both systems stack multiplicatively when both apply (a regular Lancer
  # takes Bane of Grineer x1.55 AND Impact x1.5). The wiki enemy module even
  # contains a Corrupted unit with FactionDamageOverride "Corpus": it takes
  # Bane of Orokin (Faction) while using the Corpus multiplier column
  # (Override) - proof the two keys are independent.

source:
  url: https://wiki.warframe.com/w/Damage/Overview_Table
  # note: >-
  # Overview table plus the per-faction pages (Damage/Grineer,
  # Damage/Zariman, ...) and Overguard page; all state the U36 "Simplified
  # Faction Resistances" values. Faction-mod system from Faction_Damage_Bonus.
