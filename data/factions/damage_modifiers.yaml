schema_version: 0
id: damage_modifiers
kind: faction_damage_modifiers

# Post-U36 ("Jade Shadows", 2024-06) faction damage system. The 13 Damage-2.0
# health/armor/shield classes (Cloned Flesh, Ferrite Armor, Proto Shield, ...)
# were removed: every enemy now has plain Health / Armor / Shield, and damage
# type modifiers are FACTION-wide, always active regardless of armor/shield
# presence.
#
# Values are stored as NUMERIC incoming-damage multipliers per damage type
# (any type not listed = 1.0). As of U36 every published value happens to be
# 1.5 or 0.5 - do not bake that coincidence into schema or code.
#
# Column resolution per enemy: FactionDamageOverride ?? Faction, exactly one
# column per enemy; the Overguard and Object pools always use their own
# columns below instead.

factions:
  grineer:
    impact: 1.5
    corrosive: 1.5
  kuva_grineer:
    impact: 1.5
    corrosive: 1.5
    heat: 0.5
  corpus:
    puncture: 1.5
    magnetic: 1.5
  corpus_amalgam:
    electricity: 1.5
    magnetic: 1.5
    blast: 0.5
  infested:
    slash: 1.5
    heat: 1.5
  infested_deimos:
    blast: 1.5
    gas: 1.5
    # DISPUTED (2026-07-24): the Damage/Infested_Deimos page and the U36
    # patch notes both say resistant (0.5), but the user's compiled table
    # lists +50% (1.5). Needs an in-game check (codex / test shot).
    viral: 0.5
  orokin:                       # the Corrupted + Warframe Specters
    puncture: 1.5
    viral: 1.5
    radiation: 0.5
  sentient:
    cold: 1.5
    radiation: 1.5
    corrosive: 0.5
  narmer:
    slash: 1.5
    toxin: 1.5
    magnetic: 0.5
  the_murmur:
    electricity: 1.5
    radiation: 1.5
    viral: 0.5
  zariman:                      # Thrax units, Void Angels
    void: 1.5
  scaldra:
    impact: 1.5
    corrosive: 1.5
    gas: 0.5
  techrot:
    magnetic: 1.5
    gas: 1.5
    cold: 0.5
  anarchs:
    impact: 1.5
    electricity: 1.5
    radiation: 0.5
  tenno: {}

# Special pool columns (not factions): used whenever damage lands on these
# pools, regardless of the enemy's faction column.
special:
  object:
    note: No critical hits, no status effects, all multipliers 1.0.
  overguard:
    void: 1.5                   # the only other Void-vulnerable pool
    note: >-
      Neutral to all other damage types. No status/damage spillover to
      shields/health beneath it; grants crowd-control immunity while active
      (max 4 Cold procs). Magnetic status amplifies damage against it
      (+100% first stack, +25% per further stack, max +325% at 10).

# ---------------------------------------------------------------------------
# SYSTEM A - faction damage MODS (Bane/Cleanse/Expel/Smite) - a SEPARATE
# system from the multiplier table above, keyed by the enemy's Faction
# (never by FactionDamageOverride, which only redirects the table above).
# Total-damage multiplier; applied a SECOND time to DoT ticks from status
# effects ("double dipping").
faction_mods:
  multiplier_normal: 1.30      # +5%/rank, rank 5
  multiplier_primed: 1.55
  available_for: [grineer, corpus, infested, orokin, the_murmur]
  sentient_special: >-
    Melee only (Sacrificial Pressure/Steel, Umbra polarity, lower bonus,
    set effect when both equipped).
  no_mods_exist_for: [anarchs, narmer, scaldra, techrot, stalker, wild,
                      zariman, unknown]
  strict_matching: >-
    No inheritance across counterparts: Bane of Grineer works on Lancer but
    NOT on Corrupted Lancer or Narmer Lancer; Infested mods do NOT affect
    Techrot. Thrax units (Faction "Unknown") match no faction mod at all -
    their Zariman override only selects the multiplier column above.
  note: >-
    Both systems stack multiplicatively when both apply (a regular Lancer
    takes Bane of Grineer x1.55 AND Impact x1.5). The wiki enemy module even
    contains a Corrupted unit with FactionDamageOverride "Corpus": it takes
    Bane of Orokin (Faction) while using the Corpus multiplier column
    (Override) - proof the two keys are independent.

source:
  url: https://wiki.warframe.com/w/Damage/Overview_Table
  note: >-
    Overview table plus the per-faction pages (Damage/Grineer,
    Damage/Zariman, ...) and Overguard page; all state the U36 "Simplified
    Faction Resistances" values. Faction-mod system from Faction_Damage_Bonus.
  retrieved: "2026-07-24"

verification:
  status: unverified
  needs_measurement: true
