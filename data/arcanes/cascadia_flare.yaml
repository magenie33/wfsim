id: cascadia_flare
name: Cascadia Flare
kind: arcane
slot: secondary_arcane
max_rank: 5

# On applying a HEAT status effect (any source, even holstered): +12%
# secondary damage per stack, up to 40 stacks (+480%), 10 s shared
# timer refreshed by each new Heat proc. HARD RESET decay: if 10 s pass
# without a fresh Heat status, ALL stacks drop at once (unlike the
# Galvanized one-by-one decay). One stack per damage instance (multiple
# procs in one hit still grant one). ADDITIVE with base-damage mods
# (Hornet Strike bucket) - scales ModifiedBase too.
trigger: on_heat_status_applied
buff:
  per_stack_base_damage: 0.12
  max_stacks: 40
  duration_seconds: 10
  decay: all_stacks_drop_on_timeout
  bucket: base_damage
  one_stack_per_damage_instance: true

source:
  url: https://wiki.warframe.com/w/Cascadia_Flare
  retrieved: "2026-07-24"
