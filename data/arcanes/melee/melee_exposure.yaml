id: melee_exposure
name: Melee Exposure
rarity: rare
max_rank: 5
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Offensive/CorrosiveMeleePerAbilityCast
description: "On Ability Cast: Gain 60% Corrosive Damage on Melee strikes for 25s. Stacks up to 240%."

# Rank 0: On Ability Cast: Gain 10% Corrosive Damage on Melee strikes for 25s. Stacks up to 240%.
effects:
  # +60% Corrosive PER CAST to four stacks — "Stacks up to 240%" — and it is
  # held for the whole engagement.
  #
  # THE STACKS ARE ASSUMED, AND THAT IS A DECISION ABOUT THE TENNO. The trigger
  # is a Warframe cast, which this arena cannot perform: the choice is between
  # holding every stack and paying nothing at all, and a melee player casts. So
  # the 25 s timer never runs out here and the card is worth its cap.
  #
  # ADDITIVE WITH ELEMENTAL MODS, like every other added element in this engine
  # — it does not combine with what the mods make, so a Corrosive build gets a
  # bigger Corrosive and a Viral build gets Viral AND Corrosive.
  - kind: added_element
    element: corrosive
    rank0: 0.10
    rankMax: 0.60
    max_stacks: 4

source:
  url: https://wiki.warframe.com/w/Melee_Exposure
