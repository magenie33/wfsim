id: secondary_deadhead
name: Secondary Deadhead
kind: arcane
slot: secondary_arcane
max_rank: 5

# On PRECISION HEADSHOT KILL: +120% damage per stack (max 3 = +360%),
# 24 s per stack. Decay: lose ONE stack and reset the timer (Galvanized-
# style graceful decay). The damage bonus is ADDITIVE with base-damage
# mods (Hornet Strike bucket) - it therefore also scales ModifiedBase
# (DoT payloads, elemental amounts).
# PRECISION headshot kill - NOT the same boundary as a plain "headshot
# kill" (user, 2026-07-25). Wiki verbatim: "'Precision' refers to direct
# hit headshots (not AoE)". Excluded: AoE/explosion damage and most
# status-proc kills on the head. Included: direct hits; Electricity/Gas
# proc kills aimed at the head (those procs land their own headshots).
# Sim: direct pellet headshot kills only - satisfies the boundary
# exactly for a hitscan single-target weapon (chain-hit headshots wait
# on the multi-actor arena).
trigger: on_precision_headshot_kill
buff:
  per_stack_base_damage: 1.20
  max_stacks: 3
  duration_seconds: 24
  decay: lose_one_stack_and_reset_duration
  bucket: base_damage

# Rank-5 passives (unconditional while equipped):
passives:
  # ADDED TO THE MULTIPLIER VALUE itself (wiki notes: a 2.0x headshot
  # multiplier becomes 2.3x, a 1.0x becomes 1.3x) - i.e. 3.0x -> 3.3x,
  # a x1.1 damage factor on standard heads, NOT x1.3. Stacks additively
  # with Prowl-type bonuses. Electricity/Gas procs can register their
  # own 1.0x headshots -> 1.3x (wiki notes a 1.69x compounded case).
  headshot_multiplier_bonus: 0.30
  recoil: -0.50                     # not a damage bucket

# Trigger detail: kills by most status procs on the head do NOT count as
# headshot kills; Electricity/Gas procs can land headshots themselves.
# (Sim: only direct pellet headshot kills refresh - conservative match.)

source:
  url: https://wiki.warframe.com/w/Secondary_Deadhead
  retrieved: "2026-07-24"
