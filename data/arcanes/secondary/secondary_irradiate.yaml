id: secondary_irradiate
name: Secondary Irradiate
rarity: rare
max_rank: 5
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Offensive/RadialDamageOnMaxRadiationStackHit
description: "On hitting enemies afflicted by 10 stacks of Radiation: Deal X% of the hit damage to enemies within Xm."

effects:
  # THE WIKI'S NOTES, ONE BY ONE, with what the engine does about each
  # (re-read in full 2026-08-21). The line this replaced said "beams/AoE don't
  # spread", and the beam half of that is WRONG — the page's own example of a
  # spreading hit is a SPLIT BEAM.
  #
  #   "Only direct hits spread to nearby enemies"          -> `if direct`
  #   "Includes secondary hits, such as split beams from
  #    Tenet Cycron and bullet ricochet from Sicarus"      -> both route through
  #                                                           the direct stage
  #   "Additional shots from Multishot WILL trigger Spread
  #    hits, except from beam weapons"                     -> falls out: a
  #       continuous weapon merges its multishot into ONE instance, so the echo
  #       already fires once a tick rather than once per instance
  #   "count as regular body hits"                         -> headshot: false,
  #                                                           part_factor 1.0
  #   "calculate damage separately from the original hit"  -> each body brings
  #       its own CO bucket, half-health term, armour, shields and procs
  #   "apply the SAME status effects as the hit that
  #    proc'd them, and benefit from Status Damage"        -> the echo rolls its
  #       OWN procs at full status chance; same mean, and the page is ambiguous
  #       between "the same effects" and "effects of the same kinds"
  #   "Will roll a separate critical hit chance per enemy" -> NOT MODELLED: the
  #       echo inherits the pellet's crit multiplier, so the MEAN is unchanged
  #       and only the CORRELATION differs, which a kill count is sensitive to
  #   "Spread hits require line of sight"                  -> an EDGE: this
  #                                                           arena has no cover
  - kind: aoe_echo
    # READ AND SIMULATED as of 2026-08-18 (`arc_condition` ->
    # `ArcCondition::TargetRadiationStacks`). The echo fires only off a body
    # already at 10 stacks of Radiation, which is the cap and is most of what
    # this arcane costs to use.
    #
    # It was NOT read before that: the loader took `trigger`/`grants` and the
    # per-rank values and never `condition`, so the echo fired off targets with
    # no Radiation on them at all — reported by a player, not by any check we
    # had. A CONDITION ABOUT THE TARGET IS SIMULATED; one about the TENNO is
    # assumed-max and says so. Radiation's stacks have been tracked since the
    # engine had statuses, so this was never something the sim could not know.
    condition: target_has_10_radiation_stacks
    rank0: 0.8                 # fraction of the hit damage dealt in the radius
    rankMax: 1.8
    radius_rank0: 4.5
    radius_rankMax: 7

source:
  url: https://wiki.warframe.com/w/Secondary_Irradiate
