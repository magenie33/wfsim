id: akimbo_slip_shot
name: Akimbo Slip Shot
rarity: rare
max_rank: 5
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Offensive/AmmoEfficiencyOnSliding
description: "While sliding or aim gliding: Gain X% ammo efficiency with Dual Pistols."

requires: dual_pistols   # effect inert on non-dual secondaries (calc layer)

effects:
  # Ammo economy only (chance not to consume ammo) - no DPS bucket; waits on
  # the ammo-economy subsystem. Cannot go on exalted weapons.
  - kind: ammo_efficiency
    # NOT READ by `arcanes_data`: the loader takes `trigger`/`grants` and the
    # per-rank values, never `condition`. So the buff resolves as if its gate were
    # always satisfied — the house assumed-max reading, recorded here because
    # it is optimistic, not neutral (data/README.md).
    condition: while_sliding_or_aim_gliding
    rank0: 0.15
    rankMax: 0.65

source:
  url: https://wiki.warframe.com/w/Akimbo_Slip_Shot
