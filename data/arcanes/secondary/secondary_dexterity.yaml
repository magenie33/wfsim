id: secondary_dexterity
name: Secondary Dexterity
rarity: rare
max_rank: 5
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Offensive/SecondaryDamageOnMeleeKill
description: "On Melee Kill:\n+X% Damage for 20s. Stacks up to 6x.\n+7.5s Combo Duration"

effects:
  # Additive with base-damage mods (Hornet Strike bucket). On timeout: lose ONE
  # stack and reset the timer. Companion melee kills also trigger it.
  - kind: buff
    trigger: on_melee_kill
    grants: base_damage
    rank0: 0.1
    rankMax: 0.6
    max_stacks: 6
    duration: 20
    decay: lose_one_and_reset
  # Melee Combo Counter duration (seconds) - a melee stat, inert for the
  # secondary-weapon calc.
  # NOT LOADED: `arcanes_data` has no `combo_duration_bonus` arm, so this entry
  # is dropped entirely (data/README.md). Doubly inert — it is a MELEE stat and
  # this is a gun calc — but the drop is the reason nothing shows on the panel.
  - kind: combo_duration_bonus
    rankMax: 7.5
    unlocks_at_rank: 5

source:
  url: https://wiki.warframe.com/w/Secondary_Dexterity
