id: residual_malodor
name: Residual Malodor
rarity: rare
max_rank: 3
description: "On Kill: 20% chance to create a frigid mist, dealing 40 Cold Damage."

equip_traits: [modular]
# see notes: own_seat_whole_point
#
# see notes: kitgun_rather_than_modular
seats: [kitgun]

effects:
  # see notes: ground_field_family_here
  #
  # THE NUMBERS. 20% chance at every rank, 40 Cold, 10 m range,
  # 9 m buff radius, and a DURATION that is the only thing rank buys:
  # 3 / 6 / 9 / 12 seconds. The damage does not scale with the build — it is the
  # field's, not the weapon's — so its share of a fight falls as the build gets
  # stronger, which is exactly the shape a player needs told rather than guessed.
  #
  # see notes: two_at_time_across
  #
  # AND THE FIELD'S DAMAGE DOES NOT COMBINE WITH THE WEAPON'S ELEMENTS. It stays
  # Cold, which is why a build's own elemental pairing cannot be read into
  # it.
  - kind: unmodeled
    trigger: kill
    rank0: 3
    rankMax: 12

unmodeled:
  - "the FIELD is not placed. On a kill this has a 20% chance to leave something on the ground for 3-12 seconds dealing 40 Cold damage to enemies within 10 m, and none of it is counted — so against a crowd, where kills are frequent and bodies stand close, this arcane is worth more than the zero shown here. Its damage is flat and does not scale with the build, so what it is worth falls as the build gets stronger"

source:
  url: https://wiki.warframe.com/w/Residual_Malodor
