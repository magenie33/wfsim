id: secondary_merciless
name: Secondary Merciless
rarity: rare
max_rank: 5
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Offensive/SecondaryDamageOnKill
description: "On Kill:\n+X% Damage for 4s. Stacks up to 12x.\n+30% Reload Speed"

effects:
  # Additive with base-damage mods (Hornet Strike bucket). On timeout: lose ONE
  # stack and reset the timer (kill-family decay, unlike the on-status family).
  - kind: buff
    trigger: on_kill
    grants: base_damage
    rank0: 0.05
    rankMax: 0.3
    max_stacks: 12
    duration: 4
    decay: lose_one_and_reset
  - kind: reload_speed_bonus
    rankMax: 0.3
    unlocks_at_rank: 5

source:
  url: https://wiki.warframe.com/w/Secondary_Merciless
