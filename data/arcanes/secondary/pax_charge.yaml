id: pax_charge
name: Pax Charge
rarity: rare
max_rank: 3
description: "Makes magazine rechargeable with X% Reduced Recharge Delay."

equip_traits: [modular]
# BOTH SEATS. A Kitgun is ONE weapon with a roster entry in each slot, so a
# primary Tombfinger has a PRIMARY arcane seat and a secondary one a SECONDARY
# seat, and this goes in either. Filed under one directory because arcane ids
# are globally unique across slots.
seats: [primary, secondary]

effects:
  # THE MAGAZINE BECOMES A BATTERY, which this engine has modelled since the
  # Shedu (`weapons_data::Battery`) — so the arcane is a rate the WEAPON states
  # plus a reload-speed bonus, and nothing new in the sim.
  #
  # THE DELAY IS THE RELOAD. "Similar to Archguns and the Cycron, base recharge
  # delay is equal to the reload time displayed on the weapon", and it is
  # "further reduced (stacking additively) by reload speed mods like Quickdraw
  # and Stunning Speed" — so the per-rank value joins the same additive bucket
  # the mods feed and the sim's own reload arithmetic does the rest. The page
  # works its own example: 2.1 s at rank 3 is 2.1 / 1.5 = 1.4 s, "a reduction of
  # 33.3%", which is what `reload_span` computes.
  #
  # THE RATE IS THE CHAMBER'S and is NOT here: "recharge rate is **not** affected
  # by mods or abilities. Recharge rate depends on the chamber part" — a table of
  # six chambers by two slots, transcribed into each chamber's own yaml as
  # `recharge_per_second`. A chamber whose row nobody has read grants nothing,
  # and keeps its ordinary reload rather than becoming a weapon that never
  # reloads.
  - kind: rechargeable_magazine
    rank0: 0.125
    rankMax: 0.50

unmodeled:
  - "a LIVE reload buff shortens the REFILL here and does not in game. The delay and the refill are one number in this sim's reload, and the arcane's own static bonus is compensated for exactly — so a build with reload MODS is right — but a buff that arrives mid-fight (Conjunction Voltage's stacks, Merciless) also speeds up the rounds-per-second part, which 'is **not** affected by mods or abilities'. Worth at most the refill itself, which is 0.6 s of a 2.0 s empty cycle on a Tombfinger"
  - "it PREVENTS reload-triggered mods and arcanes from paying — 'such as Pressurized Magazine or Arcane Awakening' — because there is no reload to trigger them. This sim applies no such lock, so a build pairing one with Pax Charge is overstated by whatever that mod is worth"

source:
  url: https://wiki.warframe.com/w/Pax_Charge
