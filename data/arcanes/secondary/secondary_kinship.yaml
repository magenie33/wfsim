  # mechanic with no fixed cap; inert in the single-actor sim.
  - kind: crit_chance_bonus
    condition: while_buffing_ally_warframes
    per: ally_buff
    rank0: 0.03
    rankMax: 0.2
    ranks: [0.03, 0.06, 0.1, 0.13, 0.17, 0.2]   # NON-LINEAR (warframestat)

