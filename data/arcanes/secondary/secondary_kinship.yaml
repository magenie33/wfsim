id: secondary_kinship
name: Secondary Kinship
rarity: rare
max_rank: 5
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Offensive/SecondaryCritChancePerBuff
description: "While Buffing Ally Warframes: +X% Critical Chance per buff"

effects:
  # Flat crit chance ADDITIVE with the crit-chance bucket (wiki: Bolto with
  # maxed Pistol Gambit + 3 stacks = 16% x (1 + 120% + 3 x 20%)). One stack per
  # ally-affecting buff, counted PER TARGET each buff reaches - a team-context
  # mechanic with no fixed cap; inert in the single-actor sim.
  - kind: crit_chance_bonus
    # NOT READ by `data::arcanes`: the loader takes `trigger`/`grants` and the
    # per-rank values, never `condition`. So the buff resolves as if its gate were
    # always satisfied — the house assumed-max reading, recorded here because
    # it is optimistic, not neutral (data/README.md).
    condition: buffing_ally_warframes
    per: ally_buff
    rank0: 0.0334
    rankMax: 0.2004
    ranks: [0.0334, 0.0667, 0.1002, 0.1336, 0.167, 0.2004]   # wiki rank table

source:
  url: https://wiki.warframe.com/w/Secondary_Kinship
