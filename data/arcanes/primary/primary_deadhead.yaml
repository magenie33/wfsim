id: primary_deadhead
name: Primary Deadhead
rarity: rare
max_rank: 5
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Offensive/PrimaryDamageOnNoMelee
description: "On Weak Point Kill:\n+X% Damage for 24s. Stacks up to 3x.\n+30% to Headshot Multiplier\n-50% Weapon Recoil"

effects:
  # A WEAK-POINT KILL by the DIRECT hit: "'Precision' refers to direct hit weak
  # points (not AoE)", and a radial never triggers a weak-point condition
  # (MECHANICS section 7). `headshot_kill` is the trigger's wire id; the engine
  # fires it on `is_weak_point`.
  # Also excluded (wiki): "Kills from some status procs on the target's weak
  # point do not count as a weak point kill." Electricity and Gas proc kills
  # aimed at the head DO count - those procs land their own headshots.
  - kind: buff
    trigger: headshot_kill
    grants: base_damage
    rank0: 0.2
    rankMax: 1.2
    max_stacks: 3
    duration: 24
    decay: lose_one_and_reset
  # Headshot bonuses form an ADDITIVE BRACKET multiplying the body-part
  # multiplier (MECHANICS section 7): a 3x head becomes 3.9x with this alone.
  - kind: headshot_multiplier_bonus
    rankMax: 0.3
    unlocks_at_rank: 5
  # NOT LOADED: `data::arcanes` has no `recoil_reduction` arm, so this entry is
  # dropped (data/README.md). The MODS loader has one — different loader,
  # different vocabulary. Recoil is handling, not a damage bucket.
  - kind: recoil_reduction
    rankMax: 0.5
    unlocks_at_rank: 5

source:
  url: https://wiki.warframe.com/w/Primary_Deadhead
