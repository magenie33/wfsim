# BOWS ONLY, and that is an EQUIP rule rather than a calc-layer one (owner,
# 2026-08-05: "只能那个武器装上的，其他的不可以"). The arsenal does not offer it
# elsewhere, so neither do we.
#
# "Cannot be equipped on crossbows such as Attica, Nagantaka (Prime), and Zhuge
# (Prime)" needs no special case: a crossbow is its own class on the wiki
# (`Class = "Crossbow"`, tag CROSSBOW), so `bow` already excludes them. The note
# exists because players assume a crossbow is a bow; the data never did.
id: longbow_sharpshot
name: Longbow Sharpshot
rarity: legendary
max_rank: 5
equip_classes: [bow]
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Offensive/LongbowDamageOnHeadshot
description: "On Headshot: Gain +X% damage on your next shot."

effects:
  # ITS OWN MULTIPLIER, not a Serration-bucket bonus — this was wrong when the
  # arcane was first added and the wiki says so outright: "Damage bonus is
  # multiplicative to mods like Serration."
  #
  #   damage bonus% = [(1 + Serration) x (1 + Longbow Sharpshot)] + Galvanized Aptitude
  #
  # The Galvanized Aptitude term sits OUTSIDE the product, and the wiki explains
  # why: GunCO's contribution is a recalculation of every bonus except +damage,
  # and that recalculation is stale — it does not know about this arcane. So CO
  # does not multiply the Sharpshot bonus even where CO is otherwise additive
  # with damage mods (Daikyu). We model the product; the CO interaction is the
  # weapon's own `co_behavior` bracket and is not changed here.
  #
  # UPTIME. "As long as every consecutive shot is a headshot, the buff is always
  # active", and the benchmark's Tenno lands 100% headshots — so under
  # AssumedMax it is on for every shot but the first, which is what
  # `final_damage_cap` resolves to. "If the buff is not active, the first
  # headshot does not benefit from it, even if the bow has multishot": one shot
  # in a 180 s engagement, and not modelled.
  - kind: buff
    trigger: on_weakpoint_hit
    grants: final_damage
    rank0: 0.5
    rankMax: 3.0

source:
  url: https://wiki.warframe.com/w/Longbow_Sharpshot
  # Wiki module (Type Bow, Rarity Legendary, MaxRank 5) cross-checked against
  # WFCD levelStats: rank 0 "+50% damage on your next shot", rank 5 "+300%".
