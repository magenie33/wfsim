# BOWS ONLY, and that is an EQUIP rule rather than a calc-layer one. The arsenal does not offer it elsewhere, so neither do we.
#
# "Cannot be equipped on crossbows such as Attica, Nagantaka (Prime), and Zhuge
# (Prime)" needs no special case: a crossbow is its own class on the wiki
# (`Class = "Crossbow"`, tag CROSSBOW), so `bow` already excludes them. The note
# exists because players assume a crossbow is a bow; the data never did.
id: longbow_sharpshot
name: Longbow Sharpshot
rarity: legendary
max_rank: 5
equip_classes: [bow]
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Offensive/LongbowDamageOnHeadshot
description: "On Weak Point Hit: Gain +X% damage on your next shot."

effects:
  # ITS OWN MULTIPLIER, not a Serration-bucket bonus: "Damage bonus is
  # multiplicative to mods like Serration". On a weapon whose CO ADDS it does
  # not reach that term — "[(1 + Serration) x (1 + Longbow Sharpshot)] +
  # Galvanized Aptitude" — and a Multiplying CO takes it whole
  # (`fight::scale::sharpshot_at`).
  #
  # THE NEXT SHOT, simulated: a shot that puts any pellet on a weak point arms
  # the one after it, every pellet and explosion of that shot carries the bonus,
  # and a shot that finds none leaves the next bare. The fight's first shot is
  # never armed: "If the buff is not active, the first weak point hit does not
  # benefit from it, even if the bow has multishot".
  - kind: buff
    trigger: weakpoint_hit
    grants: final_damage
    rank0: 0.5
    rankMax: 3.0

source:
  url: https://wiki.warframe.com/w/Longbow_Sharpshot
  # Wiki module: Type Bow, Rarity Legendary, MaxRank 5; the Effect table reads
  # 50 / 100 / 150 / 200 / 250 / 300% from rank 0 to 5.
