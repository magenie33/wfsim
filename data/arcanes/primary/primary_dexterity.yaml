id: primary_dexterity
name: Primary Dexterity
rarity: rare
max_rank: 5
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Offensive/PrimaryDamageOnMeleeKill
description: "On Melee Kill:\n+X% Damage for 20s. Stacks up to 6x.\n+7.5s Combo Duration"

effects:
  # The sim has no melee, so this buff starts full (user setting) and only
  # decays - same treatment as Secondary Dexterity. Additive with base-damage
  # mods; on timeout lose ONE stack and reset.
  - kind: buff
    trigger: on_melee_kill
    grants: base_damage
    rank0: 0.1
    rankMax: 0.6
    max_stacks: 6
    duration: 20
    decay: lose_one_and_reset
  # A melee stat - inert for a primary-weapon calc.
  - kind: combo_duration_bonus
    rankMax: 7.5
    unlocks_at_rank: 5

source:
  url: https://wiki.warframe.com/w/Primary_Dexterity
