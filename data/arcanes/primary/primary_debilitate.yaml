id: primary_debilitate
name: Primary Debilitate
rarity: rare
max_rank: 5
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Offensive/SplitStatusProcsOnStackedStatusHit
description: "If an enemy has 10 stacks of a combined Status Effect, inflicting the same Status Effect again has a X% chance to inflict one of the base Status Effects it is composed of."

effects:
  # Splits a COMBINED element's proc into ONE of its two components (Corrosive
  # -> Toxin or Electricity) once the target already holds 10 stacks of it.
  # Rolled per DAMAGE INSTANCE, 50/50 between the two components.
  #
  # IT DEALS NO DAMAGE — it applies a status, and that is all the target ever
  # feels from it (owner, 2026-08-08: "殴打的那一下，是没有伤害的…就是直接上dot
  # （电还是会立刻电一下）"). The Electricity tick that lands the same instant is
  # the DoT's OWN first tick, which is delay-0 for Electricity and Gas; nothing
  # here calls `target.apply`.
  #
  # There IS an intermediate INSTANCE, and it is a deduction rather than a
  # reading: the wiki says the status it leaves carries the faction bonus THREE
  # times, a status always carries it one time more than whatever caused it, and
  # a hit carries it once — so three is only reachable through one more link in
  # the chain (owner, 2026-08-05: "吃3次派系只有一个情况，那必然有个元素实例造成
  # 才有可能出现这个情况"). That instance is a SCALE, not a damage number. The
  # two sentences used to be one, and it read as if the arcane hit you twice.
  #
  # WHAT THAT INSTANCE IS MADE OF IS OPEN — see MEASUREMENTS M33. A community
  # formula that reproduces an in-game 29551 to 0.14% has the split's DoT
  # carrying the PARENT status's elemental bracket as well as its own, which
  # would be x8.2 on that build and ~x2.8 on an ordinary one. Not implemented:
  # it is not measured on anything this repo can run, and M33 states the one
  # mod swap that would settle it.
  #
  # THE SPLIT PROC IS AN ORDINARY PROC, not a Melee-Influence-style spread
  # (owner, 2026-08-05). It runs the normal DoT/debuff path and picks up its own
  # element bracket, so a Corrosive splitting into Toxin scales by the TOXIN mod
  # bonus — and by 1.0 where the build carries no Toxin mod, which is what
  # "otherwise you only get the base portion" means. The wiki's "separate damage
  # instance" is the status APPLICATION; what it buys is the extra faction
  # layer, and that layer is the only observable it predicts.
  #
  # NOTHING HERE IS WAITING ON A MEASUREMENT. The ^3 is the wiki's own stated
  # value, not a guess to confirm, and the sim MEASURES its own exponent: with
  # the arcane the only difference between two runs, the damage it adds scales
  # by exactly f^3 across a faction change (`dummy::
  # a_debilitate_split_lands_at_the_third_faction_layer`). Set the depth to 2
  # and that test reads 2.399 against f^2 = 2.4025 and fails, which is how it is
  # known to have teeth.
  - kind: debilitate
    rank0: 0.5
    rankMax: 1.0

source:
  url: https://wiki.warframe.com/w/Primary_Debilitate
