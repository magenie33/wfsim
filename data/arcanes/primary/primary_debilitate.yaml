id: primary_debilitate
name: Primary Debilitate
rarity: rare
max_rank: 5
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Offensive/SplitStatusProcsOnStackedStatusHit
description: "If an enemy has 10 stacks of a combined Status Effect, inflicting the same Status Effect again has a X% chance to inflict one of the base Status Effects it is composed of."

# WHAT THIS DOES IN THE LIVE GAME THAT DE DID NOT MEAN IT TO. Rendered on the
# card: the sim computes it, it matches the game, and a hotfix takes it away —
# so a player reading the number is entitled to know which of those it is. The mechanism is in MEASUREMENTS M37; this is
# the sentence.
live_bugs:
  - "The split fires a zero-damage instance that still takes its own multipliers. Faction bonuses carry down the chain as intended; a per-instance bonus such as Devouring Attrition's +2000% carries too, which is not intended (x21 twice = x441). Modelled as it behaves now; a fix would remove it."

effects:
  # One fresh scalar-copy packet per accepted callback; M34 and M37 apply.
  - kind: debilitate
    UpgradeChance: 0.5
    UpgradeChanceScalePerRank: 0.1
    ChanceScalesWithRank: true

source:
  url: https://wiki.warframe.com/w/Primary_Debilitate
