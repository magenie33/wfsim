id: primary_compression
name: Primary Compression
rarity: rare
max_rank: 5
internal_name: /Lotus/Upgrades/CosmeticEnhancers/Utility/ConvergeRadialAttackOnAim
description: "On aim: x0.2 explosion radius, +X% damage and +X% ammo efficiency for every 1m radius lost."

effects:
  # IT TRADES BLAST RADIUS FOR DAMAGE, so what it is worth is a property of the
  # WEAPON and not of this card — which is why both ramps below are PER METRE
  # and neither is a bonus until a radius is known. The fold happens in
  # `loadout::resolve_for`, the one place that has the modded radius and the
  # weapon's own row:
  #
  #   radius_lost  = radius_MODDED x (1 - 0.2)      # continuous, not per whole metre
  #   damage_bonus = damage_per_metre(rank) x radius_lost
  #   ammo_eff     = eff_per_metre(rank)    x radius_lost
  #
  # CONTINUOUS, verbatim: "Despite the description stating 'per meter lost,'
  # the bonuses smoothly scale between whole number radius values ... a loss of
  # 6.5 meters of radius gives +650% Damage and +35.75% Ammo Efficiency".
  #
  # THE PER-WEAPON TABLE IS THE OTHER HALF and it lives with the weapons, one
  # `compression:` row per attack (docs/CATALOGS.md 2 has the columns, the
  # legend and every row the roster carries). Six things vary independently and
  # four of them cannot be derived from anything the weapon's own stats say:
  # which radius is read, at what effectiveness, whether the bonus multiplies or
  # joins the base-damage bucket, and whether it works at all. Absence of a row
  # means the weapon has no AoE for the arcane to compress, so it is worth
  # nothing rather than unknown.
  #
  # TWO RAMPS, because the description carries two Xs (wiki rank table == WFCD
  # levelStats, both linear).
  - kind: compression_damage
    rank0: 0.5
    rankMax: 1.0
  - kind: compression_ammo_efficiency
    rank0: 0.03
    rankMax: 0.055

source:
  url: https://wiki.warframe.com/w/Primary_Compression
