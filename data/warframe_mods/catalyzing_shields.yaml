id: catalyzing_shields
name: "Catalyzing Shields"
rarity: rare
polarity: vazarin
base_drain: 10
max_rank: 3
internal_name: /Lotus/Upgrades/Mods/Warframe/DualStat/FixedShieldAndShieldGatingDuration
description: "x0.20 Max Shield Capacity\n1.33s Full Shield Gate immunity duration"

# PER RANK, from W`Catalyzing_Shields`'s table — neither ladder is the
# `(rank + 1) / (max_rank + 1)` share every other card follows.
effects:
  # "x0.80 / x0.60 / x0.40 / x0.20" Max Shield Capacity
  - kind: max_shield_multiplier
    ranks: [0.8, 0.6, 0.4, 0.2]
  # "0.33s / 0.67s / 1.0s / 1.33s" Full Shield Gate duration — and the same after a
  # PARTIAL refill, as the mod page says ("upon recovering any amount of Shields")
  # and against the Update 34 notes' scaling (MEASUREMENTS M92).
  - kind: shield_gate_seconds
    ranks: [0.33, 0.67, 1.0, 1.33]

source:
  url: https://wiki.warframe.com/w/Catalyzing_Shields
