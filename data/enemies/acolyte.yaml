id: acolyte
name: Acolyte
kind: enemy

# The Steel Path Acolytes (wiki Acolytes page). SIX named units share
# identical base stats and mechanics post-U40 (Angst, Malice, Mania,
# Misery, Torment, Violence) - one generic entry covers them all.
# Faction "Stalker" for lore; for LEVEL SCALING no Stalker row exists in
# the wiki table - the Sentient/Unaffiliated family is the assumed match
# (curve choice to re-verify).
faction: stalker
scaling_faction: unaffiliated
# U36: "Acolytes are neutral to every element" - no type-modifier column.
faction_damage_override: null
# CONFIRMED (wiki infobox Eximus row "--" + absent from
# Eximus/Compatibilities): Acolytes have no Eximus variant.
can_be_eximus: false
mercy_eligible: false

# Base stats: health/shields rebased in U40 (5,500 / 2,500 per the
# patch note). NOTE the enemy data module still lists 2500/1500/50 for
# all six (stale vs U40); armor 50 is the only armor figure anywhere.
stats:
  base_level: 1
  health: 5500
  shield: 2500
  armor: 50
  overguard: 0

# DAMAGE ATTENUATION (the defining mechanic): the wiki documents the
# STRUCTURE only - caps on damage per INSTANCE and per SECOND, both
# proportional to Max Health, per player (U40) - the CONSTANTS are
# unpublished. DEFAULT OFF (user, 2026-07-25): with unknown constants
# the caps only distort the ranking arbitrarily, and "more damage is
# better" holds either way. Enable by uncommenting once calibrated
# in-game (engine support + tests are in place):
# attenuation:
#   max_instance_fraction_of_health: <measure me>
#   max_dps_fraction_of_health: <measure me>

# Special debuff rule (wiki): "up to 4 stacks of any Status Effect with
# the exception of Impact which can stack up to 3"; Radiation only
# amplifies allied damage (no single-target payload anyway).
status_stack_caps: { general: 4, impact: 3 }

# Module Multis (wiki-checked 2026-07-25): "Head: 1.0x" for ALL six -
# a TRUE head (triggers headshot conditions, builds incarnon charge,
# refreshes Deadhead/Crosshairs) but with NO damage bonus, and per the
# 1x-location rule it never receives the critical-headshot fold-in.
# Deadhead''s +30% still applies (its wiki example: Catchmoon 1.0->1.3).
body_parts:
  - name: body
    multiplier: 1.0
    is_head: false
    crit_bonus: false
  - name: head
    multiplier: 1.0
    is_head: true
    crit_bonus: false

source:
  url: https://wiki.warframe.com/w/Acolytes
  note: U40 base stats + attenuation structure; Malice infobox for armor;
    attenuation constants are estimates, not wiki data.
