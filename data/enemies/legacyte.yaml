id: legacyte
name: Legacyte
# Portrait, hosted on the WIKI — enemy art is declared here rather than in
# data/assets.yaml (enemies are not in DE's Public Export at all);
# scripts/fetch_images.py pulls it through Special:FilePath.
image: Legacyte.png
faction: techrot
scaling_faction: techrot
# NOT IN THE EXIMUS COMPATIBILITIES TABLE. Its Techrot section names the Babau,
# Galliflex, Matmas, Obsolyte and Skuzzi, and this is not one of them — which is
# what a boss-type unit normally answers.
can_be_eximus: false
mercy_eligible: false
type: melee
planets: [hollvania]
tilesets: [kobinn_west]
introduced: "38.0"

# ITS COLUMN IS TECHROT'S PLUS VOID, WHICH NO TABLE KEY SPELLS. The page shows
# four rows — Cold "--", Gas "++", Magnetic "++", Void "++" — and the Techrot
# column in data/factions/damage_modifiers.yaml carries only the first three.
# So the column rides here, where it OUTRANKS the faction key; `faction` stays
# Techrot because that is the other question, the one a Bane mod asks.
damage_modifiers:
  cold: 0.5
  gas: 1.5
  magnetic: 1.5
  void: 1.5

# Base stats at base_level. No shield, no armour and no Overguard: the health is
# the whole of it, which is why the attenuation below is this unit's defence
# rather than a detail of it.
stats:
  base_level: 1
  spawn_level: 65
  health: 7500
  shield: 0
  armor: 0
  overguard: 0
  affinity: 1500

# The page's infobox: "Head (3x, but no headcrit bonus)<br>Arm CRT Monitor (3x,
# with +1 Crit Tier)". The module's commented-out Multis line is the Babau's,
# copied under "-- confirm", and is not a source.
body_parts:
  - name: body
    multiplier: 1.0
    is_head: false
    crit_bonus: false
  - name: head
    multiplier: 3.0
    is_head: true
    crit_bonus: false

unmodeled:
  - "Its damage attenuation is not applied, and it is this unit's main defence: the game caps damage per instance and per second as a share of its max health. A build here removes far more of it than in game, so the number reads high. The caps are unpublished."
  - "Its capped status vulnerability is not applied: the game gives it partial status immunity, and the sim supports only full immunity, so each status type either lands or does not."
  - "Its left-arm CRT monitor is a second weak point the sim never aims at; it takes 3x and raises a hit's crit tier by one."
  - "Each generation gains random abilities from a pool of more than twenty; the Legacyte here is the same every time."

source:
  url: https://wiki.warframe.com/w/Legacyte
  # note: >-
  # Stats, body parts and the damage-modifier rows from the page's infobox; the attenuation
  # and the capped status vulnerability from its Tips; the Eximus answer from
  # the Eximus §Compatibilities table, where it does not appear.
