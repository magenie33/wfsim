id: demolisher_devourer
name: Demolisher Devourer
# Portrait, hosted on the WIKI — enemy art is declared here rather than in
# data/assets.yaml (WFCD has no usable enemy images); scripts/fetch_images.py
# pulls it through Special:FilePath.
image: DemolisherDevourer.png
faction: grineer
scaling_faction: grineer
# Not in the Eximus/Compatibilities table — a Demolisher is already a special
# variant and does not take a second one.
can_be_eximus: false
mercy_eligible: false
type: melee
# WHERE THE DEMOLISHER IS MET, which is not where the Ghoul it is built from
# lives: the Demolisher page's Grineer list names Olympus, Mars, whose infobox
# reads "Disruption", "Grineer Settlement", "15 - 20 (Normal)" — the same 15
# `spawn_level` carries.
planets: [mars]
tilesets: [grineer_settlement]
introduced: "29.0"

# THE PULSE IS NOT TURNED ON HERE, and that is this simulator's choice rather
# than a gap in what it can do. The wiki describes it, verbatim: "Demolysts and
# Demolishers will pulse out a red aura every 5 seconds with a radius of 6.5
# meters, immediately dispelling and disabling all Warframe abilities within
# range and on itself."
#
# Same shape as the Thrax's spectral form: written down, machinery ready,
# deliberately not applied to this unit yet.
#
# THE MACHINERY IS BUILT AND TESTED, so turning it on is this one line:
#   nullifies_warframe_abilities: true
# The gate lives in `parse_fight`, which is what would make the optimizer follow
# it too; `a_target_that_nullifies_takes_the_players_buffs` covers the path.
# Until then a fight here keeps Roar, Eclipse, Nourish and the augments running,
# and `unmodeled` says so where a player reads it.

# NOTHING IS DROPPED FROM THE DRAW. VERBATIM, and the word that decides it is
# the last one: *"Confusion, Knockdown, Lifted, Stagger, Stun EFFECTS."* Those
# are what a proc DOES, not whether it lands, so every type this weapon rolls
# still rolls here.
#
# THE ONE PROC IMMUNITY ON THE PAGE IS SOMEBODY ELSE'S: *"All Infested
# Demolishers are immune to Viral status, and Demolisher Juggernauts and
# Demolisher Chargers are also immune to Viral and Toxin damage."* This unit is
# Grineer, so none of it reaches it.
status_immunities: []

# TWO OF THE FIVE HAVE A WEAPON STATUS BEHIND THEM, and both are this kind: the
# proc lands, takes its share of the rolls and counts as a status type for
# Condition Overload — it simply does not move this unit. Confusion is
# Radiation's and Stagger is Impact's.
#
# Reading either as a proc immunity is wrong twice: every other status gets
# rarer because the draw renormalises without it, and a Condition Overload build
# loses a type it actually has.
nullified_status_effects: [radiation, impact]

# DAMAGE ATTENUATION IS NOT MODELLED BECAUSE THIS UNIT NO LONGER HAS IT.
# VERBATIM (Ghoul Devourer, patch history): `{{Ver|40.0.2}}` *"Enemies that no
# longer have Damage Attenuation:"* — and the list under it is *"Demolishers"*.
# Written down because every older source says they attenuate, so its absence
# here reads as a gap until somebody checks. The Acolytes still have it and
# still carry the admission for it.

# IT IS NEVER FROZEN, and that makes Cold BETTER here rather than worse. The
# ladder normally spends itself: the tenth proc consumes all stacks for a
# 3-second Frozen window and drops back to three. Nothing converts on a
# Demolisher, so the stacks climb to the ten-stack cap and STAY, and the Cold
# crit-damage bonus is up for the whole fight instead of in bursts.
#
# The slow is real in game and is not modelled — this sim has no movement for it
# to matter to — and it is the one effect the nullifying pulse cannot cleanse.
cannot_be_frozen: true

# HEALTH GROWS WITH THE SQUAD, and it is the only stat that does. VERBATIM
# (wiki, Disruption): *"Demolysts and Demolishers gain increased health based on
# squad size. Squad Size 1: +0% health / Squad Size 2: +50% health / Squad Size
# 3: +100% health / Squad Size 4: +200% health"*.
#
# THE FIGHT PICKS THE ENTRY, not this file: `scenario.squad_size` says how many
# people are shooting, and a fight that names none is solo. So the same unit is
# the one a lone player meets and the one a full squad meets, which is what it
# is in game.
squad_health_bonus: [0.0, 0.5, 1.0, 2.0]

# Base stats at base_level. Health is the DEMOLISHER variant's 2500, not the
# Ghoul Devourer's 600 — a Demolisher is its own stat block, not a tag.
stats:
  base_level: 1
  spawn_level: 15
  health: 2500
  shield: 0
  armor: 250
  overguard: 0
  affinity: 0

# Module Multis: "Head: 3.0x, Mines: 0.5x". The mines are declared below rather
# than given an aim weight — see `unmodeled`.
body_parts:
  - name: body
    multiplier: 1.0
    is_head: false
    crit_bonus: false
  - name: head
    multiplier: 3.0
    is_head: true
    crit_bonus: true

live_bugs:
  - "its nullifying pulse does not currently dispel Warframe abilities in game, though the wiki describes it doing so — this fight keeps your buffs, and a hotfix restoring the pulse would take them away"

unmodeled:
  - "its nullifying pulse is not applied here: in game it dispels every Warframe ability within 6.5 m every 5 seconds, and this fight leaves Roar, Eclipse, Nourish and the elemental augments running"
  - "the mines on its back are a 0.5x hitbox the sim never aims at — shots land on the body or the head, and a player would not choose the mines"
  - "it is not stopped or slowed here — a Cold status greatly slows a Demolisher in game (and is the one effect its pulse cannot cleanse), and this sim has no movement for that to matter to"
  - "the conduit it is walking towards is not modelled: a Disruption run is a race against its arrival, and this fight has no clock but its own"

source:
  url: https://wiki.warframe.com/w/Ghoul_Devourer
  # note: >-
  # Stats and Multis from the page's Demolisher tab; the pulse, the squad-size
  # health scaling and the Cold interaction from the Disruption page.
