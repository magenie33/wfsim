# NOT LOADED BY ANY CODE. `data/debuffs/` is the written SPEC for status
# effects: no `files_under("debuffs/")` call exists, and the behaviour is
# hand-implemented in `engine::dummy` / `engine::status`, which cite these
# files by name. Changing a number here changes nothing on its own — it is a
# documentation change that also needs the matching code edit and a test.
# See data/README.md "Conventions".
id: frozen
name: Frozen
default_scope: enemy

aliases: []
internal_name: null            # not captured yet (distinct from PT_CHILLED?)
damage_type: null              # NOT applied by a damage-type proc:

# Trigger is a state transition, not a proc - the 10th Freeze stack.
applied_by:
  debuff_threshold: { debuff: freeze, stacks: 10 }

duration_seconds: 3
refreshable: false             # cannot be extended: Cold procs are inert
stacking: false
max_stacks: 1

effects:
  - kind: full_cc
    # note: Prevents all action for the duration.
  - kind: shield_recharge_block
  - kind: crit_damage_received
    value: 1.00                # +1.0x flat, supersedes Freeze's table value
    condition: weapon_direct_damage_only

# INTERACTION WITH THE CHILL LADDER.
#
# COEXISTENT, not mutually exclusive: the 10th chill stack is BOTH the tenth
# stack and the trigger for this state. The ladder stays at 10 for the whole 3
# seconds — which is what the game displays, and it is a display of something
# real rather than this state's cosmetic.
#
#   · CONDITION OVERLOAD: Frozen counts for NOTHING. Cold is one status and
#     its stacks are the ladder's, already counted there. Counting both would
#     have made a frozen target read as two types.
#   · CRIT DAMAGE RECEIVED: this state's +1.0x REPLACES the ladder's +0.50x
#     rather than adding to it — wiki, of the +1.0x: "doubled from the
#     per-stack bonus".
#   · INCOMING COLD PROCS: inert. Wiki: "Frozen enemies cannot receive
#     additional Cold stacks". This is what pins the ladder at 10.
#   · ON EXPIRY: the ladder is SET to exactly 3 stacks with fresh 6 s timers
#     from the trigger's context (M6/M7; wiki: "Upon thaw: 3 Cold stacks will
#     remain"). MEASURED, not derived — replacing ten pinned stacks with three
#     does not follow from anything above, and the model this replaced did not
#     derive it either.
#
# WHAT CANNOT FREEZE NEEDS NO RULE OF ITS OWN. A chill cap below 10 makes the
# trigger unreachable by arithmetic — an Overguard holder's 4, an Acolyte's 4 —
# and a unit that is simply immune says so once. The wiki derives it the same
# way: "can receive a maximum of 4 Cold stacks", "preventing Frozen status
# entirely".
#
# open_questions:
# - Frozen's own internal name / whether anything can refresh it.
# - Does Frozen re-trigger immediately if 7 more stacks arrive right after
#   thaw (expected yes - no known lockout beyond the 3-stack reset).

source:
  url: https://wiki.warframe.com/w/Damage/Cold_Damage
  # note: >-
  # Split from the Freeze entry per architecture (a state with its own
  # duration/effects/trigger = its own debuff). Display-pinned-at-10
  # observation from the user, 2026-07-24.
