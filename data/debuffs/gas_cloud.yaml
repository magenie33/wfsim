schema_version: 0
id: gas_cloud
name: Gas Cloud
kind: debuff
default_scope: enemy

aliases: [Gas]
internal_name: PT_ASPHYXIATION
damage_type: gas               # DT_GAS (Heat + Toxin)

applied_by:
  damage_type: gas

duration_seconds: 6
refreshable: false
stacking: true
max_stacks: 10
per_stack_duration: true
stack_overflow: replace_oldest

dot:
  dot_model: independent_stacks
  tick_rate_hz: 1
  delay_seconds: 0             # like Electricity: tick events 0..6 s, dud
  ticks: 6                     # last event -> 6 damaging ticks at 0..5 s
  tick_damage_type: gas
  # tick = 0.5 x ModdedBase x (1 + GasDamageBonuses) x (1 + FactionBonuses)
  #            x (1 + StatusDamageBonuses) x crit/part snapshot
  # ModdedBase = Base x (1 + BaseDamageBonuses) x (1 + FactionBonuses)
  # Gas bonuses = LITERAL Gas sources only (Leaded Gas +300%, Valence
  # Formation). Heat/Toxin component mods contribute NOTHING to the ticks
  # (both worked examples on the page demonstrate this) - they only raise
  # Gas's share/proc likelihood. Faction double-dips as usual.
  coefficient: 0.5

  # Areal like Tesla Chain: the cloud at the host damages ALL enemies in
  # radius. RADIUS GROWS WITH STACKS - the first stack-count-dependent
  # geometry in the ledger:
  chain_radius_m: 3.0
  radius_growth:
    per_stack_m: 0.3
    max_m: 6.0
    # Wording ambiguity: "3 m; subsequent procs +0.3 m; 6 m total after 10
    # stacks". Linear from 3.0 with +0.3 per SUBSEQUENT stack gives 5.7 at
    # 10; reaching exactly 6.0 requires either +0.3 per stack including
    # the first (radius = 3 + 0.3xstacks, but then 1 stack = 3.3) or a
    # 1/3 m step. Minor - needs measurement.
  # Cloud PERSISTS AFTER HOST DEATH: keeps ticking on enemies inside the
  # dead host's radius for the remaining duration (explicit on this page;
  # matches the Damage-page note).
  persists_after_host_death: true
  chain_hits:
    # Same as Tesla Chain: the cloud registers body parts by itself at a
    # 1x headshot multiplier, boostable by headshot-damage bonuses
    # (Target Acquired, sniper zoom, Deadhead).
    location_detection: true
    headshot_multiplier: 1.0
    headshot_multiplier_boostable: true

cc_effects: []
on_kill_cosmetic: brief dark green cloud on the afflicted

railjack_variant: >-
  None - no Railjack counterpart; excluded from Railjack proc weighting.

source:
  url: https://wiki.warframe.com/w/Damage/Gas_Damage
  retrieved: "2026-07-24"

verification:
  status: unverified
  needs_measurement: true      # radius-growth endpoint ambiguity
