# NOT LOADED BY ANY CODE. `data/debuffs/` is the written SPEC for status
# effects: no `files_under("debuffs/")` call exists, and the behaviour is
# hand-implemented in `engine::dummy` / `engine::status`, which cite these
# files by name. Changing a number here changes nothing on its own — it is a
# documentation change that also needs the matching code edit and a test.
# See data/README.md "Conventions".
id: freeze
name: Freeze
default_scope: enemy

aliases: []
internal_name: PT_CHILLED
damage_type: cold              # DT_FREEZE

applied_by:
  damage_type: cold

duration_seconds: 6
refreshable: false
stacking: true
max_stacks: 10                 # and the 10th ALSO trips Frozen (frozen.yaml)
per_stack_duration: true
stack_overflow: none

# COLD IS ONE STATUS (owner, 2026-08-16). This ladder is its stacks and it is
# what Condition Overload counts; Frozen is a STATE the tenth stack trips, it
# is counted for nothing, and the two are LIVE AT THE SAME TIME — the chill
# stays, pinned at ten, which is what the game displays.
#
# The model this replaced had the tenth proc CONSUME the nine stacks, so no
# chill existed while Frozen and the game's own "10 stacks" had to be called
# Frozen's cosmetic. What refuted it is a target that CANNOT be frozen: its
# chill really does reach ten and really does cycle FIFO there, so ten chill
# stacks are a state the game has. The wiki describes it the same way —
# "Maximum stacks: 10 total", of which "the 10th stack" IS the Frozen state.
#
# IT ALSO REMOVES THREE SPECIAL CASES. An Overguard holder's cap of 4, an
# Acolyte's cap of 4 and an outright immunity all used to be their own branch;
# now a cap below ten makes the Frozen trigger unreachable by arithmetic,
# which is how the wiki itself puts it ("can receive a maximum of 4 Cold
# stacks", "preventing Frozen status entirely").
#
# Non-uniform stack tables (index = stacks - 1, stacks 1..9). The 10th is one
# past the published table — the page stops at nine because on everything it
# describes the tenth stack is Frozen, whose own value replaces this one
# anyway; the engine continues the formula for the targets that reach ten
# without freezing, and says so.
stack_value_tables:
  # Movement speed, fire rate, and attack speed reduction.
  action_speed_reduction: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
  # FLAT critical-damage-multiplier increase on damage the victim RECEIVES:
  # +0.1x first stack, +0.05x per further stack. Semantics: additive with
  # the attacker's CD mods, applied BEFORE the crit tier formula
  # (cd_total = base_cd x (1 + cd_mods) + cold_bonus), and does NOT apply
  # to Area of Effect damage (same class rule as Weakened's crit bonus).
  crit_damage_received: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]

modifier_conditions:
  crit_damage_received: weapon_direct_damage_only   # not AoE

# The 10th stack triggers a SEPARATE debuff: see frozen.yaml (its own
# duration, effects, and trigger - rigorously not part of Freeze).
# While Frozen is active, incoming Cold procs are inert and the Freeze
# display stays pinned at 10 (user-observed); on Frozen expiry exactly
# 3 Freeze stacks remain (remove-7 vs set-to-3 semantics unresolved -
# open questions live in frozen.yaml).
# The 10th proc consumes the stacks and converts the target (see frozen.yaml).
on_max_stacks_applies: frozen

stack_caps:
  # Bosses and Overguard holders cap at 4 stacks (can never be Frozen).
  bosses_and_overguard: 4

on_player:
  # Enemy-inflicted Cold on players: -10% slow per stack, max 4 (-40%).
  action_speed_reduction_per_stack: 0.10
  max_stacks: 4
  # exception: >-
  # The Optimism Peely Pix (Temporal Archimedea) can accumulate 10 stacks
  # on players with progressively stronger slow and the Frozen state.

cc_effects:
  - kind: slow
    # note: See action_speed_reduction table; Frozen at 10 stacks.

# railjack_variant: >-
# Immobilize: disables the target ship's weapons and slows it to a stop
# for 6 s, refreshed by further procs. On the player Railjack: Ice Hazard
# (disables interactive elements - pilot seat, turrets, slingshot, doors,
# forge).

# notes: >-
# The wiki's worked examples pin the insertion point: cd_total =
# base_cd x (1 + cd_mods) + cold_bonus, i.e. Cold is a receiver-side
# ABSOLUTE crit-damage increase entering before the tier formula
# (Paris Prime: 1 + k x (2 + 0.5 - 1)). Consequently the crit-headshot
# fold-in (2 x Total CD - 1) doubles a cd_total that INCLUDES the Cold
# bonus - model per formula consistency; in-game spot check optional
# (headshot increment vs unchilled should be 3 x panel x 1.0, not x 0.5).
# DoT tick snapshots carry the Cold-inclusive tier multiplier (settled
# by model, 2026-07-24: a tick is the hit's deferred damage - the
# snapshot stores the realized multiplier). By the same principle Cold
# applied AFTER the proc does not alter existing ticks (Cold feeds the
# hit's formula, not the tick-time mitigation pipeline).

source:
  url: https://wiki.warframe.com/w/Damage/Cold_Damage
  # note: Dedicated damage-type page (worked crit examples included there
  # pin the additive-before-tier semantics).
