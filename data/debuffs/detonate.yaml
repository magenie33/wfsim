# NOT LOADED BY ANY CODE. `data/debuffs/` is the written SPEC for status
# effects: no `files_under("debuffs/")` call exists, and the behaviour is
# hand-implemented in `engine::dummy` / `engine::status`, which cite these
# files by name. Changing a number here changes nothing on its own — it is a
# documentation change that also needs the matching code edit and a test.
# See data/README.md "Conventions".
id: detonate
name: Detonate
default_scope: enemy

aliases: [Blast]
internal_name: PT_FLASHBANG
damage_type: blast             # DT_EXPLOSION (Heat + Cold)

applied_by:
  damage_type: blast

duration_seconds: 1.5          # the per-stack "fuse", scaled by Status
refreshable: false             # Duration mods
stacking: true
max_stacks: 10                 # reaching 10 detonates everything early
per_stack_duration: true
stack_overflow: none

# --- delayed-burst payload (a third payload type besides `dot`) -------------
delayed_burst:
  fuse_seconds: 1.5
  # Normal expiry (fuse elapses): single-target hit on the host only.
  #   proc damage = 0.3 x ModdedBase x (1 + FactionBonuses)
  #                     x (1 + StatusDamageBonuses) x AdditionalMultipliers
  #   ModdedBase = Base x (1 + BaseDamageBonuses) x (1 + FactionBonuses)
  # AdditionalMultipliers = the proccing hit's crit multiplier and body-part
  # multiplier (headcrits included!) - snapshot per stack. Faction
  # double-dips as usual. Heat/Cold elemental mods do NOT scale it (they
  # only raise Blast's share -> proc likelihood); Valence Formation /
  # Thermal Transfer do NOT either.
  single_target_coefficient: 0.3
  early_detonation:
    # Triggers: the 10th stack applied, OR the host dies (a killing blow
    # that INFLICTS >=1 Blast proc counts even with zero prior stacks;
    # conversely the killing blow needn't proc Blast if stacks already
    # exist).
    # Effect: all stacks deal their single-target hits to the host at once
    # (10 stacks = 300% ModdedBase total), PLUS one merged radial instance
    # (the `radial` block) hitting surrounding enemies only.
    triggers: [tenth_stack_applied, host_death]
    radial:
      radius_m: 5.0
      # THE 10x ASYMMETRY: bystanders take 3.0 x MB per stack while the
      # host only ever takes 0.3 x MB per stack - a full 10-stack
      # detonation deals 300% to the host but 3000% to EACH surrounding
      # enemy. The host is the safest place to stand. Normal fuse expiry
      # produces NO radial at all - Blast's value function is a cliff:
      # either the weapon reaches 10 stacks / a kill within the 1.5 s
      # fuse window, or Blast is a weak 30% single-target trickle.
      per_stack_coefficient: 3.0
      damage_type: blast         # CONFIRMED (user): radial is Blast-typed,
                                 # each bystander applies their own faction
                                 # column to it
      falloff: none              # explicitly no falloff
      radius_moddable: false     # Firestorm/Fulmination do nothing
      excludes_host: true
      merged_single_instance: true
      # Each stack's snapshot multipliers (crit/headcrit/part) are summed
      # into the radial - critical-headshot kills radiate their full
      # multiplier in AoE.
  # EXCEPTION to the negative-status-duration rule: Detonate always deals
  # its damage even when total Status Duration is below 0%.
  fires_at_negative_status_duration: true
  # CONFIRMED (user, 2026-07-24): a detonation CONSUMES all stacks - the
  # count resets to 0 and the cycle restarts.
  detonation_consumes_all_stacks: true

cc_effects:
  - kind: stagger
    # note: The early-detonation explosion staggers enemies caught in it
    # (in-game description).

# on_kill_cosmetic: >-
# Corpse vaporizes - unusable by Desecrate, and stops Magnetize pulls.
# Sparks jet from afflicted enemies while stacks are live.

# railjack_variant: >-
# None - Blast has no Railjack counterpart and is excluded from Railjack
# proc weighting entirely.

# notes: >-
# The radial (like all status damage) never procs statuses - universal
# rule, see MECHANICS.md §6; no self-chaining in crowds.
# Single-target-wise the weakest damaging status (30%/stack); its value is
# the on-kill/10-stack AoE. Xata's Whisper triggers off detonations with
# faction applied AGAIN (triple dip) and elemental bonuses applying to the
# Whisper portion - recorded as a curiosity, not yet modeled.

source:
  url: https://wiki.warframe.com/w/Damage/Blast_Damage
  # note: Dedicated damage-type page including the Notes list (no-falloff,
  # negative-duration exception, killing-blow edge cases, headcrit AoE).
