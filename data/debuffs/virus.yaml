id: virus
name: Virus
kind: debuff
default_scope: enemy

aliases: [Viral]
internal_name: PT_INFECTED
damage_type: viral             # DT_VIRAL (Cold + Toxin)

applied_by:
  damage_type: viral

duration_seconds: 6
refreshable: false
stacking: true
max_stacks: 10
per_stack_duration: true
stack_overflow: replace_oldest # universal FIFO-by-application-time rule

effects:
  - kind: damage_taken_health
    # +100% first stack, +25% per subsequent -> +325% at 10.
    # resultant = modded_damage x [2 + 0.25 x (stacks - 1)]
    # Applies to HEALTH only - works through armor ("yellow health"), but
    # never to shields or overguard. Multiplicative with other bonuses.
    stack_values: [1.00, 1.25, 1.50, 1.75, 2.00, 2.25, 2.50, 2.75, 3.00, 3.25]

# THE OFFICIAL LIVE-EVALUATION CONFIRMATION (this page's worked example):
# DoT damage "is calculated based on whether or not a Viral proc is active
# WHEN THE DoT TICK DEALS DAMAGE" - bleed at 35/s jumps to 70/s while a
# 1-stack Viral is up, drops back to 35/s when it expires, and rises if
# Viral lands mid-DoT. Explicitly NOT applied twice to DoTs ("unlike
# faction damage multipliers"). This is the definitive source for the
# snapshot boundary rule's defender-side-live classification
# (MECHANICS.md §6): Viral sits in the tick-time mitigation pipeline.
dot_interaction: live_per_tick

# Per-unit immunity flags (enemy schema fields; two DISTINCT tiers):
immunities:
  status_immune:               # take Viral damage, never the proc
    [Ambulas, Deimos Carnis, Deimos Carnis Rex, Deimos Genetrix,
     Deimos Jugulus, Deimos Leaping Thrasher, Deimos Therid, Deimos Saxum,
     Deimos Saxum Rex, Demolisher Boiler, Demolisher Thrasher,
     Tusk Bolkor, Tusk Firbolg, Techrot Babau]
  fully_immune:                # immune to Viral damage AND status
    [Demolisher Charger, Demolisher Juggernaut]

cc_effects: []
on_kill_cosmetic: flowing miasma in the inflicting weapon's energy color

railjack_variant: >-
  None - no Railjack counterpart; excluded from Railjack proc weighting.

source:
  url: https://wiki.warframe.com/w/Damage/Viral_Damage
