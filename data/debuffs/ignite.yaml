# NOT LOADED BY ANY CODE. `data/debuffs/` is the written SPEC for status
# effects: no `files_under("debuffs/")` call exists, and the behaviour is
# hand-implemented in `engine::dummy` / `engine::status`, which cite these
# files by name. Changing a number here changes nothing on its own — it is a
# documentation change that also needs the matching code edit and a test.
# See data/README.md "Conventions".
id: ignite
name: Ignite
default_scope: enemy

aliases: []
internal_name: PT_IMMOLATION
damage_type: heat              # DT_FIRE

applied_by:
  damage_type: heat

duration_seconds: 6
# HEAT INHERIT (community term; wiki flags details as needing clarification):
# Heat does NOT stack like other DoTs. A new proc adds a stack AND refreshes
# the duration of ALL active heat stacks; all stacks are consolidated into
# ONE damage tick per second whose value grows linearly with stacks -
# indefinite ramp while kept refreshed.
refreshable: true              # the only refreshable status DoT
stacking: true
max_stacks: null
per_stack_duration: false      # one shared clock for the consolidated stack
stack_overflow: none

dot:
  # SINGLETON ACCUMULATOR (unlike every other status DoT): there is only
  # ONE Heat DoT entity per target. Each proc does not create a new
  # instance - it (a) ADDS its damage contribution into the single
  # entity's tick value and (b) REFRESHES the entity's one shared clock.
  # The entity's modifier context (Heat%/faction) is fixed by the FIRST
  # proc. Other DoTs (Bleed/Poison/Tesla/Gas) are independent_stacks.
  dot_model: singleton_accumulator
  # Tick metronome is anchored at ENTITY CREATION (the first proc): ticks
  # at +1s, +2s, ... from then on. Refreshes extend the expiry and add
  # value but never reset the beat - proven by contradiction (2026-07-24,
  # user): if re-procs reset the 1 s delay, sub-second re-application
  # would postpone the next tick forever, yet rapid Heat spam visibly
  # ticks every second in-game.
  tick_phase: anchored_to_first_proc
  tick_rate_hz: 1
  delay_seconds: 1             # ticks at 1..6 s
  ticks: 6
  tick_damage_type: heat       # real Heat damage: subject to armor (live)
                               # and the faction column - unlike Bleed
  # Per-stack contribution (wiki Damage/Heat_Damage):
  #   tick += 0.5 x ModdedBaseDamage x (1 + HeatDamageBonuses)
  #               x (1 + FactionBonuses) x (1 + StatusDamageBonuses)
  #               x crit_multiplier x part_mult
  #   ModdedBaseDamage = Base x (1 + BaseDamageBonuses) x (1 + FactionBonuses)
  # Faction double-dips as usual. UNLIKE Slash, Heat elemental mods
  # (Hellfire) DO scale the ticks.
  coefficient: 0.5
  # Two parameter layers on the singleton entity:
  #  ENTITY CONTEXT - locked by the FIRST proc, applied to EVERY
  #    contribution: the (1 + Heat%) and (1 + faction_damage) brackets.
  #    Unmodded first proc (ability, Manifold Bond) => these brackets are
  #    1.0 for the whole accumulator; later modded weapons' Hellfire/Bane
  #    are forfeited (not retroactive, not per-contribution).
  #  PER CONTRIBUTION - each proc brings its own: ModdedBase_i, the
  #    (1 + status_damage_i) bracket (Rifle Elementalist WORKS regardless
  #    of the first proc), crit_mult_i, part_mult_i.
  # MEASURED (2026-07-24, user): the context sync is BIDIRECTIONAL - a
  # modded first proc's Heat%/faction brackets also ELEVATE later unmodded
  # (ability) contributions. Strategy consequence: light the first proc
  # with the best-modded weapon, then any source can feed the ramp.
  first_proc_snapshot:
    entity_context: [heat_damage_bucket, faction_damage_bucket]
    per_contribution: [modded_base, status_damage_bucket, crit_multiplier, part_mult]

# Armor strip: a timed sub-effect with ramp-up and ramp-down.
armor_strip:
  # Every 0.5 s AFTER the initial proc: 15% -> 30% -> 40% -> 50%.
  ramp_up: { interval_seconds: 0.5, steps: [0.15, 0.30, 0.40, 0.50] }
  # More procs do NOT speed up the ramp.
  # After the proc ends: armor returns every 1.5 s over 6 s:
  # 50% -> 40% -> 30% -> 15% -> 0%.
  ramp_down: { interval_seconds: 1.5, steps: [0.50, 0.40, 0.30, 0.15, 0.0] }
  # Status Duration mods SLOW the ramp (+100% duration -> steps every 1 s,
  # full strip in 4 s; -50% -> every 0.25 s, full strip in 1 s).
  scaled_by_status_duration: true
  # Multiplicative with other armor reduction sources:
  #   armor_after = (1 - 0.50_heat)
  #               x [1 - (0.20 + 0.06 x corrosive_stacks)]
  #               x (1 - 0.18 x corrosive_projections)
  stacking_with_other_strips: multiplicative

crit_chance_effects:
  - kind: panic
    # note: >-
    # Ignited enemies panic and flail, unable to act: ~4 s humanoids,
    # ~3 s most Infested, ~2 s MOAs and Chargers. Immune: Ospreys, Bosses,
    # Tenno, and Overguard holders. Re-procs re-trigger the panic; panic
    # also fires the moment Overguard breaks even without a fresh proc.

# on_kill_cosmetic: >-
# Corpse immolates and vanishes in seconds (notably stops Magnetize from
# pulling it).

# railjack_variant: >-
# Sear: 6 ticks over 5 s (0..5 s), 100% x Modded Damage x (1 + Heat
# bonuses); each proc has an INDEPENDENT duration (no inherit/refresh).
# On the player Railjack: Fire Hazard (armaments overheat faster).

# notes: >-
# Magus Accelerant is a rare resistance-reduction that multiplies Heat
# damage. Heat's 50% strip makes it a partial Corrosive substitute. The
# corrosive strip decomposition used in the armor formula (20% innate +
# 6%/stack) matches the Corrosive page's 26%-at-1-stack / 80%-at-10.

source:
  url: https://wiki.warframe.com/w/Damage/Heat_Damage
  # note: Dedicated damage-type page; DoT rules cross-checked with
  # Damage_over_Time (Ignite is the only refreshable status DoT).
