limit_except GET HEAD { deny all; }
proxy_pass https://wfsim_public;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host cdn.wfsim.app;
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header X-WFSim-Website "";
proxy_set_header X-WFSim-Website-Host "";
proxy_set_header X-WFSim-Website-IP "";
proxy_set_header X-WFSim-Relay "";
proxy_set_header X-WFSim-Client-IP "";
proxy_ssl_server_name on;
proxy_ssl_name cdn.wfsim.app;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_hide_header Access-Control-Allow-Origin;
add_header Access-Control-Allow-Origin "*" always;
proxy_connect_timeout 10s;
proxy_read_timeout 30s;
