[package]
name = "wfsim-webapi"
description = "wfsim JSON API layer: the endpoint functions shared by the native web server and the wasm build (docs/WASM.md phase 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
wfsim-engine = { path = "../engine" }
wfsim-optimizer = { path = "../optimizer" }
# QR codes for the long images the bots send (`/api/qr`); SVG only, no image stack.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
mimalloc = { version = "0.1", default-features = false }
