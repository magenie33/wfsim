[package]
name = "wfsim-cli"
description = "wfsim command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wfsim"
path = "src/main.rs"

# The board scorer. Its own bin because it is a BUILD step, not a user tool:
# the scheduled job pipes submissions through it and commits the result.
[[bin]]
name = "wfsim-board"
path = "src/bin/wfsim-board.rs"

# Intake, which is the other half of the door: the endpoint that takes a
# submission has no game data, so it stores the record verbatim and this derives
# the key with the engine. Its own bin for the same reason the scorer is one —
# it is a pipeline step, and it writes `builds` where the scorer writes `scores`.
[[bin]]
name = "wfsim-intake"
path = "src/bin/wfsim-intake.rs"

[dependencies]
wfsim-engine = { path = "../engine" }
wfsim-optimizer = { path = "../optimizer" }
wfsim-webapi = { path = "../webapi" }
serde = { workspace = true }
serde_json = { workspace = true }
