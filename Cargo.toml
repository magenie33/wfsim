[workspace]
resolver = "2"
members = [
    "engine",
    "optimizer",
    "cli",
    "webapi",
    "web",
    "wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/magenie33/wfsim"

# Declared once here; member crates reference them via `.workspace = true`
# to keep versions consistent.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `raw_value` IS LOAD-BEARING, not a convenience: serde_json's number PARSER is
# not correctly rounding, and every score crosses between processes through it
# (`load_facts`). Reading the literal text and using `str::parse` is what keeps
# the board's number the one the engine produced.
serde_json = { version = "1", features = ["raw_value"] }
# Maintained fork of the unmaintained serde_yaml (decision in devlog 2026-07-24).
serde_norway = "0.9"
