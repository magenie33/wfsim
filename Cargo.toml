[workspace]
resolver = "2"
members = [
    "engine",
    "optimizer",
    "cli",
    "web",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/magenie33/wfsim"

# Declared once here; member crates reference them via `.workspace = true`
# to keep versions consistent.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained fork of the unmaintained serde_yaml (decision in devlog 2026-07-24).
serde_norway = "0.9"
