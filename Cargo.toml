[workspace]
resolver = "2"
members = [
    "engine",
    "optimizer",
    "cli",
    "webapi",
    "web",
    "wasm",
    "tools/gas-macro",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/magenie33/wfsim"

# Declared once here; member crates reference them via `.workspace = true`
# to keep versions consistent.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` IS LOAD-BEARING: without it serde_json's number parser is not
# correctly rounding, and a shard that crosses a worker boundary as text comes
# back a ULP off — the browser fleet's report then differs from the scorer's,
# which keeps its shards in memory. `raw_value` hands a score's literal through
# unparsed (`load_facts`), so a published number is never re-read at all.
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
# Maintained fork of the unmaintained serde_yaml (decision in devlog 2026-07-24).
serde_norway = "0.9"

# ONE CODEGEN UNIT. The fight is a directory of modules, and with the default
# sixteen units its hot loop cannot inline across them: `one_fight` measured
# +14% per shot for the same source split into files, and ±noise with this.
[profile.release]
codegen-units = 1
