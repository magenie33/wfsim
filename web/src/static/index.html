<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WFSim — build configurator</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">WF<span>Sim</span></div>
    <label class="weapon-pick">Weapon <select id="weapon"></select></label>
    <button id="theme-toggle" class="ghost-btn" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
  </header>

  <main class="config-page">
    <div class="wstrip">
      <img id="w-img" alt="" />
      <div>
        <h1 id="w-name">—</h1>
        <div id="w-tags" class="tags"></div>
      </div>
    </div>

    <!-- Preset bar: click a chip to load; the active chip carries update /
         delete; "+ save" stores the current build (max 10). -->
    <div class="preset-bar" id="preset-bar"></div>

    <!-- Block: Mods -->
    <section class="block" id="mod-block">
      <div class="bh"><span class="n">1</span><h2>Mods</h2>
        <span class="sub">
          <span class="cap" id="capacity">0 / 60</span>
          <span class="forma" id="forma">0 Forma</span>
          <button id="auto-forma" class="ghost-btn small" title="auto-assign polarities for minimum Forma">auto</button>
          <button id="clear-mods" class="ghost-btn small">clear</button>
        </span>
      </div>
      <div class="bb">
        <div id="mod-slots" class="slots"></div>
        <div class="exlabel">Exilus</div>
        <div id="exilus" class="slots"></div>
      </div>
    </section>

    <!-- Block: Arcane -->
    <section class="block" id="arcane-block">
      <div class="bh"><span class="n">2</span><h2>Arcane</h2><span class="sub" id="arcane-sub"></span></div>
      <div class="bb"><div id="arcane-slots" class="slots one"></div></div>
    </section>

    <!-- Block: Evolution (Incarnon weapons) -->
    <section class="block" id="evo-block">
      <div class="bh"><span class="n">3</span><h2>Evolution</h2><span class="sub">Incarnon Genesis</span></div>
      <div class="bb"><div id="evo-rows"></div></div>
    </section>

    <!-- Block: Element (Kuva / Tenet / element-configurable weapons) -->
    <section class="block" id="element-block" hidden>
      <div class="bh"><span class="n">4</span><h2>Element</h2><span class="sub">configurable element</span></div>
      <div class="bb"><div id="element-cfg"></div></div>
    </section>

    <!-- Block: Stats — the FINAL panel: merged buckets, explained by source -->
    <section class="block" id="stats-block">
      <div class="bh"><span class="n">Σ</span><h2>Stats</h2><span class="sub" id="stats-sub"></span></div>
      <div class="bb">
        <div id="stats-rows"></div>
        <div id="stats-damage"></div>
        <div id="stats-conditionals"></div>
      </div>
    </section>
  </main>

  <!-- floating popovers (positioned at the active slot) -->
  <div id="mod-popover" class="popover" hidden>
    <div class="addbar"><span>🔍</span><input id="mod-search" type="text" placeholder="Search a mod…" autocomplete="off" /></div>
    <div id="picker-tools" class="picker-tools"></div>
    <div id="mod-menu" class="combo-menu"></div>
  </div>
  <div id="slot-menu" class="popover menu" hidden></div>
  <div id="arcane-popover" class="popover" hidden>
    <div class="addbar"><span>🔍</span><input id="arcane-search" type="text" placeholder="Search arcane / effect…" autocomplete="off" /></div>
    <div id="arcane-menu" class="combo-menu"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
