[package]
name = "wfsim-gas-macro"
description = "#[metered]: charges a function's and each loop's source weight to the engine's gas count, the same on every target (docs/WASM.md §Gas)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
